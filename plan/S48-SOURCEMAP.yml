# S48 · concept -> defining instrument
#
# Plan phase 1 step 2. Every concept in the S48 Introductory inventory is institutional,
# so each definition must cite the instrument itself, not a description of it. This file
# names the instrument and the clause BEFORE fetching, so the obtaining step is mechanical
# and a failure to find something is visible rather than quietly worked around.
#
# status: planned -> obtained -> located -> unavailable
# locator is filled in only after the text has actually been read.

C01:
  name: What a law is, and who is allowed to make one
  instrument: Constitution of India, Articles 245-246 (extent of legislative powers)
  host: indiacode
  status: planned
