definition:
  text: |
    A reference is a pointer from a claim to the place that is supposed to support it.

    Checking a reference means four things, and each one can fail on its own. Finding the source.
    Confirming it is the source named. Finding the exact passage pointed to. Reading that passage to
    see whether it supports the claim.

    Finding a source is not the same as checking it. A real source can be attached to a claim it
    does not support, and that failure is invisible to anyone who stops at the first step.
