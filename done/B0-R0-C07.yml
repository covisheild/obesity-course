must_know:
- point: |
    On a logarithmic axis equal distances are equal multiples, not equal amounts. Reading them as
    amounts is the standard mistake, and it is made by people who are confident about the figure
    because they can see it.
  kind: misconception
  bearing: methodological
- point: |
    Before reading any figure, look at the axis and decide which kind it is. If the marks go 1, 10,
    100, 1,000 the steps are multiplications. If they go 1, 2, 3 they are additions. Everything you
    then say about the shape of the line depends on which answer you got.
  kind: move
  bearing: methodological
- point: |
    A logarithmic axis cannot show zero or anything below it, because no power of ten produces
    them. So a figure on that axis has dropped every zero in the underlying data and says nothing
    about it. Ask what happened to those observations.
  kind: boundary
  bearing: methodological
- point: |
    A log axis makes a large difference look modest. If you are arguing about the size of an effect
    rather than its presence, that axis is working against you. The same is true when somebody else
    chose it. Say which axis you are reading from before you quote a figure in public.
  kind: consequence
  bearing: public
- point: |
    Indian charts are often labelled in lakh or crore, and the labels do not tell you the axis. Steps
    of one lakh, two lakh, three lakh are an ordinary scale. Steps of one lakh, ten lakh, one crore
    are a log scale. Read the steps rather than the words.
  kind: india_deviation
  bearing: methodological
- point: |
    Asked in a viva what the logarithm of one is, the answer is zero, because ten to the power zero
    is one. The question is asked because a candidate who has learnt the button and not the idea
    will guess one. They will then be unable to say why.
  kind: trap
  bearing: teaching
- point: |
    You will not be asked to compute a logarithm by hand and there is no reason to learn how. What
    you must be able to do is say what one means and read an axis built from them. And notice when a
    figure has been drawn on one without saying so.
  kind: move
  bearing: teaching
exercises:
- type: interpretation
  prompt: |
    A figure has a vertical axis marked 1, 10, 100, 1,000, 10,000, with the marks evenly spaced. A
    line climbs steadily across it, at a constant angle, from the bottom left to the top right. Say
    what a straight line on this figure means about the quantity, and say what the same data would
    look like on an ordinary scale.
  answer: |
    Equal distances up this axis are equal multiplications. A straight line means the quantity is
    multiplying by the same factor in each equal step along the bottom. Doubling every year, say, or
    rising tenfold every decade.

    That is a very different claim from the one a straight line usually carries. On an ordinary
    scale a straight line means the same amount is being added each step.

    On an ordinary scale, this same data would not be a straight line at all. It would hug the
    bottom of the page for most of its length and then turn sharply upward near the right-hand edge.
    Almost all of the visible movement would happen in the last part of the figure, and the early
    values would be indistinguishable from zero.

    Which is worth saying out loud: the log axis did not change the data. It changed which part of
    the data you can see.
  confidence_first: true
- type: calculation
  prompt: |
    Take the four penalty ceilings from the Food Safety and Standards Act, 2006 in the worked
    example. Say how many times larger the largest is than the smallest, first by dividing and then
    by subtracting the logarithms. Then say what the logarithm of ten crore would be.
  answer: |
    By dividing.

    ```
        10,00,000 divided by 25,000
        = 1,000 divided by 25          (take three zeros off each)
        = 40
    ```

    By subtracting the logarithms.

    ```
        6.0 minus 4.4 = 1.6
    ```

    A difference of 1.6 on the logarithm scale means a factor of 10^1.6. A calculator gives about
    40, which agrees with the division. Note the shape of it: the division needed the zeros counted,
    and the subtraction did not.

    Ten crore. A crore is 10^7, so ten crore is 10^8, and the logarithm is 8.

    Check it against the ladder. Ten crore is a hundred times the largest penalty in the Act. A
    hundred is two powers of ten, so the logarithm should be 6 plus 2. It is.
retrieval_items:
- q: What is the logarithm of a number to base ten?
  a: The power to which ten must be raised to produce it. The logarithm of a thousand is three, because 10^3 is a thousand.
- q: On an axis marked in logarithms, what do equal distances represent?
  a: Equal multiplications, not equal amounts. The step from 1 to 10 and the step from 100 to 1,000 occupy the same distance and differ by nine and by nine hundred.
- q: What are the two numbers a logarithm cannot be taken of, and why?
  a: Zero and anything below it, because no power of ten produces zero or a negative number.
