must_know:
- point: |
    A lakh is not a million. One lakh is a hundred thousand. One crore is ten million. A note that
    slides from one ladder to the other is wrong by a factor of ten. That is the size of error
    nobody spots in a table, because every digit in it still looks reasonable.
  kind: misconception
  bearing: methodological
- point: |
    Before you press equals, count the digits in each number you typed. Then say the number out
    loud, in the naming system you are writing in. Two habits, a few seconds, and between them they
    catch the whole class of error above.
  kind: move
  bearing: methodological
- point: |
    Indian statutes, budgets and ministry papers state money in lakh and crore. Journals and
    international agencies state it in million and billion. Every time a figure crosses between the
    two, write it in digits first and count them. That is the only step where the mistake is
    visible.
  kind: india_deviation
  bearing: policy
- point: |
    Asked on the spot how big a crore is, do not answer "a lot". Say ten million, say a hundred lakh,
    and say how many digits that is. A number you can place immediately is the difference between
    being quoted and being talked over.
  kind: trap
  bearing: public
- point: |
    A trainee who cannot move between the two groupings will hand you a broken table. It will be
    right in one column and ten times wrong in the next. When a table looks odd, check the conversion
    before you check the arithmetic. The arithmetic is usually fine.
  kind: consequence
  bearing: teaching
- point: |
    This gets you to what a written number means and no further. It does not tell you whether the
    number is right, how it was counted, or whether the thing it counts is worth caring about.
  kind: boundary
  bearing: methodological
exercises:
- type: calculation
  prompt: |
    Section 50 of the Food Safety and Standards Act, 2006 sets a ceiling of five lakh rupees. A
    proviso lowers it to twenty-five thousand rupees for small food businesses — petty retailers,
    hawkers, temporary stalls and the like. Write both figures in digits, in both groupings. Then
    say how many times larger the ceiling is than the proviso figure.
  answer: |
    Five lakh, Indian grouping: 5,00,000. International grouping: 500,000. Six digits either way.

    Twenty-five thousand, in the Indian grouping: 25,000. In the international grouping: 25,000.
    They are
    identical, and that is worth noticing. Below one lakh the two systems group the digits the same
    way, so every number under a hundred thousand looks the same in both. The ladders only separate
    above that, which is exactly why the mistake feels safe right up to the point where it happens.

    Now the division, line by line.

    ```
        500,000 divided by 25,000
        = 500 divided by 25          (take three zeros off each)
        = 20
    ```

    The ceiling is twenty times the proviso figure.
  confidence_first: true
- type: critique
  prompt: |
    Here is a sentence from a report.

    > The maximum penalty for a misleading food advertisement in India is one million rupees. That
    > is about ten crore.

    Find the mistake, and say which step it happened at.
  answer: |
    The first half is right. Section 53 of the Food Safety and Standards Act, 2006 caps that penalty
    at ten lakh rupees, and ten lakh is one million.

    "Ten crore" is wrong. One crore is ten million, so ten crore is a hundred million. That is a
    hundred times the real figure.

    The step it happened at matters more than the size of it. No arithmetic was done here, so no
    arithmetic went wrong. The writer converted a number by matching names instead of by counting
    digits. Had they written 10,00,000 and 1,000,000 side by side, there would have been nothing left
    to get wrong.
retrieval_items:
- q: What makes the two fives in 4,505 worth different amounts?
  a: Their places. Each place is worth ten times the place immediately to its right, so the left-hand five is worth five hundred and the right-hand one is worth five.
- q: How many is one lakh, and how many is one crore, stated in the international names?
  a: One lakh is a hundred thousand. One crore is ten million.
- q: Below what figure do the Indian and international groupings look identical, and why does that matter?
  a: Below one lakh. Every number under a hundred thousand is written the same way in both, so the conversion feels safe right up to the point where the two ladders separate.
