definition:
  text: |
    A table presents values in a grid, so that every value is identified by the row and the column
    it sits in.

    Reading a table means settling four things before reading any number. What does one row stand
    for? What does each column report about it? What units and denominators do the columns use?
    Where did the numbers come from?

    Until those four are settled, a cell means nothing. The same digits describe different facts
    depending on whether a row is one person, one household, one district or one year.
