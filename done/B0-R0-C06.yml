definition:
  text: |
    A power is repeated multiplication of one number by itself. The number being multiplied is the
    base and the small raised number is the exponent, which counts how many copies of the base are
    multiplied together. Ten to the power three, written 10^3, is ten times ten times ten, or one
    thousand.

    A negative exponent means repeated division by the base rather than repeated multiplication, so
    10^-3 is one thousandth. Any base raised to the power zero is one.

    Multiplying two powers of the same base adds their exponents, and dividing subtracts them.

    A square root of a number is the quantity which, multiplied by itself, gives that number. It
    undoes raising to the power two.

    Scientific notation writes a quantity as a number between one and ten multiplied by a power of
    ten. In that form the digits and the size of the number are recorded separately, which is what
    makes it hard to lose a factor of ten.
