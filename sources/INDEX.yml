  # ---- Added by the S01-R1 source intake, 2026-09-23 ----
  # The five journal papers are NIH author manuscripts, taken from the PMC Article Dataset
  # text (pmc.ncbi.nlm.nih.gov itself is reCAPTCHA-gated to the fetch tool). Excerpts only.
  hall_2011_lancet:
    file: hall_2011_lancet.txt
    what: >-
      Hall et al., Lancet 2011;378:826 (PMC3880593, author manuscript). Excerpts: summary, introduction
      (the static 3500 kcal per pound rule), energy content of fat and lean tissue, the 100 kg man against
      the static rule, glycogen and water, two key messages
  hall_guo_2017:
    file: hall_guo_2017.txt
    what: >-
      Hall and Guo, Gastroenterology 2017;152:1718 (PMC5568065, author manuscript). Excerpts: opening
      (the identity is not a cause), components of expenditure, metabolic adaptation, the SGLT2 intake
      result, static / settling point / set point models, Figure 1 caption
  thomas_2013_3500kcal:
    file: thomas_2013_3500kcal.txt
    what: >-
      Thomas et al., Int J Obes 2013;37:1611 (PMC4024447, author manuscript). Excerpts: keywords, abstract,
      introduction, pooled data, results against the 3500 kcal rule, the Wishnofsky 1958 reference entry;
      the Methods equation W(t) as MathML with a plain-text rendering (added 2026-09-24)
  rosenbaum_leibel_2010:
    file: rosenbaum_leibel_2010.txt
    what: >-
      Rosenbaum and Leibel, Int J Obes 2010;34 Suppl 1:S47 (PMC3673773, author manuscript). Excerpts: stored
      energy and weight constancy, the fall in expenditure beyond lost mass, energy intake after weight loss
  polidori_2016:
    file: polidori_2016.txt
    what: >-
      Polidori et al., Obesity 2016;24:2289 (PMC5108589, author manuscript). Excerpts: abstract, self-reported
      intake, the ~100 kcal/day per kg effect size, discussion summary; Methods Equations 1-5 as MathML with
      plain-text renderings, and the prose defining their symbols (added 2026-09-24); the sentences defining beta
      and the UGE term, Table 1 rows for delta0, Delta-delta, beta and UGE (360 kcal/d), and the fitted kP = 95
      kcal/day per kg (added 2026-09-24, follow-up)
  fao_who_unu_2004:
    file: fao_who_unu_2004.txt
    what: >-
      FAO/WHO/UNU, Human energy requirements (FAO Food and Nutrition Technical Report Series 1, 2004), HTML
      edition. Excerpts from chapter 2 (definitions, components, DLW, body size) and chapter 5 (adult BMR, PAL),
      and Table 5.2, the Schofield BMR equations by age and sex (added 2026-09-24; one age band's sign is garbled - read the note)
  hall_2008_ijo:
    file: hall_2008_ijo.txt
    what: >-
      Hall, Int J Obes 2008;32:573 (PMC2376744), author-manuscript PDF supplied by Harsh, pdftotext text layer.
      Excerpts: abstract, the 3500 kcal rule traced to adipose tissue of 87% fat, energy densities of glycogen,
