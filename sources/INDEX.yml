# Which file in this folder stands behind which citekey.
#
# The build needs this to check a quoted passage against its source, and it cannot be
# inferred from the filename. `constitution` resolves to constitution_current.txt, not to
# constitution.txt - and constitution.txt is an older consolidation (newest amendment it names: 2006) that does not contain
# Article 279A at all. A convention that mapped citekey to same-named file would have sent
# every check of a constitutional claim to the one copy that cannot support it, and reported
# the failure as if the claim were wrong.
#
# Add a line here in the same commit that adds a file. A citekey with no line is simply not
# machine-checkable; a citekey pointing at a do_not_cite file is a blocking failure.

files:
  fss_act_2006:
    file: fss_act_2006.txt
    what: Food Safety and Standards Act 2006 (Act 34 of 2006)
  nfsa_2013:
    file: nfsa_2013.txt
    what: National Food Security Act 2013 (Act 20 of 2013)
  consumer_prot_2019:
    file: consumer_prot_2019.txt
    what: Consumer Protection Act 2019 (Act 35 of 2019)
  bipm_si:
    file: bipm_si.txt
    what: BIPM's own statement of the SI definition and its seven defining constants
  nist_sp811:
    file: nist_sp811.txt
    what: NIST Guide to the SI, footnotes carrying the exact calorie definitions
  fssai_labelling_2020:
    file: fssai_labelling_2020.txt
    what: FSS (Labelling and Display) Regulations 2020, compendium Version-VIII (09.09.2025)
  pubchem_molar_masses:
    file: pubchem_molar_masses.txt
    what: PubChem compound records for D-glucose (CID 5793) and cholesterol (CID 5997)
  constitution:
    file: constitution_current.txt
    what: Constitution of India, consolidated 2026 text (India Code handle 123456789/618394)
  openstax_contemporary_math:
    file: openstax_contemporary_math_8_2.txt
    what: OpenStax Contemporary Mathematics, s.8.2 Visualizing Data, the Misleading Graphs subsection (CC BY-NC-SA 4.0)
  openstax_business_stats_2e:
    file: openstax_business_stats_2_1.txt
    what: OpenStax Introductory Business Statistics 2e, s.2.1 Display Data, How NOT to Lie with Statistics (CC BY-NC-SA 4.0)
  openstax_chemistry_2e:
    file: openstax_chemistry_2e.txt
    what: >-
      OpenStax Chemistry 2e (CC BY-NC-SA 4.0), verbatim transcriptions from sections 2.3, 2.4, 5.1,
      5.2, 5.3, 7.2 and 7.5. Excerpts only, not the full book: a quote check that fails
      against this file may still be in the book, so check the section URL in the file
      before calling a passage unsupported.
  openstax_biology_2e:
    file: openstax_biology_2e.txt
    what: >-
      OpenStax Biology 2e (CC BY-NC-SA 4.0), verbatim transcriptions from sections 3.4, 4.1, 4.3,
      5.1, 5.3, 7.1, 9.1, 12.2 and 14.2. Excerpts only, as above.
  openstax_anatphys_2e:
    file: openstax_anatphys_2e.txt
    what: >-
      OpenStax Anatomy and Physiology 2e (CC BY-NC-SA 4.0), verbatim transcriptions from sections
      17.1, 17.9, 23.6, 23.7, 24.1, 24.2, 24.3, 24.4, 24.6 and 24.7. Excerpts only.
      Every figure in it is stated flat, with no study named - see the note in SOURCES.md
      before quoting a number out of it.
  openstax_college_physics_2e:
    file: openstax_college_physics_2e.txt
    what: >-
      OpenStax College Physics 2e (CC BY-NC-SA 4.0), verbatim transcriptions from sections 7.1,
      7.6, 14.1, 14.2, 14.4, 14.5, 14.6 and 14.7. Excerpts only. The file also carries a
      clearly labelled block from University Physics Volume 1 section 8.3 and Volume 2
      section 3.1, because College Physics 2e nowhere defines a system and its boundary.
      Nothing cites that block: Book 0 E3 takes system and surroundings from OpenStax
      Chemistry 2e section 5.2 instead, which is a citekey with a file behind it.
  fao_food_energy_2003:
    file: fao_food_energy.txt
    what: >-
      FAO Food and Nutrition Paper 77, Food energy - methods of analysis and conversion
      factors (2003), chapter 3. Verbatim transcriptions covering bomb calorimetry, the
      gross-to-metabolizable energy cascade and the Atwater general factors.

  # ---- Added by the Book 0 Part D chat, 2026-09-23 ----
  openstax_intro_stats_2e:
    file: openstax_intro_stats_2e.txt
    what: OpenStax Introductory Statistics 2e, sections 1.1, 1.2, 2.3, 2.5, 2.7, 3.1-3.4, 7.1 - Part D's textbook anchor
  jcgm_vim3:
    file: jcgm_vim3.txt
    what: JCGM 200:2012 International vocabulary of metrology (VIM3), online edition - entries 2.11, 2.13-2.21, 2.53, 4.14, 4.28
  kiran_2022_muac_nc:
    file: kiran_2022_muac_nc.txt
    what: Kiran, Harshitha, Bhargava, Heliyon 2022;8:e12173 - full text with tables; real material for Part D

  openstax_contemporary_math_odds:
    file: openstax_contemporary_math_7_7.txt
    what: OpenStax Contemporary Mathematics, section 7.7 What Are the Odds? - the anchor for odds in D1

# Held but not citable. Kept because Book 0 F3 teaches currency-checking on it: the worked
# example is a reader discovering that this copy is out of date. Citing it for anything else
# is the mistake that section exists to teach.
do_not_cite:
  constitution_superseded:
    file: constitution.txt
    why: >-
      Older India Code consolidation; newest amendment it names is the Ninety-fourth, 2006. Lacks Article 279A entirely.
      Present only as the worked example in Book 0 F3.
