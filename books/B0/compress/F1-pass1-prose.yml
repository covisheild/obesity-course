definition.text: 'A table presents values in a grid, so that every value is identified by the row and the column it sits in.


  Reading a table means settling four things before reading any number. What does one row stand for? What does each column report about it? What units and denominators do the columns use? Where did the numbers come from?

  '
simplified_explanation: 'A cell on its own tells you nothing.


  You have to settle four things first. What does one row stand for — one person, one household, one whole state? That is called the unit of observation. What does each column report about that row? What units does a column use, and if it is a percentage, what is it a percentage of — its denominator? And where did the numbers come from, who counted them, and how?


  Forty-five could be a headcount, a percentage, or a rank.

  '
illustration.body: '| State | Women surveyed | Overweight or obese (%) | Year |

  | --- | --- | --- | --- |

  | A | 42,100 | 24.1 | 2019-21 |

  | B | 18,750 | 39.6 | 2019-21 |


  Ask first what one row stands for. Run your finger along the top row. It is one state, not one woman. So the figure 24.1 describes nobody in particular.


  Ask next what each column reports. It is a percentage — a fraction, always of something. Of what? Of the count in the column next to it.


  Look at the last column and read it slowly. It is not a single year but a span, 2019 to 2021, telling you the fieldwork ran across those years and not on one date.


  Search the table for a line naming the source. There is none here.


  Now put the question you were going to ask anyway: is state B worse than state A?


  You cannot tell from this table alone.


  Say only what you can defend: the two reported figures differ.

  '
illustration.analogy_breaks_when: 'Two people can build two honest tables from the same underlying numbers and leave two opposite impressions. Neither has lied. A table settles what was measured and reported. It does not settle whether the comparison you want to make is a fair one.

  '
must_know[0].point: 'Before comparing two percentages across rows, check the count sitting beside each one. Twenty-four per cent of 42,100 women and twenty-four per cent of two hundred women are not the same evidence.

  '
must_know[1].point: 'Ask the four questions in order, every time, before you look at any value.

  '
must_know[2].point: 'Expect an Indian survey table to report a fieldwork span rather than one year. Expect state sample sizes to differ several-fold within the same table.

  '
must_know[3].point: 'When a table arrives in a ministry deck or a press release, somebody chose its rows and columns before you saw it. Ask what was left out.

  '
must_know[4].point: 'If asked which of two percentages is higher, do not stop at naming the bigger number. Say whether the table supports a comparison at all, and name what is missing.

  '
must_know[5].point: 'This section gets you only to what a table says. It does not tell you whether the numbers are right, how precise they are, or whether a gap is real.

  '
