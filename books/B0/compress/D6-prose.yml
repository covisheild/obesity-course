definition.text: 'The section on average and spread called the whole group a question is about the population,

  and the part of that group that was actually measured the sample. This section reuses both

  words unchanged and adds three more.


  A parameter is a number that describes the population, if every member of it could be measured.

  A statistic is the same kind of number, computed instead from a sample. A statistic is not the

  parameter: it is an estimate of it, a number made from part of the group and used to stand in

  for the whole.


  A random sample is picked at random: every member of the population has exactly the same chance

  of being the one picked, and an actual chance process decides it, not the person picking. A

  convenience sample is built the other way, out of whoever happens to be available, and the

  chance that any one member of the population ends up in it is neither equal nor known. A

  sample can also carry a sampling bias: this happens when some members of the population are

  more likely to be chosen than others, so the sample leans towards them.


  Draw a second random sample of the same size from the same population and its statistic will

  not match the first sample''s exactly. This is sampling variation. It is not a mistake to be

  corrected. It is a property of sampling itself, and its size can be stated.


  Take the average of a random sample. Over many samples of the same size, that average has its

  own spread, meaning its standard deviation as the section on average and spread taught it. The

  square-root law states that this spread equals the spread of the individual values in the

  population, divided by the square root of the sample size. Multiplying the sample size by four

  divides that spread by two. This spread does not depend on how big the population is, only on

  how big the sample is. Papers name this spread the standard error of the mean.


  The square-root law describes how far a random sample''s average is likely to sit from the

  average of the population it was actually drawn from. It says nothing about whether that

  population is the one the sample was meant to stand for. Many large samples are biased in

  exactly this way, and a convenience sample''s gap from its intended population is fixed by how

  the sample was chosen, not by how large it is. Enlarging the sample does not close that gap.

  '
simplified_explanation: 'The section on average and spread taught you to compute a mean and a spread. You needed a full

  set of numbers sitting in front of you. This section is about what to do when you cannot get the

  full set. It covers working from part of it instead.


  Call the whole group a question is about the population. Doctors in India, medical students,

  people in one district, whatever it is. Call the part of that group that was actually measured

  the sample.


  A number that describes the whole population exactly is called a parameter. You could only get

  it by measuring everyone, which is usually too slow, too costly or simply impossible. A number

  worked out the same way from your sample is called a statistic. Since a sample is not the whole

  population, a statistic is not the parameter. It is an estimate of it, a number made from part

  of the group and used to stand in for the whole.


  How good that estimate is depends on how the sample was put together.


  A random sample is picked at random: every member of the population has exactly the same chance

  of being the one picked. That chance is fixed by an actual chance process: a lottery draw, a random-number generator, a table

  of random digits. Not by who happened to be standing nearby. A convenience sample is whoever

  happens to be available:

  volunteers, people who answered an advertisement, the first hundred people through a door.

  Nothing forces a convenience sample to look like the population it gets used to describe.


  Even a random sample does not hand you the truth exactly. Draw one random sample of a hundred

  people and work out its average. Draw a second random sample of a hundred different people, from

  the same population, the same way, and work out its average too. The two averages will not be

  the same number. Neither one is wrong. This bouncing around from sample to sample is called

  sampling variation, and every sample has it.


  Sampling variation shrinks as the sample gets bigger, following a fixed rule rather than a fixed

  amount. Take a sample four times the size, and the bounce in its average shrinks to half of what

  it was. Take a sample a hundred times the size, and the bounce shrinks to a tenth. This is the

  square-root law. The spread of a sample''s average is the spread of the individual values in the

  population, divided by the square root of the sample size. A paper that reports this spread

  usually calls it the standard error of the mean.


  Here is the part that changes what you actually do with a bigger sample. The square-root law is

  only about how far a sample''s average sits from the average of the population it was drawn from.

  Suppose a convenience sample of volunteers is not representative of the group it is meant to

  describe. No amount of enlarging it brings it any closer.


  A bigger convenience sample buys you a tighter estimate of the same thing: whatever these

  particular volunteers look like. That may or may not be close to the group you meant to

  describe. No amount of enlarging the sample tells you which. Sample size protects you against

  sampling variation. It buys you nothing against a sample that was never random to begin with.

  '
illustration.body: "Kiran and colleagues did the study you have already met three times. It built a two-way table.\nIt showed how a set of values spreads out. It gave an average and its own spread. They planned\ntheir sample size around a figure that belonged to a much bigger group than the one they went\non to measure.\n\nBefore recruiting anyone, they set their target using a figure from the National Family Health\nSurvey, NFHS-4, run in 2015-16. The study itself ran in July to September 2019. The paper gives\nthe prevalence of overweight as 19 per cent in men and 21 per cent in women. It reports these as\nNFHS-4's figures for India, without saying which ages or which people they cover. The authors\nrounded them to a planning figure of 20 per cent to size their study. NFHS-4's figures are\nthemselves a survey result that reaches this book second-hand, through the paper, not a fixed\ntruth.\n\nThey measured a sample: 282 medical students at one college in Mangaluru who came forward after\nthe study was announced on campus.\n\"Came forward\" is the phrase to notice. In a random sample, every member of the population has\nexactly the same chance of being the one picked. Nobody drew these 282 by\nchance.\n\nThey chose to come forward, from the one college that was convenient to the researchers. The\nstatistics textbook this book follows calls that a self-selected sample. A self-selected or convenience sample's chance of including any one young adult, the group the\npaper set out to study, is neither equal nor known.\n\nTable 2 puts 83 of the 282 students at a body-mass index of 25 to 29.9, and another 15 at 30 or\nmore. Add the two bands together.\n\n```working\n    83 plus 15 = 98\n    98 divided by 282 = 0.3475177305\n```\n\nNinety-eight of the 282 students, about 34.8 per cent, had a body-mass index of 25 or more. The\ngap between that and the 20 per cent planning figure is about 14.8 percentage points.\n\nThe paper's abstract calls the 83, 29.4 per cent, 'overweight', having defined overweight as 25\nor more. Table 2 shows the 83 are only the 25 to 29.9 band.\n\nWork with a population small enough to see the whole of it. Then the square-root law is doing\nsomething you can watch, not something you take on trust.\n\nTake the population made of these eight numbers: 2, 4, 4, 4, 5, 5, 7, 9. Work out its mean the\nway the section on average and spread taught.\n\n```working\n    2 plus 4 plus 4 plus 4 plus 5 plus 5 plus 7 plus 9 = 40\n    40 divided by 8 = 5\n```\n\nNow its spread, the same way: each value's distance from 5, squared, then averaged, then\nsquare-rooted.\n\n```table\nvalue   distance from 5   squared\n2       -3                9\n4       -1                1\n4       -1                1\n4       -1                1\n5       0                 0\n5       0                 0\n7       2                 4\n9       4                 16\n```\n\n```working\n    9 plus 1 plus 1 plus 1 plus 0 plus 0 plus 4 plus 16 = 32\n    32 divided by 8 = 4\n    square root of 4 = 2\n```\n\nThis is the whole population, not a sample from it, so the division is by 8, the full count,\nnot by 7. This population's spread is 2.\n\nDraw a sample of four numbers from it, one at a time, putting each one back before the next\ndraw. That keeps every draw at the same chance as the one before it. Here are three such\nsamples.\n\n```table\nsample                  numbers        sum   mean\nfirst sample of four    5, 4, 7, 2     18    4.5\nsecond sample of four   4, 4, 5, 2     15    3.75\nthird sample of four    4, 2, 4, 7     17    4.25\n```\n\nNone of the three means is 5, the population's own mean, and no two of the three match each\nother. That bouncing around is sampling variation. The square-root law says how big it\ntypically is: divide the population's spread, 2, by the square root of the sample size, which\nis 2.\n\n```working\n    2 divided by 2 = 1\n```\n\nFor samples of four, the law predicts a spread of 1 around the true mean of 5. Three samples\ncannot show whether that is right. A computer can, because it will draw far more samples than\nanyone would by hand. The figure above the illustration was made that way. It shows 5,000\nsamples of size 10 from this same eight-number population, each number put back after it is\ndrawn. Then it shows 5,000 samples of size 40. Each sample's mean was worked out, and then the spread of those 5,000 means.\n\nThe square-root law predicts both spreads before any drawing is done, from the population's own\nspread of 2.\n\n```working\n    2 divided by the square root of 10 = 0.6325\n    2 divided by the square root of 40 = 0.3162\n```\n\nThe spread of the 5,000 sample-of-10 means comes out at 0.633, close to the law's predicted\n0.6325. The spread of the 5,000 sample-of-40 means comes out at 0.317, close to the law's\npredicted 0.3162. It is also close to exactly half of the first simulated spread.\n\n```working\n    0.633 divided by 2 = 0.3165\n```\n\nForty is four times ten, and the spread has halved, exactly as the law predicts. Papers give\nthis spread a name: the standard error of the mean. This book does not build anything further\non that name.\n\nNow return to the medical students. Their sample is 282, not 4, 10 or 40. But the shape of the\nlaw is the same. A bigger random sample's average settles down closer to the average of\nwhatever population it was actually drawn from. Suppose the 282 had instead been drawn at\nrandom from young adults, the group the paper set out to study. The square-root law would then\nsay something concrete. It would say how close a sample this size sits to the figure for the\npopulation it was drawn from.\n\nThey were not drawn at random. They were students at one college who chose to come forward.\nThe square-root law has nothing to say about that gap, because it was never built to say\nanything about it.\n\nNothing in this arithmetic can say which of several things produced the 14.8-point gap. It\ncould be that these are medical students at one college. It could be the years between when\nNFHS-4 was measured and when the study ran. It could be the different way the study and NFHS-4\neach drew the line for \"overweight\". It could simply be who chose to volunteer. Size cannot\nsettle that question. Only knowing more about how the 282 were found, and how NFHS-4 was run,\ncan.\n"
illustration.analogy_breaks_when: 'The eight-number population and its samples come from a fixed, fully known list. Its true

  spread was available to check the law against. A real population''s spread is usually not known

  in advance. Papers estimate it from the same sample they are using. That estimate adds its own

  extra uncertainty, which this demonstration does not show.


  Every sample above was drawn with replacement, putting each number back before the next draw.

  That is what keeps the law''s exact division by the square root of the sample size holding

  cleanly. Real surveys never ask the same person twice, so they sample without replacement.

  That matters only when the sample is a large share of a small population, such as one village.

  There the scatter is a little less than the law predicts.


  And none of this arithmetic touches the medical students'' real problem. The square-root law

  only ever describes a random sample''s distance from the population it was actually drawn from.

  One South Indian medical college is not the population behind the NFHS-4 figures the paper

  reports.

  The law was never in a position to close that gap.

  '
must_know[0].point: 'A bigger sample is not a repair for a biased one. Enlarging a convenience sample tightens its

  estimate of whatever population it actually came from. It does nothing to move that population

  closer to the one you meant to study. So a bigger convenience sample is a more confident answer

  that may or may not be right, and its size cannot tell you which.

  '
must_know[1].point: 'A convenience sample in the thousands sounds more convincing than a random sample in the

  hundreds. Bigger numbers read as more careful work. Before trusting a report''s sample size,

  ask how the people in it were found. A small random sample can outperform a huge convenience

  sample. Size only ever fixes one of the two problems a sample can have. A sample size on its

  own answers a question about precision. It never answers who the answer is actually about.

  '
must_know[2].point: 'Kiran and colleagues'' 282 medical students gave 34.8 per cent with a body-mass index of 25 or

  more, worked out from Table 2. The planning figure the authors rounded from NFHS-4 was 20 per

  cent. Size alone cannot tell you what made the two figures differ. It could be a different

  population, a different year, a different way of drawing the line, or who chose to come

  forward.

  '
must_know[3].point: 'The square-root law describes only how a random sample''s answer scatters around the population

  it was actually drawn from. It has nothing to say about whether that is the population a claim

  is being made about. Quoting it does not rescue a sample that was never random.

  '
must_know[4].point: 'Halving the scatter of a sample''s average costs four times as many people, every time. A study

  that wants to cut its sampling spread in half is not signing up for twice the recruitment. It is

  signing up for four times it.

  '
must_know[5].point: 'Teach a trainee to name the intended population before looking at a study''s sample size. A

  student can recite the square-root law perfectly and still miss the point. If they cannot say

  who a convenience sample leaves out, they have not learned the part of this that matters.

  '
