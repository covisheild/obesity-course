"definition.text": |
  A percentage is a fraction whose denominator is one hundred. Per cent means per hundred, so 24
  per cent is 24/100, which is 0.24.

  A percentage change is the change divided by the value it started from, multiplied by one
  hundred.

  A percentage point is the arithmetic difference between two percentages. A per cent change is
  that difference divided by the first percentage.

  A percentage of a percentage is the product of the two fractions: 40 per cent of 30 per cent is
  0.40 times 0.30, which is 0.12, or 12 per cent of the original whole.

"simplified_explanation": |
  Per cent means per hundred. Twenty-four per cent is twenty-four out of a hundred, which
  is 0.24.

  The hard half is what the hundred was.

  A percentage change is worked out against the number you started from. Because the starting
  number sits underneath, going up and coming back down are not the same percentage.

  If something goes from 2 per cent to 3 per cent, it has gone up by one percentage point. It has
  also gone up by 50 per cent, because one is half of two.

"illustration.body": |
  Go back to the two rows you read in the National Food Security Act, 2013. A lower primary meal
  is set at 450 calories. An upper primary meal is set at 700.

  How much more is the upper primary standard?

  Work out both.

  The plain difference first.

  ```
      700 minus 450 = 250 calories more
  ```

  Now as a percentage. The rule is: the change, divided by what you started from, times a hundred.

  ```
      250 divided by 450 = 0.5555...
      0.5555... times 100 = 55.6 per cent      (rounded to one place, as the last section had it)
  ```

  Now turn it round, because this is where people slip. Start at 700 and come down to 450.

  ```
      250 divided by 700 = 0.3571...
      0.3571... times 100 = 35.7 per cent
  ```

  The lower primary meal is about 36 per cent less. Not 56. The
  number sitting underneath changed, so the percentage changed with it.

  Ask which end it was measured from, every single time.

  Here is a sentence of the kind that reaches a front
  page.

  > The share of children affected rose by fifty per cent in a decade.

  Suppose the real figures behind it are two in a hundred rising to three in a hundred.

  ```
      3 minus 2 = 1 percentage point
      1 divided by 2 = 0.5, so 50 per cent
  ```

  Both are true of the same change. The writer picked the fifty.

  Percentage points subtract.
  Per cent divides.

  Ask for the count as well as the percentage, always.

  Suppose 30 per cent of schoolchildren in a
  district eat a packaged snack on a school day. Of those who do, suppose 40 per cent buy it
  within a hundred metres of the school gate. Multiply
  the fractions.

  ```
      0.40 times 0.30 = 0.12, so 12 per cent of all schoolchildren
  ```

  Those two percentages are made up, to show the move. A percentage of a
  percentage is smaller than either.

"illustration.analogy_breaks_when": |
  Percentages hide the size of the thing they are a percentage of, and they hide it by design.

  A percentage change and a percentage
  point look alike on the page and are different quantities. Go back to the two
  original numbers, or say in your own writing that you could not.

"must_know[0].point": |
  A percentage point and a per cent are different quantities. Whichever is quoted at you, ask for the other.

"must_know[1].point": |
  For any percentage in front of you, ask two questions before you use it: per cent of what, and
  how many people is that.

"must_know[2].point": |
  A rise and the fall that undoes it are different percentages, because the starting value sits
  underneath. Say
  which end you measured from whenever you quote a change.

"must_know[3].point": |
  A percentage of a percentage multiplies, so it is always smaller than either.

"must_know[4].point": |
  In a committee a relative change will be offered when it is the larger number and an absolute
  one when it is the smaller. Bring both to the meeting yourself.

"must_know[5].point": |
  When a journalist gives you a percentage on the phone, do not react to it. Ask what it is a
  percentage of and what the two underlying counts were.

"must_know[6].point": |
  This section gets you the arithmetic of a percentage.
