definition.text: 'A parameter is a number that describes the population, if every member of it could be measured.

  A statistic is the same kind of number, computed instead from a sample.


  A random sample is picked at random: every member of the population has exactly the same chance

  of being the one picked, and an actual chance process decides it, not the person picking. A

  convenience sample is built the other way, out of whoever happens to be available, and the

  chance that any one member of the population ends up in it is neither equal nor known.


  Draw a second random sample of the same size from the same population and its statistic will

  not match the first sample''s exactly. This is sampling variation.


  Take the average of a random sample. Over many samples of the same size, that average has its

  own spread, meaning its standard deviation as the section on average and spread taught it. The

  square-root law states that this spread equals the spread of the individual values in the

  population, divided by the square root of the sample size. Multiplying the sample size by four

  divides that spread by two. This spread does not depend on how big the population is, only on

  how big the sample is. Papers name this spread the standard error of the mean.


  The square-root law describes how far a random sample''s average is likely to sit from the

  average of the population it was actually drawn from. It says nothing about whether that

  population is the one the sample was meant to stand for. Enlarging the sample does not close

  that gap.

  '
simplified_explanation: 'Call the whole group a question is about the population. Call the part of that group that was actually measured the sample.


  A number that describes the whole population exactly is called a parameter. You could only get it by measuring everyone,

  which is usually too slow, too costly or simply impossible. A number worked out the same way from your sample is called a

  statistic. Since a sample is not the whole population, a statistic is not the parameter. It is an estimate of it, a number

  made from part of the group and used to stand in for the whole.


  A random sample is picked at random: every member of the population has exactly the same chance of being the one picked. A

  convenience sample is whoever happens to be available: volunteers, people who answered an advertisement, the first hundred

  people through a door. Nothing forces a convenience sample to look like the population it gets used to describe.


  Draw one random sample of a hundred people and work out its average. Draw a second random sample of a hundred different

  people, from the same population, the same way, and work out its average too. The two averages will not be the same number.

  This bouncing around from sample to sample is called sampling variation, and every sample has it.


  Take a sample four times the size, and the bounce in its average shrinks to half of what it was. This is the square-root law.

  A paper that reports this spread usually calls it the standard error of the mean.


  Suppose a convenience sample of volunteers is not representative of the group it is meant to describe. No amount of enlarging

  it brings it any closer.


  Sample size protects you against sampling variation. It buys you nothing against a sample that was never random to begin

  with.

  '
illustration.body: "Kiran and colleagues did the study you have already met three times.\n\nBefore recruiting anyone, they set their target using a figure from the National Family Health Survey, NFHS-4, run in 2015-16. The study itself ran in July to\nSeptember 2019. The paper gives the prevalence of overweight as 19 per cent in men and 21 per cent in women. It reports these as NFHS-4's figures for India, without\nsaying which ages or which people they cover. The authors rounded them to a planning figure of 20 per cent to size their study. NFHS-4's figures are themselves a\nsurvey result that reaches this book second-hand, through the paper, not a fixed truth.\n\nThey measured a sample: 282 medical students at one college in Mangaluru who came forward after the study was announced on campus. Nobody drew these 282 by chance.\n\nThey chose to come forward, from the one college that was convenient to the researchers.\n\nTable 2 puts 83 of the 282 students at a body-mass index of 25 to 29.9, and another 15 at 30 or more. Add the two bands together.\n\n```working\n    83 plus 15 = 98\n    98 divided by 282 = 0.3475177305\n```\n\nNinety-eight of the 282 students, about 34.8 per cent, had a body-mass index of 25 or more. The gap between that and the 20 per cent planning figure is about 14.8\npercentage points.\n\nTake the population made of these eight numbers: 2, 4, 4, 4, 5, 5, 7, 9. Work out its mean the way the section on average and spread taught.\n\n```working\n    2 plus 4 plus 4 plus 4 plus 5 plus 5 plus 7 plus 9 = 40\n    40 divided by 8 = 5\n```\n\nNow its spread, the same way: each value's distance from 5, squared, then averaged, then square-rooted.\n\n```table\nvalue   distance from 5   squared\n2       -3                9\n4       -1                1\n4       -1                1\n4       -1                1\n5       0                 0\n5       0                 0\n7       2                 4\n9       4                 16\n```\n\n```working\n    9 plus 1 plus 1 plus 1 plus 0 plus 0 plus 4 plus 16 = 32\n    32 divided by 8 = 4\n    square root of 4 = 2\n```\n\nThis is the whole population, not a sample from it, so the division is by 8, the full count, not by 7. This population's spread is 2.\n\nDraw a sample of four numbers from it, one at a time, putting each one back before the next draw. Here are three such samples.\n\n```table\nsample                  numbers        sum   mean\nfirst sample of four    5, 4, 7, 2     18    4.5\nsecond sample of four   4, 4, 5, 2     15    3.75\nthird sample of four    4, 2, 4, 7     17    4.25\n```\n\nThat bouncing around is sampling variation. The square-root law says how big it typically is: divide the population's spread, 2, by the square root of the sample size,\nwhich is 2.\n\n```working\n    2 divided by 2 = 1\n```\n\nFor samples of four, the law predicts a spread of 1 around the true mean of 5.\n\nNow return to the medical students. Suppose the 282 had instead been drawn at random from young adults, the group the paper set out to study. The square-root law would\nthen say something concrete.\n\nThey were not drawn at random. They were students at one college who chose to come forward.\n\nNothing in this arithmetic can say which of several things produced the 14.8-point gap. It could be that these are medical students at one college. It could be the\nyears between when NFHS-4 was measured and when the study ran. It could simply be who chose to volunteer. Size cannot settle that question.\n"
illustration.analogy_breaks_when: 'A real population''s spread is usually not known in advance. Papers estimate it from the same

  sample they are using. That estimate adds its own extra uncertainty, which this demonstration

  does not show.


  Real surveys never ask the same person twice, so they sample without replacement. That matters

  only when the sample is a large share of a small population, such as one village. There the

  scatter is a little less than the law predicts.

  '
must_know[0].point: 'A bigger sample is not a repair for a biased one. Enlarging a convenience sample tightens its

  estimate of whatever population it actually came from.

  '
must_know[1].point: 'Before trusting a report''s sample size, ask how the people in it were found. A small random

  sample can outperform a huge convenience sample.

  '
must_know[2].point: 'Kiran and colleagues'' 282 medical students gave 34.8 per cent with a body-mass index of 25 or

  more, worked out from Table 2. The planning figure the authors rounded from NFHS-4 was 20 per

  cent. Size alone cannot tell you what made the two figures differ.

  '
must_know[3].point: 'The square-root law describes only how a random sample''s answer scatters around the population

  it was actually drawn from. Quoting it does not rescue a sample that was never random.

  '
must_know[4].point: 'Halving the scatter of a sample''s average costs four times as many people, every time.

  '
must_know[5].point: 'Teach a trainee to name the intended population before looking at a study''s sample size. If

  they cannot say who a convenience sample leaves out, they have not learned the part of this

  that matters.

  '
