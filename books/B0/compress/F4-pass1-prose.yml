definition.text: 'An argument is a set of statements offered as reasons, called premises, together with a further

  statement they are meant to establish, called the conclusion. The move from the first to the

  second is the inference.


  An argument can fail in exactly two independent ways. A premise can be false. Or the inference

  can fail to carry, even when every premise is true.

  '
simplified_explanation: 'Someone hands you a claim and asks you to accept it. Along with the claim, they give you reasons

  — these are the premises. The claim itself is the conclusion.


  Ask the two questions in order. First: if every premise were true, would the conclusion follow?

  Then, only then: are the premises actually true?

  '
illustration.body: 'Take it apart, on paper, in

  three lines.


  - *Premise one:* obesity happens when a person takes in more energy than they use.

  - *Premise two:* how much a person eats is something they choose.

  - *Conclusion:* obesity is a matter of personal choice.


  Test the inference first. Grant both premises.

  Now ask: does the conclusion follow?


  It does not. Premise two says intake is chosen. The conclusion needs something far stronger —

  that intake is *freely* chosen.


  You reached "this argument does not work" without settling either

  premise. Run the inference test first, always.

  '
illustration.analogy_breaks_when: 'Most arguments

  you meet in a hostile room are not laid out at all.


  The premise doing the real work is usually the one left unspoken, left out because saying it

  aloud would expose it.


  You have not yet

  written down the premise the speaker left out. Look there first.

  '
must_know[0].point: 'True premises do not make a conclusion true.

  '
must_know[1].point: 'Test the two failure modes in order: ask first whether the conclusion follows, then ask whether

  the premises are true.

  '
must_know[2].point: 'In Indian food policy debate, the commonest unspoken premise is that

  people already know what is in their food.

  '
must_know[3].point: 'Grant every premise aloud, then show the conclusion still does not follow.

  '
must_know[4].point: 'Watch yourself when you are handed an argument you already agree with.

  '
must_know[5].point: 'This gives you the shape of an argument and the point where it breaks.

  '
