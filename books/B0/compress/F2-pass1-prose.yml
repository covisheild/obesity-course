definition.text: 'Reading a figure means settling four things before its shape. What one mark stands for. What each axis measures, and in what unit. Where each axis starts, and how it is spaced. Where the numbers came from.


  A length carries a value only when it is measured from zero. So the value axis of a bar chart must start at zero.


  A figure can mislead while every number on it is correct. A bar chart''s value axis may start above zero. Pictures or areas may stand in for lengths. Bins or time steps may be unequally spaced. The window of time shown may be chosen to suit a claim. Counts may be shown where rates are needed.

  '
simplified_explanation: '**What one mark is.** A mark is anything drawn that stands for one number: a bar, a point, a slice of a pie, a picture. Find what one mark stands for.


  **What each axis measures, and in what unit.** Read the label along the bottom and the label up the side.


  **Where each axis starts, and how it is spaced.** Read the lowest number printed on each axis. Then read along it, and check that equal steps on the page are equal steps in the numbers.


  **Where the numbers came from.** Look under the figure for a source.


  Only then look at the shape.


  So a bar chart must start at zero, and a line chart need not. So read the size of a change off the numbers, not off the slope.


  Double the height and the width of a picture, and it covers four times the page. The number you multiply every length by is called the scale factor. The area goes up by the scale factor squared.


  Here are six ways a figure misleads while every number on it is right.


  **A bar chart whose side axis does not start at zero.** Read the lowest number on the axis. If it is not zero, subtract it from each value to see how long each bar was drawn.


  **Pictures in place of bars.** Compare the numbers, never the pictures. Two pie charts drawn the same size for two years hide any change in the total.


  **Unequal spacing.** A bar can stand for a range of values grouped together, called a bin. Read the range printed under each bar, and check that each covers the same span of values. A label such as "over 80" does not say where its range ends, so ask.


  A time axis can also change its step part way across, say from years to months. Read the date under each point and work out the gap to the next.


  **A chosen window.** A chart over time starts and ends where somebody chose. A short window can show a fall inside a long rise. Ask for the whole series, and ask why the chart starts where it does.


  **Counts where rates are needed.** A district with more people has more of almost everything. Divide each count by the population before you rank, as in the section on rates.


  **Two side axes on one figure.** One line is read against the left axis and one against the right. Read each line against its own axis, and never read the crossing as the moment the two were equal.

  '
illustration.body: "Schedule II of the National Food Security Act, 2013 sets the energy that each meal or ration under the Act is to give.\n\n```table\nthe group  the meal  kilocalories\nchildren, 6 months to 3 years  take home ration  500\nchildren, 3 to 6 years  morning snack and hot cooked meal  500\nchildren, 6 months to 6 years, who are malnourished  take home ration  800\nlower primary classes  hot cooked meal  450\nupper primary classes  hot cooked meal  700\npregnant women and lactating mothers  take home ration  600\n```\n\nPicture these six as a bar chart on a slide. The side axis starts at 400 kilocalories.\n\nEach bar is drawn up from 400, so its length is its value minus 400.\n\n```working\n    450 minus 400 = 50\n    800 minus 400 = 400\n```\n\n```working\n    400 divided by 50 = 8\n```\n\nThe long bar is drawn eight times as long as the short one.\n\n```working\n    800 divided by 450 = 1.7777...\n```\n\nAbout 1.78, which is under twice. Every number on the slide is correct, including the 400 at the bottom.\n\nRedraw the chart with the side axis starting at zero. Each bar is now as long as its value.\n\nThat is why the zero rule belongs to bars.\n\nTake the hot cooked meals: 450 kilocalories for lower primary classes and 700 for upper primary. An infographic — a chart decorated with pictures — draws each meal as a plate. The bigger plate is made as tall as its value requires.\n\n```working\n    700 divided by 450 = 1.5555...\n```\n\nThe bigger plate is 1.556 times as tall. A plate stretched upward alone would look wrong, so it is widened by the same amount.\n\nThe page a plate covers is its height times its width.\n\n```working\n    1.556 times 1.556 = 2.42\n```\n\nThe bigger plate covers 2.42 times the page, for 1.556 times the energy.\n\nBefore the shape, ask how each mark carries its number. A point carries it by position, so read the scale. A bar carries it by length, so find the zero. A picture carries it by area, so compare the numbers and ignore the pictures.\n"
illustration.analogy_breaks_when: "The eight times belongs to an axis starting at 400. Start at 440 and the same two bars come apart far further.\n\n```working\n    800 minus 440 = 360\n    450 minus 440 = 10\n    360 divided by 10 = 36\n```\n\nThe closer the start sits to the shortest bar, the larger the distortion.\n\nStretch a picture upward only, and its area grows in step with its value. It will look stretched, which is its own warning.\n"
must_know[0].point: '"Every chart must start at zero" is the error. A bar chart must, because a bar''s length is its value. A line chart need not, because a point carries its value by position, read off the printed scale.

  '
must_know[1].point: 'Settle four things before you look at the shape. What is one mark? What does each axis measure, and in what unit? Where does each axis start, and how is it spaced? Where did the numbers come from?

  '
must_know[2].point: 'A picture enlarged by some factor in height and width covers that factor squared. When you are shown an infographic, compare the numbers and never the pictures.

  '
must_know[3].point: 'When a bar chart in a meeting starts above zero, ask for it redrawn from zero before anybody discusses the size of a gap.

  '
must_know[4].point: 'Ask for each count divided by its population before any district is named as the worst.

  '
must_know[5].point: 'On a figure with two side axes, where the lines cross is set by the two scales somebody chose.

  '
must_know[6].point: 'Teach a trainee to ask one question of every mark: is its number carried by position, by length or by area?

  '
must_know[7].point: 'These checks catch a figure that draws true numbers unfairly. They cannot catch a wrong number, and they cannot tell you whether a real gap matters.

  '
