definition.text: 'DNA is a molecule built from repeating units called nucleotides. Each nucleotide has three

  parts: a base containing nitrogen, a sugar with five carbons, and a phosphate group. The base

  is one of four — adenine, guanine, cytosine and thymine, written A, G, C and T.


  A DNA molecule is two strands twisted around each other into a right-handed helix. The sugars

  and the phosphates form the backbone of each strand. The bases are stacked inside, and every

  base is paired with a base opposite it on the other strand. A pairs with T, and C pairs with G.

  Bases that pair in this way are called complementary. Because the pairing is fixed, the order

  of the bases along one strand fixes the order along the other.


  Genes are carried on chromosomes. An organism holding two matching copies of each chromosome,

  one inherited from each parent, is diploid. Peas are diploid, and so are virtually all animals.

  The gene that encodes a protein determines the order of amino acids in that protein.


  Where one gene exists in more than one version, the versions are called alleles. An allele

  arises by mutation and sits at the same relative position on the matching chromosome. A diploid

  organism therefore carries two alleles of a gene, and the two may be the same or different.


  The traits an organism visibly expresses are its phenotype. Its underlying genetic make-up,

  counting both the alleles that are expressed and those that are not, is its genotype. Where one

  allele is dominant and the other recessive, an organism carrying two dominant alleles and an

  organism carrying one of each look identical. They have different genotypes and the same

  phenotype.


  Everything above describes the case in which a single gene controls a single characteristic.

  That case is what the cited section sets out, and it sets it out as a case. Nothing in it fixes

  how many genes lie behind any particular human trait, and nothing in it establishes that a

  trait is settled at conception. A gene fixes the order of amino acids in a protein. It does

  not by itself fix when that protein is made. A signal arriving at a cell can cross the plasma

  membrane, bind a receptor inside the cell and set the making of a protein going, which is one

  route and not the only one. Whether the protein works once made depends on the conditions it

  sits in.

  '
simplified_explanation: 'The section on the cell gave you a cell, its plasma membrane, the proteins in it and what a

  receptor does. This one is about the instructions those proteins are built from, and about what

  happens to those instructions when a child is born.


  Start with the molecule. DNA is long, and it is built from small units joined end to end. Each

  unit carries one part that matters here: a base. There are four bases and they have names.

  Adenine, guanine, cytosine and thymine. Nobody says those out loud. They are written A, G, C and

  T, and that is how you will meet them.


  So a strand of DNA is a long line of letters. A, then T, then T, then G, and on for a very long

  way. The order of those letters is the information.


  Now the shape. DNA is not one strand. It is two, twisted around each other, which is why you

  have seen it drawn as a spiral staircase. The letters face inward, like the steps.


  Here is the part that makes the whole thing work. Each letter on one strand sits opposite one

  particular letter on the other. A always faces T. C always faces G. A pair that goes together

  this way is called complementary — a word meaning each one completes the other.


  Look at what that buys you. If you know one strand, you know the other. Read A, T, T, G on the

  near strand and the far strand has to read T, A, A, C. There is no choice about it. That is how a

  cell makes a second copy when it divides, and it is how a copy gets into an egg and a sperm.


  Next, a gene. What a gene does is this: it fixes the order of the building blocks in one protein.

  The protein is the thing that goes and does the work in the body. The gene is the instruction for

  building it.


  Now the part about parents. Genes sit on chromosomes. A chromosome carries its genes in a fixed

  order along it. You get two copies of each chromosome, one from your mother and one from your

  father. So you carry two copies of each gene, not one.


  The two copies need not be identical. Where a gene comes in more than one version, the versions

  are called alleles. Two people can carry different alleles of the same gene, and one person can

  carry two different alleles of it themselves.


  Two more words, and then the one thing this section is for. What you can see about a person — the

  traits they show — is their phenotype. What they actually carry in their DNA, including the

  alleles that are not showing, is their genotype.


  Those two are not the same thing, and here is the case that proves it. For some genes, one allele

  is dominant and the other recessive. Dominant means it shows whenever it is present. Recessive

  means it shows only when both copies are that version.


  So a person with two dominant copies and a person with one of each look exactly alike. Same

  phenotype. Different genotype. You cannot get from what you see to what they carry.


  Now the warning, and it is the reason this section exists.


  Everything above is about one gene controlling one characteristic. The book it comes from says so

  in its own words. It opens the whole discussion with "for cases in which a single gene controls a

  single characteristic". It is describing a case. Peas were chosen because they are a clean one.


  So do not carry the picture over to a human trait and assume it holds. How many genes lie behind

  a human trait — body weight, height, blood pressure — is a question this section does not answer

  and cannot. It is not the same question as what a gene is.


  And one more thing, which people get wrong more often than any of the above. A gene fixes the

  order of parts in a protein. It does not fix when that protein gets made.


  Here is one way the timing gets decided, and you already have the parts for it. A signal reaches

  a cell and crosses into it. Inside, it lands on a receptor, exactly as the section on the cell

  showed you. The receptor then sets the making of a protein going. That is one route. It is not

  the only one, and nobody is telling you here how much of the work it does.


  Then there is what happens after the protein exists. Whether it works depends on where it is.

  Heat, acidity and the chemicals around it can all change its shape. A protein that has lost its

  shape has lost its job.


  So the chain from a letter in DNA to a thing that happens in a person has several steps in it.

  Each of those steps answers to something. "It is in her genes" names the first step and says

  nothing about the rest.

  '
illustration.body: 'Start where this section broke while it was being written, because the dead end teaches the

  habit.


  The job was to give you a definition of a gene out of a textbook, so that the word is not

  simply asserted. The obvious place to look is the section on DNA. Go and look at it.


  Open OpenStax *Biology 2e*, section 14.2, *DNA Structure and Sequencing*, at

  https://openstax.org/books/biology-2e/pages/14-2-dna-structure-and-sequencing. Search inside

  the page for the word **gene**.


  You will find it twice and neither one is a definition. One is the name of a particular gene

  inside a box about bone research. The other is inside the phrase "gene expression", in a note.

  The section that tells you what DNA is made of, and how the two strands pair, never says what a

  gene is.


  That is not an error in the book. The book puts genes in the genetics chapters and structure in

  the structure chapter. It is an error in the assumption, which was that the two live together

  because they feel like one topic.


  Now do the same search on the genetics section. Open section 12.2, *Characteristics and

  Traits*, at https://openstax.org/books/biology-2e/pages/12-2-characteristics-and-traits. The

  word is in the first sentence and it is used all the way down the page. Alleles are defined

  there. Genotype and phenotype are defined there.


  Carry that away as a working habit. When you want a definition, search the page for the word

  before you cite it. A section title tells you what a page is about. It does not tell you what

  the page says.


  Now the clean case, and it is the one you will use.


  Take a gene that comes in two versions and call them **A** and **a**. Capital A is the dominant

  one, small a the recessive one. Everyone carries two copies, so there are three ways to be:


  ```table

  what the person carries  what shows

  A and A                  the A trait

  A and a                  the A trait

  a and a                  the a trait

  ```


  Read the first two rows again. Two different people, carrying different things, showing the

  same thing. Look at them and you cannot tell them apart.


  Now run it the other way, which is the direction you will actually be working in. A person is

  in front of you showing the A trait. What do they carry? You do not know. They are the first row

  or the second row and nothing you can see decides it.


  That is the whole move. **What you can observe does not fix what is carried.** It is worth

  saying out loud, because almost every wrong sentence about genes and families runs the other

  way.


  Take a sentence you will hear in a clinic in Chennai or in Chandigarh, said kindly and meaning

  well.


  > It runs in her family, so it is genetic, so there is not much point.


  Pull it apart, one clause at a time, against what this section gave you.


  *It runs in her family.* That is an observation and it may well be right. Families share more

  than DNA. They share a kitchen, a neighbourhood, a food budget, the hours people work and the

  distance to somewhere safe to walk. A trait appearing in several members of one family is

  consistent with shared alleles. It is just as consistent with shared circumstances. The

  observation on its own does not separate the two.


  *So it is genetic.* This is the step that does not follow, and nothing in this section supports

  it. This section gives you what a gene is and what an allele is. It gives you no way at all to

  move from a family pattern to a cause.


  *So there is not much point.* This is the step that does harm, and it is wrong for a reason you

  now hold. A gene fixes the order of parts in a protein. It does not fix what happens next. A

  signal can reach a cell, cross into it, and set the making of a protein going. And whether the

  protein works once made depends on the heat, the acidity and the chemicals around it. There

  are several steps between the letters and the person, and every one of them answers to

  something.


  So the reply is not "no, it is not genetic". You do not know that either. The reply is that the

  sentence has three claims in it. Only the first has been observed. The third does not follow

  from either of the others.

  '
illustration.analogy_breaks_when: 'The A and a table is a picture of one gene with two versions, where one version hides the

  other. That is the case the source sets out, in those words, and the source uses peas.


  It is not a picture of a human trait, and it is not offered as one. How many genes lie behind

  body weight, or height, or anything else about a person, is a question this section does not

  answer. Do not take the three-row table to a trait and assume it has three rows.


  Not every gene works by one version hiding the other. That pattern is one pattern, and the

  source names it as the one Mendel picked to work on.


  The A and a labels are letters on a page. They carry no quantity. Nothing in this section tells

  you how common either version is in any population, or in India, or how strongly carrying one

  changes anything. Those are measurements and they need studies, not a textbook.


  The dead end at section 14.2 was found on 23 September 2026 in the edition of *Biology 2e* at

  that address. A later edition may move the material. The habit — search the page for the word

  before you cite it — survives the edition; the particular result may not.


  The clinic sentence is written as it gets said. The reply given assumes you have thirty seconds

  and one person listening. A family with a history of early and severe weight gain may need

  something else entirely. What that is belongs to a later subject and a different conversation.

  '
must_know[0].point: 'Carrying a gene variant is one claim. Having a fixed outcome is another, and the second does

  not follow from the first. A gene fixes the order of parts in a protein. It does not fix when

  that protein gets made. A signal reaching a cell can set the making of one going, and what the

  protein does then depends on the conditions around it. So say this out loud the moment

  somebody moves from "it is genetic" to "so nothing can be done". That move is not biology, and

  a patient who hears it acts on it.

  '
must_know[1].point: 'A trait showing up in several members of one family is an observation, not a cause. Families

  share alleles and they also share a kitchen, a work schedule, a food budget and a

  neighbourhood. Ask which of the two is being claimed before you accept the word genetic, because

  the family pattern on its own cannot separate them.

  '
must_know[2].point: 'Two people with different genotypes can show the same phenotype, so what you can see about a

  person does not fix what they carry. Refuse any move that runs from an observed trait back to a

  specific genetic make-up without a test that looked.

  '
must_know[3].point: 'What this section gives you about dominant and recessive alleles is one case. It is the case

  where one gene controls one trait, and the book says so in its own opening words. So do not use

  it to say how many genes lie behind a trait in a person. And do not use it to say that a trait

  is or is not largely inherited. Both of those need a study that measured it. This section is

  not one.

  '
must_know[4].point: 'Call a variant a variant. An allele is one of the versions a gene comes in, and the neutral word

  is the accurate one. Calling a person''s variant a defect or a fault adds a judgement the biology

  does not carry. A patient hears that word exactly as it sounds.

  '
must_know[5].point: 'Search the page for the word before you cite a source for a definition. The section titled DNA

  Structure in a standard biology textbook never uses the word gene. A title tells you the topic

  and not the contents. A citation to a page that does not carry the claim is the one kind of

  error a reader cannot catch.

  '
must_know[6].point: 'When a journalist asks whether obesity is genetic, do not answer yes or no. Say that a gene sets

  the order of parts in a protein. Say that several steps sit between that and a person, and that

  each step answers to something. Then say what would settle the actual question, which is a study

  and not an opinion. The yes-or-no answer is the one that gets printed, and it is the one that

  does the damage.

  '
must_know[7].point: 'One sentence hides three claims: "it runs in the family, so it is genetic, so there is not much

  point". Teach a trainee to write the three out on separate lines. Set out separately on the

  page, the second and third are visibly unsupported. Left joined by two commas, all three travel

  on the strength of the first.

  '
