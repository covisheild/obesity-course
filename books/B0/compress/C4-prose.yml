definition.text: 'A function is a rule that attaches to every input it accepts exactly one output.


  The collection of inputs the rule accepts is its domain. The collection of outputs it can

  return is its range.


  The rule may be stated as words, as arithmetic, as a table of pairs, or as a drawing. The form

  it is stated in does not matter. What makes it a function is that no input is attached to two

  different outputs.


  Two different inputs may share one output, and the rule is still a function. The requirement

  runs in one direction only.


  A function is written as a name with its input in brackets, so f(x) means the output that the

  rule named f gives for the input x. The brackets do not mean multiplication.


  A function states that an output goes with an input. It states nothing about the input causing

  the output.

  '
simplified_explanation: 'A function is a machine with one slot in and one slot out.


  You drop a number in. One number comes out. Drop the same number in tomorrow and the same number

  comes out, because the rule has not changed.


  The rule can be written in any form you like. Words work. Arithmetic works. A table with two

  columns works.


  Here is the part that does all the work. One input may give one output and no more. If the same

  input gives you 20 today and 35 tomorrow, you are not holding a rule at all. You are holding

  something else, and you cannot use it to answer a question.


  Going the other way is allowed. Two different inputs may give the same output, and the rule is

  still a function. Two households of the same size are counted for the same grain, and nothing

  about that is wrong.


  There is a short way to write a rule down. Give it a name, say f. Write f(4), said out loud as

  "f of 4", for the output the rule gives when you put 4 in. The brackets here do not mean times.


  Two names, so you recognise them on somebody else''s page. The inputs a rule will accept are

  called its domain. The outputs it can give back are called its range. Ask a rule what it accepts

  and what it does not. That is often the quickest way to catch somebody running it outside what

  it was built for. A rule that counts people takes whole numbers from one upwards. Half a person

  is not an input it has an answer for.


  Be careful with the second of those two words. In statistics, range means something else

  entirely, which is the largest value in a set of measurements minus the smallest. The two

  meanings have nothing to do with each other and you will meet both. Which one is meant depends

  on whether the thing being described is a rule or a set of measurements.


  Name the input, name the output, and name the unit of each before you use anybody''s rule. A rule

  with no units on it is a rule you cannot check.

  '
illustration.body: "Start with a table that is not a rule, because spotting one of those is the skill worth having.\n\nA block register lands on your desk. It lists four households, how many people are in each, and\nthe foodgrains each is counted for in a month.\n\n```table\nhousehold  people  kilograms a month\nA          4       20\nB          6       30\nC          4       35\nD          5       25\n```\n\nAsk the register a question. How many kilograms does it give for a household of four?\n\nYou cannot answer. Household A says 20 and household C says 35. One input has two outputs, so\nthis table is not a function of the number of people.\n\nThat is a finding rather than a dead end. Something other than the number of people differs\nbetween A and C, and the register does not say what. Until somebody tells you what, you cannot\nwork out a single row from the number of people alone.\n\nNow the clean case. Section 3(1) of the National Food Security Act, 2013 entitles a person in a\npriority household to five kilograms of foodgrains per person per month.\n\nThat sentence is a function. The input is the number of people. The rule is \"multiply by five\nkilograms a month\". The output is kilograms of foodgrains a month.\n\nPut four in.\n\n```working\n    5 times 4 = 20\n```\n\nTwenty kilograms a month. Put six in.\n\n```working\n    5 times 6 = 30\n```\n\nThirty kilograms a month.\n\nWrite the rule short. Call it g. Let n stand for the number of people, in the way a letter\nstood for a number in the section on variables.\n\n```working\n    g(n) = 5 times n\n```\n\nNow go back to the register with the rule in your hand. Households A, B and D match it.\nHousehold C does not.\n\n```working\n    5 times 4 = 20\n```\n\nTwenty, against the 35 the register prints. So the rule has told you which row to ask about,\nand that is what a function buys you here. One input, one output, and anything that does not\nmatch is a question for whoever wrote the register.\n"
illustration.analogy_breaks_when: 'The one-slot machine holds while the rule takes one input. Many real rules take two.


  The index you met in the section on body-size units needs a mass and a height together. That is

  still a function. The picture of one slot in and one slot out is no longer the whole of it.


  The machine says nothing about whether a rule is true of the world either. A rule can give

  exactly one output and still be the wrong rule.


  And the five kilograms is what section 3(1) states for a person in a priority household. Other

  parts of the same Act count other households, so do not carry the five anywhere else.

  '
must_know[0].point: 'When a table lands in front of you, look for one input appearing twice with two different

  outputs before you compute anything from it. That check takes a minute and it decides whether

  the table can answer a question at all.

  '
must_know[1].point: 'Two inputs sharing one output is fine. One input with two outputs is not. The requirement runs

  in one direction, and reading it in both is what makes people reject good rules.

  '
must_know[2].point: 'Outputs that climb for a while and then fall again break nothing. A rule can do that and still

  give exactly one output for every input it takes, and drawing it changes none of that. What

  breaks the rule in a picture is what breaks it in a table: one input carrying two different

  outputs. So look for the repeated input, never for the shape of anything.

  '
must_know[3].point: 'When the same inputs give a different answer on a second run, something you did not notice

  changed. Find what changed before you trust either answer.

  '
must_know[4].point: 'Name the input, the output and the unit of each before you write anybody''s rule on a

  whiteboard. A trainee who copies a formula without those three things cannot check it later.

  '
must_know[5].point: 'A function says the output goes with the input. It never says the input produced it. Quoting a

  rule as though it were a cause is a claim the arithmetic does not carry.

  '
