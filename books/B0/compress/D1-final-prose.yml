definition.text: 'A probability is a number from 0 to 1 that states how often an outcome would turn up if the same chance

  process were repeated a great many times. The complete list of everything that could happen is the sample

  space. One member of that list is an outcome, and any collection of outcomes from it is an event.


  The complement of an event is every outcome in the sample space that is not in it. An event''s probability and

  its complement''s probability always add to 1.


  Call the probability of an event p, the letter p standing for probability. The odds are how many times more

  likely the event is than its opposite: p divided by (1 minus p).

  '
simplified_explanation: 'A probability is a proportion.


  It always sits between 0, which means never, and 1, which means every time.


  When every outcome is exactly as likely as every other, working out a probability is counting.

  Count the outcomes that make your event true. Count every outcome there is. Divide the first by

  the second.


  The complement of an event is everything that is not it.


  Odds are how many times more likely the event is than its opposite, not how likely it is. To get

  them, divide the probability by 1 minus the probability — that is, by the complement.


  A probability of 0.5 gives odds of 1, usually said as "evens" or "one to one". A probability of

  0.75 gives odds of 3, said "three to one". Learn to move between the two now.

  '
illustration.body: "Go back to section 3(1) of the National Food Security Act, 2013. It set five kilograms of\nfoodgrains per person per month for a priority household. Read on to section 3(2), which sets a\nceiling on how many people that entitlement can reach. It shall extend up to seventy-five per\ncent. of the rural population, and up to fifty per cent. of the urban population.\n\nPick one rural person, anywhere the Act covers, entirely at random. At random means every rural\nperson has exactly the same chance of being the one you pick. So the whole rural population is\nyour sample space, and the person you land on is your outcome.\n\nLet A be the event that the person you pick is covered by the entitlement. Ask for P(A), said\n\"P of A\", meaning the probability of A.\n\nYou are not told how many people are actually covered, only the largest share the Act allows.\nSo work with 0.75 as a ceiling on P(A), not a measured figure, and carry that qualification\ninto every answer below.\n\n```working\n    P(A) is at most 0.75\n```\n\nNow the complement. Not being covered is everything else in the sample space.\n\n```working\n    1 minus 0.75 = 0.25\n```\n\nAt least one rural person in four, on this reading of the Act, is not covered.\n\nNow the trap. Turn 0.75 into odds: the probability divided by its complement.\n\n```working\n    0.75 divided by 0.25 = 3\n```\n\nThe odds a random rural person is covered are, at most, three to one. Here that happens to read\nthe same as \"three in four\". That is exactly what makes the trap dangerous. It works once and\nthen stops working.\n\nWatch it stop. The urban ceiling is fifty per cent.\n\n```working\n    0.5 divided by 0.5 = 1\n```\n\nOdds of one to one, usually said \"evens\". Odds of one mean half the time.\n\nSuppose you read that the odds are two to one against — two to one that the event does not\nhappen. Odds \"against\" are the odds of the complement, so first flip them round: odds of two to\none against is odds of one-half in favour.\n\n```working\n    odds in favour = 1 divided by 2 = 0.5\n```\n\nTurn odds back into a probability by counting parts. Odds of 0.5 mean 0.5 parts for the event\nto 1 part against it. Add those parts and there is one and a half parts in all.\n\n```working\n    0.5 divided by 1.5 = 0.3333...\n```\n\nAbout a third.\n"
illustration.analogy_breaks_when: 'Every probability above is a ceiling, not a measurement. The Act bounds how far the entitlement can

  extend; it does not say how many people are actually receiving it in any one district. Treat 0.75 as the

  largest the chance of being covered could be, and 0.25 as the smallest the chance of not being covered

  could be. Say so whenever you quote a figure built from them.


  Odds and probability are almost the same number near 0: 0.01 gives odds of 0.0101. Near 1 they pull apart:

  0.99 gives 99, and 0.999 gives 999.

  '
must_know[0].point: 'Odds of a figure are not the same as a probability of that figure. Odds of 0.25 convert

  to a probability of 0.25 divided by 1.25, which is 0.2 — a one-in-five chance. Convert

  before you speak.

  '
must_know[1].point: 'Near 0, odds and probability are almost the same number. Above one half they pull apart, and

  near 1 they pull apart fast: 0.99 to 0.999 multiplies the odds by ten.

  '
must_know[2].point: 'A probability describes a group, or a process repeated many times. It does not describe the one

  person in front of you. Knowing that 0.75 of a population is covered by an entitlement tells you

  nothing about whether this particular person is one of them. Use the figure to plan for a group.

  Then go and check the individual case on its own.

  '
must_know[3].point: 'Every probability, complement and odds you compute from a ceiling is itself a ceiling. Say so

  in the same sentence you quote the number, or the reader will treat it as a count.

  '
must_know[4].point: '"Odds of three to one" means three chances in four. Say "three in four" and the journalist

  hears it right.

  '
