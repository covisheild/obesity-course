definition.text: 'A figure presents values as marks, such as bars, points or areas, placed against one or more

  scales. Most marks carry their value in one of three ways: by position against a scale, by

  length measured from a baseline, or by area.


  Reading a figure means settling four things before its shape. What one mark stands for. What

  each axis measures, and in what unit. Where each axis starts, and how it is spaced. Where the

  numbers came from.


  A length carries a value only when it is measured from zero. So the value axis of a bar chart

  must start at zero. A position carries its value through the printed scale. So a line chart

  whose value axis starts elsewhere is faithful, provided the start is printed on the axis and

  stated in the caption.


  An area grows as the square of the factor applied to its lengths. A picture enlarged by the

  same factor in height and in width covers that factor squared times the original area.


  A figure can mislead while every number on it is correct. A bar chart''s value axis may start

  above zero. Pictures or areas may stand in for lengths. Bins or time steps may be unequally

  spaced. The window of time shown may be chosen to suit a claim. Counts may be shown where rates

  are needed. And two vertical axes may be used, so that where the lines cross is set by the two

  scales chosen.

  '
simplified_explanation: 'The section on reading a table gave you four questions to settle before reading any number. A

  figure needs the same four, turned to a picture. The section on graphs gave you the order for

  the axes, and this order keeps to it. The middle two steps below are the first two steps of the

  section on graphs: the axes and their units, then the scale. Slope and shape come after, as

  they did there.


  **What one mark is.** A mark is anything drawn that stands for one number: a bar, a point, a

  slice of a pie, a picture. Find what one mark stands for. It may be one group, one district or

  one year. This is the question you asked about one row of a table.


  **What each axis measures, and in what unit.** Read the label along the bottom and the label up

  the side. If an axis is a rate or a percentage, ask what it is out of, as you did for a table''s

  columns.


  **Where each axis starts, and how it is spaced.** Read the lowest number printed on each axis.

  Then read along it, and check that equal steps on the page are equal steps in the numbers.


  **Where the numbers came from.** Look under the figure for a source. With no source, you have

  nothing to check it against.


  Only then look at the shape.


  A point sometimes carries a short line through it, called a whisker. It shows either a spread

  or an uncertainty, and the caption should say which. Read the caption for that. If the caption

  does not say, you cannot read the whisker.


  Next, see how a mark carries its number. There are three common ways, and each can mislead in

  its own way.


  By position. A point on a line chart carries its value by where it sits. You read it by

  looking across to the numbers on the side.


  By length. A bar carries its value by how long it is. Your eye compares bars by comparing their

  lengths. So a bar''s length has to be its value, and that holds only when the bar starts at

  zero.


  By area. A picture, a bubble or a slice of a pie carries its value by how much of the page it

  covers. The eye takes in area more readily than height.


  So a bar chart must start at zero, and a line chart need not. The two rules do not fight. A line

  chart asks you to read positions, and a printed axis starting at 400 tells you where they are.

  A bar chart asks you to compare lengths, and a bar cut off at 400 has the wrong length. A line''s

  steepness is still somebody''s choice, as the section on graphs showed. So read the size of a

  change off the numbers, not off the slope.


  Area has a trap of its own. Double the height and the width of a picture, and it covers four

  times the page. The number you multiply every length by is called the scale factor. The area

  goes up by the scale factor squared.


  Here are six ways a figure misleads while every number on it is right. Each comes with its

  check.


  **A bar chart whose side axis does not start at zero.** Read the lowest number on the axis. If

  it is not zero, subtract it from each value to see how long each bar was drawn.


  **Pictures in place of bars.** Compare the numbers, never the pictures. A picture scaled both

  ways shows the scale factor squared where the numbers show only the scale factor. Two pie

  charts drawn the same size for two years hide any change in the total.


  **Unequal spacing.** A bar can stand for a range of values grouped together, called a bin. Read

  the range printed under each bar, and check that each covers the same span of values. A label

  such as "over 80" does not say where its range ends, so ask. A bar covering a wider span catches

  more values. It may be drawn wider, or drawn the same width and taller. Either way it cannot be

  compared with the others.


  A time axis can also change its step part way across, say from years to months. Read the date

  under each point and work out the gap to the next. A log axis, from the section on logarithms,

  is spaced unequally on purpose. Equal distances on it are equal

  multiples, and its numbers show it: 1, 10, 100.


  **A chosen window.** A chart over time starts and ends where somebody chose. That stretch is

  its window. A short window can show a fall inside a long rise. Ask for the whole series, and ask

  why the chart starts where it does.


  **Counts where rates are needed.** A district with more people has more of almost everything.

  Divide each count by the population before you rank, as in the section on rates.


  **Two side axes on one figure.** One line is read against the left axis and one against the

  right. Where the two lines cross depends on how the two axes were chosen. Read each line

  against its own axis, and never read the crossing as the moment the two were equal.

  '
illustration.body: "Start with a chart that goes wrong, drawn from real numbers.\n\nSchedule II of the National Food Security Act, 2013 sets the energy that each meal or ration\nunder the Act is to give. It covers six groups. The unit is the kilocalorie, from the section\non energy units.\n\n```table\nthe group  the meal  kilocalories\nchildren, 6 months to 3 years  take home ration  500\nchildren, 3 to 6 years  morning snack and hot cooked meal  500\nchildren, 6 months to 6 years, who are malnourished  take home ration  800\nlower primary classes  hot cooked meal  450\nupper primary classes  hot cooked meal  700\npregnant women and lactating mothers  take home ration  600\n```\n\nPicture these six as a bar chart on a slide. The side axis starts at 400 kilocalories. The 400\nis printed at the bottom, in small type.\n\nLook at the chart the way everybody does at first, by its shape. The bar for lower primary\nclasses is a stub. The bar for children who are malnourished towers over it.\n\nNow measure them. Each bar is drawn up from 400, so its length is its value minus 400.\n\n```working\n    450 minus 400 = 50\n    800 minus 400 = 400\n```\n\nCompare the two lengths.\n\n```working\n    400 divided by 50 = 8\n```\n\nThe long bar is drawn eight times as long as the short one. Now compare the two values the bars\nstand for.\n\n```working\n    800 divided by 450 = 1.7777...\n```\n\nAbout 1.78, which is under twice. Every number on the slide is correct, including the 400 at the bottom. What\nmisleads you is the length. The eye compares bars by length, and these lengths are not the\nvalues.\n\nRedraw the chart with the side axis starting at zero. Each bar is now as long as its value.\nThe 800 bar is 1.78 times the 450 bar, and it looks it.\n\nNotice what was right on the first slide, too. The top of each bar sat level with its value on\nthe scale. Read the tops across to the side axis and you get 450 and 800 exactly. Compare the\nlengths, as the eye does, and you get eight. The fault lives in the length and nowhere else.\n\nThat is why the zero rule belongs to bars. Suppose instead the numbers were one quantity\nmeasured in six years running. Draw them as six points joined by a line. Now nothing asks you\nto compare the length of anything. You read each point across to the scale, as in the section\non graphs. An axis starting at 400 is honest there, provided the 400 is printed on the axis\nand stated in the caption.\n\nNow the second trap, using two of the same numbers. Take the hot cooked meals: 450\nkilocalories for lower primary classes and 700 for upper primary. An infographic — a chart\ndecorated with pictures — draws each meal as a plate. The bigger plate is made as tall as its\nvalue requires. Work out by how much.\n\n```working\n    700 divided by 450 = 1.5555...\n```\n\nAbout 1.556. The bigger plate is 1.556 times as tall. A plate stretched upward alone would look wrong, so it\nis widened by the same amount. The number every length of the picture is multiplied by is its\nscale factor. Here it is 1.556, in both directions.\n\nThe page a plate covers is its height times its width. Both went up by 1.556.\n\n```working\n    1.556 times 1.556 = 2.42\n```\n\nThe bigger plate covers 2.42 times the page, for 1.556 times the energy. The eye reads area\nmore easily than height, and the area says 2.42.\n\n```table\nthe class  the meal  kilocalories  scale factor  area against the smaller plate\nlower primary  hot cooked meal  450  1  1\nupper primary  hot cooked meal  700  1.556  2.42\n```\n\nThat is the square law, and it is the section on powers at work. Multiply every length of a\nflat picture by some factor. Its area is multiplied by that factor squared, the factor times\nitself. A factor of 2 makes 4 times the area. A factor of 3 makes 9.\n\nSo here is the habit, for any figure. Before the shape, ask how each mark carries its number.\nA point carries it by position, so read the scale. A bar carries it by length, so find the\nzero. A picture carries it by area, so compare the numbers and ignore the pictures.\n"
illustration.analogy_breaks_when: "The eight times belongs to an axis starting at 400. Move the start and the distortion moves\nwith it. Start at 440 and the same two bars come apart far further.\n\n```working\n    800 minus 440 = 360\n    450 minus 440 = 10\n    360 divided by 10 = 36\n```\n\nThe closer the start sits to the shortest bar, the larger the distortion. There is no limit\nto it.\n\nThe square law holds for a flat picture scaled by the same factor in both directions. Stretch\na picture upward only, and its area grows in step with its value. It will look stretched,\nwhich is its own warning.\n\nThe six values are the Act's as checked on 23 September 2026. The arithmetic does not depend\non them staying that way.\n"
must_know[0].point: '"Every chart must start at zero" is the error. A bar chart must, because a bar''s length is its

  value. A line chart need not, because a point carries its value by position, read off the

  printed scale. It is honest when the start is printed on the axis and stated in the caption.

  Say which of the two you are looking at before you object to an axis.

  '
must_know[1].point: 'Settle four things before you look at the shape. What is one mark? What does each axis

  measure, and in what unit? Where does each axis start, and how is it spaced? Where did the

  numbers come from?

  '
must_know[2].point: 'A picture enlarged by some factor in height and width covers that factor squared. A meal with

  1.556 times the energy, drawn as a plate, covers 2.42 times the page. When you are shown an

  infographic, compare the numbers and never the pictures.

  '
must_know[3].point: 'When a bar chart in a meeting starts above zero, ask for it redrawn from zero before anybody

  discusses the size of a gap. A gap that looks eight times on the slide can be 1.78 times in the

  numbers, and the argument changes with it.

  '
must_know[4].point: 'A chart of counts by district ranks districts partly by how many people live in them. Ask for

  each count divided by its population before any district is named as the worst.

  '
must_know[5].point: 'On a figure with two side axes, where the lines cross is set by the two scales somebody chose.

  Never read the crossing as the moment the two quantities were equal.

  '
must_know[6].point: 'Teach a trainee to ask one question of every mark: is its number carried by position, by length

  or by area? The answer decides which check applies.

  '
must_know[7].point: 'These checks catch a figure that draws true numbers unfairly. They cannot catch a wrong number,

  and they cannot tell you whether a real gap matters. When a figure passes every check, ask for

  the table behind it and read that with the four questions for a table.

  '
