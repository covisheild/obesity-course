definition.text: 'A graph is a drawing of a relationship between two quantities, made of points in a plane.


  Two lines of reference cross at a point called the origin. The horizontal one is the x-axis and

  the upright one is the y-axis. Each axis carries one quantity, the unit that quantity is

  measured in, and a scale.


  The scale is the rule that turns a distance along an axis into an amount of the quantity.

  Whoever draws the figure chooses it. A different choice makes the same points look different

  without making any of them untrue.


  A point is fixed by two numbers, written (x, y), which are its position along the x-axis and

  its position along the y-axis.


  The slope of a straight line is the change in the y quantity divided by the change in the x

  quantity, measured between any two points on it. Its unit is the unit of the y quantity divided

  by the unit of the x quantity, so a slope is a rate.


  The intercept on the y-axis is the value the y quantity takes where the x quantity is zero. It

  is a property of the line as drawn. It states something about the world only where zero is a

  value the x quantity can take.

  '
simplified_explanation: "You now have a rule that turns an input into one output. A graph is that rule drawn, and reading\none is the skill every figure in every later booklet asks for.\n\nA graph turns two columns of numbers into a picture. Four things decide what the picture tells\nyou. Check them in this order, every time, before you look at the shape.\n\n**What is on each axis.** Look at the flat line along the bottom. That is the x-axis. Look at the\nupright line up the side. That is the y-axis. Each should carry the name of a quantity and a\nunit. An axis with no unit on it is a picture you cannot read.\n\n**What the scale is.** The scale is how much of the quantity one step along the axis stands for.\nSomebody chose it. They could have chosen another one. The same numbers on a taller axis look\ncalm, and on a shorter axis look steep, and neither drawing is a lie. So read the numbers printed\non the axis before you trust the shape.\n\n**How steep the line is.** Steepness is called the slope. Pick two points on the line. Work out\nhow far up it went between them, and how far across.\n\n```working\n    the slope = the change up, divided by the change across\n```\n\nThe change up is called the rise. The change across is called the run.\n\nA slope is a rate, and it carries a unit like every rate you have met. The unit is the y unit\ndivided by the x unit. Put kilograms up the side and months along the bottom, and the slope is in\nkilograms per month. It is not in anything else.\n\n**Where the line crosses.** Follow the line to the place where the x quantity is zero. The height\nthere is called the intercept. It answers one question: what was the y quantity when the x\nquantity was nothing at all?\n\nSometimes that question has a real answer you can go and check. Sometimes zero is outside\nanything anybody measured, and then the intercept is a number the drawing made. Say which of the\ntwo you have before you quote it to anybody.\n"
illustration.body: "Take one rule and draw it twice. Nothing about the rule changes between the two drawings, and\nthe two drawings do not tell you the same thing.\n\nThe rule is the one from the section before this. Section 3(1) of the National Food Security\nAct, 2013 entitles a person in a priority household to five kilograms of foodgrains per person\nper month. So a household of n people is counted for 5 times n kilograms a month.\n\nWork out eight points, one for each household size from one person to eight.\n\n```table\npeople in the household  kilograms a month\n1                        5\n2                        10\n3                        15\n4                        20\n5                        25\n6                        30\n7                        35\n8                        40\n```\n\nNow draw them. People go along the bottom. Kilograms a month go up the side.\n\nDraw it once with the side axis running from 0 to a little above 40 kilograms. The points climb\nfrom the bottom left corner to the top right corner. The line fills the picture and the rise is\nthe first thing you see.\n\nDraw it again with the side axis running from 0 to 200 kilograms. Every point is the same point\nas before. The line now sits in the bottom fifth of the picture and looks nearly flat.\n\nAsk what changed between the two. Only the numbers printed up the side. The second drawing has\nroom for 200 kilograms, so 40 kilograms is a fifth of the height instead of nearly all of it.\n\n```working\n    40 divided by 200 = 0.2\n```\n\nNobody cheated. Both drawings show the same eight pairs of numbers, and you can read any pair\noff either of them. What differs is the impression, and the impression was set by a choice.\n\nSo here is the habit. Read the numbers on both axes first. Then decide whether a rise you can\nsee is a rise that matters. Never take the steepness of a line as a measurement, because it is\nnot one.\n\nNow read a slope and an intercept off a line, which is the other thing a graph is for.\n\nA household of four has 10 kilograms of grain in the house today. Every month it is counted for\nanother 20 kilograms, because five kilograms a person times four people is twenty.\n\n```working\n    5 times 4 = 20\n```\n\nPut months along the bottom, starting at today. Put kilograms in the house up the side.\n\n```table\nmonths from today  kilograms in the house\n0                  10\n1                  30\n2                  50\n3                  70\n4                  90\n5                  110\n6                  130\n```\n\nThe points sit on a straight line. Take two of them and read the slope off the picture. Use the\npoint at one month and the point at four months.\n\nWork out the rise, which is the change up the side.\n\n```working\n    90 minus 30 = 60\n```\n\nWork out the run, which is the change along the bottom.\n\n```working\n    4 minus 1 = 3\n```\n\nDivide the rise by the run.\n\n```working\n    60 divided by 3 = 20\n```\n\nTwenty. Now put a unit on it, and take the unit off the axes rather than out of your memory.\nThe side axis is in kilograms and the bottom axis is in months.\n\n```working\n    kilograms divided by months\n    = kilograms per month\n```\n\nTwenty kilograms a month. That is the household's monthly entitlement, got from the picture\ninstead of from the rule, and the two agree.\n\nPick a different pair of points and the slope comes out the same, because the line is straight.\nTake month two and month six.\n\n```working\n    130 minus 50 = 80\n    6 minus 2 = 4\n    80 divided by 4 = 20\n```\n\nNow the intercept. Follow the line back to month zero, where the bottom quantity is nothing at\nall. The line meets the side axis at 10 kilograms.\n\nThat number means something here. It is the grain that was in the house before any of these\nmonths began. Somebody can go and look in the house and check it.\n\nNow watch an intercept stop meaning anything. Go back to the first drawing, where the bottom\naxis was the number of people. Its intercept is the grain for a household of nobody. No such\nhousehold exists, so that number is something the drawing produced and nothing anybody can\ncheck.\n"
illustration.analogy_breaks_when: 'Reading one slope off a line works while the line is straight. A curve has a different

  steepness at every point of it, so no single slope describes a curve.


  Two points one directly above the other have no run at all. An upright line has no slope,

  because the division has nothing to divide by.


  The intercept means something only where zero is a value the bottom quantity can really take.

  Everywhere else it is a product of the drawing.


  Two drawings of the same points are both honest, however different they look. Two drawings of

  different points are not, and reading the axes is what tells those two cases apart.


  And a straight line through some points does not make the rule behind them true. These eight

  points come from an Act, so they are exact. Points that come from measuring something are not,

  and nothing in this section tells you which kind you are looking at.

  '
must_know[0].point: 'Read both axes, with their units, before you look at the shape of anything. A figure you have

  reacted to before reading its axes is a figure you have not read.

  '
must_know[1].point: 'A steep line is not a large effect. Steepness is set by the scale, and the scale was chosen by

  whoever drew the figure, so it is not a measurement of anything.

  '
must_know[2].point: 'A side axis that does not start at zero makes every small wiggle on it look like a cliff. Look

  at the first number on that axis before you call a rise sharp. Say the number out loud whenever

  you describe the figure to anybody.

  '
must_know[3].point: 'A slope carries the y unit divided by the x unit. Quote it with that unit attached, because

  "twenty kilograms a month" is a claim somebody can check and "twenty" is not.

  '
must_know[4].point: 'An intercept is a fact about the world only where zero is a value the bottom quantity can

  actually take. Where it cannot, you are quoting the drawing rather than the data. A number like

  that, said once in a committee room, gets repeated for years.

  '
must_know[5].point: 'When a figure alarms you, redraw it with the side axis starting at zero before you repeat it to

  a journalist. If the alarm survives, it was in the numbers. If it does not, it was in the

  drawing.

  '
must_know[6].point: 'Teach a trainee to read a figure in a fixed order: axes, then units, then the numbers on the

  scale, then the shape. Reading the shape first is what produces a confident wrong summary.

  '
must_know[7].point: 'Before you read a value off any printed chart in clinic, find what one small division on each

  axis stands for. Two charts of the same quantity often use different divisions, and the eye

  does not notice the change.

  '
