definition.text: 'A reference is a pointer from a claim to the place that is supposed to support it.


  Checking a reference means four things, and each one can fail on its own. Finding the source. Confirming it is the source named. Finding the exact passage pointed to. Reading that passage to see whether it supports the claim.


  Finding a source is not the same as checking it.

  '
simplified_explanation: 'Checking a reference means you go and look, not just glance at the name on it.


  Four separate acts sit inside that looking, and each one can fail on its own. First, find the source. Second, check it is the source named, not something close to it. Third, find the exact page or section pointed to. Fourth, read that passage and ask whether it actually says what you were told.


  Most people stop at the first act and call the job done. That is where the danger sits. Nothing about the name looks wrong.

  '
illustration.body: 'Here is the claim.


  > The GST Council is set up by Article 279A of the Constitution.


  First, find it. Open India Code, the government''s own website for Indian law. Search for "Constitution of India". Open it.


  Third, find the exact place. The claim names Article 279A, so search inside the document for "279A". Nothing comes up.


  Why not? Look at the list of amendments this copy names — later changes stitched into the law. The newest one is from 2003. Article 279A was written into the Constitution in 2016, thirteen years after that. This copy is old, and nothing on the page warns you.


  A second copy sits on the same website, marked as up to date, and that one does hold Article 279A.

  '
illustration.analogy_breaks_when: 'A source can say something smaller than the claim built on it. A paper finds that two things move together; someone later cites it as proof that one causes the other.


  For a law there is a fifth question the four acts never ask on their own: is this copy up to date? An old copy can pass finding, confirming and locating, then fail at reading.

  '
must_know[0].point: 'If a citation opens, that does not mean it is checked. Opening is only the first act, and the easiest one.

  '
must_know[1].point: 'Treat every reference as four separate acts: find it, confirm it, locate the passage, read it.

  '
must_know[2].point: 'Before you trust a copy, check the newest amendment it names. That check takes seconds.

  '
must_know[3].point: 'Expect the people reading your work to test your citations against you, not for you.

  '
must_know[4].point: 'A citation can be perfectly formatted and still say nothing like what you claimed.

  '
must_know[5].point: 'This check tells you only whether a source supports a claim. It does not tell you whether the source is good, or whether better evidence exists.

  '
