definition.text: |
  A stock is a quantity that exists at a moment and can be measured at that moment. A flow is a
  rate that changes a stock and, like any rate, it is quoted over a stretch of time or at a
  moment.

  The stock at any time is its starting value, plus everything that flowed in up to that time,
  minus everything that flowed out.

  The net flow is the inflow minus the outflow. A stock rises while the net flow is positive,
  falls while it is negative, and holds steady while it is zero.

  A stock and a flow carry different units. A stock carries the unit of the quantity. The two are never added to each other.

  A stock that holds steady is evidence that the inflow and the outflow matched over the period
  measured, and is no evidence at all that either one was small.
simplified_explanation: |
  Picture a water tank with a tap running into it and a drain running out of it.

  **The stock is what is in the tank.** It is an amount, it exists right now, and you could measure
  it this minute by looking. Litres in the tank is a stock.

  **A flow is what goes in or what goes out.** It is a rate, so it has a time on the bottom of its
  unit. Litres a minute is a flow. Kilograms a month is a flow.

  Look at the unit. If it has a "per" or an "a" with a
  time after it, you are holding a flow. If it does not, you are holding a stock.

  The amount in the tank now is the amount you started with, plus everything that came in, minus
  everything that went out.

  ```working
      the stock now = the starting stock, plus the total in, minus the total out
  ```

  Take the flow, multiply by
  how long it ran, and add the pieces up.

  The difference between the inflow and the outflow has a name: the net flow.

  - More in than out, so the net flow is positive, and the stock rises.
  - More out than in, so the net flow is negative, and the stock falls.
  - The same in as out, so the net flow is zero, and the stock does not move.

  A stock that does not move tells you the two flows matched. It tells you nothing whatever about
  how big they were.

  **A stock can be large, steady and busy all at once.**

  A stock and a flow are never added
  together.
illustration.body: |
  A fair price shop keeps its grain in a store room behind the counter. An inspector weighs what
  is on the shelves at the end of April and finds 2,000 kilograms. She comes back at the end of
  May and finds 2,000 kilograms again.

  Her note says this.

  > The stock has not moved in a month. Nothing is being distributed here.

  The second is a conclusion, and it does not follow.

  This one serves 500 priority households and each of
  them has four people in it.

  Section 3(1) of the National Food Security Act, 2013 entitles a person in a priority household
  to five kilograms of foodgrains per person per month.

  ```working
      5 times 4 = 20
  ```

  Five hundred households at twenty kilograms a month each.

  ```working
      20 times 500 = 10000
  ```

  The same ten thousand have to
  come in from the depot, or the shelves would empty.

  The shelves held 2,000 kilograms on both days the inspector looked, and they held different grain.

  So write the balance line out for May and watch the two flows cancel.

  ```working
      2000 plus 10000 minus 10000 = 2000
  ```

  Now make the flows differ, so that you can see the stock move.

  ```table
  month  stock at the start  came in  went out  stock at the end
  1      2,000               10,000   10,000    2,000
  2      2,000               9,000    10,000    1,000
  3      1,000               11,000   10,000    2,000
  ```

  Check each row with the same line.

  Month two, where the depot sent a thousand kilograms short.

  ```working
      2000 plus 9000 minus 10000 = 1000
  ```

  Read the first row and the last row alone
  and you would say nothing happened at all.

  The stock is in kilograms. The flows are in kilograms a month.

  ```working
      kilograms per month, times months
      = kilograms
  ```

  A person's body weight is a stock.

  Food energy taken in is a flow into that stock. Energy spent is a flow out of it.

  A weight that has not changed over a
  year is a stock whose net flow came to zero across that year. It is not a person in whom
  nothing is happening. Both flows may be very large, and the arithmetic says only that they
  matched.

  This section gives you no figure for either flow and you should not take one from here.

  What you have is the shape. The shape is what stops a steady weight being read as an absence of movement.
illustration.analogy_breaks_when: |
  The shop, the 500 households, the four people in each and the 2,000 kilograms on the shelves
  are all made up for the example. Only the five kilograms per person per month comes from the
  Act.

  A store room's two flows are set from outside it. Grain arrives because a depot sent it. Grain
  leaves because shops drew it. Neither answers to what is on the shelves.

  That is not true of every stock. In some systems one flow moves when the other moves, or moves
  with the level of the stock. What fails is the assumption
  that you can alter one term and leave the others where they were.

  Whether a person's two flows work that way is a question about the body, not about arithmetic.

  Two readings a month apart do not make a steady stock.
must_know[0].point: |
  A stock that is not moving is not a stock with nothing going through it. The level on its own cannot tell
  the two cases apart.
must_know[1].point: |
  A time
  on the bottom means a flow. No time means a stock, and the two answer different questions.
must_know[2].point: |
  Never add or subtract a stock and a flow. Kilograms and kilograms a month are different kinds of quantity.
must_know[3].point: |
  Write the balance line out before you argue about any of its parts. Starting stock, plus
  everything in, minus everything out.
must_know[4].point: |
  The balance line tells you what must be true of the numbers and never what caused a flow to
  change. Do not use it to explain why
  anything moved.
must_know[5].point: |
  A person whose weight has been steady for a year is not a person in whom nothing is happening.
  Steadiness means the two flows matched over the year, not that either was small.
must_know[6].point: |
  Auditing a stock cannot find a matched pair of wrong flows.
must_know[7].point: |
  When a journalist asks whether something is getting worse, separate the level from the traffic
  through it.
