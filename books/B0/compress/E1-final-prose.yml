definition.text: 'The electrons occupy almost all of an atom''s volume.


  A chemical bond is an attraction between atoms or ions that holds them together in a molecule

  or a crystal.


  A covalent bond results from the mutual attraction of two atoms for a shared pair of

  electrons.


  Energy is the capacity to supply heat or do work. Potential energy is the energy an object has

  because of its relative position, composition or condition. Kinetic energy is the energy an

  object possesses because of its motion. The energy held in a food is potential energy of

  composition. It is held in which atoms are bonded to which, and not in the atoms themselves.


  Separating any pair of bonded atoms requires energy. The stronger a bond, the greater the

  energy required to break it. Forming a bond releases energy.


  Breaking every bond in the starting materials takes energy in. Forming every bond in the

  products gives energy out. The net energy change of the reaction is approximately the

  difference between those two totals.


  Where the bonds in the products are stronger than the bonds in the starting materials, the

  reaction releases heat and is called exothermic. Where the bonds in the products are weaker,

  the reaction absorbs heat and is called endothermic.

  '
simplified_explanation: 'Everything you eat is made of atoms.


  An atom has a tiny heavy centre, called the nucleus, and a cloud of much lighter particles

  around it, called electrons.


  An atom is mostly space.


  A bond is an attraction between two atoms that holds them together.


  A group of atoms held together by bonds is a molecule. Sugar is a molecule.


  In an ionic bond, one atom hands an electron over to the other. One is left positive, the other

  negative, and opposite charges pull.


  In a covalent bond, the two atoms share a pair of electrons instead of handing them over.


  The energy in a food is held in the arrangement of its atoms. It is in which atom is bonded to

  which, and not in the atoms themselves.


  Pulling a bond apart costs energy. Making a bond gives energy back.


  Most people have that the wrong way round, so say it out loud. Breaking costs. Making pays.


  Strong means it takes a lot of energy to break, and it means nothing else.


  When a food burns, old bonds break and new bonds form. The reaction hands you the difference

  between the two.


  If the new bonds are stronger than the old ones, more comes out than went in. That is heat you

  can measure, and it is what anyone means by the energy in a food.


  A reaction that gives heat out is exothermic. A reaction that takes heat in is endothermic.


  So the energy in a food is not a stuff sitting in it, waiting to be poured out. It is a

  difference between two sums. It shows up only when the arrangement changes.

  '
illustration.body: "Open OpenStax Chemistry 2e, section 2.3, Atomic Structure and Symbolism, at\nhttps://openstax.org/books/chemistry-2e/pages/2-3-atomic-structure-and-symbolism. Open your\nbrowser's find box. Type the words An atom is and press enter.\n\nNothing.\n\nOpen section 2.4, Chemical Formulas, at\nhttps://openstax.org/books/chemistry-2e/pages/2-4-chemical-formulas, and search inside it for\nA molecule is.\n\nNothing again.\n\nSo search that page for the word bond instead.\n\n> (A chemical bond is an attraction between atoms or ions that holds them together in a\n> molecule or a crystal.)\n\nSearch for the claim, not for the heading.\n\nOpen section 7.5, Strengths of Ionic and Covalent Bonds, at\nhttps://openstax.org/books/chemistry-2e/pages/7-5-strengths-of-ionic-and-covalent-bonds.\nSearch inside it for the word Separating.\n\n> Separating any pair of bonded atoms requires energy.\n\nPulling a bond apart costs you energy.\n\nSearch for the word released.\n\n> ...the energy released when all bonds are formed in the products.\n\nTwo energies, opposite in direction, inside one reaction. Whether the reaction gives you\nanything depends on which of the two is bigger.\n\nHydrogen gas is molecules of two hydrogen atoms, joined by one bond each. Chlorine gas is\nmolecules of two chlorine atoms, joined by one bond each. Put them together and they make\nhydrogen chloride, in which each hydrogen atom is joined to one chlorine atom.\n\nCount the bonds with a pencil. Take one hydrogen molecule and one chlorine molecule. Two bonds\nbreak: the hydrogen-to-hydrogen bond, and the chlorine-to-chlorine bond. Two bonds are then\nmade, each one hydrogen to chlorine.\n\nThe page gives you all three numbers, in kilojoules for a fixed standard amount of each.\n\n```table\nbond                    energy in kilojoules, per fixed standard amount\nhydrogen to hydrogen    436\nchlorine to chlorine    243\nhydrogen to chlorine    432\n```\n\nNone of them is the energy of a single pair of atoms.\n\nEnergy in, to break the two bonds.\n\n```working\n    436 plus 243 = 679\n```\n\nEnergy out, from making the two new bonds.\n\n```working\n    432 times 2 = 864\n```\n\nIn, minus out.\n\n```working\n    679 minus 864 = -185\n```\n\nRead the sign before you read the digits. The answer is negative, which means more came out\nthan went in. One hundred and eighty-five kilojoules left the reaction as heat.\n\nA food is molecules. Burning it breaks the bonds inside those molecules, and makes new bonds\nwith oxygen from the air. The new bonds are stronger than the old ones. So the sum runs the\nway it just ran for hydrogen and chlorine, and the difference comes out as heat.\n\nThat difference is what anybody means when they say a food contains energy.\n\nThere is no energy sitting in the food the way tea sits in a cup.\n\nChange the arrangement and you collect the difference. Leave it alone and there is nothing\nthere to collect.\n\nWhen somebody tells you that a substance releases energy, ask two questions. What gets broken,\nand what gets made. If the answer names only one of the two, you have been handed half a sum.\n"
illustration.analogy_breaks_when: 'The three bond energies are quoted for a fixed counted amount of each substance, not for one

  pair of atoms. So 185 kilojoules is not what one molecule gives up. No figure here is the

  energy of a single bond you could point at.


  The sum is approximate and the book says so. It gives the difference as approximately the net

  change, not as the net change. Two bonds with the same name in two different molecules are not

  quite the same bond, and the tables carry averages.


  Hydrogen and chlorine is not a food. Nothing about the shape of the sum changes.


  The sum gives you the size of an energy change and tells you nothing about whether the change

  happens, or how fast. A mixture can sit on a shelf for years, unchanged, with a large release

  waiting inside it. Something has to start it.


  And it tells you nothing about where the energy goes after it leaves.

  '
must_know[0].point: 'Energy is not a substance sitting inside a food. So refuse any claim that something can

  release a food''s energy without changing what its molecules are.

  '
must_know[1].point: 'A strong bond is one that takes a lot of energy to break, and that is all the word means. It

  does not mean the bond is holding more energy for you.

  '
must_know[2].point: 'When someone gives you a figure for what a reaction releases, ask what was broken and what

  was made. A figure that names only one side of that is half a sum.

  '
must_know[3].point: 'Bond energies give you the size of an energy change and nothing else. They cannot tell you

  whether the reaction happens, or how fast, or what starts it.

  '
must_know[4].point: 'Teach the two-sided sum before you teach a single step of metabolism. Break, then make, then

  subtract.

  '
must_know[5].point: 'A substance that goes into a person and comes out unchanged has supplied nothing, whatever

  the bonds inside it are worth.

  '
