definition.text: 'A cell is the smallest unit of a living thing, and cells are the basic building blocks of all organisms.


  The nucleus houses the cell''s DNA. Ribosomes build proteins. Mitochondria are responsible for making adenosine triphosphate (ATP), which is the cell''s main energy-carrying molecule.


  A phospholipid has a head area that is hydrophilic, meaning it mixes with water, and a tail area that is hydrophobic, meaning it does not. In water these molecules arrange themselves with their hydrophobic tails facing each other and their hydrophilic heads facing out.


  The plasma membrane controls the passage of organic molecules, ions, water and oxygen into and out of the cell.


  A protein''s shape is critical to its function, and many different types of chemical bond maintain that shape. Changes in temperature, acidity or exposure to chemicals may change the shape permanently, which loses the function. Enzymes are proteins that act as catalysts in biochemical reactions.


  Internal receptors sit in the cytoplasm and respond to hydrophobic ligand molecules that are able to travel across the plasma membrane. Cell-surface receptors span the plasma membrane and perform signal transduction, by which a signal outside the cell is converted into a signal inside it. Binding changes the shape of the receptor, and the changed shape is what does the work.

  '
simplified_explanation: 'Everything alive is made of cells.


  A cell is a bag of watery jelly with a skin round it. The skin has a name: the plasma membrane.


  The nucleus is the compartment that holds the cell''s instructions, which are written in its DNA.


  The ribosomes are the machines that build proteins.


  The mitochondria make a small molecule called adenosine triphosphate, written ATP, which the cell uses to carry energy from one reaction to another.


  The membrane is built out of one kind of molecule, and that molecule has two ends that behave

  differently. One end mixes with water. The other end will not mix with water and mixes with

  grease instead.


  Put a lot of them in water and they sort themselves out. The water-hating ends turn inwards and huddle together, away from the water. The water-loving ends turn outwards, where the water is. What you get is a sheet two molecules thick.


  So a membrane is wet on both faces and greasy in the middle.


  A molecule that dissolves in grease can slip through the greasy middle on its own. A molecule that dissolves in water cannot, and has to be carried across. The carrying is done by proteins that sit in the membrane and take things through.


  A protein is a chain. The chain folds up into a shape, and the shape is decided by the order of the links.


  **The shape is what the protein does.** Not the chain, the shape. Change the shape and you change what it does, and a shape that is pulled apart far enough stops working altogether. Heat does that. So does acid.


  An enzyme is a protein that makes one particular reaction go faster. It works because of its shape: the thing it acts on fits into it. Every enzyme speeds its reaction up.


  The molecule that fits is called the ligand. The protein it fits into is called the receptor.


  When the ligand sits in the receptor, the receptor changes shape. The new shape does something the old shape could not do.


  A water-hating ligand crosses the membrane on its own, so its receptor can sit inside the cell.

  A water-loving ligand cannot cross, so its receptor sits in the membrane itself, sticking out on

  both sides. The ligand lands on the outside end and never enters. The inside end changes shape

  and carries the message in.

  '
illustration.body: 'Nearly everyone who has met the membrane once remembers the phrase selectively permeable. Go

  and find it.


  Open OpenStax Biology 2e, section 5.1, Components and Structure, at

  https://openstax.org/books/biology-2e/pages/5-1-components-and-structure. Open your browser''s

  find box. Type the words selectively permeable and press enter.


  Nothing. The section that describes the membrane does not use the phrase anywhere.


  Now search the same page for the word exclude. One sentence comes up.


  > Cells exclude some substances, take in others, and excrete still others, all in controlled

  > quantities.


  It says the membrane picks.


  Take a glass of water. Pour in a spoonful of cooking oil. Stir it hard, then stop and watch. The oil comes back together and sits apart from the water.


  Now read the phospholipid paragraph on the page you already have open, with that glass in front

  of you.


  > ...phospholipids arrange themselves with their hydrophobic tails facing each other and their

  > hydrophilic heads facing out.


  Hydrophilic means water-loving, and hydrophobic means water-hating.


  Draw the result on paper. Two rows of molecules. Tails pointing at each other in the middle, heads facing out on both sides.


  Open section 9.1, Signaling Molecules and Cellular Receptors, at https://openstax.org/books/biology-2e/pages/9-1-signaling-molecules-and-cellular-receptors. Search inside it for the word hydrophobic.


  > ...respond to hydrophobic ligand molecules that are able to travel across the plasma

  > membrane.


  Water-hating molecules travel across the membrane.


  Take any claim that a substance acts on the body and ask three questions in order. What is the molecule? What does it bind? What changes when it binds?


  The third question is the one that does the work. A claim that cannot answer it has described

  something that was present, not something that acted.

  '
illustration.analogy_breaks_when: 'The glass of oil and water gets you the greasy middle and nothing else. A membrane is not a puddle.


  The membrane controls the passage of water too, and water is the most water-loving thing there is.


  A lock does not change shape when the key turns, and a receptor does, and that change is the entire point.


  Binding and acting are not the same event. Something can sit in a receptor and do nothing, and something can sit in it and stop the usual ligand getting in.


  This whole section is about what can happen and never about how much. Any question that has a number in its answer is outside it.

  '
must_know[0].point: 'A substance being present in a tissue is not the same as it acting there. So ask which cells carry the receptor before you accept any claim about where a medicine works.

  '
must_know[1].point: 'Ask three questions of every mechanism claim, in this order. What is the molecule, what does it bind, and what changes when it binds.

  '
must_know[2].point: 'Binding and acting are two claims, not one. A molecule can sit in a receptor and do nothing, or sit in it and keep the usual ligand out.

  '
must_know[3].point: 'A protein''s shape is what it does, so anything that changes the shape changes the job. So before you accept that a protein can be given by mouth, ask what the stomach does to it.

  '
must_know[4].point: 'Refuse any claim that a mechanism settles whether an effect is big enough to matter. A mechanism tells you what can happen and never how much.

  '
must_know[5].point: 'When a product claims to work at the cellular level, ask what it binds and what changes when it does. The phrase names no molecule and no receptor, so it commits to nothing.

  '
must_know[6].point: 'Teach the two receptor places before you teach a single drug. A water-hating signal crosses the membrane and meets its receptor inside; everything else is handled by a receptor built through the wall.

  '
must_know[7].point: 'An enzyme makes one reaction go faster, and its shape is the reason. Ask which enzyme, and ask how the rate was measured.

  '
