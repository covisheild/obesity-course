"definition.text": |
  A measurement is a number together with a unit. The unit names the agreed quantity the
  measurement is compared against, and the number says how many of that agreed quantity the
  measured thing amounts to. A number given without its unit is not a measurement.

  The International System of Units (SI) is the system of units in which the numerical values of
  seven defining constants are fixed exactly. Since 20 May 2019 all SI units are defined in terms
  of constants that describe the natural world.

  Seven base units keep their role inside that system: the second, the metre, the kilogram, the
  ampere, the kelvin, the mole and the candela.

  A derived unit is a product of powers of the base units. The joule, written J, is the SI unit
  of energy, and J = kg m^2 s^-2.
"simplified_explanation": |
  A measurement has two halves. A number, and a unit. Take one half away and the other half says
  nothing.

  Somebody writes 5 in a register. Five what? Five grams and five kilograms are a thousand times
  apart. The 5 on its own cannot tell you which one was meant.

  A unit is an agreed amount that everybody measures against. One metre is an agreed length. A room
  that is 4 metres long holds four of those agreed lengths, laid end to end.

  The agreement is only worth something if it is the same agreement everywhere. That is the job the
  SI does.

  Since 20 May 2019 the SI has been built on seven numbers that are fixed by decision. One of them
  is the speed of light in vacuum, fixed at 299 792 458 metres per second. The number is agreed,
  and the metre is then whatever makes that number come out right.

  A metre in Raipur is a metre in Paris because both follow from the same fixed numbers.

  Seven units are called base units. They are the second, the metre, the kilogram, the ampere, the
  kelvin, the mole and the candela.

  Every other unit is built out of those seven by multiplying and dividing. A unit built that way
  is called a derived unit.

  Speed is a length divided by a time. So its unit is metres divided by seconds, written m/s.

  Area is a length times a length. So its unit is metres times metres, written m^2 and said as
  square metres.

  Energy in the SI is the joule, written J. The SI states that J = kg m^2 s^-2.

  Read that slowly, because it is a sentence and not a code to memorise. It says a joule is one
  kilogram, times one square metre, divided by one second squared. The unit tells you what kind of
  thing energy is.
"illustration.body": |
  Start with the failure, because it is the one that reaches real people.

  A strip of tablets is labelled 500. Five hundred what? Five hundred milligrams and five hundred
  micrograms are both ordinary strengths, and one is a thousand times the other. The number on
  its own cannot settle it. So you go and find the unit, every time, and you never carry a bare
  number into a calculation.

  Now build some units yourself. You only need two to start: the metre for length and the second
  for time.

  Speed is how far, divided by how long. So its unit is a length divided by a time.

  ```working
      metres divided by seconds
      = m/s
  ```

  Area is a length times a length.

  ```working
      metres times metres
      = m^2
  ```

  Volume is a length three times over, which gives m^3. Density is a mass divided by a volume,
  which gives kg/m^3. Nothing there was memorised. Each unit was assembled out of the base units
  by multiplying and dividing, and you can assemble any of them the same way.

  Now go and read the SI's own words. The page is called The International System of Units (SI),
  and it is published by the International Bureau of Weights and Measures (BIPM) at
  https://www.bipm.org/en/measurement-units. Open it and search inside the page for "J =".

  You get this line.

  ```working
      J = kg m2 s-2
  ```

  That is the page's way of writing what this book writes as J = kg m^2 s^-2. The page sets its
  exponents on one line; the meaning is the same.

  Say it out loud as a sentence. A joule is a kilogram, times a square metre, divided by a second
  squared. That is not a fact about the joule you have to hold in your head. It is what energy is
  made of, written down.

  Search the same page for "299 792" and you land on the second thing worth seeing. The speed of
  light in vacuum is fixed at 299 792 458 metres per second. Just above it sits a frequency of
  the caesium-133 atom, fixed at 9 192 631 770 hertz, and one hertz means once per second. The
  second comes from that frequency, and the metre comes from that speed together with the second.
  A speed on its own fixes no length. Fix the numbers and you have fixed the units.

  Last, the prefixes, because you will almost never meet a bare base unit in practice.

  A prefix is a name for a power of ten stuck on the front of a unit. It changes the size of the
  unit and nothing else.

  The prefixes are decided, the way the units are decided. The SI is defined by the SI Brochure,
  published by the BIPM, and the full list of prefixes is set out there. Four prefixes do nearly
  all the work in this book.

  ```table
      prefix  multiply the unit by  so
      kilo    10^3                  one kilometre is 1,000 metres
      centi   10^-2                 one centimetre is 0.01 metres
      milli   10^-3                 one milligram is 0.001 grams
      micro   10^-6                 one microgram is 0.000001 grams
  ```

  The symbol for kilo is k, for centi is c and for milli is m. The symbol for micro is the Greek
  letter mu, written µ.

  Watch that milli, because the letter m does two jobs. On its own it is the metre. In front of
  another unit it is milli, a thousandth. So mg is a milligram, and it has nothing to do with
  length.

  Two more units you will meet every day are the minute and the hour. Neither is one of the seven
  base units, and neither is built out of them the way a derived unit is. You will use both
  anyway, because each has a fixed relation to the second. One minute is 60 seconds. One hour is
  3,600 seconds. Which units outside the SI are accepted for use alongside it is another thing the
  SI Brochure settles.
"illustration.analogy_breaks_when": |
  Building a unit out of base units tells you what kind of quantity you are holding. It tells you
  nothing about whether the number beside it is right.

  A weighing scale that reads two kilograms heavy reports in perfectly good kilograms. The SI
  fixes the size of the kilogram. It says nothing about the scale in your clinic.

  And all of this is decided, not discovered. The BIPM's member states voted on 16 November 2018
  to change how the SI is defined, and they can vote again. Anything in this section that starts
  with "the SI says" is true as of today, and is the kind of statement that carries a date.
"must_know[0].point": |
  A number with no unit beside it is not a small gap in the record. It is not a measurement at
  all. Send it back for the unit. Never work out which unit was meant from how big the number
  looks.
"must_know[1].point": |
  Read the unit off the label or the report before you read the number. Five hundred micrograms
  and five hundred milligrams look the same at the moment you are reading fast, and they are a
  thousand times apart.
"must_know[2].point": |
  The letter m does two jobs, and mixing them is a thousand-fold error. On its own m is the
  metre; in front of another unit it is milli, meaning a thousandth. So mg is a milligram.
"must_know[3].point": |
  A derived unit is a recipe rather than a label. Written out in base units, it tells you what
  kind of quantity you are holding. When an unfamiliar quantity turns up in a paper,
  read its unit before you read its value.
"must_know[4].point": |
  The SI fixes every unit through seven constants with exact values. One of them is the speed of
  light in vacuum, at 299 792 458 metres per second. So a disagreement between two laboratories is
  never about the size of the unit. Check which unit each one reported in, because that is where
  the difference will be.
"must_know[5].point": |
  Getting the units right proves nothing about accuracy. A machine reading twice the true value still
  reports in correct units. So a unit check is never the last check you run on a
  number you will act on.
