definition.text: 'Combustion is burning: a substance combines vigorously with oxygen.


  It is a strong steel container, the bomb, which holds the sample and is itself submerged in water. The bomb is filled with oxygen at high pressure and a small electrical spark ignites the sample.


  A substance whose energy is already known is burned in it, and the rise that produces is measured. The known energy divided by that rise is the calorimeter''s energy equivalent, in joules for each degree. Afterwards any rise measured in that calorimeter, multiplied by that same energy equivalent, gives the energy the reaction released.


  The Food and Agriculture Organization of the United Nations calls this the ingested energy, or the gross energy.


  Not all of it is available to a person. A small amount is lost from the body surface. What remains after those losses is metabolizable energy.


  What the report has no step for anywhere is digestible energy.


  The energy figure on a food label is not a burning measurement. Those averages are the Atwater general factors. There is one value for each of the three, used regardless of the food it is found in.


  The three values are 17 kilojoules for each gram of protein, 37 for each gram of fat and 17

  for each gram of carbohydrate. In kilocalories for each gram the same three values are 4.0,

  9.0 and 4.0.


  One thing the general system does not do is take fibre out. Atwater''s carbohydrate is determined by difference, and thus includes fibre.


  To work out the energy content of a food, the quantities of carbohydrate, protein and fat are

  each multiplied by the factor for that one, and the products are added.

  '
simplified_explanation: "You cannot weigh energy. What you can do is burn the food and watch a thermometer.\n\nIt is a thick steel pot, sealed, sitting in a tank of water. You put a weighed scrap of dried food inside, fill the pot with oxygen, seal it, and set it off with an electric spark. A thermometer in the water reads higher than it did before.\n\nNothing about a temperature rise tells you how many joules it took. That depends on the machine: how much steel, how much water, how it is built.\n\n**You burn something whose energy you already know.** You watch how far the thermometer goes up.\nThen you divide.\n\n```working\n    the energy equivalent = the known energy, divided by the rise it caused\n```\n\nCall it the calorimeter's energy equivalent. Doing this is called calibrating the machine, and it is done again before each set of measurements rather than once when the machine is bought.\n\nAfter that the work is one multiplication.\n\n```working\n    the energy released = the rise, times the energy equivalent\n```\n\nBurn a known thing to get the constant, then burn the unknown thing and multiply.\n\nThe Food and Agriculture Organization of the United Nations calls it the gross energy.\n\nA person is not a furnace.\n\nSome food is not digested and absorbed at all, and leaves in the faeces, carrying its energy with it. Some unabsorbed carbohydrate is fermented in the large intestine and leaves as gas, which also carries energy. Some of what is absorbed leaves in the urine, mostly as the waste left when protein is broken down and not finished off.\n\nIt is called metabolizable energy, spelt with a z in the report that names it.\n\nBelow that the report carries one more step, called net metabolizable energy. What the report has no step for anywhere is digestible energy.\n\nThe number on a packet was almost certainly never measured by burning anything. It was calculated.\n\nThe fixed figures are called the Atwater general factors.\n\n```table\nwhat it is     kilojoules a gram  kilocalories a gram\nprotein        17                 4.0\nfat            37                 9.0\ncarbohydrate   17                 4.0\n```\n\nThose factors already have the losses taken out of them.\n\nIt is a good estimate and it is not a measurement of that packet.\n\nBurning tells you what is in the food. The factors tell you what an average person would get out of it. Neither one tells you anything about the person in front of you.\n"
illustration.body: "Open OpenStax Chemistry 2e, section 5.2, Calorimetry, at\nhttps://openstax.org/books/chemistry-2e/pages/5-2-calorimetry. Open your browser's find box and\nsearch inside the page for the word bomb.\n\n> The sample is placed in the bomb, which is then filled with oxygen at high pressure. A small\n> electrical spark is used to ignite the sample.\n\nNow search the same page for the word calibration, because that is the word this whole section\nturns on.\n\n> The calibration is generally performed each time before the calorimeter is used to gather\n> research data.\n\nEach time. Not once when the machine arrives.\n\nHow many joules one degree is worth depends on this machine.\n\nEvery figure in this calorimeter example is made up.\n\nThe known sample releases 26,400 joules. The thermometer goes up by 2.2 degrees Celsius, which\nis the ordinary degree marked on a kitchen thermometer.\n\nDivide the energy by the rise.\n\n```working\n    26,400 divided by 2.2 = 12,000\n```\n\nThat is the calorimeter's energy equivalent, and it is the only thing you needed.\n\nA dried pellet of food weighing 1.50 grams goes in, and the thermometer goes up by 1.85 degrees.\n\n```working\n    12,000 times 1.85 = 22,200\n```\n\nPut it in kilojoules, because nobody quotes food in joules.\n\n```working\n    22,200 divided by 1,000 = 22.2\n```\n\nNow for each gram, since the pellet weighed 1.50 grams.\n\n```working\n    22.2 divided by 1.50 = 14.8\n```\n\nTurn it into the unit food is quoted in, using the 4.184 from the section on energy units.\n\n```working\n    14.8 divided by 4.184 = 3.5373\n```\n\nAbout 3.5 kilocalories in each gram.\n\nThe question nobody asks is what it is a number about.\n\nThe Food and Agriculture Organization of the United Nations published a report on this in 2003. Open chapter 3 of it at https://www.fao.org/4/y5022e/y5022e04.htm.\n\nAlmost everybody who has met this once remembers three steps: gross energy, then digestible energy, then metabolisable energy. Search the page for digestible energy.\n\nThe phrase is not in the chapter.\n\nSearch for gross energy instead.\n\n> Food that is ingested contains energy - the maximum amount being reflected in the heat that\n> is measured after complete combustion to carbon dioxide (CO2) and water in a bomb\n> calorimeter. This energy is referred to as ingested energy (IE) or gross energy (GE).\n\nThat is your burning measurement, named.\n\n> The energy that remains after accounting for the important losses is known as\n> “metabolizable energy” (ME) (see Figure 3.1).\n\nTake those off metabolizable energy and the report names what is left.\n\n> ...the result is an expression of the energy content of food, which is referred to as net\n> metabolizable energy (NME).\n\nSo the report's cascade runs gross energy, then metabolizable energy, then net metabolizable energy. The digestible-energy step is nowhere in the report at all.\n\nSearch the same chapter for Atwater.\n\n> The energy values are 17 kJ/g (4.0 kcal/g) for protein, 37 kJ/g (9.0 kcal/g) for fat and 17\n> kJ/g (4.0 kcal/g) for carbohydrates.\n\nOpen the National Food Security Act, 2013 at\nhttps://indiacode.gov.in/handle/123456789/496105 and go to Schedule II. Find the row for upper\nprimary classes. The hot cooked meal is set at 700 in the energy column, and at 20 grams in the\nprotein column.\n\nWork out how much of that 700 the protein standard accounts for.\n\n```working\n    20 times 4.0 = 80\n```\n\nAs a share of the meal, divide the part by the whole.\n\n```working\n    80 divided by 700 = 0.1142857143\n```\n\nRound it to three figures and you have 0.114. Multiply by a hundred to turn the proportion into a percentage.\n\n```working\n    0.114 times 100 = 11.4\n```\n\nAbout eleven per cent. The other eight ninths have to come from fat and carbohydrate, and Schedule II sets no figure for either of them.\n\nNow do the same sum in kilojoules and watch something strange happen. The factor for protein\nin kilojoules is 17.\n\n```working\n    20 times 17 = 340\n```\n\nAnd the 700 kilocalories, in kilojoules:\n\n```working\n    700 times 4.184 = 2,928.8\n```\n\n```working\n    340 divided by 2,928.8 = 0.116\n```\n\n```working\n    0.116 times 100 = 11.6\n```\n\nEleven point six per cent this time, against eleven point four the other way.\n\nThe report's kilojoule column and its kilocalorie column were each rounded on their own, and they are not exact conversions of one another. A footnote on the same page gives protein's precise value as 16.7 kilojoules a gram, and that one does convert properly.\n\n```working\n    16.7 divided by 4.184 = 3.991\n```\n\nThe 17 is the rounded figure, and rounding it is what moved your answer in the third digit.\n\nYou do not have a measurement of any meal. Schedule II says what a meal must meet, not what any\nmeal contained.\n\nYou do not have what reaches a child either, even if a meal met the standard exactly.\n\nThis book does not carry either number, and you should not supply one from memory.\n\nEvery time somebody hands you a food-energy figure, ask three questions in order. Was it burnt or was it calculated. Is it the gross figure or the metabolizable one. And is it a standard somebody set, or a measurement somebody took.\n"
illustration.analogy_breaks_when: "Every figure in the calorimeter example is made up. Only the 4.184, the Atwater factors and the two Schedule II figures come from a source.\n\nThe energy equivalent belongs to one calorimeter on one day. Carry it to another machine and every answer it gives is wrong, and wrong silently, because the arithmetic still works.\n\nThe method needs the sample to burn completely. Nothing in the arithmetic will tell you it happened.\n\nThe Atwater factors are averages over foods. So the method cannot tell apart two foods with the same grams of protein, fat and carbohydrate.\n\nThey do not pair up for fat. Fat's precise value is 37.4 kilojoules a gram, and the report prints 9.0 kilocalories beside it.\n\n```working\n    37.4 divided by 4.184 = 8.9388\n    9.0 times 4.184 = 37.656\n```\n\nRead each column as its own set of numbers and do not work one out from the other.\n\nThe eleven per cent figure is a share of two numbers the Act sets, not a share of anything a child ate.\n\nNone of the arithmetic here says anything about a person. This book answers none of them.\n"
must_know[0].point: 'A bomb calorimeter figure is the food''s total combustible energy. It is not the energy a person gets. So never quote a burning figure as what somebody received.

  '
must_know[1].point: 'That report has no digestible-energy step anywhere. A third step sits below, net metabolizable energy. Object to the word digestible, which is not in it anywhere.

  '
must_know[2].point: 'A temperature rise is not an energy until the machine that produced it has been calibrated. The calibration is repeated before each set of runs, not done once.

  '
must_know[3].point: 'They are 17 kilojoules, or 4.0 kilocalories, for each gram of protein. For fat they are 37 or 9.0, and for carbohydrate 17 or 4.0.

  '
must_know[4].point: 'Those factors use one value for each of protein, fat and carbohydrate, whatever the food. It cannot show that one food is taken up better than another.

  '
must_know[5].point: 'The energy declared on an Indian packet is worked out from the grams, not measured by burning anything. So two packets showing the same figure have been through the same arithmetic, not the same measurement.

  '
must_know[6].point: 'When a journalist gives you a food-energy figure, the useful sentence is about what it describes. Give them that line before you argue about the number itself.

  '
must_know[7].point: 'Teach the calibration before the formula. They will also carry the question to every instrument they meet afterwards: what was this measured against.

  '
