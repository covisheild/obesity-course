definition.text: 'Energy is a quantity that can be counted.


  A system is whatever has been enclosed for the purpose of an accounting. The boundary is the

  closed surface that encloses it, and the surroundings are everything outside that surface. The

  system is chosen by the person doing the accounting.


  The law of conservation of energy states that total energy is constant in any process.


  Applying that law across a boundary gives the energy balance. The energy inside the boundary at

  the end of an interval equals the energy inside at the start, plus every quantity of energy

  that crossed the boundary inwards, minus every quantity that crossed it outwards.


  A system''s energy changes only by energy crossing its boundary, because any other route would

  require the total to change. And the change in a system''s energy is fixed only once the

  boundary is fixed: two boundaries drawn around one situation give two different changes, both

  correct, because they answer two different questions.


  The balance constrains the numbers and nothing else. It does not say by which route energy

  crossed, what caused a crossing to change, or what a quantity of energy amounts to in any unit

  other than a unit of energy.

  '
simplified_explanation: "Energy is never made and never destroyed. It changes form, and it moves from one place to another, and the total stays where it was.\n\nThat sounds like a rule about the world. It is. But on its own it lets you compute nothing, because it talks about the total of\neverything, and nobody can count everything.\n\nSo here is the move that turns it into arithmetic. Draw a line round something.\n\nThe line is closed, like a circle on paper. Whatever you have drawn round is called the system. The line itself is called the\nboundary. Everything outside the line is called the surroundings.\n\nThe total for inside plus outside never changes. So if the amount inside goes up, the amount outside must have gone down by the same\namount. And the only way that happens is if energy crossed the line.\n\n**Step one. Split everything in two.** The line is closed, so every bit of energy in the world is\neither inside it or outside it. Nothing is both and nothing is neither.\n\n```working\n    the total = the amount inside, plus the amount outside\n```\n\n**Step two. Use the rule.** The total does not change over the interval you are looking at. So\nthe total at the end is the same number as the total at the start.\n\n```working\n    the amount inside at the end, plus the amount outside at the end\n    = the amount inside at the start, plus the amount outside at the start\n```\n\n**Step three. Take the starting amounts off both sides.** This is the move from the section on\nrearranging an equation, done twice. Take away \"the amount inside at the start\", then take away\n\"the amount outside at the start\". The right-hand side becomes nothing at all. The left-hand side\nnow has four pieces in it.\n\nYou may write those four pieces in any order you like. A run of adding and taking away comes out the same whatever order you do it\nin. Adding 3 and then taking away 5 lands you where taking away 5 and then adding 3 lands you. So put each end value next to its own\nstart value.\n\n```working\n    the amount inside at the end, minus the amount inside at the start,\n    plus the amount outside at the end, minus the amount outside at the start = 0\n```\n\nNow read each pair on its own. An end value minus its own start value is a change. So the first pair is the change inside, and the\nsecond pair is the change outside.\n\n```working\n    the change inside, plus the change outside = 0\n```\n\nThe two changes add to nothing. So whatever the inside gained, the outside lost, and by exactly the same amount.\n\n**Step four. Name where it went.** Energy that left the outside and arrived inside crossed the\nline inwards. Energy that went the other way crossed it outwards. There is no third possibility,\nbecause step one used up the whole world in two pieces.\n\n```working\n    the energy inside at the end = the energy inside at the start, plus everything that crossed in, minus everything that crossed out\n```\n\nNothing was assumed there except the one rule at the top and the fact that your line is closed. It is the balance line from the\nsection on stocks and flows, with energy as the stock.\n\n**Where you draw the line is your choice.** Nothing in the situation tells you where it goes. A\npan of water, a pan and its stove, a whole kitchen. Those are three different lines round one\nevent. Each gives a different answer to \"how much did the energy change?\"\n\nNone of the three is the wrong answer. They are answers to three different questions, and the question is the line.\n\nSo a number for an energy change is not finished until somebody says what it was measured round. Ask \"round what?\" before you argue\nabout the figure.\n\nThe warning is about what this line does not do. It tells you that the numbers have to add up. It does not tell you which way energy\nwent. It does not tell you why a flow changed. And it does not tell you what a heap of joules is worth in kilograms of anything.\n"
illustration.body: "Open OpenStax College Physics 2e, section 7.6, Conservation of Energy, at\nhttps://openstax.org/books/college-physics-2e/pages/7-6-conservation-of-energy. Open your browser's find box. Type the word system and press enter.\n\n> Step 1. Determine the system of interest and identify what information is given and what\n> quantity is to be calculated. A sketch will help.\n\nIt tells you to decide what the system is. It never tells you what a system is.\n\n**A system is not a thing in the world.** It is a line somebody drew. A physics book can tell\nyou about things in the world. It cannot tell you where you decided to draw your line.\n\nA small gas burner heats water in a steel pan for two minutes. The gas that burns in those two minutes releases 60,000 joules of chemical energy. Of\nthat, 42,000 joules ends up in the water and 11,000 joules ends up in the steel of the pan. The other 7,000 joules ends up in the air of the kitchen.\nThe kitchen door and window are shut for the two minutes.\n\nThose four figures are made up for this example.\n\n**Line one, round the water only.** What crossed in: 42,000 joules, from the flame and the hot\npan. What crossed out: nothing. Put that through the balance line.\n\nThe energy inside went up by 42,000 joules.\n\n**Line two, round the water and the steel pan together.** Now the 11,000 joules in the steel is\ninside your line instead of outside it. What crossed in is the 42,000 and the 11,000 together.\n\nThe energy inside went up by 53,000 joules.\n\n**Line three, round the burner, the unburnt gas, the pan and the water.** This one is\ndifferent, because the chemical energy of the gas now starts inside your line. At the start,\ninside, there are 60,000 joules sitting in the gas. At the end that gas is burnt, and what is\ninside instead is the 42,000 in the water and the 11,000 in the steel. The other 7,000 has\ncrossed the line into the kitchen air.\n\n```working\n    53000 minus 60000 = -7000\n```\n\nThe energy inside went down by 7,000 joules.\n\n**Line four, round the whole kitchen.** The door and window are shut. Nothing crossed in,\nnothing crossed out.\n\nThe energy inside did not change at all. The form changed. The total did not.\n\nPut the four side by side.\n\n```table\nwhere the line is drawn  change in the energy inside\nthe water                plus 42,000 joules\nthe water and the pan    plus 53,000 joules\nthe burner, the gas, the pan and the water  minus 7,000 joules\nthe whole kitchen        0 joules\n```\n\nFour numbers, one event, and every one of them is right.\n\nOne joule is small.\n\n> One joule is not a large amount of energy; it would lift a small 100-gram apple a distance of\n> about 1 meter.\n\nSo 60,000 joules is about what you would spend lifting that apple 60,000 times. Two minutes of a small burner.\n\nDraw the line, on paper, closed. Write on the outside of it every route by which energy can cross — the flame, the air, the light, the wire, the\nfood, the water going down the drain. Then put a number on each route, and see whether the numbers add up to the change somebody claimed.\n\nA balance that fails almost never fails because conservation failed. It fails because a route was left off the paper.\n"
illustration.analogy_breaks_when: 'No burner was measured. Only the size of the joule comes from a source.


  The shut kitchen is an idealisation and it has a time limit. Over two minutes, a closed room

  loses little enough through its walls that treating the crossing as zero is fair. Over an hour

  it is not fair, and over a day it is wrong.


  So a balance that does not close has two possible causes. Either a route was left off the

  paper, or a figure on the paper is wrong. The balance cannot tell you which.


  Conservation is exact and it is not the whole story about energy. The 7,000 joules spread

  through the kitchen air is every bit as real as the 42,000 in the water, and it will not cook

  anything. The balance counts joules. It says nothing about which joules you can still use.


  The balance holds for a person exactly as it holds for a pan. What it will not do is turn

  joules into kilograms of a body.

  '
must_know[0].point: 'An energy figure with no boundary attached is not a measurement yet. Ask "round what?" before

  you argue about the number.

  '
must_know[1].point: 'Energy is never lost, so refuse the word when somebody uses it to close an inquiry. Energy that

  has left your system is in the surroundings, by some route.

  '
must_know[2].point: 'A system gains or loses energy only by energy crossing its boundary. So every explanation of a

  change has to name a crossing.

  '
must_know[3].point: 'The balance tells you the numbers must add up. It never tells you why one of them moved. So do

  not use conservation to explain anything.

  '
must_know[4].point: 'Nothing turns joules into kilograms of a body. How much energy a kilogram of change holds

  depends on what the change is made of.

  '
must_know[5].point: 'A person is not a closed system, so "the energy has to go somewhere" is true and names nothing.

  Energy crosses a person''s line inwards in food and drink. It crosses outwards as heat, as work

  done on things around them, and in what leaves the body unabsorbed.

  '
must_know[6].point: 'Teach the line before the equation. A trainee who draws a closed boundary and lists the

  crossings can set up a problem they have never seen.

  '
must_know[7].point: 'When a claim is defended on the ground that energy is conserved, say plainly what conservation

  does. It rules things out. On its own it establishes nothing.

  '
