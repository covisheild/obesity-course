definition.text: 'The mechanical and digestive processes of the alimentary canal have one goal: to convert food

  into molecules small enough to be absorbed by the epithelial cells of the intestinal villi.

  Absorbed material leaves the gut by two different routes. Water-soluble nutrients enter the

  capillary blood in the villi and travel to the liver via the hepatic portal vein. Lipid-soluble

  nutrients diffuse through the plasma membrane, are packaged inside the cell, and enter the

  lacteals of the villi. Lymphatic vessels then carry them to the general circulation. So what

  dissolves in water reaches the liver before it reaches the rest of the body, and what dissolves

  in fat does not.


  The liver is the largest gland in the body. Besides its role in digestion it has many roles in

  metabolism and regulation. Under the hepatic portal circulation, all blood from the alimentary

  canal passes through the liver. Drugs and toxins are absorbed along with the nutrients. After

  processing what the blood brings, the liver releases the nutrients other cells need back into

  the blood. It stores excess glucose as glycogen and converts glycogen back into glucose.


  The liver''s digestive role is to produce bile and export it to the duodenum. Bile accomplishes

  the emulsification of lipids in the small intestine, which pulls large lipid globules apart

  into many tiny fragments. The gallbladder stores, concentrates and releases that bile.


  The pancreas has two separate functions. As an exocrine gland it produces pancreatic juice,

  containing digestive enzymes and bicarbonate ions, and delivers it to the duodenum through a

  duct. As an endocrine gland it secretes hormones directly into the surrounding fluid. Its

  pancreatic islets, formerly known as the islets of Langerhans, secrete glucagon, insulin,

  somatostatin and pancreatic polypeptide. The alpha cell produces glucagon and the beta cell

  produces insulin. Receptors located in the pancreas sense blood glucose levels, and the

  pancreatic cells secrete glucagon or insulin accordingly.


  An endocrine organ secretes a chemical, the hormone, into the extracellular fluid. The

  interstitial fluid and the blood vessels then transport hormones throughout the body. A hormone

  binds to receptors on target cells, inducing a characteristic response. Endocrine glands are

  ductless, which distinguishes them from exocrine glands, whose secretions leave by a duct.

  Endocrine signalling is slower than neural signalling and typically less specific: the same

  hormone may play a role in a variety of different physiological processes, depending on the

  target cells involved. Adipose tissue is among the tissues known to produce hormones.


  Elevated blood glucose stimulates the release of insulin. The primary function of insulin is to

  facilitate the uptake of glucose into body cells. It triggers movement of glucose transporter

  vesicles to the cell membrane, where the transporters are exposed and move glucose into the

  cell by facilitated diffusion. Insulin also stimulates the liver to convert excess glucose into

  glycogen for storage, and promotes triglyceride and protein synthesis. Skeletal muscle cells

  and adipose cells are the primary targets of insulin. Red blood cells, and the cells of the

  brain, liver, kidneys and the lining of the small intestine, have no insulin receptors on their

  membranes and do not require insulin for glucose uptake.


  Low blood glucose stimulates the release of glucagon. Glucagon stimulates the liver to convert

  its stores of glycogen back into glucose, which is released into the circulation. It stimulates

  the liver to take up amino acids from the blood and convert them into glucose. It also

  stimulates lipolysis, the breakdown of stored triglycerides into free fatty acids and glycerol.

  Taken together, these actions increase blood glucose levels. The secretion of both hormones is

  regulated by negative feedback: rising blood glucose inhibits further glucagon secretion, and

  falling blood glucose inhibits further insulin release.


  Glucose is required for cellular respiration and is the preferred fuel for all body cells.

  Certain key organs, including the brain, can use only glucose as an energy source, so the body

  must maintain a minimum blood glucose concentration. Glucose not immediately taken up by cells

  for fuel can be stored by the liver and muscles as glycogen, or converted to triglycerides and

  stored in the adipose tissue.


  Nothing stated here fixes how much of anything any of these organs handles. No share of energy

  expenditure, no rate and no concentration is given, and none may be taken from the text this

  account rests on.

  '
simplified_explanation: 'The section on the cell and the section on metabolism gave you a cell, and then the chemistry

  that goes on inside it. This one is about which parts of a body do which part of that work.


  Six of them matter here. The gut, the liver, the pancreas, fat tissue, muscle and the brain. Take

  them one at a time, and take the gut first, because everything starts there.


  The gut is a tube. Food goes in at the top and what is left comes out at the bottom. For the

  whole of that journey the food is still, in a real sense, outside you.


  That is not a trick of words. Until a molecule passes through the wall of the tube and into your

  blood, your body can do nothing with it.


  So the gut has one job. Cut food down until the pieces are small enough to go through the wall,

  and then let them through. The wall is not flat. It is covered in tiny fingers, and the pieces

  cross into the blood vessels inside those fingers.


  Now a thing that matters later and almost nobody is told. What dissolves in water and what

  dissolves in fat leave the gut by two different roads.


  Whatever dissolves in water goes into the blood there, and that blood runs straight to the liver.

  Whatever dissolves in fat takes a different road and joins the blood further along. So fat

  reaches the rest of the body before the liver has looked at it, and sugar does not.


  That should feel familiar. The section on the cell gave you a membrane with a greasy middle and

  two wet faces. This is the same fact, showing up at the size of an organ.


  Now the liver.


  Every drop of blood leaving the gut goes through the liver before it goes anywhere else. Not most

  of it. All of it.


  That one sentence explains most of what the liver is for. It sits in the doorway. Everything

  taken up from the gut arrives there first — the food, and also any drug and any poison that came

  in with it. The liver works on what arrives, and sends on into the blood what the rest of the

  body needs.


  It is also the near store. Sugar that nobody needs this minute is packed away there as glycogen,

  which you met in the section on metabolism. It is unpacked again when it is wanted.


  And it makes bile, which it sends down into the gut. Bile breaks a large blob of fat into many

  tiny ones, and tiny ones are what the fat-splitting tools can get at.


  Next to the liver is a small bag called the gallbladder. It holds bile, concentrates it and lets

  it out. That is all you need from it.


  Now the pancreas, and it does two completely separate jobs. Keep them apart in your head, or

  every sentence you ever read about the pancreas will confuse you.


  The first job is plumbing. The pancreas makes a juice full of enzymes and sends it down a tube

  into the gut, where the juice helps take food apart. The juice goes to where the food is.


  The second job is different. Scattered through the pancreas are small islands of another kind of

  cell. Those cells send nothing down a tube. They put chemicals straight into the blood, and two

  of those chemicals run the rest of this section.


  A chemical made in one part of the body that affects other parts some distance away is called a

  hormone. That word is the next thing to get straight.


  A hormone starts in a gland, which is an organ whose job is to make it. The gland lets it out

  into the fluid around its own cells. That fluid drains into the blood, and the blood goes

  everywhere.


  So be clear about this first. A hormone does not travel to a destination. It goes everywhere,

  past everything.


  Then how does it act in one place and not another? You already know the answer. In the section on

  the cell, a molecule acted on a cell by fitting into a receptor and changing its shape.


  That is what a hormone does. It washes past every cell in the body. It does something only where

  there is a receptor shaped to hold it.


  Two things follow, and both matter.


  First, if you want to know where a hormone acts, never ask where it went. It went everywhere. Ask

  which cells carry the receptor.


  Second, the same hormone can do different things in different places. What happens next depends

  on the cell it landed in, not on the hormone. So "this hormone does that" is an unfinished

  sentence until it names a tissue.


  Now the two hormones from the islands in the pancreas. Start with eating.


  Eat, and sugar crosses the gut wall into the blood. The amount of sugar in the blood goes up.


  The islands notice. When blood sugar is high, one kind of cell in them, called a beta cell,

  releases insulin.


  Insulin''s main job is to move glucose out of the blood and into cells. It does it the way

  everything in this course does anything. It lands on a receptor. The cell responds by bringing

  glucose-carrying proteins to its own surface, where they can take glucose in.


  Muscle cells and fat cells are the ones insulin acts on most. Insulin also tells the liver to

  pack spare glucose away as glycogen, and it pushes the building of triglyceride and of protein.

  One signal, and both stores fill.


  Now leave it a few hours, or go and do a day''s work. Blood sugar falls.


  The same islands notice that too. A different cell in them, called an alpha cell, releases a

  different hormone. Its name is glucagon.


  Glucagon does the opposite job in the same places. It tells the liver to turn its glycogen back

  into glucose and push that glucose out into the blood. It tells the liver to build new glucose

  out of amino acids. And it starts stored fat being pulled apart into its pieces, so the pieces

  can be used as fuel.


  Put the two together and you have a loop that runs in every person every day. Sugar up, insulin,

  stores fill. Sugar down, glucagon, stores empty.


  Neither half is the good half. A store that only ever filled would not be a store.


  Now the question the loop answers, and it is not the one people assume.


  Glucose is the fuel every cell prefers. But some organs can use nothing else, and the brain is

  the one that matters. So blood sugar must not be allowed to fall too far. That is what glucagon

  is there for.


  Here is the part that surprises people. The brain does not need insulin to take glucose in.

  Neither do red blood cells, the liver, the kidneys or the lining of the gut. They carry no

  insulin receptors at all, and they take glucose straight out of the blood.


  So the rule "insulin is what lets sugar into cells" is wrong about exactly the organ you would

  most want it to be right about. Muscle and fat wait for insulin. The brain does not, and it takes

  what it needs first.


  That leaves three parts to name properly.


  Fat tissue has a proper name: adipose tissue. It is where triglyceride is kept. It is one of the

  two tissues insulin acts on most. And it is not a passive bag. It makes hormones of its own and

  puts them into the blood. That makes it an organ of the same kind as the pancreas.


  Muscle is the other tissue insulin acts on most. It is a store too, and it holds glycogen, as the

  liver does.


  The brain is the one that cannot wait. It runs on glucose, it can use nothing else, and it takes

  what it needs from the blood without needing insulin. Everything else in the loop is arranged

  around keeping enough in the blood for it.


  One last thing before you leave this section. All of it is what each part does. None of it is how

  much.


  Nothing here tells you what share of a day''s energy any organ uses. Nothing here tells you how

  fast a store fills or empties, or how much of anything is in anybody''s blood. Those are

  measurements, they need studies, and a list of organs is not one.

  '
illustration.body: 'Start with a rule you are about to be handed everywhere, and break it before it sets.


  The rule is this. Insulin is what lets sugar into cells.


  You will hear it on a ward round, read it in a pamphlet and see it on a slide. Take it and run

  it forward one step.


  If insulin is what lets sugar into cells, then a person with no insulin has cells that get no

  sugar. The brain runs on sugar. So the brain should be the first thing to fail, and it should

  fail for want of a way in.


  Now go and check it.


  Open OpenStax *Anatomy and Physiology 2e*, section 17.9, *The Endocrine Pancreas*, at

  https://openstax.org/books/anatomy-and-physiology-2e/pages/17-9-the-endocrine-pancreas. Open

  your browser''s find box. Search inside the page for **insulin receptors**.


  One sentence comes up.


  > Red blood cells, as well as cells of the brain, liver, kidneys, and the lining of the small

  > intestine, do not have insulin receptors on their cell membranes and do not require insulin

  > for glucose uptake.


  Read the list again. The brain is on it. So is the liver. So is the lining of the gut.


  Your prediction was wrong, and it was wrong in the most useful way available. The rule is right

  about some cells and silent about others, and nobody told you which were which.


  So find out. Search the same page for **primary targets**.


  > ...skeletal muscle cells and adipose cells are the primary targets of insulin.


  Now the rule has a shape. Muscle and fat wait for insulin. The brain does not wait at all.


  Put one more sentence beside it, from the carbohydrate chapter of the same book. Open section

  24.2, *Carbohydrate Metabolism*, at

  https://openstax.org/books/anatomy-and-physiology-2e/pages/24-2-carbohydrate-metabolism, and

  search for **only glucose**.


  > Certain key organs, including the brain, can use only glucose as an energy source; therefore,

  > it is essential that the body maintain a minimum blood glucose concentration.


  Stop and look at what you have built out of three sentences.


  The brain can burn nothing but glucose. It takes glucose out of the blood whether or not

  insulin is there. So nothing protects the brain when blood sugar runs low except putting more

  sugar into the blood.


  And that is why there are two hormones and not one. One to put sugar away when there is plenty.

  One to get it back out when there is not.


  Here are the two, side by side.


  ```table

  hormone   released when blood sugar is  made by      what it does to the stores

  insulin   high                          beta cells   fills them

  glucagon  low                           alpha cells  empties them

  ```


  Now the clean case, and you can walk it through on paper.


  Take a person who eats a meal at one o''clock and does not eat again until eight. Nothing unusual

  happens to them. Follow the seven hours.


  One o''clock. The meal is taken apart in the gut and the pieces cross the wall. Sugar goes into

  the blood, and the blood carrying it runs first to the liver.


  Blood sugar rises. The islands in the pancreas sense it. Beta cells release insulin, and the

  insulin goes everywhere in the blood.


  It acts where there are receptors for it. Muscle cells and fat cells bring glucose carriers to

  their surface and take sugar in. The liver packs spare sugar away as glycogen. What is still

  spare after that is turned into triglyceride and stored in adipose tissue.


  Meanwhile the brain has been taking glucose out of the blood the whole time, and it never

  needed insulin to do it.


  Four o''clock. The meal is finished with. Nothing is crossing the gut wall any more. The brain

  has not stopped, and neither has anything else, so blood sugar starts to fall.


  The islands sense that too. Alpha cells release glucagon.


  The liver turns its glycogen back into glucose and pushes it out into the blood. It also starts

  building new glucose out of amino acids. And stored triglyceride begins to be pulled apart into

  its pieces, so those pieces can be burnt instead.


  Eight o''clock. Blood sugar is still in a workable range and the brain has never gone short. The

  store filled and then emptied, and the person did nothing but go about their day.


  Read that last line again, because it is the point of the whole section. **The store filling

  and the store emptying are both the mechanism working.** Neither one is a failure, and neither

  one is a success. It is a loop, and a loop that only ran one way would not be a store.


  Now here is what to carry out of this into a clinic, and it is not about hormones.


  Everything absorbed from the gut in water goes through the liver before the rest of the body

  sees it. All of it. So whenever somebody tells you that a substance taken by mouth does what

  that substance does when it is injected, you have one question ready.


  What did the liver do to it first?


  It is a question about a route, not about a chemical, and it applies to a drug, a supplement

  and a nutrient alike. The answer is often that nobody checked.

  '
illustration.analogy_breaks_when: 'Six organs is a working list and not the whole body. The kidneys, the stomach, the thyroid and

  others all have a hand in this. Leaving them out is a decision about what this course needs

  next, not a statement that they do nothing.


  The words fills and empties in the table are directions. The table gives no amount, no speed

  and no threshold at which anything happens.


  Insulin and glucagon are not the only hormones the islands make, and they are not the only

  hormones acting on these stores. These two were chosen because they run opposite ways, which

  makes the loop visible.


  The brain not needing insulin does not mean the brain is untouched by insulin. What the source

  establishes is narrower: it takes glucose without it.


  The two roads out of the gut describe a route and nothing else. They say nothing about how much

  of either kind of nutrient arrives, and nothing about how much the liver changes before passing

  anything on.


  The seven hours are a shape, not a measurement. No time in that walk-through is sourced. The

  order of events is what the sources carry. When each step happens in a real person is a

  measured quantity, and this section does not hold one.


  Everything about these organs here is qualitative. There is no organ''s share of energy use, no

  concentration in blood, no rate and no dose. Any question whose answer is a number is outside

  this section.


  And all of it describes a body in which the loop is working as the sources describe. What

  changes when part of the loop stops working is a later subject, and nothing here settles it.

  '
must_know[0].point: '"Insulin is what lets sugar into cells" is wrong for several of the cells that matter most. The

  brain, the liver, the kidneys, red blood cells and the lining of the gut carry no insulin

  receptors and take glucose without it. So make any claim about insulin name its tissue. Muscle

  and fat are the cells it acts on most, and the brain is not one of them.

  '
must_know[1].point: 'A hormone does not travel to a target. It goes everywhere in the blood and acts where a

  receptor holds it. So never ask where a hormone went. Ask which cells carry the receptor, and

  what those cells do when it binds.

  '
must_know[2].point: 'The same hormone can do different jobs in different tissues, because what happens next is

  decided by the cell and not by the hormone. So "this hormone causes that" is unfinished until

  it names a tissue. Ask for the tissue before you accept the claim.

  '
must_know[3].point: 'Everything taken up from the gut in water passes through the liver before the rest of the body

  sees it. All of it, every time. So when somebody says a substance taken by mouth does what the

  same substance does when injected, ask what the liver did to it first. The answer is often that

  nobody looked.

  '
must_know[4].point: 'A store filling and a store emptying are both the mechanism working. Insulin fills, glucagon

  empties, and both run in the same person every day. So when weight comes back after it fell,

  say what the section has given you. A store fills under one signal and empties under another,

  and that loop runs the same way in every person. This section does not tell you which signals,

  or by how much. And it never licenses a sentence about the person''s character.

  '
must_know[5].point: 'Adipose tissue makes hormones of its own and puts them into the blood. That makes it an organ

  with a job, not a bag that things end up in. Say so in public, because it is accurate and it

  changes what the rest of the conversation can be about.

  '
must_know[6].point: 'The pancreas does two separate jobs and a trainee who merges them misreads every pancreas

  sentence after that. One job sends a juice full of enzymes down a tube into the gut. The other

  puts hormones straight into the blood. Teach the two apart, on separate halves of the board.

  '
must_know[7].point: 'Naming what an organ does never tells you how much of anything it does. Nothing here carries an

  organ''s share of energy use, a concentration in blood, or a rate. So none of this can settle

  where most of the energy in a body goes. Refuse any argument that uses it that way.

  '
