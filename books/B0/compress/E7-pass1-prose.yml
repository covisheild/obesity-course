definition.text: 'DNA is a molecule built from repeating units called nucleotides. The base is one of four — adenine, guanine, cytosine and thymine, written A, G, C and T.


  A DNA molecule is two strands twisted around each other into a right-handed helix. A pairs with T, and C pairs with G. Bases that pair in this way are called complementary. Because the pairing is fixed, the order of the bases along one strand fixes the order along the other.


  Genes are carried on chromosomes. An organism holding two matching copies of each chromosome, one inherited from each parent, is diploid. The gene that encodes a protein determines the order of amino acids in that protein.


  Where one gene exists in more than one version, the versions are called alleles.


  The traits an organism visibly expresses are its phenotype. Its underlying genetic make-up, counting both the alleles that are expressed and those that are not, is its genotype.


  Everything above describes the case in which a single gene controls a single characteristic. A gene fixes the order of amino acids in a protein. It does not by itself fix when that protein is made. Whether the protein works once made depends on the conditions it sits in.

  '
simplified_explanation: 'Each unit carries one part that matters here: a base. There are four bases and they have names. Adenine, guanine, cytosine and thymine. They are written A, G, C and T, and that is how you will meet them.


  So a strand of DNA is a long line of letters. The order of those letters is the information.


  DNA is not one strand. It is two, twisted around each other, which is why you have seen it drawn as a spiral staircase.


  Each letter on one strand sits opposite one particular letter on the other. A always faces T. C always faces G. A pair that goes together this way is called complementary — a word meaning each one completes the other.


  If you know one strand, you know the other. That is how a cell makes a second copy when it divides, and it is how a copy gets into an egg and a sperm.


  What a gene does is this: it fixes the order of the building blocks in one protein. The protein is the thing that goes and does the work in the body.


  You get two copies of each chromosome, one from your mother and one from your father. So you carry two copies of each gene, not one.


  Where a gene comes in more than one version, the versions are called alleles.


  What you can see about a person — the traits they show — is their phenotype. What they actually carry in their DNA, including the alleles that are not showing, is their genotype.


  For some genes, one allele is dominant and the other recessive. Dominant means it shows whenever it is present. Recessive means it shows only when both copies are that version.


  So a person with two dominant copies and a person with one of each look exactly alike. Same phenotype. Different genotype. You cannot get from what you see to what they carry.


  Everything above is about one gene controlling one characteristic. It is describing a case.


  So do not carry the picture over to a human trait and assume it holds.


  A gene fixes the order of parts in a protein. It does not fix when that protein gets made.


  A signal reaches a cell and crosses into it. Inside, it lands on a receptor, exactly as the section on the cell showed you. The receptor then sets the making of a protein going. That is one route.


  Whether it works depends on where it is.


  So the chain from a letter in DNA to a thing that happens in a person has several steps in it. "It is in her genes" names the first step and says nothing about the rest.

  '
illustration.body: 'Open OpenStax *Biology 2e*, section 14.2, *DNA Structure and Sequencing*, at https://openstax.org/books/biology-2e/pages/14-2-dna-structure-and-sequencing. Search inside the page for the word **gene**.


  You will find it twice and neither one is a definition. The section that tells you what DNA is made of, and how the two strands pair, never says what a gene is.


  Now do the same search on the genetics section. Open section 12.2, *Characteristics and Traits*, at https://openstax.org/books/biology-2e/pages/12-2-characteristics-and-traits. Genotype and phenotype are defined there.


  When you want a definition, search the page for the word before you cite it. A section title tells you what a page is about. It does not tell you what the page says.


  Take a gene that comes in two versions and call them **A** and **a**. Capital A is the dominant one, small a the recessive one. Everyone carries two copies, so there are three ways to be:


  ```table

  what the person carries  what shows

  A and A                  the A trait

  A and a                  the A trait

  a and a                  the a trait

  ```


  Two different people, carrying different things, showing the same thing. Look at them and you cannot tell them apart.


  A person is in front of you showing the A trait. What do they carry? You do not know. They are the first row or the second row and nothing you can see decides it.


  > It runs in her family, so it is genetic, so there is not much point.


  *It runs in her family.* That is an observation and it may well be right. Families share more than DNA. A trait appearing in several members of one family is consistent with shared alleles. It is just as consistent with shared circumstances.


  *So it is genetic.* This is the step that does not follow, and nothing in this section supports it. It gives you no way at all to move from a family pattern to a cause.


  *So there is not much point.* This is the step that does harm, and it is wrong for a reason you now hold. There are several steps between the letters and the person, and every one of them answers to something.


  So the reply is not "no, it is not genetic". You do not know that either. The reply is that the sentence has three claims in it. Only the first has been observed. The third does not follow from either of the others.

  '
illustration.analogy_breaks_when: 'Do not take the three-row table to a trait and assume it has three rows.


  Not every gene works by one version hiding the other.


  The A and a labels are letters on a page. They carry no quantity.

  '
must_know[0].point: 'Carrying a gene variant is one claim. Having a fixed outcome is another, and the second does not follow from the first. A gene fixes the order of parts in a protein. It does not fix when that protein gets made.

  '
must_know[1].point: 'A trait showing up in several members of one family is an observation, not a cause. Families share alleles and they also share a kitchen, a work schedule, a food budget and a neighbourhood.

  '
must_know[2].point: 'Two people with different genotypes can show the same phenotype, so what you can see about a person does not fix what they carry.

  '
must_know[3].point: 'What this section gives you about dominant and recessive alleles is one case. So do not use it to say how many genes lie behind a trait in a person. And do not use it to say that a trait is or is not largely inherited. Both of those need a study that measured it.

  '
must_know[4].point: 'Call a variant a variant. Calling a person''s variant a defect or a fault adds a judgement the biology does not carry. A patient hears that word exactly as it sounds.

  '
must_know[5].point: 'Search the page for the word before you cite a source for a definition. A title tells you the topic and not the contents.

  '
must_know[6].point: 'When a journalist asks whether obesity is genetic, do not answer yes or no. Say that a gene sets the order of parts in a protein. Say that several steps sit between that and a person, and that each step answers to something. Then say what would settle the actual question, which is a study and not an opinion.

  '
must_know[7].point: 'One sentence hides three claims: "it runs in the family, so it is genetic, so there is not much point". Teach a trainee to write the three out on separate lines. Set out separately on the page, the second and third are visibly unsupported.

  '
