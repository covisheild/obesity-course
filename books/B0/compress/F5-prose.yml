definition.text: 'In India the Constitution divides the power to make law from the power to apply it.


  Parliament and the State Legislatures enact statutes. Which of them may legislate on a given

  subject is fixed by Article 246 together with the Seventh Schedule, which sorts subjects into a

  Union List, a State List and a Concurrent List.


  The executive carries statutes out. That means the President, and beneath the President the

  ministries and departments; the executive power of the Union is vested in the President by

  Article 53.


  The courts interpret statutes, and they can be moved directly against unlawful state action —

  the Supreme Court under Article 32, a High Court under Article 226.


  A statute may also hand onward a narrow power to write the detail it deliberately left blank.

  The Central Government may make rules. A body that the statute creates may make regulations.

  Both are written by the executive rather than by a legislature, and they bind because a statute

  said they may.

  '
simplified_explanation: 'Three different jobs, done by three different sets of people.


  A legislature makes law — Parliament for the country, a State Legislature for its own state.

  Which of them may make law on a given subject is fixed by Article 246, together with the Seventh

  Schedule. That Schedule sorts every subject into three baskets: one for the Union, one for the

  states, one they share.


  Below the legislature sits the executive — the day-to-day running of government. It is held by

  the President under Article 53, and carried out beneath the President by ministries and

  departments.


  A statute often leaves its detail blank on purpose, then hands the power to fill that blank

  onward. The Central Government may write rules to fill it. A body the statute itself sets up may

  write regulations to fill it. Neither a rule nor a regulation comes from a legislature, yet both

  bind you, because a statute said they could.


  Above all this sit the courts, reading statutes and testing whether the executive stayed inside

  its permission. Move the Supreme Court under Article 32, or a High Court under Article 226, and

  either can stop an unlawful act. Neither court will write you a replacement rule.

  '
illustration.body: 'Pick up a packet of biscuits from your kitchen. Turn it over. Read the nutrition panel on the

  back.


  Ask who wrote that requirement, and follow it down to its source. Search for the Food Safety and

  Standards Act, 2006, on the India Code website and open it. Check the copy is up to date the way

  the last section showed you: find its list of amendments and read the newest date.


  Now read section 23(1) of the Act. It says no one may sell a packaged food that is not labelled

  "in the manner as may be specified by regulations". Stop there. The Act hands you a duty, not

  the detail. The detail sits in a regulation — a rule written by a body, not by Parliament.


  Read on and you find where that power came from. Section 4 sets up the body that writes it, the

  Food Safety and Standards Authority of India. Section 92 gives that body the power to make

  regulations. Section 93 requires those regulations to be laid before Parliament, which is how

  Parliament keeps sight of rules it did not write.


  You have not opened that regulation yet. So you do not yet know what the panel is required to

  say, and you should not claim to.


  Before you write to anyone about it, check where the subject sits. Open Article 246 and the

  Seventh Schedule and find which list holds food. If it sits with the states as well as the

  centre, a letter to Delhi alone reaches half the answer.


  Now suppose you think the rule on this packet is wrong. Do not go to a court expecting a new

  label. A court moved under Article 32 or Article 226 can stop an unlawful act; it cannot write

  you a replacement rule. Write instead to the Authority that wrote the regulation, because that

  is where the power to change it sits. A Member of Parliament is a second address rather than a

  first one, since these regulations are laid before Parliament and can be raised there.

  '
illustration.analogy_breaks_when: 'The three-job picture promises two things that are not always true. The first is that the

  branches stay separate. The second is that anything binding traces back to a statute passed by a

  legislature.


  Most rules you will meet are written by the executive under a power a statute handed it, and

  never debated afterwards.


  Some of the largest programmes shaping health in India rest on nothing but an executive decision

  and a budget line. No statute, no section to open, no list of amendments to check. That makes

  them quick to start and just as quick to stop. When you meet one, do not go hunting for the

  statute. Notice that there is not one.


  Nor is the Seventh Schedule one clean ladder. A subject can sit with Parliament alone, with a

  State Legislature alone, or with both together. Check which list holds your subject before you

  decide who to write to, because a letter to the wrong legislature gets you nowhere.

  '
must_know[0].point: '"There is a law against it" and "there is a rule about it" sound like the same claim. They are

  not, and the difference decides who can change it and how fast. A statute needs a legislature

  and a debate. A regulation needs a meeting and a notification in the Gazette — the government''s

  official newspaper.

  '
must_know[1].point: 'Four levels, hardest to easiest to change: the Constitution, a statute, a rule or regulation, a

  notification. Lawyers call any one of them an instrument. Place whatever you are told about on

  that list before you argue about it. Where it sits predicts how fast it can move, and who has to

  be persuaded.

  '
must_know[2].point: 'Before repeating a label rule to anyone, open the regulation itself. The Act tells you a label

  is compulsory; it does not tell you what goes on the label. Quoting the Act''s wording as though

  it were the rule is how a confident answer turns out to be the wrong one.

  '
must_know[3].point: 'Food is not one subject belonging to one government. Article 246 and the Seventh Schedule split

  subjects between Union, State and Concurrent lists, so both Parliament and the State

  Legislatures act in this space. Expect two authorities where you assumed one.

  '
must_know[4].point: 'When you want something changed, find the instrument first. Ask a minister to change a

  regulation and you get sympathy. Ask the body that wrote it, and you get a process with dates

  you can chase.

  '
must_know[5].point: 'A programme resting on an executive decision and a budget line can be stopped as quickly as it

  was started. If you are asked to design something meant to outlast a government, your first

  question is which instrument would carry it.

  '
must_know[6].point: 'Asked who regulates food labelling in India, the weak answer is "the government". The strong

  answer names the body, the statute that created it, the section granting the power, and the kind

  of instrument it issues.

  '
must_know[7].point: 'This tells you who may act and through which instrument. It says nothing about whether the

  instrument is sensible, whether anyone enforces it, or whether it works.

  '
