definition.text: 'An equation is a statement that the expression on the left of the equals sign and the

  expression on the right stand for the same number. It is not an instruction to work the left

  side out.


  If two expressions stand for the same number, then applying the same operation to both of

  them gives two expressions that still stand for the same number. Four operations therefore

  leave the solutions of an equation unchanged.


  - adding the same quantity to both sides

  - subtracting the same quantity from both sides

  - multiplying both sides by the same quantity that is not zero

  - dividing both sides by the same quantity that is not zero


  To solve an equation for a letter is to reach an equation with that letter alone on one side,

  and no occurrence of it on the other.


  An operation applied to a side that is a sum applies to the whole of that sum, not to one

  term of it.

  '
simplified_explanation: "Start with what the equals sign is saying. It says the thing on its left and the thing on its\nright are the same number.\n\nPicture a pair of scales with a pan on each side, sitting level. Take three kilograms off one\npan and the scales tip. Take three off both and they stay level.\n\nThat is the whole rule.\n\n> Whatever you do to one side, do to the other.\n\nNow use it.\n\n```working\n    x + 7 = 12\n```\n\nThe 7 is in the way. It got there by being added, so take 7 off both sides.\n\n```working\n    x + 7 minus 7 = 12 minus 7\n    x = 5\n```\n\nCheck it by putting the 5 back where x was.\n\n```working\n    5 plus 7 = 12\n```\n\nThat check costs you one line and catches almost everything.\n\nMultiplying works the same way. Suppose you are told this.\n\n```working\n    3x = 21\n```\n\nThe 3 got there by multiplying, so divide both sides by 3.\n\n```working\n    3x divided by 3 = 21 divided by 3\n    x = 7\n```\n\nTwo things to hold on to from here on.\n\nThe first is order. When more than one thing is in the way, undo them in the reverse of the\norder they were done.\n\n```working\n    2x + 3 = 11\n```\n\nThe x was multiplied by 2 first and had 3 added second. So undo the adding first and the\nmultiplying second.\n\n```working\n    2x + 3 minus 3 = 11 minus 3\n    2x = 8\n    2x divided by 2 = 8 divided by 2\n    x = 4\n```\n\nThe second is that a side which is a sum has to be treated whole.\n\nThere is one more use for the rule, and it is the one you will use most. Sometimes nothing is\nunknown. A formula ties several quantities together, and you want a different one of them on\nits own. Getting one letter on its own like that is also called making it the subject.\n\nTake the rule that ties a distance, a speed and a time. The distance is the speed times the\ntime.\n\n```working\n    d = s t\n```\n\nTo get t by itself, divide both sides by s.\n\n```working\n    d divided by s = s t divided by s\n    d divided by s = t\n```\n\nThe time is the distance divided by the speed. You did not measure anything new. You moved the\nsame statement into the shape that answers your question.\n\nOne warning goes with that. Never divide both sides by a letter unless you know it is not zero,\nand the same goes for multiplying by one. Dividing by zero is not a move, and a letter can hide\none.\n"
illustration.body: "You met the rule an Indian food label uses for its energy figure in the section before this\none. Four kilocalories for every gram of carbohydrate, four for every gram of protein, nine\nfor every gram of fat.\n\n```working\n    E = 4c + 4p + 9f\n```\n\nA packet reaches you with its fat line torn off. The panel still shows the energy as 468\nkilocalories in every 100 grams, the carbohydrate as 60 grams and the protein as 12 grams.\nThose three figures are made up for this problem; the factors are not. Somebody wants the\nfat.\n\nHere is the working that comes back first. It is wrong.\n\n```working\n    E = 4c + 4p + 9f\n    divide both sides by 9\n    f = E divided by 9, minus 4c, minus 4p\n    468 divided by 9 = 52\n    52 minus 240 minus 48 = -236\n    so the fat is -236 grams\n```\n\nMinus two hundred and thirty-six grams of fat. No packet holds that, and no packet holds a\nnegative anything.\n\nThe division by 9 was applied to one term on the right and to nothing else. The right side\nis a sum of three terms, and dividing that side means dividing all of it.\n\nGet the 9f on its own first, by taking the other two terms off both sides.\n\n```working\n    E minus 4c minus 4p = 9f\n```\n\nDividing by 9 is safe, because there is nothing else on that side for the 9 to miss.\n\n```working\n    the whole of E minus 4c minus 4p, divided by 9 = f\n```\n\nPut the numbers in, one line at a time.\n\n```working\n    4 times 60 = 240\n    4 times 12 = 48\n    240 plus 48 = 288\n    468 minus 288 = 180\n    180 divided by 9 = 20\n```\n\nTwenty grams of fat.\n\nNow check it, the way you check every rearrangement.\n\n```working\n    4 times 60 = 240\n    4 times 12 = 48\n    9 times 20 = 180\n    240 plus 48 plus 180 = 468\n```\n\nThe rearrangement held.\n"
illustration.analogy_breaks_when: 'Rearranging moves a quantity from one side to the other. It does not improve it.


  The working here also assumes the packet holds nothing but carbohydrate, protein and fat

  that carries energy.

  '
must_know[0].point: 'An equals sign states that two things are the same number.

  '
must_know[1].point: 'Do the same thing to both sides, and write both sides of that step on the same line.

  '
must_know[2].point: 'A side that is a sum is divided or multiplied as a whole.

  '
must_know[3].point: 'Check every rearrangement by putting your answer back into the equation you started from.

  One line, every time, before the number leaves your desk.

  '
must_know[4].point: 'Any one quantity in a formula can be recovered from the others. So a register with a

  missing column is not always a register with missing information.

  '
must_know[5].point: 'Never divide both sides by a letter unless you know that letter is not zero.

  '
must_know[6].point: 'A recovered number carries the rounding of everything you put in, and a division can make

  that rounding larger.

  '
must_know[7].point: 'Teach the order before the moves. Undo what was done last, first.

  '
