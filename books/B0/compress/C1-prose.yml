definition.text: 'A variable is a letter written in place of a number. It stands either for a number that is

  not yet known, or for a number that may take any of several values.


  Two things written side by side are multiplied. So 2x means 2 times x, and xy means x times

  y. A letter multiplied by itself is written as a power: x^2 means x times x.


  An expression is a combination of numbers, letters and operations that stands for a number.

  An equation is a statement that two expressions stand for the same number.


  Brackets group a part of an expression so that it is treated as one quantity.


  Substituting a number for a letter replaces that letter, everywhere it appears, with the

  number. The expression then becomes arithmetic.


  Every rule of arithmetic holds for a letter, because the letter stands for a number. The

  order of an addition or a multiplication does not matter, and like terms may be collected.

  '
simplified_explanation: "A letter in a sum is a number wearing a name.\n\nYou use a letter for one of two reasons. Either you do not know the number yet, and you want to\nwrite about it anyway. Or the number changes from one case to the next, and you want one line\nthat covers all of them.\n\nHere is the first thing to get right, because it catches almost everybody.\n\n```working\n    2x\n```\n\nThat is not a two sitting beside an x. It is 2 times x. In algebra, writing two things side by\nside means multiply them. So 2x is double whatever x turns out to be.\n\nThe same holds for two letters. xy means x times y.\n\nA letter multiplied by itself is written with a small raised number, which is the power notation\nyou met earlier.\n\n```working\n    x^2\n```\n\nThat is x times x.\n\nNow the part that makes everything after this possible. A letter obeys every rule a number\nobeys. It has to, because it is a number. You just do not know which one.\n\nSo you add letters the way you add numbers.\n\n```working\n    x plus x = 2x\n```\n\nAnd you multiply them the way you multiply numbers.\n\n```working\n    3 times 2x = 6x\n```\n\nBrackets do one job. They say treat what is inside as one quantity.\n\n```working\n    2(x + 5)\n```\n\nThat is 2 times the whole of x + 5. It is not 2 times x with a 5 added on afterwards.\n\nWhen you do find out what the number is, you put it in. Putting a number in place of a letter is\ncalled substituting.\n\nSay x turns out to be 7.\n\n```working\n    2x\n    2 times 7 = 14\n```\n\nFourteen. The letter went away and arithmetic was left.\n\nOne more pair of words. An expression is a piece of algebra that stands for a number, like\n2x + 5. An equation is a statement that two expressions are the same number, like 2x + 5 = 19.\nThe equals sign is a claim, not a button.\n"
illustration.body: "An Indian food label gets its energy figure by arithmetic, not by burning the food. The Food\nSafety and Standards (Labelling and Display) Regulations, 2020 fix the numbers to multiply\nby. Four kilocalories for every gram of carbohydrate. Four for every gram of protein. Nine\nfor every gram of fat.\n\nTake a packet whose panel says this for every 100 grams. Carbohydrate 60 grams, protein 12\ngrams, fat 20 grams. Those three gram figures are made up for this problem. The three\nfactors are not.\n\nHere is the working that comes back first. It is wrong.\n\n```working\n    60 plus 12 plus 20 = 92\n    92 times 4 = 368\n```\n\n368 kilocalories. The arithmetic is fine. What is wrong is using one factor for all three\nquantities. Fat does not carry four.\n\nWrite the rule with letters instead. Let c stand for the number of grams of carbohydrate.\nLet p stand for the number of grams of protein. Let f stand for the number of grams of fat.\nAnd let E stand for the energy in kilocalories.\n\n```working\n    E = 4c + 4p + 9f\n```\n\nSay it out loud before you use it. Four times the carbohydrate grams, plus four times the\nprotein grams, plus nine times the fat grams.\n\nRead 9f as nine times f. It is not a nine with an f stuck on the end of it. And the f is not\nthe symbol for gram. It is standing in for a number of grams, which is a different job.\n\nNow substitute. Put 60 where c is, 12 where p is, and 20 where f is.\n\n```working\n    4 times 60 = 240\n    4 times 12 = 48\n    9 times 20 = 180\n    240 plus 48 plus 180 = 468\n```\n\n468 kilocalories.\n\nNow watch the letters do the thing letters are for. A second packet comes along with 70 grams\nof carbohydrate, 5 grams of protein and 15 grams of fat. These are made up too.\n\n```working\n    4 times 70 = 280\n    4 times 5 = 20\n    9 times 15 = 135\n    280 plus 20 plus 135 = 435\n```\n\n435 kilocalories.\n\nYou did not write a new rule for the second packet. You wrote the same rule and put different\nnumbers into it. That is what varies in a variable.\n"
illustration.analogy_breaks_when: 'The letters stand for numbers of grams. They do not stand for grams.


  The rule gives the figure a label must declare. It says nothing about what the food does in a

  person.


  And the three factors here cover carbohydrate, protein and fat only. The same clause sets

  separate factors for polyols, erythritol, alcohol, organic acid and dietary fibre. A food

  holding any of those needs its own term in the line, with its own number in front.

  '
must_know[0].point: 'Two things written side by side are multiplied. So 2x is two times x. Reading it as a two next

  to an x is the error that makes every later line unreadable. Say the multiplication out

  loud the first few times.

  '
must_know[1].point: 'A letter in a formula is a number, not a unit. In a line that ends 9f, the f is a count of

  grams and not the symbol for gram. Whoever copies that line reading f as a unit will drop

  the multiplication.

  '
must_know[2].point: 'Substitute, and the algebra turns into arithmetic you can check. When a formula lands in

  front of you, put in numbers whose answer you already know and see whether it gives that

  answer back.

  '
must_know[3].point: 'One line with letters in it covers every case at once. So you check a whole column of a

  spreadsheet by checking the rule once and then testing two rows, rather than by reading the

  column.

  '
must_know[4].point: 'A letter standing for a number says nothing about which numbers are allowed. The algebra

  will hand you a negative mass or a fat content larger than the packet without complaining.

  Read every answer back as a quantity before you use it.

  '
must_know[5].point: 'Name every letter in words when you put a formula on a board, in the same breath as you write

  it. A trainee who has to guess what p stands for has stopped following you.

  '
