definition.text: 'Combustion is burning: a substance combines vigorously with oxygen.


  A bomb calorimeter operates at constant volume and is used for reactions that release large

  amounts of energy and produce gases, which is what combustion does. It is a strong steel

  container, the bomb, which holds the sample and is itself submerged in water. The bomb is

  filled with oxygen at high pressure and a small electrical spark ignites the sample. The

  energy produced is taken up by the steel bomb and the water around it, and a thermometer

  records the rise.


  A substance whose energy is already known is burned in it, and the rise that produces is

  measured. The known energy divided by that rise is the calorimeter''s energy equivalent, in

  joules for each degree. Afterwards any rise measured in that calorimeter, multiplied by that

  same energy equivalent, gives the energy the reaction released.


  What that measures is the total combustible energy content of the food, also called its

  theoretical maximum energy content. The Food and Agriculture Organization of the United

  Nations calls this the ingested energy, or the gross energy.


  Not all of it is available to a person. Incomplete digestion in the small intestine, sometimes

  with fermentation of unabsorbed carbohydrate in the colon, loses energy as faecal energy and

  as gaseous energy in combustible gases. Some of the energy that is absorbed is then lost as

  urinary energy, mainly as nitrogenous waste compounds from incomplete breakdown of protein. A

  small amount is lost from the body surface. What remains after those losses is metabolizable

  energy.


  Below that the Organization''s 2003 report carries one further step, net metabolizable energy.

  It takes off the energy the body itself spends on digesting the food and on handling what is

  absorbed. What the report has no step for anywhere is digestible energy.


  The energy figure on a food label is not a burning measurement. It is derived using the

  Atwater system, which uses the average caloric content of protein, carbohydrate and fat. Those

  averages are the Atwater general factors. There is one value for each of the three, used

  regardless of the food it is found in. They are based on the heats of combustion of protein,

  fat and carbohydrate, corrected for losses in digestion, absorption and urinary excretion of

  urea.


  The three values are 17 kilojoules for each gram of protein, 37 for each gram of fat and 17

  for each gram of carbohydrate. In kilocalories for each gram the same three values are 4.0,

  9.0 and 4.0.


  One thing the general system does not do is take fibre out. Atwater''s carbohydrate is

  determined by difference, and thus includes fibre.


  To work out the energy content of a food, the quantities of carbohydrate, protein and fat are

  each multiplied by the factor for that one, and the products are added.

  '
simplified_explanation: "You cannot weigh energy. What you can do is burn the food and watch a thermometer.\n\nThe machine for it is called a bomb calorimeter. The name is unhelpful and the thing is\nstraightforward. It is a thick steel pot, sealed, sitting in a tank of water. You put a weighed\nscrap of dried food inside, fill the pot with oxygen, seal it, and set it off with an electric\nspark. The food burns completely. The warmth spreads into the steel and the water. A thermometer\nin the water reads higher than it did before.\n\nNothing about a temperature rise tells you how many joules it took. That depends on the machine:\nhow much steel, how much water, how it is built.\n\n**You burn something whose energy you already know.** You watch how far the thermometer goes up.\nThen you divide.\n\n```working\n    the energy equivalent = the known energy, divided by the rise it caused\n```\n\nCall it the calorimeter's energy equivalent. Doing this is called calibrating the machine, and\nit is done again before each set of measurements rather than once when the machine is bought.\n\nAfter that the work is one multiplication.\n\n```working\n    the energy released = the rise, times the energy equivalent\n```\n\nBurn a known thing to get the constant, then burn the unknown thing and multiply.\n\nWhat you have measured is all the energy the food will give up when it is burnt to nothing. The\nFood and Agriculture Organization of the United Nations calls it the gross energy. It is the\nmost the food could ever supply.\n\nA person is not a furnace.\n\nSome food is not digested and absorbed at all, and leaves in the faeces, carrying its energy\nwith it. Some unabsorbed carbohydrate is fermented in the large intestine and leaves as gas,\nwhich also carries energy. Some of what is absorbed leaves in the urine, mostly as the waste\nleft when protein is broken down and not finished off. And a small amount is lost from the body\nsurface.\n\nWhat is left after those losses has a name. It is called metabolizable energy, spelt with a z in\nthe report that names it.\n\nSo the cascade is gross energy, then metabolizable energy. Below that the report carries one\nmore step, called net metabolizable energy. It takes off the energy the body itself spends on\ndigesting the food and handling it. What the report has no step for anywhere is digestible\nenergy. You may hear somebody put one in the middle and say the report has it. If they do, they\nhave not opened it.\n\nThe number on a packet was almost certainly never measured by burning anything. It was\ncalculated.\n\nThe fixed figures are called the Atwater general factors.\n\n```table\nwhat it is     kilojoules a gram  kilocalories a gram\nprotein        17                 4.0\nfat            37                 9.0\ncarbohydrate   17                 4.0\n```\n\nThose factors already have the losses taken out of them. They were built from burning\nmeasurements and then corrected for what is lost in digestion, in absorption and in the urine.\n\nSo the figure on the packet is an estimate of metabolizable energy for an average, arrived at by\narithmetic on three weights. It is a good estimate and it is not a measurement of that packet.\n\nBurning tells you what is in the food. The factors tell you what an average person would get out\nof it. Neither one tells you anything about the person in front of you.\n"
illustration.body: "Open OpenStax Chemistry 2e, section 5.2, Calorimetry, at https://openstax.org/books/chemistry-2e/pages/5-2-calorimetry. Open your browser's find box and search\ninside the page for the word bomb.\n\n> The sample is placed in the bomb, which is then filled with oxygen at high pressure. A small\n> electrical spark is used to ignite the sample.\n\nNow search the same page for the word calibration, because that is the word this whole section turns on.\n\n> The calibration is generally performed each time before the calorimeter is used to gather\n> research data.\n\nEach time. Not once when the machine arrives.\n\nHow many joules one degree is worth depends on this machine.\n\nEvery figure in this calorimeter example is made up.\n\nThe known sample releases 26,400 joules. The thermometer goes up by 2.2 degrees Celsius, which is the ordinary degree marked on a kitchen thermometer.\n\nDivide the energy by the rise.\n\n```working\n    26,400 divided by 2.2 = 12,000\n```\n\nThat is the calorimeter's energy equivalent, and it is the only thing you needed.\n\nA dried pellet of food weighing 1.50 grams goes in, and the thermometer goes up by 1.85 degrees.\n\n```working\n    12,000 times 1.85 = 22,200\n```\n\nPut it in kilojoules, because nobody quotes food in joules.\n\n```working\n    22,200 divided by 1,000 = 22.2\n```\n\nNow for each gram, since the pellet weighed 1.50 grams.\n\n```working\n    22.2 divided by 1.50 = 14.8\n```\n\nTurn it into the unit food is quoted in, using the 4.184 from the section on energy units.\n\n```working\n    14.8 divided by 4.184 = 3.5373\n```\n\nAbout 3.5 kilocalories in each gram.\n\nThe question nobody asks is what it is a number about.\n\nThe Food and Agriculture Organization of the United Nations published a report on this in 2003. Open chapter 3 of it at https://www.fao.org/4/y5022e/y5022e04.htm.\n\nAlmost everybody who has met this once remembers three steps: gross energy, then digestible energy, then metabolisable energy. Search the page for digestible\nenergy.\n\nThe phrase is not in the chapter.\n\nSearch for gross energy instead.\n\n> Food that is ingested contains energy - the maximum amount being reflected in the heat that\n> is measured after complete combustion to carbon dioxide (CO2) and water in a bomb\n> calorimeter. This energy is referred to as ingested energy (IE) or gross energy (GE).\n\nThat is your burning measurement, named.\n\n> The energy that remains after accounting for the important losses is known as\n> “metabolizable energy” (ME) (see Figure 3.1).\n\nNow read one paragraph further. There is a third step, and it is not the one you went looking for. Some energy is spent on digesting the food and handling it\nafterwards, and some is lost to microbes. Take those off metabolizable energy and the report names what is left.\n\n> ...the result is an expression of the energy content of food, which is referred to as net\n> metabolizable energy (NME).\n\nSo the report's cascade runs gross energy, then metabolizable energy, then net metabolizable energy. The digestible-energy step is nowhere in the report at all.\n\nSearch the same chapter for Atwater.\n\n> The energy values are 17 kJ/g (4.0 kcal/g) for protein, 37 kJ/g (9.0 kcal/g) for fat and 17\n> kJ/g (4.0 kcal/g) for carbohydrates.\n\nOpen the National Food Security Act, 2013 at https://indiacode.gov.in/handle/123456789/496105 and go to Schedule II. Find the row for upper primary classes. The hot\ncooked meal is set at 700 in the energy column, and at 20 grams in the protein column.\n\nWork out how much of that 700 the protein standard accounts for.\n\n```working\n    20 times 4.0 = 80\n```\n\nAs a share of the meal, divide the part by the whole.\n\n```working\n    80 divided by 700 = 0.1142857143\n```\n\nRound it to three figures and you have 0.114. Multiply by a hundred to turn the proportion into a percentage.\n\n```working\n    0.114 times 100 = 11.4\n```\n\nAbout eleven per cent. So the Act fixes an energy figure and a protein figure, and the protein figure accounts for roughly a ninth of the energy. The other eight\nninths have to come from fat and carbohydrate, and Schedule II sets no figure for either of them.\n\nNow do the same sum in kilojoules and watch something strange happen. The factor for protein in kilojoules is 17.\n\n```working\n    20 times 17 = 340\n```\n\nAnd the 700 kilocalories, in kilojoules:\n\n```working\n    700 times 4.184 = 2,928.8\n```\n\n```working\n    340 divided by 2,928.8 = 0.116\n```\n\n```working\n    0.116 times 100 = 11.6\n```\n\nEleven point six per cent this time, against eleven point four the other way.\n\nThe report's kilojoule column and its kilocalorie column were each rounded on their own, and they are not exact conversions of one another. A footnote on the same\npage gives protein's precise value as 16.7 kilojoules a gram, and that one does convert properly.\n\n```working\n    16.7 divided by 4.184 = 3.991\n```\n\nThe 17 is the rounded figure, and rounding it is what moved your answer in the third digit.\n\nYou do not have a measurement of any meal. Schedule II says what a meal must meet, not what any meal contained.\n\nYou do not have what reaches a child either, even if a meal met the standard exactly.\n\nThis book does not carry either number, and you should not supply one from memory.\n\nEvery time somebody hands you a food-energy figure, ask three questions in order. Was it burnt or was it calculated. Is it the gross figure or the metabolizable\none. And is it a standard somebody set, or a measurement somebody took.\n"
illustration.analogy_breaks_when: "Every figure in the calorimeter example is made up. Only the 4.184, the Atwater factors and the two Schedule II figures come from a source.\n\nThe energy equivalent belongs to one calorimeter on one day. Carry it to another machine and every answer it gives is wrong, and wrong\nsilently, because the arithmetic still works.\n\nThe method needs the sample to burn completely. Nothing in the arithmetic will tell you it happened.\n\nThe Atwater factors are averages over foods. So the method cannot tell apart two foods with the same grams of protein, fat and carbohydrate.\n\nThe two printed columns pair up for protein and for carbohydrate. They do not pair up for fat. Fat's precise value is 37.4 kilojoules a gram,\nand the report prints 9.0 kilocalories beside it. Try the conversion both ways round.\n\n```working\n    37.4 divided by 4.184 = 8.9388\n    9.0 times 4.184 = 37.656\n```\n\nRead each column as its own set of numbers and do not work one out from the other.\n\nThe eleven per cent figure is a share of two numbers the Act sets, not a share of anything a child ate.\n\nNone of the arithmetic here says anything about a person. It gives you what is in a food and what an average person would get out of it. What\none person absorbs, what they spend, and what any change in their body would be made of are three separate questions. This book answers none\nof them.\n"
must_know[0].point: 'A bomb calorimeter figure is the food''s total combustible energy. It is not the energy a

  person gets. So never quote a burning figure as what somebody received.

  '
must_know[1].point: 'That report has no digestible-energy step anywhere. Its cascade runs from gross or ingested

  energy to metabolizable energy. The losses named are faecal, gaseous, urinary and surface. A

  third step sits below, net metabolizable energy. So do not object to a three-step reading of

  this report. Object to the word digestible, which is not in it anywhere. Name the step that

  was made up.

  '
must_know[2].point: 'A temperature rise is not an energy until the machine that produced it has been calibrated. The

  calibration is repeated before each set of runs, not done once.

  '
must_know[3].point: 'The Atwater general factors are the numbers behind nearly every food-energy figure you will ever be

  handed. They are 17 kilojoules, or 4.0 kilocalories, for each gram of protein. For fat they are 37 or

  9.0, and for carbohydrate 17 or 4.0. Knowing them means you can recompute any label yourself instead

  of trusting it.

  '
must_know[4].point: 'Those factors use one value for each of protein, fat and carbohydrate, whatever the food. It

  cannot show that one food is taken up better than another.

  '
must_know[5].point: 'The energy declared on an Indian packet is worked out from the grams, not measured by burning

  anything. So two packets showing the same figure have been through the same arithmetic, not

  the same measurement.

  '
must_know[6].point: 'When a journalist gives you a food-energy figure, the useful sentence is about what it

  describes. Give them that line before you argue about the number itself.

  '
must_know[7].point: 'Teach the calibration before the formula. A trainee who has seen a known burn turned into a constant will never again treat a thermometer

  reading as an energy. They will also carry the question to every instrument they meet afterwards: what was this measured against.

  '
