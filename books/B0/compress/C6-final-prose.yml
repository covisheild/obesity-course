definition.text: 'A relationship is linear when equal steps in the input add the same amount to the output every

  time.


  A relationship is exponential when equal steps in the input multiply the output by the same

  factor every time.


  A relationship is saturating when the output rises while its increments shrink towards zero,

  approaching a value it does not pass. That value is the ceiling, and the output may approach it

  without ever reaching it.


  The tests are arithmetic, carried out on values taken at equal steps. Constant differences

  between successive outputs mean linear. Constant ratios mean exponential.


  Differences that shrink while the output climbs do not on their own mean saturating, because an

  output can climb for ever by ever smaller amounts and approach no value at all. What settles it

  is a ratio taken on the differences themselves rather than on the outputs. Divide each

  difference by the difference before it. A ratio that holds at some number below one means each

  difference is a fixed share of the one before, so the differences sum to a finite amount and a

  ceiling exists. Where that ratio does not hold below one, shrinking differences establish no

  ceiling, and the shape has not been named.

  '
simplified_explanation: 'Three shapes turn up over and over.


  **Linear. Equal steps add.** Take one step along the bottom and the value goes up by the same

  amount. Take another step and it goes up by that same amount again. Drawn out, it is a straight

  line.


  **Exponential. Equal steps multiply.** Take one step along the bottom and the value is multiplied

  by the same number. Take another step and it is multiplied by that number again. Drawn out, it

  starts off looking lazy and then leaves everything else behind.


  **Saturating. It rises, then flattens.** It climbs quickly at first, then less, then hardly at

  all. It is heading for a level and it flattens against it. That level is called the ceiling.


  Subtract each value from the next one. Are the differences all the same? Then it is linear.


  Divide each value by the one before it. Are the ratios all the same? Then it is exponential.


  Do the differences keep shrinking while the values keep climbing? That is not yet enough to say

  saturating. A quantity can climb for ever by ever smaller amounts and head for no level at all.


  A logarithm does exactly that. Take the multiplying ruler from the section on logarithms. Each

  number sits a little further along it than the one before, and each of those steps is shorter

  than the step before it. The ruler goes on for ever. Nothing on it is a level to flatten against.


  So run one more division, and this time divide the differences rather than the values. Take each

  difference and divide it by the difference before it. Does that ratio hold at some number below

  one? Then each difference is a fixed share of the one before it, the differences add up to a

  finite amount, and there is a ceiling. That is saturating.


  Differences that shrink without holding a ratio may be heading nowhere in particular. That test

  has then found you no ceiling, so do not go looking for one on the strength of the shrinking

  alone.


  One more thing, and it is the one people get caught by. Look at the side axis before you name

  anything. Some side axes multiply by ten at every step, which is the ruler you met in the section

  on logarithms. On one of those, an exponential comes out as a straight line. So a straight line

  on that kind of axis means multiplying, not adding.


  And a warning about how much you need to see. Three points do not have a shape. Any three rising

  points can be drawn as any of the three shapes here. You need enough of the run to see what the

  steps are doing.

  '
illustration.body: "Start with three numbers and a wrong answer, because naming a shape too early is the mistake\nthis section exists to stop.\n\nSomebody shows you three values, taken one step apart: 10, 30, 42. They call the rise\nexponential and say it is roughly doubling.\n\nDivide each value by the one before it.\n\n```working\n    30 divided by 10 = 3\n    42 divided by 30 = 1.4\n```\n\nThe ratios are not the same, so nothing here is multiplying by a fixed factor. Exponential is\nthe wrong word.\n\nNow take the run out to six values, and put two other shapes beside it for comparison.\n\n```table\nstep  linear  exponential  saturating\n0     10      10           10\n1     20      15           30\n2     30      22.5         42\n3     40      33.8         49.2\n4     50      50.6         53.5\n5     60      75.9         56.1\n```\n\nWork down each column with the two tests.\n\nTake the first column by subtraction.\n\n```working\n    20 minus 10 = 10\n    30 minus 20 = 10\n    60 minus 50 = 10\n```\n\nThe same amount is added at every step, so the first column is linear.\n\nTake the second column by division.\n\n```working\n    15 divided by 10 = 1.5\n    22.5 divided by 15 = 1.5\n    75.9 divided by 50.6 = 1.5\n```\n\nThe same factor multiplies at every step, so the second column is exponential.\n\nTake the third column by subtraction, and watch what the differences do.\n\n```working\n    30 minus 10 = 20\n    42 minus 30 = 12\n    49.2 minus 42 = 7.2\n    53.5 minus 49.2 = 4.3\n    56.1 minus 53.5 = 2.6\n```\n\nThe steps shrink while the values keep climbing. Now divide each of those differences by the\none before it, which is the test that says whether the shrinking is heading anywhere.\n\n```working\n    12 divided by 20 = 0.6\n    7.2 divided by 12 = 0.6\n```\n\nThe ratio holds at about 0.6 all the way down the column, and 0.6 is below one. So each step\ncloses about the same share of whatever distance is left, the shrinking differences add up to\nsomething finite, and a ceiling exists. Here it is 60.\n\nNow look at step one and step five, because that is where the trap is. At step one the\nexponential column is the lowest of the three. At step five it is the highest, and it has\npassed the ceiling the saturating column will never reach.\n\nThat is why you take the run out before you name anything.\n\nAn exponential eventually passes any linear.\n"
illustration.analogy_breaks_when: 'These three shapes are a starting kit and not a list of everything.


  The two tests need equal steps along the bottom. Values taken at uneven intervals give

  differences and ratios that mean nothing. A table that does not say its step size cannot be

  tested at all.


  Rounding hides small changes. A ratio that reads 1.5 three times running may be drifting in the

  digits you were not shown.

  '
must_know[0].point: 'Run two tests on any set of values taken at equal steps. Subtract each from the next for a

  constant difference, and divide each by the one before for a constant ratio.

  '
must_know[1].point: 'Shrinking differences do not on their own mean a ceiling. A quantity can climb for ever by

  ever smaller amounts. A logarithm does exactly that. So run one more test before you say

  saturating. Divide each difference by the difference before it. A ratio that holds below one

  means the differences add up to a finite amount, so there is a ceiling to ask about. Where no

  such ratio holds, you have no ceiling to quote and should say so rather than estimate one.

  '
must_know[2].point: 'Exponential does not mean fast. It means each equal step multiplies by the same factor.

  '
must_know[3].point: 'Three points have no shape. Ask for the rest of the run before you name anything.

  '
must_know[4].point: 'Read the side axis before you call a line linear. On an axis where each step multiplies by ten,

  a straight line is an exponential.

  '
must_know[5].point: 'Where a curve has flattened, a further equal step in the input buys much less than the step

  before it did.

  '
must_know[6].point: 'Naming a shape names a pattern and never a mechanism.

  '
must_know[7].point: 'When a journalist uses the word exponential, ask what the values were at equal times and

  whether the ratio held.

  '
