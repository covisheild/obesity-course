definition.text: 'A table presents values in a grid, so that every value is identified by the row and the column

  it sits in.


  Reading a table means settling four things before reading any number. What does one row stand

  for? What does each column report about it? What units and denominators do the columns use?

  Where did the numbers come from?


  Until those four are settled, a cell means nothing. The same digits describe different facts

  depending on whether a row is one person, one household, one district or one year.

  '
simplified_explanation: 'A table lays out numbers in a grid — rows running one way, columns the other. Every number sits

  where a row meets a column, in a cell. A cell on its own tells you nothing.


  You have to settle four things first. What does one row stand for — one person, one household,

  one whole state? That is called the unit of observation. What does each column report about that

  row? What units does a column use, and if it is a percentage, what is it a percentage of — its

  denominator? And where did the numbers come from, who counted them, and how?


  Settle those four before you read a single value. Skip them, and the same digits can describe

  entirely different facts. Forty-five could be a headcount, a percentage, or a rank. A percentage

  taken from five people is not the same evidence as a percentage taken from fifty thousand.


  The grid looks plain and finished. Reading it well takes more work than the grid lets on.

  '
illustration.body: 'Here is a table of the kind you will meet often. Sit with it and work through the four questions

  in order.


  | State | Women surveyed | Overweight or obese (%) | Year |

  | --- | --- | --- | --- |

  | A | 42,100 | 24.1 | 2019-21 |

  | B | 18,750 | 39.6 | 2019-21 |


  Ask first what one row stands for. Run your finger along the top row. It is one state, not one

  woman. So the figure 24.1 describes nobody in particular. No sentence you write can begin "a

  woman in state A weighs" — the row will not carry that claim.


  Ask next what each column reports. The second column counts people. The third column, sitting

  right beside it, looks like the same kind of thing and is not. It is a percentage — a fraction,

  always of something. Of what? Of the count in the column next to it.


  Ask about units. Look at the last column and read it slowly. It is not a single year but a span,

  2019 to 2021, telling you the fieldwork ran across those years and not on one date.


  Ask where the numbers came from. Search the table for a line naming the source. There is none

  here. Notice that gap, because you will need it in a moment.


  Now put the question you were going to ask anyway: is state B worse than state A?


  You cannot tell from this table alone. The two percentages differ, and that much sits on the

  page. But you have not been shown who was surveyed in each state, how those women were chosen,

  or how precise either figure is.


  Say only what you can defend: the two reported figures differ. Before calling that a difference

  between the states, rather than a difference between two surveys, find out who was sampled, how,

  and with what precision.

  '
illustration.analogy_breaks_when: 'The grid looks like the whole truth, laid out flat with nothing hidden. It is not. It is a

  summary, and somebody chose it — which rows to include, which columns to print, which years to

  cover, what to leave out. Those choices happened before the table reached you, and the neat

  rectangle hides every one of them.


  Two people can build two honest tables from the same underlying numbers and leave two opposite

  impressions. Neither has lied. Each simply chose different rows, or a different denominator, or

  a different span of years. A table settles what was measured and reported. It does not settle

  whether the comparison you want to make is a fair one. That check stays yours, every time,

  before you set one row against another.

  '
must_know[0].point: 'Before comparing two percentages across rows, check the count sitting beside each one.

  Twenty-four per cent of 42,100 women and twenty-four per cent of two hundred women are not the

  same evidence. Treating them as equal is the commonest mistake here.

  '
must_know[1].point: 'Ask the four questions in order, every time, before you look at any value. What is one row? What

  does each column report? What are the units and denominators? Where did the numbers come from?

  '
must_know[2].point: 'Expect an Indian survey table to report a fieldwork span rather than one year. Expect state

  sample sizes to differ several-fold within the same table. Miss either, and a state-to-state

  comparison rests on nothing.

  '
must_know[3].point: 'When a table arrives in a ministry deck or a press release, somebody chose its rows and columns

  before you saw it. That somebody holds a position. Ask what was left out. In that room it is the

  only way to know what you are being shown.

  '
must_know[4].point: 'If asked which of two percentages is higher, do not stop at naming the bigger number. Say

  whether the table supports a comparison at all, and name what is missing.

  '
must_know[5].point: 'This section gets you only to what a table says. It does not tell you whether the numbers are

  right, how precise they are, or whether a gap is real. When you are asked, say so plainly rather

  than guessing.

  '
