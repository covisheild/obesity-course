"definition.text": |
  A variable is a letter written in place of a number. It stands either for a number that is
  not yet known, or for a number that may take any of several values.

  Two things written side by side are multiplied. So 2x means 2 times x, and xy means x times
  y. A letter multiplied by itself is written as a power: x^2 means x times x.

  Brackets group a part of an expression so that it is treated as one quantity.

  Substituting a number for a letter replaces that letter, everywhere it appears, with the
  number. The expression then becomes arithmetic.
"simplified_explanation": |
  A letter in a sum is a number wearing a name.

  ```working
      2x
  ```

  That is not a two sitting beside an x. It is 2 times x. In algebra, writing two things side by
  side means multiply them.

  A letter obeys every rule a number
  obeys. It has to, because it is a number.

  So you add letters the way you add numbers.

  ```working
      x plus x = 2x
  ```

  When you do find out what the number is, you put it in. Putting a number in place of a letter is
  called substituting.

  An expression is a piece of algebra that stands for a number, like
  2x + 5. An equation is a statement that two expressions are the same number, like 2x + 5 = 19.
"illustration.body": |
  The Food
  Safety and Standards (Labelling and Display) Regulations, 2020 fix the numbers to multiply
  by. Four kilocalories for every gram of carbohydrate. Four for every gram of protein. Nine
  for every gram of fat.

  Take a packet whose panel says this for every 100 grams. Carbohydrate 60 grams, protein 12
  grams, fat 20 grams.

  Here is the working that comes back first. It is wrong.

  ```working
      60 plus 12 plus 20 = 92
      92 times 4 = 368
  ```

  The arithmetic is fine. What is wrong is using one factor for all three
  quantities.

  Write the rule with letters instead. Let c stand for the number of grams of carbohydrate.
  Let p stand for the number of grams of protein. Let f stand for the number of grams of fat.
  And let E stand for the energy in kilocalories.

  ```working
      E = 4c + 4p + 9f
  ```

  Read 9f as nine times f. And the f is not
  the symbol for gram.

  Now substitute.

  ```working
      4 times 60 = 240
      4 times 12 = 48
      9 times 20 = 180
      240 plus 48 plus 180 = 468
  ```

  468 kilocalories.

  A second packet comes along with 70 grams
  of carbohydrate, 5 grams of protein and 15 grams of fat. These are made up too.

  ```working
      4 times 70 = 280
      4 times 5 = 20
      9 times 15 = 135
      280 plus 20 plus 135 = 435
  ```

  435 kilocalories.

  You wrote the same rule and put different
  numbers into it. That is what varies in a variable.
"illustration.analogy_breaks_when": |
  The letters stand for numbers of grams. They do not stand for grams.

  And the three factors here cover carbohydrate, protein and fat only.
"must_know[0].point": |
  So 2x is two times x. Reading it as a two next
  to an x is the error that makes every later line unreadable.
"must_know[1].point": |
  A letter in a formula is a number, not a unit. In a line that ends 9f, the f is a count of
  grams and not the symbol for gram.
"must_know[2].point": |
  Substitute, and the algebra turns into arithmetic you can check.
"must_know[3].point": |
  One line with letters in it covers every case at once. So you check a whole column of a
  spreadsheet by checking the rule once and then testing two rows, rather than by reading the
  column.
"must_know[4].point": |
  A letter standing for a number says nothing about which numbers are allowed.
  Read every answer back as a quantity before you use it.
"must_know[5].point": |
  Name every letter in words when you put a formula on a board, in the same breath as you write
  it.
