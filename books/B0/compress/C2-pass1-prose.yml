"definition.text": |
  An equation is a statement that the expression on the left of the equals sign and the
  expression on the right stand for the same number. It is not an instruction to work the left
  side out.

  Four operations therefore leave the solutions of an equation unchanged.

  - adding the same quantity to both sides
  - subtracting the same quantity from both sides
  - multiplying both sides by the same quantity that is not zero
  - dividing both sides by the same quantity that is not zero

  To solve an equation for a letter is to reach an equation with that letter alone on one side,
  and no occurrence of it on the other.

  An operation applied to a side that is a sum applies to the whole of that sum, not to one
  term of it.
"simplified_explanation": |
  Start with what the equals sign is saying. It says the thing on its left and the thing on its
  right are the same number.

  > Whatever you do to one side, do to the other.

  Now use it.

  ```working
      x + 7 = 12
  ```

  The 7 is in the way. It got there by being added, so take 7 off both
  sides.

  ```working
      x + 7 minus 7 = 12 minus 7
      x = 5
  ```

  Check it by putting the 5 back where x was.

  ```working
      5 plus 7 = 12
  ```

  That check costs you one line and catches almost everything.

  Two things to hold on to from here on.

  The first is order. When more than one thing is in the way, undo them in the reverse of the
  order they were done.

  ```working
      2x + 3 = 11
  ```

  The x was multiplied by 2 first and had 3 added second. So undo the adding first and the
  multiplying second.

  ```working
      2x + 3 minus 3 = 11 minus 3
      2x = 8
      2x divided by 2 = 8 divided by 2
      x = 4
  ```

  The second is that a side which is a sum has to be treated whole.

  A formula ties several quantities together, and you want a different one of them on
  its own. Getting one letter on its own like that is also called making it the subject.
"illustration.body": |
  Four kilocalories for every gram of carbohydrate, four for every gram of protein, nine
  for every gram of fat.

  ```working
      E = 4c + 4p + 9f
  ```

  A packet reaches you with its fat line torn off. The panel still shows the energy as 468
  kilocalories in every 100 grams, the carbohydrate as 60 grams and the protein as 12 grams.
  Somebody wants the
  fat.

  Here is the working that comes back first. It is wrong.

  ```working
      E = 4c + 4p + 9f
      divide both sides by 9
      f = E divided by 9, minus 4c, minus 4p
      468 divided by 9 = 52
      52 minus 240 minus 48 = -236
      so the fat is -236 grams
  ```

  Minus two hundred and thirty-six grams of fat. No packet holds that, and no packet holds a
  negative anything.

  The division by 9 was applied to one term on the right and to
  nothing else. The right side is a sum of three terms, and dividing that side means dividing
  all of it.

  Get the 9f on its own first, by taking the other
  two terms off both sides.

  ```working
      E minus 4c minus 4p = 9f
  ```

  Dividing by 9 is safe, because there is nothing
  else on that side for the 9 to miss.

  ```working
      the whole of E minus 4c minus 4p, divided by 9 = f
  ```

  Put the numbers in, one line at a time.

  ```working
      4 times 60 = 240
      4 times 12 = 48
      240 plus 48 = 288
      468 minus 288 = 180
      180 divided by 9 = 20
  ```

  Twenty grams of fat.

  Now check it, the way you check every rearrangement.

  ```working
      4 times 60 = 240
      4 times 12 = 48
      9 times 20 = 180
      240 plus 48 plus 180 = 468
  ```

  The rearrangement held.
"illustration.analogy_breaks_when": |
  Rearranging moves a quantity from one side to the other. It does not improve it.

  The working here also assumes the packet holds nothing but carbohydrate, protein and fat
  that carries energy.
"must_know[0].point": |
  An equals sign states that two things are the same number.
"must_know[1].point": |
  Do the same thing to both sides, and write both sides of that step on the same line.
"must_know[2].point": |
  A side that is a sum is divided or multiplied as a whole.
"must_know[3].point": |
  Check every rearrangement by putting your answer back into the equation you started from.
  One line, every time, before the number leaves your desk.
"must_know[4].point": |
  Any one quantity in a formula can be recovered from the others. So a register with a
  missing column is not always a register with missing information.
"must_know[5].point": |
  Never divide both sides by a letter unless you know that letter is not zero.
"must_know[6].point": |
  A recovered number carries the rounding of everything you put in, and a division can make
  that rounding larger.
"must_know[7].point": |
  Teach the order before the moves. Undo what was done last, first.
