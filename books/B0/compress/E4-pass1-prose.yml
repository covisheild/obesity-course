definition.text: "Temperature is a measure of how hot or cold something is. Heat is the spontaneous transfer of energy due to a temperature difference. Heat is measured in joules, the SI unit of energy. Temperature is measured in degrees Celsius or in kelvin.\n\nThe specific heat of a substance is the heat required to change the temperature of one kilogram of it by one degree Celsius. Its unit is joules per kilogram per degree Celsius.\n\nThe letter Q stands for the quantity of heat transferred. The letter m stands for the mass of the substance. The letter c stands for its specific heat.\n\n```working\n    Q = m times c times ΔT\n```\n\nThe change in temperature is the final temperature minus the initial temperature.\n\nEvery process involving heat transfer takes place by only three methods. Conduction is heat transfer through stationary matter by physical contact. Convection is heat transfer by the macroscopic movement of a fluid.\n"
simplified_explanation: "**Temperature** is how hot a thing is. It is a level, not an amount. A spoonful of boiling water and a bucket of boiling water are at the same temperature.\n\n**Heat** is energy moving, because one thing is hotter than another. It is an amount, and it is\nmeasured in joules, like every other energy in this book.\n\nSo the bucket and the spoonful are at the same temperature and hold very different amounts.\n\nEnergy goes from the hotter thing to the colder thing, and it keeps going until the two are at the same temperature. Then it stops.\n\nThe letter Q stands for the quantity of heat. The letter m stands for the mass. The letter c stands for the number belonging to the material. The Greek capital letter delta, written Δ, is how mathematics writes \"the change in\". So the pair ΔT stands for the change in temperature, and it is read \"delta T\".\n\n```working\n    Q = m times c times ΔT\n```\n\nThat number belonging to the material has a name: the **specific heat**. It is the joules you need for one kilogram of the stuff to go up by one degree.\n\n```table\nmaterial         joules for one kilogram, one degree\nwater            4186\nglass            840\niron and steel   452\n```\n\nWater needs more than nine times as much energy as steel for the same rise. **A bigger temperature rise does not mean more heat went in.** It means the two things were different things.\n\n**Heat capacity** is the same idea for one particular object rather than for a material. It is the joules that object needs to go up by one degree. The energy equivalent from that section is the calorimeter's heat capacity.\n\nThe change in temperature is the temperature at the end minus the temperature at the start. If the thing cooled, that subtraction gives a negative number, and so does Q. It means the energy went out rather than in.\n\nThere are exactly three ways, and that is not a list somebody stopped writing.\n\n**Conduction** is touching. Energy moves through matter that is staying put, by contact. A steel\ntumbler of hot chai and your fingers.\n\n**Convection** is carrying. A fluid — a liquid or a gas — moves, and the energy goes with it. Hot air rising off a tawa.\n\n**Radiation** is shining. Energy crosses as light, or as the invisible light below red that\nbodies give off, and it needs nothing in between. The warmth on your face from an open fire\nacross the room.\n\nAnything that keeps something warm or cool acts on one of them directly. So when somebody tells you their product keeps heat in, ask two questions. Which of the three does it act on? And what happens to the other two?\n"
illustration.body: "In the calorimeter, a bigger temperature rise meant more energy.\n\nGo and break it, with two things you have in the kitchen.\n\nTake a steel tawa that weighs one kilogram. Take one kilogram of water in a pan. Put them on two\nidentical burners and give each exactly the same amount of energy.\n\nUse 4,186 joules, because it makes the first sum come out at one.\n\nMultiply the mass by the specific heat to get the joules it needs for one degree.\n\n```working\n    1 times 4186 = 4186\n```\n\nYou are giving it exactly that, so the water goes up by one degree Celsius.\n\nNow the steel, the same way.\n\n```working\n    1 times 452 = 452\n```\n\nSo 4,186 joules will take the tawa a long way up.\n\nA calculator puts it at 9.26 degrees Celsius.\n\nOne thermometer reads a rise of one degree and the other reads a rise of more than nine. **The temperature rise did not measure the heat.** It measured the heat divided by what the object needed per degree, and the two objects needed very different amounts.\n\nInside one calorimeter the object never changes. So the joules it needs per degree never change either, and that is the energy equivalent you were handed.\n\nWithin one instrument, twice the rise is twice the energy. Across two instruments it is worth nothing, because the two heat capacities differ and nobody has said by how much.\n\nTwo hundred grams of chai are poured at 95 degrees Celsius and left. An hour later they are at\n30. The change in temperature is the end minus the start.\n\n```working\n    30 minus 95 = -65\n```\n\nNow the energy, taking 0.2 kilograms of a liquid that is mostly water.\n\n```working\n    0.2 times 4186 = 837.2\n    837.2 times -65 = -54418\n```\n\nMinus 54,418 joules. The minus sign says it left.\n\nPour chai into a steel tumbler and pick it up. Your fingers know within a second. Now pour the same chai into a clay kulhar and pick that up. You can hold it. The matter between the chai and your fingers did.\n\nHold your palm a foot above a hot tawa, not touching it. The air over the tawa is being heated, it rises, and it brings the energy up to your hand.\n\nStand three feet from an open tandoor and face it. Your face warms, and the air in between did not have to carry anything.\n\nChoosing the material acts on how easily heat gets through it. Stopping the air moving acts on convection. Choosing the colour acts on radiation.\n\nTake a sheet of paper and write the three routes down the left side. Then put the claim against each one in turn and ask what it does about that route.\n\nTry it on a white roof, which is the book's own example. Colour acts on radiation, so the roof absorbs less of the sunlight falling on it. That is the only route the colour touches. The other two are downstream of it. So naming the route tells you where the control bites, not which routes end up different.\n"
illustration.analogy_breaks_when: 'The heat equation holds only while the substance stays the same substance in the same phase. Boil the water and it stops. The energy then goes into turning liquid into steam, and the temperature sits still while that happens. Any calculation that crosses a boiling point or a melting point has left this section behind.


  Specific heat is not truly a constant. Over the ranges used here the variation is small enough to ignore.


  A person is not one substance and has no single specific heat you can look up. Nothing here gives you a figure for heating or cooling a person, and none of these numbers should be carried across to one.


  All three routes run at once in every real situation. Naming the route a control acts on does not settle what the other two then do.


  This section gives no rates. It says by which routes heat moves and never how fast.


  Sweating is not one of the three, and the book does not treat it as one. Any claim that turns on evaporation is outside what you are holding.

  '
must_know[0].point: 'A bigger temperature rise does not mean more heat went in. Give a kilogram of steel and a kilogram of water the same energy. The steel rises more than nine times as far. So a thermometer reading is not an energy.

  '
must_know[1].point: 'Heat is energy on the way, not a thing an object holds, so refuse the sentence "this object contains so much heat". Heat is the name of a transfer.

  '
must_know[2].point: 'When anyone turns a temperature reading into an energy, ask two things. What heat capacity did they use? Across two machines a degree is not a degree.

  '
must_know[3].point: 'Water needs more than nine times the energy that iron or steel needs, for the same rise in the same mass. The figures are 4186 joules per kilogram per degree Celsius at 15.0 °C, against 452.

  '
must_know[4].point: 'The heat equation holds only while the substance stays the same substance in the same phase. It breaks at every boiling point, every melting point and every chemical reaction. When a calculation reaches one of those points, stop rather than substitute.

  '
must_know[5].point: 'A temperature is not an amount of energy, so never read a patient''s temperature as a statement about energy gained or lost. One is in degrees and the other in joules.

  '
must_know[6].point: 'Heat moves by conduction, convection and radiation, and by nothing else, so make every claim about keeping warm or cool name its route. Once the route is named, the question becomes how much was arriving that way, and that can be answered.

  '
must_know[7].point: 'Teach the two-objects demonstration before the formula. After that they will not read a rise as an energy again.

  '
