definition.text: "Temperature is a measure of how hot or cold something is. Heat is the spontaneous transfer of\nenergy due to a temperature difference. The two are different quantities: heat is a form of\nenergy and temperature is not, and they carry different units. Heat is measured in joules, the\nSI unit of energy. Temperature is measured in degrees Celsius or in kelvin.\n\nHeat is energy in transit. A body does not contain heat; it contains internal energy, and its\ninternal energy is higher when its temperature is higher. When two bodies at different\ntemperatures are brought into contact, energy is transferred from the hotter to the colder one\nuntil they reach the same temperature, at which point the transfer ceases. That state is\nthermal equilibrium.\n\nThe heat capacity of a body of matter is the quantity of heat it absorbs or releases when its\ntemperature changes by one degree Celsius, which is the same interval as one kelvin. Its unit\nis joules per degree Celsius. Heat capacity depends on both what the body is made of and how\nmuch of it there is, so it belongs to a particular object rather than to a material. The\nenergy equivalent of a bomb calorimeter is that calorimeter's heat capacity.\n\nThe specific heat of a substance is the heat required to change the temperature of one kilogram\nof it by one degree Celsius. Its unit is joules per kilogram per degree Celsius. Specific heat\ndepends only on the substance and its phase, not on how much is present.\n\nThe quantitative relationship between heat transfer and temperature change contains three\nfactors, and is written as follows. The letter Q stands for the quantity of heat transferred.\nThe letter m stands for the mass of the substance. The letter c stands for its specific heat.\nThe Greek capital letter delta, written Δ, stands for a change in whatever follows it, so the\npair ΔT stands for the change in temperature and is read \"delta T\".\n\n```working\n    Q = m times c times ΔT\n```\n\nThe change in temperature is the final temperature minus the initial temperature. When a\nsubstance loses thermal energy its final temperature is lower than its initial temperature, so\nΔT is negative and Q is negative, and the negative sign means energy left rather than entered.\n\nValues of specific heat must be looked up in tables, because there is no simple way to\ncalculate them, and they vary somewhat with temperature. At 15.0 °C the specific heat of water\nis 4186 joules per kilogram per degree Celsius, that of glass is 840 and that of iron and steel\nis 452. Water has one of the largest specific heats of any material.\n\nEvery process involving heat transfer takes place by only three methods. Conduction is heat\ntransfer through stationary matter by physical contact. Convection is heat transfer by the\nmacroscopic movement of a fluid. Heat transfer by radiation occurs when microwaves, infrared\nradiation, visible light, or another form of electromagnetic radiation is emitted or absorbed.\n"
simplified_explanation: "Two sections back, in the section on the calorimeter, you watched a thermometer go up and called\nthe rise a measurement of energy. That works inside one instrument, and it is about to stop\nworking. Here is why.\n\nStart with two words that everyday speech treats as one.\n\n**Temperature** is how hot a thing is. A thermometer reads it. It is a level, not an amount. It does not care how much of the thing there is. A spoonful of boiling\nwater and a bucket of boiling water are at the same temperature.\n\n**Heat** is energy moving, because one thing is hotter than another. It is an amount, and it is\nmeasured in joules, like every other energy in this book.\n\nSo the bucket and the spoonful are at the same temperature and hold very different amounts. That\none sentence is the section.\n\nNow the rule about which way it moves, and it has no exceptions. Energy goes from the hotter\nthing to the colder thing, and it keeps going until the two are at the same temperature. Then it\nstops. Nothing has to push it and nothing can make it go the other way on its own.\n\nNext, how much. Three things decide how far a temperature moves when energy goes in.\n\nHow much stuff there is. What the stuff is. And how big a temperature change you are after.\n\nMultiply the three together and you have the amount of energy. Say it in words first.\n\nThe energy equals the mass, times a number belonging to the material, times the change in\ntemperature.\n\nNow in letters, one at a time. The letter Q stands for the quantity of heat. The letter m stands\nfor the mass. The letter c stands for the number belonging to the material. The Greek capital\nletter delta, written Δ, is how mathematics writes \"the change in\". So the pair ΔT stands for the\nchange in temperature, and it is read \"delta T\".\n\n```working\n    Q = m times c times ΔT\n```\n\nThat number belonging to the material has a name: the **specific heat**. It is the joules you\nneed for one kilogram of the stuff to go up by one degree. Every material has its own, you look\nit up in a table, and nobody can work one out from first principles.\n\nHere is the number to remember, and it is why this section exists.\n\n```table\nmaterial         joules for one kilogram, one degree\nwater            4186\nglass            840\niron and steel   452\n```\n\nWater needs more than nine times as much energy as steel for the same rise. So pour the same\nenergy into a kilogram of each and the steel gets more than nine times hotter. **A bigger\ntemperature rise does not mean more heat went in.** It means the two things were different\nthings.\n\nOne more word, because the section on the calorimeter used it without naming it. **Heat\ncapacity** is the same idea for one particular object rather than for a material. It is the\njoules that object needs to go up by one degree. A calorimeter has one, and you have already used\nit. The energy equivalent from that section is the calorimeter's heat capacity. It is also why a\ncalorimeter's degrees can be trusted: inside one instrument the object never changes, so the\nnumber never changes.\n\nNow the sign, and you have already met negative numbers in the section on counting.\n\nThe change in temperature is the temperature at the end minus the temperature at the start. If\nthe thing cooled, that subtraction gives a negative number, and so does Q. The minus sign is not\nan error. It means the energy went out rather than in.\n\nLast, how heat actually gets from one place to another. There are exactly three ways, and that is\nnot a list somebody stopped writing. It is all of them.\n\n**Conduction** is touching. Energy moves through matter that is staying put, by contact. A steel\ntumbler of hot chai and your fingers.\n\n**Convection** is carrying. A fluid — a liquid or a gas — moves, and the energy goes with it. Hot\nair rising off a tawa. Blood carrying warmth from the middle of you out to your skin.\n\n**Radiation** is shining. Energy crosses as light, or as the invisible light below red that\nbodies give off, and it needs nothing in between. The warmth on your face from an open fire\nacross the room.\n\nWhy you want those three names. Anything that keeps something warm or cool acts on one of them\ndirectly. So when somebody tells you their product keeps heat in, ask two questions. Which of\nthe three does it act on? And what happens to the other two?\n"
illustration.body: "Start with the belief the section on the calorimeter may have left you with, because it is\nwrong and it is reasonable.\n\nIn the calorimeter, a bigger temperature rise meant more energy. You measured the rise, you\nmultiplied by the instrument's energy equivalent, and you got joules. Do that a few times and a sentence forms by itself. **A bigger temperature rise means more heat.**\n\nGo and break it, with two things you have in the kitchen.\n\nTake a steel tawa that weighs one kilogram. Take one kilogram of water in a pan. Put them on two\nidentical burners and give each exactly the same amount of energy.\n\nUse 4,186 joules, because it makes the first sum come out at one. Look up what each material\nneeds, from Table 14.1 of OpenStax College Physics 2e, section 14.2, at\nhttps://openstax.org/books/college-physics-2e/pages/14-2-temperature-change-and-heat-capacity.\n\n```table\n| material | joules per kilogram per degree Celsius |\n| Water (15.0 °C) | 4186 |\n| Glass | 840 |\n| Iron, steel | 452 |\n```\n\nNow the water. Multiply the mass by the specific heat to get the joules it needs for one degree.\n\n```working\n    1 times 4186 = 4186\n```\n\nFour thousand one hundred and eighty-six joules for one degree. You are giving it exactly that,\nso the water goes up by one degree Celsius.\n\n```working\n    4186 divided by 4186 = 1\n```\n\nNow the steel, the same way.\n\n```working\n    1 times 452 = 452\n```\n\nFour hundred and fifty-two joules for one degree. So 4,186 joules will take the tawa a long way\nup. Bracket it before you reach for the calculator, because the bracket is the part worth\nseeing.\n\nNine degrees would use this much.\n\n```working\n    452 times 9 = 4068\n```\n\nFour thousand and sixty-eight, and you gave it 4,186. So it goes past nine degrees. Now try ten.\n\n```working\n    452 times 10 = 4520\n```\n\nFour thousand five hundred and twenty, which is more than you gave it. So the rise lands between\nnine and ten degrees. A calculator puts it at 9.26 degrees Celsius.\n\nStop and read the pair. Same energy, both times. One kilogram, both times. One thermometer reads\na rise of one degree and the other reads a rise of more than nine. **The temperature rise did\nnot measure the heat.** It measured the heat divided by what the object needed per degree, and\nthe two objects needed very different amounts.\n\nNow run it the other way, which is the direction most real questions arrive in. How much energy\nto raise each by exactly one degree?\n\n```working\n    1 times 4186 times 1 = 4186\n```\n\n```working\n    1 times 452 times 1 = 452\n```\n\nFour thousand one hundred and eighty-six joules against four hundred and fifty-two. The book\nputs the same comparison in words.\n\n> We see from this table that the specific heat of water is five times that of glass and ten\n> times that of iron\n\nTen times is the round version, and you have just seen where the rounding is. Ten times 452 is\n4,520, and the table gives water as 4,186.\n\n```working\n    4520 minus 4186 = 334\n```\n\nSo \"ten times\" overshoots by 334 joules per kilogram per degree, which is about eight per cent\nof water's figure. The true ratio is a little over nine. The sentence and the table are not in\nconflict; the sentence rounded, and it says so by writing \"ten times\" instead of giving a\nnumber.\n\nNow go back and ask what was true about the calorimeter, because something was.\n\nInside one calorimeter the object never changes. It is the same steel, the same water, the same\nthermometer, every run. So the joules it needs per degree never change either, and that is the\nenergy equivalent you were handed. It has a proper name now. It is the calorimeter's **heat\ncapacity**, in joules per degree Celsius, and it belongs to that instrument rather than to the\nfood in it.\n\nWhich tells you exactly how far the calorimeter sentence travels. Within one instrument, twice\nthe rise is twice the energy. Across two instruments it is worth nothing, because the two heat\ncapacities differ and nobody has said by how much.\n\nLast for this half, the sign, on a cup you can watch.\n\nTwo hundred grams of chai are poured at 95 degrees Celsius and left. An hour later they are at\n30. The change in temperature is the end minus the start.\n\n```working\n    30 minus 95 = -65\n```\n\nMinus 65 degrees, and the minus is doing work. Now the energy, taking 0.2 kilograms of a liquid\nthat is mostly water.\n\n```working\n    0.2 times 4186 = 837.2\n    837.2 times -65 = -54418\n```\n\nMinus 54,418 joules. The minus sign says it left. Fifty-four thousand joules went out of that\ncup into the room, and the only thing that showed on any instrument was a thermometer falling by\n65 degrees. Negative numbers come from the section on counting. Nothing new is being asked of\nyou here except to keep the sign and read it.\n\n---\n\nYou now know which way heat goes and how much. Neither tells you how it gets there, and the\nroute is the only part of this you can usually change.\n\nOpen OpenStax College Physics 2e, section 14.4, Heat Transfer Methods, at\nhttps://openstax.org/books/college-physics-2e/pages/14-4-heat-transfer-methods. Read the\nsentence just before the numbered list.\n\n> Yet every process involving heat transfer takes place by only three methods:\n\nOnly three. That is a strong claim and the book makes it flatly. Here they are, in its words,\nand then in your kitchen.\n\n> 1. Conduction is heat transfer through stationary matter by physical contact.\n\nPour chai into a steel tumbler and pick it up. Your fingers know within a second. The steel\nstayed where it was and the energy came through it into your hand. Now pour the same chai into a\nclay kulhar and pick that up. You can hold it. Nothing about the chai changed. The matter\nbetween the chai and your fingers did.\n\n> 2. Convection is the heat transfer by the macroscopic movement of a fluid.\n\nHold your palm a foot above a hot tawa, not touching it. The air over the tawa is being heated,\nit rises, and it brings the energy up to your hand. The air is the fluid and the moving is the\npoint. Your own body does this to itself, and the book says so in its section on convection. When you\noverheat, the vessels in your skin widen. More blood flows to the skin, and it carries warmth\nfrom the middle of you to the outside.\n\n> 3. Heat transfer by radiation occurs when microwaves, infrared radiation, visible light, or\n> another form of electromagnetic radiation is emitted or absorbed.\n\nStand three feet from an open tandoor and face it. Your face warms, and the air in between did\nnot have to carry anything. That is the third route, and it needs nothing in between at all. The\nbook gives the warming of the Earth by the Sun as the obvious case and adds a less obvious one:\nthermal radiation from the human body. You are doing it now.\n\nNow the part that makes the three names useful rather than decorative. Read what the same\nsection says about controlling them.\n\n> We can control rates of heat transfer by choosing materials (such as thick wool clothing for\n> the winter), controlling air movement (such as the use of weather stripping around doors), or\n> by choice of color (such as a white roof to reflect summer sunlight).\n\nThree controls, and each of them bites on a route you can name. Choosing the material acts on\nhow easily heat gets through it. Thick wool works by holding still air in its fibres, which\nslows conduction and convection at once. Stopping the air moving acts on convection. Choosing\nthe colour acts on radiation.\n\nSo here is what to do with your hands the next time somebody claims a thing keeps heat in or\nkeeps heat out. Take a sheet of paper and write the three routes down the left side. Then put\nthe claim against each one in turn and ask what it does about that route.\n\nTry it on a white roof, which is the book's own example. Colour acts on radiation, so the roof\nabsorbs less of the sunlight falling on it. That is the only route the colour touches. The\nother two are downstream of it. A cooler slab conducts less heat down into the ceiling, and a\ncooler ceiling warms the air under it less. So naming the route tells you where the control\nbites, not which routes end up different. Whether the white roof is enough depends on how much\nof the heat was arriving as sunlight on the roof in the first place.\n\nThat last sentence is the whole method. Naming the route turns a slogan into a question with an\nanswer, and the question is always the same one: how much was coming that way?\n"
illustration.analogy_breaks_when: 'The two one-kilogram masses and the 4,186 joules are chosen to make the first sum come out at

  one. The three specific heats are real and come from Table 14.1.


  The heat equation holds only while the substance stays the same substance in the same phase.

  Boil the water and it stops. The energy then goes into turning liquid into steam, and the

  temperature sits still while that happens. A formula with the change in temperature in it then

  returns zero for an energy that is not zero. The same is true of ice melting. Any calculation

  that crosses a boiling point or a melting point has left this section behind.


  Specific heat is not truly a constant. The book says it varies with temperature, and Table 14.1

  labels its water row 15.0 °C, not "water" on its own. Over the ranges used here the variation

  is small enough to ignore. Over a wide range it is not.


  The two books in this course do not give the same figure for water, and it is worth knowing

  which one you are holding. College Physics 2e Table 14.1 gives 4186 joules per kilogram per

  degree Celsius. Chemistry 2e section 5.1 gives 4.184 joules per gram per degree Celsius, which

  is 4184 joules per kilogram per degree. The gap is under one part in two thousand, and neither

  book explains the other''s figure. Use one book''s figure all the way through a calculation, and

  say which one you used.


  A person is not one substance and has no single specific heat you can look up. A body is water,

  fat, muscle and bone at once. Chemical reactions are running inside it the whole time. So both

  conditions above are broken at once. Nothing here gives you a figure for heating or cooling a

  person, and none of these numbers should be carried across to one.


  All three routes run at once in every real situation. The tumbler conducts into your fingers

  while the chai''s surface radiates and the air above it convects. Naming the route a control

  acts on does not settle what the other two then do. Sometimes they follow, the way a cooler

  roof slab conducts less. Sometimes they do not, and the control is undone by the two it left

  alone.


  This section gives no rates. It says by which routes heat moves and never how fast. So it cannot settle whether any of these

  controls is large enough to matter in a particular house, pan or person. Deciding that needs measurement, and measurement is not

  here.


  The clay kulhar and the steel tumbler differ in more than one way at once. The clay conducts

  less well, and the wall is thicker. The comparison shows you that the matter in between

  decides the answer. It does not isolate which property of that matter did it.


  Sweating is not one of the three, and the book does not treat it as one. Section 14.6 mentions the skin being cooled by sweating in the same breath as blood flow. This

  course has not given you the physics of a liquid turning into a vapour. Any claim that turns on evaporation is outside what you are holding. Say so, rather than reach for

  the nearest of the three names.


  "Only three methods" is a claim about routes across a boundary. It is not a promise that every

  warming or cooling you meet is explained by naming one. A person getting warmer may be doing it

  by running a chemical reaction inside their own boundary. That is not a transfer across the

  boundary at all.

  '
must_know[0].point: 'A bigger temperature rise does not mean more heat went in. Anyone who has used a calorimeter

  will believe it does. Give a kilogram of steel and a kilogram of water the same energy. The

  steel rises more than nine times as far. So a thermometer reading is not an energy. It becomes

  one only when you multiply it by a figure that belongs to the object being heated.

  '
must_know[1].point: 'Heat is energy on the way, not a thing an object holds, so refuse the sentence "this object

  contains so much heat". What it holds is internal energy. Heat is the name of a transfer. Keep

  the two apart and nobody can treat a temperature as a store of energy to be passed on.

  '
must_know[2].point: 'When anyone turns a temperature reading into an energy, ask two things. What heat capacity did

  they use? Where did it come from? Inside one machine the heat capacity is fixed, so the reading

  can be trusted. Across two machines a degree is not a degree. Rises set side by side with no

  heat capacity named are not energies set side by side.

  '
must_know[3].point: 'Water needs more than nine times the energy that iron or steel needs, for the same rise in the

  same mass. The figures are 4186 joules per kilogram per degree Celsius at 15.0 °C, against 452.

  Carry that ratio and you can check any claim about how fast a wet thing heats or cools.

  '
must_know[4].point: 'The heat equation holds only while the substance stays the same substance in the same phase. It

  breaks at every boiling point, every melting point and every chemical reaction. A body has all

  three running at once. That is why nothing here gives you a figure for heating or cooling a person. When a calculation

  reaches one of those points, stop rather than substitute.

  '
must_know[5].point: 'A temperature is not an amount of energy, so never read a patient''s temperature as a statement

  about energy gained or lost. One is in degrees and the other in joules. Nothing converts between

  them without a figure for what that body needs per degree, and nobody has one.

  '
must_know[6].point: 'Heat moves by conduction, convection and radiation, and by nothing else, so make every claim

  about keeping warm or cool name its route. Once the route is named, the question becomes how

  much was arriving that way, and that can be answered. While it is unnamed, the claim commits to

  nothing.

  '
must_know[7].point: 'Teach the two-objects demonstration before the formula. Let a trainee watch a kilogram of steel

  and a kilogram of water take the same energy to different temperatures. After that they will

  not read a rise as an energy again. Not once. One who has only learnt the formula will do it

  the first time they are tired.

  '
