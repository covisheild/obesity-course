definition.text: 'A reference is a pointer from a claim to the place that is supposed to support it.


  Checking a reference means four things, and each one can fail on its own. Finding the source.

  Confirming it is the source named. Finding the exact passage pointed to. Reading that passage to

  see whether it supports the claim.


  Finding a source is not the same as checking it. A real source can be attached to a claim it

  does not support, and that failure is invisible to anyone who stops at the first step.

  '
simplified_explanation: 'Someone makes a claim and points you to a source — a book, a law, a paper. Checking a reference

  means you go and look, not just glance at the name on it.


  Four separate acts sit inside that looking, and each one can fail on its own. First, find the

  source. Second, check it is the source named, not something close to it. Third, find the exact

  page or section pointed to. Fourth, read that passage and ask whether it actually says what you

  were told.


  Most people stop at the first act and call the job done. That is where the danger sits. A real

  source, spelled correctly and sitting on the right shelf, can still be attached to a claim it

  never makes. Nothing about the name looks wrong. The book is real, the page number is real, and

  the sentence you were promised is simply not on that page. You find this out one way only: by

  opening the source yourself and reading the words on it.

  '
illustration.body: 'Pick a claim and test it yourself. Watch exactly where it breaks.


  Here is the claim.


  > The GST Council is set up by Article 279A of the Constitution.


  The Council is the body that sets goods and services tax rates. That fact is not what you are

  testing. The claim is.


  First, find it. Open India Code, the government''s own website for Indian law. Search for

  "Constitution of India". A copy comes up. Open it.


  Second, check it is the right thing. The title reads The Constitution of India. It sits on a

  government site. Nothing looks wrong yet.


  Third, find the exact place. The claim names Article 279A, so search inside the document for

  "279A". Nothing comes up. Try "Goods and Services Tax" instead. Nothing there either.


  Stop here, because this is the moment worth learning from. The site is official. The document

  really is the Constitution. The title is right. And the thing you were promised is inside it is

  not inside it.


  Why not? Look at the list of amendments this copy names — later changes stitched into the law.

  The newest one is from 2003. Article 279A was written into the Constitution in 2016, thirteen

  years after that. This copy is old, and nothing on the page warns you.


  A second copy sits on the same website, marked as up to date, and that one does hold Article

  279A. Same claim, same search, same site — only the file differs, and that difference decides

  whether the claim passes or fails.


  Now try an easier claim, so you can feel what passing looks like. "The Food Safety and Standards

  Authority of India was set up by an Act of Parliament. That Act lets it write its own rules."

  Open the Food Safety and Standards Act, 2006, on India Code. Search inside for "Food Authority

  to make regulations". There it sits, at section 92. Section 93, right beside it, says those

  regulations — the rules the Authority is allowed to write — must be laid before Parliament. Two

  minutes of searching, and the claim holds.


  One more thing to notice. Look back at the definition above this section. Its own reference is

  marked PENDING — nobody has opened it yet. That is on purpose. You can now see a checked

  reference and an unchecked one side by side, and learn to tell them apart at a glance.

  '
illustration.analogy_breaks_when: 'Four acts make this sound like a checklist you can run without thinking, and that promise is not

  quite true. A source can say something smaller than the claim built on it. A paper finds that

  two things move together; someone later cites it as proof that one causes the other. Every one

  of the four acts passes, and the mistake still gets through, because only judgement catches the

  gap between "linked" and "causes".


  For a law there is a fifth question the four acts never ask on their own: is this copy up to

  date? An old copy can pass finding, confirming and locating, then fail at reading. The words it

  holds were true once and are not true now. That is exactly what happened above.

  '
must_know[0].point: 'If a citation opens, that does not mean it is checked. Opening is only the first act, and the

  easiest one. The failure that matters is a real, correctly named source attached to a claim it

  does not make.

  '
must_know[1].point: 'Treat every reference as four separate acts: find it, confirm it, locate the passage, read it.

  For any law or regulation, add a fifth act — check whether this copy is up to date.

  '
must_know[2].point: 'An Indian statute is a law passed by Parliament or by a State Legislature. Statutes get

  republished as consolidated copies — all the changes merged into one text. Copies of different

  ages sit on the official sites at once, and nothing says which is newest. Before you trust a

  copy, check the newest amendment it names. That check takes seconds.

  '
must_know[3].point: 'Expect the people reading your work to test your citations against you, not for you. One

  reference that does not say what you claimed it says can end the argument, and take everything

  else you brought along with it.

  '
must_know[4].point: 'If asked whether a reference is sound, do not answer by checking the formatting. A citation can

  be perfectly formatted and still say nothing like what you claimed.

  '
must_know[5].point: 'This check tells you only whether a source supports a claim. It does not tell you whether the

  source is good, or whether better evidence exists. Nor does it tell you the claim is false: a

  bad citation can sit under a true statement.

  '
