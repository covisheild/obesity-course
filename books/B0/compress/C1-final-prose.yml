definition.text: 'A variable is a letter written in place of a number. It stands either for a number that is

  not yet known, or for a number that may take any of several values.


  Two things written side by side are multiplied. So 2x means 2 times x, and xy means x times

  y. A letter multiplied by itself is written as a power: x^2 means x times x.


  Brackets group a part of an expression so that it is treated as one quantity.


  Substituting a number for a letter replaces that letter, everywhere it appears, with the

  number. The expression then becomes arithmetic.

  '
simplified_explanation: "A letter in a sum is a number wearing a name.\n\n```working\n    2x\n```\n\nThat is not a two sitting beside an x. It is 2 times x. In algebra, writing two things side by\nside means multiply them.\n\nA letter obeys every rule a number obeys. It has to, because it is a number.\n\nSo you add letters the way you add numbers.\n\n```working\n    x plus x = 2x\n```\n\nBrackets do one job. They say treat what is inside as one quantity.\n\n```working\n    2(x + 5)\n```\n\nThat is 2 times the whole of x + 5. It is not 2 times x with a 5 added on afterwards.\n\nWhen you do find out what the number is, you put it in. Putting a number in place of a letter is\ncalled substituting.\n\nSay x turns out to be 7.\n\n```working\n    2x\n    2 times 7 = 14\n```\n\nFourteen. The letter went away and arithmetic was left.\n\nAn expression is a piece of algebra that stands for a number, like 2x + 5. An equation is a\nstatement that two expressions are the same number, like 2x + 5 = 19.\n"
illustration.body: "An Indian food label gets its energy figure by arithmetic, not by burning the food. The Food\nSafety and Standards (Labelling and Display) Regulations, 2020 fix the numbers to multiply\nby. Four kilocalories for every gram of carbohydrate. Four for every gram of protein. Nine\nfor every gram of fat.\n\nTake a packet whose panel says this for every 100 grams. Carbohydrate 60 grams, protein 12\ngrams, fat 20 grams. Those three gram figures are made up for this problem. The three factors\nare not.\n\nHere is the working that comes back first. It is wrong.\n\n```working\n    60 plus 12 plus 20 = 92\n    92 times 4 = 368\n```\n\nThe arithmetic is fine. What is wrong is using one factor for all three quantities.\n\nWrite the rule with letters instead. Let c stand for the number of grams of carbohydrate. Let\np stand for the number of grams of protein. Let f stand for the number of grams of fat. And\nlet E stand for the energy in kilocalories.\n\n```working\n    E = 4c + 4p + 9f\n```\n\nRead 9f as nine times f. And the f is not the symbol for gram.\n\nNow substitute.\n\n```working\n    4 times 60 = 240\n    4 times 12 = 48\n    9 times 20 = 180\n    240 plus 48 plus 180 = 468\n```\n\n468 kilocalories.\n\nA second packet comes along with 70 grams of carbohydrate, 5 grams of protein and 15 grams of\nfat. These are made up too.\n\n```working\n    4 times 70 = 280\n    4 times 5 = 20\n    9 times 15 = 135\n    280 plus 20 plus 135 = 435\n```\n\n435 kilocalories.\n\nYou wrote the same rule and put different numbers into it. That is what varies in a variable.\n"
illustration.analogy_breaks_when: 'The letters stand for numbers of grams. They do not stand for grams.


  And the three factors here cover carbohydrate, protein and fat only.

  '
must_know[0].point: 'Two things written side by side are multiplied. So 2x is two times x. Reading it as a two next

  to an x is the error that makes every later line unreadable. Say the multiplication out loud

  the first few times.

  '
must_know[1].point: 'A letter in a formula is a number, not a unit. In a line that ends 9f, the f is a count of

  grams and not the symbol for gram.

  '
must_know[2].point: 'Substitute, and the algebra turns into arithmetic you can check.

  '
must_know[3].point: 'One line with letters in it covers every case at once. So you check a whole column of a

  spreadsheet by checking the rule once and then testing two rows, rather than by reading the

  column.

  '
must_know[4].point: 'A letter standing for a number says nothing about which numbers are allowed. Read every

  answer back as a quantity before you use it.

  '
must_know[5].point: 'Name every letter in words when you put a formula on a board, in the same breath as you write

  it.

  '
