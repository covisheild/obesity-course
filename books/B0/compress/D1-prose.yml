definition.text: 'A probability is a number from 0 to 1 that states how often an outcome would turn up if the

  same chance process were repeated a great many times. It is the long-run relative frequency:

  the fraction of all the tries in which it happened, as the tries go on and on. The complete list of everything

  that could happen is the sample space. One member of that list is an outcome, and any collection

  of outcomes from it is an event.


  When every outcome in the sample space is equally likely, the probability of an event is the

  count of outcomes in the event, divided by the count of outcomes in the whole sample space.


  The complement of an event is every outcome in the sample space that is not in it. An event''s

  probability and its complement''s probability always add to 1.


  Call the probability of an event p, the letter p standing for probability. The odds of that

  event are a different number, built from the same p. The odds are how many times more likely

  the event is than its opposite: p divided by (1 minus p).

  Probability and odds carry the same fact about the event and are not the same number.

  '
simplified_explanation: 'A probability is a proportion. It is a part out of the whole it came from, never more than

  one. Work it out before the draw, not after it.


  A probability is a number that says how often something would happen if you could run the same

  situation over and over. It always sits between 0, which means never, and 1, which means every

  time.


  Everything that could possibly happen is the sample space — the complete list of outcomes an

  event could draw from. One thing that could happen is an outcome. A group of outcomes you care

  about, such as "the number is even", is an event.


  When every outcome is exactly as likely as every other, working out a probability is counting.

  Count the outcomes that make your event true. Count every outcome there is. Divide the first by

  the second.


  The complement of an event is everything that is not it. Roll a die and call a six the event.

  Everything else — one, two, three, four, five — is the complement. An event and its complement

  cover the sample space between them, so their probabilities always add to 1.


  Now the part that catches people, because you will meet it in many of the studies you read.

  Alongside probability there is a second number for the same fact, called odds. Odds are how many

  times more likely the event is than its opposite, not how likely it is. To get them, divide the

  probability by 1 minus the probability — that is, by the complement.


  A probability of 0.5 gives odds of 1, usually said as "evens" or "one to one". A probability of

  0.75 gives odds of 3, said "three to one". Odds and probability agree on which way a chance

  leans. They do not agree by how much, and the gap grows as the probability climbs toward 1.

  Confusing the two is a common mistake in reading a medical paper. Many papers you will read

  later report odds rather than probabilities. Learn to move between the two now.

  '
illustration.body: "Go back to section 3(1) of the National Food Security Act, 2013. It set five kilograms of\nfoodgrains per person per month for a priority household. Read on to section 3(2), which sets\na ceiling on how many people that entitlement can reach. It shall extend up to seventy-five per\ncent. of the rural population, and up to fifty per cent. of the urban population.\n\nPick one rural person, anywhere the Act covers, entirely at random. At random means every rural\nperson has exactly the same chance of being the one you pick. So the whole rural population is\nyour sample space, and the person you land on is your outcome.\n\nLet A be the event that the person you pick is covered by the entitlement. Ask for P(A), said\n\"P of A\", meaning the probability of A. P(A) is the p of the definition, for this particular\nevent.\n\nYou are not told how many people are actually covered, only the largest share the Act allows.\nSo work with 0.75 as a ceiling on P(A), not a measured figure, and carry that qualification\ninto every answer below.\n\n```working\n    P(A) is at most 0.75\n```\n\nNow the complement. Not being covered is everything else in the sample space.\n\n```working\n    1 minus 0.75 = 0.25\n```\n\nAt least one rural person in four, on this reading of the Act, is not covered.\n\nNow the trap. Turn 0.75 into odds: the probability divided by its complement.\n\n```working\n    0.75 divided by 0.25 = 3\n```\n\nThe odds a random rural person is covered are, at most, three to one. Here that happens to\nread the same as \"three in four\". That is exactly what makes the trap dangerous. It works once\nand then stops working.\n\nWatch it stop. The urban ceiling is fifty per cent. Turn that into odds the same way.\n\n```working\n    0.5 divided by 0.5 = 1\n```\n\nOdds of one to one, usually said \"evens\". A reader who hears \"odds of one\" as \"always\" has\nread the odds as a probability. Odds of one mean half the time. Fifty per cent probability is\nodds of one, not odds of fifty. And one hundred per cent probability is odds you cannot even\nwrite down, because dividing by 1 minus 1 divides by zero.\n\nNow go back the other way, because you will meet odds in print far more often than you will be\nhanded a probability. Suppose you read that the odds are two to one against — two to one that\nthe event does not happen. Odds \"against\" are the odds of the complement, so first flip them\nround: odds of two to one against is odds of one-half in favour.\n\n```working\n    odds in favour = 1 divided by 2 = 0.5\n```\n\nTurn odds back into a probability by counting parts. Odds of 0.5 mean 0.5 parts for the event\nto 1 part against it. Add those parts and there is one and a half parts in all. The\nprobability is the \"for\" part out of that total.\n\n```working\n    0.5 divided by 1.5 = 0.3333...\n```\n\nAbout a third. That is the rule in words: the probability is the \"for\" side of the odds,\ndivided by the \"for\" plus the \"against\". The event happens roughly one time in three, on this\nfigure, and nothing in the words \"two to one against\" told you that directly.\n"
illustration.analogy_breaks_when: 'Every probability above is a ceiling, not a measurement. The Act bounds how far the

  entitlement can extend; it does not say how many people are actually receiving it in any one

  district. Treat 0.75 as the largest the chance of being covered could be, and 0.25 as the

  smallest the chance of not being covered could be. Say so whenever you quote a figure built

  from them.


  Odds and probability are almost the same number near 0: 0.01 gives odds of 0.0101. Near 1 they pull apart:

  0.99 gives 99, and 0.999 gives 999.

  '
must_know[0].point: 'Odds of a figure are not the same as a probability of that figure. Reading "odds of 0.25"

  as a one-in-four chance is a common slip. Odds of 0.25 convert to a probability of 0.25

  divided by 1.25, which is 0.2 — a one-in-five chance. Convert before you speak.

  '
must_know[1].point: 'Near 0, odds and probability are almost the same number. Above one half they pull apart, and

  near 1 they pull apart fast: 0.99 to 0.999 multiplies the odds by ten. Ask which end of the

  scale you are near before you trust a guess about the size of a change.

  '
must_know[2].point: 'A probability describes a group, or a process repeated many times. It does not describe the one

  person in front of you. Knowing that 0.75 of a population is covered by an entitlement tells you

  nothing about whether this particular person is one of them. Use the figure to plan for a group.

  Then go and check the individual case on its own.

  '
must_know[3].point: 'A statute''s own words often give you a ceiling, marked "up to", rather than a measured figure.

  Every probability, complement and odds you compute from a ceiling is itself a ceiling. Say so

  in the same sentence you quote the number, or the reader will treat it as a count.

  '
must_know[4].point: 'When a journalist reads you an odds figure over the phone, do not repeat it as a percentage

  without converting it first. "Odds of three to one" means three chances in four. Say "three

  in four" and the journalist hears it right.

  '
