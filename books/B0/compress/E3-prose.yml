definition.text: 'Energy is a quantity that can be counted. It is measured in joules, and it takes many forms:

  kinetic, potential, chemical, thermal, electrical and radiant among them. Foods and fuels

  carry chemical energy, which oxidation transfers to whatever is doing the accounting.


  A system is whatever has been enclosed for the purpose of an accounting. The boundary is the

  closed surface that encloses it, and the surroundings are everything outside that surface. The

  system is chosen by the person doing the accounting. It is not a feature of the situation, and

  nothing in the situation selects one.


  The law of conservation of energy states that total energy is constant in any process. It may

  change in form, or be transferred from one system to another, but the total remains the same.


  Applying that law across a boundary gives the energy balance. The energy inside the boundary at

  the end of an interval equals the energy inside at the start, plus every quantity of energy

  that crossed the boundary inwards, minus every quantity that crossed it outwards. This is the

  stock-and-flow balance of the earlier section, with energy as the stock and the crossings as

  its flows.


  Two consequences follow, and they are the whole of the section. A system''s energy changes only

  by energy crossing its boundary, because any other route would require the total to change.

  And the change in a system''s energy is fixed only once the boundary is fixed: two boundaries

  drawn around one situation give two different changes, both correct, because they answer two

  different questions.


  The balance constrains the numbers and nothing else. It does not say by which route energy

  crossed, what caused a crossing to change, or what a quantity of energy amounts to in any unit

  other than a unit of energy.

  '
simplified_explanation: "This section stands on the one about stocks and flows. That gave you a line for counting anything\nthat sits somewhere while things go in and out. Energy is one of the things that line counts, and\nthis is the section that says why.\n\nStart with the rule. It is one sentence and it does more than it looks.\n\nEnergy is never made and never destroyed. It changes form, and it moves from one place to\nanother, and the total stays where it was.\n\nThat sounds like a rule about the world. It is. But on its own it lets you compute nothing,\nbecause it talks about the total of everything, and nobody can count everything.\n\nSo here is the move that turns it into arithmetic. **Draw a line round something.**\n\nThe line is closed, like a circle on paper. Whatever you have drawn round is called the system.\nThe line itself is called the boundary. Everything outside the line is called the surroundings.\n\nNow the whole idea in one picture. The total for inside plus outside never changes. So if the\namount inside goes up, the amount outside must have gone down by the same amount. And the only\nway that happens is if energy crossed the line.\n\nNow build it as steps, so that you could put it together again tomorrow without this page.\n\n**Step one. Split everything in two.** The line is closed, so every bit of energy in the world is\neither inside it or outside it. Nothing is both and nothing is neither.\n\n```working\n    the total = the amount inside, plus the amount outside\n```\n\n**Step two. Use the rule.** The total does not change over the interval you are looking at. So\nthe total at the end is the same number as the total at the start.\n\n```working\n    the amount inside at the end, plus the amount outside at the end\n    = the amount inside at the start, plus the amount outside at the start\n```\n\n**Step three. Take the starting amounts off both sides.** This is the move from the section on\nrearranging an equation, done twice. Take away \"the amount inside at the start\", then take away\n\"the amount outside at the start\". The right-hand side becomes nothing at all. The left-hand side\nnow has four pieces in it.\n\nYou may write those four pieces in any order you like. A run of adding and taking away comes out\nthe same whatever order you do it in. Adding 3 and then taking away 5 lands you where taking away\n5 and then adding 3 lands you. So put each end value next to its own start value.\n\n```working\n    the amount inside at the end, minus the amount inside at the start,\n    plus the amount outside at the end, minus the amount outside at the start = 0\n```\n\nNow read each pair on its own. An end value minus its own start value is a change. So the first\npair is the change inside, and the second pair is the change outside.\n\n```working\n    the change inside, plus the change outside = 0\n```\n\nRead what that says. The two changes add to nothing. So whatever the inside gained, the outside\nlost, and by exactly the same amount.\n\n**Step four. Name where it went.** Energy that left the outside and arrived inside crossed the\nline inwards. Energy that went the other way crossed it outwards. There is no third possibility,\nbecause step one used up the whole world in two pieces.\n\nSo write down what the outside did. It lost everything that crossed in, because that energy came\nout of it. It gained everything that crossed out, because that energy went into it.\n\n```working\n    the change outside = the total that crossed out, minus the total that crossed in\n```\n\nPut that into step three's line, in place of \"the change outside\".\n\n```working\n    the change inside, plus the total that crossed out, minus the total that crossed in = 0\n```\n\nNow clear the last two pieces off the left, the same way step three cleared the start values.\nTake away \"the total that crossed out\" from both sides. Then add \"the total that crossed in\" to\nboth sides.\n\n```working\n    the change inside = the total that crossed in, minus the total that crossed out\n```\n\nLast, put the start value back. The change inside is the energy inside at the end minus the\nenergy inside at the start. So add \"the energy inside at the start\" to both sides. That gives the\nline you will actually use.\n\n```working\n    the energy inside at the end = the energy inside at the start, plus everything that crossed in, minus everything that crossed out\n```\n\nNothing was assumed there except the one rule at the top and the fact that your line is closed.\nThat is the whole derivation, and you have written the last line before. It is the balance line\nfrom the section on stocks and flows, with energy as the stock. That section gave you the line.\nThis section gives you the rule that makes it true of energy: a system gains or loses energy only\nby energy crossing the boundary.\n\nNow the part that surprises people, and it is the reason this section exists.\n\n**Where you draw the line is your choice.** Nothing in the situation tells you where it goes. A\npan of water, a pan and its stove, a whole kitchen. Those are three different lines round one\nevent. Each gives a different answer to \"how much did the energy change?\"\n\nNone of the three is the wrong answer. They are answers to three different questions, and the\nquestion is the line.\n\nSo a number for an energy change is not finished until somebody says what it was measured round.\nIf you are handed one and nobody has said, you have not been handed a measurement yet. Ask\n\"round what?\" before you argue about the figure.\n\nOne more thing, and then a warning.\n\nEnergy is counted in joules, which you met in the section on energy units. A joule is small. It\nis about what you spend lifting a small apple from the floor to the table.\n\nThe warning is about what this line does not do. It tells you that the numbers have to add up.\nIt does not tell you which way energy went. It does not tell you why a flow changed. And it does\nnot tell you what a heap of joules is worth in kilograms of anything.\n\nThat last one matters here. Nothing in this section puts the energy balance together with a\nbalance in kilograms. Doing that means saying how much energy a kilogram of a body holds, which\ndepends on what the kilogram is made of. Nothing in Book 0 gives you that figure, and you should\nbe suspicious of anyone who hands you one as if it were arithmetic.\n"
illustration.body: "Start where the search failed, because the failure is the section.\n\nYou have just been told that energy is conserved. The next question asks itself. Conserved\ninside what? So go to the book that states the law and look it up.\n\nOpen OpenStax College Physics 2e, section 7.6, Conservation of Energy, at\nhttps://openstax.org/books/college-physics-2e/pages/7-6-conservation-of-energy. Open your\nbrowser's find box. Type the word system and press enter.\n\nYou get hits. The law itself talks about energy being transferred \"from one system to another\".\nThe list of steps for solving a problem opens with this.\n\n> Step 1. Determine the system of interest and identify what information is given and what\n> quantity is to be calculated. A sketch will help.\n\nRead that again. Determine the system of interest. It tells you to decide what the system is.\nIt never tells you what a system is.\n\nWiden the search and College Physics 2e still does not define it. The book that does is\nUniversity Physics Volume 2, in its thermodynamics chapter — section 3.1, Thermodynamic\nSystems. It says a system is embedded in its environment. It says the system exchanges heat\nwith that environment through a boundary.\n\nNow notice where that definition sits. It is in a chapter about setting up a measurement, not\nin a chapter about stating the law. The pages that state the law use the word and leave it\nundefined.\n\nNow stop and ask why a careful book would leave that out, because the answer is the idea you\ncame for.\n\n**A system is not a thing in the world.** It is a line somebody drew. A physics book can tell\nyou about things in the world. It cannot tell you where you decided to draw your line.\n\nSo look in a book that is describing a measurement, because a measurement has to say.\n\nOpen OpenStax Chemistry 2e, section 5.2, Calorimetry, at\nhttps://openstax.org/books/chemistry-2e/pages/5-2-calorimetry. Search inside it for the word\nsurroundings. The first sentence you land on says this.\n\n> The measurement of heat transfer using this approach requires the definition of a system (the\n> substance or substances undergoing the chemical or physical change) and its surroundings (all\n> other matter, including components of the measurement apparatus, that serve to either provide\n> heat to the system or absorb heat from the system).\n\nRequires the definition of a system. Not contains one. Requires that somebody supply one, and\nthe somebody is you.\n\nNow use it, on a kitchen, and watch one event give four different answers.\n\nA small gas burner heats water in a steel pan for two minutes. The gas that burns in those two\nminutes releases 60,000 joules of chemical energy. Of that, 42,000 joules ends up in the water and 11,000 joules ends up in the steel of the pan. The\nother 7,000 joules ends up in the air of the kitchen. The kitchen door and window are shut for the two minutes.\n\nThose four figures are made up for this example. Nothing in this course measured them. Check\nfirst that they are at least consistent with the law, which is one addition.\n\n```working\n    42000 plus 11000 plus 7000 = 60000\n```\n\nSixty thousand out of the gas, sixty thousand into three places. Nothing appeared and nothing\nwent missing. Now draw lines.\n\n**Line one, round the water only.** What crossed in: 42,000 joules, from the flame and the hot\npan. What crossed out: nothing. Put that through the balance line.\n\n```working\n    42000 minus 0 = 42000\n```\n\nThe energy inside went up by 42,000 joules.\n\n**Line two, round the water and the steel pan together.** Now the 11,000 joules in the steel is\ninside your line instead of outside it. What crossed in is the 42,000 and the 11,000 together.\n\n```working\n    42000 plus 11000 = 53000\n```\n\nThe energy inside went up by 53,000 joules.\n\n**Line three, round the burner, the unburnt gas, the pan and the water.** This one is\ndifferent, because the chemical energy of the gas now starts inside your line. At the start,\ninside, there are 60,000 joules sitting in the gas. At the end that gas is burnt, and what is\ninside instead is the 42,000 in the water and the 11,000 in the steel. The other 7,000 has\ncrossed the line into the kitchen air.\n\n```working\n    53000 minus 60000 = -7000\n```\n\nThe energy inside went **down** by 7,000 joules. Down, for the same two minutes in which the\nwater got hot.\n\n**Line four, round the whole kitchen.** The door and window are shut. Nothing crossed in,\nnothing crossed out.\n\n```working\n    0 minus 0 = 0\n```\n\nThe energy inside did not change at all. Inside the line, 60,000 joules of chemical energy\nbecame 60,000 joules spread through water, steel and air. The form changed. The total did not.\n\nPut the four side by side.\n\n```table\nwhere the line is drawn  change in the energy inside\nthe water                plus 42,000 joules\nthe water and the pan    plus 53,000 joules\nthe burner, the gas, the pan and the water  minus 7,000 joules\nthe whole kitchen        0 joules\n```\n\nFour numbers, one event, and every one of them is right. Ask \"how much did the energy change in\nthose two minutes?\" and there is no answer until somebody says where the line is. The question\nis not finished without it.\n\nNow the sense of size, so the figures mean something to you. One joule is small.\n\n> One joule is not a large amount of energy; it would lift a small 100-gram apple a distance of\n> about 1 meter.\n\nSo 60,000 joules is about what you would spend lifting that apple 60,000 times. Two minutes of\na small burner. Keep that picture; it is the only real number in this example.\n\nLast, the thing to do with your hands when somebody hands you an energy figure. Three steps, in\nthis order.\n\nDraw the line, on paper, closed. Write on the outside of it every route by which energy can\ncross — the flame, the air, the light, the wire, the food, the water going down the drain.\nThen put a number on each route, and see whether the numbers add up to the change somebody\nclaimed.\n\nThe routes are where the arguments are. A balance that fails almost never fails because\nconservation failed. It fails because a route was left off the paper.\n"
illustration.analogy_breaks_when: 'The four energy figures in the kitchen — 60,000, 42,000, 11,000 and 7,000 joules — are made up

  for this example. No burner was measured. Only the size of the joule comes from a source.


  The shut kitchen is an idealisation and it has a time limit. Over two minutes, a closed room

  loses little enough through its walls that treating the crossing as zero is fair. Over an hour

  it is not fair, and over a day it is wrong. Every sealed boundary in this course is sealed for

  a stated stretch of time.


  Every route across the line has to be on your paper. Miss one — a window left open, a wire, a

  drain, light going out through glass. The energy that went that way then turns up in your

  arithmetic as an error in a route you did count. So a balance that does not close has two

  possible causes. Either a route was left off the paper, or a figure on the paper is wrong. The

  balance cannot tell you which.


  Conservation is exact and it is not the whole story about energy. The 7,000 joules spread

  through the kitchen air is every bit as real as the 42,000 in the water, and it will not cook

  anything. The balance counts joules. It says nothing about which joules you can still use.


  The balance holds for a person exactly as it holds for a pan. What it will not do is turn

  joules into kilograms of a body. That conversion needs to know what the kilograms are made of,

  which is a question about bodies and not about arithmetic. Nothing in this course has given you

  that figure, and nothing in this section can produce one. If a figure in kilocalories for each

  kilogram is offered to you as though it followed from conservation, it does not follow from

  anything here.

  '
must_know[0].point: 'An energy figure with no boundary attached is not a measurement yet. Ask "round what?" before

  you argue about the number. Two people quoting different figures for one event are often both

  right. They drew different lines, and the argument ends the moment somebody says where their

  line was.

  '
must_know[1].point: 'Energy is never lost, so refuse the word when somebody uses it to close an inquiry. Energy that

  has left your system is in the surroundings, by some route. Naming the route is the work. A

  claim that energy was lost tells you only that the speaker stopped counting.

  '
must_know[2].point: 'A system gains or loses energy only by energy crossing its boundary. So every explanation of a

  change has to name a crossing. A mechanism that adds no route, and makes no existing route

  bigger, cannot move the balance. Say that to anyone who offers you one.

  '
must_know[3].point: 'The balance tells you the numbers must add up. It never tells you why one of them moved. So do

  not use conservation to explain anything. It is an identity, in the way a shop''s ledger is an

  identity, and no ledger has ever explained a purchase. Anyone arguing from "energy must be

  conserved" to a cause has changed the subject.

  '
must_know[4].point: 'Nothing turns joules into kilograms of a body. That is a limit of the tool, not a gap to be

  filled from somewhere handy. How much energy a kilogram of change holds

  depends on what the change is made of. So a single conversion figure, handed to you as

  arithmetic, carries a claim about composition that nobody has said out loud. Say so when you

  meet one.

  '
must_know[5].point: 'A person is not a closed system, so "the energy has to go somewhere" is true and names nothing.

  Energy crosses a person''s line inwards in food and drink. It crosses outwards as heat, as work

  done on things around them, and in what leaves the body unabsorbed. Until those routes are

  counted, the sentence is a reminder to count rather than a finding.

  '
must_know[6].point: 'Teach the line before the equation. A trainee who draws a closed boundary and lists the

  crossings can set up a problem they have never seen. One who has learnt the balance and not the

  boundary will apply it to whichever things the question happens to name.

  '
must_know[7].point: 'When a claim is defended on the ground that energy is conserved, say plainly what conservation

  does. It rules things out. On its own it establishes nothing. It is the cheapest check you have

  and the weakest evidence you have, and those two facts are the same fact.

  '
