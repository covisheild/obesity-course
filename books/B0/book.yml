id: B0
number: 0
title: Ground floor
subtitle: Numbers, units, change, uncertainty, the body's chemistry, and reading evidence
cover_line: The foundation every later book stands on
status: frozen            # frozen | in progress
version: "1.1"
last_updated: 2026-09-23
why: |
  Every other book in this series stands on this one. It teaches, once, the ground floor the
  other 195 books assume: numbers you can trust, units and dimensions, relationships and change,
  uncertainty, the chemistry of a body, and how to read evidence. It assumes you can read English
  and use a calculator. It assumes nothing else: no medicine, no biology, no remembered
  mathematics.
how_to_read: |
  Read it in order. Each section assumes everything before it and nothing after it. If a section
  looks easy, read it anyway and read it quickly: it is here because something later needs it.
back_blurb: |
  Forty-three short sections that take you from place value to reading a statute: the arithmetic,
  units, graphs, probability, measurement, energy and biology that every later book in the series
  takes for granted. Every claim is checked against a source you can open. Every worked answer is
  recomputed. Every section ends with exercises and practice problems you can do.
