definition.text: 'A research question is answerable when it passes two tests.


  The first test is that it is an empirical question: one that can be answered by observing the

  world. A value question asks what ought to be done, and people answer it from their values. No

  observation settles it. Blackstone''s textbook calls this an ethical question. What people think

  about a value question, and what happens after a choice is made, are empirical questions.


  The second test is that the question is feasible: the person asking can actually get the answer

  with what they have. Feasibility covers access to enough of the people the question is about, a

  way to measure the outcome, the time, the money, the equipment and the skills. It also covers

  approval from an ethics committee.


  A question that passes both tests can still be too broad. It may name several exposures or

  outcomes, or a population too large to reach. Narrowing means rewriting the question itself,

  its population, exposure or outcome, until one study can answer it. Narrowing can change the

  kind of question, for example from cause to relate, and when it does, the question now asks

  something different.


  FINER is one published checklist for a research question: feasible, interesting, novel, ethical

  and relevant, credited to Hulley and colleagues. Its "ethical" means a study an ethics committee

  would approve, not a value question. It is a guide, not a rule, and other versions add letters.

  '
simplified_explanation: "The last two sections taught you to write a question in one sentence and to name its kind. Before\nyou keep a question, put it through two tests.\n\n**Test 1: can the world answer it?** An empirical question is one that observing the world can\nanswer. How many children buy snacks at the school gate is empirical. Whether snacks should be\nbanned at the school gate is not. That second one is a value question — a question about what\nought to be done, which people answer from their values. Weighing every child in the district\nwould not settle it. Blackstone's textbook calls this kind an ethical question.\n\nA value question is not useless. It usually has empirical questions inside it. What do parents\nthink a ban would do? What happened to children's snacking where a ban was tried? Those can be\nanswered. The decision itself still belongs to whoever has to make it.\n\n**Test 2: can you get the answer?** A feasible question is one that you, with what you have, can\nactually answer. Go down this list and, for each line, write what you actually have.\n\n- People you can reach, in enough number.\n- A way to measure the outcome.\n- Time.\n- Money.\n- Equipment, and the skill to use it.\n- Approval from an ethics committee. That is a group of people at a hospital, college or research\n  body. It reads a researcher's plan before any research starts, and can say yes, no, or change\n  this first.\n\nA line with nothing written beside it is a fail.\n\n**Then check the size.** A question can pass both tests and still be too broad. \"What causes\nobesity in children in Chhattisgarh?\" is empirical. Nobody could answer it in one study. So you\nnarrow it. You give the population a boundary you can reach, pick one exposure, and name one\noutcome.\n\nWatch what narrowing does to the kind of question. Cutting \"what causes\" down to \"is this one\nthing associated with\" turns a cause question into a relate question. That can be the right move.\nBut the study now answers the relate question, and your report must not claim more than that.\n\nYou will meet a published checklist called FINER: feasible, interesting, novel, ethical,\nrelevant. Aslam and Emmanuel credit it to Hulley and colleagues. Its F is test 2 above. Its E means\na study an ethics committee would approve, which is a different use of \"ethical\" from Blackstone's.\nFINER is a guide that researchers use, not a rule. Ratan and colleagues use a longer version,\nFINERMAPS, with more letters.\n"
must_know[0].point: 'The error is to keep a "should" question because it feels important. No data answer "should".

  Find the empirical questions inside it, and leave the decision with the person who has to make it.

  '
must_know[1].point: 'Run the feasibility list in writing. Beside each line, write the name, the thing or the date you

  actually have. A line you can only fill with "should be possible" is a fail until you have

  asked.

  '
must_know[2].point: 'When you shrink what you can reach, shrink the population in the question too. If the fieldwork

  covers four schools and the sentence still says "Raipur district", your report will claim a

  district it never measured.

  '
must_know[3].point: 'When narrowing turns a cause question into a relate question, say so in the protocol. Then no

  one, including you, writes "causes" in the conclusion later.

  '
must_know[4].point: 'A feasibility check done at a desk can still fail in the field. Before the main study, run a

  small trial of the hardest line, usually the measurement. If the question fails in the field,

  write down what went wrong.

  '
must_know[5].point: 'Passing both tests shows only that you can get an answer. It says nothing about whether anyone

  needs that answer. A question can pass both and still not be worth your time.

  '
must_know[6].point: 'When a trainee cites FINER as if it settles a question, correct two things. It is a published

  guide, not a rule or a validated scoring tool. And its E means a study a committee would approve,

  not a question about values.

  '
