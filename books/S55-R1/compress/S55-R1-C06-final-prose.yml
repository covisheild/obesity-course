definition.text: 'A citation is an entry in the reference list of a later published work that points to an earlier

  one. A citation database records the reference lists of the journals it indexes. For each paper

  it holds, it counts how many of those later works cite it. Web of Science, owned by Clarivate, is

  the database behind most of the figures below; Scopus is another. A paper is uncited, in a given

  database, when that count is zero.


  Every count of uncited papers rests on three choices. The first is the database, and which kinds of document in it are counted. The second is the

  set of papers, usually all those published in one year. The third is the citation window: how long after publication the counting runs.


  The measurements depend on those choices. A 1990 report in Science found 55% of items published

  from 1981 to 1985 uncited 5 years later. It counted letters, corrections, meeting abstracts and

  other editorial material, which are rarely cited.


  Counting research articles and reviews in Web of Science, Larivière and Sugimoto found 4% of biomedical papers published in 2006 uncited by December

  2017. These figures come from an analysis done for a news feature in Nature, and the data behind its charts were not released.


  Nicolaisen and Frandsen counted in Scopus. They took seven document types published from 1996 to 2015, among them articles, reviews, letters and

  notes, and counted citations up to 6 December 2018. They give each result as an uncitedness ratio, a share written as a fraction of 1, so 0.23 means

  23 in every 100. For medical articles alone it was 0.18, and for medical notes 0.64.


  A database misses citations: a paper it records as uncited may have been cited in a journal or book it does not index, or missed through an error.

  So the true share uncited is probably lower than the database shows.


  A citation records that one work referred to another. It does not record whether the earlier work

  was used, and many citations are superficial. An uncited paper may still be read and used.


  One study held for this course sorts papers by design.


  Patsopoulos, Analatos and Ioannidis took

  2646 articles published in 1991 and 2001 from the Science Citation Index in Web of Science. They

  sorted them into seven designs by the design named in the title; the second example below shows

  five of them. They counted each article''s citations to the end of the second year after

  publication and gave the median for each design, not a share uncited. Meta-analyses, which

  combine earlier studies, had the highest medians. Case reports, on one patient or a few, received

  negligible citations. The study has no cross-sectional category. So no held measurement says how

  often descriptive cross-sectional studies are cited, or go uncited.

  '
simplified_explanation: "Here is the trap with citation figures. The same word, \"uncited\", gives numbers from under 1% to\nover 50%. It is because each one counted something different. Every figure rests on three choices.\n\n- **The database, and what it counts.** A database such as Web of Science holds the reference lists\n  of the journals it covers, about 12,000 of them. Some counts include letters and corrections,\n  which are rarely cited.\n- **Which papers.** Usually all the papers of one field published in one year.\n- **How long you wait.** Counting stops at some date. The longer you wait, the fewer papers stay\n  uncited.\n\nSo before you use any figure for uncited papers, ask three questions. Which database, counting\nwhat? Papers from which year? Counted until when?\n\nThree more facts change how you read a citation count.\n\nThe database misses citations. In one check, a biologist named Heneberg looked at the Web of Science\nrecords of 13 Nobel prizewinners. At first glance about 1.6% of their papers looked uncited. After\nabout 20 hours of checking by hand, he got it down to 0.3%. The rest had been cited, and the\ndatabase had missed it.\n\nBeing cited is not being used. A reference can be one line in a long list.\n\nBeing uncited is not being useless.\n"
must_know[0].point: 'Never quote a share of uncited papers without its three labels. Name the database and what it

  counted. Name the year the papers were published. Name how long the count ran.

  '
must_know[1].point: 'The belief that more than half of all papers are never cited is an error. It goes back to a 1990 count that

  included letters, corrections and meeting abstracts, over only 5 years. Refuse the "half" figure when you hear it.

  '
must_know[2].point: 'Read "uncited" as "no citation found in this database by this date", not as a fact about the

  paper. Before you call a paper uncited, search for it in a second database and on the open

  web.

  '
must_know[3].point: 'Web of Science shows papers by Indian authors as less often cited than papers from the United

  States and Europe. But it leaves out many regional-language journals, and counting them would

  narrow the gap. Before concluding that a department''s work goes unread, find out whether the

  database covers the journals it was published in.

  '
must_know[4].point: 'Do not use citation as your test of whether a study was worth doing. Test a question by who

  needs its answer and what they would do with it, as the last section began to do.

  '
must_know[5].point: 'When someone says a kind of study, such as a descriptive cross-sectional study, is "never cited",

  ask for the study that counted it. The one held count by design, of Web of Science articles of

  1991 and 2001, has no cross-sectional category.

  '
must_know[6].point: 'A paper''s title is not its finding. Golosovsky and Larivière''s paper is called "Uncited papers are not

  useless". It shows that uncited papers follow the same statistical pattern as cited ones. Most of

  them, it finds, have some chance of being cited given enough time. It does not measure whether anyone

  used them.

  '
must_know[7].point: 'What would overturn these figures is a peer-reviewed count in another database that gave very different shares. Until

  then, quote them as what they are: counts in Web of Science and Scopus.

  '
