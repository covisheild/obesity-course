definition.text: 'A research question can be written as one sentence with up to four parts.


  The population is the group the answer is about. It is bounded by place, by person (age, and any other trait that decides who is in) and by time.


  The exposure is what differs between the people being compared: something they have, do or meet. When a researcher or a programme gives it on purpose, as the thing being tested, it is called the intervention.


  The comparison is the group, or the level of exposure, that the exposed group is set against.


  The outcome is what is measured to answer the question. A question has one main outcome.

  '
simplified_explanation: '**Population** — who the answer is about.


  Here the population needs a fence round it on three sides. Place: which district, which schools. Person: what ages, and anything else that decides who is in. Time: which year. "School children" has no fence. "Children aged 10 to 14 in government schools in Raipur district in the 2027–28 school year" has all three.


  **Exposure** — what differs between the people you compare. It is something they have, do or meet: walking to school, a night shift, living near a sweet shop.


  **Comparison** — the group you set the exposed group against. Children who walk to school are compared with children who are driven.


  **Outcome** — what you measure to answer the question. Obesity judged from measured weight and height is an outcome.


  The four parts have short names made from their first letters. PICO is population, intervention, comparison, outcome. Use it when someone gives the thing being tested. PECO is population, exposure, comparison, outcome. Use it when people meet the exposure in their ordinary lives.


  Not every question needs all four. "What share of these children have obesity?" has a population and an outcome, and nothing else. It asks how common something is.

  '
must_know[0].point: 'The error is to think "school children" is a population. A population has a fence of place, person and time. Refuse to plan a sample until the sentence names all three.

  '
must_know[1].point: 'Write the question as one sentence, then label its population, exposure or intervention, comparison and outcome. If you cannot label a part, the question does not have it.

  '
must_know[2].point: 'Obesity can be the exposure or the outcome. "Do adults with obesity miss more clinic visits?" has obesity as the exposure.

  '
must_know[3].point: 'A question with two outcomes is two questions. Split it, and keep the one you would choose if you could only have one.

  '
must_know[4].point: 'So when you read a paper, find its population, exposure, comparison and outcome yourself. Do this before you accept what it says it answered.

  '
must_know[5].point: 'A trainee brings a title like "Prevalence and risk factors of obesity in urban slums". Ask them to read out their one outcome and their one exposure.

  '
must_know[6].point: 'The four-part check tells you a question is complete and asks one thing. A perfectly formed sentence can still be the wrong question to ask.

  '
