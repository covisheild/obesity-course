definition.text: 'A research question can be answerable and still not be worth answering. Worth answering is a

  separate judgement, and it rests on three tests.


  First, the answer is in doubt: there are reasons to expect more than one answer before any data

  are collected. Second, the answer is not already known: nobody has answered the question well

  for the people, place and time you mean. Third, the answer has practical consequences: at least

  one possible answer would lead someone to decide or act differently from another possible

  answer.

  '
simplified_explanation: "So a question you can answer faces three more tests before you keep it.\n\n1. **Is the answer in doubt?** Write down two different answers you might get, with a reason to expect each.\n2. **Is it already answered?** Look for studies and reviews that have asked it before, and for counts that someone\n   already holds.\n3. **Would the answer change anything?** Write each possible answer on its own line. Beside each,\n   write what someone would decide or do if that answer came back. If every line says the same\n   thing, the answer changes nothing.\n\nA question that passes all three is worth answering. One that fails any of them is not, as it\nstands. Often it can be changed until it passes.\n"
must_know[0].point: 'The error is to treat a question you can answer as a question worth answering. Run the three

  tests on every candidate you can answer before you keep it.

  '
must_know[1].point: 'Before you keep a candidate, write down two answers you might get, with a reason for each.

  '
must_know[2].point: 'Look for an existing answer before you plan a study, not after. Ask the programme what it

  already counts, and look for reviews that have gathered earlier studies.

  '
must_know[3].point: '"It has been studied already" does not end a question, and "it has not been studied here" does

  not save one. Refine a studied question only where you have a reason to expect a different answer

  for your people or your place.

  '
must_know[4].point: 'Design the study so that it is useful whichever answer comes back.

  '
must_know[5].point: 'These tests judge a question on the day you run them. Run the tests again before each big step,

  such as writing the protocol or starting to collect data.

  '
