definition.text: 'A research topic names an area of interest, such as obesity in adolescents. A research

  question is a sentence that asks one thing a study will find out about a topic. A study is

  built to answer one main question.


  A research question is chosen when it is one of several candidates, set side by side, and the

  others are turned down.


  The question is the first decision in a study. The methods that follow answer the question

  that was asked. None of them can turn it into a better question.

  '
simplified_explanation: 'A topic is an area, like "obesity in school children". A question asks one thing you will find

  out, like "What share of children aged 10 to 14 in one district''s government schools have

  obesity?" You cannot plan a study from a topic. You can plan one from a question, because the

  question tells you whom to find and what to measure.


  The trouble starts when the first question to arrive is the one you keep, without setting it beside any other.


  Choosing means this. You write down several candidates, put them side by side, and turn most of them down.

  '
illustration.body: 'Here is the setting this book uses from start to finish. It is made up. You are a postgraduate student in community medicine at a medical college in Chhattisgarh. You must propose a first research question on

  obesity.


  Suppose your guide says, in your first week, "Do something on obesity in school children." You write that at the top of a page as your question.


  Ask the page three things. Which children: what ages, which schools, where? What will you measure: weight, meals, games periods, screen time, or all of them? The page cannot answer any of them. "Obesity in

  school children" is a topic.


  Now suppose, in the same made-up week, three more candidates reach you. Here are all four, each

  written as a question, with the route by which it arrived.


  ```table

  | How it reached you | The candidate, written as a question |

  | Your guide named a topic | What share of children aged 10 to 14 in government schools in Raipur district have obesity? |

  | The department already holds weight and height records from last year''s district screening camp | Among adults screened at that camp, did those from the town have obesity more often than those from villages? |

  | The last paper you read ended with a line on future research into meal timing | Among students at your college, do those who usually eat dinner late gain more weight over one year than those who eat early? |

  | A senior told you to pick something you could finish quickly | What share of patients at the district hospital''s NCD clinic know their own weight? |

  ```


  You chose none of the four. Each one arrived.


  The fault would be to keep the first question that arrives, because it arrived first.


  Put the four side by side. You do not yet have the tests that decide between them; the rest of this book builds them. Decide now that most of these will be turned down, and that you will write down the reason

  for each one.

  '
illustration.analogy_breaks_when: 'The table sorts candidates by how they arrived. It says nothing about which one is best.

  '
must_know[0].point: 'The error is to write a topic where the question should be. Refuse to plan a single step until

  you have a sentence that asks one thing.

  '
must_know[1].point: 'A question with no rivals has not been chosen.

  '
must_know[2].point: 'The future-research line at the end of a paper is a good place to find a candidate. It was

  written for the authors'' own field and data, not for your district. Take it as one candidate

  among several, never as the choice already made.

  '
must_know[3].point: 'A careful sample and a correct analysis answer the question that was asked. If that question

  was the wrong one, the study is well done and still no use to anyone.

  '
must_know[4].point: 'When a trainee says "my guide gave me the topic", do not argue about the guide. Ask them to

  write three questions inside that topic and say which two they would drop, and why.

  '
must_know[5].point: 'Knowing how a question arrived tells you only whether it was compared with others. It does not

  tell you whether the question is good. An assigned or borrowed question can win a fair

  comparison. Judge it by the tests, not by where it came from.

  '
