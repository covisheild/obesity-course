definition.text: 'A research question is one of three kinds, and its kind decides which study can answer it.


  A descriptive question asks how common an outcome is, or how much of it there is, in a stated

  population at a stated place and time, and in which people it is commoner. It names no exposure.


  A relational question asks whether an exposure is associated with an outcome. An exposure is

  associated with an outcome when people with the exposure have the outcome more often, or less

  often, than people without it.


  A causal question asks whether changing the exposure would change the outcome. An association

  is needed for this and is not enough. The exposure must also come before the outcome in time,

  and the association must not be explained by some third thing that moves both.


  A cross-sectional study enrols a sample of a population and measures exposure and outcome at the

  same time. It measures the prevalence of the outcome at that point: how many people in the group

  have the condition. It answers a descriptive question. For a relational question it can show an

  association, but it usually cannot show which of the two came first.


  Studies built to answer relational questions have a comparison group. In a cohort study the

  investigator records who is exposed and who is not, follows them over time, and compares how

  often the outcome appears in each group. In a case-control study the investigator enrols people

  who have the outcome (cases) and people who do not (controls), and compares their past

  exposures. In both, the investigator observes the exposure and does not set it.


  In a randomised controlled trial the investigator sets the exposure, and chance decides who

  receives it. The groups are then followed and compared. Because chance, and nothing about the

  people, decides who is exposed, a third thing cannot decide it either. This is the design

  that answers a causal question directly, wherever the exposure can be assigned.


  A systematic review is a study of studies. It collects and combines the results of the studies

  already done on one question.

  '
simplified_explanation: "The last section wrote a question as one sentence, with a population, an exposure and an outcome.\nNow read that sentence again and ask what kind of question it is. There are three kinds.\n\n```table\n| The question asks | Kind | The study that answers it |\n| How common is it, and in whom? | describe | a cross-sectional study: one visit, one count |\n| Do people with the exposure have the outcome more often? | relate | a cohort study or a case-control study |\n| If we change the exposure, does the outcome change? | cause | a randomised controlled trial |\n```\n\nA describe question has no exposure. \"What share of children aged 10 to 14 in one district's\ngovernment schools have obesity?\" asks for a count. You answer it with a cross-sectional study.\nYou take a sample, visit once, and count. Book 0's section on sampling taught you to ask how\nthat sample was picked. The count is the prevalence — how many people in a group have the\ncondition.\n\nA relate question asks whether an exposure and an outcome go together. When people with the\nexposure have the outcome more often, or less often, than people without it, the two are\nassociated. To see that, you need a comparison group: people without the exposure, or without\nthe outcome.\n\n- A cohort study starts from the exposure. You record who is exposed and who is not. You follow\n  both groups over time and count who develops the outcome.\n- A case-control study starts from the outcome. You enrol people who have it (cases) and people\n  who do not (controls). Then you compare what each group was exposed to in the past.\n\nIn both, you watch the exposure happen. You do not decide it.\n\nA cause question asks for more than going together. Two more things must hold. The exposure must\ncome first. And no third thing may be moving both.\n\nA randomised controlled trial is a way to test a treatment in which chance decides who gets it,\nand then the groups are compared. Here the \"treatment\" is the exposure, the intervention in the\nlast section's word. Chance does the\ndeciding, not anything about the people. So no third thing can decide who is exposed.\n\nNow the weak spot of the one-visit study. It measures the exposure and the outcome on the same\nday. So it can find that they go together. It cannot tell you which came first.\n\nSurveying more people does not repair this. Book 0 described an error that points one way and does\nnot shrink when you collect more. This gap behaves the same way. Ten times the sample, measured on\none day, is still silent about which came first.\n\nOne more study type has a name you will meet often. A systematic review is a study of studies.\nIt collects and combines the results of all the studies already done on one question.\n\nWhich of these designs costs what, and what each returns to the person who runs it, belongs to\nthe next rung of this subject.\n"
must_know[0].point: 'The error is to call a cross-sectional survey a weak study. It is weak for relate and cause

  questions. For a how-common question it is the right tool, and the CDC''s textbook calls it "a

  perfectly fine tool" for description. Judge a design against the question it was asked to answer.

  '
must_know[1].point: 'Write the question before you choose the design, then read its verb. "How common" asks for a

  count. "Is it associated with" asks for a comparison group. "Does changing it change" asks for a

  trial. If the question and the design you planned do not match, change one of them, and say

  which.

  '
must_know[2].point: 'When a one-visit survey is reported with the words "leads to", "causes" or "effect of", do not

  repeat them. Ask which came first. The outcome may have changed the exposure, as a weight

  diagnosis can move a person''s dinner time.

  '
must_know[3].point: 'A bigger survey does not tell you which came first. If the question needs time order, change the

  design, not the sample size.

  '
must_know[4].point: 'Matching the design to the question tells you what a study could answer. It does not tell you

  whether this study was done well. A cohort built from a convenience sample still answers only for

  the people it came from. Check how the people were found as well.

  '
must_know[5].point: 'In a committee, say which kind of evidence you have before anyone decides. The CDC''s textbook

  says epidemiology often gives enough evidence to act, even though it cannot by itself prove a

  cause. Whether an association is enough depends on what the action costs and whom it could harm.

  '
must_know[6].point: 'When a trainee proposes a trial for a how-common question, ask them what chance would decide. If

  nothing is being assigned, there is nothing for chance to do, and the question needs a count.

  '
