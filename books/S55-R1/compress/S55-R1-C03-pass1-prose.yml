definition.text: |
  A research question is one of three kinds, and its kind decides which study can answer it.

  A descriptive question asks how common an outcome is, or how much of it there is, in a stated
  population at a stated place and time, and in which people it is commoner. It names no exposure.

  A relational question asks whether an exposure is associated with an outcome.

  A causal question asks whether changing the exposure would change the outcome. An association
  is needed for this and is not enough.

  A cross-sectional study enrols a sample of a population and measures exposure and outcome at the
  same time. It answers a descriptive question.

  Studies built to answer relational questions have a comparison group.

  In a randomised controlled trial the investigator sets the exposure, and chance decides who
  receives it. This is the design
  that answers a causal question directly, wherever the exposure can be assigned.

  A systematic review is a study of studies.
simplified_explanation: |
  There are three kinds.

  ```table
  | The question asks | Kind | The study that answers it |
  | How common is it, and in whom? | describe | a cross-sectional study: one visit, one count |
  | Do people with the exposure have the outcome more often? | relate | a cohort study or a case-control study |
  | If we change the exposure, does the outcome change? | cause | a randomised controlled trial |
  ```

  A describe question has no exposure. You answer it with a cross-sectional study.
  You take a sample, visit once, and count. The count is the prevalence — how many people in a group have the
  condition.

  A relate question asks whether an exposure and an outcome go together. To see that, you need a comparison group: people without the exposure, or without
  the outcome.

  - A cohort study starts from the exposure. You record who is exposed and who is not. You follow
    both groups over time and count who develops the outcome.
  - A case-control study starts from the outcome. You enrol people who have it (cases) and people
    who do not (controls). Then you compare what each group was exposed to in the past.

  In both, you watch the exposure happen. You do not decide it.

  A cause question asks for more than going together. Two more things must hold. The exposure must
  come first. And no third thing may be moving both.

  A randomised controlled trial is a way to test a treatment in which chance decides who gets it,
  and then the groups are compared. So no third thing can decide who is exposed.

  Now the weak spot of the one-visit study. It measures the exposure and the outcome on the same
  day. It cannot tell you which came first.

  Surveying more people does not repair this. Ten times the sample, measured on
  one day, is still silent about which came first.

  A systematic review is a study of studies.
must_know[0].point: |
  The error is to call a cross-sectional survey a weak study. It is weak for relate and cause
  questions. Judge a design against the question it was asked to answer.
must_know[1].point: |
  Write the question before you choose the design, then read its verb. If the question and the design you planned do not match, change one of them, and say
  which.
must_know[2].point: |
  When a one-visit survey is reported with the words "leads to", "causes" or "effect of", do not
  repeat them. Ask which came first.
must_know[3].point: |
  If the question needs time order, change the
  design, not the sample size.
must_know[4].point: |
  Matching the design to the question tells you what a study could answer. It does not tell you
  whether this study was done well.
must_know[5].point: |
  In a committee, say which kind of evidence you have before anyone decides.
must_know[6].point: |
  If
  nothing is being assigned, there is nothing for chance to do, and the question needs a count.
