definition.text: "This book's build is a list of ten candidate research questions. Each is written as one sentence\nthat names a population with its boundary, an exposure where there is one, and an outcome. Each\nis scored on a five-item sheet, with 0, 1 or 2 points for each item.\n\n1. One-sentence form: the sentence names the population, the exposure and comparison where there\n   are any, and one outcome.\n2. Answerable: it is a question about the world, and you can get the answer.\n3. Not already answered: a look for existing answers found no good answer for this population.\n4. Who is waiting: a named person or body with a decision in front of them.\n5. What they would do differently: different actions for different answers, in their own words.\n\nThe total, out of 10, puts the candidates in order. One rule overrides the total. A zero on item 4\nor item 5, either half of the who-is-waiting test, rejects the question whatever its total. Among\nthe survivors, the highest total is kept; a tie goes to the higher score on items 4 and 5 together.\nThe other nine are rejected, each with one written line naming the item that decided it, and they\nare filed, not thrown away.\n\nThe sheet is this course's working tool. It is built from the book's earlier sections and from\npublished criteria for a good question: Jhangiani and colleagues' interestingness and feasibility,\nBlackstone's features of a good research question, and Ratan and colleagues' list. It has not been\ntested for whether two people score the same list alike, or for whether high scorers lead to\nbetter studies. Its totals put judgements in order. They do not measure anything.\n"
simplified_explanation: 'The earlier sections of this book each gave you one check on a question. This section puts them on

  one sheet, so you can compare ten candidates and turn nine of them down on purpose.


  Start with ten candidates. Write each one as one sentence, the way the section on population,

  exposure and outcome taught. Then score each candidate on five items. Each item gets 0, 1 or 2.


  ```table

  | Item | 0 | 1 | 2 |

  | 1. One sentence | a topic, not a question | a question, but a part is missing, doubled or has no boundary | population with its boundary of place, person and time; exposure and comparison where there are any; one outcome |

  | 2. Answerable | a value question, about what ought to be, or you cannot get the answer | answerable only after a change: narrower, or access still to arrange | about the world, and you can reach the people, measure the outcome, finish in time and get ethics approval |

  | 3. Not already answered | your look found a good answer for this population | your look found answers elsewhere, or weak ones | your look found no good answer for this population |

  | 4. Who is waiting | nobody, or "the literature", "future researchers", "my thesis" | a kind of body you cannot reach, such as "policy makers" | a named role you can reach, with a decision in front of them |

  | 5. What they would do differently | the same action for every answer, or nobody to ask | different actions, but your guess | different actions for different answers, in their own words |

  ```


  Two notes on scoring. Score item 3 only after you have looked for an existing answer, as the section

  on questions worth answering taught. And if item 4 is 0, item 5 is 0 too, because there is nobody

  to do anything differently.


  Add the five scores. The total is out of 10.


  Here is the trap. A total can hide a zero. A question can score 2 on the first four items and 0 on

  item 5. Its total is 8, and it may beat a question that someone is waiting for.


  So one rule comes before the total. **A zero on item 4 or item 5 rejects the question, whatever its

  total.** Those two items are the two halves of the who-is-waiting test. A question fails that test

  if either half fails.


  Then rank the questions that are left, highest total first. If two totals tie, the one with more

  points on items 4 and 5 together goes first. Keep the top one.


  Reject the other nine. For each, write one line that names the item that decided it. "Not good

  enough" is not a reason. "Item 5: the officer''s plan is the same whatever the answer" is a reason.


  File the nine, with the date and the line. A question nobody is waiting for today may have someone

  waiting next year.


  The question you keep is the seed of the one question you will own. The next book in this subject

  builds on it: a body of work, the data, a unit that houses them, and a three-year plan.


  One warning about the sheet itself. It is this course''s working tool, built from the earlier

  sections and from published advice on good questions. Nobody has tested whether two people give the

  same list the same scores. Use the total to put questions in order, not as a measurement.

  '
must_know[0].point: 'The error is to keep the question with the highest total. A total can hide a zero on the

  who-is-waiting items. Apply the rule first, then rank what survives.

  '
must_know[1].point: 'Write one line for every rejection, naming the item that decided it. "Not good enough" is not a

  reason your guide can check. "Item 5: the officer''s plan is the same whatever the answer" is.

  '
must_know[2].point: 'Do not score item 3 until you have looked for an existing answer. A question someone has already

  answered well for your population scores 0 there, however good it sounds.

  '
must_know[3].point: 'File the rejected questions with the date and the reason. A question rejected because nobody was

  waiting can come back when the waiting party''s plans change.

  '
must_know[4].point: 'A 9 against a 7 is not "about 29 per cent better". The scores put judgements in order. A

  percentage change between them measures nothing, so do not quote one.

  '
must_know[5].point: 'The sheet is this course''s working tool, and nobody has tested it. It cannot tell you whether two

  people would score your list alike. When two totals are a point apart, read the items and decide

  from them, not from the totals.

  '
