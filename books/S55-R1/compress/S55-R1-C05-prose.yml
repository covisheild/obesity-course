definition.text: 'A research question can be answerable and still not be worth answering. Answerable is a

  judgement about the question and your means: it asks about the world, and you can get the

  answer. Worth answering is a separate judgement, and it rests on three tests.


  First, the answer is in doubt: there are reasons to expect more than one answer before any data

  are collected. Second, the answer is not already known: nobody has answered the question well

  for the people, place and time you mean. You find this out by looking for existing studies and

  reviews before you start, not after. Third, the answer has practical consequences: at least one

  possible answer would lead someone to decide or act differently from another possible answer.


  The three tests follow Jhangiani and colleagues'' account of what makes a research question

  interesting to people other than the researcher. The answer is in doubt, it fills a gap in the

  research literature, and it has important practical implications.


  For clinical research, Ioannidis argues that research is useful when it can lead to a better

  decision, and he names eight features that make it so. Three of them carry the tests above.

  Problem base: the health problem is big or important enough to fix. Context placement: earlier

  evidence has been assessed before the new study is planned. Information gain: the study is

  large and long enough to tell us something. The other five are pragmatism, patient

  centeredness, value for money, feasibility and transparency.


  How much research fails on the way? Chalmers and Glasziou, in a 2009 viewpoint in the Lancet,

  traced avoidable waste through four stages: the choice of questions, the design and methods,

  publication, and the quality of reports. If the losses they found apply more generally, they

  wrote, a roughly 50% loss at each of stages 2, 3 and 4 would lead to a greater than 85% loss.

  Their evidence came mainly from clinical trials, and the estimate rests on that "if". It also

  leaves out stage 1: a well-run, published, clearly reported study of the wrong question is still

  waste. Ioannidis and colleagues add, in 2014, that every study is typically designed, done and

  discussed in isolation, without enough consideration of previous studies.

  '
simplified_explanation: "The last section asked whether you can answer a question at all: is it about the world, and can\nyou actually get the answer? A question can pass both tests and still not be worth your two years.\n\nJhangiani and colleagues, who wrote an open textbook on research methods, make the point with a\nquestion like \"how often do people tie their shoes?\" You could answer it easily. Nobody would want\nyou to.\n\nSo a question you can answer faces three more tests before you keep it.\n\n1. **Is the answer in doubt?** Write down two different answers you might get, with a reason to\n   expect each. If you can find a reason for only one answer, the study will tell you what you\n   already believed.\n2. **Is it already answered?** Look for studies and reviews that have asked it before, and for\n   counts that someone already holds. Do this before you plan anything. A study that repeats a\n   good answer adds little.\n3. **Would the answer change anything?** Write each possible answer on its own line. Beside each,\n   write what someone would decide or do if that answer came back. If every line says the same\n   thing, the answer changes nothing.\n\nA question that passes all three is worth answering. One that fails any of them is not, as it\nstands. Often it can be changed until it passes.\n\nHow much is lost? Chalmers and Glasziou put a figure on it in 2009, mostly from studies of\nclinical trials. If the losses they found held generally, poor design, failure to publish and\nunusable reports would together lose more than 85%. That figure does not even count the choice of question, which is\nwhat these tests are for.\n\nIoannidis, who has written for years about why so much medical research goes to waste, argues\nalong the same lines for clinical research. Research is useful, he says, when it can lead to a\nbetter decision. Three of the eight features he lists match the tests above.\n\nProblem base asks\nwhether the health problem is big or important enough to fix. Context placement asks whether the\nearlier evidence was looked at before the new study was planned. Information gain asks whether the\nstudy will be large and long enough to tell anyone something.\n\nHe names five more. Does the study\nreflect real life? Does it reflect what patients care about most? Is it worth the money? Can it be\ndone? Can others check its methods and data?\n\nOne more idea from him is worth carrying with you. A good study is useful whichever way the answer\ncomes out. If only one result would be useful, there is pressure to get that result, or to read\nthe data as if you had.\n"
must_know[0].point: 'The error is to treat a question you can answer as a question worth answering. Feasible, cheap

  and quick describe your means, not the question. Run the three tests on every candidate you can

  answer before you keep it.

  '
must_know[1].point: 'Before you keep a candidate, write down two answers you might get, with a reason for each. If you

  can find a reason for only one answer, drop the question or change it until you can find two.

  '
must_know[2].point: 'Look for an existing answer before you plan a study, not after. Ask the programme what it

  already counts, and look for reviews that have gathered earlier studies. A study planned without

  that look can end up repeating a question already answered well.

  '
must_know[3].point: '"It has been studied already" does not end a question, and "it has not been studied here" does

  not save one. Refine a studied question only where you have a reason to expect a different answer

  for your people or your place. Without that reason, a repeat in a new district is repetition.

  '
must_know[4].point: 'Design the study so that it is useful whichever answer comes back. If only one result would be

  useful, you will be under pressure to find that result, or to read the data as if you had.

  '
must_know[5].point: 'These tests judge a question on the day you run them. A question can lose its importance while

  the study is under way, because circumstances change. Run the tests again before each big step,

  such as writing the protocol or starting to collect data. The tests are also built for clinical and

  public-health questions: discovery research whose use cannot be foreseen cannot be judged this way.

  '
