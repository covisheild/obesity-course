definition.text: |
  A research question is answerable when it passes two tests.

  The first test is that it is an empirical question: one that can be answered by observing the
  world. A value question asks what ought to be done, and people answer it from their values.

  The second test is that the question is feasible: the person asking can actually get the answer
  with what they have.

  FINER is one published checklist for a research question: feasible, interesting, novel, ethical
  and relevant, credited to Hulley and colleagues.
simplified_explanation: |
  Before
  you keep a question, put it through two tests.

  **Test 1: can the world answer it?** An empirical question is one that observing the world can
  answer. How many children buy snacks at the school gate is empirical. Whether snacks should be
  banned at the school gate is not. That second one is a value question — a question about what
  ought to be done, which people answer from their values.

  It usually has empirical questions inside it. The decision itself still belongs to whoever has to make it.

  **Test 2: can you get the answer?** A feasible question is one that you, with what you have, can
  actually answer. Go down this list and, for each line, write what you actually have.

  - People you can reach, in enough number.
  - A way to measure the outcome.
  - Time.
  - Money.
  - Equipment, and the skill to use it.
  - Approval from an ethics committee.

  A line with nothing written beside it is a fail.

  **Then check the size.** A question can pass both tests and still be too broad. "What causes
  obesity in children in Chhattisgarh?" is empirical. So you
  narrow it. You give the population a boundary you can reach, pick one exposure, and name one
  outcome.

  Watch what narrowing does to the kind of question. Cutting "what causes" down to "is this one
  thing associated with" turns a cause question into a relate question. But the study now answers the relate question, and your report must not claim more than that.
must_know[0].point: |
  The error is to keep a "should" question because it feels important. Find the empirical questions inside it, and leave the decision with the person who has to make it.
must_know[1].point: |
  Run the feasibility list in writing. A line you can only fill with "should be possible" is a fail until you have
  asked.
must_know[2].point: |
  When you shrink what you can reach, shrink the population in the question too.
must_know[3].point: |
  When narrowing turns a cause question into a relate question, say so in the protocol.
must_know[4].point: |
  Before the main study, run a
  small trial of the hardest line, usually the measurement.
must_know[5].point: |
  Passing both tests shows only that you can get an answer. It says nothing about whether anyone
  needs that answer.
must_know[6].point: |
  When a trainee cites FINER as if it settles a question, correct two things. It is a published
  guide, not a rule or a validated scoring tool. And its E means a study a committee would approve,
  not a question about values.
