id: S55-R1
number: 7
title: Question selection and research strategy · Rung 1
subtitle: Choosing what to study before you study it
cover_line: The research question as a decision, and the test of who is waiting for its answer
status: frozen            # frozen | in progress
version: "1.0"
last_updated: 2026-09-24
why: |
  Most research questions are not chosen; they are inherited from a guide, a dataset that happened
  to be available, or the last paper someone read. The study that follows can be done well and
  still change nothing, because nobody was waiting for its answer. This book treats the question as
  the first and largest decision in a piece of research: how to state one precisely, how to tell a
  question that can be answered from one whose answer would change what someone does, and how to
  reject most of your own candidates on purpose. It ends with ten questions of your own, scored, and
  the reasons you set nine of them aside.
how_to_read: |
  Read Book 0's sections on evidence and study design first, or at least the ones this book names
  as it goes. Then read this one in order. The exercises are decisions, not sums: write the
  question, name who is waiting for it, and say what they would do differently. Do them as you go;
  the list of ten you build at the end is the point of the book.
back_blurb: |
  A short book on the choice that comes before any method: which question to study. It covers the
  research question as a deliberate choice, stating it in one sentence with a population, an
  exposure and an outcome, the difference between a question that can be answered and one whose
  answer matters, what the record shows about how often published studies are used, and a simple
  test for any candidate question: who is waiting for this answer, and what will they do
  differently once they have it.
