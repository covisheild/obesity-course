id: S57-R1
number: 8
title: Teaching, mentorship and coalition building · Rung 1
subtitle: Teaching as a craft with evidence behind it
cover_line: How people learn, how to teach one session, and how to lead the people you teach
status: frozen            # frozen | in progress
version: "1.0"
last_updated: 2026-09-25
why: |
  Anyone who becomes good at a subject is soon asked to teach it, and later to lead the people
  who learn it. Both are usually done by imitation. This book treats teaching as a skill with
  evidence behind it: what the research on learning shows works, what it shows does not, and how
  to plan, run and measure one teaching session so that your learners can do something afterwards
  that they could not do before. It ends where leading people begins.
how_to_read: |
  Read Book 0 first, or at least the sections this book names as it goes. Then read this one in
  order. The book asks you to build one thing: a single session, taught to real learners, with a
  written objective and a measure of what they learned. Plan it as you read, and teach it when you
  reach the end.
back_blurb: |
  A short book on teaching and on the first step of leading. It covers what learning research has
  found about retrieval, spacing and re-reading, why "learning styles" do not hold up, how to write
  an objective that can be assessed, how to run a session around retrieval rather than lecture, how
  to measure whether it worked, and why leading people is a craft of its own.
