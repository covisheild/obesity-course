definition.text: '"Learning styles" is the idea that people differ in which mode of teaching or study works best for them.


  Pashler, McDaniel, Rohrer and Bjork (2008) keep two claims apart. The first is that people will state preferences about how they like to take in new material. The second, the learning-styles hypothesis, is that teaching fitted to a learner''s style gives a better learning outcome. Its commonest version is the meshing hypothesis: teaching works best in the format that matches the learner''s preference, pictures for a "visual learner", say.


  They set four conditions an experiment must meet before it supports the hypothesis. Learners are divided into two or more groups by a measure of style. Within each group, they are allocated at random to one of two or more teaching methods. Everyone takes the same test; if the tests differ, no support is possible. And the method that gives one group its best test score is not the method that gives another group its best.


  With two styles and two methods, the mean scores make a 2 × 2 table, read "two by two": two rows and two columns. Each row is a style group and each column a method. Within one row, the two cells are two groups allocated at random, so the gap between them is a mean difference, MD, as in `S57-R1-C02`. Take the MD the same way round in both rows, say the first method minus the second. A crossover is present when one row''s MD is positive and the other''s is negative. The best column then differs from row to row.


  A crossover can be present even when one style group scores higher than the other on both methods. Pashler''s criterion does not ask that each group''s best method be its matched one. Meshing asks that as well. So a crossover the wrong way round, each group best with the method that does not match its label, supports learning styles in the broad sense and contradicts meshing.


  When both MDs have the same sign, the same method is best for every learner, and the result is no evidence for learning styles, however different the two gaps are in size. Read down the columns instead of across the rows, and such a result can look like a crossover.


  They conclude that applying learning styles in classrooms is unwarranted.

  '
simplified_explanation: 'Some people learn best from pictures, some from words, some by doing. Find out which kind each learner is, and teach each one their way.


  Take learners of two styles. Split each group in two by lottery, and teach one half one way and the other half the other way. Test everyone the same way. The best method has to change from one group to the other. That change is the crossover.


  Notice what does not count. Pictures working better for everyone does not count, even if they help visual learners more. Visual learners scoring higher than verbal learners does not count either.

  '
must_know[0].point: '"Learners have learning styles, so teaching to them helps" joins two claims. Accept the first; refuse the second.

  '
must_know[1].point: 'To test any claim that matching helps, ask for all four cells. Take the MD within each group, the same way round. Only opposite signs make a crossover.

  '
must_know[2].point: 'Comparing down a column, visual learners against verbal learners on the same lesson, is not the test. Compare the two lessons within one group.

  '
must_know[3].point: 'A lesson that is better for one group by a lot and for the other by a little is still better for both. Teach everyone with it.

  '
must_know[4].point: 'Rejecting learning styles is not a vote for teaching everyone one way. Choose methods for the material and the level.

  '
must_know[5].point: 'Cook and colleagues, reported by Pashler, split 123 internal medicine residents by style and by method. They found no support for matching.

  '
must_know[6].point: 'Expect the idea among colleagues. Lead with the content argument: a murmur has to be heard and a rash has to be seen.

  '
must_know[7].point: 'Say "there is no adequate evidence for it", not "it has been proven false". A crossover in one small table can also arise by chance: the MD check reads the pattern, not whether it is real.

  '
