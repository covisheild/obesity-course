definition.text: 'Retrieval practice is an attempt by a learner, during learning, to bring material they have

  already met back to mind from memory: to recall it or to recognise it, without looking at it.

  Restudy is the alternative it is compared with: reading or hearing the same material again,

  for the same time.


  The testing effect is the finding that a retrieval attempt improves memory on a later test

  more than restudy does. It holds on a delayed test. On a test a few minutes later, restudy

  can come out ahead.


  Roediger and Karpicke''s (2006) first experiment, which `S57-R1-C01` described, shows both halves. Each

  student reread one passage and tried to recall the other, with no feedback.


  In classrooms, Agarwal, Nunes and Blunt (2021) screened nearly 2,000 abstracts and kept 50 experiments

  in which each student retrieved alone, closed-book, during class time.


  Feedback is showing the learner the correct answer after the attempt. Practice testing with

  feedback beats restudy more reliably than practice testing without it. A low-stakes test is

  one whose score counts for little or nothing.


  What would overturn this for your setting: well-run comparisons in Indian classrooms, with a

  delayed test on new questions, that find no gain.

  '
simplified_explanation: 'Most of us were taught that a test measures learning. It also causes it. Pulling something out

  of memory makes it easier to pull out again later. Reading it again does much less, even

  though it feels like more.


  The catch is timing. Straight after a session, what was reread looks better.


  Three things make the method work in a classroom. Every learner answers, alone, without notes.

  The score counts for little or nothing, so the test is practice and not judgement. And after

  they have tried, they see the right answer.


  The classroom evidence is large and mostly from the United States and Europe. Ten of the

  experiments were in medical schools. None was in India.

  '
must_know[0].point: '"A test is for finding out what they know; the teaching happens before it" is the error. The

  attempt to recall is itself a learning event.

  '
must_know[1].point: 'Run retrieval so that every learner answers alone and without notes, the score counts for

  little or nothing, and the correct answer follows the attempt.

  '
must_know[2].point: 'Keep quizzes that are for learning low-stakes.

  '
must_know[3].point: 'In classrooms, 28 of 49 effect sizes were above 0.50 and 46 of 49 favoured retrieval

  practice (Agarwal and colleagues, 2021).

  '
must_know[4].point: 'None of the 50 classroom experiments in that review was run in India. Measure it in your own

  batch, with a delayed test.

  '
must_know[5].point: 'Retrieval with no feedback and little success is where the method stops paying. Classroom

  studies without feedback showed mostly small or very small effects. When most of the room

  cannot answer, give the answer and reteach; do not count the silence as practice.

  '
must_know[6].point: 'If your final test repeats the quiz questions word for word, a gain may be memory of those

  questions. To find out whether they learned the idea, test it with new questions.

  '
