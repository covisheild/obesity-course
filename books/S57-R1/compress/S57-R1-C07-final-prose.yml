definition.text: 'People feel they understand how things work in far more detail than they do. Rozenblit and Keil named this

  the illusion of explanatory depth in 2002.


  It is measured in three steps. A person rates how well they understand something. They

  write out a detailed, step-by-step explanation of how it works. Then they rate their

  understanding again.


  In Rozenblit and Keil''s first study, 16 graduate students rated 48 things taken from books on how things

  work. Each then explained four devices, such as a zipper or a flush toilet, and rated again. The ratings

  fell after explaining.


  The drop has held up. In a second study, 33 undergraduates showed the same pattern. When students were

  warned at the start that they would have to write explanations, the drop was smaller, but it did not go

  away.


  Expertise does not reliably remove the illusion either. A later study from the same

  laboratory found that people with more education show it on topics from their own subject.


  Two study techniques put explaining to work. In self-explanation, a learner explains how new

  information relates to what they already know, or explains the steps they take while solving

  a problem. In elaborative interrogation, a learner works out why a stated fact is true. A

  2013 review by Dunlosky and colleagues rated both of moderate utility, below the high

  utility of practice testing.


  Self-explanation has helped across different materials, a wide range of ages, and tests of memory,

  understanding and transfer to new problems. Almost all the studies of both tested learners within minutes,

  and few were run outside the laboratory.

  '
simplified_explanation: 'Ask yourself whether you understand how a ceiling fan works, and you will probably say yes.

  Now write down, step by step, what happens between pressing the switch and the blades turning.

  Then ask yourself the first question again. Your answer is likely to come down.


  That drop is the illusion of explanatory depth. You felt you understood. Trying to explain

  showed you where you do not.


  The illusion lives in "how does it work" and "why". Ask people to list the steps of a

  procedure, like the steps for weighing a child, and they judge what they know about right. Ask

  them why each step is there, and you are asking how something works.


  So use explaining as a check. When a student nods, ask them to explain the step.

  '
must_know[0].point: 'A learner who nods, or says "yes, understood", has told you how they feel, not what they can

  do. Ask them to explain the step in their own words, aloud or on paper.

  '
must_know[1].point: 'Before you teach a topic, write your explanation out from memory, and read up on the places

  where you stall.

  '
must_know[2].point: 'When you ask learners to explain, have them check the explanation against the text or against

  you. A fluent explanation that is wrong can hurt learning.

  '
must_know[3].point: 'Asking someone to list the steps of a procedure will not show you the illusion, because

  people judge their knowledge of steps about right.

  '
must_know[4].point: 'Do not claim that "why" questions or self-explanation produce lasting learning. If you use

  them, test your learners days later before you say they worked.

  '
must_know[5].point: 'Explaining costs time: 30% to 100% more in the studies that reported it. Weigh fewer

  problems explained against more problems solved.

  '
