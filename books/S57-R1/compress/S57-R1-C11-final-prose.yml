definition.text: "A session built around retrieval is one in which the learners spend much of the time\nbringing material back from memory, each alone and in writing, and seeing the correct answer\nafterwards.\n\nThe session plan is a written table of the session's parts, in order. A plan for one session\nbuilt around retrieval has these parts.\n\n1. The objective, stated to the learners at the start.\n2. A pre-test on one of two parallel forms.\n3. Short teaching parts. Each is followed by one question that every learner answers alone,\n   in writing, without notes, and then by the correct answer.\n4. One question on material from an earlier session, answered from memory.\n5. A closing free recall: notes away, each learner writes down all they can about the topic.\n6. A post-test on the other form.\n7. A delayed test, booked before the session, on a date written into the plan.\n"
simplified_explanation: 'Most sessions are built around the teacher talking. The learners listen, and at the end

  someone asks "any questions?". This section builds a session the other way round.


  The earlier sections gave you the pieces. This section puts them in order on one page, the

  session plan, with the minutes for each part.


  Then you count. How many of the 60 minutes did every learner spend answering from memory? In a

  lecture the answer is close to none. In this plan it is 40.

  '
must_know[0].point: '"Any questions?" and a question to one student are not retrieval practice for the room. Ask

  a question every learner answers alone, in writing, before anyone speaks.

  '
must_know[1].point: 'Write the plan as a table before the session: minutes, what you do, what every learner does.

  Then add up the minutes in which every learner answers from memory.

  '
must_know[2].point: 'A pre-test on material the learners never met measures where they start. It is not practice.

  Do not count it as part of the retrieval in your plan.

  '
must_know[3].point: 'Questions spread through a session have not been shown to beat the same questions at its end. Spread them for other reasons: short

  teaching parts, attention, a turn for every learner. Do not tell colleagues the spreading itself is proven.

  '
must_know[4].point: 'Give the in-session questions the same format as the tests. Change the case, not the kind of

  question.

  '
must_know[5].point: 'Book the delayed test before the session and write its date in the plan.

  '
must_know[6].point: 'A plan that meets every part here says what the learners did. Present your plan as a

  design, not as a result.

  '
