definition.text: 'New information is handled first in working memory, which can hold and work on only a limited

  number of new elements at a time, and only for a short time. What has been learned is kept in

  long-term memory, which has no known limit.


  Cognitive load is the demand a learning task makes on working memory. Cognitive load theory,

  set out by Sweller and colleagues, separates two sources of it. Extraneous load comes from how

  the material is presented and what the learner is made to do; the teacher can change it. If

  the load becomes too high, learning and transfer to new problems suffer.


  For novices, studying a worked example, a problem shown with its full solution, can teach more

  than solving the same problem. A diagram alone has taught more than the same diagram with text

  that repeats it. Spoken information is gone in seconds, so the learner must hold it in working

  memory, which adds load and reduces learning.


  These effects shrink, then vanish, and can reverse as learners gain expertise. Interleaving,

  mixing different problem types in one session instead of doing one type in a block, gave

  college students better test results a week later.

  '
simplified_explanation: 'Your working memory is the part of your mind that holds what you are thinking about right now.

  It is small. It can juggle only a few new things at once, and it drops them within seconds.


  Your long-term memory is where learned things are kept, and it has no known limit. Anything

  already learned comes back from it as one piece. For you, "percentage" is one piece. A learner

  meeting it for the first time has several pieces to hold.


  Overload working memory and less is learned. Some of the load comes from the material itself,

  and you cannot remove it without changing what is taught. Some comes from how you teach it, and

  that part is yours to cut.


  For a beginner, a problem shown worked out, step by step, often teaches more than being made to

  solve it cold. As they learn, take the help away a step at a time.


  Once the basics are held, effort helps. The same effort that swamps a beginner is what moves a

  more advanced learner on.

  '
must_know[0].point: 'Saying more is not teaching more. Put the steps where they stay: on the board, a chart on the

  wall, a handout.

  '
must_know[1].point: 'For beginners, show a worked example before you set a problem. Then give a problem with part

  of the solution done, then a whole problem. Take the help away as they gain skill.

  '
must_know[2].point: 'What helps a first-year student can hold back a resident. For them, set problems.

  '
must_know[3].point: 'Before you put the same content on a slide twice, as a diagram and as text that repeats it,

  ask what the second copy adds.

  '
must_know[4].point: 'Once the basics are held, make learners work: mix related problem types and have them produce

  answers rather than read them.

  '
must_know[5].point: 'Do not tell a colleague a session "overloaded" learners as though you measured it. Say what

  the learners could and could not do afterwards.

  '
