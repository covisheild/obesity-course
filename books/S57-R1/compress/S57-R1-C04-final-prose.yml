definition.text: 'Spacing, which Dunlosky and colleagues (2013) call distributed practice, is a schedule: the

  same material is studied or retrieved on two or more occasions spread out in time. Massed

  practice, often called cramming, puts the same occasions back to back.


  The gap is the time between two study sessions of the same material. The retention interval,

  from `S57-R1-C03`, is the time from the last study session to the test.


  The spacing effect is the finding that, for the same total study time, spaced practice gives

  better long-term retention than massed practice.


  Cepeda and colleagues (2008) taught 1,354 people 32 trivia facts. Final recall first rose as

  the gap grew, then fell. Of the gaps tested, the best were 1, 11, 21 and 21 days for retention

  intervals of 7, 35, 70 and 350 days.


  So the best gap grew with the retention interval, but its share of the retention interval

  fell. It was about 20% to 30% for a test a few weeks away. For a test a year away it was

  about 5% to 7%.

  At the best gap, final recall was 64% higher than with no gap. A gap longer than the best cost

  less than a gap shorter than the best.

  '
simplified_explanation: 'Take the same three hours of study. Spend them in one evening, or spread them over three weeks.

  The spread-out hours leave more behind a month later.


  It does not feel that way. Straight after a cramming session, you remember a lot, and on a test

  that day cramming can win.


  Say the test is a few weeks away. Then make the gap before the review about 20% to 30% as long as

  the wait from the review to the test. If you are unsure, err on the long side.


  Make the review a retrieval, not a reread (`S57-R1-C03`): close the book, write what you

  remember, then check.

  '
must_know[0].point: '"Three hours is three hours, however you spread them" is the error. With study time held

  equal, spaced practice leaves more behind on a delayed test.

  '
must_know[1].point: 'Never judge a schedule by how the practice sessions go.

  '
must_know[2].point: 'Before you pick a review date, write down when the learning must be used: the test date, or

  the day you will teach it. Then set the gap from that.

  '
must_know[3].point: 'The best gap grows as the test moves away, but its share falls: 23 days, 7%, for a test 350

  days away. A fixed share, such as "10 to 20% of the retention interval", overstates the gap

  for long intervals. Dunlosky and colleagues give that fixed share, and Cepeda''s own data bend

  away from it.

  '
must_know[4].point: 'When you are unsure of the best gap, choose the longer one.

  '
must_know[5].point: 'Test often and lightly, so that students space their own study. In one study, when tests

  came only every 3 weeks, students left their study until just before each test. With daily

  tests, their study was spread out.

  '
must_know[6].point: 'These gaps were measured for trivia facts, one review and tests up to 350 days away. Past a

  year, treat any gap figure as a starting guess. Then check it with a delayed test of your own

  (`S57-R1-C02`).

  '
