definition.text: 'Undergraduate medical education in India is governed by the Graduate Medical Education

  Regulations, 2023 (GMER 2023). The National Medical Commission (NMC) notified them in the

  Gazette on 2 June 2023. They direct NMC''s undergraduate board to publish the model curriculum

  on the NMC website from time to time.


  The curriculum in force is NMC''s Competency Based Medical Education (CBME) Curriculum 2024,

  enclosed with a letter of 12 September 2024. It calls itself guidelines, it was issued by

  letter, and it places itself under GMER 2023.


  The CBME Curriculum 2024 names seven roles for the Indian Medical Graduate (IMG): clinician;

  leader and member of the health care team and system; communicator; lifelong learner;

  professional; critical thinker; and researcher. The 2019 regulation named the first five.


  It limits large group teaching to one third of a subject''s allotted hours.


  The Medical Institutions (Qualifications of Faculty) Regulations, 2025 were notified on 30

  June 2025. They superseded the Teachers Eligibility Qualifications in Medical Institutions

  Regulations, 2022. Their Table E covers faculty in broad specialties, the MD and MS subjects.

  There a Professor or an Associate Professor "shall be required to undergo" the Basic Course

  in Medical Education. The proviso is that the specialty is covered under undergraduate

  training.

  '
simplified_explanation: 'At the top sits a regulation, the Graduate Medical Education Regulations, 2023 (GMER 2023). It

  was notified in the Gazette, so it binds.


  Under it sits the detail, in a guideline — a document NMC''s undergraduate board sent out by

  letter and put on its website. "Competency based" means the course is built from what a graduate

  must be able to do, not from a list of topics to cover.


  That guideline names the doctor the course is meant to produce: the Indian Medical Graduate, or

  IMG. It gives the IMG seven roles.


  Lectures to a large group may take at most a third of a subject''s hours.


  A third paper decides what you need to hold as a teacher. It is the faculty regulations of 2025.

  They tie a course, the Basic Course in Medical Education, to the Associate Professor and

  Professor posts in most MD and MS subjects. Community Medicine is one of them.

  '
must_know[0].point: '"The Indian Medical Graduate has five roles" is out of date. The CBME Curriculum 2024 lists

  seven: critical thinker and researcher were added to the 2019 five.

  '
must_know[1].point: 'When a department asks you to lecture, count its large-group hours first. A timetable over

  that third is out of line with the curriculum, however good the lectures are.

  '
must_know[2].point: 'Mentoring is in the curriculum, not an optional extra. Each mentor gets three students during

  the Foundation Course and keeps them until they finish internship. Mentors are drawn from

  Assistant Professor upwards, so expect to be one from your first post as Assistant

  Professor.

  '
must_know[3].point: 'The Basic Course in Medical Education is tied to posts, not to teaching as such. Its Assistant

  Professor row does not name it. Say that, not "every teacher must do it".

  '
must_know[4].point: 'Know which kind of paper you are quoting. A circular of 12 June 2023 that issued guidelines

  under GMER 2023 was withdrawn eleven days later; the regulations themselves were not. So a

  colleague waving "the 2023 guidelines" may be waving a withdrawn circular. Ask for its date.

  '
must_know[5].point: 'Two papers in force can disagree. GMER 2023 bars a student from continuing after nine years

  from admission. The CBME Curriculum 2024 says a learner may not graduate later than ten years

  from joining, internship included. When a student''s case turns on the limit, name both papers

  and their words.

  '
must_know[6].point: 'These instruments tell you what a college must provide and what a teacher must hold. They say

  nothing about whether any session works.

  '
