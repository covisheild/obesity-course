definition.text: 'To lead people is to get a group to move towards a change and to keep them at the work it

  takes. Frich and colleagues (2015) give one common understanding of it: "motivating and

  influencing others to bring about change".


  Skill at the work and skill at leading others in it are different competencies. Stoller,

  writing in 2020 for chest physicians, states that leadership competencies differ from those

  needed to practise medicine or to do research. Kotter (1990) argued that leadership has

  nothing to do with charisma or other exotic personality traits, and is not the province of a

  chosen few. Both are positions argued from experience, not measurements.


  Leadership is taught to physicians, and the teaching has been evaluated. Frich and

  colleagues'' systematic review found 45 published studies of leadership development

  programmes for physicians, searched in one database up to November 2013. All 45 reported

  positive outcomes. The majority rested on learner satisfaction and on self-assessed knowledge

  or behaviour. Six documented results at the level of the organisation. Four had a comparison

  group. The studies were too varied to pool into one effect size, and the authors expect that

  studies finding no effect were published less often.


  Their conclusion is an association: the programmes are associated with increased

  self-assessed knowledge and expertise. That such training changes what physicians do at

  work, or the results of the service they work in, has been tested in very few studies.

  Studies with a comparison group that observe behaviour at work, or measure the service''s

  results, would answer it either way.


  In this book, three things a leader builds are kept apart. A teaching lineage is the people

  you teach, and the people they go on to teach. A team you run is a set of people whose work

  on one job you direct, for as long as the job lasts. An institution that outlives you is a

  standing group, with written terms, roles and a named successor, that keeps working after

  you leave it.


  Two kinds of body are also kept apart. A professional body is an association whose members

  share one profession or discipline. A civil society organisation is a group formed by

  citizens, outside government and outside business, to work for a public cause.

  '
simplified_explanation: 'The section before this one found "leader and member of the health care team" among the

  seven roles NMC gives the Indian Medical Graduate. This section asks what that role asks of

  you.


  Here is the usual path. The resident who knows the most is made chief resident. The best

  clinician is made head of the new clinic. Everyone assumes the skill carries over. Often it

  does not, because knowing the work and getting others to do it well are different skills.

  Leading means getting a group to move towards a change, and keeping them at it.


  So is leading a gift you have or do not have? Those who write about it, such as Kotter, say

  no. It can be learned, like teaching.


  But look at what the evidence for that claim is. Many programmes teach leadership to doctors,

  and every published study of them reports success. Almost all of that success is what the

  doctors said about themselves, mostly measured straight after the course. Very few studies

  compared trained doctors with untrained ones, or watched them at work afterwards. So the fair

  summary is this. Leadership is taught, and doctors say they learn from it. Whether it changes

  what they do is barely tested.


  You will be asked to build three different things. A teaching lineage is the people you teach

  and the people they teach in turn. A team is a set of people you run for one job. An

  institution is a group that keeps working after you leave. To tell them apart, ask one

  question: what happens to it the day you go?


  You will also be asked to join things. A professional body is an association of people in one

  profession, such as doctors in one specialty. A civil society organisation is a group of

  citizens, outside government and business, working for a public cause, such as better food

  policy. The next book in this subject names the ones worth joining.

  '
must_know[0].point: 'Being the best at the work does not make you able to lead others in it. When you are chosen

  to run something because you know the most, expect to have to learn a second skill. Do not

  assume a colleague has it either because they are the best clinician in the room.

  '
must_know[1].point: '"Leadership training works" is thinly tested. In Frich''s review of 45 studies, 4 had a

  comparison group, and the authors expect studies finding no effect went unpublished. Say

  that programmes are common and doctors report learning from them. Do not say they are

  shown to change practice.

  '
must_know[2].point: 'You lead before you have a title. Stoller counts the bedside nurse and the medical student

  among those who lead. And 29 of the 45 programmes in Frich''s review were for physicians

  without a formal leadership role. Take the small chances now: run the journal club, lead

  the camp, own one change on the ward. Kotter observed that people who led well had almost

  always had the chance to try to lead early.

  '
must_know[3].point: 'A lineage, a team and an institution are built differently. Ask of anything you run: what

  happens to it the day I leave? If the answer is "it stops", you have built a team, however

  long it has run. If you want it to last, write its rules and name a successor while you are

  still there.

  '
must_know[4].point: 'Your first lineage is handed to you. From your first post as Assistant Professor you can be

  made a mentor. You get three first-year students a year, and they stay with you until they

  finish internship. Treat them as the start of the people who will carry your teaching, not as a

  form to fill in.

  '
must_know[5].point: 'Join one professional body and one civil society organisation, and be useful to both. Keep

  the two apart when you choose: one gathers the people of a profession, the other gathers

  citizens around a cause. The next book in this subject names

  the ones that repay your time in this field.

  '
must_know[6].point: 'The claim that leading can be learned rests on argument and on programme reports, not on

  trials. It does not tell you that any particular course will make you a better leader. Judge

  a course as you would judge a teaching session: ask what was measured, at what level, and

  against what comparison.

  '
