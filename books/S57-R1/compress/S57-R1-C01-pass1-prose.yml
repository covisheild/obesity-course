"definition.text": |
  In this book, learning means a lasting change in what a person can do. It is measured by a test taken after a delay. The time between study and that test is the retention interval.

  Performance is what a learner can do during a session or within minutes of it. Feeling of learning is the learner's own judgement of how much they learned, usually given as a rating.

  Transmission is teaching by telling: the teacher explains and the learners listen, take notes, and ask the odd question.
"simplified_explanation": |
  A session can go well and teach almost nothing that lasts.

  Reading something twice makes it feel familiar, and the familiar feels learned. A smooth lecture feels clear, and the clear feels learned. Work that makes learners struggle feels worse, even when it teaches more.

  So a quiz at the end of your session measures performance. A feedback form measures feeling. Neither measures learning. You find out about learning by testing again, after a gap, on something the learners have not just seen.

  "They enjoyed it and they answered well at the end, so they learned it." The inference still does not carry, because the conclusion is about a later day that neither premise measured.
"illustration.body": |
  At the end, you hand out a feedback form and a short quiz. The forms say the session was clear. Most students get the quiz right. You are about to write "objective achieved" in your teaching log.

  Before you write it, open Roediger and Karpicke, "Test-enhanced learning", *Psychological Science* 2006, at https://doi.org/10.1111/j.1467-9280.2006.01693.x. Go to Experiment 2.

  Each student had four periods in a row, used in one of three ways. S stands for a study period: 5 minutes of reading. T stands for a test period: 10 minutes of writing down everything they could remember, with no feedback.

  - SSSS: read it in all four periods, no test.
  - SSST: read it three times, then one test.
  - STTT: read it once, then three tests.

  Then everyone took one final recall test. Half took it 5 minutes later. The other half took it 1 week later.

  ```table
  group   after 5 minutes (%)   after 1 week (%)
  SSSS    83   40
  SSST    78   56
  STTT    71   61
  ```

  Read the first column. Reading four times wins.

  The order has turned round.

  The group that was ahead by 12 percentage points at 5 minutes is behind by 21 a week later.

  Now find Table 2. The SSSS group gave 4.8. The STTT group gave 4.0. The group most sure it would remember was the group that went on to remember least.

  Your quiz is the first column: performance, minutes after the teaching. Your feedback form is the rating in Table 2: a feeling. Neither is the second column. To fill in the second column for your own batch, set a short test on the same objective a week or more later.
"illustration.analogy_breaks_when": |
  The numbers come from undergraduates at one university. The numbers do not tell you what happens after a month. A test taken minutes after teaching, or a learner's own rating, can point the opposite way from a later test.
"must_know[0].point": |
  A high score on a quiz at the end of your session is not evidence that the batch learned. It measures performance minutes after the teaching.
"must_know[1].point": |
  Do not read a learner's rating of how much they learned as a measure of learning. Those students scored almost half a standard deviation higher on the end-of-class test. They rated their learning more than half a standard deviation lower.
"must_know[2].point": |
  Before you call a session a success, book a second short test on the same objective, a week or more later.
"must_know[3].point": |
  When you ask learners to work problems instead of watching you solve them, expect some to say they are learning less. Tell them at the start that effort is part of how it works.
"must_know[4].point": |
  When a committee judges teachers by students' feedback ratings, say that the ratings measure feeling of learning.
"must_know[5].point": |
  Test at the interval you actually care about, and do not treat a one-week result as proof of a six-month one.
"must_know[6].point": |
  A learner's own rating is weakest where you most need it, in a beginner. With a new batch, give a test before you trust a show of hands.
