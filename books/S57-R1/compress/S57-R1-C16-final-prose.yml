definition.text: 'Kotter (1990) sets management and leadership apart as two different and complementary

  systems of action. Management copes with complexity. Leadership copes with change.


  Management has three activities. Planning and budgeting is setting targets, laying down

  detailed steps to reach them, and allocating resources to those steps. Organizing and

  staffing is creating a structure of jobs, filling the jobs with qualified people,

  communicating the plan to them, delegating responsibility for it, and setting up systems to

  monitor it. Controlling and problem solving is monitoring results against the plan,

  identifying where they depart from it, and planning and organizing to fix that.


  Leadership has three matching activities. Setting a direction is developing a vision of the

  future, often the distant future, with strategies for making the changes it needs. Aligning

  people is communicating that direction to everyone who can help carry it out or can block it,

  so that they understand it and are committed to it. Motivating and inspiring is keeping

  people moving in that direction, despite obstacles, by appealing to their needs, values and

  emotions.


  Kotter holds that an organisation needs both, each balancing the other.


  Authority is the right to decide or to direct that comes with a post. Power is the capacity

  to get things done through other people, from any source: authority, expertise,

  relationships, reputation, or control of something others need.


  Delegation is handing a task, and the authority it needs, to another person, while you stay

  answerable for the result. How much direction and checking you give is matched to that

  person''s competence and commitment for that task, not to their seniority in general.


  Role clarity is a written statement, for each decision or piece of work, of who decides, who

  does the work, and who is consulted before it is done.


  Conflict about the work is disagreement over what to do, how to do it, or on what evidence.

  Conflict about the person is friction over who someone is: blame, dislike, a remark about

  their character or motives.

  '
simplified_explanation: 'Kotter''s short way of saying it: management copes with complexity, leadership copes with change.

  Most of the time one person has to do both.


  People follow a direction only if they believe the person giving it. Kotter calls that

  credibility. It rests on your record, and on whether what you do matches what you say.


  Authority comes with the post. The senior resident everyone trusts may have more power over the ward

  than the unit head.


  The same intern may need close watching on one job and none on another.


  Role clarity means writing down, for each decision, who makes it, who does the work, and who

  is asked first. When a team argues over whose job something was, look for the missing line

  on that sheet first.


  Last, two kinds of disagreement. They are named apart because they are handled apart. How to handle

  each is for the next book in this subject.

  '
must_know[0].point: 'They are two sets of activities, and most people who run anything must do both. When a

  change stalls, ask which half was missing.

  '
must_know[1].point: 'A detailed plan is not a direction. Before you write the timetable for a change, write in

  a few sentences where it is going and why.

  '
must_know[2].point: 'Aligning means talking to everyone who can help or block the change, not only the people

  who report to you. List them before you start, and meet the ones you have no authority

  over first.

  '
must_know[3].point: 'When people do not do what you ask, find out whether you lack authority or lack power. An

  order from the post does not reach a department you do not head. Trust built over time can

  reach people no post does. The fix for each is different.

  '
must_know[4].point: 'Delegate to the person and the task, not to the rank. Before you hand over a task, ask how

  well this person has done this task before, and how much they want it.

  '
must_know[5].point: 'Write down who decides, who does and who is consulted before the work starts.

  '
must_know[6].point: 'Do not answer a disagreement about the work as if it were a personal attack, or the

  reverse. Keep the argument about the work in the open, on the evidence.

  '
must_know[7].point: 'These are words, not a diagnosis. Using the words does not show that a team will do better.

  '
