definition.text: 'A fair test of a teaching method compares two groups of learners who differ in one thing

  only: the method. Both groups learn the same content, in the same time, and sit the same test

  after the same delay. That delay is the retention interval, as the last section defined it.


  The learners are allocated to the two groups at random: a chance process decides who goes

  where, not the teacher or the learners. Anything else that affects the score is what OpenStax

  calls a lurking variable. Random allocation spreads the lurking variables across the groups

  by chance.


  The mean difference, MD, is the mean score of one group minus the mean score of the other.

  Its sign says which group did better, so you always state which group was subtracted from

  which.


  The standardised mean difference, SMD, is the MD expressed as a number of standard

  deviations. In words, the SMD is the mean difference divided by the standard deviation,

  written


  ```working

  SMD = MD ÷ SD

  ```


  The choice of SD is part of the definition. The SMD the Cochrane Handbook uses, Hedges''

  adjusted g, divides by an SD pooled from both groups. Glass''s delta divides by the comparison

  group''s SD alone. Papers often report an SMD as an "effect size", and some name the version,

  such as Hedges'' g or Cohen''s d.


  One group tested before and after its teaching, with no comparison group, gives a change, not

  a difference between methods.

  '
simplified_explanation: 'Here is the trap with judging your own teaching. You try a new method with a batch. Their marks

  go up. It feels like proof.


  But marks go up after almost any teaching. A rise tells you something happened. It cannot tell

  you that your method did it.


  So you need two groups, and they must differ in one way only: the method. Then you decide who

  goes in which group by chance, for example by drawing roll numbers from a box.


  Now compare the two groups'' average marks.


  A gap of 8 marks can be large or small. It depends on how spread out the marks are.


  So divide the gap by the standard deviation.

  '
must_know[0].point: 'A batch''s rise from a pre-test to a post-test is not evidence that your method works. Call

  it the change in this batch, and run a comparison before you claim more.

  '
must_know[1].point: 'To compare two ways of teaching, let chance decide who gets which. Then check the two groups''

  earlier marks, to see how evenly chance split them.

  '
must_know[2].point: 'Never quote an MD without saying which group was subtracted from which, and in what unit. A

  positive 6 and a negative 6 are opposite findings.

  '
must_know[3].point: 'An SMD of 0.5 does not mean "50% better". To turn it into marks, multiply it by the SD of the

  scores on your own test.

  '
must_know[4].point: 'Freeman and colleagues pooled 158 comparisons of active learning against lecturing and found an

  SMD of 0.47, just under half an SD. Use that as your yardstick when someone offers you a new

  method''s "effect size". It came from volunteer teachers in university science courses.

  '
must_know[5].point: 'The SMD shrinks when learners'' scores are widely spread and grows when they are bunched, even if

  the gap in marks is the same.

  '
must_know[6].point: 'Random allocation makes the groups alike on average, not identical. With a small batch, chance

  can still leave one group stronger.

  '
must_know[7].point: 'When a committee is shown an "effect size" for a teaching method, ask three things. Compared

  with what? Who decided who got which? How long after the teaching was the test?

  '
