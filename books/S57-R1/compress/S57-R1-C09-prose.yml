definition.text: 'A learning objective is one sentence that states what a named learner will be able to do at

  the end of a piece of teaching, in a form that someone else could watch or mark. It is not a

  list of the topics the teaching will cover. It has six parts.


  1. Who: the learners.

  2. The action: one verb whose result can be seen or marked.

  3. The content the action is done to.

  4. The condition: what the learner is given, or is not allowed, while doing it.

  5. The standard: how much, or how well, counts as done.

  6. By when: the point at which it will be checked.


  Chatterjee and Corral name five of these parts: who, will do, how much or how well, of what,

  and by when. Their practical tips add the condition.


  A verb that names a state of mind cannot be watched or marked. Understand, know, learn,

  appreciate, believe, be familiar with and comprehend are such verbs, and they do not belong in

  an objective. Each objective carries one action. Two actions make two objectives.


  Bloom''s taxonomy is a sorted list of kinds of thinking skill. It was revised in 2001. The

  revision sorts the skills into six levels, from lowest to highest: remember, understand,

  apply, analyse, evaluate and create. Each level has a list of

  action verbs. An objective''s verb is chosen to name the level the learner has to reach, and

  that level decides how the objective can be tested. The verb alone does not fix the level: the

  same verb appears under more than one level, and the task the learner is set decides which.

  '
simplified_explanation: 'Many session plans open with a line like "Students will understand obesity." Nobody can check

  that. You cannot see understanding. You can see what a person does with it.


  So an objective names something the learner will do that you could watch or mark. It says who,

  what they will do, to what, given what, how well, and by when.


  Here is the test of a finished objective. Hand it to a colleague and ask them to write the

  question that checks it. If they cannot, the sentence is not finished.

  '
must_know[0].point: '"Understand" is the name of a Bloom level, and it is also a verb Chatterjee and Corral tell you

  never to use in an objective. Both are true. The level is shown by actions you can see:

  explain, summarise, estimate. When you want understanding, write the action that would show

  it.

  '
must_know[1].point: 'A verb does not fix the level. "Describe" sits under both remember and understand in

  Chatterjee and Corral''s table, and the two sources in this section put "classify" at different

  levels. Decide the level from the task. Ask whether the learner meets a case they have not

  seen before, or repeats something they were shown.

  '
must_know[2].point: 'One action per objective. When a draft says "diagnose and manage", write two objectives. For

  one session, choose the one the learner''s job ends on, and make the other a step inside it.

  '
must_know[3].point: 'Adams reports that objectives in many training programmes sit mostly at the two lowest levels.

  Yours will drift there too unless you check. Before you settle on remember, ask what the

  learner will have to do with the material in the job. Write the objective at that level.

  '
must_know[4].point: 'Bloom''s levels sort thinking skills. Adams notes that a hands skill, such as tying a surgical

  knot, and an attitude, such as empathy towards patients, sit in other domains. So the list

  cannot grade weighing a child. For a skill like that, still write an action you can watch,

  such as "weigh" or "demonstrate". Then judge it by watching, not by the verb list.

  '
must_know[5].point: 'An objective states what you intend. It is not evidence that anyone learned. Only a test of its

  action, on cases the learner has not seen, taken days later, can show that. Never report a

  well-written objective as an outcome.

  '
must_know[6].point: 'This book''s build asks for one objective for one session. That is this book''s rule, chosen so

  that the whole hour can be spent on one action and one test. It is not a finding. A longer

  course carries more.

  '
