definition.text: 'Rereading is studying a text again after a first reading: the restudy of `S57-R1-C03`, done

  with a text. Highlighting is marking the parts of a text that seem important while reading

  it.


  Dunlosky and colleagues reviewed ten study techniques and gave each an overall utility

  rating: low, moderate or high. The rating asks two things. How widely does the benefit hold,

  across learners, kinds of material, kinds of final test and real classrooms? And how does

  the technique compare with the others? They rated both rereading and highlighting low

  utility. Practice testing, the retrieval practice of `S57-R1-C03`, and distributed practice,

  the spacing of `S57-R1-C04`, were rated high.


  Highlighting, in most situations studied and with most learners, did little to boost

  performance. It may help when learners know enough to pick out what matters, or when the text

  is hard.


  Rereading does improve recall over a single reading. But in direct comparisons, rereading has

  consistently done worse than practice testing and than two techniques of explaining.


  So low utility is not zero effect. It means the same time spent another way does more.


  Fluency is the ease with which a text reads or a fact comes to mind. Pashler and colleagues

  (2008) warn that this ease and familiarity can come from things unrelated to understanding.

  '
simplified_explanation: 'Ask a batch how they revise, and you will probably hear two things. They read their notes again. They

  mark the important lines with a highlighter.


  Read a page a second time and it goes down easily. That ease is fluency, and it feels exactly like

  knowing. But it only tells you the page is familiar.


  Read once. Then close the book, write down what you remember, and check it against the page.

  '
must_know[0].point: '"I read it three times and it all looks familiar now" describes fluency, not learning.

  When a learner says this, ask them to shut the book and say it back.

  '
must_know[1].point: 'Replace the second reading with a test. Teach your batch the order: read once, close the

  notes, write what you remember, then check it against the notes.

  '
must_know[2].point: 'Do not tell learners that rereading does not work. It is rated low because practice testing

  does more with the same time.

  '
must_know[3].point: 'A heavily highlighted book is a sign of time spent, not of learning. Check what a learner

  can recall with the book shut.

  '
must_know[4].point: 'Expect rereading to be your learners'' default. At one highly selective university, 84% of

  students listed it among their study methods. Ask a batch how they revise before you teach

  them how.

  '
must_know[5].point: 'These ratings come mostly from laboratory studies of undergraduates. No experiment has tested

  rereading''s effect on learning in a real course, and your own batch was in none of them.

  '
