definition.text: 'To lead people is to get a group to move towards a change and to keep them at the work it

  takes.


  Skill at the work and skill at leading others in it are different competencies. Kotter (1990)

  argued that leadership has nothing to do with charisma or other exotic personality traits,

  and is not the province of a chosen few.


  Leadership is taught to physicians, and the teaching has been evaluated. Frich and

  colleagues'' systematic review found 45 published studies of leadership development programmes

  for physicians, searched in one database up to November 2013. All 45 reported positive

  outcomes. Four had a comparison group.


  That such training changes what physicians do at work, or the results of the service they

  work in, has been tested in very few studies.


  A teaching lineage is the people you teach, and the people they go on to teach. A team you

  run is a set of people whose work on one job you direct, for as long as the job lasts. An

  institution that outlives you is a standing group, with written terms, roles and a named

  successor, that keeps working after you leave it.


  A professional body is an association whose members share one profession or discipline. A

  civil society organisation is a group formed by citizens, outside government and outside

  business, to work for a public cause.

  '
simplified_explanation: 'Here is the usual path. The resident who knows the most is made chief resident. Everyone

  assumes the skill carries over. Often it does not, because knowing the work and getting

  others to do it well are different skills.


  So is leading a gift you have or do not have? Those who write about it, such as Kotter, say

  no. It can be learned, like teaching.


  Many programmes teach leadership to doctors, and every published study of them reports

  success. Almost all of that success is what the doctors said about themselves, mostly

  measured straight after the course. Leadership is taught, and doctors say they learn from it.

  Whether it changes what they do is barely tested.


  You will be asked to build three different things. To tell them apart, ask one question: what

  happens to it the day you go?

  '
must_know[0].point: 'Being the best at the work does not make you able to lead others in it. When you are chosen

  to run something because you know the most, expect to have to learn a second skill.

  '
must_know[1].point: '"Leadership training works" is thinly tested. Do not say they are shown to change

  practice.

  '
must_know[2].point: 'You lead before you have a title. Take the small chances now: run the journal club, lead

  the camp, own one change on the ward.

  '
must_know[3].point: 'Ask of anything you run: what happens to it the day I leave? If the answer is "it stops",

  you have built a team, however long it has run. If you want it to last, write its rules and

  name a successor while you are still there.

  '
must_know[4].point: 'Your first lineage is handed to you. From your first post as Assistant Professor you can be

  made a mentor. You get three first-year students a year, and they stay with you until they

  finish internship.

  '
must_know[5].point: 'Join one professional body and one civil society organisation, and be useful to both.

  '
must_know[6].point: 'The claim that leading can be learned rests on argument and on programme reports, not on

  trials. Judge a course as you would judge a teaching session: ask what was measured, at what

  level, and against what comparison.

  '
