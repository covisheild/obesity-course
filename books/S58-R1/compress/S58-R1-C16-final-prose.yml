definition.text: 'A bar chart of a measured quantity draws each group as one bar, the height of its mean.


  Many different sets of values give the same bar and the same error bar. The values may be spread evenly, or

  bunched with one far from the rest, or split into two clusters. There may be only three of them.


  Showing the data means drawing every value. A strip chart puts each value as a dot along the value axis, one

  column of dots per group; Weissgerber and colleagues call it a univariate scatterplot.

  '
simplified_explanation: 'A bar chart of a measured quantity shows one number per group: the average. It hides everything

  else.


  So when your groups are small, draw every value as a dot. The reader sees how many people there

  were, how they spread, and whether one person is pulling the average.

  '
must_know[0].point: '"The bar chart summarises the group" is the error. Very different sets of values give the same

  mean and the same error bar: an even spread, one far value, two clusters.

  '
must_know[1].point: 'When each group has only a handful of values, draw every value as a dot, with a short line at

  the median or mean. Say in the caption which the line is, and how many values each group has.

  '
must_know[2].point: 'A box plot is a summary too. It can draw two clusters as one wide box with a median where

  nobody is.

  '
must_know[3].point: 'When the same people are measured twice, never draw the two occasions as two bars. Join each

  person''s two values with a line, so the reader sees who went up, who went down and who stayed

  the same.

  '
must_know[4].point: 'A systematic review covered 703 papers in leading physiology journals from early 2014. Of these, 85.6% had

  at least one bar chart, and only 13.4% had a chart showing every value.

  '
must_know[5].point: 'When you review a colleague''s draft with bars of means for small groups, ask for the values as

  dots.

  '
must_know[6].point: 'Leaf through a recent issue of the journal you will submit to and count for yourself before you

  assume its habits.

  '
must_know[7].point: 'Showing every value shows the shape and the count. It does not tell you whether a gap between

  groups is real or large enough to matter. And it is for measured quantities. A share of people

  with a condition is one number per group, and a bar or dot is right for it.

  '
