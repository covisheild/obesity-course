definition.text: 'A paragraph is a group of sentences that makes one point. Its topic sentence states that

  point. Mensh and Kording call this shape context, content, conclusion. At the scale of a

  paragraph, the first sentence sets the topic and the body carries the content. The last

  sentence gives the conclusion to remember.


  A paragraph zig-zags when it leaves a topic and comes back to it later.


  In this book, a reverse outline is the outline of `S58-R1-C04` made after the draft instead

  of before it. A paragraph whose point cannot be written as one sentence without "and" carries

  more than one point.

  '
simplified_explanation: 'Write the point of each paragraph in the margin, in one sentence. Then read the margin

  alone. If a margin note needs an "and", that paragraph is two.

  '
must_know[0].point: '"One idea per paragraph" read as "short paragraphs" is the error.

  '
must_know[1].point: 'Split a paragraph whose note needs "and". Merge two neighbours whose notes say the same

  thing. Move or cut one whose note serves no claim.

  '
must_know[2].point: 'The commonest fault is not a long paragraph but a topic visited twice. Before you edit

  sentences, label each one with its topic and gather each topic into one place.

  '
must_know[3].point: 'The two shapes of a one-point paragraph, point first and answer last, are both sound. Choose

  one for a section and use it in every paragraph, so the reader knows where to look.

  '
must_know[4].point: 'When each paragraph has one conclusion, the reviewer can find the one paragraph behind a

  doubtful claim.

  '
must_know[5].point: 'The reverse outline checks where each point is. It cannot check that the point is true, or

  that the sentences under it support it.

  '
must_know[6].point: 'When you correct a trainee''s thesis chapter, do not rewrite their paragraphs. Ask them to

  write the margin note for each one.

  '
