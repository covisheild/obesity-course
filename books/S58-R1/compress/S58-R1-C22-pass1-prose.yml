definition.text: 'Making a figure is a sequence of decisions, taken in a fixed order, which any program can be

  made to carry out. The first four decide the figure''s content. They are the one claim it makes,

  the mark that suits the shape of the data, and the range of the value axis. The fourth is the

  words on it, with each axis titled and given its unit.


  A default is a setting a program uses when you have not chosen one. Defaults are made to suit

  any plot, so they suit no particular plot well.


  In this book, a figure sheet is the written list of the decisions for one figure, kept beside

  the data.

  '
simplified_explanation: 'A program will draw a chart from your numbers in one click. That chart is the program''s

  guess, made for every chart at once.


  So decide first, then draw. Write your decisions down in order.


  Keep that list. When a number changes, or a reviewer asks for a change, you can draw the

  figure again in minutes and get the same result.

  '
illustration.body: 'Here is the trap with the chart a program offers first. It looks finished.


  Open the *National Family Health Survey (NFHS-5), 2019-21: India Fact Sheet* at

  https://dhsprogram.com/pubs/pdf/OF43/India_National_Fact_Sheet.pdf. Search for anaemic.


  Take the two totals for each

  group into a table of your own.


  ```table

  | group | NFHS-4, 2015-16 (%) | NFHS-5, 2019-21 (%) |

  | children 6-59 months | 58.6 | 67.1 |

  | women 15-19 | 54.1 | 59.1 |

  | women 15-49 | 53.1 | 57.0 |

  | men 15-19 | 29.2 | 31.1 |

  | men 15-49 | 22.7 | 25.0 |

  ```


  Now suppose you select the table and ask your program for a column chart.


  It has a title

  across the top, "Chart 1". A legend in a box says "Series1" and "Series2". The value axis

  starts at 20. The text is small and grey. The bars are red and green. A dark grid line runs

  every 5 points. It saves as a jpeg.


  Do not start fixing what you see.


  **1. The claim.** Cover the chart and write the one sentence it should make. Here: between

  NFHS-4 and NFHS-5, the share with anaemia rose in every group. Rows that would weaken it stay in.


  **2. The mark.** The shape of the data is amounts for a set of groups, at two times. That

  takes bars, or dots where the bars would end, on one shared axis (`S58-R1-C15`). Put each

  group''s two bars side by side, because the claim compares the two rounds within a group.


  **3. The axis.** Bars start at zero, so the starting point of 20 goes.


  **4. The words.** Title the value axis with the quantity and its unit: "anaemic (%)". Delete "Chart 1": the finding goes in the

  caption, not across the drawing.


  **5. The defaults.** Go through the rest one at a time and ask of each what it tells the

  reader (`S58-R1-C18`). The dark grid goes, or becomes faint. Make the small grey text larger and

  darker.


  **6. Colour.** Its job here is to separate two rounds. Red against green fails in grey and for

  a reader with colour-vision deficiency (`S58-R1-C19`). Choose two colours that differ clearly

  in lightness.


  **7. The caption.** Finding first, then what the bars are, who, when, and the source

  (`S58-R1-C20`).


  **8. Saving.** Read the journal''s instructions on file type and size first.


  **9. The checks.** Shrink the figure on screen to about {{n:figure_check_width_low_cm}} to {{n:figure_check_width_high_cm}} cm wide, the size of one column

  of a printed page, and read every label (`S58-R1-C20`).


  Here is the figure sheet you have written, decision by decision.


  ```table

  | step | decision for this figure |

  | claim | anaemia rose between NFHS-4 and NFHS-5 in every group the fact sheet reports |

  | data | five rows of the NFHS-5 India fact sheet, NFHS-4 and NFHS-5 totals; pregnant and non-pregnant women left out, contained in all women |

  | mark | bars, the two rounds side by side within each group |

  | axis | value axis from 0 to 80, titled "anaemic (%)" |

  | words | groups under the bars with ages in years; no title on the drawing |

  | defaults changed | legend names the rounds; faint grid; larger, darker text |

  | colour | two colours that differ in lightness; NFHS-4 always on the left; each round named over the first pair |

  | caption | finding first; what the bars show; ages; no counts in the source; source and indicator numbers |

  | saving | the journal''s format and size; otherwise pdf, and png where a bitmap is required |

  | checks | read at {{n:figure_check_width_low_cm}} cm wide; in grey; through a simulator |

  ```


  The figure that results is drawn below. That is the point: any program that will take these decisions can draw it again.

  '
illustration.analogy_breaks_when: 'The sheet makes the figure repeatable only as far as you wrote it down. A change you make by

  dragging a label with the mouse and forget to record is lost the next time.

  '
must_know[0].point: 'Write the figure''s decisions down before you open the program, in order: claim, mark, axis,

  words, defaults, colour, caption, saving, checks. If

  you start by fixing what the first chart shows, you fix what you happen to notice.

  '
must_know[1].point: '"The program drew it, so it is a neutral picture of the numbers" is the error. Every setting

  you did not choose was chosen for any chart at all. Check each one, the axis start first.

  '
must_know[2].point: 'A spreadsheet will do only if you change nearly every default.

  If a spreadsheet is what you have, keep a figure sheet beside the file, and record every

  change as you make it.

  '
must_know[3].point: 'Never finish a figure by hand in a drawing program and leave no record. When a reviewer asks

  for one changed number, every hand edit has to be done again, and some will be forgotten.

  '
must_know[4].point: 'Read the journal''s instructions for figures before you save. Where they leave it to you, save

  a vector graphic such as a pdf for print. Use a png where a bitmap is required, and never a

  jpeg for a chart.

  '
must_know[5].point: 'Check the figure at the size it will be printed, not at the size of your screen. Shrink

  it to one column''s width, then view it in grey and through a simulator.

  '
must_know[6].point: "When a trainee shows you a chart, ask for the figure sheet before you look at the chart. \n"
must_know[7].point: 'The procedure makes sure each decision is taken on purpose. A perfectly made figure of a wrong table is a wrong

  figure, so check the data against their source before step 1.

  '
