definition.text: 'A number in a sentence is reported in full when the reader can check it. A percentage carries the two counts it was worked out from: the numerator,

  how many had the thing, and the denominator, how many were counted.


  A difference between two percentages is stated in percentage points. A relative change

  divides that difference by the starting percentage, and is stated in per cent.


  A number shows false precision when it carries more digits than the data

  can support.


  Cole''s rules for how many digits to report, offered as recommendations, not requirements:


  ```table

  | statistic | how many digits to report |

  | mean | enough decimal places to give the standard deviation (SD) two significant figures, or the standard error (SE) one |

  | percentage | whole numbers, or one decimal place for values under 10% |

  | risk ratio or odds ratio | two significant figures if the first digit that is not zero is 4 or more, otherwise three: the rule of four |

  | P value | one significant figure, never 0.000 |

  ```


  The SAMPL guidelines (Statistical Analyses and Methods in the Published Literature) are by

  Lang and Altman. They ask for P values as equalities, to one or two decimal places. The

  smallest that need be reported is P < 0.001. They ask for a mean and its SD in the form

  mean (SD).

  '
simplified_explanation: 'So ask three questions of every number you write. In what unit? Out of how many? How finely do

  the data let you say it?

  '
must_know[0].point: 'More decimal places look more careful, and that is the error. Round once, when you write the sentence, to the digits Cole''s rules give.

  '
must_know[1].point: 'Put the count before the percentage: "15 of 40 (38 per cent)".

  '
must_know[2].point: 'A change between two percentages has two sizes. For women in NFHS it is

  {{n:nfhs5_women_ow_ob_change_pp}} percentage points, or about {{n:nfhs_women_ow_ob_rel_rise_pct}} per cent of the starting figure. Say

  the points first.

  '
must_know[3].point: 'When fewer than 100 people are counted, one person is worth more than a percentage point.

  In a small study the count is the result.

  '
must_know[4].point: 'Cole and SAMPL give different rules for P values. Neither allows

  0.000.

  '
must_know[5].point: 'Rounding rules are for the page, not for the working. A figure rounded early and then used

  in a later sum carries its rounding into the answer.

  '
must_know[6].point: 'These rules decide how many digits you print. They cannot tell you whether the number is

  right.

  '
must_know[7].point: 'The NFHS fact sheet prints percentages with no counts. Never make a count by multiplying the

  survey''s {{n:nfhs5_women_interviewed}} women by the percentage.

  '
