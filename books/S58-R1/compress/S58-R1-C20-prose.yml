definition.text: 'The words on a figure let a reader understand it without the text of the paper. An axis title

  names the quantity an axis shows and, for a measured quantity, its unit, as in "body mass

  index (kg/m^2)". An axis of categories, such as sex or place of residence, needs no unit. Tick

  labels are the values printed along an axis. A legend is the key that says which colour or

  mark stands for which group; a direct label puts the group''s name beside its data instead.

  Every letter and number must stay legible at the size the figure is printed.


  The caption is the text printed with a figure, and journals call it the figure legend. Its

  first element is the figure''s title, which states the finding. It then says what is shown, in

  whom, where and when; how many independent people or units were measured, written n; what any

  error bar shows; and where the data came from. With its caption, a figure should be readable

  on its own.


  An error bar is a line drawn through a value, usually a mean, to show a range around it.

  Descriptive error bars show how the data are spread: the range, from the lowest value to the

  highest, or the standard deviation (SD). Inferential error bars show how precisely the mean is

  estimated: the standard error of the mean (SE), which is the SD divided by the square root of

  n, or a 95% confidence interval (CI). A 95% CI is a range worked out from the sample so that,

  if the study were repeated many times, 95 per cent of such ranges would contain the true mean

  of the population. When n is 10 or more, it is approximately the mean plus or minus 2 SE. The

  two kinds of bar are drawn the same way, so a bar means nothing until the caption says which it

  is.


  In n, independent means separate people or units. Measuring one person three times gives

  three replicates and an n of 1.

  '
simplified_explanation: 'A reader may look at your figure before reading a word of your paper. So the figure has to

  explain itself. Each axis says what it measures and in what unit. Each group has its name

  written beside it. The caption under the figure says what the finding is, who was measured, how

  many, and where the numbers came from.


  Error bars need special care. The same line through a mean can show how spread out the people

  are, or how sure you are of the mean itself. These are different things, and they look the

  same. So the caption has to say which one it is, every time.

  '
must_know[0].point: '"An error bar shows the error" is the error. The same mean of 40.0 can carry an arm of 12.0, 6.93

  or 27.7 from the same three numbers. Write in every caption whether a bar is the SD, the SE or a

  95% CI, and give n beside it.

  '
must_know[1].point: 'Title every axis with the quantity and its unit: "body mass index (kg/m^2)", not "BMI". An axis

  of categories needs no unit. If a reader must guess, the axis is not finished.

  '
must_know[2].point: 'Write the caption in a fixed order. The finding comes first. Then what each mark shows; who,

  where and when; n; what any error bar is; and the source. Check it by covering the paper''s

  text and reading only the figure and its caption.

  '
must_know[3].point: 'n counts separate people or units, not measurements. Weigh 40 children three times each and

  you have 120 readings and an n of 40. An error bar worked from all 120 readings looks

  narrower than the evidence allows.

  '
must_know[4].point: '"Legend" means two things. To a journal, the figure legend is the caption: ICMJE asks for

  "legends for illustrations" on a separate page. On the figure itself, a legend is the key to

  the colours. When an author''s instructions ask for legends, send captions.

  '
must_know[5].point: 'To show how spread out people are, draw the SD or, better, the points themselves. To show how

  precisely a mean or a prevalence is known, draw a 95% CI. ICMJE asks for measures of

  uncertainty such as confidence intervals, not P values alone.

  '
must_know[6].point: 'Before a figure leaves you, shrink it to {{n:figure_check_width_low_cm}} to {{n:figure_check_width_high_cm}} cm wide on screen and read every label. Most

  programs'' default text is too small at that size.

  '
must_know[7].point: 'Naming the bar lets a reader read it; it does not license every comparison. Bars on the same

  group measured at different times cannot show whether the group changed (Cumming''s Rule 8).

  For that, the change in each person has to be worked out and its own interval drawn.

  '
