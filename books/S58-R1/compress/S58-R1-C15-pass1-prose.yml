definition.text: |
  A mark is anything drawn that stands for one number (`B0-R0-C40`). The reader gets the number
  back by a judgment the eye makes about the mark. Cleveland and McGill (1984) called these
  judgments elementary perceptual tasks, and named ten. A common scale is one axis that every mark being compared is read
  against.

  They proposed an order, from the judgment people make most accurately to the least. First
  comes position along a common scale, then positions along scales not lined up. Length,
  direction and angle share third place, then area. Their rule for
  design follows: a graph should use judgments as high in this order as it can.

  The order is a hypothesis. Their two experiments tested two parts of it, position against
  length and position against angle. Position won both
  times.

  The mark is chosen by the shape of the data as well. Amounts for a set of groups take bars, or
  dots where the bars would end. Many values from each group take a chart of their distribution.
  Parts of one whole take side-by-side bars, stacked bars or, for a few parts, a pie. One measured
  quantity against another takes a scatterplot. Change over time takes a line.
simplified_explanation: |
  Your eye reads some marks better than others. So put the numbers a reader must compare on one
  shared axis, side by side.
must_know[0].point: |
  Put the values a reader must compare on one shared axis, next to each other: bars from one
  shared start, or dots.
must_know[1].point: |
  In Cleveland and McGill's experiments, large errors were 5.3 times as frequent per judgment on
  length as on position.
must_know[2].point: |
  "The ranking of marks was proved by experiment" is the error. The full order of ten
  judgments is Cleveland and McGill's hypothesis.
must_know[3].point: |
  Before you draw a pie, check that its numbers are parts of one whole: shares of the same group
  of people, adding to 100 per cent. Prevalences in different groups are not.
must_know[4].point: |
  When a trainee shows you a pie chart or a stacked bar chart, ask for the same numbers as dots
  or grouped bars on one axis.
must_know[5].point: |
  Name the shape of your numbers before you choose the chart.
must_know[6].point: |
  When the value axis cannot start at zero, as on a logarithmic axis, draw dots, not bars.
must_know[7].point: |
  Use the order as a guide, as its authors did, not as a rule that settles
  every choice.
