definition.text: 'The axis start, written s, is the value at which the value axis begins.


  The principle of proportional ink, so named by Bergstrom and West, says that a shaded area

  must be in proportion to the value it stands for. On an ordinary, linear axis a bar, or an

  area shaded down to the axis, therefore starts at zero. On a logarithmic axis a bar stands for

  a ratio, and it starts at 1. A point or a line carries its value by position alone.


  Take two bars with values a and b, a the smaller, drawn up from an axis start s above zero.

  Their drawn heights are a − s and b − s, read "a minus s" and "b minus s". The drawn ratio is

  (b − s) ÷ (a − s), where ÷ is read "divided by". The data ratio is b ÷ a.


  Tufte''s Lie Factor (LF) compares a change as the figure draws it with the same change in the

  data. Each change is a percentage change: the change divided by the value it started

  from, times 100.


  ```working

  LF = (percentage change drawn in the figure) ÷ (percentage change in the data)

  ```


  An LF of 1 draws the change at its true size. Tufte counts an LF above 1.05 or below 0.95 as

  substantial distortion.


  Starting a bar chart''s axis above zero is called truncating it. Truncation makes readers judge

  a difference as more severe.

  '
simplified_explanation: 'A bar is a length, and a reader reads a length as a value. A small rise then looks like a leap.

  '
must_know[0].point: '"Every number on the axis is correct, so the chart cannot mislead" is the error. Readers judge

  the lengths. In Correll''s experiments the exaggeration stayed even when readers reported the

  numbers accurately. Fix the drawing, not the labels.

  '
must_know[1].point: 'Before you show or accept a bar chart whose axis starts above zero, work out a ÷ (a − s) with

  the smaller bar. If it is above 1.05, redraw it before anyone discusses the size of the gap.

  '
must_know[2].point: 'A break mark on the axis does not make a truncated bar chart honest.

  '
must_know[3].point: 'Shading counts as ink. If you fill the area under a line, take the axis down to zero, or

  leave the line unfilled.

  '
must_know[4].point: 'To show a small change honestly, draw the change itself as bars from zero, or draw points on

  a stated range near the data.

  '
must_know[5].point: 'Draw a ratio on a logarithmic axis, with bars from 1. Then "twice" and "half" have the same

  length, pointing opposite ways, as the same fact said two ways should.

  '
must_know[6].point: 'The range you pick for a line chart still sets how big the change feels. So state the axis

  start in the caption, and give the change in numbers.

  '
must_know[7].point: 'Repeat the change in percentage points and in per cent, with both values.

  '
