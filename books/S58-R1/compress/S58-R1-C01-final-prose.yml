definition.text: 'An original research article is a journal paper that reports a study for the first time. The

  International Committee of Medical Journal Editors (ICMJE) is a group of medical journal

  editors whose Recommendations, updated January 2026, many journals follow. They say the text

  of such an article is usually divided into Introduction, Methods, Results and Discussion

  (IMRAD).


  Around the text sit a title page, which carries the title, an abstract and a numbered list of

  references.


  IMRAD is a convention that editors adopted, not a fixed law of science. In four leading

  general medical journals it was absent from original articles in 1935, reached 80 per cent of

  them in the 1970s, and was the only pattern by the 1980s (Sollaci and Pereira, 2004).

  '
simplified_explanation: 'A research paper reports one study. Most medical journals want it in the same four parts, in

  the same order.


  The introduction says why the study was needed and what question it asked. The methods say

  what was done, so that someone else could check it or do it again. The results say what was

  found. The discussion says what the findings mean, and where they stop.


  Before these four come a title and an abstract, a short summary of the whole paper. After them

  comes the list of references, the sources the paper leans on.


  The four-part shape has a name, IMRAD, from the first letters of the parts. It is a habit that

  editors spread in the twentieth century, not a rule of nature. So the journal you send your

  paper to has the last word on its shape.

  '
must_know[0].point: 'Before you draft, open the instructions for authors of the journal you are aiming at. Note its

  article types, its abstract format and its word limits.

  '
must_know[1].point: 'The two commonest misplacements are your own result in the introduction and a number you

  obtained during the study in the methods. A reader who meets a result before its method

  cannot judge it.

  '
must_know[2].point: '"Papers have always been written this way" is wrong. In four leading medical journals the IMRAD

  structure was absent in 1935. ICMJE calls it a reflection of how discovery works. Neither makes it

  a rule for every kind of article.

  '
must_know[3].point: 'Do not force a case report, a narrative review or an editorial into the four parts. ICMJE says

  such articles may be less structured or unstructured, and that a meta-analysis may need a

  different format.

  '
must_know[4].point: 'Readers jump to the section where they expect to find a thing. So put it there.

  '
must_know[5].point: 'The four parts tell you where each kind of sentence goes. They do not tell you what the paper

  claims, or whether the data carry that claim.

  '
must_know[6].point: 'When you turn a thesis chapter into a paper, read the journal''s instructions afresh.

  '
