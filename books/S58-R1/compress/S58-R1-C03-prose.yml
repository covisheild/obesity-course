definition.text: 'A paper''s one message is its central claim, stated in one or two sentences: what the study

  found, and why that matters. Mensh and Kording''s first rule is to focus a paper on a single

  central contribution and to carry it in the title. The contribution may have several parts,

  provided one statement holds them together.


  The message is written before the draft, and it is a test. If you cannot state it, the paper

  is not ready to draft. It passes only if it is a claim, which would be false had the data come

  out differently, and if it answers the reader''s "so what?".


  The title is the message in its shortest form. ICMJE''s Recommendations describe the title as a

  distilled description of the complete article. The abstract is the argument in small: the

  context and the gap, what was done, the main result, and what it means. ICMJE asks the

  abstract for the study''s context, purpose, basic procedures, main findings and principal

  conclusions. Title, abstract and text must agree, and ICMJE notes that abstracts often differ

  from the text.

  '
simplified_explanation: 'Before you write the paper, write one or two sentences that say what you found and why it

  matters. That is your one message. Everything else in the paper is there to support it.


  Test it two ways. First, would the sentence be false if your data had come out differently? If

  not, it says nothing yet. "This study is about obesity" is true whatever you found. Second, does

  it answer "so what?" for someone who reads only that sentence?


  Then the title is the message cut as short as it will go. The abstract is the message with its

  reasons: what was known, what was missing, what you did, what you found, and what it means.

  Check that the title, the abstract and the paper all say the same thing.

  '
must_know[0].point: 'Write your one message before you draft any section. If you cannot write it, you are not ready

  to draft. Go back to your results until you can say what they show.

  '
must_know[1].point: '"This study is about..." is a topic, not a message. Test any candidate by asking whether it

  would be false had the data come out differently. If it would still be true, it claims

  nothing, and neither will a title or abstract built on it.

  '
must_know[2].point: 'Make the title the message in its shortest form, with no abbreviations, which ICMJE''s

  Recommendations ask authors to avoid there. Use the words a searcher would type, and name the

  study design if the journal asks for it.

  '
must_know[3].point: 'Before anyone else reads your draft, list every number in the title and abstract and find each

  one in the results. ICMJE notes that abstracts often differ from the text. The abstract is the

  only part many readers read, so a wrong number there is the one most people take away.

  '
must_know[4].point: 'Use the same message for every other form of the work: the talk, the poster, the answer to a

  journalist. Mensh and Kording''s test of success is that readers can still state your main

  contribution a year later. A message you can say in one breath is the one they can repeat.

  '
must_know[5].point: 'A clear message is not a true one. Mensh and Kording ask for a claim as simple as the data and

  logic support, but no simpler. Writing the message does not test whether the data carry it.

  Check that separately, and if they carry less, cut the message to fit them.

  '
