definition.text: "The one-pass test checks whether a draft carries its argument to a reader. It has five steps.\n\n1. Before the test, write your argument in one or two sentences, your one message from\n   `S58-R1-C03`, and put it away where the reader cannot see it.\n2. Give the draft to a reader who does not know the work. They read it once, at their normal\n   pace, without going back, and mark each place where they stopped or read a passage again.\n3. Without looking at the draft, the reader writes in one or two sentences what it argues.\n4. Compare the reader's sentences with yours, part by part: whom or what the claim is about,\n   what was found, compared with what, and how far it reaches.\n5. Revise the paragraphs that the comparison and the marks point to, and test again with a\n   new reader.\n\nThe draft passes when the reader's sentences carry every part of your message and add no part\nof their own. The wording need not match.\n"
simplified_explanation: 'You cannot tell whether your draft is clear by reading it yourself. You know what it means, so

  you read that meaning into it.

  '
illustration.body: 'First, write your one message and seal it in an envelope, or in a file the reader will not

  see.


  > Among women aged 15 to 49 in India, overweight or obesity was commoner in NFHS-5 than in

  > NFHS-4, and commoner in urban than in rural areas. These survey data cannot say why.


  Next, find a reader outside the work: a resident in Physiology, say, who knows what a survey is and nothing

  about yours.


  She hands back one mark, beside paragraph 3, and this sentence.


  > Obesity is increasing among Indian women because of urbanisation.


  Now open the envelope and compare, part by part.


  ```table

  | part | your message | her sentence | verdict |

  | about whom | women aged 15 to 49 in India | Indian women | age range lost |

  | what was found | commoner in NFHS-5 than in NFHS-4 | increasing | kept |

  | compared with what | urban higher than rural | because of urbanisation | a difference turned into a cause |

  | how far it reaches | the data cannot say why | nothing | lost, and contradicted |

  ```


  The added cause is the worst failure. Find where it came from. Her mark sits beside paragraph 3. You open it:

  the urban and rural figures come straight after two sentences on diet and work changing in Indian cities. The

  order invites the reader to join them.


  Revise only what the test pointed to. Move the urban and rural figures into the paragraph that reports the

  findings.


  Then test again, with a new reader. A resident in Microbiology reads it once, makes no mark, and writes this.


  > Overweight among women of 15 to 49 went up between the two surveys and is higher in towns.

  > The survey can''t tell us why.


  Every part is there and nothing is added. The draft passes.

  '
illustration.analogy_breaks_when: 'One reader is one reader.


  The test shows that the argument gets across. It does not show that the argument is right.

  '
must_know[0].point: 'Never count your guide''s or co-author''s approval as the test.

  '
must_know[1].point: 'Write your own one-message sentence and put it away before the reader starts.

  '
must_know[2].point: '"Did you like it?" and "Any comments?" are the wrong questions. Ask for the one sentence and

  the marks.

  '
must_know[3].point: 'Treat a part the reader added as worse than a part the reader lost. Find the paragraph

  whose order or wording invited it, and change that paragraph.

  '
must_know[4].point: 'Use a new reader for each round.

  '
must_know[5].point: 'A pass shows that one reader, minutes after reading, could state your argument.

  '
