definition.text: "A sentence is clear when a reader takes from it, on one reading, the point the writer meant,\nand gives each part of it the weight the writer meant. Readers look for each kind of\ninformation in a fixed place in the sentence. Five principles put it there. They come from\nGopen and Swan's reader-expectation approach (1990) and the US Federal Plain Language\nGuidelines (2011), and both sources call them principles, not rules.\n\n1. One idea per sentence. Each sentence makes a single point.\n2. The subject close to its verb. Readers expect the verb straight after the subject.\n3. The action in the verb. A hidden verb is an action turned into a noun, such as\n   \"increase\", \"assessment\" or \"measurement\", carried by an empty verb such as \"was\n   observed\", \"was done\" or \"make\".\n4. Old information first, new information last. The start of a sentence, the topic position,\n   holds the information that links back to what the reader already has, and names whose\n   story the sentence tells. The end, the stress position, holds the new information the\n   reader should weigh most.\n5. The doer as the subject where the doer matters, in the active voice, with \"we\" for the\n   authors' own actions. The passive is kept where the doer does not matter, or where the\n   sentence carries on the story of the thing acted on.\n"
simplified_explanation: 'A reader reads your sentence once and decides what it said.


  Say one thing in each sentence.


  Put the verb soon after the subject.


  Put the action in the verb. Write "the proportion rose", not "an increase was observed".


  Start with what the reader already knows, and end with what is new.


  Name who did it when that matters. If it was you, write "we".

  '
must_know[0].point: 'Find the subject and the verb, and count the words between them.

  '
must_know[1].point: '"Long sentences are the problem, so cut words" is the error. The test is how many points in

  the sentence deserve weight.

  '
must_know[2].point: 'Search your draft for the empty verbs that carry hidden actions: "was done", "was carried

  out", "was observed", "was performed".

  '
must_know[3].point: 'End a results sentence on the number or finding you want remembered.

  '
must_know[4].point: 'In a methods section, name the doer of every step a reviewer would judge: who measured, who

  interviewed, who entered the data. Keep the passive only where the result is the same whoever

  did it.

  '
must_know[5].point: 'Split a sentence with several points into several sentences. A chain of three or more nouns

  makes the reader guess how they relate.

  '
must_know[6].point: 'These are principles, and they stop working when followed blindly. If a rewrite makes a

  sentence worse for its paragraph, as "Bees disperse pollen" would in a paragraph about pollen,

  keep the original.

  '
