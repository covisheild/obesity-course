definition.text: 'The words on a figure let a reader understand it without the text of the paper.


  The caption is the text printed with a figure, and journals call it the figure legend. Its first element is the figure''s title, which states the finding.


  An error bar is a line drawn through a value, usually a mean, to show a range around it. Descriptive error bars show how the data are spread: the range, from the lowest value to the highest, or the standard deviation (SD). Inferential error bars show how precisely the mean is estimated: the standard error of the mean (SE), which is the SD divided by the square root of n, or a 95% confidence interval (CI). When n is 10 or more, it is approximately the mean plus or minus 2 SE.

  '
simplified_explanation: 'A reader may look at your figure before reading a word of your paper. So the figure has to explain itself. Each group has its name written beside it.


  The same line through a mean can show how spread out the people are, or how sure you are of the mean itself. These are different things, and they look the same. So the caption has to say which one it is, every time.

  '
must_know[0].point: '"An error bar shows the error" is the error. Write in every caption whether a bar is the SD, the SE or a 95% CI, and give n beside it.

  '
must_know[1].point: 'Title every axis with the quantity and its unit: "body mass index (kg/m^2)", not "BMI".

  '
must_know[2].point: 'Write the caption in a fixed order. The finding comes first. Then what each mark shows; who, where and when; n; what any error bar is; and the source.

  '
must_know[3].point: 'n counts separate people or units, not measurements. Weigh 40 children three times each and you have 120 readings and an n of 40.

  '
must_know[4].point: '"Legend" means two things. When an author''s instructions ask for legends, send captions.

  '
must_know[5].point: 'To show how spread out people are, draw the SD or, better, the points themselves. To show how precisely a mean or a prevalence is known, draw a 95% CI.

  '
must_know[6].point: 'Before a figure leaves you, shrink it to {{n:figure_check_width_low_cm}} to {{n:figure_check_width_high_cm}} cm wide on screen and read every label.

  '
must_know[7].point: 'Bars on the same group measured at different times cannot show whether the group changed (Cumming''s Rule 8). For that, the change in each person has to be worked out and its own interval drawn.

  '
