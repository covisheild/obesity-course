definition.text: 'Tufte divides the ink on a figure into two kinds. Data-ink is the ink that changes when the

  data change: the bars, the points, the line. Everything else is non-data ink: frames, grid

  lines, background fills, shadows. The data-ink ratio is the data-ink divided by all the ink

  used to print the figure.


  Tufte''s rule is to maximise this ratio "within reason": erase non-data ink, and erase

  data-ink that repeats what other ink already shows. He gives no one-sentence definition of

  chartjunk. He introduces it as decoration that "does not tell the viewer anything new".


  In this book, decoration is any element that tells the reader nothing about the data or about

  how to read them. A 3-D effect on flat data, a shadow, a coloured background behind a single

  plot, a frame round the whole figure and a dark grid are decoration. Axis titles, tick labels

  and a light grid or reference line are context. So is a direct label: a group''s name written

  beside its data, in place of a legend, the key that says which colour is which. Context is

  non-data ink, and it stays (Wilke).

  '
simplified_explanation: 'Every mark on a figure either tells the reader something or gets in the way. The bars and points

  tell. So do the axis titles and the labels: without them the bars mean nothing.


  So ask one question of each mark: what does this tell the reader? If the answer is "nothing",

  delete it.

  '
must_know[0].point: '"The cleanest figure is the one with the least ink" is the error. Delete decoration; keep

  context.

  '
must_know[1].point: 'Ask one question of every element of a figure: what does it tell the reader about the data,

  or about how to read them? Do this before you change anything else.

  '
must_know[2].point: 'Never draw flat data in 3-D. The third dimension carries no data and it bends the bars: in

  Wilke''s example, 322 first-class passengers read as fewer than 300.

  '
must_know[3].point: 'Use direct labels: write each line''s or group''s name beside its data, and delete the legend.

  '
must_know[4].point: '"Useful junk?" found that cartoon charts were described no worse, and were remembered better

  two to three weeks later. That was 20 students, with no time limit. It does not show that

  decoration is harmless when a reader needs exact values, and the authors say so. Keep it out of

  a paper''s figure.

  '
must_know[5].point: 'A picture on a chart carries an opinion. On a public chart, choose a picture only if you are

  willing to say its message out loud.

  '
must_know[6].point: 'Removing decoration cannot fix a dishonest axis. A plain bar chart that starts above zero is

  still wrong.

  '
must_know[7].point: 'When a trainee brings you a chart straight from a spreadsheet, do not redraw it for them. Have

  them delete one element at a time, and ask after each whether the reader lost anything.

  '
