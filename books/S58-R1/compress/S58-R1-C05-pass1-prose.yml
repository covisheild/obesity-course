definition.text: 'The first is the Recommendations of the International Committee of Medical Journal Editors (ICMJE), updated January 2026, section IV.A.3.g, References. The second is the style guide those Recommendations point to for format: Citing Medicine, 2nd edition, from the US National Library of Medicine (NLM).


  What to cite. Cite original research directly where you can, and the published article rather than its abstract. Do not cite articles in predatory or pseudo-journals.


  Mark a preprint as a preprint.


  How to number. References are numbered consecutively in the order in which they are first mentioned in the text. They are identified in the text, tables and figure legends by Arabic numerals (1, 2, 3) in parentheses. A reference cited only in a table or a figure legend takes its number from the point where the text first mentions that table or figure.


  How to format a journal article. Citing Medicine lists the elements in the order they appear. For an ordinary journal article these are the authors, the article title, the abbreviated journal title, the date of publication, the volume, the issue in parentheses, and the pages.


  Authors are entered surname first, with at most two initials. Only the first word of an article title, its proper nouns and adjectives, acronyms and initialisms take capitals. Journal titles are abbreviated as the NLM Catalog lists them. A page range drops the repeated digits: 123-125 becomes 123-5.

  '
simplified_explanation: 'Every sentence in your paper that rests on someone else''s work carries a number, such as (3). The number points to one entry in the list at the end of the paper, the reference list. Number your sources in the order the reader first meets them. A source you use again keeps the number it got first.


  Cite what you actually read.

  '
must_know[0].point: 'Open the original before you cite it. If you met a finding in a review, find the paper the review cites and read the passage. Cite that paper only if it says what you claim.

  '
must_know[1].point: '"My reference manager makes my references correct" is the error. It formats what it was given, and what it was given can be wrong. Check every entry against PubMed or the paper itself, and check that the paper supports the sentence it is attached to.

  '
must_know[2].point: 'Before you submit, check that no reference is a retracted paper. Search PubMed for "Retracted publication [pt]", or look each paper up in PubMed.

  '
must_know[3].point: 'Cite something not formally published by what it is. A preprint carries "[Preprint]". A paper accepted but not yet out is "forthcoming", NLM''s preferred word, or "in press".

  '
must_know[4].point: 'Never cite an AI tool as the source of a fact. If a tool gives you a reference, find the paper, open it, and read the passage before you cite it. If you cannot find it, do not cite it.

  '
must_know[5].point: 'Do not cite a paper from a predatory or pseudo-journal; ICMJE asks you to avoid them.

  '
must_know[6].point: 'How many authors to list is the journal''s choice. Read the journal''s instructions, set your reference manager to match, and check the first entry with more than six authors by eye.

  '
must_know[7].point: 'The committee behind these Recommendations was once known as the Vancouver Group. Where the journal states its own variant, the journal wins.

  '
must_know[8].point: 'A reference in perfect NLM format can still point to a paper that does not say what your sentence says. When you check a student''s thesis, open three of its references at random and read the passages they point to.

  '
