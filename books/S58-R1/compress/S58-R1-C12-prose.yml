definition.text: 'Cutting is deleting words, sentences or paragraphs that do no work for the reader, so that

  what remains says the same thing in fewer words. A unit does no work when deleting it loses

  nothing the reader needs. It may restate what is already said, serve no claim of the piece, or

  use several words where fewer say the same.


  Cutting runs from the largest unit to the smallest: paragraphs, then sentences, then words.

  The test for a paragraph or a sentence is whether it serves the piece''s one message, from

  `S58-R1-C03`. The test for a word is whether the sentence means the same without it.


  Cutting is not compressing. Compressing keeps everything and packs it into fewer, longer

  sentences. Cutting removes what does no work and leaves each remaining sentence carrying one

  idea, as before or shorter.

  '
simplified_explanation: 'Cutting is deleting what the reader does not need. Start big. First ask of each paragraph

  whether it serves your one message. Then ask it of each sentence. Only then go through the words.


  Big cuts first, because polishing a sentence you later delete is work thrown away. Most of the

  words you lose will go in whole sentences and paragraphs, not in single words.


  Do not cut by squeezing two sentences into one. That saves a few words and makes a sentence the

  reader has to read twice.

  '
must_know[0].point: 'Cut in order: paragraphs first, then sentences, then words. Do not polish a sentence until

  you know it will stay.

  '
must_know[1].point: 'Test each paragraph against your one message with a reverse outline. Where a margin note

  serves no part of the message, delete that paragraph. Or move it to the section whose message

  it does serve.

  '
must_know[2].point: '"Fewer words is better, so join short sentences into one" is the error. That is compressing.

  It trades words for difficulty: each sentence now carries several ideas, and its score on

  `S58-R1-C11`''s formula drops. Cut whole units instead, and keep one idea a sentence.

  '
must_know[3].point: 'Cutting has no test for truth. A qualifier such as an age range, a year, a place or "or

  obese" looks like padding. Before you delete any word, ask whether the claim gets wider

  without it. If it does, the word stays.

  '
must_know[4].point: 'Before you cut, open a second file and paste every deleted passage into it. This is this

  book''s advice, not a finding. Deleting is easier when nothing is lost for good, and you will

  rarely open the file again.

  '
must_know[5].point: 'Delete the opener that delays the subject: "It was observed that", "It is important to note

  that", "In the present study". Sometimes such a phrase was holding a fact, as "at this point in

  time" held the survey round. Then put the fact back in its plain form.

  '
must_know[6].point: 'When you correct a trainee''s thesis chapter, mark the paragraphs and sentences to delete

  before you touch a single word. Corrections to words in a passage that should go teach the

  wrong lesson and waste both your time.

  '
