definition.text: 'A readability formula estimates how hard a passage is to read from three counts: words, sentences and syllables. A syllable is one beat of a spoken word: "row" has one, "maintain" two, "dictionary" four.


  The counts give two averages. The average sentence length (ASL) is the number of words divided by the number of sentences. The average syllables per word (ASW) is the number of syllables divided by the number of words.


  The Flesch Reading Ease score (FRE), published by Rudolf Flesch in 1948, is 206.835 minus 1.015 times ASL minus 84.6 times ASW. A higher score means easier text.


  Kincaid and colleagues (1975) gave a grade-level formula: 0.39 times ASL, plus 11.8 times ASW, minus 15.59. Its result is a school grade level. Later writers call the formula the Flesch–Kincaid grade level (FKGL).


  Both formulas count lengths. Neither reads meaning, order or the logic between sentences.


  Measured this way, scientific abstracts have grown harder to read.

  '
simplified_explanation: 'A readability formula reads your draft with a ruler, not with a mind. Long sentences and long words push the score towards hard.


  Use it as a trip-wire.


  Never use it as a target. A row of four-word fragments scores as very easy, and it can still leave out the one thing the reader needed.

  '
must_know[0].point: '"The score went up, so the text is clearer" is the error. The formula counts lengths and nothing else.

  '
must_know[1].point: 'Before you compare two scores, find out how each counted figures. Flesch in 1948 read them aloud, Flesch in 1979 counted each as one syllable, and one large study dropped them.

  '
must_know[2].point: 'Use the score as a trip-wire on your own draft, never as a target. Where one scores far harder than the rest, read its longest sentences and rewrite them for the reader.

  '
must_know[3].point: 'A grade level is carried over from the people the formulas were fitted on: Flesch''s schoolchildren and Kincaid''s 531 Navy personnel. Flesch wrote that his score tracks a school grade only up to about seventh grade.

  '
must_know[4].point: 'Do not score a Hindi or Tamil translation of a leaflet with these formulas. For a health leaflet in any language, give it to a few people from the audience and ask them what it tells them to do.

  '
must_know[5].point: 'Mind the unit of the syllable term. Flesch''s 1948 article multiplies syllables per 100 words by 0.846; his 1979 book multiplies syllables per word by 84.6. Mix the two and the score comes out in the thousands below zero.

  '
must_know[6].point: 'In one study of 709,577 abstracts, the share scoring below 0 on the FRE rose from 14% in 1960 to 22% in 2015. It does not show that specialists understand the newer abstracts less well.

  '
