definition.text: "In this book, a finding's journey is the order of work that takes one result from its source\nto a results paragraph a reader can restate after one reading.\n\n1. The question, and the data read from the source with every limit the source states.\n2. The one message: the claim in one or two sentences, false if the data had come out\n   otherwise.\n3. The results paragraph, rewritten from an account of what was done into the claim and its\n   evidence.\n4. The numbers: units, counts where the source gives them, differences in percentage\n   points, and no more digits than the data hold.\n5. A readability score taken as a trip-wire, and a cut.\n6. One home for the numbers, chosen by what the reader has to do with them. The paper keeps one of the two, never both.\n7. A numbered reference to the source, formatted from the rules for that kind of source.\n8. A one-pass test with a reader who does not know the work, and a revision.\n9. A statement of what the finding does not mean.\n"
simplified_explanation: 'Each earlier section taught one tool. Real work uses them one after another, on one result.

  The result is the share of

  Indian adults with overweight or obesity in two national surveys.

  '
must_know[0].point: 'Work in this order: the message, then the paragraph, then the table or figure, then the

  reference, then the reader.

  '
must_know[1].point: 'Give every number one home. Decide by what

  the reader has to do with the numbers, then cut the other homes.

  '
must_know[2].point: 'A passing score never tells you a paragraph works. Read it for its

  claim before you look at the number.

  '
must_know[3].point: 'Check the axis of every bar chart a program draws for you. Work out a ÷ (a − s) with the

  smaller bar; if it is above {{n:tufte_lf_threshold}}, start the bars at zero.

  '
must_know[4].point: 'Use one number of decimal places for the same figures in the text and the table. Two copies of one number with different digits look like two different numbers.

  '
must_know[5].point: 'When the source gives no counts, say so in a footnote. Never make one by multiplying a

  percentage by the survey''s total sample.

  '
must_know[6].point: 'Format each kind of source from its own chapter of Citing Medicine. Leave a marked gap for any element

  you have not found.

  '
must_know[7].point: 'A reader''s restatement that adds something, such as "obesity" for "overweight or obesity", or a

  comparison you did not make, is what readers will repeat. Find the words in your paragraph that

  invited it and change them, then test again with a new reader.

  '
must_know[8].point: 'This finding covers adults aged 15 to 49, counts overweight and obese together, and shows a

  rise between two surveys, not its cause. It describes 2019-21, not now.

  '
