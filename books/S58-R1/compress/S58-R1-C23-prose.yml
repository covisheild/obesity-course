definition.text: "In this book, a finding's journey is the order of work that takes one result from its source\nto a results paragraph a reader can restate after one reading. Each step uses what the step\nbefore produced.\n\n1. The question, and the data read from the source with every limit the source states.\n2. The one message: the claim in one or two sentences, false if the data had come out\n   otherwise.\n3. The results paragraph, rewritten from an account of what was done into the claim and its\n   evidence.\n4. The numbers: units, counts where the source gives them, differences in percentage\n   points, and no more digits than the data hold.\n5. A readability score taken as a trip-wire, and a cut.\n6. One home for the numbers, chosen by what the reader has to do with them. A table is made\n   to stand alone. A figure is made by the procedure of the last section, and its axis is\n   checked with the Lie Factor. The paper keeps one of the two, never both.\n7. A numbered reference to the source, formatted from the rules for that kind of source.\n8. A one-pass test with a reader who does not know the work, and a revision.\n9. A statement of what the finding does not mean.\n"
simplified_explanation: 'Each earlier section taught one tool. Real work uses them one after another, on one result.

  This section takes one real result and carries it all the way. The result is the share of

  Indian adults with overweight or obesity in two national surveys.


  You start with a question and the two rows of a table. You write the one sentence the result

  says. You turn a diary-like paragraph into an argument, fix its numbers, score it and cut it.

  You build a table and a figure, and keep only one. You cite the source, on the pattern NLM

  gives for a report read on the Internet.

  You give it to a reader and fix what they misread. Last, you write down what the result does

  not mean.

  '
must_know[0].point: 'Work in this order: the message, then the paragraph, then the table or figure, then the

  reference, then the reader. Each step is checked against the one before. A figure drawn before

  the message chooses the claim for you, and a paragraph polished before the outline may be cut.

  '
must_know[1].point: 'Give every number one home. The ICMJE Recommendations ask you not to duplicate data in graphs

  and tables, and to summarise in the text only the most important observations. Decide by what

  the reader has to do with the numbers, then cut the other homes.

  '
must_know[2].point: 'The diary-style draft scored 61.6, above Flesch''s Plain English minimum of 60, and was the

  worst of three drafts. A passing score never tells you a paragraph works. Read it for its

  claim before you look at the number.

  '
must_know[3].point: 'Check the axis of every bar chart a program draws for you. Starting at 18, the program''s

  chart of these rows drew the men''s rise {{n:nfhs_men_lf_axis18}} times its true size. Work out a ÷ (a − s) with the

  smaller bar; if it is above {{n:tufte_lf_threshold}}, start the bars at zero.

  '
must_know[4].point: 'Use one number of decimal places for the same figures in the text and the table. When Cole''s

  rules pull apart, as they do here between four totals and eight values, choose and keep to

  it. Two copies of one number with different digits look like two different numbers.

  '
must_know[5].point: 'When the source gives no counts, say so in a footnote. Never make one by multiplying a

  percentage by the survey''s total sample. NFHS-5''s {{n:nfhs5_women_interviewed}} women are those it gathered

  information from, not the women weighed for this row.

  '
must_know[6].point: 'Format each kind of source from its own chapter of Citing Medicine. A fact sheet read online

  is not a journal article: it follows the chapter on titles on the Internet. Where you have only

  an example to work from, say the entry is modelled on it. Leave a marked gap for any element

  you have not found. A reference made up to look finished is worse than one marked

  unfinished.

  '
must_know[7].point: 'A reader''s restatement that adds something, such as "obesity" for "overweight or obesity", or a

  comparison you did not make, is what readers will repeat. Find the words in your paragraph that

  invited it and change them, then test again with a new reader.

  '
must_know[8].point: 'This finding covers adults aged 15 to 49, counts overweight and obese together, and shows a

  rise between two surveys, not its cause. It describes 2019-21, not now. Say each of these in

  the discussion, before a reader or a journalist widens it for you.

  '
