definition.text: 'A figure in a paper is drawn to make one claim: one statement about the data that a reader

  should be able to repeat after looking at it. The claim is written as a sentence before the

  kind of chart is chosen. One figure carries one claim. A second claim gets a second figure, or

  goes into the text.


  A result belongs in a sentence when it rests on a few numbers. It belongs in a table when the

  reader needs exact values, or will look up one row among many. It belongs in a figure when the

  claim is a pattern among many values, such as a trend, a gap or a ranking, that words would

  take too long to carry. The same numbers are not shown in both a table and a figure.


  The caption is the text printed with a figure; journals call it the figure legend. Its first

  sentence states the finding, not the topic. Titles and explanations go in the caption, not on

  the drawing.


  A figure is made for one reader and one medium. A figure on a printed page can be studied for

  as long as the reader likes. A figure on a slide is seen for a few seconds, from across a room,

  while someone talks. The two are made separately.

  '
simplified_explanation: 'Before you draw anything, write down the one sentence you want a reader to take away from the

  figure. That sentence is the figure''s claim. If you cannot write it, you do not have a figure

  yet. If you write two, you have two figures, or one figure and a sentence in the text.


  Then ask whether the claim needs a picture at all. Four numbers read well in a sentence. Forty do

  not. A reader who wants to find one district''s value wants a table. A reader who has to see

  that one group sits above another, all the way along, wants a figure.


  Last, put the sentence where the reader meets it first: the opening line of the caption.

  '
must_know[0].point: 'Write the figure''s claim as one sentence before you open any program that draws charts. If

  you cannot write it, you are not ready to draw. If you write two, make two figures, or put one

  claim in the text.

  '
must_know[1].point: '"A result looks more serious as a figure" is the error. A few numbers belong in a sentence,

  where the reader takes them in without stopping. The ICMJE Recommendations ask for only the

  tables and figures the paper''s argument needs.

  '
must_know[2].point: 'Never show the same numbers in a table and in a figure. Editors will ask you to cut one, and

  the ICMJE Recommendations say so. Decide by what the reader has to do: look a value up, use a

  table; see a pattern, use a figure.

  '
must_know[3].point: 'Make the first sentence of every caption the finding, not the topic. "Overweight and obesity,

  NFHS-4 and NFHS-5" names a topic. "A larger share of urban than of rural adults had

  overweight or obesity" is a finding. Put titles in the caption, not on the drawing.

  '
must_know[4].point: 'Do not lift a figure from your paper onto a slide. Make the slide version again, with fewer

  elements, thicker lines and bigger text, because it will be seen from a distance for a few

  seconds.

  '
must_know[5].point: 'The one-claim rule lets you cut data that are off to the side of the claim. It never lets you

  cut data that would weaken it. Before you drop a group or a year, ask whether a reader who saw

  it would doubt the claim. If so, it stays, or the claim changes.

  '
must_know[6].point: 'Wilke recommends three to six figures for a scientific paper, with the rest moved to an

  appendix or supplement. That is one author''s advice. The journal''s instructions to authors set

  the actual limit; read them first.

  '
must_know[7].point: 'A clear figure persuades whether or not its claim is true. When a press release shows you a

  figure with one obvious message, the clarity tells you the maker knew what to show. It does

  not tell you the data or the analysis are sound.

  '
