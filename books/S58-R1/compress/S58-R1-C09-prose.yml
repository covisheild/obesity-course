definition.text: 'A number in a sentence is reported in full when the reader can check it. A measurement

  carries its unit. A percentage carries the two counts it was worked out from: the numerator,

  how many had the thing, and the denominator, how many were counted.


  A difference between two percentages is stated in percentage points. A relative change

  divides that difference by the starting percentage, and is stated in per cent.


  How finely a number is stated is shown by its significant figures. Cole calls them

  significant digits. A number shows false precision when it carries more digits than the data

  can support. Every digit is kept through the calculations, and the number is rounded once,

  when it is reported.


  Cole''s rules for how many digits to report, offered as recommendations, not requirements:


  ```table

  | statistic | how many digits to report |

  | mean | enough decimal places to give the standard deviation (SD) two significant figures, or the standard error (SE) one |

  | percentage | whole numbers, or one decimal place for values under 10% |

  | risk ratio or odds ratio | two significant figures if the first digit that is not zero is 4 or more, otherwise three: the rule of four |

  | P value | one significant figure, never 0.000 |

  ```


  The SAMPL guidelines (Statistical Analyses and Methods in the Published Literature) are by

  Lang and Altman. They ask for P values as equalities, to one or two decimal places. The

  smallest that need be reported is P < 0.001. They ask for a mean and its SD in the form

  mean (SD).


  When n people are counted, one person moves a percentage by 100 ÷ n percentage points.

  '
simplified_explanation: 'The last two sections worked on the sentence and its words. This one works on the numbers

  inside it. A reader cannot check a number that has lost its unit or its count. Nor can they

  trust one that carries more digits than the study could measure.


  So ask three questions of every number you write. In what unit? Out of how many? How finely do

  the data let you say it?

  '
must_know[0].point: 'More decimal places look more careful, and that is the error. Each digit claims a fineness of

  measurement, and a digit the data cannot support is a small false statement. Keep every digit while you

  calculate. Round once, when you write the sentence, to the digits Cole''s rules give.

  '
must_know[1].point: 'Put the count before the percentage: "15 of 40 (38 per cent)". The reader can check the arithmetic

  and see at once how far one person moves it. ICMJE and SAMPL both ask for the counts behind

  every percentage, so a reviewer will ask for them if you leave them out.

  '
must_know[2].point: 'A change between two percentages has two sizes. For women in NFHS it is

  {{n:nfhs5_women_ow_ob_change_pp}} percentage points, or about {{n:nfhs_women_ow_ob_rel_rise_pct}} per cent of the starting figure. Say

  the points first. If you give the per cent change as well, label it, so nobody reads it as

  points.

  '
must_know[3].point: 'When fewer than 100 people are counted, one person is worth more than a percentage point.

  In a small study the count is the result. Give it every time, and let no decimal place

  suggest a finer measurement than the people allow.

  '
must_know[4].point: 'Cole and SAMPL give different rules for P values. Above 0.01 they agree. Below it, two

  decimal places cannot show 0.0026, and one significant figure gives 0.003. Neither allows

  0.000. Use the rule your journal names, or say which you used, and keep to one rule

  through the paper.

  '
must_know[5].point: 'Rounding rules are for the page, not for the working. A figure rounded early and then used

  in a later sum carries its rounding into the answer. So never compute a new result from

  the rounded figures in a published table when the full ones are in your own data.

  '
must_know[6].point: 'These rules decide how many digits you print. They cannot tell you whether the number is

  right. A mean printed to the correct digits from a sample that was not random can still be

  far from the district''s mean. Check the sample first.

  '
must_know[7].point: 'The NFHS fact sheet prints percentages with no counts. Its rows for women leave out

  pregnant women and women who gave birth in the two months before. Quote the percentage with

  the survey, its years, the age range and the cut-off. Never make a count by multiplying the

  survey''s {{n:nfhs5_women_interviewed}} women by the percentage.

  '
