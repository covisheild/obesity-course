definition.text: 'A paper is written as an argument when its text states a claim and gives the evidence and the

  reasoning that support it, in the order the reasoning needs. In the terms of Book 0''s section

  on argument, the claim is the conclusion, the data are the premises, and the reasoning that

  carries one to the other is the inference.


  A report of activities records what the authors did, in the order they did it. Mensh and

  Kording call this structuring a paper chronologically. Their reason against it is that

  readers do not care about the path by which the authors reached a result. They care about the

  claim and the logic that supports it.


  The two forms can hold the same facts. They differ in what each sentence is for. In an

  argument every sentence states a claim or supports one, and the steps of the work appear only

  where a reader needs them to judge or repeat it, which is in the methods.

  '
simplified_explanation: 'When you write up a study, the easy thing is to tell it the way it happened. First we did this,

  then we did that, and then we found this. That is a diary.


  Your reader does not want the diary. They want two things: what you found, and why they should

  believe it. So each part of the paper says what it found, and then gives the numbers and the

  reasons that back it up.


  The steps you took still matter, because a reader has to be able to check them. They go in the

  methods, once, and not scattered through the results.

  '
must_know[0].point: '"The results should follow the order in which the work was done" is the error. They follow the

  order the argument needs. The steps of the work go once, in the methods, and every results

  paragraph opens on what it found.

  '
must_know[1].point: 'Before you write a results paragraph, write its claim as one sentence. Keep only the sentences

  that support that claim, and put the claim first. ICMJE''s Recommendations ask for the main or

  most important findings first.

  '
must_know[2].point: 'If a paragraph ends on a step, such as "we then compared the two groups", the reader has to do

  your conclusion for you. Finish the step: print the result of the comparison and say what it

  shows.

  '
must_know[3].point: 'Write the methods so a reader could use your result. In one study that Chalmers and Glasziou

  cite, only around 60 per cent of trial reports described the treatment adequately. The

  information existed for 90 per cent. The difference was lost in the writing.

  '
must_know[4].point: 'Cut any table or figure that supports no claim. ICMJE''s Recommendations restrict tables and

  figures to those needed to explain the argument of the paper and to assess its supporting data.

  '
must_know[5].point: 'When a trainee''s draft reads "first we..., then we..., next we...", do not correct the grammar.

  Ask what they found, have them write that as the first sentence, and move the steps to the

  methods.

  '
must_know[6].point: 'Writing your paper as an argument makes your claim and its support easy to see. It cannot make

  a weak claim strong. If the data do not carry the claim, a clear argument shows that sooner,

  to you and to the reviewer. Treat that as the point of the exercise, and fix the claim, not the

  prose.

  '
