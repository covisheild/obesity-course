definition.text: 'A table stands alone when a reader can understand it without going back to the text. Its title is short but self-explanatory, and sits above the table: what was measured, in whom, where and when.


  Each column has a short heading with the unit. Explanations, exclusions and nonstandard abbreviations go in footnotes below the table, marked with letters or symbols, not in the headings.


  Each heading is aligned like the column under it.

  '
simplified_explanation: 'A table is for the reader who wants exact numbers, or wants to find one row. It has to make sense on its own, because a reader may look at the tables before reading the text.


  Keep it plain. No grid of lines, no lines between rows. Numbers line up on the right and keep the same number of decimal places.

  '
must_know[0].point: '"Put the numbers in a table and in a figure, to be safe" is the error. Choose one home for each result. The text then states the most important observation and cites it.

  '
must_know[1].point: 'Write the title above the table, short and self-explanatory: what was measured, in whom, where and when.

  '
must_know[2].point: 'Keep headings short, with the unit in brackets.

  '
must_know[3].point: 'Give every percentage its count, and name every measure of variation. A column of "mean ± value" is unfinished until its heading or a footnote names the value.

  '
must_know[4].point: 'When your source gives no counts, as the NFHS fact sheet does not, say so in a footnote.

  '
must_know[5].point: 'Delete the word processor''s default grid. No vertical lines, no lines between rows; a line under the headings and one above and below the table. Align numbers right with the same decimal places, and text left.

  '
must_know[6].point: '"Many rows, so a table" is a half-truth. A table is for exact values and for a reader who looks up rows. For a pattern among many values, ICMJE offers a graph instead.

  '
must_know[7].point: 'Keep the same decimal places down a column of like values, such as the per cents in one table: that is Wilke''s rule. Cole adds a warning. A column of ratios or P values may need more digits in some rows than in others, by the rules of `S58-R1-C09`. Give each value the digits it needs, and line the column up on the decimal point.

  '
must_know[8].point: 'Acknowledge every table''s outside data in a source line, every time. Before you use unpublished data, such as a colleague''s register or another department''s survey, get the owner''s permission.

  '
