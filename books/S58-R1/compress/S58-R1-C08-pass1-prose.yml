definition.text: 'Four practices govern the choice of words in a scientific paper.


  The everyday word. Of two words that carry the same meaning, the familiar, short and concrete

  one is used.


  One term for one thing. Once a concept has a name, the same name is used for it throughout.


  Abbreviations. The International

  Committee of Medical Journal Editors (ICMJE) asks for standard abbreviations only, and none in

  the title. At first mention it asks for the full term followed by the abbreviation in

  brackets, except for a standard unit of measurement.


  Statistical words. "Random", "normal", "significant", "correlation" and "sample" have exact

  meanings in statistics. ICMJE asks authors not to use them in their everyday senses.


  Barnett and Doubleday (2020) counted

  acronyms, which they defined as words in which half or more of the characters are capital

  letters, in 24,873,372 titles and 18,249,091 abstracts in PubMed published from 1950 to 2019.


  The study counted acronyms in titles and abstracts. It did not test whether readers understood

  less.

  '
simplified_explanation: 'Use the word a reader would say out loud. "Many", not "a number of".


  Once you have named a thing, keep the name.


  Spell out a short form the first time you use it. Then ask whether it earns its place.

  '
must_know[0].point: '"Using a different word each time makes writing less repetitive, and so better" is the error.

  A reader who meets a new word assumes a new thing.

  '
must_know[1].point: 'Do not write "obesity" for the NFHS-5 row that reports "overweight or obese". The fact sheet''s

  adult rows give the two together, at a body mass index of {{n:nfhs5_ow_ob_bmi_cutoff}} kg/m^2 or more, and none gives

  obesity alone.

  '
must_know[2].point: 'In PubMed abstracts, acronyms rose from 0.4 per 100 words in 1956 to 4.1 in 2019, about ten

  times as dense (Barnett and Doubleday, 2020).

  '
must_know[3].point: 'Put three questions to every abbreviation in your draft. Is it standard for the reader of this

  paper? Does it save the reader anything but ink? Will it appear often? Keep no more than three,

  spell each out at first mention, and use none in the title.

  '
must_know[4].point: '"Significant", "random", "normal" and "correlation" make a statistical claim when a reviewer

  reads them. If you ran no test, used no chance process, or computed no correlation, use other

  words, or state the number itself.

  '
must_know[5].point: 'The acronym count measured use, not understanding, and only in English-language titles and

  abstracts. When it matters, as in

  a report that ASHAs or patients will read, give the text to one such reader and watch where they

  stop.

  '
must_know[6].point: 'An abbreviation every Indian community medicine reader knows, such as ASHA, may be unknown to a

  journal''s reviewer abroad.

  '
