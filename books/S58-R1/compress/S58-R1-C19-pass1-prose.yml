definition.text: 'In a data figure, colour does one of three jobs. It separates groups that have no order, using a qualitative scale: a small set of colours that look clearly different from each other and equally strong. It stands for a value, using a sequential scale, which runs from light to dark. Or it picks out one element against others drawn in grey. Colour that does none of these jobs is ornament.


  Colour-vision deficiency is a reduced ability to tell certain colours apart, most often red from green.

  '
simplified_explanation: 'Colour in a chart should have a job. It can tell groups apart, stand for a number, or point at one thing. If it does none of these, take it out and draw in black or grey.


  Some of your readers cannot tell red from green. Some copies of what you write will be printed or photocopied in black and white.


  So test every colour figure twice before it leaves you. Look at it in grey. Then run it through a program that shows it as a reader with colour-vision deficiency sees it.

  '
must_know[0].point: '"More colours make a figure clearer" is the error. Colour with no job gives the reader a puzzle to solve.

  '
must_know[1].point: 'Each job takes its own kind of scale. A rainbow fits none of them.

  '
must_know[2].point: 'Red against green is the tempting pair: good and bad, urban and rural, before and after. At similar lightness it fails twice: in a grey copy and for readers with red-green colour-vision deficiency, the commonest kind. Change one of the pair, or make them differ in lightness.

  '
must_know[3].point: 'The general estimate cited worldwide is 8 per cent of men and 0.5 per cent of women with colour-vision deficiency.

  '
must_know[4].point: 'The one Indian measurement here found 2.76 per cent of 74,986 school boys in Kanchipuram district, Tamil Nadu. It is boys in one district, with block figures from 1.12 to 3.40 per cent.

  '
must_know[5].point: 'Write "urban" on the urban bar so that nothing depends on colour at all.

  '
must_know[6].point: 'A palette sold as colour-blind safe stops being safe on thin lines and small points. So test the finished figure at its printed size, not the palette.

  '
must_know[7].point: 'When you review a colleague''s map or heat map, run Crameri and colleagues'' checks aloud. Is there a colour bar? Does the scale get steadily lighter or darker? Are red and green at similar lightness? Is it a rainbow?

  '
