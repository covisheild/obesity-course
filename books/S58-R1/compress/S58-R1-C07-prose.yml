definition.text: "A sentence is clear when a reader takes from it, on one reading, the point the writer meant,\nand gives each part of it the weight the writer meant. Readers look for each kind of\ninformation in a fixed place in the sentence. Five principles put it there. They come from\nGopen and Swan's reader-expectation approach (1990) and the US Federal Plain Language\nGuidelines (2011), and both sources call them principles, not rules.\n\n1. One idea per sentence. Each sentence makes a single point. A sentence is too long when it\n   holds more pieces of information that deserve emphasis than it has places for emphasis.\n   Its word count does not decide it.\n2. The subject close to its verb. Readers expect the verb straight after the subject. They\n   read anything long between the two as an interruption, and so as less important.\n3. The action in the verb. A hidden verb is an action turned into a noun, such as\n   \"increase\", \"assessment\" or \"measurement\", carried by an empty verb such as \"was\n   observed\", \"was done\" or \"make\". It is turned back into a verb.\n4. Old information first, new information last. The start of a sentence, the topic position,\n   holds the information that links back to what the reader already has, and names whose\n   story the sentence tells. The end, the stress position, holds the new information the\n   reader should weigh most.\n5. The doer as the subject where the doer matters, in the active voice, with \"we\" for the\n   authors' own actions. The passive is kept where the doer does not matter, or where the\n   sentence carries on the story of the thing acted on.\n\nA sentence that breaks the first principle is split into two or more sentences. It is not\ncompressed: its ideas are not fused into a string of nouns.\n"
simplified_explanation: 'A reader reads your sentence once and decides what it said. Five habits make that decision go

  your way.


  Say one thing in each sentence.


  Put the verb soon after the subject. The reader is waiting for it, and everything in between

  feels like a delay.


  Put the action in the verb. Write "the proportion rose", not "an increase was observed".


  Start with what the reader already knows, and end with what is new. The end is where a reader

  puts the most weight, so put there the thing you want remembered.


  Name who did it when that matters. If it was you, write "we".


  When a sentence breaks these habits, make it two sentences. Do not squeeze it shorter by piling

  nouns together.

  '
must_know[0].point: 'Find the subject and the verb, and count the words between them. Does the reader have to wait

  through a list, a bracket or a clause before the verb arrives? Then move that material to the

  end of the sentence, or into a sentence of its own.

  '
must_know[1].point: '"Long sentences are the problem, so cut words" is the error. Gopen and Swan report 10-word

  sentences that are hard to get through and 100-word sentences that are easy. The test is how

  many points in the sentence deserve weight. More than one, and the sentence needs splitting,

  however short it is.

  '
must_know[2].point: 'Search your draft for the empty verbs that carry hidden actions: "was done", "was carried

  out", "was observed", "was performed". Then look between "the" and "of" for a noun ending in

  -tion or -ment. Each one is an action hiding from its verb. Turn it back into a verb.

  '
must_know[3].point: 'End a results sentence on the number or finding you want remembered. A reader puts the most

  weight on the end of a sentence. A sentence that ends on "was observed", or on its source,

  spends that weight on nothing.

  '
must_know[4].point: 'In a methods section, name the doer of every step a reviewer would judge: who measured, who

  interviewed, who entered the data. Write "we" for your own steps if the journal allows it. Keep

  the passive only where the result is the same whoever did it.

  '
must_know[5].point: 'Split a sentence with several points into several sentences. Do not compress it into a string

  of nouns. A chain of three or more nouns makes the reader guess how they relate.

  '
must_know[6].point: 'These are principles, and they stop working when followed blindly. Gopen and Swan warn that

  slavish use of them does no better than slavishly preferring the active voice. If a rewrite

  makes a sentence worse for its paragraph, as "Bees disperse pollen" would in a paragraph about

  pollen, keep the original. If no rewrite will come, the trouble may be the thought, not the

  sentence: go back to the one claim you are making.

  '
