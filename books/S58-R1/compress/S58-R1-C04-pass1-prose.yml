definition.text: 'In a paper that reports original research, each of the four main sections does one job in the paper''s argument.


  The introduction moves from what is known to what is not yet known, the gap.


  The discussion opens by stating the main findings briefly, as the answer to the introduction''s question.

  '
simplified_explanation: 'The introduction says what is known, then what is not known, and ends on your question. The methods say what you did and why, so that a reader can judge it and could repeat it. The results answer the question in steps, one claim at a time, each with its numbers. The discussion gives the answer in its first lines, then what might explain it, what could make it wrong, and what it means.

  '
must_know[0].point: 'Write the outline before the prose: one sentence for each planned paragraph, each sentence the claim that paragraph makes. Then read the sentences alone. If they do not take a reader from your question to your answer, fix them there.

  '
must_know[1].point: 'An introduction that reviews everything known about obesity buries the gap. A reader should be able to underline the sentence that names the gap, and the one that states your question.

  '
must_know[2].point: 'For a medical journal that follows ICMJE, end on the question or research objective. Then read the journal''s instructions, which decide.

  '
must_know[3].point: 'The methods hold what you knew when you wrote the protocol. How many people declined, who was excluded once the data came in, and anything you changed along the way are results.

  '
must_know[4].point: 'Give the results subheadings that state findings, not topics: "Overweight or obesity was commoner in urban than in rural women", not "Urban-rural comparison". Open each results paragraph with the question it answers and end it with the answer.

  '
must_know[5].point: '"The discussion begins with background and other people''s studies" is the error. Begin with your main finding, briefly, as the answer to your question.

  '
must_know[6].point: 'Claim no more than your data carry. A new idea the data suggest is written as a hypothesis, and labelled as one.

  '
must_know[7].point: '"Stating limitations weakens the paper" is the error. A limitation you leave out is still there. Name each limit, say which way it could push the answer, and say what would settle it.

  '
must_know[8].point: 'The structure shows the logic; it cannot add evidence. If an outline sentence has no data behind it, either cut the claim or get the data.

  '
