definition.text: 'Cutting is deleting words, sentences or paragraphs that do no work for the reader, so that

  what remains says the same thing in fewer words. A unit does no work when deleting it loses

  nothing the reader needs.


  The test for a word is whether the sentence means the same without it.


  Cutting is not compressing. Compressing keeps everything and packs it into fewer, longer

  sentences.

  '
simplified_explanation: 'First ask of each paragraph whether it serves your one message. Then ask it of each sentence.


  Big cuts first, because polishing a sentence you later delete is work thrown away. Most of the

  words you lose will go in whole sentences and paragraphs, not in single words.

  '
must_know[0].point: 'Cut in order: paragraphs first, then sentences, then words.

  '
must_know[1].point: 'Test each paragraph against your one message with a reverse outline. Where a margin note

  serves no part of the message, delete that paragraph.

  '
must_know[2].point: '"Fewer words is better, so join short sentences into one" is the error. Cut whole units

  instead, and keep one idea a sentence.

  '
must_know[3].point: 'Cutting has no test for truth. Before you delete any word, ask whether the claim gets

  wider without it. If it does, the word stays.

  '
must_know[4].point: 'Before you cut, open a second file and paste every deleted passage into it.

  '
must_know[5].point: 'Delete the opener that delays the subject: "It was observed that", "It is important to note

  that", "In the present study".

  '
must_know[6].point: 'When you correct a trainee''s thesis chapter, mark the paragraphs and sentences to delete

  before you touch a single word.

  '
