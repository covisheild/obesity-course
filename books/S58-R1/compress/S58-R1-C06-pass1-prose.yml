definition.text: 'A sentence is built from clauses. A clause is a group of words with a subject and a verb.


  The verb expresses an action, an occurrence or a state of being.


  The subject names what the clause is about: the thing the verb is said of. Its main word is the noun the verb is said of, and the rest of the phrase describes that noun.


  The object is the noun that receives the action of the verb.


  The doer is whoever or whatever performs the action, whether or not it is the subject.


  Voice says which of them is the subject. The doer moves into a phrase beginning "by", or is left out.

  '
simplified_explanation: 'The verb is the word for what happens: measured, rose, is.


  Ask "who or what" in front of the verb: who measured? The answer is the subject.


  In "We measured the weight", the doer is "we", and "we" is also the subject. That is the active voice.


  Turn it round: "The weight was measured". Now the thing measured is the subject, and the doer has gone. That is the passive voice. Its sign is a form of "to be" with a verb ending, usually, in -ed.


  A main clause can stand as a sentence on its own. A clause that starts with "because", "when" or "although" cannot.

  '
must_know[0].point: '"The passive voice is the past tense" is the error. Voice says whether the subject did the action or received it. Tense says when. When an editor tells you to remove the passive, check voice, not tense.

  '
must_know[1].point: 'Verb first. Then ask "who or what" in front of it to find the subject. Then look for "by", or ask who did it, to find the doer.

  '
must_know[2].point: 'A passive sentence with no "by" hides who did the work. Before you submit, find each passive verb and ask whether the reader needs the doer. If yes, name it.

  '
must_know[3].point: 'The two signs of the passive, a form of "to be" and an -ed word, are a quick test that can mislead. When the test is unsure, ask whether the subject did the action or received it.

  '
must_know[4].point: 'Put the point of a sentence in its main clause. If your finding sits in the subordinate clause, the reader will weigh it less than you meant.

  '
