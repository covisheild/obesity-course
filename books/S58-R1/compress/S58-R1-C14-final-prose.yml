definition.text: 'A figure in a paper is drawn to make one claim: one statement about the data that a reader

  should be able to repeat after looking at it. The claim is written as a sentence before the

  kind of chart is chosen. One figure carries one claim.


  A result belongs in a sentence when it rests on a few numbers. It belongs in a table when the

  reader needs exact values, or will look up one row among many. It belongs in a figure when the

  claim is a pattern among many values, such as a trend, a gap or a ranking, that words would

  take too long to carry. The same numbers are not shown in both a table and a figure.


  The caption is the text printed with a figure; journals call it the figure legend. Its first

  sentence states the finding, not the topic.


  A figure on a printed page can be studied for as long as the reader likes. A figure on a slide

  is seen for a few seconds, from across a room, while someone talks. The two are made

  separately.

  '
simplified_explanation: 'Before you draw anything, write down the one sentence you want a reader to take away from the

  figure. If you cannot write it, you do not have a figure yet.


  Then ask whether the claim needs a picture at all. Four numbers read well in a sentence. Forty do

  not.


  Last, put the sentence where the reader meets it first: the opening line of the caption.

  '
must_know[0].point: 'Write the figure''s claim as one sentence before you open any program that draws charts.

  '
must_know[1].point: '"A result looks more serious as a figure" is the error. A few numbers belong in a sentence,

  where the reader takes them in without stopping.

  '
must_know[2].point: 'Never show the same numbers in a table and in a figure.

  '
must_know[3].point: 'Make the first sentence of every caption the finding, not the topic. "Overweight and obesity,

  NFHS-4 and NFHS-5" names a topic. "A larger share of urban than of rural adults had

  overweight or obesity" is a finding.

  '
must_know[4].point: 'Do not lift a figure from your paper onto a slide.

  '
must_know[5].point: 'The one-claim rule lets you cut data that are off to the side of the claim. It never lets you

  cut data that would weaken it.

  '
must_know[6].point: 'Wilke recommends three to six figures for a scientific paper, with the rest moved to an

  appendix or supplement. The journal''s instructions to authors set the actual limit; read them

  first.

  '
must_know[7].point: 'A clear figure persuades whether or not its claim is true.

  '
