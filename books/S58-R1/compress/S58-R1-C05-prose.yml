definition.text: 'This section follows two documents. The first is the Recommendations of the International

  Committee of Medical Journal Editors (ICMJE), updated January 2026, section IV.A.3.g,

  References. The second is the style guide those Recommendations point to for format: Citing

  Medicine, 2nd edition, from the US National Library of Medicine (NLM).


  What to cite. Cite original research directly where you can, and the published article rather

  than its abstract. A review article, a paper that summarises other studies, does not always

  report the original work accurately. Do not cite articles in predatory or pseudo-journals.


  Mark a preprint as a preprint. A paper accepted but not yet published is cited as "in press" or

  "forthcoming"; NLM prefers "forthcoming". A manuscript submitted but not accepted is cited in

  the text as "unpublished observations", with the source''s written permission. A personal

  communication is cited only when it gives essential information that no public source has. The

  person''s name and the date go in parentheses in the text, with the person''s written permission

  and confirmation of accuracy.


  AI-generated material is not acceptable as the primary source. The authors must check each

  reference against a bibliographic database such as PubMed or against the original. They must

  be able to attest that it supports the statement it is attached to. They must check that it

  does not cite a retracted article (one the journal has withdrawn after publication), except to

  discuss the retraction.


  How to number. References are numbered consecutively in the order in which they are first

  mentioned in the text. They are identified in the text, tables and figure legends by Arabic

  numerals (1, 2, 3) in parentheses. A reference cited only in a table or a figure legend takes

  its number from the point where the text first mentions that table or figure.


  How to format a journal article. Citing Medicine lists the elements in the order they appear.

  For an ordinary journal article these are the authors, the article title, the abbreviated

  journal title, the date of publication, the volume, the issue in parentheses, and the pages.


  Authors are entered surname first, with at most two initials. Citing Medicine gives all

  authors, and shows an optional limit of three or six followed by "et al." or "and others"; the

  journal decides.

  Only the first word of an article title, its proper nouns and adjectives, acronyms and

  initialisms take capitals. Journal titles are abbreviated as the NLM Catalog lists them. A page

  range drops the repeated digits: 123-125 becomes 123-5. Cite the version you saw.

  '
simplified_explanation: 'Every sentence in your paper that rests on someone else''s work carries a number, such as (3).

  The number points to one entry in the list at the end of the paper, the reference list. Number

  your sources in the order the reader first meets them. A source you use again keeps the number it

  got first. The numbers are Arabic numerals, the ordinary 1, 2, 3.


  Cite what you actually read. Suppose you saw a figure in a review. Open the paper the review

  took it from, and cite that paper if it says what you claim. If you read a preprint, a paper posted

  publicly before a journal has checked and accepted it, cite the preprint and say it is one.


  Write every entry in the list in the same order, with the same punctuation, so a reader can find

  the paper in seconds. A reference manager, a program that stores your references and types out

  the list, can do the typing. It cannot tell whether an entry is right, or whether the paper says

  what you claim. You check that.


  One word needs a gloss. ICMJE asks you not to cite predatory or pseudo-journals, and the section

  does not define them. In this book, read the phrase as journals that present themselves as

  checking what they publish and do not. How to recognise one is taught at the next rung.

  '
must_know[0].point: 'Open the original before you cite it. If you met a finding in a review, find the paper the

  review cites and read the passage. Cite that paper only if it says what you claim. If you

  have read only the abstract, find the full article; ICMJE asks for the article, not its

  abstract.

  '
must_know[1].point: '"My reference manager makes my references correct" is the error. It formats what it was given,

  and what it was given can be wrong. Check every entry against PubMed or the paper itself, and

  check that the paper supports the sentence it is attached to. ICMJE puts both on the authors.

  '
must_know[2].point: 'Before you submit, check that no reference is a retracted paper. Search PubMed for

  "Retracted publication [pt]", or look each paper up in PubMed. Cite a retracted paper only to

  discuss the retraction.

  '
must_know[3].point: 'Cite something not formally published by what it is. A preprint carries "[Preprint]". A paper

  accepted but not yet out is "forthcoming", NLM''s preferred word, or "in press". A submitted

  manuscript is "unpublished observations" in the text, with written permission. Cite a personal

  communication only when no public source has the information. Put the person''s name and the

  date in the text, and get their written permission.

  '
must_know[4].point: 'Never cite an AI tool as the source of a fact. ICMJE does not accept AI-generated material as

  the primary source. If a tool gives you a reference, find the paper, open it, and read the

  passage before you cite it. If you cannot find it, do not cite it.

  '
must_know[5].point: 'Do not cite a paper from a predatory or pseudo-journal; ICMJE asks you to avoid them. Telling

  one apart is taught at the next rung. Until then, if you cannot say whether a journal really

  checks what it publishes, ask your guide before you cite it.

  '
must_know[6].point: 'How many authors to list is the journal''s choice. Citing Medicine gives all of them. NLM''s

  sample page lists six and then "et al.", and notes that NLM itself now lists all. Read the

  journal''s instructions, set your reference manager to match, and check the first entry with

  more than six authors by eye.

  '
must_know[7].point: 'The committee behind these Recommendations was once known as the Vancouver Group. If a

  journal asks for "Vancouver" references, read its instructions with this section open. Where

  the journal states its own variant, the journal wins. Where it is silent, ICMJE''s numbering

  and NLM''s format are the default.

  '
must_know[8].point: 'A reference in perfect NLM format can still point to a paper that does not say what your

  sentence says. Format tells a reader where to look; only the passage tells them whether you

  were right. When you check a student''s thesis, open three of its references at random and

  read the passages they point to.

  '
