definition.text: 'A paragraph is a group of sentences that makes one point. Its topic sentence states that

  point. The other sentences support it, with evidence, examples or reasoning. The last

  sentence may close it by saying what the point means. Mensh and Kording call this shape

  context, content, conclusion. At the scale of a paragraph, the first sentence sets the topic

  and the body carries the content. The last sentence gives the conclusion to remember.


  A paragraph zig-zags when it leaves a topic and comes back to it later. A draft zig-zags when

  one topic is spread over paragraphs that are not next to each other.


  In this book, a reverse outline is the outline of `S58-R1-C04` made after the draft instead

  of before it. Beside each paragraph you write one sentence stating its one point, and then

  you read those sentences alone. A paragraph whose point cannot be written as one sentence

  without "and" carries more than one point.

  '
simplified_explanation: '`S58-R1-C07` asked for one idea per sentence. A paragraph is the next size up: one point,

  stated and then supported. You can test a whole draft for this without judging a single

  sentence. Write the point of each paragraph in the margin, in one sentence. Then read the

  margin alone. If a margin note needs an "and", that paragraph is two.

  '
must_know[0].point: '"One idea per paragraph" read as "short paragraphs" is the error. A paragraph is as long as

  its point needs: the point, then every sentence of support it takes. Cut a paragraph only

  when part of it supports a different point.

  '
must_know[1].point: 'Before you send a draft to anyone, make its reverse outline. Write each paragraph''s point in

  the margin in one sentence, then read the margin alone. Split a paragraph whose note needs

  "and". Merge two neighbours whose notes say the same thing. Move or cut one whose note

  serves no claim.

  '
must_know[2].point: 'The commonest fault is not a long paragraph but a topic visited twice. Before you edit

  sentences, label each one with its topic and gather each topic into one place. A reader

  who meets a subject three times reads three times.

  '
must_know[3].point: 'The two shapes of a one-point paragraph, point first and answer last, are both sound. Choose

  one for a section and use it in every paragraph, so the reader knows where to look.

  In a results section for a hurried reader, put the point first.

  '
must_know[4].point: 'A reviewer checks a paper paragraph by paragraph. When each paragraph has one conclusion,

  the reviewer can find the one paragraph behind a doubtful claim. When conclusions are spread

  across paragraphs, the reviewer doubts them all.

  '
must_know[5].point: 'The reverse outline checks where each point is. It cannot check that the point is true, or

  that the sentences under it support it. Read each paragraph''s support against its point as

  Book 0 read premises against a conclusion (`B0-R0-C42`).

  '
must_know[6].point: 'When you correct a trainee''s thesis chapter, do not rewrite their paragraphs. Ask them to

  write the margin note for each one. Where they cannot write it as one sentence, they have

  found the paragraph to fix, and they will find the next one without you.

  '
