definition.text: 'A paper''s one message is its central claim, stated in one or two sentences: what the study

  found, and why that matters.


  The message is written before the draft, and it is a test. It passes only if it is a claim,

  which would be false had the data come out differently, and if it answers the reader''s "so

  what?".


  The title is the message in its shortest form. The abstract is the argument in small: the

  context and the gap, what was done, the main result, and what it means.

  '
simplified_explanation: 'Before you write the paper, write one or two sentences that say what you found and why it

  matters. That is your one message.


  Test it two ways. First, would the sentence be false if your data had come out differently? If

  not, it says nothing yet. Second, does it answer "so what?" for someone who reads only that

  sentence?


  The abstract is the message with its reasons: what was known, what was missing, what you did,

  what you found, and what it means. Check that the title, the abstract and the paper all say the

  same thing.

  '
must_know[0].point: 'Write your one message before you draft any section. If you cannot write it, you are not ready

  to draft.

  '
must_know[1].point: '"This study is about..." is a topic, not a message.

  '
must_know[2].point: 'Make the title the message in its shortest form, with no abbreviations, which ICMJE''s

  Recommendations ask authors to avoid there.

  '
must_know[3].point: 'Before anyone else reads your draft, list every number in the title and abstract and find each

  one in the results.

  '
must_know[4].point: 'Use the same message for every other form of the work: the talk, the poster, the answer to a

  journalist.

  '
must_know[5].point: 'A clear message is not a true one. Writing the message does not test whether the data carry

  it. Check that separately, and if they carry less, cut the message to fit them.

  '
