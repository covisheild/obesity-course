definition.text: 'A table in a paper sets values in rows and columns, as Book 0 described. A table stands alone

  when a reader can understand it without going back to the text. It is numbered in the order it

  is first cited, and the text cites it. Its title is short but self-explanatory, and sits above

  the table: what was measured, in whom, where and when.


  Each column has a short heading with

  the unit. Explanations, exclusions and nonstandard abbreviations go in footnotes below the

  table, marked with letters or symbols, not in the headings. A percentage has its count beside

  it, and any measure of variation is named: standard deviation, standard error or confidence

  interval. A source line says where data taken from elsewhere came from.


  A table is the right place for a result when the reader needs exact values, or will look up

  particular rows. A pattern among many values is better shown in a figure. The same numbers are

  not given in both a table and a figure, and the text does not repeat the table. It states the

  most important observation and cites the table.


  The layout follows a few rules. There are no vertical lines and no lines between data rows; a

  line under the column headings, and lines above and below the whole table, are enough. Text

  columns are aligned left. Number columns are aligned right and carry the same number of

  decimal places all the way down. Each heading is aligned like the column under it.


  Data taken from another published or unpublished source is acknowledged in full, and the

  owner''s permission is obtained before it is used.

  '
simplified_explanation: 'A table is for the reader who wants exact numbers, or wants to find one row. It has to make

  sense on its own, because a reader may look at the tables before reading the text.


  So the title above it says what was measured, in whom, where and when. Each column heading is

  short and gives the unit. Anything longer goes in a footnote under the table. Every percentage

  has its count beside it.


  Keep it plain. No grid of lines, no lines between rows. Numbers line up on the right and keep the

  same number of decimal places. And never print the same numbers in a table and in a figure too.

  '
must_know[0].point: '"Put the numbers in a table and in a figure, to be safe" is the error. ICMJE says do not

  duplicate data in graphs and tables, and do not repeat all of a table in the text. Choose one

  home for each result. The text then states the most important observation and cites it.

  '
must_know[1].point: 'Write the title above the table, short and self-explanatory: what was measured, in whom,

  where and when. Test it by covering the text. If a reader cannot say whom the rows describe,

  the title is not finished.

  '
must_know[2].point: 'Keep headings short, with the unit in brackets. Put exclusions, definitions, cut-offs and

  every nonstandard abbreviation in footnotes under the table, marked with letters or the

  symbols your journal asks for.

  '
must_know[3].point: 'Give every percentage its count, and name every measure of variation. A column of "mean ±

  value" is unfinished until its heading or a footnote names the value. It may be a standard

  deviation, a standard error or a confidence interval.

  '
must_know[4].point: 'When your source gives no counts, as the NFHS fact sheet does not, say so in a footnote. Never

  work a count back from a percentage and a total you guessed, and never leave the gap silent.

  '
must_know[5].point: 'Delete the word processor''s default grid. No vertical lines, no lines between rows; a line

  under the headings and one above and below the table. Align numbers right with the same

  decimal places, and text left. Wilke found most of his word processor''s ready-made table

  styles break these rules.

  '
must_know[6].point: '"Many rows, so a table" is a half-truth. A table is for exact values and for a reader who

  looks up rows. For a pattern among many values, ICMJE offers a graph instead. Decide by what

  the reader has to do.

  '
must_know[7].point: 'Keep the same decimal places down a column of like values, such as the per cents in one

  table: that is Wilke''s rule. Cole adds a warning. In his words, "tables ought not to be

  restricted to columns of numbers with fixed decimal places". A column of ratios or P values may

  need more digits in some rows than in others, by the rules of `S58-R1-C09`. Give each value

  the digits it needs, and line the column up on the decimal point.

  '
must_know[8].point: 'Acknowledge every table''s outside data in a source line, every time. Before you use

  unpublished data, such as a colleague''s register or another department''s survey, get the

  owner''s permission. ICMJE asks for both.

  '
