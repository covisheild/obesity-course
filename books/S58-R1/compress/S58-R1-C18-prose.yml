definition.text: "Tufte divides the ink on a figure into two kinds. Data-ink is the ink that changes when the\ndata change: the bars, the points, the line. Everything else is non-data ink: frames, grid\nlines, background fills, shadows. The data-ink ratio is the data-ink divided by all the ink\nused to print the figure.\n\n```working\ndata-ink ratio = data-ink ÷ total ink used to print the figure\n               = 1 − (share of the ink that can be erased without losing any data)\n```\n\nTufte's rule is to maximise this ratio \"within reason\": erase non-data ink, and erase\ndata-ink that repeats what other ink already shows. He gives no one-sentence definition of\nchartjunk. He introduces it as decoration that \"does not tell the viewer anything new\".\n\nIn this book, decoration is any element that tells the reader nothing about the data or about\nhow to read them. A 3-D effect on flat data, a shadow, a coloured background behind a single\nplot, a frame round the whole figure and a dark grid are decoration. Axis titles, tick labels\nand a light grid or reference line are context. So is a direct label: a group's name written\nbeside its data, in place of a legend, the key that says which colour is which. Context is\nnon-data ink, and it stays (Wilke).\n\nOne experiment measured the cost of decoration. Bateman and colleagues (2010) showed 20 people\ncharts by the graphic artist Nigel Holmes, built around cartoon pictures, and plain versions of\nthe same charts. While the charts were on screen, people described the decorated ones as\naccurately as the plain ones. Two to three weeks later, the 10 people tested then remembered\nthe decorated charts better. The paper reports t-tests, not the size of the difference in\nscore points. Viewing time was not limited, and the task was to describe the chart aloud.\n\nWhat would overturn the working rule here: studies of figures read for exact values, under time\npressure, or in a scientific paper, finding that decoration costs nothing in accuracy and adds\nno bias.\n"
simplified_explanation: 'Every mark on a figure either tells the reader something or gets in the way. The bars and points

  tell. So do the axis titles and the labels: without them the bars mean nothing. A 3-D tilt, a

  shadow, a coloured background or a thick grid tells nothing, and some of them bend the data.


  So ask one question of each mark: what does this tell the reader? If the answer is "nothing",

  delete it. Then stop before you delete the labels.


  There is one real argument for decoration. In one small study, cartoon charts were remembered

  better weeks later, and were described no worse. That is a reason to think about a poster, not

  a licence for a 3-D bar in a paper.

  '
must_know[0].point: '"The cleanest figure is the one with the least ink" is the error. Tufte''s rule is to maximise

  the data-ink ratio "within reason". Delete the axis title or the labels and the bars mean

  nothing. Delete decoration; keep context.

  '
must_know[1].point: 'Ask one question of every element of a figure: what does it tell the reader about the data,

  or about how to read them? If nothing, delete it. Do this before you change anything else.

  '
must_know[2].point: 'Never draw flat data in 3-D. The third dimension carries no data and it bends the bars: in

  Wilke''s example, 322 first-class passengers read as fewer than 300.

  '
must_know[3].point: 'Use direct labels: write each line''s or group''s name beside its data, and delete the legend.

  The reader then reads the figure without moving the eye back and forth.

  '
must_know[4].point: '"Useful junk?" found that cartoon charts were described no worse, and were remembered better

  two to three weeks later. That was 20 students, with no time limit. It does not show that

  decoration is harmless when a reader needs exact values, and the authors say so. A picture tied

  to the message may suit a poster. Keep it out of a paper''s figure.

  '
must_know[5].point: 'A picture on a chart carries an opinion. In Bateman''s study readers found the designer''s

  "value message" more often in the decorated charts. On a public chart, choose a picture only if

  you are willing to say its message out loud.

  '
must_know[6].point: 'Removing decoration cannot fix a dishonest axis. A plain bar chart that starts above zero is

  still wrong. Check the axis as well as the ink.

  '
must_know[7].point: 'When a trainee brings you a chart straight from a spreadsheet, do not redraw it for them. Have

  them delete one element at a time, and ask after each whether the reader lost anything.

  '
