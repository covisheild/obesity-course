id: S58-R1
number: 9
title: Scientific writing, visualisation and public communication · Rung 1
subtitle: Writing a paper as an argument, and drawing a figure that tells the truth
cover_line: One idea per paragraph, honest axes, and a reader who can state your argument after one pass
status: in progress       # frozen | in progress
version: "1.0"
last_updated: 2026-10-02
prerequisites: |
  Book 0, in particular decimals and rounding (A3), percentages (A4), ratios (A5), units (B1),
  graphs (C5), average and spread (D5), reading a table and a figure (F1, F2) and the shape of an
  argument (F4). The mathematics is arithmetic with a calculator: percentages, ratios, and putting
  counts into a formula stated in words. No algebra beyond that, and no statistics beyond a mean
  and a standard deviation. You need a piece of your own writing to work on, such as a thesis
  chapter or a manuscript section, and any program that draws a chart; a spreadsheet will do if
  you are prepared to change nearly all of its defaults.
page_budget: 216        # 200 at Task 1; +8 each for C05 referencing and C21 table (2 Oct 2026)
why: |
  Most researchers learn to write by copying the papers they read, and those papers are an uneven
  model. This book treats a paper as an argument made to a reader with little time, and a figure as
  a claim that has to be true to its numbers. It teaches the sentence and the paragraph as the
  units of clarity, the number written with its unit and its count, and the plot with honest axes
  and nothing on it that does no work. The test it sets is simple to state: a colleague reads your
  draft once and can tell you your argument.
how_to_read: |
  Read Book 0 first, or at least the sections this book names as it goes. Then read this one in
  order: the paper first, then the sentence and the paragraph, then the figure. The book asks you
  to build one thing: one section of a manuscript or thesis, rewritten so that each paragraph
  carries one idea, and shown to a reader. Choose the section before you start, work on it as you
  read, and draw one figure for it when you reach the figures.
back_blurb: |
  A short book on the first craft of scientific communication. It covers what a research paper is
  and why it is an argument rather than a diary of what was done, how to write the one sentence
  your paper exists to say, the sentence and the paragraph as units of clarity, how to report a
  number, how to cite a source, how to measure and cut a draft, how to make a table that stands
  alone, and how to choose, draw and caption a figure whose axes tell the truth. It ends with one real Indian survey result taken from a table to a paragraph and
  a figure a colleague can restate.
