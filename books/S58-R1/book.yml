id: S58-R1
number: 9
title: Scientific writing, visualisation and public communication · Rung 1
subtitle: Writing a paper as an argument, and drawing a figure that tells the truth
cover_line: One idea per paragraph, honest axes, and a reader who can state your argument after one pass
status: in progress       # frozen | in progress
version: "1.0"
last_updated: 2026-10-02
why: |
  Most researchers learn to write by imitating the papers they read, and most papers are not
  written well. This book treats a paper as an argument made to a reader with limited attention,
  and a figure as a claim that must be true to its data. It teaches the sentence and the paragraph
  as units of clarity, and the plot with honest axes and no decoration, so that a colleague can
  state your argument after reading your draft once. (Provisional text; the inventory refines it.)
how_to_read: |
  Read Book 0 first, or at least the sections this book names as it goes. Then read this one in
  order. The book asks you to build one thing: one manuscript section rewritten so that each
  paragraph carries one idea, and shown to a reader. Choose the section before you start.
back_blurb: |
  A short book on the first craft of scientific communication. It covers the paper as an argument,
  one idea per paragraph, the sentence as the unit of clarity, and the plot with honest axes and a
  single message. (Provisional text; the inventory refines it.)
