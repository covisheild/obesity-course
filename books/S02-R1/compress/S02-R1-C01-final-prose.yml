definition.text: 'A symbol in an equation stands for a quantity, and the paper fixes which quantity in words:

  in a clause beginning "where" after the equation, or in the sentences around it.


  A subscript is a small letter or number set low after a symbol, and it is part of the

  symbol''s name. A subscript never multiplies.


  Every term added to or subtracted from another, and each side of an equals sign, carries the

  same unit.

  '
simplified_explanation: "Each symbol stands for a quantity, and the paper says which one, in words, somewhere near the\nequation. Often that sentence starts with the word \"where\". Find it before you read the\nequation.\n\nTwo symbols side by side are multiplied. f(x) is the output of a rule called f, not f times x\n(`B0-R0-C18`).\n\n**Subscripts.** A subscript is a small letter or number set low after a symbol. It is part of\nthe symbol's name, and it does one of two jobs.\n\nIt can label. Hall and colleagues write E for energy and set a small I, O or S after it. E with\nI is energy intake (EI). E with O is energy output (EO). E with S is energy stored (ES).\n\nThis book writes these on the line, as EI and ES. For output it writes energy expenditure\n(EE), the name Book 1 used. EE and Hall's EO are the same quantity.\n\nOr it can count. BW with a small i after it is the body weight in interval number i. BW with a\nsmall 0 is the weight at the start, the baseline.\n\nSide by side means multiply, except for a subscript. BW_0 is the starting weight. It is not BW\ntimes zero.\n\n**Greek letters.** They are letters like x and y, with names. Say the name out loud as you\nread.\n\n```table\n| letter | its name | say it | what one paper in this book uses it for |\n| ρ | rho | \"roe\" | an energy density, energy per kilogram |\n| Δ | capital delta | \"delta\" | the change in whatever follows it |\n| δ | small delta | \"delta\" | a physical activity quantity (Polidori) |\n| ε | epsilon | \"ep-sih-lon\" | how expenditure depends on weight (Polidori) |\n| Σ | capital sigma | \"sigma\" | add up |\n```\n\nEach paper decides what its letters mean, in its own \"where\" clause.\n\n**Sigma.** Σ means \"add up\". It comes with a counter, usually i, and the counter's first and\nlast values. On one line this book writes them in square brackets after it. Say the sum in\nwords, then write it out.\n\n```working\n    Σ[i = 1 to 4] 2i\n    = the sum, for i from 1 to 4, of 2 times i\n    = 2 times 1 plus 2 times 2 plus 2 times 3 plus 2 times 4\n    = 2 plus 4 plus 6 plus 8\n    = 20\n```\n\n**Units.** Every term that is added or subtracted must carry the same unit, and so must the two\nsides of an equals sign (`B0-R0-C11`). Use that to find the unit of a symbol the paper never\nstates.\n"
illustration.body: "Hall and colleagues (2012) wrote a consensus statement on energy balance — a text a panel of experts agreed on together. In it they write the energy\nbalance equation like this.\n\n```working\n    ES = EI minus EO\n```\n\nES is the energy stored in the body. The same paper puts the energy held in a lean adult's fat cells at about 130,000 kcal. So ES is about 130,000 kcal,\nand the equation says intake minus output is about 130,000 kcal.\n\nRun the unit check before you believe that. The paragraph says what the terms are measured in: \"All of these terms are expressed as energy per unit of\ntime.\" So EI and EO are in kilocalories a day.\n\nThe left side has to match. So ES here cannot be the 130,000 kcal, which has no time in its unit.\n\nThe paper says it in words: \"ES is the rate of change in the body's macronutrient stores.\" The unit check caught the switch before the words did.\n\nThis book keeps the two apart. ES is the store, in kilocalories. Its rate of change is dES/dt, said \"dee ES by dee t\". In this book's letters Hall's\nequation says this. The rate of change of stored energy equals energy intake minus energy expenditure.\n\n```working\n    dES/dt = EI minus EE\n```\n\nPolidori and colleagues (2016) worked out how much people's eating changed during a trial of a drug. The drug raises urinary glucose excretion (UGE):\nthe body loses glucose in the urine. Here is their Equation 1. Subscripts are printed after an underscore.\n\n```working\n    ΔEI_i = ρ (dBW_i/dt) + ε(BW_i − BW_0) + (Δδ/(1 − β)) BW_0 + UGE\n```\n\nDo not read it left to right. Make a table with one row for each symbol. Fill the \"words\"\ncolumn from the paper's own sentences. Leave a cell empty rather than guess.\n\nThe words are in the Methods. \"We calculated the changes in energy intake, ΔEI, for each\nsubject\". One input was \"the change of body weight versus baseline over each interval,\n(BWi − BW0)\". The other was \"the rate of change of body weight over each interval, dBWi/dt\".\n\nThen \"The model parameter ρ was the effective energy density associated with the body weight\nchange\". A parameter is a number the model holds fixed while it runs. Then \"ε defined how energy expenditure depends on body weight\". And \"Δδ represents\nchanges in physical activity\".\n\nUGE is not spelled out beside the equation. When a short form is not spelled out, search the paper for words that fit its letters.\n\nSearch the Methods for the sentence that says what β is. If you cannot find one, write \"not found\" in its row.\n\nStart with the ones you know. The results give changes in intake in kilocalories a day, so ΔEI_i is in kcal a day. Body weight is in kilograms. Time\nbetween weighings was counted in days, so dBW_i/dt is in kilograms a day.\n\nEvery term on the right must also be in kcal a day. Work out each unknown unit from that.\n\n```working\n    ρ times (kg a day) = kcal a day, so ρ is in kcal per kg\n    ε times (kg) = kcal a day, so ε is in kcal a day per kg\n    1 minus β: a bare 1 can only lose a bare number, so β has no unit\n    Δδ times (kg) = kcal a day, so Δδ is in kcal a day per kg\n```\n\n```table\n| symbol | say it | the paper's words | unit |\n| ΔEI_i | delta E I sub i | change in energy intake, interval i | kcal a day |\n| BW_i | B W sub i | body weight, interval i | kg |\n| BW_0 | B W sub zero | body weight at baseline | kg |\n| dBW_i/dt | dee B W sub i by dee t | rate of change of body weight, interval i | kg a day |\n| ρ | rho | effective energy density of the weight change | kcal per kg (worked out) |\n| ε | epsilon | how expenditure depends on weight | kcal a day per kg (worked out) |\n| Δδ | delta delta | change in physical activity | kcal a day per kg (worked out) |\n| β | beta | not found | none (worked out) |\n| UGE | U G E | urinary glucose excretion | must be kcal a day |\n```\n\nElsewhere the paper says urinary glucose excretion \"was assumed to be ~90 g/day\". Grams a day cannot be added to kcal a day. So somewhere the authors\nturned grams of glucose into energy, and the equation does not show it. Before you put 90 into this equation, find that conversion.\n\nNow go the other way, from a written-out sum back to sigma. Take 3 plus 6 plus 9 plus 12.\nEach term is 3 times its place in the list, so it is Σ[i = 1 to 4] 3i. Check it by writing it\nout again.\n\n```working\n    3 times 1 plus 3 times 2 plus 3 times 3 plus 3 times 4 = 30\n    3 plus 6 plus 9 plus 12 = 30\n```\n"
illustration.analogy_breaks_when: 'The unit check shows that ES must be a rate in Hall''s equation.


  The table tells you what each symbol denotes and what unit it must carry. It does not tell you

  that the model is a good description of anyone.

  '
must_know[0].point: 'Find the "where" clause before you read an equation. Then write a table: each symbol, its

  words from the paper, and its unit.

  '
must_know[1].point: 'One paper can use the same letters for two things. When the words are unclear, let the unit

  decide.

  '
must_know[2].point: 'A subscript is part of a name and never multiplies. Read it as "B W sub zero", out loud,

  until the habit holds.

  '
must_know[3].point: 'Work out a unit the paper does not print from the terms beside it. Whatever is subtracted

  from a bare 1 has no unit.

  '
must_know[4].point: 'A figure quoted in the text in one unit may enter the equation in another. Find the

  conversion before you put a number in.

  '
must_know[5].point: 'Matching units show that an equation is not malformed. They never show it is right, and they

  cannot tell apart two quantities with the same unit.

  '
must_know[6].point: 'Teach a trainee to read Σ aloud as "the sum, for i from 1 to n, of". Then have them write out

  the first two terms and the last.

  '
