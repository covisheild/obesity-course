definition.text: 'The variance of X, written Var(X) and said "the variance of X", is the expected value of the

  squared deviation of X from E[X]. In symbols:


  ```working

  Var(X) = E[(X − E[X])²]

  ```


  For a random variable with a list of values, that is the sum, over every value x, of

  (x − E[X])² times the probability of x. The standard deviation of X, written with the Greek

  letter sigma, σ, is the square root of Var(X). It carries the unit of X. The variance carries

  that unit squared.


  For fixed numbers a and b, the variance of aX + b is a² times the variance of X. The standard deviation of aX + b is σ times

  the size of a, whatever the sign of a.


  ```working

  Var(aX + b) = a² Var(X)

  ```


  For independent X and Y, the variance of their sum

  is the sum of their variances, and so is the variance of their difference.


  ```working

  Var(X + Y) = Var(X) + Var(Y)

  Var(X − Y) = Var(X) + Var(Y)

  Var(aX + bY) = a² Var(X) + b² Var(Y)

  ```


  Standard deviations do not add.


  For n independent random variables, each with variance σ², the sum has variance nσ² and

  standard deviation σ times the square root of n. Their mean has standard deviation σ divided

  by the square root of n, which is the square-root law of `B0-R0-C29`.


  Without independence the adding rule fails.

  '
simplified_explanation: 'The expected value says where a chancy quantity sits on average. The variance says how far it

  strays from there.


  Take each value''s distance from the expected value and square it. Weight each square by that

  value''s probability, and add them up.


  The answer is in squared units: square grams, if the quantity was in grams. Take its square root

  and you are back in grams.


  Now add two uncertain amounts whose errors have nothing to do with each other. The spread of the

  total grows, but by less than the two spreads added.


  Subtract them instead, and the spread grows by exactly the same amount. Subtracting does not

  cancel uncertainty.

  '
illustration.body: 'You weigh dal on a cheap kitchen scale, by difference. Weigh the empty katori. Put the dal in

  and weigh again. The dal''s weight is the second reading minus the first.


  Suppose each reading is off by minus 10, 0 or plus 10 grams, with probabilities 0.25, 0.5 and

  0.25. Suppose too that the error of one reading tells you nothing

  about the error of the other, so the two are independent. Call the error of one reading X.


  Find its expected value first: each value times its probability, added up.


  ```working

  -10 times 0.25 plus 0 times 0.5 plus 10 times 0.25 = 0

  ```


  Now the variance. Each value''s deviation from 0 is the value itself. Square it, weight it by

  its probability, and add.


  ```working

  100 times 0.25 plus 0 times 0.5 plus 100 times 0.25 = 50

  ```


  Var(X) is 50 square grams. The standard deviation is the square root of 50, about 7.07 grams.


  The dal''s error is the second reading''s error minus the first''s. The variance of a difference of independent errors is the sum of their

  variances.


  ```working

  50 plus 50 = 100

  ```


  The dal''s standard deviation is the square root of 100, which is 10 grams. Each

  reading alone had about 7.07. You subtracted, and the error grew.


  Adding the two standard deviations gives about 14.14 grams, and

  that is wrong. Variances add; standard deviations do not.


  Now carry the rule from grams to energy. Hall and colleagues wrote a consensus statement on

  energy balance. It puts the uncertainty of expenditure measured by doubly labelled water at

  more than 100 kilocalories (kcal) a day. It gives the same figure as 420 kilojoules (kJ) a

  day.


  Converting kcal to kJ multiplies every value by 4.184, the factor in `B0-R0-C12`. So a spread in kJ is a

  spread in kcal times 4.184. Take 100 kcal a day as the floor of the standard deviation.


  ```working

  100 times 4.184 = 418.4

  ```


  The paper rounds this to 420.


  The energy imbalance of a day is energy

  intake (EI) minus energy expenditure (EE).


  Take the expenditure error''s standard deviation as 100 kcal a day, the floor from above. So suppose, as a made-up figure, that

  the intake error has a standard deviation of 300 kcal a day. Suppose too that the two errors

  are independent. The variance of the imbalance is the sum of the two variances.


  ```working

  100 times 100 plus 300 times 300 = 100000

  ```


  The standard deviation of the imbalance is the square root of 100,000, about 316.2 kcal a day.

  It is at least that, because 100 was a floor.


  Now add up days. Take two made-up cases, each with an intake error of 300 kcal on a single

  day. In the first, each day''s error is independent of every other day''s. In the second, the

  record under-counts by the same 300 kcal every day.


  In the first case the variance of an n-day total is n times the variance of one day. So its

  standard deviation is 300 times the square root of n. Over 9 days the square root of 9 is 3.


  ```working

  300 times 3 = 900

  ```


  In the second case nothing varies. The total error is 300 times n.


  ```working

  300 times 9 = 2700

  ```


  Divide by the days to get the error in the average day. In the first case it shrinks: 300

  divided by the square root of 16 is 75 kcal a day. That is the square-root law of `B0-R0-C29`. In the

  second case it stays at 300 kcal a day however long you record.

  '
illustration.analogy_breaks_when: 'Weighing by difference removes an error shared by both readings and adds up the

  variances of the parts that are not shared.


  The 300 kcal a day is made up, and so is the choice between the two cases.


  The adding rule also needs the intake and expenditure errors to be independent. That is an

  argument you make, not a fact the numbers give you.

  '
must_know[0].point: 'Subtracting one measured amount from another does not cancel their errors. Treat a small difference between two large measured

  amounts as the least trustworthy number on the page.

  '
must_know[1].point: 'Hall and colleagues say expenditure measured by doubly labelled water can be off by more than

  100 kcal a day. Take measured intake minus that expenditure. The gap you get is at least as

  uncertain. So do not accept one

  person''s measured imbalance quoted as if it were known to within 50 kcal a day.

  '
must_know[2].point: 'Standard deviations do not add. Square each one, add the squares, and take the square root of

  the total.

  '
must_know[3].point: 'The adding rule, and the square-root growth over days, hold only for independent errors. An

  under-count repeated every day grows in step with the days, and averaging does not shrink it.

  Before you use the rule, make the independence argument `B0-R0-C25` asks for.

  '
must_know[4].point: 'Two measurements of the same person are rarely independent. A before-and-after change, or a

  predicted-minus-actual difference, can then spread much less than the adding rule says.

  '
must_know[5].point: 'When a paper subtracts a baseline, ask whether the baseline was a fixed number or a

  measurement. Taking away a measured

  baseline adds that baseline''s variance to the change.

  '
must_know[6].point: 'Suppose a patient''s food diary shows a deficit of a few hundred kcal a day and their weight

  has not moved. Do not treat the diary as the fixed truth and their body as the puzzle.

  '
must_know[7].point: 'Teach a trainee to convert a variance to a standard deviation before setting it beside a mean.

  A variance is in squared units, such as square grams.

  '
