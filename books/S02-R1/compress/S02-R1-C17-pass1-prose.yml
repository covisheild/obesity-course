definition.text: |
  An equation in a paper is one of four kinds, and each kind is checked a different way.

  An identity holds for every value of its symbols, because of how its quantities are defined or
  because a conservation law requires it.

  A definition brings in a new quantity as a combination of others. It cannot be false.

  A model assumption is a claim, adopted by the author, about how a body or a population
  behaves. It could be false.

  A fitted equation has a form chosen by its author and constants estimated from one set of
  measurements.

  A notebook entry records one equation so that it can be used and checked later. It holds six
  things.

  1. The equation as printed.
  2. Each symbol in words, with its unit.
  3. The whole equation said as one sentence.
  4. Its kind.
  5. What it assumes, or whom it was fitted on.
  6. The paper, with the equation's number or page.
simplified_explanation: |
  Equations in papers look alike: letters, an equals sign, more letters. They are not alike. Some
  are true whatever happens. Some are true because someone decided what a word means. Some are
  guesses about how bodies behave. Some are lines drawn through somebody else's measurements.

  Which kind you are looking at decides what you check.

  So keep a notebook.
illustration.body: |
  Start with an equation that went wrong for Indian adults, and find out why by sorting it.

  The report, FAO/WHO/UNU 2004, prints equations for basal metabolic rate (BMR), the energy a body
  spends at complete rest. They come from Schofield,
  and the consultation "decided to retain" them.

  ```working
  BMR = 15.057 × weight + 692.2
  ```

  Now sort it. It is not an identity: nothing forces a body's BMR to be this number. It is a fitted equation. Its form, a straight line in weight, was chosen.

  So ask the fitted equation's question: whom was it fitted on? ICMR-NIN, the Indian Council of
  Medical Research's National Institute of Nutrition (NIN), answers it for you. The FAO/WHO/UNU
  equations "can overestimate the BMR by 10 -12%, because the FAO/WHO/UNU data set included
  young and muscular subjects."

  Nothing was wrong with the line on its own data. It was carried onto people unlike the ones it
  was drawn through.

  Now write the entry.

  - Each symbol with its unit: BMR, basal metabolic rate, in kcal a day. Weight in kg. 15.057,
    in kcal a day for each kg. 692.2, in kcal a day.
  - In words: for men aged 18 to 30, BMR is about 15 kcal a day for each kilogram, plus about
    692 kcal a day.
  - Kind: fitted.
  - Assumes, or fitted on: Schofield's measured men, 2,879 in this band.
  - Source: FAO/WHO/UNU 2004, chapter 5, Table 5.2.

  A second entry shows an equation of two kinds at once. Polidori and colleagues write their
  Equation 4 for how intake answers weight loss (Polidori 2016).

  ```working
  ΔEI(t) = −kP × ΔBW(t)
  ```

  - Symbols: the change in intake from the start, ΔEI(t), is in kcal a day. The change in body
    weight (BW) from the start, ΔBW(t), is in kg. The constant kP is "the feedback strength". The minus sign makes intake rise when weight falls.
  - In words: for every kilogram lost, intake rises by kP kcal a day.
  - Kind: a model assumption with one fitted constant. The straight-line form is the assumption.
  - Assumes: intake answers weight in proportion.
  - Source: Polidori and colleagues 2016, Methods, Equation 4.
illustration.analogy_breaks_when: |
  ICMR-NIN's finding is about groups of Indian adults. It is not a correction to apply to a
  single patient's measured BMR.

  Sorting is not always this clean. Record both kinds when an equation has both.
must_know[0].point: |
  Say an equation's kind before you use it, because the check differs. For a definition, read the where-clause. For a model assumption, ask for the evidence. For a fitted equation, ask whom it was fitted on.
must_know[1].point: |
  An identity cannot tell you what to change. When someone offers the identity as a reason for an instruction, ask which model assumption they have added to it.
must_know[2].point: |
  ICMR-NIN finds that the FAO/WHO/UNU equations for BMR can run 10 to 12% high for Indians. Before you estimate an Indian patient's needs from those equations, use ICMR-NIN's figures for Indian adults, which build in a reduction.
must_know[3].point: |
  An energy requirement is BMR times the physical activity level (PAL). ICMR-NIN's 2020 note cut the sedentary figure from 1.53 to 1.40. At the same BMR, that alone lowers the estimate by about 8.5%. Quote such a table with the year of its inputs.
must_know[4].point: |
  A fitted equation holds for people like those it was fitted on, over the range it was fitted.
must_know[5].point: |
  Polidori's about 100 kcal a day per kg was fitted to group means. Do not tell a patient their appetite will rise by exactly that much.
must_know[6].point: |
  A notebook entry without its kind and its assumptions is not finished. When you copy an equation from a typeset image, have a second reader check it symbol by symbol.
must_know[7].point: |
  Teach a trainee that a definition cannot be confirmed by data.
