definition.text: 'A differential equation is an equation involving an unknown function and one or more of

  its derivatives. For body weight W in kilograms and time t in days, the form is dW/dt = f(W, t).


  The equation and the initial value together are an initial-value problem, and a

  function solves it only if it satisfies both.


  ```working

  ρ × dW/dt = ΔEI − ε × (W − W0),   with W = W0 at t = 0

  ```


  This is Equation 1 of Polidori and colleagues (2016) with its physical activity and urinary

  glucose terms set to zero, rearranged.


  A forward step, which is Euler''s method taken one step at a time, approximates a solution.

  Then take the state at t + h

  to be about W(t) + h × (the rate at t).

  '
simplified_explanation: "Over a day, the change in the body's stored energy\nis what came in minus what went out.\n\n```working\nrate of change of stored energy = EI − EE\n```\n\nEI is energy intake and EE is energy expenditure, both in kilocalories a day.\n\nSay each kilogram of weight gained or lost carries a\nfixed amount of energy. Call it rho, written ρ, in kilocalories per kilogram.\n\n```working\nρ × dW/dt = EI − EE\n```\n\nThat line is always true. It is still no use for predicting anything. A smaller body spends less, so EE\ndepends on the weight itself.\n\nSo write EE as a rule in W. It says each kilogram of\nweight adds a fixed number of kilocalories a day to expenditure. Call that number epsilon,\nwritten ε.\n\nThat is what a differential equation is: a rule that\ngives the rate from the state.\n\n- An answer to it is not a number. It is a whole curve of weight against time. You check a\n  curve by putting it into the equation. The two sides have to agree at every moment, not\n  only at the start.\n- Many curves obey the same rule. The starting weight picks out the one that is yours.\n\nYou can also walk the curve without a formula. Work out today's rate from today's weight.\nMove one day at that rate. Work out the new rate from the new weight. Move again.\n"
illustration.body: 'Go back to Hall and colleagues'' man from Book 1. He weighs 100 kilograms and cuts his energy

  intake by 2 megajoules a day. The paper converts that for you: "2 MJ per day (480 kcal per

  day)". So ΔEI, the change in intake, is minus 480 kilocalories a day.


  Use 7,716.18 kilocalories per kilogram, the static rule''s own

  figure from Book 1.


  For ε, Hall and Guo (2017) give expenditure rising with weight "with a slope of about 20–30

  kcal/d per kg". Take the lower end, 20 kilocalories a day for each kilogram. The man''s

  equation is then:


  ```working

  7716.18 × dW/dt = −480 − 20 × (W − 100),   with W = 100 at t = 0

  ```


  On the right,

  the cut in intake, plus the fall in expenditure since the start. When W is below 100,

  W − 100 is negative. So minus 20 times it is positive, and it eats into the deficit.


  Start with the curve that fails. The static rule says his weight falls in a straight line.


  ```working

  480 divided by 7716.18 = 0.06221

  W(t) = 100 − 0.06221 × t

  ```


  Put that line into the equation a year in, at t = 365.


  The two sides disagree by

  more than 450 kilocalories a day. The straight line starts at the right weight and is not a

  solution. It solves the equation only when ε is 0, that is, when expenditure ignores weight.


  Now the curve that works.


  ```working

  W(t) = 100 − 24 × (1 − e^(-t/385.809))

  ```


  Each is a ratio of the equation''s own numbers.


  ```working

  480 divided by 20 = 24

  7716.18 divided by 20 = 385.809

  ```


  Check it the way any candidate is checked: the start, then both sides. At t = 0, e^(0) is 1.

  So 1 − 1 is 0, and W is 100. The initial value holds.


  For the rate, use the rule from the section on e: the derivative of e^(kt) is k times

  e^(kt). Here k is minus 1 divided by 385.809. The derivative of W is then this.


  ```working

  dW/dt = −24 × (1 divided by 385.809) × e^(-t/385.809)

  24 divided by 385.809 = 0.06221

  ```


  In symbols the check is two lines, both using the rule for e^(kt):


  ```working

  left:  7716.18 × dW/dt = −480 × e^(-t/385.809)

  right: −480 − 20 × (−24) × (1 − e^(-t/385.809)) = −480 + 480 − 480 × e^(-t/385.809)

  ```


  Both come to minus 480 times e^(-t/385.809). The deficit starts at 480 kilocalories a day and

  shrinks towards nothing as the weight falls.


  Now walk it without the formula, one day at a time. On day 0 the weight is 100, so the

  bracket is 0 and the rate is the static rule''s.


  ```working

  480 divided by 7716.18 = 0.062207

  100 minus 0.062207 = 99.937793

  ```


  On day 1 the weight is 99.937793, which is 0.062207 below the start.


  ```working

  20 times 0.062207 = 1.24414

  480 minus 1.24414 = 478.75586

  478.75586 divided by 7716.18 = 0.062046

  99.937793 minus 0.062046 = 99.875747

  ```


  About 99.8757 on day 2. The formula gives 99.8759. A

  smaller step drifts less.


  Run the formula for three years and put the static line beside it. A second curve uses the

  top of Hall and Guo''s range, ε = 30.


  ```table

  day   static rule, ε = 0  ε = 20 kcal/day per kg  ε = 30 kcal/day per kg

  0     100                 100                     100

  90    94.40               95.01                   95.28

  180   88.80               91.05                   91.95

  365   77.29               85.32                   87.87

  545   66.10               81.84                   85.92

  730   54.59               79.62                   84.94

  1095  31.88               77.40                   84.23

  ```


  All three columns come from one equation. Only ε differs. With ε at 0, the loss never

  slows. With any ε above 0, the loss slows and flattens.


  The same equation can also be run backwards. Polidori and colleagues (2016) had weights and

  no reliable intake. Then they put the weight and its rate into their Equation 1 and read off

  ΔEI. The intake change they report is an output of the equation, not a measurement.

  '
illustration.analogy_breaks_when: 'The value of ρ here is the static rule''s 7,716.18 kilocalories per kilogram, borrowed as a

  stand-in. For a real body, ρ "need not be a constant", as Chow and Hall (2008) put it. It

  changes with what the weight lost is made of. So the curves in the table have the right

  shape and not Hall''s timing.


  The straight line for expenditure is an approximation. It is safest for changes small enough that

  one slope describes them.

  '
must_know[0].point: 'The energy balance identity predicts nothing on its own. A prediction appears only when

  someone writes expenditure, and perhaps intake, as a rule in weight. When you read a

  projection built "on energy balance", find that rule.

  '
must_know[1].point: 'A curve that starts at the right weight is not thereby a solution. Check a claimed solution at the start

  and at a later time, on both sides of the equation.

  '
must_know[2].point: '"Cut 480 kilocalories and you run a 480 deficit every day" is the static rule. Correct a trainee who carries the day-one deficit forward: the

  cut stays the same; the deficit does not.

  '
must_know[3].point: 'When you step an equation forward, work the rate out again from the new state at every

  step.

  '
must_know[4].point: 'Keep the units in step: ρ in kilocalories per kilogram and intake in kilocalories a day

  give kilograms a day.

  '
must_know[5].point: 'Use it for the

  shape of a response and for modest changes. For one person''s timetable over years, use a

  validated model, and say in writing which one you used.

  '
must_know[6].point: 'When a paper reports intake "calculated" from repeated weighings, read it as the output of

  an equation. It moves with the ρ and the ε put in.

  '
