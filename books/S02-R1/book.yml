id: S02-R1
number: 2
title: Mathematics for modelling and inference · Rung 1
subtitle: Reading the equations in a paper instead of skipping them
cover_line: Rates, totals, tables of numbers, chance, and where a system settles
status: frozen            # frozen | in progress
version: "1.1"
practice_max: 25        # drill-set ceiling for this book (claude.md §7a); Harsh, 24 Sep 2026
last_updated: 2026-09-24
why: |
  Most papers on body weight carry a few equations, and most readers skip them. The argument is
  often in those lines. Book 0 named the derivative and the integral and asked you to work out
  neither. This book asks you to work them out, on body stores rather than on made-up curves. It
  adds the few tools that the equations in these papers keep using: tables of numbers multiplied
  together, the arithmetic of chance, and the point where a changing system stops changing.
how_to_read: |
  Read Book 0 and Book 1 first, or at least the sections this book names as it goes. Then read
  this one in order: each section assumes everything before it. Do the practice problems in each
  section before you read on, with a pen and a calculator. Keep a notebook open as you go. By the
  end it should hold ten equations from papers you have read, each written out in words.
  What this book does not teach yet: the product and chain rules, partial derivatives, likelihood,
  confidence intervals, hypothesis tests, regression and causal inference. Later books in the
  series take them up; "inference" in the title is where this subject's rungs are heading.
back_blurb: |
  A short book of mathematics for reading research on obesity. It covers the rate of change and
  the running total worked out rather than named, the number e, a table of numbers and what
  multiplying by one does, a random quantity with its average and spread, and the point where a
  changing quantity settles. Then it shows how to read an equation symbol by symbol, and how to
  follow a derivation line by line without jumping to the result.
