simplified_explanation: |
  The section on the accounting identity gave you one line. What your body's energy stores do in a day is intake minus expenditure. This
  section puts a size on that line, and then shows you the one place people always break it.

  Start with the size. A daily gap between what comes in and what goes out is a flow, in kilocalories a day. Hold it for a number of days
  and it adds up.

  ```working
      the change in the stores = the daily gap, times the number of days
  ```

  A gap of 300 kilocalories a day for 30 days is 9,000 kilocalories. That is a quantity of energy. It is not yet a weight.

  To turn energy into kilograms you need one more number: how much energy one kilogram of the tissue that changed holds. Divide by it.

  ```working
      the mass = the energy, divided by the energy in one kilogram
  ```

  The number almost everybody uses comes from a rule. **Three thousand five hundred kilocalories for every pound.** A pound is an older unit
  of mass, and it is exactly 0.45359237 of a kilogram. A kilogram is bigger than a pound, so a
  kilogram carries more kilocalories.

  ```working
      3,500 divided by 0.45359237 = 7,716.18
  ```

  About 7,700 kilocalories to the kilogram, on the rule's own terms. The section on how much energy a kilogram of body fat holds is
  where you find out whether that figure is right for the tissue. Here it is just the rule's number.

  Put that against a day. India's figures for how much energy adults need come from the National Institute of Nutrition of the Indian
  Council of Medical Research, ICMR-NIN for short. For a man of 65 kilograms doing sedentary work, it sets 2,110 kilocalories a day.

  ```working
      7,716.18 divided by 2,110 = 3.66
  ```

  A kilogram, at the rule's figure, is three and a half days or more of that man's whole requirement. That is the useful thing the rule
  does. It tells you how big a change is, measured in days of eating.

  Now the trap. Take the rule and a fixed daily gap, and you can draw a line into the future. A gap of 500 kilocalories a day is 3,500
  a week. So a pound a week, 52 pounds a year, 104 pounds in two years. Every step is correct arithmetic. The line is still wrong.

  **It assumes the gap stays the same size while the body changes.** It does not. A smaller body spends less, as the section on what
  expenditure is made of showed. So when weight falls on a fixed intake, expenditure falls with it, and the gap shrinks. A shrinking
  gap moves weight more slowly. Eventually the gap closes and weight stops at a new level.

  That straight line has a name. It is the static rule, static because it holds everything still except the one number you changed.
  Measured against people, it promises too much. The longer you run it, the more it promises.

  So use the rule to size an imbalance. Never use it to set a date.
illustration:
  body: |
    Open OpenStax Anatomy and Physiology 2e, section 24.7, Nutrition and Diet, at
    https://openstax.org/books/anatomy-and-physiology-2e/pages/24-7-nutrition-and-diet. Open your browser's find box and search for 3500.

    > The accumulation of an extra 3500 calories adds one pound of weight. If an excess of 200
    > calories per day is ingested, one extra pound of body weight will be gained every 18 days.
    > At that rate, an extra 20 pounds can be gained over the course of a year.

    This is a textbook. Check its arithmetic before you judge it. The 200 is the book's own example, not a measurement of anybody.

    ```working
        3,500 divided by 200 = 17.5
    ```

    Seventeen and a half days, which the book rounds to 18. Now the year.

    ```working
        200 times 365 = 73,000
        73,000 divided by 3,500 = 20.85714286
    ```

    About 21 pounds. The book says 20. The arithmetic holds.

    Put it in kilograms. The pound is exactly 0.45359237 kilograms. That is the figure in the Guide to the SI from the United States National
    Institute of Standards and Technology, at https://www.nist.gov/pml/special-publication-811/nist-guide-si-footnotes.

    ```working
        20.86 times 0.45359237 = 9.46
    ```

    About 9.5 kilograms in a year.

    Now take the three words "at that rate" at their word, and run the same line for ten years.

    ```working
        9.46 times 10 = 94.6
    ```

    Ninety-five kilograms, from 200 kilocalories a day. Keep that number in mind while you look at what happens when the rule is tested.
    The arithmetic did not break. Something the arithmetic assumed did.

    The assumption is in "at that rate". It treats the 200 as a fixed thing, like a salary. But the 200 is a gap between intake and
    expenditure, and expenditure is not fixed. A heavier body spends more. So the same intake leaves a smaller gap each month, and the
    line bends.

    Now go and see the bend measured. Open the paper by Thomas and colleagues in the International Journal of Obesity, 2013, at
    https://pmc.ncbi.nlm.nih.gov/articles/PMC4024447/. Search for 3500 kilocalorie.

    > expected weight loss is often guided by the belief that a 3500 kilocalorie (kcal) deficit will
    > result in one pound of weight loss (about 0.45 kilogram)

    That is the rule, stated by people about to test it. They pooled seven experiments. In each one, intake was supervised or measured, not
    reported. There were 103 adults, treated for 31 to 93 days. Search for 27.6.

    > Subjects lost 20.1±11.3 lbs, 7.4±12.6 lb less than the 27.6±16.0 lbs predicted by the 3500
    > kcal rule.

    The rule predicted 27.6 pounds. People lost 20.1. How much of the prediction came true:

    ```working
        20.1 divided by 27.6 = 0.728
    ```

    About three quarters, and that is over two months or so, which is short. The shortfall grows as the time gets longer.

    For the long view, open the paper by Hall and colleagues in The Lancet, 2011, at https://pmc.ncbi.nlm.nih.gov/articles/PMC3880593/.
    Search for 100 kg. It describes a sedentary man of 100 kilograms who cuts his intake by 2 megajoules a day. The paper gives that as 480
    kilocalories a day.

    Do the rule's sum yourself first.

    ```working
        480 times 365 = 175,200
        175,200 divided by 3,500 = 50.05714286
        50.06 times 0.45359237 = 22.71
    ```

    About 22.7 kilograms in the first year. Now search the paper for 22 kg.

    > predicts that the same 2 MJ per day reduction of energy intake will result in a linear decrease
    > of bodyweight over time with 22 kg lost in the first year (not shown), which is about 100%
    > greater weight loss than our model prediction.

    The paper's model lets expenditure fall as weight falls. It puts this man at a plateau of about 75 kilograms, reached over years. That is
    about 25 kilograms in all, half of it in roughly the first year. The static rule puts 22.7 kilograms into the first year alone, and then
    keeps going. Run it for ten years.

    ```working
        22.71 times 10 = 227.1
    ```

    Two hundred and twenty-seven kilograms lost, by a man who weighed 100. A straight line through a quantity that has a floor will
    always, sooner or later, go through the floor.

    Now use the rule for the thing it can do. How many days of eating is one kilogram, at the rule's own figure? Take the requirement
    ICMR-NIN adopted in 2020 for an Indian man of 65 kilograms doing sedentary work, 2,110 kilocalories a day.

    ```working
        3,500 divided by 0.45359237 = 7,716.18
        7,716.18 divided by 2,110 = 3.66
    ```

    Three and two thirds days of that man's whole requirement. For the woman in the same table, 55 kilograms and sedentary work, 1,660
    kilocalories:

    ```working
        7,716.18 divided by 1,660 = 4.65
    ```

    Between three and five days, whichever row you take. That is what the rule is good for. It sizes a change. It cannot tell you when the
    change will happen.
