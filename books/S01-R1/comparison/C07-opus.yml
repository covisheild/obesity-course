definition:
  text: |
    An energy imbalance is energy intake minus energy expenditure, stated per day. Held at the
    same value for a number of days, it adds up to a change in the body's energy stores equal to
    the daily imbalance times the number of days.

    To express a quantity of energy as a mass of body tissue, divide it by the energy content of
    one unit of mass of that tissue. The answer is a mass of that tissue and of nothing else.

    The 3,500 kcal per pound rule assigns 3,500 kilocalories to each pound of weight change. The
    avoirdupois pound is exactly 0.45359237 kilograms. So the rule's figure is 3,500 divided by
    0.45359237, which is 7,716 kilocalories per kilogram, or 32.3 megajoules per kilogram at
    4.184 kilojoules to the kilocalorie. That is less than the 9,000 kilocalories a kilogram of
    fat would carry at the Atwater factor of 9.0 kilocalories a gram. What a kilogram of weight
    change is actually made of is a separate question.

    Used to size an imbalance, the rule answers how much energy a stated change in weight
    corresponds to. The National Institute of Nutrition of the Indian Council of Medical Research
    (ICMR-NIN) adopted daily energy requirements for Indian adults in 2020. A kilogram at the
    rule's figure is between three and five days of the whole requirement for sedentary work.

    Used to project, the rule divides a cumulative imbalance by 3,500 kilocalories a pound. A
    constant daily imbalance then gives weight changing in a straight line for as long as the
    imbalance is held. This projection is the static rule.

    The projection assumes that the daily imbalance stays the same while the body changes. It
    does not stay the same. Expenditure depends on body size, so a fixed intake produces a
    shrinking imbalance as mass is lost, and weight change slows towards a plateau. The static
    rule therefore overestimates weight change on average, and the error grows with time. In seven pooled
    experiments with intake supervised or objectively measured, 103 adults lost a mean of 20.1
    pounds against 27.6 pounds predicted by the rule. For a simulated 100 kg man cutting intake by
    2 MJ a day, the rule predicts 22 kg lost in the first year, about twice what a model that lets
    expenditure fall with weight predicts.
