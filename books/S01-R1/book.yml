id: S01-R1
number: 1
title: Energy balance and dynamic weight-change modelling · Rung 1
subtitle: Why energy balance is arithmetically true and practically insufficient
cover_line: The accounting identity, its units, and why it is not a lever
status: in progress       # frozen | in progress
version: "1.0"
last_updated: 2026-09-23
why: |
  Every claim about body weight passes, sooner or later, through energy balance. This book
  teaches the one piece of physics that no argument about obesity is allowed to break: body fat
  is stored chemical energy, energy is conserved, so fat changes only when what comes in differs
  from what goes out. It also teaches why that true sentence is not an instruction: intake and
  expenditure are outputs of a regulated body, not dials you set.
how_to_read: |
  Read Book 0 first, or at least the sections this book names as it goes. Then read this one in
  order: each section assumes everything before it. Do every exercise before you read on.
back_blurb: |
  A short book on the first law of thermodynamics as it applies to a human body: what a
  kilocalorie is, how large a day of eating, a day of spending and a kilogram of fat are, how to
  spot a claim that breaks conservation of energy, and why "eat less" does not follow from "energy
  is conserved".
