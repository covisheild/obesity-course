definition.text: 'Energy intake and energy expenditure are not two independent dials a person sets and then

  leaves alone. They are outputs of a system that senses body weight, or a signal that tracks

  it, and pushes back when weight falls. Cut intake, and two things move against the cut.


  Expenditure falls by more than the loss of fat and lean mass alone accounts for. After a

  person sustains a loss of 10% or more of body weight, 24-hour energy expenditure falls by

  about 20% to 25%, and that fall runs about 10% to 15% below what a change of that size in fat

  and lean mass alone would predict. The extra fall is the adaptive part: a formerly heavier

  person now needs roughly 300 to 400 fewer calories a day than a person of the same weight and

  composition who was never heavier.


  Appetite rises. That pull is more than three times the size of the matching fall in

  expenditure, so the appetite response, not the metabolic one, is the larger of the two.


  Both responses run in the direction that returns stored energy toward where it was.

  '
simplified_explanation: 'Cut what you eat, and two things start moving against you.


  Lose a tenth of your body weight and keep it off, and your daily expenditure drops by about a

  fifth to a quarter. Some of that drop is exactly what a smaller body should cost to run. The

  rest, about 10 to 15% of the total, is extra.


  At the same time your appetite rises. Appetite, not metabolism, does most of the pushing back.


  Neither of these is the person''s character failing.


  How large the pushback is varies between people.

  '
illustration.body: 'Take the trial the appetite figure above comes from. It ran for a year, in 153 people with

  type 2 diabetes, on a drug that makes the kidneys pass glucose out in the urine instead of

  keeping it.


  The researchers measured body weight week by week and worked back, from how weight actually

  moved, to how much people must have been eating. They found intake climbing as weight fell:

  close to 100 kcal a day of extra eating for every kilogram already lost.


  Rosenbaum and Leibel''s patients, after losing a tenth of their body weight, needed 300 to 400

  fewer calories a day than someone who had always weighed that much - the expenditure side of

  the same loop.


  Put a number on both sides for a person 8 kg lighter than they started. The appetite pull is

  about 8 times 100 kcal, close to 800 kcal a day of extra wanting to eat. The expenditure fall

  for a person who lost a full 10% of body weight sits at 300 to 400 kcal a day.

  '
illustration.analogy_breaks_when: 'The 100 kcal per kg figure is a slope fitted from one trial, in adults with type 2 diabetes

  losing weight slowly over a year through glucose loss in urine, not from dieting. Nothing here

  establishes that the same slope holds at every amount of weight lost, in every population, or

  under every method of losing it.

  '
must_know[0].point: '"Cut intake and only fat is lost" is incomplete. Treat a plateau in weight loss as the

  expected output of this loop, not as the patient having stopped trying.

  '
must_know[1].point: 'A conversation about "slower metabolism" that never mentions rising hunger is describing

  the smaller half of what the patient is fighting.

  '
must_know[2].point: 'A formerly heavier person needs roughly 300 to 400 fewer calories a day than someone who was

  always that weight, to hold the same weight.

  '
must_know[3].point: 'Do not quote the 100 kcal per kg or the 300-400 kcal figures to a patient as what will

  happen to them.

  '
must_know[4].point: 'It does not teach the neuroendocrine mechanism that carries the signal; that sits in a

  later subject.

  '
