definition.text: 'A person''s body energy stores are a stock, in the sense Book 0 gives that word.


  Draw the boundary at the mouth and skin, as `B0-R0-C33` shows for a person, and count intake

  at the metabolisable line: the energy that crosses in after the losses in faeces, gas and

  urine have already left, which `B0-R0-C32` defines.


  The rate of change of body energy stores equals energy intake minus energy expenditure, both

  counted over the same day.


  Whenever the two sides are computed correctly for the same boundary and the same interval,

  they match, with no exception and no remainder. A day on which they appear not to match is a

  day on which a route was left off one side, not a day on which the identity failed.


  Because it is a balance line applied to one particular stock, the identity carries no

  direction and no cause. It says what the numbers must do. It does not say why intake or

  expenditure took the value it did.

  '
simplified_explanation: "A body holds energy the way a bank account holds money. What you eat and drink is a deposit.\nEverything your body spends — moving, keeping warm, running your organs — is a withdrawal.\n\nThe balance changes only by deposits and withdrawals. Nothing else moves it.\n\nHow much your stores changed today equals what went in today, minus what went out today.\n\n```working\n    the change in body energy stores over the day = energy intake for the day minus energy expenditure for the day\n```\n"
illustration.body: "Take a made-up week, seven days, to see the identity used forwards and then checked\nbackwards.\n\nA person's energy stores are measured at the start of the week: 620 megajoules. Each day\ntheir intake and expenditure, in megajoules, are recorded.\n\n```table\nday  intake (MJ)  expenditure (MJ)\n1    9.1          8.6\n2    8.4          8.7\n3    9.6          8.5\n4    8.0          9.0\n5    9.3          8.4\n6    8.8          8.8\n7    9.9          8.3\n```\n\nThe change on each day is intake minus expenditure.\n\n```working\n    day 1: 9.1 minus 8.6 = 0.5\n    day 2: 8.4 minus 8.7 = -0.3\n    day 3: 9.6 minus 8.5 = 1.1\n    day 4: 8.0 minus 9.0 = -1.0\n    day 5: 9.3 minus 8.4 = 0.9\n    day 6: 8.8 minus 8.8 = 0\n    day 7: 9.9 minus 8.3 = 1.6\n```\n\nSum the seven daily changes to get the change over the week.\n\n```working\n    0.5 plus -0.3 plus 1.1 plus -1.0 plus 0.9 plus 0 plus 1.6 = 2.8\n```\n\nStores rose by 2.8 megajoules over the week. Add that to the starting figure.\n\n```working\n    620 plus 2.8 = 622.8\n```\n\nStores stand at 622.8 megajoules at the end of the week.\n"
illustration.analogy_breaks_when: 'Body energy stores are not measured directly day to day; what gets measured is body mass, and

  turning a mass change into an energy change needs a further fact about what the mass is made

  of, which this record does not supply.

  '
must_know[0].point: 'Write the day down. State the day, or the stretch of days, before you accept or quote a

  figure built from this identity.

  '
must_know[1].point: 'Intake in this identity is metabolisable intake, the figure that survives the losses

  `B0-R0-C32` names, not the gross energy printed on a label or burned in a bomb calorimeter.

  '
must_know[2].point: 'A day where intake and expenditure match exactly is not a day of biological quiet. Do not

  read a flat scale reading as evidence that nothing is happening in the body.

  '
must_know[3].point: 'The identity holds on any interval you choose, provided intake and expenditure are both

  counted over exactly that interval. A day-to-day mismatch is usually a sign the interval is

  too short for food still in the gut and water shifts to average out, not a sign the identity

  has failed.

  '
must_know[4].point: 'This identity fixes the arithmetic and answers no question about cause.

  '
