definition.text: 'A weight-loss claim breaks conservation when the fat change it asserts could
  not have happened given the energy that could plausibly have crossed the boundary drawn round
  the person over the stated time.


  First, draw the boundary and list the routes energy can cross it: in, as food and drink; out,
  as heat, as work done on things around the person, and in whatever is not absorbed.


  Second, put a number on the claimed fat change, using the static rule''s own conversion from
  this subject''s C07: 3,500 kilocalories for each pound, about 7,716 for each kilogram.


  Third, compare that required amount with the largest deficit that has plausibly crossed the
  person''s boundary over the stated time. A claim whose required energy exceeds every plausible
  deficit for the stated interval is impossible on energy grounds alone, regardless of what
  method is claimed to produce it.


  One case does not fail this test even though it looks alarming at first. Fast early loss that
  is mostly glycogen and its water is not a violation; it is a different substance leaving the
  boundary, at a different energy cost per kilogram than fat.

  '
simplified_explanation: 'You do not need to know anything about the diet to check. You need
  three things: a boundary, a number, and a limit.


  Draw the boundary round the person.


  Turn the claimed fat change into an energy number, using the rate from the previous section:
  3,500 kilocalories for a pound, about 7,716 for a kilogram.


  Now the limit. Over any stretch of time, the biggest possible deficit a person can run is
  their whole expenditure for that stretch, because you cannot eat less than nothing. So if
  the energy the claim requires is bigger than any plausible deficit for the time given, the
  claim cannot be true.


  One thing looks like a violation and is not. That is because the body stores some energy as
  a starch-like fuel called glycogen, and glycogen is stored together with water. Burn through
  the glycogen and the water that went with it leaves too. Fast, and mostly water, are not the
  same as impossible.

  '
illustration.body: "Open the US Federal Trade Commission's \"Gut Check\" reference guide for\
  \ spotting false weight-loss claims, at https://www.ftc.gov/business-guidance/resources/gut-check-reference-guide-media-spotting-false-weight-loss-claims.\
  \ These examples are the FTC's own illustrations of a claim type, not real advertisements:\
  \ treat the wording the same way you would treat a specimen handed to you to test, never as\
  \ evidence that any real product said it.\n\nClaim 1's own example reads: \"Lose up to 2 pounds\
  \ a day without diet or exercise.\"\n\nTurn 2 pounds a day into an energy requirement using\
  \ the static rule.\n\n```working\n    2 times 3500 = 7000\n```\n\n7,000 kilocalories a day,\
  \ every day, as fat alone.\n\nThomas and colleagues' pooled study put 103 adults on supervised\
  \ diets, with every calorie prescribed and measured. The largest average deficit anyone in\
  \ that pooled group sustained, across the whole cohort, over weeks, under total dietary control,\
  \ was 1,439 kilocalories a day.\n\nThe claim requires roughly five times the biggest deficit\
  \ ever measured in that supervised cohort, and it claims this happens \"without diet or exercise\"\
  \ — naming no route at all for where 7,000 kilocalories a day would come from.\n\nA person\
  \ starting a low-carbohydrate diet loses 3 kilograms in the first five days. Using the static\
  \ rule, that would require:\n\n```working\n    3 times 7716.18 = 23148.54\n    23148.54 divided\
  \ by 5 = 4629.71\n```\n\nAbout 4,630 kilocalories a day as fat, which is itself an implausible\
  \ deficit for most people over five days. But this loss is not a fat claim.\n"
illustration.analogy_breaks_when: 'This test rules claims out; it does not rule anything in.

  '
must_know[0].point: 'A deficit is bounded above by total expenditure for the period, because
  intake cannot go below zero.

  '
must_know[1].point: 'A claim that names no route for the energy — "without diet or exercise"
  is the common wording — has not merely failed to explain itself. It has claimed a crossing
  with no route, which this subject''s B0-R0-C33 already rules out for any boundary, a person''s
  included.

  '
must_know[2].point: 'Fast early weight loss, especially on a diet that cuts carbohydrate sharply,
  is often real and is often mostly glycogen and the water stored with it, not fat.

  '
must_know[3].point: 'When a journalist brings you a headline figure, ask for the time period
  before doing anything else.

  '
must_know[4].point: 'This check clears a claim of one specific defect, an energy impossibility.
  Say what the check did and did not do, every time you report its result.

  '
