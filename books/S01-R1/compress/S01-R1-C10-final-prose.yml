definition.text: '"Eat less, move more" is usually offered as an argument with an unstated premise. Written out

  in full it runs: the identity says the rate of change of stored energy equals intake minus

  expenditure (premise one). Cutting intake, with expenditure held fixed, therefore reduces

  stored energy (premise two, which is arithmetic and true). Conclusion: cutting intake and

  raising expenditure is a sufficient instruction for losing weight and keeping it off.


  The inference fails, and it fails at premise two''s hidden clause: "with expenditure held

  fixed". Intake and expenditure are not fixed once a person acts on the instruction; they move

  in response to the fall in stored energy, in the direction that opposes it, exactly as an

  earlier concept establishes.


  This is not a claim that the accounting is wrong.

  '
simplified_explanation: 'Stores go up when intake is bigger than expenditure, and down when it is smaller. So cut

  intake, or raise expenditure, and stores must fall.


  But the instruction says more than the arithmetic does. It says cut intake once, and stores

  keep falling on their own, because it quietly assumes expenditure stays where it was. Cut

  intake, and expenditure itself falls, further than the lost weight alone explains. Appetite

  rises, and pulls harder than expenditure falls.

  '
illustration.body: 'A national newspaper runs a quote from a well-known doctor: "Weight loss is just maths.

  Calories in, calories out. If someone isn''t losing weight, they aren''t sticking to the plan."


  Premise one: stored energy changes at a rate equal to intake minus expenditure. True; it is

  the identity.


  Premise two, left unsaid: once a person cuts intake, expenditure and appetite do not move.


  Conclusion: a person not losing weight has not really cut intake.


  The evidence in this booklet says premise two is false: expenditure falls further than the

  lost mass explains, and appetite rises by more again.


  The doctor''s quote does not misstate the arithmetic. It misstates what follows from it, by

  adding a premise that was never checked and is not true.

  '
illustration.analogy_breaks_when: 'This concept says the naive inference from the identity to the instruction fails; it does not

  say the instruction never works. Many people do lose weight and keep it off by eating less and

  moving more, sometimes with support this booklet has not covered.

  '
must_know[0].point: 'The identity is never in dispute and is never what breaks. State the identity and the

  instruction as two separate claims, every time, so the second one can be checked rather than

  assumed.

  '
must_know[1].point: '"They must not be sticking to it" is the same unlicensed move as the instruction itself: an

  observation (the scale has stalled) explained by inventing a premise (lack of effort) instead

  of checking the one already shown to be false.

  '
must_know[2].point: 'You can give this whole argument to a non-specialist in about three minutes, using no

  mechanism and no moral claim: the accounting is true, the instruction adds an assumption, the

  assumption is false, and the difficulty that follows is physiological.

  '
must_know[3].point: 'It gives you an argument to check, not a treatment plan; a plan needs the later rungs of

  this subject.

  '
