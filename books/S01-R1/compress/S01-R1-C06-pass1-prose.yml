definition.text: 'The one-sentence statement: a person''s energy stores change only by the energy that
  crosses

  the boundary drawn round them, and the rate of that change equals energy intake minus energy

  expenditure.


  An identity of this kind constrains the numbers on either side of it and names nothing else.

  The inference that most often gets attached to it — that a person should therefore

  eat less — does not follow from the identity alone. It needs a further premise, about what

  happens to expenditure and appetite when intake changes, that the identity itself is silent

  on.

  '
simplified_explanation: "Here is the whole identity again, in one line.\n\n```working\n    the change\
  \ in a person's energy stores = energy intake minus energy expenditure\n```\n\nRead it as a rule about\
  \ arithmetic, because that is all it is. It says the two sides have to\nmatch.\n\nA step people take\
  \ next, all the time, sounds almost like it follows from the line above. \"So\nif you want your stores\
  \ to stop rising, eat less.\" That step is a separate claim. The inference needs something the identity\
  \ never supplied\n— that cutting intake actually lowers the left-hand side, rather than expenditure\
  \ also falling\nto keep the difference where it was.\n\nWhatever the true answer is, it has to come\
  \ from evidence about bodies, not from\nthe accounting line.\n"
illustration.body: 'Lay the "eat less" step out the way `B0-R0-C42` teaches, as a premise, an inference,
  and a

  conclusion, and test the inference before asking whether the premise is true.


  *Premise:* the change in a person''s energy stores equals energy intake minus energy

  expenditure.


  *Conclusion:* if this person eats less, their energy stores will fall.


  Now ask the inference test''s question: does the conclusion follow?


  It does not, not on the premise alone. It says nothing

  about what happens to expenditure if intake is reduced. If expenditure stayed exactly where it

  was, the conclusion would follow. If expenditure fell by the same amount intake fell, the

  difference would stay where it was, and the conclusion would fail, while the identity held

  exactly as before.


  Picture the missing premise written out loud, the way `B0-R0-C42`''s own illustration does it:

  "and expenditure does not change when intake does." Nobody who makes the "eat less" argument

  usually says that sentence. It is doing the work anyway, hidden, and it is a claim about

  physiology, not a consequence of the accounting line above it.

  '
illustration.analogy_breaks_when: 'This illustration tests one inference, from one premise, and it does
  not settle whether "eat

  less" works as an instruction.


  The inference that fails is the one that adds a

  direction of control the identity never supplied.

  '
must_know[0].point: '"Energy in minus energy out" is a premise, not a conclusion.

  '
must_know[1].point: 'When you hear the identity used to defend a specific instruction, ask what has been
  assumed

  about expenditure that was never stated.

  '
must_know[2].point: 'The identity is consistent with every serious account of why weight changes, because
  every one

  of them can be written so the two sides balance.

  '
must_know[3].point: 'Do not let the identity stand in

  for an account of why it changed, which you may not have.

  '
must_know[4].point: 'Watch for the sentence

  doing the work of an inference nobody has actually made.

  '
must_know[5].point: 'When a journalist repeats "it''s just calories in, calories out", the accurate short
  reply is

  that the arithmetic is real and settles nothing about cause.

  '
