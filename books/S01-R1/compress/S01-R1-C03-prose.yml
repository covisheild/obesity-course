definition.text: 'An adult''s daily energy intake and daily energy expenditure are both, for most people,

  somewhere in the low thousands of kilocalories, a few megajoules to about ten of them.

  Three kinds of number carry that claim, and they are not the same kind of number.


  The first kind is a measurement of what a group of people actually spent. The doubly

  labelled water technique measures total energy expenditure directly, over ten to fourteen

  days, in free-living people going about their lives. Worked examples given for three

  populations put total energy expenditure at 8.26 megajoules a day (1,975 kilocalories) for

  a sedentary or lightly active group of women, 9.86 megajoules (2,355 kilocalories) for an

  active group, and 16.42 megajoules (3,925 kilocalories) for a vigorously active group of

  men.


  The second kind is an adopted requirement: a number a body of experts has set, not measured

  in the person in front of you. India''s Indian Council of Medical Research and National

  Institute of Nutrition set the adult energy requirement, as of 2020, at 2,110 kilocalories a

  day for a sedentary man and 1,660 for a sedentary woman, rising to 3,470 and 2,720 for heavy

  work. These are recommendations for a population, arrived at by a committee, current as of

  2020; they are not what any one measured person spent that day, and the next revision can

  move them.


  The third kind is a survey estimate of what households acquired, converted to energy

  through a nutrient conversion table. India''s National Sample Survey puts the all-India

  average acquisition at 2,233 kilocalories a person a day in rural areas and 2,250 in urban

  areas for 2022-23. This is what a household''s recorded food purchases convert to, not a

  measurement of what any individual ate or burned.


  A fourth number belongs here for a different reason: self-reported intake, a person''s own

  account of what they ate, is known to be unreliable, which is why the doubly labelled water

  technique exists in the first place.

  '
simplified_explanation: 'How much energy does one adult eat and burn in a day? The honest answer starts by asking

  which of three different questions you mean, because they give three different kinds of

  number.


  The first question is what somebody actually burned. There is a way to measure this directly,

  called doubly labelled water, and it tracks real people going about a real fortnight. In three

  groups it measured, the number came out between about 8 and 16 megajoules a day, which is

  roughly 2,000 to 4,000 kilocalories. Where in that range a person sits depends heavily on how

  active they are.


  The second question is what a committee recommends somebody eat. India''s own nutrition body

  sets a figure for this, and it depends on how physically demanding someone''s work is: around

  1,660 kilocalories a day for a woman doing sedentary work, 2,110 for a man doing sedentary

  work, rising past 2,700 for moderate work and past 3,400 for heavy work. This is a target, set

  by experts as of a particular year, not a measurement of any one person on any one day.


  The third question is what a household survey says people are getting hold of. India''s

  National Sample Survey estimates that, on average, a person in the country acquires a bit

  over 2,200 kilocalories a day, in food bought or grown by their household. That is close to

  the committee''s sedentary figure, but it is a different kind of number again: an estimate

  from purchases, not a measurement of a body.


  There is a fourth thing worth knowing before you trust any number a person tells you

  themselves. Ask somebody to report what they ate and the answer is known to be unreliable.

  That unreliability is exactly why doubly labelled water was invented: it does not ask anybody

  anything, it measures the person directly.


  So when somebody says "an adult needs about 2,000 kilocalories a day," hold onto the order of

  magnitude and let go of the idea that it is one fixed number. It moves with activity, it moves

  with body size, and different sources are answering different questions even when their

  numbers land close together.

  '
illustration.body: 'A clinic in an Indian town sees a sedentary adult man and a sedentary adult woman on the

  same morning. Neither has had their energy expenditure measured.


  Open the ICMR-NIN Brief Note on Nutrient Requirements for Indians, 2020, at

  https://www.nin.res.in/rdabook/brief_note.pdf, and search for sedentary work.


  > Sedentary work 2110 2320 -210

  > Sedentary work 1660 1900 -240


  The first row is men, the second women, and the number under ICMR 2020 is the one to use:

  2,110 kilocalories a day for him, 1,660 for her. Neither has been measured. Both figures are

  the committee''s recommendation, current as of 2020.


  Now put a number on what doubly labelled water would find in a comparable population. Open

  the FAO/WHO/UNU 2004 report''s chapter 5 at https://www.fao.org/4/y5686e/y5686e07.htm and

  search for sedentary or light activity.


  > If this PAL was from a female population, 30 to 50 years old, with mean weight of 55 kg

  > and mean BMR of 5.40 MJ/day (1 290 kcal/day), TEE = 1.53 x 5.40 = 8.26 MJ (1 975 kcal), or

  > 150 kJ (36 kcal)/kg/d.


  A measured group of sedentary or lightly active women averaged 1,975 kilocalories a day,

  within about three hundred kilocalories of the Indian committee''s 1,660 for the same

  activity band. The two numbers are close, and they are not the same number, because one is

  a direct measurement of a different population and the other is an Indian committee''s

  recommendation, current as of 2020.


  Now open the NSS Report 594 highlight at

  https://www.mospi.gov.in/sites/default/files/publication_reports/Nutritional_Intake_in_India_L.pdf

  and search for the All-India row of Table 3.1.


  > All-India 2233 2250 2212 2240 2407 2488 2383 2472


  The first figure, 2,233 kilocalories a day, is what an average Indian household''s recorded

  food purchases convert to per person, rural, 2022-23. It sits close to the committee''s

  figures too, and it is a third kind of number again: an estimate from what a household

  acquired, not a measurement of what one person burned or a target a committee set.


  Three numbers, all near 2,000 kilocalories, none of them answering the same question as the

  other two. Before you use any one of them, say out loud which of the three it is.

  '
illustration.analogy_breaks_when: 'Every figure quoted here belongs to a specific group, at a specific activity level, in a

  specific year. None is a universal daily number for "an adult", and none holds for a child,

  a pregnant woman or somebody doing heavy manual work without adjustment.


  The ICMR-NIN figures are current as of 2020 and can move at the next revision; they are a

  committee''s recommendation, not a law of physiology.


  The National Sample Survey figure measures what a household acquired, converted through a

  conversion table, not what any individual ate or absorbed.


  The doubly labelled water figures come from the specific populations described in each

  example - given mean weights and ages - and do not transfer to a different population

  without new measurement.


  This record does not say how the three kinds of number ought to be reconciled when they

  disagree, or which one to trust for an individual patient. That is a separate question.

  '
must_know[0].point: 'A daily energy figure is one of at least three different kinds of number: a direct

  measurement of what a group actually spent, a committee''s adopted recommendation, or a

  survey''s estimate of what households acquired. Before you repeat a figure, say which kind

  it is. Treating a recommendation as a measurement, or a household estimate as an

  individual''s intake, is the commonest way this number gets misused.

  '
must_know[1].point: 'India''s adopted adult energy requirement is set by activity level and sex, and it is

  current as of 2020: roughly 1,660 to 2,720 kilocalories a day for a woman, sedentary to

  heavy work, and 2,110 to 3,470 for a man. Quote it with its year, because a committee can

  revise it, as ICMR-NIN did against its own 2010 figures.

  '
must_know[2].point: 'A patient''s own account of what they ate is known to be unreliable. Do not treat a

  self-reported intake figure as though it carried the same weight as a doubly labelled water

  measurement; it does not, and the gap between the two is exactly why doubly labelled water

  exists.

  '
must_know[3].point: 'This record gives you the order of magnitude and the different kinds of source. It gives no

  method for predicting one person''s own requirement from their weight, age and activity, and

  no equation for basal metabolic rate. Do not use a population figure as an individual''s

  prescription.

  '
