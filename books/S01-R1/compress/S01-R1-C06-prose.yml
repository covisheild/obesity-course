definition.text: 'The one-sentence statement: a person''s energy stores change only by the energy that crosses

  the boundary drawn round them, and the rate of that change equals energy intake minus energy

  expenditure. `S01-R1-C05` derives this line; this record fixes what the line is and is not an

  argument for.


  An identity of this kind constrains the numbers on either side of it and names nothing else.

  It does not name which route energy took, why intake or expenditure moved, or which of the two

  changed first. Treat "energy in minus energy out" as a premise in the sense `B0-R0-C42` gives

  that word: a statement offered as true, from which a further statement is meant to follow by

  inference. The inference that most often gets attached to it — that a person should therefore

  eat less — does not follow from the identity alone. It needs a further premise, about what

  happens to expenditure and appetite when intake changes, that the identity itself is silent

  on.


  Because the identity fixes only the arithmetic, it is consistent with every account of why

  weight changes that respects conservation of energy: a body that overeats because of appetite

  signalling, a body whose expenditure falls in response to a change in intake, a body whose

  food environment changed around it. All of them can be written so the two sides balance. The

  identity cannot be used to choose among them, and treating it as though it already had is the

  fault this record exists to name.

  '
simplified_explanation: "Here is the whole identity again, in one line.\n\n```working\n    the change in a person's energy stores = energy intake minus energy expenditure\n```\n\nRead it as a rule about arithmetic, because that is all it is. It says the two sides have to\nmatch. It does not say which side moved first, or why, any more than \"the amount inside a\nboundary changes only by what crosses it\" said why a burner was lit.\n\nA step people take next, all the time, sounds almost like it follows from the line above. \"So\nif you want your stores to stop rising, eat less.\" That step is a separate claim. It is an\ninference, in the sense the section on arguments gave that word: a move from a premise to a\nconclusion. The premise here is true. The inference needs something the identity never supplied\n— that cutting intake actually lowers the left-hand side, rather than expenditure also falling\nto keep the difference where it was.\n\nNothing said here claims that inference is wrong. It says the identity by itself cannot tell you\nwhether it is right, because the identity is silent about what happens to expenditure when\nintake changes. Whatever the true answer is, it has to come from evidence about bodies, not from\nthe accounting line.\n\nAnd that silence cuts both ways. Anyone who tells a different story about why weight changes —\nappetite driven by hormones, expenditure that falls when a person eats less, an environment that\nmakes overeating easy — can write their story so the two sides of the line still balance. The\nidentity does not rule any of them out. It rules out only a story where the two sides fail to\nadd up, and almost nobody is telling that story.\n"
illustration.body: 'Lay the "eat less" step out the way `B0-R0-C42` teaches, as a premise, an inference, and a

  conclusion, and test the inference before asking whether the premise is true.


  *Premise:* the change in a person''s energy stores equals energy intake minus energy

  expenditure.


  *Conclusion:* if this person eats less, their energy stores will fall.


  Grant the premise. It is the identity from `S01-R1-C05`, and nothing about it is in dispute

  here. Now ask the inference test''s question: does the conclusion follow?


  It does not, not on the premise alone. The premise names two quantities, intake and

  expenditure, and says how their difference relates to the change in stores. It says nothing

  about what happens to expenditure if intake is reduced. If expenditure stayed exactly where it

  was, the conclusion would follow. If expenditure fell by the same amount intake fell, the

  difference would stay where it was, and the conclusion would fail, while the identity held

  exactly as before.


  Both of those are compatible with the one sentence in the premise. The identity cannot tell

  you which one happens in a real body. That is a separate, empirical question, and it belongs

  to concepts later in this rung, not to this one.


  Picture the missing premise written out loud, the way `B0-R0-C42`''s own illustration does it:

  "and expenditure does not change when intake does." Nobody who makes the "eat less" argument

  usually says that sentence. It is doing the work anyway, hidden, and it is a claim about

  physiology, not a consequence of the accounting line above it.

  '
illustration.analogy_breaks_when: 'This illustration tests one inference, from one premise, and it does not settle whether "eat

  less" works as an instruction. It may or it may not; that is an empirical question about how

  expenditure and appetite respond, and this record does not carry the evidence either way.


  It also does not mean every conclusion drawn from the identity is unsupported. "If a person''s

  energy stores fell over a stretch of time, then intake was below expenditure over that

  stretch, once both are counted correctly" does follow from the premise alone, because it says

  nothing about what caused either side to move. The inference that fails is the one that adds a

  direction of control the identity never supplied.


  And the missing-premise move stops working once somebody states the extra premise openly and

  defends it with evidence. At that point the argument no longer rests on the identity doing

  work it cannot do; it rests on whatever evidence was offered, which is a different thing to

  evaluate.

  '
must_know[0].point: '"Energy in minus energy out" is a premise, not a conclusion. The step from it to "so eat less"

  is a separate inference, and the identity alone does not carry it, because the identity says

  nothing about what expenditure does when intake changes.

  '
must_know[1].point: 'When you hear the identity used to defend a specific instruction, ask what has been assumed

  about expenditure that was never stated. Naming that hidden premise is usually the whole of

  the disagreement.

  '
must_know[2].point: 'The identity is consistent with every serious account of why weight changes, because every one

  of them can be written so the two sides balance. It cannot be used to choose between them, and

  citing it as if it settles a causal dispute settles nothing.

  '
must_know[3].point: 'In front of a patient or in public, keep the arithmetic and the explanation separate on

  purpose. Say what changed, in energy terms, if you know it. Do not let the identity stand in

  for an account of why it changed, which you may not have.

  '
must_know[4].point: 'A trainee who has just learned this identity will reach for "energy in, energy out" as an

  explanation the first time someone asks why a patient''s weight moved. Watch for the sentence

  doing the work of an inference nobody has actually made.

  '
must_know[5].point: 'When a journalist repeats "it''s just calories in, calories out", the accurate short reply is

  that the arithmetic is real and settles nothing about cause. That sentence is calibrated

  honesty, not a hedge, and it is more defensible in the room than either agreeing outright or

  dismissing the arithmetic.

  '
