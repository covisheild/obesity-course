id: S37-R1
number: 4
title: Food systems, value chains and Indian food policy · Rung 1
subtitle: Where food comes from, who decides, and what the state itself serves
cover_line: From field to plate, and the policies that built India's plate
status: frozen            # frozen | in progress
version: "1.0"
last_updated: 2026-09-25
why: |
  Most proposals to reduce obesity speak to the person holding the plate: eat less, choose better.
  But what is on the plate was decided long before, by people who grew, stored, processed, moved,
  priced and sold it, and by governments that shaped each of those steps. In India the state is
  also one of the largest cooks and grocers in the country, through rations, school meals and
  anganwadi food. This book maps that system, so that any intervention can be placed where it
  actually acts.
how_to_read: |
  Read Book 0 first, or at least the sections this book names as it goes. Then read this one in
  order: each section assumes everything before it. Keep one packaged food you eat often in mind
  from the first page; by the end you will sketch its supply chain yourself.
back_blurb: |
  A short book on the food system for readers who work on obesity. It follows food from production
  through storage, processing, distribution and retail to the plate and the waste bin; asks who
  decides what is available, at what price and where; and sets out the Indian food policy
  instruments, from the public distribution system to school meals, which were built to end hunger
  rather than excess.
