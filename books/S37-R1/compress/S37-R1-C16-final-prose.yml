definition.text: 'A food policy tool is any means by which a government changes what is grown, stored, traded,

  processed, sold, served or eaten. Some tools rest on a statute. Others rest on a government

  decision to run a scheme, or to set a price or a duty until the next change.


  ```table

  | Stage | Tool | Run by | Rests on |

  | Production | Minimum support price (MSP) for 22 mandated crops | Union Government, on the recommendation of the Commission for Agricultural Costs and Prices (CACP) | a decision announced each season |

  | Production | Procurement at MSP | Food Corporation of India (FCI) and State agencies for cereals; two national cooperative federations for pulses and oilseeds | the same decisions, and a price support scheme for pulses and oilseeds |

  | Production | Crop missions: oilseeds, oil palm, millets | Department of Agriculture and Farmers Welfare, with the States | schemes approved by the Union Government |

  | Storage | Buying, holding and moving the central pool of grain, and its buffer stock | FCI | an Act of 1964, under which FCI was set up in 1965 |

  | Storage and trade inside India | Limits on how much of a grain traders may hold (wheat, May 2025 to April 2026) | Government of India | an order; the release announcing it names no Act |

  | Trade across the border | Import duty; export restriction | Government of India | a duty change; its customs notification is not held here |

  | Processing and retail | Food standards and labels | Food Safety and Standards Authority of India (FSSAI) | Food Safety and Standards Act, 2006 |

  | Provision | Rations through the public distribution system (PDS) | Department of Food and Public Distribution, with the States | National Food Security Act, 2013 (NFSA) |

  | Provision | School meals, Pradhan Mantri Poshan Shakti Nirman (PM POSHAN) | Ministry of Education, with the States | a centrally sponsored scheme, 2021-22 to 2025-26 |

  | Provision | Anganwadi food, Saksham Anganwadi and Poshan 2.0 | Ministry of Women and Child Development, with the States | a scheme for 2021-22 to 2025-26 |

  | Tax | Goods and services tax (GST) rates | recommended by the GST Council | the Constitution, Article 279A |

  ```

  '
simplified_explanation: 'For each tool, ask four things. Where in the chain does it act? Who runs it? What does it stand

  on, a statute or a scheme with an end date? What does its own text say it is for?


  Ask the last question and a pattern shows. The tools on the farm, in storage and at the border say they are for

  supply, prices and farmers'' incomes. The tools at the plate say they are for nutrition, and where they name a

  problem it is hunger or undernutrition. Obesity turns up in these texts only as a theme of two awareness campaigns

  in 2025.

  '
must_know[0].point: '"India has no nutrition policy in agriculture" and "India''s food policy is nutrition policy"

  are both wrong as stated. Read each tool''s own purpose.

  '
must_know[1].point: 'For any food policy tool, write four things before you argue about it.

  '
must_know[2].point: 'Never repeat a duty, a price or a limit without its date. A Cabinet release of 3 October 2024

  put the duty on edible oils at 20%. The basic customs duty on crude palm oil was 10% from June

  2025, and 5% from the release of 24 September 2026.

  '
must_know[3].point: '"Import duty" can mean the basic customs duty, or what a text calls the effective duty.

  They are different numbers for the same oil. Say which one you mean, and check which one your

  source gives.

  '
must_know[4].point: 'The same food is touched by tools that pull different ways, run by different bodies. The

  oilseeds mission wants more oil grown at home. The 2026 duty cut wants cheaper

  oil in the shop. Before you propose a change, name which body owns the tool you want changed.

  '
must_know[5].point: 'Check what each tool stands on before relying on it. The food safety law and the food security

  Act are statutes. PM POSHAN and Poshan 2.0 were approved

  as schemes for 2021-22 to 2025-26. Whether and how they continue after March 2026 is not in

  this book''s sources, so look for the continuation before you cite either as current.

  '
must_know[6].point: 'Do not name the Act behind a stock limit from memory. Find the order itself and read what it

  says it is made under, or say that you have not seen it.

  '
must_know[7].point: 'The map tells you where a tool acts, who runs it and what it says it is for. It does not tell

  you what the tool does to what people eat.

  '
