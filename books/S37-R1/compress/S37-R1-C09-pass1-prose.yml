definition.text: |
  Section 2(10) of the National Food Security Act, 2013 defines the minimum support price
  (MSP). It is the assured price announced by the Central Government at which foodgrains are
  procured from farmers, for the central pool. Section 2(2) defines the central pool as the stock of foodgrains
  procured through minimum support price operations.

  The decision is taken by the Cabinet Committee on Economic
  Affairs (CCEA). Since 2018-19, following the Union Budget 2018-19 announcement, MSP has been
  set at not less than 1.5 times the all-India weighted average cost of production.

  Sugarcane has no MSP.

  Procurement differs by crop. Wheat and paddy that meet the prescribed specifications are
  bought at MSP by the Food Corporation of India (FCI) and State agencies. A farmer may sell to them or in the open market.

  MSP for wheat in rabi marketing season 2026-27 is Rs 2,585 per
  quintal (CCEA, 1 October 2025).
simplified_explanation: |
  Before each season the Union Government announces a minimum support price, or MSP, for 22
  crops. It does this in two rounds, one for the kharif crops and one for the rabi crops. Those
  are the names the releases use for India's two main crop seasons.

  A body of experts, the Commission for
  Agricultural Costs and Prices (CACP), recommends
  the price. A committee of the Cabinet fixes it.

  Here is the trap. An MSP is a price at which the government will buy. It is not a price every
  farmer gets.

  The grain that is bought goes into the central pool, the government's own stock. So
  what the state buys decides what it can hand out.

  Sugarcane is different. It has a fair and remunerative price (FRP), fixed the same way, which
  sugar mills must pay for the cane they buy.
must_know[0].point: |
  An MSP is the price at which government agencies will buy, not the price every grower is paid. When someone quotes an MSP as a
  farmer's income, ask how much of the crop was bought at it.
must_know[1].point: |
  MSP is announced for many
  crops. Procurement is concentrated in one.
must_know[2].point: |
  Say who fixed a price and for which season. A figure without its season is out of date the day the next decision comes.
must_know[3].point: |
  What the state buys at MSP is what it can put in
  a ration. A proposal to change the ration basket is also a proposal about procurement.
must_know[4].point: |
  Sugarcane has no MSP. Its price is the fair and remunerative price, and sugar mills pay it. Do not put sugarcane in a
  list of crops the government buys.
must_know[5].point: |
  "At least 1.5 times cost" is a floor. Paddy sits on it and wheat sits well above it.
must_know[6].point: |
  The cost in the MSP releases is the CACP's all-India weighted average, including imputed family
  labour. Do not call the margin over it a farmer's profit.
must_know[7].point: |
  The releases give national totals only. They cannot tell you which states the grain came from,
  how many growers sold at MSP, or what the rest were paid. Do not infer them from the MSP.
