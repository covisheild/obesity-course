definition.text: 'The National Food Security Act, 2013 gives meals as well as grain, each free of charge and each

  "so as to meet the nutritional standards specified in Schedule II".


  Section 4(a) entitles every pregnant woman and lactating mother to a meal during pregnancy and

  for six months after the birth, through the local anganwadi. Section 5(1)(a) entitles every

  child from six months to six years to an age-appropriate meal through the anganwadi. Section

  5(1)(b) entitles every child up to class VIII, or aged six to fourteen, to one mid-day meal on

  every school day.


  Section 7 has the States run these schemes under Central guidelines,

  "including cost sharing".


  Schedule II sets the standard for each group as energy in kilocalories and protein in grams.


  ```table

  | group | type of meal | energy (kcal) | protein (g) |

  | children, 6 months to 3 years | take-home ration | 500 | 12-15 |

  | children, 3 to 6 years | morning snack and hot cooked meal | 500 | 12-15 |

  | children, 6 months to 6 years, who are malnourished | take-home ration | 800 | 20-25 |

  | lower primary classes | hot cooked meal | 450 | 12 |

  | upper primary classes | hot cooked meal | 700 | 20 |

  | pregnant women and lactating mothers | take-home ration | 600 | 18-20 |

  ```


  Two Union schemes deliver meals of these kinds.


  Saksham Anganwadi and Poshan 2.0 is

  run by the Ministry of Women and Child Development. Its guidelines of 2022 issue under sections

  4(a), 5(1)(a), 6 and 7 of the Act.

  '
simplified_explanation: 'A pregnant woman gets a meal through her local anganwadi. So does a mother for six months after

  the birth. An anganwadi is a government child care centre. Every child

  from six months to six years gets a meal there too.


  PM POSHAN runs the school meal. Saksham Anganwadi and Poshan 2.0

  runs the anganwadi food. Some groups get a hot cooked meal (HCM) at the centre. Others get a

  take-home ration (THR): a prepared food handed out to be eaten at home.


  The Act sets each meal''s size in two numbers only: energy, in kilocalories, and protein, in grams.

  Each is an amount the meal must reach. Nothing in the Act sets an upper limit on energy, sugar,

  fat or salt.

  '
must_know[0].point: '"Anganwadi children get 500 kilocalories" is the old norm. The government says the Schedule II

  norms were revised in January 2023, and the revised figures are not in the documents this book

  holds.

  '
must_know[1].point: 'Every norm in Schedule II and in the school-meal table is an amount to reach. None is a

  ceiling. When a meal is criticised for too much energy, sugar or fat, there is no legal limit

  it has broken.

  '
must_know[2].point: 'The anganwadi guidelines say their own programme was "driven by calorie intake rather than on

  balanced diets".

  '
must_know[3].point: 'A take-home ration is a prepared food, not grain. The 2022 guidelines forbid raw rice, wheat or

  dal as a take-home ration.

  '
must_know[4].point: 'Mothers, children under three and severely malnourished children get a take-home ration.

  Children from three to six get a morning snack and a hot cooked meal at the centre.

  '
must_know[5].point: 'Centre and States share the anganwadi food bill. No document held gives PM POSHAN''s split. Do not guess it.

  '
must_know[6].point: 'Both schemes were approved for 2021-22 to 2025-26. Before you describe either scheme as it is today, find

  the current approval.

  '
