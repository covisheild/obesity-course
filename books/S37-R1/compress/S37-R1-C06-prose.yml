definition.text: 'Take one food and one stated period. A country''s supply of that food for use within the

  country is its production, plus its imports, minus its exports, minus the rise in its

  stocks over the period (or plus the fall). The Food and Agriculture Organization (FAO) uses this form, which

  it calls supply for domestic utilization, in its food balance sheets. It is a stock-and-flow

  identity: grain that went into store in the period was produced or imported but was not

  available for use.


  India''s official series of per capita net availability of foodgrains, published in the

  Economic Survey''s Statistical Appendix Table 1.19, applies the same identity with two

  further subtractions. Net availability is gross production, less seed, feed and wastage,

  less exports, plus imports, less the change in stocks. Net availability divided by the

  population gives per capita net availability in kilograms a year. Divided again by 365 it

  gives grams a day. The table states that these figures are not strictly representative of

  actual consumption.


  The FAO''s import dependency ratio (IDR) is imports divided by production plus imports

  minus exports, times 100. Its self-sufficiency ratio (SSR) is production divided by the

  same total, times 100. The two add to 100 only when exports are zero. A net imports figure,

  imports minus exports, is enough for the SSR and not enough for the IDR.

  '
simplified_explanation: 'Where does the food a country eats in a year come from? Three places. What it grew, what it

  bought from abroad, and what it had put away in store.


  So start with what was grown. Add what came in from abroad. Take off what went out. Then

  look at the stores. If the stores grew over the year, some of the harvest went into them and

  was not eaten, so take that off. If the stores shrank, the grain that came out was available,

  so add it on.


  That total, shared among everyone in the country, gives kilograms a person a year. Divide by

  365 and you have grams a person a day. India publishes exactly this for grains and pulses.


  Two percentages tell you how much a country leans on the rest of the world. Import

  dependence is the imported part of what a country kept for itself. Self-sufficiency is the

  home-grown part of the same total. If the country exports nothing, the two add to 100. If it

  exports, they do not.


  None of this says what anyone ate. It says what was there to be eaten.

  '
must_know[0].point: 'Production is not supply. What a country had to use in a year is production plus imports,

  minus exports, minus whatever went into store. Dividing the harvest by the population gave

  51 grams of pulses a person a day for 2022-23, against the official 47.1. Write the

  identity out before you argue about any one term in it.

  '
must_know[1].point: 'A rise in stocks is subtracted and a fall is added. The FAO''s handbook says so in as many

  words, and India''s table follows it. Getting the sign wrong moves the answer by twice the

  stock change.

  '
must_know[2].point: 'India''s official per capita net availability of foodgrains for 2022-23 is 568.8 grams a

  person a day (Economic Survey 2025-26, Table 1.19). It is what was there to be eaten, not

  what was eaten. The table itself says it is not strictly representative of consumption.

  '
must_know[3].point: 'India imported 56.25 per cent of its edible oil supply in 2023-24, by the government''s own

  figures: 15.66 million tonnes imported against 12.18 produced. For cereals it was a net

  exporter. When someone says India is self-sufficient in food, ask which food.

  '
must_know[4].point: 'Import dependence and self-sufficiency are not two halves of 100 unless the country

  exports nothing. The FAO''s handbook warns that one cannot be taken as the complement of

  the other. Work each out from its own formula.

  '
must_know[5].point: 'Run the identity on every row of a supply table before you use the row. Table 1.19''s rice

  row for 2022-23 misses its own total by 4,567 thousand tonnes, about 9 grams a person a day

  in the foodgrain headline. If a row does not close, say so and do not build a trend on it.

  '
must_know[6].point: 'Availability stops at the household door. The FAO''s waste element excludes waste in the

  household. India''s table does not say that its wastage includes waste at home, and it says

  its figures are not strictly representative of consumption. Do not use availability as

  intake, and do not use a national average for a state or a family.

  '
must_know[7].point: 'Import figures and import duties change on different dates. The edible oil releases of

  2024 and 2025 give duty rates that no longer apply. On 24 September 2026 the basic customs

  duty on crude soybean and palm oil was cut to 5 per cent. Put the date beside every trade

  figure you quote.

  '
