definition.text: 'A price wedge is a gap that a public decision opens between two prices of the same food.

  Three wedges are computed here, each by one rule.


  The margin of a minimum support price (MSP) over cost is the MSP minus the cost, divided by

  the cost, times 100. The cost is the all-India weighted average cost of production for that

  crop, as the Union government''s release states it. An MSP set at 1.5 times cost carries a

  margin of 50 per cent over cost.


  The subsidy on grain issued for the public distribution system is the economic cost minus the

  central issue price. The economic cost is what the grain costs the government to buy, store

  and move. The central issue price is the price at which the Union government issues the grain

  to the States. The share of the economic cost that is subsidy is the subsidy divided by the

  economic cost, times 100. Where the issue price is zero, the subsidy equals the economic cost.


  The landed price of an import under a duty charged as a percentage of its value is the price

  before duty times (1 plus the duty rate as a decimal).

  '
simplified_explanation: 'The government changes food prices in three ways that you can work out with a calculator.


  First, it sets a minimum support price (MSP) for a crop. That is the price at which its agencies

  stand ready to buy. The Union government says each MSP is at least one and a half times the cost

  of growing the crop. That extra half is the margin. It is a percentage of the cost, not of the

  price, and that choice of base changes the number a great deal.


  Second, it sells grain to ration-card holders for less than the grain cost it. The gap between

  the two is the subsidy. The full cost of buying, storing and moving the grain is called the

  economic cost. Since 1 January 2023 the grain under the National Food Security Act (NFSA) has

  been free, so the subsidy is now the whole economic cost.


  Third, it charges a duty on imports, as a percentage of their value. The price at the port after

  duty is called the landed price. It is the price before duty, made bigger by the duty''s share.


  Each rule is one line of arithmetic. The hard part is the base. Always ask: a percentage of what?

  '
must_know[0].point: '"MSP gives a 50 per cent margin" is true only over cost. The same gap is a third of the price.

  When anyone quotes an MSP margin at you, ask for the base, and quote the base yourself.

  '
must_know[1].point: 'The economic cost of rice for 2025-26 is Rs 4173.34 a quintal, the Food Ministry''s budget

  estimate in its December 2025 bulletin. That is about Rs 41.73 a kg. With the issue price at

  zero since 1 January 2023, all of it is subsidy.

  '
must_know[2].point: 'With free grain, a higher MSP does not change what the ration-card holder pays. It raises the

  economic cost, and so the subsidy. Say this when someone argues that MSP makes ration grain

  dearer.

  '
must_know[3].point: 'A duty cut from 10 to 5 per cent is a fall of 5 percentage points in the duty. It is not a 50

  per cent fall in anything a shopper pays. Work out the landed price before and after, and

  quote the change in that.

  '
must_know[4].point: 'Government releases on edible oil use two terms, "basic customs duty" and "effective customs

  duty", and they are not the same charge. Before you compute a landed price from a duty figure,

  find which one it is, and say it.

  '
must_know[5].point: 'A paddy MSP and a rice economic cost are prices of different goods. Paddy is milled before it

  becomes rice. Never subtract one from the other, however neat the answer looks.

  '
must_know[6].point: 'These rules stop at the edge of the government''s books: the border, the procurement centre,

  the ration shop. They cannot tell you the price in an ordinary shop. The margins along the

  chain, from the section on the price build-up, sit between the wedge and the plate. For that

  you need a measured retail price.

  '
must_know[7].point: 'An MSP margin is over an all-India average cost. It says nothing about one farmer''s margin,

  or about a farmer who never sold to a procurement agency. Do not carry it to a district or a

  household without saying so.

  '
