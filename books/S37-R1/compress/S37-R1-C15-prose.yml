definition.text: 'Undernutrition and overweight are measured with different yardsticks. India''s National

  Family Health Survey, fifth round (NFHS-5, 2019-21), uses these. A child under five is

  stunted when height-for-age is more than two standard deviations below the World Health

  Organization (WHO) growth standard. The child is wasted when weight-for-height is more than

  two standard deviations below it, and underweight when weight-for-age is. The child is

  overweight when weight-for-height is more than two standard deviations above it. An adult aged

  15 to 49 has a below-normal body mass index (BMI) below 18.5 kg/m^2, and is overweight or obese

  at 25.0 kg/m^2 or more. Anaemia is haemoglobin, in grams per decilitre (g/dl), below 11.0 in a

  child of 6 to 59 months, below 12.0 in a non-pregnant woman and below 13.0 in a man.


  By those yardsticks NFHS-5 found, for India, 35.5 per cent of children under five stunted,

  19.3 per cent wasted, 32.1 per cent underweight and 3.4 per cent overweight. Among women aged

  15 to 49, 18.7 per cent had a below-normal BMI and 24.0 per cent were overweight or obese. Among

  men of the same ages the figures were 16.2 and 22.9 per cent. Anaemia was found in 67.1 per

  cent of children aged 6 to 59 months. It was found in 57.0 per cent of all women aged 15 to 49

  (57.2 per cent of those not pregnant) and in 25.0 per cent of men of the same ages.


  The WHO calls the coexistence of undernutrition (wasting, stunting, micronutrient deficiency)

  with overweight, obesity or diet-related noncommunicable diseases the double burden of

  malnutrition. It can occur in one person, one household or one population.


  A double-duty action, in the WHO''s words, is an intervention, programme or policy with the

  potential to reduce the risk or burden of both at once. The WHO sets out three levels. Do no

  harm: check that an existing action does not raise the risk of the other forms. Retrofit: change

  an existing action so that it also acts on the other burden. De novo: design a new action for

  both from the start.


  This book adds two reading words, in plain terms, for sorting a proposed change to a ration, a

  school meal or a take-home ration. They are this book''s tools, not an official classification.

  A single-duty change acts on one burden and neither aims at nor checks the other. A change

  working against the other burden acts on one and raises the risk of the other. The WHO''s first

  level, do no harm, is the check that catches it.


  The Lancet Commission of 2019 widened the frame into the Global Syndemic: obesity,

  undernutrition and climate change as epidemics that occur together, interact and share

  drivers. That frame is taken up at rung 2.

  '
simplified_explanation: 'India is often described as having a hunger problem. It also has an overweight problem. The

  same national survey finds both, and finds them in large numbers.


  In the survey of 2019-21, about a third of children under five were too short for their age.

  That is stunting, the mark of long undernutrition. In the same survey about a quarter of women

  aged 15 to 49 were overweight or obese. Having both at once, in one country, is called the

  double burden of malnutrition. It can also happen inside one household, or in one person.


  A programme built against one burden can feed the other. A ration or a meal designed only to

  fill a calorie gap can add to overweight where overweight is rising. The World Health

  Organization''s answer is double-duty action: programmes that work on both at once.


  It gives three ways to get there. First, do no harm: check that what you already run is not

  making the other burden worse. Second, retrofit: change what you already run so it also works

  on the other. Third, build something new for both from the start.


  This book adds two words of its own for sorting a proposed change. A single-duty change works

  on one burden and ignores the other. A change working against the other burden fixes one and

  makes the other worse.

  '
must_know[0].point: '"India''s problem is hunger; obesity is for rich countries" is wrong on India''s own survey. In

  NFHS-5 (2019-21) more than a third of children under five were stunted. In the same survey a quarter of

  women aged 15 to 49 were overweight or obese. Say both in the same breath, every time.

  '
must_know[1].point: 'Between NFHS-4 and NFHS-5 the share of women aged 15 to 49 who were overweight or obese rose from

  20.6 to 24.0 per cent. In the same years the share with a below-normal BMI fell. The burden is

  moving, not only sitting. So a programme designed for the burden as it was can be wrong for the

  burden as it is.

  '
must_know[2].point: 'Add prevalence rows only when nobody can sit in both. A woman''s BMI cannot be below 18.5 and 25.0

  or more at once, so those rows add. A child can be both stunted and underweight, so those rows do

  not. A sum of overlapping rows counts the same child twice.

  '
must_know[3].point: 'A national fact sheet shows the two burdens in one population. It cannot show that they sit in

  the same household or the same person. Do not claim a household-level double burden from

  it. That claim needs the survey''s unit-level data, cross-tabulated.

  '
must_know[4].point: 'NFHS-5''s adult rows cover only ages 15 to 49, and give "overweight or obese" as one figure. Never

  quote 24.0 per cent as "the obesity rate among Indian women". It is overweight and obesity

  together, in women of reproductive age.

  '
must_know[5].point: 'Someone proposes a change to a ration, a school meal or a take-home ration. Before you back it,

  ask the WHO''s first question out loud: does it raise the risk of the other burden? A change that adds energy and

  nothing else, in a population where overweight is rising, fails that check.

  '
must_know[6].point: 'The anganwadi guidelines describe their predecessor as built for "calorie sufficiency,

  neglecting quality and diversity of diets". A calorie norm with nothing else is a single-duty

  design. Quote the state''s own sentence when you argue that the schemes need retrofitting.

  '
must_know[7].point: '"Single-duty" and "working against the other burden" are this book''s words for sorting a change.

  No source quoted here adopts them as a classification. Define them when

  you use them in a committee, or a hostile reader will ask whose terms they are.

  '
