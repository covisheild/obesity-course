definition.text: 'The National Food Security Act, 2013 (Act 20 of 2013) makes a quantity of grain a legal entitlement.

  Under section 3(1), every person in a priority household is entitled to five kilograms of foodgrains per

  person per month, at the prices in Schedule I. Households under the Antyodaya Anna Yojana are entitled

  instead to thirty-five kilograms per household per month.


  Section 2(5) defines foodgrains as rice, wheat or coarse grains, or any mix of them.


  Section 3(2) extends the entitlement to up to seventy-five per cent of the rural population and up to

  fifty per cent of the urban population. Under section 10 the State Government identifies the Antyodaya

  households and the priority households within it.


  Since 1 January 2023 the grain has been issued free, by decision of the Union government under

  the Pradhan Mantri Garib Kalyan Anna Yojana. That decision was extended on 29 November 2023 for

  five years from 1 January 2024.

  '
simplified_explanation: 'Since 2013, a set quantity of grain each month has been a legal right for most Indians. The

  law is the National Food Security Act (NFSA).


  There are two kinds of eligible household. The poorest are Antyodaya households. They get 35 kg

  of grain a month for the whole household. The rest are priority households. They get 5 kg a

  month for each person in the household.


  The grain comes from a fair price shop, a licensed ration shop.


  The Act set a price of at most Rs 3 a kg for rice. Since January 2023 the grain has been free.

  That came from a Union government decision, not from a change in the Act.

  '
must_know[0].point: '"Five kilograms a person" is the priority-household rule only. Say which household you mean

  whenever you quote the entitlement.

  '
must_know[1].point: 'About 81.35 crore people, that is 813.5 million, are to get free grain for five years from 1

  January 2024. That was the Cabinet decision of 29 November 2023.

  '
must_know[2].point: 'The quantity is a legal right. The zero price is not. The Act caps the price; the Cabinet made

  it zero, to the end of 2028.

  '
must_know[3].point: 'The Act''s grain is cereal only: rice, wheat or coarse grains. Pulses, oil and vegetables are

  not in section 3 at all.

  '
must_know[4].point: 'The Food Ministry itself calls the public distribution system "supplemental". Never work out

  a household''s diet from its ration alone.

  '
must_know[5].point: 'Seventy-five per cent rural and fifty per cent urban are national ceilings, "up to". They are

  not the share covered in any one State.

  '
must_know[6].point: 'If the grain does not come, section 8 entitles the household to a food security allowance

  from the State.

  '
