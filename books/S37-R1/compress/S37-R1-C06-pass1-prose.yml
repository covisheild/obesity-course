definition.text: 'Take one food and one stated period. A country''s supply of that food for
  use within the country is its production, plus its imports, minus its exports, minus the rise
  in its stocks over the period (or plus the fall).


  Net availability is gross production, less seed, feed and wastage, less exports, plus imports,
  less the change in stocks. Net availability divided by the population gives per capita net
  availability in kilograms a year. Divided again by 365 it gives grams a day. The table states
  that these figures are not strictly representative of actual consumption.


  The FAO''s import dependency ratio (IDR) is imports divided by production plus imports minus
  exports, times 100. Its self-sufficiency ratio (SSR) is production divided by the same total,
  times 100. The two add to 100 only when exports are zero.

  '
simplified_explanation: 'Where does the food a country eats in a year come from? Three places.
  What it grew, what it bought from abroad, and what it had put away in store.


  So start with what was grown. Add what came in from abroad. Take off what went out.


  Two percentages tell you how much a country leans on the rest of the world. If the country
  exports nothing, the two add to 100. If it exports, they do not.


  None of this says what anyone ate. It says what was there to be eaten.

  '
must_know[0].point: 'Production is not supply. Write the identity out before you argue about
  any one term in it.

  '
must_know[1].point: 'A rise in stocks is subtracted and a fall is added. Getting the sign wrong
  moves the answer by twice the stock change.

  '
must_know[2].point: 'India''s official per capita net availability of foodgrains for 2022-23
  is 568.8 grams a person a day (Economic Survey 2025-26, Table 1.19). It is what was there
  to be eaten, not what was eaten.

  '
must_know[3].point: 'India imported 56.25 per cent of its edible oil supply in 2023-24, by the
  government''s own figures: 15.66 million tonnes imported against 12.18 produced. When someone
  says India is self-sufficient in food, ask which food.

  '
must_know[4].point: 'Import dependence and self-sufficiency are not two halves of 100 unless
  the country exports nothing. Work each out from its own formula.

  '
must_know[5].point: 'Run the identity on every row of a supply table before you use the row.
  If a row does not close, say so and do not build a trend on it.

  '
must_know[6].point: 'Availability stops at the household door. Do not use availability as intake,
  and do not use a national average for a state or a family.

  '
must_know[7].point: 'Import figures and import duties change on different dates. Put the date
  beside every trade figure you quote.

  '
