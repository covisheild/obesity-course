definition.text: 'The Indian state does not only regulate food. Through three channels it also buys, stores,

  cooks and hands out food, to a large share of the population.


  The first is the public distribution system (PDS) under the National Food Security Act, 2013 (NFSA). On 29 November 2023 the Union

  Cabinet decided to give free foodgrains to about 81.35 crore (813.5 million) beneficiaries under the Pradhan Mantri Garib Kalyan Anna

  Yojana (PMGKAY) for five years from 1 January 2024.


  The second is PM POSHAN (Pradhan Mantri Poshan Shakti Nirman), the school meal scheme earlier called the mid-day meal. The DFPD

  allocated it 22.31 lakh tonnes of foodgrains for 2025-26.


  The third is supplementary nutrition at anganwadi centres, under Mission Saksham Anganwadi and Poshan 2.0. As on March 2026 the

  mission''s tracking system followed nearly 14,03,170 (about 1.4 million) anganwadi centres and about 8,95,29,425 (about 89.5 million)

  eligible beneficiaries.


  In each channel the state decides which foods go in: which grain, which recipe, what may and may not be added. Each such decision

  changes what very many people eat. So what the state buys and serves is nutrition policy, whether or not it is called that. Hostels,

  public hospitals and government canteens are the same lever. The DFPD allocates grain to welfare institutions and hostels, 5.83 lakh

  tonnes for 2025-26.

  '
simplified_explanation: 'The earlier sections showed what each scheme promises one person: a ration, a school meal, an

  anganwadi meal or packet. This one steps back and asks how big the whole thing is.


  It is very big. The ration reaches about 81 crore people, that is about 810 million.


  That makes the state one of the largest buyers, cooks and grocers in the country. It writes the

  rules for what an anganwadi may cook, down to whether it may use white sugar.


  So a decision about a scheme''s menu is a decision about the country''s diet.

  '
must_know[0].point: '"The state regulates food; people choose what to eat" misses most of Indian food policy. A

  change to what a scheme hands out changes what millions eat.

  '
must_know[1].point: 'Never add the beneficiaries of the ration, the school meal and the anganwadi to get "people

  the state feeds". The same child can sit in all three counts, and the counts come from

  different years.

  '
must_know[2].point: 'For 2025-26 the Union government allocated 607.40 lakh tonnes of foodgrains, about 61 million

  tonnes, by its Food Department''s own table. The report''s text says 595.05. When text and table

  disagree, quote the table and say which figure you used.

  '
must_know[3].point: 'As on March 2026 the anganwadi programme tracked about 14 lakh centres and 8.95 crore eligible

  beneficiaries. A single line in its guidelines, such as "white sugar should not be used",

  reaches all of them.

  '
must_know[4].point: 'The anganwadi guidelines say in their own words that the earlier programme focused on "calorie

  sufficiency, neglecting quality and diversity of diets". Quote the state''s own sentence when you

  argue that its food schemes were built for hunger.

  '
must_know[5].point: 'Allocated is not lifted, and lifted is not eaten. So grain figures tell you what the state

  moved, never what anyone ate.

  '
must_know[6].point: 'A guideline is not a plate. The Union writes the norms and the States run the kitchens. Before

  you claim a scheme serves millets or avoids sugar, ask for evidence of what was served, not

  what was written.

  '
