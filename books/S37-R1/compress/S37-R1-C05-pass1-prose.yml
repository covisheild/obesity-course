definition.text: 'The food environment is the part of the food system where a person meets it.
  The definition used here is that of the High Level Panel of Experts on Food Security and Nutrition
  (HLPE). It names four key elements that influence food choice: availability and physical access
  (proximity); economic access (affordability); promotion, advertising and information; and
  food quality and safety.


  Each element is set, before the consumer arrives, by decisions taken by actors further up
  the supply chain and by the state.


  This is an observed feature of how the chains are organised, not a derivation.

  '
simplified_explanation: 'Stand at a vegetable cart or a kirana shelf and look at what is there.
  Somebody decided what would be on it before you walked up.


  A farmer decided what to plant. A state market committee set the fee on the first sale. A
  shopkeeper decided what to stock, at what mark-up, and what to put at eye level.


  The place where all these decisions meet you is called the food environment. It has four parts
  that affect what you pick. What is there, and how near? What does it cost? How is it promoted?
  What quality is it?


  You still choose. But you choose from a shelf that others filled. So when you want to know
  why people eat what they eat, ask about the shelf as well as the person.

  '
must_know[0].point: '"People eat what they choose" leaves out half of it. People choose among
  what is there, at the price it is, promoted as it is, in the place it is sold. Others decided
  each of those first. Say both halves when you explain a diet.

  '
must_know[1].point: 'For any food on a plate, ask four questions in order. Then name who decided
  each. A question you cannot answer is a gap in the evidence, not a gap in the person.

  '
must_know[2].point: 'Advice reaches only the last decision: the pick from the shelf. When a
  plan relies on advice alone, name the decisions it leaves alone.

  '
must_know[3].point: 'In clinic, treat a patient''s account of what is sold near home, and at
  what price, as evidence about their food environment. It tells you which advice they can act
  on.

  '
must_know[4].point: 'In India a state body sets part of the price at the first sale.

  '
must_know[5].point: 'Some choices are made before planting. A policy aimed at farmers'' crop
  choices has to deal with whoever signed the contract.

  '
must_know[6].point: 'This method names who decides. It does not measure how much any one decision
  changes what people eat. Do not supply the number yourself.

  '
