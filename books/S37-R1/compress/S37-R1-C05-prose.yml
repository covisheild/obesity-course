definition.text: 'The food environment is the part of the food system where a person meets it. The

  definition used here is that of the High Level Panel of Experts on Food Security and

  Nutrition (HLPE). The food environment is the physical, economic, political and

  socio-cultural context in which consumers engage with the food system to make their

  decisions about acquiring, preparing and consuming food. It names

  four key elements that influence food choice: availability and physical access

  (proximity); economic access (affordability); promotion, advertising and information; and

  food quality and safety.


  Each element is set, before the consumer arrives, by decisions taken by actors further up

  the supply chain and by the state. The HLPE states that the decisions of actors at any

  stage influence the types of food available and accessible. It also states that consumer

  behaviour is shaped by the existing food environment as well as by personal preference.


  In the Indian chains the Reserve Bank of India (RBI) studied in 2024, these decisions are

  observable. State Agricultural Produce Marketing Committees (APMCs) fix the fees and

  commission charges at the first sale. Processors and aggregators contract for crops before

  harvest. Integrator companies market the birds of most broiler farmers. Processors spend on brand

  promotion. Retailers set the final mark-up. The consumer chooses among the options these

  decisions leave.


  This is an observed feature of how the chains are organised, not a derivation. It would be

  overturned by evidence that what people buy does not depend on what is stocked, priced,

  promoted and sold near them.

  '
simplified_explanation: 'Stand at a vegetable cart or a kirana shelf and look at what is there. Somebody decided what

  would be on it before you walked up.


  A farmer decided what to plant. A company may have signed for the crop before it was even

  sown. A trader decided which grade of onion went to which city. A state market committee set

  the fee on the first sale. A processor decided the recipe, the pack size and how much to

  spend on the brand. A shopkeeper decided what to stock, at what mark-up, and what to put at

  eye level.


  The place where all these decisions meet you is called the food environment. It has four

  parts that affect what you pick. What is there, and how near? What does it cost? How is it

  promoted? What quality is it?


  You still choose. But you choose from a shelf that others filled. So when you want to know

  why people eat what they eat, ask about the shelf as well as the person.

  '
must_know[0].point: '"People eat what they choose" leaves out half of it. People choose among what is there,

  at the price it is, promoted as it is, in the place it is sold. Others decided each of

  those first. The HLPE''s own wording is that consumer behaviour is "also shaped by the

  existing food environment". Say both halves when you explain a diet.

  '
must_know[1].point: 'For any food on a plate, ask four questions in order. What was there, and how near? What

  did it cost? How was it promoted? What quality was it? Then name who decided each. A

  question you cannot answer is a gap in the evidence, not a gap in the person.

  '
must_know[2].point: 'Advice reaches only the last decision: the pick from the shelf. It does not change what

  was stocked, what it cost, how it was sold or where. When a plan relies on advice alone,

  name the decisions it leaves alone. The World Cancer Research Fund keeps a list of ten

  policy areas called NOURISHING. It files advice and counselling in health care under

  behaviour change, apart from the food environment.

  '
must_know[3].point: 'In clinic, treat a patient''s account of what is sold near home, and at what price, as

  evidence about their food environment. Do not talk past it. It tells you which advice

  they can act on.

  '
must_know[4].point: 'In India a state body sets part of the price at the first sale. APMCs fix mandi fees and

  commission charges, and on the RBI''s onion route to Delhi these were 1 and 4 per cent. The

  state is also a seller in its own right, through school, hospital and public canteens.

  '
must_know[5].point: 'Some choices are made before planting. Processors contract potato farmers, pre-harvest

  contractors fix mango prices before harvest, and around 70 per cent of broiler farmers sell

  through integrator companies. A policy aimed at farmers'' crop choices has to deal with

  whoever signed the contract.

  '
must_know[6].point: 'This method names who decides. It does not measure how much any one decision changes what

  people eat. When someone claims a shelf rule or a price change will cut intake by a stated

  amount, ask for the study that measured it. Do not supply the number yourself.

  '
