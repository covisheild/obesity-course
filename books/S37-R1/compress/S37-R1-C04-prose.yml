definition.text: 'The retail price of a unit of food is the price paid for it at the shop. The farm-gate

  price is the price the farmer received at the first sale. The retail price can be split

  into the farm-gate price and the amounts added at every later stage: fees and

  commissions, labour, transport, losses, processing, packing, and each trader''s own share.

  Retail price equals the farm-gate price plus the sum of everything added after it.


  An actor''s mark-up on a unit is its selling price minus its buying price. The mark-up pays

  for that actor''s own costs of handling the unit, such as transport, fees and losses, and

  what is left after those costs is the actor''s margin. The two coincide only for an actor

  whose only cost is the buying price.


  A mark-up or a margin can be written as a percentage only against a stated base. The two

  bases in use are the actor''s buying price, a mark-up on cost, and the actor''s selling

  price, a share of the selling price. The same rupees give the larger percentage on the

  smaller base, which is always the buying price.


  The farmer''s share of the consumer rupee is the farm-gate price divided by the retail

  price, times 100: the part of each Rs 100 paid at the shop that reaches the farmer. It is

  a gross figure. The farmer''s own costs of growing the crop and taking it to market are

  paid out of it.

  '
simplified_explanation: 'Take a kilogram of dal at a shop. Some of what you pay went to the farmer who grew it. The

  rest was added on the way. A fee at the market yard, a commission, a lorry, a mill, a

  packet, a wholesaler and the shopkeeper each added something.


  Every one of those hands bought the dal at one price and sold it at a higher one. The gap is

  its mark-up. The mark-up is not all profit. Out of it that hand paid for its own lorry, its

  own labour, its own losses. What is left after that is its margin.


  A mark-up is often given as a percentage, and here is the trap. Six rupees added to a price

  of 65 is about 9 per cent of 65. The same six rupees is about 8 per cent of the 71 the

  shopkeeper sells at. Both are true. So whenever you see a percentage, ask what it is a

  percentage of.


  The farmer''s share of the consumer rupee is the farmer''s price divided by the shop price.

  If it is 75 per cent, then of every Rs 100 you pay, Rs 75 went to the farmer. The farmer

  still has to pay for seed, labour and the trip to the market out of that Rs 75.

  '
must_know[0].point: '"Farmers get a third, so middlemen pocket two-thirds" is wrong in its second half. The

  two-thirds are mark-ups, and a mark-up pays for transport, fees, loading and losses before

  anyone keeps anything. In the RBI''s tomato chain, traders'' mark-up was 21.3 per cent and

  their margin 5.3 per cent. Ask for the split into cost and margin before you call any

  part of the rupee profit.

  '
must_know[1].point: 'Ask what a percentage mark-up is a percentage of. On the buying price it is always larger

  than the same rupees as a share of the selling price. Rs 16 on tur is 16.8 per cent on

  cost and 14.4 per cent of the shop price. Two people quoting those two numbers may not

  disagree at all.

  '
must_know[2].point: 'For tomato, onion and potato sold in big Indian cities, farmers received about a third of

  what the consumer paid. The RBI''s 2024 paper puts tomato at 33.5 per cent. For gram, its

  pulses paper found about 75 per cent. Quote the food, the route and the year with the number.

  '
must_know[3].point: 'The RBI papers tie the low farmer''s share of vegetables to perishability. Suppose a

  proposal raises it by cutting out a stage. It then has to say who carries the spoilage,

  the storage and the display that the stage was paying for.

  '
must_know[4].point: 'Check who the paper counted as the farmer. The RBI''s poultry-meat figure of 56 per cent is

  for farmers and aggregators together. A broiler farmer under contract gets about 5 to 6

  per cent. The two numbers describe the same chicken.

  '
must_know[5].point: 'The farmer''s share is measured on one route in one period. The vegetable paper itself

  stresses the "high price volatility" of tomato, onion and potato. Do not use the share as

  the one in your district or this season. It cannot say whether the farmer made a profit,

  because the farmer''s costs come out of it. It cannot say whether any stage is overpaid,

  because it does not split mark-ups into cost and margin.

  '
must_know[6].point: 'Before dividing a farm price by a shop price for a processed food, turn both into the same

  thing. Mango pulp sold by the half-kilogram is set against the kilogram of fruit it came

  from. Skip that step and the farmer''s share comes out at half its size.

  '
