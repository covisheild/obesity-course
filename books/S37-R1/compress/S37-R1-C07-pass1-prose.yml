definition.text: |
  Its headline figure is the monthly per capita
  consumption expenditure (MPCE): a household's spending in a month, divided by the number of
  people in it. The share of a food group in MPCE is the group's MPCE divided by total MPCE,
  times 100.

  In 2022-23, food took 46.38 per cent of MPCE in rural India and 39.17 per cent in urban
  India. Cereals and cereal substitutes took 10.75
  per cent of rural MPCE in 2011-12 and 4.91 per cent in 2022-23. The group "beverages,
  refreshments and processed food" rose from 7.90 to 9.62 per cent rural and from 8.98 to 10.64
  per cent urban over the same years.

  These are shares of rupees spent, at the prices of each survey year, as the respondents
  reported them.

  The National Sample Survey's Report 594 converts the food each household recorded as
  consumed into energy with a conversion table. It gives an all-India average of 2,233
  kilocalories a person a day in rural areas in 2011-12 and 2,212 in 2023-24.
simplified_explanation: |
  Two government surveys tell you most of what is known about Indian food at the scale of the
  country. Neither weighs anybody's plate.

  The first asks households what they spent. Divide what went on one kind of food by what went
  on everything, and you have that food's share of the budget.

  The second survey takes the food each household said it used. It turns those amounts into
  kilocalories with a table of how much energy each food holds. Across the same years its average hardly moved: about 2,200
  kilocalories a person a day.

  The budget changed shape a
  great deal. The energy total barely changed. A share of spending is a share of rupees. It is
  not kilograms and it is not kilocalories. Before you say what Indians eat, say which of these
  numbers you are reading.
must_know[0].point: |
  A falling share of spending is not a falling amount eaten. Cereals' share of rural MPCE
  halved between 2011-12 and 2022-23 while the rupees spent on them rose.
must_know[1].point: |
  Say points or per cent, every time. Cereals fell 5.84 percentage points in the rural
  budget, which is a fall of about 54 per cent of the old share.
must_know[2].point: |
  Beverages, refreshments and processed food is the largest food group in Indian household
  spending. It includes purchased cooked meals. Do not quote it as spending on packaged snacks alone.
must_know[3].point: |
  The headline shares leave out the value of grain received free through welfare programmes.
  When you read cereal spending among poorer households, find the survey's second
  set of estimates, the one that imputes free items.
must_know[4].point: |
  Both surveys count what a household bought or used, not what each person ate.
must_know[5].point: |
  Before you set two rounds side by side, check that they measured the same way. Ask which table each calorie figure came
  from.
must_know[6].point: |
  When someone cites the nutrition transition for India, ask for the Indian numbers.
