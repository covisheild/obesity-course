definition.text: |
  The High Level Panel of Experts on Food Security and Nutrition (HLPE) of the Committee on World
  Food Security adopted a definition of a food system in 2014. A food system "gathers all the elements (environment, people, inputs,
  processes, infrastructures, institutions, etc.) and activities that relate to the production,
  processing, distribution, preparation and consumption of food, and the output of these
  activities, including socio-economic and environmental outcomes".

  It lists the chain's steps
  as production; storage and distribution; processing and packaging; and retail and markets.

  This book reads the system as eight stages: production, storage, processing, distribution,
  retail, preparation, consumption and waste.
simplified_explanation: |
  A food system is everything that happens to food, and everyone who does it, from the field to
  the bin.

  Start with the plate in front of you and walk backwards. Someone cooked it. Before that, someone
  bought the food from a shop or a cart. Before that, it was moved by truck. Before all of that, a farmer grew it.

  Call each of them an actor — anyone whose
  decision moves the food on. Each step takes things in, such as seed, fuel or grain. Each sends
  things out, such as grain, flour or a cooked meal.

  As with any system (Book 0, E3), you choose where to draw the line round it.
must_know[0].point: |
  "Food system" is often heard as "farming". It is not. Farming is one stage of eight. When someone says a problem "comes
  from the food system", ask which stage they mean.
must_know[1].point: |
  Do not use "supply chain" and "food system" as if they were one thing. HLPE's supply chain
  steps stop at retail and markets. A claim about the supply chain says nothing about the kitchen.
must_know[2].point: |
  For any food, write the eight stages down the page. At each, name the actor, what goes in and
  what comes out. A stage you cannot fill is a question to check, not a blank to skip.
must_know[3].point: |
  Before you accept a figure about "the food system", ask what line was drawn round it. A
  kitchen, a state or the country? Household waste in or out? Food bought from abroad in or
  out? Two honest figures can differ only because their boundaries differ.
must_know[4].point: |
  "Food system" is a definition an expert panel adopted in 2014, not a fact of nature. Quote it as HLPE's definition,
  with the year, and expect other bodies to draw the system differently.
must_know[5].point: |
  The stage list tells you where things happen and who does them. It does not tell you how much
  food passes each stage, how much is lost there, or which actor has the most power. For any of those you need a number from a source, stage by stage.
