definition.text: 'Undernutrition and overweight are measured with different yardsticks. India''s National Family

  Health Survey, fifth round (NFHS-5, 2019-21), uses these. A child under five is stunted when

  height-for-age is more than two standard deviations below the World Health Organization (WHO)

  growth standard. The child is wasted when weight-for-height is more than two standard deviations

  below it, and underweight when weight-for-age is. The child is overweight when weight-for-height

  is more than two standard deviations above it. An adult aged 15 to 49 has a below-normal body

  mass index (BMI) below 18.5 kg/m^2, and is overweight or obese at 25.0 kg/m^2 or more.


  Among women aged 15 to 49, 18.7 per cent had a below-normal BMI and 24.0 per cent were

  overweight or obese.


  The WHO calls the coexistence of undernutrition (wasting, stunting, micronutrient deficiency)

  with overweight, obesity or diet-related noncommunicable diseases the double burden of

  malnutrition. It can occur in one person, one household or one population.


  A double-duty action, in the WHO''s words, is an intervention, programme or policy with the

  potential to reduce the risk or burden of both at once. The WHO sets out three levels. Do no

  harm: check that an existing action does not raise the risk of the other forms. Retrofit: change

  an existing action so that it also acts on the other burden. De novo: design a new action for

  both from the start.


  This book adds two reading words, in plain terms, for sorting a proposed change to a ration, a

  school meal or a take-home ration. They are this book''s tools, not an official classification.

  A single-duty change acts on one burden and neither aims at nor checks the other. A change

  working against the other burden acts on one and raises the risk of the other. The WHO''s first

  level, do no harm, is the check that catches it.

  '
simplified_explanation: 'India is often described as having a hunger problem. It also has an overweight problem.


  A programme built against one burden can feed the other. A ration or a meal designed only to

  fill a calorie gap can add to overweight where overweight is rising.

  '
must_know[0].point: '"India''s problem is hunger; obesity is for rich countries" is wrong on India''s own survey. Say both in

  the same breath, every time.

  '
must_know[1].point: 'Between NFHS-4 and NFHS-5 the share of women aged 15 to 49 who were overweight or obese rose from

  20.6 to 24.0 per cent. The burden is moving, not only sitting. So a programme designed for the

  burden as it was can be wrong for the burden as it is.

  '
must_know[2].point: 'Add prevalence rows only when nobody can sit in both. A sum of overlapping rows counts the same

  child twice.

  '
must_know[3].point: 'A national fact sheet shows the two burdens in one population. Do not claim a household-level

  double burden from it.

  '
must_know[4].point: 'Never quote 24.0 per cent as "the obesity rate among Indian women". It is overweight and obesity

  together, in women of reproductive age.

  '
must_know[5].point: 'Someone proposes a change to a ration, a school meal or a take-home ration. Before you back it,

  ask the WHO''s first question out loud: does it raise the risk of the other burden? A change that adds energy and

  nothing else, in a population where overweight is rising, fails that check.

  '
must_know[6].point: 'The anganwadi guidelines describe their predecessor as built for "calorie sufficiency,

  neglecting quality and diversity of diets". Quote the state''s own sentence when you argue

  that the schemes need retrofitting.

  '
must_know[7].point: '"Single-duty" and "working against the other burden" are this book''s words for sorting a change.

  Define them when you use them in a committee, or a hostile reader will ask whose terms they are.

  '
