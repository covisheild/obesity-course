definition.text: 'Section 2(10) of the National Food Security Act, 2013 defines the minimum support price

  (MSP). It is the assured price announced by the Central Government at which foodgrains are

  procured from farmers, for the central pool. The buyers are the Central Government, the State

  Governments and their agencies. Section 2(2) defines the central pool as the stock of foodgrains

  procured through minimum support price operations. The pool is maintained for allocation

  under the Targeted Public Distribution System and other welfare schemes, and kept as reserves

  for them.


  The Government announces MSPs each season for 22 mandated crops, on the recommendations of the

  Commission for Agricultural Costs and Prices (CACP), after considering the views of State

  Governments and Central Ministries. The decision is taken by the Cabinet Committee on Economic

  Affairs (CCEA). Since 2018-19, following the Union Budget 2018-19 announcement, MSP has been

  set at not less than 1.5 times the all-India weighted average cost of production. The cost

  counts paid-out costs and the imputed value of family labour.


  Sugarcane has no MSP. The Union Government fixes a fair and remunerative price (FRP), also on

  CACP''s recommendation, which sugar mills pay for the cane they buy.


  Procurement differs by crop. Wheat and paddy that meet the prescribed specifications are

  bought at MSP by the Food Corporation of India (FCI) and State agencies. They buy what is

  offered at specified centres. A farmer may sell to them or in the open market. Pulses, oilseeds and copra are

  procured under the Price Support Scheme of PM-AASHA (Pradhan Mantri Annadata Aay Sanrakshan

  Abhiyan) when their market price falls below MSP. Cotton and jute are procured through the

  Cotton Corporation of India and the Jute Corporation of India. The Press Information Bureau''s

  backgrounder of 10 October 2025 records PM-AASHA as continued up to 2025-26.


  As of 24 September 2026: MSP for common paddy in kharif marketing season 2026-27 is Rs 2,441

  per quintal, a quintal being 100 kilograms (CCEA, 13 May 2026). MSP for wheat in rabi marketing season 2026-27 is Rs 2,585 per

  quintal (CCEA, 1 October 2025). The sugarcane FRP for sugar season 2026-27 is Rs 365 per

  quintal at a basic recovery rate of 10.25 per cent (CCEA, 5 May 2026).

  '
simplified_explanation: 'The last section showed a system built to gather grain. This one is the price at which it

  gathers it.


  Before each season the Union Government announces a minimum support price, or MSP, for 22

  crops. It does this in two rounds, one for the kharif crops and one for the rabi crops. Those

  are the names the releases use for India''s two main crop seasons. Each has its own marketing

  season, the months when the crop is sold.


  A body of experts, the Commission for

  Agricultural Costs and Prices (CACP), recommends

  the price. A committee of the Cabinet fixes it. The rule since 2018-19 is a floor. The price

  must be at least one and a half times what the crop is reckoned to cost to grow.


  Here is the trap. An MSP is a price at which the government will buy. It is not a price every

  farmer gets. For wheat and paddy, government agencies stand at buying centres and take what is

  brought to them at that price. For pulses and oilseeds, they step in only when the market price

  drops below the MSP. Among the kharif crops, paddy is nearly all of what gets bought. For the

  rest, the price is announced and little is bought at it.


  The grain that is bought goes into the central pool, the government''s own stock. The food law

  defines that pool as grain bought at MSP and held for the ration system and other schemes. So

  what the state buys decides what it can hand out.


  Sugarcane is different. It has a fair and remunerative price (FRP), fixed the same way, which

  sugar mills must pay for the cane they buy.

  '
must_know[0].point: 'An MSP is the price at which government agencies will buy, not the price every grower is paid.

  For wheat and paddy the agencies buy what is brought to specified centres. For pulses and

  oilseeds they buy only when the market price falls below MSP. When someone quotes an MSP as a

  farmer''s income, ask how much of the crop was bought at it.

  '
must_know[1].point: 'From 2014-15 to 2025-26, 8,746 lakh tonnes were bought across the 14 kharif crops. Paddy was

  8,418 of them, about 96 per cent by weight (CCEA release, 13 May 2026). MSP is announced for many

  crops. Procurement is concentrated in one.

  '
must_know[2].point: 'Say who fixed a price and for which season. CACP recommends. The Cabinet Committee on Economic

  Affairs decides. A figure without its season is out of date the day the next decision comes.

  '
must_know[3].point: 'The central pool is, by the food law''s own definition, grain bought through MSP operations and

  held for the ration system and other schemes. What the state buys at MSP is what it can put in

  a ration. A proposal to change the ration basket is also a proposal about procurement.

  '
must_know[4].point: 'Sugarcane has no MSP. Its price is the fair and remunerative price, and sugar mills pay it.

  For sugar season 2026-27 it is Rs 365 a quintal at 10.25 per cent recovery (CCEA, 5 May 2026). Do not put sugarcane in a

  list of crops the government buys.

  '
must_know[5].point: '"At least 1.5 times cost" is a floor. Paddy sits on it and wheat sits well above it. Before you

  argue that MSP pushes farmers towards one crop, compare how far above the floor each crop''s

  price sits. The rule alone will not show it.

  '
must_know[6].point: 'The cost in the MSP releases is the CACP''s all-India weighted average, including imputed family

  labour. Do not call the margin over it a farmer''s profit. It says nothing about one farm, one

  state, or what the crop fetched.

  '
must_know[7].point: 'The releases give national totals only. They cannot tell you which states the grain came from,

  how many growers sold at MSP, or what the rest were paid. For those questions, look for

  state-wise procurement figures from the Department of Food and Public Distribution or the Food

  Corporation of India. Do not infer them from the MSP.

  '
