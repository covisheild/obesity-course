definition.text: 'A packaged food made from several ingredients is where several supply chains meet.


  The Food Safety and Standards (Labelling and Display) Regulations, 2020, made by the Food

  Safety and Standards Authority of India (FSSAI), govern what the label of a pre-packaged food

  must declare. Regulation 5(2)(b) requires the ingredients to be "listed in descending order

  of their composition by weight or volume, as the case may be at the time of its manufacture".

  The list therefore ranks the ingredients. It states an ingredient''s percentage only where

  regulation 5(2)(g) requires one, for example where the label emphasises that ingredient in

  words or pictures.


  Some ingredients may be declared under a class title. Sucrose may be declared as "Sugar", and

  milk products as "Milk solids", with the source optional. An edible vegetable oil must be

  declared by the name of the specific oil.


  The label must name the brand owner, who may be the manufacturer or only the marketer

  (regulation 5(6)). If the manufacturer is someone else, only the manufacturer''s licence

  number must appear (regulation 5(7)(b)). A country of origin is required for food imported

  into India (regulation 5(12)).

  '
simplified_explanation: 'Turn over a packet of biscuits. The list of ingredients on the back is a map of farms.


  Wheat flour came from wheat fields. Sugar came from a sugar crop and a sugar mill. Milk solids

  came from dairy animals. Then the packets travelled another chain to your shop.


  The ingredients go in order of weight when the food was made, heaviest first. So the first

  ingredient weighs more than any other single one.


  The label also leaves a great deal out.

  '
must_know[0].point: '"The first ingredient is most of the product" is wrong. The first is only heavier than each

  other single ingredient.

  '
must_know[1].point: 'Add up an ingredient that appears under more than one name before you say where it ranks.

  Sugar and invert sugar syrup are listed as two lines, each in its own place. Together they

  may outrank the first ingredient.

  '
must_know[2].point: 'The address on a packet is the brand owner''s, who may only market it. If the maker is

  someone else, the label shows the maker''s licence number, not its name.

  '
must_know[3].point: 'A compound ingredient under 5 per cent of the food need not list its own ingredients, apart

  from additives. When you trace a product''s chains, mark such an ingredient as a known gap,

  not as one chain.

  '
must_know[4].point: 'The label asks for a country of origin only on food imported into India. Do not read silence

  on the label as evidence that an ingredient is Indian.

  '
must_know[5].point: 'For any packaged food, read the first four or five ingredients as a list of farm chains.

  '
must_know[6].point: 'The list is one pack''s ranking at manufacture, under one set of rules. It cannot tell you who

  supplied an ingredient, what it cost, or who kept how much of the price.

  '
