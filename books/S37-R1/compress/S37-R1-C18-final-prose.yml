definition.text: 'A supply-chain sketch of a packaged food is a written map of one product. It lists the main

  ingredients in the order the label gives them. It traces each ingredient to the crop or animal

  it comes from, and to the policy tools that act on that crop (`S37-R1-C16`). It names the firm

  the label names, and the channel through which the product reached the buyer. And it marks

  every link with one of three marks: checked in a named source, seen on the pack or in the

  shop, or unknown.


  Under the Food Safety and Standards (Labelling and Display) Regulations, 2020, the ingredients

  are listed in descending order of their weight or volume at the time of manufacture. The class

  "edible vegetable oil" must be named as the specific oil. The label names the brand owner, who

  may or may not be the maker. It declares a country of origin for a food imported into India. It

  does not say where the ingredients of an Indian-made food were grown, who supplied them, or

  what any of them cost.

  '
simplified_explanation: 'This is the book''s build. You take one packaged food you eat often. You write down where it came

  from, as far as you can find out, and where you cannot.


  Start with the label. Its ingredient list is in order of weight, heaviest first (`S37-R1-C03`).

  So the first few names are the heaviest in the packet. Those are the ones to trace.


  For each one, ask what it is made from. Maida is wheat. Sugar is sugarcane. Palm oil is oil palm. Then ask which of the state''s tools act on that

  crop.


  Mark every link. Checked, if you found it in a source you can name. Seen, if it is on the pack or in the shop. Unknown, if neither. Leave the

  unknowns in.

  '
illustration.body: 'Here is the trap, and a first sketch falls into it. The label lists palm oil, so you write

  "palm oil, imported from abroad". It looks like knowledge. It is a guess.


  Open the Food Safety and Standards (Labelling and Display) Regulations, 2020

  (https://www.fssai.gov.in/upload/uploadfiles/files/Comp_Labelling%20Display_Version%20VIII_09_09_2025.pdf).

  Search for "Country of Origin". The clause is headed "Country of Origin for Imported Foods".


  > The country of origin of the food shall be declared on the label of food imported into India.


  If your biscuits were made in India, the label owes you no origin for the oil inside them.


  Now build the sketch properly. Take a packet of plain biscuits from a kirana, a small

  neighbourhood shop. Suppose its list begins as below. This list is made up for the exercise, so

  read your own packet beside it.


  > Refined wheat flour (maida), sugar, palm oil, invert sugar syrup, milk solids, iodised salt,

  > raising agents.


  Take the first three ingredients, and milk solids and salt as well. For each, find its crop and

  the tools that act on it. A quintal is 100 kg.


  ```table

  | Ingredient | From | Tools acting on it, as of September 2026 | Mark |

  | Refined wheat flour | wheat | Support price for wheat, Rs 2,585 per quintal, rabi marketing season 2026-27; bought into the central pool by the Food Corporation of India (FCI) | tools checked; this flour''s wheat unknown |

  | Sugar | sugarcane | Fair and remunerative price of sugarcane, Rs 365 per quintal at 10.25% recovery, sugar season 2026-27, approved by the Cabinet Committee on Economic Affairs | tool checked; the mill unknown |

  | Palm oil | oil palm | Basic customs duty on crude palm oil 5%, from the release of 24 Sep 2026; oil palm mission | tools checked; origin unknown |

  | Milk solids | milk | none on this book''s map | unknown |

  | Iodised salt | salt | none on this book''s map | unknown |

  ```


  Now the firm and the channel. Find the line on the pack beginning "Manufactured by" or "Marketed by". The regulation requires the brand owner''s name and address, "whether or not, he himself is the manufacturer". So

  "Marketed by" tells you who owns the brand. Mark the brand owner as seen, and the factory as unknown unless the pack names it.


  The channel you know: you bought it at a kirana. Mark that seen. Who brought it to the kirana,

  and from which depot, the pack does not say. Mark it unknown.


  Count your marks. In this sketch the tools on each crop are checked. The brand and the shop are seen. Almost everything between the farm and the factory is unknown. That is the right result.

  '
illustration.analogy_breaks_when: 'The figures in the table are the ones in force or announced on 24 September 2026. The ingredient

  list is invented, so its order holds only for this made-up packet.

  '
must_know[0].point: '"The label tells you where the food came from" is wrong for an Indian-made product. Where

  an Indian-made packet''s wheat, sugar or oil was grown is not on it.

  '
must_know[1].point: 'Mark every link of a sketch as checked, seen or unknown, and name the source for every

  "checked". Leave the unknowns visible.

  '
must_know[2].point: 'Do not apply a national figure to one product. The 56.25% import dependence is for all edible

  oils in India in 2023-24.

  '
must_know[3].point: 'The name on the pack is the brand owner, who may not be the maker. Do not name that

  company as the factory unless the pack says "Manufactured by".

  '
must_know[4].point: 'One packet of biscuits holds the decisions of several bodies. When someone proposes changing

  that product, your sketch shows which body owns each lever.

  '
must_know[5].point: 'A sketch with no prices cannot say who earns what along the chain.

  '
