definition.text: 'India''s central food institutions were set up in answer to shortages of grain, and the

  Department of Food and Public Distribution''s own account says so. The Food Corporation of

  India (FCI) was set up in 1965, under an Act of 1964, because the country faced a major

  shortage of foodgrains, especially wheat.


  The Department states the FCI''s job today in quantities of grain. Its Annual Report 2025-26

  calls the FCI the main instrument of the Government of India for procurement and distribution

  of wheat, rice and coarse grains, and for maintaining the buffer stock of foodgrains.


  The measure these institutions are judged by is also a quantity. For 2022-23 it gives net

  imports of cereals of minus 30,352 thousand tonnes: India exported more cereal than it

  imported.


  The nutrition standards that the National Food Security Act, 2013 attaches to its meals are

  floors. No instrument quoted here sets an upper limit on energy, sugar, fat or salt.

  '
simplified_explanation: 'The government''s own history gives a plain answer. Each time, the trigger was too little grain. A

  Food Department was set up in 1942, in the war, because of acute food shortage. The ration shops of

  the public distribution system started in the 1960s to manage scarcity.


  So the tools were built to buy grain, store it, move it and sell it cheaply. Read how the Department

  describes the Food Corporation today. It is the main instrument for buying and distributing wheat,

  rice and coarse grains, the cereals other than those two. And the score the country keeps is in

  tonnes and grams of grain. By that score the system worked: in 2022-23 India sent out more cereal

  than it brought in.


  Nothing in that design asks whether people eat too much of anything. That is not an oversight in a

  system built for obesity. It is a system built for a different problem, and it did what it was built

  to do.

  '
illustration.body: 'Open two instruments and one table, and ask each the same question: what does it count?


  First, the Department of Food and Public Distribution''s Annual Report 2025-26

  (https://dfpd.gov.in/WriteReadData/AnnualRecordUploadDocuments/43bf089b-73cc-4329-aeb6-c883d2f2ea55_Food%20AR%202025-26%20English.pdf).

  Search it for "main instrument". Paragraph 3.64 comes up.


  Procurement means the state buying grain from farmers. A buffer stock is grain held in reserve. Now read the whole paragraph again and

  look for "nutrition". It is not there.


  Second, the National Food Security Act, 2013 (https://indiacode.gov.in/handle/123456789/496105). Go to Schedule II, "Nutritional

  Standards". A standard you must meet is a floor. Look along each row for a maximum, or for sugar, fat or salt. There is none.


  Third, the Economic Survey 2025-26, Statistical Appendix, Table 1.19

  (https://www.indiabudget.gov.in/economicsurvey/doc/stat/tab1.19.pdf). This is the scoreboard.

  Find the 2022-23 rows. Net imports, in thousand tonnes, read like this.


  ```table

  group  net imports 2022-23 (thousand tonnes)

  rice  -22347

  wheat  -4682

  other cereals  -3323

  pulses  1733

  ```


  A minus sign here means India sent out more than it brought in.


  The system built to end a grain shortage now runs a grain surplus.


  None of them has a place to record too much.

  '
illustration.analogy_breaks_when: 'The net import figures hold for the financial year 2022-23 and for all India. They describe

  grain available, not grain eaten. They say nothing about any state or household, and a

  single year of trade can swing with one harvest.

  '
must_know[0].point: '"Indian food policy ignored nutrition" is the wrong charge. It was built against a grain

  shortage and judged by tonnes of grain, and by that measure it succeeded.

  '
must_know[1].point: 'Before you ask an institution to do nutrition work, read what the state says it is for. A

  plan for it to buy vegetables or oils changes its job. Argue it as a change, not as a small

  fix.

  '
must_know[2].point: 'In 2022-23 India''s net imports of cereals were minus 30,352 thousand tonnes, a net export of

  about 30 million tonnes (Economic Survey 2025-26, Table 1.19).

  '
must_know[3].point: 'The nutrition standards in Schedule II of the National Food Security Act are floors, "required

  to be met".

  '
must_know[4].point: 'The PDS was never meant to be a whole diet. The Department calls it "supplemental in nature".

  Do not judge the ration as if it had to supply everything a family eats.

  '
must_know[5].point: 'The departmental histories give the state''s own reasons, in its own words. Do not quote an

  annual report as proof of what happened in 1965.

  '
must_know[6].point: 'Grams of foodgrain available a day per person is not grams eaten. Do not set it beside a

  requirement as if it were intake.

  '
