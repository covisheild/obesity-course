definition.text: |
  A focus group is a form of group interview that uses the talk between participants to produce
  its data (Kitzinger 1995).

  The person who runs the group is the moderator.

  The talk between participants gives what a one-to-one interview cannot.

  The same group process has costs. A shared norm, once voiced, may silence someone who
  disagrees.

  The choice between the two follows from the question. A questionnaire suits counting how many people hold an opinion.
simplified_explanation: |
  A focus group
  puts several people in a room with one moderator.

  Here is the trap. A room of six people answering one at a time is not a focus group. It is six
  short interviews with an audience. In a focus group the moderator asks people to talk to each
  other. That talk between
  them is the data.

  Kitzinger, who wrote a guide to the method for doctors, puts the ideal size at four to eight
  people, for one to two hours.

  What a group does well:

  - It shows what a group takes for granted — the things everyone nods at.
  - It shows the words people use among themselves, which are often not the clinic's words.
  - It can bring in people who would not sit through an interview alone, and people who cannot
    read or write.

  What a group does badly:

  - One loud voice can set the line, and the rest may go along with it.
  - Everyone hears everything.
  - A person of higher standing in the room, such as a staff member among patients, can hold
    others back.

  So choose from the question you are asking.

  ```table
  | If you want to know | Use | Because |
  | how patients at a clinic talk about coming back, and the reasons they share | a focus group | the shared words and reasons come out when they talk to each other |
  | one woman's own story of the months after she stopped coming | an interview | it is one person's story, and she tells it without an audience |
  | how many patients missed their last visit | neither: the clinic's register or a survey | that is a count |
  ```
must_know[0].point: |
  A focus group is not a quick way to interview six people. Read your transcript and check whether anyone ever
  answers anyone other than you.
must_know[1].point: |
  Refuse the sentence "the group agreed", and any count like "five of six said". First check who
  spoke first, and whether anyone was given a real chance to differ.
must_know[2].point: |
  Choose the method from the question. If your question is "how many", a group is the
  wrong tool however well it is run.
must_know[3].point: |
  When many of the people you need to hear from cannot read or write, a written questionnaire
  shuts them out. A group does not.
must_know[4].point: |
  Where the topic is a private or
  stigmatised experience a person may not want neighbours to hear, the group stops being
  trustworthy for it. Offer that person an interview instead, and keep staff out of patient
  groups.
must_know[5].point: |
  If someone tells you focus groups give "more honest" or "truer" data than interviews, or the
  reverse, do not accept it. Kitzinger holds that group data are neither more nor less authentic
  than other data.
