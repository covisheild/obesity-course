definition.text: 'What a respondent says in an interview depends in part on who is asking, and where.


  Britten (1995) states the general case. Researchers "need to consider how they are perceived by

  interviewees and the effects of characteristics such as class, race, sex, and social distance on

  the interview". The problem is sharper when the interviewer is a doctor. A respondent who is, or

  may become, a patient "may wish to please the doctor by giving the responses he or she thinks the

  doctor wants". The place matters too: "The setting of an interview affects the content".


  Mays and Pope (2000) make the effect something a study must report. Reflexivity, in their words,

  "means sensitivity to the ways in which the researcher and the research process have shaped the

  collected data".


  None of these sources measures how large the effect is. They describe its direction: towards the

  answer the respondent thinks the interviewer wants. It is bias, and more interviews by the same

  interviewer in the same setting do not shrink it.

  '
simplified_explanation: 'People answer the person in front of them. Many patients will say what they think the doctor would

  like to hear. The same patient, talking at home to someone with no link to the clinic, may say

  something quite different.


  Age, sex, class, the job you do and the clothes you wear all tell the person something about you.

  So does the place. A consultation room and a kitchen draw out different stories.


  So it is bias: an error that points one way and does not shrink when you collect more. Twenty

  interviews by the clinic''s own doctor do not cancel it. They repeat it twenty times.


  What you can do is make the pull weaker, and make it visible. Say who you are and who you are not.

  Promise, truthfully, that nothing said will reach the clinic. Interview where the person is at

  ease. Then write down who you were to them, so that anyone reading your transcripts can judge.

  '
must_know[0].point: 'Doing more interviews does not average out the interviewer. To change it, change the interviewer

  or the setting. Adding interviews will not.

  '
must_know[1].point: 'A run of praise from patients interviewed by their own clinic''s staff is not evidence that the

  clinic is liked. Before you accept such a finding, ask who did the interviews and where.

  '
must_know[2].point: 'Do not interview your own patients for research if you can avoid it.

  '
must_know[3].point: 'Before the first question, say who you are and who you are not. Say that nothing the person says

  will change their care.

  '
must_know[4].point: 'Write field notes about yourself, not only about the respondent. Record who you are to them, where

  you sat, who else could hear, and any moment you steered. You cannot report what you did not write

  down.

  '
must_know[5].point: 'In India, power differences make it hard for people to refuse a researcher outright, as the ICMR

  guidelines note. Expect more agreement than people feel.

  '
must_know[6].point: 'None of the sources this section rests on puts a size on the interviewer''s effect. When a

  finding depends on it, the check is to compare what different interviewers heard, which is

  second-rung work.

  '
