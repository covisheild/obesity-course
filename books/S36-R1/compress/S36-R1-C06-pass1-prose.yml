definition.text: |
  A topic guide is the written list of areas and questions an interviewer takes into a
  semi-structured interview.

  It is a guide, not a script. The interviewer changes the order and the wording of the
  questions to fit the respondent and the moment.

  The questions run from easy to hard. The questions come from the study's
  research question, which DeJonckheere and Vaughn call the driving force of the whole design.

  A guide is tried out before the study, in a pilot interview.
simplified_explanation: |
  A topic guide is the sheet you
  take into the interview, with all your questions on it in the order you expect to use them.

  It is not a script. You do not read it out top to bottom.

  A guide has four parts.

  - **A warm-up question.** Something easy the person knows all about, to get them talking.
  - **Main questions.** These are the questions your study turns on.
  - **Prompts under each main question.** Short notes of the things you hope the answer covers.
  - **A closing question.** "Is there anything I have not asked about that I should have?"

  Three rules for the order and the words:

  - Easy and factual first, personal later.
  - Every main question comes from your study question.
  - Use the respondent's words, not the clinic's.

  Last, a guide is never finished on paper. Try it in a pilot interview, see which questions fall
  flat, and change it.
must_know[0].point: |
  A topic guide read out word for word, in order, is a structured interview with extra steps.
  Change the order to follow what the respondent says, and use their words in your follow-ups.
must_know[1].point: |
  Put the easy, factual questions first and the most personal one late, after the person has
  been talking for a while.
must_know[2].point: |
  Write each main question from a part of your study question, and cut any main question you
  cannot tie to one.
must_know[3].point: |
  DeJonckheere and Vaughn suggest five to 10 core questions, their name for main questions. Treat
  ten as a ceiling for a pilot guide.
must_know[4].point: |
  Refuse the clinic's words in your questions: "follow-up", "compliance", "BMI". Use the words patients use, and
  once a respondent gives you their own word, switch to it.
must_know[5].point: |
  A guide on paper cannot tell you whether its questions work. Only a pilot interview can. Keep every version dated, because respondents who heard
  different versions answered different questions, and your analysis has to know which was which.
