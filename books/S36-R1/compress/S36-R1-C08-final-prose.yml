definition.text: 'A semi-structured interview runs in a fixed order of parts, and within them it follows the respondent.


  It opens with who you are, why you are talking to this person, the consent steps and the recorder. The first question after that is an open one the respondent can

  answer easily.


  From then on the interviewer''s main work is listening. The interviewer follows the respondent''s words with probes. In this book a probe is a short follow-up that asks

  for more of what the respondent just said without suggesting what that should be. DeJonckheere and Vaughn list, among others, the pause after a question ("wait time"),

  repeating or summarising the respondent''s words ("echo"), short affirming words such as "yes... okay..." ("verbal agreement"), asking them to say more ("expansion")

  and asking what they meant by a word ("explanation").


  Either person may leave the topic guide to follow an idea. The interviewer comes back to the guide when that thread ends.


  The interviewer does not judge, teach, advise or correct. Questions the respondent asks can be answered at the end.


  Leaving the guide does not mean giving up direction altogether.


  The interview closes with thanks.

  '
simplified_explanation: 'Listening sounds passive. It is not. You are deciding, all the time, which of the person''s words

  to follow.


  You stay quiet and wait. You repeat the person''s own words back. You say "tell me more", or "can you

  give me an example?", or "what do you mean by that?". None of these adds an idea of yours.


  Some things feel helpful and damage the interview. Giving advice is one. So is correcting a wrong

  belief, or finishing the person''s sentence. Agreeing with what they said, as opposed to showing that you

  heard it, is another. Each one tells the person what you think.


  Then, the same day, write field notes — what happened, where, how it felt, what surprised you.

  '
must_know[0].point: 'Running an interview well does not mean never steering. Britten''s point is that the amount of

  steering should be right for the moment, not zero.

  '
must_know[1].point: 'Showing you heard is not agreeing with what was said. "Yes... okay..." keeps a person talking. "You

  are right, the diet is impossible" tells them which answer you like, and the next answers will

  lean towards it.

  '
must_know[2].point: 'Before you say a probe, check it for words the respondent has not used. A probe made of their

  words, a pause, or "tell me more" adds nothing of yours. A probe that brings in a new word, such as

  "was it the cost?", has already suggested the answer.

  '
must_know[3].point: 'When a respondent says something medically wrong, do not correct it. What they believe is the

  data.

  '
must_know[4].point: 'If a respondent asks you a medical question, say you will come back to it at the end. Then do

  come back to it: give them a name at the clinic to ask. Answering in the middle turns the

  interview into a consultation.

  '
must_know[5].point: 'Write field notes the same day, before you listen to the recording. The recording keeps the words.

  It does not keep the room, who else was near, or the moment the person went quiet.

  '
must_know[6].point: 'If what a person says suggests danger to their life or another''s, the ICMR guidelines give you a

  responsibility to disclose it to save life. Know your protocol''s plan for this before the interview

  starts, and tell people at consent that confidentiality has limits.

  '
