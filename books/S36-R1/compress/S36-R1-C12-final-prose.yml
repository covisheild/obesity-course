definition.text: 'On the second reading you mark each passage that bears on the study question and write a short

  label beside it.


  A memo is a note, written while you read, of what you notice and what you want to ask next.


  A passage that runs against the pattern the other passages seem to show is a deviant or negative

  case. It is kept and marked, not dropped, because it is what tests and sharpens the pattern.

  '
simplified_explanation: 'First, read the whole transcript once, start to end, with the pen down.


  Then read it again, line by line. When a passage bears on your question, mark it. Write a short

  label in the margin saying what it is about. That label is a code.


  Keep a memo as you go.


  Watch for the passage that does not fit. Mark it and keep it. It tells you where your pattern stops

  being true.


  Last, you do not wait until every interview is done. You read the second transcript before the

  third interview, and what you read changes what you ask.

  '
illustration.body: 'Suppose you are running the practice interviews for the clinic question. Why do adult patients with obesity stop coming back to a district hospital

  clinic in Chhattisgarh? The respondent, R2, is a woman in her fifties who came for a year and then stopped.


  ```table

  | Speaker | Words |

  | I | Tell me about the last time you came to the clinic. |

  | R2 | It was in the rains. The bus from our village goes only in the morning, so I lose the whole day. My son has to take leave to bring me. |

  | I | Mm. |

  | R2 | And that time the sugar was fine. The doctor said it is under control. So I thought, if it is fine, why go every month? |

  | I | You said the sugar was fine. What was coming every month for, then? |

  | R2 | Standing in the line for the weighing. Everybody is there. The sister reads the number out loud. I did not want the whole line to hear it. |

  ```


  Read all six lines first, pen down.


  ```table

  | Passage | Code |

  | The bus goes only in the morning, so I lose the whole day | a whole day lost to one visit |

  | My son has to take leave to bring me | needs family to take time off |

  | If it is fine, why go every month? | "if it is fine, why go" |

  | The sister reads the number out loud | weighed in front of the line |

  ```


  The third label is her own words, because nothing you could write names it better.


  Then write a memo. For example: "Distance came up first, but she did not stop when the bus was

  hard. She stopped after she was told her sugar was under control. Next time, ask what a visit is

  for, in their words. Ask what happens from the moment they arrive, and do not name the weighing

  first."


  Suppose, last, that R4, a man in his sixties, lives further out than R2 and has not missed a visit. Mark it and keep it. It tells you distance

  alone does not decide who stops, and it gives you a question: what does R4 have that R2 does not?

  '
illustration.analogy_breaks_when: 'A code here is your own label for finding and comparing passages. It is not yet a finding.

  Suppose two transcripts out of five carry "weighed in front of the line". That does not tell you

  what share of the clinic''s patients stop for that reason. The five were chosen, not drawn at

  random (the section on who you talk to).


  The labels also belong to one reader. S36-R2 turns first labels into a set of codes that a

  second person can apply and reach the same passages.

  '
must_know[0].point: 'Coding is not counting. If you tally how many transcripts carry it and report a percentage,

  you have made a rate out of people who were chosen, not drawn. Write "two respondents

  described..." and say who they were, not "two in five patients".

  '
must_know[1].point: 'Read the whole transcript once before you mark anything. A label written on the first page

  bends how you read the third.

  '
must_know[2].point: 'Label with the respondent''s words or a plain description of what happened, never with the

  clinic''s verdict. "Non-compliance" names the patient as the problem before you have understood

  her reason.

  '
must_know[3].point: 'Keep the case that does not fit, and mark it.

  '
must_know[4].point: 'Write a memo after each transcript, before the next interview, and let it change the topic

  guide.

  '
must_know[5].point: 'Until someone else can apply your codes and reach the same passages, do not present them as the

  study''s results. Present them as your working notes.

  '
