definition.text: 'A turn is one unbroken stretch of speech by one speaker in a transcript. A word, for this

  count, is whatever stands between two spaces in the transcript being counted.


  The interviewer''s talk share for one interview is the number of words the interviewer says,

  divided by the number of words everyone says, multiplied by one hundred. The respondent''s talk

  share is one hundred minus the interviewer''s. The respondent-to-interviewer ratio is the

  respondent''s words divided by the interviewer''s words.


  The respondent speaks more than the interviewer exactly when the interviewer''s share is below 50

  per cent, and exactly when the ratio is above 1. That is the gate this rung sets.


  Across several interviews, the mean share is the sum of the interviewers'' shares divided by the

  number of interviews. The pooled share is all the interviewer''s words across the interviews

  divided by all the words. The two differ whenever the interviews differ in length.


  A talk share is a count on one version of a transcript. It changes with the transcription style

  and the language counted, so a share is reported with the version it was counted on. It

  measures how much each person said. It does not measure whether the interviewer steered what

  was said.

  '
simplified_explanation: 'This rung ends with a simple test. In your interview, did the respondent speak more than you did?


  You answer it by counting. Take the transcript. Count every word you said, and every word the

  respondent said. Add them to get all the words. Your words divided by all the words, times a

  hundred, is your share. If it is under 50 per cent, the respondent spoke more.


  Count words, not turns. In an interview the turns go back and forth, you, then them, then you. So

  the number of turns comes out close to equal almost every time, however the talking was really

  shared.


  A low share is good news about one thing only: who spoke more. It cannot tell you whether your

  questions pushed the answers in one direction. For that you read the questions.

  '
must_know[0].point: 'Count words, not turns. Turns alternate, so they split close to evenly in almost any interview.

  A turn count of fifty-fifty tells you nothing about who did the talking.

  '
must_know[1].point: 'The share and the ratio are different numbers. Suppose you said 1,000 words and the respondent

  said 4,000. The ratio of your words to hers is 0.25. Your share is 1,000 divided by 5,000, which

  is 20 per cent. Say which one you are quoting.

  '
must_know[2].point: 'A low talk share does not show that you did not lead. A respondent can talk at length inside a

  premise your question gave her. Once the share passes, read your own questions for leading,

  turn by turn. The count cannot do that part for you.

  '
must_know[3].point: 'A mean share across five interviews can pass while one interview fails. Report each interview''s

  share, and open the transcript of any that sits near or above half.

  '
must_know[4].point: 'Aim well under half, not just under it. The count moves with the transcription style and the

  language you count in. A share near 50 per cent can pass on one rule and fail on another.

  Write down how you counted beside every share you report.

  '
must_know[5].point: 'The 50 per cent line is this course''s gate, not a published standard. If a reviewer asks where

  it comes from, say so. DeJonckheere and Vaughn''s guide to interviewing advises putting listening

  before talking, and gives no number.

  '
must_know[6].point: 'When a trainee says "I barely spoke", ask for the two word counts. How much you talked is one of

  the things people misjudge about their own interviews. It takes ten minutes to count, and the

  count settles it.

  '
