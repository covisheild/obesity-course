definition.text: 'In a qualitative report, a quotation from a respondent is evidence offered for a claim the

  author makes about the data. It is not decoration.


  To work as evidence, a quotation must meet three conditions. It must be traceable to a

  transcript and to a labelled respondent, for example R3, woman, 40s. It must carry enough of what

  was said before and after it for its sense to be clear. And the report must say whether it

  stands for something several respondents said, or is an exception.


  A reader checks a quotation with the four acts used on any reference. Find the transcript.

  Confirm the speaker is the one named. Find the passage. Read whether it says what it was quoted

  for.


  Choosing only the quotations that fit the author''s view, or cutting a quotation so that it fits,

  is cherry-picking. It fails the last of those checks.

  '
simplified_explanation: 'A report on interviews usually carries quotations: a respondent''s own words, set in quotation

  marks. They make the page come alive. That is not their job.


  Their job is to be evidence. The author claims something about what people said. The quotation

  is offered as a reason to believe it. In the words of Book 0, it is a premise, and the author''s

  claim is the conclusion (the section on premise, inference and conclusion). So a quotation can

  fail in the two ways any premise can. The words may not be what the person said, or not what

  they meant. Or they may be true, and still not carry the claim built on them.


  So you check a quotation the way you check any reference (the section on checking a reference).

  Find the transcript. Confirm the speaker is the person named. Find the lines. Then read them, and

  read the lines around them, and ask: does this say what it was quoted for?


  When you write a report yourself, give each quotation three things. A label that ties it to one

  transcript without naming the person, such as R3, woman, 40s. Enough of the surrounding talk for

  its sense to be clear. And a plain statement of whether several people said something like it,

  or only this one.


  Picking only the lines that agree with you, or trimming a line until it agrees, is

  cherry-picking. It is easy to do without meaning to, and the checks above are how it gets caught.

  '
must_know[0].point: 'A vivid quotation does not show that something is common. It shows that one person said it, in

  those words. The claim about a pattern has to be made and supported separately, and the

  quotation marked as typical or as the exception.

  '
must_know[1].point: 'Run the four reference checks on any quotation you are handed. Find the transcript, confirm the

  speaker, find the lines, and read them with the lines around them. Expect the failure at the

  last act, where the words are real and the claim is not.

  '
must_know[2].point: 'Read the line before a quotation. If the interviewer said the words first and the respondent

  agreed, the quotation is the interviewer''s idea in the respondent''s mouth. Do not use it as the

  respondent''s own account.

  '
must_know[3].point: 'When you quote, give a label that ties the words to one transcript without naming the person

  (R3, woman, 40s). Give enough of the surrounding talk for the sense to be clear. Say whether

  others said something like it. Keep a note of where each quotation sits in its transcript, so

  anyone checking can find it.

  '
must_know[4].point: 'Before a service is changed on the strength of a quoted reason, ask for the transcript lines

  around the quotation. A cherry-picked quotation sends the change the wrong way. Moving the

  clinic nearer does nothing for R3, whose reason was a job with no day off.

  '
must_know[5].point: 'Keep the quotation that runs against the author''s claim in the report, beside the ones that

  support it. When you review a trainee''s draft, look first for that quotation. If there is none,

  ask whether the transcripts really had none.

  '
must_know[6].point: 'These checks tell you whether a quotation is faithful to the transcript. They cannot tell you

  whether the transcript is faithful to the recording, or whether the translation kept the

  meaning. When a claim rests on one quotation, check that passage against the audio and the

  words in the language spoken.

  '
