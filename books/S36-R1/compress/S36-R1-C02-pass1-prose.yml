definition.text: 'In a qualitative study the people who answer, called respondents, are chosen on purpose, for what they can tell the researcher about the question. The choice and its reasons are written down.


  A deliberate choice is not a convenience sample. A convenience sample takes whoever is available.


  They do not estimate how common any of these is in a population. What carries beyond the study is an idea, a reason and how it works, that a reader can test in another setting. This is conceptual, not statistical, generalisation.


  Such a study is judged by its own tests. It gives a clear account of how people were chosen and how the data were gathered and analysed. It searches for cases that contradict the emerging explanation, and reports them.

  '
simplified_explanation: 'A qualitative study uses a third way. You choose people on purpose, for what they can tell you.


  Suppose you want to know why patients stop coming to a clinic. The people who can tell you are the ones who stopped, so you go and find them. You are after the widest spread of reasons, not an average.


  That choice has a price. Say seven of your twelve respondents, the people who answer, mention the bus fare. That does not mean 58 per cent of patients stop because of the fare. You might have picked more people from far villages. Pick differently, and the seven changes.


  It can say what the reasons are, how each one works, and how they connect. A reader in another district can take that idea and test it against their own clinic.


  Ask three things instead. Did the authors say how they chose people, and why? Did they say how they gathered and read what was said? Did they look for people whose story did not fit, and report them?

  '
must_know[0].point: 'A count of respondents is not a rate. "Seven of twelve mentioned the fare" describes the twelve you chose.

  '
must_know[1].point: 'When you read a qualitative study, find the account of how people were chosen before you read the findings.

  '
must_know[2].point: 'A reviewer trained on trials will ask for your sample-size or power calculation. There is none to give, because the study does not estimate a rate.

  '
must_know[3].point: 'A small number is not, by itself, a weakness in this kind of study.

  '
must_know[4].point: 'The easiest people to reach can be the ones your question is not about.

  '
must_know[5].point: 'It cannot tell you how common any reason is. If a budget or a target depends on "how many", ask for a count from a random sample or a complete register.

  '
must_know[6].point: 'Then have them add the case that did not fit.

  '
