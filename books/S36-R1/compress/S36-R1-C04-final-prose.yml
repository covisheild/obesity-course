definition.text: 'A focus group is a form of group interview that uses the talk between participants to produce

  its data (Kitzinger 1995). A group interview can be run simply as a quick way to hear several

  people at once, each answering the researcher in turn. A focus group is different in method:

  participants are asked to talk to one another.


  The person who runs the group is the moderator. Kitzinger calls this person the facilitator,

  and says the facilitator should explain that the aim is for people to talk to each other rather

  than to the researcher.


  The talk between participants gives what a one-to-one interview cannot.


  The same group process has costs. A shared norm, once voiced, may silence someone who

  disagrees.


  The choice between the two follows from the question. A questionnaire suits counting how many

  people hold an opinion.

  '
simplified_explanation: "A focus group puts several people in a room with one moderator.\n\nHere is the trap. A room of six people answering one at a time is not a focus group. It is six short interviews with an audience. In a focus group the moderator\nasks people to talk to each other. That talk between them is the data.\n\nKitzinger, who wrote a guide to the method for doctors, puts the ideal size at four to eight people, for one to two hours.\n\nWhat a group does well:\n\n- It shows what a group takes for granted — the things everyone nods at.\n- It shows the words people use among themselves, which are often not the clinic's words.\n- It can bring in people who would not sit through an interview alone, and people who cannot\n  read or write.\n\nWhat a group does badly:\n\n- One loud voice can set the line, and the rest may go along with it.\n- Everyone hears everything. You cannot promise a person that what they say stays private.\n- A person of higher standing in the room, such as a staff member among patients, can hold\n  others back.\n\nSo choose from the question you are asking.\n\n```table\n| If you want to know | Use | Because |\n| how patients at a clinic talk about coming back, and the reasons they share | a focus group | the shared words and reasons come out when they talk to each other |\n| one woman's own story of the months after she stopped coming | an interview | it is one person's story, and she tells it without an audience |\n| how many patients missed their last visit | neither: the clinic's register or a survey | that is a count |\n```\n"
must_know[0].point: 'A focus group is not a quick way to interview six people. Read your transcript and check

  whether anyone ever answers anyone other than you.

  '
must_know[1].point: 'Refuse the sentence "the group agreed", and any count like "five of six said". First check who

  spoke first, and whether anyone was given a real chance to differ.

  '
must_know[2].point: 'Choose the method from the question. If your question is "how many", a group is the wrong tool

  however well it is run.

  '
must_know[3].point: 'When many of the people you need to hear from cannot read or write, a written questionnaire

  shuts them out. A group does not.

  '
must_know[4].point: 'Where the topic is a private or stigmatised experience a person may not want neighbours to

  hear, the group stops being trustworthy for it. Offer that person an interview instead, and

  keep staff out of patient groups.

  '
must_know[5].point: 'If someone tells you focus groups give "more honest" or "truer" data than interviews, or the

  reverse, do not accept it. Kitzinger holds that group data are neither more nor less authentic

  than other data.

  '
