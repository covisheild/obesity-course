definition.text: 'A research interview is a conversation in which a researcher asks a respondent about a topic in order to gather the respondent''s account of it. Interviews are sorted into three kinds by how much is fixed before the interview begins.


  A structured interview administers a questionnaire. A questionnaire read aloud is a structured interview, and its answers are counted.


  A semi-structured interview follows a short guide of open-ended questions that define the area to be explored.


  An in-depth interview fixes less still. No interview is wholly without structure, so "unstructured interview" is a misleading name.


  A research interview is not a clinical consultation. The interviewer therefore does not diagnose, advise or correct.

  '
simplified_explanation: 'Interviews come in three kinds. What separates them is how much is decided before you sit down.


  In a structured interview, everything is decided. You read out a questionnaire. Most answers are picked from a list.


  In a semi-structured interview, the topics are decided and the path is not. You carry a short guide of open questions: questions the person answers in their own words, not by picking from a list. You change the order and the wording to suit the person. When they say something you did not expect, you follow it, then come back to the guide.


  In an in-depth interview, almost nothing is decided. Everything after that comes from what the person has said: "What happened then?" "What do you mean by that?"


  Most qualitative studies use the semi-structured kind: one person, one sitting, face to face, recorded with their agreement.


  A research interview is not taking a history. In a history, you steer the patient''s story toward a diagnosis and a plan. You do not diagnose, you do not advise, and you do not correct.

  '
must_know[0].point: 'A research interview is not a history with a recorder running. In a research interview, steering is the error, because it swaps the respondent''s account for your categories.

  '
must_know[1].point: 'Choose the kind of interview from the question.

  '
must_know[2].point: 'Do not ask the diagnostic question and do not advise. Ask her to say more, and offer to come back to her health question when the interview ends.

  '
must_know[3].point: 'A questionnaire read aloud is still a questionnaire.

  '
must_know[4].point: 'The labels are used loosely in papers, so the name of the interview tells you little. Look in the methods for what the interviewer fixed in advance and what they followed.

  '
must_know[5].point: 'When you teach a resident to interview, have them play back their own recording. They mark every place they diagnosed, advised or corrected.

  '
