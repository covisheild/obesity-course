definition.text: 'A turn is one unbroken stretch of speech by one speaker in a transcript. A word, for this

  count, is whatever stands between two spaces in the transcript being counted.


  The interviewer''s talk share for one interview is the number of words the interviewer says,

  divided by the number of words everyone says, multiplied by one hundred. The respondent''s talk

  share is one hundred minus the interviewer''s. The respondent-to-interviewer ratio is the

  respondent''s words divided by the interviewer''s words.


  Across several interviews, the mean share is the sum of the interviewers'' shares divided by the

  number of interviews. The pooled share is all the interviewer''s words across the interviews

  divided by all the words. The two differ whenever the interviews differ in length.

  '
simplified_explanation: 'This rung ends with a simple test. In your interview, did the respondent speak more than you did?


  Your words divided by all the words, times a hundred, is your share. If it is under 50 per cent,

  the respondent spoke more.


  Count words, not turns.


  A low share is good news about one thing only: who spoke more. It cannot tell you whether your

  questions pushed the answers in one direction. For that you read the questions.

  '
must_know[0].point: 'Count words, not turns. Turns alternate, so they split close to evenly in almost any interview.

  '
must_know[1].point: 'The share and the ratio are different numbers. Say which one you are quoting.

  '
must_know[2].point: 'A low talk share does not show that you did not lead. Once the share passes, read your own

  questions for leading, turn by turn. The count cannot do that part for you.

  '
must_know[3].point: 'A mean share across five interviews can pass while one interview fails. Report each interview''s

  share, and open the transcript of any that sits near or above half.

  '
must_know[4].point: 'Aim well under half, not just under it. Write down how you counted beside every share you

  report.

  '
must_know[5].point: 'The 50 per cent line is this course''s gate, not a published standard.

  '
must_know[6].point: 'When a trainee says "I barely spoke", ask for the two word counts.

  '
