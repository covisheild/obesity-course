definition.text: "A topic guide is the written list of areas and questions an interviewer takes into a\nsemi-structured interview. DeJonckheere and Vaughn call it the interview guide. It is a short\nlist of guiding questions. Follow-up questions, some planned and some arising from what the\nrespondent says, fill in around them.\n\nIt is a guide, not a script. The interviewer changes the order and the wording of the\nquestions to fit the respondent and the moment. Britten adds that the interviewer tries to use\nthe respondent's own words when asking the follow-up questions, so the wording cannot be fixed\nin advance. A list of fixed questions read aloud in a fixed order is a structured interview,\nnot a topic guide.\n\nDeJonckheere and Vaughn name the parts of a guide:\n\n- a first question, which they call a \"grand tour\" question: a general question on something\n  the respondent knows a lot about, to start them talking;\n- five to 10 core questions, which bear directly on what the researcher wants to know, and are\n  usually asked of everyone;\n- planned follow-up questions, which ask for more detail on parts of a core question;\n- unplanned follow-up questions, which arise from what the respondent says.\n\nThis book calls these the warm-up question, the main questions and the prompts. Unplanned\nfollow-ups are not written down in advance, by definition.\n\nThe questions run from easy to hard. Most interviews start with an easy, context-setting\nquestion and move to more difficult or personal ones. The questions come from the study's\nresearch question, which DeJonckheere and Vaughn call the driving force of the whole design.\nThey are open, neutral, clear, and in familiar words without jargon.\n\nA guide is tried out before the study, in a pilot interview. It is changed as the study goes\non: questions that do not work are replaced, and new prompts are added for topics earlier\nrespondents raised.\n"
simplified_explanation: "The last section gave you three checks for a single question. A topic guide is the sheet you\ntake into the interview, with all your questions on it in the order you expect to use them.\n\nIt is not a script. You do not read it out top to bottom. If the respondent answers your third\nquestion while you are on your first, you do not ask it again later. If they use a word for\nsomething, you use their word from then on. The guide is there so that by the end you have\ncovered what you came for.\n\nA guide has four parts.\n\n- **A warm-up question.** Something easy the person knows all about, to get them talking. \"Tell\n  me about a usual day for you.\"\n- **Main questions.** One guide written to teach interviewing, DeJonckheere and Vaughn's, suggests\n  five to 10. These are the questions your study turns on. Most respondents get all of them, in\n  some order.\n- **Prompts under each main question.** Short notes of the things you hope the answer covers. You\n  use a prompt only if the respondent does not get there on their own.\n- **A closing question.** \"Is there anything I have not asked about that I should have?\" The\n  respondent knows their life better than you do, and this gives them the last word. Then: \"Is\n  there anything you want to ask me?\"\n\nThree rules for the order and the words:\n\n- Easy and factual first, personal later. Nobody tells a stranger how they feel about their\n  weight in the first minute.\n- Every main question comes from your study question. If you cannot say which part of the study\n  question a main question serves, cut it.\n- Use the respondent's words, not the clinic's. \"Follow-up\", \"compliance\" and \"BMI\" are clinic\n  words. \"Coming back\", \"the tablets\" and \"the weighing\" are closer to what patients say.\n\nLast, a guide is never finished on paper. Try it in a pilot interview, see which questions fall\nflat, and change it. Keep each version with its date, so you know which respondents heard which\nquestions.\n"
must_know[0].point: 'A topic guide read out word for word, in order, is a structured interview with extra steps.

  Change the order to follow what the respondent says, and use their words in your follow-ups. The

  guide''s job is to make sure you have covered everything by the end, not to set the route.

  '
must_know[1].point: 'Put the easy, factual questions first and the most personal one late, after the person has

  been talking for a while. A guide that opens with "how do you feel about your weight?" gets a

  short answer to its most important question.

  '
must_know[2].point: 'Write each main question from a part of your study question, and cut any main question you

  cannot tie to one. A guide with nineteen questions has no room left for the respondent to take

  you somewhere you did not expect.

  '
must_know[3].point: 'DeJonckheere and Vaughn suggest five to 10 core questions, their name for main questions. Treat

  ten as a ceiling for a pilot guide. Each main question needs room for prompts and for the

  answers you did not plan for.

  '
must_know[4].point: 'Refuse the clinic''s words in your questions: "follow-up", "compliance", "BMI". A patient who

  does not use a word answers the question they think you asked. Use the words patients use, and

  once a respondent gives you their own word, switch to it.

  '
must_know[5].point: 'A guide on paper cannot tell you whether its questions work. Only a pilot interview can. Expect

  to change the guide after each pilot. Keep every version dated, because respondents who heard

  different versions answered different questions, and your analysis has to know which was which.

  '
