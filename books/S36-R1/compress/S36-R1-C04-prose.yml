definition.text: 'A focus group is a form of group interview that uses the talk between participants to produce

  its data (Kitzinger 1995). A group interview can be run simply as a quick way to hear several

  people at once, each answering the researcher in turn. A focus group is different in method:

  participants are asked to talk to one another. They ask each other questions, swap stories,

  and comment on each other''s experiences and points of view.


  The person who runs the group is the moderator. Kitzinger calls this person the facilitator,

  and says the facilitator should explain that the aim is for people to talk to each other rather

  than to the researcher. Kitzinger gives the ideal size as between four and eight people, and a

  session as lasting one to two hours. Ideally the discussion is recorded and transcribed.


  The talk between participants gives what a one-to-one interview cannot. It shows the norms a

  group shares, the words its members use for their own concerns, and everyday forms of talk

  such as jokes, stories, teasing and arguing. It can also show how an idea forms and changes

  while people talk.


  The same group process has costs. A shared norm, once voiced, may silence someone who

  disagrees. Everyone present hears what is said, so the session cannot be confidential in the

  way a one-to-one interview can. A hierarchy inside the group may hold some members back.

  Kitzinger adds that groups are not, by definition, worse for sensitive topics: a less shy

  member can make it easier for others to speak.


  The choice between the two follows from the question. By Kitzinger''s account, interviews suit a

  person''s own story, and focus groups suit how knowledge and ideas develop and work within a

  shared culture. A questionnaire suits counting how many people hold an opinion. Kitzinger holds

  that group data are neither more nor less authentic than data from other methods.

  '
simplified_explanation: "The last section was about the interview: one person, one interviewer, one sitting. A focus group\nputs several people in a room with one moderator. The moderator is the person who runs the group\nand keeps it going, without taking over.\n\nHere is the trap. A room of six people answering one at a time is not a focus group. It is six\nshort interviews with an audience. In a focus group the moderator asks people to talk to each\nother. They ask each other questions, agree, argue, tell stories and tease. That talk between\nthem is the data. An interview cannot produce it, because there is nobody else to talk to.\n\nKitzinger, who wrote a guide to the method for doctors, puts the ideal size at four to eight\npeople, for one to two hours. The session is recorded, and the recording is typed out afterwards.\n\nWhat a group does well:\n\n- It shows what a group takes for granted — the things everyone nods at.\n- It shows the words people use among themselves, which are often not the clinic's words.\n- It can bring in people who would not sit through an interview alone, and people who cannot\n  read or write.\n- One person saying something difficult can make it easier for the next person to say it too.\n\nWhat a group does badly:\n\n- One loud voice can set the line, and the rest may go along with it. Agreement in a room is not\n  always agreement in each head.\n- Everyone hears everything. You cannot promise a person that what they say stays private.\n- A person of higher standing in the room, such as a staff member among patients, can hold\n  others back.\n\nSo choose from the question you are asking.\n\n```table\n| If you want to know | Use | Because |\n| how patients at a clinic talk about coming back, and the reasons they share | a focus group | the shared words and reasons come out when they talk to each other |\n| one woman's own story of the months after she stopped coming | an interview | it is one person's story, and she tells it without an audience |\n| how many patients missed their last visit | neither: the clinic's register or a survey | that is a count |\n```\n\nNeither kind of data is truer than the other. Each answers its own kind of question.\n"
must_know[0].point: 'A focus group is not a quick way to interview six people. If you ask each person in turn, you

  have run six short interviews with an audience. You have also lost the talk between people,

  which is the only thing a group gives you. Read your transcript and check whether anyone ever

  answers anyone other than you.

  '
must_know[1].point: 'Refuse the sentence "the group agreed", and any count like "five of six said". First check who

  spoke first, and whether anyone was given a real chance to differ. Kitzinger

  advises against percentages from focus groups. A voiced group norm can silence the person who

  thinks otherwise.

  '
must_know[2].point: 'Choose the method from the question. For what a group takes for granted and the words it uses,

  run a group. For one person''s own story over time, run an interview. For how many people do

  something, count, with a register or a survey. If your question is "how many", a group is the

  wrong tool however well it is run.

  '
must_know[3].point: 'When many of the people you need to hear from cannot read or write, a written questionnaire

  shuts them out. A group does not. Kitzinger names this as an advantage of the method. It

  matters in a district hospital clinic, where it can decide whose reasons reach your findings

  at all.

  '
must_know[4].point: 'You cannot promise a person in a group that what they say stays private, because the others

  hear it. A staff member in the room can hold patients back. Where the topic is a private or

  stigmatised experience a person may not want neighbours to hear, the group stops being

  trustworthy for it. Offer that person an interview instead, and keep staff out of patient

  groups.

  '
must_know[5].point: 'If someone tells you focus groups give "more honest" or "truer" data than interviews, or the

  reverse, do not accept it. Kitzinger holds that group data are neither more nor less authentic

  than other data. They answer a different question. Her guide is practical advice from

  experience, not a head-to-head trial, so it gives no effect size either way.

  '
