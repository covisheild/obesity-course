definition.text: 'A pilot interview is a practice run of the whole procedure of an interview study, done with a

  few people before the study proper. It tests the topic guide, the recording, the consent talk

  and the interviewer. It does not test an answer to the study question.


  The build for this rung is five pilot interviews. Each one runs the same seven steps, in order.


  1. Consent, including separate agreement to be recorded.

  2. The recorded interview.

  3. Field notes, written straight after.

  4. A transcript.

  5. A first reading, with rough codes and a memo.

  6. The interviewer''s talk share.

  7. A revised topic guide, before the next interview.

  '
simplified_explanation: 'A pilot is a practice run. You are not yet finding out why patients stop coming to a clinic. The

  thing under test is you and your topic guide.


  Choose five people you can reach who know the topic from their own lives. Do not choose your own

  patients. A patient may worry that what they say will change their care.


  Then look across the five. Which questions fell flat every time? Where did you lead? Is your share

  of the words falling as you get better at waiting?

  '
illustration.body: 'Here is how five pilots might go. Everything below is made up: the people, the counts and the changes.


  After pilot 1 you count the words in the transcript. You said 1,150 words and R1 said 1,350. Your share is your words divided

  by all the words.


  ```working

  1,150 plus 1,350 = 2,500

  1,150 divided by 2,500 = 0.46

  0.46 times 100 = 46 per cent

  ```


  Your share is 46 per cent. You asked "Don''t you find the clinic timings difficult?" and R1 said "Yes." Later you spent two

  minutes explaining why the clinic wants monthly visits. That is advice, not listening (the section on running the interview

  without leading it).


  So you change two things before pilot 2. The timings question becomes "Tell me about a clinic

  day, from when you leave home." And you write at the top of your guide: do not explain the

  clinic.


  ```table

  | Pilot | Your words | Respondent''s words | All words | Your share (per cent) |

  | 1 | 1,150 | 1,350 | 2,500 | 46 |

  | 2 | 950 | 1,550 | 2,500 | 38 |

  | 3 | 780 | 2,220 | 3,000 | 26 |

  | 4 | 600 | 2,400 | 3,000 | 20 |

  | 5 | 1,290 | 1,710 | 3,000 | 43 |

  ```


  The share falls across the first four pilots, from 46 per cent to 20. Then pilot 5 jumps back to 43 per cent.


  R5 is a man in his forties who answers in short lines. Each time he stopped, you filled the silence with a new question. You

  stopped waiting. The change for next time is the pause: ask, then wait, and let the silence do the asking (the section on

  running the interview).


  Pilot 3 also had a question that fell flat. "What does the clinic do for you?" drew one-word answers.

  '
illustration.analogy_breaks_when: 'A falling share shows only that you spoke less. It does not show that you led less. Read the

  transcript for the questions themselves.


  Nothing a pilot finds about the clinic is a finding. It is a question to ask properly in the

  study itself.

  '
must_know[0].point: 'A pilot tests your guide and you, not the study question. Do not report what five pilot

  respondents said as the reason patients stop coming.

  '
must_know[1].point: 'Do not pilot on your own patients. If a patient of yours does take part, tell them plainly that

  nothing they say will affect their care.

  '
must_know[2].point: 'Transcribe and read each pilot before the next one. If you run them all and read them

  afterwards, you have done one pilot five times.

  '
must_know[3].point: 'When your talk share moves, read the transcript before you explain it. A rise can mean you

  stopped waiting, or that one respondent speaks briefly.

  '
must_know[4].point: 'Listen to your own recording for four things. How much you steered. Whether you asked leading

  questions. Whether you picked up what the respondent offered. Whether you gave them time to say

  what they meant.

  '
must_know[5].point: 'Keep a dated copy of your topic guide after every pilot, with a line saying what changed and

  why.

  '
must_know[6].point: 'You plan to keep the transcripts for the next rung''s analysis. So say so when you take consent,

  and keep them only if the person agrees. Ask your own institution''s ethics committee before the

  first pilot, and keep its answer in writing.

  '
