definition.text: 'A research question of the first kind asks how many or how much: how common something is, how large a quantity is, or how large a difference a treatment makes. Research of this kind is called quantitative research.


  A question of the second kind asks what something is, what it means to the people involved, how it comes about and why.


  The two kinds answer different questions, and neither is a weaker version of the other.

  '
simplified_explanation: 'Some questions ask how many or how much. How many adults with obesity seen at a clinic last year came back for a second visit? By how much does a reminder message raise that number?


  Other questions ask what, how and why. Why do patients stop coming? You answer these by asking people and listening to what they say, in their own words. That is qualitative research.


  A trial cannot tell you why patients stop coming. An interview cannot tell you how many do.


  That ladder ranks designs for one question: does this treatment work, and by how much? It has no rung for "why do patients stop coming?"


  The two kinds also feed each other.

  '
illustration.body: 'Here is the setting this book uses from start to finish. It is made up. A district hospital in Chhattisgarh runs a non-communicable disease (NCD) clinic. Many of its adult patients with obesity come once or twice and then stop coming. You want to know why.


  Start with an attempt that fails. Suppose the clinic adds a question to its follow-up phone call: "Why did you not come back? Distance, cost, felt better, or other."


  Ask where the four choices came from. The clinic staff wrote them, before anyone had asked a patient. The count is exact. It is an exact count of the staff''s guesses.


  Now sort four questions about the same clinic yourself, before you read the table. For each one, say whether it asks how many or how much, or what, how and why. Then say what would answer it.


  ```table

  | Question | Kind | What answers it |

  | How many adults with obesity seen last year came back for a second visit? | how many | Count the clinic register |

  | Does a reminder text message the day before raise the share who come back? | how much | A trial: chance decides who gets the message, then the groups are compared |

  | Why do adults with obesity stop coming back? | why | Find people who stopped, ask them, and listen |

  | What is a clinic day like for someone who works for a daily wage? | what and how | Ask such people, and listen |

  ```


  Look hard at the third row. No count answers it, because you do not yet know what to count.


  Suppose you go and ask. In a made-up example, one woman says the clinic is on the first floor. Her knees hurt on the stairs, and she waits standing because the benches are full. Nobody on the staff had put "stairs" on the tick-list. Now it can go on one.


  So the two kinds pass the work back and forth. Asking finds what matters and in what words. Counting says how common it is. A trial says whether a fix works.

  '
illustration.analogy_breaks_when: 'The line between the two kinds is not always this clean. "Which patients stop coming, and why?" asks for a count and a reason at once. Split a question like that into its two halves before you choose a method, and give each half its own method.

  '
must_know[0].point: 'The error is to treat an interview study as a trial that could not afford enough people. It is not a small trial. It answers a question a trial cannot, such as why patients stop coming.

  '
must_know[1].point: 'Before you choose a method, write the research question as one sentence and look at its first words. "How many" and "how much" send you to counting and measuring. "What", "how" and "why" send you to asking people.

  '
must_know[2].point: 'Someone in a meeting will call interview findings "anecdotal" because they sit low on the evidence hierarchy. Answer that the ladder ranks designs for testing whether a treatment works. It has no rung for why patients leave.

  '
must_know[3].point: 'A drop-out number tells a programme how big its problem is. It does not say what to change.

  '
must_know[4].point: 'Asking people tells you which reasons exist and how they work. It cannot tell you how common each reason is, or whether a fix works.

  '
