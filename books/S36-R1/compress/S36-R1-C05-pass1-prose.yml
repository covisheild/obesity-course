definition.text: |
  A closed question fixes the possible answers before the respondent speaks. The answer is yes
  or no, a number, or one of a set of options the question supplies.

  An open question leaves the form of the answer to the respondent.

  Open and closed describe the form of the answer. Whether a question is leading is a separate
  property. A leading question shows the answer the asker expects, or takes for granted part of
  what it is asking about.

  A double question asks two things in one sentence.

  The standard for the questions of a semi-structured interview, in DeJonckheere and Vaughn's
  words: "All questions should be open ended, neutral, clear and avoid leading language."
simplified_explanation: |
  Every
  question you write can be put through three checks.

  **Check 1: the form of the answer.** Could the person answer with yes, no, a number, or one of
  the options you gave them? Then it is a closed question.
  If they have to answer in their own words, it is an open question.

  **Check 2: what the question takes for granted.** Book 0 called a statement that an argument
  rests on a premise (`B0-R0-C42`). Some questions carry a premise the respondent never offered.
  "How hard is the diet for you?" rests on "the diet is hard".

  Other questions show which answer you would like: "Don't you think the tablets help?" Both
  kinds are leading questions. A leading question can be open or closed.

  **Check 3: how many questions are in it.** "Did the doctor explain the diet, and did you follow
  it?" is two questions. That is
  a double question. Split it.

  One more trap, about the word "why". "Why did you stop coming?" is open.

  Ask what happened instead: "Tell me about the last time
  you came here."

  Closed questions are not wrong. "How old are you?" should be closed.

  Last, a clash of words to know about. DeJonckheere and Vaughn's guide to interviewing lists a
  probe called "leading". It is not a leading question.
must_know[0].point: |
  An open question can still lead. Run the premise check on every question, including the ones that
  start with "how" or "what".
must_know[1].point: |
  Refuse the quick fix of deleting "don't you". A rewrite that removes the signal words and keeps
  the premise is still leading.
must_know[2].point: |
  Ask "what happened" before "why". "Why did you stop coming?" asks a patient to defend a
  decision you have assumed she made.
must_know[3].point: |
  A yes to a leading question tells you the respondent did not contradict you. If the question carried the
  premise, the answer cannot be evidence for it.
must_know[4].point: |
  The three checks tell you whether a question gives the respondent room. They do not tell you
  whether it asks about the right thing, or in words the respondent uses.
must_know[5].point: |
  When a trainee's list of questions is all closed, do not tell them "use open questions". Take one
  of their questions, ask them what answer they expect, and show them that the question already
  contains it.
