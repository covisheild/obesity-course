definition.text: 'An audio recording of an interview is the record of what was said. A transcript is a written version of that recording, made by a person or a program, and it is the text that analysis works on.

  '
simplified_explanation: 'The recording is what was said in the room. The transcript is what you will read, mark and quote from for the rest of the study. They are not the same thing.


  Full verbatim keeps everything: every filler, every repeated word, every broken-off sentence. Cleaned transcription tidies speech into readable sentences and drops the fillers and repeats. Choose before you start, write the choice down, and use it for every interview.

  '
illustration.body: 'Suppose you are interviewing a woman at the district hospital NCD clinic in Chhattisgarh. She has stopped coming for follow-up, and you want to know why. What follows is a made-up stretch of that interview, about twenty seconds of it, written in English.


  Here is the trap. Two people can type those twenty seconds and produce two different transcripts, and both can say they wrote down "what she said".


  First, the full verbatim version. `I` is you, the interviewer. `R1` is the respondent.


  ```table

  | Speaker | Words |

  | I | And after that, what happened? |

  | R1 | After that... um... I, I did not- I thought I will come next month. [pause, 4 seconds] But my husband, he said, what is the use, you are going there and the weight is not going. |

  | I | Mm-hm. |

  | R1 | [laughs] So. My son [son''s name] also cannot take leave. [inaudible, 00:12:41] and the bus also. |

  ```


  Now the cleaned version of the same twenty seconds.


  ```table

  | Speaker | Words |

  | I | And after that, what happened? |

  | R1 | After that I thought I will come next month. But my husband said, what is the use, you are going there and the weight is not going. |

  | R1 | So my son also cannot take leave, and the bus also. |

  ```


  Read the two side by side and list what the cleaned one dropped.


  - The broken-off "I did not-".

  - The four-second pause before her husband comes in.

  - The laugh before "So".

  - Your own "Mm-hm", a whole turn of yours, gone.

  - The place where something could not be heard.


  Now ask whether any of that matters for your question. A reader of the cleaned version sees a smooth list of reasons. A reader of the full version sees her hesitate at one of them.


  There is no single standard set, so here is one simple set to use in your pilot.


  ```table

  | Mark | What it means |

  | I, R1, R2 | who is speaking: you, then each respondent by number |

  | [pause, 4 seconds] | a silence long enough to notice, with its length |

  | [laughs] | a sound that is not a word |

  | did not- | a word or sentence broken off |

  | [inaudible, 00:12:41] | could not be heard, and the minute and second on the recording where it falls |

  | [son''s name] | a name taken out, replaced by who the person is |

  ```


  The time on the inaudible mark is what lets you, or anyone checking you, go straight to that second of the recording.


  McMullin puts transcription at between three hours and over eight hours of work for one hour of audio, depending on typing speed. Your build target for this rung is five pilot interviews. Suppose each one runs about an hour. Work out the typing time at each end of her range.


  ```working

  5 times 3 = 15 hours at the quick end

  5 times 8 = 40 hours at the slow end

  ```


  Forty is not a ceiling. Plan the hours before you book the interviews, not after.

  '
illustration.analogy_breaks_when: 'The exchange is made up, and it is written in English.


  The hours are for one person typing from a recording.

  '
must_know[0].point: 'A transcript is not the recording. Keep the recording until your analysis is finished. When a quotation or a reading turns on one line, go back and listen to that line.

  '
must_know[1].point: 'Decide full verbatim or cleaned before you type a word. Write the choice at the top of each transcript, and use the same one for all five pilots. For a pilot, full verbatim is the better choice.

  '
must_know[2].point: 'Budget three to more than eight hours of typing for every hour of recording.

  '
must_know[3].point: 'Speech-to-text software gives you a first draft, not a transcript. Check every line of a machine draft against the recording. Before a patient''s voice leaves your own recorder, ask your institutional ethics committee where it may be kept.

  '
must_know[4].point: 'A transcript holds only what was said aloud. Go to the recording and to your field notes, and say in your analysis which one you used.

  '
must_know[5].point: 'Putting their words into English is a second round of choices on top of transcription. Keep the transcript in the language spoken. Say which version any count or quotation comes from, so that anyone checking you can find the words.

  '
must_know[6].point: 'Some papers say only "interviews were recorded and transcribed". Ask who transcribed, full verbatim or cleaned, and whether anyone checked the text against the audio.

  '
