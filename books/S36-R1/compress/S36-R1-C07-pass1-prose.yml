definition.text: 'In India the rules a researcher follows with people who take part in health research
  are set

  out in the National Ethical Guidelines for Biomedical and Health Research Involving Human

  Participants. The Indian Council of Medical Research (ICMR) published them in October 2017.


  Informed consent, in the guidelines'' words, is a process with "three components – providing

  relevant information to potential participants, ensuring the information is comprehended by

  them and assuring voluntariness of participation".


  Privacy is the person''s right to control what is collected about them and who sees it.

  Confidentiality is the researcher''s duty to protect what was entrusted, including "from

  unauthorized access, use, disclosure, modification, loss or theft" (section 2.3).


  Every proposal goes to an ethics committee. The committee, not the researcher, decides the

  kind of review: exemption, a quick review by a few members, or review by the full committee

  (section 4.8.3, Table 4.2).

  '
simplified_explanation: 'Before you ask anyone a research question, three things have to be settled. Does
  the person

  agree, knowing what they are agreeing to? Do they agree to be recorded? And what will happen

  to their words afterwards?


  In India the rulebook for this is the ICMR''s National Ethical Guidelines of 2017. No

  legislature passed it, so it is not a statute.


  An ethics committee is a group of people at a hospital, college or research body. It reads a

  researcher''s plan before any research starts, and it can say yes, no, or change this first.


  Consent, in the guidelines'' own words, has three parts. You give the person the information.

  You make sure they understood it. And you make sure they are free to say no.


  Ask about the recorder on its own, and take no for an answer.


  Privacy is the person''s right to decide who hears about them. Confidentiality is your duty to

  keep safe what they told you.


  Last, the question every learner asks: does my practice interview need an ethics committee?

  You send the plan, and the committee decides.

  '
must_know[0].point: '"It is only a practice interview" is not a category in the ICMR guidelines. Send
  your plan to

  an ethics committee and let it decide, before you record anyone.

  '
must_know[1].point: 'An interview can feel harmless and still carry risk. The main risk is information
  getting out,

  so plan where the recording lives and who hears it before you ask for consent.

  '
must_know[2].point: 'Ask about the recorder as its own question, after consent to the interview. Then
  take written

  notes instead, or do not go ahead, but never record anyway.

  '
must_know[3].point: 'In a clinic, tell the person in plain words that saying no will not change their
  treatment.

  '
must_know[4].point: 'In India a person may not say no out loud. The guidelines tell researchers to read
  silence,

  very short replies or restlessness as possible refusal, and not to carry on (Box 9.4).

  '
must_know[5].point: 'Keep names out of everything but the consent form. Give each person a label such
  as R1 and use

  it on the recording, the file name and the transcript. Keep the list that joins labels to

  names apart from the recordings.

  '
must_know[6].point: 'Tell people the limits of confidentiality, not a promise of perfect secrecy.

  '
must_know[7].point: 'These are ICMR''s 2017 guidelines, read on 24 September 2026. When your question
  is legal

  rather than ethical, take it to your ethics committee or a lawyer, not to this section.

  '
