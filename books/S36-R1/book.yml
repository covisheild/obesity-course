id: S36-R1
number: 3
title: Qualitative and mixed methods · Rung 1
subtitle: Asking people, listening, and treating what they say as data
cover_line: Interviews, focus groups, topic guides, and the quotation as evidence
status: frozen            # frozen | in progress
version: "1.0"
last_updated: 2026-09-24
why: |
  Numbers tell you how many people eat after dark, and how much weight a programme took off. They
  do not tell you why a family keeps the late dinner, or why a clinic's patients stop coming. Those
  are questions about meaning and reasons, and they are answered by asking people and listening
  well. This book teaches the first half of that craft: what questions it answers, the interview
  and the focus group as instruments, the topic guide, and how to run an interview without
  steering it. It ends with five pilot interviews you conduct, transcribe and read yourself.
how_to_read: |
  Read Book 0's sections on evidence first, or at least the ones this book names as it goes. Then
  read this one in order. The exercises here are things to do with people, not sums: write the
  questions, run the practice interview, read your own transcript back. Do them as you go; the
  skill is in the doing.
back_blurb: |
  A short book on qualitative research for someone trained on numbers. It covers what
  qualitative research is for and why it is not a weaker kind of evidence, the semi-structured
  interview and the focus group and how they differ, writing a topic guide of open questions,
  interviewing without leading, and recording, transcribing and reading what was said, with the
  quotation treated as data rather than decoration.
