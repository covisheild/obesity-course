"definition.text": |
  An actor around a policy decision is a person or organisation that tries to shape the
  decision, or is affected by it, without holding the power to take it.

  An actor's interest is what it stands to gain or lose from the decision. Every policy favours
  some and costs others, so every actor around it has an interest.

  Lobbying is representing an organisation's case before government in order to influence policy.
  Inside lobbying takes the case directly to lawmakers and officials.

  Disclosure is stating the interest, so that others can
  weigh the advice. Disclosure does not remove the interest.

  An interest does not remove a right to be heard.
"simplified_explanation": |
  Around every decision
  stand many more people and organisations. They do not hold that power, and they still try to move
  it. Call each of them an actor.

  Here are the usual ones. Professional bodies, such as an association of doctors.
  Non-governmental organisations (NGOs) and consumer groups. The media. Researchers, which includes
  you.

  A government department that advises, but does not decide,
  is an actor too.

  For each actor, ask one question: what does it stand to gain or lose? The answer is its interest.
  A group that works for clean
  air or children's health has one too.

  Actors push in two ways. Inside lobbying takes the case straight to the people in government: a
  meeting, a letter, a comment on a draft. Outside lobbying takes it to the public, through the press
  or a campaign, so that the public presses the government.

  An interest does not take away the right to speak. What you do with
  an actor's interest is weigh it, not silence it.

  The same goes for you. You might gain from one answer through a grant, a job or a result that
  makes your name. Then you have a conflict of interest. Write it down at the front of your note.
  That is disclosure. It lets the reader weigh your advice. It does not make the pull go away.

  This section gives you the actors.
"must_know[0].point": |
  The error is to treat the loudest actor as the decider. None of them can take it.
"must_know[1].point": |
  Refuse a stakeholder list that says "industry", "the public" or "the government". Ask for each
  actor by name. Ask what it stands to gain or lose.
"must_know[2].point": |
  An interest is not a reason to silence an actor. Use the objector's interest to decide where to look
  hardest.
"must_know[3].point": |
  When an advocacy group's figure appears in your note, check it as hard as an industry
  figure.
"must_know[4].point": |
  Disclose every interest you have in the decision you write about, money or not, at the front of
  the note.
"must_know[5].point": |
  For a food tax in India, do not send your note to the Ministry of Health as if it decided.
  They report that the
  Ministry of Finance and the GST Council "determine tax design and rates".
"must_know[6].point": |
  What does it lose if the proposal goes through?
"must_know[7].point": |
  A map of actors tells you who will push and in which direction. Judge the
  argument on its evidence, and leave predictions about who prevails to the process theories of
  the next level.
