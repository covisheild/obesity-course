definition.text: 'In India every lawful exercise of public power rests on an instrument above it. The chain runs

  downward from the Constitution. An Act made by a legislature may give a named body the power to

  make rules or regulations, or to issue notifications and orders. Each lower instrument must stay

  within the one above it.


  A lower instrument normally names the provision it is made under, in words such as "in exercise of

  the powers conferred by".


  Executive power is the second source. Article 73 extends the executive power of the Union to the

  matters on which Parliament has power to make laws. Article 162 extends the executive power of a

  State to the matters on which its Legislature has power to make laws. The words are "has power to

  make laws", not "has made laws".


  An Act can be passed and not yet in force. Section 1(2) of the Digital Personal Data Protection

  Act, 2023 leaves the date to the Central Government, by notification, and allows different dates

  for different provisions. Notification G.S.R. 843(E) of 13 November 2025 brought its provisions

  into force in three stages: some on the date of publication, some one year from it, and the rest

  eighteen months from it.

  '
simplified_explanation: 'Picture a ladder. The Constitution is the top rung. Below it are Acts, made by Parliament or a

  State Legislature. An Act can hand a named body the power to make rules or regulations. Below

  those are notifications and orders, each issued under some section that allows it. A rung cannot

  go further than the rung above lets it.


  Most notifications tell you their own rung. Near the start they say "in exercise of the powers

  conferred by" and name a section.


  A government can also act by executive decision — a decision of the government itself, with no

  new Act behind it.

  '
must_know[0].point: 'The error is to answer "under what authority?" with "the government''s powers". The answer is

  a named provision: an article, a section or a rule, with the body it gives the power to.

  '
must_know[1].point: 'Read a notification backwards. Find the words "in exercise of the powers conferred by", open the

  section they name, and then open the Act that section sits in.

  '
must_know[2].point: 'An Act that has been passed is not always in force. Before you write "the Act requires", read its

  commencement section and find the notification that brought your section into force.

  '
must_know[3].point: 'When a decision names no Act, look at executive power. Then ask for the order that records the

  decision and the body that took it.

  '
must_know[4].point: 'Some matters are open to both Parliament and the State Legislatures. On those, do not assume the

  Union can act inside a State by executive decision. The proviso to article 73 says it cannot,

  unless the Constitution or an Act of Parliament expressly provides for it.

  '
must_know[5].point: 'Write "X has power under Y". Do not write "X can lawfully do Z" unless a source says so.

  '
