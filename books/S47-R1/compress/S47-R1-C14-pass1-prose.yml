definition.text: |
  A frame's diagnosis of cause carries an implied remedy, so each frame makes some measures
  sayable and leaves others outside the discussion.

  The held measurement is the United States survey by Barry and colleagues (2009): {{n:barry_n}} adults,
  late 2006 to early 2007.

  The sinful-behaviour account went with
  opposition to most of them. It went with support for one: letting health insurers charge higher
  premiums to policyholders who are overweight or do not exercise. Support for a tax on junk food went
  with the environment and industry accounts, not with the sinful-behaviour account. The food
  addiction account went with support for warning labels saying such foods may be addictive.

  These are associations measured once, in one country.
simplified_explanation: |
  A frame names a cause. A cause points to a remedy. So once a frame is in place, some measures
  sound sensible and others sound beside the point.

  - If obesity is about each person's choices, the sensible measures are advice, campaigns and
    asking people to change.
  - If obesity is about the food around us, the sensible measures are about that food: what
    schools sell, what labels say, what costs more.
  - If obesity is a disease, the sensible measures are treatment, and protection from unfair
    treatment.

  What people believed caused
  obesity went with which measures they supported.

  So before you argue for a measure, ask which frame makes it sayable. Then ask which frame the
  person deciding is using. If the two do not match, your evidence may never be heard.
must_know[0].point: |
  Before you argue for a measure, name the frame that makes it sayable. Then name the frame the
  decider holds.
must_know[1].point: |
  "People who blame individuals will back a tax on junk food" is the wrong way round, on the one
  survey held. Support for a
  junk-food tax went with the environment and industry accounts, not with the sinful-behaviour
  account.
must_know[2].point: |
  In that survey, adding beliefs about cause raised
  the share of differences in support explained from 0.11 to 0.18. It is not evidence that changing the frame changes support.
must_know[3].point: |
  Never write "framing obesity as environmental raises support by X". Say what was found: beliefs
  and support went together.
must_know[4].point: |
  The Prime Minister's 2025 call to use {{n:edible_oil_cut_pct}}% less oil is framed as personal and family
  responsibility, and its menu is household action. Do not cite it as support for a tax or a
  regulation.
must_know[5].point: |
  When you quote the GST release's "special de-merit rate", you take on its frame: the product is
  the problem. If you are writing to inform rather than to argue, call
  it by its number and its legal basis and let the reader judge.
must_know[6].point: |
  Framing obesity as a disability or a disease is not neutral in its effects. Choose a disease frame knowing which part of the menu
  it opens.
must_know[7].point: |
  The menu rule tells you which measures a frame makes sayable. It does not tell you which measure
  works, or whether the body that must act will act.
