definition.text: "The build target of this book is a written one-page note on one Indian policy proposal that\nnames the body that would have to act. A note meets the target when it answers nine questions,\nin this order.\n\n1. The proposal, in one sentence.\n2. The instrument it needs.\n3. Whose subject it is.\n4. The deciding body, and the provision that gives it the power.\n5. The process the instrument must pass, and how far it has gone, with the date on which that\n   was checked.\n6. Who else must agree.\n7. The frame in which the proposal is argued, and the counter-frame.\n8. What the evidence can settle, and what it cannot.\n9. Which of the two jobs, informing or campaigning, the note does.\n\nEvery factual line rests on a source that has been opened, with the passage found and read\nagainst the line. A line that could not be checked is either removed or named in the note as\nunchecked.\n\nAnswered in this way, the note does the analyst's job as the OpenStax textbook *American\nGovernment* describes it. It identifies the choices open to a decision maker, and it makes sure\nthe decision maker is informed of their implications. It establishes who can act and through which\ninstrument. It does not establish whether that body will act, or whether the instrument would\nachieve its aim.\n"
simplified_explanation: 'Every section of this book gave you one tool. This section uses them together, on one real

  proposal, in the order real work uses them. The result is the build of this book: a one-page note

  that names the body that would have to act.


  The note answers nine questions, always in this order.


  ```table

  | Line | Question | The tool, from |

  | 1 | What is the proposal, in one sentence? | a proposal is not a policy |

  | 2 | What instrument would it need? | the tracing method, step 1 |

  | 3 | Whose subject is it? | Union, State or local; the tracing method, step 2 |

  | 4 | Which body decides, under which provision? | where power comes from; the tracing method, step 3 |

  | 5 | What process must it pass, and how far has it got? | how Acts and rules are made; the tracing method, step 4 |

  | 6 | Who else must agree? | when no single body decides; the tracing method, step 5 |

  | 7 | What frame is it argued in, and what is the counter-frame? | reading the frame |

  | 8 | What can the evidence settle, and what can it not? | what evidence can settle |

  | 9 | Which job does this note do? | informing and campaigning |

  ```


  Lines 2 to 6 end in the one sentence the tracing method taught: X decides, under Y, by process Z,

  with W''s agreement.


  Two rules hold for every line.


  First, check each factual line against the passage it rests on. Book 0''s section on checking a

  reference gave you four acts (`B0-R0-C41`). Find the source. Confirm it is the one named. Find the

  passage. Read it. A line passes only when all four are done.


  Second, write down what you did not check. If you did not read the State''s own notification, say

  so in the note. A line marked "not checked" is honest. A line that looks checked and was not is the

  one that will be found.


  Put a date on the note. Rates, rules and schemes change by notification, and nothing about the

  world has to change for that to happen. A reader needs to know when your note was true.


  The worked case below runs the whole note on the first running proposal of this book, a higher tax

  on sugar-sweetened drinks. Then you write your own, on a proposal you choose.

  '
must_know[0].point: 'Write the trace sentence before anything else: X decides, under Y, by process Z, with W''s

  agreement. If you cannot finish it, your note''s real content is the step where it stopped, and

  the document that would settle that step.

  '
must_know[1].point: 'The error is to write "the GST Council sets the rate". It recommends. The rate has force only

  when it is notified, as the Council''s own release says. Write "recommends", and name the

  notification.

  '
must_know[2].point: 'Refuse "the Union taxes sugary drinks at {{n:gst_demerit_rate_pct}}%". Section 9(1) of the CGST

  Act caps the central tax at {{n:cgst_sugary_drinks_rate_pct}} per cent, and the central

  notification puts these drinks at that rate. The {{n:gst_demerit_rate_pct}}% is the combined rate

  the release gives.

  '
must_know[3].point: 'Do not read "28% to {{n:gst_demerit_rate_pct}}%" as a rise of 12 points in the tax on sugary drinks. A 2026 review reports

  that the old 28% came with a 12% cess, and the 2025 change folded both into one rate. Read the

  "before" column of any rate table for what it leaves out.

  '
must_know[4].point: 'Address the note to a member of the body that decides, or to whoever names that member. For a GST

  rate, the State''s voice on the Council is the minister its State Government names. A health

  ministry is not a member, and a note addressed to it reaches an adviser.

  '
must_know[5].point: 'Date the note, name the newest amendment you opened, and name what you did not open. A reader who

  finds an unchecked line you named trusts the rest. A reader who finds one you hid trusts nothing.

  '
must_know[6].point: 'Put the frame in the note, including the one the deciding body itself uses. A tax that its own

  release presents as simplification is argued differently from one presented as health policy.

  The committee needs to know which conversation it is joining.

  '
must_know[7].point: 'The note tells its reader who can act, through which instrument, and how the argument runs. It

  does not tell them whether that body will act, or whether the instrument would change anyone''s

  health. When someone reads your note as a case for the tax, point to its last line.

  '
