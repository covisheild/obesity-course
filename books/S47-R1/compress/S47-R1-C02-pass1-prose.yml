definition.text: |
  Around any public decision, four jobs can be told apart. Someone proposes a course of action.
  Someone advises or recommends. A body with the legal power decides. Offices carry the decision
  out and enforce it.

  Minimum support prices (MSP), the prices at which the government will buy certain crops. The
  Commission for Agricultural Costs and Prices (CACP) recommends them. For the
  kharif crops of marketing season 2026-27, the Cabinet Committee on Economic Affairs (CCEA)
  approved them.

  Food regulations under the Food Safety and Standards (FSS) Act, 2006. The Central Advisory Committee
  advises the Food Safety and Standards Authority of India (the Food Authority). The Food Authority
  makes regulations, with the previous approval of the Central Government and after previous
  publication, by notification (section 92(1)). So the decide job needs two bodies.

  "Who decides" names the body that holds the decide job under a named power.
simplified_explanation: |
  Four jobs happen around almost every public decision.

  1. **Propose.** Someone puts an idea forward.
  2. **Advise.** Someone studies the idea and recommends what to do. An adviser has no power to
     decide.
  3. **Decide.** One body holds the legal power to make the decision.
  4. **Carry out.** Offices put the decision into effect and make sure people follow it.

  Here is the trap. People name whoever they heard about.
must_know[0].point: |
  The error is to name the body that recommends as the body that decides. The Commission for
  Agricultural Costs and Prices recommends minimum support prices; the Cabinet Committee on Economic
  Affairs approves them.
must_know[1].point: |
  For any proposal, write four lines: who proposes, who advises, who decides, who carries it out.
  Fill each with a named body and the place that says so.
must_know[2].point: |
  A food regulation needs the Food Authority and the
  previous approval of the Central Government (FSS Act, section 92(1)). Address a note to every
  body whose agreement the law requires.
must_know[3].point: |
  The body that decides and the body that carries out can sit in different governments. Food
  regulations are made at the Union level and implemented by each State's Commissioner of Food
  Safety and the district's Designated Officer.
must_know[4].point: |
  A court can direct a body to act. Making the regulation is still the job of the body the statute
  names.
must_know[5].point: |
  The four jobs tell you who holds formal power. They do not tell you who has influence, or whether
  the decider will act.
