definition.text: |
  Authority over one proposal is often shared, in three common shapes.

  First, two legislatures may make law on the same subject.

  Second, one body may seat members of both governments. The Goods and Services Tax (GST) Council is set up under Article 279A. The Union Finance Minister chairs it. Its other members are the Union Minister of State in charge of Revenue or Finance and a minister nominated by each State Government.

  A recommendation is not a tax.

  Third, several bodies may each hold a power over part of one thing.

  A proposal addressed to "the government" names none of these bodies.
simplified_explanation: |
  Sometimes no one body can say yes on its own. Here is the trap: a note that writes "the government should" has named no one, so no one has to answer it.

  The GST Council is the clearest case. It recommends tax rates. It does not levy them. The Central Government then issues the notification that sets the central rate.

  When several bodies must act, ask which one goes first. That is the one your note should be addressed to.
must_know[0].point: |
  "The GST Council set the tax on sugary drinks" is wrong. The Council recommends, under Article 279A(4). The Central Government notifies the central rate under section 9(1) of the Central Goods and Services Tax Act.
must_know[1].point: |
  Central tax on sugar-added and flavoured drinks (heading 2202 10) is {{n:cgst_sugary_drinks_rate_pct}} per cent. Never write that the Union levies {{n:gst_demerit_rate_pct}} per cent: section 9(1) caps the central rate at twenty.
must_know[2].point: |
  Under Article 279A(9) a GST Council decision needs {{n:gst_council_majority}} of the weighted votes, with the Centre holding {{n:gst_union_vote_weight}} and the States together {{n:gst_states_vote_weight}}. Neither side reaches {{n:gst_council_majority_pct}} per cent alone.
must_know[3].point: |
  When several bodies must act, write down the order. Ask whose act the others rest on. That body moves first, and your note goes to it first.
must_know[4].point: |
  A proposal addressed to "the government" is addressed to no one. If you cannot yet name the body, write "not yet traced" and list what you will open next.
must_know[5].point: |
  One tax change carries several dates: recommended 3 September 2025, notified 17 September, in force 22 September, amended in force 1 May 2026. Quote the date of the instrument that supports your sentence.
must_know[6].point: |
  A map of who shares a decision tells you whom to address and in what order. It does not tell you how they will vote, or how the States' votes divide.
