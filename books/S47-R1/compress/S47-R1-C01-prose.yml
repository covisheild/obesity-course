definition.text: 'A proposal is a course of action that someone wants a public body to take. It pairs a problem

  with a solution. Until a body with the power to decide has decided it, it is only a proposal,

  however widely it is supported.


  Public policy is what government does about matters of concern to some part of society. One

  textbook definition calls it "the relatively stable set of purposive governmental actions that

  address matters of concern to some part of society". A legislature passing an Act, an executive

  issuing an order and a court announcing a ruling all make public policy. Policy also includes the

  outcomes government action creates, and a choice not to act. It has a written form, in Acts,

  orders and policy statements, and an experienced form, in what officials and services actually do.

  The two can differ.


  A programme is the organised activity through which an agency carries a policy out. A law is one

  place in which a policy can be recorded, among others such as an executive order or

  a policy statement.


  A common textbook model divides the policy process into four stages: agenda setting (made up of

  problem identification and the specifying of alternative solutions), enactment, implementation

  and evaluation, with evaluation feeding back into the others. Analysts who study policy as a

  political process do not assume that these stages occur in order, or that every decision passes

  through all of them.


  Every policy promotes some behaviour and penalises other behaviour, so every policy has people

  who gain and people who lose, if only those who pay for it.

  '
simplified_explanation: "Here is the setting for this book. You are a postgraduate in community medicine at a medical\ncollege in Chhattisgarh. Your department wants to propose action on obesity among school children\nand young adults in the district. For each idea, you must work out who would have to act, under\nwhat power, and how to write about it.\n\nStart with three words that people use as if they meant the same thing.\n\n- A **proposal** is what someone wants a public body to do. \"Tax sugary drinks more\" is a\n  proposal. It stays a proposal until a body with the power to decide has decided it.\n- A **policy** is what a government has actually decided and done about a problem. It is\n  written down somewhere you can open: an Act, an order, a policy statement. It also includes what\n  happens on the ground, which can differ from what is written. Choosing not to act is a policy too.\n- A **programme** is the work an office does to carry a policy out: the staff, the money, the\n  forms, the visits.\n\nA law — an Act, a rule, a regulation — is one kind of written policy. It is not the only kind.\n\nTextbooks draw the life of a policy as four stages. A problem gets onto the agenda, with options\nfor solving it. A body decides on one. Offices carry it out. Someone checks whether it worked.\n\nUse the stages as a list of jobs that must happen somewhere. Do not use them as a timetable. Real\ndecisions skip stages, go back, and happen out of order.\n\nLast, every policy helps some people and costs others. Before you propose anything, write down who\nwould lose. They will be the first to speak against you.\n"
must_know[0].point: 'The error is to call a proposal a policy because many people support it, or because your

  department has agreed on it. Before you write "policy" about anything, say which body decided

  it and where the decision is written down. If you cannot, write "proposal".

  '
must_know[1].point: 'Ask three questions of any sentence that claims a policy exists. Who decided it? Does that body

  have the power to decide it? Where is the decision recorded in a form that binds anyone? A

  sentence that fails any one of them describes a proposal.

  '
must_know[2].point: 'A policy document can contain options that it does not decide. The National Health Policy 2017

  says the Government "could consider" taxes on foods harmful to health. That sets no tax. When

  someone cites a policy for a measure, find the sentence and check that it decides, rather than

  considers.

  '
must_know[3].point: 'Policy is also what offices actually do, and that can differ from what the document says. When

  you describe a policy in a note, say whether you are describing the text or the practice. Do not

  claim the practice from the text alone.

  '
must_know[4].point: 'A decision not to act is policy too. If a body with the power to act has been asked and has not

  acted, write that as its current policy. Do not write that "there is no policy".

  '
must_know[5].point: 'Every proposal has losers, if only those who pay. Name them in your own note before anyone else

  does. Expect those who gain from things as they are to work against the change.

  '
must_know[6].point: 'The four stages are a teaching model, and real decisions do not follow them in order. Use the

  stages to ask which job is still missing for your proposal. Never use them to predict what

  happens next, or to argue that a decision "cannot" come before a problem has been agreed.

  '
