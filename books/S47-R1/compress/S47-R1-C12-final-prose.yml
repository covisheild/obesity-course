definition.text: 'To frame an issue is to choose which of its aspects an account makes prominent and which it leaves out. In the form most used in health policy

  research, the choice serves four functions. The account defines a problem, diagnoses its cause, passes a moral judgement and suggests a remedy.

  These four are Entman''s (1993), as reported by Koon, Hawkins and Mayhew in a 2016 review of framing research on health policy.


  A frame need not show all four. Selection alone is enough to frame.


  An episodic frame tells an issue through one case or event, with its details. A thematic frame takes the broad view: the trend over time and

  what led to it.


  Agenda setting is the choice of which issues get attention at all, the part of the policy process that comes first.

  '
simplified_explanation: 'Any account of a problem leaves things out. It has to: no report, speech or note can say

  everything. What it keeps in, and what it drops, is its frame.


  A frame usually does four jobs.


  1. **Problem.** What does it say is wrong?

  2. **Cause.** Whom or what does it say is to blame?

  3. **Judgement.** What verdict does it pass: who is at fault, what is fair?

  4. **Remedy.** What does it say should be done?


  These four come from a writer named Entman, as a 2016 review by Koon and colleagues reports

  them. Not every account carries all four. But every account leaves something out, so every

  account has a frame. Your own notes do too.


  An **episodic** frame tells the issue through one case: one child, one shop, one day. A

  **thematic** frame tells the trend: what changed over years and why. **Agenda setting** is

  choosing which issues get talked about at all, before any frame is chosen. **Priming** is when

  what you read first tilts how you judge what comes next.

  '
must_know[0].point: 'When someone claims to be neutral, ask which frame they are using and what it leaves out.

  '
must_know[1].point: 'Before you agree or disagree with a paragraph, write its four labels: problem, cause, judgement,

  remedy. Then write one line on what it leaves out.

  '
must_know[2].point: 'When you cite the four functions, cite them as Entman''s, as reported by Koon and colleagues

  (2016).

  '
must_know[3].point: '"Frame" is used for values, problems, metaphors and arguments, as Koon and colleagues found.

  '
must_know[4].point: 'Keep the three ideas apart in a meeting. Agenda setting decides whether obesity is discussed at

  all. Framing decides how it is described once it is. Priming is what a first story does to the

  next judgement. Calling all three "framing" loses the one you need.

  '
must_know[5].point: 'Labelling a frame tells you what a text chose to show. Never answer an argument only by

  naming its frame.

  '
must_know[6].point: 'The frame of a proposal decides where it gets sent. Choose the frame of your own note on

  purpose, and say it in the first lines.

  '
