definition.text: 'The build target of this book is a written one-page note on one Indian policy proposal that

  names the body that would have to act. A note meets the target when it answers nine questions,

  in this order.


  Every factual line rests on a source that has been opened, with the passage found and read against

  the line.

  '
simplified_explanation: 'The note answers nine questions, always in this order.


  ```table

  | Line | Question | The tool, from |

  | 1 | What is the proposal, in one sentence? | a proposal is not a policy |

  | 2 | What instrument would it need? | the tracing method, step 1 |

  | 3 | Whose subject is it? | Union, State or local; the tracing method, step 2 |

  | 4 | Which body decides, under which provision? | where power comes from; the tracing method, step 3 |

  | 5 | What process must it pass, and how far has it got? | how Acts and rules are made; the tracing method, step 4 |

  | 6 | Who else must agree? | when no single body decides; the tracing method, step 5 |

  | 7 | What frame is it argued in, and what is the counter-frame? | reading the frame |

  | 8 | What can the evidence settle, and what can it not? | what evidence can settle |

  | 9 | Which job does this note do? | informing and campaigning |

  ```


  Lines 2 to 6 end in the one sentence the tracing method taught: X decides, under Y, by process Z,

  with W''s agreement.


  Two rules hold for every line.


  First, check each factual line against the passage it rests on. Find the source. Confirm it is the one named. Find

  the passage. Read it.


  Second, write down what you did not check. If you did not read the State''s own notification, say so in the note.


  Put a date on the note. A reader needs to know when your note was true.

  '
must_know[0].point: 'Write the trace sentence before anything else: X decides, under Y, by process Z, with W''s

  agreement.

  '
must_know[1].point: 'The error is to write "the GST Council sets the rate". It recommends. Write "recommends", and

  name the notification.

  '
must_know[2].point: 'Refuse "the Union taxes sugary drinks at {{n:gst_demerit_rate_pct}}%". Section 9(1) of the CGST

  Act caps the central tax at {{n:cgst_sugary_drinks_rate_pct}} per cent, and the central

  notification puts these drinks at that rate. The {{n:gst_demerit_rate_pct}}% is the combined rate

  the release gives.

  '
must_know[3].point: 'Do not read "28% to {{n:gst_demerit_rate_pct}}%" as a rise of 12 points in the tax on sugary drinks. A 2026 review reports

  that the old 28% came with a 12% cess, and the 2025 change folded both into one rate.

  '
must_know[4].point: 'Address the note to a member of the body that decides, or to whoever names that member. For a GST

  rate, the State''s voice on the Council is the minister its State Government names.

  '
must_know[5].point: 'Date the note, name the newest amendment you opened, and name what you did not open.

  '
must_know[6].point: 'Put the frame in the note, including the one the deciding body itself uses.

  '
must_know[7].point: 'The note tells its reader who can act, through which instrument, and how the argument runs. It

  does not tell them whether that body will act, or whether the instrument would change anyone''s

  health.

  '
