definition.text: |
  Obesity is argued in several frames, each placing the cause, and so the responsibility,
  somewhere different.

  Obesity is a matter of personal
  choice and effort. It is the product of a food environment that makes unhealthy food cheap and
  easy. It is the result of manipulation by commercial interests. It is a disease or medical
  condition. It is a question of social justice against market justice.

  The largest held measurement is a United States survey by Barry, Brescoll, Brownell and
  Schlesinger (2009). The seven were: sinful behaviour, disability,
  eating disorder, food addiction, time crunch, manipulation by commercial interests, and a toxic
  food environment. The authors arrange them from the most personal blame to the least.

  A majority called each of the seven important. The toxic food environment led, at 77.5 per
  cent (weighted to the national population). Sinful behaviour came last, at 50.5 per cent.

  No held study measures which frame dominates news or official texts in India.
simplified_explanation: |
  Obesity is argued in a
  handful of frames that keep coming back. Each one puts the cause somewhere different.

  - **Personal choice.** The cause is what each person eats and how much they move.
  - **Food environment.** The cause is what is cheap, easy and everywhere.
  - **Commercial interests.** The cause is what companies make, sell and advertise.
  - **Disease.** Obesity is a medical condition, to be diagnosed and treated.
  - **Justice.** The question is who bears the burden, and whether that is fair.

  Some studies also find a frame that rejects the problem itself: bodies come in many sizes.

  So you can name the frames with confidence. You cannot yet say which one is winning in India.
must_know[0].point: |
  Never say "most people blame the food environment". Say "an important explanation among
  several", with the country, the years and the sample.
must_know[1].point: |
  Do not sort a person, a ministry or a newspaper into one frame. Expect people to hold the personal and the
  environmental frame together, and argue with both.
must_know[2].point: |
  A United States survey from 2006-07 is not Indian public opinion. No study held here measures
  which frames Indians hold about obesity.
must_know[3].point: |
  In Indian argument over food taxes, expect a revenue frame. A health case for a tax has to meet that frame head on, not ignore it.
must_know[4].point: |
  Expect the fairness frame too. A note on a food tax that does not say who pays will be
  answered in that frame.
must_know[5].point: |
  The research on obesity frames in policy is thin. Koon and colleagues found 3 obesity studies
  among 52 on framing and health policy up to 2014, none from India.
must_know[6].point: |
  Before you use an interview study's frames, count who was asked. Such a study shows that
  a frame exists among people near the decision, never how common it is.
must_know[7].point: |
  Know what would overturn these findings. Until then, quote each finding with its country, its years and its sample.
