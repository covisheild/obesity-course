definition.text: 'Article 77(3) has the President make rules for the transaction of the Government''s business and

  for its allocation among Ministers. Two orders of 14 January 1961 are those rules.


  The Government of India (Allocation of Business) Rules, 1961 say who owns what. Rule 2 lists the

  Ministries, Departments, Secretariats and Offices in the First Schedule, and calls them all

  "departments". Rule 3 distributes the subjects among them in the Second Schedule. The rules

  stand as amended up to Amendment Series no. 386 of 22 July 2026.


  The Food Safety and Standards Act, 2006 is with the Department of Health and Family Welfare (item

  3(a)). The Goods and Services Tax Council and the Central Goods and Services Tax Act are with the

  Department of Revenue (items 18A and 21(a)).


  Aerated water and soft drinks, and industries such as biscuits, confectionery and ready-to-eat

  foods, are with the Ministry of Food Processing Industries (items 6 and 2). Regulation of

  packaged commodities is with the Department of Consumer Affairs (item 6).


  The Government of India (Transaction of Business) Rules, 1961 say how business is decided.


  Under rule 7, the cases in the Second Schedule go before the Cabinet. They include cases

  involving legislation, differences of opinion between Ministers, and proposals to vary or reverse

  a Cabinet decision. Standing Committees of the Cabinet may decide matters referred to them, and

  the Cabinet may review their decisions (rule 6).

  '
simplified_explanation: 'At the top sits the Council of Ministers, led by the Prime Minister. The senior ministers in it

  form the Cabinet. Below them, the work is split among ministries, and most ministries are split

  again into departments.


  The Allocation of Business Rules say which department owns which subject. The Transaction of

  Business Rules say who decides a case, and which cases must go to the Cabinet.


  So "the government should act" names nobody. Your note has to name the department, and the entry

  in the rules that gives it the subject.

  '
must_know[0].point: 'The food ministry does not own food safety. Its Department of Food and Public Distribution has

  the public distribution system, grain, sugar and food prices. The Food Safety and Standards Act

  sits with the Department of Health and Family Welfare (Allocation of Business Rules, Second

  Schedule, item 3(a)). Send a food-standards proposal there, not to the food department.

  '
must_know[1].point: '"The government" is never an answer. Name the department and the item in the Second Schedule of

  the Allocation of Business Rules that gives it the subject. Add the amendment series you read.

  '
must_know[2].point: 'The department that develops an industry is not the one that taxes it or sets its safety

  standards. Aerated water and soft drinks sit with the Ministry of Food Processing Industries.

  The tax sits with the Department of Revenue, and food standards with Health.

  '
must_know[3].point: 'A decision in one department may affect another''s business. Then nothing is decided until all

  of them agree, or the Cabinet decides (Transaction of Business Rules, rule 4(1)).

  '
must_know[4].point: 'Every proposal for a new Act goes to the Ministry of Law (rule 4(3)). It then goes to the whole

  Cabinet before Parliament sees it (Second Schedule, entry (a)).

  '
must_know[5].point: 'These rules show who owns a subject and whose agreement a decision needs. They give no

  department the power to make a rule or a regulation; that comes from an Act. For Chhattisgarh,

  open the State''s own business rules (Article 166(3)) before naming a State department.

  '
