definition.text: 'A proposal is a course of action that someone wants a public body to take. Until a body with the

  power to decide has decided it, it is only a proposal, however widely it is supported.


  Public policy is what government does about matters of concern to some part of society. Policy

  also includes the outcomes government action creates, and a choice not to act.


  A programme is the organised activity through which an agency carries a policy out.


  A common textbook model divides the policy process into four stages: agenda setting (made up of

  problem identification and the specifying of alternative solutions), enactment, implementation and

  evaluation, with evaluation feeding back into the others.

  '
simplified_explanation: "You are a postgraduate in community medicine at a medical college in Chhattisgarh. Your department\nwants to propose action on obesity among school children and young adults in the district.\n\n- A **proposal** is what someone wants a public body to do. \"Tax sugary drinks more\" is a proposal.\n- A **policy** is what a government has actually decided and done about a problem.\n- A **programme** is the work an office does to carry a policy out: the staff, the money, the\n  forms, the visits.\n\nTextbooks draw the life of a policy as four stages. A problem gets onto the agenda, with options\nfor solving it. A body decides on one. Offices carry it out. Someone checks whether it worked.\n\nUse the stages as a list of jobs that must happen somewhere. Do not use them as a timetable. Real\ndecisions skip stages, go back, and happen out of order.\n\nBefore you propose anything, write down who would lose.\n"
must_know[0].point: 'Before you write "policy" about anything, say which body decided it and where the decision is

  written down. If you cannot, write "proposal".

  '
must_know[1].point: 'Ask three questions of any sentence that claims a policy exists. Who decided it? Does that body

  have the power to decide it? Where is the decision recorded in a form that binds anyone?

  '
must_know[2].point: 'A policy document can contain options that it does not decide. The National Health Policy 2017

  says the Government "could consider" taxes on foods harmful to health. That sets no tax.

  '
must_know[3].point: 'Policy is also what offices actually do, and that can differ from what the document says. When

  you describe a policy in a note, say whether you are describing the text or the practice.

  '
must_know[4].point: 'If a body with the power to act has been asked and has not acted, write that as its current

  policy. Do not write that "there is no policy".

  '
must_know[5].point: 'Every proposal has losers, if only those who pay. Name them in your own note before anyone else

  does.

  '
must_know[6].point: 'Use the stages to ask which job is still missing for your proposal.

  '
