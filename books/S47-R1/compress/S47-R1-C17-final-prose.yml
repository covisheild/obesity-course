definition.text: 'The same evidence can be put to two different jobs. Informing policy sets out the options

  open to the body that decides, what the evidence says about the effects of each, and how

  uncertain that evidence is, without choosing among the options. The OpenStax textbook

  *American Government* calls the people who do this policy analysts. Campaigning for policy,

  also called advocacy, starts from a position about what ought to be done and argues for one

  option; the same textbook calls these people policy advocates.


  Both jobs are legitimate. The defect is a document that does one job while presenting itself as

  doing the other, most often a campaign presented as a neutral account of the evidence.

  '
simplified_explanation: 'You can do two different jobs with the same evidence.


  The first job is informing. You set out the options open to the body that decides. For each option you say what the evidence shows, and how sure

  anyone can be. You do not pick one.


  The second job is campaigning, also called advocacy. You start from what you think ought to happen, and you argue for one option.


  Both jobs are honest work. The trouble starts when a document does one job and looks like the other. The usual case is a campaign dressed as a

  neutral summary of the evidence.


  Here are four marks to look for.


  ```table

  | Mark | What it looks like |

  | 1. Selective evidence | only the studies that support one option are cited, and the reader is not told how they were chosen |

  | 2. Uncertainty changed | ranges, model assumptions and limits are dropped; or, the other way, doubt is made up about evidence the writer dislikes |

  | 3. A value written as a finding | "the evidence shows we must..." — a judgement about what ought to be done, written as if a study had found it |

  | 4. An interest not declared | the writer, the department or the funder stands to gain or lose from the decision, and the document does not say so |

  ```


  Mark 3 is the commonest in health writing. A conclusion about what ought to be done needs a value premise: a premise that says what matters, or what

  ought to be done. No study supplies one.


  Mark 2 cuts both ways. A campaign for an option drops the doubt. A campaign against it often adds doubt that the evidence does not carry.


  Decide which job a document does before you write its first line. Then say so, in the document. "This note sets out the options and does not

  recommend one." Or: "This letter argues for a higher tax."

  '
must_know[0].point: 'The error is to treat a sentence with a number or a citation in it as informing. Ask what

  was left out before you ask whether what is there is right.

  '
must_know[1].point: 'Decide which job a document does before you write its first line.

  '
must_know[2].point: 'Give a value its own sentence in a note meant to inform. Make that sentence say it is a choice.

  '
must_know[3].point: 'Refuse "the evidence shows we must" in any document you sign, including a trainee''s draft you are

  correcting. Split it in two: what the evidence shows, in one sentence; what you think should be

  done, in another, marked as yours.

  '
must_know[4].point: 'Watch for doubt as well as for confidence. If the studies agree and the summary says "the

  evidence is unclear", that is mark 2 run backwards.

  '
must_know[5].point: 'Declare your department''s own position and money, even when nobody asks.

  '
must_know[6].point: 'The line between the two jobs is disputed. Some of the advice Oliver and Cairney reviewed says

  researchers who want influence must engage so far that it blurs. This book''s rule does not deny

  that.

  '
must_know[7].point: 'The four marks tell you whether a document is honest about its job.

  '
