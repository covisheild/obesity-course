definition.text: 'Evidence is a set of facts, known through observation, offered in
  support of a conclusion. It

  is not the conclusion.


  In a policy choice, evidence can answer three kinds of question: how big a problem
  is, and for

  whom; what an option does, compared with doing something else; and what it costs.
  The choice

  also turns on questions that evidence does not settle.


  Evidence-informed policymaking names a process in which the evidence used, and the

  judgements made about it, are found and stated systematically and openly.

  '
simplified_explanation: "Take any policy choice and split it into questions. Some\
  \ of them, evidence can answer:\n\n- **How big is the problem, and for whom?** A\
  \ survey can count it.\n- **What does an option do, compared with something else?**\
  \ A study or a model can estimate it.\n- **What does it cost?** That can be worked\
  \ out.\n\nOthers, evidence cannot settle on its own:\n\n- **Which outcomes matter\
  \ most?** That is a question of values.\n- **Who gains and who loses, and is that\
  \ fair?** Whether it is fair is a\n  value judgement.\n- **Can it be done?** This\
  \ is called feasibility.\n- **Is now the time?** That is a judgement of timing.\n\
  \nSo any sentence that says \"the government should\" has a hidden premise. It is\
  \ a value premise —\na premise that says what matters, or what ought to be done.\
  \ Leave it hidden, and the evidence seems to say something it cannot say.\n"
must_know[0].point: 'The error is to write "the evidence shows we should". "Should"
  needs a value premise. Write that premise out in your note, as a

  premise.

  '
must_know[1].point: 'Before you write a recommendation, split the choice into questions.
  Give each side its own sentences.

  '
must_know[2].point: 'A projected effect from a model, or a result from another country,
  is evidence about that

  setting. Using it for your district is a judgement that it applies. Say so in the
  same sentence

  as the number.

  '
must_know[3].point: 'Summan and colleagues report a modelling study of an extra health
  tax of {{n:summan_model_tax_range}}. It

  projects that demand for sugar-sweetened drinks could fall by {{n:summan_model_demand_fall}}.
  Quote it as their report, and never as a fall in obesity.

  '
must_know[4].point: 'When someone in a meeting says "the evidence is not settled",
  ask which question is unsettled.

  '
must_know[5].point: 'Say how sure the evidence is, out loud, in the note.

  '
must_know[6].point: 'A trainee''s discussion section often ends "hence the government
  should". Ask them to write the

  value premise that sentence needs, and to name the body that would act.

  '
must_know[7].point: 'Sorting the questions shows which ones evidence can answer. Judging
  a study''s quality is a separate skill.

  '
