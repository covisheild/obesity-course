definition.text: 'A Bill introduced by a Minister is a Government Bill. A Bill introduced by a member who is not a Minister is a Private Member''s Bill.


  Before a Government Bill reaches Parliament, three steps apply inside the Union government. The first is the Pre-legislative

  Consultation Policy, a decision of the Committee of Secretaries of 10 January 2014. The Policy is not a statute. The Transaction of

  Business Rules require the Ministry of Law to be consulted on proposals for legislation (rule 4(3)(a)), and send cases involving

  legislation to the Cabinet (Second Schedule, entry (a)).


  In Parliament, a Bill may start in either House, unless it is a Money Bill (Article 107(1)). It is introduced on a motion for leave,

  the first reading, and published in the Gazette. It may be referred to a Department-related Parliamentary Standing Committee.


  A Money Bill is a Bill that contains only provisions on the matters in Article 110(1), the first

  of which is the imposition, abolition, remission, alteration or regulation of any tax. It cannot

  be introduced in the Rajya Sabha (the Council of States). The Rajya Sabha may only recommend

  amendments, within fourteen days, which the Lok Sabha (the House of the People) may accept or

  reject (Article 109). The Speaker of the Lok Sabha decides whether a Bill is a Money Bill

  (Article 110(3)).

  '
simplified_explanation: 'A Bill is a statute in draft. Most Bills come from a minister''s department. The Union''s own

  policy asks the department to put the draft in public for at least {{n:plcp_comment_days}}

  days first, so that anyone can comment. But that policy is not a law, and a department can skip

  it if it writes down why.


  Then the Cabinet approves the Bill and it goes to Parliament. Each House reads it three times.


  In the first reading it is introduced. In the second, members debate it and go through it clause

  by clause, and it may be sent to a committee. In the third, the House votes to pass it. Then the

  other House does the same.


  For you, two doors matter most: the public consultation before the Bill, and the committee that

  examines it.

  '
must_know[0].point: 'Do not count on {{n:plcp_comment_days}} days to comment on a draft Bill. The Pre-legislative

  Consultation Policy is a decision of senior civil servants, not a law.

  '
must_know[1].point: 'Your evidence can enter at two sourced points. One is the pre-legislative consultation, if it

  is held. The other is a committee examining the Bill, which can take evidence from experts.

  '
must_know[2].point: '"Parliament has passed the Bill" is not yet "the law says". A Bill becomes an Act only when

  both Houses have agreed to the same text and the President has assented. An Act may then wait

  for a notification before it is in force.

  '
must_know[3].point: 'Do not describe a Private Member''s Bill as a likely route to a new law.

  '
must_know[4].point: 'A Bill that only deals with tax is a Money Bill. The Rajya Sabha can only recommend changes,

  within fourteen days, and the Lok Sabha may reject them all.

  '
must_know[5].point: 'A State Bill goes through the State Legislature and then to the Governor, who may reserve it

  for the President (Article 200).

  '
