"definition.text": |
  Article 246 of the Constitution divides the power to make law by subject.

  State List entry 6 is public health and sanitation, hospitals and dispensaries. Concurrent List entry 18 is adulteration of foodstuffs and other goods. Concurrent List entry 33(b) is trade and commerce in, and the production, supply and distribution of, foodstuffs.

  Below the State sit the panchayats and the municipalities. Articles 243G and 243W let the Legislature of a State, by law, endow them with powers and responsibilities, including for the matters listed in the Eleventh Schedule (panchayats) and the Twelfth Schedule (municipalities).

  As of 2 October 2026, on the text of the Constitution as on 1 May 2026.
"simplified_explanation": |
  Each list is a numbered set of entries, and each entry is a subject in a few words. A subject on the Union List belongs to Parliament. A subject on the State List belongs to each State's Legislature. A subject on the Concurrent List belongs to both.

  Below the State there is a third tier: the panchayats in villages and the municipalities in towns.

  So one proposal can land on three governments at once. Your job is to find every entry it touches, not the first one that fits.
"must_know[0].point": |
  "Health is a State subject, so the State decides" is the commonest wrong answer. But food is Concurrent (entries 18 and 33), and the Food Safety and Standards Act puts the food industry under Union control.
"must_know[1].point": |
  On a Concurrent subject, Parliament's Act wins a clash. The State law is void where the two clash (Article 254(1)). The one way round this is a State law sent to the President and signed by him (Article 254(2)). So before you propose a State rule on food, open the Union's food Act and read what it already covers.
"must_know[2].point": |
  The Eleventh and Twelfth Schedules list what a State may give its local bodies. To say one can act, cite the section of the State Act that gives it the power.
"must_know[3].point": |
  Goods and services tax sits outside the three Lists. Article 246A gives Parliament and every State Legislature power over it.
"must_know[4].point": |
  Write "whose subject" as an entry: "Concurrent List, entry 18", not "a Central subject". An entry number can be checked by anyone in a minute. "A Central subject" cannot be checked at all.
"must_know[5].point": |
  The lists say which legislature may make law on a subject. When two entries could both cover your proposal, say so in your note.
