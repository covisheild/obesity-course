definition.text: "Tracing who decides is a fixed sequence of six steps that takes a proposal to the body that can\nturn it into policy, and to the power that body would use.\n\n1. Name the instrument the proposal needs: an Act; a rule or regulation under an existing Act; a\n   rate, order or other notification under an existing Act. Or say none is needed: an\n   executive decision, such as a scheme, can act without a new law.\n2. Find whose subject it is: the Union, the States or both. The answer comes from the Seventh\n   Schedule under Article 246 of the Constitution, or from a provision of an Act that already\n   covers the matter. Then find whether a function has been given to a local body.\n3. Find the body that holds the power to make that instrument, and the numbered provision that\n   gives it the power.\n4. Find the process the instrument must pass before it binds, such as previous publication of a\n   draft for objections, an approval, notification in the Gazette, commencement on a notified\n   date, and laying before the legislature.\n5. List every other body whose agreement the process requires, and the bodies or officers who\n   carry the decision out.\n6. State the result in one sentence: X decides, under Y, by process Z, with W's agreement.\n\nA trace that the instruments in hand cannot complete stops at the step it cannot answer, and\nnames the candidate bodies and the document that would settle the step. A trace establishes who\ncan act and through which instrument. It does not establish whether that body will act, or\nwhether the instrument would work.\n"
simplified_explanation: 'Each earlier section of this book answered one piece of a single question: for this proposal,

  who would have to act, and under what power? This section puts the pieces in order, so you can run

  them on any proposal.


  **Step 1. Name the instrument.** What would have to exist on paper for the proposal to be policy?

  It might be a new Act, or a rule or regulation under an Act that already exists. It might be a rate

  or an order notified under an Act. Or it might be a decision by a government with no new law at

  all, such as a scheme. If you cannot name one, you have a wish, not yet a proposal.


  **Step 2. Find whose subject it is.** If an Act already covers the matter, read what it says about

  itself. If not, find the entry in the Seventh Schedule''s three lists. Then check whether the job

  has been given to a panchayat or a municipality.


  **Step 3. Find the body and the provision.** Which body can make that instrument? Which numbered

  section or article gives it the power? Write both down. "The government" is not a body. "The

  minister" is usually not the holder of the power.


  **Step 4. Find the process.** What must happen before the instrument binds anyone? A draft

  published for objections, an approval, a notification in the Gazette, a date when it comes into

  force, laying before Parliament. Each one is a date you can chase.


  **Step 5. List who else must agree, and who carries it out.** A body whose approval the process

  needs is a second decider. The officers who enforce the decision are the people your proposal will

  actually meet on the ground.


  **Step 6. Write one sentence.** X decides, under Y, by process Z, with W''s agreement.


  Two things can happen on the way. The trace can stop, because the documents you have do not

  answer a step. Then write down where it stopped, the candidates, and the document that would settle

  it.


  Or the trace can find that the decision was taken years ago. Then your proposal is really about

  carrying the decision out, and it goes to different people.


  A finished trace tells you who can act. It never tells you whether they will.

  '
must_know[0].point: 'The error is to name the minister who announced a measure as the body that decides it. A

  minister heads a department. The power to make an instrument usually sits with a body an Act

  names. Under the FSS Act, regulations are the Food Authority''s to make, with the Central

  Government''s approval. Address the note to the holder of the power, and copy the department.

  '
must_know[1].point: 'Write the one-sentence answer, "X decides, under Y, by process Z", before you write anything

  else in a note. If you cannot fill Y with a numbered provision, you have not traced the proposal

  yet, and the note is not ready to send.

  '
must_know[2].point: 'A press release, a speech or a meeting''s recommendation is not an instrument. The GST Council''s

  own release says its decisions take effect through notifications "which alone shall have the

  force of law". Before you tell anyone a measure is in force, find the notification and its date.

  '
must_know[3].point: 'A treaty is not the power to act. India is a Party to the WHO Framework Convention on Tobacco

  Control, and the Convention itself leaves action to "national law". COTPA was passed before India

  signed. When someone cites a treaty as the reason a body can act, ask for the Indian provision.

  '
must_know[4].point: 'A trace that forks is a result. Write both candidate deciders, the step where the trace stopped,

  and the document that would settle it. Do not pick one to make the note look tidy; the person

  who reads it will act on whichever body you name.

  '
must_know[5].point: 'Deciding and carrying out are different jobs, often done by different people. Parliament and

  the Central Government decided on smoking in public places. The long list of officers in

  Schedule III of the 2008 Rules enforces it, school principals and panchayat representatives

  among them. If your proposal is about enforcement, send it to the people who enforce.

  '
must_know[6].point: 'The central GST rate on sugar-added drinks is {{n:cgst_sugary_drinks_rate_pct}} per cent, in

  Schedule III of Notification 9/2025-Central Tax (Rate). Section 9(1) of the CGST Act caps the

  central rate at {{n:cgst_sugary_drinks_rate_pct}} per cent. The {{n:gst_demerit_rate_pct}}% in the GST Council''s release is

  the GST rate it recommended, not the Union''s share. Never say the Union levies

  {{n:gst_demerit_rate_pct}}%.

  '
must_know[7].point: 'When a trainee''s proposal says "the government should", hand it back with three blanks: X, Y

  and Z. Ask them to fill each from a document they can name. Most will find that step 1, the

  instrument, is where they had not decided anything.

  '
must_know[8].point: 'A trace tells you who can act and through which instrument. It does not tell you whether that

  body will act, how soon, whether the instrument would work, or how the actors around it will

  push. It is also only as current as the copy of each instrument you read. Before you rely on a

  trace, check the newest amendment each copy names.

  '
