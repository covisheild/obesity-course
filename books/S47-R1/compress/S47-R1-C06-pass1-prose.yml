"definition.text": |
  A Bill introduced by a Minister is a Government Bill. A Bill introduced by a member who is not a Minister is a Private Member's Bill.

  Before a Government Bill reaches Parliament, three steps apply inside the Union government. The first is the Pre-legislative Consultation Policy, a decision of the Committee of Secretaries of 10 January 2014. The Policy is not a statute.

  It may be referred to a Department-related Parliamentary Standing Committee.
"simplified_explanation": |
  A Bill is a statute in draft. Most Bills come from a minister's department. The Union's own policy asks the department to put the draft in public for at least {{n:plcpcommentdays}} days first, so that anyone can comment. But that policy is not a law, and a department can skip it if it writes down why.

  Then the Cabinet approves the Bill and it goes to Parliament. Each House reads it three times.

  In the first reading it is introduced. In the second, members debate it and go through it clause by clause, and it may be sent to a committee. In the third, the House votes to pass it. Then the other House does the same.

  For you, two doors matter most: the public consultation before the Bill, and the committee that examines it.
"must_know[0].point": |
  Do not count on {{n:plcpcommentdays}} days to comment on a draft Bill. The Pre-legislative Consultation Policy is a decision of senior civil servants, not a law.
"must_know[1].point": |
  One is the pre-legislative consultation, if it is held. The other is a committee examining the Bill, which can take evidence from experts.
"must_know[2].point": |
  "Parliament has passed the Bill" is not yet "the law says". A Bill becomes an Act only when both Houses have agreed to the same text and the President has assented. An Act may then wait for a notification before it is in force.
"must_know[3].point": |
  Do not describe a Private Member's Bill as a likely route to a new law.
"must_know[4].point": |
  A Bill that only deals with tax is a Money Bill. The Rajya Sabha can only recommend changes, within fourteen days, and the Lok Sabha may reject them all.
"must_know[5].point": |
  A State Bill goes through the State Legislature and then to the Governor, who may reserve it for the President (Article 200).
