definition.text: 'A rule or a regulation is made by the body an Act names, under the power that Act gives, and by the

  procedure that the same Act sets. The section that gives the power can carry three conditions. "By

  notification": the instrument is made by publishing it in the Gazette. "With the previous approval of"

  another authority: a second body must agree first. "After previous publication": a draft must be

  published first.


  Section 23 of the General Clauses Act, 1897 applies where a Central Act gives a power to make "rules or

  bye-laws" subject to previous publication. The authority must publish a draft for the information of

  persons likely to be affected. It must publish with the draft a notice of the date on or after which

  the draft will be taken into consideration. It, and any authority whose sanction, approval or

  concurrence is needed, must consider any objection or suggestion received from any person before that

  date.

  '
simplified_explanation: 'Parliament passes an Act. The Act often leaves the detail to someone else.


  Many Acts say a rule or regulation may be made only "after previous publication". That means a draft comes

  first, with a date on it. Anyone may send an objection or a suggestion before that date, and the body must

  consider it. Then the final text appears in the Gazette, the government''s official newspaper.


  After that it goes before Parliament, which can change it or cancel it. But by then it has

  already been made.

  '
must_know[0].point: '"A regulation takes effect only once Parliament approves it" is wrong for the Food Safety and

  Standards Act. Section 93 lays each rule and regulation before Parliament after it is made.

  The Houses may then modify or annul it, and anything already done under it stays valid. Do

  not tell anyone they can wait for Parliament.

  '
must_know[1].point: 'Before you plan a comment, open the section that gives the power. Find "by notification",

  "with the previous approval of" and "after previous publication". They tell you whether a

  draft will appear, and which two bodies must hear you.

  '
must_know[2].point: 'Count the objection period from the day the notice names. For the 2018 packaging draft, that

  was the day Gazette copies reached the public, 2 April 2018, not the draft''s date of 19

  March.

  '
must_know[3].point: 'Two different thirties sit in the same process. The 2018 packaging draft''s period for

  objections was {{n:packaging_draft_objection_days}} days. Section 93 keeps a made regulation

  before Parliament for {{n:laying_days}} days of sitting. Say which one you mean.

  '
must_know[4].point: 'Section 23 of the General Clauses Act makes the body consider an objection. It does not make

  the body accept it, or answer it. Once the final rule is in the Official Gazette, that

  publication is conclusive proof it was duly made.

  '
must_know[5].point: 'The 2014 consultation policy binds officials as a decision of the Committee of Secretaries,

  not as a law. Do not call a missing consultation unlawful on the policy''s strength alone;

  check whether the Act itself asks for previous publication.

  '
must_know[6].point: 'The final notification tells you the steps were taken. To find out what changed, set the

  draft beside the final text, clause by clause.

  '
