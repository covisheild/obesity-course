id: S47-R1
number: 5
title: Policy process, framing and advocacy craft · Rung 1
subtitle: Who decides, under what authority, and how the question is framed
cover_line: A proposal becomes policy only when an identifiable body acts on it under an identifiable power
status: in progress       # frozen | in progress
version: "1.0"
last_updated: 2026-10-01
why: |
  Most health proposals fail long before anyone argues about the evidence: they are addressed to no
  one who can act on them. A tax on sugary drinks, a school-canteen rule and a front-of-pack label
  each belong to a different body, working under a different law, by a different procedure. This
  book teaches the reader to find that body and that authority for any proposal, to see the frame a
  public argument is working inside, and to keep apart two jobs that are easily confused: informing
  a decision and campaigning for one. It ends with a one-page note on a real Indian proposal that
  names who decides.
how_to_read: |
  Read it in order. The early sections build a map of who makes policy in India and how; the later
  ones use that map on framing and on the difference between research and advocacy. The exercises
  are decisions, not sums: name the body, name the power it acts under, name the frame. Do them as
  you go; the note at the end uses all three.
back_blurb: |
  A short book on how health policy is actually made in India: the bodies that decide, the laws that
  give them power, the procedures they follow, and the frames that decide which instruments get
  discussed at all. It closes with the line between informing policy and campaigning for it, and a
  one-page note on one Indian proposal naming the body that would have to act.
