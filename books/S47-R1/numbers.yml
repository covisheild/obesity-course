# books/S47-R1/numbers.yml: every number this book uses in more than one section (claude.md §4a).
# Prose writes {{n:key}}; another book's number is {{n:S01-R1/key}}. The build substitutes the
# value before any check runs, blocks on an unknown key and warns on an unused one.
# Keys filled by the conductor on 2026-10-02 after the source gate was released.
numbers:
  gst_demerit_rate_pct:
    value: "40"
    meaning: the combined GST "special de-merit rate" the 56th GST Council meeting recommended for a select few goods, including sugar-added and other non-alcoholic beverages (C09, C15, C18)
    source: pib_2163555
  cgst_sugary_drinks_rate_pct:
    value: "20"
    meaning: the central (CGST) rate on heading 2202 drinks in Schedule III of Notification 9/2025-CT(Rate), and the cap CGST Act s.9(1) sets (C09, C18)
    source: cgst_notif_9_2025_rate; cgst_act_2017_s9_cbic
  plcp_comment_days:
    value: "thirty"
    meaning: minimum period a draft Bill is kept in the public domain under the Pre-Legislative Consultation Policy 2014 (C06, C07)
    source: plcp_2014
