# books/S52-R1/numbers.yml: every number this book uses in more than one section (claude.md §4a).
# Prose writes {{n:key}}; another book's number is {{n:S01-R1/key}}. The build substitutes the
# value before any check runs, blocks on an unknown key and warns on an unused one.
# Started at Task 1, 2026-10-02. Versions were read in this sandbox with packageVersion() and
# R.version.string; they are reused in the front matter, C06 and C21, and in every caption that says
# which version produced an output. Citekeys marked "proposed" are filed at intake (READY.md).
numbers:
  r_version:
    value: "4.3.3"
    meaning: version of R that produced every printed output in this book (R.version.string, "R version 4.3.3 (2024-02-29)")
    source: read in the build sandbox with R --version, 2026-10-02
  tidyverse_version:
    value: "2.0.0"
    meaning: tidyverse meta-package version installed when the outputs were produced
    source: packageVersion("tidyverse") in the build sandbox, 2026-10-02
  dplyr_version:
    value: "1.1.4"
    meaning: dplyr version installed when the outputs were produced
    source: packageVersion("dplyr") in the build sandbox, 2026-10-02
  tidyr_version:
    value: "1.3.1"
    meaning: tidyr version installed when the outputs were produced
    source: packageVersion("tidyr") in the build sandbox, 2026-10-02
  readr_version:
    value: "2.1.5"
    meaning: readr version installed when the outputs were produced
    source: packageVersion("readr") in the build sandbox, 2026-10-02
  ggplot2_version:
    value: "3.4.4"
    meaning: ggplot2 version installed when the outputs were produced
    source: packageVersion("ggplot2") in the build sandbox, 2026-10-02
  readxl_version:
    value: "1.4.3"
    meaning: readxl version installed when the outputs were produced
    source: packageVersion("readxl") in the build sandbox, 2026-10-02
  haven_version:
    value: "2.5.4"
    meaning: haven version installed when the outputs were produced
    source: packageVersion("haven") in the build sandbox, 2026-10-02
  lubridate_version:
    value: "1.9.3"
    meaning: lubridate version installed when the outputs were produced
    source: packageVersion("lubridate") in the build sandbox, 2026-10-02
  forcats_version:
    value: "1.0.0"
    meaning: forcats version installed when the outputs were produced
    source: packageVersion("forcats") in the build sandbox, 2026-10-02
  here_version:
    value: "1.0.1"
    meaning: here version installed when the outputs were produced
    source: packageVersion("here") in the build sandbox, 2026-10-02
  renv_version:
    value: "1.0.3"
    meaning: renv version installed in the build sandbox (named in C21; renv itself is taught at S52-R3)
    source: packageVersion("renv") in the build sandbox, 2026-10-02
  ziemann_affected_pct:
    value: "19.6%"
    meaning: share of published articles with Excel gene lists affected by gene name errors, 18 journals, 2005-2015 (C01, C15)
    source: ziemann_2016 (proposed citekey; Results, "the proportion of published articles with Excel files containing gene lists that are affected by gene name errors is 19.6 %")
  trisovic_fail_initial_pct:
    value: "74%"
    meaning: share of R files from Harvard Dataverse replication datasets (2010-2020) that failed to complete without error on first execution (C20, C21)
    source: trisovic_2022 (proposed citekey; Abstract)
  trisovic_fail_cleaned_pct:
    value: "56%"
    meaning: the same share after automatic code cleaning (C20, C21)
    source: trisovic_2022 (proposed citekey; Abstract)
  penguins_rows:
    value: "344"
    meaning: 'rows of data-raw/penguins_raw.csv as read_csv() reads it (readr 2.1.5), one per nesting observation of an adult penguin'
    source: 'S52-R1-C07, illustration 1, nrow(penguins) (gate-filled output); agrees with horst_2020_palmerpenguins header "rows (read_csv): 344"'
  penguins_cols:
    value: "17"
    meaning: 'columns of data-raw/penguins_raw.csv as read_csv() reads it'
    source: 'S52-R1-C07, practice level 4, dim(penguins) (gate-filled output); agrees with horst_2020_palmerpenguins header "columns (read_csv): 17"'
  bmx_rows:
    value: "8860"
    meaning: 'rows of NHANES 2021-2023 BMX_L.xpt as haven::read_xpt() reads it (one per examined participant, all ages)'
    source: 'S52-R1-C09, illustration 3, dim(bmx) (gate-filled output); agrees with nchs_nhanes_2021_2023_bmx_demo header "8860 rows x 22 columns"'
  nhanes_adults_rows:
    value: "6064"
    meaning: 'rows of NHANES 2021-2023 BMX_L joined to DEMO_L on SEQN with RIDAGEYR >= 20 (participants aged 20 or over with a body measures record; unweighted count of rows)'
    source: 'S52-R1-C19, illustration 2, nrow(adults) (gate-filled output); agrees with nchs_nhanes_2021_2023_bmx_demo block 1 "BMX rows with RIDAGEYR >= 20: 6064"'
  bmx_cols:
    value: "22"
    meaning: 'columns of NHANES 2021-2023 BMX_L.xpt as haven::read_xpt() reads it'
    source: 'S52-R1-C09, illustration 3, dim(bmx) (gate-filled output)'
  demo_rows:
