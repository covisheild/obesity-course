id: S52-R1
number: 6
title: R, reproducibility engineering and data management · Rung 1
subtitle: One dataset, one script, one command
cover_line: Keep the raw data untouched and let code do every change
status: in progress       # frozen | in progress
version: "1.0"
last_updated: 2026-10-02
why: |
  Most analyses that cannot be repeated were not wrong in their statistics. They were done by
  hand: a cell edited in a spreadsheet, a number pasted from a screen, a step nobody wrote
  down. This book teaches the opposite habit from the first line. You learn R as a language
  with objects, functions and packages, the tidyverse verbs that import, clean, summarise and
  plot a data frame, and one rule that makes the rest worth doing: raw data is never edited and
  every change lives in code that another person can run.
how_to_read: |
  Read Book 0 first, or at least the sections this book names as it goes. Then read this one in
  order, with R open beside it and every example typed, not pasted. The book asks you to build
  one thing: a single dataset analysed from raw file to final figure in one script that another
  person can run with one command. Start the script in the first section and extend it as you
  read.
back_blurb: |
  A short, practical book on starting data analysis the reproducible way. It covers R as a
  language, what a data frame is, the tidyverse verbs for importing, cleaning, summarising and
  plotting, why raw data is never edited and spreadsheets are never the place where analysis
  happens, and how to organise a project so that your whole analysis reruns from raw data with
  one command.
