definition.text: 'A data frame is R''s table. It is a set of named columns placed side by side, where each column

  is a vector and every column has the same number of elements, so the columns line up into rows.

  Different columns may hold different types, but all the values within one column share one

  type.


  A tibble is the form of data frame the tidyverse uses. It prints its number of rows and

  columns and the type of each column.


  A variable, in the sense used here, is everything that measures one attribute, such as height,

  across all the units measured. An observation is everything measured on one unit, such as one

  child at one visit, across all the attributes.


  Data are tidy (Wickham 2014) when three rules hold. Each variable forms a column. Each

  observation forms a row. Each type of observational unit forms a table: facts about a child

  that do not change between visits go in one table, and measurements made at each visit go in

  another. Any other arrangement is untidy.


  Three untidy shapes are common. Values are used as

  column names, as when weight at visits 1, 2 and 3 sits in three columns. Two variables are

  stored in one column, as in a blood pressure written "104/66". Two kinds of unit are stored in

  one table.

  '
simplified_explanation: "Book 0 asked four questions of every table, and the first was: what does one row stand for?\nTidy data turns that question into rules for how a table is built.\n\nIn R a table is a data frame. Picture it as columns standing side by side. Each column is a\nvector, a set of values of one type: all numbers, or all text. Every column has the same\nlength. So the first value of every column belongs to the first row, the second to the second\nrow, and so on. A tibble is the tidyverse's kind of data frame. It tells you its size and the\ntype of each column when it prints.\n\nA table is tidy when three things are true:\n\n- **One column, one variable.** Height in one column, weight in another, and nothing else in\n  either.\n- **One row, one observation.** One child at one visit is one row. A second visit is a second\n  row, not a second column.\n- **One table, one kind of unit.** A child's sex and date of birth do not change between visits,\n  so they go in a table with one row per child. Weight at each visit goes in a table with one\n  row per visit.\n\nThe word \"variable\" now has three meanings in this book, and they must be kept apart. In Book 0\nit was a letter standing for a number. In R it is the name of an object you made. In a data\nframe it is a column: everything measured about one attribute.\n\nData typed into a spreadsheet often break the rules. Weights at three visits sit in three\ncolumns. Blood pressure is typed as \"104/66\" in one cell. Girls are marked by colouring their\nrows pink. Each of these looks fine to the eye. Each stops the computer from using the data.\n"
must_know[0].point: 'The error is to read the number of rows as the number of people, or birds, or children. Ask

  first what one row stands for. Count the IDs, and check that an ID always points to the same

  person, before you write "n = " in a report.

  '
must_know[1].point: 'When a register has one column per visit, the visit is hiding in the column names. Store it

  as a column called `visit` with one row per visit. A fourth visit then adds rows, and no code

  changes.

  '
must_know[2].point: 'One cell, one value. "104/66", "45 kg", "2.3 or 2.4" and "0 (below detection)" each stop a

  column from being numbers. Split the two numbers into two columns, move the unit into the

  column name or the data dictionary, and put notes in a notes column.

  '
must_know[3].point: 'Colour and highlighting are not data. A row painted yellow to mean "recheck" is lost the

  moment the file is saved as CSV. Add a column, such as `recheck` with TRUE or FALSE, instead.

  '
must_know[4].point: 'Facts that do not change between visits, such as sex and date of birth, go in a table with one

  row per person. Repeating them on every visit row invites the day when the copies disagree.

  '
must_know[5].point: 'Before a data-entry team fills its first form, look at the sheet they designed. Ask for one

  header row, one rectangle, one value per cell and no merged cells. Fixing the layout later costs far

  more than agreeing it first.

  '
must_know[6].point: 'The word "variable" has three meanings: Book 0''s letter, R''s named object, and a data frame''s

  column. When a trainee is confused, ask which one they mean before you answer.

  '
must_know[7].point: 'Tidy data makes the next step easy. It does not make the values right. A tidy table can hold a

  weight of 700 kg as neatly as one of 70 kg.

  '
