definition.text: 'A silent change is a change to data, or a choice about which data to use, that leaves no instruction a second person can read and run again, and that nothing on

  the screen announces.


  Gene symbols turned into dates. Ziemann, Eren and El-Osta report that Microsoft Excel, used

  with its default settings, converts some gene symbols to dates: SEPT2 becomes "2-Sep" and

  MARCH1 becomes "1-Mar".


  A spreadsheet formula and undeclared choices. They found selective exclusion of available data, coding errors and inappropriate weighting of summary statistics.

  One formula averaged rows 30 to 44 instead of rows 30 to 49, which left out five countries entirely.


  The papers'' highest category was public debt above 90% of gross domestic product (GDP), a measure of the size of an economy.


  Rows lost in transfer. Public Health England (PHE) stated on 4 October 2020 that 15,841

  positive test results for coronavirus disease 2019 (COVID-19), from 25 September to 2 October,

  had been left out of the reported daily figures. It gave the cause as files that "exceeded the

  maximum file size" of the process that loads them into central systems. It does not name the

  software.


  The three cases differ in cause. What they share is that the change was silent: nothing

  announced it, and it came to light only later.

  '
simplified_explanation: "Here is the trap with data. A number can change, or a row can go missing, and nothing on the screen\ntells you. The table looks right, so you trust it.\n\n- **A program changed values as the file was opened.** About one in five genomics papers that came\n  with Excel gene lists carried such errors.\n- **A formula covered the wrong rows, and choices went unsaid.** Other data had been left out on\n  purpose, and the paper never said so.\n- **A transfer lost rows.** Some files were too big for the system that loaded them.\n\nSo this book follows one rule. You never edit the raw data file. Every change you make to the\ndata is a line of code, kept in a file, that anyone can read and run again. And you count your\nrows before and after each step.\n"
must_know[0].point: 'The error is to believe a table because it looks complete. Before you trust a table, compare

  its row count, or a total, with the count you expected.

  '
must_know[1].point: 'Never edit the raw data file, and never save over it. Make every change in code that reads the

  raw file and writes a new one.

  '
must_know[2].point: 'A choice about which data to leave out is part of the analysis. Write it as a line of code with

  a comment saying why.

  '
must_know[3].point: 'Do not repeat "a spreadsheet slip caused austerity" or "Excel lost the COVID cases". The

  replication found the slip alone moved the result from 2.2% to 1.9% a year. The PHE statement

  names no software. Quote what each source says, and no more.

  '
must_know[4].point: 'When you open someone else''s data file, look for values that have changed type, such as text turned into

  dates.

  '
must_know[5].point: 'When a trainee says their numbers are right because they checked them on screen, ask how a

  second person would check them. If the answer is "by redoing it by hand", the work has no record.

  '
must_know[6].point: 'Writing every step in code does not make the steps right. What it changes is that the step is

  written down, so a reviewer can find the error and you can fix it once and rerun.

  '
