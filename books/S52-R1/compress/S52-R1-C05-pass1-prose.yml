definition.text: |
  A function call is a function's name followed by round brackets. The values written inside
  the brackets are its arguments, and the call returns one result, which R prints or which you
  assign to a name.

  Each argument has a name. An argument may be given by name, as `digits = 1`, or by position,
  in the order the function lists its arguments.

  Most arguments have a default value, which is used when the call does not give one. For `mean()`, `median()` and `sd()`, the argument
  `na.rm` says whether missing values (`NA`) are removed before the computation. Its default,
  `FALSE`, makes the result `NA` whenever a value is missing.
simplified_explanation: |
  ```r
  heights_cm <- c(152, 160.5, 171)
  mean(heights_cm)
  ```

  ```output
  [1] 161.1667
  ```

  `round()` takes the number to round, called `x`, and how many decimal places to
  keep, called `digits`:

  ```r
  round(161.1667, digits = 1)
  ```

  ```output
  [1] 161.2
  ```

  The default for `digits` is 0, so
  `round(161.1667)` gives a whole number.

  One call can sit inside another, and R works from the inside out:

  ```r
  round(mean(heights_cm), 1)
  ```

  ```output
  [1] 161.2
  ```

  The pipe, written `|>`, puts the steps in the order they happen. Read it as "then":

  ```r
  heights_cm |>
    mean() |>
    round(1)
  ```

  ```output
  [1] 161.2
  ```

  The pipe hands
  the thing on its left to the call on its right, as the first argument.

  To find out what a function's arguments are called and what they do, open its help page. Type
  a question mark and the name: `?round`.
must_know[0].point: |
  The error is to read `mean(x, na.rm = TRUE)` as the mean of all your values. It is the mean
  of the values present. Report the count with it, "3.77 kg (n = 9)", every time.
must_know[1].point: |
  A missing value typed as 0 gives no `NA` and no warning, and pulls the mean down.
must_know[2].point: |
  Name every argument after the first.
  `mean(3750, 3800, 3250)` runs, gives 3750 and is wrong, because unnamed values were matched
  by position to arguments you did not intend.
must_know[3].point: |
  Before you use a function for the first time, open its help page and read Usage and
  Arguments.
must_know[4].point: |
  Read an error message as a sentence about one call: which function, which argument, what
  was wrong.
must_know[5].point: |
  No argument can tell you why a value is missing.
must_know[6].point: |
  If you find yourself copying the same block of calls three times with one thing changed, you
  need a function of your own.
