definition.text: |
  A data dictionary is a separate file, laid out as a table, that explains every variable in one
  data file. It has one row per variable.

  A README is a short plain-text file at the top of the project folder. It gives the one command that reruns the analysis, and
  the folder to run it from.
simplified_explanation: |
  It is itself a small table, one row per column of the data. For each column it says:

  - the exact name, letter for letter, as it is in the file;
  - what the column means, in plain words;
  - its unit;
  - its type: number, text or date;
  - the values it may take, or the range you expect;
  - how a missing value is written;
  - where you got each of these facts.

  A README is the note on the front of the project folder. It is a plain-text file that anyone can
  open. Someone who has never met you should be able to
  read it and rerun your analysis. That someone is often you, a year later.

  A project put online for others has two more files beside the README. A LICENSE says what others
  may do with it. A CITATION says how to cite it.
must_know[0].point: |
  The error is to think the documentation describes the file. Check every entry of your dictionary against the file in code: the names, the
  values, and whether an ID is really one per row.
must_know[1].point: |
  Write the variable name in the dictionary exactly as the file has it, letter for letter, with
  its spaces and brackets.
must_know[2].point: |
  Write the dictionary before you clean. A dictionary written after cleaning
  describes your cleaned data and hides what the raw file held.
must_know[3].point: |
  Record how missing values are written in the raw file, for each column if they differ: blank,
  `NA`, -99, "not recorded".
must_know[4].point: |
  Never fill an "expected range" cell with the smallest and largest values in your own file. Leave it blank and say why, until
  a source or a protocol gives the range.
must_know[5].point: |
  Write the README's rerun line as the exact command.
must_know[6].point: |
  When a trainee hands you a thesis dataset, ask for its dictionary before you look at a single
  number. If there is none, ask them to write one row: one variable, its unit, its missing code,
  and where they got each.
must_know[7].point: |
  A dictionary and a README describe the data and how to rerun the analysis. They do not make
  either one right.
