definition.text: 'Hidden state is anything a script uses that the script itself did not make.


  A script is tested for hidden state by running all of it, from the first line to the last, in a fresh session. A

  fresh session is a new R process whose workspace is empty. It has attached no package beyond R''s defaults. The

  one command for this is `Rscript code/analysis.R`, typed in a terminal whose working directory is the project

  root.


  A script that passes this test also writes every result it makes into `output/` with code. It sets the

  random-number seed with `set.seed()` before any random step. It ends with `sessionInfo()`, which prints the

  version of R and of every attached package.

  '
simplified_explanation: 'Here is the trap with a script that works on your computer. While you work, R remembers. Every

  object you made, in the script or typed in the console, sits in the workspace. Every package you

  loaded stays loaded. Then a colleague runs it on their computer, where none of it exists, and it

  stops.


  So test the script the way a stranger would run it. Start a new R with nothing in it, and run

  every line from the top. There are two ways to do that.


  - In RStudio, restart R (the menu Session, then Restart R), then run the whole script.

  - In a terminal, in the project folder, type one command: `Rscript code/analysis.R`.


  The second way is the one to write in your README, because it is one line anyone can type.

  '
must_know[0].point: 'The error is to think that a script which runs on your computer is a script that runs. Before

  you send a script to anyone, run it with `Rscript code/analysis.R` from the project folder.

  Send it only when it reaches the last line.

  '
must_know[1].point: '`rm(list = ls())` empties the workspace and leaves every package loaded. `source()` runs a

  file in the workspace you already have. Neither is a fresh session. Restart R, or use

  `Rscript`.

  '
must_know[2].point: 'When a script stops with "object not found" on someone else''s computer, look for the line

  that makes that object. Add it to the script, above the line that uses the object.

  '
must_know[3].point: 'Put `set.seed()` with a number you write down before any random step: a random sample of rows

  to check, a random allocation, a simulation.

  '
must_know[4].point: 'End every analysis script with `sessionInfo()`, and keep its printout with the outputs.

  '
must_know[5].point: 'A number in your thesis that you typed from the screen has no line of code behind it. Write

  every table to `output/` with code, and copy numbers into the text from those files.

  '
must_know[6].point: 'A trainee says "it runs, I checked". Ask how. If the answer is "I ran it in RStudio", ask them

  to restart R and run it again in front of you.

  '
must_know[7].point: 'One command in a fresh session tests the script against your computer only. It cannot show that a

  colleague with other package versions gets the same numbers, and it cannot show that the numbers

  are right.

  '
