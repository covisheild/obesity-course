definition.text: 'A CSV file, short for comma-separated values, is plain text. Each line is one row; within a

  line, values are separated by commas; the first line, the header row, gives the column names.

  Nothing in the file says what type each column is.


  Reading a file copies its contents into R as a data frame. The file on disk is not changed by

  being read, and an analysis that never writes to it can always be rerun from it.


  `read_csv()`, from the readr package, reads a CSV file. It guesses each column''s type from a

  sample of its values and prints the guess, the column specification. Values listed in its `na`

  argument become `NA`, R''s code for a missing value; by default the list is the empty string and

  the text `NA`. The `col_types` argument states the types you expect instead of letting readr

  guess. A value that does not fit its stated type becomes `NA`, readr warns, and `problems()`

  lists each such value with its row and column.


  Other formats need other functions. `read_excel()`, from readxl, reads Excel `.xls` and `.xlsx`

  files, one sheet at a time, optionally from a stated cell range. From haven, `read_sav()` reads

  SPSS `.sav` files and `read_xpt()` reads SAS transport `.xpt` files; both keep each column''s

  label, the description stored with it in the file, as a label attribute of that column.

  '
simplified_explanation: "A raw file is the data as it first reached you. It may be the export from a survey tablet, the\nfile a laboratory machine wrote, or the spreadsheet a camp team typed. Tools for collecting data in the\nfield, such as KoboToolbox, ODK and REDCap, write such files, and the next level of this subject\nteaches them. Here the file has already arrived.\n\nThe commonest raw file is a CSV. Open one in a plain text editor, such as Notepad, and you see\nlines of text with commas between the values. The first line holds the column names. That is\nall there is: no colours, no formulas, and nothing saying which column is a number.\n\nSo `read_csv()` has to guess. It looks at the values in each column and decides: numbers, text,\ndates or TRUE and FALSE. Then it prints what it decided. Read that report every time. A column\nyou expected to be numbers that comes out as text means some cell in it is not a number.\n\nTwo habits keep the guess honest:\n\n- **Name the missing-value codes.** If the file uses -99, or \"NR\", for \"not recorded\", say so\n  in `na = c(\"\", \"NA\", \"-99\", \"NR\")`. Otherwise -99 is read as a real number.\n- **Say what you expect.** `col_types` tells `read_csv()` which type each column should have.\n  A value that does not fit is reported, instead of quietly turning the whole column into text.\n\nReading never changes the file. `read_csv()` makes a copy inside R and leaves the file alone.\nThe file is changed only if something writes to it: you, in a spreadsheet, or a line of code\nthat saves over it. In this book nothing does.\n\nData in a department may come as an Excel or SPSS file, and some surveys publish files in other\nformats. `read_excel()` reads Excel files. The haven package reads SPSS files with `read_sav()`\nand the SAS transport files of American surveys with `read_xpt()`.\n"
must_know[0].point: 'The error is to think that a file which reads without an error has been read correctly. -99

  read as a height raises no warning. Read the column report, and declare every missing-value

  code from the file''s documentation in `na` before you compute anything.

  '
must_know[1].point: 'Giving `na` replaces the default list. Write `na = c("", "NA", "-99")`, not `na = "-99"`;

  the second form stops reading empty cells and the text "NA" as missing.

  '
must_know[2].point: 'A number column that the report calls `chr` holds at least one value that is not a number.

  Find it with `col_types` and `problems()`, then deal with it in code. Never open the raw file

  and retype the cell.

  '
must_know[3].point: 'Record the MD5 checksum of every raw file in the README on the day it arrives. When someone

  says "it''s the same file", you can check in one line instead of arguing.

  '
must_know[4].point: 'Open an Excel file you were sent only as a copy. Browsing the original invites typing into it

  or saving over it by accident. Read the original into R with `read_excel()`, giving the sheet

  and range.

  '
must_know[5].point: 'When a department hands over an SPSS file, read it with `read_sav()` rather than asking for an

  Excel export. The SPSS file carries its labels and its missing-value codes; an export may drop

  both.

  '
must_know[6].point: 'Any average you compute from an NHANES file without its sample weights describes the people in

  the file only. Say "unweighted" next to it, and never present it as the figure for the United

  States, still less for India.

  '
must_know[7].point: 'Reading carefully catches codes and types. It cannot catch a wrong value that is a valid

  number: a height of 182 cm typed for 128 cm reads perfectly. That needs a check on the values

  themselves.

  '
