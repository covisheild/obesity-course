# Approved amendments to the frozen subject map, v3 -> v3.1.  Read by check/amendments.py.
#
# The curriculum is map/subject-map-v3-FROZEN.md plus this file. The map stays frozen; nothing here
# changes a book id, a book's position in map/BOOKS.yml, or the number of books (196).
#
# Why: on 23 Sep 2026 an external audit compared the map with clinical (OMEC, ABOM, Lancet Commission
# 2025, Canadian CPG), policy (WHO, NOURISHING/MOVING, Food-EPI, best buys), causal-system (Foresight,
# ANGELO), professional (WHO-ASPHER, Council on Linkages, NMC) and Indian frameworks. 879 items: 56%
# covered, 31% partial, 12% absent, reducing to verified gap themes. Harsh approved closing all of
# them (map/audit-2026-09/REPORT.md, decisions in its section 9):
#   1. Tier 1 and 2 gaps closed here.
#   2. Persona widened without new books: leadership, management, negotiation, institution building,
#      community mobilisation and campaign design added inside existing rungs.
#   3. GLP-1 hands-on work is a clinic co-run with an eligible physician, who holds the prescription
#      (CDSCO approval condition; see S24-R1-A01).
# Drafted by four subagents, verified by two independent rounds (0 open defects), 23 Sep 2026.
#
# How the pipeline uses it: claude.md section 5 step 1 (inventory) and PIPELINE.md Task 1 read a
# rung's requirements with `python check/amendments.py --rung <ID>`, which prints the map lines with
# revisions applied and additions labelled by amendment id, plus the rung above for the bridge.
# Records name the amendment ids they serve (outcome_refs) or discharge (bridge_ref); build.py blocks
# a verified or frozen rung that leaves one unserved.
#
# Fields: id, rung, kind (concept | skill | revise), field (revise of build/gate only), text,
# target + map_line (revise only: the exact map text replaced), gap (audit gap ids), why (the verified
# finding), sources (URLs for named instruments), verify_at_intake (true = the named instrument or
# fact must be opened at source intake before it is written as fact), note.
# Revise convention: target = the bullet without its leading "- ", or (field: build / gate) the text
# after the "**Build target.**" / "**Gate to the next rung.**" label; text replaces it in place.

