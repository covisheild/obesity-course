  sources: []
  verify_at_intake: true
  note: 'Placement decision: S22, not S26. S26''s title, prerequisites (S16 DOHaD), build and gate are about children,
    adolescents and pregnancy and a school or adolescent intervention; older age and menopause are modifiers of
    adult assessment and treatment. S22 is a prerequisite of S23, S24, S25, S26 and S35, so a concept here reaches
    the S24-R2 lean-mass skill (revised below) and S23''s resistance-training prescription. S26 is also built late
    (tier 6). The book should source the sarcopenic obesity consensus definition at intake. S22-R2 now has 4 additions
    (2 revisions, 2 concepts).'
