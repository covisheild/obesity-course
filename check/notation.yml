# Series-wide notation: every sign, Greek letter and marked letter a book may print, with how to
# read it aloud and what it means in this series. Read by check/notation.py, which lists the
# symbols a book actually uses on its "Symbols used in this book" page (check/pdf/make_pdf.py),
# with the first section each appears in, and warns about a symbol that has no row here.
#
# Added 28 Sep 2026 from the statistics-book lessons (claude/lessons-from-stats-book.md, item 5):
# a first-time reader meets these signs with no help, and a table on one page is cheap.
# A book whose use of a letter differs from `meaning` must gloss it where it is first used
# (SELFCHECK 14 already requires every term to be explained at or before its first use).
#
# Keys are the symbol exactly as it prints. `kind` orders the page: sign, mark, greek.

"§": {kind: sign, read: "section", meaning: "A numbered section of a document, as in a statute's §5 or a book's §7.3"}
"±": {kind: sign, read: "plus or minus", meaning: "A range either side of a value: 11.8 ± 0.6 means 11.2 to 12.4"}
"×": {kind: sign, read: "times", meaning: "Multiplication"}
"÷": {kind: sign, read: "divided by", meaning: "Division"}
"−": {kind: sign, read: "minus", meaning: "Subtraction, or a negative number"}
"≈": {kind: sign, read: "approximately equal to", meaning: "The two sides are close but not exactly equal"}
"≠": {kind: sign, read: "not equal to", meaning: "The two sides differ"}
"≤": {kind: sign, read: "less than or equal to", meaning: "An inequality that includes its boundary"}
"≥": {kind: sign, read: "greater than or equal to", meaning: "An inequality that includes its boundary"}
"≡": {kind: sign, read: "is identical to, is defined as", meaning: "True by definition, not only for some values"}
"∝": {kind: sign, read: "is proportional to", meaning: "Changes in a fixed ratio with"}
"√": {kind: sign, read: "square root of", meaning: "The number that, multiplied by itself, gives the value: √9 = 3"}
"∛": {kind: sign, read: "cube root of", meaning: "The number that, cubed, gives the value: ∛8 = 2"}
"∞": {kind: sign, read: "infinity", meaning: "Without limit"}
"→": {kind: sign, read: "gives, leads to", meaning: "One step leads to the next; in a diagram, what causes or feeds what"}
"←": {kind: sign, read: "comes from", meaning: "The reverse arrow"}
"↔": {kind: sign, read: "corresponds to", meaning: "Each side matches the other"}
"⇒": {kind: sign, read: "implies", meaning: "If the left is true, the right follows"}
"Σ": {kind: sign, read: "sigma, the sum of", meaning: "Add up everything that follows: Σx = x₁ + x₂ + … + xₙ"}
"Π": {kind: sign, read: "the product of", meaning: "Multiply everything that follows"}
"∫": {kind: sign, read: "the integral of", meaning: "The area under a curve, or the total accumulated over a range"}
"∂": {kind: sign, read: "partial", meaning: "A rate of change with the other quantities held fixed"}
"Δ": {kind: sign, read: "delta, change in", meaning: "A change or difference: Δt is a change in time"}
"°": {kind: sign, read: "degree(s)", meaning: "Degrees of temperature (°C) or of angle"}
"‰": {kind: sign, read: "per mille", meaning: "Per thousand"}
"∈": {kind: sign, read: "is a member of", meaning: "Belongs to the set that follows"}
"|": {kind: sign, read: "given", meaning: "In a probability, P(A | B) is the probability of A given that B has happened"}
"~": {kind: sign, read: "is distributed as, approximately", meaning: "X ~ Normal means X follows a Normal distribution; before a number, 'about'"}
"′": {kind: sign, read: "prime", meaning: "A modified version of a quantity, or its rate of change"}
"ˣ": {kind: mark, read: "superscript", meaning: "Small raised characters are powers: x² = x × x, and 10⁻³ = 0.001"}
"ₓ": {kind: mark, read: "subscript", meaning: "Small lowered characters are labels, not powers: x₁ is the first value, CO₂ has two oxygen atoms"}
"̄": {kind: mark, read: "bar", meaning: "A bar over a letter marks a mean: x̄ is the mean of x"}
"̂": {kind: mark, read: "hat", meaning: "A hat over a letter marks an estimate or a prediction: p̂"}
"α": {kind: greek, read: "alpha", meaning: "In statistics the significance level; elsewhere a named coefficient or constant"}
"β": {kind: greek, read: "beta", meaning: "In statistics a regression coefficient, or the Type II error rate; in biology beta cells, β-oxidation"}
"γ": {kind: greek, read: "gamma", meaning: "A named constant or coefficient"}
"δ": {kind: greek, read: "delta", meaning: "A small change or step"}
"ε": {kind: greek, read: "epsilon", meaning: "A small quantity; in a model, the error term"}
"η": {kind: greek, read: "eta", meaning: "Efficiency, or a named coefficient"}
"θ": {kind: greek, read: "theta", meaning: "A general unknown quantity being estimated, or an angle"}
"κ": {kind: greek, read: "kappa", meaning: "Cohen's kappa, agreement beyond chance"}
"λ": {kind: greek, read: "lambda", meaning: "A rate (events per unit time), or a wavelength"}
"μ": {kind: greek, read: "mu", meaning: "In statistics a population mean; in units, micro- (one millionth), as in μg"}
"ν": {kind: greek, read: "nu", meaning: "Degrees of freedom, or a frequency"}
"π": {kind: greek, read: "pi", meaning: "The constant 3.14159…"}
"ρ": {kind: greek, read: "rho", meaning: "A correlation in a population, or a density"}
"σ": {kind: greek, read: "sigma", meaning: "A population standard deviation (σ² its variance)"}
"τ": {kind: greek, read: "tau", meaning: "A time constant, or Kendall's rank correlation"}
"φ": {kind: greek, read: "phi", meaning: "A named coefficient or angle"}
"Φ": {kind: greek, read: "Phi", meaning: "The probability that a standard Normal value falls below a point"}
"χ": {kind: greek, read: "chi", meaning: "χ² is the chi-square distribution and test statistic"}
"ψ": {kind: greek, read: "psi", meaning: "A named quantity; defined where used"}
"ω": {kind: greek, read: "omega", meaning: "As in omega-3 and omega-6 fatty acids; otherwise defined where used"}
"Ω": {kind: greek, read: "Omega", meaning: "Ohm, the unit of electrical resistance"}
