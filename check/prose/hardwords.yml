# The hard-word list.
#
# Built from words that actually stopped a reader in this corpus, not copied from a
# general style guide. Two lists, doing different jobs.
#
#   replace    - the word has an everyday equivalent and loses nothing by it. The build
#                warns wherever it appears in a reader-facing field, and names the
#                replacement so the fix is in the warning.
#   teach_once - the subject genuinely needs the word. It survives, but it is given in
#                plain words at first use. The build reports where first use happens so
#                the gloss can be checked by eye.
#
# Adding to `replace` is cheap and is expected. Every time a sentence makes you stop,
# the word that stopped you goes here, with whatever you replaced it with.

replace:
  - word: "vintage"
    use: "made at different times"
    note: "means wine to most readers; it was doing metaphorical work"
  - word: "currency"
    use: "whether it is up to date"
    note: "first meaning is money - the worst kind of ambiguity"
  - word: "repositor(y|ies)"
    use: "website, or the site"
  - word: "vested"
    use: "given to, or held by"
  - word: "delegated"
    use: "handed on"
  - word: "promulgat(e|ed|ion)"
    use: "issued, or published"
  - word: "pursuant to"
    use: "under"
  - word: "aforementioned|aforesaid"
    use: "the one above"
  - word: "utilis(e|ed|ing)|utiliz(e|ed|ing)"
    use: "use"
  - word: "commenc(e|ed|ing)"
    use: "start"
  - word: "ascertain"
    use: "find out"
  - word: "constitut(es|ed)"
    use: "is, or counts as"
  - word: "compris(e|es|ed)"
    use: "is made of"
  - word: "facilitat(e|es|ed)"
    use: "makes it possible, or helps"
  - word: "paradigm|framework"
    use: "the way it is done, or the rules it works by"
  - word: "landscape|ecosystem"
    use: "name the actual thing"
    note: "'the policy landscape' is 'the rules, and who makes them'"
  - word: "granular"
    use: "detailed, or broken down smaller"
  - word: "leverag(e|ed|ing)"
    use: "use"
  - word: "robust"
    use: "say what it survives"
    note: "'robust evidence' means nothing to a reader; 'it holds when you drop the outliers' does"
  - word: "pedantry|pedantic"
    use: "fussy, or being careful"
  - word: "heterogeneous|heterogeneity"
    use: "they differ - and say how"
  - word: "salient"
    use: "the ones that matter"
  - word: "inter alia"
    use: "among other things"
  - word: "notwithstanding"
    use: "even though, or despite"
  - word: "cognisant|cognizant"
    use: "aware"
  - word: "differing"
    use: "different"
  - word: "obviate"
    use: "gets rid of the need for"
  - word: "elucidat(e|ed|es)"
    use: "show, or explain"

# Words the subject cannot do without. Taught in plain words at first use, then used
# freely. The build reports the first use of each in a booklet so the gloss can be seen.
teach_once:
  - word: "statute"
    gloss_hint: "a law passed by a legislature"
  - word: "regulation"
    gloss_hint: "a rule written by a body that a statute gave the power to write rules"
  - word: "notification"
    gloss_hint: "an announcement in the Gazette that makes something take effect"
  - word: "Gazette"
    gloss_hint: "the government's official newspaper of record"
  - word: "amendment"
    gloss_hint: "a change made to a law after it was passed"
  - word: "consolidated"
    gloss_hint: "a copy with all the later changes merged into one text"
  - word: "instrument"
    gloss_hint: "the word lawyers use for any of these written things at once"
  - word: "executive"
    gloss_hint: "the people who run the country day to day"
  - word: "denominator"
    gloss_hint: "the number a percentage is a percentage of"
  - word: "unit of observation"
    gloss_hint: "what one row of a table stands for"
  - word: "locator"
    gloss_hint: "the page, section or clause number that says where to look"
  - word: "premise"
    gloss_hint: "a reason offered"
  - word: "inference"
    gloss_hint: "the move from the reasons to the conclusion"
  - word: "prevalence"
    gloss_hint: "how many people in a group have it"
  - word: "precision"
    gloss_hint: "how tightly a measurement pins the number down"
