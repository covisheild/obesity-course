simplified_explanation: |
  The last section asked whether an answer would change anything. You will also hear a quicker test
  of a finished study: was it cited? A citation is an entry in a later paper's reference list that
  points back to the study. Book 0's section on checking a reference covered what a reference is.
  This section is about counting them.

  Here is the trap with citation figures. The same word, "uncited", gives numbers from under 1% to
  over 50%. That is not because some of them are wrong. It is because each one counted something
  different. Every figure rests on three choices.

  - **The database, and what it counts.** A database such as Web of Science holds the reference
    lists of the journals it covers, about 12,000 of them. It cannot see a citation in a journal or
    book it does not cover. Some counts include letters and corrections, which are rarely cited.
  - **Which papers.** Usually all the papers of one field published in one year.
  - **How long you wait.** Counting stops at some date. The longer you wait, the fewer papers stay
    uncited.

  So before you use any figure for uncited papers, ask three questions. Which database, counting
  what? Papers from which year? Counted until when?

  Three more facts change how you read a citation count.

  The database misses citations. In one check, a biologist named Heneberg looked at the Web of
  Science records of 13 Nobel prizewinners. At first glance about 1.6% of their papers looked uncited.
  After about 20 hours of checking by hand, he got it down to 0.3%. The rest had been cited, and the
  database had missed it. Papers by Indian authors look less cited in Web of Science than papers from
  the United States and Europe. But the database leaves out many regional-language journals, and
  counting them would narrow that gap.

  Being cited is not being used. Papers in Web of Science with one or two citations outnumber papers
  with none, and many citations are superficial. A reference can be one line in a long list.

  Being uncited is not being useless. A botanist's short report of a plant found in Texas was cited
  once, by the botanist himself. Its information is still used, because it went into plant atlases
  and databases. A paper written to improve public-health practice was never cited, and it was
  viewed more than 1,500 times.

  The outline this course was planned from carried the sentence "most descriptive cross-sectional
  studies are never cited". A cross-sectional study, as an earlier section showed, measures a group
  once, at one time. That sentence was checked before this book was written. The measurements below
  do not support it as written, and no open study was found that counts citations by study design.
  So this book does not state it as a fact.
illustrations:
- body: |
    Start with a sentence you may already have heard: "more than half of all research papers are
    never cited." Take it apart before you use it.

    Its source is a 1990 report in the journal Science. Van Noorden, a features editor at Nature,
    traced it in a 2017 news feature. The report found 55% of items published from 1981 to 1985
    uncited 5 years after publication.

    Now ask Book 0's question: per cent of what? The items counted included letters, corrections,
    meeting abstracts and other editorial material. Those are rarely cited by anyone. And 5 years is a
    short wait. So the 55% was a true count of the wrong thing, over a short time.

    Now fill in the three labels for every figure you meet. Here are the figures this section uses.
    Read each row and say, in one sentence, what it is a share of.

    ```table
    | Share uncited | What was counted | Database | Papers published in | Counted until |
    | 55% | all items, including letters, corrections and meeting abstracts | not named in the feature | 1981 to 1985 | 5 years after publication |
    | 4% | biomedical research articles and reviews | Web of Science | 2006 | December 2017 |
    | 21% | research papers from all fields, 39 million of them | Web of Science | 1900 to 2015 | December 2017 |
    | 12% | medical-science papers | not named in the paper that reports it | 1990 | 27 years after publication |
    | 8.3% | papers in five leading general medical journals | Web of Science | 1990 | 5 years after publication |
    | 0.7% | papers in the same five journals | Web of Science | 2010 | 5 years after publication |
    ```

    Look at where the numbers come from, too. The 4% and 21% were worked out by Larivière, an
    information scientist, and Sugimoto, at Indiana University, for Van Noorden's feature. A feature
    is journalism, not a peer-reviewed paper, and the data behind its charts were later withdrawn from public view. The
    12% reaches us through a 2021 paper by Golosovsky and Larivière, who report it from a 2018 book
    by Sugimoto and Larivière. This course has not been able to check that book. The 8.3% and 0.7%
    come from a short research letter by Nowroozzadeh and Salehi-Marzijarani, which names its
    database and its journals.

    Now test the sentence from the course outline: "most descriptive cross-sectional studies are
    never cited". Which row measures descriptive cross-sectional studies? None of them. Every row
    counts papers by field, journal or year, never by study design. The nearest row for medicine
    gives 12% after 27 years, and that is nowhere near "most". The sentence has no row to stand on.
  analogy_breaks_when: |
    The table holds only what the held sources give. Most of the counts come from one database, Web
    of Science, and most were reported rather than published with their data. A careful count in
    another database, of the same kinds of document over the same windows, could give different
    shares. A study that sorted papers by design could show that some designs are cited much less
    than the field as a whole. Either would change what this section can say. Neither is held, so
    neither is described here.

    The rows are also not comparable with one another. Each answers its own question. Line them up to
    see how much the choices matter, never to rank the fields.
