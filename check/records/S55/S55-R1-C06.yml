- body: |
    Now watch the window change the answer, with everything else held still. Nowroozzadeh and
    Salehi-Marzijarani counted papers in five leading general medical journals in Web of Science.
    The journals are Annals of Internal Medicine, BMJ, JAMA, the Lancet and the New England Journal
    of Medicine. They gave the mean share uncited in the first year after publication, in the second
    year, and at five years.

    ```table
    | Year after publication | Papers of 1990 (%) | Papers of 2010 (%) |
    | 1 | 46.0 | 18.9 |
    | 2 | 16.1 | 2.7 |
    | 5 | 8.3 | 0.7 |
    ```

    Answer this before you read on: what share of these journals' 1990 papers were uncited? All three
    numbers in the first column are correct answers. They differ only in how long the count ran.

    Work out how much the window matters. Divide the first-year share by the five-year share. For the
    papers of 1990:

    ```working
    46.0 divided by 8.3 = 5.5
    ```

    So the same papers look five and a half times as uncited if you stop counting after one year
    instead of five.

    Now hold the window at five years and change the year of publication instead. The share falls from
    8.3% for papers of 1990 to 0.7% for papers of 2010. Anyone who quotes you "the" share of uncited
    papers in these journals has chosen both the year and the window, whether they say so or not.
  analogy_breaks_when: |
    These are five journals that almost everyone in medicine reads. The authors themselves warn that
    their results rest on one database and may not carry to other journals. A study in a small journal
    that one database does not cover would look quite different. So would a count in a database that
    covers it.

    The letter prints its rates without a unit. The chart beside them is labelled in per cent, and the
    section reads them that way.
