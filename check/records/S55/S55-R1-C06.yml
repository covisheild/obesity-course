must_know:
- point: |
    Never quote a share of uncited papers without its three labels. Name the database and what it
    counted. Name the year the papers were published. Name how long the count ran.
  kind: number
  bearing: methodological
  refs:
  - nicolaisen_frandsen_2019
- point: |
    The belief that more than half of all papers are never cited is an error. It goes back to a 1990 count that
    included letters, corrections and meeting abstracts, over only 5 years. Refuse the "half" figure when you hear it.
  kind: misconception
  bearing: public
  refs:
  - van_noorden_2017
- point: |
    Read "uncited" as "no citation found in this database by this date", not as a fact about the
    paper. Before you call a paper uncited, search for it in a second database and on the open
    web.
  kind: trap
  bearing: methodological
  refs:
  - van_noorden_2017
- point: |
    Web of Science shows papers by Indian authors as less often cited than papers from the United
    States and Europe. But it leaves out many regional-language journals, and counting them would
    narrow the gap. Before concluding that a department's work goes unread, find out whether the
    database covers the journals it was published in.
  kind: india_deviation
  bearing: policy
  refs:
  - van_noorden_2017
- point: |
    Do not use citation as your test of whether a study was worth doing. Test a question by who
    needs its answer and what they would do with it, as the last section began to do.
  kind: consequence
  bearing: methodological
  refs:
  - van_noorden_2017
- point: |
    When someone says a kind of study, such as a descriptive cross-sectional study, is "never cited",
    ask for the study that counted it. The one held count by design, of Web of Science articles of
    1991 and 2001, has no cross-sectional category.
  kind: dispute
  bearing: teaching
  refs:
  - patsopoulos_2005
- point: |
    A paper's title is not its finding. Golosovsky and Larivière's paper is called "Uncited papers are not
    useless". It shows that uncited papers follow the same statistical pattern as cited ones. Most of
    them, it finds, have some chance of being cited given enough time. It does not measure whether anyone
    used them.
  kind: trap
  bearing: methodological
  refs:
  - golosovsky_lariviere_2021
- point: |
    What would overturn these figures is a peer-reviewed count in another database that gave very different shares. Until
    then, quote them as what they are: counts in Web of Science and Scopus.
  kind: boundary
  bearing: methodological
  refs:
  - van_noorden_2017
  - golosovsky_lariviere_2021
  - nicolaisen_frandsen_2019
exercises:
- type: critique
  prompt: |
    In a made-up department meeting at your college, a senior colleague says: "Half of all research
    is never cited. A thesis that only counts how common something is will never be cited. So it is a
    waste of two years."

    Lay the argument out as premises and a conclusion. Say which premises the measurements in this
    section support, which they do not, and whether the conclusion would follow even if every premise
    were true.
  answer: |
    Premise 1: half of all research is never cited. Premise 2: a thesis that only counts how common
    something is will never be cited. Conclusion: such a thesis is a waste of two years.

    Premise 1 does not survive its labels. The "half" goes back to a 1990 report. It counted letters,
    corrections and meeting abstracts, over 5 years. Counting research articles and reviews in Web of
    Science, 4% of biomedical papers published in 2006 were uncited by December 2017. For medical
    sciences, a count reported by Golosovsky and Larivière gives 12% of papers from 1990 uncited after
    27 years.

    Premise 2 has no measurement behind it. The one count in this section that sorts papers by
    design, Patsopoulos and colleagues' count in Web of Science, has no cross-sectional category.
    The lowest design in it is the case report. So nobody can tell you from these figures how often
    a descriptive study goes uncited.

    Now grant both premises, as Book 0's section on argument taught you to. The conclusion still does
    not follow. Being uncited does not mean being useless. A public-health paper in Van Noorden's
    feature was never cited and was viewed more than 1,500 times.

    Whether a thesis is worth two years
    depends on the tests from the last section. Is the answer in doubt? Is it already known? Would it
    change what someone does? A descriptive question can pass all three.

    What survives of the colleague's worry is fair: a study that nobody needs is a waste, cited or not.
    That is a reason to test the question before starting, not a reason to avoid descriptive work.
- type: interpretation
  prompt: |
    A classmate's draft protocol says: "Uncited papers are not useless (Golosovsky and Larivière,
    2021). So our small study will be useful even if nobody cites it."

    Say what the cited paper measured, whether it supports the sentence, and what you would write
    instead.
  answer: |
    Check the reference as Book 0 taught: find the source, confirm it, find the passage, read it.

    The paper's title is "Uncited papers are not useless". Its body fits a statistical model of how
    papers gather citations. It finds that the model accounts for the share of uncited papers fairly
    well. It concludes that uncited papers follow the same process as cited ones, and that most have
    some chance of being cited given enough time.

    It does not measure whether anyone read or used an uncited paper. So it does not support "our
    study will be useful". The draft cites a title for a claim the body does not make.

    Better: drop the citation from that sentence. Say who will use the study's answer and what they
    will do with it. Do you want a source for the point that uncited work can still be used? Van
    Noorden's 2017 feature gives examples. It quotes a Clarivate analyst: "Lack of citation cannot be
    interpreted as meaning articles are useless or valueless."
- type: teaching
  prompt: |
    A journalist has three minutes and asks you: "Is it true that most medical research is never
    cited?" Answer without jargon, with your confidence stated, and give one sentence they could quote.
  answer: |
    No, not as usually stated. The "most" or "half" figure comes from an old count that included
    letters and corrections, which almost nobody cites, and it waited only five years.

    Counts of real research papers give much smaller shares. In one large database, Web of Science,
    about 4% of biomedical papers published in 2006 had no citation by the end of 2017. In another,
    Scopus, about 18 in every 100 medical research articles published from 1996 to 2015 had none by
    December 2018.

    Say how sure you are. Each is a count in one database, and every database misses some citations.
    So the true shares are probably lower. Several of the figures come from a magazine
    feature, not a peer-reviewed study.

    Then the part that matters more. Being cited does not mean a study was useful, and being uncited
    does not mean it was useless. One paper written to improve public-health practice was never cited,
    and it was viewed more than 1,500 times.

    A quotable sentence: "Very little medical research goes completely uncited; the harder question is
    how much of it anyone actually needed."
quantitative: false
retrieval_items:
- q: What three things must a figure for uncited papers state before it means anything?
  a: The database and what it counted, the year the papers were published, and how long the count
    ran (the citation window).
- q: Why was the 1990 figure of 55% uncited misleading?
  a: It counted letters, corrections, meeting abstracts and other editorial material, which are
    rarely cited, and it waited only 5 years.
- q: Does a database's count of uncited papers overstate or understate the true share?
  a: Probably overstates it, because the database misses citations in journals and books it does not
    cover and through errors. Removing self-citations pushes the other way.
- q: In Web of Science, what share of biomedical papers published in 2006 were uncited by December 2017?
  a: 4%, counting research articles and reviews, from an analysis by Larivière and Sugimoto reported in
    a Nature news feature.
- q: Does any held study measure how often descriptive cross-sectional studies are cited?
  a: No. The one held count by design (Patsopoulos and colleagues, Web of Science, articles of 1991
    and 2001, citations in 2 years) has no cross-sectional category; case reports were lowest.
