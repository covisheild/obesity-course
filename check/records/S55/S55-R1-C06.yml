- body: |
    Now look at the one held count that sorts papers by design. Patsopoulos, Analatos and Ioannidis
    searched the Science Citation Index in Web of Science for articles published in 1991 and in 2001
    whose titles named their design. For each design they gave the median number of citations an
    article received by the end of the second year after publication. The median is the middle value
    once the counts are put in order, as Book 0's section on average and spread showed.

    A meta-analysis combines the results of earlier studies of the same question into one answer. A
    case report describes one patient, or a few. The table shortens randomised controlled trial to randomised trial. It gives five of the study's seven
    designs; the other two, nonsystematic reviews and decision or cost-effectiveness analyses, are
    left out to keep it short. Each cell is a median number of citations in the first two years.

    ```table
    | Design | Articles of 1991 | Articles of 2001 |
    | Meta-analysis | 5 | 9 |
    | Randomised trial | 4 | 6 |
    | Cohort | 3 | 5 |
    | Case-control | 3 | 4 |
    | Case report | 0 | 1 |
    ```

    Read the labels first. The database is Web of Science. The papers are articles of 1991 and of
    2001 whose design is in the title. The window is two years after the year of publication. And
    the figure is a median count of citations, not a share uncited.

    A median can still tell you something about uncited papers. The median for case reports of 1991
    is 0. The middle of the ordered counts is 0, so at least half of those case reports had no
    citation in their first two years. That is a floor, not the share itself: it could be more than
    half.

    Now the question this section keeps asking. Which row is the descriptive cross-sectional study?
    None. The study has no cross-sectional category. The cohort and case-control rows are studies
    that relate an exposure to an outcome, and their medians sit between the meta-analyses and the
    case reports. Nothing in the table tells you where a cross-sectional study would sit.
  analogy_breaks_when: |
    A study was counted only if its design was named in its title, and most studies do not name
    their design there. The authors did not remove self-citations. The two-year window is short, and
    the counts come from one database. The authors add that citation impact does not necessarily
    translate into clinical or scientific impact. So the table ranks designs by early citations in
    one database, and nothing more.
