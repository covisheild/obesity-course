simplified_explanation: |
  So a question you can answer faces three more tests before you keep it.

  1. **Is the answer in doubt?** Write down two different answers you might get, with a reason to expect each.
  2. **Is it already answered?** Look for studies and reviews that have asked it for your people, place and time,
     and for counts that someone already holds.
  3. **Would the answer change anything?** Write each possible answer on its own line. Beside each,
     write what someone would decide or do if that answer came back. If every line says the same
     thing, the answer changes nothing. You will learn to name that someone in `S55-R1-C07`.

  A question that passes all three is worth answering. One that fails any of them is not, as it
  stands. Often it can be changed until it passes.
illustrations:
- body: |
    Here is the setting for this book again. You are a postgraduate in community medicine at a
    medical college in Chhattisgarh, and you must propose a first research question on obesity.
    Everything in this example is made up, including what the programme officer tells you.

    Suppose your guide suggests this: "Find out how common obesity is among children in classes 6 to
    8 in the government schools of the district." Run the three tests on it.

    **Test one: is the answer in doubt?** Try to write two different answers, each with a reason.
    Suppose a teacher tells you that most children walk a long way to school: a reason to expect a
    low share. Suppose another tells you that fried snacks are sold at every school gate: a reason
    to expect a higher one. Both reasons are made up for this example. You have a reason for each
    answer, so it passes.

    **Test two: is it already answered?** Before you plan anything, go and look. Search for existing
    studies and reviews on children in the district. Then ask the district non-communicable
    disease (NCD) programme officer what the district already holds. Suppose the officer
    tells you that a school health team weighed and measured every child in those classes last year,
    and the counts are in the office.

    Now your survey would count again what has just been counted. The question fails test two.
    Ioannidis lists eight features that, he argues, define useful clinical research. The second,
    context placement, asks whether earlier evidence has been systematically assessed before a new
    study. Looking before you plan is that step. He asks for it to be done systematically.

    Do not drop the topic yet. Jhangiani and colleagues advise refining a question that has been
    studied, not giving it up. Ask what the existing counts cannot tell you. They tell you which
    children the screening found to have obesity. They do not tell you what happened to those children
    next. That gives you a new candidate, written as one sentence:

    "Among children in classes 6 to 8 found to have obesity, as the protocol of last year's
    school screening in the district defined it, what share were seen again by a health worker within six months?"

    Run the tests again.

    - **In doubt?** Here is a reason to expect a low share: nobody may have been told to follow the
      children up. Here is a reason to expect a high one: the screening team may have been told to
      refer every child it found. You have reasons for two answers, so it passes.
    - **Already answered?** The screening counts record who was found, not who was seen again.
      Suppose the officer confirms that nobody has traced the children. It passes, for this district.
    - **Would the answer change anything?** Write the two lines.

    ```table
    | If the answer is | What could follow |
    | most children were seen again | the referral step is left alone, and effort goes elsewhere |
    | few children were seen again | the officer has a reason to change the referral step |
    ```

    The two lines differ, so the answer can change something. Notice too that the study is useful
    whichever answer comes back. Neither answer is the "good" result you would be tempted to find.

    Last, ask his third feature, information gain: is the study large enough to inform? If the screening found only a handful of
    children, your share will rest on a handful of children. Ask whether that is enough for anyone to
    act on before you commit to it.
  analogy_breaks_when: |
    The officer, the screening and its records are made up to show the tests working. In a real
    district, "already counted" has to be checked, not taken on trust. Were all the schools covered?
    How were the children weighed? Can you actually get the counts? A record that exists but that you
    cannot open has answered nothing for you.

    The third test here only shows that the two answers point to different actions. Whether the
    officer can in fact change the referral step, and would, is a separate question you still have
    to ask.
  numbers: []
- body: |
    Answerable and worth answering are two separate judgements, so a question can land in any of
    four places. Here are four made-up questions from the same setting. Before you look at the
    table, decide for each one: can you answer it, and is it worth answering?

    - Q1. Among patients at the district hospital's NCD clinic, do those who wait longer in the queue
      spend longer at the clinic that day?
    - Q2. The follow-up question from the example above.
    - Q3. Would a state-wide tax on sugary drinks change how many children in Chhattisgarh develop
      obesity over ten years?
    - Q4. What did students at your college eat for dinner on one evening in 1995?

    ```table
    | Question | Answerable by you? | Worth answering? | Why |
    | Q1 | yes | no | the answer is fixed before you start: waiting is part of the time spent at the clinic, so it fails test one |
    | Q2 | yes | yes | it passes all three tests |
    | Q3 | no | yes | the answer is in doubt and would change policy, but a postgraduate cannot run the study |
    | Q4 | no | no | no record exists to answer it, and no answer would change anything now |
    ```

    The cell that catches people is Q1's. It is easy, cheap and quick, and it will produce a number
    and a table. It fails only the test you did not think to run.

    Q3 is a different trap. It is worth answering, and that makes it tempting to propose. But being
    worth answering does not make it answerable by you.
  analogy_breaks_when: |
    The cells are not fixed. Q3 is out of your reach, but a state department with money and years
    might answer it. Q1 is circular in a way that shows at once. In a real proposal, the circle is
    usually hidden in how the groups were defined, and it takes a careful read to see it.
  numbers: []
must_know:
- point: |
    The error is to treat a question you can answer as a question worth answering. Run the three
    tests on every candidate you can answer before you keep it.
  kind: misconception
  bearing: methodological
  refs:
  - jhangiani_2019_methods
- point: |
    Before you keep a candidate, write down two answers you might get, with a reason for each.
  kind: move
  bearing: methodological
  refs:
  - jhangiani_2019_methods
- point: |
    Look for an existing answer before you plan a study, not after. Ask the programme what it
    already counts, and look for reviews that have gathered earlier studies.
  kind: move
  bearing: methodological
  refs:
  - ioannidis_2016_useful
  - ioannidis_2014_waste
- point: |
    "It has been studied already" does not end a question, and "it has not been studied here" does
    not save one. Refine a studied question only where you have a reason to expect a different answer
    for your people or your place.
  kind: trap
  bearing: methodological
  refs:
  - jhangiani_2019_methods
  - ioannidis_2014_waste
- point: |
    Design the study so that it is useful whichever answer comes back.
  kind: consequence
  bearing: methodological
  refs:
  - ioannidis_2016_useful
- point: |
    These tests judge a question on the day you run them. Run the tests again before each big step,
    such as writing the protocol or starting to collect data.
  kind: boundary
  bearing: methodological
  refs:
  - ioannidis_2016_useful
exercises:
- type: design
  prompt: |
    Here are three made-up candidate questions from your setting. For each, run the three tests: is
    the answer in doubt, is it already answered, would the answer change anything? Say whether you
    would keep it, change it, or drop it, and why. Where you would change it, write the new question
    as one sentence.

    1. Among first-year students at your medical college, do students living in the hostel eat
       dinner after 10 pm more often than students living at home?
    2. A district screening camp sorts adults by a cut-off on body mass index. `B0-R0-C14` defined it as
       weight in kilograms divided by the square of height in metres. Among adults of the same
       height, do those above the cut-off weigh more than those below it?
    3. Among adults registered with the NCD clinic for obesity, how many are also registered with the
       clinic for high blood pressure?
  answer: |
    1. In doubt: yes. The hostel mess may serve dinner at a fixed early hour. Students at home may
       eat when the family eats, which may be late. There are reasons for either answer.

       Already answered: you do not know until you look for earlier studies of students' meal
       timing.

       Would the answer change anything? Write the two lines. If hostel students eat later, what
       would the college do? If they eat earlier, what would it do? Unless someone would change a mess
       timing or a canteen rule, both lines say "nothing".

       So as it stands the question fails test
       three. Keep it only if you can name who would act on the answer. Otherwise drop it.

    2. Drop it. When height is the same for everyone compared, body mass index goes up only when
       weight goes up. So among adults of the same height, the cut-off sorts people by weight. The
       group above it is heavier by the way it was made. The answer is fixed before you start and fails test one,
       like Q1 in the section.

    3. In doubt: yes. A reason for few: this clinic may not check blood pressure in everyone it
       sees for weight. A reason for many: it may check everyone it sees for both.

       Already answered: it may be. The clinic's own register may already hold both registrations.
       Then a count from the register would answer it in an afternoon, without a study.

       Would the answer change anything? Only if someone would run the clinic differently with the
       count in hand, for instance by booking both visits on one day.

       So check the register first. If the count is there, the question is answered. Change the
       question to what the register cannot tell you, for example what happens to patients who are
       booked for two separate visits.
- type: critique
  prompt: |
    A classmate says in a department meeting: "My question has never been studied in Chhattisgarh.
    So it is worth doing."

    Lay the argument out as a premise and a conclusion. Say where it fails, and what your classmate
    would need to add to make it hold.
  answer: |
    Premise: the question has never been studied in Chhattisgarh. Conclusion: it is worth doing.

    Test the inference first, as Book 0's section on argument taught. Grant the premise. It shows
    only that the question passes part of test two: nobody has answered it here. It says nothing
    about test one or test three. An answer that is not in doubt anywhere is not in doubt in
    Chhattisgarh either. And a question whose answer would change nothing is not rescued by being new
    to the state.

    There is a second gap inside test two itself. Suppose the question has been answered well
    elsewhere. Then a new study here adds something only if there is a reason to expect a different
    answer here. Without that reason, it is a repeat in a new place.

    To make the argument hold, your classmate needs three more premises. There is a reason to expect
    a different answer here from the one found elsewhere. There are reasons to expect more than one
    answer. And someone would act differently depending on which answer comes back.
- type: teaching
  prompt: |
    A first-year resident has ten minutes and a whiteboard. They have a question they can answer
    easily from the NCD clinic register. They ask you: "It is quick and I can get the data. So why
    would my guide say it is not worth doing?" Explain the difference between a question you can
    answer and a question worth answering.
  answer: |
    Draw a two-by-two on the whiteboard. One side reads "can I answer it?", yes and no. The other
    reads "is it worth answering?", yes and no. Say that these are two different questions about
    the research question. The first is about your means. The second is about the question.

    Then give the three tests for the second one, and let the resident apply each to their own
    question.

    - Is the answer in doubt? Can you give a reason for two different answers?
    - Is it already answered, here or somewhere that would carry over to here? Did you look before
      you planned?
    - Would the answer change anything? Write each possible answer on a line, and beside it what
      someone would do. Do the lines differ?

    Put the resident's question in its cell. If it is quick and answerable but fails a test, it sits
    in the "yes, no" cell. That cell is where many easy questions sit. Being quick is the reason it
    tempts people, and it is no reason to keep it.

    End with the repair, not the rejection. Ask what the register cannot tell you. That is often
    where a question worth answering starts.
quantitative: false
retrieval_items:
- q: What are the three tests of whether an answerable question is worth answering?
  a: The answer is in doubt; it is not already answered well for the people, place and time you mean;
    and some possible answer would lead someone to decide or act differently from another.
- q: Which two of Ioannidis's features did the worked example use, and for what?
  a: Context placement (find what is known before planning) and information gain (enough people for
    the answer to be acted on).
- q: How do you check whether an answer is in doubt before collecting any data?
  a: Try to give a reason to expect each of at least two different answers. If you can find a reason
    for only one, the answer is not in doubt.
figure_note: "No figure: the section has no measured numbers, and its two-by-two (answerable against worth answering, Q1 to Q4) is already a table. The diagram a reader would want is that grid drawn as four quadrants with each question placed in its cell."
