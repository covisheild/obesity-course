  - value: '94'
    unit: per cent of case-patients who ate salsa
    citekey: cdc_ss1978_lesson1
    as_of: '2026-09-25'
    quote: Of 133 items on the restaurant’s menu, the most striking difference between the case and control
      groups was in the proportion that ate salsa (94% of case-patients ate, compared with 39% of controls).
  - value: '39'
    unit: per cent of controls who ate salsa
    citekey: cdc_ss1978_lesson1
    as_of: '2026-09-25'
    quote: Of 133 items on the restaurant’s menu, the most striking difference between the case and control
      groups was in the proportion that ate salsa (94% of case-patients ate, compared with 39% of controls).
  - value: '133'
    unit: items on the restaurant's menu
    citekey: cdc_ss1978_lesson1
    as_of: '2026-09-25'
    quote: Of 133 items on the restaurant’s menu, the most striking difference between the case and control
      groups was in the proportion that ate salsa (94% of case-patients ate, compared with 39% of controls).
must_know:
- point: |
    The error is to call a cross-sectional survey a weak study. It is weak for relate and cause
    questions. Judge a design against the question it was asked to answer.
  kind: misconception
  bearing: methodological
  refs:
  - cdc_ss1978_lesson1
- point: |
    Write the question before you choose the design, then read its verb. If the question and the
    design you planned do not match, change one of them, and say which.
  kind: move
  bearing: methodological
- point: |
    When a one-visit survey is reported with the words "leads to", "causes" or "effect of", do not
    repeat them. Ask which came first.
  kind: trap
  bearing: public
- point: |
    If the question needs time order, change the design, not the sample size.
  kind: boundary
  bearing: methodological
- point: |
    Matching the design to the question tells you what a study could answer. It does not tell you
    whether this study was done well.
  kind: boundary
  bearing: methodological
- point: |
    In a committee, say which kind of evidence you have before anyone decides.
  kind: consequence
  bearing: policy
  refs:
  - cdc_ss1978_lesson1
- point: |
    When a trainee proposes a trial for a how-common question, ask them what chance would decide. If
    nothing is being assigned, there is nothing for chance to do, and the question needs a count.
  kind: move
  bearing: teaching
exercises:
- type: design
  prompt: |
    Here are five made-up questions from the running setting. For each, say whether it is a describe,
    relate or cause question, and name the study that answers it.

    1. What share of adults screened at the district screening camp in 2027 had obesity?
    2. In two government schools in Raipur city, are children aged 10 to 14 who play a sport after
       school less likely to develop obesity over two years?
    3. Does a weekly class on cooking with less oil, given to one adult in each household, change the
       weight of the adults in urban slum households over one year?
    4. Were adults with obesity at the NCD clinic more likely than adults without it to have worked
       night shifts in the past ten years?
    5. In which age groups of women attending the NCD clinic in 2027 is obesity commonest?
  answer: |
    1. Describe. It asks how common, and names no exposure. A cross-sectional study: count from the
       camp's records, or from a sample of them.
    2. Relate. It asks whether an exposure (after-school sport) goes with an outcome (developing
       obesity), with time in it: "over two years". A cohort study. Record who plays sport now,
       weigh the children at the start, and weigh them again in two years.
    3. Cause. It asks whether changing something changes the outcome, and the class is something you
       can assign. A randomised controlled trial: chance decides which households get the class.
    4. Relate. It starts from the outcome (obesity or not) and looks back at a past exposure (night
       shifts). A case-control study: adults with obesity as cases, adults without it as controls,
       and compare their past work.
    5. Describe. "In which age groups" asks in whom the outcome is commoner. There is still no
       exposure you are testing. A cross-sectional study of the clinic's women patients, counted by
       age group.

    Question 4 is the one to notice. It reads like a cause question about night shifts. As written
    it only asks whether the two go together, and a case-control study is the right answer to that.
- type: critique
  prompt: |
    A made-up poster at a college research day reads:

    "We surveyed 400 first-year students on one day. Students who slept less than six hours had
    obesity more often. Conclusion: short sleep causes obesity in medical students, and hostels
    should enforce a lights-out time."

    Lay out what the study could and could not show. Then rewrite the conclusion so that it claims
    only what the study showed.
  answer: |
    What it could show: in these 400 students, on that day, short sleep and obesity went together.
    That is an association, and a one-day survey can show it.

    What it could not show, twice over.

    First, which came first. Sleep and weight were measured on the same day. So the survey cannot
    tell short sleep leading to weight gain apart from the weight coming first and changing the
    sleep. Both orders leave the same pattern on the day of the survey.

    Second, a third thing. Long study hours, or a noisy shared room, could cut sleep and shape eating
    and movement too. The survey cannot rule that out.

    So "causes" is not supported. The hostel rule goes further still: it is a decision about what
    ought to be done, built on a cause the study did not show.

    A conclusion the study supports: "In a one-day survey of 400 first-year students at our college,
    students who reported sleeping less than six hours more often had obesity. The survey cannot say
    which came first, or whether a third factor explains both. A cohort study would be the next
    step."

    Note that 400 is the poster's own made-up number. Surveying 4,000 students on one day would
    not change any of this.
- type: teaching
  prompt: |
    A journalist has three minutes. Their press release says "Survey finds late dinners linked to
    obesity in college students". They ask whether they can write "late dinners cause obesity".
    Answer without jargon, and give one sentence they could quote.
  answer: |
    Start with what "linked" means. The survey found that students who eat late and students with
    obesity overlap more than you would expect. That is worth knowing.

    Then say what a one-day survey cannot do. It asked about dinner and weighed people on the same
    day. So it cannot say which came first. Some students may have changed their dinner time because
    of their weight, not the other way round. And something else, like long study hours, could shape
    both.

    Give them a calibrated line, not a dismissal. The finding is a reason to study the question
    properly, not a reason to tell anyone to change their dinner time.

    A quotable sentence: "The survey shows late dinners and obesity turn up together; it cannot show
    that one causes the other."
quantitative: false
retrieval_items:
- q: Name the three kinds of research question and the study each needs.
  a: Describe (how common, in whom) needs a cross-sectional study. Relate (is the exposure associated
    with the outcome) needs a cohort or case-control study, which have a comparison group. Cause (does
    changing the exposure change the outcome) needs a randomised controlled trial, where the exposure
    can be assigned.
- q: What can a cross-sectional study not tell you about an association it finds?
  a: Which came first, because it measures exposure and outcome at the same time. A bigger sample does
    not fix this.
- q: How does a case-control study differ from a cohort study?
  a: A cohort study starts from the exposure and follows people forward to the outcome. A case-control
    study starts from the outcome (cases and controls) and compares past exposures.
