simplified_explanation: |
  There are three kinds.

  ```table
  | The question asks | Kind | The study that answers it |
  | How common is it, and in whom? | describe | a cross-sectional study: one visit, one count |
  | Do people with the exposure have the outcome more often? | relate | a cohort study or a case-control study |
  | If we change the exposure, does the outcome change? | cause | a randomised controlled trial |
  ```

  A describe question has no exposure. You answer it with a cross-sectional study. You take a sample, visit
  once, and count. The count is the prevalence — how many people in a group have the condition.

  A relate question asks whether an exposure and an outcome go together. To see that, you need a comparison
  group: people without the exposure, or without the outcome.

  - A cohort study starts from the exposure. You record who is exposed and who is not. You follow
    both groups over time and count who develops the outcome.
  - A case-control study starts from the outcome. You enrol people who have it (cases) and people
    who do not (controls). Then you compare what each group was exposed to in the past.

  In both, you watch the exposure happen. You do not decide it.

  A cause question asks for more than going together. Two more things must hold. The exposure must
  come first. And no third thing may be moving both.

  A randomised controlled trial is a way to test a treatment in which chance decides who gets it, and then the
  groups are compared. Chance does the deciding, not anything about the people. So no third thing can decide who
  is exposed.

  Now the weak spot of the one-visit study. It measures the exposure and the outcome on the same
  day. So it can find that they go together. It cannot tell you which came first.

  Surveying more people does not repair this. Ten times the sample, measured on one day, is still silent about
  which came first.

  A systematic review is a study of studies. It collects and combines the results of all the studies already
  done on one question.
illustrations:
- body: |
    Suppose your first idea, made up for this section, is about college students' meal timing. You
    plan a survey of first-year students at your own medical college. On one day you weigh and
    measure each student, and you ask what time they usually eat dinner. You hope to learn whether
    late dinners go with obesity.

    Now suppose the made-up result comes back the other way round. Students with obesity more often
    say they eat dinner early.

    Stop before you write "early dinner leads to obesity". Ask which came first. You measured the
    dinner time and the weight on the same day. A student told by a doctor last year that her weight
    was high may have moved her dinner earlier since. Then the weight came first, and it changed the
    dinner time. Your survey cannot tell.

    Next ask whether a third thing sits behind both. Students in the hostel eat when the mess serves.
    Students living at home eat when the family eats. Where a student lives could shape both dinner
    time and weight. Then the two would go together without either one moving the other.

    Neither story is a fact about your college. Both are possible, and a one-day survey rules out
    neither.

    Now the fix. Decide which question you meant, write it as one sentence, and let it choose the
    design. Here are three made-up versions.

    ```table
    | Question | Kind | Study that answers it | What it still cannot tell you |
    | What share of first-year students at this college eat dinner after 10 pm, in the first term of 2027? | describe | a cross-sectional study of a random sample of first-year students, on one visit | whether eating late matters for weight |
    | Do first-year students who eat dinner after 10 pm gain more weight over their first year than those who eat before 8 pm? | relate | a cohort study: record dinner time and weight at the start of the year, and weigh the same students at the end | whether a third thing, such as where they live, explains the difference |
    | Among first-year students, does eating dinner before 8 pm, compared with after 10 pm, change weight gain over one year? | cause | a randomised controlled trial: chance decides which students are asked to eat early | whether students outside a trial would keep to the change |
    ```

    Look at the first row. For a how-common question, the one-day survey is exactly the right tool.
    Its weakness was never a weakness for this question.

    Look at the second row. The cohort study records dinner time before it measures weight gain. So
    it settles which came first. It does not settle the third thing.

    Look at the third row. Chance decides who is asked to eat early. So where a student lives cannot
    decide it. That is what the trial gives you and the cohort cannot.
  analogy_breaks_when: |
    The survey result is made up, and so is each story about it. They show what a one-day survey
    cannot rule out, not what is true at any college.

    Chance removes the third thing only on average. In a small trial, bad luck can still put more
    hostel students in one group. This is the sampling variation of Book 0, and it shrinks as the
    groups grow.

    Real questions often mix the kinds. "Which students eat late, and does it matter?" is a describe
    question and a relate question in one sentence. Split it, and give each half its own design.

    A trial also needs the exposure to be something you can assign. You can ask a student to eat
    dinner early. You cannot assign a family's income or a child's age. For those, the cause question
    has to be argued from relate studies, with time order and third things dealt with in the argument.
  numbers: []
- body: |
    Here is a real case-control study, told in the CDC's textbook Principles of Epidemiology in
    Public Health Practice. In 2003 there was a large outbreak of hepatitis A, an infection, in
    Pennsylvania. Almost all the people who fell ill had eaten at one restaurant. So the question was
    a relate question: which food on the menu goes with falling ill?

    Start with what the investigators tried first. They asked the people who fell ill what they had
    eaten. The textbook says this showed only which foods were popular. The ill and the well both eat
    the popular dishes.

    So they added a comparison group. They also interviewed people who ate at the same restaurant in
    the same weeks and did not fall ill. Those are the controls. Now compare past exposures between
    the two groups.

    ```table
    | Group | Share who ate salsa |
    | people who fell ill (cases) | 94% |
    | people who did not fall ill (controls) | 39% |
    ```

    Of 133 items on the menu, this was the most striking difference. Further work on the salsa's
    ingredients pointed to green onions.

    Notice the direction. A case-control study starts from the outcome and looks back at exposures.
    The people who fell ill already existed. Nobody had to wait for anyone to fall ill.
  analogy_breaks_when: |
    The 94% and 39% belong to this one outbreak, and to one meal eaten a few weeks earlier. They say
    nothing about salsa anywhere else.

    Obesity questions look back much further. People asked what they ate over many years may
    remember differently depending on whether they have the outcome. The shorter and sharper the
    exposure, the better looking back works.
  numbers:
  - value: '2003'
    unit: year of the hepatitis A outbreak in Pennsylvania
    citekey: cdc_ss1978_lesson1
    as_of: '2026-09-25'
