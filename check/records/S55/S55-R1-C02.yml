simplified_explanation: |
  **Population** — who the answer is about.

  Here the population needs a
  fence round it on three sides. Place: which district, which schools. Person: what ages, and
  anything else that decides who is in. Time: which year. "School children" has no fence.
  "Children aged 10 to 14 in government schools in Raipur district in the 2027–28 school year" has
  all three.

  **Exposure** — what differs between the people you compare. It is something they have, do or
  meet: walking to school, a night shift, living near a sweet shop.

  **Comparison** — the group you set the exposed group against. Children who walk to school are
  compared with children who are driven. Without a comparison, "children who walk have obesity
  less often" has nothing to be less often than.

  **Outcome** — what you measure to answer the question. Obesity judged from measured weight and
  height is an outcome.

  The four parts have short names made from their first letters. PICO is population,
  intervention, comparison, outcome. Use it when someone gives the thing being tested. PECO is
  population, exposure, comparison, outcome. Use it when people meet the exposure in their
  ordinary lives.

  Not every question needs all four. "What share of these children have obesity?" has a population
  and an outcome, and nothing else. It asks how common something is.

  Writing the question this way has a second use, later. When you search for what others have
  already found, you build the search from these same parts.
illustrations:
- body: |
    Start with a first draft that fails. Suppose your guide names the topic "obesity in school
    children", and you write this at the top of your made-up protocol:

    "To study obesity and its risk factors among school children."

    Try to find the four parts in it.

    The population is "school children". Which place? Which ages? Which year? It does not say.

    The exposure is "risk factors". Name one. The sentence does not.

    There is no comparison, because there is no exposure to compare.

    The outcome is "obesity". That part is there, because the topic was obesity. But the draft
    does not say how obesity will be judged.

    Now rebuild it one part at a time.

    ```table
    | Part | First draft | Rewrite |
    | population | school children | children aged 10 to 14 in government schools in Raipur district, in the 2027–28 school year |
    | exposure | risk factors | walking or cycling to school |
    | comparison | none | coming to school by bus or motor vehicle |
    | outcome | obesity | obesity, judged from measured weight and height |
    ```

    Put the rewrite together as one sentence:

    "Among children aged 10 to 14 in government schools in Raipur district in the 2027–28 school
    year, do those who walk or cycle to school, compared with those who come by bus or motor
    vehicle, have obesity less often, judged from measured weight and height?"

    Read the sentence and check that you can plan from it. You know which schools to visit, which
    children to include and in which year. You know the one thing to ask each child about, and the
    two groups it makes. You know what to measure.

    Now notice two things about it.

    Walking to school is something the children do. Nobody in the study gives it to them. So this
    is a PECO question. Suppose instead the schools started a walking programme and you asked
    whether it changed how many children had obesity. The programme would be given on purpose. It
    would be an intervention, and the question would be PICO.

    Take out the exposure and the comparison, and the sentence still works: "What share of children
    aged 10 to 14 in government schools in Raipur district, in the 2027–28 school year, have obesity,
    judged from measured weight and height?" That is a how-common question. It is a smaller
    question than the first, and a complete one.
  analogy_breaks_when: |
    The rewrite is one choice among many. "Risk factors" could have become screen time, sleep or
    meals, and each would be a different question. The one-sentence form shows that you picked one.
    It does not show that you picked the right one.

    "Judged from measured weight and height" is still a placeholder. A real protocol must name the
    cut-off it uses for children, and say where that cut-off comes from. This section does not
    teach that.
- body: |
    Now run the check on a whole set. Here are five first drafts, made up, of the kind a batch of
    postgraduates might bring to a department meeting. Each one is marked for whether it names each
    part clearly.

    ```table
    | No. | First draft | Fenced population | Exposure or intervention | Comparison | Outcome |
    | 1 | To study obesity among school children. | no | no | no | yes |
    | 2 | Prevalence and risk factors of obesity in urban slums. | no | no | no | yes |
    | 3 | Effect of mobile phone use on obesity in college students. | no | yes | no | yes |
    | 4 | Does eating dinner late cause weight gain? | no | yes | no | yes |
    | 5 | Role of text-message reminders in follow-up at the district hospital NCD clinic, 2027. | yes | yes | no | yes |
    ```

    Draft 5 marks "yes" for its outcome, but loosely. "Follow-up" could mean coming to the next
    visit, or still coming after a year. The rewrite has to pick one.

    Here are the same five, rewritten.

    ```table
    | No. | Rewrite | Fenced population | Exposure or intervention | Comparison | Outcome |
    | 1 | What share of children aged 10 to 14 in government schools in Raipur district, in the 2027–28 school year, have obesity, judged from measured weight and height? | yes | no | no | yes |
    | 2 | Among women aged 20 to 45 in slum households in Bilaspur city in 2027, do those who work outside the home, compared with those who do not, have obesity less often? | yes | yes | yes | yes |
    | 3 | Among first-year students at one medical college in Chhattisgarh in 2027, do those who spend more than 3 hours a day on a phone screen, compared with those who spend less than 1 hour, have obesity more often? | yes | yes | yes | yes |
    | 4 | Among students aged 18 to 22 at one medical college in Chhattisgarh, do those who usually eat dinner after 10 pm, compared with those who eat before 8 pm, gain more weight, in kilograms, over one academic year? | yes | yes | yes | yes |
    | 5 | Among adults with obesity attending the NCD clinic of the district hospital in Durg between January and June 2027, does a text-message reminder the day before each visit, compared with no reminder, raise the share who come to their next visit? | yes | yes | yes | yes |
    ```

    Rewrite 1 has no exposure on purpose. It is a how-common question, and that is allowed.
    Rewrite 2 had to drop "risk factors" and pick one. Rewrite 4 dropped the word "cause": it asks
    whether the two groups differ, which is a smaller claim. Rewrite 5 is the only PICO question of
    the five, because the clinic sends the reminder on purpose.

    Count each part down the columns of both tables. There are five drafts. In the count, an
    intervention is counted under exposure.

    ```table
    | Part | First drafts | Rewrites |
    | fenced population | 1 | 5 |
    | exposure | 3 | 4 |
    | comparison | 0 | 4 |
    | outcome | 5 | 5 |
    ```

    Every one of the five drafts named its outcome, and only one fenced its population. That fits
    what you saw in the first draft above: the topic word, obesity, lands in the outcome slot by
    itself. The fence and the comparison are the parts you have to go looking for.
  analogy_breaks_when: |
    The five drafts are made up, and the counts describe only them. They are not a finding about
    how people write questions. What carries over is the check, not the numbers.

    A "yes" in a column means the part is named. It does not mean the part is well chosen. Rewrite
    3's cut-offs of 3 hours and 1 hour are the drafter's choice, and another drafter could defend
    different ones.
must_know:
- point: |
    The error is to think "school children" is a population. A population has a fence of place,
    person and time. Refuse to plan a sample until the sentence names all three.
  kind: misconception
  bearing: methodological
- point: |
    Write the question as one sentence, then label its population, exposure or intervention,
    comparison and outcome. If you cannot label a part, the question does not have it.
  kind: move
  bearing: methodological
- point: |
    Obesity can be the exposure or the outcome. "Do adults with obesity miss more clinic visits?"
    has obesity as the exposure.
  kind: trap
  bearing: methodological
- point: |
    A question with two outcomes is two questions. Split it, and keep the one you would choose if
    you could only have one.
  kind: consequence
  bearing: methodological
  refs:
  - aslam_emmanuel_2010
- point: |
    Morgan and colleagues report, from an earlier review they cite, that over half (54%) of 313
    research studies did not report all four PICO parts. This course has not read that review. So
    when you read a paper, find its population, exposure, comparison and outcome yourself. Do this before you accept what it says it answered.
  kind: number
  bearing: methodological
  refs:
  - morgan_peco_2018
- point: |
    A trainee brings a title like "Prevalence and risk factors of obesity in urban slums". Ask them
    to read out their one outcome and their one exposure. When they list several risk factors,
    ask which one they would keep if they could only keep one.
  kind: move
  bearing: teaching
- point: |
    The four-part check tells you a question is complete and asks one thing. A perfectly formed
    sentence can still be the wrong question to ask.
  kind: boundary
  bearing: methodological
exercises:
- type: design
  prompt: |
    Go back to the four made-up candidates in the last section's table. They were about the Raipur
    schools, the district screening camp, meal timing at your college, and whether clinic patients
    know their own weight. Rewrite each as one sentence with its population fenced by place, person and
    time. Label the population, exposure or intervention, comparison and outcome in each. Say which
    are how-common questions.
  answer: |
    One possible set of rewrites. Yours will differ in the details. Check that each of yours has a
    fenced population and one outcome.

    1. "What share of children aged 10 to 14 in government schools in Raipur district, in the
       2027–28 school year, have obesity, judged from measured weight and height?"

       Population: children aged 10 to 14 in government schools in Raipur district, 2027–28.
       Exposure: none. Comparison: none. Outcome: obesity from measured weight and height. A
       how-common question.

    2. "Among adults aged 18 and over screened at the district screening camp in 2025, did those
       living in the town, compared with those living in villages, have obesity more often?"

       Population: adults aged 18 and over screened at that camp in 2025. Exposure: living in the
       town. Comparison: living in a village. Outcome: obesity. PECO.

    3. "Among first-year students at your medical college in 2027, do those who usually eat dinner
       after 10 pm, compared with those who eat before 8 pm, gain more weight, in kilograms, over
       one academic year?"

       Population: first-year students at your college, 2027. Exposure: dinner after 10 pm.
       Comparison: dinner before 8 pm. Outcome: weight gained over the year, in kilograms. PECO.

    4. "Among adults attending the NCD clinic of the district hospital between January and March
       2027, what share can state their own weight to within 2 kilograms of the clinic's reading?"

       Population: adults at that clinic, January to March 2027. Exposure: none. Comparison:
       none. Outcome: stating one's own weight to within 2 kilograms. A how-common question. The
       rewrite had to turn "know their weight" into something you can measure.
  skill_ref: S55-R1-K01
- type: teaching
  prompt: |
    A first-year resident has ten minutes and a whiteboard. Their draft title is "Risk factors of
    obesity among college students". Teach them why "risk factors" is not an exposure, and help
    them rewrite the title as one question.
  answer: |
    Write the four labels down the left of the board: population, exposure, comparison, outcome.
    Ask the resident to fill each from their title.

    They will write "college students" for the population. Ask: which college, which year of study,
    which academic year? Add the fence.

    They will write "risk factors" for the exposure. Ask them to name one. They may name five:
    sleep, screen time, meals, hostel food, stress. Point out that each one gives a different pair
    of groups to compare. Five exposures means five questions, and one study is built round one.

    Ask which of the five they would keep if they could only keep one. Say it forms the exposure.
    The comparison follows from it: students who sleep less than six hours, say, against those who
    sleep more.

    The outcome is obesity. Ask how it will be judged, and write that in.

    Then read the finished sentence aloud together. The other four risk factors are not lost. Each
    one is now a candidate question of its own.
quantitative: true
practice:
- level: 1
  prompt: |
    Label the population, the exposure, the comparison and the outcome in this question.

    Among adults aged 40 to 60 living in one town in 2025, do those who work night shifts, compared
    with those who work day shifts, have a higher average weight?
  answer: |
    ```table
    | Part | In the question |
    | population | adults aged 40 to 60 living in one town in 2025 |
    | exposure | working night shifts |
    | comparison | working day shifts |
    | outcome | average weight |
    ```

    The population is fenced by person (aged 40 to 60), place (one town) and time (2025). The
    study does not give anyone a night shift; the workers already have one. So this is an exposure,
    and the question is PECO.
- level: 2
  prompt: |
    Label the parts of each question. Say where a part is missing.

    a. Among children aged 6 to 10 in the schools of one block in 2026, what share have obesity?
    b. Among patients of one clinic in 2026, does a weekly phone call from a nurse, compared with
       no call, raise the share who come to their next visit?
    c. Do people who sleep less weigh more?
  answer: |
    ```table
    | Question | Population | Exposure or intervention | Comparison | Outcome |
    | a | children aged 6 to 10 in the schools of one block, 2026 | none | none | obesity |
    | b | patients of one clinic, 2026 | a weekly phone call from a nurse (intervention) | no call | coming to the next visit |
    | c | missing | sleeping less | not stated | weight |
    ```

    a. No exposure and no comparison. It is a how-common question, and nothing is wrong with that.

    b. All four parts are there. The clinic gives the call on purpose, so it is an intervention and
       the question is PICO.

    c. Two parts are missing. The population has no fence at all: which people, where, when?
       And "less" has nothing to be less than. Sleeping less than how many hours, compared with
       whom? It needs both before it can be planned.
- level: 3
  prompt: |
    Label the parts of this question. The parts are not in the usual order.

    Is the weight gained over one year by first-year students of one college in 2027 greater among
    those living in the hostel than among those living at home?
  answer: |
    ```table
    | Part | In the question |
    | population | first-year students of one college in 2027 |
    | exposure | living in the hostel |
    | comparison | living at home |
    | outcome | weight gained over one year |
    ```

    The outcome comes first in this sentence, and the exposure comes last. Word order does not
    decide the parts.

    Ask two things instead. What differs between the two groups? Where they live.
    What is measured to answer? Weight gained. The college does not assign students to the hostel
    for the study, so the question is PECO.
- level: 4
  prompt: |
    Take the made-up topic "obesity in school children in Raipur", from this book's setting. Write
    a one-sentence how-common question on it. Fence the population by place, person and time, and
    say how the outcome is judged. Label the parts.
  answer: |
    One answer: "What share of children aged 6 to 10 in government primary schools in Raipur city,
    in the 2027–28 school year, have obesity, judged from weight and height measured at school?"

    ```table
    | Part | In the question |
    | population | children aged 6 to 10 in government primary schools in Raipur city, 2027–28 |
    | exposure | none |
    | comparison | none |
    | outcome | obesity, judged from weight and height measured at school |
    ```

    Check the fence. Place: government primary schools in Raipur city. Person: aged 6 to 10. Time:
    the 2027–28 school year. There is no exposure and no comparison, as a how-common question
    should have none.
- level: 5
  prompt: |
    Take the made-up topic "what school children eat at lunch", from this book's setting. Write a
    one-sentence PECO question on it, with a comparison. Label the parts.
  answer: |
    One answer: "Among children aged 8 to 12 in Korba town's private schools in 2027–28, do those
    who bring lunch from home, compared with those who buy it at school, have obesity less often?"

    ```table
    | Part | In the question |
    | population | children aged 8 to 12 in private schools in Korba town, 2027–28 |
    | exposure | bringing lunch from home |
    | comparison | buying lunch at school |
    | outcome | obesity |
    ```

    It is PECO. Where the children get their lunch is part of their lives. The study does not give
    it to them. The comparison comes straight from the exposure: the same children, split by where
    their lunch comes from. A protocol would add how obesity is judged, from measured weight and
    height.
- level: 6
  prompt: |
    A made-up report on the district screening camp ends with this sentence:

    "Adults who lived within 2 km of the camp site came back for a second check more often than
    adults who lived further away."

    Write the one-sentence question this sentence answers. Label its parts. Say which part the
    report leaves unfenced.
  answer: |
    The question: "Among adults screened at the district camp, did those living within 2 km of the
    camp site, compared with those living further away, come back for a second check more often?"

    ```table
    | Part | In the question |
    | population | adults screened at the district camp |
    | exposure | living within 2 km of the camp site |
    | comparison | living more than 2 km away |
    | outcome | coming back for a second check |
    ```

    Work backwards from the sentence. The two groups set against each other give the exposure and
    the comparison. What was counted in each group gives the outcome. Who was counted gives the
    population.

    The population is unfenced in time and in person. The sentence names no year of camp and no
    age range. You cannot tell whom the answer is about until the report says both.
- level: 7
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
    question: Among adults aged 30 to 60 attending the district hospital's NCD clinic in 2026, do those with obesity, compared with those without, miss more follow-up visits?
    population: adults aged 30 to 60 attending the NCD clinic in 2026
    exposure: missing follow-up visits
    comparison: adults without obesity
    outcome: obesity
    ```
  answer: |
    The exposure and outcome lines broke. They are swapped.

    The groups being compared are adults with obesity and adults without it. So having obesity is
    the exposure. What is counted in each group, to answer the question, is missed follow-up visits.
    So that is the outcome.

    ```table
    | Part | Correct label |
    | population | adults aged 30 to 60 attending the NCD clinic in 2026 |
    | exposure | having obesity |
    | comparison | not having obesity |
    | outcome | missing follow-up visits |
    ```

    The worked answer's own comparison line gives it away. The comparison is "adults without
    obesity", so the exposure must be having obesity.

    Why the wrong answer looks reasonable: in a course about obesity, obesity is usually the thing
    being measured. So the word gets put in the outcome slot by habit. The test is not the word. It
    is which thing splits the groups and which thing is measured.
- level: 8
  prompt: |
    Here is a worked answer. Find the steps that broke.

    ```working
    question: Among school children in Chhattisgarh, does a daily games period, compared with none, reduce obesity and raise exam marks?
    population: school children in Chhattisgarh
    intervention: a daily games period
    comparison: no games period
    outcome: obesity and exam marks
    verdict: all four parts are present, so the question is ready
    ```
  answer: |
    Two lines broke, and the verdict rests on both.

    The outcome line holds two outcomes. A games period could lower obesity and leave exam marks
    where they were. Then the question has no single answer. It is two questions in one sentence.

    The population line has a place and nothing else. It names no ages and no year.

    The verdict counted whether each slot had something in it. It did not check that the outcome
    was one thing, or that the population was fenced on all three sides.

    A repaired question: "Among children aged 11 to 13 in government schools in Durg district in
    the 2027–28 school year, does a daily games period, compared with none, change the share with
    obesity by the end of the year, judged from measured weight and height?" Exam marks become a
    separate candidate question of their own.

    Why the wrong answer looks reasonable: every slot is filled, and a filled checklist feels
    finished. The check is not whether each part is there. It is whether each part is one thing,
    fenced.
- level: 9
  prompt: |
    A line from a made-up draft protocol reads:

    "The study will assess the nutritional status of adolescents and its determinants in the
    district."

    Turn it into one question in one sentence. Then say what your question still cannot answer.
  answer: |
    First take the line apart.

    ```table
    | Part | In the line | Problem |
    | population | adolescents in the district | no ages, no year, and no way to find them (schools? homes?) |
    | exposure | its determinants | names none |
    | comparison | none | follows from having no exposure |
    | outcome | nutritional status | several outcomes: being underweight, having obesity, and more |
    ```

    Pick one of each. One answer: "Among adolescents aged 13 to 17 in government schools of
    Bilaspur district in the 2027–28 school year, do those who walk or cycle to school, compared
    with those who come by motor vehicle, have obesity less often, judged from measured weight and
    height?"

    What this question still cannot answer:

    - Anything about the other determinants, or about being underweight. Each is a separate
      question. The protocol line asked all of them at once, and so could have answered none well.
    - Anything about adolescents who are not in government schools, or who live in other districts.
      The fence you chose sets whom the answer is about.
    - Whether walking to school is what makes the difference. The question asks whether two groups
      differ. Why they differ is a separate question, which needs its own kind of study.
- level: 10
  prompt: |
    In a made-up meeting, the district NCD programme officer says:

    "We need to know whether the screening camps are working."

    Turn this into one question in one sentence. Then say what your question still cannot answer.
  answer: |
    "Working" is not an outcome. Nobody can measure it until someone says what it means. List what
    it might mean:

    - adults found to have obesity at a camp go on to attend the NCD clinic;
    - their weight changes over the following year;
    - more adults with obesity are found than would have been found without the camps.

    Each is a different outcome, and so a different question. Pick the first, because the clinic's
    register can count it. One answer:

    "Among adults found to have obesity at the district's screening camps between January and June
    2027, what share attended the NCD clinic within three months of their camp?"

    ```table
    | Part | In the question |
    | population | adults found to have obesity at the district's camps, January to June 2027 |
    | exposure | none |
    | comparison | none |
    | outcome | attending the NCD clinic within three months |
    ```

    What this question still cannot answer:

    - Whether the camps made any difference. Some of these adults would have gone to the clinic
      anyway. There is no comparison group, so the question only counts. It cannot show a change.
    - Whether attending the clinic changed anyone's weight. That is the second meaning of
      "working", and a different question.
    - Whether this is what the officer meant. Go back and ask which decision the answer is for,
      before you start.
retrieval_items:
- q: What are the four parts of a research question written in one sentence?
  a: The population, fenced by place, person and time; the exposure (called the intervention when
    it is given on purpose); the comparison; and the outcome, which is what is measured.
- q: What is the difference between PICO and PECO?
  a: PICO (population, intervention, comparison, outcome) is for something given on purpose as the
    thing tested. PECO (population, exposure, comparison, outcome) is for an exposure people meet in
    their ordinary lives.
- q: What kind of question has a population and an outcome but no exposure?
  a: A how-common question. It asks how common or how large the outcome is in that population, and
    cannot say whether any group differs from another.
- q: What does "outcome" mean in this section, and what did it mean in Book 0's probability section?
  a: Here it is what you measure to answer the question. In Book 0's probability section it was one
    possible result of a chance process.
