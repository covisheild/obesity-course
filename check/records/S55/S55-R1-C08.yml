simplified_explanation: |
  The earlier sections of this book each gave you one check on a question. This section puts them on
  one sheet, so you can compare ten candidates and turn nine of them down on purpose.

  Start with ten candidates. Then score each candidate on five items. Each item gets 0, 1 or 2.

  ```table
  | Item | 0 | 1 | 2 |
  | 1. One sentence | a topic, not a question | a question, but a part is missing, doubled or has no boundary | population with its boundary of place, age and time; exposure and comparison where there are any; one outcome |
  | 2. Answerable | a value question, about what ought to be, or you cannot get the answer | answerable only after a change: narrower, or access still to arrange | about the world, and you can reach the people, measure the exposure and the outcome, pay for it, finish in time and get ethics approval |
  | 3. Not already answered | your look found a good answer for this population | your look found answers elsewhere, or weak ones | your look found no good answer for this population, and you can write two different answers you might get |
  | 4. Who is waiting | nobody; "the literature", "future researchers", "my thesis" or "policy makers"; or a body you cannot name and reach | a named role you can reach, whose decision you have heard of but not yet checked with them | a named role you can reach, who told you the decision they face |
  | 5. What they would do differently | the same action for every answer, or actions you guessed | different actions, heard second-hand, not yet checked with them | different actions for different answers, in their own words |
  ```

  Score item 3 only after you have looked for an existing answer, as the section on questions worth answering taught. A good answer comes from the same population, place and time, by a design that fits the question (`S55-R1-C03`).

  Item 5 is never higher than item 4. If item 4 is 0, item 5 is 0 too, because there is nobody to do anything differently.

  A 1 on item 4 or item 5 means you have not yet checked with the person. Ask them before you write up.

  Add the five scores. The total is out of 10.

  A total can hide a zero.

  So one rule comes before the total. **A zero on item 4 or item 5 rejects the question, whatever its total.**

  Then rank the questions that are left, highest total first. If two totals tie, the one with more
  points on items 4 and 5 together goes first. If that ties too, read the items and decide, and write
  down why. Keep the top one.

  Reject the other nine. For each, write one line that names the item that decided it. For a rank
  rejection, the line names the items where it lost points.

  File the nine, with the date and the line.

  Next: match the question to a design (`S55-R1-C03`), pilot the hardest line (`S55-R1-C04`), note any
  narrowing in the protocol, and ask the waiting party again before you write up (`S55-R1-C07`).

  The question you keep is the seed of the one question you will own. The next book in this subject
  builds on it: a body of work, the data, a unit that houses them, and a three-year plan.

  Nobody has tested whether two people give the same list the same scores. Use the total to put questions in order, not as a measurement.
illustrations:
- body: |
    Back to the setting of this book, which is made up. You are the community medicine postgraduate in
    Chhattisgarh, and your guide wants one question by the end of the month. Suppose this is your list
    of ten candidates. Every question and every note is invented for the example.

    ```table
    | Candidate | Question |
    | A | What share of children aged 11 to 14 at government schools in Raipur city in the 2027 school year have obesity as the school health protocol defines it, from weight and height the study measures? |
    | B | Among adults aged 30 and over at the district non-communicable disease (NCD) screening camp in 2027 whom the camp's body mass index check does not flag, what share have central obesity as the officer's protocol defines it, from a waist the study team measures? |
    | C | Should the district spend more of its NCD budget on schools than on adults? |
    | D | Obesity in urban slum households in Bilaspur. |
    | E | Among adults aged 30 and over whom the district hospital NCD clinic records as having obesity in 2027, do those who get a phone call the day before their follow-up visit come back more often within three months than those who do not? |
    | F | Among first-year students aged 17 to 20 at the medical college in 2027, is eating the evening meal after 10 pm associated with a larger measured waist than eating it before 8 pm? |
    | G | How common is obesity in India? |
    | H | Among women aged 30 to 50 in urban slum households in Bilaspur in 2027, is owning a refrigerator associated with measured body mass index? |
    | I | Among adults aged 30 and over whom the district hospital NCD clinic records as having obesity in 2027, what share had their blood pressure recorded at their last visit, according to the clinic register? |
    | J | Does a school yoga programme reduce obesity among adolescents in Chhattisgarh? |
    ```

    You score each one, with notes. Some notes, all made up. For A, the district NCD programme officer
    told you her school plan stays the same whatever the share. For B, she told you she adds tape
    measures if more than about one in ten are missed, and not if fewer are. For C, she told you she
    faces that budget choice. For E, the clinic's
    nurse in charge told you she phones every patient if calls bring more back, and nobody if they do
    not. For F, the only answer you had to "who is waiting?" was "future researchers". For G, suppose
    your look found a recent national survey report that already gives a figure. For H, the only
    waiting party you found was "the municipal corporation", and what it would do is your guess. For I,
    a colleague told you the clinic's medical officer would add a blood pressure line to the visit form
    if many are missing; you have not asked her. For J, the only answer was "policy makers".

    D is a topic, and C is a value question that no study can answer. Their items that cannot be scored
    count as 0.

    ```table
    | Candidate | Item 1 | Item 2 | Item 3 | Item 4 | Item 5 | Total | Verdict |
    | A | 2 | 2 | 2 | 2 | 0 | 8 | rejected by the rule |
    | B | 2 | 2 | 1 | 2 | 2 | 9 | kept |
    | C | 1 | 0 | 0 | 2 | 0 | 3 | rejected by the rule |
    | D | 0 | 0 | 0 | 0 | 0 | 0 | rejected by the rule |
    | E | 2 | 1 | 1 | 2 | 2 | 8 | rejected on rank |
    | F | 2 | 2 | 1 | 0 | 0 | 5 | rejected by the rule |
    | G | 1 | 0 | 0 | 0 | 0 | 1 | rejected by the rule |
    | H | 2 | 1 | 1 | 0 | 0 | 4 | rejected by the rule |
    | I | 2 | 2 | 2 | 1 | 1 | 8 | rejected on rank |
    | J | 1 | 0 | 1 | 0 | 0 | 2 | rejected by the rule |
    ```

    Check two totals by hand.

    ```working
    A: 2 plus 2 plus 2 plus 2 plus 0 = 8
    B: 2 plus 2 plus 1 plus 2 plus 2 = 9
    ```

    First, the mistake to avoid. Sort by total alone and you get B at 9, then A, E and I at 8. If you
    took the top four to your guide, A would be one of them. A is the school survey the officer
    already told you changes nothing. Its 8 hides a zero on item 5.

    Now apply the rule first. A, C, D, F, G, H and J each have a zero on item 4 or item 5. That is 7 of
    the 10, whatever their totals. As a percentage:

    ```working
    7 divided by 10 = 0.7
    0.7 times 100 = 70
    ```

    So the rule alone rejects 70 per cent of the list.

    Rank the three that are left: B 9, E 8, I 8. Keep B. E and I tie. Break the tie on items 4 and 5
    together.

    ```working
    E: 2 plus 2 = 4
    I: 1 plus 1 = 2
    ```

    E goes second, I third.
  analogy_breaks_when: |
    The scores in this list are one person's judgements on made-up notes. Another scorer could give
    E a 2 on item 3. E would then tie B at 9, and on items 4 and 5 as well, so you would read the items
    and decide. When two totals are one point apart, read the items before you trust the order.
- body: |
    Now write the nine lines. Each one names the item that decided it, in words your guide can check.

    ```table
    | Candidate | One line |
    | A | Item 5: the programme officer's school plan is the same whatever the share. |
    | C | Items 2 and 5: a value question; what the district ought to do is not something a study can settle. |
    | D | Item 1: a topic, not a question, so nothing else on the sheet can be scored. |
    | F | Items 4 and 5: nobody is waiting; "future researchers" was the only answer. |
    | G | Items 2 to 5: too large for one postgraduate, a national figure exists, and nobody is named to act on a new one. |
    | H | Items 4 and 5: "the municipal corporation" is a body I cannot name and reach, and its actions are my guess. |
    | J | Items 4 and 5: "policy makers" is nobody I can name and reach, and what they would do is my guess. |
    | E | Rank: 8 against 9; lost a point on item 2 (a trial's approvals may not fit in time) and on item 3. |
    | I | Rank: 8, tied with E; lost points on items 4 and 5, because the medical officer's plan is second-hand. |
    ```

    Count the lines: 7 rejected by the rule and 2 on rank.

    ```working
    7 plus 2 = 9
    ```

    File all nine with today's date. Two of them are worth a note to yourself. A can come back when the
    officer plans next year's school visits, because her answer may change. I can come back as soon as
    you have asked the medical officer yourself. If she names the decision and two different actions,
    I scores 2 on items 4 and 5. Its total becomes 10, and it goes ahead of B.
  analogy_breaks_when: |
    A one-line reason is a summary, not the whole case. If your guide disagrees with a line, go back to
    the scores and the notes behind it, not to the line.
must_know:
- point: |
    The error is to keep the question with the highest total. Apply the rule first, then
    rank what survives.
  kind: misconception
  bearing: methodological
- point: |
    Write one line for every rejection, naming the item that decided it. "Not good enough" is not a
    reason your guide can check. "Item 5: the officer's plan is the same whatever the answer" is.
  kind: move
  bearing: teaching
- point: |
    Do not score item 3 until you have looked for an existing answer.
  kind: trap
  bearing: methodological
- point: |
    File the rejected questions with the date and the reason.
  kind: consequence
  bearing: methodological
- point: |
    A 9 against a 7 is not "about 29 per cent better". A percentage change between them
    measures nothing, because a point on one item is not the same amount of anything as a point on
    another. Do not quote one.
  kind: trap
  bearing: teaching
- point: |
    The sheet is this course's working tool, and nobody has tested it. When two totals are a point
    apart, read the items and decide from them, not from the totals.
  kind: boundary
  bearing: methodological
exercises:
- type: build
  prompt: |
    Write your own list of ten candidate research questions on obesity. Use the setting you are
    actually in, not the one in this book.

    For each question, produce four things.

    - The question as one sentence, with the population and its boundary, the exposure if there is
      one, and the outcome.
    - Its five scores on the sheet, and the total.
    - For items 4 and 5, the role you spoke to and the date. Add their words for what they would do
      with each answer.
    - Your verdict: kept, rejected by the rule, or rejected on rank.

    Then write one line for each of the nine you rejected, naming the item that decided it.
  answer: |
    There is no single right list. Check yours against this list.

    1. Ten questions, each one sentence. No topic phrases. Each names a population with a boundary of
       place, age and time, and an outcome. An exposure is named, or the question is plainly about how
       common something is.
    2. Five scores for each question, and totals that add up. Check each total by adding the five
       scores again.
    3. For every question with a 2 on item 5, a named role, a date, and that person's words for two
       different actions. An item 5 that rests on your own guess scores 0.
    4. Item 3 scored only after a look for an existing answer, with a note of what you found.
    5. Every question with a 0 on item 4 or item 5 marked "rejected by the rule", whatever its total.
    6. The kept question is the survivor with the highest total. A tie is broken by items 4 and 5
       together. If it has a 1 on item 4 or item 5, you ask the person before you write up.
    7. Nine lines, each naming an item. None says only "weak" or "not good enough".

    If fewer than two questions survive the rule, do not lower the bar. Go back to the people around
    you and ask what decisions they face. Write new candidates from their answers, and score again.
  skill_ref: S55-R1-K02
- type: critique
  prompt: |
    A colleague shows you the rejection lines from their own list. The lines are made up for this
    exercise.

    1. "Too broad."
    2. "Not interesting."
    3. "Scored 5, lower than my top question's 8."
    4. "Nobody would use it."

    Say what is wrong with each line, and what it would need to say to pass.
  answer: |
    1. "Too broad" names no item. It probably means item 1 (no boundary on the population) or item 2
       (cannot be done as it stands). The line should say which, and what is missing: "Item 1: no age
       or time boundary on the population."
    2. "Not interesting" is a feeling, not an item. If it means nobody is waiting, say so, with the
       evidence: "Item 4: nobody named; the only answer was 'the literature'."
    3. The totals are right to mention, but a rank line should name the items where the points were
       lost. Otherwise nobody can check it. For example: "Rank: 5 against 8; lost 2 on item 2, 2 on
       item 3 and 1 on item 1."
    4. "Nobody would use it" sounds like item 4 or 5, but it does not say which. Say whether no one was
       named (item 4), or the named person would do the same whatever the answer (item 5), and who.
  skill_ref: S55-R1-K01
quantitative: true
practice:
- level: 1
  prompt: |
    Score item 1, the one-sentence form, for each of these.

    a. Childhood obesity in Durg.
    b. What share of adults have obesity?
    c. Among adults aged 30 to 60 at the Korba district hospital NCD clinic in 2027, what share have
       obesity as the clinic protocol defines it?
    d. Among college students aged 18 to 22 in Raipur in 2027, is skipping breakfast associated with
       measured body mass index and with poor sleep?
  answer: |
    ```table
    | Question | Item 1 | Because |
    | a | 0 | a topic, not a question |
    | b | 1 | a question, but the population has no boundary of place, age or time |
    | c | 2 | population with its boundary and an outcome; it asks how common, so it needs no exposure |
    | d | 1 | it has two outcomes, body mass index and poor sleep; split it into two questions |
    ```
- level: 2
  prompt: |
    Score items 4 and 5 for each of these made-up notes.

    a. Who is waiting: future researchers.

    b. Who is waiting: the NCD clinic's medical officer. She said: "If most patients' weights are
       missing from the register, I add weighing at registration. If few are missing, I change
       nothing."

    c. Who is waiting: the state health department. You think they might start a campaign if the share
       is high.

    d. Who is waiting: the college hostel warden. She said: "Dinner stays at 9 pm whatever you find."

    e. Who is waiting: the district NCD programme officer. A colleague tells you she will add a school
       weighing day if the share is high, and not if it is low. You have not asked her.
  answer: |
    ```table
    | Note | Item 4 | Item 5 | Because |
    | a | 0 | 0 | nobody named; with nobody named there is nobody to act differently |
    | b | 2 | 2 | a named role you can reach, and two different actions in her own words |
    | c | 0 | 0 | a body, not a role you can name and reach; the campaign is your guess |
    | d | 2 | 0 | a named role, but the same action for every answer |
    | e | 1 | 1 | a named role you can reach, but her decision and actions are second-hand; ask her |
    ```
- level: 3
  prompt: |
    Score this made-up candidate on all five items, total it, and give your verdict.

    "Among children aged 6 to 10 at two private schools in Bhilai in 2027, is more than two hours a day
    of screen time associated with measured body mass index?"

    Notes: the schools will let you in, you can ask about screen time and measure weight and height,
    it fits your time and budget, and ethics approval looks likely. Your look found studies from other Indian cities, none from
    Chhattisgarh. The principal of one school is the waiting party. She said: "I send the same letter
    about screens to parents every year, whatever anyone finds."
  answer: |
    ```table
    | Item | Score | Because |
    | 1. One sentence | 2 | population with its boundary, exposure and outcome |
    | 2. Answerable | 2 | you can reach the children, measure screen time and body mass index, pay for it, finish in time, and get approval |
    | 3. Not already answered | 1 | answered elsewhere, not for this population |
    | 4. Who is waiting | 2 | a named role you can reach, who told you her decision |
    | 5. What they would do differently | 0 | the same letter for every answer |
    ```

    ```working
    2 plus 2 plus 1 plus 2 plus 0 = 7
    ```

    Verdict: rejected by the rule. Item 5 is 0, so the total of 7 does not matter.

    One line: "Item 5: the principal sends the same letter whatever the answer."
- level: 4
  prompt: |
    Here are the scores for a made-up short list of five candidates, P to T, in the setting of this
    book.

    ```table
    | Candidate | Item 1 | Item 2 | Item 3 | Item 4 | Item 5 |
    | P | 2 | 2 | 1 | 2 | 2 |
    | Q | 2 | 2 | 2 | 2 | 0 |
    | R | 2 | 1 | 2 | 2 | 1 |
    | S | 1 | 2 | 1 | 1 | 1 |
    | T | 2 | 2 | 2 | 1 | 1 |
    ```

    Total each one. Apply the rule, rank the survivors, and say which you keep. Write one line for each
    rejection. What percentage of the list did the rule reject by itself?
  answer: |
    Total each candidate.

    ```working
    P: 2 plus 2 plus 1 plus 2 plus 2 = 9
    Q: 2 plus 2 plus 2 plus 2 plus 0 = 8
    R: 2 plus 1 plus 2 plus 2 plus 1 = 8
    S: 1 plus 2 plus 1 plus 1 plus 1 = 6
    T: 2 plus 2 plus 2 plus 1 plus 1 = 8
    ```

    Apply the rule. Q has a 0 on item 5, so Q is rejected, even though its 8 ties for second.

    Rank the survivors: P 9, then R and T at 8, then S 6. Break the tie between R and T on items 4 and
    5 together.

    ```working
    R: 2 plus 1 = 3
    T: 1 plus 1 = 2
    ```

    The order is P, R, T, S. Keep P.

    ```table
    | Candidate | One line |
    | Q | Item 5: the same action for every answer. |
    | R | Rank: 8 against 9; lost points on items 2 and 5. |
    | T | Rank: 8 against 9, and behind R on items 4 and 5; lost points on items 4 and 5. |
    | S | Rank: 6; lost points on items 1, 3, 4 and 5. |
    ```

    The rule rejected 1 of the 5 by itself.

    ```working
    1 divided by 5 = 0.2
    0.2 times 100 = 20
    ```

    That is 20 per cent of the list.
- level: 5
  prompt: |
    Part of a colleague's made-up scoring sheet has been smudged. For each candidate, one item cannot
    be read. Find the missing score, and say whether the candidate survives the rule.

    ```table
    | Candidate | Item 1 | Item 2 | Item 3 | Item 4 | Item 5 | Total |
    | U | 2 | 2 | 1 | 2 | smudged | 7 |
    | V | 1 | 2 | 1 | smudged | 1 | 6 |
    | W | smudged | 1 | 2 | 2 | 1 | 7 |
    ```
  answer: |
    The missing score is the total minus the four scores you can read.

    ```working
    U: 2 plus 2 plus 1 plus 2 = 7, and 7 minus 7 = 0
    V: 1 plus 2 plus 1 plus 1 = 5, and 6 minus 5 = 1
    W: 1 plus 2 plus 2 plus 1 = 6, and 7 minus 6 = 1
    ```

    ```table
    | Candidate | Missing item | Score | Survives the rule? |
    | U | Item 5 | 0 | no: a zero on item 5 rejects it, whatever its total of 7 |
    | V | Item 4 | 1 | yes: no zero on item 4 or item 5 |
    | W | Item 1 | 1 | yes: the rule looks only at items 4 and 5 |
    ```

    U and W have the same total, 7. Only W survives.
- level: 7
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
    K: 2 plus 2 plus 2 plus 2 plus 0 = 8
    L: 1 plus 2 plus 1 plus 2 plus 1 = 7
    M: 2 plus 1 plus 1 plus 1 plus 1 = 6
    rank by total: K first, L second, M third
    keep K
    ```
  answer: |
    The last two lines broke. The totals are right, but the rule was never applied. K has a 0 on item
    5, so K is rejected whatever its total.

    ```working
    K: 2 plus 2 plus 2 plus 2 plus 0 = 8, with a 0 on item 5, so rejected
    L: 1 plus 2 plus 1 plus 2 plus 1 = 7
    M: 2 plus 1 plus 1 plus 1 plus 1 = 6
    rank the survivors: L first, M second
    keep L
    ```

    L's 1 on item 5 means you ask the waiting party before you write up.

    Why the wrong answer looks reasonable: K beats L on three items and has the highest total. The
    total is the most visible number on the sheet. The zero sits in one small column.
- level: 8
  prompt: |
    Here is a worked answer for a made-up candidate. The next-best candidate on the same list scored
    8. Find the step that broke.

    ```working
    candidate: Among adults aged 18 to 60 in urban slum households in Bilaspur in 2027, what share have obesity as the survey protocol defines it?
    item 1: population with boundary, outcome, a how-common question = 2
    item 2: reachable, measurable, fits in time = 2
    item 3: studies from other cities, none from Bilaspur = 1
    item 4: who is waiting: policy makers in India = 2
    item 5: they would start a campaign if the share is high = 2
    total: 2 plus 2 plus 1 plus 2 plus 2 = 9
    rank: first, ahead of the 8
    ```
  answer: |
    Items 4 and 5 broke.

    Item 4: "policy makers in India" is not a role you can name and reach. That scores 0, not 2.

    Item 5: the campaign is the scorer's own guess. Nobody said it. That scores 0, not 2.

    ```working
    total: 2 plus 2 plus 1 plus 0 plus 0 = 5
    ```

    A zero on item 4 or item 5 rejects it, so it does not rank at all, behind the 8 or ahead of it.
    Items 1 to 3 were scored right.

    Why the wrong answer looks reasonable: "policy makers" sounds like someone with power to act, and a
    campaign sounds like what they would do. But neither was checked with a person. The sheet gives 2
    only for a named role and for that person's own words, and 0 for a body you cannot reach or an
    action you guessed.
- level: 9
  prompt: |
    In a made-up department meeting, a senior colleague says: "Let's just do a survey of obesity among
    our nursing students. It's quick, the data are easy to get, and the head of department wants a paper
    this year."

    Your current top question scores 9. Score the proposal, rank it against your top question, and
    give a one-line reason if you reject it. Then say what your score does not establish.
  answer: |
    First make the proposal a question. As said, it is a topic, which would score 0 on item 1. Written
    as one sentence it becomes: "Among nursing students aged 17 to 25 at the medical college in 2027,
    what share have obesity as the protocol defines it, from measured body mass index?"

    Score that sentence. Suppose your look finds surveys from other nursing colleges but not this one.

    ```table
    | Item | Score | Because |
    | 1. One sentence | 2 | population with its boundary and an outcome; a how-common question |
    | 2. Answerable | 2 | quick, and the students can be reached and measured |
    | 3. Not already answered | 1 | answered elsewhere, not here |
    | 4. Who is waiting | 0 | the head of department is waiting for a paper, not for this answer |
    | 5. What they would do differently | 0 | nobody is named who would act on it |
    ```

    ```working
    2 plus 2 plus 1 plus 0 plus 0 = 5
    ```

    Rejected by the rule, whatever the total. It would rank below your 9 in any case.

    One line: "Items 4 and 5: the department is waiting for a paper, not for this answer."

    What the score does not establish:

    - That nobody could be waiting. The nursing college's principal may face a decision this answer
      would change. Ask before you file it.
    - That the survey would be poor work. It could be done well. The sheet says only that, today, no
      one would act on it.
    - That your 9 is better on every item. Compare items, not only totals.
- level: 10
  prompt: |
    Your guide looks at your sheet and says: "Your top question scored 9 and the second scored 7. So
    the first is about 29 per cent better. Drop the second without a second thought."

    Check the arithmetic. Then say what the claim does not establish.
  answer: |
    The arithmetic is a percentage change from 7 to 9.

    ```working
    9 minus 7 = 2
    2 divided by 7 is about 0.2857
    0.2857 times 100 = 28.57
    ```

    So "about 29 per cent" is the right arithmetic.

    What it does not establish:

    - That the first question is 29 per cent better at anything. The scores are judgements put in
      order, 0, 1 or 2 on each item. A point on item 3 and a point on item 5 are not the same amount
      of anything. A percentage change between two totals measures nothing.
    - That the gap is real. Another scorer could move one or two items by a point. Two points out of
      ten is within that.
    - Which items made the gap. If the second lost its points on items 4 and 5 because you have not
      yet asked the waiting party, asking may close the gap.

    So do not drop the second without a thought. Write its one line naming the items where it lost
    points, and file it.
practice_note: |
  Nine problems. The technique has five moves that compose: score an item, total, apply the rule,
  break a tie, and write the line. Each move gets a mechanical or applied problem, the reverse
  direction gets one (level 5), and each of the two ways a sheet goes wrong gets a diagnostic.
retrieval_items:
- q: What are the five items of the scoring sheet?
  a: One-sentence form; answerable; not already answered; who is waiting (named); what they would do
    differently. Each scores 0, 1 or 2.
- q: What rule overrides the total?
  a: A zero on item 4 or item 5, either half of the who-is-waiting test, rejects the question whatever
    its total.
- q: What must every rejection line contain?
  a: The item that decided it, in words someone else can check.
