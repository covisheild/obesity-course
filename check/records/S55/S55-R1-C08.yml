    kind: textbook
    locator: '"Generating Good Research Questions", "Evaluating Research Questions", first paragraph'
    quote: |-
      Researchers usually generate many more research questions than they ever attempt to answer. This means they must have some way of evaluating the research questions they generate so that they can choose which ones to pursue.
    verified:
      resolved_id: https://kpu.pressbooks.pub/psychmethods4e/chapter/generating-good-research-questions/
      opened: true
      claim_located: true
      checked_on: '2026-09-25'
