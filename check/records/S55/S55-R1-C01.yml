simplified_explanation: |
  A topic is an area, like "obesity in school children". A question asks one thing you will find
  out, like "What share of children aged 10 to 14 in one district's government schools have
  obesity?" You cannot plan a study from a topic. You can plan one from a question, because the
  question tells you whom to find and what to measure.

  Questions reach people in several ways. A guide names a topic. The department already holds some
  records, so the question is whatever those records can answer. A paper ends with a line such as
  "future studies should look at meal timing", and that becomes the question. Or a question gets
  picked because it looks quick to finish.

  None of these routes is wrong in itself. Research methods textbooks recommend two of them. Start
  from what is already around you. Read the end of a recent paper. The trouble starts when the first question to arrive is the one you keep, without
  setting it beside any other.

  Choosing means this. You write down several candidates, put them side by side, and turn most of
  them down. Researchers think of many more questions than they ever try to answer. So they need a
  way to pick.

  The question is the first decision in a study, and the one that matters most. A careful sample,
  a good measurement and a correct analysis all answer the question you asked. None of them can
  make it the right question to have asked.
illustration:
  body: |
    Here is the setting this book uses from start to finish. It is made up. You are a postgraduate
    student in community medicine at a medical college in Chhattisgarh. You must propose a first
    research question on obesity. Around you are your guide and your department. There is also a
    district programme officer for non-communicable diseases (NCDs) — long-term illnesses that do
    not pass from one person to another.

    Start with what happens when nobody chooses. Suppose your guide says, in your first week, "Do
    something on obesity in school children." You write that at the top of a page as your
    question. Then you try to plan the study from it.

    Ask the page three things. Which children: what ages, which schools, where? What will you
    measure: weight, meals, games periods, screen time, or all of them? Whom will you compare with
    whom? The page cannot answer any of them. "Obesity in school children" is a topic. Blackstone's
    textbook says the same of its own examples: to give a topic as your research question "would
    not be correct".

    Now suppose, in the same made-up week, three more candidates reach you. Here are all four, each
    written as a question, with the route by which it arrived.

    ```table
    | How it reached you | The candidate, written as a question |
    | Your guide named a topic | What share of children aged 10 to 14 in government schools in Raipur district have obesity? |
    | The department already holds weight and height records from last year's district screening camp | Among adults screened at that camp, did those from the town have obesity more often than those from villages? |
    | The last paper you read ended with a line on future research into meal timing | Among students at your college, do those who usually eat dinner late gain more weight over one year than those who eat early? |
    | A senior told you to pick something you could finish quickly | What share of patients at the district hospital's NCD clinic know their own weight? |
    ```

    Look at the left column. You chose none of the four. Each one arrived.

    That is not a fault in any of them. Blackstone's textbook recommends "starting where you are":
    from an interest you already have, or from patterns in your everyday life. Jhangiani and
    colleagues recommend the discussion section of a recent paper, where authors suggest future
    research. The fault would be to keep the first question that arrives, because it arrived first.

    Choosing starts here. Put the four side by side. You do not yet have the tests that decide
    between them; the rest of this book builds them. You do have the one move that makes this a
    choice rather than an accident. Decide now that most of these will be turned down, and that
    you will write down the reason for each one.
  analogy_breaks_when: |
    The four routes are not a complete list. A real question often arrives by two at once: a guide
    may name a topic because the department holds data on it. The table sorts candidates by
    how they arrived. It says nothing about which one is best. A question handed over by a guide
    can win the comparison, and the guide may have reasons you have not heard yet. Ask for them.
  numbers: []
must_know:
- point: |
    The error is to write a topic where the question should be. "Obesity in school children"
    cannot tell you whom to find or what to measure. Refuse to plan a single step until you have a
    sentence that asks one thing.
  kind: misconception
  bearing: methodological
  refs:
  - blackstone_2012
- point: |
    Before you accept any question, write down how it reached you. Then write at least two other
    candidates on the same topic and set all of them side by side. A question with no rivals has
    not been chosen.
  kind: move
  bearing: methodological
  refs:
  - jhangiani_2019_methods
- point: |
    The future-research line at the end of a paper is a good place to find a candidate. It was
    written for the authors' own field and data, not for your district. Take it as one candidate
    among several, never as the choice already made.
  kind: trap
  bearing: methodological
  refs:
  - jhangiani_2019_methods
- point: |
    A careful sample and a correct analysis answer the question that was asked. If that question
    was the wrong one, the study is well done and still no use to anyone. Spend your hardest
    thinking on the question, before the methods, because nothing later can repair it.
  kind: consequence
  bearing: methodological
  refs:
  - blackstone_2012
- point: |
    When a trainee says "my guide gave me the topic", do not argue about the guide. Ask them to
    write three questions inside that topic and say which two they would drop, and why. That turns
    a topic they were given into a choice they made.
  kind: move
  bearing: teaching
- point: |
    Knowing how a question arrived tells you only whether it was compared with others. It does not
    tell you whether the question is good. An assigned or borrowed question can win a fair
    comparison. Judge it by the tests, not by where it came from.
  kind: boundary
  bearing: methodological
exercises:
- type: critique
  prompt: |
    In a made-up department meeting, a senior colleague says: "Take the screening camp question.
    The data are already in the department, so it is a good question."

    Lay the argument out as a premise and a conclusion. Then say where it fails, and what part of
    it survives.
  answer: |
    Premise: the data for the screening camp question are already in the department. Conclusion:
    it is a good question.

    Test the inference first, as Book 0's section on argument taught. Grant the premise: the
    records exist. What follows from that? That the question can be answered quickly and cheaply.
    It does not follow that anyone needs the answer, or that the answer is not already known. "Good"
    has quietly come to mean "quick".

    Then look at what the argument skips. The records were collected for a camp, not for this
    question. So the data decided the question, rather than the question deciding what data to
    collect. That is one of the routes by which a question arrives without being chosen.

    What survives: data already in hand are a real advantage when you come to ask whether a
    question can be answered at all. That makes the camp question a strong candidate for the list.
    It does not make it the choice before it has been compared with others.
- type: design
  prompt: |
    Take the made-up topic "meal timing in college students", from the setting of this section.
    Write three different questions inside it, each asking one thing. For each, say which route
    might have brought it to you if you had not written it yourself.
  answer: |
    One possible set. Yours will differ; check that each of yours asks one thing.

    1. Among students at your college, do those who usually eat dinner late gain more weight over
       one year than those who eat early? This could arrive from a paper's line on future research.
    2. What share of students living in your college hostel usually eat their last meal after 10 at
       night? This could arrive from what is at hand: you live among them.
    3. Among hostel students, do those who skip breakfast on class days eat more at night than
       those who do not? This could be named by a guide who has noticed empty breakfast tables.

    Each is a single question. None has been chosen yet. Writing three is what makes choosing
    possible.
- type: teaching
  prompt: |
    A first-year resident has ten minutes and a whiteboard. They ask: "Why does it matter how I got
    my question, if I do the study properly?" Answer them.
  answer: |
    Draw two columns on the board. Head the left one "the question" and the right one "the
    methods". Under the methods write sample, measurement, analysis.

    Then say what each method does. A good sample means the answer is true of the group the
    question names. A good measurement means you measured what the question asks about. A good
    analysis means you read the numbers correctly. Every one of them serves the question in the left
    column. None of them can reach back and change it.

    So a study can be done properly and still answer a question nobody needed. How you got the
    question matters for one reason. A question that arrived and was kept has never been set
    against a better one.

    End with the move. Write the question you have, then write two others on the same topic. If
    yours still looks best beside them, you have chosen it. If not, you have found out in ten
    minutes rather than two years.
quantitative: false
retrieval_items:
- q: What is the difference between a research topic and a research question?
  a: A topic names an area, such as obesity in school children. A question asks one thing a study
    will find out, and so says whom to find and what to measure.
- q: Name four routes by which a research question can reach you without being chosen.
  a: Named by a guide; set by the data or patients already at hand; taken from the future-research
    lines at the end of a paper; picked because it can be finished quickly.
- q: What turns a question that arrived into a question that was chosen?
  a: Setting it beside other candidates and turning most of them down, with a reason for each.
figure_note: "The routes are four named ways a question arrives, with no measured share for any of them; a chart would have to invent the counts."
