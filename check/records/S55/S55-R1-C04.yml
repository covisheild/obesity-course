  - aslam_emmanuel_2010
exercises:
- type: critique
  prompt: |
    Here are four made-up candidate questions from the running setting. For each, say whether it is
    empirical or a value question. Rewrite each value question as one empirical question.

    1. Ought the NCD clinic to weigh every patient at every visit?
    2. What share of households in one urban slum of Raipur city cook with more than one litre of oil a
       week per person?
    3. Is it right for colleges to set dinner times in hostel messes?
    4. Do adults screened at the district screening camp who are told they have obesity return for a
       follow-up visit more often than adults who are not told?
  answer: |
    1. Value. "Ought" asks what should be done, and the answer depends on what people value: time,
       the patient's comfort, the use of the number. An empirical rewrite: "Among adults attending
       the NCD clinic in 2027, what share say they would prefer not to be weighed at every visit?"
    2. Empirical. It asks for a share of households in a stated place. Oil used can be measured.
    3. Value. "Is it right" asks for a moral judgement. An empirical rewrite: "Among first-year
       students living in the hostels of one college, what share eat the mess dinner on most days?"
       Another would ask what students think of a fixed time.
    4. Empirical. It is a relate question: an exposure (being told) and an outcome (returning). It
       can be answered if the camp's records show who was told and who came back, which you would
       check first.

    Note what the rewrites do not do. None of them settles the value question. They give the person
    deciding something to decide with.
- type: design
  prompt: |
    Your guide proposes this made-up question: "What is the relationship between diet, physical
    activity, sleep, screen time and obesity among college students in Chhattisgarh?"

    Say what makes it too broad. Then narrow it to one question, in one sentence, that you could
    answer at your own college. Name one line of the feasibility list you would still have to check.
  answer: |
    Too broad in three ways.

    - Four exposures: diet, physical activity, sleep and screen time. Each needs its own measurement,
      and each could need its own study.
    - A population nobody can reach in one study: every college student in the state.
    - "Relationship" names no direction and no time. It does not say whether you are counting,
      comparing or testing a change.

    One narrowed version, as a relate question: "Among first-year students at our medical college
    in 2027, is sleeping less than six hours on most nights associated with having obesity?"

    It has one population you can reach, one exposure and one outcome. It is now a relate question,
    and a one-visit survey could not say which came first. The conclusion must stay within that.

    A line still to check: a way to measure the exposure. Asking students how long they sleep gives
    their report of it, not a measurement. You would need to choose and try out the questions before
    the study.
  skill_ref: S55-R1-K01
- type: teaching
  prompt: |
    The state health secretary writes to you: "Can your study tell us whether to stop snack sales
    outside government schools?" Reply in one page, answer first, no methods section.
  answer: |
    Answer first: no study can tell you whether to stop the sales. That is a decision about what
    ought to be done. It weighs children's health, vendors' earnings and families' choice against
    each other, and no measurement does that weighing.

    What a study can do is give you facts to decide with. Three are within reach:

    - what share of children in classes 6 to 8 buy packaged snacks outside school on most days;
    - whether those children have obesity more often than children who do not buy them;
    - what parents think about stopping the sales.

    Be clear about the second. A one-time survey can show that snack buying and obesity go
    together. It cannot show that stopping the sales would change children's weight.

    If you want a study, tell me which of the three facts you would use first. That is the one to
    design.
retrieval_items:
- q: What are the two tests of an answerable research question?
  a: It is empirical (observing the world can answer it, unlike a value question), and it is feasible
    (you can reach the people, measure the exposure and the outcome, and have the time, money,
    equipment, the skill to use it, and ethics committee approval).
- q: What happens to a question's kind when you narrow "what causes obesity" to "is this one thing associated
    with obesity"?
  a: It changes from a cause question to a relate question, and the conclusion must claim only an
    association.
- q: What does the E in FINER mean, and how does it differ from Blackstone's "ethical question"?
  a: A study an ethics committee would approve. Blackstone's ethical question is a question about what
    ought to be, which this book calls a value question.
figure_note: "No figure: the section has no measured numbers, and a chart would invent them. The diagram a reader would want is a flow: test 1 (can the world answer it?), test 2 (can you get the answer?), then the narrowing steps 0 to 3, marking where the kind changes from cause to relate."
