simplified_explanation: |
  Before you keep a question, put it through two tests.

  **Test 1: can the world answer it?** An empirical question is one that observing the world can
  answer. How many children buy snacks at the school gate is empirical. Whether snacks should be
  banned at the school gate is not. That second one is a value question — a question about what ought
  to be done, which people answer from their values. Blackstone's textbook calls it an ethical
  question.

  It usually has empirical questions inside it. The decision itself still belongs to whoever has to
  make it.

  **Test 2: can you get the answer?** A feasible question is one that you, with what you have, can
  actually answer. Go down this list and, for each line, write what you actually have.

  - People you can reach, in enough number. How many is enough is a question of sample size.
    `B0-R0-C29` showed why more people give a narrower answer.
  - A way to measure the exposure, if the question has one.
  - A way to measure the outcome.
  - Time.
  - Money.
  - Equipment, and the skill to use it.
  - Approval from an ethics committee. That is a group of people at a hospital, college or research
    body. It reads a researcher's plan before any research starts, and can say yes, no, or change
    this first.

  A line with nothing written beside it is a fail.

  **Then check the size.** A question can pass both tests and still be too broad. "What causes
  obesity in children in Chhattisgarh?" is empirical. Nobody could answer it in one study. So you
  narrow it. You give the population a boundary you can reach, pick one exposure, and name one
  outcome.

  Watch what narrowing does to the kind of question. Cutting "what causes" down to "is this one
  thing associated with" turns a cause question into a relate question. That can be the right move.
  But the study now answers the relate question, and your report must not claim more than that.
illustrations:
- body: |
    Suppose, in a made-up department meeting, the district non-communicable disease (NCD) programme officer says: "Someone
    should find out whether we ought to ban packaged snacks outside government schools." You write
    down your first candidate.

    Should packaged snacks be sold outside government schools in Raipur district?

    Put it through test 1. Ask what measurement could answer it. Weigh every child, count every
    packet, and you still have not answered "should". The answer depends on what people value:
    children's health, the vendors' earnings, the families' choice. It is a value question.

    Do not throw it away. Ask what the officer would need to know before deciding. Here are three
    made-up empirical questions that sit inside it, with the kind of each.

    ```table
    | Empirical question | Kind |
    | What share of children in classes 6 to 8 in government schools in Raipur district buy packaged snacks outside school on most school days? | describe |
    | Among those children, is buying packaged snacks on most school days associated with having obesity? | relate |
    | What share of their parents would support stopping snack sales outside the school? | describe |
    ```

    Each of these can be answered by observing. None of them decides the ban. The decision stays
    with the officer, and with the people whose values it touches.
  analogy_breaks_when: |
    Some questions look empirical and hide a value inside. "Is the ban working?" sounds like a
    question about the world. But "working" has to be given an outcome first: fewer packets sold,
    lower weight gain, or no fall in vendors' earnings. Choosing that outcome is itself a value
    choice. Write the outcome into the question, and the hidden value becomes visible.

    The three rewrites are illustrations, not a plan. Whether any of them is worth asking is a
    separate matter from whether it can be answered.
- body: |
    Now a question that passes test 1 and is far too big. Suppose your guide's first suggestion, made
    up for this section, is this.

    What causes obesity in school children in Chhattisgarh?

    It is empirical. Nobody could answer it in one study. Narrow it one step at a time, and note what
    each step changed.

    ```table
    | Step | The question | What changed |
    | 0 | What causes obesity in school children in Chhattisgarh? | nothing yet |
    | 1 | What causes obesity in children in classes 6 to 8 in government schools in Raipur district? | the population has a boundary of place and age |
    | 2 | Is buying packaged snacks outside school associated with obesity in children in classes 6 to 8 in government schools in Raipur district? | one exposure; the kind changed from cause to relate |
    | 3 | In 2027, among children in classes 6 to 8 in the four government schools of one Raipur ward, is buying packaged snacks outside school on most school days associated with obesity? | a population you can reach, a time, and an exposure stated precisely enough to measure |
    ```

    Step 2 is the one to watch. The question stopped asking what causes obesity. It now asks
    whether one thing goes with it. Your report will have to say so.

    Now run test 2 on step 3. For each line, write what you have. What follows is made up.

    ```table
    | Line | What you have |
    | People you can reach | the four schools of the ward your department already visits for field training; the head teachers have not yet been asked |
    | A way to measure the outcome | weight and height, and a stated rule for deciding which children have obesity |
    | A way to measure the exposure | nothing yet: no tested set of questions about snack buying for children of this age |
    | Time | the months your guide has set aside for fieldwork |
    | Money | travel within one ward, which the department can cover |
    | Equipment, and the skill to use it | a weighing scale and a height rod in the department; you have not yet weighed and measured children, so you need one training session with the department's staff |
    | Ethics committee approval | not yet applied for; Blackstone's textbook notes that minors need a guardian's consent to take part, so the plan must say how parents will be asked |
    ```

    Two lines are not yet passes. The exposure has no way to be measured, and the head teachers have
    not agreed. Neither kills the question. Each is a task you can now name: write and try out a few
    questions on snack buying, and ask the head teachers.
  analogy_breaks_when: |
    The schools, the ward and the department's equipment are made up. The steps show how to narrow,
    not which narrowing is right for your college.

    Narrowing buys an answer at the price of reach. An answer from four schools in one ward speaks
    for those four schools. Book 0's section on sampling showed why: it cannot stand for the district
    unless the schools were picked to stand for it.

    A list written at a desk can still fail in the field. Ratan and colleagues warn that a question
    can look feasible and prove otherwise once fieldwork starts. Aslam and Emmanuel suggest a pilot:
    a small try-out of the hardest line before the main study. It is how you find out first.
must_know:
- point: |
    The error is to keep a "should" question because it feels important. Find the empirical questions
    inside it, and leave the decision with the person who has to make it.
  kind: misconception
  bearing: methodological
  refs:
  - blackstone_2012
- point: |
    Run the feasibility list in writing. A line you can only fill with "should be possible" is a
    fail until you have asked.
  kind: move
  bearing: methodological
- point: |
    When you shrink what you can reach, shrink the population in the question too.
  kind: trap
  bearing: methodological
- point: |
    When narrowing turns a cause question into a relate question, say so in the protocol.
  kind: consequence
  bearing: methodological
- point: |
    Before the main study, run a pilot: a small try-out of the hardest line, usually the measurement.
  kind: move
  bearing: methodological
