simplified_explanation: |
  The last section showed that being cited is not the same as being used. So judge a question by who
  is waiting for its answer, not by whether it will be cited. This section turns that into a test
  you can run on paper.

  Take one candidate question, written as one sentence the way the section on population, exposure
  and outcome taught. Then ask two things.

  **Part 1: who needs this answer?** Name a person or a body with a decision in front of them.

  Here are some kinds. A district programme officer deciding what goes on a screening camp's checklist. A clinic deciding
  whether to phone patients who miss a visit. A guideline group. Patients and their families. A
  funder. Name a role you could go and talk to.

  Three answers fail Part 1 every time: "the literature", "future researchers" and "my thesis".
  Anyone can say them about any question, so they tell you nothing about this one. Your degree does
  need a thesis. But it waits for a thesis, not for this answer.

  **Part 2: what will they do with each answer?** Write down what the person will do if the answer
  comes out one way. Then write what they will do if it comes out the other way. If the two actions
  differ, someone is waiting. If they do the same thing either way, nobody is waiting, however
  important the topic sounds.

  Do not guess Part 2. Go and ask the person. Put it to them as two questions. "If the study found
  this, what would you do? And if it found that?" Write down their words.

  Chalmers and colleagues report that the users of research are only rarely involved in setting
  what gets studied. Clinicians and patients, they add, are often frustrated by the mismatch.

  The test is an argument, in the sense of Book 0's section on premise, inference and conclusion.
  The premises are "this person faces this decision" and "they told me they do one thing for one
  answer and another thing for the other". The conclusion is "they are waiting for this answer".
  Check the premises: did they say it, or did you guess it? Check the inference: are the two
  actions really different?

  Published guides say something close to this. Ratan and colleagues ask that a question bear on
  health decisions made by some group with a stake in them. Ioannidis calls clinical research useful
  when it can lead to a better decision. The two-part test is this course's sharper version.

  A funder is one kind of party that can be waiting. There are two kinds of money. Research money
  pays to find out an answer. Implementation money pays to carry a programme out.

  You will meet three names for implementation money: company CSR (corporate social responsibility)
  funds, programme grants and government tenders. The next book in this subject teaches them. This
  book says nothing about the rules for any of them.
illustration:
  body: |
    Here is the setting this book uses throughout. It is made up. You are a postgraduate in community
    medicine at a medical college in Chhattisgarh. Your guide wants a first research question on
    obesity by the end of the month. The people around you are your guide, your department, and the
    district officer who runs the non-communicable disease (NCD) programme.

    Suppose your first candidate is this one.

    "What share of children in classes 6 to 8 at government schools in Raipur city have overweight or
    obesity, measured by weight and height, in the 2027 school year?"

    Run Part 1. The answer most people write first is "It will add to the literature, and future
    researchers can use it." Strike it out. It names nobody.

    Try again, and name someone: the district NCD programme officer. Now run Part 2. You go to her
    office and ask the two questions. "If the study finds a high share, what will you do? If it finds
    a low share?"

    Suppose she answers like this. "The school visits for this year are already planned and paid for.
    Whatever your number is, the plan stays the same."

    Her two actions are the same. So she is not waiting for this answer. That does not make the
    question wrong. It means you have not yet found anyone who needs it.

    Then she mentions a decision she does face. At the district NCD screening camp, adults are weighed
    and measured for height. She is deciding whether to buy tape measures and train staff to measure
    waists as well. That adds minutes for every person screened.

    That gives you a second candidate.

    "Among adults screened at the district NCD screening camp in 2027 whose body mass index is below
    the camp's cut-off, what share have a waist measurement above the camp's cut-off?"

    Ask the same two questions. Suppose she says: "If it is more than about one in ten, I add the tape
    measure. If it is fewer, I leave the checklist as it is." Both her answers and her one-in-ten are
    part of the made-up conversation.

    Set the two candidates side by side.

    ```table
    | Step | School survey | Camp waist question |
    | Who is waiting | district NCD programme officer | district NCD programme officer |
    | If the answer is high | same school plan | adds tape measures and trains staff |
    | If the answer is low | same school plan | leaves the checklist as it is |
    | Different actions? | no | yes |
    | Result | fails | passes |
    ```

    Now lay the second one out as an argument. Premise: she decides whether the camp measures waists.
    Premise: she said she adds the tape measure if more than about one in ten are missed, and not if
    fewer are. Conclusion: she is waiting for this answer.

    Check the premises. She said both things herself, so you did not guess them. Check the inference.
    Adding tape measures and leaving the checklist alone are different actions, so it carries.

    Notice what her one-in-ten gave you. You now know which result would change her decision before
    you collect any data. Ask every waiting party for that line.
  analogy_breaks_when: |
    The test is only as good as what the person tells you, and plans change. An officer can be
    transferred, or a budget cut, before your results arrive. Ask again before you write up.

    A guideline group rarely acts on one study. Ioannidis counts research as useful when it changes a
    decision "either by itself or when integrated with other studies". For such a group, ask what they
    would do with the pooled evidence your study joins, not with your study alone.

    Some people want one answer and not the other. A company that sells tape measures would be glad of
    a high share. That person is not waiting for an answer. They are hoping for a result.
  numbers: []
must_know:
- point: |
    The error is to write "this will add to the literature" or "future researchers can use it" in the
    place of a person. Anyone can say that of any question, so it tells you nothing. Name a role you
    could go and talk to.
  kind: misconception
  bearing: methodological
- point: |
    Ask the person; do not guess for them. Put two questions: "If the study found this, what would you
    do? And if it found that?" Write down their words, with the date.
  kind: move
  bearing: policy
- point: |
    Ask each waiting person which result would change their decision. That line tells you what the
    study has to be able to tell apart. If they cannot name one, press for it before you start.
  kind: move
  bearing: methodological
- point: |
    "That would be very interesting" is not an action. When an officer or a head of department says
    it, ask again: "And what would you do differently?"
  kind: trap
  bearing: policy
- point: |
    If every answer leads to the same action, drop the question for that party. Or find the party for
    whom the answers differ. A study nobody is waiting for can be done well and still change nothing.
  kind: consequence
  bearing: methodological
- point: |
    Your guide and your degree need a thesis. They are waiting for a thesis, not for this answer.
    Ioannidis notes that trainees are judged on how fast they publish. Count neither as the waiting
    party.
  kind: trap
  bearing: teaching
  refs:
  - ioannidis_2016_useful
- point: |
    Treat money from a party who gains from one answer with care. That party has a conflict of
    interest: something to gain from one result. Ioannidis and colleagues note that research is often
    done by people with conflicts of interest that favour specific results. The screen for this comes
    with the kinds of money in the next book.
  kind: consequence
  bearing: policy
  refs:
  - ioannidis_2014_waste
- point: |
    The test tells you someone would act on the answer. It does not tell you the question can be
    answered, that the study will be done well, or that the action is a good one. Run it together with
    the checks for an answerable question and an existing answer.
  kind: boundary
  bearing: methodological
- point: |
    A textbook may call a question interesting because it interests the scientific community. That is
    a fair reason to publish. It does not pass this test, because it names no decision.
  kind: dispute
  bearing: teaching
  refs:
  - jhangiani_2019_methods
exercises:
- type: critique
  prompt: |
    A made-up draft protocol for a thesis on obesity in college students says:

    "This study will be useful to policy makers and will add to the literature on obesity in young
    adults in India."

    Lay the claim out as premises and a conclusion. Run the who-is-waiting test on it. Then say what
    you would need to find out to rewrite the line.
  answer: |
    Premise: policy makers will find the study useful. Premise: it adds to the literature. Conclusion:
    the study is worth doing.

    Run Part 1. "Policy makers" is a kind of person, not a role you could go and talk to. "The
    literature" can be said of any question. So Part 1 fails as written.

    Part 2 cannot be run at all. No person is named, so no one has said what they would do with
    either answer.

    Check the premises. The first is a guess, not something anyone said. The inference also fails.
    "Adds to the literature" is true of every published study, so it cannot pick out this one as
    worth doing.

    To rewrite the line, find out three things.

    1. Which person decides something about students' health at this college: for example, the
       college's student health officer, or the hostel warden who sets meal times.
    2. What that person would do if the answer came out one way.
    3. What they would do if it came out the other way.

    The rewritten line names the role and both actions. Here is a made-up example. "The hostel warden
    will move dinner earlier if late meals go with larger waists. She will leave the timing as it is
    if they do not."
  skill_ref: S55-R1-K02
- type: design
  prompt: |
    Here is a made-up candidate question.

    "Among adults with obesity attending the district hospital NCD clinic in 2027, do those who get a
    phone call the day before their follow-up visit come back more often than those who do not?"

    Name two people or bodies who might be waiting for the answer. For each, write the two questions
    you would put to them. Then say what reply would pass the test, and what reply would fail it.
  answer: |
    Two possible waiting parties, with the questions for each.

    1. The clinic's medical officer, who decides how the staff spend their time.
       - "If the calls bring more patients back, what would you do?"
       - "If they make no difference, what would you do?"
       - Passes if she says, for example: "If they work, I give one staff member an hour a day for
         calls. If not, I keep that hour for the queue." Fails if she says: "We cannot spare anyone
         for calls whatever you find." Then the action is the same either way.
    2. Patients who attend the clinic, and their families.
       - "If calls helped people come back, would you want one?"
       - "If they made no difference, would you still want one?"
       - Passes if, for example, patients would give a phone number only if the calls help. Fails if
         everyone wants a call either way, or no one does.

    The medical officer is the stronger party here. She controls the action. The patients' answers
    still matter, because a call nobody wants is not answered.
  skill_ref: S55-R1-K02
- type: teaching
  prompt: |
    A first-year resident in your department says: "Every question is useful to someone, so the
    who-is-waiting test rejects nothing." You have ten minutes and a whiteboard. Explain why the test
    does reject questions, with one example that fails and one that passes.
  answer: |
    Start by writing the test on the board as two parts. Part 1: name the person who needs the answer
    for a decision. Part 2: say what they will do for each answer.

    Then show where the resident's claim goes wrong. "Useful to someone" is only Part 1, and a loose
    version of it. The test also needs Part 2: two answers that lead to two different actions.

    The failing example. A made-up school survey of overweight among children in classes 6 to 8. The
    district programme officer says the school visits are planned and paid for whatever the number.
    Same action for every answer. So the question fails, even though she is a real person and the
    topic matters.

    The passing example. A made-up question on adults at a screening camp whose body mass index is
    below the camp's cut-off but whose waist is above it. The officer says she will buy tape measures if more than about one
    in ten are missed, and not if fewer are. Different actions. So the question passes.

    End with the point on the board: the test does not ask whether a question is useful to someone
    somewhere. It asks whether a named person will act differently depending on the answer. Many
    questions fail that.
  skill_ref: S55-R1-K02
quantitative: false
retrieval_items:
- q: What are the two parts of the who-is-waiting test?
  a: Name the person or body that needs the answer for a decision they face. Then state what they will
    do for each possible answer; the question passes only if at least two answers lead to different
    actions.
- q: Why do "the literature" and "future researchers" fail the first part?
  a: They can be said of any question, so they name no decision and tell you nothing about this one.
- q: What is the difference between research money and implementation money?
  a: Research money pays to find out an answer. Implementation money pays to carry a programme out.
figure_note: "The test is two questions asked in words, and the illustration's table sets the two cases side by side; a chart would have no quantity to draw."
