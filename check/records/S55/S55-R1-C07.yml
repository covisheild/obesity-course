definition:
  text: |
    The who-is-waiting test asks two things of a candidate research question.

    First, name the person, or the named role in a body, that needs the answer for a decision they
    actually face. "Policy makers", "the literature", "future researchers" and "my thesis" do not pass
    this part, because each can be said of any question. Nor does a body you cannot name and reach.

    Second, for each answer the study could give, state what they will do, in their own words. A
    guessed action does not pass. The question passes only when at least two possible answers lead
    to different actions. If every
    possible answer leads to the same action, the answer changes nothing for them, and nobody is
    waiting for it.

    The test is a sharper form of criteria in published guides. Jhangiani and colleagues count an
    answer's practical implications as one reason a question is worth asking. Ratan and colleagues
    ask that a question bear on health decisions made by one or more groups with a stake in them.
    Ioannidis calls clinical research useful when it can lead to a better decision. The two-part form,
    and the rule that the same action for every answer fails, are this course's.
  references:
