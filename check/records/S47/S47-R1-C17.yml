simplified_explanation: |
  You can do two different jobs with the same evidence.

  The first job is informing. You set out the options open to the body that decides. For each option you say what the evidence shows, and how sure
  anyone can be. You do not pick one.

  The second job is campaigning, also called advocacy. You start from what you think ought to happen, and you argue for one option.

  Both jobs are honest work. The trouble starts when a document does one job and looks like the other. The usual case is a campaign dressed as a
  neutral summary of the evidence.

  Here are four marks to look for.

  ```table
  | Mark | What it looks like |
  | Mark 1: Selective evidence | only the studies that support one option are cited, and the reader is not told how they were chosen |
  | Mark 2: Uncertainty changed | ranges, model assumptions and limits are dropped; or, the other way, doubt is made up about evidence the writer dislikes |
  | Mark 3: A value written as a finding | "the evidence shows we must..." — a judgement about what ought to be done, written as if a study had found it |
  | Mark 4: An interest not declared | the writer, the department or the funder stands to gain or lose from the decision, and the document does not say so |
  ```

  Mark 3 is the commonest in health writing. A conclusion about what ought to be done needs a value premise: a premise that says what matters, or what
  ought to be done. No study supplies one.

  Mark 2 cuts both ways. A campaign for an option drops the doubt. A campaign against it often adds doubt that the evidence does not carry.

  Decide which job a document does before you write its first line. Then say so, in the document. "This note sets out the options and does not
  recommend one." Or: "This letter argues for a higher tax."
illustrations:
- body: |
    Back to the running setting of this book. You are the postgraduate in community medicine in
    Chhattisgarh. Your department has asked for a note on the first running proposal, a higher tax on
    sugar-sweetened drinks, for a district committee. The note is meant to inform. Suppose this is
    the first draft of its main paragraph. The draft, and the facts about the department in it, are
    made up for the example.

    > A tax on sugary drinks works: it cuts demand by 30%. Every expert we spoke to agreed that the
    > rate should go higher. The drinks industry opposes the tax only to protect its profits. The
    > evidence shows that the rate must rise at the GST Council's next meeting. The GST Council's 56th
    > meeting recommended a rate of {{n:gst_demerit_rate_pct}}% on sugar-added and flavoured drinks.

    Suppose two more facts. The three experts you spoke to all work in health. And your head of
    department has already said in a newspaper that the rate should rise. The draft says neither.

    Take the draft one sentence at a time. For each, ask which job it does, and which mark, if any, it
    carries.

    ```table
    | Sentence | Job | Mark | Why |
    | A tax works: it cuts demand by 30% | campaigning | 2 | the only figure behind it is a modelled range, {{n:summan_model_demand_fall}}, for an extra tax of {{n:summan_model_tax_range}}; the draft keeps the top end and drops the word model |
    | Every expert we spoke to agreed | campaigning | 1 | all three work in health; nobody from the tax side or the industry was asked, and the reader is not told |
    | The industry opposes it only for profit | campaigning | 3 | a judgement about motives, written as a fact; what can be checked is that Summan and colleagues report the industry arguing for lower rates |
    | The evidence shows the rate must rise | campaigning | 3 | "must" is a value; no evidence contains it |
    | The 56th meeting recommended {{n:gst_demerit_rate_pct}}% | informing | none | a fact, from a source you can open |
    ```

    The draft as a whole carries mark 4 as well. The department has a public position at stake, and
    the note does not say so.

    Now rewrite it. Keep every fact. Move each value into a sentence that says it is a value.

    > The GST Council's 56th meeting, on 3 September 2025, recommended a special de-merit rate of
    > {{n:gst_demerit_rate_pct}}% that covers sugar-added and flavoured drinks. One modelling study, reported by Summan and
    > colleagues in a 2026 study of food taxes in India, estimated that an extra health tax of {{n:summan_model_tax_range}} could cut demand for
    > sugary drinks by {{n:summan_model_demand_fall}}; that is a model's estimate, not a change measured in India. Summan
    > and colleagues report that the drinks industry argues for lower rates and against the de-merit
    > class. We spoke to three
    > people, all working in health, and to nobody from the tax side or the industry. Whether the
    > rate should rise further is a choice between health, government revenue and the cost to poorer
    > buyers, and this note does not make it. Our department has said in public that the rate should
    > rise.

    ```table
    | Sentence | Job |
    | The 56th meeting recommended {{n:gst_demerit_rate_pct}}% | informing |
    | One modelling study estimated {{n:summan_model_demand_fall}}, a model | informing |
    | Summan and colleagues report the industry arguing for lower rates | informing |
    | We spoke to three people, all in health | informing |
    | Whether to raise it is a choice; this note does not make it | informing |
    | Our department has said in public that the rate should rise | informing |
    ```

    The fifth sentence names a value choice and does not make it. That is informing. The last
    sentence is a declaration: it tells the reader where the department stands, so they can weigh the
    rest.

    Count the two drafts.

    ```table
    | Job | First draft | Rewrite |
    | informing | 1 | 6 |
    | campaigning | 4 | 0 |
    ```

    ```working
    first draft: 1 plus 4 = 5 sentences
    rewrite: 6 plus 0 = 6 sentences
    ```

    The rewrite is one sentence longer, because the declaration is new.
  analogy_breaks_when: |
    The labels are judgements, and a careful reader can argue about one or two. "The industry argues
    for lower rates" informs only if it is true and sourced; written without a source, it is
    an accusation.

    A count of campaigning sentences is a check on your own draft, not a grade. A note with no
    campaigning sentence can still mislead, by what it leaves out. Mark 1 lives in the studies that
    are missing, not in any sentence that is there.
  numbers:
  - value: '40'
    unit: per cent (combined GST rate recommended)
    citekey: pib_2163555
    as_of: '2025-09-03'
    quote: a special de-merit rate of 40% for a select few goods and services
  - value: '7'
    unit: per cent (low end of the modelled fall in demand for sugary drinks)
    citekey: summan_2026_foodtax
    quote: A modelling study found that a 10%–30% additional health tax could reduce demand by 7%–30% for SSBs
  - value: '30'
    unit: per cent (high end of the modelled fall in demand, and of the extra tax)
    citekey: summan_2026_foodtax
    quote: A modelling study found that a 10%–30% additional health tax could reduce demand by 7%–30% for SSBs
  - value: '10'
    unit: per cent (low end of the modelled extra health tax)
    citekey: summan_2026_foodtax
    quote: A modelling study found that a 10%–30% additional health tax could reduce demand by 7%–30% for SSBs
- body: |
    Now suppose your department decides it does want to campaign. That is its right. Then it writes a
    different document, and says what it is. Here is a made-up letter that campaigns openly, using the
    same facts.

    > This letter asks the State Government, whose minister sits on the GST Council, to press there
    > for a higher rate on sugar-added drinks. We argue for it because we judge that children's health
    > should count for more than the revenue and price concerns on the other side. That is our
    > judgement, not a finding of any study. The evidence we rely on is one modelling study, reported
    > by Summan and colleagues in a 2026 study of food taxes in India, which estimated that an extra tax of {{n:summan_model_tax_range}} could cut demand by {{n:summan_model_demand_fall}};
    > it is a model, not a change measured in India. The case against is real: the tax falls hardest
    > on poorer buyers, and the industry argues for lower rates. Our department receives no money from
    > any drinks company.

    Put the letter through the four marks.

    ```table
    | Mark | First draft of the note | The letter |
    | Mark 1: Selective evidence | fails: only one side was asked, and the reader is not told | passes: it names the case against |
    | Mark 2: Uncertainty changed | fails: a modelled range became a flat 30% | passes: it keeps the range and the word model |
    | Mark 3: A value written as a finding | fails: "the evidence shows the rate must rise" | passes: "that is our judgement, not a finding" |
    | Mark 4: An interest not declared | fails: the department's public position is hidden | passes: it says what it wants, and declares that no drinks company pays the department |
    ```

    The letter campaigns from its first line, and it passes all four marks. The marks do not catch
    campaigning. They catch campaigning that pretends to be something else.

    So, before you write, choose. If the committee asked for the options, write the note, and keep
    your view out of it or label it. If your department wants a higher rate, write the letter, and
    say so in its first sentence. Oliver and Cairney put this choice as being an "issue advocate" or
    an "honest broker". The honest broker passes on research "honestly, clearly, and in a timely
    fashion" and seeks to stay "neutral"; the other option is to "recommend specific policy options".
    They warn that the line between the two is "very difficult to negotiate or identify in practice",
    because people who decide often value candid judgements from people they trust more than new
    research. When that happens, give the opinion in a sentence that says it is yours.
  analogy_breaks_when: |
    The letter is made up and tidy. A real campaign letter is judged by people who know the other
    side's best case. Naming "the case against" in one line does not answer it.

    Passing the four marks makes a document honest about its job. It does not make it right. An
    openly labelled campaign can rest on weak evidence, and an honest note can still miss the study
    that matters.
must_know:
- point: |
    The error is to treat a sentence with a number or a citation in it as informing. Ask what
    was left out before you ask whether what is there is right.
  kind: misconception
  bearing: methodological
- point: |
    Decide which job a document does before you write its first line.
  kind: move
  bearing: policy
- point: |
    Give a value its own sentence in a note meant to inform. Make that sentence say it is a choice.
  kind: move
  bearing: policy
- point: |
    Refuse "the evidence shows we must" in any document you sign, including a trainee's draft you are
    correcting. Split it in two: what the evidence shows, in one sentence; what you think should be
    done, in another, marked as yours.
  kind: move
