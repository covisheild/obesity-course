exercises:
- type: retrieval
  prompt: |
    From memory: name the two jobs a document can do with evidence, and the four marks of a document
    that says it informs but campaigns.
  answer: |
    The two jobs:

    - Informing: setting out the options, what the evidence says about each, and how sure it is,
      without choosing.
    - Campaigning, or advocacy: arguing for one option, from a view of what ought to be done.

    The four marks:

    1. Evidence used selectively.
    2. Uncertainty dropped, or doubt made up.
    3. A value written as if it were a finding.
    4. An interest not declared.
- type: critique
  prompt: |
    A made-up "evidence summary" reaches the district committee from a drinks makers' association. It
    reads, in part:

    > The evidence on sugary-drink taxes is mixed and uncertain. Taxes in some countries have not
    > reduced obesity. A tax would hurt small shopkeepers and poorer families. The committee should
    > therefore wait for better evidence before supporting any change.

    Say which job the document does, which marks it carries, and what you would ask its authors for.
  answer: |
    It campaigns. Its last sentence argues for one option, waiting, and the document calls itself an
    evidence summary.

    - Mark 4: an association of drinks makers stands to lose from a higher tax, and the summary does
      not say so in these lines. Its standing to comment is real. Its interest has to be on the page.
    - Mark 2, run backwards: "mixed and uncertain" is a claim about the evidence. Ask for the studies,
      how they were found, and where they disagree.
    - Mark 1: "taxes in some countries have not reduced obesity" names the countries where the result
      went one way. Ask which countries, and what was found in the others.
    - Mark 3: "should therefore wait" is a judgement about what to do under uncertainty. Waiting is an
      option with its own costs, and choosing it is a value, not a finding.

    Ask for: the list of studies and how they were chosen, the effect sizes with their ranges, and a
    statement of who funded the summary.

    One fair point to keep. The burden on poorer families is a real argument. A 2026 study of food
    taxes in India by Summan and colleagues reports that taxes on junk foods are "perceived as
    regressive". That means they take a
    larger share of a poorer buyer's income. It belongs in the committee's options, labelled as an
    argument about who pays.
- type: teaching
  prompt: |
    Audience: a journalist, three minutes. They ask: "Your department wrote a note on the sugary-drinks
    tax. Are you for it or against it?" Your note was written to inform. Your head of department has
    said in public that the rate should rise. Give your answer, with one sentence the journalist can
    quote.
  answer: |
    Say which hat you are wearing, then answer the question you were asked.

    "Our note doesn't take a side. It sets out what the GST Council recommended, what one modelling study
    estimated about demand, and who gains and loses. Our head of department has said publicly that
    the rate should rise, and the note says so too, so readers can weigh it."

    If pressed for your own view, give it as yours: "My own view is that it should rise. That's a
    judgement about whose interests count most. The evidence doesn't settle it."

    Quotable sentence: "The evidence can tell you what a tax might do; whether to raise it is a
    choice, and we've said where we stand."

    What not to do: say "the evidence shows the tax must rise". That is mark 3, said to a journalist,
    and it will be printed.
quantitative: true
practice:
- level: 1
  prompt: |
    Say whether each sentence informs or campaigns.

    a. Option A costs more than option B and reaches fewer people.
    b. Option B is the only responsible choice.
    c. We recommend option A.
    d. The study did not measure what happened after the first year.
    e. Nobody who cares about children could oppose option A.
  answer: |
    Sentence by sentence:

    ```table
    | Sentence | Job | Because |
    | a | informing | it compares the options on cost and reach and picks neither |
    | b | campaigning | "the only responsible choice" is a judgement that argues for B |
    | c | campaigning | it argues for A, openly; that is honest campaigning, not a fault |
    | d | informing | it states a limit of the evidence |
    | e | campaigning | it argues for A by questioning the motives of anyone who disagrees |
    ```
- level: 2
  prompt: |
    Each sentence comes from a document that calls itself a neutral summary. Name the mark (1 to 4)
    each one carries.

    a. "Three studies found the option worked." The writer found five studies and left out the two
       that did not find it worked.

    b. "The option will cut cases by a fifth." The study it cites gave a range from a twentieth to a
       fifth.

    c. "The evidence shows we have a duty to act."

    d. The summary was written by a company that sells the product the option would favour, and it
       does not say so.

    e. "The evidence on this option is too uncertain to act on." The writer dislikes the option, and
       the studies agree closely with each other.
  answer: |
    Sentence by sentence:

    ```table
    | Sentence | Mark | Because |
    | a | 1 | two studies that went the other way were left out, and the reader is not told |
    | b | 2 | a range became its top end |
    | c | 3 | "a duty to act" is a value; no study contains a duty |
    | d | 4 | the writer gains from one outcome and does not declare it |
    | e | 2 | doubt is added that the evidence does not carry: mark 2 run backwards |
    ```
- level: 3
  prompt: |
    Rewrite this sentence so that it informs. Keep whatever in it could be a finding.

    "The evidence proves that every school canteen must stop selling sugary drinks."
  answer: |
    The sentence holds two claims. One is about what evidence shows. The other is a value: "must stop".
    Split them.

    - The finding, written so it can be checked: "A study of [whom, where, when] found that [what was
      measured], with [how sure]." If no such study is named, there is no finding to keep, and the
      sentence should say "we found no study that measured this".
    - The value, marked as a choice: "Whether canteens should stop selling sugary drinks is a
      judgement. It weighs that evidence against other things, such as what children would buy
      instead and what the canteens earn. The evidence does not make the choice."

    A third question hides in "every school canteen": who could make such a rule at all. That is the
    second running proposal of this book. Run the trace from the section on finding who decides
    before you write any sentence about it.
- level: 4
  prompt: |
    Here are three sentences from the Press Information Bureau release of 3 September 2025 on the 56th
    meeting of the GST Council.

    1. "Next-generation GST reforms, as announced by Prime Minister Shri Narendra Modi from the
       ramparts of Red Fort on 15th August 2025, represent a strategic, principled, and
       citizen-centric evolution of a landmark tax framework, which will enhance the quality of life
       of every last citizen"
    2. "The 56th meeting of the GST Council was held in New Delhi under the chairpersonship of the
       Union Finance & Corporate Affairs Minister Smt. Nirmala Sitharaman."
    3. "The same would be given effect through the relevant circulars/ notifications/ law amendments
       which alone shall have the force of law."

    Say whether each informs or campaigns. Then say which you would carry into your department's note,
    and why.
  answer: |
    Sentence by sentence:

    ```table
    | Sentence | Job | Because |
    | 1 | campaigning | "strategic, principled, and citizen-centric" are judgements, and "will enhance the quality of life of every last citizen" is a forecast with no measure behind it |
    | 2 | informing | who met, where, and who chaired: facts you can check |
    | 3 | informing | it states what the release itself is not: the recommendations have force only when notified |
    ```

    A government release reports decisions and also presents them well. Neither is a fault in a press
    release, which no reader takes for a neutral review. Your job is to separate the two when you use
    it.

    Carry sentences 2 and 3 into the note. Sentence 3 matters most: it tells you to go on to the
    notification before you write that any rate is in force. Leave sentence 1 out, or quote it only as
    how the government described its reform.
  refs:
  - pib_2163555
- level: 5
  prompt: |
    Here are three sentences from Summan and colleagues' 2026 study of food taxes and subsidies in
    India. The study drew on a review of published work and on interviews with people who work on
    these taxes.

    1. "Fiscal policy ownership is concentrated within the Ministry of Finance and the GST Council,
       which determine tax design and rates, while health-oriented ministries play a largely advisory
       role."
    2. "By contrast, earmarking tax revenue for health initiatives, such as small-scale farming or
       public awareness campaigns, may garner greater public acceptance."
    3. "This, however, would be challenging as India does not allow for the earmarking of tax
       revenues, and would require additional legislation."

    "Earmarking" means setting a tax's money aside for one named use. Say what job each sentence does.
    Then say whether the paper marks its suggestion as a suggestion.
  answer: |
    Sentence by sentence:

    ```table
    | Sentence | Job | Because |
    | 1 | informing | a finding of the study, about who holds the decision, drawn from its review and interviews |
    | 2 | leans to campaigning | it puts forward one option, earmarking, and says what it might achieve |
    | 3 | informing | it states the main obstacle to the paper's own suggestion |
    ```

    Yes, the paper marks it. Sentence 2 says "may", not "will". It sits in the discussion, where a
    reader expects the authors' judgement. And sentence 3 gives the case against at once. That is what
    an honest suggestion looks like inside a research paper: the option, how sure, and its main
    obstacle, side by side.

    What would have made it mark 3: "The evidence shows that India must earmark the revenue."
  refs:
  - summan_2026_foodtax
- level: 6
  prompt: |
    The Prime Minister spoke in the 119th episode of the radio address Mann Ki Baat, on 23 February
    2025. The Press Information Bureau released an English rendering. In it he said:

    "Decide that you will use 10% less oil every month."

    And later:

    "Friends, using less oil in food and dealing with obesity is not just a personal choice but also
    our responsibility towards the family."

    Say what job each sentence does. Is either a fault under this section's rule? If you quote them in
    your department's note, how do you quote them?
  answer: |
    Both campaign. The first asks each listener to act. The second argues that the matter is a duty to
    the family, not only a personal choice. That is a value.

    Neither is a fault under this section's rule. It is a public appeal by a political leader, made
    openly as an appeal. No listener takes a radio address for a neutral summary of evidence. The rule
    is about documents that say they inform and then campaign.

    In your note, quote them as what was said, by whom, where and when. For example: "In Mann Ki Baat
    on 23 February 2025, the Prime Minister asked listeners to use {{n:edible_oil_cut_pct}}% less oil every month." That
    sentence informs: it reports an appeal. It is not evidence that using {{n:edible_oil_cut_pct}}% less oil changes anyone's weight, and your note
    should not use it as such.
  refs:
  - pib_2105618
- level: 7
  prompt: |
    A colleague sorts a sentence from a made-up draft note. Here is their worked answer. Find the step
    that broke.

    ```working
    sentence: "Our survey of students at one college, described in section 2 of this note, proves that the district needs a tax on sugary drinks."
    it names a survey, so it rests on evidence
    it points to section 2 of the note for the methods, so it can be checked
    job: informing
    ```
  answer: |
    The last line broke. The first two lines are true, and they are about the first half of the
    sentence. The second half, "proves that the district needs a tax", is a value written as a
    finding: mark 3. A survey can say what students at one college drink. It cannot say what the
    district ought to do, and it cannot prove a need for one measure rather than another.

    The fix keeps the survey and moves the value out. "Section 2 of this note reports what our survey of students at
    one college found about sugary drinks. Whether the district should seek a tax is a separate
    judgement; the survey does not make it."

    Why the wrong answer looks reasonable: the sentence carries the signs of evidence, a survey and a
    pointer to its methods. Those signs belong to the first half. The job of a sentence is decided by
    what it concludes.
- level: 8
  prompt: |
    Here is a made-up "background" paragraph for the district committee, with a worked answer. Find the
    steps that broke.

    > Taxes on sugary drinks have been studied in many countries. The studies we reviewed all found
    > that demand fell after a tax. Industry claims that the tax hurts poorer families are not
    > supported by the evidence. The committee can therefore be confident that a higher rate will
    > reduce obesity in the district.

    ```working
    the paragraph uses no "should" and no "must"
    it recommends no option in so many words
    it reports what studies found
    job: informing, no marks
    ```
  answer: |
    The last line broke, because the first three lines look only at the words, not at what was chosen
    or concluded.

    - Mark 1: "the studies we reviewed all found" says nothing about how the studies were chosen. A
      review that only kept studies with one result would read exactly like this.
    - Mark 3 (and mark 1 again): "not supported by the evidence" dismisses the other side's argument
      in one line, with no evidence shown. Who pays a tax is partly a question of values, and no
      review settles it.
    - Mark 2: "can be confident that a higher rate will reduce obesity in the district" makes a jump.
      It goes from demand falling in other countries to weight falling here. The limits are dropped:
      other countries, a different outcome, a different rate.
    - The last sentence is a recommendation in disguise. "Can be confident" does the work of
      "should".

    So the paragraph campaigns, and it says it is background.

    Why the wrong answer looks reasonable: people check for campaigning by looking for "should" and
    "must". A paragraph can campaign without either, through what it leaves out and how far it
    stretches its evidence.
- level: 9
  prompt: |
    In the same address, the English rendering has the Prime Minister say this. "According to a
    study, one in every eight people today is troubled by the problem of obesity."

    A colleague wants to open your department's informing note with this sentence, as the size of the
    problem. What do you do? Then say what the sentence, as it stands, does not establish.
  answer: |
    Decide what the sentence would be doing in your note. In the address, it supports an appeal. In an
    informing note, it would be a figure about the world. A figure about the world needs its source
    opened, as Book 0's section on checking a reference taught. Find it, confirm it, locate the
    passage, read it.

    The sentence names no study. So before it goes in as a fact, find four things. Which study. Which
    population: all ages or adults only, and which country. Which year. And how obesity was defined
    and measured.

    Until you have found it, you can still use the sentence, but only as a report of what was said.
    For example: "In Mann Ki Baat on 23 February 2025, the Prime Minister cited a study finding that
    one in eight people is troubled by obesity." That informs about the speech. It does not inform about how common
    obesity is.

    What the sentence does not establish:

    - How common obesity is in Chhattisgarh, in the district, or among school children, which is what
      your proposal is about.
    - What "troubled by the problem" means as a measure. It is not a term a survey would use.
    - That the figure is up to date or measured rather than self-reported.
  refs:
  - pib_2105618
- level: 10
  prompt: |
    Here is a made-up line from the conclusion of a draft district report. "Our findings show that the
    GST Council should raise the rate on sugary drinks to protect children."

    Classify the line, rewrite it so the report informs, and say what your rewrite does not
    establish.
  answer: |
    Classify: campaigning, in a report that presents findings. It carries mark 3: "should raise" is a
    value, and "our findings show" claims the findings contain it.

    Rewrite in two sentences, with the value moved out:

    "Our findings show [what was measured, in whom, with how much certainty]. Whether the rate should
    rise further is a judgement. It also weighs government revenue and the cost to poorer buyers. Our
    findings do not settle it."

    If the department wants a higher rate, it can say so in a separate letter that opens by saying it
    argues for one.

    What the rewrite does not establish:

    - That the findings are right. The rewrite fixes the job the sentence does, not the evidence under
      it.
    - That a higher rate would protect children. Findings about what children drink are not findings
      about their weight or health. And an effect of a tax measured elsewhere is not an effect
      measured here.
    - Who would act on it. The Council recommends; a rate has force only when it is notified. The
      report's readers still need the trace from the section on finding who decides.
retrieval_items:
- q: What does a policy analyst do, and what does a policy advocate do?
  a: An analyst sets out the options open to the decider, their likely effects and the uncertainty,
    without choosing. An advocate starts from what ought to be done and argues for one option.
- q: What are the four marks of a document that says it informs but campaigns?
  a: Selective evidence; uncertainty dropped or doubt made up; a value written as a finding; an
    interest not declared.
- q: Oliver and Cairney put a researcher's choice as "issue advocate" or "honest broker". What are the
    two options, and what do they warn about the line between them?
  a: The honest broker passes on research honestly, clearly and on time, and seeks to stay neutral.
    The other option is to recommend specific policy options. The line between them is very difficult
    to identify in practice.
