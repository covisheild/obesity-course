common_misreading: |
  The tempting reading is that informing means having no view. It does not. The analyst may hold a
  strong view, and may state it. What makes a document informing is that its account of the evidence
  is not bent towards that view. Any view in it is labelled as a view. A note with a clearly
  marked last sentence, "our own judgement is that the rate should rise", still informs.
reporting_sentence: |
  "This note sets out the options open to the decision maker. For each, it says what the evidence
  shows and how certain it is. It does not recommend one. Our department's own position is stated in
  the last paragraph."
