must_know:
- point: |
    Do not count on {{n:plcp_comment_days}} days to comment on a draft Bill. The Pre-legislative
    Consultation Policy is a decision of senior civil servants, not a law.
  kind: misconception
  bearing: policy
  refs:
  - plcp_2014
  - pib_1797203
- point: |
    Your evidence can enter at two sourced points. One is the pre-legislative consultation, if it
    is held. The other is a committee examining the Bill, which can take evidence from experts.
  kind: move
  bearing: policy
  refs:
  - plcp_2014
  - rajyasabha_2005_legislative
- point: |
    "Parliament has passed the Bill" is not yet "the law says". A Bill becomes an Act only when
    both Houses have agreed to the same text and the President has assented. An Act may then wait
    for a notification before it is in force.
  kind: trap
  bearing: public
  refs:
  - constitution
  - rajyasabha_2005_legislative
- point: |
    Do not describe a Private Member's Bill as a likely route to a new law.
  kind: number
  bearing: policy
  refs:
  - prs_2012_parliament60
- point: |
    A Bill that only deals with tax is a Money Bill. The Rajya Sabha can only recommend changes,
    within fourteen days, and the Lok Sabha may reject them all.
  kind: india_deviation
  bearing: policy
  refs:
  - constitution
- point: |
    A State Bill goes through the State Legislature and then to the Governor, who may reserve it
    for the President (Article 200).
  kind: boundary
  bearing: methodological
