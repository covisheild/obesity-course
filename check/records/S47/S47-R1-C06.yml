simplified_explanation: |
  A Bill is a statute in draft. Most Bills come from a minister's department. The Union's own
  policy asks the department to put the draft in public for at least {{n:plcp_comment_days}}
  days first, so that anyone can comment. But that policy is not a law, and a department can skip
  it if it writes down why.

  Then the Cabinet approves the Bill and it goes to Parliament. Each House reads it three times.

  In the first reading it is introduced. In the second, members debate it and go through it clause
  by clause, and it may be sent to a committee. In the third, the House votes to pass it. Then the
  other House does the same.

  For you, two doors matter most: the public consultation before the Bill, and the committee that
  examines it.
illustrations:
- body: |
    Here is the trap. You hear that a ministry is preparing a Bill on your subject, and you assume
    you will get a month to comment. You may not.

    Open the Pre-legislative Consultation Policy on the Legislative Department's website
    (https://legislative.gov.in/pre-legislative-consultation-policy/). Its heading says it is a set
    of "Decisions taken in the meeting of the Committee of Secretaries" on 10 January 2014. That is
    a meeting of the most senior civil servants. It is not Parliament, and the Policy is not an Act.

    Read paragraph 2. The department "should publish" the draft, or at least its main points. "Such
    details may be kept in the public domain for a minimum period of thirty days". Note the verbs:
    should, may.

    Now read paragraph 11. If the department thinks consultation is "not feasible or desirable", it
    "may record the reasons in the note for the Cabinet". Nothing in the Policy asks for those
    reasons to be published. So a draft can go to the Cabinet with no public consultation at all,
    and you may never learn why.

    Last, search the Press Information Bureau website for release 1797203, of 10 February 2022
    (https://www.pib.gov.in/PressReleasePage.aspx?PRID=1797203). The Law Minister told the Rajya
    Sabha: "The Ministry of Law and Justice does not maintain any record relating to compliance by
    the Ministries/Departments with the Pre-Legislative Consultation Policy." Nobody is counting.

    So the {{n:plcp_comment_days}} days is a door that may open. Watch the department's website for
    it. Do not plan as if it must.

    Now the clean case: when the consultation does happen, follow your comment through. Paragraph 6
    asks for a summary of the comments to be put on the department's website. Paragraph 9 asks for
    a summary, with the department's response, to go into the note for the Cabinet with the draft.
    Paragraph 10 asks for the summary to go before the Parliamentary Standing Committee when the
    Bill is referred to it. A comment that arrives in time can travel with the Bill all the way to
    Parliament.
  analogy_breaks_when: |
    This is the Union's policy for Bills and rules made by Union departments. It does not bind a
    State. Chhattisgarh's practice for its own Bills is not read in this book. And the Policy says
    what a department should do, not what any one department did with any one Bill.
  numbers:
  - value: '30'
    unit: days, minimum period a draft is kept in public under the Pre-legislative Consultation Policy, paragraph 2
    citekey: plcp_2014
    quote: "Such details may be kept in the public domain for a minimum period of thirty days"
    as_of: '2014-01-10'
- body: |
    Now walk a Bill through Parliament. Suppose, as a made-up case, the Cabinet has approved a Bill
    on food in schools. Open the Rajya Sabha Secretariat's booklet *Legislative Procedure in the
    Rajya Sabha*, of February 2005
    (https://cms.rajyasabha.nic.in/UploadedFiles/Procedure/PracticeAndProcedure/English/6/legislative_procedure.pdf).
    Open the Constitution beside it, at Articles 107 to 111. Fill in this table as you read.

    ```table
    | stage | what happens | where it is written |
    | introduction, the first reading | a motion for leave to introduce; then the Bill is published in the Gazette | booklet, I(i)(a) |
    | standing committee | the Speaker or the Chairman may refer the Bill to a Department-related Parliamentary Standing Committee for examination and report | booklet, I(i)(a) |
    | second reading | debate on the principle; the House may send it to a Select or Joint Committee, or circulate it for opinion; then clause by clause | booklet, I(i)(b) |
    | third reading | the House votes to pass it; a simple majority of those present and voting is enough | booklet, I(i)(c) |
    | the other House | the same stages again | booklet, II |
    | both Houses agree | the same text, or a joint sitting if they disagree | Articles 107(2) and 108 |
    | assent | the President assents or withholds; the Bill becomes an Act only on assent | Article 111; booklet, VI |
    ```

    Two rows are doors for your department. A Select or Joint Committee "can also take evidence of
    associations, public bodies or experts who are interested in the measure". The booklet says a
    Standing Committee examines a Bill and reports on it, but not how it gathers evidence. So when a
    Bill goes to either kind of committee, a short memorandum of evidence from your department is
    the document to send.
    And when a Bill is circulated for opinion, the opinions are gathered through the State
    Governments. Write to the Government of Chhattisgarh, not to Parliament.

    Now change the made-up Bill. Suppose it only raised a tax. Article 110(1) makes a Bill a Money
    Bill if it "contains only provisions" on matters such as "the imposition, abolition, remission,
    alteration or regulation of any tax". A Money Bill cannot start in the Rajya Sabha. The Rajya
    Sabha may only recommend changes, within fourteen days, and the Lok Sabha may reject every one
    (Article 109). So for a tax law, the Lok Sabha is where the votes that matter are cast.

    Last, the Bill an ordinary member brings. PRS Legislative Research is, in its own words, "an
    independent, not-for-profit group". Open its *Indian Parliament at 60
    years* (https://prsindia.org/articles-by-prs-team/indian-parliament-at-60-years-facts-statistics),
    written in 2012. "Till date, Parliament has passed 14 Private Members' Bills." And: "No Private
    Members' Bill has been passed by Parliament since 1970". In the 15th Lok Sabha, the term running
    in 2012, 264 such Bills had been introduced in the Lok Sabha and 160 in the Rajya Sabha. Only 14
    and 11 had been discussed.

    ```working
    264 plus 160 = 424 introduced
    14 plus 11 = 25 discussed
    ```

    Of 424 Private Members' Bills introduced in that term to 2012, 25 had been discussed at all. A
    Private Member's Bill can put a subject in front of Parliament. On these figures it is not a
    route you can count on to make law.
  analogy_breaks_when: |
    The booklet is of 2005 and the PRS figures stop in 2012; neither shows what happened after.
    The booklet describes the Rajya Sabha's practice; the Lok Sabha has its own rules, not read here.
    The counts of Bills say how many were discussed, not why the rest were not.
