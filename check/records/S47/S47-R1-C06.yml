exercises:
- type: retrieval
  prompt: |
    Without looking back:

    1. Put these in order: assent; Cabinet decision; third reading; introduction; pre-legislative
       consultation; the other House; second reading.
    2. Name the two points where a researcher's evidence can enter, and the document that provides
       for each.
    3. Say what makes a Bill a Money Bill, and what the Rajya Sabha can do with one.
  answer: |
    1. In order:

    - pre-legislative consultation
    - Cabinet decision
    - introduction (the first reading)
    - second reading
    - third reading
    - the other House
    - assent

    2. First, the public consultation on the draft, if the department holds one. The 2014 policy
    asks for it, in paragraph 2. Second, a committee that examines the Bill. The Rajya Sabha booklet
    says a Select or Joint Committee can take evidence from experts.

    3. It deals only with the matters listed in Article 110(1), such as a new tax or a change to
    one. The Rajya Sabha may only suggest changes, within fourteen days. The Lok Sabha may take them
    or leave them (Article 109).
  skill_ref: S47-R1-K01
  confidence_first: true
- type: interpretation
  prompt: |
    A made-up news line reads: "Parliament today passed the School Food Bill. From tomorrow, every
    school canteen must follow it." Say what has and has not been established, and what you would
    check.
  answer: |
    Established, at most: one House, or perhaps both, voted to pass a Bill.

    Not established:

    - That both Houses agreed to the same text (Article 107(2)). A news line can say "Parliament
      passed" when only one House has voted.
    - That the President has assented. The Bill becomes an Act only on assent (Article 111).
    - That the Act is in force. Its first section will say when it starts, and it may wait for a
      notification.
    - That canteens must do anything yet. An Act often leaves the detail to rules or regulations,
      made later.

    What to check: the Bill's status on the Houses' websites, the Act in the Gazette after assent,
    and the notification bringing it into force.
  skill_ref: S47-R1-K01
- type: critique
  prompt: |
    Here is a line from a draft letter by your department. "The Ministry acted illegally by sending
    the Bill to the Cabinet without publishing it for {{n:plcp_comment_days}} days, as the law requires." Find the
    errors and rewrite the sentence.
  answer: |
    No law requires it. The {{n:plcp_comment_days}} days comes from the Pre-legislative Consultation Policy. That is
    a decision of senior civil servants, made on 10 January 2014. It is a policy, not a statute.
    So "illegally" is wrong.

    The Policy itself lets a department skip consultation and record its reasons in the note for
    the Cabinet (paragraph 11). Nothing in the Policy asks for those reasons to be published, so
    your department may not be able to tell whether reasons were recorded.

    A fair version: "The draft was not placed in the public domain before it went to the Cabinet.
    The Union's Pre-legislative Consultation Policy of 2014 asks for at least {{n:plcp_comment_days}} days of public
    consultation. We ask the Ministry to publish its reasons, and to consult before the Bill is
    introduced."
  skill_ref: S47-R1-K01
- type: teaching
  prompt: |
    The State health secretary wants one page, answer first. She asks: "Suppose a national Act on
    food in schools were proposed. Whom would it have to pass through? Where could our department's
    evidence get in?"
  answer: |
    Answer first: through the owning Union department, the Law Ministry, the Union Cabinet and both
    Houses of Parliament, then the President. Our evidence can get in at two points. One is the
    public consultation on the draft, if one is held. The other is the parliamentary committee that
    examines the Bill.

    The route, in order:

    1. The Union department that owns the subject prepares the draft.
    2. It may publish the draft for at least {{n:plcp_comment_days}} days under the Pre-legislative Consultation
       Policy. It may also skip that and record why.
    3. The Ministry of Law is consulted, and the Cabinet decides.
    4. Parliament: introduction, possible reference to a committee, debate, clause by clause,
       passage, then the same in the other House.
    5. The President's assent. Then a notification bringing it into force.

    What we should do now: watch the department's website for a draft. Prepare a two-page
    memorandum of evidence, ready to send to the committee if the Bill is referred. If the Bill is
    circulated for opinion, the opinions are gathered through the State Governments, so the
    Government of Chhattisgarh would be asked.

    What this page cannot say: how long any step takes, or whether such a Bill will be brought at
    all.
retrieval_items:
- q: When does a Bill become an Act?
  a: When both Houses have agreed to it in the same form and the President has assented (Articles
    107(2) and 111). It may come into force later, on a notified date.
- q: What is the Pre-legislative Consultation Policy, and what does it ask?
  a: A decision of the Committee of Secretaries of 10 January 2014, not a law. It asks departments to
    put a draft in public for at least {{n:plcp_comment_days}} days; paragraph 11 lets them skip it and record why.
- q: How many Private Members' Bills had Parliament passed by 2012?
  a: Fourteen, and none since 1970 (PRS Legislative Research, 2012).
