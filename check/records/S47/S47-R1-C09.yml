definition:
  text: |
    Authority over one proposal is often shared, in three common shapes.

    First, two legislatures may make law on the same subject.

    Second, one body may seat members of both governments. The Goods and Services Tax (GST) Council is set up under
    Article 279A. The Union Finance Minister chairs it. Its other members are the Union Minister of State in charge of
    Revenue or Finance, and from each State its Finance or Taxation Minister or another minister its
    government nominates. Each decision needs not less than
    {{n:gst_council_majority}} of the weighted votes of the members present and voting.

    A recommendation is not a tax. The Central Government notifies the rate of central goods and
    services tax (CGST), under section 9(1) of the Central Goods and Services Tax Act, 2017. It
    does so "on the recommendations of the Council", at a rate not exceeding {{n:cgst_sugary_drinks_rate_pct}} per cent.

    Third, several bodies may each hold a power over part of one thing. A food advertisement that
    misleads falls under section 24 of the Food Safety and Standards Act, 2006. It also falls
    under section 21 of the Consumer Protection Act, 2019, which lets the Central Consumer
    Protection Authority (CCPA) order it discontinued or modified.

    A proposal addressed to "the government" names none of these bodies.
