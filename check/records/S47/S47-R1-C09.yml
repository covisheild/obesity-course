simplified_explanation: |
  Sometimes no one body can say yes on its own. Here is the trap: a note that writes "the
  government should" has named no one, so no one has to answer it.

  The GST Council is the clearest case. It recommends tax rates. It does not levy them. The
  Central Government then issues the notification that sets the central rate.

  When several bodies must act, ask which one goes first. Address your note to it, and name every
  other body whose agreement is needed.
illustrations:
- body: |
    Here is the trap with a tax rate. The body you hear about is not always the body that sets
    it.

    Suppose a colleague's draft says this. It is made up.

    > The GST Council imposed a {{n:gst_demerit_rate_pct}} per cent tax on sugary drinks from
    > 22 September 2025.

    Step 1. Open the Press Information Bureau release of 3 September 2025, "Recommendations of
    the 56th Meeting of the GST Council" (https://www.pib.gov.in/PressReleasePage.aspx?PRID=2163555).
    In Annexure-I, find 2202 10. It is the code under which the tax tables list these drinks; the
    tables classify goods by numbered chapter, heading, sub-heading and tariff item. "All goods (including aerated waters), containing added
    sugar or other sweetening matter or flavoured" go to {{n:gst_demerit_rate_pct}}%.
    Now go to the note at the end. The recommendations "would be given effect through the
    relevant circulars/ notifications/ law amendments which alone shall have the force of law".
    The Council recommended. It did not impose.

    Step 2. Find the notification. Open Notification No. 9/2025-Central Tax (Rate) of 17
    September 2025 (https://egazette.gov.in/WriteReadData/2025/266209.pdf). The Central
    Government, "on the recommendations of the Council", notifies central tax at "20 per cent. in
    respect of goods specified in Schedule III". Serial number 1 of Schedule III is entry 2202 10,
    with the same description. Paragraph 2 puts the notification in force from 22 September
    2025.

    Step 3. Check the power. Section 9(1) of the Central Goods and Services Tax Act
    (https://taxinformation.cbic.gov.in/content/html/tax_repository/gst/acts/2017_CGST_act/active/chapter3/section9_v1.00.html)
    lets the Government notify central tax "at such rates, not exceeding twenty per cent., as
    may be notified by the Government on the recommendations of the Council". So the central
    rate on these drinks is {{n:cgst_sugary_drinks_rate_pct}} per cent. Under that section it
    could not be {{n:gst_demerit_rate_pct}}.

    Step 4. Check it still stands. Notification No. 01/2026-Central Tax (Rate), in force from 1
    May 2026, changes the tariff codes in serial numbers 2 and 3 of Schedule III. It leaves
    serial number 1 alone. Its note says the 2025 notification was last amended by No. 19/2025,
    which this book does not hold. So date the rate "as amended up to 01/2026-Central Tax (Rate), in
    force 1 May 2026".

    Step 5. The States. Article 279A sends the Council's recommendations to the Union and to the
    States. The release calls {{n:gst_demerit_rate_pct}}% "a special de-merit rate" of GST,
    beside a Standard Rate of 18% and a Merit Rate of 5%. It does not split it between Union and
    States. The central notification sets central tax at {{n:cgst_sugary_drinks_rate_pct}}%. What
    each State issued is not among this book's sources, so your note says no more about it than
    the release does.

    Now rewrite the sentence.

    > At its 56th meeting on 3 September 2025 the GST Council recommended a
    > {{n:gst_demerit_rate_pct}} per cent rate on sugar-added and flavoured drinks. The Central
    > Government notified central tax on them at {{n:cgst_sugary_drinks_rate_pct}} per cent from
    > 22 September 2025 (Notification 9/2025-Central Tax (Rate), as amended up to 01/2026, in force 1
    > May 2026).

    Notice the order. The Council moved first. The notification is made "on the recommendations
    of the Council", so it could not come before them.
  analogy_breaks_when: |
    This traces the central side only. The States' notifications are not held, so the split of
    the {{n:gst_demerit_rate_pct}} per cent between Union and States is not shown here. Amendment
    19/2025 is not held either; the date to quote is the newest amendment you have opened. The
    rates hold until the Council recommends and the government notifies a change.
  numbers:
  - value: '40'
    unit: per cent, GST rate recommended on sugar-added or flavoured drinks (entry 2202 10), 56th GST Council, 3 September 2025
    citekey: pib_2163555
    quote: "All goods (including aerated waters), containing added sugar or other sweetening matter or flavoured 28% 40%"
