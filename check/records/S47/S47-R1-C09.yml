    quote: "20 per cent. in respect of goods specified in Schedule III"
- body: |
    Now see why neither side can go round the Council. Open the Constitution at Article 279A(9)
    (https://indiacode.gov.in/handle/123456789/618394). A decision needs "not less than
    three-fourths of the weighted votes of the members present and voting". The vote of the
    Central Government (the Centre) weighs "one-third of the total votes cast". The votes of all the State
    Governments together weigh "two-thirds".

    Turn the fractions into percentages.

    ```working
    3 divided by 4 = 0.75, so {{n:gst_council_majority}} is {{n:gst_council_majority_pct}} per cent
    100 divided by 3 = {{n:gst_union_vote_pct}} per cent, the Centre's weight
    200 divided by 3 = {{n:gst_states_vote_pct}} per cent, all the States together
    ```

    Now test each side alone.

    ```working
    The States in favour, the Centre against: {{n:gst_states_vote_pct}} per cent, short of {{n:gst_council_majority_pct}}
    The Centre in favour, every State against: {{n:gst_union_vote_pct}} per cent, short of {{n:gst_council_majority_pct}}
    The Centre in favour: {{n:gst_council_majority_pct}} minus {{n:gst_union_vote_pct}} = {{n:gst_states_needed_pct}} per cent still needed from the States
    ```

    Neither side can carry a decision alone. So a proposal for a higher tax on sugary drinks has
    to persuade the Union and enough of the State ministers on the Council. A note that argues
    only to the Union Finance Ministry has done half the job.

    The Article does not say how the States' {{n:gst_states_vote_weight}} is shared among the States present. It
    leaves the Council to set its own procedure (Article 279A(8)), which this book does not hold. So do not work
    out how many States a decision needs.
  analogy_breaks_when: |
    The arithmetic counts only votes of members present and voting, under the rule in Article
    279A(9). It says nothing about how often the Council votes rather than agrees, how any member
    voted at the 56th meeting, or how the States' share divides among them.
- body: |
    Now a different shape: no shared body, but two separate powers over one thing.

    Suppose an advertisement for a packaged drink makes a claim your department thinks is
    misleading. The case is made up. Two Acts reach it.

    Open the Food Safety and Standards Act (https://indiacode.gov.in/handle/123456789/586348)
    at section 24(1): "No advertisement shall be made of any food which is misleading or
    deceiving". Then open the Consumer Protection Act, 2019
    (https://indiacode.gov.in/handle/123456789/613632) at section 21(1). Where the Central
    Consumer Protection Authority is "satisfied after investigation that any advertisement is
    false or misleading", it may order it discontinued or modified.

    Now ask which department owns each Act. Open the Allocation of Business Rules
    (https://cabsec.gov.in/allocationofbusinessrules/completeaobrules/), Second Schedule. The Food
    Safety and Standards Act sits under the Department of Health and Family Welfare. The Consumer
    Protection Act, 2019 sits under the Department of Consumer Affairs. Two Acts, two departments,
    one advertisement. Your note names both and says which one you are asking to act.

    Last, the orphan. Here is a made-up line from a department memo.

    > The government should stop the sale of sugary drinks to school children.

    Which instrument? Which government? Whose subject? The memo answers none of these. Sort your
    department's three proposals by what you already know.

    ```table
    | Proposal | Who holds a part | Who moves first |
    | higher tax on sugar-sweetened drinks | the GST Council; the Central Government; the States | the GST Council, since the notification follows its recommendation |
    | a misleading drink advertisement | the Food Safety and Standards Act, section 24 (who enforces it is not traced here); the CCPA, under the Consumer Protection Act, section 21 | each Act works on its own, so name the one you ask |
    | a rule on what school canteens may sell | not yet traced: it touches food and it touches schools | trace it before you write |
    ```

    The third row is honest about a gap. A later section of this book builds the full method for
    closing it. Until then, "not yet traced" is a better line in a note than "the government".
  analogy_breaks_when: |
    These texts show that each power exists. They do not show whether either body will use it,
    how fast, or that the two would agree on the same advertisement. The CCPA's power to order
    applies only after an investigation. And the canteen row stays open: this section does not
    settle whose subject it is.
must_know:
- point: |
    "The GST Council set the tax on sugary drinks" is wrong. The Council recommends, under
    Article 279A(4). The Central Government notifies the central rate under section 9(1) of the
    Central Goods and Services Tax Act.
  kind: misconception
  bearing: public
  refs:
  - pib_2163555
  - cgst_act_2017_s9_cbic
- point: |
    Central tax on sugar-added and flavoured drinks (entry 2202 10) is
    {{n:cgst_sugary_drinks_rate_pct}} per cent. It sits in Schedule III of Notification
    9/2025-Central Tax (Rate), in force 22 September 2025, as amended up to 01/2026 from 1 May 2026
    (amendment 19/2025 not read).
    Never write that the Union levies {{n:gst_demerit_rate_pct}} per cent: section 9(1) caps the
    central rate at twenty.
  kind: number
  bearing: public
  refs:
  - cgst_notif_9_2025_rate
  - cgst_notif_1_2026_rate
  - cgst_act_2017_s9_cbic
- point: |
    Under Article 279A(9) a GST Council decision needs {{n:gst_council_majority}} of the weighted votes, with the Centre holding {{n:gst_union_vote_weight}} and
    the States together {{n:gst_states_vote_weight}}. Neither side reaches {{n:gst_council_majority_pct}} per cent alone.
  kind: consequence
  bearing: policy
  refs:
  - constitution
- point: |
    When several bodies must act, write down the order. Ask whose act the others rest on. That
    body moves first. Address your note to it, and name every other body that must act.
  kind: move
  bearing: policy
- point: |
    A proposal addressed to "the government" is addressed to no one. If you cannot yet name the
    body, write "not yet traced" and list what you will open next.
  kind: trap
  bearing: policy
- point: |
    One tax change carries several dates: recommended 3 September 2025, notified 17 September,
    in force 22 September, amended in force 1 May 2026. Quote the date of the instrument that
    supports your sentence.
  kind: trap
  bearing: public
  refs:
  - pib_2163555
  - cgst_notif_9_2025_rate
  - cgst_notif_1_2026_rate
- point: |
    A map of who shares a decision tells you whom to address and in what order. It does not tell
    you how they will vote, or how the States' votes divide.
  kind: boundary
  bearing: methodological
common_misreading: |
  "Recommended by the GST Council" is read as "in force". A recommendation becomes a tax only
  when a notification issues, and the notification carries its own date. The release of 3
  September 2025 changed no rate by itself.
reporting_sentence: |
  The GST Council recommends this rate under Article 279A, and its recommendation goes to the
  Union and the States. The Central Government notifies central tax under section 9(1) of the
  CGST Act.
exercises:
- type: retrieval
  prompt: |
    From memory: who sits on the GST Council, what share of the weighted votes does a decision
    need, and how are the votes weighted? What does section 9(1) of the CGST Act cap?
  answer: |
    The Union Finance Minister chairs it. The Union Minister of State in charge of Revenue or
    Finance sits on it. So does, from each State, its Finance or Taxation Minister or another
    minister its government nominates. A decision needs at least {{n:gst_council_majority}}
    of the weighted votes of those present and voting. The Centre's vote weighs {{n:gst_union_vote_weight}}. All the
    States together weigh {{n:gst_states_vote_weight}}.

    Section 9(1) caps central tax at {{n:cgst_sugary_drinks_rate_pct}} per cent. The Government notifies the rate on the
    Council's recommendations.
  confidence_first: true
- type: interpretation
  prompt: |
    Here are rows 1 to 4 of Schedule III of Notification No. 9/2025-Central Tax (Rate), 17
    September 2025. The heading of the Schedule is "Schedule III– 20%".

    ```table
    | S. No. | Chapter, heading, sub-heading or tariff item | Description |
    | 1 | 2202 10 | All goods (including aerated waters), containing added sugar or other sweetening matter or flavoured |
    | 2 | 2202 91 00, 2202 99 90 | Other non-alcoholic beverages [other than those specified in Schedule I of this notification] |
    | 3 | 2202 99 90 | Caffeinated Beverages |
    | 4 | 2202 | Carbonated beverages of fruit drink or carbonated beverages with fruit juice |
    ```

    Say what the {{n:cgst_sugary_drinks_rate_pct}}% is, who set it and under what power, and two things the table does not tell
    you.
  answer: |
    The {{n:cgst_sugary_drinks_rate_pct}}% is the rate of central tax on these goods. The Central Government set it by this
    notification, "on the recommendations of the Council". Its power is section 9(1) of the
    Central Goods and Services Tax Act, which caps central tax at {{n:cgst_sugary_drinks_rate_pct}} per cent.

    The table does not give the States' share, so it does not give the full rate a buyer pays.
    It does not show later changes: Notification 01/2026, in force 1 May 2026, changed the codes
    in rows 2 and 3. It also does not show which drinks are taxed at a lower rate under Schedule
    I; row 2 points there.
  skill_ref: S47-R1-K01
- type: critique
  prompt: |
    Here is a made-up line from a draft press note.

    > From 22 September 2025 the Union Government has levied {{n:gst_demerit_rate_pct}}% GST on cola, and it can raise
    > this further whenever it chooses.

    Find the errors and rewrite the sentence.
  answer: |
    First, the Union did not levy {{n:gst_demerit_rate_pct}}%. The GST Council recommended a {{n:gst_demerit_rate_pct}}% rate for these drinks.
    The Central Government notified central tax at {{n:cgst_sugary_drinks_rate_pct}}%, the most section 9(1) of the CGST Act
    allows.

    Second, the Union cannot raise it whenever it chooses. Central tax is notified "on the
    recommendations of the Council", and a Council decision needs {{n:gst_council_majority}} of the weighted
    votes. The Centre holds {{n:gst_union_vote_weight}}. Central tax is also already at the
    {{n:cgst_sugary_drinks_rate_pct}} per cent ceiling in section 9(1). To go higher, Parliament
    would first have to amend that section.

    Rewrite: "The GST Council made its recommendation on 3 September 2025. Since 22 September
    2025, central tax on sugar-added and flavoured drinks has been {{n:cgst_sugary_drinks_rate_pct}}% (Notification
    9/2025-Central Tax (Rate), as amended). A change needs a fresh Council recommendation."
  skill_ref: S47-R1-K01
- type: teaching
  prompt: |
    A journalist has three minutes and asks: "Who actually decided the tax on sugary drinks?"
    Answer in plain words, with one quotable sentence.
  answer: |
    Quotable: "The GST Council, where the Union and every State sit together, recommended it. The
    Central Government then put central tax into force by notification."

    Then the detail. The Council recommended a {{n:gst_demerit_rate_pct}}% rate on 3 September 2025. The Central
    Government's notification set central tax at {{n:cgst_sugary_drinks_rate_pct}}% from 22 September 2025. The Union's vote on
    the Council weighs {{n:gst_union_vote_weight}}, so it could not have done this alone.

    Calibrate: "I have read the central notification. I have not checked each State's, so I
    can't tell you how every State gave effect to it."
  skill_ref: S47-R1-K01
retrieval_items:
- q: What does Article 279A(4) say the GST Council does?
  a: It makes recommendations to the Union and the States, among other things on the rates of
    goods and services tax.
- q: How are votes weighted in the GST Council, and what majority does a decision need?
  a: The Central Government's vote weighs {{n:gst_union_vote_weight}} of the votes cast and all the States'
    together {{n:gst_states_vote_weight}}; a decision needs not less than {{n:gst_council_majority}} of the weighted votes of
    members present and voting.
- q: Which two Acts reach a misleading food advertisement, and under which sections?
  a: The Food Safety and Standards Act, 2006, section 24; and the Consumer Protection Act, 2019,
    section 21, through the Central Consumer Protection Authority.
- q: What is the central tax rate on sugar-added drinks of entry 2202 10, and in which instrument?
  a: The rate is {{n:cgst_sugary_drinks_rate_pct}} per cent, in Schedule III of Notification 9/2025-Central Tax (Rate), in force 22 September
    2025, as amended up to 01/2026, in force 1 May 2026 (amendment 19/2025 not read).
