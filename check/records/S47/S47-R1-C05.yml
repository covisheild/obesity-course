simplified_explanation: |
  The last section found which government may make law on a subject. This one goes inside the
  Union government to find which office holds it.

  At the top sits the Council of Ministers, led by the Prime Minister. The senior ministers in it
  form the Cabinet. Below them, the work is split among ministries, and most ministries are split
  again into departments.

  Two rulebooks, both made in 1961 and amended many times since, tell you how the split works. The
  Allocation of Business Rules say which department owns which subject. The Transaction of
  Business Rules say who decides a case, and which cases must go to the Cabinet.

  Here is why that matters. One proposal often touches several departments. When a case concerns
  more than one department, nothing is decided until they all agree, or the Cabinet decides. So
  "the government should act" names nobody. Your note has to name the department, and the entry in
  the rules that gives it the subject.
illustrations:
- body: |
    Start with the guess almost everyone makes. A proposal about food should go to the food
    ministry.

    Open the Allocation of Business Rules on the Cabinet Secretariat's website
    (https://cabsec.gov.in/allocationofbusinessrules/completeaobrules/). Check the title page first:
    "As amended upto Amendment Series no. 386 dated 22nd July, 2026". These rules change often, so
    the date matters.

    Go to the First Schedule. It lists every ministry and department. You will find the Ministry of
    Consumer Affairs, Food and Public Distribution, with its Department of Food and Public
    Distribution.

    Now go to the Second Schedule. This is where each department's subjects are listed. Read the
    Department of Food and Public Distribution's entry. Its items include "Public Distribution
    System", trade and supply of "sugar and foodstuffs other than foodgrains", and "Price control of
    sugar, foodgrains and foodstuffs". Search the entry for "safety". It is not there. Search for
    "tax". Not there either. The food department runs the grain and sugar side of food. It does not
    own food safety.

    So search the whole Second Schedule for "Food Safety and Standards Act". It turns up under the
    Department of Health and Family Welfare, item 3(a). So that is where the Central Government's
    part in a food regulation is handled.

    Now take your department's first proposal, a higher tax on sugar-sweetened drinks, and look up
    each thing it touches.

    ```table
    | the proposal touches | search the Second Schedule for | department | item |
    | the tax | "Goods and Services Tax Council" | Department of Revenue (Ministry of Finance) | 18A; the Central Goods and Services Tax Act is item 21(a) |
    | the industry that makes the drinks | "Aerated water" | Ministry of Food Processing Industries | 6, "Aerated water and soft drinks" |
    | the safety and standards of the drink | "Food Safety and Standards Act" | Department of Health and Family Welfare | 3(a) |
    | the packet it is sold in | "Packaged Commodities" | Department of Consumer Affairs | 6, "Regulation of Packaged Commodities" |
    ```

    Four departments in four ministries. The one that develops the drinks industry is not the one
    that owns the tax, and neither owns the safety standard. "The government" is four offices with
    four different jobs.
  analogy_breaks_when: |
    The table shows who owns each subject on paper, as of Amendment Series no. 386. It does not show
    that the tax is decided by the Department of Revenue. A later section shows that the rate is set
    through a council where the Union and the States both sit. And a subject listed under a
    department does not mean that department has any power to act on it. The power comes from an
    Act or the Constitution, as the last two sections showed.
- body: |
    Now the second rulebook. It tells you what happens when a proposal crosses departments.

    Open the Transaction of Business Rules on the same website
    (https://cabsec.gov.in/transactionofbusiness/transactionofbusinessrules/). Read rule 3. Business
    allotted to a department is "disposed of by, or under the general or special directions of, the
    Minister-in-charge". So a case that sits wholly in one department is that minister's to decide.

    Read rule 4(1). When a case concerns more than one department, "no decision be taken or order
    issued until all such departments have concurred". If they do not agree, the Cabinet decides.
    The Explanation under it is wide. A case counts if a decision in one department "is likely to
    affect" the business of another.

    Try it on the canteen proposal. Suppose, as a made-up case, the Union wanted a new Act on food
    sold in schools. Look up the subjects.

    ```table
    | the proposal touches | department | Second Schedule item |
    | food sold in the canteen | Department of Health and Family Welfare | 3(a), the Food Safety and Standards Act |
    | the school | Department of School Education and Literacy | 1, "Elementary Education"; 12, "Secondary Education and Vocational Guidance" |
    | children's nutrition | Ministry of Women and Child Development | 5, "National Plan of Action for Nutrition and National Nutrition Mission" |
    ```

    Three departments, so rule 4(1) applies. And it is a new Act. Turn to the Second Schedule of the
    Transaction rules, "Cases which shall be brought before the Cabinet". Entry (a) is "Cases
    involving legislation including the issue of Ordinances." Its Note adds that a Committee of the
    Cabinet may not dispose of a case of legislation. Rule 4(3) also sends every proposal for
    legislation to the Ministry of Law. So this proposal needs three departments to agree, the Law
    Ministry to be consulted, and the whole Cabinet to decide, before Parliament ever sees it.

    Last, remember your setting. Your department is in Chhattisgarh. Much of a canteen rule could be
    the State's, and the State has its own rulebook. Article 166(3) has the Governor make rules for
    the business of the State Government. Chhattisgarh's rules are not read in this book. Before you
    name a State department, open them.
  analogy_breaks_when: |
    The rules say whose agreement a decision needs. They say nothing about how long that takes, or
    whether any department will start the case at all. And the Union table does not tell you which
    State department in Chhattisgarh holds schools, health or nutrition. Only the State's own
    business rules can.
must_know:
- point: |
    The food ministry does not own food safety. Its Department of Food and Public Distribution has
    the public distribution system, grain, sugar and food prices. The Food Safety and Standards Act
    sits with the Department of Health and Family Welfare (Allocation of Business Rules, Second
    Schedule, item 3(a)). Send a food-standards proposal there, not to the food department.
  kind: misconception
  bearing: policy
  refs:
  - goi_aob_rules_1961
- point: |
    "The government" is never an answer. Name the department and the item in the Second Schedule of
    the Allocation of Business Rules that gives it the subject. Add the amendment series you read.
  kind: move
  bearing: policy
  refs:
  - goi_aob_rules_1961
- point: |
    The department that develops an industry is not the one that taxes it or sets its safety
    standards. Aerated water and soft drinks sit with the Ministry of Food Processing Industries.
    The tax sits with the Department of Revenue, and food standards with Health. A letter to the
    wrong one gets passed on, or filed.
  kind: trap
  bearing: public
  refs:
  - goi_aob_rules_1961
- point: |
    A decision in one department may affect another's business. Then nothing is decided until all
    of them agree, or the Cabinet decides (Transaction of Business Rules, rule 4(1)). In your note,
    list every department that must agree. A proposal that needs four is slower than one
    that needs one.
  kind: consequence
  bearing: policy
  refs:
  - goi_tob_rules_1961
- point: |
    Every proposal for a new Act goes to the Ministry of Law (rule 4(3)). It then goes to the whole
    Cabinet before Parliament sees it (Second Schedule, entry (a)). A proposal that needs a new Act
    is first a proposal to a department, and then to the Cabinet.
  kind: consequence
  bearing: policy
  refs:
  - goi_tob_rules_1961
- point: |
    These rules show who owns a subject and whose agreement a decision needs. They change by
    amendment, so check the series number and date. They give no department the power to make a
    rule or a regulation; that comes from an Act. And they cover the Union only. For Chhattisgarh,
    open the State's own business rules (Article 166(3)) before naming a State department.
  kind: boundary
  bearing: methodological
  refs:
  - goi_aob_rules_1961
  - constitution
exercises:
- type: retrieval
  prompt: |
    Without looking back, write down:

    1. The Article under which the President makes the rules for the Government's business.
    2. The two sets of rules made under it, and what each tells you.
    3. Which Schedule of the Allocation of Business Rules lists departments, and which lists their
       subjects.
    4. What rule 4(1) of the Transaction of Business Rules says about a case that concerns more
       than one department.
  answer: |
    1. Article 77(3) of the Constitution.

    2. The Allocation of Business Rules, 1961 say which department owns which subject. The
    Transaction of Business Rules, 1961 say who decides a case. They also say which cases must go to
    the Cabinet.

    3. The First Schedule lists the ministries and departments. The Second Schedule lists the
    subjects each one owns.

    4. No decision is taken or order issued until all the departments concerned agree. If they do
    not, the Cabinet decides. A case counts if a decision in one department is likely to affect the
    business of another.
  skill_ref: S47-R1-K01
  confidence_first: true
- type: interpretation
  prompt: |
    Your department's third proposal is a warning label on packaged foods high in sugar, salt or fat.
    Use the Second Schedule of the Allocation of Business Rules. Name the Union department that leads
    on it, and any others that rule 4(1) might bring in. Say what the lookup does not tell you.
  answer: |
    The lead is the Department of Health and Family Welfare. Item 3(a) gives it the Food Safety and
    Standards Act, the Act under which a food label is regulated.

    Others the Explanation to rule 4(1) might bring in, because the decision could affect their
    business:

    - the Department of Consumer Affairs, item 6, "Regulation of Packaged Commodities";
    - the Ministry of Food Processing Industries, whose items cover the industries that make
      biscuits, confectionery, ready-to-eat foods and soft drinks.

    Whether either must in fact concur depends on how the case is framed. The lookup cannot settle
    that.

    What the lookup does not tell you: which body makes the label rule, and under what section. The
    rules give a department a subject, not a power. The power to make the regulation comes from the
    Act.
  skill_ref: S47-R1-K01
- type: critique
  prompt: |
    A draft letter from your department is addressed to the Ministry of Food Processing Industries.
    It asks the Ministry "to notify a higher tax on aerated drinks and stricter safety limits for
    them". Find what is wrong with the addressee.
  answer: |
    The Ministry of Food Processing Industries owns "Aerated water and soft drinks" (item 6) as an
    industry to develop. It owns neither of the two things the letter asks for.

    The tax: the Goods and Services Tax Council is with the Department of Revenue (item 18A). So is
    the Central Goods and Services Tax Act (item 21(a)).

    The safety limits: the Food Safety and Standards Act is with the Department of Health and Family
    Welfare (item 3(a)).

    Split the letter in two, addressed to the departments that own each subject. Or address one note
    to both and say that rule 4(1) needs them to agree. Either way, cite the items.
  skill_ref: S47-R1-K01
- type: teaching
  prompt: |
    A journalist has three minutes. The question: "Which ministry is responsible for sugary drinks
    in India?" Answer without jargon. Give one quotable sentence, and say how sure you are.
  answer: |
    Quotable: "No single ministry owns a sugary drink. The tax, the factory and the safety standard
    each belong to a different office."

    Then the detail. The Union government's own rulebook gives the drinks industry to the Ministry
    of Food Processing Industries. It gives tax to the Finance Ministry's Department of Revenue. It
    gives food safety law to the Health Ministry. The packet falls under Consumer Affairs.

    How sure: certain about the rulebook as amended up to 22 July 2026, because it is published.
    Less sure about what any of them will do. The rulebook says who owns a subject, not who acts.
retrieval_items:
- q: Which department holds the Food Safety and Standards Act in the Union government?
  a: The Department of Health and Family Welfare (Allocation of Business Rules, Second Schedule,
    item 3(a)), not the Department of Food and Public Distribution.
- q: What does rule 4(1) of the Transaction of Business Rules require?
  a: When a case concerns more than one department, no decision until all of them agree; failing
    that, the Cabinet decides.
- q: Which cases go before the whole Cabinet and cannot be disposed of by a Cabinet Committee?
  a: Cases involving legislation, including Ordinances (Second Schedule, entry (a), and its Note).
