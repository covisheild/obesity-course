- body: |
    Now watch the same evidence produce two conclusions. Suppose two members of your department,
    both made up, read the same projection and agree on it. They still disagree about what to
    propose.

    The first says: "Cutting how much sugary drink children consume matters most. A higher price is
    a cost worth paying. Propose a further rise."

    The second says: "A tax on a drink that poorer households also buy may be regressive." The
    textbook meaning of a regressive tax is "a tax applied at a lower overall rate as individuals'
    income rises". In other words, it takes a bigger share of a poorer household's income. "I would
    propose a rise only if the money went back into children's health in the same districts."

    Write each argument with all its premises.

    ```table
    | | First colleague | Second colleague |
    | evidence premise | an extra tax could cut demand by {{n:summan_model_demand_fall}} | the same |
    | value premise | less sugary drink for children outweighs a higher price | a cost that falls harder on poorer households must be returned to them |
    | conclusion | propose a further rise | propose a rise only with the money returned |
    ```

    The evidence row is the same. The conclusions differ because the value row differs. More
    modelling of demand would not move either of them.

    Some of the disagreement is about facts, though. How much of the extra tax would poorer
    households actually pay? A study of purchases by household income could answer that. It would
    tell the second colleague how large the regressive effect is. It would not tell her whether
    that size is acceptable.

    Then check feasibility, because the second option depends on it. Summan and colleagues write
    that earmarking — tying a tax's money to one use — "would be challenging as India does not
    allow for the earmarking of tax revenues, and would require additional legislation". So the
    second proposal needs a new law before it needs a new rate. That changes who must act, and the
    tracing method tells you how to find them.

    The researcher's job here is not to pick between the colleagues. It is to lay out both
    options, with the same evidence, its uncertainty, and the value premise each one rests on, so
    that the people who decide can see what they are deciding.
  analogy_breaks_when: |
    The two colleagues and their sentences are made up. Summan and colleagues do report that
    "concerns over regressivity, farmer livelihoods, and administrative feasibility" have to be
    engaged with. They do not measure how regressive a tax on sugary drinks in India is, and
    neither does this section.

    Their statement on earmarking is theirs, and the law behind it is not traced here. Before a note
    relies on it, find the provision.

    Not every value disagreement hides a factual one. This one did. Some do not, and then the
    honest note says the choice is a value choice and stops there.
