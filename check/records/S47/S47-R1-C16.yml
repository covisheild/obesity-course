reporting_sentence: |
  "The best available evidence, [named source], suggests that [option] would [effect, with its
  range], in [the setting it was measured or modelled in]. Whether that effect is worth [the cost,
  and who bears it] is a judgement the evidence does not make. So is whether [deciding body] can
  act on it now."
exercises:
- type: critique
  prompt: |
    A made-up abstract ends: "Our survey found that most college canteens in the district sell
    sugary drinks. Therefore the State must ban the sale of sugary drinks in college canteens."

    Lay the argument out as premises and a conclusion. Name each premise the conclusion needs that
    the survey does not supply, and say whether evidence could supply it.
  answer: |
    Premise (evidence): a survey found that most college canteens in the district sell sugary
    drinks. The abstract and its finding are made up for this exercise.

    Conclusion: the State must ban the sale of sugary drinks in college canteens.

    Grant the premise. The conclusion still needs these, and the survey supplies none of them.

    ```table
    | Missing premise | Could evidence supply it? |
    | sugary drinks sold in canteens add to the problem the ban is meant to solve | partly: studies of what students drink, and where they buy it |
    | a ban would change what students drink, rather than where they buy it | partly: studies of similar bans, judged for whether they apply here |
    | the change is worth the limit on choice and the canteens' lost sales | no: a value premise |
    | the State holds the power to ban sales in these canteens | no: a question of law, answered by tracing the power, not by a survey |
    | the ban can be enforced in every canteen | partly: evidence on enforcement, plus a judgement of feasibility |
    ```

    The survey describes how big one part of the problem is in one district. That is useful. It
    is the first of the three things evidence can do, and only the first.

    A version the survey supports: "Most college canteens in the district sold sugary drinks.
    This tells us how widely they are sold. It does not tell us whether a ban would change what
    students drink, or whether the State should impose one."
- type: teaching
  prompt: |
    A journalist has three minutes. She asks: "Does the evidence prove that a tax on sugary drinks
    works?" Answer her with no jargon, with honest confidence, and give her one sentence she could
    quote.
  answer: |
    Start by splitting her word "works". It could mean that people buy fewer sugary drinks. It
    could mean that fewer people develop obesity. It could mean that the tax is worth what it costs.
    These are three different questions.

    Then give each its answer. On buying, there is modelling evidence. Summan and colleagues report
    a study projecting that an extra tax of {{n:summan_model_tax_range}} could cut demand by {{n:summan_model_demand_fall}}. That is a
    projection, with a wide range, and it is about buying, not about weight. On obesity, a demand
    model says nothing directly. On whether it is worth it, no study can answer. That depends on how
    much weight you give to health, to prices for poorer families and to jobs. The people deciding
    should argue that out in the open.

    End by saying what would change the picture: studies that follow what happens to buying and to
    weight after a real tax.

    One sentence she could quote: "The evidence suggests a higher tax would cut how much sugary
    drink people buy. Whether it is worth doing is a choice no study can make for us."
- type: retrieval
  prompt: |
    From memory: name the three kinds of question evidence can answer in a policy choice, and the
    four it cannot settle on its own. Then say what extra premise any sentence containing "should"
    needs.
  answer: |
    Evidence can answer how big a problem is and for whom, what an option does compared with
    something else, and what it costs.

    It cannot settle four things on its own. Which outcomes matter most. Whether the spread of
    gains and losses is fair. Whether the option can be carried out. Whether now is the time.

    A sentence containing "should" needs a value premise: a premise saying what matters, or what
    ought to be done.
quantitative: false
retrieval_items:
- q: What is the difference between evidence and a conclusion?
  a: Evidence is facts, known through observation, offered in support of a conclusion. The
    conclusion is what is argued from them, and in policy it also needs judgements.
- q: Why does no study prove a policy?
  a: A policy conclusion says what should be done, so it needs a value premise as well as evidence,
    plus judgements of applicability, feasibility and timing.
- q: What does "evidence-informed policymaking" mean?
  a: Finding and judging the evidence systematically and openly, while recognising that the decision
    also weighs values, interests and other factors.
- q: What is a regressive tax?
  a: A tax applied at a lower overall rate as income rises, so it takes a bigger share of a poorer
    household's income.
