definition:
  text: |
    Evidence is a set of facts, known through observation, offered in support of a conclusion. It
    is not the conclusion.

    In a policy choice, evidence can answer three kinds of question: how big a problem is, and for
    whom; what an option does, compared with doing something else; and what it costs. The choice
    also turns on questions that evidence does not settle.

    Evidence-informed policymaking names a process in which the evidence used, and the judgements
    made about it, are found and stated systematically and openly. The researcher's part in it is
    to set out the options with the evidence for each, its uncertainty, and the judgements the
    choice still needs.
