simplified_explanation: |
  Take any policy choice and split it into questions. Some of them, evidence can answer:

  - **How big is the problem, and for whom?** A survey can count it.
  - **What does an option do, compared with something else?** A study or a model can estimate it.
  - **What does it cost?** That can be worked out.

  Others, evidence cannot settle on its own:

  - **Which outcomes matter most?** That is a question of values.
  - **Who gains and who loses, and is that fair?** Whether it is fair is a value judgement.
  - **Can it be done?** That depends on which body holds the power, what the law allows, and the
    money. This is called feasibility.
  - **Is now the time?** That is a judgement of timing.

  So any sentence that says "the government should" has a hidden premise. It is a value premise —
  a premise that says what matters, or what ought to be done. Leave it hidden, and the evidence
  seems to say something it cannot say.
illustrations:
- body: |
    Start with a sentence that goes wrong. Suppose a made-up draft of your department's note ends:

    "Modelling evidence proves that the GST Council should raise the tax on sugary drinks further."

    Take it apart the way you take apart any argument: premises first, then the conclusion. The
    evidence is a modelling study that Summan and colleagues report in their 2026 paper on food
    taxes in India. It "found that a 10%–30% additional health tax could reduce demand by 7%–30%
    for SSBs". SSBs are sugar-sweetened beverages: drinks with sugar added.

    Premise: a model projects that an extra tax of {{n:summan_model_tax_range}} could cut demand for sugar-sweetened
    drinks by {{n:summan_model_demand_fall}}.

    Conclusion: the GST Council should raise the tax further.

    Grant the premise. Now ask whether the conclusion follows. It does not, and you can name each
    gap.

    ```table
    | Question the conclusion needs | Can evidence settle it? | What it needs |
    | Would a further rise cut demand here, now? | partly | a judgement that the model applies to India's drinks at today's rate |
    | Would less demand mean less obesity? | partly | evidence on weight, which a demand model does not give |
    | Is a fall in demand worth the higher price paid by those who keep buying? | no | a value premise |
    | Who pays more, and who loses income? | partly | evidence can say who; whether that is fair is a value premise |
    | Would the Council, where the Union and the States sit, agree? | no | a judgement of feasibility |
    | Is this the moment, soon after the 2025 change? | no | a judgement of timing |
    ```

    Three of these gaps are questions evidence can at least narrow. Three are not. The draft hid
    all six inside one word: "proves".

    Notice the starting point too. The 2025 reform already moved sugar-added drinks to a combined
    rate of {{n:gst_demerit_rate_pct}}%. The study Summan and colleagues cite modelled an
    "additional" tax. Their sentence does not say what the tax was additional to. So you cannot
    tell from it whether the model's starting rate matches today's.

    Now rewrite the sentence so that it says only what it can:

    "Summan and colleagues report a modelling study projecting that an additional health tax of
    {{n:summan_model_tax_range}} could reduce demand for sugar-sweetened drinks by {{n:summan_model_demand_fall}}. We have not read the
    study, and the range is wide. Whether a further rise is worth its cost to the households that
    pay it, and whether the GST Council would agree, are judgements this evidence does not make."

    The rewrite is longer and less exciting. It is also the version that survives a hostile reader.
  analogy_breaks_when: |
    The {{n:summan_model_demand_fall}} is a projection of demand from a model, as Summan and colleagues report it. It is
    not a measured fall, and it is not a change in weight or in obesity. The course has not read
    the study, so the figures can be stated only as theirs. They hold for the tax range the study
    modelled, {{n:summan_model_tax_range}} extra, and for the setting it modelled, which the quoted sentence does not
    name.

    The table's "partly" and "no" are not fixed for all time. A good study of who buys sugary drinks
    at each income level would turn "who pays more" from partly into mostly. No study turns "is it
    worth it" into a fact.
