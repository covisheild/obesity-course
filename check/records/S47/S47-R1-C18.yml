common_misreading: |
  The tempting reading is that a finished note is a case for the proposal. It is not. A note can
  name the body, the provision, the process and every vote that would be needed. It can still
  describe a proposal that is weak, or that will never be taken up. The note is an address and a map. Whether
  to go there is the decision it leaves to the reader.
reporting_sentence: |
  "The GST Council recommends the rate (Constitution, Article 279A). The Central Government notifies
  the central tax under section 9(1) of the CGST Act, up to {{n:cgst_sugary_drinks_rate_pct}} per cent. Each State notifies its own
  tax under its own GST Act. Checked on 2 October 2026."
