definition:
  text: |
    The build target of this book is a written one-page note on one Indian policy proposal that
    names the body that would have to act. A note meets the target when it answers nine questions,
    in this order.

    Every factual line rests on a source that has been opened, with the passage found and read against
    the line.
  references:
  - citekey: openstax_amgov_4e
    kind: textbook
    locator: '16.4 Policymakers, "Policy Analysts", first paragraph'
    quote: |-
      policy analysts try to identify all the possible choices available to a decision maker and then gauge their impacts if implemented. The goal of the analyst isn’t really to encourage the implementation of any of the options; rather, it is to make sure decision makers are fully informed about the implications of the decisions they do make.
    verified:
      resolved_id: https://openstax.org/books/american-government-4e/pages/16-4-policymakers
      opened: true
      claim_located: true
      checked_on: '2026-10-02'
      note: |-
        Textbook anchor for this derivable concept: the note as an analyst's document. A US text,
        used for the role only. Every Indian fact below rests on its own instrument.
