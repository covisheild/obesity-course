simplified_explanation: |
  The note answers nine questions, always in this order.

  ```table
  | Line | Question | The tool, from |
  | 1 | What is the proposal, in one sentence? | a proposal is not a policy |
  | 2 | What instrument would it need? | the tracing method, step 1 |
  | 3 | Whose subject is it? | Union, State or local; the tracing method, step 2 |
  | 4 | Which body decides, under which provision? | where power comes from; the tracing method, step 3 |
  | 5 | What process must it pass, and how far has it got? | how Acts and rules are made; the tracing method, step 4 |
  | 6 | Who else must agree? | when no single body decides; the tracing method, step 5 |
  | 7 | What frame is it argued in, and what is the counter-frame? | reading the frame |
  | 8 | What can the evidence settle, and what can it not? | what evidence can settle |
  | 9 | Which job does this note do? | informing and campaigning |
  ```

  Lines 2 to 6 end in the one sentence the tracing method taught: X decides, under Y, by process Z,
  with W's agreement.

  Two rules hold for every line.

  First, check each factual line against the passage it rests on. Find the source. Confirm it is the one named. Find
  the passage. Read it.

  Second, write down what you did not check. If you did not read the State's own notification, say so in the note.

  Put a date on the note. A reader needs to know when your note was true.
illustrations:
- body: |
    Start with the failure, because it is the commonest one. Suppose this is the first draft of your
    note's middle, made up for the example. Every line in it sounds right.

    > 1. Proposal: tax sugary drinks more heavily, to reduce obesity among the district's school
    >    children.
    > 2. The Union government taxes sugary drinks at {{n:gst_demerit_rate_pct}}%.
    > 3. The GST Council decided this rate at its 56th meeting.
    > 4. The 2025 reform raised the tax on sugary drinks by 12 percentage points, from 28% to
    >    {{n:gst_demerit_rate_pct}}%.
    > 5. The Ministry of Health and Family Welfare should ask the GST Council to raise it further.

    A percentage point is the gap between two percentages: from 28% to {{n:gst_demerit_rate_pct}}% is 12 points. Now check
    each line against the passage it should rest on.

    ```table
    | Line | What the source says | Verdict |
    | 1 | not a fact; it is the proposal | keep, but "to reduce obesity" is the proposer's aim, not a finding |
    | 2 | CGST Act s.9(1): the central tax is "not exceeding twenty per cent."; Notification 9/2025 puts these drinks in its {{n:cgst_sugary_drinks_rate_pct}} per cent schedule | wrong: the Union's tax is {{n:cgst_sugary_drinks_rate_pct}} per cent; {{n:gst_demerit_rate_pct}}% is the combined rate the release gives |
    | 3 | the release itself: its recommendations take effect through notifications, "which alone shall have the force of law" | wrong body for the decision: the Council recommends; the Central Government and the States notify |
    | 4 | the release's table: 28% to {{n:gst_demerit_rate_pct}}%; a 2026 review: the reform folded the earlier 28% rate and a 12% cess into one rate | misleading: 28 plus 12 is {{n:gst_demerit_rate_pct}}, so the combined rate on these drinks did not rise |
    | 5 | Article 279A(2): the members are finance or taxation ministers, or a minister each State names | wrong address, and "should" is campaigning in a note meant to inform |
    ```

    Check the arithmetic in line 4.

    ```working
    {{n:gst_demerit_rate_pct}} minus 28 = 12
    28 plus 12 = {{n:gst_demerit_rate_pct}}
    ```

    The first line is the gap the draft reports. The second is why the gap means nothing here: the
    old 28% came with a 12% cess on top, so the total was already {{n:gst_demerit_rate_pct}}. A cess is an extra tax charged
    alongside the main one.

    Four of the five lines fail. Not one of the four failures is a typing slip. Each is a claim that
    sounds like the sources and is not in them.
  analogy_breaks_when: |
    The draft is made up, and its errors are gathered on purpose. A real first draft usually has one
    or two, which is harder: one wrong line among right ones is easier to miss.

    The cess point holds for the drinks the review describes, which paid the 28% rate and the 12%
    cess. The release also moved "other non-alcoholic beverages" from 18% to {{n:gst_demerit_rate_pct}}%, and the sources held
    do not say what cess, if any, those paid. For them, do not repeat the "did not rise" line.
- body: |
    Now build the note properly, one line at a time. The date you check everything is 2 October 2026.

    **Line 1. The proposal.** "Raise the goods and services tax (GST) on sugar-added and flavoured
    drinks above its present rate." One sentence, no claim about effects.

    **Lines 2 to 4. Instrument, subject, body.** The section on finding who decides traced this
    proposal. The instrument is a rate notification. The subject is both governments' under Article
    246A(1). The GST Council recommends rates to the Union and the States (Article 279A(4)(e)). The
    Central Government notifies the central tax under section 9(1) of the CGST Act, up to
    {{n:cgst_sugary_drinks_rate_pct}} per cent. Each State notifies its own tax under its own GST
    Act.

    **Line 5. The process, and where it stands.** Look at what the 56th meeting recommended for drinks.
    Here are the rows for drinks under heading 2202 in the release's table. The names are short
    forms of the release's own descriptions: "sugar or flavour" stands for drinks "containing added
    sugar or other sweetening matter or flavoured", and "other drinks" for "other non-alcoholic
    beverages".

    ```table
    | Drink | Before (%) | After (%) |
    | sugar or flavour | 28 | 40 |
    | other drinks | 18 | 40 |
    | carbonated fruit | 28 | 40 |
    | fruit or juice | 12 | 5 |
    | soya milk | 12 | 5 |
    | plant-based milk | 18 | 5 |
    ```

    The recommendation went in both directions: up for sweetened and flavoured drinks, down for drinks
    based on fruit, soya or plant milk. Then the instrument. Notification No. 9/2025-Central Tax
    (Rate) put "All goods (including aerated waters), containing added sugar or other sweetening matter
    or flavoured" in its Schedule III, at {{n:cgst_sugary_drinks_rate_pct}} per cent central tax, from
    22 September 2025. Notification No. 01/2026-Central Tax (Rate), in force 1 May 2026, re-wrote two
    other entries of Schedule III and left that one alone.

    Two things you did not check go in the note. 01/2026 names an earlier amendment, 19/2025 of 31
    December 2025, which you have not read. And you have not read Chhattisgarh's own State tax
    notification.

    **Line 6. Who else must agree.** Article 279A(9) says a Council decision needs {{n:gst_council_majority}} of the
    weighted votes cast. The Union's vote counts for {{n:gst_union_vote_weight}}. The States' votes, all together, count
    for {{n:gst_states_vote_weight}}. The section on when no single body decides turned these into percentages.

    ```working
    3 divided by 4 = 0.75, so {{n:gst_council_majority}} is {{n:gst_council_majority_pct}} per cent
    Union alone: {{n:gst_union_vote_pct}} per cent, short of {{n:gst_council_majority_pct}}
    States alone: {{n:gst_states_vote_pct}} per cent, short of {{n:gst_council_majority_pct}}
    with the Union's yes: {{n:gst_council_majority_pct}} minus {{n:gst_union_vote_pct}} = {{n:gst_states_needed_pct}} per cent still needed from the States
    ```

    So neither side can change the rate alone. The article does not say how the States' {{n:gst_states_vote_weight}}
    is shared among them, so do not work out how many States a change needs. Chhattisgarh's voice in
    the vote is the minister its State Government names to the Council (Article 279A(2)(c)).

    **Line 7. The frame.** The section on reading the frame ran its five lines on this release. Here
    is the sentence that created the rate, read the same way.

    ```table
    | Line | The release's words |
    | Problem | "the current 4-tiered tax rate structure" |
    | Cause | not stated |
    | Judgement | "citizen-friendly", "Simple Tax", "de-merit" |
    | Remedy | "a 2 rate structure ... a special de-merit rate of 40% for a select few goods and services" |
    | Left out | why these goods are de-merit; any health reason; who pays |
    ```

    The release frames the rate as part of a simpler tax, with a class of goods to be taxed hardest.
    It gives no health reason in that sentence. The health frame is argued by others. The 2026 review
    reads the de-merit class as "signalling a shift towards public health considerations"; that is
    the review's reading, not the release's words. The same review lists advocacy groups whose role
    includes arguing for higher taxes on unhealthy foods. Against
    the proposal stand three counter-frames, all reported in the same review. A health finance official
    it interviewed said "the tax policy is supposed to raise revenue and that's it". Taxes on such
    foods are seen as regressive, which means they take a larger share of a poorer buyer's income.
    And the drinks industry argues for lower rates and against the de-merit class.

    **Line 8. The evidence.** What can it settle, and what not?

    ```table
    | Question | What the sources held say | What that does not mean |
    | How big is the problem? | in 2018, Indian adults reported about 0.2 servings of sugar-sweetened drinks a week, against 0.7 for South Asia | nothing about children, or about this district; self-reported intake |
    | What would a higher tax do? | one modelling study, reported in the review: an extra tax of {{n:summan_model_tax_range}} could cut demand by {{n:summan_model_demand_fall}} | a model's estimate, not a change measured in India; demand, not weight |
    | What did the 2025 change do? | the 28% rate and 12% cess became one {{n:gst_demerit_rate_pct}}% rate | not a rise in the combined rate on these drinks |
    | Should the rate rise further? | no evidence can say | a choice between health, revenue and the cost to poorer buyers |
    ```

    **Line 9. The job.** The committee asked for the options, so the note informs. It says so in its
    first line.

    Here is the note, as it goes to the committee.

    > **A higher tax on sugar-sweetened drinks: who decides.** For the district committee. Checked
    > on 2 October 2026.
    >
    > This note informs. It sets out who decides and what the evidence says. It does not recommend.
    >
    > *Proposal.* Raise the GST on sugar-added and flavoured drinks above its present rate.
    >
    > *Who decides.* The GST Council recommends GST rates to the Union and the States (Constitution,
    > Article 279A). The Central Government notifies the central tax under section 9(1) of the CGST Act,
    > up to {{n:cgst_sugary_drinks_rate_pct}} per cent. Each State notifies its own tax under its own
    > GST Act.
    >
    > *Where it stands.* After its 56th meeting, on 3 September 2025, the Council recommended a special
    > de-merit rate of {{n:gst_demerit_rate_pct}}% that covers these drinks. The Central Government's
    > Notification 9/2025-Central Tax (Rate) put them in its {{n:cgst_sugary_drinks_rate_pct}} per cent
    > schedule from 22 September 2025. A 2026 amendment, in force 1 May 2026, left that entry
    > unchanged. We have not checked the December 2025 amendment it names, or Chhattisgarh's own
    > notification.
    >
    > *Who else must agree.* A Council decision needs {{n:gst_council_majority}} of the weighted votes cast. The
    > Union's vote counts for {{n:gst_union_vote_weight}} and the States' together for {{n:gst_states_vote_weight}}, so neither can change
    > the rate alone. Chhattisgarh's voice is the minister the State Government names to the Council.
    >
    > *How it is argued.* The release that set the rate presents it as part of a simpler tax, with a
    > de-merit class for a few goods, and gives no health reason. A 2026 review reads the de-merit
    > class as a shift towards health. Advocacy groups argue for higher taxes on unhealthy foods. Against: the view that tax policy exists to raise
    > revenue; the view that such taxes fall hardest on poorer buyers; and an industry that argues for
    > lower rates.
    >
    > *What the evidence says.* One modelling study, reported in a 2026 review, estimated that an extra
    > tax of {{n:summan_model_tax_range}} could cut demand for these drinks by {{n:summan_model_demand_fall}}. That is a model, not a change
    > measured in India, and we have not read the model itself. The same review says the 2025 change
    > folded an earlier 28% rate and a 12% cess into one rate, so the combined rate on these drinks did
    > not rise. None of the sources behind this note measured the tax's effect on children's weight.
    >
    > *What it cannot settle.* Whether to raise the rate weighs health against revenue and the cost to
    > poorer buyers. That judgement belongs to the people who decide.

    Last, check it line by line, as you checked the failed draft.

    ```table
    | Note line | Source opened | Passage found and read |
    | Council recommends rates | Constitution, Article 279A(4) | yes |
    | central tax up to {{n:cgst_sugary_drinks_rate_pct}} per cent | CGST Act, section 9(1) | yes |
    | each State notifies its own tax | Constitution, Article 246A(1) | yes; the State's own Act and notification not read, and the note says so |
    | {{n:gst_demerit_rate_pct}}% recommended, 3 September 2025 | the release of that date | yes |
    | {{n:cgst_sugary_drinks_rate_pct}} per cent schedule from 22 September 2025 | Notification 9/2025 | yes |
    | 2026 amendment left the entry alone | Notification 01/2026 | yes; the December 2025 amendment not read, and the note says so |
    | {{n:gst_council_majority}}, {{n:gst_union_vote_weight}}, {{n:gst_states_vote_weight}} | Constitution, Article 279A(9) | yes |
    | Chhattisgarh's minister | Constitution, Article 279A(2)(c) | yes |
    | the frames and counter-frames | the release; the 2026 review | yes |
    | the modelled {{n:summan_model_demand_fall}} | the 2026 review | yes in the review; the model itself not read, and the note says so |
    | 28% and 12% cess became {{n:gst_demerit_rate_pct}}% | the 2026 review | yes |
    ```

    Every line is either checked, or named as not checked.
  analogy_breaks_when: |
    The note is true as of the date on it. The next GST Council meeting, the next rate notification
    or a State's own notification can change line 5 without anything else changing. Before you reuse
    it, open the newest amendment again.

    The note says who decides and how the argument runs. It does not say whether the Council will
    act, and it does not say whether a higher rate would change what children in the district drink
    or weigh. A complete note can describe a proposal that goes nowhere.

    The two counter-frames from the review come from {{n:summan_kii_n}} interviews, mostly with people based in
    Delhi, and a review of published work. They show that the arguments exist. They do not show how
    widely each is held.
