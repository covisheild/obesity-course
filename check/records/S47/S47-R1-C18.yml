must_know:
- point: |
    Write the trace sentence before anything else: X decides, under Y, by process Z, with W's
    agreement.
  kind: move
  bearing: policy
- point: |
    The error is to write "the GST Council sets the rate". It recommends. Write "recommends", and
    name the notification.
  kind: misconception
  bearing: policy
  refs:
  - pib_2163555
  - constitution
- point: |
    Refuse "the Union taxes sugary drinks at {{n:gst_demerit_rate_pct}}%". Section 9(1) of the CGST
    Act caps the central tax at {{n:cgst_sugary_drinks_rate_pct}} per cent, and the central
    notification puts these drinks at that rate. The {{n:gst_demerit_rate_pct}}% is the combined rate
    the release gives.
  kind: trap
  bearing: public
  refs:
  - cgst_act_2017_s9_cbic
  - cgst_notif_9_2025_rate
- point: |
    Do not read "28% to {{n:gst_demerit_rate_pct}}%" as a rise of 12 points in the tax on sugary drinks. A 2026 review reports
    that the old 28% came with a 12% cess, and the 2025 change folded both into one rate.
  kind: trap
  bearing: methodological
  refs:
  - summan_2026_foodtax
- point: |
    Address the note to a member of the body that decides, or to whoever names that member. For a GST
    rate, the State's voice on the Council is the minister its State Government names.
  kind: consequence
  bearing: policy
  refs:
  - constitution
- point: |
    Date the note, name the newest amendment you opened, and name what you did not open.
  kind: move
  bearing: methodological
- point: |
    Put the frame in the note, including the one the deciding body itself uses.
  kind: consequence
  bearing: policy
- point: |
    The note tells its reader who can act, through which instrument, and how the argument runs. It
    does not tell them whether that body will act, or whether the instrument would change anyone's
    health.
  kind: boundary
  bearing: policy
exercises:
- type: retrieval
  prompt: |
    From memory: list the nine lines of the note in order, and the two rules every line must pass.
  answer: |
    The nine lines:

    1. The proposal, in one sentence.
    2. The instrument it needs.
    3. Whose subject it is.
    4. The deciding body and its provision.
    5. The process and how far it has got, with a date.
    6. Who else must agree.
    7. The frame and the counter-frame.
    8. What evidence can and cannot settle.
    9. Which job the note does.

    The two rules: check every factual line against the passage it rests on. Name in the note
    whatever you did not check.
- type: build
  prompt: |
    Write your own one-page note on one Indian policy proposal on obesity, naming the deciding body.
    Choose a proposal other than the tax on sugar-sweetened drinks. Two from this book are open to you.
    One is a rule on what school canteens may sell. The other is a warning label on packaged foods high
    in sugar, salt or fat. Or choose one from your own setting.

    Produce:

    - the note, on one page, in the nine lines, with the date you checked it;
    - beneath it, a table with one row for each factual line: the source you opened, and whether you
      found and read the passage;
    - one sentence saying which job the note does.
  answer: |
    There is no single right note. Check yours against this list.

    1. Line 1 is one sentence that says what someone wants, with no claim about its effects.
    2. Line 2 names a kind of instrument: an Act, a rule or regulation, a rate or order notified under
       an Act, or a scheme.
    3. Lines 3 and 4 name a body, not "the government", and a numbered provision. If you could not
       find one, the note says where the trace stopped and which document would settle it. For the
       canteen rule, this book's sources do not settle whose subject it is. A note that says so, and
       names the candidates, passes. A note that guesses fails.
    4. Line 5 names the instrument now in force, if there is one, with its number and date, and the
       newest amendment you opened.
    5. Line 6 names every other body whose agreement the process needs.
    6. Line 7 quotes the words that carry the frame, from a real text, and gives a counter-frame.
    7. Line 8 separates what evidence can say from the judgement it cannot make. Every figure has its
       population, year and source, and a modelled figure is called a model.
    8. Line 9 says which job the note does, and nothing in it does the other job.
    9. Every row of your table says "yes", or the note names that line as unchecked.

    Did you mean to inform, and does a line still say "should"? Then move it into a sentence that says
    it is a judgement.
  skill_ref: S47-R1-K01
- type: critique
  prompt: |
    A colleague hands you this made-up one-page note on the second running proposal of this book.

    > *A rule on school canteens.* The government should ban sugary drinks in school canteens. The
    > Ministry of Education will make this rule. Studies prove that banning sugary drinks in schools
    > reduces obesity. This is the only responsible choice for our children.

    List what is wrong with it, against the nine lines and the two rules.
  answer: |
    - Line 1: "The government should ban" is a demand, not a proposal sentence. Write what is wanted:
      "A rule that school canteens may not sell sugary drinks."
    - Line 2: no instrument or scheme is named. An Act, a rule under an existing Act, an order, or a scheme
      condition? Each goes to a different body.
    - Lines 3 and 4: "the Ministry of Education will make this rule" names a ministry with no
      provision, and "will" claims it is decided. Whose subject a canteen rule is has not been traced.
      This book's sources do not settle it, so the note should say where the trace stops.
    - Lines 5 and 6: no process, no date, no one else who must agree.
    - Line 7: no frame is named. The note's own frame (children's protection, "the only responsible
      choice") is not marked as a frame, and no counter-frame is given.
    - Line 8: "studies prove" names no study, no population and no year. A study can show what
      happened to what children bought or weighed. It cannot prove a policy is right.
    - Line 9: the note campaigns ("should", "the only responsible choice") without saying it does.
    - Rule 1: not one line can be checked, because no source is named.
    - Rule 2: nothing is marked as unchecked, so the reader cannot tell which claims rest on anything.
  skill_ref: S47-R1-K01
- type: interpretation
  prompt: |
    Your own note has a frame too. Take the "Proposal" and "How it is argued" paragraphs of the
    finished note above. Run the five lines from the section on reading the frame on them. Then say
    what the note leaves out, and whether that is a fault.
  answer: |
    ```table
    | Line | The note's words |
    | Problem | not stated as a problem; the note is about who decides on "a higher tax on sugar-sweetened drinks" |
    | Cause | not stated |
    | Judgement | avoided on purpose: "It does not recommend" |
    | Remedy | the proposal itself: "Raise the GST on sugar-added and flavoured drinks" |
    | Left out | every other measure, such as a school-canteen rule or a label; other foods and drinks; what the State Government itself wants |
    ```

    The note never names a cause. But it takes a tax as its proposal, so it already sits inside one
    frame. In that frame the problem is what is sold and at what price, not only what each person
    chooses. A reader
    who thinks in the personal-choice frame would ask why a note on obesity begins with a tax at all.

    That is not a fault, because every account leaves something out. It becomes one only if the note
    hides it. A line such as "this note covers one measure; others, such as a canteen rule or a
    label, are not discussed" tells the committee what the note chose.
  skill_ref: S47-R1-K02
- type: teaching
  prompt: |
    Audience: a health secretary, one page, answer first. The question: "If we wanted the tax on
    sugary drinks raised further, who would have to act, and what would it take?"
  answer: |
    **Answer.** The GST Council would have to recommend it, and then the Central Government and each
    State would have to notify their own shares. Your route in is the State's minister on the Council.

    - The Council recommends GST rates to the Union and the States (Constitution, Article 279A).
    - The central tax on these drinks is now {{n:cgst_sugary_drinks_rate_pct}} per cent, the most
      section 9(1) of the CGST Act allows. A higher central rate would need Parliament to amend
      section 9(1). What the State GST Acts allow for the State share was not checked.
    - A Council decision needs {{n:gst_council_majority}} of the weighted votes. The Union's vote counts for
      {{n:gst_union_vote_weight}} and the States' together for {{n:gst_states_vote_weight}}. So no decision passes without the Union's
      yes, and none passes on the Union's yes alone.
    - The Ministry of Health is not a member. Its role is to advise.

    What it would not tell you: whether the change would reduce obesity among children. The only
    estimate this note holds is a model of demand, not a measure of weight.

    Checked on 2 October 2026; the State's own notification was not read.
  skill_ref: S47-R1-K01
retrieval_items:
- q: Who recommends GST rates, and who gives them force?
  a: The GST Council recommends to the Union and the States (Article 279A). The Central Government
    notifies the central tax under CGST Act section 9(1), and each State notifies its own under its own
    Act.
- q: Why is "the Union levies {{n:gst_demerit_rate_pct}}% on sugary drinks" wrong?
  a: Section 9(1) caps the central tax at {{n:cgst_sugary_drinks_rate_pct}} per cent, and the central notification puts these drinks at
    {{n:cgst_sugary_drinks_rate_pct}} per cent. The {{n:gst_demerit_rate_pct}}% is the combined rate the release gives.
- q: What two rules must every line of the note pass?
  a: It is checked against the passage it rests on, or it is named in the note as not checked.
