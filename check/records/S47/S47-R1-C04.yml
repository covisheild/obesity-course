definition:
  text: |
    Article 246 of the Constitution divides the power to make law by subject.

    State List entry 6 is public health and sanitation, hospitals and dispensaries. Concurrent List
    entry 18 is adulteration of foodstuffs and other goods. Concurrent List entry 25 is education,
    subject to entries 63 to 66 of the Union List. Concurrent List entry 33(b) is trade and
    commerce in, and the production, supply and distribution of, foodstuffs. Union List entry 52
    covers industries whose control by the Union Parliament has declared by law to be expedient in
    the public interest. Section 2 of the Food Safety and Standards Act, 2006 makes that
    declaration for the food industry.

    Below the State sit the panchayats and the municipalities. Articles 243G and 243W let the
    Legislature of a State, by law, endow them with powers and responsibilities, including for the
    matters listed in the Eleventh Schedule (panchayats) and the Twelfth Schedule (municipalities).

    As of 2 October 2026, on the text of the Constitution as on 1 May 2026.
