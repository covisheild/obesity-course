simplified_explanation: |
  Each list is a numbered set of entries, and each entry is a subject in a few words. A subject on
  the Union List belongs to Parliament. A subject on the State List belongs to each State's
  Legislature. A subject on the Concurrent List belongs to both.

  Below the State there is a third tier: the panchayats in villages and the municipalities in towns.

  So one proposal can land on three governments at once. Your job is to find every entry it touches,
  not the first one that fits.
illustrations:
- body: |
    Here is the trap with "whose subject is it". You find one entry that fits, and you stop.

    Suppose your department's first draft, a made-up one, says this about the canteen proposal:

    > Public health is a State subject, so the Government of Chhattisgarh can make the rule.

    Check it. Search for the Constitution of India on the India Code website
    (https://indiacode.gov.in/handle/123456789/618394) and open it. Go to the Seventh Schedule. Find
    List II, the State List. Entry 6 reads "Public health and sanitation; hospitals and
    dispensaries." The draft is right so far.

    Now do not stop. A canteen rule is about food sold to children inside a school. So search the
    same Schedule for "food" and for "education", and read every entry that comes up.

    In List III, the Concurrent List, entry 18 reads "Adulteration of foodstuffs and other goods."
    Entry 33 covers trade in, and the production, supply and distribution of, "foodstuffs". Entry 25
    is "Education", with some higher education kept for the Union.

    Last, open the Food Safety and Standards Act, 2006 on India Code
    (https://indiacode.gov.in/handle/123456789/586348). Read section 2. Parliament declares it
    "expedient in the public interest that the Union should take under its control the food
    industry." Go back to List I, the Union List. Entry 52 covers "Industries, the control of which
    by the Union is declared by Parliament by law to be expedient in the public interest." The Act
    does not name entry 52, but its words match the entry's. That match is your reading, so say so
    in a note.

    Lay out what you found.

    ```table
    | entry | list | what it names | who may make law on it |
    | 6 | State | public health and sanitation | the State Legislature |
    | 18 | Concurrent | adulteration of foodstuffs | Parliament and the State Legislature |
    | 25 | Concurrent | education | Parliament and the State Legislature |
    | 33(b) | Concurrent | trade in, supply and distribution of foodstuffs | Parliament and the State Legislature |
    | 52 | Union | industries the Union has declared it will control; the food industry, by the Act's section 2 | Parliament |
    ```

    The draft named one row. The proposal touches five. Three are Concurrent. On a Concurrent
    subject, Article 254(1) says that where a State law is repugnant to — that is, clashes with — a
    law Parliament made, Parliament's law prevails. Parliament has made a food law. So before
    the State writes a canteen rule about what food may be sold, someone has to check it against the
    Union's Act and whatever has been made under it.

    The fix to the draft names every entry. It does not yet say which instrument would carry the
    rule, or which body would write it. The lists cannot tell you that. A later section gives the
    method that does.
  analogy_breaks_when: |
    The table says which legislature may make law on each subject. It does not say that any law on
    school canteens exists, or which body acts under it. Whether a given canteen rule falls under
    entry 6, 18, 25 or 33, or several at once, is a question of reading. Where it is disputed,
    courts settle it, and this book does not. Name every entry that could apply, and say you have
    not settled which governs.
- body: |
    Now the third tier. Here the trap is a sentence you will hear in meetings:

    > Health is a panchayat subject. It is in the Eleventh Schedule.

    Open the Constitution again and find the Eleventh Schedule. Entry 23 is "Health and sanitation,
    including hospitals, primary health centres and dispensaries." Entry 17 is "Education, including
    primary and secondary schools." So the words are there.

    Now read Article 243G, the article the Eleventh Schedule hangs from. It begins: "the Legislature
    of a State may, by law, endow the Panchayats with such powers and authority as may be necessary".
    Read the verb again. May. By law. The Schedule is a list of subjects a State is allowed to hand
    to its panchayats. It hands nothing over by itself.

    Article 243W does the same for municipalities, with the Twelfth Schedule. Its entry 6 is
    "Public health, sanitation conservancy and solid waste management."

    So the sentence in the meeting is half a fact. The subject is one a State may give. Whether
    Chhattisgarh has given it, and on what terms, is written in the State's own panchayat and
    municipal Acts. Those Acts are not read in this book. Before you say a panchayat or the Raipur
    municipal corporation can act on canteens, open the State Act and find the section that gives
    it the power.

    Put the three proposals side by side and see where each lands.

    ```table
    | proposal | where the Constitution puts it |
    | a higher tax on sugar-sweetened drinks | goods and services tax, Article 246A: Parliament and every State Legislature |
    | a warning label on packaged foods | Concurrent List entry 18, with the Union's declared control of the food industry (Union List entry 52, the Food Safety and Standards Act, section 2) |
    | a rule on what school canteens may sell | State List entry 6 and Concurrent List entries 18, 25 and 33(b); a State may also hand school and health functions to panchayats and municipalities |
    ```

    The canteen rule could involve the Union, the State and a local body at once. That is the
    point of this section. One proposal can land on three governments.
  analogy_breaks_when: |
    The Eleventh and Twelfth Schedules show what a State may hand down, not what Chhattisgarh has
    handed down. The State Acts that do the handing are not held for this book. So nothing here
    tells you which panchayat or municipal body in the district holds any power over schools or
    food.
must_know:
- point: |
    "Health is a State subject, so the State decides" is the commonest wrong answer. But food is
    Concurrent (entries 18 and 33), and the Food Safety and Standards Act puts the food industry
    under Union control.
  kind: misconception
  bearing: policy
  refs:
  - constitution
  - fss_act_2006
- point: |
    On a Concurrent subject, Parliament's Act wins a clash. The State law is void where the two
    clash (Article 254(1)). The one way round this is a State law sent to the President and signed
    by him (Article 254(2)). So before you propose a State rule on food, open the Union's food Act
    and read what it already covers.
  kind: consequence
  bearing: policy
  refs:
  - constitution
- point: |
    The Eleventh and Twelfth Schedules list what a State may give its local bodies. To say one can
    act, cite the section of the State Act that gives it the power.
  kind: trap
  bearing: policy
  refs:
  - constitution
- point: |
    Goods and services tax sits outside the three Lists. Article 246A gives Parliament and every
    State Legislature power over it.
  kind: india_deviation
  bearing: policy
  refs:
  - constitution
- point: |
    Write "whose subject" as an entry: "Concurrent List, entry 18", not "a Central subject". An
    entry number can be checked by anyone in a minute. "A Central subject" cannot be checked at all.
  kind: move
  bearing: public
  refs:
  - constitution
- point: |
    The lists say which legislature may make law on a subject. When two entries could both cover
    your proposal, say so in your note.
  kind: boundary
  bearing: methodological
exercises:
- type: retrieval
  prompt: |
    Without looking back, write down:

    1. The Article that divides law-making by subject, and the three Lists it names.
    2. The list and entry for public health, and for adulteration of foodstuffs.
    3. What happens when a State law on a Concurrent subject clashes with an Act of Parliament.
    4. What Article 243G lets a State do, and which Schedule goes with it.
  answer: |
    1. Article 246. List I, the Union List (Parliament alone). List II, the State List (the State
    Legislature alone, for its State). List III, the Concurrent List (both).

    2. Public health is State List entry 6. Adulteration of foodstuffs is Concurrent List entry 18.

    3. Under Article 254(1), Parliament's law prevails, and the State law is void to the extent of
    the clash. Under Article 254(2), a State law reserved for the President and given his assent
    prevails in that State, until Parliament legislates again.

    4. It lets the State Legislature, by law, give powers and responsibilities to panchayats,
    including for the matters in the Eleventh Schedule. The Schedule gives nothing by itself.
  skill_ref: S47-R1-K01
  confidence_first: true
- type: interpretation
  prompt: |
    A colleague proposes that the district stop the sale of sugar-sweetened drinks within school
    premises. Using only the Seventh, Eleventh and Twelfth Schedules and section 2 of the Food
    Safety and Standards Act, list every entry the proposal touches. Then say what the entries
    cannot tell you, and what you would open next.
  answer: |
    The entries:

    - State List entry 6, public health and sanitation.
    - Concurrent List entry 18, adulteration of foodstuffs, if the rule is framed as a food
      standard.
    - Concurrent List entry 33(b), trade in and supply of foodstuffs, because the rule stops a sale.
    - Concurrent List entry 25, education, because the place is a school.
    - Union List entry 52, with section 2 of the Food Safety and Standards Act, because the Union
      has taken the food industry under its control.
    - Eleventh Schedule entry 17 (schools) and entry 23 (health), and Twelfth Schedule entry 6
      (public health), as subjects Chhattisgarh may hand to panchayats and municipalities.

    What the entries cannot tell you: whether a law on this already exists. Which body would make
    the rule. Which entry governs if they overlap.

    What to open next: the Food Safety and Standards Act and the regulations made under it, to see
    what the Union has already covered. Then Chhattisgarh's panchayat and municipal Acts, to see
    what has been handed down.
  skill_ref: S47-R1-K01
- type: critique
  prompt: |
    A draft note says: "Food safety is on the Union List, so a State cannot make any law about food
    sold in schools." Find the errors and rewrite the sentence.
  answer: |
    Two errors.

    First, food is not named on the Union List. Adulteration of foodstuffs is Concurrent List entry
    18. Trade in and supply of foodstuffs is Concurrent List entry 33(b). The Union's hold over the
    food industry comes from section 2 of the Food Safety and Standards Act, 2006. There Parliament
    declared Union control of the food industry. That brings in Union List entry 52.

    Second, a State can legislate on a Concurrent subject. But a State provision that clashes with
    Parliament's Act is void (Article 254(1)). The exception is a State law reserved for the
    President and given his assent (Article 254(2)).

    A fixed version, in three sentences: "Food standards are a Concurrent subject (List III, entries
    18 and 33). Parliament has taken the food industry under Union control (Food Safety and
    Standards Act, section 2). A State law on food in schools must not clash with that Act."
  skill_ref: S47-R1-K01
- type: teaching
  prompt: |
    A first-year resident in your department has ten minutes and a whiteboard. She asks: "Why can't
    we send our canteen proposal to the State health department?" Explain.
  answer: |
    Draw three columns on the board: Union, State, local.

    Under State, write "public health, List II entry 6". That is why the health department seems
    right.

    Under both Union and State, write "Concurrent: food adulteration 18, foodstuffs 33(b),
    education 25". Explain that on these subjects both Parliament and the State may make law, and
    that if they clash Parliament's Act wins.

    Under Union, write "food industry under Union control, Food Safety and Standards Act section 2".

    Under local, write "only what the State hands down by law (Articles 243G and 243W)".

    The mechanism: a canteen rule touches entries in all three columns. Sending it to one department
    sends it to one of several governments that may have a say. Before choosing a recipient, find
    every entry, then read the Union's food law to see what it already covers. The next sections go
    inside each government to find which office holds the subject.
retrieval_items:
- q: Which list and entry cover public health, and which cover adulteration of foodstuffs?
  a: Public health and sanitation is State List (List II) entry 6. Adulteration of foodstuffs and
    other goods is Concurrent List (List III) entry 18.
- q: How does the Union come to control the food industry?
  a: Section 2 of the Food Safety and Standards Act, 2006 declares Union control of the food industry
    expedient in the public interest, which brings it under Union List entry 52.
- q: Do the Eleventh and Twelfth Schedules give panchayats and municipalities powers?
  a: No. Articles 243G and 243W let a State Legislature hand them powers by law, including for the
    matters in those Schedules. The State Act does the handing.
figure_note: "Whose subject it is comes from reading entries in words; the table in the first illustration already lays them out, and a chart would only redraw it."
