simplified_explanation: |
  Around every decision stand many more people and organisations. They do not hold that power, and
  they still try to move it. Call each of them an actor.

  Here are the usual ones. Professional bodies, such as an association of doctors. Non-governmental
  organisations (NGOs) and consumer groups. The media. Researchers, which includes you.

  A government department that advises, but does not decide, is an actor too.

  For each actor, ask one question: what does it stand to gain or lose? The answer is its interest. A
  group that works for clean air or children's health has one too.

  Actors push in two ways. Inside lobbying takes the case straight to the people in government: a
  meeting, a letter, a comment on a draft. Outside lobbying takes it to the public, through the press
  or a campaign, so that the public presses the government.

  An interest does not take away the right to speak. What you do with an actor's interest is weigh
  it, not silence it.

  The same goes for you. You might gain from one answer through a grant, a job or a result that
  makes your name. Then you have a conflict of interest. Write it down at the front of your note.
  That is disclosure. It lets the reader weigh your advice. It does not make the pull go away.

  The next level of this subject gives all this a formal shape, the policy triangle of Walt and
  Gilson. It looks at four things together: the content of a policy, its context, its process and
  its actors. This section gives you the actors.
illustrations:
- body: |
    Start with a first draft that fails. Suppose your department's made-up note proposing a higher
    tax on sugar-sweetened drinks has this paragraph under "Stakeholders":

    "Stakeholders: the government, the public, industry and doctors. All stakeholders support
    action on obesity."

    Read it with two questions for each name. Does it decide, or does it push? What does it stand to
    gain or lose?

    "The government" fails the first question. The last section found that the GST Council
    recommends the rate and the Central Government notifies it. The Ministry of Health and Family
    Welfare is also "the government", and it sets no tax rate. In their study of food taxes in India,
    Summan and colleagues describe the health ministries as playing "a largely advisory role" in tax
    decisions. One word has hidden a decider and an adviser.

    "The public" and "industry" fail the second question. They name no one, so they name no
    interest. Which industry? A company selling sweetened drinks and a mill selling it sugar can both
    lose sales. Summan and colleagues also report that farmers' incomes depend partly on sugar
    supplied to the drinks industry. Which public? A student buying a drink, a parent, a shopkeeper.

    "All stakeholders support action" fails both. It is a claim about what other people want, and
    the draft gives no evidence for it. Actors whose interests point in opposite directions do not
    all support the same thing.

    Now rebuild it. The rows below use groups that Summan and colleagues interviewed or listed for
    Indian food taxes, from {{n:summan_kii_n}} interviews held between February and September 2024 and a review of
    documents. The third column keeps to what their paper reports. Two names need expanding: the
    Breastfeeding Promotion Network of India (BPNI), and Nutrition Advocacy in Public Interest
    (NAPi). Both are civil society organisations (CSOs): groups formed by citizens, outside government
    and outside business, to work for a public cause.

    ```table
    | Actor | Job around the decision | What it stands to gain or lose | How it pushes |
    | GST Council | shares the decision: recommends the rate | revenue, balanced against keeping taxed goods affordable | not applicable: it decides |
    | Central Government, Ministry of Finance | shares the decision: notifies the central rate | revenue | not applicable: it decides |
    | Ministry of Health and Family Welfare | advises | its health programmes and aims | inside government |
    | Food and beverage industry associations | pushes | sales and profit | lobbying; the paper reports lobbying against front-of-pack labels |
    | Sugar mills and cane farmers | pushes | income from sugar sold to drinks makers | through their associations |
    | CSOs such as BPNI and NAPi | pushes | the public health aims they campaign for | complaints to authorities, campaigns |
    | Researchers | inform | funding for their research | evidence and briefs |
    | Students and young adults who buy the drinks, and their families | affected | what they pay, if the tax reaches the price | rarely organised |
    ```

    Read down the second column. Two rows hold a share of the decision. Six push, advise, inform or
    are affected. That is the usual shape: a few deciders, many actors.

    Then read the third column. The interests point in different directions. The industry rows
    stand to lose from a higher tax. The civil society row stands to gain what it campaigns for. That is why
    "all stakeholders support action" could not have been true.

    The media are not in the table, on purpose. Summan and colleagues report what their
    interviewees said about media coverage, but not what media organisations themselves stand to
    gain or lose. Leave a row out rather than fill it with a guess.
  analogy_breaks_when: |
    The table says who stands around the decision and which way each interest points. It does not
    say how strong any actor is, or who will win. That needs the policy process theories of the
    next level of this subject.

    The rows come from one paper. Its findings rest on {{n:summan_kii_n}} interviews with informants who were
    mostly based in Delhi, and on a review of documents. Its Table 3 calls its entries "examples".
    So the table is a starting list for this proposal, not a complete or measured map, and a
    different proposal, such as a school-canteen rule, has a different set of actors.
