- body: |
    Now take two made-up events, one after the other, and sort what each one changes.

    First event. Suppose the Food Safety and Standards Authority of India (FSSAI) publishes a draft
    regulation on warning labels for packaged foods, and a made-up association of snack makers sends
    a long objection. A colleague says the objection should go in the bin, because the association
    has a commercial interest.

    Check that against what a draft is for. The FSSAI's own Packaging Regulations of 2018 record
    that their draft was published "inviting objections and suggestions from the person likely to be
    affected thereby", and that the objections received "have been considered". The section on how a
    rule is made showed the same pattern for rules in general. A snack maker is plainly a person
    likely to be affected. Its interest is plain, and so is its right to object.

    So do not bin the objection. Read it as you would read anyone's argument. Are its premises
    true? Does its conclusion follow from them? Knowing the association's interest tells you where to
    look hardest. It does not tell you the answer.

    Second event. Suppose a made-up drinks company offers your department a grant to survey what
    school canteens in the district sell. Now the interest is yours.

    Ask the question from the definition: do you gain from one answer? If the grant might be
    renewed, a report the funder likes is worth more to the department than one it dislikes. That is
    a conflict of interest, even if nobody means to bend anything. Ioannidis and colleagues, writing
    about medical research, note that conflicts of interest "can also affect the design, analysis,
    and interpretation of results". The pull works at every step, not only at the end.

    Three responses are open to you. Decline the grant. Accept it and disclose it. Accept it and say
    nothing. This book's rule is that the third is never open. Disclosure means writing the funder,
    and any other gain, at the front of the report, where a reader meets it before the findings. It
    lets the reader weigh the work. It does not remove the pull, and that is why some departments
    decline.

    Your interests are not only money. Walt and colleagues observe that funders increasingly require
    researchers to translate their research, "forcing them to become policy actors". Once your
    department sends a note to a district officer, you are an actor around that decision. Your
    interests include your department's name, and the answer you hoped to find before you looked.
  analogy_breaks_when: |
    Both events are made up. The Packaging Regulations show one real draft that invited objections;
    they do not show how the FSSAI weighed any particular objection, and nothing here says how much
    weight an objection with a commercial interest behind it gets.

    Disclosure is the floor, not the whole answer. For tobacco, a treaty goes further: Article 5.3
    of the World Health Organization (WHO) Framework Convention on Tobacco Control requires the countries that joined it to
    protect their tobacco control policies from the tobacco industry's commercial interests. How
    far that reasoning carries to food companies, and the guidance of WHO and the United Nations
    Children's Fund (UNICEF) on industry interference, belong to the next level of this subject.
must_know:
- point: |
    The error is to treat the loudest actor as the decider. A campaign, a press storm or a powerful
    company can move a decision. None of them can take it.
  kind: misconception
  bearing: policy
- point: |
    Refuse a stakeholder list that says "industry", "the public" or "the government". Ask for each
    actor by name. Ask what it stands to gain or lose.
  kind: move
  bearing: policy
- point: |
    An interest is not a reason to silence an actor. Use the objector's interest to decide where to
    look hardest.
  kind: trap
  bearing: policy
  refs:
  - general_clauses_act_1897
- point: |
    When an advocacy group's figure appears in your note, check it as hard as an industry figure.
  kind: misconception
  bearing: methodological
- point: |
    Disclose every interest you have in the decision you write about, money or not, at the front of
    the note.
  kind: consequence
  bearing: methodological
  refs:
  - ioannidis_2014_waste
- point: |
    For a food tax in India, do not send your note to the Ministry of Health as if it decided. Summan and
    colleagues held {{n:summan_kii_n}} interviews in 2024 and reviewed documents. They report that the Ministry
    of Finance and the GST Council "determine tax design and rates".
  kind: india_deviation
  bearing: policy
  refs:
  - summan_2026_foodtax
- point: |
    When a trainee hands you a stakeholder table, point at each row and ask two questions aloud:
    does this actor decide, or push? What does it lose if the proposal goes through?
  kind: move
  bearing: teaching
- point: |
    A map of actors tells you who will push and in which direction. Judge the argument on its
    evidence, and leave predictions about who prevails to the process theories of the next level.
  kind: boundary
  bearing: methodological
common_misreading: |
  "This group works for a public good, so it has no interest to declare." A public interest group
  seeks a good that reaches everyone. It still stands to gain when the decision goes its way: a
  campaign won, a reputation made, future funding. Its interest points in a different direction from
  a company's. It is still an interest, and its claims are checked like anyone else's.
reporting_sentence: |
  Interests: this note was prepared by [names], [department]. Its funding came from [funder, or
  "no outside source"]. [If the funder has a stake in the decision: X sells Y.] The authors have [no
  other interests in this decision / these other interests: ...].
exercises:
- type: retrieval
  prompt: |
    Without looking back, answer three questions. What is an actor's interest? What is the
    difference between inside and outside lobbying? What does disclosure of a conflict of interest
    do, and what does it not do?
  answer: |
    An actor's interest is what it stands to gain or lose from the decision.

    Inside lobbying takes an organisation's case directly to lawmakers and officials. Outside
    lobbying takes it to the public, through the media and campaigns, so that the public presses the
    lawmakers.

    Disclosure states the interest, so that readers can weigh the advice. It does not remove the
    interest, or its pull on the work.
  skill_ref: S47-R1-K01
  confidence_first: true
- type: critique
  prompt: |
    Here is a made-up "Stakeholders" paragraph from a department's proposal for a rule on what
    school canteens in the district may sell.

    "School principals, parents and the canteen contractors all agree that junk food should be
    removed from canteens. The local soft-drink distributor has a conflict of interest and so should
    not be consulted. Our department has no interests to declare, because we receive no money from
    industry."

    Find three errors. For each, say what is wrong and what the paragraph should say instead.
  answer: |
    1. "All agree" is a claim about other people's views, with no evidence. It is also unlikely,
       because their interests differ. A canteen contractor stands to lose sales on the items a rule
       would remove. Write instead what each actor stands to gain or lose, and leave their views to
       evidence: a meeting, a survey, a written objection.

    2. The distributor has an interest, not a conflict of interest. A conflict of interest belongs
       to someone who advises or decides and gains from one answer. The distributor is an actor
       pushing openly for its own side, which it is entitled to do. Consult it, and weigh what it
       says knowing what it stands to lose.

    3. Interests are not only industry money. The department may hold a position it has argued
       before. It may want the survey to show a problem worth acting on. Its name may be attached to
       the proposal. Say so in a short statement of interests, and declare any funder, whoever it is.
  skill_ref: S47-R1-K01
- type: teaching
  prompt: |
    A journalist has three minutes and asks: "Should drinks companies even be allowed to comment on
    a tax on sugary drinks? They will just protect their profits." Answer without jargon, and give
    one sentence they can quote.
  answer: |
    Yes, they should be heard, and you should be clear about why their view needs checking.

    Companies that make sugary drinks stand to lose sales and profit from a higher tax. That is
    their interest, and everyone knows it. Having an interest does not take away the right to speak.
    In India, a rule published in draft is open to objections from anyone likely to be affected, and
    a company is one of them.

    What changes is how their claims are read. If a company says a tax will cost jobs, ask for the
    numbers and check them, as you would check an advocacy group's numbers. The decision itself
    belongs to the bodies that set the tax, not to any of the people pushing.

    Quotable sentence: "Drinks companies have every right to be heard on this tax, and their claims
    should be checked as hard as anyone's."
  skill_ref: S47-R1-K01
retrieval_items:
- q: What makes someone an actor around a decision, rather than a decider?
  a: An actor tries to shape the decision, or is affected by it, without holding the power to take
    it. The decider is the body that holds that power.
- q: Name the two kinds of lobbying and say what each does.
  a: Inside lobbying takes the case directly to lawmakers and officials. Outside lobbying takes it
    to the public so that the public presses the lawmakers.
- q: What is a conflict of interest, and who has one?
  a: What a party has when it gains from one answer. An adviser or researcher has one when they
    stand to gain from one outcome of the decision they inform.
