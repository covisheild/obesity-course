simplified_explanation: |
  The section on what a frame is gave you four parts: a problem, a cause, a judgement and a
  remedy. This section turns them into something you do with a pen, on one passage at a time.

  Write five lines. Next to each, copy the words from the passage that put it there.

  1. **Problem.** What does the passage say is wrong, or at stake?
  2. **Cause.** Whom or what does it hold responsible?
  3. **Judgement.** Which value words does it use? Look for how bad, whose duty, what is fair.
  4. **Remedy.** What does it say should be done, and who is to do it?
  5. **Left out.** What would someone who sees the problem differently put in?

  If you cannot copy words for a line, write "not stated". Do not fill the line from what you
  already think. Passages often leave a slot empty, and the empty slot tells you something.

  Watch for cue words — a word or short phrase that carries a frame in a few letters. A metaphor
  is one kind: a "sea" of cheap food puts the cause outside the eater, and a "war" makes the
  problem an enemy. A cue word is a clue, not a verdict. The whole passage decides the frame.

  Then do two more things. Write the counter-frame — the problem, cause, judgement and remedy an
  opponent would give the same facts. Then run all five lines on your own draft. Your note has a
  frame too.
illustrations:
- body: |
    Start with a reading that goes wrong. You are collecting public texts on your department's
    first proposal, a higher tax on sugar-sweetened drinks. You open the Press Information Bureau
    (PIB) release of 3 September 2025 on the 56th meeting of the GST Council.

    You already know the release moved sugar-added drinks into a {{n:gst_demerit_rate_pct}}% rate.
    So the tempting reading writes itself: a health frame, with obesity as the problem, sugary
    drinks as the cause, and a higher tax as the remedy. Before you write that down, run the five
    lines. For each one, copy words from the release.

    The opening points name the focus of the reform: "Common-man, Labour-intensive Industries,
    Farmers and Agriculture, Health, Key Drivers of the economy". They describe the change as
    turning a four-rate structure into a "citizen-friendly 'Simple Tax'". That has "a Standard Rate
    of 18% and a Merit Rate of 5%", and "a special de-merit rate of 40% for a select few goods and
    services". The next paragraph gives the purpose: to "provide relief to individuals, common man,
    aspirational middle class". Sugar-added drinks appear only in an annexure, as one line in a
    list headed "(28% to 40%)", beside pan masala.

    Now fill the grid from those words alone.

    ```table
    | Slot | Words in the release | What the tempting reading put there |
    | problem | a "4-tiered" rate structure; "relief" owed to "common man" | obesity |
    | cause | not stated | sugary drinks |
    | judgement | "citizen-friendly", "relief", "de-merit" | drinks harm health |
    | remedy | two main rates, and a "de-merit" rate for "a select few goods" | a higher tax on drinks |
    | left out | why any good is "de-merit"; obesity; who drinks these drinks | — |
    ```

    The release does not name obesity. It does not say why sugar-added drinks belong in the
    {{n:gst_demerit_rate_pct}}% list. The health frame in the right-hand column was yours. You
    brought it to the text, because you know what your proposal is for.

    One word in the release does carry a judgement: "de-merit". It says these goods deserve less
    favour than the "merit" goods at 5%. It does not say what is wrong with them. So in your grid,
    "de-merit" goes in the judgement line, and the cause line stays "not stated".

    This matters as soon as you write. Suppose your note says "the GST Council raised the rate on
    sugary drinks to fight obesity". You have put a reason in the Council's mouth that its own
    release does not give.
  analogy_breaks_when: |
    An empty slot in one press release shows what that text says. It does not show that the
    Council had no health reason. Other texts may state one, such as the questions and answers the
    release says were issued with it, or a minister's speech. Read those before you say what the
    Council intended.

    Researchers read the same classification differently. Summan and colleagues write that the
    drinks "have been classified as demerit goods and taxed at the highest rate, signalling a shift
    towards public health considerations". That is their reading of the classification, and a frame
    of their own. Cite it as theirs, not as the Council's.

    The {{n:gst_demerit_rate_pct}}% is the combined rate the Council recommended in 2025. It was
    given effect by notification, and the rate can change. The reading lesson does not depend on
    the number.
