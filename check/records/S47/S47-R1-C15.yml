definition:
  text: |
    In `S47-R1-C12` you met the four jobs a frame does. Reading the frame of a public argument applies
    them to one passage at a time. You write down five things, and each one carries the passage's
    own words as its evidence.

    The problem is what the passage says is wrong or at stake. The cause is whom or what it holds
    responsible. The judgement is what its value words say: how bad the problem is, whose duty it
    is, what is fair. The remedy is what it says should be done, and by whom. The fifth is what the
    passage leaves out: the causes, remedies and actors that a rival account of the same problem
    would put in.

    A slot the passage does not fill is recorded as not stated. It is never filled from what the
    reader already believes.
