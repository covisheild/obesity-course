- body: |
    Now a clean case, and the two steps that finish the method. The National Health Policy 2017 of
    the Ministry of Health and Family Welfare mentions food taxes once. The sentence sits in
    section 3.1, whose heading is "Ensuring Adequate Investment".

    "The Government could consider imposing taxes on specific commodities-such as the taxes on
    tobacco, alcohol and foods having negative impact on health". The sentence before it reads:
    "General taxation will remain the predominant means for financing care."

    Run the five lines.

    ```table
    | Slot | Words in the policy |
    | problem | money for health care ("Ensuring Adequate Investment", "financing care") |
    | cause | not stated |
    | judgement | "foods having negative impact on health" |
    | remedy | "taxes on specific commodities", which "the Government could consider" |
    | left out | the tax as a way to change what people eat or drink; who pays it |
    ```

    The frame is financing. The food tax appears as one source of money for care, next to taxes on
    "tobacco, alcohol". The judgement on the foods is there, but the tax is not offered as a way to
    make people buy less of them.

    **Write the counter-frame.** Ask what an opponent of a food tax would say, using the same
    facts. You do not have to invent this. Koon and colleagues list a study by Fogarty and Chapman
    of newspaper coverage of a tax on alcopops, sweet ready-mixed alcoholic drinks, in Australia. It
    found two frames for the tax and two against it: "2 in favor of alcopops tax (consumption
    reduction, loophole) and 2 against (substitution, revenue raising)".

    Look at "revenue raising". The National Health Policy places the food tax under raising money
    for care, and says so with approval. The opponents' frame uses the same idea as an accusation:
    the tax is about money, not health. One idea sits in the judgement slot of two frames, with
    opposite signs.

    An Indian version of a counter-frame is on record too. Summan and colleagues quote a health
    finance official they interviewed: "You can't have too many objectives thrust into tax policy,
    the tax policy is supposed to raise revenue and that's it". Here the judgement is a rule about
    what a tax is for, and the remedy is to keep health out of it.

    **Run it on your own sentence.** Suppose your department's draft, which is made up, says:
    "Sugary drinks are cheap and sold at every school gate, so the GST Council should raise the rate
    further to protect children."

    ```table
    | Slot | Words in your draft |
    | problem | not stated outright; children drinking sugary drinks is implied |
    | cause | "cheap and sold at every school gate" |
    | judgement | "protect children" |
    | remedy | "the GST Council should raise the rate further" |
    | left out | who pays the higher price; what a higher rate would change; any other remedy |
    ```

    Your draft puts the cause in the surroundings, the price and the place of sale. Its judgement
    is a duty to children. That frame is a choice you made, and an opponent can see it as clearly
    as you can see the policy's. The next step is not to scrub the frame out. You cannot write
    without one. It is to know which one you chose, and what it leaves out.
  analogy_breaks_when: |
    Fogarty and Chapman's study is of alcohol, in Australia, in newspapers. It shows that a tax
    can be argued in a frame and a counter-frame. It does not show which frames appear in Indian
    arguments about sugary drinks, or how often.

    The official's words are one person's, quoted in one article. They show that a revenue frame
    exists among Indian officials. They do not show how widely it is held, or that it is the
    Ministry of Finance's position.

    The National Health Policy sentence is one line of a long document. Reading it as a financing
    frame describes that line, in that section. Elsewhere the same policy may frame diet
    differently.
  numbers: []
must_know:
- point: |
    The error is to read into a text the frame you expected to find. A rate on sugary drinks is
    not a health frame until the text's own words make it one. Copy words for every slot, and
    write "not stated" where there are none.
  kind: misconception
  bearing: methodological
  refs:
  - pib_2163555
- point: |
    For every passage you quote in a note, write five lines first: problem, cause, judgement,
    remedy and what it leaves out. Put the passage's words beside each line.
  kind: move
  bearing: methodological
  refs:
  - koon_2016_framing
- point: |
    The same idea can be praise in one frame and an accusation in another. "Raising revenue" is a
    reason for a food tax in the National Health Policy 2017 and a charge against a tax in its
    opponents' frame. Label the judgement from the words around the idea, never from the idea alone.
  kind: trap
  bearing: policy
  refs:
  - mohfw_2017_nhp
  - koon_2016_framing
- point: |
    Before you argue for a proposal in a meeting, write its counter-frame: the problem, cause,
    judgement and remedy an opponent would give. Then answer that frame in your note, not one
    you made up to be easy to answer.
  kind: move
  bearing: policy
- point: |
    Never put a reason in a body's mouth that its own text does not give. If you want to say why a
    body acted, quote the document that says why, or write that its release states no reason.
  kind: consequence
  bearing: public
  refs:
  - pib_2163555
- point: |
    A trainee will often call a paragraph "neutral" because it opens with a fact. Ask them to fill
    the five lines from the paragraph's own words. The judgement and remedy usually turn up in the
    last sentence.
  kind: move
  bearing: teaching
- point: |
    One passage is not a body's frame, and one body is not "the government". Before you say how a
    government frames obesity, read several of its texts, and say which ones you read.
  kind: boundary
  bearing: policy
- point: |
    The method tells you what a text says, and what it leaves out. It does not tell you whether the
    cause it names is the real cause, or whether its remedy would work. Those need evidence, and
    weighing them needs more than evidence.
  kind: boundary
  bearing: methodological
common_misreading: |
  "A paragraph that states only facts has no frame." Every account chooses which facts to put in,
  in what order, and in which words. A paragraph of true sentences still has a problem, a cause, a
  judgement and a remedy, or leaves some of them out on purpose. Run the five lines on it, and the
  frame shows.
exercises:
- type: interpretation
  prompt: |
    A classmate writes in a draft note: "The Government of India frames obesity as a matter of
    personal choice." Here are short passages from three Government of India texts.

    - The Prime Minister, in his Mann Ki Baat address of 23 February 2025: "dealing with obesity
      is not just a personal choice but also our responsibility towards the family."
    - The Food Safety and Standards Authority of India (FSSAI), on its Eat Right India page:
      "FSSAI has embarked on a large-scale effort to transform the country's food system".
    - The National Health Policy 2017: "seven priority areas for improving the environment for
      health", one of which is "Balanced, healthy diets and regular exercises."

    For each passage, say whether it supports or goes against the classmate's sentence, and which
    slot shows it. Then rewrite the sentence so it says only what these passages show.
  answer: |
    Read each passage for its cause and its remedy, because those are the slots that decide
    whether a frame is about personal choice.

    ```table
    | Passage | Cause and remedy in its words | Supports or goes against |
    | Mann Ki Baat | judgement: "not just a personal choice but also our responsibility towards the family"; the duty stops at the family | supports in part: the cause and remedy sit in the household, but the judgement says it is not only personal |
    | Eat Right India | remedy: "transform the country's food system" | goes against: the cause is placed in the food system |
    | National Health Policy | remedy: action on "the environment for health" | goes against: diet is listed under the environment, not under personal choice |
    ```

    So the classmate's sentence is wrong as written. One text puts cause and remedy in the
    household. Two put them in the food system or the environment. And the household text itself
    says obesity is "not just a personal choice".

    A rewrite that says only what the passages show:

    "Government of India texts frame obesity in more than one way. The Prime Minister's address of
    February 2025 places the remedy in the household, as a duty to the family. FSSAI's Eat Right
    India page and the National Health Policy 2017 place it in the food system and the environment
    for health."

    Notice that the rewrite names its texts. A claim about how a government frames something is a
    claim about documents, and the reader should be able to open them.
  skill_ref: S47-R1-K02
- type: teaching
  prompt: |
    A journalist has three minutes. She asks: "My report on the sugary-drinks tax just gave the
    facts. How can it have a frame?" Explain, with no jargon, and give her one sentence she could
    quote.
  answer: |
    Start with her own report. Ask which facts she put in, and which she left out. Perhaps she gave
    the new rate and quoted a drinks company and a doctor. Perhaps she did not say who pays the tax
    or what the money is used for. Every report makes those choices, because there is not room for
    everything.

    Then say what the choices do. The facts at the top tell the reader what the story is about.
    The person quoted last often gets the last word on what should happen. A single word, such as
    "burden" or "relief", tells the reader how to feel about it.

    So a report can be accurate in every line and still lead the reader somewhere. That is not a
    charge of bias. It is how writing works. The fix is to know which way you are leading, and to
    give room to the strongest view on the other side.

    One sentence she could quote: "Every report on a tax chooses which facts come first and whose
    voice comes last. Those choices tell readers what the tax is about before anyone argues."
- type: retrieval
  prompt: |
    From memory: write the five lines this section asks you to fill for a passage. Then say what
    you write when the passage gives you no words for one of them, and the two further steps that
    finish the reading.
  answer: |
    The five lines are problem, cause, judgement, remedy, and what the passage leaves out. Each
    carries words copied from the passage.

    When the passage gives no words for a line, you write "not stated". You do not fill it from
    what you already believe.

    The first further step is the counter-frame: the problem, cause, judgement and remedy an
    opponent would give. The second is running the five lines on your own draft.
quantitative: true
practice_note: |
  Ten problems. The technique has five moves (four slots and what is left out) plus the
  counter-frame and the reader's own frame, so each move is met at least twice: three mechanical
  problems on made-up sentences (one with empty slots, one on cue words), three on real Indian
  texts (the third reversing direction, writing a counter-frame), two broken readings to diagnose,
  and two claims in words to frame and bound.
practice:
- level: 1
  prompt: |
    Label the problem, the cause, the judgement and the remedy in this made-up passage.

    "Fried snacks are sold at the gate of every school in the town, and children buy them every
    day. It is wrong that parents cannot protect their children from this. The municipality should
    license the stalls at school gates."
  answer: |
    ```table
    | Slot | Words in the passage |
    | problem | "children buy them every day" (children eating fried snacks daily) |
    | cause | "sold at the gate of every school" (the stalls and where they stand) |
    | judgement | "It is wrong that parents cannot protect their children" |
    | remedy | "The municipality should license the stalls at school gates" |
    ```

    The passage fills all four slots, and names who is to act: the municipality. The cause is
    placed in the place of sale, not in the children or their parents. The judgement is about
    fairness and a duty to protect children.
- level: 2
  prompt: |
    Label the four slots in each made-up sentence. Where a slot is not stated, write "not
    stated". Where you think a slot is implied, say so separately.

    a. "Obesity is rising among young adults in the district."
    b. "Each of us must take charge of what is on our own plate."
    c. "Food companies spend crores advertising to children, and the regulator does nothing."
  answer: |
    ```table
    | Sentence | Problem | Cause | Judgement | Remedy |
    | a | "Obesity is rising among young adults" | not stated | not stated | not stated |
    | b | not stated | not stated | "must" (a duty placed on each person) | "take charge of what is on our own plate" |
    | c | not stated | "spend crores advertising to children" | "the regulator does nothing" (blame on the regulator) | not stated |
    ```

    Implied, but not stated:

    a. Nothing beyond the problem. A bare statement of a problem is the start of many frames, and
       you cannot yet tell which.
    b. The cause is implied to be what each person eats. The sentence never says so.
    c. The problem is implied to be what children eat. The remedy is implied to be that the
       regulator should act on advertising.

    Keep the implied column separate. If you put an implied cause in the cause line, you can no
    longer tell your reading from the text.
- level: 3
  prompt: |
    Each made-up phrase below comes from a different argument about obesity. For each, say which
    slot it mainly fills, and what it suggests about where the cause lies.

    a. "a sea of cheap, sugary choices"
    b. "a personal choice"
    c. "a burden on the public purse"
    d. "protect our children"
    e. "a war on sugar"
  answer: |
    ```table
    | Phrase | Slot it mainly fills | What it suggests about cause |
    | a | cause | outside the person: the surroundings are full of cheap options |
    | b | judgement | inside the person: it is the individual's matter |
    | c | problem | defines the problem as cost to public money, not as health |
    | d | judgement | a duty owed to children, so someone other than the children must act |
    | e | problem and remedy | makes sugar an enemy to be fought; names no one who fights or how |
    ```

    Two of these are metaphors: "sea" and "war". A metaphor carries a cause and a duty in one
    word, which is why it is a strong cue.

    Each answer is a clue, not a verdict. "A personal choice" can appear in a sentence that goes on
    to say "not just a personal choice". Read the whole passage before you name its frame.
- level: 4
  prompt: |
    The National Health Policy 2017 says, in its section on preventive and promotive health:

    "The policy prerequisite is for an empowered public health cadre to address social
    determinants of health effectively, by enforcing regulatory provisions. The policy identifies
    coordinated action on seven priority areas for improving the environment for health"

    The second of the seven areas is "Balanced, healthy diets and regular exercises."

    Fill the five lines for diet, as this passage presents it.
  answer: |
    ```table
    | Slot | Words in the policy |
    | problem | "the environment for health" needs "improving" |
    | cause | "social determinants of health" (the passage does not define the phrase) |
    | judgement | "priority", "empowered", "effectively" |
    | remedy | "coordinated action", "enforcing regulatory provisions", by "an empowered public health cadre" |
    | left out | which regulations; which bodies act on food; how diets would change; who sells the food |
    ```

    The diet item, read alone, sounds personal: "regular exercises" is something a person does.
    The passage puts it somewhere else. It is listed under "improving the environment for health",
    and the means named is "enforcing regulatory provisions". So the frame of this passage is the
    environment, with a goal stated in personal words.

    The item states a goal, not a means. The passage does not say how diets would become balanced.
    That gap goes in the "left out" line.
  refs:
  - mohfw_2017_nhp
- level: 5
  prompt: |
    In his Mann Ki Baat address of 23 February 2025, the Prime Minister said:

    "Decide that you will use 10% less oil every month."

    and later:

    "Friends, using less oil in food and dealing with obesity is not just a personal choice but
    also our responsibility towards the family. Excessive use of oil in food can cause many
    diseases like heart disease, diabetes and hypertension. By making small changes in our food
    habits, we can make our future stronger, fitter and disease-free."

    Fill the five lines.
  answer: |
    ```table
    | Slot | Words in the address |
    | problem | "obesity"; "many diseases like heart disease, diabetes and hypertension" |
    | cause | "Excessive use of oil in food" |
    | judgement | "not just a personal choice but also our responsibility towards the family" |
    | remedy | "use 10% less oil every month"; "small changes in our food habits" |
    | left out | food bought outside the home; oil in packaged food; prices; any body that could act on the food supply |
    ```

    The cause and the remedy both sit in the household kitchen. The judgement widens the duty from
    the person to the family, but not beyond it. Whoever acts is "you" and "we".

    What is left out is what a food-environment frame would put in. That means the food people buy
    ready made, what it costs, and the bodies that regulate or tax it. Listing these is not a criticism
    of the address. It is a record of where its frame stops.
  refs:
  - pib_2105618
- level: 6
  prompt: |
    Write the counter-frame to the passage in problem 5. Give the problem, cause, judgement and
    remedy that someone who sees obesity as shaped by the food system would give. Build it only
    from these words on FSSAI's Eat Right India page:

    - "FSSAI has embarked on a large-scale effort to transform the country's food system in order
      to ensure safe, healthy and sustainable food for all Indians"
    - "a judicious mix of regulatory, capacity building, collaborative and empowerment approaches"
    - "the movement brings together food-related mandates of the agriculture, health, environment,
      and other ministries"

    Then say in which slot the two frames differ most.
  answer: |
    ```table
    | Slot | Problem 5 (Mann Ki Baat) | Counter-frame from the Eat Right India page |
    | problem | obesity and diseases | food that is not "safe, healthy and sustainable" for "all Indians" |
    | cause | "Excessive use of oil in food" | the "food system" that needs transforming |
    | judgement | a duty "towards the family" | a shared task across "the agriculture, health, environment, and other ministries" |
    | remedy | "use 10% less oil every month" | "regulatory, capacity building, collaborative and empowerment approaches" |
    ```

    The frames differ most in the remedy, and in who carries it out. In one, a household buys
    less oil. In the other, ministries and a regulator change the food system. The cause follows:
    the kitchen in one, the system in the other.

    Notice where the counter-frame came from. Both texts are from the Government of India. A
    counter-frame need not come from an opponent of the government. It is a different answer to
    the same four questions, from wherever it comes.
  refs:
  - pib_2105618
  - fssai_eat_right_india
- level: 7
  prompt: |
    Here is a worked reading of FSSAI's Eat Right India page. Find the lines that broke.

    ```working
    text: FSSAI, Eat Right India page
    cue: the tagline "Sahi Bhojan. Behtar Jeevan" speaks to the person who eats
    problem: people do not eat right
    cause: individual food choices
    judgement: eating right is each person's duty
    remedy: "empowerment approaches" for "citizens at large"
    frame: personal choice
    ```
  answer: |
    The cause line, the remedy line and the verdict broke.

    The cause line has no words from the page in it. The page names what it wants changed: it
    sets out "to transform the country's food system". So the cause, as the page presents it, is
    the food system, not individual choices.

    The remedy line took one item from a list of four. The page says "a judicious mix of
    regulatory, capacity building, collaborative and empowerment approaches". The worked reading
    kept "empowerment" and dropped "regulatory". It did the same with "citizens at large", which
    comes last in a list that starts with "the government, food businesses".

    The judgement line was filled from the reader's view too. The page's own judgement words are
    "collective action of all stakeholders" and "whole of the government".

    A corrected verdict: a food-system frame, with a tagline written to the individual.

    Why the wrong reading looks reasonable: a tagline is written to speak to you, and it is the
    first thing you read. The tagline, in Hindi, is written to the person who eats. The body of
    the page is not. A reader who stops at the slogan reads the slogan's
    frame.
  refs:
  - fssai_eat_right_india
- level: 8
  prompt: |
    A made-up paragraph from a draft department note reads:

    "Sugar-sweetened drinks are now in the highest GST slab. Children in our district are flooded
    with these drinks at every school gate. The rate should go higher still."

    A classmate's worked reading follows. Find what broke.

    ```working
    problem: none stated; the paragraph reports facts
    cause: none stated
    judgement: none
    remedy: none
    verdict: neutral, no frame
    ```
  answer: |
    Every line broke, and the verdict with them.

    ```table
    | Slot | Words in the paragraph |
    | problem | "Children in our district are flooded with these drinks" |
    | cause | "at every school gate" (where the drinks are sold) |
    | judgement | "flooded" (a metaphor of something overwhelming) |
    | remedy | "The rate should go higher still" |
    | left out | who would raise it (the GST Council is not named); who pays; what a higher rate would change |
    ```

    The first sentence is a checkable fact. In the release of 3 September 2025, sugar-added drinks
    moved to the {{n:gst_demerit_rate_pct}}% rate, the highest the release lists. The second
    sentence is a claim about the district with no source given. The third is a remedy.

    Why the wrong reading looks reasonable: the paragraph opens with a fact, and a fact at the top
    makes the rest read like a report. The frame sits in one metaphor and one "should". The
    paragraph is not wrong to have a frame. It is wrong to be called neutral.
  refs:
  - pib_2163555
- level: 9
  prompt: |
    Summan and colleagues, in a 2026 study of food taxes in India, quote a health finance official
    they interviewed:

    "You can't have too many objectives thrust into tax policy, the tax policy is supposed to raise
    revenue and that's it…"

    Read the frame. Say which frame it answers. Then say what your reading does not establish.
  answer: |
    ```table
    | Slot | Words in the quotation |
    | problem | "too many objectives thrust into tax policy" |
    | cause | not stated; implied to be whoever adds the other objectives |
    | judgement | "supposed to" (a rule about what a tax is for); "thrust" (imposed from outside) |
    | remedy | keep tax policy to raising revenue ("that's it") |
    | left out | the health effects of what is taxed; who is harmed by the drinks; what the revenue is spent on |
    ```

    It answers the frame in which a tax is a tool for changing what people buy. That frame puts a
    health objective into tax policy. This one says the objective does not belong there.

    What your reading does not establish:

    - Whether the official is right. The quotation states a view about what a tax is for. That is
      a value premise, not a finding, and evidence alone cannot settle it.
    - How widely the view is held. It is one interviewee in one article. The same article reports
      that other interviewees thought directing the revenue to health could win public support.
    - That it is the Ministry of Finance's position. An official speaking in an interview is not
      the Ministry deciding.
  refs:
  - summan_2026_foodtax
- level: 10
  prompt: |
    A made-up newspaper headline reads: "Centre declares war on sugar".

    Read its frame. Then say what you would have to check before you repeated the headline's
    claim in your note, and what the frame reading cannot tell you.
  answer: |
    ```table
    | Slot | Words in the headline |
    | problem | "sugar" |
    | cause | not stated; sugar itself is cast as the enemy |
    | judgement | "war" (an enemy, and urgency) |
    | remedy | the "Centre" fights; no instrument named |
    | left out | which body acted; under what power; what the measure is; whom it affects |
    ```

    The war metaphor does two things at once. It makes the problem an enemy, and it makes the
    government the side that fights. It leaves out what was actually done. A war can be a tax, a
    label rule, a speech or nothing.

    What to check before you repeat it:

    - Find the text behind the headline: a press release, a notification, a speech.
    - Trace what it is, with the tracing method: which instrument, which body, under which
      provision. "The Centre" is not a body that decides anything.
    - If no instrument exists, your note says a speech or a statement was made, not that a policy
      was.

    What the frame reading cannot tell you: whether any policy exists, or whether it would change
    what people eat. It cannot even tell you whether the words are the government's or the
    newspaper's.
retrieval_items:
- q: What five lines do you fill when you read the frame of a passage?
  a: The problem, the cause, the judgement and the remedy, each with the passage's own words, and
    what the passage leaves out.
- q: What do you write when a passage gives you no words for a slot?
  a: '"Not stated". You never fill the slot from what you already believe, and you keep anything
    implied in a separate column.'
- q: What is a counter-frame?
  a: The problem, cause, judgement and remedy that an opponent would give the same facts.
- q: Why is a cue word or a metaphor only a clue to the frame?
  a: The same words can be turned round by the rest of the passage ("not just a personal choice").
    The whole passage decides the frame.
figure_note: "No figure: the section's material is words, not quantities, and its grids are already tables. The diagram a reader would want is a frame and its counter-frame drawn as two columns of five slots, with the slot where they differ most marked."
