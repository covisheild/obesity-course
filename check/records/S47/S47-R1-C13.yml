simplified_explanation: |
  Obesity is argued in a handful of frames that keep coming back. Each one puts the cause somewhere
  different.

  - **Personal choice.** The cause is what each person eats and how much they move.
  - **Food environment.** The cause is what is cheap, easy and everywhere.
  - **Commercial interests.** The cause is what companies make, sell and advertise.
  - **Disease.** Obesity is a medical condition, to be diagnosed and treated.
  - **Justice.** The question is who bears the burden, and whether that is fair.

  One study, by Saguy and Riley, also found a frame that rejects the problem itself: body diversity.

  So you can name the frames that keep coming back. You cannot yet say which one is winning in India.
illustrations:
- body: |
    Start with a sentence you may hear in your department: "Most people blame obesity on the food
    environment now." It sounds like a finding. Take it apart.

    Its likely source is the survey by Barry and colleagues. Open it at
    https://pmc.ncbi.nlm.nih.gov/articles/PMC2879183/ and find the section on the seven metaphors.
    Each respondent read seven short accounts of why Americans had become heavier. For each, they
    said for how many of every 100 Americans with weight problems it "explains a lot". A score of
    10 or more counted as calling it an important explanation.

    Now read the result. The toxic food environment was called important by 77.5 per cent, the
    highest of the seven. Sinful behaviour was called important by 50.5 per cent, the lowest. Both
    are majorities.

    Here is the trap. "Called important" means the respondent thought the account explained a lot
    for at least 10 in every 100 people with weight problems. It does not mean they thought it was
    the cause. Most held several accounts at once: 42 per cent called at least five of the seven
    important, and only 11 per cent called two or fewer. So "most people blame the food
    environment" turns a several-cause picture into a one-cause one.

    Then ask Book 0's questions about the sample. Who? Adults in the United States, in a web panel
    recruited by random telephone dialling. When? Late 2006 to early 2007. How many? {{n:barry_n}}, with a
    completion rate of 75 per cent. The authors say the sample departed from the national
    population in several ways and weighted their percentages to correct for it. Nothing in it
    tells you about India.

    Now sort the frames you have met. The table is this book's sorting of the frames named in the
    held studies, with the study that names each.

    ```table
    | Frame, in this book's words | Where it puts the cause | Named in |
    | personal choice and effort | each person's eating and activity | Barry, "sinful behavior"; Saguy and Riley, "risky behavior"; Kwan, "market choice" |
    | food environment | what is cheap, easy and everywhere | Barry, "toxic food environment" |
    | commercial interests | what companies make, sell and advertise | Barry, "manipulation by commercial interests" |
    | disease | a medical condition in the body | Saguy and Riley, "disease" and "illness"; Kwan, "medical" |
    | justice | who bears the burden, and whether it is fair | Kwan, "social justice"; Jenkin and colleagues, "market justice vs social justice" |
    | body diversity | no cause: it rejects the problem | Saguy and Riley, "body diversity" |
    ```

    Barry's four middle accounts (time crunch, food addiction, eating disorder, disability) mix
    personal and outside causes, as the authors say. They do not sit in one row.
  analogy_breaks_when: |
    The sorting is this book's, made to help you read. The studies do not use one shared list, and
    the same word ("medical", "disease") can carry different weight in each. Treat the rows as
    reading aids, not as categories any of the studies tested.

    The percentages are what one United States sample said in 2006 and 2007, when shown accounts
    the authors wrote. Different wording, a different year or an Indian sample could give a
    different order.
