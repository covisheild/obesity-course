definition:
  text: |
    Obesity is argued in several frames, each placing the cause, and so the responsibility,
    somewhere different. The studies held for this book, that is, the ones it has opened and read,
    name these among others.

    Obesity is a matter of personal choice and effort. It is the product of a food environment that
    makes unhealthy food cheap and easy. It is the result of manipulation by commercial interests.
    It is a disease or medical condition. It is a question of social justice. (These are named in
    Barry and colleagues 2009 and in three studies Koon and colleagues review; see the table
    below.)

    The largest held measurement is a United States survey by Barry, Brescoll, Brownell and
    Schlesinger (2009). It was fielded from late 2006 to early 2007 to {{n:barry_n}} adults in a
    national web panel recruited by random telephone dialling; its completion rate was 75 per cent.

    Respondents were shown seven short accounts of why Americans had become heavier, drawn, in the
    authors' words, from "elite discourse". The seven were: sinful behaviour, disability, eating
    disorder, food addiction, time crunch, manipulation by commercial interests, and a toxic food
    environment. The authors put sinful behaviour at the end that blames the person most. They put
    manipulation and the toxic food environment at the end that blames the person least. The four
    between them mix personal and outside causes, in no clear order.
    Three of the seven line up with frames above: sinful behaviour with personal choice, toxic
    environment with food environment, manipulation with commercial interests.

    A majority called each of the seven important. The toxic food environment led, at 77.5 per cent
    (adjusted so that the sample's mix matches the national population). Sinful behaviour came
    last, at 50.5 per cent.

    The held Indian evidence is one study of taxes and subsidies on food (Summan and colleagues,
    2026). It rests on {{n:summan_kii_n}} interviews, held between February and September 2024 with
    people mostly based in Delhi, and on a review of published and official documents.

    No held study measures which frame dominates news or official texts in India.
