- body: |
    Now look at how much research there is behind any claim about obesity frames in policy. Open
    the scoping review by Koon, Hawkins and Mayhew (a map of what has been studied, not a pooled
    analysis) at https://pmc.ncbi.nlm.nih.gov/articles/PMC4916318/
    and find the paragraph on the health issues covered.

    The review searched for studies that showed a frame affecting a health policy. It kept 52
    articles, from 1996 to 2014, from 12 countries. The United States gave the most, 15. By health
    issue, it counts infectious disease 10, substance misuse 9, reproductive and sexual health 5,
    access to medicines 4 and environmental health 3. Its 6 studies on non-communicable diseases
    split into cancer 3 and obesity 3.

    So three studies in a review of the whole field were on obesity. Two were from the United
    States and one from New Zealand. Read the Appendix rows for the three and you can see the
    frames each found. None is from India.

    The review also says what it left out. Studies of how the news media frame obesity were
    excluded, because they showed effects on public opinion rather than on a policy. So this review
    cannot tell you which frame dominates the news, and neither can anything else held here.

    Now the Indian study. Open Summan and colleagues at
    https://pmc.ncbi.nlm.nih.gov/articles/PMC13586620/ and find Table 1. The authors held {{n:summan_kii_n}}
    interviews between February and September 2024: 4 in person and 14 online. These were key
    informant interviews, with people chosen because they know the policy area. Count the groups
    in the table. Academia 4. Think tanks, civil society and non-governmental organisations 4.
    Government 3, one each from finance and health, the executive and the legislature. Food and
    beverage industry 2. Health sector 2. Media 2. Consumer interest 1.

    Now read for frames. Search for "raise revenue". A health finance official, in the article's
    report, says: "the tax policy is supposed to raise revenue and that's it". That is a revenue
    frame. In it, a tax exists to collect money, so a health aim is out of place. Then search
    Table 3 for the health ministry's row. Among the things it could do, the authors list: "Frame
    health taxes as important public health tools." That is a health frame for the same tax. The
    authors also report that taxes on junk foods are perceived as regressive: falling hardest on
    those with least money. That is a fairness frame, and it can be used against the tax.
    It is the justice frame of the first table, applied to who pays. The revenue frame is not in
    that table: it belongs to arguments about taxes.

    Look again at who was asked. Two industry voices and one consumer voice, mostly in Delhi, and
    the authors themselves say mostly urban. This shows that the revenue and health frames are both
    present among people close to the decision. It does not show how common either is.
  analogy_breaks_when: |
    Interviews show which frames people near a decision use. With {{n:summan_kii_n}} people, chosen for what they
    know and found partly through one another, they cannot show how common a frame is, nor which
    one wins. The quotations are the article's report of what was said, chosen by its authors to
    illustrate their themes.

    The review's count of three obesity studies is of studies found by June 2014 that met its
    rules. Later studies, or studies the review's rules left out, could change the picture.
