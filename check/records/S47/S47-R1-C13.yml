must_know:
- point: |
    Never say "most people blame the food environment". Say "an important explanation among several", with
    the country, the years and the sample.
  kind: misconception
  bearing: public
  refs:
  - barry_2009_metaphors
- point: |
    Do not sort a person, a ministry or a newspaper into one frame. Expect people to hold the
    personal and the environmental frame together, and argue with both.
  kind: consequence
  bearing: policy
  refs:
  - barry_2009_metaphors
- point: |
    A United States survey from 2006-07 is not Indian public opinion. No study held here measures
    which frames Indians hold about obesity.
  kind: trap
  bearing: methodological
  refs:
  - barry_2009_metaphors
- point: |
    In Indian argument over food taxes, expect a revenue frame. In Summan and colleagues' interviews,
    a health finance official is reported saying that tax policy "is supposed to raise revenue and
    that's it". A health case for a tax has to meet that frame head on, not ignore it.
  kind: india_deviation
  bearing: policy
  refs:
  - summan_2026_foodtax
- point: |
    Expect the fairness frame too. Summan and colleagues report that taxes on junk foods are perceived
    as falling hardest on poorer buyers. A note on a food tax that does not say who pays will be
    answered in that frame.
  kind: consequence
  bearing: policy
  refs:
  - summan_2026_foodtax
- point: |
    The research on obesity frames in policy is thin. Koon and colleagues found 3 obesity studies
    among 52 on framing and health policy up to 2014, none from India.
  kind: boundary
  bearing: methodological
  refs:
  - koon_2016_framing
- point: |
    Before you use an interview study's frames, count who was asked. Such a study shows that a frame exists
    among people near the decision, never how common it is.
  kind: trap
  bearing: methodological
  refs:
  - summan_2026_foodtax
- point: |
    Know what would overturn these findings. One is an Indian survey that put the same accounts to a
    random sample and found a different order. Another is a review that found many obesity framing
    studies from India. Until then, quote each finding with its country, its years and its sample.
  kind: boundary
  bearing: methodological
  refs:
  - barry_2009_metaphors
  - koon_2016_framing
exercises:
- type: retrieval
  prompt: |
    From memory: name Barry and colleagues' seven accounts of obesity, from most personal blame to
    least, as far as the authors order them. Then give the survey's country, years and sample size.
  answer: |
    Most personal blame: sinful behaviour. In the middle, mixing personal and outside causes, in no
    fixed order: time crunch, food addiction, eating disorder, disability. Least personal blame:
    manipulation by commercial interests, and a toxic food environment.

    United States; late 2006 to early 2007; {{n:barry_n}} adults in a national web panel.
- type: critique
  prompt: |
    Here is a sentence from a classmate's draft note, made up for this exercise. "Studies show that
    78% of people blame obesity on the food environment, so the public in Chhattisgarh will support a
    tax on sugary drinks."

    Find each step that does not hold. Say what you would write instead.
  answer: |
    Lay it out as premises and a conclusion (Book 0, F4). Premise: 78 per cent of people blame
    obesity on the food environment. Conclusion: the public in Chhattisgarh will support the tax.

    The premise is misreported in two ways. The figure is 77.5 per cent, rounded to 78 in the paper's
    text. It is the share of United States adults in 2006-07 who called the food environment an
    important explanation. "Important" meant explaining a lot for at least 10 in every 100 people
    with weight problems. It is not "blame", and most respondents called several accounts important.

    The inference fails on its own. A belief about cause is not support for a measure, and a United
    States sample tells you nothing about Chhattisgarh. Even inside that survey, support for a tax on
    junk food is a separate question with its own answer.

    Instead: "In one United States survey (2006-07, {{n:barry_n}} adults), 77.5 per cent called the food
    environment an important explanation of obesity, alongside other accounts. No comparable Indian
    survey is known to us. Public support in Chhattisgarh for a tax on sugary drinks has not, to our
    knowledge, been measured."
  skill_ref: S47-R1-K02
- type: teaching
  prompt: |
    A journalist has three minutes and asks: "How do Indians see obesity: as their own fault, or
    as the fault of the food industry?" Answer without jargon, with your confidence, and give one
    sentence they could quote.
  answer: |
    Honestly: we do not know. No survey I know of has asked Indians to weigh these explanations.

    What we do know comes from elsewhere. In one American survey, in 2006 and 2007, most people saw
    several causes at once, both personal habits and what is sold around them. The one Indian study
    I know of interviewed {{n:summan_kii_n}} people close to food-tax decisions in 2024. It found the tax being argued
    as a way to raise money, as a health measure, and as unfair to poorer buyers.

    Confidence: low for India, because nobody has measured it. Moderate that people hold several
    views at once, because the American survey found that clearly.

    Quotable: "Nobody has yet asked Indians this properly; where people have been asked, they see
    more than one cause."
  skill_ref: S47-R1-K02
retrieval_items:
- q: In Barry and colleagues' survey, which account was most often called an important explanation, and by what share?
  a: The toxic food environment, by 77.5 per cent of United States adults (2006-07, {{n:barry_n}} surveyed, weighted).
- q: How many of the 52 studies in Koon and colleagues' review were on obesity, and from where?
  a: Three; two from the United States and one from New Zealand. None from India.
- q: What frames did Summan and colleagues' Indian interviews show around food taxes?
  a: A revenue frame (tax policy is for raising revenue), a health frame (taxes as public health tools) and a fairness frame (taxes on junk food perceived as regressive).
common_misreading: |
  "Barry and colleagues found that 78 per cent of people blame the food environment." Not quite. The
  paper's table gives 77.5 per cent, and its text rounds it to 78. These people called the food
  environment an important explanation.

  That meant it explained a lot for at least 10 in every 100
  Americans with weight problems. Most of them called other accounts important too. The figure shows
  how widely an account is accepted as part of the story. It does not show who is blamed.
