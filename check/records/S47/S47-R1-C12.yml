definition:
  text: |
    To frame an issue is to choose which of its aspects an account makes prominent and which it
    leaves out. In Entman's (1993) account, as reported by Koon, Hawkins and Mayhew in a 2016
    review of framing research on health policy, the choice serves four functions. The account
    defines a problem, diagnoses its cause, passes a moral judgement and suggests a remedy.

    A frame need not show all four. Selection alone is enough to frame.

    An episodic frame tells an issue through one case or event, with its details. A thematic frame
    takes the broad view: the trend over time and what led to it.

    Agenda setting, the first stage of the policy process in the model of `S47-R1-C01`, starts with
    the choice of which issues get attention at all.
