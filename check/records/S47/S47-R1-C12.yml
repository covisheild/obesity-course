simplified_explanation: |
  Any account of a problem leaves things out. It has to: no report, speech or note can say
  everything. What it keeps in, and what it drops, is its frame.

  A frame usually does four jobs.

  1. **Problem.** What does it say is wrong?
  2. **Cause.** Whom or what does it say is to blame?
  3. **Judgement.** What verdict does it pass: who is at fault, what is fair?
  4. **Remedy.** What does it say should be done?

  These four come from a writer named Entman, as a 2016 review by Koon and colleagues reports
  them. Not every account carries all four. But every account leaves something out, so every
  account has a frame. Your own notes do too.

  An **episodic** frame tells the issue through one case: one child, one shop, one day. A
  **thematic** frame tells the trend: what changed over years and why. **Agenda setting** starts
  with choosing which issues get talked about at all, a choice made before any frame is chosen. **Priming** is when
  what you read first tilts how you judge what comes next.
illustrations:
- body: |
    Start with your department's second proposal, a rule on what school canteens may sell. Suppose
    two made-up letters about it reach the district newspaper on the same day. Neither carries a
    number, and neither is from a real person.

    > Letter A. Children fill up on fried snacks because parents no longer pack lunch. Schools
    > should hold talks for parents on packing a healthy tiffin.

    > Letter B. Children eat what the canteen sells, and the canteen sells what earns most. The
    > rule on what canteens may sell should change.

    Take a pen and fill in the four labels for each letter. Do it before you read on.

    ```table
    | Function | Letter A | Letter B |
    | Problem | children fill up on fried snacks | children fill up on fried snacks |
    | Cause | parents no longer pack lunch | the canteen sells what earns most |
    | Judgement | parents have fallen short | the arrangement is at fault, not the child |
    | Remedy | talks for parents | a rule on what canteens may sell |
    ```

    Look at the first row. The two letters name the same problem. Every row after it differs.
    Letter A never mentions the canteen, and Letter B never mentions the home. Neither of these
    is a false statement. Each is a choice of what to leave out, and that choice is its frame.

    Now look at the last row. Letter A's remedy is something a school can do on its own. Letter
    B's remedy needs whoever holds the power to set rules for canteens. So the frame has already
    decided where the proposal would be sent, before anyone has traced who decides.

    Your own department's note will face the same choice. Suppose its draft opens like this,
    again made up: "Overweight among the district's schoolchildren is driven by packaged snacks
    sold near schools." Fill in the labels. Cause: packaged snacks near schools. Left out: play
    space, sleep, family income, what is cooked at home. The note is not wrong to choose. It is
    wrong only if it pretends it did not.
  analogy_breaks_when: |
    The two letters were written to differ in frame and in nothing else. Real texts mix frames,
    leave some of the four labels blank, and hide the judgement in a single word. Labelling a real
    paragraph is slower and less certain than this, and two careful readers can label the same
    paragraph differently.

    The labels say what a text chose. They do not say whether its cause is the true one. That
    needs evidence, not labelling.
- body: |
    Now try a real text, where a speaker names the frame he is rejecting. Open the Press
    Information Bureau's English rendering of the Prime Minister's 119th Mann Ki Baat broadcast,
    23 February 2025, at https://www.pib.gov.in/PressReleasePage.aspx?PRID=2105618. Search for
    "cosmetic". The words belong to Dr Devi Shetty, a guest on the broadcast, whom the Prime
    Minister introduces as "a very distinguished doctor".

    > Obesity today is not a cosmetic problem; it is a very serious medical problem.

    The sentence does the first job, the problem, out loud. It swaps one frame for another: not a
    matter of appearance, a matter of medicine. Read on to the next sentence but one for the
    cause.

    > The main cause of obesity today is poor quality of food intake especially excess intake of
    > carbohydrates that is rice, chapatti and sugar and of course large consumption of oil.

    The cause sits in what a person eats. Now search for "my advice" to find the remedy.

    > So my advice to all the youngsters… start exercising control your diet and be very very
    > active and watch your weight.

    Fill in the four labels. Problem: a serious medical problem. Cause: what people eat. Judgement:
    the problem is to be taken seriously, not dismissed as looks. Remedy: each young person
    exercises and controls their diet. Notice the mix. The problem is put in medical words, but
    the remedy is put on the individual. Nothing in the message asks what is sold, advertised or
    taxed. That is what this frame leaves out.

    The same broadcast also shows agenda setting. Search for "new discussion". The Prime Minister
    says of his earlier speech: "I raised a very important topic, which has started a new
    discussion in the country - this topic is 'obesity'." Choosing the topic comes before any
    frame. The textbook definition speaks of the media choosing which issues get attention. A
    head of government with a national broadcast is doing the same kind of choosing, and that
    reading is this book's, not the textbook's.
  analogy_breaks_when: |
    A broadcast is a short spoken text with guests chosen to support one message. A long report or
    a court judgment carries several frames at once, and one sentence will not show you its frame.
    Read the whole text before you label it.

    The quoted words are an English rendering of a Hindi broadcast, as the Press Information
    Bureau titles it. A frame can turn on one word, so check the original language before you
    build an argument on a single word of a translation.
- body: |
    The last move is the difference between an episodic and a thematic frame. Suppose, again as a
    made-up case, that two reporters cover the canteen proposal.

    The first reporter visits one school. She writes about one Class 6 boy, what he bought at the
    canteen on Monday, and what his mother says. That is an episodic frame: one case, its details.

    The second reporter writes about how what is sold near schools has changed over years, and
    why. She quotes no single child. That is a thematic frame: the broad view, the trend and its
    causes.

    The United States textbook this section draws on says episodic frames "may create more
    sympathy", while a thematic frame may leave a reader "less sympathetic". Notice the word
    "may". It is offered as a tendency, from American news, not as a law. Use it as a question to
    ask of a story, not as a fact about Indian readers.

    Ask what each story makes easy to think. The boy's story makes his choices visible, and his
    mother's. The trend story makes the canteen's stock visible, and whoever decides it. Each
    story can lead a reader to a different remedy.
  analogy_breaks_when: |
    Most real stories mix the two: a thematic report opens with one family, then widens. Labelling
    a whole story as one or the other is a simplification. Label each part instead.

    The claim about sympathy is the textbook's, stated as "may", from United States coverage. This
    book holds no study of Indian readers that tests it.
must_know:
- point: |
    When someone claims to be neutral, ask which frame they are using and what it leaves out.
  kind: misconception
  bearing: methodological
- point: |
    Before you agree or disagree with a paragraph, write its four labels: problem, cause, judgement,
    remedy. Then write one line on what it leaves out.
  kind: move
  bearing: policy
- point: |
    When you cite the four functions, cite them as Entman's, as reported by Koon and colleagues
    (2016).
  kind: trap
  bearing: teaching
  refs:
  - koon_2016_framing
- point: |
    When a paper says "frame", check which it means: a value, a problem, a metaphor or an argument.
    Koon and colleagues found the word used for all four.
  kind: trap
  bearing: methodological
  refs:
  - koon_2016_framing
- point: |
    Keep the three ideas apart in a meeting. Agenda setting decides whether obesity is discussed at
    all. Framing decides how it is described once it is. Priming is what a first story does to the
    next judgement. Calling all three "framing" loses the one you need.
  kind: consequence
  bearing: public
  refs:
  - openstax_amgov_4e
- point: |
    Labelling a frame tells you what a text chose to show. Never answer an argument only by
    naming its frame.
  kind: boundary
  bearing: methodological
- point: |
    The frame of a proposal decides where it gets sent. Choose the frame of your own note on
    purpose, and say it in the first lines.
  kind: consequence
  bearing: policy
exercises:
- type: retrieval
  prompt: |
    From memory: name the four functions a frame serves, as Koon and colleagues report Entman. Then
    say in one line each what an episodic frame, a thematic frame, agenda setting and priming are.
  answer: |
    The four functions: it defines a problem, diagnoses a cause, passes a moral judgement and
    suggests a remedy.

    An episodic frame tells an issue through one case or event and its details. A thematic frame
    takes the broad view: the trend over time and what led to it. Agenda setting starts with choosing
    which issues get attention at all. Priming is predisposing a reader to think a particular way, so
    that what they meet first colours a later judgement.
- type: interpretation
  prompt: |
    Here is a made-up opening paragraph of a district health report. Write its four labels and one
    line on what it leaves out. Say whether it is episodic or thematic.

    > Over the past decade, the snacks sold within sight of our schools have shifted towards packaged
    > foods. Families report less time to cook. The district has a duty to act before a generation
    > grows up on this food.
  answer: |
    Problem: what children eat has shifted towards packaged snacks near schools. Cause: two are
    named, the shops' stock and families' lack of time to cook. Judgement: the district has a duty,
    so the fault lies with public inaction rather than with children. Remedy: not stated. "Act" is
    a call without a measure, so this label is blank.

    Left out: activity, sleep, prices and income, who supplies the shops, and any number. It is
    thematic: it describes a change over a decade and its causes, with no single child or shop.

    One more thing to notice: "grows up on this food" passes a judgement on the food in a phrase.
    Judgements often sit in a single phrase like this rather than in a sentence of their own.
  skill_ref: S47-R1-K02
- type: teaching
  prompt: |
    A first-year resident says: "Framing is spin. Researchers should not frame; they should report
    the data." Explain, in ten minutes with a whiteboard, why that cannot be done, and what a
    researcher should do instead.
  answer: |
    Draw a box for the whole issue and a smaller box inside it for what one report can hold. Any
    report selects, because it is finite. Selection is the first move of a frame: some aspects
    made prominent, others left out. So a report without a frame is not available to anyone.

    Then separate framing from spin. Spin hides the choice and presents a frame as the only way to
    see the issue. A researcher can do the opposite. Name the frame you chose and say what it
    leaves out. Where it matters, say how the same data would read in another frame.

    Use the review by Koon and colleagues as an example. The three authors write that they "make no
    claims to objectivity" and that their training shaped their reading. They still aimed for "a
    fair and balanced account". That is the standard: not frameless, but open about the frame.
  skill_ref: S47-R1-K02
retrieval_items:
- q: What four functions does a frame serve, in Entman's account as Koon and colleagues report it?
  a: Define a problem, diagnose its cause, pass a moral judgement, suggest a remedy.
- q: Why does every account have a frame?
  a: Every account is finite, so it selects some aspects and leaves others out, and selection is
    the first move of framing.
- q: How does agenda setting differ from framing?
  a: Agenda setting decides which issues get attention at all; framing decides how an issue is
    described once it has attention.
