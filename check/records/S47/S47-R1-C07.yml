simplified_explanation: |
  Parliament passes an Act. The Act often leaves the detail to someone else.

  Many Acts say a rule or regulation may be made only "after previous publication". That means a draft comes
  first, with a date on it. Anyone may send an objection or a suggestion before that date, and the body must
  consider it. Then the final text appears in the Gazette, the government's official newspaper.

  After that it goes before Parliament, which can change it or cancel it. But by then it has
  already been made.
illustrations:
- body: |
    Here is the trap with a draft's deadline. The date printed on the draft is not always the
    day the clock starts.

    Open the Food Safety and Standards (Packaging) Regulations, 2018, notified by FSSAI on 24
    December 2018 (https://www.fssai.gov.in/). The top of the page says it appeared in the
    Gazette of India, Extraordinary, Part III, Section 4. Go to the English text. Read the
    paragraphs that begin "Whereas". Write down what each one tells you.

    The first gives the draft's date, 19 March 2018. It says the draft invited objections
    "before the expiry of a period of thirty days from date on which the copies of Gazette
    containing the said notification was made available to the public". A later paragraph gives
    that date: 2 April 2018.

    Suppose you had counted {{n:packaging_draft_objection_days}} days from 19 March. Work out how early you would have
    stopped.

    ```working
    31 minus 19 = 12 days left in March
    12 plus 2 = 14 days
    ```

    Your deadline would have fallen 14 days too soon. Read the notice for the day it counts
    from, not the date at the top of the draft.

    The next paragraph says the objections received "have been considered". It does not say how
    many came, what they said, or what changed because of them.

    Now read the paragraph that begins "Now, therefore". It names the power: clause (k) of
    section 92(2), "read with section 23 of the Food Safety and Standards Act". That section
    23 is the Act's own section on packaging and labelling. It is not section 23 of the General
    Clauses Act. Two laws carry a section with the same number, and a note that mixes them up
    cites the wrong one.

    Last, count the whole path, from the draft's date to the final notification.

    ```working
    12 days left in March
    30 plus 31 plus 30 plus 31 plus 31 plus 30 plus 31 plus 30 = 244 days, April to November
    12 plus 244 plus 24 = 280 days
    ```

    The window for objections was {{n:packaging_draft_objection_days}} days. The whole path took 280. Regulation 1(2) then
    gave food businesses until 1 July 2019 to comply.
  analogy_breaks_when: |
    This is one regulation's path. Another draft, from another body or under another Act, may
    set a different period or count it from a different day, so read each notice for itself.
    The 280 days hold for this regulation only. The notification does not say when it was laid
    before Parliament, so the Gazette alone cannot tell you whether that step has happened.
  numbers:
  - value: '30'
    unit: days for objections to the draft Packaging Regulations, from the date Gazette copies were available
    citekey: fssai_2018_packaging_regs
    quote: "before the expiry of a period of thirty days from date on which the copies of Gazette containing the said notification was made available to the public"
  - value: '14'
    unit: days from the draft's date to the day Gazette copies were available
    citekey: fssai_2018_packaging_regs
    quote: "copies of the said Gazette were made available to the public on the 2nd April, 2018"
    derived: "19 March 2018 to 2 April 2018: 31 minus 19 = 12 days left in March, plus 2 = 14"
  - value: '280'
    unit: days from the draft's date to the final notification
    citekey: fssai_2018_packaging_regs
    quote: "New Delhi, the 24th December , 2018"
    derived: "19 March 2018 to 24 December 2018: 12 days left in March, 244 days April to November, 24 days of December; 12 plus 244 plus 24 = 280"
- body: |
    The section that gives a power also tells you whether you will see a draft. Read three
    sections of the Food Safety and Standards Act side by side
    (https://indiacode.gov.in/handle/123456789/586348). In each, look for three phrases: "by
    notification", "with the previous approval of", and "after previous publication".

    ```table
    | Section | Who makes it | A draft first? | Whose approval first? |
    | 91(1), rules | the Central Government | the section does not say so | none named |
    | 92(1), regulations | FSSAI | yes: "after previous publication" | the Central Government's |
    | 94(1), State rules | a State Government | yes: "after previous publication" | FSSAI's |
    ```

    Now take the third proposal on your department's list, a warning label on packaged foods
    high in sugar, salt or fat. The 2018 packaging regulation was made under section 92(2)(k),
    which covers "the manner of marking and labelling of foods under section 23". A label rule
    made by FSSAI is a regulation under section 92, so a draft must come first. That draft, and
    the date in its notice, is your department's door.

    A rule under section 91 is different. The Act's words promise no draft, so the Act gives you
    no date to work to. The Pre-legislative Consultation Policy of 2014 asks departments to put
    drafts in public for at least {{n:plcp_comment_days}} days anyway, and its heading says it
    covers subordinate legislation. But it is a decision of senior officials, not a law. A
    department may skip it and record its reasons in the note for the Cabinet. In 2022 the Law
    Ministry told the Rajya Sabha it keeps no record of compliance.

    Then think about who reads your comment. Where section 23 of the General Clauses Act applies,
    the body making the rule must consider it. So must any authority whose approval the Act
    requires. The policy also asks for a summary of the feedback on the department's website.
    Write your comment as a public document with your name on it, because it may be read as one.

    After the final text is made, section 93 sends it to Parliament for {{n:laying_days}} days of sitting.
    That is a second thirty, and it is not the period for objections.
  analogy_breaks_when: |
    The table is true of one Act. Every Act writes its own power, so read the section each time
    and never assume the pattern carries over. And "after previous publication" tells you a
    draft must come. It does not tell you how long the period is, which the draft's own notice
    sets.
must_know:
- point: |
    "A regulation takes effect only once Parliament approves it" is wrong for the Food Safety and
    Standards Act. Section 93 lays each rule and regulation before Parliament after it is made.
    The Houses may then modify or annul it, and anything already done under it stays valid. Do
    not tell anyone they can wait for Parliament.
  kind: misconception
  bearing: policy
  refs:
  - fss_act_2006
- point: |
    Before you plan a comment, open the section that gives the power. Find "by notification",
    "with the previous approval of" and "after previous publication". They tell you whether a
    draft will appear, and which two bodies must hear you.
  kind: move
  bearing: policy
  refs:
  - fss_act_2006
- point: |
    Count the objection period from the day the notice names. For the 2018 packaging draft, that
    was the day Gazette copies reached the public, 2 April 2018, not the draft's date of 19
    March.
  kind: trap
  bearing: policy
  refs:
  - fssai_2018_packaging_regs
- point: |
    Two different thirties sit in the same process. The 2018 packaging draft's period for
    objections was {{n:packaging_draft_objection_days}} days. Section 93 keeps a made regulation
    before Parliament for {{n:laying_days}} days of sitting. Say which one you mean.
  kind: trap
  bearing: public
  refs:
  - fssai_2018_packaging_regs
  - fss_act_2006
- point: |
    Section 23 of the General Clauses Act makes the body consider an objection. It does not make
    the body accept it, or answer it. Once the final rule is in the Official Gazette, that
    publication is conclusive proof it was duly made.
  kind: consequence
  bearing: policy
  refs:
  - general_clauses_act_1897
- point: |
    The 2014 consultation policy binds officials as a decision of the Committee of Secretaries,
    not as a law. Do not call a missing consultation unlawful on the policy's strength alone;
    check whether the Act itself asks for previous publication.
  kind: india_deviation
  bearing: policy
  refs:
  - plcp_2014
  - pib_1797203
- point: |
    The final notification tells you the steps were taken. To find out what changed, set the
    draft beside the final text, clause by clause.
  kind: boundary
  bearing: methodological
common_misreading: |
  "Objections considered" in a final notification is read as "objections accepted". It records
  only that a step was taken. Whether any comment changed the text shows only when you compare
  the draft with the final version.
reporting_sentence: |
  FSSAI may make this regulation only after publishing a draft, and only with the Central
  Government's approval (Food Safety and Standards Act, 2006, section 92(1)). Objections must
  reach it within the period its draft notice states.
exercises:
- type: retrieval
  prompt: |
    From memory, list what section 23 of the General Clauses Act, 1897 requires when an Act gives
    a power to make rules "after previous publication". Then say what section 93 of the Food
    Safety and Standards Act adds after a rule is made.
  answer: |
    Section 23 asks for four things. First, a draft goes out for the people likely to be
    affected. Second, a notice goes with it, giving the date from which the draft will be taken
    up. Third, the body making the rule must consider every objection or suggestion that arrives
    before that date. So must any body whose approval is needed. Fourth, once the final rule is
    in the Gazette, that is proof it was made properly.

    Section 93 adds a step after the rule is made. It goes before each House of Parliament for
    {{n:laying_days}} days of sitting. If both Houses agree, they can change it or cancel it. What was done
    under it before that stays valid.
  confidence_first: true
- type: interpretation
  prompt: |
    Here is part of section 94(1) of the Food Safety and Standards Act.

    > the State Government may, after previous publication and with the previous approval of the
    > Food Authority, by notification in the Official Gazette, make rules ...

    Suppose your State's food safety
    department plans rules under it. List the steps the section requires, in order, and name
    every body that must act. Then say one thing the section does not tell you.
  answer: |
    Steps: the State Government publishes a draft first ("after previous publication"). FSSAI,
    the Food Authority, must approve before the rules are made. The State Government then makes
    them by notification in the Official Gazette. Section 94(3) also has every State rule laid
    before the State Legislature after it is made.

    Bodies: the State Government and FSSAI.

    The section does not say how long the objection period is, or from which day it runs. The
    draft's own notice sets that. Nor does it say which State department drafts the rules.
  skill_ref: S47-R1-K01
- type: critique
  prompt: |
    Here is a made-up note from a colleague.

    > FSSAI's draft on warning labels is dated 1 June, so we have thirty days from 1 June. If we
    > miss it, no matter. The regulation cannot take effect until Parliament votes on it. We can
    > write to our member of Parliament then.

    Find the errors.
  answer: |
    First, the period runs from the day the draft's notice names. In the 2018 packaging case that
    was the day Gazette copies reached the public, two weeks after the draft's date. Read the
    notice before counting.

    Second, "thirty days" is assumed. The notice sets the period; check it.

    Third, Parliament does not vote a regulation into effect. Section 93 lays it before both Houses
    after it is made. The Houses may modify or annul it, but it has been made already, and what
    was done under it stays valid.

    The fix: "Find the draft notice and the date it counts from. Send our objection before that
    date. FSSAI must consider it, and so must the Central Government, whose approval section 92
    requires."
  skill_ref: S47-R1-K01
- type: teaching
  prompt: |
    A first-year resident in your department asks why you will not start writing a comment on a
    food regulation until you have read the Act. You have ten minutes and a whiteboard. Explain.
  answer: |
    Draw a line from "Act" to "rule or regulation". Write on it the three phrases the power can
    carry: "by notification", "with the previous approval of", "after previous publication".

    Then explain what each changes. "After previous publication" means a draft will come, with a
    date. That date is when the comment must arrive. "With the previous approval of" names a
    second body that must agree. Where section 23 of the General Clauses Act applies, that body
    must consider objections too. "By notification" tells you the final text will appear in the
    Gazette, and that Gazette publication settles that it was duly made.

    Show the contrast on the board: FSSAI regulations under section 92 need a draft; Central
    Government rules under section 91 do not say so. Finish with the 2018 packaging case: the
    clock ran from 2 April 2018, not from the draft's date of 19 March. Reading the Act first is
    how you find the door and the deadline.
retrieval_items:
- q: Under the Food Safety and Standards Act, which body makes regulations, and with whose approval?
  a: FSSAI, the Food Authority, with the previous approval of the Central Government and after
    previous publication (section 92(1)).
- q: When does section 93 of the Food Safety and Standards Act send a regulation to Parliament,
    and what can the Houses do?
  a: As soon as may be after it is made, for {{n:laying_days}} days of sitting. Both Houses together may
    modify or annul it, without affecting anything already done under it.
- q: From what day did the objection period for the 2018 packaging draft run?
  a: From 2 April 2018, the day Gazette copies were made available to the public, not the draft's
    date of 19 March 2018.
- q: Is the Pre-legislative Consultation Policy of 2014 a law?
  a: No. It is a decision of the Committee of Secretaries of 10 January 2014, a policy of the
    Union government.
