    quote: "Where, by any 1[Central Act] or Regulation, a power to make rules or bye-laws is expressed to be given subject to the condition of the rules or bye-laws being made after previous publication, then the following provisions shall apply"
    verified:
      resolved_id: https://www.indiacode.nic.in/
      opened: true
      claim_located: true
      checked_on: '2026-10-02'
      note: |
        "1[Central Act]" is the India Code copy's footnote marker; footnote 1 records the
        substitution by the Adaptation Order of 1937. Section 23 speaks of "rules or bye-laws".
        The Act's definition of "rule" (section 3), which would settle whether section 23 reaches
        a regulation made by a statutory body, is not held, so the record does not say it does.
