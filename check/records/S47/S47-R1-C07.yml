definition:
  text: |
    A rule or a regulation is made by the body an Act names, under the power that Act gives, and by the
    procedure that the same Act sets. The section that gives the power can carry three conditions. "By
    notification": the instrument is made by publishing it in the Gazette. "With the previous approval of"
    another authority: a second body must agree first. "After previous publication": a draft must be
    published first.

    Section 23 of the General Clauses Act, 1897 applies where a Central Act gives a power to make "rules or
    bye-laws" subject to previous publication. The authority must publish a draft for the information of
    persons likely to be affected. It must publish with the draft a notice of the date on or after which
    the draft will be taken into consideration. It, and any authority whose sanction, approval or
    concurrence is needed, must consider any objection or suggestion received from any person before that
    date.
  references:
