simplified_explanation: |
  Picture a ladder. The Constitution is the top rung. Below it are Acts, made by Parliament or a
  State Legislature. An Act can hand a named body the power to make rules or regulations. Below
  those are notifications and orders, each issued under some section that allows it. A rung cannot
  go further than the rung above lets it.

  Most notifications tell you their own rung. Near the start they say "in exercise of the powers
  conferred by" and name a section.

  A government can also act by executive decision — a decision of the government itself, with no
  new Act behind it.
illustrations:
- body: |
    Start with a sentence that cannot be checked. Suppose a made-up draft letter from your department
    ends like this:

    > We request the Government to use its powers to stop the sale of sugary drinks near schools.

    Ask the question this section is about: under what authority? The letter does not say. "The
    Government" could be the Union or the State. "Its powers" names no provision. Nobody can act on
    it, and nobody has to answer it. Your department has written a request to no one.

    Now see what a checkable answer looks like, on a real instrument. Open the Digital Personal Data
    Protection Rules, 2025, notification G.S.R. 846(E) of 13 November 2025. The letters and number
    are the label the Gazette gives the notification, and the way you cite it. It was published by the Ministry
    of Electronics and Information Technology
    (https://www.meity.gov.in/static/uploads/2025/11/53450e6e5dc0bfa85ebd78686cadad39.pdf). Search for "in exercise of powers". The rules are made
    "in exercise of powers conferred by sub-sections (1) and (2) of section 40" of the Digital Personal
    Data Protection Act, 2023.

    Climb one rung. Open the Act
    (https://www.meity.gov.in/static/uploads/2024/06/2bf1f0e9f04e6fb4f8fef35e82c42aa5.pdf) and go to
    section 40(1). The Central Government may "make rules not inconsistent with the provisions of this
    Act". So the rules rest on the Act, and the Act sets their limits.

    Climb again. The Act is an Act of Parliament. Article 245 of the Constitution says that Parliament
    "may make laws for the whole or any part of the territory of India". Which subjects it may make
    laws on is the next section's work.

    ```table
    | Rung | Instrument | What it says about the rung above |
    | 1 | Constitution of India, article 245 | Parliament may make laws |
    | 2 | Digital Personal Data Protection Act, 2023, section 40(1) | rules must be "not inconsistent" with the Act |
    | 3 | Digital Personal Data Protection Rules, 2025, G.S.R. 846(E) | made "in exercise of powers conferred by" section 40 |
    ```

    Now try the same climb on a decision you met in the last section. Open the release of 13 May 2026
    on minimum support prices (https://www.pib.gov.in/PressReleasePage.aspx?PRID=2260617). Search it
    for "Act", then "section", then "article". None appears. The release says the Cabinet Committee on
    Economic Affairs "has approved" the prices. It names no statute.

    That does not make the decision baseless. It tells you which ladder to climb. When a decision
    names no Act, look at executive power. Article 73 extends the Union's executive power "to the
    matters with respect to which Parliament has power to make laws". Read those words slowly: "has
    power to make laws", not "has made laws". The government can act in that field by its own
    decision, within the limits the Constitution sets (one of them is in the must-know points below).
    Which field minimum support prices fall in is a question about subjects, and it waits for
    the next section.
  analogy_breaks_when: |
    The ladder shows where a power claims to come from. It does not show that the lower rung really
    stays inside the upper one. Whether a rule goes beyond its Act is a legal question, and the words
    "not inconsistent" do not answer it for you.

    The minimum support price step is a method, not a finding. A release that names no Act tells you
    to look at executive power. It does not prove that no Act applies. A decision can rest on a statute
    that its press release does not mention.
  numbers: []
- body: |
    Here is a trap that catches careful people. An Act exists, you can download it, it has a year in
    its title. You quote it. It is not in force.

    Take the same Act. The Gazette copy says it "received the assent of the President on the 11th
    August, 2023". Now read its section 1(2). It "shall come into force on such date as the Central
    Government may, by notification in the Official Gazette, appoint", and "different dates may be
    appointed for different provisions".

    So the Act was passed in 2023, and the date it starts was left for later. Now open the notification that
    did the switching: G.S.R. 843(E), dated 13 November 2025
    (https://www.meity.gov.in/static/uploads/2025/11/c56ceae6c383460ca69577428d36828b.pdf). It opens
    "In exercise of the powers conferred by sub-section (2) of section 1". It then sets three stages.

    ```table
    | Stage | When, in the notification's words | Some of the sections it covers |
    | (a) | the date of publication of this notification | section 2, sections 18 to 26 |
    | (b) | one year from the date of publication | section 6(9) |
    | (c) | eighteen months from the date of publication | sections 3 to 5, 7 to 17 |
    ```

    The notification gives no calendar dates for stages (b) and (c). Work them out yourself from the
    date printed on it, 13 November 2025.

    ```working
    13 November 2025, plus one year: 13 November 2026
    13 November 2025, plus eighteen months: 13 May 2027
    ```

    Now place today on that line. This book is written on 2 October 2026. Stage (a) is in force. On
    the notification's own words, stages (b) and (c) are not yet. So a note that says "the Act
    requires" something in sections 3 to 17 is wrong today, though the Act was passed more than three
    years earlier.

    Here is the habit to keep. Before you write "the Act requires", open section 1 and find the
    commencement. Then find the notification that brought the section you need into force.
  analogy_breaks_when: |
    The two calendar dates are your own arithmetic from the date printed on the notification. The
    Gazette's electronic copy carries a code with 14 November in it, and the notification does not
    say which day counts as "the date of publication". So each date could be a day later.

    The status holds only for the notifications read here. A later notification could change any
    date. Before you rely on a stage, search for a newer notification under section 1(2).
