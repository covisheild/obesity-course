concept_id: S47-R1-C03
subject: S47
rung: 1
sequence: 3
name: Where a body's power comes from
concept_type: institutional
clusters:
- system-and-state
- evidence-to-action
ground_floor_deps:
- B0-R0-C43
concept_deps:
