definition:
  text: |
    In India every lawful exercise of public power rests on an instrument above it. The chain runs
    downward from the Constitution. An Act made by a legislature may give a named body the power to
    make rules or regulations, or to issue notifications and orders. Each lower instrument must stay
    within the one above it.

    A lower instrument normally names the provision it is made under, in words such as "in exercise of
    the powers conferred by".

    Executive power is the second source. Article 73 extends the executive power of the Union to the
    matters on which Parliament has power to make laws. Article 162 extends the executive power of a
    State to the matters on which its Legislature has power to make laws. The words are "has power to
    make laws", not "has made laws".

    An Act can be passed and not yet in force. Section 1(2) of the Digital Personal Data Protection
    Act, 2023 leaves the date to the Central Government, by notification, and allows different dates
    for different provisions. Notification G.S.R. 843(E) of 13 November 2025 brought its provisions
    into force in three stages: some on the date of publication, some one year from it, and the rest
    eighteen months from it (the stages and their sections are in the second illustration). G.S.R.
    stands for General Statutory Rules, and 843 is the notification's number. It was printed in the
    Gazette of India, Extraordinary.
