must_know:
- point: |
    The error is to answer "under what authority?" with "the government's powers". The answer is
    a named provision: an article, a section or a rule, with the body it gives the power to.
  kind: misconception
  bearing: policy
  refs:
  - constitution
- point: |
    Read a notification backwards. Find the words "in exercise of the powers conferred by", open the
    section they name, and then open the Act that section sits in.
  kind: move
  bearing: methodological
  refs:
  - dpdp_rules_2025
  - dpdp_commencement_2025
- point: |
    An Act that has been passed is not always in force. Before you write "the Act requires", read its
    commencement section and find the notification that brought your section into force.
  kind: trap
  bearing: public
  refs:
  - dpdp_act_2023
  - dpdp_commencement_2025
- point: |
    When a decision names no Act, look at executive power. Then ask for the order that records the
    decision and the body that took it.
  kind: move
  bearing: policy
  refs:
  - constitution
  - pib_2260617
- point: |
    Some matters are open to both Parliament and the State Legislatures. On those, do not assume the
    Union can act inside a State by executive decision. The proviso to article 73 says it cannot,
    unless the Constitution or an Act of Parliament expressly provides for it.
  kind: trap
  bearing: policy
  refs:
  - constitution
- point: |
    Write "X has power under Y". Do not write "X can lawfully do Z" unless a source says so.
  kind: boundary
  bearing: methodological
exercises:
- type: retrieval
  prompt: |
    From memory, list the rungs of the chain of authority from the top. Then name the two articles of
    the Constitution that set how far executive power reaches, and say which government each is for.
  answer: |
    First the Constitution. Then an Act of Parliament or of a State Legislature. Then a rule or
    regulation, made under a section of an Act. Last, a notification or order, issued under a
    provision.

    Article 73 sets how far the executive power of the Union reaches: to the matters Parliament has
    power to make laws on. Article 162 does the same for a State: to the matters its Legislature has
    power to make laws on.
  confidence_first: true
- type: interpretation
  prompt: |
    Here are the opening words of notification G.S.R. 843(E) of 13 November 2025:

    > In exercise of the powers conferred by sub-section (2) of section 1 of the Digital Personal Data
    > Protection Act, 2023 (22 of 2023), the Central Government hereby appoints —

    "22 of 2023" is the Act's number: Act No. 22 of that year.

    Name the body acting, the provision it acts under, and the Act. Then say what you must open next to
    check that the provision gives this body this power, and what the opening words alone cannot tell
    you.
  answer: |
    The body acting is the Central Government. The provision is section 1(2). The Act is the Digital
    Personal Data Protection Act, 2023, Act 22 of 2023.

    Open section 1(2) of the Act next. It leaves the date the Act starts to the Central Government,
    by notification in the Gazette. It also lets different provisions start on different dates. So
    the provision does give this body the power to set the dates by notification.

    The opening words cannot tell you which sections came into force on which date. That is in
    clauses (a) to (c) further down. They also cannot tell you whether a later notification has
    changed those dates.
  skill_ref: S47-R1-K01
- type: critique
  prompt: |
    Here is a made-up line from a classmate's draft note. "The Digital Personal Data Protection Act
    was passed in 2023. Since then, every school health app in Chhattisgarh has been bound by sections
    3 to 17." Find the error and fix the sentence.
  answer: |
    The note treats an Act that has been passed as an Act in force. Section 1(2) leaves the starting
    date to the Central Government, by notification, and allows different dates for different
    provisions.

    Notification G.S.R. 843(E) of 13 November 2025 brings most of sections 3 to 17 into force only
    eighteen months from the date of publication. Counting from 13 November 2025, that is 13 May 2027.
    Section 6(9) comes in after one year. So on 2 October 2026 these sections were not in force, on the
    notification's own words.

    The error looks reasonable because the Act carries "2023" in its title and can be downloaded. A
    title year is the year of passing, not the year of starting.

    A fixed sentence: "The Act was passed in 2023. Under notification G.S.R. 843(E), most of sections 3
    to 17 come into force eighteen months after 13 November 2025." Whether a school health app falls
    within the Act at all is a separate question that the note would have to check.
- type: design
  prompt: |
    Another of your department's proposals is a warning label on packaged foods high in sugar, salt or fat.
    The previous section traced the jobs for a food regulation. Write the one sentence your note
    should use to answer "who would decide, and under what authority?" Use only what the earlier
    sections and this one have shown.
  answer: |
    "The Food Safety and Standards Authority of India would decide. It would make a regulation under
    section 92(1) of the Food Safety and Standards Act, 2006. It needs the Central Government's
    previous approval, and the draft must be published first. The regulation is made by notification."

    The answer names the body, the provision, the Act, the second body whose approval is needed,
    and the kind of instrument. It does not claim that the Authority will act, or what the label would
    say. Those are separate questions. That a warning label is a matter on which the Authority may
    make regulations is a further step this answer has not checked.
  skill_ref: S47-R1-K01
quantitative: false
retrieval_items:
- q: What words near the start of a notification tell you which provision it is made under?
  a: '"In exercise of the powers conferred by", followed by the section or provision.'
- q: How far does the executive power of the Union reach under article 73?
  a: To the matters on which Parliament has power to make laws, subject to the Constitution; on
    matters where a State Legislature may also legislate, it does not extend into a State unless the
    Constitution or an Act of Parliament expressly provides.
- q: When did the Digital Personal Data Protection Act, 2023 receive assent, and how was it brought into force?
  a: On 11 August 2023. Section 1(2) left the dates to the Central Government; notification G.S.R.
    843(E) of 13 November 2025 brought it in in three stages, on publication, after one year and after
    eighteen months.
figure_note: "No figure: the section's two structures, the ladder of instruments and the three commencement stages, are already tables, and the only numbers are dates. The diagram a reader would want is the ladder drawn as rungs from the Constitution to the rules, with a side branch for executive power from articles 73 and 162."
