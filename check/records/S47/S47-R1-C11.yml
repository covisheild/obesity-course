must_know:
- point: |
    The error is to name the minister who announced a measure as the body that decides it. The
    power to make an instrument usually sits with a body an Act names.
  kind: misconception
  bearing: policy
  refs:
  - fss_act_2006
- point: |
    If you cannot fill Y with a numbered provision, you have not traced the proposal yet, and the
    note is not ready to send.
  kind: move
  bearing: policy
- point: |
    A press release, a speech or a meeting's recommendation is not an instrument. The GST Council's
    own release says its decisions take effect through notifications "which alone shall have the
    force of law". Before you tell anyone a measure is in force, find the notification and its date.
  kind: trap
  bearing: public
  refs:
  - pib_2163555
- point: |
    A treaty is not the power to act. India is a Party to the WHO Framework Convention on Tobacco
    Control, and the Convention itself leaves action to "national law". When someone cites a treaty
    as the reason a body can act, ask for the Indian provision.
  kind: trap
  bearing: policy
  refs:
  - who_fctc_2003
  - cotpa_2003
- point: |
    A trace that forks is a result. Write both candidate deciders, the step where the trace stopped,
    and the document that would settle it.
  kind: consequence
  bearing: policy
- point: |
    Deciding and carrying out are different jobs, often done by different people. If your
    proposal is about enforcement, send it to the people who enforce.
  kind: consequence
  bearing: policy
  refs:
  - mohfw_2008_smoking_rules
- point: |
    The central GST rate on sugar-added drinks is {{n:cgst_sugary_drinks_rate_pct}} per cent, in Schedule III of Notification
    9/2025-Central Tax (Rate), as amended to 01/2026 (in force 1 May 2026; 19/2025 not read). The {{n:gst_demerit_rate_pct}}% in the GST Council's release is the GST rate it recommended, not
    the Union's share. Never say the Union levies {{n:gst_demerit_rate_pct}}%.
  kind: number
  bearing: public
  refs:
  - cgst_notif_9_2025_rate
  - cgst_act_2017_s9_cbic
  - pib_2163555
- point: |
    When a trainee's proposal says "the government should", hand it back with three blanks: X, Y
    and Z. Ask them to fill each from a document they can name.
  kind: move
  bearing: teaching
- point: |
    Before you rely on a trace, check the newest amendment each copy names.
  kind: boundary
  bearing: methodological
common_misreading: |
  "The trace found a body with the power, so the proposal is feasible." The trace shows that a body
  can act. Whether it will depends on its own priorities, on the actors pushing for and against, and
  on timing. None of these are in the instruments. A trace can be complete for a proposal that has
  no chance this year.
reporting_sentence: |
  The power to make this [instrument] lies with [body] under [provision]. It would pass through
  [process], and needs the agreement of [other body]. Whether [body] will act is a separate question,
  which this note does not answer.
exercises:
- type: retrieval
  prompt: |
    From memory, list the six steps of the trace in order, and write the one-sentence form the
    answer takes.
  answer: |
    The six steps, in order:

    1. Name the instrument the proposal needs.
    2. Find whose subject it is: Union, State or both.
    3. Find the body that holds the power, and the provision that gives it.
    4. Find the process the instrument must pass.
    5. List who else must agree, and who carries it out.
    6. Write one sentence.

    The sentence: X decides, under Y, by process Z, with W's agreement.
  skill_ref: S47-R1-K01
  confidence_first: true
- type: teaching
  prompt: |
    A journalist has three minutes and asks: "Who can raise the tax on sugary drinks in India?"
    Answer without jargon, give one sentence they can quote, and say what you are not sure of.
  answer: |
    No single body can do it alone.

    The GST Council, where the Union Finance Minister and Minister of State sit with a minister
    from each State, recommends GST rates. The Union government then notifies its part of the tax.
    The States' part rests on State law, which you have not read. The Union's part cannot go above {{n:cgst_sugary_drinks_rate_pct}} per cent under
    the central GST Act.

    The Health Ministry can argue for a higher tax, but it does not set the rate.

    What you are not sure of: what State law says about the States' part, and whether the latest
    amendments changed the entries. Say so.

    Quotable sentence: "The GST Council recommends the tax on sugary drinks, and the Union
    government notifies its part. The Health Ministry can argue for it, but cannot set it."
  skill_ref: S47-R1-K01
quantitative: true
practice:
- level: 1
  prompt: |
    Here is a made-up provision from a made-up Act.

    "The Board may, with the previous approval of the State Government and after previous
    publication, by notification, make regulations to carry out the purposes of this Act."

    Name the body that makes the instrument, the instrument, the other body that must agree, and
    the process.
  answer: |
    The provision, part by part:

    ```table
    | Part | In the provision |
    | body | the Board |
    | instrument | regulations |
    | must agree | the State Government, whose previous approval is needed |
    | process | previous publication of a draft, then notification |
    ```

    Read the provision for its verb and its subject: "The Board may ... make regulations". The words
    after "with" name the second decider. The words after "after" and "by" name the process.
- level: 2
  prompt: |
    Here are three entries of the Seventh Schedule.

    a. Union List, entry 52: "Industries, the control of which by the Union is declared by Parliament
       by law to be expedient in the public interest."
    b. State List, entry 6: "Public health and sanitation; hospitals and dispensaries."
    c. Concurrent List, entry 18: "Adulteration of foodstuffs and other goods."

    For each, say which legislature can make laws on it, under Article 246.
  answer: |
    Entry by entry:

    ```table
    | Entry | List | Who can make laws on it |
    | a | Union List | Parliament only (Article 246(1)) |
    | b | State List | the State Legislature, for its own State (Article 246(3)) |
    | c | Concurrent List | both Parliament and the State Legislatures (Article 246(2)) |
    ```

    Entry a has a condition built into it. It covers only industries that Parliament has declared,
    by law, to be under the Union's control. So before relying on it you look for the Act that makes
    the declaration, as the FSS Act's section 2 does for food.
  refs:
  - constitution
- level: 3
  prompt: |
    The parts below come from a made-up trace, in no order. Write the one-sentence answer. Then say
    which steps the parts leave unanswered.

    - provision: section 12 of the made-up State Food Act
    - must agree: the State Government, by previous approval
    - body: the State Food Commission
    - instrument: regulations
  answer: |
    The sentence: "The State Food Commission decides, by making regulations under section 12 of the
    State Food Act, with the State Government's previous approval."

    Three are unanswered. The parts say who decides, under what and with whose agreement.

    - Step 2, whose subject: the parts never say whether the State may legislate on the matter.
    - Step 4, the process: they do not say whether a draft must be published for objections, how
      the regulations are notified, or whether they are laid before the State Legislature. Go back
      to section 12 and read the words after "after" and "by".
    - The carry-out half of step 5: they do not say who enforces the regulations.
- level: 4
  prompt: |
    Trace the proposal "Packaged foods high in sugar, salt or fat should carry a warning label" as
    far as these provisions take you.

    - FSS Act, section 16(1): "It shall be the duty of the Food Authority to regulate and monitor the
      manufacture, processing, distribution, sale and import of food so as to ensure safe and
      wholesome food."
    - FSS Act, section 92(1): "The Food Authority may, with the previous approval of the Central
      Government and after previous publication, by notification, make regulations consistent with
      this Act and the rules made thereunder to carry out the provisions of this Act."
    - FSS Act, section 93: every regulation made under the Act "shall be laid, as soon as may be
      after it is made, before each House of Parliament".
    - Allocation of Business Rules, Second Schedule, Department of Health and Family Welfare, item
      3(a): "The Food Safety and Standards Act, 2006".

    Then say what your trace does not settle.
  answer: |
    The trace, step by step:

    ```table
    | Step | Answer |
    | 1 instrument | a regulation under the FSS Act |
    | 2 subject | the Union: the FSS Act already covers food, and its section 2 declares Union control of the food industry |
    | 3 body and provision | the Food Authority, under section 92(1) |
    | 4 process | a draft published for objections; the Central Government's approval; notification; laying before each House of Parliament (section 93) |
    | 5 who else must agree | the Central Government; inside it, the Department of Health and Family Welfare owns the Act |
    ```

    The sentence: "The Food Authority decides, by regulation under section 92(1) of the FSS Act. It
    needs the Central Government's previous approval and must publish a draft for objections first.
    The regulation is laid before Parliament under section 93."

    What it does not settle: whether the Food Authority's duty reaches this label at all. Section
    16(1) speaks of "safe and wholesome food", and the Act does not define "wholesome". So whether
    a warning on sugar, salt or fat is within that duty is an unsettled reading, and it decides
    steps 2 and 3. A regulation would have to say which provision it rests on. The trace also does
    not settle whether such a regulation already exists, or whether the Food Authority means to act.
  refs:
  - fss_act_2006
  - goi_aob_rules_1961
- level: 5
  prompt: |
    A made-up district meeting proposes: "Shops near schools in the district should be stopped from
    selling tobacco."

    Use these facts. Section 6 of COTPA, as enacted in 2003, forbids selling cigarettes or other
    tobacco products to anyone under eighteen. It also forbids it "in an area within a radius of one
    hundred yards of any educational institution". The National Tobacco Control Programme's list of
    "Notifications on date of effect of various provisions of the Act" includes General Statutory
    Rules (G.S.R.) 687(E), dated
    18 September 2009, "For Section- 6(b)". Section 12(1) lets certain officers enter and search where they
    suspect the Act is being broken. They are police officers not below sub-inspector, and officers
    of a State's food and drug regulator, authorised by the Central or State Government.

    Trace the proposal. Then say what your trace does not settle.
  answer: |
    Step 1. What instrument? Before naming a new one, check whether one exists. It does: section
    6(b) of COTPA already forbids the sale within one hundred yards of an educational institution.

    Step 2. Whose subject? The Union's: COTPA's section 2 declares Union control of the tobacco
    industry.

    Steps 3 and 4. Body, provision and process: Parliament decided, in section 6(b), in 2003. The
    provision took effect through a notification about its date of effect, G.S.R. 687(E) of 18
    September 2009. That notification's own text is not given here, so the exact date it set is not
    known from these facts.

    Step 5. Who carries it out: officers such as those section 12(1) lets the Central or State
    Government authorise to enter and search.

    So the trace turns the proposal round. Nobody needs to decide the rule; it was decided in 2003.
    The district's real request is about carrying the rule out, and it goes to the enforcing officers
    and to the government that authorises them. The sentence: "Parliament decided, in section 6(b) of
    COTPA. It took effect through G.S.R. 687(E) of 18 September 2009. Enforcement rests with officers
    the Central or State Government authorises, such as those in section 12(1)."

    What it does not settle:

    - whether the Amendment Act of 2007 changed section 6, which is not checked here;
    - how the hundred yards are measured;
    - whether the rule is being enforced near any school in the district.
  refs:
  - cotpa_2003
- level: 6
  prompt: |
    Here are four parts of the preamble of a real instrument, the Food Safety and Standards
    (Packaging) Regulations, 2018, notified on 24 December 2018. The dots mark words left out.

    - "Whereas the draft of certain regulations ... dated the 19th March, 2018 was published as
      required under Sub-section (1) of section 92 of Food Safety and Standards Act, 2006 ... inviting
      objections and suggestions from the person likely to be affected thereby, before the expiry of
      a period of thirty days from date on which the copies of Gazette containing the said
      notification was made available to the public"
    - "And whereas copies of the said Gazette were made available to the public on the 2nd April,
      2018"
    - "And whereas objections and suggestions received on the said draft regulations have been
      considered by the Food Safety and Standards Authority of India"
    - "Now, therefore, in exercise of the powers conferred by clause (k) of sub-section (2) of
      section 92, read with section 23 of the Food Safety and Standards Act, 2006 ... the Food Safety
      and Standards Authority of India hereby makes the following regulations"

    "Read with" means the two provisions are used together: section 92(2)(k) gives the power, and
    section 23 supplies the subject, the marking and labelling of foods.

    You read this preamble for its dates in `S47-R1-C07`. Now work backwards through the trace. Which steps
    does the preamble answer? Which does it leave out? For each one it leaves out, name the
    provision you would read next.
  answer: |
    The trace, step by step:

    ```table
    | Step | What the preamble shows |
    | 1 instrument | regulations |
    | 2 whose subject | nothing |
    | 3 body and provision | the Food Safety and Standards Authority of India, under section 92(2)(k) read with section 23 |
    | 4 process | a draft, objections considered, the final notification; not the approval or the laying |
    | 5 who else must agree, who carries out | nothing |
    ```

    What the preamble does not show: part of step 4 and all of step 5. It never mentions the
    Central Government's previous approval (section 92(1)) or laying before Parliament (section 93).
    It says nothing about whose subject this is; read section 2 of the FSS Act, which declares Union
    control of the food industry. It says nothing about who carries the regulations out; read
    section 30, under which each State Government appoints a Commissioner of Food Safety "for
    efficient implementation of food safety and standards".

    A notification shows its own part of the trace. The rest is in the Act, so a backward trace
    always ends by reading the power-giving section itself.
  refs:
  - fssai_2018_packaging_regs
  - fss_act_2006
- level: 7
  prompt: |
    Here is a worked trace. Find the steps that broke.

    ```working
    proposal: packaged foods high in sugar, salt or fat should carry a warning label
    instrument: an order
    body: the Union Minister of Health and Family Welfare
    provision: the Allocation of Business Rules, which give the FSS Act to the minister's department
    process: the minister announces it
    who else must agree: no one
    ```
  answer: |
    Five lines broke, and they broke together.

    The instrument is a regulation under the FSS Act, not an order. The power to make it is in
    section 92(1), and it belongs to the Food Authority, "with the previous approval of the Central
    Government". So the body is the Food Authority, and the Central Government's approval is a
    second decider.

    The Allocation of Business Rules do not give anyone the power to make a food regulation. They
    distribute subjects among departments: they say which department deals with the FSS Act. That
    tells you whom to copy, not who decides.

    The process is not an announcement. It is a draft published for objections, approval,
    notification, and laying before Parliament under section 93.

    A corrected sentence: "The Food Authority decides, by regulation under section 92(1) of the FSS
    Act, with the Central Government's approval, after a draft for objections."

    Why the wrong answer looks reasonable: ministers announce measures. The department really does
    own the Act, and the Central Government's approval really does run through it. Each of those
    facts is true. None of them makes the minister the holder of the power.
  refs:
  - fss_act_2006
  - goi_aob_rules_1961
- level: 8
  prompt: |
    The Press Information Bureau's release of 3 October 2024 says the Union Cabinet approved the
    National Mission on Edible Oils – Oilseeds. It says the Mission "will promote
    awareness of recommended dietary guidelines for edible oils" through a campaign. Here is a
    worked trace of a proposal about it. Find the steps that broke.

    ```working
    proposal: the oilseeds mission's awareness campaign should tell people to use less cooking oil
    instrument: an amendment to the Act behind the oilseeds mission
    subject: agriculture, so the trace must find the State List entry
    body: Parliament
    process: a Bill passed by both Houses, then the President's assent
    ```
  answer: |
    The instrument line broke, and everything after it followed.

    The release names no Act. It says the Union Cabinet approved a mission. That reads as an
    executive decision with money attached, a scheme. If an Act stood behind it, the release would
    be the wrong place to look, and the mission's guidelines would say so. On the release alone,
    nothing needs Parliament's vote, and no Bill is involved.

    The subject line went looking for a power to make a law. No law is being made. The question for
    a scheme is who made it, and who can change it. The release answers the first: the Union
    Cabinet. How schemes are made and funded is the section on schemes and budgets.

    A corrected trace: "The Union Cabinet approved the mission, using the executive power of the
    Union (Article 73). A change to
    its campaign would go to whoever runs the mission, within what the Cabinet approved." The release
    does not name the department that runs the mission. The next document to read is the mission's
    own guidelines, which are not held here, so the trace stops there and says so.

    Why the wrong answer looks reasonable: a national mission with a long name and a large budget
    sounds like a law. Many people assume anything national was passed by Parliament. The release
    says "Cabinet", and that one word was the place to stop.
  refs:
  - pib_2061646
  - constitution
- level: 9
  prompt: |
    A made-up newspaper headline reads: "Government sets 10% cut in cooking oil."

    The words it rests on come from the Prime Minister's radio address, Mann Ki Baat, of 23 February
    2025. The Press Information Bureau released them in English: "For example, one method I suggested was 'reducing the
    consumption of edible oil by ten percent (10%)'. Decide that you will use 10% less oil every
    month."

    Trace the headline. Then say what your trace does not establish.
  answer: |
    Step 1. What instrument? The text is a radio address. It asks each listener to decide for
    themselves: "Decide that you will use 10% less oil every month." It names no Act, rule,
    regulation, notification or scheme.

    Steps 2 to 5 have nothing to attach to. There is no subject to place, because no law is made.
    There is no provision and no process, because nothing binds anyone.

    The result: no body has decided anything binding. The text is a request to the public, made in a
    speech. The headline's word "sets" is wrong. A correct line would be: "Prime Minister urges
    people to cut cooking oil by 10%."

    What the trace does not establish:

    - That no programme on oil exists. The trace read one text. A scheme or campaign could exist
      elsewhere, and would need its own trace.
    - That the call has no effect. A speech can put a subject on the agenda and change what people
      do. The trace says only that it is not an instrument.
    - Whether using less oil would change anyone's weight. That is a question for evidence, not for a
      trace.
  refs:
  - pib_2105618
- level: 10
  prompt: |
    A line from a made-up report by a public health department reads:

    "We call on the Ministry of Health and Family Welfare to impose a {{n:gst_demerit_rate_pct}}% tax
    on sugary drinks."

    Trace the request, rewrite the line so it is addressed to the right bodies, and say what your
    trace does not establish.
  answer: |
    Step 1. Instrument: a notification setting the GST rate.

    Step 2. Subject: Article 246A(1) gives both Parliament and every State Legislature power over GST.

    Step 3. Body and provision: the GST Council recommends rates (Article 279A(4)(e)). The Central
    Government notifies the central tax under section 9(1) of the CGST Act, up to {{n:cgst_sugary_drinks_rate_pct}} per cent.
    The State share rests on State law under Article 246A, not traced here. The Allocation of Business Rules give
    the GST Council and the CGST Act to the Department of Revenue, not to the Ministry of Health.

    Step 4. Process: Council recommendation, then notifications. And here the trace finds something
    else. The Council's 56th meeting already recommended moving sugar-added and flavoured drinks,
    including aerated waters, to {{n:gst_demerit_rate_pct}}%. Notification 9/2025-Central Tax (Rate)
    puts them in Schedule III, at a central rate of {{n:cgst_sugary_drinks_rate_pct}} per cent, from
    22 September 2025. So the line asks for a rate that has already been recommended, and its
    central half notified.

    Step 5. Who else: every State, through its minister on the Council (Article 279A(2)(c)).

    A rewrite that informs rather than misdirects: "The GST Council has recommended a
    {{n:gst_demerit_rate_pct}}% de-merit rate for sugar-added drinks, and the central
    {{n:cgst_sugary_drinks_rate_pct}} per cent is in force under Notification 9/2025. Any change
    would be recommended by the GST Council, which moves first; the Central Government would
    notify the central rate. The Ministry of Health and Family Welfare can put the health case
    to them."

    What the trace does not establish:

    - Whether a higher rate would reduce what people drink, or obesity. That needs evidence.
    - That the Ministry of Health has no role. It is an actor that can advise and argue. It does not
      set the rate.
    - That the rate stands today. The trace read the notifications up to 01/2026, in force 1 May
      2026, and not the amendment 19/2025 it names.
  refs:
  - constitution
  - cgst_act_2017_s9_cbic
  - cgst_notif_9_2025_rate
  - cgst_notif_1_2026_rate
  - pib_2163555
  - goi_aob_rules_1961
practice_note: "Ten problems: the technique has six steps and three kinds of input (a bare provision, a real proposal, a finished instrument read backwards), so the mechanical band drills reading a provision, a list entry and the sentence form, the applied band runs forward, into an existing rule, and backward, and the diagnostic and transfer bands cover the two commonest wrong traces and two claims in words."
figure_note: "The picture this method needs is a chain from the Constitution through an Act to a notification, with the deciding body at each link, a flow diagram the drawing tool does not draw; the tables in the illustrations carry each trace, and a bar chart of them would be a table drawn as a picture."
