    quote: '6. Public health and sanitation; hospitals and dispensaries.'
    derived: The entry number is the list label at the start of the quoted entry.
- body: |
    Now a trace that finishes. Proposal: a higher tax on sugar-sweetened drinks.

    **Step 1. The instrument.** A rate notification. GST rates are set by notification under the GST Acts,
    not by a new Act each time. Find the notification now in force for the central tax: Notification
    No. 9/2025-Central Tax (Rate), on the e-Gazette at egazette.gov.in. Its first line names the power
    it uses: "sub-section (1) of section 9" of the Central Goods and Services Tax Act, 2017 (the CGST
    Act).

    **Step 2. Whose subject.** Article 246A(1) gives Parliament and "the Legislature of every State"
    power to make laws on goods and services tax "imposed by the Union or by such State". Both.

    **Step 3. Body and provision.** Under Article 279A(4)(e), the GST Council makes recommendations
    to the Union and the States on "the rates including floor rates with bands of goods and services
    tax". Under section 9(1) of the CGST Act, the central tax is levied "at such rates, not exceeding
    twenty per cent., as may be notified by the Government on the recommendations of the Council".
    So the Council recommends, and the Central Government notifies. Its notification cannot go above
    {{n:cgst_sugary_drinks_rate_pct}} per cent.

    **Step 4. Process.** The Council meets and recommends. After its 56th meeting, on 3 September
    2025, the Council recommended "a special de-merit rate of {{n:gst_demerit_rate_pct}}% for a
    select few goods and services", as the Press Information Bureau's release reports. The release itself says the
    decisions take effect through "notifications/ law amendments which alone shall have the force of
    law". So the release is not the instrument. The Central Government then notified the rates. In
    Notification 9/2025, "the Central Government, on the recommendations of the Council, hereby
    notifies the rate of central tax", and Schedule III carries {{n:cgst_sugary_drinks_rate_pct}} per
    cent. The first entry of Schedule III is "All goods (including aerated waters), containing added
    sugar or other sweetening matter or flavoured". The notification came into force on 22 September
    2025.

    Notice that the release's {{n:gst_demerit_rate_pct}}% and the notification's
    {{n:cgst_sugary_drinks_rate_pct}} per cent are different numbers. The Central Government's
    notification sets only the central tax. A note saying "the Union levies
    {{n:gst_demerit_rate_pct}}%" would be wrong.

    **Step 5. Who else must agree.** The States. Each has a minister on the Council (Article
    279A(2)(c)), and Article 246A(1) gives each State Legislature power to make laws on the GST it
    imposes. What each State has enacted and notified is not held for this book. Inside the Union, the Allocation of Business Rules give the
    GST Council and the CGST Act to the Department of Revenue in the Ministry of Finance.

    **Step 6. One sentence.** "The GST Council recommends the rate (Constitution, Article
    279A(4)(e)); the Central Government notifies the central tax under section 9(1) of the CGST Act,
    up to {{n:cgst_sugary_drinks_rate_pct}} per cent; the State share rests on State law under
    Article 246A, not traced here. The central instrument now in force is Notification No. 9/2025-Central Tax (Rate),
    Schedule III, as amended by Notification No. 01/2026-Central Tax (Rate), in force 1 May 2026."

    Look at who is missing from the sentence: the Ministry of Health and Family Welfare. In the last
    section's table it sat in the row marked "advises".
  analogy_breaks_when: |
    The trace is as current as the copies read: Notification 9/2025 and its amendment 01/2026, in
    force 1 May 2026, which leaves the first entry of Schedule III alone. 01/2026 names an earlier
    amendment, 19/2025, which this book has not read. The next Council meeting can change any of it.

    The trace names who sets the rate. It says nothing about whether a higher rate would change what
    people drink, or about the States' share, which sits in laws not traced here.
  numbers:
  - value: '20'
    unit: per cent, ceiling on the central GST rate
    citekey: cgst_act_2017_s9_cbic
    quote: at such rates, not exceeding twenty per cent., as may be notified by the Government on the recommendations of the Council
    as_of: '2026-10-02'
  - value: '20'
    unit: per cent, central tax rate in Schedule III
    citekey: cgst_notif_9_2025_rate
    quote: '(iii)   20 per cent. in respect of goods specified in Schedule III;'
    as_of: 'as amended up to 01/2026-CT(Rate), in force 1 May 2026'
  - value: '40'
    unit: per cent, GST de-merit rate recommended
    citekey: pib_2163555
    quote: a special de-merit rate of 40% for a select few goods and services
    as_of: '2025-09-03'
  - value: '56'
    unit: meeting number of the GST Council
    citekey: pib_2163555
    quote: Recommendations of the 56th Meeting of the GST Council held at New Delhi, today
  - value: '22'
    unit: day of September 2025, commencement
    citekey: cgst_notif_9_2025_rate
    quote: This notification shall come into force with effect from the 22nd day of September, 2025.
- body: |
    The third trace runs on a decision already taken, to show the whole chain from end to end.
    Proposal, as it might have been put before 2003: no smoking in public places. Tobacco control is
    the main precedent a later book in this series studies. Here it is traced only for its bodies
    and powers.

    **Step 1. The instrument.** An Act, with rules for the detail. Open the Cigarettes and Other
    Tobacco Products (Prohibition of Advertisement and Regulation of Trade and Commerce, Production,
    Supply and Distribution) Act, 2003 (COTPA), on the website of the National Tobacco Control
    Programme, the Union health ministry's tobacco programme (ntcp.mohfw.gov.in). Section 4 reads: "No person shall smoke in any public place".

    **Step 2. Whose subject.** Section 2 declares "that the Union should take under its control the
    tobacco industry". It is the same form of words as the FSS Act's section 2, and it matches Union
    List entry 52 in the same way.

    **Step 3. Body and provision.** Parliament made the Act. Section 31(1) gives the detail to the
    Central Government: it "may, by notification in the Official Gazette, make rules".

    **Step 4. Process, with its dates.** The President's assent came on 18 May 2003. An Act can be
    passed and not yet in force, and section 1(3) of COTPA leaves the start to dates the Central
    Government notifies. A notification of 25 February 2004, Statutory Order (S.O.) 238(E), appointed 1 May 2004 for
    sections including 4 and 31. Four years later the Central Government made the Prohibition of
    Smoking in Public Places Rules, 2008, "In exercise of the powers conferred by section 31", in force
    on 2 October 2008. Every rule under COTPA is laid before each House of Parliament for a total of
    {{n:laying_days}} days (section 31(3)).

    **Step 5. Who carries it out.** Rule 5 makes "The authorised officers mentioned in Schedule III"
    competent to act on breaches of section 4. Read down Schedule III. It runs from tax inspectors to
    station masters, heads of hospitals, school principals and teachers, police officers, and
    "Representatives of Panchyati Raj Institutions". Union, State and village officials all carry out
    a decision that Parliament and the Central Government took.

    **And the treaty.** India signed the WHO Framework Convention on Tobacco Control on 10 September
    2003. It ratified the Convention on 5 February 2004. Ratifying is the step by which a country
    becomes a Party, bound by the treaty. Article 8(2) requires each Party to act "in areas of
    existing national jurisdiction as determined by national law". Now line up the dates. The
    President's assent to COTPA came nearly four months before India signed. The Act's preamble, its opening statement of why it was made, cites World
    Health Assembly resolutions, the later of them from 1990, and not the Convention. The treaty binds
    India to act. It is not the power under which anyone in India acts. That power is section 4 and
    section 31.

    **Step 6. One sentence.** "Parliament decided, in section 4 of COTPA 2003; the Central
    Government made the detailed rules under section 31, by notification, laid before Parliament;
    the authorised officers listed in Schedule III of the 2008 Rules carry it out."
  analogy_breaks_when: |
    COTPA is read here as enacted. The Amendment Act of 2007 is not held, and the 2008 Rules are read
    in an unofficial consolidated print, so any later change is unchecked.

    The trace shows who decided and who enforces. It shows nothing about whether smoking in public
    places fell, or how often the officers in Schedule III act. That is a question about carrying
    policy out, for the book in this series on implementation. Whether tobacco is a good template for food is
    a question for a later book.
