    kind: textbook
    locator: '16.4 Policymakers, "The Policy Process", enactment and implementation paragraph'
    quote: |-
      Once the policy has been enacted—usually by the legislative and/or executive branches of the government, like Congress or the president at the national level or the legislature or governor of a state—government agencies do the work of actually implementing it.
    verified:
      resolved_id: https://openstax.org/books/american-government-4e/pages/16-4-policymakers
      opened: true
      claim_located: true
      checked_on: '2026-10-02'
      note: |-
        A United States textbook. It carries the general point behind step 5, that the body that
        enacts and the bodies that carry out are different. No textbook held carries the six-step
        method as a whole: the method is assembled from Book 0's section on how government works and
        from the Indian instruments below.
