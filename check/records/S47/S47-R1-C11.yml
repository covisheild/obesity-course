simplified_explanation: |
  **Step 1. Name the instrument.** What would have to exist on paper for the proposal to be policy?
  If you cannot name one, the proposal is not yet ready to trace.

  **Step 2. Find whose subject it is.** If an Act already covers the matter, read what it says about
  itself. If not, find the entry in the Seventh Schedule's three lists.

  **Step 3. Find the body and the provision.** Which body can make that instrument? Which numbered
  section or article gives it the power? "The government" is not a body. "The minister" is usually
  not the holder of the power.

  **Step 4. Find the process.** What must happen before the instrument binds anyone?

  **Step 5. List who else must agree, and who carries it out.** A body whose approval the process
  needs is a second decider.

  **Step 6. Write one sentence.** X decides, under Y, by process Z, with W's agreement.

  The trace can stop, because the documents you have do not answer a step. Then write down where it
  stopped, the candidates, and the document that would settle it.

  Or the trace can find that the decision was taken years ago. Then your proposal is really about
  carrying the decision out, and it goes to different people.

  A finished trace tells you who can act. It never tells you whether they will.
illustrations:
- body: |
    Start with a trace that does not finish. Your department's made-up proposal reads: "The Health
    Department should ban junk food in school canteens in the district."

    **Step 1. The instrument.** "Ban" could mean a regulation, an order from the State to its own
    schools, or a new Act. The proposal does not say which. "Junk food" has no definition, so no
    instrument could be written from it. Before you trace, rewrite the proposal so that a body could
    act on it: "School canteens in the district should not sell sugar-sweetened drinks."

    **Step 2. Whose subject.** Look first for an Act that already covers food sold in canteens. The
    Food Safety and Standards Act, 2006 (the FSS Act) does. It defines a food business as any
    undertaking, "whether public or private", that handles food, and the definition "includes food
    services, catering services, sale of food". Its definition of premises names "food canteens".
    Section 2 declares that "the Union should take under its control the food industry". Now put
    that beside entry 52 of the Union List: "Industries, the control of which by the Union is
    declared by Parliament by law to be expedient in the public interest." The words match. The Act
    does not name the entry. The match is your reading, and you should say so in a note.

    But a school canteen is also part of a school. Education is entry 25 of the Concurrent List,
    and public health is entry 6 of the State List. So a second route is open: the State acting for
    the schools it runs. The section on where a body's power comes from showed that a State's
    executive power reaches as far as its Legislature's power to make laws (Article 162).

    **Step 3. Body and provision.** Route one is the Food Authority, which makes regulations under
    section 92(1) of the FSS Act "with the previous approval of the Central Government and after
    previous publication". Route two is the State Government, through its school education
    department, under its executive power.

    Here the trace forks, and the documents in hand cannot close the fork. They do not say whether
    the Food Authority has already made a regulation on what school canteens may sell. They do not
    say whether Chhattisgarh has issued an order. They do not say how far the Food Authority's duty
    under section 16(1), "to ensure safe and wholesome food", stretches into deciding which foods a
    canteen may offer. And Article 162 adds a limit of its own: where Parliament and the State can
    both make laws, the State's executive power is subject to the power a law of Parliament gives
    the Union. So the two routes can meet, and which one governs a canteen rule is a question this
    trace leaves open.

    The split runs inside the Union government too. The Allocation of Business Rules give the FSS
    Act to the Department of Health and Family Welfare. They give "Elementary Education" and
    "Secondary Education" to the Department of School Education and Literacy.

    So write the trace as far as it goes, and mark where it stops.

    ```table
    | Step | Answer so far |
    | 1 instrument | a regulation under the FSS Act, or a State order for its own schools |
    | 2 subject | the food business: the Union, under the FSS Act's section 2; the school: Parliament and the State both (Concurrent List entry 25); public health: the State (State List entry 6); the section "Union, State or local: whose subject is it" lists every entry a canteen rule touches |
    | 3 body and provision | the Food Authority, FSS Act section 92(1); or the State Government, under its executive power |
    | 4 process | for a regulation: a draft for objections, the Central Government's approval, notification, laying before Parliament (section 93); for a State order: not found in the documents held |
    | 5 who else must agree | the Central Government, for a regulation |
    | 6 one sentence | not yet possible: two candidate deciders |
    | where it stopped | step 3; read next the Food Authority's list of regulations and the State school education department's orders |
    ```

    The fork is the finding. The first draft, "the Health Department should ban junk food", had
    hidden it behind one word.
  analogy_breaks_when: |
    This trace is limited by what is held. A regulation or a State order on school canteens may
    already exist; this book does not hold one and does not say either way. The book in this series on
    India's regulatory architecture maps the food regulators.

    Matching section 2's words to Union List entry 52 is a reading, not a ruling. Whether a canteen
    rule falls under the food industry, education or public health is the kind of question courts
    decide. The trace tells you which questions to ask. It does not answer them for you.
  numbers:
  - value: '52'
    unit: entry number in List I
    citekey: constitution
    quote: '52. Industries, the control of which by the Union is declared by Parliament by law to be expedient in the public interest.'
    derived: The entry number is the list label at the start of the quoted entry.
