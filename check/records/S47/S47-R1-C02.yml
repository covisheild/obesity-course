simplified_explanation: |
  Four jobs happen around almost every public decision.

  1. **Propose.** Someone puts an idea forward.
  2. **Advise.** Someone studies the idea and recommends what to do. An adviser has no power to
     decide.
  3. **Decide.** One body holds the legal power to make the decision.
  4. **Carry out.** Offices put the decision into effect and make sure people follow it.

  Here is the trap. People name whoever they heard about.
illustrations:
- body: |
    Start with a made-up headline that sounds right and is not:

    > Expert commission fixes higher price for paddy.

    Check it against two real releases. First open the Press Information Bureau's backgrounder of
    10 October 2025, "Minimum Support Prices: From Safety Net to Self-Sufficiency"
    (https://www.pib.gov.in/PressNoteDetails.aspx?ModuleId=3&NoteId=155448&reg=48&lang=2). Search
    for "recommendations". The Government announces the prices "based on the recommendations of the
    Commission for Agricultural Costs & Prices (CACP)". It also considers "the views of the concerned
    State Governments and Central Ministries/Departments".

    Then open the release of 13 May 2026 (https://www.pib.gov.in/PressReleasePage.aspx?PRID=2260617).
    Read its first sentence. The Cabinet Committee on Economic Affairs (CCEA) "has approved" the
    minimum support prices for the kharif crops of marketing season 2026-27.

    So the commission recommends. It does not fix. A minimum support price is a price at which the
    government will buy, not a price every farmer gets; Book 4 on the food system explains it. Here
    you need only who does what. Sort each body into its job.

    ```table
    | Job | Who holds it for minimum support prices | Where it says so |
    | propose | not named in these releases | none |
    | advise | the Commission for Agricultural Costs and Prices (CACP) recommends; State Governments and Central Ministries give views | PIB backgrounder, 10 October 2025 |
    | decide | the Cabinet Committee on Economic Affairs (CCEA) approves | PIB release, 13 May 2026 |
    | carry out | public procurement agencies buy wheat and paddy at specified centres | Department of Food and Public Distribution, Year End Review 2025 |
    ```

    For the last row, search the Department of Food and Public Distribution's Year End Review 2025
    (https://www.pib.gov.in/PressReleasePage.aspx?PRID=2210211) for "specified centres". Wheat and
    paddy that meet the specifications "are bought by the public procurement agencies" at MSP.

    Look at the first row. Neither release says who first proposed a price. That blank is honest. You
    leave it blank rather than fill it with a guess. The headline's error was to put the adviser in the
    decider's row.
  analogy_breaks_when: |
    The table describes who holds each job on paper, as the releases state it. It does not say how
    much the CCEA departs from what the commission recommends, or how far State views change the
    result. The releases held do not say.

    Minimum support prices are the cleanest split held here, because the releases name each body.
    Many decisions are less tidy. One body may advise and decide, or the release may not name the
    adviser at all.
  numbers: []
- body: |
    Now use the four jobs on the department's third proposal: a warning label on packaged foods high
    in sugar, salt or fat. Here it is only a worked example of tracing jobs. A later book takes the
    labelling rules themselves apart.

    Open the Food Safety and Standards Act, 2006 (https://indiacode.gov.in/handle/123456789/586348).
    Book 0's section on how government works showed you that the Food Authority makes food
    regulations under section 92. Go back to section 92(1) and read the whole sentence. The Food
    Authority may make regulations "with the previous approval of the Central Government and after
    previous publication, by notification".

    Count the bodies in that sentence. The Food Authority makes the regulation. The Central Government
    must approve it first. So the decide job needs two signatures. A note that asks only the Food
    Authority has missed one. A note that asks only the Central Government has missed the other.

    Now find the advisers. Search for "shall advise the Food Authority". Section 12(2) gives that job
    to the Central Advisory Committee.

    Now find who carries a regulation out in your own district. Search for "Commissioner of Food
    Safety". Section 30(1) says the State Government appoints one "for efficient implementation". Then
    search for "each district". Section 36(2) says: "There shall be a Designated Officer for each
    district."

    ```table
    | Job | Who holds it for a food regulation | Provision |
    | propose | anyone, including your department | none needed |
    | advise | the Central Advisory Committee | section 12(2) |
    | decide | the Food Authority, with the previous approval of the Central Government | section 92(1) |
    | carry out | the State's Commissioner of Food Safety, and a Designated Officer in each district | sections 30(1) and 36(2) |
    ```

    Look at where the jobs sit. The decide row is in the Union government. The carry-out row is in the
    State government and your own district. So a label decided in Delhi is checked in Chhattisgarh by
    the State's officers.

    Last, suppose a made-up petition asks a High Court to make the food regulator act. Article 226
    gives every High Court power to issue "directions, orders or writs", including to "any
    Government". A court can direct a body to act. The power to make the regulation remains the Food
    Authority's under section 92.
  analogy_breaks_when: |
    The table shows who holds each job under the Act. It does not show whether the Central Advisory
    Committee was consulted on any particular regulation, or how often the Central Government refuses
    approval. Those are facts about practice, and the Act does not record them.

    The court line is deliberately thin. What Indian courts have in fact ordered on food, and how far
    they have gone, is left to a later book.
  numbers: []
must_know:
- point: |
    The error is to name the body that recommends as the body that decides. The Commission for
    Agricultural Costs and Prices recommends minimum support prices; the Cabinet Committee on Economic
    Affairs approves them.
  kind: misconception
  bearing: public
  refs:
  - s37_pib_msp_backgrounder
  - pib_2260617
- point: |
    For any proposal, write four lines: who proposes, who advises, who decides, who carries it out.
    Fill each with a named body and the place that says so.
  kind: move
  bearing: policy
- point: |
    A food regulation needs the Food Authority and the previous approval of the Central Government
    (FSS Act, section 92(1)). Address a note to every body whose agreement the law requires.
  kind: trap
  bearing: policy
  refs:
  - fss_act_2006
- point: |
    The body that decides and the body that carries out can sit in different governments. Food
    regulations are made at the Union level and implemented by each State's Commissioner of Food
    Safety and the district's Designated Officer.
  kind: consequence
  bearing: policy
  refs:
  - fss_act_2006
- point: |
    A court can direct a body to act. Making the regulation is still the job of the body the statute
    names.
  kind: trap
  bearing: public
  refs:
  - constitution
  - fss_act_2006
- point: |
    The four jobs tell you who holds formal power. They do not tell you who has influence, or whether
    the decider will act.
  kind: boundary
  bearing: methodological
exercises:
- type: retrieval
  prompt: |
    From memory, name the four jobs around a decision. Then, for minimum support prices, name the
    body that recommends and the body that approved them for the kharif crops of 2026-27.
  answer: |
    Propose, advise, decide, carry out.

    For minimum support prices, the Commission for Agricultural Costs and Prices (CACP) recommends.
    The Cabinet Committee on Economic Affairs (CCEA) approved the kharif prices for 2026-27.
  confidence_first: true
- type: interpretation
  prompt: |
    Read section 92(1) of the Food Safety and Standards Act, 2006:

    > The Food Authority may, with the previous approval of the Central Government and after previous
    > publication, by notification, make regulations consistent with this Act and the rules made
    > thereunder to carry out the provisions of this Act.

    Name every body in the sentence and give each its job. Then name the two steps that must happen
    before a regulation can be made. Say what the sentence does not tell you.
  answer: |
    Two bodies are named. The Food Authority makes the regulation: it holds the decide job. The
    Central Government must give its previous approval: it shares the decide job, because without its
    approval no regulation can be made.

    Two steps come first. The Central Government's approval must be given. The regulation must have
    been published beforehand ("after previous publication"). Then it is made by notification.

    The sentence does not say who proposes or advises. It does not say how long the previous
    publication must last, or who carries the regulation out. Other sections answer some of these.
    Section 12(2) names the Central Advisory Committee as the adviser. Sections 30(1) and 36(2) name
    the State's Commissioner of Food Safety and the district's Designated Officer.
  skill_ref: S47-R1-K01
- type: critique
  prompt: |
    Here is a made-up draft note from your department. "FSSAI enforces the Act. So we will write to
    the Food Safety and Standards Authority of India (FSSAI). We will ask it to check that school
    canteens in our district follow the food safety rules." Find what is wrong with whom the note
    writes to, and fix it.
  answer: |
    The note puts the Food Authority in the carry-out job. Under the Act, the State Government
    appoints a Commissioner of Food Safety "for efficient implementation" (section 30(1)). There is a
    Designated Officer for each district (section 36(2)). Checking that food businesses in a district
    follow the rules is work for those State officers.

    The error looks reasonable because the Food Authority is the best-known name in food safety. It
    does hold the decide job for regulations. But the body that makes a rule is not the body that
    checks it in a district.

    The fix: "We will write to the Commissioner of Food Safety, Chhattisgarh, and to the Designated
    Officer for the district." Whether school canteens fall within the Act at all is a separate
    question this note must not assume.
  skill_ref: S47-R1-K01
- type: teaching
  prompt: |
    A journalist has three minutes and asks: "So who actually sets the price farmers are promised for
    paddy, the expert commission or the government?" Answer in plain words, with one quotable sentence.
  answer: |
    Quotable: "The expert commission recommends the price. A Cabinet committee decides it."

    Then the detail. The Commission for Agricultural Costs and Prices studies costs and recommends
    prices. The Government also considers the views of the States and the Central Ministries. For the
    2026-27 kharif crops, the Cabinet Committee on Economic Affairs approved the prices.

    Calibrate. The releases do not say how often the committee changes what the commission
    recommends. So do not claim that it always agrees, or that it often overrules.
quantitative: false
retrieval_items:
- q: What are the four jobs around a public decision?
  a: Propose, advise, decide, carry out (including enforce).
- q: Under FSS Act section 92(1), which two bodies must agree before a food regulation is made?
  a: The Food Authority makes it, with the previous approval of the Central Government.
- q: Who carries out food safety rules in a district under the FSS Act?
  a: The State's Commissioner of Food Safety (section 30(1)) and the Designated Officer for each district (section 36(2)).
figure_note: "No figure: the section has no measured numbers, and its two job tables already set the bodies side by side. The diagram a reader would want is four boxes in a row (propose, advise, decide, carry out) with the food-regulation bodies under each and a line marking where the Union ends and the State begins."
