simplified_explanation: |
  You are a postgraduate in community medicine at a medical college in Chhattisgarh. Your department
  wants to propose action on obesity among school children and young adults in the district.

  - A **proposal** is what someone wants a public body to do. "Tax sugary drinks more" is a proposal.
  - A **policy** is what a public body has actually decided and done about a problem.
  - A **programme** is the work a public body does to carry a policy out: the staff, the money, the
    forms, the visits.

  Textbooks draw the life of a policy as four stages. A problem gets onto the agenda, with options
  for solving it. A body decides on one. Public bodies carry it out. Someone checks whether it worked.

  Use the stages as a list of jobs that must happen somewhere. Do not use them as a timetable. Real
  decisions skip stages, go back, and happen out of order.

  Before you propose anything, write down who would lose.
illustrations:
- body: |
    Here is a sentence that sounds right and is not. Suppose a made-up draft from your department
    opens like this:

    > Our department's policy is that school canteens in the district should stop selling sugary
    > drinks.

    Ask three questions of it. Who decided this? Your department did. Does your department have the
    power to tell school canteens what to sell? It does not. Where is the decision written down in a
    form that binds anyone? Nowhere. So the sentence names a proposal and calls it a policy.

    Fix it by saying what it is: "We propose that canteens in the district's schools stop selling
    sugary drinks." Now the sentence leaves a gap you can see. It does not say who would have to
    decide. Finding that body is the work of the next sections. For a canteen rule, do not guess.

    Now a real policy. The National Health Policy 2017 is a document of the Union Ministry of Health
    and Family Welfare. Open the Press Information Bureau's (PIB's) year-end release of 18 December 2017
    (https://www.pib.gov.in/PressReleaseIframePage.aspx?PRID=1513000). Search for "15th March". The
    release says the Cabinet approved the policy at its meeting on 15 March 2017. So a body with power
    decided it, and the decision is recorded. That makes it policy.

    Now open the policy itself (the National Health Systems Resource Centre's copy,
    https://nhsrcindia.org/sites/default/files/2021-07/National%20Health%20Policy%202017%20%28English%29%20.pdf).
    Go to section 3.1 and search for "could consider". The policy says that the Government "could
    consider imposing taxes on specific commodities", and names "foods having negative impact on
    health" among them.

    Here is the trap. That sentence is inside a policy, and it decides nothing. "Could consider" keeps
    an option open. It sets no tax, names no food and fixes no rate. Someone who writes "India's
    National Health Policy taxes unhealthy food" has turned an option into a decision. A tax needs its
    own decision, by the body that holds the power to tax, in its own instrument.
  analogy_breaks_when: |
    The three questions sort a sentence into proposal or policy. They do not tell you whether a
    policy is carried out. A policy can be decided, recorded and still barely happen on the ground.
    Checking that needs a look at what public bodies actually do, not only at the document.

    The made-up memo has an easy answer because a department plainly has no power over canteens. Real
    cases are harder. A body may hold the power for some schools and not others. That is why the
    next sections trace power step by step instead of guessing.
  numbers:
  - value: '2017'
    unit: year of the Cabinet's approval of the National Health Policy (15 March 2017)
    citekey: pib_1513000
    quote: "The Cabinet in its meeting held on 15th March, 2017 approved the National Health Policy (NHP) 2017."
- body: |
    Now use the four stages on the first of the department's proposals: a higher tax on
    sugar-sweetened drinks. Build a table with one row per stage. In the second column, write what
    would have to happen at that stage. In the third, write whether you know yet who does it.

    ```table
    | Stage | What has to happen | Do you know yet who does it? |
    | agenda setting: the problem | obesity among the district's children and young adults is named as a problem worth acting on | your department can raise it, but raising it decides nothing |
    | agenda setting: the options | a tax on sugary drinks is put forward, beside other options | anyone can put it forward |
    | enactment | a body with the power to tax decides the rate | not yet: the body and its power are what this book will trace |
    | implementation | the tax is collected | not yet |
    | evaluation | someone checks what happened to sales and to children's weight | not yet |
    ```

    Look at the third column. Your department sits in the first two rows. Everything that turns a
    proposal into a policy sits in the rows you cannot yet fill. That is the gap between a proposal and
    a policy, drawn as a table.

    Now take the stages away and write down who gains and who loses if the tax is decided. Reason it
    out from what a tax does: it raises the price a buyer pays. Buyers of sugary drinks pay more. Makers
    and sellers may sell less. The government collects more money. If the tax works as hoped, children
    drink fewer sugary drinks. Each of these is a group that will take a side.

    Last, a warning about order. The textbook calls its stages "sequential". Analysts who study policy
    as politics do not assume that. They describe the process as a mess of small decisions. A tax rate
    can be decided before anyone has agreed on the problem. An old programme can be evaluated and never
    changed. So read the stages as jobs. Ask which job is missing, not which stage comes next.
  analogy_breaks_when: |
    The gains and losses here are worked out from what a tax does in general. None is a measured
    effect. Whether a tax on sugary drinks in India would reduce how much children drink, or how
    much they weigh, is an empirical question that this reasoning cannot settle. A later section of
    this book asks what evidence can and cannot settle.

    The stage table also hides how many bodies may share one row. A tax in India can need more than one
    body to agree. Tracing that comes later in the book.
  numbers: []
must_know:
- point: |
    Before you write "policy" about anything, say which body decided it and where the decision is
    written down. If you cannot, write "proposal".
  kind: misconception
  bearing: policy
  refs:
  - openstax_amgov_4e
- point: |
    Ask three questions of any sentence that claims a policy exists. Who decided it? Does that body
    have the power to decide it? Where is the decision recorded in a form that binds anyone?
  kind: move
  bearing: policy
  refs:
  - openstax_amgov_4e
  - openstax_intro_polisci_1_2
- point: |
    A policy document can contain options that it does not decide. The National Health Policy 2017
    says the Government "could consider" taxes on foods harmful to health. That sets no tax.
  kind: trap
  bearing: public
  refs:
  - mohfw_2017_nhp
  - pib_1513000
- point: |
    Policy is also what public bodies actually do, and that can differ from what the document says. When
    you describe a policy in a note, say whether you are describing the text or the practice.
  kind: consequence
  bearing: methodological
  refs:
  - gilson_2012_hpsr_reader
- point: |
    If a body with the power to act has been asked and has not acted, its inaction may itself be
    policy. Write "no order has been found", not "there is no policy".
  kind: misconception
  bearing: policy
  refs:
  - openstax_amgov_4e
  - gilson_2012_hpsr_reader
- point: |
    Every proposal has losers, if only those who pay. Name them in your own note before anyone else
    does.
  kind: consequence
  bearing: policy
  refs:
  - openstax_amgov_4e
  - openstax_intro_polisci_1_2
- point: |
    The four stages do not tell you the order in which things will happen, or who does each job;
    they only list the jobs.
  kind: boundary
  bearing: methodological
  refs:
  - gilson_2012_hpsr_reader
  - openstax_amgov_4e
exercises:
- type: retrieval
  prompt: |
    From memory, say in one sentence each what a proposal, a policy and a programme are. Then name
    the four stages of the textbook model of the policy process, and the two parts of the first stage.
  answer: |
    A proposal is what someone wants a public body to do. It stays a proposal until a body with the
    power to decide has decided it. A policy is what a public body has decided and does about a public
    problem. It includes what the decision leads to, and a choice not to act. A programme is the work
    a public body does to carry a policy out.

    The four stages are agenda setting, enactment, implementation and evaluation. Agenda setting has
    two parts: identifying the problem, and specifying the alternative solutions.
  confidence_first: true
- type: critique
  prompt: |
    Each sentence below is made up. Say whether each describes a proposal, a policy, a programme, or
    none of these yet. Then say what you would need to check.

    1. "The district has a policy of promoting millets, since the district collector (the senior civil
       servant who heads the district's administration) spoke in favour of them at a school function."
    2. "Under the National Health Policy 2017, India taxes foods harmful to health."
    3. "The State government has decided nothing about sugary drinks in school canteens, so there is
       no policy on them."
    4. "Health workers in the block (the administrative unit below the district) visit each school
       once a term to weigh the children."
  answer: |
    Statement by statement:

    1. Not yet a policy. A speech in favour of something is not a decision recorded in a form that
       binds anyone. It may show that a proposal has support. Check whether any order or instrument was
       issued, by whom, and under what power.

    2. Wrong as stated. The National Health Policy 2017 is a policy, approved by the Cabinet on 15
       March 2017. But its sentence on taxes says the Government "could consider" them. That keeps an
       option open and decides no tax. To claim a tax, you need the instrument that set it, issued by
       the body that holds the power to tax.

    3. The conclusion does not follow. A choice not to act, by a body that could act, is itself
       policy. The accurate sentence is: "No order on sugary drinks in school canteens has been found."
       You would also have to check which body holds the power before you could say it has chosen not
       to act.

    4. A description of a programme, or of practice, if it is true. It says what is done. It does not
       say what policy it carries out, or who decided it. Check the order or guideline behind the
       visits, and check that the visits actually happen.
  skill_ref: S47-R1-K01
- type: teaching
  prompt: |
    A first-year resident has ten minutes and a whiteboard. They say: "Our unit has agreed that we
    want a sugary-drinks tax. So it is our policy now." Explain the difference between a proposal and
    a policy, and what the unit would have to find out next.
  answer: |
    Draw three boxes in a row on the board: "someone wants it", "a body with power decides it",
    "public bodies carry it out". Put "proposal" under the first, "policy" under the second, and
    "programme" under the third.

    Point at the first box. That is where the unit is. Wanting a tax, even unanimously, is a
    proposal. Your unit has no power to tax anyone.

    Ask the resident three questions about the tax. Who would decide it? Under what power? Where
    would the decision be written down? They will not know yet. Say that this is the right place to
    be stuck. The rest of this book is a method for answering those three questions.

    End with the losers. Ask them to list who would pay more and who would sell less. Those people
    will argue against the proposal, so the unit should know them first.
- type: interpretation
  prompt: |
    Here are three short passages. Say for each which of the four stages it belongs to, and whether it
    shows a decision.

    1. A made-up committee minute: "Members agreed that rising obesity among college students is a
       matter the district should act on."
    2. The Press Information Bureau's year-end release of 18 December 2017, looking back on the year:
       "The Cabinet in its meeting held on 15th March, 2017 approved
       the National Health Policy (NHP) 2017."
    3. A made-up report: "Two years after the canteen guidance, sales of sugary drinks at school gates
       rose."
  answer: |
    Item by item:

    1. Agenda setting, its first part: a problem is identified as worth acting on. No decision on what
       to do. The committee is made up, and in any case agreeing that a problem exists decides no
       action.

    2. Enactment, in the sense of a decision by a body with power: the Cabinet approved a policy
       statement. It is a decision. What the policy commits anyone to, beyond that, depends on what each
       sentence in it says.

    3. Evaluation, or the raw material for one. It records an outcome after a measure. It is not a
       decision, and by itself it does not show that the guidance caused the rise. Sales outside the
       school gate may have risen for other reasons.
  skill_ref: S47-R1-K01
quantitative: false
retrieval_items:
- q: What makes a proposal into a policy?
  a: A body with the power to decide it has decided it, and the decision is recorded in a form you can
    open, such as an Act, an order or a policy statement.
- q: What does the National Health Policy 2017 say about taxes on foods harmful to health, and why
    is that not a tax?
  a: It says the Government "could consider" such taxes. That keeps an option open; it sets no tax, no
    food and no rate.
- q: What are the four stages of the textbook model, and how should you use them?
  a: Agenda setting, enactment, implementation and evaluation. Use them as a list of jobs to ask which
    is missing, not as a timetable, because real decisions do not follow them in order.
figure_note: "No figure: the section's one structure, the stage table for the sugary-drinks proposal, is already a table, and no number is measured. The diagram a reader would want is the four-stage cycle with an arrow back from evaluation, and the proposal's position marked at agenda setting."
