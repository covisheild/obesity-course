concept_id: S47-R1-C01
subject: S47
rung: 1
sequence: 1
name: A proposal is not a policy
concept_type: derivable
clusters:
- system-and-state
- evidence-to-action
ground_floor_deps:
- B0-R0-C43
- B0-R0-C42
concept_deps: []
definition:
  text: |
    A proposal is a course of action that someone wants a public body (a ministry, department,
    authority or office of government) to take. Until a body with the power to decide has decided it,
    it is only a proposal, however widely it is supported.

    Public policy is what public bodies do about matters of concern to some part of society. Policy
    also includes the outcomes their action creates, and a choice not to act.

    Public bodies carry a policy out; the organised work they do for it is what this book calls a
    programme.

    A common textbook model (OpenStax, *American Government*, a US text) divides the policy process
    into four stages: agenda setting (made up of problem identification and the specifying of
    alternative solutions), enactment, implementation and evaluation, with evaluation feeding back into the others.
