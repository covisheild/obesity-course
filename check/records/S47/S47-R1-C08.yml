definition:
  text: |
    A scheme is a programme the executive runs, with a name, a period, an amount of money and
    guidelines saying how it works. Some Union schemes, such as the National Mission on Edible
    Oils – Oilseeds (NMEO-Oilseeds), rest on no Act of their own.

    Two articles of the Constitution carry the money. Under Article 112(1) the President lays
    before both Houses of Parliament, every financial year, a statement of the estimated receipts
    and expenditure of the Government of India, the annual financial statement. Under Article
    282 the Union or a State may make grants for any public purpose, even where the purpose is
    not one on which that legislature may make laws.

    The Union's executive power extends to the
    matters on which Parliament may make laws (Article 73(1)(a)). Neither the oilseeds release
    nor the Poshan 2.0 guidelines names the article it relies on; the guidelines name an Act
    instead.

    A centrally sponsored scheme such as Mission Saksham Anganwadi and Poshan 2.0 is carried out
    through the State Governments and Union Territory administrations. The cost is shared between
    the Central Government and the State by a stated ratio, which differs by component and by
    kind of State. An anganwadi is "a child care and development center" set up under the
    Integrated Child Development Services Scheme (National Food Security Act, section 2(1)).

    A scheme can also be the way a right in an Act is delivered.

    A national policy statement is a third kind of document. The National Health Policy 2017 was
    approved by the Union Cabinet on 15 March 2017. It was not passed by Parliament, so it is not
    a statute.
