simplified_explanation: |
  Governments in India do not act on nutrition and health only through Acts. They also run
  schemes. A scheme is approved for a few years and given money. The States may carry it out and
  pay part of the cost.

  A scheme is changed the way it was made: by the next approval, or by the next budget. You do
  not need Parliament to start one, and nothing in law stops it from ending, unless, like
  Poshan 2.0, it is how an Act's right is delivered.

  Some schemes are the way a right written in an Act reaches people. Then the scheme can change
  while the right in the Act stays where it is.
illustrations:
- body: |
    Start with a sentence a colleague might put in your department's draft. It is made up.

    > Under the National Health Policy 2017, the government is committed to taxing unhealthy
    > foods.

    Open the National Health Policy 2017
    (https://nhsrcindia.org/sites/default/files/2021-07/National%20Health%20Policy%202017%20%28English%29%20.pdf).
    Search for "taxes on specific commodities". Section 3.1 says: "The Government could consider
    imposing taxes on specific commodities-such as the taxes on tobacco, alcohol and foods having
    negative impact on health". "Could consider" is not "is committed to". The sentence allows
    nothing and requires nothing. A tax on a food still needs the body that sets tax rates and
    the instrument that sets them, which the next section traces.

    Now find who approved the policy. Search its text. The parts of it read for this book do not
    say. The Ministry of Health
    and Family Welfare's Year Ender of 18 December 2017
    (https://www.pib.gov.in/PressReleaseIframePage.aspx?PRID=1513000) does: "The Cabinet in its
    meeting held on 15th March, 2017 approved the National Health Policy (NHP) 2017." That is a
    Cabinet decision, not an Act of Parliament.

    Last, read what the policy says about law. Section 27 asks "whether to pass a health rights
    bill making health a fundamental right". It does not pass one. It "advocates a progressively
    incremental assurance based approach". The policy itself treats a legal right as something
    for the future.

    So rewrite the sentence.

    > The National Health Policy 2017, approved by the Union Cabinet on 15 March 2017, says the
    > government could consider taxes on foods having a negative impact on health. It does not
    > impose one.
  analogy_breaks_when: |
    This reads what one policy says, not what came after it. Whether later decisions cite the
    policy, or acted on its sentence about food taxes, is not in these texts. Nothing here links
    any later tax to this policy. And the held copy is an excerpt: sections 3.3 to 25 were not
    read, so this does not say what the rest of the policy contains.
- body: |
    Here is how to read any scheme. Ask four questions. Who approved it? For what period? With
    how much money, from whose budget? Is there an Act under it?

    Take two schemes. First, NMEO-Oilseeds. Open the Cabinet's
    release of 3 October 2024 (https://www.pib.gov.in/PressReleasePage.aspx?PRID=2061646). The
    first paragraph answers three questions: the Union Cabinet approved it, for 2024-25 to
    2030-31, with an outlay of Rs 10,103 crore. A crore is 1,00,00,000, or ten million. Search the
    release for "Act". No Act is named.

    Now search for "dietary". The mission "will promote awareness of recommended dietary
    guidelines for edible oils through an Information, Education, and Communication (IEC)
    campaign". So a campaign on cooking oil, of the kind your department might propose for the
    district, already sits inside a mission that rests on a Cabinet approval and a budget.

    Before you quote the outlay, see what it is not.

    ```working
    10,103 divided by 7 is about 1,443.3
    ```

    About Rs 1,443 crore a year on average. The release gives no year-by-year split, so no single
    year's spending can be read from it.

    Second, Saksham Anganwadi and Poshan 2.0. Open its 2022 guidelines
    (https://wcd.gov.in/documents/uploaded/Mission%20Saksham%20Anganwadi%20and%20Poshan%202.0%20scheme%20guidelines.pdf).
    Section 2.7 calls it "an ongoing Centrally-sponsored programme being implemented through the
    State Governments/ UT administrations based on a cost sharing ratio". UT stands for Union
    Territory. Section 2.8 gives the ratios. A ratio such as 60:40, read "sixty to forty", means
    that of every Rs 100 the Centre (short for the Central Government) pays Rs 60 and the State
    Rs 40. The held excerpt of the guidelines does not list what its "general components"
    include. Here is the Centre's share
    from each row.

    ```table
    | Category | General components (Centre's %) | Salary (Centre's %) | Supplementary nutrition (Centre's %) |
    | States and UTs with a legislature | 60 | 25 | 50 |
    | North-eastern and Himalayan States | 90 | 90 | 90 |
    | UTs without a legislature | 100 | 100 | 100 |
    ```

    The State pays the rest. For a State in the first row:

    ```working
    100 minus 60 = 40, the State's share of general components
    100 minus 25 = 75, the State's share of salary
    100 minus 50 = 50, the State's share of supplementary nutrition
    ```

    So a change to the food served under Poshan 2.0 in such a State touches two budgets, the
    Union's and the State's. Salary here is allowed only for selected staff, as the table's
    footnote says.

    Now the fourth question, and the turn. Section 1.3 says the guidelines "are being issued under
    the provisions of Sections 4(a), 5(1) (a), 6 & 7 of National Food Security Act, 2013". The meal
    is a right in an Act. The scheme is how it is delivered. Section 3.1 gives the scheme's
    period: 2021-22 to 2025-26. The scheme's period, money and guidelines can end or change. The
    sections of the Act do not end with them.

    ```table
    | Question | NMEO-Oilseeds | Poshan 2.0 |
    | Who approved it? | the Union Cabinet (release of 3 October 2024) | not named in the guidelines |
    | For what period? | 2024-25 to 2030-31 | 2021-22 to 2025-26 |
    | What money? | Rs 10,103 crore over the period | Centre and State, by a ratio |
    | An Act under it? | none named | National Food Security Act, sections 4(a), 5(1)(a), 6 and 7 |
    ```
  analogy_breaks_when: |
    The ratios are those printed in the 2022 guidelines. They are shares of spending, not amounts
    spent, and they say nothing about what any State paid or what reached anyone. Poshan 2.0's
    approved period ended in March 2026, and no text held for this book says whether or how it
    was continued. The yearly average for the oilseeds mission is arithmetic on the total, not a
    figure the release gives.
