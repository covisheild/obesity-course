reporting_sentence: |
  A district nutrition-awareness campaign would run as part of a scheme, not under an Act. It rests on the scheme's
  approval for a stated period and on money in the budget, and the same kind of decision can
  change it.
exercises:
- type: retrieval
  prompt: |
    From memory: what does Article 282 of the Constitution allow, and what does Article 112 require
    each year? Then give the four questions to ask of any scheme.
  answer: |
    Article 282 lets the Union or a State give money for any public purpose. That holds even
    where the purpose is outside what that government may make laws on.

    Article 112 has the President put a statement before both Houses every year. It sets out
    what the Government of India expects to receive and to spend that year.

    The four questions: Who approved it? For what period? With what money, from whose budget? Is
    there an Act under it?
  confidence_first: true
- type: interpretation
  prompt: |
    Here is part of the first paragraph of the Cabinet's release of 3 October 2024.

    > The Union Cabinet, chaired by the Prime Minister Shri Narendra Modi, has approved the National
    > Mission on Edible Oils – Oilseeds (NMEO-Oilseeds) ... The Mission will be implemented over a
    > seven-year period, from 2024-25 to 2030-31, with a financial outlay of Rs 10,103 crore.

    Say what this decides, and three things a reader might take from it that it does not say.
  answer: |
    It decides that the mission exists, who approved it (the Union Cabinet), its period (2024-25
    to 2030-31) and its total outlay (Rs 10,103 crore).

    It does not say how much will be spent in any one year. Dividing by seven gives an average,
    not a budget line. It does not name an Act behind the mission; the release names none. It
    does not say which department runs it day to day, or what share, if any, the States pay. Nor
    does it say what the money will achieve.
  skill_ref: S47-R1-K01
- type: critique
  prompt: |
    Here is a made-up line from a draft note.

    > Public health is on the State List, so the Union Government has no way to fund an obesity
    > programme in our district. Only the State can act.

    Find what is wrong, and say what the note should check instead.
  answer: |
    Public health is on the State List (Seventh Schedule, List II, entry 6). But Article 282 lets
    the Union make grants for any public purpose, even outside the subjects Parliament may make
    laws on. And a centrally sponsored scheme, such as Poshan 2.0, is carried out through the
    States, with the cost shared by a stated ratio.

    So "no way to fund" is wrong. Whether a Union scheme for this purpose exists today is a
    separate question. The note should search for one and, if it finds one, give its approval,
    period, money and guidelines.
  skill_ref: S47-R1-K01
- type: teaching
  prompt: |
    A health secretary asks, on one page: "For a school nutrition-awareness campaign in our
    district, should we ask for a law or for a scheme?" Write the answer, answer first.
  answer: |
    Answer: a scheme, unless you need something that only a law can do, such as a duty on
    others.

    A campaign tells people things. It needs approval and money, not powers. A scheme is approved
    by a government and run through a budget, sometimes two. One example already
    exists: the oilseeds mission, approved by the Union Cabinet, includes a campaign on dietary
    guidelines for edible oils. The Union can also pay into such work through a grant, under
    Article 282, even though public health is a State subject.

    The cost of that speed: a scheme lasts as long as its approval and its budget line. Plan for
    the renewal date from the start.

    What this does not tell you: whether the campaign would change what anyone eats. That needs
    evidence, which a later section takes up.
  skill_ref: S47-R1-K01
retrieval_items:
- q: Who approved the National Health Policy 2017, and on what date?
  a: The Union Cabinet, on 15 March 2017 (Ministry of Health and Family Welfare Year Ender, 18
    December 2017).
- q: Under which Act are the Poshan 2.0 guidelines issued?
  a: The National Food Security Act, 2013, sections 4(a), 5(1)(a), 6 and 7.
- q: What is the Centre's share of supplementary nutrition under Poshan 2.0 in States with a
    legislature, and in the north-eastern and Himalayan States?
  a: 50 per cent (50:50) and 90 per cent (90:10), under the 2022 guidelines.
- q: What period and outlay did the Cabinet approve for NMEO-Oilseeds?
  a: 2024-25 to 2030-31, Rs 10,103 crore in all.
