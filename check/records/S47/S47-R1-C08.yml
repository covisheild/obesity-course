- point: |
    Do not write "it is only a scheme" without checking. Poshan 2.0 delivers meals that the
    National Food Security Act makes a right: a free meal through the local anganwadi for
    pregnant women and lactating mothers (section 4(a)) and for children of six months to six
    years (section 5(1)(a)), and free meals for children who suffer from malnutrition (section
    6). Changing the entitlement itself needs Parliament to amend the Act. The nutritional
    standards in Schedule II can be changed by Central Government notification (section 37).
  kind: trap
  bearing: policy
