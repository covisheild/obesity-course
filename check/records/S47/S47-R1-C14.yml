simplified_explanation: |
  A frame names a cause. A cause points to a remedy. So once a frame is in place, some measures
  sound sensible and others sound beside the point.

  - If obesity is about each person's choices, the sensible measures are advice, campaigns and
    asking people to change.
  - If obesity is about the food around us, the sensible measures are about that food: what
    schools sell, what labels say, what costs more.
  - If obesity is a disability or a disease, the sensible measures are treatment and protection
    from unfair treatment.

  One survey in the United States found a link of this kind (it tested a disability account, not
  a disease frame). What people believed caused
  obesity went with which measures they supported.

  So before you argue for a measure, ask which frame makes it sayable. Then ask which frame the
  person deciding is using. If the two do not match, your evidence may never be heard.
illustrations:
- body: |
    Start with three Indian public texts, all from official sources. For each, find the frame and
    then the menu: the measures it makes easy to say.

    First, the Prime Minister's Mann Ki Baat broadcast of 23 February 2025. Open
    https://www.pib.gov.in/PressReleasePage.aspx?PRID=2105618 and search for "10% less". The call
    is "Decide that you will use 10% less oil every month." Then search for "personal choice":

    > Friends, using less oil in food and dealing with obesity is not just a personal choice but
    > also our responsibility towards the family.

    The frame widens personal choice to the family, but it stays with people's own decisions. The
    menu follows: each household uses less oil, and each person challenges others. In the
    broadcast he says he "will request and challenge 10 people if they can reduce oil in their food
    by 10%". Nothing in the passage asks what oil costs, how it is sold or what goes into packaged
    food.

    Second, FSSAI's Eat Right India page. Open https://fssai.gov.in/eat-right-india. FSSAI
    describes "a large-scale effort to transform the country's food system". It lists "regulatory,
    capacity building, collaborative and empowerment approaches". This is a food-system frame. The
    cause sits in the system that supplies food, so the menu includes regulation, the rules a
    regulator writes, alongside education.

    Third, the Press Information Bureau release of 3 September 2025 on the 56th GST Council meeting,
    at https://www.pib.gov.in/PressReleasePage.aspx?PRID=2163555. Search for "de-merit". The
    Council proposed "a special de-merit rate of {{n:gst_demerit_rate_pct}}% for a select few goods
    and services". Sugar-added drinks are among those goods. "De-merit" is a judgement in one word:
    the product is the problem, and a higher price is the remedy. The release's opening line also
    lists "Health" among the rate change's aims.

    Now hold the three side by side.

    ```table
    | Text | Where it puts the cause | What its menu holds |
    | Mann Ki Baat, 23 Feb 2025 | each person and family | using less oil at home; challenging others |
    | Eat Right India page | the food system | regulation, capacity building, collaboration and "empowerment" |
    | GST release, 3 Sep 2025 | the product | a higher tax on named goods |
    ```

    Here is the trap. A colleague may quote the Prime Minister's call in a note asking for a tax on
    sugary drinks. The call does not support that. Its frame is personal and family responsibility,
    and its menu is household action. It is evidence that obesity is on the national agenda, not
    that a tax is.
  analogy_breaks_when: |
    Each text was read for its frame, not checked for its effect. A text's menu is what it makes
    easy to say. That does not mean its author opposes everything else, and one government can speak
    in several frames in the same year.

    The table is this book's reading of three short passages. A longer document from any of these
    bodies could carry other frames.
