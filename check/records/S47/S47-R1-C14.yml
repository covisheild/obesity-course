definition:
  text: |
    A frame's diagnosis of cause carries an implied remedy, so each frame makes some measures
    sayable and leaves others outside the discussion. Koon and colleagues' review reports this as a
    premise of framing research.

    The held measurement is the United States survey by Barry and colleagues (2009): {{n:barry_n}}
    adults, late 2006 to early 2007. It asked about sixteen measures against obesity, besides the
    seven accounts of cause. Which accounts a respondent endorsed predicted which measures they
    supported, beyond what their background, health and politics predicted.

    The sinful-behaviour account went with less support for many of them. It went with support for
    one: letting health insurers charge higher premiums to policyholders who are overweight or do
    not exercise. Support for a tax on junk food went with the environment and industry accounts,
    not with the sinful-behaviour account. The food addiction account went with support for warning
    labels saying such foods may be addictive.

    These are associations measured once, in one country.
