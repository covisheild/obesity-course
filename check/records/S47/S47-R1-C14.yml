- body: |
    Now the evidence that a frame and a menu travel together in people's heads. Open Barry and
    colleagues' survey at https://pmc.ncbi.nlm.nih.gov/articles/PMC2879183/. It is the same United
    States survey as in the last section: {{n:barry_n}} adults, late 2006 to early 2007.

    Respondents rated sixteen measures. Four of the support figures show the range. The weighted
    share supporting (strongly or somewhat):

    - free fruit, vegetables and low-fat milk at school lunches, even at 50 dollars a year more in
      tax: 68.3 per cent;
    - warning labels on foods high in sugar or fat, saying such foods may be addictive: 63.0 per cent;
    - a tax on junk food like the taxes on cigarettes and alcohol: 28.4 per cent;
    - higher health insurance premiums for policyholders who are overweight or do not exercise:
      24.6 per cent.

    Now the link to frames. The authors asked which of the seven accounts predicted support for
    each measure. Read their results as a menu.

    - Those who leaned on the food-environment account were more likely to support measures across
      the board. The industry account went with support for the helping-or-protecting measures and
      for the junk-food tax.
    - Those who leaned on the sinful-behaviour account were less likely to support most measures.
      The exception was the higher insurance premiums, which they were more likely to support.
    - The food-addiction account went with support for the addictive-food warning label.
    - The disability account went with support for anti-discrimination protection and funding for
      treatment, and with opposition to the higher premiums.

    Look again at the junk-food tax. You might expect people who blame individuals to want to tax
    them. The survey found the opposite pattern. Support for the tax went with blaming the
    environment and industry. The authors suggest people saw the tax as hitting the industry, not
    the buyer. That is their reading, marked "suggesting" in the paper.

    How big is the link? Take the group of measures aimed at helping or protecting people: sidewalks
    required by zoning, addictive-food warning labels, free air time for health messages, a ban on
    high-fat, high-sugar advertising on children's media, healthier cooking in restaurants, and
    anti-discrimination protection. For this group the authors built a statistical model of support. Building such a model is beyond this book; read
    its result as a share. With background and health alone, the model accounted for 0.08 of the
    differences in support from one respondent to the next, on a scale where 0 is none and 1 is
    all. Adding political attitudes took it to 0.11. Adding the seven accounts took it to 0.18. So,
    for these measures and in this sample, beliefs about cause added more than politics did. This
    was the group where beliefs mattered most.

    Now say what this does not show. It is one survey, at one time, in one country. It found that
    beliefs and support go together. It did not show that changing someone's frame changes their
    support. The authors say an experiment is needed for that, and none is held here.
  analogy_breaks_when: |
    An association measured once cannot tell you which came first. A person may support a tax and
    then find the environment account convincing, as easily as the other way round.

    Most of the differences in support remained unexplained even by the fullest model: 0.18 leaves
    0.82. Beliefs about cause are one influence among many.

    The measures and the accounts were worded for Americans in 2006 and 2007. The models ran on 952
    to 973 of the {{n:barry_n}} respondents, and their results were not weighted to the national
    population. An Indian sample, other wording or another
    decade could give a different pattern.
