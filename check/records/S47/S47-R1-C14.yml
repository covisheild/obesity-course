- body: |
    Now use the rule on your own department's three proposals, and on the people who would decide
    them.

    A higher tax on sugar-sweetened drinks is sayable in a food-environment or a commercial frame:
    the product is the problem. In a personal-choice frame it sounds like punishing the buyer. Now
    add the person who decides. Suppose your note reaches someone who holds the revenue frame from
    the last section. Summan and colleagues report a health finance official saying that tax policy
    "is supposed to raise revenue and that's it". In that frame a health aim does not belong in a
    tax at all. Your evidence on health will not be heard until the frame is met.

    A rule on what school canteens may sell is sayable only if the cause sits in what is sold. In a
    frame where the cause is what parents pack, the sensible remedy is advice to parents.

    A warning label on packaged foods high in sugar, salt or fat is sayable in several frames. In
    Barry's survey, the addictive-food label went with the food-addiction account. On FSSAI's page,
    regulation sits inside a food-system frame. The same measure can be argued from more than one
    frame, and you should choose the one your decider already holds.

    Notice the order of work this gives you. First the frame, then the measure, then the evidence.
    Rung 2 of this subject takes this further under the name of the Overton window. It is named
    here and taught there.
  analogy_breaks_when: |
    Matching a frame to a decider is a reading of words, not a forecast. A decider who holds the
    revenue frame may still accept a health tax for other reasons, such as revenue itself.

    The frame decides what can be said, not what is true or what works. A measure that fits the
    decider's frame can still fail, and one that does not fit can still be right.
must_know:
- point: |
    Before you argue for a measure, name the frame that makes it sayable. Then name the frame the
    decider holds.
  kind: move
  bearing: policy
- point: |
    "People who blame individuals will back a tax on junk food" is the wrong way round, on the one
    survey held. Support for a junk-food tax went with the environment and industry accounts, not with
    the sinful-behaviour account.
  kind: misconception
  bearing: public
  refs:
  - barry_2009_metaphors
- point: |
    In that survey, for measures aimed at helping or protecting people, adding beliefs about cause
    raised the share explained from 0.11 to 0.18. That was the largest gain of the three groups of
    measures.
    It is not evidence that changing the frame changes support.
  kind: number
  bearing: methodological
  refs:
  - barry_2009_metaphors
- point: |
    Never write "framing obesity as environmental raises support by X". Say what was found: beliefs
    and support went together.
  kind: trap
  bearing: methodological
  refs:
  - barry_2009_metaphors
- point: |
    The Prime Minister's 2025 call to use {{n:edible_oil_cut_pct}}% less oil is framed as personal and family
    responsibility, and its menu is household action. Do not cite it as support for a tax or a regulation.
  kind: india_deviation
  bearing: policy
  refs:
  - pib_2105618
- point: |
    When you quote the GST release's "special de-merit rate", you take on its frame: the product is
    the problem. If you are writing to inform rather than to argue, call it by its number and its
    legal basis and let the reader judge.
  kind: consequence
  bearing: public
  refs:
  - pib_2163555
- point: |
    In Barry's survey, the disability account went with support for anti-discrimination protection
    and treatment funding, and with opposition to higher insurance premiums. For other single
    measures it predicted nothing either way. The survey did not test a disease frame.
  kind: consequence
  bearing: public
  refs:
  - barry_2009_metaphors
- point: |
    The menu rule tells you which measures a frame makes sayable. It does not tell you which measure
    works, or whether the body that must act will act.
  kind: boundary
  bearing: policy
exercises:
- type: retrieval
  prompt: |
    From memory, answer for Barry and colleagues' survey. Which account of cause went with support
    for each of these?

    (a) A junk-food tax.
    (b) Higher insurance premiums for policyholders who are overweight or do not exercise.
    (c) Warning labels saying foods may be addictive.

    Then give the survey's country, years and sample size.
  answer: |
    (a) The toxic food environment and industry manipulation accounts; not the sinful-behaviour
    account. (b) The sinful-behaviour account (and the disability account went with opposing it).
    (c) The food-addiction account.

    United States; late 2006 to early 2007; {{n:barry_n}} adults.
- type: critique
  prompt: |
    Here is the opening of a made-up memo from your department to the State health secretary,
    asking for a higher tax on sugar-sweetened drinks.

    > Young people today lack the discipline to refuse sugary drinks. Parents have stopped
    > supervising what their children consume. We therefore request a higher tax on these drinks.

    Name the frame of the first two sentences. Say why the request in the third sentence sits badly
    with it, and rewrite the opening so that frame and request match. Say what your rewrite still
    does not establish.
  answer: |
    The first two sentences use a personal-choice frame. Cause: young people's discipline and
    parents' supervision. Judgement: young people and parents have fallen short. That frame's menu
    is advice, campaigns and family effort.

    The request is a tax on a product. A tax makes sense in a frame where the product or its supply
    is part of the cause. Inside the memo's own frame, the tax reads as punishing young people for a
    failing. In the one survey held, support for a junk-food tax went with the environment and
    industry accounts, not with personal blame. So the memo argues against its own request.

    A rewrite that matches: "Sugar-sweetened drinks are cheap, sold widely near schools and heavily
    advertised. Their price can be changed through the tax on them. We therefore ask the
    Department to support a higher tax on these drinks." The facts in the first sentence would each
    need a source before the memo goes out.

    The rewrite still does not establish two things. It does not show that the tax would reduce what
    young people drink. It does not show that the person deciding will accept a health frame for a
    tax. The first needs evidence on effects.
    The second needs you to find out which frame the decider holds; a revenue frame would need a
    different opening again.

    The first two sentences also put the cause in young people's character. This book does not
    write notes that turn on anyone's willpower, whatever the request.
  skill_ref: S47-R1-K02
- type: teaching
  prompt: |
    A health secretary asks for one page: "Why does it matter how we describe obesity, if the data
    are the same?" Answer first, no methods section.
  answer: |
    Answer: the way obesity is described decides which measures look sensible, before any data are
    weighed.

    Three descriptions, three lists. If obesity is each person's choice, the list is advice and
    campaigns, and taxes look like punishing the buyer. If it is the food around us, the list
    includes school food rules, labels and taxes on products. If it is a disability or a disease,
    the list is treatment and protection from discrimination; the survey below tested the
    disability account only.

    The evidence that this matters to people: one large United States survey, 2006-07, {{n:barry_n}} adults.
    What people believed caused obesity went with which measures they backed. Support for a
    junk-food tax went with blaming the food environment and industry, not with blaming individuals.
    It is one survey, and it shows a link, not that changing the description changes minds.

    What it means for us. When the department brings you a measure, ask which description it rests
    on. Then ask whether the people who must agree, in Finance for instance, see the problem the same
    way.
  skill_ref: S47-R1-K02
retrieval_items:
- q: Why does a frame set the menu of measures?
  a: A frame names a cause, and a cause implies a remedy, so some measures become sayable and others drop out of the discussion.
- q: In Barry and colleagues' survey, what happened to the share of differences in support explained for compensatory measures when the seven accounts were added?
  a: It rose from 0.11 (background, health and politics) to 0.18; 0.08 with background and health alone. United States, 2006-07, {{n:barry_n}} adults.
- q: What frame does the Prime Minister's 2025 call to use {{n:edible_oil_cut_pct}}% less oil sit in, and what does its menu hold?
  a: Personal and family responsibility; household action, such as using less oil and challenging others to do the same.
reporting_sentence: |
  In one United States survey (2006-07, {{n:barry_n}} adults), beliefs about what causes obesity went with
  which measures people supported. Support for a tax on junk food went with blaming the food
  environment and industry, not individuals. No experiment showing that a change of frame changes
  support is known to us.
