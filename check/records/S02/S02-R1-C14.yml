  caption: "Day 2's surplus is always 140 minus day 1's, so the four possible pairs all lie on the line x + y = 140, as dependent as two days can be. The expected values, 70 for each day, meet on the same line: E[X + Y] is 70 plus 70, which is 140, and the sum rule needs no independence."
