simplified_explanation: |
  Take a chance process that gives a number, and imagine running it a very large number of
  times. The average of all those numbers is the expected value.

  Multiply each value by its chance and add.
illustration:
  body: |
    Suppose a person's energy surplus on a day, intake minus expenditure as in `S01-R1-C05`, is a random variable
    X, in kilocalories a day. The distribution below is made up.

    ```table
    | surplus x (kcal/day) | P(X = x) |
    | -300                 | 0.2      |
    | 0                    | 0.3      |
    | 200                  | 0.4      |
    | 500                  | 0.1      |
    ```

    The move you will reach for first is to average the four values, as if each were equally
    likely.

    ```working
    -300 plus 0 plus 200 plus 500 = 400
    400 divided by 4 = 100
    ```

    That gives 100, and it is wrong. Weight each value by its probability instead.

    ```working
    -300 times 0.2 = -60
    0 times 0.3 = 0
    200 times 0.4 = 80
    500 times 0.1 = 50
    -60 plus 0 plus 80 plus 50 = 70
    ```

    E[X] is 70 kcal a day. It is where the four bars would balance, each weighted by its
    probability. You will never see a day with a surplus of 70 in this model.

    Now a week. Let W be the surplus over seven days: X1 for day 1, plus X2 for day 2, and so on
    to X7. If each day has this same distribution, each has expected value 70. The sum rule gives
    the week.

    ```working
    7 times 70 = 490
    ```

    E[W] is 490 kcal.

    So 490 is the long-run average of weeks. It is not what any one week will show.

    Does the sum rule need the days to be independent? Try a pair that is as tied together as
    possible. Say that on day 2 this person's surplus is always 140 minus day 1's. A big day is
    followed by a small one. Call day 2's surplus Y. Each value of X fixes Y.

    ```table
    day 1, x (kcal/day)  day 2, y (kcal/day)  probability
    -300          440           0.2
    0             140           0.3
    200           -60           0.4
    500           -360          0.1
    ```

    Work out E[Y] from its own values and probabilities.

    ```working
    440 times 0.2 plus 140 times 0.3 plus -60 times 0.4 plus -360 times 0.1 = 70
    ```

    E[Y] is 70 too. On every row, X plus Y is 140, so E[X + Y] is 140. The sum rule gives the same.

    ```working
    70 plus 70 = 140
    ```

    The two days could hardly be more dependent, and the rule still holds.

    Now a fixed shift. Say an app adds a fixed 120 kcal to every day's logged intake, a
    systematic error as in `B0-R0-C30`. The logged surplus is X + 120. By the first rule its
    expected value is E[X] + 120.

    ```working
    70 plus 120 = 190
    7 times 190 = 1330
    ```

    Over a week the log expects 1,330 kcal against a true 490. Logging more weeks will not close that gap.

    Go back to the made-up village of `S02-R1-C13`: ten households of 2, 3, 4, 4, 5, 5, 5, 6, 7 and 9 people. Pick
    one at random, and let X be its size. Each household has probability 0.1, so E[X] is 0.1 times the sum of the
    sizes.

    ```working
    2 plus 3 plus 4 plus 4 plus 5 plus 5 plus 5 plus 6 plus 7 plus 9 = 50
    0.1 times 50 = 5.0
    ```

    The survey's four households held 5, 9, 4 and 5 people.

    ```working
    5 plus 9 plus 4 plus 5 = 23
    23 divided by 4 = 5.75
    ```

    The sample mean is 5.75. It is a statistic that estimates E[X], and it misses by 0.75. A bigger random sample
    would tend to land closer.
  analogy_breaks_when: |
    The surplus distribution is made up, and it is the same on every day only because this model
    says so. A real person's daily surplus has no known distribution. It also drifts as their
    weight and habits change, and then "7 times 70" no longer describes the week. The sum rule
    still holds with seven different expectations.

    The village is made up.
  numbers: []
must_know:
- point: |
    The expected value is not what any one person or day will show. Never tell a patient "you
    can expect to lose 4 kg" as if it were their outcome. Say what happened on average, and how
    widely people differed.
  kind: misconception
  bearing: clinical
- point: |
    Averaging the possible values without their probabilities can be trusted only when every
    value is equally likely. Weight each value by its probability, every time.
  kind: trap
  bearing: methodological
- point: |
    The expected value of a sum is the sum of the expected values, with no condition of
    independence. Do not refuse the sum because the days are dependent.
  kind: move
  bearing: methodological
- point: |
    The rules stop at sums and fixed multiples. The expected BMI is not the expected weight
    divided by the square of the expected height. For a product, a ratio or a square, go back to
    the distribution and work value by value.
  kind: boundary
  bearing: methodological
- point: |
    A fixed error of b in every reading moves the expected value by exactly b. Find the size of
    the shift against a known reference, as in `B0-R0-C30`, and subtract it.
  kind: consequence
  bearing: methodological
- point: |
    E[X] belongs to the model. Before you quote a paper's "expected value", ask whether it was
    computed from a stated distribution or averaged from data.
  kind: boundary
  bearing: methodological
- point: |
    In an energy-balance paper, check which E you are reading.
  kind: move
  bearing: methodological
exercises:
- type: interpretation
  prompt: |
    A methods section contains these two lines.

    > E(X) = Σ x_i P(X = x_i), where X is the daily energy surplus in kcal/day.
    >
    > Mean EI was 2,400 kcal/day.

    Read the first line aloud in words, symbol by symbol, with units. Then say which E in the two
    lines is energy and which is expectation, and how you can tell.
  answer: |
    The first line in words: the expected value of X equals a sum. For every value x_i that X can
    take, multiply that value by the probability that X takes it. Then add up the products. The
    Greek capital sigma, Σ, means "the sum of", as in `S02-R1-C01`. The i is a label that runs
    through the values, so x_i is the i-th value. P(X = x_i) is the probability that X equals x_i, and it has no unit. Each term
    x_i times P(X = x_i) is in kcal/day, so E(X) is in kcal/day.

    In the first line, E is followed by a bracket holding a random variable, X. That E is an
    expected value. The paper writes it with round brackets; this book writes E[X].

    In the second line, E carries the label I, for intake, and no bracket. EI is energy intake,
    and it is a rate, in kcal/day.

    The test is what follows the E. A label means energy. A bracket around a random variable
    means an expected value.
  skill_ref: S02-R1-K01
quantitative: true
practice:
- level: 1
  prompt: |
    X takes the values 1, 2 and 3, with probabilities 0.2, 0.5 and 0.3.

    Work out E[X].
  answer: |
    Multiply each value by its probability, and add.

    ```working
    1 times 0.2 plus 2 times 0.5 plus 3 times 0.3 = 2.1
    ```

    E[X] is 2.1.
- level: 2
  prompt: |
    X takes the values −2, 1 and 4, with probabilities 0.5, 0.25 and 0.25.

    Work out E[X]. Is it a value X can take?
  answer: |
    ```working
    -2 times 0.5 = -1
    1 times 0.25 = 0.25
    4 times 0.25 = 1
    -1 plus 0.25 plus 1 = 0.25
    ```

    E[X] is 0.25. X takes only −2, 1 and 4, so the expected value is not a value X can take.
- level: 2
  prompt: |
    E[X] is 3.

    Work out E[2X + 5], E[−X] and E[X − 3].
  answer: |
    Use E[aX + b] = aE[X] + b each time.

    ```working
    2 times 3 plus 5 = 11
    -1 times 3 = -3
    3 minus 3 = 0
    ```

    E[2X + 5] is 11. E[−X] is minus 3, with a = −1 and b = 0. E[X − 3] is 0, with a = 1 and
    b = −3.
- level: 3
  prompt: |
    E[X] is 4 and E[Y] is −1. Nothing is known about whether X and Y are independent.

    Work out E[X + Y], E[X − Y] and E[3X − 2Y].
  answer: |
    The sum rule needs no independence, so nothing more is needed. Use E[aX + bY] = aE[X] +
    bE[Y].

    ```working
    4 plus -1 = 3
    4 minus -1 = 5
    3 times 4 minus 2 times -1 = 14
    ```

    E[X + Y] is 3, E[X − Y] is 5 and E[3X − 2Y] is 14.
- level: 3
  prompt: |
    X takes only the values 0 and 10. E[X] is 2.5.

    Work out P(X = 10).
  answer: |
    Call P(X = 10) q. Then P(X = 0) is 1 minus q, and E[X] is 0 times (1 minus q) plus 10 times
    q. The first term is 0, so 10 times q is 2.5.

    ```working
    2.5 divided by 10 = 0.25
    ```

    P(X = 10) is 0.25. Check it.

    ```working
    0 times 0.75 plus 10 times 0.25 = 2.5
    ```
- level: 4
  prompt: |
    The FAO/WHO/UNU report on human energy requirements gives this example. A man has a PAL of
    1.75 and a mean BMR of 7.10 MJ/day. The report multiplies them to get his mean energy
    requirement.

    Treat BMR as a random variable with expected value 7.10 MJ/day, and PAL as fixed at 1.75.
    TEE is PAL times BMR. Work out E[TEE], and compare it with the report's figure of 12.42
    MJ/day.
  answer: |
    With PAL fixed, TEE is 1.75 times BMR, so this is E[aX] with a = 1.75.

    ```working
    1.75 times 7.10 = 12.425
    ```

    E[TEE] is 12.425 MJ/day. The report prints 12.42, which is the same figure cut to two
    decimal places.

    The rule works here only because PAL is a fixed number. If PAL were a random variable that
    moved with BMR, E[PAL times BMR] would not in general be E[PAL] times E[BMR].
  refs: [fao_who_unu_2004]
- level: 5
  prompt: |
    In a made-up model, a person's daily energy surplus has expected value −150 kcal/day on every
    day. Their days are not independent: a low day tends to be followed by a high one.

    Work out the expected surplus over 7 days and over 28 days.
  answer: |
    The expected value of a sum is the sum of the expected values, with or without independence.
    Every day has the same expected value, so multiply.

    ```working
    7 times -150 = -1050
    28 times -150 = -4200
    ```

    Minus 1,050 kcal over 7 days and minus 4,200 kcal over 28 days. The link between days changes
    how widely the totals spread. It does not change these expected values.
- level: 5
  prompt: |
    In a made-up model, a person's true daily surplus has expected value 30 kcal/day. Their food
    app adds a fixed 120 kcal to every day's logged intake.

    Work out the expected logged surplus for a day and for a week. Then work out how far the
    week's expected logged surplus is from the true one.
  answer: |
    The logged surplus is the true surplus plus 120. Use E[X + b] = E[X] + b.

    ```working
    30 plus 120 = 150
    7 times 150 = 1050
    7 times 30 = 210
    1050 minus 210 = 840
    ```

    The log expects 150 kcal a day and 1,050 kcal a week, against a true 210 kcal a week. The gap
    is 840 kcal a week, which is 7 times the 120. More weeks of logging repeat it every week.
- level: 6
  prompt: |
    Go back to the made-up village of ten households with 2, 3, 4, 4, 5, 5, 5, 6, 7 and 9 people.
    Its E[X] for one household picked at random is 5.0 people. A second survey picks five
    households at random and finds 4, 7, 5, 5 and 9 people.

    Work out the second survey's mean. Say which number is the parameter and which the statistic,
    and what would tend to happen to the statistic with a much bigger sample.
  answer: |
    ```working
    4 plus 7 plus 5 plus 5 plus 9 = 30
    30 divided by 5 = 6.0
    ```

    The survey's mean is 6.0 people.

    E[X], 5.0, is the parameter. It is fixed by the whole village and the way you pick. The 6.0
    is a statistic from five households, and it estimates 5.0. It misses by 1.0, and the first
    survey's 5.75 missed by less. Neither survey changes the village.

    With a much bigger random sample, picking with replacement (a household can be picked more
    than once), the sample mean would tend to
    land closer to 5.0. That is the law of large numbers. It says what tends to happen over many
    picks. It does not say that any one survey will land close.
- level: 7
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
    a day's surplus X is -300, 0, 200 or 500 kcal, with probabilities 0.2, 0.3, 0.4 and 0.1
    E[X] = (-300 plus 0 plus 200 plus 500) divided by 4
    = 400 divided by 4 = 100
    so the expected surplus is 100 kcal a day
    ```
  answer: |
    The second line broke. It averages the four values as if each had probability 0.25. They do
    not. Weight each by its own probability.

    ```working
    -300 times 0.2 plus 0 times 0.3 plus 200 times 0.4 plus 500 times 0.1 = 70
    ```

    E[X] is 70 kcal a day, not 100.

    Why the wrong answer looks reasonable: it is the ordinary mean of `B0-R0-C28`, a move the
    reader has done a hundred times. It is right when every value is equally likely. The
    probabilities were given, and the working never used them.
- level: 7
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
    each day's surplus has expected value 70 kcal a day
    the week's expected surplus is the average of the seven days' expected values
    (70 plus 70 plus 70 plus 70 plus 70 plus 70 plus 70) divided by 7 = 70
    so the expected surplus for the week is 70 kcal
    ```
  answer: |
    The second line broke. The week's surplus is the sum of the seven days, not their average. So
    its expected value is the sum of the seven expected values.

    ```working
    70 plus 70 plus 70 plus 70 plus 70 plus 70 plus 70 = 490
    ```

    The expected surplus for the week is 490 kcal. The working found the expected surplus per day
    over the week, 70 kcal a day, and then labelled it as a weekly total.

    Why the wrong answer looks reasonable: "the expected value is an average" is true, and it
    invites averaging again. The units give it away. 70 kcal a day and 490 kcal over a week are
    different quantities.
- level: 8
  prompt: |
    Here is a worked answer. Find the step that broke. BMI, from `B0-R0-C14`, is weight in
    kilograms divided by the square of height in metres.

    ```working
    two made-up adults, each picked with probability 0.5: 50 kg and 1.5 m, or 90 kg and 1.8 m
    E[weight] = 0.5 times 50 plus 0.5 times 90 = 70
    E[height] = 0.5 times 1.5 plus 0.5 times 1.8 = 1.65
    E[BMI] = E[weight] divided by E[height] squared = 70 divided by 2.7225 = 25.7
    ```
  answer: |
    The last line broke. BMI is a ratio, and E[weight divided by height squared] is not E[weight]
    divided by E[height] squared. The rules for expected values cover sums and fixed multiples.
    They do not cover a ratio or a square. Go back to the distribution: work out each adult's BMI,
    then weight by probability.

    ```working
    1.5 times 1.5 = 2.25
    50 divided by 2.25 = 22.22
    1.8 times 1.8 = 3.24
    90 divided by 3.24 = 27.78
    0.5 times 22.22 plus 0.5 times 27.78 = 25.0
    ```

    E[BMI] is 25.0 kg/m^2, not 25.7.

    Why the wrong answer looks reasonable: every line before the last is correct, and "put the
    averages into the formula" works for sums. It fails as soon as the formula divides or squares.
- level: 9
  prompt: |
    A programme leaflet says this.

    > The expected weight loss on our programme is 4 kg. So you will lose 4 kg.

    Here is the leaflet's model, which is made up. The loss is 0 kg with probability 0.3, 4 kg
    with probability 0.4, and 8 kg with probability 0.3. Decide what to compute, compute it, and
    say what your answer does not establish.
  answer: |
    What to compute: the expected value of the model, and then the chance of the thing the
    leaflet promises.

    ```working
    0 times 0.3 plus 4 times 0.4 plus 8 times 0.3 = 4.0
    ```

    The expected loss is 4.0 kg, so the first sentence matches the model. The chance of losing
    exactly 4 kg in this model is 0.4. The chance of losing nothing is 0.3.

    What this does not establish. "You will lose 4 kg" is a claim about one person. The expected
    value is an average over many, and here three in ten lose nothing. A person who loses nothing
    has not failed the programme's arithmetic; they are one of its outcomes.

    It also does not say where the model came from. Perhaps the 0.3, 0.4 and 0.3 came from one
    group of participants. Then they are relative frequencies, and 4.0 is a sample mean that
    estimates the true expected loss. And it says nothing about later on: an average at one time point says nothing
    about weight in the months after it.

    What to say instead: "On average people lost 4 kg. Three in ten lost none, and three in ten
    lost 8 kg."
- level: 10
  prompt: |
    A health talk says this.

    > Eating just 100 kcal a day more adds up to 36,500 kcal in a year, and all of it is stored.

    Decide what to compute, compute it, and say what your answer does not establish.
  answer: |
    What to compute: the talk treats the extra 100 kcal of intake as a surplus of 100 on every
    day. Then the expected surplus over 365 days is 365 times 100.

    ```working
    365 times 100 = 36500
    ```

    36,500 kcal. The arithmetic of the expected value is right on that condition.

    What this does not establish. The condition is the whole claim. The sum rule gives 365 times
    100 only if every one of the 365 days has an expected surplus of 100. Book 1 shows why that
    fails. As stores and weight rise, expenditure rises with them (`S01-R1-C04`). So the same
    intake gives a shrinking surplus. This is the static rule of `S01-R1-C07`, and it shares that
    rule's flaw.

    It is also an expected value, not a forecast for one person. Real days scatter around any
    expected value, and so do real years.

    And "all of it is stored" is the energy-balance identity of `S01-R1-C05` applied to the
    total. That part is right by definition, whatever the surplus turns out to be. What is
    wrong is the 36,500.
retrieval_items:
- q: How is the expected value of a discrete random variable worked out?
  a: Multiply each value by its probability and add the products. It carries the unit of the
    variable and need not be a value the variable can take.
- q: What are the two rules for expected values, and which needs independence?
  a: E[aX + b] = aE[X] + b, and E[X + Y] = E[X] + E[Y]. Neither needs independence.
- q: Why is E[BMI] not E[weight] divided by E[height] squared?
  a: The rules cover only sums and fixed multiples. BMI is a ratio with a square, so its expected
    value has to be worked out value by value from the distribution.
