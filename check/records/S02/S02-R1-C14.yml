definition:
  text: |
    Let X be a discrete random variable, as in `S02-R1-C13`, taking the values x1, x2, ..., xk. Its expected value, or
    expectation, is written E[X]. It is each value times its probability, all added up: x1 times P(X = x1), plus x2 times P(X
    = x2), and so on up to xk times P(X = xk). In the sigma notation of `S02-R1-C01`, E[X] = Σ x P(X = x), the sum running
    over every value x that X can take. It carries the unit of X.

    E[X] is a probability-weighted average. When every listed case is equally likely, as with the
    households of the village below, E[X] is the ordinary mean of `B0-R0-C28`. In general it is
    not. It need not be a value X can take.

    It is the long-run average: repeat the chance process many times, and the average of the
    values X takes settles towards E[X].
    That is the law of large numbers. E[X] is a property of the probability distribution, a parameter in the sense of `B0-R0-C29`. The
    mean of a sample of observed values is a statistic. It estimates E[X] and differs from it from one sample to the next.

    Two rules follow from the definition. The first: for fixed numbers a and b, E[aX + b] = aE[X]
    + b. Each value x becomes ax + b, with the same probability. Multiply out, as in `B0-R0-C15`.

    ```working
    Σ (ax + b) P(X = x) = a Σ x P(X = x) + b Σ P(X = x) = aE[X] + b
    ```

    The last step uses the fact that the probabilities add to 1.

    The second: for any two random variables X and Y, E[X + Y] = E[X] + E[Y]. A random variable
    gives a number to each outcome, so E[X] is also the sum, over outcomes, of X's number times
    the outcome's probability. Outcomes that give the same number group back into Σ x P(X = x).
    X + Y gives each outcome X's number plus Y's. So its sum splits
    into the sum for X plus the sum for Y. No step asked whether X and Y are independent.
    Independent means that knowing one tells you nothing about the other, the idea of
    `B0-R0-C25` carried to random variables. Together the rules give E[aX + bY] = aE[X] + bE[Y].

    Neither rule reaches products, ratios or squares. E[XY] is not in general E[X] times E[Y], and
    E[X/Y] is not in general E[X] divided by E[Y]. For those, go back to the distribution.

    In papers on energy balance, E with a label, as in EI, EE or ES, is an energy quantity: a store
    in kcal, or a rate in kcal a day. E followed by square brackets around a random
    variable, E[X], is expectation. Some books write E(X) with round brackets.
