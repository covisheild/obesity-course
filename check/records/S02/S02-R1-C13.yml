definition:
  text: |
    A random variable is a rule that gives a number to each outcome of a chance process. A random
    variable is written as a capital letter, such as X. P(X = x) is the probability that X takes
    the value x.

    A random variable is discrete when the values it can take can be listed, one by one. Its
    probability distribution is the list of every value it can take, each paired with its
    probability. The values, or bands of values, listed must not overlap. Each probability is between 0 and 1,
    inclusive, and the probabilities add to 1.

    A random variable is continuous when it can take any value in an interval, like a weight
    measured with perfect precision, and its probabilities are areas under a curve. The
    probability of any one exact value is then 0. Its probability distribution is given by a
    probability density: a curve that never goes
    below zero and has a total area of 1 beneath it. The probability that X lands between a and b
    is the area under the probability density from a to b. The height of a probability density is
    a probability per unit of X, not a probability, and it can be larger than 1.

    A probability distribution is a model of the chance process; a survey gives data. When the
    whole population is listed, as in the made-up village below, the model is known exactly. A
    frequency table of data, as in `B0-R0-C27`, gives
    relative frequencies from the cases actually counted. Those estimate the probabilities, and
    differ from them from one sample to the next.
