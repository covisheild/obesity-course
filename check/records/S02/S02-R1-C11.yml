    citekey: icmr_nin_2020_brief
    as_of: '2026-09-24'
    quote: Sedentary work 65.0 2110 32
  - value: "5"
    unit: per cent, the earlier and the further reduction ICMR-NIN applied to BMR from FAO/WHO/UNU equations for Indian adults
    citekey: icmr_nin_2020_brief
    as_of: '2026-09-24'
    quote: further reduced the BMR by another 5 % for adults.
  - value: "12"
    unit: per cent, upper end of the amount by which FAO/WHO/UNU equations can overestimate BMR among Indians
    citekey: icmr_nin_2020_brief
    as_of: '2026-09-24'
    quote: suggest that the equation can overestimate the BMR by 10 -12%, because the FAO/WHO/UNU data set included young and muscular subjects.
must_know:
- point: |
    Check the sizes before you multiply. The first matrix needs as many columns as the second has
    rows, and the answer has the first one's rows and the second one's columns. Then read the
    answer's size back as meaning: three rows of people means three people's results.
  kind: move
  bearing: methodological
- point: |
    Order matters. AB and BA are usually different, and one may not exist. A data matrix times a
    vector of coefficients gives one prediction per person. Written the other way round, the same
    symbols describe nothing.
  kind: trap
  bearing: methodological
- point: |
    The column of 1s is what carries the intercept. Leave it out of a data matrix, and every
    prediction silently loses the intercept. For the Schofield equation for men aged 18 to 30, that
    is 692.2 kcal/day off every man's BMR.
  kind: trap
  bearing: clinical
- point: |
    ICMR-NIN's 2020 note cuts the BMR from the FAO/WHO/UNU equations for Indian adults by 5% on top
    of an earlier 5%. Applied to a table of predictions, that is one scalar multiple of the whole
    table. The note does not say whether the scalar is 0.90 or 0.9025. When you apply the cut, say
    which, and when you read a paper that applies it, look for which.
  kind: india_deviation
  bearing: policy
  refs: [icmr_nin_2020_brief]
- point: |
    Exact arithmetic is not an exact prediction. A matrix product gives the equations' output to
    every decimal place, but the equations were fitted to other people. ICMR-NIN says they can run
    10 to 12% high for Indians. Quote a computed BMR as an estimate for a group, not as a patient's
    measured rate.
  kind: boundary
  bearing: clinical
  refs: [icmr_nin_2020_brief]
- point: |
    Read y = Xb in a methods section as "each person's prediction is their row dotted with one set
    of coefficients". How the coefficients b were chosen from data is a separate question, which
    the statistics books take up. The multiplication tells you nothing about whether they were
    chosen well.
  kind: consequence
  bearing: methodological
exercises:
- type: interpretation
  prompt: |
    A methods section says: "Predicted BMR was computed as y = Xb. Here X is an n × 2 matrix whose
    rows are (body weight in kg, 1), and b = (15.057, 692.2)."

    Say what each symbol stands for, with its unit and size. Then say in one sentence what the
    equation claims.
  answer: |
    n is the number of people. X is the data matrix, n × 2. Each row is one person. The first
    column is body weight in kg, and the second column is the pure number 1.

    b is the vector of coefficients, length 2. Its first entry, 15.057, is a slope in kcal/day per
    kg. Its second, 692.2, is an intercept in kcal/day. They are the FAO/WHO/UNU Table 5.2
    equation for men aged 18 to 30.

    y is a vector of length n, in kcal/day, with one predicted BMR for each person.

    The claim, in words: each person's predicted BMR is 15.057 times their body weight in kg,
    plus 692.2 kcal/day. The same two coefficients are used for everyone.
  skill_ref: S02-R1-K01
quantitative: true
practice:
- level: 1
  prompt: |
    A is the matrix below.

    ```table
    | | column 1 | column 2 | column 3 |
    | row 1 | 2 | 0 | 1 |
    | row 2 | 3 | 4 | -1 |
    ```

    What is the size of A? What is the entry in row 2, column 3? What is the entry in row 1,
    column 2?
  answer: |
    A has 2 rows and 3 columns, so it is 2 × 3.

    The entry in row 2, column 3 is −1. The entry in row 1, column 2 is 0.
- level: 2
  prompt: |
    With A as in the last problem, work out Ax for x = (1, 2, 3), row by row.
  answer: |
    A has 3 columns and x has 3 entries, so Ax is defined. It has one entry for each of A's 2
    rows. Dot each row with x.

    ```working
    2 times 1 plus 0 times 2 plus 1 times 3 = 5
    3 times 1 plus 4 times 2 plus -1 times 3 = 8
    ```

    Ax = (5, 8).
- level: 2
  prompt: |
    Work out the same Ax again, this time as a weighted sum of the columns of A.
  answer: |
    The columns of A are (2, 3), (0, 4) and (1, −1). The weights are the entries of x: 1, 2 and 3.

    ```working
    1 times 2 plus 2 times 0 plus 3 times 1 = 5
    1 times 3 plus 2 times 4 plus 3 times -1 = 8
    ```

    The weighted sum 1(2, 3) + 2(0, 4) + 3(1, −1) is (5, 8), the same as before.
- level: 2
  prompt: |
    Work out 3A, with A as in the first problem.
  answer: |
    Multiply every entry by 3.

    ```working
    3 times 2 = 6
    3 times 0 = 0
    3 times 1 = 3
    3 times 3 = 9
    3 times 4 = 12
    3 times -1 = -3
    ```

    3A has first row (6, 0, 3) and second row (9, 12, −3).
- level: 3
  prompt: |
    P has rows (1, 2) and (3, 4). Q has rows (0, 1) and (1, 0). Work out PQ and QP.
  answer: |
    Both are 2 × 2 times 2 × 2, so both are defined and 2 × 2. The columns of Q are (0, 1) and
    (1, 0). Dot each row of P with each column of Q.

    ```working
    1 times 0 plus 2 times 1 = 2
    1 times 1 plus 2 times 0 = 1
    3 times 0 plus 4 times 1 = 4
    3 times 1 plus 4 times 0 = 3
    ```

    PQ has rows (2, 1) and (4, 3). Now QP. The columns of P are (1, 3) and (2, 4).

    ```working
    0 times 1 plus 1 times 3 = 3
    0 times 2 plus 1 times 4 = 4
    1 times 1 plus 0 times 3 = 1
    1 times 2 plus 0 times 4 = 2
    ```

    QP has rows (3, 4) and (1, 2). The two products differ. PQ swapped P's columns, and QP swapped
    its rows.
- level: 3
  prompt: |
    For each pair of sizes, say whether the product exists, and if it does, give its size.

    1. a 3 × 2 matrix times a 2 × 4 matrix
    2. a 2 × 4 matrix times a 3 × 2 matrix
    3. a 2 × 2 matrix times a 2 × 1 matrix
    4. a 1 × 3 matrix times a 3 × 1 matrix
  answer: |
    1. The first has 2 columns and the second 2 rows, so it exists, and it is 3 × 4.
    2. The first has 4 columns and the second 3 rows, so it does not exist.
    3. It exists, and it is 2 × 1: a vector of length 2.
    4. It exists, and it is 1 × 1: a single number. One row dotted with one column is the dot
       product of `S02-R1-C10`.
- level: 4
  prompt: |
    FAO/WHO/UNU Table 5.2 gives these BMR equations for women, in kcal/day. For ages 18 to 30, the
    slope is 14.818 and the intercept 486.6. For ages 30 to 60, the slope is 8.126 and the
    intercept 845.6. ICMR-NIN's
    reference woman weighs 55.0 kg.

    Write the equations as a 2 × 2 matrix, one equation in each row, and multiply it by the vector
    for the reference woman. Say what each entry of the answer is.
  answer: |
    The matrix has rows (14.818, 486.6) and (8.126, 845.6). The reference woman's vector is
    (55, 1), with the 1 lined up with the intercepts.

    ```working
    14.818 times 55 plus 486.6 times 1 = 1301.59
    8.126 times 55 plus 845.6 times 1 = 1292.53
    ```

    The answer is (1301.59, 1292.53) kcal/day. The first entry is the predicted BMR of a 55 kg
    woman by the equation for ages 18 to 30. The second is by the equation for ages 30 to 60.
  refs:
  - fao_who_unu_2004
  - icmr_nin_2020_brief
- level: 5
  prompt: |
    Three women weigh 45, 55 and 70 kg; the 45 and 70 are made up. Write their data matrix X with
    rows (body weight, 1). Use the FAO/WHO/UNU equation for women aged 18 to 30, b = (14.818, 486.6)
    (Table 5.2), to work out y = Xb.
  answer: |
    X is 3 × 2, with rows (45, 1), (55, 1) and (70, 1). b has 2 entries, so Xb is defined. It has
    3 entries, one for each woman.

    ```working
    14.818 times 45 plus 486.6 times 1 = 1153.41
    14.818 times 55 plus 486.6 times 1 = 1301.59
    14.818 times 70 plus 486.6 times 1 = 1523.86
    ```

    y = (1153.41, 1301.59, 1523.86), in kcal/day.
  refs:
  - fao_who_unu_2004
- level: 5
  prompt: |
    FAO/WHO/UNU say that multiplying a group's physical activity level (PAL) by its BMR gives its
    energy requirement. They treat a PAL of 1.75 or more as desirable. Take the vector of the two
    men's-equation BMRs for a 65 kg man from this section, (1670.905, 1618.78) kcal/day. Multiply
    it by the scalar 1.75.
  answer: |
    A scalar multiplies every entry.

    ```working
    1.75 times 1670.905 = 2924.08375
    1.75 times 1618.78 = 2832.865
    ```

    The result is about (2924.1, 2832.9) kcal/day. It is the energy requirement at a PAL of 1.75
    that each equation's BMR implies for a 65 kg man.
  refs:
  - fao_who_unu_2004
- level: 6
  prompt: |
    Put the two FAO/WHO/UNU women's equations in the columns of a matrix D. The first column is
    (14.818, 486.6), for ages 18 to 30. The second is (8.126, 845.6), for ages 30 to 60. With X as in
    the problem before last, rows (45, 1), (55, 1) and (70, 1), work out XD. At which of the three
    body weights does the equation for ages 30 to 60 predict the higher BMR?
  answer: |
    X is 3 × 2 and D is 2 × 2, so XD exists and is 3 × 2. Its first column is Xb from the problem
    before last: 1153.41, 1301.59 and 1523.86. The second column is X times (8.126, 845.6).

    ```working
    8.126 times 45 plus 845.6 times 1 = 1211.27
    8.126 times 55 plus 845.6 times 1 = 1292.53
    8.126 times 70 plus 845.6 times 1 = 1414.42
    ```

    XD has rows (1153.41, 1211.27), (1301.59, 1292.53) and (1523.86, 1414.42), in kcal/day.

    At 45 kg the equation for ages 30 to 60 predicts more, 1211.27 against 1153.41. At 55 kg and
    at 70 kg it predicts less. Its line is flatter, with a smaller slope, and it starts higher,
    with a larger intercept. So the two lines cross somewhere between 45 and 55 kg.
  refs:
  - fao_who_unu_2004
- level: 7
  prompt: |
    Here is a worked answer for a 65 kg man's BMR. It uses the FAO/WHO/UNU equation for men aged
    18 to 30, with b = (15.057, 692.2). Find the step that broke.

    ```working
    his vector: (1, 65)
    BMR = 15.057 times 1 plus 692.2 times 65
    BMR = 45,008 kcal/day
    ```
  answer: |
    The first step broke. The entries of his vector are in the wrong order. The slope, 15.057,
    has to meet his body weight, and the intercept, 692.2, has to meet the 1. So his vector must be
    (65, 1), in the order of b.

    ```working
    15.057 times 65 plus 692.2 times 1 = 1670.905
    ```

    His predicted BMR is about 1,671 kcal/day.

    Why the wrong answer looks reasonable: a dot product of two vectors of length two is correct
    arithmetic whatever the order. The error shows only when you read the answer back as a
    quantity. 45,008 kcal/day is more than ten times any adult's daily energy use. Read every answer
    back before you use it.
- level: 7
  prompt: |
    Here is a worked answer for PQ, with P rows (1, 2) and (3, 4), and Q rows (5, 6) and (7, 8).
    Find the step that broke.

    ```working
    PQ is 2 × 2
    multiply matching entries: 1 times 5, 2 times 6, 3 times 7, 4 times 8
    PQ has rows (5, 12) and (21, 32)
    ```
  answer: |
    The second step broke. It multiplied entries in matching places, which is not a matrix
    product. Each entry of PQ is a row of P dotted with a column of Q. The columns of Q are (5, 7)
    and (6, 8).

    ```working
    1 times 5 plus 2 times 7 = 19
    1 times 6 plus 2 times 8 = 22
    3 times 5 plus 4 times 7 = 43
    3 times 6 plus 4 times 8 = 50
    ```

    PQ has rows (19, 22) and (43, 50).

    Why the wrong answer looks reasonable: adding two matrices does work entry by entry, and so
    does multiplying a matrix by a scalar. It feels natural for multiplying two matrices to work
    the same way. It does not.
- level: 8
  prompt: |
    Someone wants to apply a 10% cut to the FAO/WHO/UNU BMR equation for men aged 18 to 30. Here
    is their worked answer for a 65 kg man. Find the step that broke.

    ```working
    cut the equation by 10%: 0.9 times 15.057 = 13.5513
    new equation: 13.5513 times body weight plus 692.2
    BMR = 13.5513 times 65 plus 692.2 = 1573.0345 kcal/day
    ```
  answer: |
    The first step broke. A 10% cut in the BMR multiplies the whole prediction by 0.9. The
    prediction is the slope times body weight plus the intercept, so both parts must be scaled.
    The working scaled the slope and left the intercept alone.

    Scale the whole row of coefficients, or scale the answer. The two give the same result.

    ```working
    0.9 times 692.2 = 622.98
    13.5513 times 65 plus 622.98 = 1503.8145
    0.9 times 1670.905 = 1503.8145
    ```

    The cut BMR is about 1,504 kcal/day, not 1,573. The working took off only about 98 kcal/day
    of the 167 kcal/day it meant to.

    Why it looks reasonable: the slope is the part that "depends on weight", so it can feel like
    the part to adjust. But a scalar multiple of a matrix multiplies every entry. Scaling part of a
    row is a different model, not a percentage cut.
- level: 9
  prompt: |
    A colleague says: "ICMR-NIN says the FAO/WHO/UNU equations overestimate BMR in Indians by 10
    to 12%. So multiply them by 0.88 to 0.90 to get the true figure."

    Decide what to compute, compute it, and say what your answer does not establish.
  answer: |
    What to compute: what "overestimate by 10%" means as a scalar. Take the 65 kg man's prediction
    from the equation for men aged 18 to 30, 1670.905 kcal/day.

    If the prediction is 10% above the actual figure, the prediction is 1.10 times the actual. Then
    the actual is the prediction divided by 1.10.

    ```working
    1670.905 divided by 1.1 = 1519.005
    1670.905 divided by 1.12 = 1491.879
    ```

    If instead the excess is 10% of the prediction, the actual is 0.90 times the prediction.

    ```working
    0.9 times 1670.905 = 1503.8145
    0.88 times 1670.905 = 1470.3964
    ```

    Dividing by 1.10 is the same as multiplying by about 0.909, not 0.90. The two readings differ
    by about 15 to 21 kcal/day here. The colleague's rule takes the second reading without saying
    so.

    What this does not establish. It does not say which reading ICMR-NIN meant. Its note gives
    "10 -12%" and does not define it. The note's own adjustment is a different thing: two 5% cuts.
    It does not give any one person's true BMR. A range of 10 to 12% for a group says nothing
    about where one person sits, and the equations were never fitted to that person.
  refs:
  - icmr_nin_2020_brief
  - fao_who_unu_2004
- level: 10
  prompt: |
    A clinic manager says: "Our spreadsheet computes every patient's BMR with a single matrix
    multiplication, so the figures are exact."

    Decide what to compute, compute it, and say what your answer does not establish.
  answer: |
    What to compute: how much the answer can move for reasons the arithmetic cannot see. Take two
    men who both weigh 65 kg, one aged 29 and one aged 31. The spreadsheet uses the FAO/WHO/UNU
    equation for each man's age band.

    ```working
    15.057 times 65 plus 692.2 times 1 = 1670.905
    11.472 times 65 plus 873.1 times 1 = 1618.78
    1670.905 minus 1618.78 = 52.125
    ```

    Two years of age, across the line between bands, move the prediction by about 52 kcal/day at
    the same body weight. Now the size of the bias ICMR-NIN describes, 10 to 12% of the
    prediction, for the younger man.

    ```working
    0.10 times 1670.905 = 167.0905
    0.12 times 1670.905 = 200.5086
    ```

    That is roughly 167 to 201 kcal/day.

    The multiplication is exact: the spreadsheet does the arithmetic of the equations without
    error. The figures it produces are only as good as the equations.

    What this does not establish. It does not show that the equations are wrong for any one
    patient. The bias is ICMR-NIN's statement about Indians as a group. It does not measure any
    patient's BMR. That needs a measurement under the conditions that define BMR, not a formula.
    And the 52 kcal/day step between age bands is a feature of the table, not of a body two years
    older.
  refs:
  - fao_who_unu_2004
  - icmr_nin_2020_brief
retrieval_items:
- q: When does the product AB of two matrices exist, and what size is it?
  a: When A has as many columns as B has rows. If A is m × r and B is r × n, AB is m × n. Its entry
    in row i and column j is row i of A dotted with column j of B.
- q: Give the two ways of reading a matrix times a vector.
  a: Row by row, each row of the matrix dotted with the vector gives one entry of the answer. Or
    column by column, the answer is a weighted sum of the matrix's columns, with the vector's
    entries as the weights. They always agree.
- q: Why does a data matrix for a straight-line prediction carry a column of 1s?
  a: So the intercept is added once to each prediction. Each row is (body weight, 1), and the 1
    meets the intercept in the coefficient vector. Without it, every prediction loses the
    intercept.
