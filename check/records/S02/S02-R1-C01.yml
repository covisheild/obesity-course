definition:
  text: |
    A symbol in an equation stands for a quantity, and the paper fixes which quantity in words:
    in a clause beginning "where" after the equation, or in the sentences around it.

    A subscript is a small letter or number set low after a symbol, and it is part of the
    symbol's name. A subscript never multiplies.

    Every term added to or subtracted from another, and each side of an equals sign, carries the
    same unit.
