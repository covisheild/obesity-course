- file: s02-r1-c02-settling.png
  caption: "The average rate of S(t) = 5 t^2 from t = 2 over a step h, for steps from -1 to 1. Every average lies on the line 20 + 5h. As the step shrinks towards zero from either side, the averages close in on 20, the derivative at t = 2; the point h = 0 itself is never computed."
  alt: "Points on a rising straight line, with the step h along the bottom from -1 to 1 and the average rate up the side from 15 to 25. Points at h = -1, -0.1, -0.01 and -0.001 sit at 15, 19.5, 19.95 and 19.995; points at 0.001, 0.01, 0.1 and 1 sit at 20.005, 20.05, 20.5 and 25. The line passes through 20 at h = 0, where there is no point."
  source: draw.py
  spec:
    kind: scatter
    from_table: {block: 0, x: 0, y: [3]}
    x_label: step h
    y_label: average rate over the step
    relations:
    - fit: "y = 20 + 5*x"
      draw: true
      label: "average rate = 20 + 5h"
    labels:
    - {text: "20 at h = 0", at: [0, 20], offset: [8, -14]}
- file: s02-r1-c02-weighings.png
  caption: "Fifteen made-up morning weighings. Day to day the weight jumps by as much as 0.7 kg, while the average of days 0 to 4, 80.0 kg, and of days 10 to 14, 79.5 kg, fall by 0.5 kg over ten days. The side axis does not start at zero, so the swings look larger than they are."
  alt: "Fifteen points from day 0 to day 14, zigzagging between 79.0 and 80.3 kilograms, drifting slowly downwards."
  source: draw.py
  spec:
    kind: scatter
    from_table: {block: 1, x: 0, y: [1]}
    x_label: day
    y_label: weight (kg)
    y_range: [78.8, 80.5]
    relations:
    - check: "mean(y[0:5]) = 80.0"
    - check: "mean(y[10:15]) = 79.5"
    derived:
    - {value: "0.7", from: "y[4] - y[5]"}
