definition:
  text: |
    The average rate of change of f over the interval from a to a + h is f(a + h) minus f(a),
    divided by h, for h not zero.

    The derivative of f at a is the single number these averages settle on as h is taken closer
    and closer to zero, from above and from below. Where the two sides
    do not settle on one number, f has no derivative at a.

    The derivative at a is written f′(a), said "f prime of a".

    The derivative carries the unit of f divided by the unit of the input.

    The derivative belongs to a smooth curve, one with no jumps or corners, so that the averages
    settle. Repeated measurements are separate points with
    error in them.
