- file: s02-r1-c02-settling.png
  caption: "The average rate of S(t) = 5 t^2 from t = 2 over a step h, for six steps from -1 to 1. Every average lies on the line 20 + 5h. As the step shrinks towards zero from either side, the averages close in on 20, the derivative at t = 2. The dashed line marks h = 0, which is never computed. The closer steps, down to 0.001, are in the table."
  alt: "Six points on a rising straight line, with the step h along the bottom from -1 to 1 and the average rate up the side from 15 to 25. Points at h = -1, -0.5 and -0.1 sit at 15, 17.5 and 19.5; points at 0.1, 0.5 and 1 sit at 20.5, 22.5 and 25. A dashed upright line marks h = 0, where the straight line passes 20 and there is no point."
