  caption: "Fifteen made-up morning weighings. The one-day rate from day 12 to day 13 is 0.6 kg a day upwards, and day to day the weight jumps by as much as 0.7 kg. The line from the average of days 0 to 4, 80.0 kg at day 2, to the average of days 10 to 14, 79.5 kg at day 12, falls at 0.05 kg a day. The side axis does not start at zero, so the swings look larger than they are."
  alt: "Fifteen points from day 0 to day 14, zigzagging between 79.0 and 80.3 kilograms and drifting slowly downwards. A short steep line rises from 79.0 at day 12 to 79.6 at day 13. A long gentle line falls from 80.0 at day 2 to 79.5 at day 12."
