simplified_explanation: |
  Book 0 showed you the rate at an instant as the slope of a tangent, laid on a curve with a ruler.
  It named that rate the derivative (`B0-R0-C21`). This section works the number out with
  arithmetic, no ruler needed.

  A shorter interval gives a closer answer. So take the average rate over shorter and shorter
  intervals, all starting at the moment you care about. They settle on one number. That number is
  the rate at that instant.

  Here is the procedure for a function f at an input a.

  1. Pick a small step, h. Work out f(a + h) minus f(a), and divide by h.
  2. Make h closer to zero: 1, then 0.1, then 0.01, then 0.001.
  3. Do the same with h below zero: minus 1, minus 0.1, and so on. Those intervals end at a
     instead of starting there. (A negative divided by a negative is positive, `B0-R0-C01`.)
  4. If both lists close in on the same number, that number is very likely the derivative at a.
     The algebra, as below, settles it.

  You never set h to zero. The number they close in on is called the limit.

  The derivative has three names you will meet. f′(a), said "f prime of a". dS/dt, said "dee S by
  dee t". And in words, the rate of change of S with respect to t.

  A weight in kilograms against time in days gives kilograms per day.

  Its sign tells you the direction. Positive means rising at that instant. Negative means
  falling. Zero means neither, at that instant.

  Read Hall and colleagues' equation from the last section again in these terms. dES/dt is the rate of change of stored
  energy, in kilocalories a day. It is not the stored energy itself.
illustration:
  body: |
    A quantity follows the rule S(t) = 5 t^2, which is 5 times t times t. A note says this.

    > S went from 20 at t = 2 to 45 at t = 3. So at t = 2 it is rising at 25 a unit of time.

    The 25 is the average over a whole unit of time, from t = 2 to t = 3. Test that by shrinking
    the interval.

    Each row takes a step h from t = 2. Work out S(2 + h), subtract S(2), and divide by h.

    ```table
    | step h | S(2 + h) | S(2 + h) minus S(2) | average rate |
    | 1 | 45 | 25 | 25 |
    | 0.1 | 22.05 | 2.05 | 20.5 |
    | 0.01 | 20.2005 | 0.2005 | 20.05 |
    | 0.001 | 20.020005 | 0.020005 | 20.005 |
    | -0.001 | 19.980005 | -0.019995 | 19.995 |
    | -0.01 | 19.8005 | -0.1995 | 19.95 |
    | -0.1 | 18.05 | -1.95 | 19.5 |
    | -1 | 5 | -15 | 15 |
    ```

    Read down the last column. Both lists close in on 20. So the rate at t = 2 is 20 a unit of
    time, not 25.

    Now see why it is exactly 20, with algebra. Each term of the first bracket multiplies the
    whole second bracket. That is the rule from `B0-R0-C15`, used twice. The first working line
    shows it.

    ```working
        (2 + h) times (2 + h) = 2 times (2 + h) + h times (2 + h)
        = 4 + 2h + 2h + h^2
        = 4 + 4h + h^2
        S(2 + h) = 5 times (4 + 4h + h^2) = 20 + 20h + 5 h^2
    ```

    Subtract S(2), which is 20. Then divide by h.

    ```working
        S(2 + h) minus S(2) = 20h + 5 h^2
        (20h + 5 h^2) divided by h = 20 + 5h
    ```

    The average rate over a step h is 20 + 5h, for any h. As h shrinks, 5h shrinks with it, and
    what is left is 20.

    Now the same move on real measurements, where it breaks. A made-up person weighs themselves each
    morning for fifteen days.

    ```table
    day  weight (kg)
    0    80.3
    1    79.8
    2    80.1
    3    79.6
    4    80.2
    5    79.5
    6    79.9
    7    79.4
    8    79.9
    9    79.2
    10   79.6
    11   79.5
    12   79.0
    13   79.6
    14   79.8
    ```

    Shrink the interval to one day, as you did for S. Take the last two days, then the pair one
    day earlier.

    ```working
        79.8 minus 79.6 = 0.2, over 1 day: 0.2 kg a day
        79.6 minus 79.0 = 0.6, over 1 day: 0.6 kg a day
    ```

    Rising at 0.6 kg a day. Test that against the body. Hall (2008) gives body fat 39.5
    megajoules (MJ) a kilogram. A joint report of the Food and Agriculture Organization, the
    World Health Organization and the United Nations University (FAO/WHO/UNU) has a worked
    example. It puts the daily expenditure of an average lightly active woman of 30 to 50 at
    8.26 MJ.

    ```working
        0.6 times 39.5 = 23.7
        23.7 divided by 8.26 = 2.87
    ```

    Adding 0.6 kg of fat in a day would take 23.7 MJ more than was spent. That is nearly three
    whole days of that expenditure. The one-day rate is measuring swings, not stores.

    So with weighings, widen the interval instead. Average the first five days and the last
    five. Each average is placed at its middle day, the centre of the five days it covers. An
    average of neighbouring weighings, worked out again at each step along the series, is called
    a moving average.

    ```working
        80.3 plus 79.8 plus 80.1 plus 79.6 plus 80.2 = 400.0
        400.0 divided by 5 = 80.0, the average weight at day 2
        79.6 plus 79.5 plus 79.0 plus 79.6 plus 79.8 = 397.5
        397.5 divided by 5 = 79.5, the average weight at day 12
        79.5 minus 80.0 = -0.5
        -0.5 divided by 10 = -0.05
    ```

    Falling at about 0.05 kg a day over those ten days. Even this is still an average over an
    interval.

    This section has now used three kinds of rate.

    ```table
    | name | what it is | where it appears here |
    | derivative | the number the averages close in on as h shrinks towards zero | S(t) = 5 t^2 at t = 2: 20 |
    | finite difference | the change over a set interval, divided by its length | the note's 25; the one-day 0.6 kg a day |
    | slope from noisy measurements | the change between averages of several readings, divided by the time between them | the five-day averages: -0.05 kg a day; Polidori's moving averages, in the exercise |
    ```
  analogy_breaks_when: |
    Below the interval over which water swings, a shorter interval gives a worse rate, not a
    better one. No source in this book gives that interval. Look for it in the Methods of the
    paper in front of you.

    The fifteen weights are made up.
