      T = 52 was the number of days between measurements
must_know:
- point: |
    Before you call a rate "the rate now", ask how long the interval was.
  kind: move
  bearing: methodological
- point: |
    A rate of weight change taken from two weighings a day apart can be mostly water, not stored
    energy. This book's rule of thumb: take a rate from averages over weeks, not from
    neighbouring readings.
  kind: trap
  bearing: clinical
- point: |
    A shorter interval is better only for a smooth curve.
  kind: boundary
  bearing: methodological
- point: |
    Never set h to zero to get the derivative. Let h shrink and watch where the answers go.
  kind: misconception
  bearing: teaching
- point: |
    Read dW/dt as a rate with a unit, kilograms per day, and read its sign first. It says
    nothing about how much has been lost so far.
  kind: move
  bearing: clinical
- point: |
    When a trial reports a rate of weight change, look in the Methods for the interval and the
    averaging used.
  kind: move
  bearing: methodological
  refs: [polidori_2016]
exercises:
- type: interpretation
  prompt: |
    Polidori and colleagues (2016) describe how they got one of their inputs. Here is their
    sentence.

    > the moving average of the measured body weight time course was used to calculate the rate
    > of change of body weight over each interval

    They call that rate dBWi/dt.

    Their weighings were 52 days apart.

    Say what dBWi/dt denotes and what unit it carries. Then say why a rate taken over 52 days is
    safer than one taken from two weighings a day apart would be, and what it gives up.
  answer: |
    dBWi/dt, said "dee B W sub i by dee t", is the rate of change of body weight over interval i.
    Weight is in kilograms and time in days, so it is in kilograms a day. A negative value means
    weight was falling over that interval.

    Why not a day apart. Weight moves from day to day with body water, which Hall and colleagues
    (2012) call "variable", and, most likely, with food in the gut. In this section's made-up
    weighings, one day's swing was larger than the whole trend. A rate from two weighings a day
    apart could mostly measure the swings. Over 52 days the trend adds up and a day's swing does
    not, so the swing is small beside the trend.

    What it gives up. The rate is an average over each interval. It cannot show a change that
    happens inside the interval, such as weight falling fast for two weeks and then stopping. In
    this book's terms it is the slope of a chord across the interval, not a tangent at a point.
  skill_ref: S02-R1-K01
quantitative: true
practice:
- level: 1
  prompt: |
    A function has f(4) = 30 and f(4.5) = 33.5.

    Work out the average rate of change of f from 4 to 4.5.
  answer: |
    The change in f, divided by the change in the input.

    ```working
        33.5 minus 30 = 3.5
        4.5 minus 4 = 0.5
        3.5 divided by 0.5 = 7
    ```

    The average rate is 7.
- level: 2
  prompt: |
    Take f(t) = t^2, which is t times t, and the input t = 3.

    Work out the average rate from t = 3 to t = 3 + h for h = 1, 0.1 and 0.01. Do the same for
    h = -0.1 and h = -0.01. Then give the derivative at t = 3.
  answer: |
    f(3) = 9. For each h, work out f(3 + h), subtract 9, and divide by h.

    ```working
        h = 1: 4 times 4 = 16, 16 minus 9 = 7, 7 divided by 1 = 7
        h = 0.1: 3.1 times 3.1 = 9.61, 9.61 minus 9 = 0.61, 0.61 divided by 0.1 = 6.1
        h = 0.01: 3.01 times 3.01 = 9.0601, 9.0601 minus 9 = 0.0601, 0.0601 divided by 0.01 = 6.01
        h = -0.1: 2.9 times 2.9 = 8.41, 8.41 minus 9 = -0.59, -0.59 divided by -0.1 = 5.9
        h = -0.01: 2.99 times 2.99 = 8.9401, 8.9401 minus 9 = -0.0599, -0.0599 divided by -0.01 = 5.99
    ```

    From above: 7, 6.1, 6.01. From below: 5.9, 5.99. Both close in on 6.

    The derivative at t = 3 is very likely 6. The algebra in problem 9 gives exactly 6:
    f′(3) = 6.
- level: 2
  prompt: |
    Say each of these aloud in words, and give its unit.

    ```working
        dW/dt, where W is body weight in kg and t is time in days
        f′(10) = -3, where f is in kcal a day and its input is body weight in kg
    ```
  answer: |
    The first is "dee W by dee t": the rate of change of W with respect to t. Kilograms divided
    by days, so kilograms per day.

    The second is "f prime of 10 equals minus 3". The rate of change of f with respect to body
    weight, at a weight of 10 kg, is minus 3. Its unit is kcal a day divided by kg: kcal a day per
    kg. The minus sign says f falls as weight rises, at that weight.

    The second rate is not against time. A derivative can be taken with respect to any input,
    and its unit is always the output's unit divided by the input's.
- level: 3
  prompt: |
    Take f(t) = 3 t^2 and the input t = 1.

    Write out f(1 + h) minus f(1), divided by h, using algebra. Then find the derivative at
    t = 1.
  answer: |
    Multiply out the bracket first.

    ```working
        (1 + h) times (1 + h) = 1 times (1 + h) + h times (1 + h)
        = 1 + h + h + h^2
        = 1 + 2h + h^2
    ```

    Then multiply by 3, and subtract f(1), which is 3.

    ```working
        f(1 + h) = 3 + 6h + 3 h^2
        f(1 + h) minus f(1) = 6h + 3 h^2
        (6h + 3 h^2) divided by h = 6 + 3h
    ```

    As h shrinks, 3h shrinks to nothing and 6 is left. The derivative at t = 1 is 6.
- level: 3
  prompt: |
    Here are four values of a derivative. For each, say whether the function is rising, falling
    or neither at that input.

    ```working
        f′(0) = 4
        f′(2) = 0
        f′(5) = -0.3
        f′(7) = -12
    ```
  answer: |
    Read the sign.

    At 0, positive, so rising. At 2, zero, so neither rising nor falling at that instant. At 5,
    negative, so falling. At 7, negative, so falling, and faster than at 5, because 12 is larger
    than 0.3.

    The sign gives the direction and the size gives the speed. Neither says where the function
    is, only which way it is heading.
- level: 4
  prompt: |
    In the trial reported by Polidori and colleagues (2016), weighings were 52 days apart. Take a
    made-up participant who weighs 94.6 kg at one weighing and 92.0 kg at the next.

    Work out the average rate of weight change over the interval, with its unit. Then give it in
    kilograms a week.
  answer: |
    Change divided by time, keeping the order.

    ```working
        92.0 minus 94.6 = -2.6
        -2.6 divided by 52 = -0.05
    ```

    Minus 0.05 kg a day. Weight fell.

    A week is 7 days.

    ```working
        -0.05 times 7 = -0.35
    ```

    Minus 0.35 kg a week. Both are averages over the 52 days, not the rate on any one day.
  refs:
  - polidori_2016
- level: 5
  prompt: |
    The FAO/WHO/UNU report (2004) puts the daily expenditure of an average lightly active woman
    of 30 to 50 at 8.26 MJ. Take a made-up woman with that expenditure, on a day when her
    metabolizable intake is 7.80 MJ.

    Work out dES/dt, the rate of change of her energy stores, in MJ a day and then in kcal a day.
    Use 1 kcal = 4.184 kJ. Say what the sign means.
  answer: |
    The rate of change of stores is intake minus expenditure.

    ```working
        7.80 minus 8.26 = -0.46
    ```

    Minus 0.46 MJ a day. Now kilocalories. A megajoule is 1,000 kilojoules.

    ```working
        0.46 times 1,000 = 460
        460 divided by 4.184 = 109.94
    ```

    About minus 110 kcal a day. The minus sign says her stores were falling that day.
  refs:
  - fao_who_unu_2004
- level: 6
  prompt: |
    A patient weighs 92.0 kg today. Their weight is falling at 0.05 kg a day. Both figures are
    made up.

    Estimate their weight 10 days from now, using the rate. Then do the same for 300 days from
    now, and say which of the two estimates you would trust less, and why.
  answer: |
    New value is old value plus rate times time, the move from `B0-R0-C22`. The rate is negative.

    ```working
        -0.05 times 10 = -0.5
        92.0 plus -0.5 = 91.5
    ```

    About 91.5 kg in 10 days.

    ```working
        -0.05 times 300 = -15
        92.0 plus -15 = 77
    ```

    About 77 kg in 300 days.

    Trust the 300-day figure much less. The estimate holds the rate fixed. Over 10 days that is
    close to true. Over 300 days it is not, because the rate itself changes.

    Hall and colleagues
    (2012) state that "weight change will slow over time due to passive compensatory changes in
    energy expenditure". As weight falls, expenditure falls with it. A slower rate means less than
    15 kg lost. The rate at an instant is a
    good guide only for a short step ahead.
  refs:
  - hall_2012_ajcn
- level: 7
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
        f(t) = t^2, find the derivative at t = 3
        f(3 + h) = (3 + h) times (3 + h) = 9 + h^2
        f(3 + h) minus f(3) = h^2
        h^2 divided by h = h
        as h shrinks, h shrinks to 0
        so the derivative at t = 3 is 0, and f is not changing there
    ```
  answer: |
    The second step broke. (3 + h) times (3 + h) is not 9 + h^2. Each term in the first bracket
    multiplies each term in the second.

    ```working
        (3 + h) times (3 + h) = 3 times (3 + h) + h times (3 + h)
        = 9 + 3h + 3h + h^2
        = 9 + 6h + h^2
    ```

    Then the rest follows.

    ```working
        f(3 + h) minus f(3) = 6h + h^2
        (6h + h^2) divided by h = 6 + h
    ```

    As h shrinks, 6 is left. The derivative at t = 3 is 6, not 0.

    A quick check would have caught it. Take h = 0.1 in the table way: 3.1 times 3.1 is 9.61, so
    the average is 6.1, nowhere near 0.1.

    Why the wrong answer looks reasonable. Squaring each part of a sum looks natural, and every
    line after the second is correct algebra. The last line even sounds like a real finding.
- level: 8
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
        a patient weighed 79.0 kg on Monday morning and 79.6 kg on Tuesday morning
        the rate of weight change is 79.6 minus 79.0, over 1 day, = 0.6 kg a day
        a shorter interval gives a closer rate, so this is close to the rate at an instant
        so the patient is gaining 0.6 kg of body fat a day
    ```
  answer: |
    Two steps broke, the third and the fourth.

    The third takes a rule that holds for a smooth curve and applies it to two weighings. Weight
    on a scale swings from day to day with water and, most likely, gut contents. A one-day
    interval sits inside those swings, so the rate it gives can be mostly swing.

    The fourth turns a change in weight into a change in fat. Hall and colleagues (2012) warn
    that "weight change may not directly represent energy imbalances, particularly over the short
    term". Check the size.

    ```working
        0.6 times 39.5 = 23.7
    ```

    Adding 0.6 kg of fat would take 23.7 MJ of stored energy in one day. That is nearly three
    days of the 8.26 MJ a day the FAO/WHO/UNU report gives for an average lightly active woman
    of 30 to 50.

    What to do instead: take the rate from averages of several weighings, over weeks.

    Why the wrong answer looks reasonable. The subtraction and the unit are right, and "a
    shorter interval is closer" is a rule this section taught. It was used where it does not
    hold.
  refs:
  - hall_2012_ajcn
  - hall_2008_ijo
  - fao_who_unu_2004
- level: 9
  prompt: |
    A newspaper report says this about a new diet.

    > In the first week, people on the diet lost 2 kg. Kept up, that is over 100 kg in a year.

    The report and its 2 kg are made up for this problem. Decide what to compute, compute it, and
    say what your answer does not establish.
  answer: |
    What to compute: the average rate over the first week, and the year's total at that rate.

    ```working
        2 divided by 7 is about 0.2857
        0.2857 times 365 = 104.3
    ```

    About 0.29 kg a day, and about 104 kg a year at that rate. The report's arithmetic is right.

    What it does not establish. The 2 kg is an average over one week, and it says nothing about
    the rate now. It is also the wrong week to project from. Hall (2008) notes that glycogen's
    "effects on weight loss typically occur within the first week". Glycogen is held in the body
    with water. So part of the first week's loss is glycogen and its water, which will not keep
    coming off week after week.

    Hall and colleagues (2012) add that "weight change will slow over time". So the first-week
    rate overstates every later week. The year's total cannot be found by multiplying one week's
    average. It needs the rate at each point along the way.
  refs:
  - hall_2008_ijo
  - hall_2012_ajcn
- level: 10
  prompt: |
    A clinic note reads as follows.

    > Weighed 76.2 kg yesterday and 76.2 kg today. dW/dt = 0. Her weight has stopped changing, so
    > her intake now matches her expenditure.

    The weights are made up for this problem. Decide what to compute, compute it, and say what
    your answer does not establish.
  answer: |
    What to compute: the average rate over the one day between the two weighings.

    ```working
        76.2 minus 76.2 = 0
        0 divided by 1 = 0
    ```

    Zero kg a day, over that one day. The arithmetic is right.

    What it does not establish. First, it is not dW/dt. It is an average over one day, and one
    day sits inside the normal swings of body water. Two equal readings can come from a falling
    trend with a small swing up on the second day.

    Second, even a true zero for weight would not mean zero for stores. Hall and colleagues (2012)
    point out that weight change "may not directly represent energy imbalances, particularly over
    the short term". A zero dW/dt and a zero dES/dt are different claims.

    Third, a zero rate at one instant is not a steady weight. The rate may be passing through
    zero on its way from falling to rising.

    What to write instead. Record both weights. Ask for weighings over several weeks, and take
    the rate from averages over that time.
  refs:
  - hall_2012_ajcn
retrieval_items:
- q: How do you work out the derivative of f at a without a ruler?
  a: Take the average rate f(a + h) minus f(a), divided by h, for h closer and closer to zero,
    above it and below it. If both lists close in on one number, that is the derivative, f′(a).
- q: Why is h never set to zero?
  a: The average divides by h, and dividing by zero is not allowed. The derivative is the number
    the averages close in on as h shrinks, not the average at h = 0.
- q: What unit does dW/dt carry, with W in kg and t in days, and what does its sign say?
  a: Kilograms per day. Positive means weight is rising at that instant, negative falling, zero
    neither.
- q: Why is a rate from two weighings a day apart not a good estimate of dW/dt?
  a: Day-to-day swings in body water can be larger than the trend. A rate from
    averages over weeks is better. The derivative belongs to a smooth curve, not to noisy points.
