  caption: "S(t) = 5 t^2 near t = 2. The note's 25 is the slope of the chord from t = 2 to t = 3, an average over a whole unit of time. The tangent at t = 2 has slope 20, the rate at that instant, and the curve bends away above it."
  alt: "A rising, steepening curve from 5 at t = 1 to 45 at t = 3, with points at 20 when t = 2 and 45 when t = 3. A steeper straight line joins the two points; a shallower straight line touches the curve at t = 2."
