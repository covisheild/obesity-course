simplified_explanation: |
  Book 0 built powers and logarithms on ten (`B0-R0-C06` and `B0-R0-C07`). Papers on body weight use
  a different base, a number written e.

  Take a base, say 2, and ask how steep the curve 2^(t) is where it starts, at t = 0. Take a very
  short step, 0.0001, and divide the change by the step.

  ```working
  2^0.0001 = 1.0000693
  (1.0000693 minus 1) divided by 0.0001 = 0.693
  ```

  The curve 2^(t) starts with a slope of 0.693. Do the same with 3 and you get 1.099. So somewhere
  between 2 and 3 is a base whose curve starts with a slope of exactly 1. That base is e, and it
  is 2.71828 to five decimal places. Your calculator has a key for it, usually marked e^(x).

  Take y = e^(kt), where k is a fixed number, and find its rate at any time t. Step forward a short
  time h. Multiplying two powers of the same base adds their exponents (`B0-R0-C06`), so read that
  rule backwards.

  ```working
  e^(kt plus kh) = e^(kt) times e^(kh)
  the change = e^(kt) times e^(kh) minus e^(kt)
  the change = e^(kt) times (e^(kh) minus 1)
  the change divided by h = e^(kt) times (e^(kh) minus 1) divided by h
  ```

  As h shrinks, (e^(kh) minus 1) divided by h settles on k. Call kh by one letter, u. Then (e^(kh)
  minus 1) divided by h is k times (e^(u) minus 1) divided by u. And (e^(u) minus 1) divided by u,
  for u close to zero, is the slope of e^(t) at the start, which is 1.

  So the rate of e^(kt) is k times e^(kt). Put a constant A in front, and by the constant-multiple
  rule (`S02-R1-C03`) the rate of A e^(kt) is k times A e^(kt).

  The rate is k times the amount itself. The number k is the rate constant, the rate divided by the
  amount. Its unit is the rate's unit divided by the amount's: (kilograms a day) divided by
  kilograms is per day. For a quantity that shrinks, written A e^(-kt) with k above zero, the rate
  is -k times the amount, so the rate divided by the amount is -k.

  A logarithm undoes a power. The natural logarithm, written ln, undoes a power of e. So ln(e^3) =
  3, ln e = 1 and ln 1 = 0.

  It turns multiplication into addition, for the same reason log10 does.

  ```working
  ln(ab) = ln a plus ln b
  ln 2 plus ln(1/2) = ln 1 = 0, so ln(1/2) = -ln 2
  ```

  Now a quantity that shrinks, y = A e^(-kt), with k above zero. When has it fallen to half? Set
  the curve equal to half its start, and divide both sides by A.

  ```working
  A e^(-kt) = A divided by 2
  e^(-kt) = 1/2
  ```

  Both sides are the same number, so their natural logarithms are the same number.

  ```working
  -kt = ln(1/2) = -ln 2
  t = ln 2 divided by k
  ```

  That time is the half-time. It does not depend on A, so the quantity halves in the same time
  from any starting point. Put one twentieth in place of one half and the same steps work. They
  give the time to fall to 5% of the start, which is 95% of the way to zero.
illustration:
  body: |
    Here is a claim you will meet, and a test it fails.

    Hall and colleagues modelled a man weighing 100 kilograms who cuts his intake by 2 megajoules a day
    and keeps it cut (*Lancet* 2011). Their model has his weight level off at about 75 kilograms. It
    takes "roughly 1 year to reach half of the maximum weight loss", and reaches "95% of this value
    after about 3 years".

    The tempting reading is that the weight closes its gap as one exponential with a half-time of
    one year. Test it. Start from the half-time and work out k.

    ```working
    0.693 divided by 1 = 0.693
    ```

    So k is 0.693 per year. Now the time to 95%.

    ```working
    2.996 divided by 0.693 = 4.32
    ```

    About 4.3 years, not 3.

    Start from 95% at 3 years and work out k, then the half-time.

    ```working
    2.996 divided by 3 = 0.999
    0.693 divided by 0.999 = 0.694
    ```

    A half-time of 0.694 years, about 8 months, not 1 year.

    Now put the two curves side by side. The change so far, divided by the whole change W0 minus L,
    is the share reached.

    ```working
    W0 minus W = (W0 minus L) times (1 minus e^(-kt))
    (W0 minus W) divided by (W0 minus L) = 1 minus e^(-kt)
    ```

    So the share of the eventual change reached by time t is 1 minus e^(-kt). Work each row out on
    your calculator, times 100 for a percentage.

    ```table
    | years | half-time 1 year (k = 0.693) | 95% at 3 years (k = 0.999) | the paper's rounded figures |
    | 0 | 0.0 | 0.0 | |
    | 1 | 50.0 | 63.2 | about 50 |
    | 2 | 75.0 | 86.4 | |
    | 3 | 87.5 | 95.0 | about 95 |
    | 4 | 93.7 | 98.2 | |
    | 5 | 96.9 | 99.3 | |
    ```

    Neither column passes through both figures. One exponential cannot give both, because for one
    exponential the time to 95% is always 4.32 half-times. The paper's figures give 3 divided by
    1, which is 3.

    Book 0 gave you a test for a shape that flattens against a ceiling (`B0-R0-C20`). Take values at
    equal steps, subtract each from the next, then divide each difference by the one before. A ratio
    that holds steady below one means a ceiling you can work out.

    Take the first column of the table above, the curve with a one-year half-time. Read it once a
    year: 0.0, 50.0, 75.0, 87.5. Subtract each from the next.

    ```working
    50.0 minus 0.0 = 50.0
    75.0 minus 50.0 = 25.0
    87.5 minus 75.0 = 12.5
    ```

    Now divide each difference by the one before.

    ```working
    25.0 divided by 50.0 = 0.5
    12.5 divided by 25.0 = 0.5
    ```

    A steady ratio of 0.5.

    The ratio is what the gap to the ceiling, and each year's gain, is multiplied by over one
    step, so it is e^(-k) for a step of one year.
    Take ln of both sides to get k back.

    ```working
    e^(-k) = 0.5
    -k = ln 0.5 = -0.693
    k = 0.693 per year
    ```

    That is the k you started from. Divide minus ln of the ratio by the length of the step.
  analogy_breaks_when: |
    Both columns are what one exponential would give. Neither is the model's own curve, which the
    paper does not print as a formula. Nothing here says a real person follows either column.

    Rounded or noisy readings make the ratios wobble, and one wobbling ratio is not evidence of any
    shape.
  numbers:
  - value: '100'
    unit: "kg, the modelled man's starting weight"
    citekey: hall_2011_lancet
    quote: |-
      Figure 2A shows the predicted bodyweight time course of a 100 kg (220 lb) sedentary man following a step reduction of energy intake by 2 MJ per day (480 kcal per day).
    as_of: '2026-09-24'
