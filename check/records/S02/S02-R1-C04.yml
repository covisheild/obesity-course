definition:
  text: |
    The number e is the base of the one exponential curve, e^(t), whose slope where it crosses the
    vertical axis, at t = 0, is exactly 1. To five decimal places e = 2.71828.

    The natural logarithm of a positive number x, written ln x, is the power to which e must be
    raised to give x. It is defined only for numbers above zero, and ln 1 = 0.

    For constants A and k, the function y = A e^(kt) has derivative dy/dt = k A e^(kt), which is k
    times y.

    Where the quantity shrinks, write y = A e^(-kt) with k above zero. The time it takes to fall to
    half of any starting value is the half-time, ln 2 divided by k, which is about 0.693 divided by
    k. The time to fall to one twentieth, 5% of the start, is ln 20 divided by k, about 3.00
    divided by k.

    A quantity W that approaches a level L in this way follows W = L plus (W0 minus L) times
    e^(-kt), where W0 is its value at t = 0. The gap W minus L is the shrinking exponential. Its
    rate of change is dW/dt = -k times (W minus L).
