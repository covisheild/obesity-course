      This constant diet perturbation was predicted to result in a bodyweight plateau at about 75 kg (165 lb) over a 10-year simulation taking roughly 1 year to reach half of the maximum weight loss and reaching 95% of this value after about 3 years.
    derived: "100 kg starting weight minus the 75 kg plateau, both from the same paragraph"
    as_of: '2026-09-24'
must_know:
- point: |
    For any single exponential, the time to 95% of the way is 4.32 half-times, because ln 20
    divided by ln 2 is 4.32. Hall's "about 1 year" and "about 3 years" are in another ratio. Do
    not fill in the months between with an exponential you chose yourself.
  kind: boundary
  bearing: methodological
  refs: [hall_2011_lancet]
- point: |
    Use ln, not log10, in a half-time. The calculator key marked log is log10, and log10 2 divided
    by k gives 0.301 divided by k, less than half the right answer. The rate constant k was defined
    with e, so only ln undoes it.
  kind: trap
  bearing: methodological
- point: |
    Write the unit beside k every time. A k of 0.693 per year used with t in days gives an answer
    365 times too fast.
  kind: trap
  bearing: methodological
- point: |
    To test whether a claimed curve is exponential, divide its rate by its value, or, for a curve
    levelling off at L, by its gap to L, at two or more times. With readings at equal steps, divide each difference by the one before; the ratio
    must hold steady.
  kind: move
  bearing: methodological
- point: |
    A gap that closes exponentially closes fastest at the start and slowest at the end. When a
    claim calls weight loss "exponential", ask whether it means growth or a closing gap, and for
    its k with a unit.
  kind: misconception
  bearing: public
- point: |
    A patient may ask how long a change in intake takes to show in full. Give the model's figures
    as rough figures. Roughly a year to half, and about three years to most of it, for the model's
    average adult (Hall 2011). Do not give month-by-month figures from one exponential.
  kind: consequence
  bearing: clinical
  refs: [hall_2011_lancet]
exercises:
- type: calculation
  prompt: |
    A quantity falls as y = A e^(-kt), with k above zero. Derive the time at which it has fallen
    to 5% of its starting value. Write the move you make beside every line, as a word or two: for
    example "divide both sides by A". Then say why the answer does not depend on A.
  answer: |
    Set the curve equal to one twentieth of its start. That is 5%, since 5 divided by 100 is 1/20.

    ```working
    A e^(-kt) = A divided by 20        (the condition)
    e^(-kt) = 1/20                     (divide both sides by A)
    -kt = ln(1/20)                     (take ln of both sides)
    -kt = -ln 20                       (ln of one over a number is minus its ln)
    t = ln 20 divided by k             (divide both sides by -k)
    ```

    Then put the number in.

    ```working
    ln 20 = 2.996
    ```

    So t is about 3.00 divided by k.

    A cancels in the second line. The curve takes the same time to fall to a twentieth of any
    starting value, large or small. That is the property that makes one number, a half-time or a
    95% time, enough to describe the whole curve. It is also why the number stops meaning
    anything when the curve is not one exponential.
  skill_ref: S02-R1-K02
quantitative: true
practice:
- level: 1
  prompt: |
    Use the e^(x) and ln keys of your calculator. Work out each of these to three decimal places:
    e^1, e^2, e^(-1), ln 1, ln 10 and ln(e^3).
  answer: |
    Key each one in.

    ```working
    e^1 = 2.718
    e^2 = 7.389
    e^(-1) = 0.368
    ln 1 = 0
    ln 10 = 2.303
    ln(e^3) = 3
    ```

    Two of these need no calculator. The ln of 1 is 0, because e^0 is 1. The ln of e^3 is 3,
    because ln undoes a power of e. Notice that e^(-1) is a positive number below one. A minus
    sign in an exponent makes a number small, not negative.
- level: 1
  prompt: |
    Show with numbers that ln 20 equals ln 4 plus ln 5. Then show that ln(1/2) equals minus ln 2.
    Work to three decimal places.
  answer: |
    First the two parts.

    ```working
    ln 4 = 1.386
    ln 5 = 1.609
    1.386 plus 1.609 = 2.995
    ln 20 = 2.996
    ```

    The two agree to the last place, where rounding each part moved the sum by 0.001.

    Now the half.

    ```working
    ln 0.5 = -0.693
    ln 2 = 0.693
    ```

    Equal size, opposite sign. The reason is that 2 times 1/2 is 1, and ln 1 is 0, so the two
    logarithms must add to zero.
- level: 2
  prompt: |
    A quantity follows y = 40 e^(0.05t). Work out its rate of change, dy/dt. Then work out y, dy/dt
    and dy/dt divided by y at t = 0 and at t = 10.
  answer: |
    The rate of A e^(kt) is k times A e^(kt). Here A is 40 and k is 0.05.

    ```working
    0.05 times 40 = 2
    ```

    So dy/dt = 2 e^(0.05t).

    At t = 0, e^0 is 1.

    ```working
    y = 40
    dy/dt = 2
    2 divided by 40 = 0.05
    ```

    At t = 10, the exponent is 0.05 times 10, which is 0.5.

    ```working
    e^0.5 = 1.6487
    y = 40 times 1.6487 = 65.95
    dy/dt = 2 times 1.6487 = 3.297
    3.297 divided by 65.95 = 0.05
    ```

    The rate grew from 2 to about 3.3, but the rate divided by the amount stayed at 0.05. That
    steady ratio is k, and it is what makes the curve exponential.
- level: 2
  prompt: |
    A quantity follows y = 200 e^(-0.1t). Work out its half-time and the time it takes to fall to
    5% of its starting value. Then work out y at each of those two times.
  answer: |
    The half-time is ln 2 divided by k, with k = 0.1.

    ```working
    0.693 divided by 0.1 = 6.93
    ```

    The time to 5% is ln 20 divided by k.

    ```working
    2.996 divided by 0.1 = 29.96
    ```

    Now y at each time. At the half-time y is half of 200, which is 100. At the 5% time it is one
    twentieth of 200.

    ```working
    200 divided by 2 = 100
    200 divided by 20 = 10
    ```

    Check the second on the calculator: 0.1 times 29.96 is 2.996, and e^(-2.996) is 0.0500. So y
    is 200 times 0.0500, which is 10. The half-time is 6.93 and the 5% time is 29.96, in whatever
    unit t was measured in.
- level: 3
  prompt: |
    A quantity falls exponentially with a half-time of 14 days. Work out its rate constant k. Then
    work out the share of the starting value left after 28 days, and after 10.
  answer: |
    Turn the half-time formula round: k is ln 2 divided by the half-time.

    ```working
    0.693 divided by 14 = 0.0495
    ```

    So k is 0.0495 per day.

    After 28 days, two half-times have passed, so a half of a half is left, one quarter. Check it with
    the formula.

    ```working
    0.0495 times 28 = 1.386
    e^(-1.386) = 0.250
    ```

    A quarter, 0.250.

    After 10 days, less than one half-time has passed, so more than half is left.

    ```working
    0.0495 times 10 = 0.495
    e^(-0.495) = 0.610
    ```

    About 0.610, or 61% of the start.
- level: 3
  prompt: |
    Solve 100 e^(-0.2t) = 30 for t.
  answer: |
    Divide both sides by 100.

    ```working
    e^(-0.2t) = 0.3
    ```

    Take ln of both sides.

    ```working
    -0.2t = ln 0.3 = -1.204
    ```

    Divide both sides by -0.2.

    ```working
    1.204 divided by 0.2 = 6.02
    ```

    So t = 6.02. Check: e^(-0.2 times 6.02) is e^(-1.204), which is 0.300, and 100 times 0.300 is
    30.
- level: 4
  prompt: |
    A quantity is read at equal steps of 2 units of time: 60, 70, 75, 77.5. Find the level it is
    approaching, its rate constant k, and its half-time.
  answer: |
    Subtract each reading from the next.

    ```working
    70 minus 60 = 10
    75 minus 70 = 5
    77.5 minus 75 = 2.5
    ```

    Divide each difference by the one before.

    ```working
    5 divided by 10 = 0.5
    2.5 divided by 5 = 0.5
    ```

    A steady ratio of 0.5, so a ceiling can be worked out (`B0-R0-C20`). The next difference is
    2.5 times 0.5, and the gap left is that divided by one minus the ratio.

    ```working
    2.5 times 0.5 = 1.25
    1.25 divided by (1 minus 0.5) = 2.5
    77.5 plus 2.5 = 80
    ```

    The level is 80. The gap to 80 runs 20, 10, 5, 2.5: it halves every step. So the half-time is
    one step, 2 units of time. The rate constant follows.

    ```working
    0.693 divided by 2 = 0.3465
    ```

    k is about 0.347 per unit of time. The same comes from the ratio: minus ln 0.5 is 0.693, and
    0.693 divided by a step of 2 is 0.3465.
- level: 4
  prompt: |
    Hall and colleagues (*Lancet* 2011) give a rule of thumb for an average adult with overweight. It
    reads: "every change of energy intake of 100 kJ per day will lead to an eventual bodyweight
    change of about 1 kg". Half of that change comes "in about 1 year".

    A person cuts intake by 500 kJ a day and holds it. Work out the eventual change the rule of
    thumb gives. Then suppose the change comes as one exponential with a half-time of exactly 1
    year. Work out how much of it would have come by 6 months and by 2 years. Say which of your
    figures are the paper's.
  answer: |
    Eventual change: 1 kilogram for every 100 kilojoules a day.

    ```working
    500 divided by 100 = 5
    ```

    About 5 kilograms, eventually.

    Now the supposed exponential. A half-time of 1 year gives k = 0.693 per year. Six months is
    0.5 years.

    ```working
    0.693 times 0.5 = 0.3465
    e^(-0.3465) = 0.7072
    1 minus 0.7072 = 0.2928
    5 times 0.2928 = 1.46
    ```

    About 1.46 kilograms by 6 months. Two years is two half-times, so three quarters of the way.

    ```working
    5 times 0.75 = 3.75
    ```

    About 3.75 kilograms by 2 years.

    Whose figures are these? The 100 kJ a day per kilogram and the one-year half are the paper's,
    both rounded. The 500 kJ is yours. The exponential is your assumption, so 1.46 and 3.75 are
    yours too. The paper does not say its curve is one exponential.
  refs: [hall_2011_lancet]
- level: 5
  prompt: |
    Hall and colleagues' modelled man starts at 100 kilograms and levels off at about 75 kilograms
    (*Lancet* 2011). Suppose his weight closes the gap as one exponential that is 95% of the way
    there at 3 years. Work out his weight at 1 year. Then work it out again for an exponential with
    a half-time of 1 year, and give the difference.
  answer: |
    The gap at the start is 100 minus 75, which is 25 kilograms.

    First exponential: 95% at 3 years, so k is ln 20 divided by 3.

    ```working
    2.996 divided by 3 = 0.999
    e^(-0.999) = 0.368
    25 times 0.368 = 9.2
    75 plus 9.2 = 84.2
    ```

    About 84.2 kilograms at one year.

    Second exponential: a half-time of 1 year, so after 1 year half the gap is left.

    ```working
    25 divided by 2 = 12.5
    75 plus 12.5 = 87.5
    87.5 minus 84.2 = 3.3
    ```

    About 87.5 kilograms, 3.3 kilograms higher. Both curves match one of the paper's rounded
    figures. They disagree at one year by more than 3 kilograms, which is why neither should be
    quoted as the model's prediction.
  refs: [hall_2011_lancet]
- level: 6
  prompt: |
    Take the same man, with a gap of 25 kilograms, and suppose it closes as one exponential with a
    half-time of 1 year. Work out the rate of change of his weight at the very start, in kilograms
    a year and in grams a day. Then compare it with his average rate over the first year.
  answer: |
    The rate of a closing gap is minus k times the gap. Here k is 0.693 per year and the gap is 25
    kilograms.

    ```working
    0.693 times 25 = 17.325
    ```

    At the start the weight falls at about 17.3 kilograms a year. Turn that into a daily rate.

    ```working
    17.325 divided by 365 = 0.0475
    ```

    About 0.0475 kilograms a day, or 47.5 grams a day.

    Over the first year, half the gap closes, which is 12.5 kilograms. So the average rate over
    that year is 12.5 kilograms a year.

    The rate at the start, 17.3, is well above the first-year average, 12.5. An exponential closes
    fastest at the start. So a first-year average is not the rate in the first weeks. And a rate
    from the first weeks is not the rate for the year.
  refs: [hall_2011_lancet]
- level: 7
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
    a quantity falls exponentially with k = 0.1 per day
    half-time = log10 2 divided by k
    log10 2 = 0.301
    0.301 divided by 0.1 = 3.01
    so it halves every 3.01 days
    ```
  answer: |
    The second line broke. The half-time is ln 2 divided by k, with the natural logarithm, not
    log10 2.

    ```working
    0.693 divided by 0.1 = 6.93
    ```

    It halves every 6.93 days, more than twice as long as the worked answer says.

    The half-time comes from solving e^(-kt) = 1/2. Only ln undoes a power of e, because k was
    defined with e as the base. Using log10 answers a different question: when does 10^(-kt)
    reach one half?

    Why the wrong answer looks reasonable: the calculator key marked log is log10, and it is the
    logarithm Book 0 taught. The arithmetic after the second line is right. Check any half-time
    by putting it back: e^(-0.1 times 3.01) is 0.74, not 0.5.
- level: 7
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
    a change reaches its eventual size with k = 0.693 per year
    95% of the way means e^(-kt) = 0.95
    -kt = ln 0.95 = -0.0513
    t = 0.0513 divided by 0.693 = 0.074
    so 95% of the change comes in 0.074 years, about 27 days
    ```
  answer: |
    The second line broke. The share still to come is e^(-kt), not the share already reached. At
    95% of the way, 5% is still to come.

    ```working
    e^(-kt) = 0.05
    -kt = ln 0.05 = -2.996
    t = 2.996 divided by 0.693 = 4.32
    ```

    About 4.3 years, not 27 days.

    The worked answer found the time for the first 5% of the change. That is a real number, but
    not the one asked for.

    Why it looks reasonable: 0.95 is the number in the question, so it goes straight into the
    equation. The check that catches it: 27 days is far less than one half-time, which here is
    one year, and 95% cannot come before 50% does.
- level: 8
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
    y = 40 e^(0.05t)
    by the power rule, bring the power down and take one off it
    dy/dt = 40 times 0.05t times e^(0.05t minus 1)
    at t = 0, dy/dt = 0
    so the curve is flat where it starts
    ```
  answer: |
    The second line broke. The power rule (`S02-R1-C03`) is for t raised to a fixed power, where
    the variable is in the base. Here the variable is in the exponent, and the base is the fixed
    number e. That is a different kind of function with a different rule.

    The rate of A e^(kt) is k times A e^(kt).

    ```working
    0.05 times 40 = 2
    dy/dt = 2 e^(0.05t)
    at t = 0, dy/dt = 2
    ```

    The curve starts rising at 2 per unit of time, not flat.

    A check that catches it without any rule: step forward a little and divide. At t = 0.001, y is
    40 times e^(0.00005), which is about 40.002. The change is 0.002 over 0.001, a rate of 2.

    Why it looks reasonable: "bring the power down and take one off" is the first rule most people
    learn. And 0.05t sits where a power usually sits. The answer even looks like calculus.
- level: 8
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
    a gap closes exponentially with a half-time of 1 year, so k = 0.693
    after 30 days the share left is e^(-0.693 times 30)
    e^(-20.79) = 0.000000001
    so the change is complete within a month
    ```
  answer: |
    The second line broke. The rate constant is 0.693 per year, and 30 is in days. The units have
    to match before they are multiplied.

    Turn 30 days into years.

    ```working
    30 days = 0.0822 years
    0.693 times 0.0822 = 0.057
    e^(-0.057) = 0.945
    ```

    After a month, 94.5% of the gap is still there. About 5.5% of the change has happened, not all
    of it.

    Why it looks reasonable: k is often written as a bare number, 0.693, with its unit dropped. The
    calculation after that is correct arithmetic on the wrong product. The check that catches it:
    a one-year half-time cannot finish in a month.
- level: 9
  prompt: |
    A colleague reads the rule of thumb in Hall and colleagues (*Lancet* 2011). It has "half of the
    weight change being achieved in about 1 year and 95% of the weight change in about 3 years".
    The colleague says this.

    > That is an exponential with a one-year half-time. After three years it would be only 87.5%
    > of the way, so the paper contradicts itself.

    Decide what to compute, compute it, and say what your answer does not establish.
  answer: |
    What to compute: what a one-year half-time gives at three years, and whether any one
    exponential could give both of the paper's figures.

    Three years is three half-times.

    ```working
    0.5 times 0.5 times 0.5 = 0.125
    1 minus 0.125 = 0.875
    ```

    So 87.5%, as the colleague says. Now the ratio test. For one exponential, the time to 95% is
    4.32 half-times. The paper's figures give 3 years over 1 year, which is 3. No single
    exponential gives both.

    What this does not establish. It does not show the paper contradicts itself. The paper never
    claims its curve is one exponential. It reports two rounded outputs of its model, and a model's
    curve can slow in other ways. It is also possible that "about 1 year" rounds something nearer
    8 months.

    What it does establish is narrower and useful. You cannot rebuild the paper's curve from its
    two figures by assuming one exponential. If you need a figure between them, you need the
    model's own output.
  refs: [hall_2011_lancet]
- level: 10
  prompt: |
    A health magazine prints this line. The patient and the 4 kilograms are made up for this
    problem.

    > Weight loss slows exponentially. So a patient who has lost 4 kg in the first three months
    > will have lost 16 kg by the end of the year.

    Decide what to compute, compute it, and say what your answer does not establish.
  answer: |
    What to compute: first, how the 16 was reached. Then what an exponential slowing would give
    instead.

    The 16 is 4 kilograms times four quarters of a year.

    ```working
    4 times 4 = 16
    ```

    That is a straight line, the same loss every quarter. It contradicts the first half of the
    sentence, which says the loss slows.

    Now suppose one exponential with a half-time of 1 year. By three months, a quarter of a year,
    this share of the eventual change has come.

    ```working
    0.693 times 0.25 = 0.1733
    e^(-0.1733) = 0.841
    1 minus 0.841 = 0.159
    4 divided by 0.159 = 25.2
    25.2 times 0.5 = 12.6
    ```

    An eventual loss near 25 kilograms, and about 12.6 by the end of the year. Take instead the
    exponential that is 95% of the way at 3 years, with k = 0.999 per year. At one year this curve
    is 63.2% of the way (the table above).

    ```working
    0.999 times 0.25 = 0.2498
    e^(-0.2498) = 0.779
    1 minus 0.779 = 0.221
    4 divided by 0.221 = 18.1
    18.1 times 0.632 = 11.4
    ```

    About 11.4 kilograms by the end of the year. Either way, the year's figure is well under 16.

    What this does not establish. It does not establish that this patient follows either curve.
    Both assume intake stays cut by the same amount, and the curve's timescale from Hall's model
    is for an average adult, not for this person. It does not establish that the first three
    months were typical: early loss includes water and glycogen, not only tissue. And it says
    nothing about what the patient should do. The only firm conclusion is the arithmetic one: a
    loss that slows cannot be extended as a straight line.
  refs: [hall_2011_lancet]
retrieval_items:
- q: What is the number e, and what is special about the curve e^(t)?
  a: e is about 2.71828. It is the one base whose exponential curve starts, at t = 0, with a slope
    of exactly 1. As a result the rate of e^(kt) is k times e^(kt), so its rate is proportional
    to its own value.
- q: For y = A e^(-kt), what are the half-time and the time to 95% of the way to zero, and what is
    their ratio?
  a: The half-time is ln 2 divided by k, about 0.693 divided by k. The time to 95% is ln 20 divided
    by k, about 3.00 divided by k. The ratio is always about 4.32.
- q: Hall and colleagues give about 1 year to half and about 3 years to 95%. Can one exponential
    give both?
  a: No. One exponential reaches 95% at 4.32 half-times, and the paper's figures are 3 half-times
    apart. They are rounded outputs of the paper's model, so do not fill in the months between them
    with an exponential you chose.
