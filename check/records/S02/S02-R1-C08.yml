must_know:
  - point: |
      To find where a model says weight will settle, set the rate to zero and solve for the
      weight. Do not run the model forward and read off where it seems to stop. The algebra
      gives the level exactly, and it shows which numbers the level depends on.
    kind: move
    bearing: methodological
  - point: |
      In the settling point model, a lasting cut of 300 kilocalories a day moves the equilibrium
      down 10 to 15 kilograms. It takes years to get there. Now let eating rise by about 100
      kilocalories a day for each kilogram lost. The same cut then moves it only 2.3 to 2.5
      kilograms. Before you give a patient a target from a cut in food, say which model it came
      from.
    kind: number
    bearing: clinical
    refs: [hall_guo_2017, polidori_2016]
  - point: |
      "Keep eating what got you to the new weight and you will stay there" is the static model.
      In it, every weight is an equilibrium. When expenditure falls with weight, going back to
      the old intake moves the equilibrium back to the old weight. Tell a patient that regain is
      this equation at work. Never call it a lapse.
    kind: misconception
    bearing: clinical
    refs: [hall_guo_2017]
  - point: |
      A steady weight means intake equals expenditure, not that either is small. Say it that
      way to a journalist who calls a stable weight a sign that "nothing is going on".
    kind: misconception
    bearing: public
  - point: |
      A weight that stops falling for a few weeks is not thereby at an equilibrium. The rate is
      zero at an equilibrium and stays zero. It can pass through zero for a moment while intake
      is still moving, and water shifts can hide the true rate for weeks. In the programme
      Polidori and colleagues describe, average weight was lowest at about 8 months. Intake was
      already back within 100 kilocalories a day of where it began, and slow regain followed.
    kind: trap
    bearing: clinical
    refs: [polidori_2016, hall_2012_ajcn]
  - point: |
      An equilibrium worked out from straight lines is only as good as the lines. They hold
      where the slopes were measured, and for the average person. Polidori and colleagues do not
      yet know if their slope for eating holds for larger losses. So quote such a figure as the
      model's answer for a group, and name the slopes. Never give it to one person as the
      weight they will end at.
    kind: boundary
    bearing: methodological
    refs: [polidori_2016, hall_guo_2017]
  - point: |
      When a trainee adds up the slopes, check the signs first. As weight falls, intake goes up
      and expenditure goes down. Both push the weight back, so their slopes add. Subtract them,
      and the pull looks weaker and the shift looks larger.
    kind: trap
    bearing: teaching

exercises:
  - type: critique
    prompt: |
      A policy note says this.

      > A population-wide cut of 100 kcal a day, sustained, will lower average weight every
      > year. The loss is 100 × 365 ÷ 7,700 = 4.7 kg a year.

      Say what is wrong, using the idea of an equilibrium. Then give the figure you would put
      in its place, with the source of every number in it.
    answer: |
      What is wrong: the note runs the static rule, which has no equilibrium when intake
      changes. It predicts the same loss every year for ever.

      Put in its place an equilibrium. Hall and colleagues (2011) give a rule of thumb for an
      average overweight adult. Every 100 kilojoules a day of change in intake leads to "an
      eventual bodyweight change of about 1 kg". "Eventual" is the equilibrium. Convert the cut
      to kilojoules with 4.184 kilojoules per kilocalorie.

      ```working
      100 times 4.184 = 418.4
      418.4 divided by 100 = 4.184
      ```

      About 4.2 kilograms, once, eventually, not every year. The same paper says half the change
      comes in about 1 year and 95% in about 3 years.

      What the replacement still does not say. The rule of thumb leaves out intake rising as
      weight falls, which would shrink the figure. It is for an average overweight adult, not a
      population with a spread of weights. And a cut "sustained" across a population is itself
      an assumption, not a measurement.
    skill_ref: S02-R1-K02
  - type: teaching
    prompt: |
      A journalist has three minutes and no jargon. They ask: "Why do people who lose weight so
      often put it back on?" Give them the idea of an equilibrium without the word, and one
      quotable sentence.
    answer: |
      Start with a picture. Two lines on a graph. One is what the body spends, and it rises as
      the body gets heavier. The other is what the person eats. Where they cross, the weight
      stays put.

      Then the diet. Eating less lowers the eating line. The crossing moves to a lower weight,
      and the body drifts down to it over months to years.

      Then the part people miss. When the diet ends and eating goes back to where it was, the
      crossing goes back to where it was. The body drifts back up to it. Nobody has to lose
      discipline for that to happen. It is where the lines cross.

      Then the second push. Appetite rises as weight falls. The first study to measure it in
      people living normally found about 100 kilocalories a day for each kilogram lost. That tilts the eating line and pulls
      the crossing back toward the old weight.

      The quotable sentence: "A body settles where what it eats meets what it spends. Go back to
      the old eating and you go back to the old weight. That is physics and physiology, not
      weakness."

      What not to say: that everyone regains, or by how much. The figures are group averages,
      and people differ widely.
    skill_ref: S02-R1-K01

quantitative: true
practice_note: |
  Seventeen problems. The moves are setting a rate to zero and solving, finding the crossing of
  two lines, adding slopes when both flows respond, and the time constant with its half-time,
  plus reading the direction of the rate on each side. Each needs a bare-number problem and
  a real one. The diagnostic band has four distinct errors (subtracted slopes, an inverted
  time constant, a moment of zero rate taken for an equilibrium, the time constant taken for
  the arrival time).
practice:
  - level: 1
    prompt: |
      Find the equilibrium of dy/dt = 12 − 0.4 × y.
    answer: |
      Set the rate to zero and solve.

      ```working
      0 = 12 − 0.4 × y
      0.4 × y = 12
      12 divided by 0.4 = 30
      ```

      The equilibrium is y = 30. Check: 0.4 × 30 is 12, and 12 − 12 is 0.
  - level: 1
    prompt: |
      Find the equilibrium of dy/dt = −0.05 × (y − 70). Then work out the rate at y = 60 and at
      y = 80, and say what each tells you.
    answer: |
      The rate is zero when y − 70 is zero, so the equilibrium is y = 70.

      ```working
      60 minus 70 = -10
      -0.05 times -10 = 0.5
      80 minus 70 = 10
      -0.05 times 10 = -0.5
      ```

      At 60 the rate is plus 0.5, so y rises toward 70. At 80 it is minus 0.5, so y falls
      toward 70. From either side the state returns. The equilibrium is stable.
  - level: 2
    prompt: |
      Intake is a flat line at 2,000 units. Expenditure is 500 + 25 × W. Find the W where they
      cross. Then drop intake to 1,800 and find the new crossing. How far did it move?
    answer: |
      At the crossing, intake equals expenditure.

      ```working
      2000 = 500 + 25 × W
      2000 minus 500 = 1500
      1500 divided by 25 = 60
      ```

      W = 60. Now with intake at 1,800.

      ```working
      1800 minus 500 = 1300
      1300 divided by 25 = 52
      60 minus 52 = 8
      ```

      The crossing moves from 60 to 52, a shift of 8. Check it the short way: the drop in
      intake divided by the slope.

      ```working
      200 divided by 25 = 8
      ```
  - level: 2
    prompt: |
      Intake is 5,700 − 60 × W and expenditure is 500 + 20 × W. Find the crossing. Then lower
      intake by 400 at every W and find the new crossing.
    answer: |
      Set the two equal and gather the W terms on one side by adding 60 × W to both sides.

      ```working
      5700 − 60 × W = 500 + 20 × W
      5700 minus 500 = 5200
      60 plus 20 = 80
      5200 divided by 80 = 65
      ```

      W = 65. With intake 400 lower, the left side starts at 5,300.

      ```working
      5300 minus 500 = 4800
      4800 divided by 80 = 60
      ```

      W = 60, a shift of 5. The short way uses the two slopes added.

      ```working
      400 divided by 80 = 5
      ```

      Had intake been flat, the shift would have been 400 divided by 20, which is 20. The
      sloping intake line cut it to a quarter.
  - level: 3
    prompt: |
      Take dy/dt = −0.02 × (y − 50), with y = 60 at t = 0. Give the time constant, the half-time,
      and y at t = 50. Use ln 2 = 0.6931 and e^(-1) = 0.3679.
    answer: |
      The gap y − 50 is multiplied by e^(-0.02t). The time constant is 1 divided by 0.02.

      ```working
      1 divided by 0.02 = 50
      50 times 0.6931 = 34.655
      ```

      The time constant is 50 and the half-time about 34.7. At t = 50 the gap has been
      multiplied by e^(-1).

      ```working
      10 times 0.3679 = 3.679
      50 plus 3.679 = 53.679
      ```

      y is about 53.68. After one time constant, a little over a third of the gap is left, not
      none of it.
  - level: 3
    prompt: |
      A flat intake line is lowered by 300. The equilibrium moves by 12. What is the slope of
      the expenditure line?
    answer: |
      The shift is the change in intake divided by the slope. Rearrange for the slope by
      multiplying both sides by the slope and dividing both by the shift.

      ```working
      slope = change in intake ÷ shift
      300 divided by 12 = 25
      ```

      A slope of 25. Check: 300 divided by 25 is 12.
  - level: 4
    prompt: |
      Hall and Guo (2017) cut 300 kilocalories a day from the diet in their settling point
      model. Expenditure rises with weight at about 20 to 30 kilocalories a day per kilogram.
      Work out how far the equilibrium weight moves at each end of that range.
    answer: |
      Intake is flat, so the shift is the cut divided by the slope.

      ```working
      300 divided by 20 = 15
      300 divided by 30 = 10
      ```

      The equilibrium falls by 10 to 15 kilograms. Check the unit: kilocalories a day, divided
      by kilocalories a day per kilogram, leaves kilograms.

      The range comes from the range of slopes. Quote both ends, not the middle.
    refs: [hall_guo_2017]
  - level: 5
    prompt: |
      Now Hall and Guo's set point model. The same 300 kilocalories a day is cut, and intake
      also changes with weight, with a slope of about −100 kilocalories a day per kilogram.
      Work out the shift in the equilibrium at each end of the 20 to 30 range for expenditure.
      Compare with the settling point model.
    answer: |
      Intake rises as weight falls, and expenditure falls as weight falls. Both push the weight
      back, so the slopes add.

      ```working
      100 plus 20 = 120
      300 divided by 120 = 2.5
      100 plus 30 = 130
      300 divided by 130 = 2.307692308
      ```

      About 2.3 to 2.5 kilograms. The settling point model gave 10 to 15.

      ```working
      15 divided by 2.5 = 6
      10 divided by 2.307692308 = 4.333333333
      ```

      The set point shift is about a sixth to a quarter of the settling point shift, depending on
      the slope of expenditure.
    refs: [hall_guo_2017]
  - level: 5
    prompt: |
      Hall and colleagues (2011) give a rule of thumb. Every change of intake of 100 kJ a day
      leads to "an eventual bodyweight change of about 1 kg". The paper adds "(equivalently, 10
      kcal per day per pound of weight change)". Turn each form into kilocalories a day per kilogram.
      Then give the equilibrium shift each form predicts for a cut of 300 kilocalories a day.
      One kilocalorie is 4.184 kilojoules. One pound is 0.45359237 kilograms.
    answer: |
      The first form, 100 kilojoules a day per kilogram.

      ```working
      100 divided by 4.184 = 23.90
      ```

      The second form, 10 kilocalories a day per pound. There are 1 divided by 0.45359237
      pounds in a kilogram, so divide by 0.45359237.

      ```working
      10 divided by 0.45359237 = 22.05
      ```

      About 23.90 and 22.05 kilocalories a day per kilogram. Both sit inside Hall and Guo's 20
      to 30. The shifts:

      ```working
      300 divided by 23.90 = 12.55
      300 divided by 22.05 = 13.61
      ```

      About 12.6 and 13.6 kilograms. The paper's "equivalently" is a rounding, and the two
      forms differ by about 8%. That is fine for a rule of thumb. Quote which form you used.
    refs: [hall_2011_lancet, hall_guo_2017]
  - level: 6
    prompt: |
      Polidori and colleagues ran a drug trial. At steady state, "energy intake was calculated
      to have increased by ~350 kcal/day". Their Equation 4 says the change in intake is minus kP
      times the change in weight. kP is about 100 kilocalories a day per kilogram. Work out the
      weight change at steady state. Compare it with the paper's "new equilibrium several
      kilograms lower".
    answer: |
      Equation 4 is ΔEI = −kP × ΔW. Divide both sides by minus kP.

      ```working
      ΔW = −ΔEI ÷ kP
      350 divided by 100 = 3.5
      ```

      ΔW is about minus 3.5 kilograms. The paper says the new equilibrium was "several kilograms
      lower". The sizes agree.

      This uses only the intake side. It leaves out the fall in expenditure, which the paper's
      full model includes. It checks that the two reported figures fit together. It does not
      replace the paper's own weight curve.
    refs: [polidori_2016]
  - level: 6
    prompt: |
      Hall and colleagues' 100 kg man cuts 480 kilocalories a day. Their model predicts a
      plateau "at about 75 kg". Their rule of thumb, 100 kilojoules a day per kilogram, is 23.90
      kilocalories a day per kilogram. Work out the plateau the rule of thumb gives him. Then say
      why the two might differ. The paper's summary helps: "adults with greater adiposity have a
      larger expected weight loss for the same change of energy intake". Adiposity means how
      much body fat a person carries.
    answer: |
      The shift is the cut divided by the slope.

      ```working
      480 divided by 23.90 = 20.08
      100 minus 20.08 = 79.92
      ```

      About 80 kilograms by the rule of thumb, against about 75 from the paper's model. The
      model's loss is about 25 kilograms, the rule's about 20.

      The rule of thumb is for "an average overweight adult". A 100 kg sedentary man probably
      carries more body fat than that average. The paper says more body fat means a larger loss
      for the same cut. So the rule of thumb's single slope is too steep for him. Its equilibrium comes
      out too high.

      A single slope is the simplification. The model lets the slope depend on the body.
    refs: [hall_2011_lancet]
  - level: 7
    prompt: |
      Here is a worked answer. Find the step that broke.

      ```working
      set point model: 300 kcal/day cut, intake slope −100, expenditure slope 20
      combined slope = 100 − 20 = 80
      shift = 300 ÷ 80 = 3.75 kg
      ```
    answer: |
      The step that broke is the second. Both feedbacks push the weight back toward where it
      was, so their slopes add.

      ```working
      100 plus 20 = 120
      300 divided by 120 = 2.5
      ```

      The shift is 2.5 kilograms, not 3.75.

      Why the wrong answer looks reasonable. The intake slope is written with a minus sign and
      the expenditure slope without one. Subtracting feels like respecting the signs. Check the
      direction instead. As weight falls, intake goes up and expenditure goes down. Both close
      the gap, so both count toward the total slope.
  - level: 7
    prompt: |
      Here is a worked answer. Find the step that broke.

      ```working
      settling point model: ρ = 7716.18 kcal per kg, ε = 20 kcal/day per kg
      time constant τ = ε ÷ ρ = 20 ÷ 7716.18 = 0.00259
      so the weight is essentially at its new equilibrium within a day
      ```
    answer: |
      The step that broke is the second. The time constant is ρ divided by the slope, not the
      slope divided by ρ.

      ```working
      7716.18 divided by 20 = 385.809
      ```

      About 386 days.

      A unit check finds it. Kilocalories per kilogram divided by kilocalories a day per kilogram
      leaves days. The inverted ratio has the unit one over days: it is a rate, 0.00259 of the
      gap closed per day, not a time. Reading it as days turns "about a year" into "a quarter of
      an hour".

      Why the wrong answer looks reasonable. Both numbers are the right ones, and dividing them
      is the right operation. Only the order is wrong, and a small answer then looks like a
      quick settling.
  - level: 8
    prompt: |
      Here is a worked answer. Find the step that broke.

      ```working
      Polidori's programme: weight lowest at about 8 months, with intake within 100 kcal/day of baseline
      at the lowest point, weight stopped falling, so dW/dt = 0
      dW/dt = 0 is the definition of an equilibrium
      so the lowest weight was the new equilibrium, and the group could hold it on that intake
      ```
    answer: |
      The step that broke is the third. An equilibrium is a weight at which the rate is zero and
      stays zero, because nothing in the rule is changing. At the lowest point the rate was zero
      for a moment only. Intake was still climbing back toward where it began. The paper
      describes intake relaxing toward baseline, then "slow weight regain".

      Check with the settling point model. A year in, the paper has intake "practically at
      baseline levels while body weight was still reduced by ~5 kg". With ΔEI = 0 the
      equilibrium is the starting weight. At 5 kilograms below it, with ε = 20:

      ```working
      20 times 5 = 100
      ```

      The right side is plus 100 kilocalories a day, so the weight is rising.

      Why the wrong answer looks reasonable. A zero rate is the test for an equilibrium, and the
      weight did stop falling. The missing check is whether the rule itself had stopped moving.
      A ball thrown upward also has zero speed at the top, and it does not stay there.
    refs: [polidori_2016]
  - level: 8
    prompt: |
      Here is a worked answer. Find the step that broke.

      ```working
      Hall's man, ε = 20, ρ = 7716.18: equilibrium 76 kg, time constant 385.809 days
      the time constant is how long it takes to reach equilibrium
      so on day 386 he weighs 76 kg
      ```
    answer: |
      The step that broke is the second. After one time constant the gap has been multiplied by
      e^(-1), which is 0.3679. About 37% of it is still left.

      ```working
      1 minus 0.3679 = 0.6321
      24 times 0.6321 = 15.17
      100 minus 15.17 = 84.83
      ```

      On day 386 he weighs about 84.8 kilograms, not 76. In this model he never quite reaches
      76. The gap keeps shrinking by the same fraction.

      Why the wrong answer looks reasonable. "Time constant" sounds like a time to arrive. It is
      the time over which the gap shrinks by one factor of e. For a date you can use, give the
      time to 95% of the shift: τ times ln 20, about 1,156 days here.
  - level: 9
    prompt: |
      A newspaper headline reads: "Cut 300 calories a day and lose 15 kg, says top weight
      scientist." The headline is made up for this problem.

      Decide what to compute, compute it, and say what your answer does not establish.
    answer: |
      What to compute: which model gives 15 kilograms, over what time, and what the other model
      in the same paper gives.

      The 15 is the settling point model's shift at the low end of its slope, from Hall and Guo.

      ```working
      300 divided by 20 = 15
      300 divided by 30 = 10
      ```

      So 10 to 15 kilograms, eventually. Hall and Guo say it "takes years to equilibrate". With
      the stand-in ρ of 7,716.18 and a slope of 20, 95% of the shift takes about 1,156 days.

      The set point model, in the same paragraph of the same paper, adds appetite rising about
      100 kilocalories a day per kilogram lost.

      ```working
      300 divided by 120 = 2.5
      300 divided by 130 = 2.307692308
      ```

      About 2.3 to 2.5 kilograms.

      What this does not establish. It does not say which model fits a given reader; Hall and
      Guo expect "a wide degree of individual variation". It does not say the cut can be kept up
      for years. It does not say the lines stay straight over a loss of 15 kilograms. The paper
      that measured the appetite slope does not yet know that. A fair headline would say
      "somewhere between about 2 and 15 kg, over years, depending on how much appetite rises".
    refs: [hall_guo_2017, polidori_2016]
  - level: 10
    prompt: |
      A colleague says of a patient: "Her weight has been flat at 82 kg for two months. She's hit
      her set point, so no change in what she eats will move it." The patient and her weight are
      made up for this problem.

      Decide what to compute, compute it, and say what your answer does not establish.
    answer: |
      What to compute: whether an equilibrium in a set point model is fixed, or moves when intake
      is shifted. Use Hall and Guo's slopes: intake about −100 kilocalories a day per kilogram,
      expenditure 20 to 30. Take a further sustained shift of 200 kilocalories a day in her
      intake line.

      ```working
      200 divided by 120 = 1.666666667
      200 divided by 130 = 1.538461538
      ```

      About 1.5 to 1.7 kilograms lower, eventually. Small, and not zero. In Hall and Guo's
      set point model the equilibrium moves whenever the intake line moves. "Set point" names
      the model, in which both flows push back. It does not name a weight that cannot change.

      What this does not establish. It does not show that two flat months are an equilibrium.
      Water shifts alone can hide a slow trend for weeks, and a flat stretch can be a turning
      point while intake is still moving. It does not give her own slopes, which may differ
      widely from the averages. It does not show that a 200 kilocalorie shift is something she
      can sustain, or what it would cost her in hunger. And the straight lines may not hold
      over her range; Polidori and colleagues say so of their own. So answer the colleague with
      "it moves less than you'd hope, not never", and name the model.
    refs: [hall_guo_2017, polidori_2016, hall_2012_ajcn]

retrieval_items:
  - q: How do you find the equilibrium of dW/dt = f(W)?
    a: Set the right-hand side to zero and solve for W. The constant W found is the equilibrium.
  - q: In the settling point model, how far does the equilibrium move when intake is cut?
    a: The cut divided by the slope of expenditure against weight. For 300 kcal a day and a slope
      of 20 to 30 kcal a day per kg, 10 to 15 kg.
  - q: Why do the slopes add when intake also depends on weight?
    a: As weight falls, intake rises and expenditure falls. Both close the gap, so both count
      toward the total slope that pulls the weight back.
  - q: What is the time constant of the approach to equilibrium, and what is left of the gap
      after one time constant?
    a: ρ divided by the total slope, in days. After one time constant the gap is multiplied by
      e^(-1), so about 37% of it is left.
  - q: Why is a steady weight not a sign that nothing is happening?
    a: At equilibrium intake equals expenditure. Both are still thousands of kilocalories a day;
      only their difference is zero.

