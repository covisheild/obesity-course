    quote: |-
      18-30 2879 0.063kg + 2.896 0.641 15.057kg + 692.2
  - value: "2879"
    unit: "men measured in that age band (the table's No. column)"
    citekey: fao_who_unu_2004
    quote: |-
      18-30 2879 0.063kg + 2.896 0.641 15.057kg + 692.2
  - value: "10"
    unit: "per cent, the low end of the overestimate of BMR for Indians"
    citekey: icmr_nin_2020_brief
    quote: |-
      the equation can overestimate the BMR by 10 -12%, because the FAO/WHO/UNU data set included young and muscular subjects.
  - value: "12"
    unit: "per cent, the high end of the same overestimate"
    citekey: icmr_nin_2020_brief
    quote: |-
      the equation can overestimate the BMR by 10 -12%, because the FAO/WHO/UNU data set included young and muscular subjects.
  - value: "5"
    unit: "per cent, each of ICMR-NIN's two reductions of the FAO/WHO/UNU BMR"
    citekey: icmr_nin_2020_brief
    quote: |-
      The earlier ICMR-NIN committee used 5% reduction in BMR calculation from FAO/WHO/UNU equations for deriving energy requirements for Indian adults
  - value: "100"
    unit: "kcal/day per kg of weight lost, the fitted feedback strength kP"
    citekey: polidori_2016
    quote: |-
      On average, energy intake increased by ~100 kcal/day per kg of weight lost
must_know:
- point: |
    Say an equation's kind before you use it, because the check differs. For an identity, check
    that both sides are counted across the same boundary and interval. For a definition, read the
    where-clause. For a model assumption, ask for the evidence. For a fitted equation, ask whom it
    was fitted on.
  kind: move
  bearing: methodological
- point: |
    An identity cannot tell you what to change. Energy intake minus expenditure equals the change
    in stores whatever caused either one. When someone offers the identity as a reason for an
    instruction, ask which model assumption they have added to it.
  kind: misconception
  bearing: methodological
- point: |
    ICMR-NIN finds that the FAO/WHO/UNU equations for BMR can run 10 to 12% high for Indians. The
    data behind them came from young, muscular people. Before you estimate an Indian
    patient's needs from those equations, use ICMR-NIN's figures for Indian adults, which build in
    a reduction.
  kind: india_deviation
  bearing: clinical
  refs: [icmr_nin_2020_brief]
- point: |
    An energy requirement is BMR times the physical activity level (PAL). That is a definition used
    to make an estimate, and the estimate moves when its inputs move. ICMR-NIN's 2020 note cut the
    sedentary figure from 1.53 to 1.40. At the same BMR, that alone lowers the estimate by about
    8.5%. Quote such a table with the year of its inputs.
  kind: number
  bearing: policy
  refs: [icmr_nin_2020_brief]
- point: |
    A fitted equation holds for people like those it was fitted on, over the range it was fitted.
    Outside that, find an equation fitted on people like yours, or measure. If you can do neither,
    say that you used the equation on people unlike those it was fitted on.
  kind: boundary
  bearing: clinical
- point: |
    A constant fitted to a group's means is not any one person's. Polidori's about 100 kcal a day
    per kg was fitted to group means. Do not tell a patient their appetite will rise by exactly that
    much.
  kind: trap
  bearing: clinical
  refs: [polidori_2016]
- point: |
    A notebook entry without its kind and its assumptions is not finished. When you copy an
    equation from a typeset image, have a second reader check it symbol by symbol. No search can
    find a symbol you copied wrongly.
  kind: move
  bearing: methodological
- point: |
    Teach a trainee that a definition cannot be confirmed by data. A study that "confirms" that PAL
    equals total energy expenditure (TEE) divided by BMR has confirmed only its own arithmetic.
  kind: trap
  bearing: teaching
exercises:
- type: build
  prompt: |
    Start the notebook this book has been building towards: ten equations from papers you have
    read, each with a full six-part entry.

    Here are ten candidates from papers this book has quoted. Choose any ten, from here or from
    your own reading. For each, write the six parts.

    1. The energy balance equation, ES = EI − EO (Hall and colleagues 2012, Question 1).
    2. PAL = TEE / BMR (FAO/WHO/UNU 2004, glossary and chapter 5).
    3. TEE = BMR × PAL (FAO/WHO/UNU 2004, chapter 5; ICMR-NIN 2020).
    4. One row of Table 5.2, such as BMR = 14.818 × weight + 486.6 for women aged 18 to 30 (FAO/WHO/UNU 2004).
    5. Energy in kcal = 4 × protein + 9 × fat + 4 × carbohydrate, each in grams (FAO Food and Nutrition Paper 77, §3.5.1).
    6. W(t) = W0 − ΔEB × t / 3500 (Thomas and colleagues 2013, Methods).
    7. Equation 1 of Polidori and colleagues 2016, the change in intake from weights.
    8. Equation 4 of Polidori and colleagues 2016, proportional control.
    9. Equation 5 of Polidori and colleagues 2016, which adds an integral term.
    10. The rule of thumb (Hall and colleagues 2012, Question 3). Eventual weight change in pounds = the permanent change in intake in kcal a day, divided by 10.

    Two more are worth adding if you can get them. One is Equations 1 and 2 of Chow and Hall 2008.
    The other is Hall's 2008 equation for the energy density of weight loss. Both are printed as
    images. Copy them symbol by symbol and have someone check your copy.
  answer: |
    The kinds, and the one thing each entry must not leave out.

    1. Identity. Counted across one boundary, the body, for one interval. Hall and colleagues call
       it "a statement of the principle of energy conservation". Their ES here is the rate, which
       this book writes dES/dt. Names no cause.
    2. Definition. PAL has no existence apart from this ratio. Units cancel: PAL has none.
    3. The same definition, rearranged, used to estimate. Its kind is definition, but its answer is
       only as good as the BMR (fitted) and the PAL (measured or adopted) put in. ICMR-NIN's 2020
       note changed both inputs for Indian adults.
    4. Fitted. Schofield's data, 829 women in this band, by the table's count. Can run 10 to 12%
       high for Indians, per ICMR-NIN. Check the units: 14.818 is kcal a day per kg.
    5. Fitted and then adopted. The factors are averaged from measurements, rounded, and used
       "regardless of the food", FAO says, as `B0-R0-C32` taught. Indian labelling rules then fix
       the factors by regulation, as `B0-R0-C12` showed.
    6. Model assumption. `S02-R1-C16` rebuilt it as the identity plus two assumptions. One is
       3,500 kcal in every pound. The other is a gap that never changes. ΔEB must be read as expenditure minus intake for the
       printed minus sign to give a loss. W is in pounds.
    7. Model. The identity plus premises, as `S02-R1-C16` rebuilt it. The paper calls it "a
       linearization". Two symbols, β and the activity figure δ, are defined in parts of the paper
       this book has not quoted. Find them before you call the entry finished.
    8. Model assumption with a fitted constant, kP, about 100 kcal a day per kg, fitted to group
       means. The authors say they do not yet know if it holds across a range of losses.
    9. Model assumption. The authors "also investigated" it as an alternative. Its kI of 1 kcal a
       day per kg per day was set for the simulation. The paper's own words give no fit for it.
    10. Model result. It is what a model gives, rounded. The panel calls it "a best-case scenario"
        "for the average overweight person". It inherits every assumption of that model. It
        describes the eventual weight, not the time to reach it.

    A full entry, for number 8, is in this section's illustration. The others follow its
    pattern.
  skill_ref: S02-R1-K01
- type: teaching
  prompt: |
    A state health secretary asks why the national energy requirement for sedentary adults fell
    in 2020, when nobody's body changed. One page, answer first, no methods section.
  answer: |
    The answer first: the requirement is a calculation, and ICMR-NIN changed two of its inputs.
    Nobody's body had to change.

    The requirement is the resting energy a body spends, its basal metabolic rate, times a number
    for how active people are. That number is the physical activity level. ICMR-NIN's 2020 note
    states the formula: TEE = BMR × PAL.

    The first input. The resting figure comes from equations built on measurements of other
    populations. ICMR-NIN found they can run 10 to 12% high for Indians. It had already cut them by
    5% and cut them by another 5% in 2020.

    The second input. For sedentary adults the activity number fell from 1.53 to 1.40. ICMR-NIN
    says the energy spent on each activity is lower for Indians. On its own, at the same resting
    figure, that lowers the requirement by about 8.5%.

    ```working
    1.40 divided by 1.53 = 0.915
    ```

    What this means for policy. Any scheme norm still built on the 2010 figures uses a higher
    estimate than ICMR-NIN now gives. Check such norms against the 2020 figures. Next time the
    inputs are revised, the requirement will move again. Tie every
    requirement quoted in a scheme to the year of the inputs behind it.
retrieval_items:
- q: Name the four kinds of equation, and the question you ask of each.
  a: Identity (is every term counted across the same boundary and interval?); definition (am I
    reading it in the author's sense?); model assumption (what evidence supports it?); fitted
    equation (whom was it fitted on, over what range?).
- q: List the six parts of a notebook entry.
  a: The equation as printed; each symbol in words with its unit; the equation in one sentence;
    its kind; what it assumes or whom it was fitted on; the paper and the equation's number or
    page.
- q: Why does ICMR-NIN lower the BMR that the FAO/WHO/UNU equations give for Indian adults?
  a: Because those fitted equations can overestimate Indians' BMR by 10 to 12%; the data behind
    them included young and muscular people. A fitted equation holds only for people like those it
    was fitted on.
