simplified_explanation: |
  A derivation is a staircase. Each step down is one small move you could make yourself.

  Some steps are not moves at all. The author brings in something new: "suppose expenditure stays
  fixed". That line is a premise. Everything below it depends on it, however careful the steps that
  follow.

  So read a derivation with a pencil. Beside every line, write the move that got you there.
illustration:
  body: |
    Start with the rule Book 1 called the static rule, as Thomas and colleagues print it (Thomas 2013).
    They write W(t) for the expected weight, in pounds, on day t, and W0, said "W nought", for the weight
    at the start. They write ΔEB for "the change in energy balance in kcal/d".

    ```working
    W(t) = W0 − ΔEB × t / 3500
    ```

    Rebuild it from the identity, one move per line.

    Line 1 is the identity as a rate.

    ```working
    dES/dt = EI − EE (line 1: the identity, taken as given)
    ```

    Line 2 brings in something new. The rule assumes every 3,500 kcal of stored energy gained or lost is
    one pound of body weight.

    ```working
    dES/dt = 3500 × dW/dt (line 2: assumed, 3,500 kcal in every pound)
    ```

    ```working
    3500 × dW/dt = EI − EE (line 3: substitute)
    ```

    Line 4 is a second assumption. Intake minus expenditure stays the same number on every day.
    Call that number ΔEB.

    ```working
    3500 × dW/dt = ΔEB (line 4: assumed, the gap never changes)
    ```

    ```working
    dW/dt = ΔEB / 3500 (line 5: rearrange)
    ```

    ```working
    W(t) − W0 = ΔEB × t / 3500 (line 6: integrate both sides from 0 to t)
    ```

    ```working
    W(t) = W0 + ΔEB × t / 3500 (line 7: rearrange)
    ```

    Now set your line 7 beside the printed equation. Yours has a plus where theirs has a minus. The
    difference sits in the where-clause. Thomas and colleagues define ΔEB as "the difference between the
    rate of energy intake and the rate of energy expenditure". That phrase does not say which is taken
    from which.

    The printed equation predicts a fall only if ΔEB is expenditure minus intake: the deficit, written as
    a positive number.

    Start at 180 pounds, with a deficit of 500 kcal a day.

    ```table
    day  ΔEB read as expenditure minus intake (lb)  ΔEB read as intake minus expenditure (lb)
    0  180  180
    35  175  185
    70  170  190
    105  165  195
    140  160  200
    ```

    Lines 1, 3, 5, 6 and 7 are safe moves. Lines 2 and 4 are assumptions. Hall and colleagues reject line
    4. Expenditure falls as weight falls, so the gap in line 4 shrinks.

    Polidori and colleagues work out the change in each person's energy intake from their weights alone,
    with their Equation 1 (Polidori 2016).

    ```working
    ΔEI = ρ × dW/dt + ε × (W − W0)
    ```

    The Greek letter rho, ρ, is "the effective energy density associated with the body weight change", in
    kcal per kg. The Greek letter epsilon, ε, sets "how energy expenditure depends on body weight", in
    kcal a day per kg.

    Line 1 is the model of `S02-R1-C07`.

    ```working
    ρ × dW/dt = EI − EE(W) (line 1: the model, taken as given)
    ```

    Line 2 assumes expenditure is a straight line in weight near the start. It is its starting
    value, EE0, plus ε times the change in weight.

    ```working
    EE(W) = EE0 + ε × (W − W0) (line 2: assumed, a straight line near the start)
    ```

    Line 3 writes intake as its starting value, EI0, plus a change, ΔEI. This defines ΔEI. It
    assumes nothing.

    ```working
    EI = EI0 + ΔEI (line 3: definition)
    ```

    ```working
    ρ × dW/dt = EI0 + ΔEI − EE0 − ε × (W − W0) (line 4: substitute)
    ```

    Line 5 needs a premise. At the start, weight was steady, so its rate was zero. That is the
    equilibrium of `S02-R1-C08`: intake equalled expenditure, and EI0 minus EE0 is zero.

    ```working
    ρ × dW/dt = ΔEI − ε × (W − W0) (line 5: assumed, steady at the start)
    ```

    ```working
    ΔEI = ρ × dW/dt + ε × (W − W0) (line 6: rearrange)
    ```

    The equation that turns weights into intake is the balance of `S02-R1-C07` plus premises. Each premise
    is a place a reader can push.
  analogy_breaks_when: |
    The two straight lines in the table hold only while lines 2 and 4 hold.

    The rebuild also takes ρ and ε as given.
  numbers:
  - value: "3500"
    unit: "kcal of stored energy assumed in each pound of body weight (the rule's own figure)"
    citekey: hall_2012_ajcn
    quote: |-
      It takes a reduction of 3500 kcal (15,000 kJ) of energy intake to lose 1 lb of body weight.
must_know:
- point: |
    Beside every line of a derivation, write the move that produced it. If you cannot name one, the
    line is a skipped step or a premise.
  kind: move
  bearing: methodological
- point: |
    A result derived from the first law is not thereby proved. When someone says an equation "comes
    from physics", ask which lines are physics and which are assumptions.
  kind: misconception
  bearing: methodological
- point: |
    Test a printed equation on a case whose answer you know. A deficit must lower weight. If
    your reading makes it raise weight, your reading is wrong.
  kind: trap
  bearing: methodological
- point: |
    Check the unit of every term on every line.
  kind: move
  bearing: methodological
- point: |
    Following a derivation tells you whether each line follows. It cannot tell you whether an
    assumed line is true; that needs evidence, as the passive fall in expenditure is for the 3500
    kcal rule.
  kind: boundary
  bearing: methodological
- point: |
    When you teach a derivation, have the trainee mark assumed lines differently from derived ones,
    before they say anything about the result.
  kind: move
  bearing: teaching
- point: |
    When a press line says a diet "must" produce a steady loss "because of physics", the accurate
    reply is short. The physics gives one line. The steady loss needs a second line, that
    expenditure stays fixed, and it does not.
  kind: consequence
  bearing: public
exercises:
- type: teaching
  prompt: |
    A first-year resident asks where the rule "3,500 kcal a pound" comes from and why the
    consensus panel dropped it. You have ten minutes and a whiteboard. Plan what you will write,
    line by line.
  answer: |
    Write the seven lines of the rebuild, each with its move beside it.

    ```working
    dES/dt = EI − EE (the identity)
    dES/dt = 3500 × dW/dt (assumed: 3,500 kcal in every pound)
    3500 × dW/dt = EI − EE (substitute)
    3500 × dW/dt = ΔEB (assumed: the gap never changes)
    dW/dt = ΔEB / 3500 (rearrange)
    W(t) − W0 = ΔEB × t / 3500 (integrate from 0 to t)
    W(t) = W0 + ΔEB × t / 3500 (rearrange)
    ```

    Then box the two assumed lines in a different colour. Say that the other five are safe moves,
    so the rule is exactly as good as those two lines.

    Take the second box. Ask the resident what happens to expenditure as weight falls. It falls,
    because a smaller body spends less. So the gap in that line shrinks, and weight loss slows.
    That is the panel's reason, in its own words: weight change "will slow over time due to
    passive compensatory changes in energy expenditure".

    Take the first box last. It is also an assumption: what a pound of lost weight is made of.
    Book 1 showed that a pound of fat and a pound of lean tissue hold very different energy.

    End on the sign. Thomas and colleagues print a minus where the rebuild has a plus. The
    resident should say why before you do: their ΔEB must be the deficit, expenditure minus
    intake.
  skill_ref: S02-R1-K02
- type: critique
  prompt: |
    A trainee's journal-club slide says: "Polidori and colleagues derive Equation 1 from the first
    law of thermodynamics, so the intake changes it gives are exact."

    Find the specific flaw.
  answer: |
    The first law gives only one line of the derivation, the balance. The rest are premises.

    Expenditure is drawn as a straight line in weight; the paper calls Equation 1 "a
    linearization". Weight is taken as steady at the start. And the change in physical activity
    is set to zero where it was not measured. The paper says this makes the calculated intake
    changes possibly "in error, especially at the individual level".

    For a group the paper puts the bias from that last premise at "<40 kcal/day when studying
    >100 individuals". That is a bound for a large group's mean, not for any one person. It
    comes from an earlier validation study this slide has not examined.

    So the equation is exactly as good as its premises. It is not exact, and the paper does not
    claim it is.
  skill_ref: S02-R1-K02
retrieval_items:
- q: Name the five moves a derivation in this book may make, and say which one carries nothing
    from the line above.
  a: Substitute; rearrange; divide by a time interval and shrink it; differentiate or integrate
    both sides; assume. An assumed line carries nothing from above; it is a new premise.
- q: Why does the printed equation W(t) = W0 − ΔEB × t / 3500 predict a fall only under one reading
    of ΔEB?
  a: Derived from the identity, the change is plus (intake minus expenditure) times t over 3,500.
    The printed minus sign matches that only if ΔEB is expenditure minus intake, the deficit as a
    positive number.
- q: Which two lines of the rebuilt 3500 kcal rule are assumptions, and which one does the
    consensus panel reject?
  a: That every 3,500 kcal is one pound, and that intake minus expenditure never changes. The
    panel rejects the second, because expenditure falls as weight falls.
quantitative: true
practice_note: |
  Fourteen problems. The technique has five moves plus the assumption line, and three tasks
  (name the move, fill a gap, find the break); each move is met on bare algebra before it is met
  in a paper's equation.
practice:
- level: 1
  prompt: |
    Write the move that produced each line from the line above it.

    ```working
    4x + 6 = 26
    4x = 20
    x = 5
    ```
  answer: |
    Line 2 subtracts 6 from both sides.

    ```working
    26 minus 6 = 20
    ```

    Line 3 divides both sides by 4.

    ```working
    20 divided by 4 = 5
    ```

    Check by putting 5 back into line 1.

    ```working
    4 times 5 plus 6 = 26
    ```
- level: 1
  prompt: |
    Write the move that produced the third line.

    ```working
    y = 3x
    x = 5
    y = 15
    ```
  answer: |
    Substitute: line 2 says x equals 5, so put 5 in place of x in line 1.

    ```working
    3 times 5 = 15
    ```
- level: 2
  prompt: |
    The author went from the first line to the last in one step. Fill in the skipped lines, one
    move each, and name each move.

    ```working
    5x − 4 = 2x + 11
    x = 5
    ```
  answer: |
    Three moves are missing.

    ```working
    3x − 4 = 11 (subtract 2x from both sides)
    3x = 15 (add 4 to both sides)
    x = 5 (divide both sides by 3)
    ```

    Check in the first line: both sides give 21.

    ```working
    5 times 5 minus 4 = 21
    2 times 5 plus 11 = 21
    ```
- level: 2
  prompt: |
    Name the move from the first line to the second, and the rule it uses.

    ```working
    y = 4t + 3
    dy/dt = 4
    ```
  answer: |
    Differentiate both sides with respect to t. The rule is that a straight line's derivative is
    its slope, from `S02-R1-C03`: the 4t gives 4 and the constant 3 gives 0. The rate of change of
    y is 4 at every t.
- level: 3
  prompt: |
    A quantity W is 80 at t = 0 and its rate of change is dW/dt = −0.2 at every t. Write the lines
    that give W at t = 10, with the move beside each.
  answer: |
    Integrate both sides from 0 to 10. The rate is constant, so the integral is rate times time.

    ```working
    W(10) − W(0) = −0.2 times 10 (integrate both sides from 0 to 10)
    W(10) − 80 = −2 (substitute W(0) = 80)
    W(10) = 78 (add 80 to both sides)
    ```

    ```working
    -0.2 times 10 = -2
    -2 plus 80 = 78
    ```
- level: 3
  prompt: |
    Find the line that does not follow from the one above it, and say what it should be.

    ```working
    4x + 8 = 20
    x + 8 = 5
    x = -3
    ```
  answer: |
    Line 2 does not follow. Dividing both sides by 4 divides the whole left side, both of its
    terms, the rule from `B0-R0-C16`. The 8 was left undivided.

    ```working
    x + 2 = 5 (divide both sides by 4)
    x = 3 (subtract 2 from both sides)
    ```

    Check in line 1.

    ```working
    4 times 3 plus 8 = 20
    ```

    Line 3 of the original is a correct move from line 2. The whole error came in at one line,
    which is why you check every line and not only the last.
- level: 4
  prompt: |
    Use the equation W(t) = W0 − ΔEB × t / 3500, with W in pounds and ΔEB in kcal a day (Thomas 2013).
    Take the reading that makes a deficit lower weight. A person starts at 200 pounds with a deficit
    of 700 kcal a day, figures made up for this problem.

    Work out W(28), and say which reading of ΔEB you used.
  answer: |
    ΔEB is read as expenditure minus intake, so it is 700.

    ```working
    700 times 28 divided by 3500 = 5.6
    200 minus 5.6 = 194.4
    ```

    W(28) is 194.4 pounds on this rule. Under the other reading, ΔEB would be minus 700. The
    printed equation would then give 205.6 pounds, a rise during a deficit. That tells you the
    reading is wrong.

    ```working
    200 plus 5.6 = 205.6
    ```
  refs:
  - thomas_2013_3500kcal
- level: 5
  prompt: |
    Chow and Hall describe one step in words (Chow and Hall 2008). They "divide Equation 1 by some
    interval of time and take the limit of infinitesimal change".

    Apply that step to Book 1's identity over an interval of Δt days. Write ES for body energy
    stores in kcal.

    ```working
    ΔES = (energy taken in over the interval) − (energy spent over the interval)
    ```

    Write the lines that take it to Hall's rate form, naming each move, and give the unit of each
    side at each line.
  answer: |
    Divide both sides by Δt. A side that is a difference is divided as a whole, so each term is
    divided.

    ```working
    ΔES / Δt = (energy taken in over the interval) / Δt − (energy spent over the interval) / Δt (divide both sides by Δt)
    ```

    Each side is now in kcal a day. The left is the average rate of change of stores over the
    interval. The right is the average rate of intake minus the average rate of expenditure.

    Now shrink Δt towards zero. Each average rate settles on the rate at an instant, as in
    `S02-R1-C02`.

    ```working
    dES/dt = EI − EE (shrink the interval: take the limit)
    ```

    Every term is in kcal a day. This is the form Hall and colleagues write as ES = EI − EO, where
    their ES stands for the rate, dES/dt.
  refs:
  - chow_hall_2008
  - hall_2012_ajcn
- level: 6
  prompt: |
    In Polidori and colleagues' trial the drug makes the body lose extra glucose in the urine,
    which the paper calls UGE (urinary glucose excretion). Write it U, energy lost a day, zero
    before the drug starts. The balance becomes:

    ```working
    ρ × dW/dt = EI − EE(W) − U
    ```

    Using the same premises as the section's rebuild, derive an equation for ΔEI, naming each
    move. Then compare it with the paper's Equation 1 with Δδ = 0 (Polidori 2016).
  answer: |
    Same premises: expenditure a straight line near the start, intake written as start plus
    change, weight steady at the start with U zero then.

    ```working
    EE(W) = EE0 + ε × (W − W0) (assumed: a straight line near the start)
    EI = EI0 + ΔEI (definition)
    ρ × dW/dt = EI0 + ΔEI − EE0 − ε × (W − W0) − U (substitute)
    ρ × dW/dt = ΔEI − ε × (W − W0) − U (assumed: steady at the start, so EI0 − EE0 = 0)
    ΔEI = ρ × dW/dt + ε × (W − W0) + U (add ε × (W − W0) and U to both sides, swap sides)
    ```

    With Δδ = 0 the paper's Equation 1 is ΔEI_i = ρ × dBW_i/dt + ε × (BW_i − BW_0) + UGE. The subscript
    i numbers the measurement interval. It is the same equation.

    One check the derivation forces: every term must be in kcal a day. The paper states the
    glucose lost as about 90 grams a day, a mass. Before it goes into Equation 1 it has to be
    turned into energy a day.
  refs:
  - polidori_2016
- level: 7
  prompt: |
    Here is a worked answer, with made-up intake and expenditure. Find the step that broke.

    ```working
    3500 × dW/dt = EI − EE
    dW/dt = EI − EE / 3500
    with EI = 2000 and EE = 2500, dW/dt = 2000 − 0.714 = 1999.3 pounds a day
    ```
  answer: |
    Line 2 broke. Dividing both sides by 3,500 divides the whole right side, not only its last
    term, the rule of `B0-R0-C16`.

    ```working
    dW/dt = (EI − EE) / 3500
    2000 minus 2500 = -500
    ```

    Minus 500 divided by 3,500 is about minus 0.143 pounds a day.

    Why the wrong answer looks reasonable: line 2 looks like line 1 with the 3,500 moved across.
    And the arithmetic in line 3 is done correctly. A unit check catches it at once. EI is in kcal
    a day, and EE divided by 3,500 is in pounds a day. Two terms in different units cannot be
    subtracted, so line 2 cannot have followed.
- level: 8
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
    ρ × dW/dt = EI − EE(W)
    EE(W) = EE0 + ε × (W − W0), and EI = EI0 + ΔEI
    ρ × dW/dt = EI0 + ΔEI − EE0 − ε × (W − W0)
    so ΔEI = ρ × dW/dt + ε × (W − W0)
    ```
  answer: |
    The last line broke, or rather it needed a premise nobody wrote. Rearranging line 3 gives:

    ```working
    ΔEI = ρ × dW/dt + ε × (W − W0) − (EI0 − EE0)
    ```

    Dropping the last term needs EI0 equal to EE0: weight steady at the start. If weight was
    already falling or rising at the start, that term is not zero, and the equation gives the
    wrong change in intake.

    Why the wrong answer looks reasonable: the result is the equation Polidori and colleagues use,
    so it looks confirmed. It is confirmed only under the premise. Write "assumed: steady at the
    start" beside the line, and a reader can check it against the baseline weights.
- level: 8
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
    a made-up rate of change of weight: dW/dt = −0.1 plus 0.001 t, in kg a day, t in days
    integrate both sides from 0 to 60: the change is the rate times the time
    at t = 60 the rate is −0.1 plus 0.06 = −0.04
    change = −0.04 times 60 = −2.4 kg
    ```
  answer: |
    Line 2 broke. "Rate times time" is the rectangle, which works only for a rate that stays the
    same. This rate changes along a straight line, so the area under it is a trapezium. As
    `S02-R1-C05` taught, that is the mean of the starting and ending rates, times the time.

    ```working
    -0.1 plus -0.04 = -0.14
    -0.14 divided by 2 = -0.07
    -0.07 times 60 = -4.2
    ```

    The change is minus 4.2 kg, not minus 2.4.

    Why the wrong answer looks reasonable: every line of arithmetic is right, and the rule "rate
    times time" was correct in the section's own derivation. There the rate was constant by
    assumption. Here it is not, and the move stopped applying without anyone saying so.
- level: 9
  prompt: |
    Thomas and colleagues report a mean deficit of 1439 kcal a day over a mean of 64.8 days
    (Thomas 2013). The mean loss the 3500 kcal rule predicted was 27.6 pounds.

    A colleague says: "1439 times 64.8 divided by 3500 is 26.6, not 27.6, so their prediction has an
    arithmetic slip."

    Decide what to compute, compute it, and say what your answer does not establish.
  answer: |
    What to compute: the colleague's figure, and then whether it is the figure the paper would
    get.

    ```working
    1439 times 64.8 = 93247.2
    93247.2 divided by 3500 = 26.64
    ```

    The colleague's arithmetic is right: about 26.6 pounds.

    But follow the derivation. The rule gives each person a prediction: their own deficit times
    their own days, divided by 3,500. The paper's 27.6 is the mean of those predictions. The
    colleague took the mean deficit times the mean duration. The mean of products is not in
    general the product of means. They match only when deficit and duration do not vary together.
    If the people with larger deficits were also treated for longer, the mean of the products is
    larger, which would fit the gap here.

    So the two figures are different quantities, and the gap is not evidence of a slip.

    What this does not establish. It does not show that the paper's 27.6 is right; you would need
    each person's figures. It does not show how deficit and duration were related. And it says
    nothing for or against the 3500 kcal rule itself. The paper tests that by setting these
    predictions beside the losses people actually had.
  refs:
  - thomas_2013_3500kcal
- level: 10
  prompt: |
    A health column says: "Physics proves that cutting 500 kcal a day loses a pound a week, for as
    long as you keep it up."

    Decide what to compute, compute it, and say what your answer does not establish.
  answer: |
    What to compute: what the rebuilt rule gives, and which of its lines are physics.

    ```working
    500 times 7 = 3500
    3500 divided by 3500 = 1
    ```

    On the rule, 3,500 kcal a week is one pound a week. So the column's arithmetic matches the
    static rule.

    Now read the derivation. Only line 1, the identity, is physics. "A pound" needs line 2, that
    every 3,500 kcal is a pound of weight. "For as long as you keep it up" needs line 4, that the
    gap between intake and expenditure never changes. Hall and colleagues state that weight change
    "will slow over time" because expenditure falls as weight falls. So line 4 fails, and with it
    the steady pound a week.

    What this does not establish. It does not tell you how much a real person loses in a week, a
    month or a year. That needs a model in which expenditure changes with weight. It also does not
    say whether they can hold the 500 kcal cut, which is a separate question about appetite.
  refs:
  - hall_2012_ajcn
