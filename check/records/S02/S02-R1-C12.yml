    quote: The energy values are 17 kJ/g (4.0 kcal/g) for protein, 37 kJ/g (9.0 kcal/g) for fat
      and 17 kJ/g (4.0 kcal/g) for carbohydrates.
must_know:
- point: |
    Find the weights from some rows, then check every other row. One row that fails settles it:
    the column is not a weighted sum.
  kind: move
  bearing: methodological
- point: |
    A table that carries energy beside protein, fat and carbohydrate, with energy worked out from
    the Atwater factors, carries one column too many. Refuse the question, or drop one column and
    say which one you dropped.
  kind: trap
  bearing: methodological
- point: |
    A column that looks like no other column can still be redundant. Comparing columns two at a
    time will never find it.
  kind: misconception
  bearing: methodological
- point: |
    The check needs rows to spare. With as many rows as weights, almost any column fits exactly.
  kind: trap
  bearing: methodological
- point: |
    When a column is nearly but not exactly a weighted sum, this test cannot say whether that
    matters. Say so, and leave it to the next rung's collinearity.
  kind: boundary
  bearing: methodological
  refs: [fao_who_unu_2004]
- point: |
    When you hear that a model "found no effect of fat once calories were accounted for", ask how
    the calories were worked out. If they came from the grams, the model had no way to find an
    effect of fat.
  kind: consequence
  bearing: public
exercises:
- type: critique
  prompt: |
    A methods section says this.

    > Energy intake (kcal/day) was calculated from protein (P), fat (F) and carbohydrate (C)
    > intakes as E = 4P + 9F + 4C. All four were entered together as predictors of weight change.

    Say what each symbol denotes, with its unit. Then say what the second sentence cannot deliver,
    and what the authors could have done instead.
  answer: |
    E is energy intake, in kilocalories a day. P, F and C are protein, fat and carbohydrate
    intake, in grams a day. A predictor is a column that a model uses to predict an outcome, here
    weight change, with one weight for each predictor. The 4, 9 and 4 are the Atwater general factors, in kilocalories a
    gram. 4P means 4 times P.

    The first sentence says that on every row, E is a weighted sum of P, F and C, with weights
    4, 9 and 4. So E is redundant beside them.

    The second sentence asks for four separate weights, one for each predictor. The table cannot
    fix them. Take any set of weights. Move some weight off E and onto P, F and C in the
    proportions 4, 9 and 4. Every predicted value stays the same. "The weight on fat"
    has infinitely many values that fit equally well.

    What they could have done: enter three of the four, and say which three. With E, P and C,
    the weight on E answers "energy, with protein and carbohydrate held fixed", which can only
    move by moving fat. That is a real question, and it is a different question from the one
    asked with P, F and C.
  skill_ref: S02-R1-K01
quantitative: true
practice:
- level: 1
  prompt: |
    Take the columns a = (1, 2, 3) and b = (4, 0, 1).

    Work out the column 3a + 2b, that is, 3 times a plus 2 times b, row by row.
  answer: |
    Row by row, 3 times the entry of a plus 2 times the entry of b.

    ```working
    3 times 1 plus 2 times 4 = 11
    3 times 2 plus 2 times 0 = 6
    3 times 3 plus 2 times 1 = 11
    ```

    The column is (11, 6, 11).
- level: 2
  prompt: |
    Take a = (1, 2, 3), b = (1, 0, 2) and y = (5, 6, 13).

    Find weights u and v with y equal to u times a plus v times b on every row, or show that
    there are none.
  answer: |
    Each row gives one equation.

    ```working
    row 1: 1 times u plus 1 times v = 5
    row 2: 2 times u plus 0 times v = 6
    row 3: 3 times u plus 2 times v = 13
    ```

    Row 2 holds u alone.

    ```working
    6 divided by 2 = 3
    ```

    So u is 3. Put it into row 1.

    ```working
    5 minus 3 = 2
    ```

    So v is 2. Row 3 is the check.

    ```working
    3 times 3 plus 2 times 2 = 13
    ```

    It holds. So y is 3 times a plus 2 times b, a weighted sum with weights 3 and 2.
- level: 2
  prompt: |
    Take a = (2, 1, 4) and b = (1, 3, 0), and y = (7, 8, 8).

    Is y equal to 2 times a plus 3 times b?
  answer: |
    Check every row with the weights given.

    ```working
    2 times 2 plus 3 times 1 = 7
    2 times 1 plus 3 times 3 = 11
    2 times 4 plus 3 times 0 = 8
    ```

    Rows 1 and 3 hold. Row 2 gives 11, and y has 8 there. One failing row is enough: y is not 2a
    + 3b.
- level: 3
  prompt: |
    Take a = (2, 3, 1, 4), b = (1, 2, 5, 3) and y = (4, 7, 11, 9).

    Test whether y is a weighted sum of a and b.
  answer: |
    Two weights, so use two rows to find them. Call them u and v.

    ```working
    row 1: 2 times u plus 1 times v = 4
    row 2: 3 times u plus 2 times v = 7
    ```

    Double row 1, so that v carries the same number in both.

    ```working
    2 times 2 = 4
    2 times 4 = 8
    ```

    That gives 4 times u plus 2 times v = 8. Subtract row 2 from it.

    ```working
    4 minus 3 = 1
    8 minus 7 = 1
    ```

    So u is 1. Put it into row 1.

    ```working
    4 minus 2 times 1 = 2
    ```

    So v is 2. Now check the two rows you did not use.

    ```working
    row 3: 1 times 1 plus 2 times 5 = 11
    row 4: 1 times 4 plus 2 times 3 = 10
    ```

    Row 3 holds. Row 4 gives 10, and y has 9 there. So y is not a weighted sum of a and b. If you
    had stopped after row 3, you would have said it was.
- level: 3
  prompt: |
    Take a = (1, 2, 4) and y = (8, 11, 17).

    Test whether y is a weighted sum of a and the column of 1s.
  answer: |
    Call the weight on a u, and the weight on the column of 1s w. Every entry of the column of 1s
    is 1, so w is simply added on each row.

    ```working
    row 1: 1 times u plus w = 8
    row 2: 2 times u plus w = 11
    ```

    Subtract row 1 from row 2. The w cancels.

    ```working
    2 minus 1 = 1
    11 minus 8 = 3
    ```

    So u is 3. Put it into row 1.

    ```working
    8 minus 3 = 5
    ```

    So w is 5. Check row 3.

    ```working
    3 times 4 plus 5 = 17
    ```

    It holds. So y is 3 times a, plus 5, on every row.
- level: 4
  prompt: |
    A made-up packet label gives these figures for each 100 grams: protein 8 g, fat 12 g,
    carbohydrate 60 g, and energy 380 kcal.

    Check whether the energy is the weighted sum of the grams with the Atwater general factors as
    weights.
  answer: |
    The Atwater general factors are 4 kcal a gram for protein, 9 for fat and 4 for carbohydrate
    (FAO 2003). Multiply each by its grams and add.

    ```working
    4 times 8 plus 9 times 12 plus 4 times 60 = 380
    ```

    380 kcal, which is the label's figure. The energy on this label is exactly the Atwater
    weighted sum of its grams, so it tells you nothing the grams do not.
  refs: [fao_food_energy_2003]
- level: 5
  prompt: |
    A made-up table lists three items. None has any protein. For each 100 grams it gives the fat
    and the carbohydrate in grams. It gives the energy in kcal.

    ```table
    item  fat (g)  carbohydrate (g)  energy (kcal)
    A     10       50                290
    B     20       30                300
    C     5        70                325
    ```

    Find the weights that make energy a weighted sum of fat and carbohydrate. Check them. Give
    their unit. Then compare them with the Atwater factors.
  answer: |
    Call the weight on fat f and on carbohydrate c. Items A and B give two equations.

    ```working
    A: 10 times f plus 50 times c = 290
    B: 20 times f plus 30 times c = 300
    ```

    Double A, so that f carries 20 in both.

    ```working
    2 times 50 = 100
    2 times 290 = 580
    ```

    That gives 20 times f plus 100 times c = 580. Subtract B from it.

    ```working
    100 minus 30 = 70
    580 minus 300 = 280
    280 divided by 70 = 4
    ```

    So c is 4. Put it into A.

    ```working
    290 minus 50 times 4 = 90
    90 divided by 10 = 9
    ```

    So f is 9. Check item C, which you did not use.

    ```working
    9 times 5 plus 4 times 70 = 325
    ```

    It holds. The weights are 9 and 4 kilocalories a gram: kilocalories on the energy side,
    divided by grams on the other. They are the Atwater general factors for fat and carbohydrate
    (FAO 2003), which is what this made-up table was built from.
  refs: [fao_food_energy_2003]
- level: 5
  prompt: |
    Hall and colleagues (2012) write the energy balance equation as ES = EI − EO. Each term is an
    amount of energy per unit of time. ES is how fast the body's energy stores change. EI is the
    energy taken in. EO is the energy spent, which this book writes EE.

    Here are three made-up days, in kcal a day.

    ```table
    day  EI (kcal/day)  EO (kcal/day)  ES (kcal/day)
    1    2500           2400           100
    2    2000           2200           -200
    3    2300           2300           0
    ```

    Without using the equation, find weights that make the ES column a weighted sum of the EI
    and EO columns, and check them.
  answer: |
    Call the weights u on EI and v on EO. Days 1 and 2 give two equations.

    ```working
    day 1: 2500 times u plus 2400 times v = 100
    day 2: 2000 times u plus 2200 times v = -200
    ```

    Make u carry the same number in both: multiply day 1 by 4 and day 2 by 5.

    ```working
    4 times 2500 = 10000
    4 times 2400 = 9600
    4 times 100 = 400
    5 times 2000 = 10000
    5 times 2200 = 11000
    5 times -200 = -1000
    ```

    Subtract the first new equation from the second. The u terms cancel.

    ```working
    11000 minus 9600 = 1400
    -1000 minus 400 = -1400
    -1400 divided by 1400 = -1
    ```

    So v is minus 1. Put it into day 1.

    ```working
    100 plus 2400 = 2500
    2500 divided by 2500 = 1
    ```

    So u is 1. Check day 3.

    ```working
    1 times 2300 plus -1 times 2300 = 0
    ```

    It holds. The weights are 1 and minus 1, both without a unit, since all three columns are in
    kilocalories a day. That is Hall's equation: ES is EI minus EO, a weighted sum.
  refs: [hall_2012_ajcn]
- level: 6
  prompt: |
    A table lists foods. It gives protein, fat and carbohydrate in grams, and energy in
    kilocalories. The energy was worked out with the Atwater general factors. An analyst finds
    that a score equals 0.01 times energy on every row.

    Give two other sets of weights on the four columns (protein, fat, carbohydrate, energy) that
    give the same score on every row. Check both on the row with protein 10 g, fat 20 g,
    carbohydrate 60 g and energy 460 kcal.
  answer: |
    Energy is 4 times protein plus 9 times fat plus 4 times carbohydrate on every row (FAO
    2003). So 0.01 times energy is the same as 0.04 times protein, plus 0.09 times fat, plus 0.04
    times carbohydrate.

    ```working
    0.01 times 4 = 0.04
    0.01 times 9 = 0.09
    ```

    One set is (0.04, 0.09, 0.04, 0): all the weight on the grams. A second puts half on each:
    half of each gram weight, and half of 0.01 on energy.

    ```working
    0.04 divided by 2 = 0.02
    0.09 divided by 2 = 0.045
    0.01 divided by 2 = 0.005
    ```

    The second set is (0.02, 0.045, 0.02, 0.005). Check all three on the row given.

    ```working
    0.01 times 460 = 4.6
    0.04 times 10 plus 0.09 times 20 plus 0.04 times 60 = 4.6
    0.02 times 10 plus 0.045 times 20 plus 0.02 times 60 plus 0.005 times 460 = 4.6
    ```

    All three give 4.6. Any other split works too, so the table cannot choose between them.
  refs: [fao_food_energy_2003]
- level: 7
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
    a = (1, 2, 3, 5), b = (2, 1, 1, 1), y = (5, 4, 5, 9)
    row 1: 1 times u plus 2 times v = 5
    row 2: 2 times u plus 1 times v = 4
    from row 2, v = 4 minus 2 times u; into row 1: u plus 8 minus 4 times u = 5, so u = 1
    then v = 4 minus 2 = 2
    the weights 1 and 2 fit, so y is a weighted sum of a and b, y = a + 2b
    ```
  answer: |
    The last line broke. The weights were found from rows 1 and 2, and those two rows were then
    taken as proof. Rows used to find the weights will always fit them; that is how they were
    found. The check is the rows that were left over, and nobody looked at them.

    ```working
    row 3: 1 times 3 plus 2 times 1 = 5
    row 4: 1 times 5 plus 2 times 1 = 7
    ```

    Row 3 holds. Row 4 gives 7, and y has 9 there. So y is not a weighted sum of a and b.

    Why the wrong answer looks reasonable: the algebra is correct, and "the weights fit" sounds
    like a test that was passed. It was a test that could not fail.
- level: 8
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
    three made-up adults: (BMR 6.0, PAL 1.5, TEE 9.0), (6.0, 2.0, 12.0), (8.0, 1.5, 12.0), in MJ/day except PAL
    test TEE as u times BMR plus v times PAL plus w times the column of 1s
    solving the three rows gives u = 1.5, v = 6, w = -9
    check: 1.5 times 6.0 plus 6 times 1.5 minus 9 = 9.0, and the other two rows also hold
    so TEE is a weighted sum of BMR, PAL and the column of 1s
    ```
  answer: |
    The conclusion broke. Three weights were found from three rows, which left no row to check.
    The three rows will fit by construction, so the "check" repeats the rows used to solve.

    Add a fourth made-up adult with BMR 8.0 MJ/day and PAL 2.0. The report's relation, "BMR
    times PAL is equal to TEE" (FAO/WHO/UNU 2004), gives that adult's TEE.

    ```working
    8.0 times 2.0 = 16
    1.5 times 8.0 plus 6 times 2.0 minus 9 = 15
    ```

    The weights give 15, and the adult's TEE is 16. They fail at the first row beyond the ones
    used to find them. TEE is BMR times PAL, a product, which is not a weighted sum of BMR, PAL
    and 1s.

    Why the wrong answer looks reasonable: the solving is correct and every row "holds". With as
    many rows as weights, almost any column would have held.
  refs: [fao_who_unu_2004]
- level: 8
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
    a made-up label, per 100 g, printing energy as a whole number: protein 7.3 g, fat 11.6 g, carbohydrate 58.4 g, energy 367 kcal
    Atwater weighted sum: 4 times 7.3 plus 9 times 11.6 plus 4 times 58.4 = 367.2
    367.2 is not 367
    so energy is not a weighted sum of the grams, and it carries information of its own
    keep all four columns as separate predictors
    ```
  answer: |
    The fourth line broke. The label prints energy as a whole number, so 367.2 is printed as 367.
    A gap of 0.2 kcal is the rounding, not a column with information of its own.

    ```working
    4 times 7.3 plus 9 times 11.6 plus 4 times 58.4 = 367.2
    367.2 minus 367 = 0.2
    ```

    The gap is below the half a kilocalorie that rounding to a whole number can move a figure by.
    The energy is the Atwater sum of the grams (FAO 2003), rounded. It is redundant beside them,
    and the last line would put the same fact into a model twice.

    Why the wrong answer looks reasonable: the test was applied correctly, and a strict reading
    of it says one mismatch settles it. A mismatch smaller than the printing can show is not a
    mismatch.
  refs: [fao_food_energy_2003]
- level: 9
  prompt: |
    A study reports this, and says its energy intake was worked out from the grams with the
    Atwater factors.

    > With energy intake, protein and carbohydrate in the model, fat intake had no effect on
    > weight gain.

    Decide what to compute, compute it, and say what your answer does not establish.
  answer: |
    What to compute: whether fat is a weighted sum of energy, protein and carbohydrate in this
    table. Energy is 4 times protein plus 9 times fat plus 4 times carbohydrate (FAO 2003). Take 4
    times protein and 4 times carbohydrate away from energy, and divide by 9. So fat is the
    weighted sum of energy, protein and carbohydrate with weights 1/9, −4/9 and −4/9.

    Check it on a made-up day: energy 2000 kcal, protein 60 g, carbohydrate 260 g.

    ```working
    2000 minus 4 times 60 minus 4 times 260 = 720
    720 divided by 9 = 80
    4 times 60 plus 9 times 80 plus 4 times 260 = 2000
    ```

    Fat is 80 g, and the Atwater sum gives back the 2000 kcal. On every row, fat is fixed once
    the other three are known.

    So "fat, with energy, protein and carbohydrate held fixed" describes rows the table cannot
    contain. Whatever number the model printed for fat is one of infinitely many that fit the
    table equally well.

    What this does not establish. It does not show that fat has an effect on weight gain, and it
    does not show that it has none. The study's sentence says nothing about fat either way. To ask
    about fat, drop energy and keep protein, fat and carbohydrate. Then the weight on fat answers
    "fat, with protein and carbohydrate held fixed", which lets energy move with fat. Say that out
    loud, because it is a different question.
  refs: [fao_food_energy_2003]
- level: 10
  prompt: |
    A food composition table lists what is in each 100 grams of a food. Its notes say its
    carbohydrate is found "by difference". That is 100 minus water, protein, fat and ash, all in
    grams. A colleague says:

    > Then the carbohydrate column is redundant. Drop it; we lose nothing.

    Decide what to compute, compute it, and say what your answer does not establish.
  answer: |
    What to compute: whether carbohydrate is a weighted sum of the columns the table holds. By
    the table's own rule it is 100 times the column of 1s, plus −1 times each of water, protein,
    fat and ash. Check it on one made-up row: water 12 g, protein 10 g, fat 2 g, ash 1 g.

    ```working
    100 minus 12 minus 10 minus 2 minus 1 = 75
    ```

    75 g of carbohydrate. On every row where all four other columns are present, carbohydrate is
    fixed by them, with weights 100, −1, −1, −1 and −1. The colleague is right about the numbers:
    dropping it loses no value that cannot be written back in.

    But only if every subtracted column is in the table. Take a copy without ash, or without
    water. Its carbohydrate column is not a weighted sum of what is left. Dropping it then loses
    something.

    What this does not establish. It does not show that the carbohydrate figure is right. Every
    error in the water, protein, fat and ash columns lands in it, because it is what is left over.
    It does not show what the carbohydrate is made of. FAO's report says Atwater's carbohydrate
    "is determined by difference, and thus includes fibre", so a by-difference figure is not
    sugar and starch alone. And "we lose nothing" is true only for a reader who knows the rule.
    Write the rule down beside the table if you drop the column.
  refs: [fao_food_energy_2003]
retrieval_items:
- q: When is a column of a table a weighted sum of other columns?
  a: When fixed numbers, the weights, exist such that on every row the column equals the first
    weight times the first other column, plus the second weight times the second, and so on. The
    same weights must hold on every row.
- q: How do you test whether a column is a weighted sum of others?
  a: Treat the weights as unknowns, one equation per row. Find them from as many rows as there are
    weights, then check every leftover row. One failing row, or no solution, means it is not.
- q: Why can a table holding energy and all three macronutrients not say what energy does with
    the three held fixed?
  a: With Atwater energy, energy is 4 times protein plus 9 times fat plus 4 times carbohydrate on
    every row. It cannot move while the three stay fixed, so no such rows exist, and weight can be
    shifted between energy and the grams in infinitely many ways without changing any total.
