concept_id: S02-R1-C12
subject: S02
rung: 1
sequence: 12
name: A column that is a weighted sum of other columns
concept_type: derivable
clusters:
- measurement-inference
ground_floor_deps:
- B0-R0-C17
- B0-R0-C32
