must_know:
  - point: |
      The energy balance identity predicts nothing on its own. A prediction appears only when
      someone writes expenditure, and perhaps intake, as a rule in weight. When you read a
      projection built "on energy balance", find that rule. The prediction lives in it, and so
      does every assumption worth arguing about.
    kind: move
    bearing: methodological
    refs: [hall_2012_ajcn, thomas_2013_3500kcal]
  - point: |
      A curve that starts at the right weight is not thereby a solution. The static rule's
      straight line starts at the right weight. A year later it is wrong by more than 450
      kilocalories a day, once expenditure falls with weight. Check a claimed solution at the start
      and at a later time, on both sides of the equation.
    kind: trap
    bearing: methodological
  - point: |
      "Cut 480 kilocalories and you run a 480 deficit every day" is the static rule. In the
      equation the deficit is the whole right side, and it shrinks as the weight falls, because
      expenditure falls with it. Correct a trainee who carries the day-one deficit forward: the
      cut stays the same; the deficit does not.
    kind: misconception
    bearing: teaching
  - point: |
      When you step an equation forward, work the rate out again from the new state at every
      step. A rate worked out once and multiplied by the whole time is the static rule again,
      however the working is dressed.
    kind: move
    bearing: methodological
  - point: |
      Keep the units in step: ρ in kilocalories per kilogram and intake in kilocalories a day
      give kilograms a day. Put intake in megajoules against ρ in kilocalories and the rate
      comes out about 240 times too small, which no reader would catch by eye.
    kind: trap
    bearing: methodological
  - point: |
      This equation has one ρ and one straight-line slope. Polidori and colleagues call it a
      linearization, and Chow and Hall warn that ρ changes with body composition. Use it for the
      shape of a response and for modest changes. For one person's timetable over years, use a
      validated model, and say in writing which one you used.
    kind: boundary
    bearing: clinical
    refs: [polidori_2016, chow_hall_2008]
  - point: |
      When a paper reports intake "calculated" from repeated weighings, read it as the output of
      an equation. It moves with the ρ and the ε put in. Do not quote it as though someone
      measured what people ate.
    kind: consequence
    bearing: methodological
    refs: [polidori_2016]

exercises:
  - type: interpretation
    prompt: |
      Polidori and colleagues (2016) calculate a change in energy intake from repeated
      weighings with their Equation 1. The paper writes it with BW for body weight, and an i
      after a symbol marks the interval.

      ```working
      ΔEIi = ρ × (dBWi/dt) + ε × (BWi − BW0) + (Δδ divided by (1 − β)) × BW0 + UGE
      ```

      For each symbol, say what it stands for and its unit, as far as the paper tells you. Then
      say which two terms this section set to zero, and what setting each to zero assumes.
    answer: |
      Take the symbols from left to right.

      - ΔEIi: the change in energy intake from the start, in the interval i. Kilocalories a
        day.
      - ρ: rho, "the effective energy density associated with the body weight change".
        Kilocalories per kilogram.
      - dBWi/dt: the rate of change of body weight over the interval, worked out from the
        moving average of the weighings. Kilograms a day.
      - ε: epsilon, which "defined how energy expenditure depends on body weight". Kilocalories
        a day for each kilogram.
      - BWi − BW0: the weight in the interval minus the weight at the start. Kilograms.
      - Δδ: the change in physical activity. The paper says it is "often assumed to be zero"
        when there are no measurements of activity.
      - β: a constant of the model. The passages of the paper this book holds do not define it.
        Write "not defined in what I read" in your notebook rather than guessing.
      - UGE: urinary glucose excretion, the energy the drug made the body lose in urine. For it
        to be added to kilocalories a day, it has to be in kilocalories a day.

      Check the units of the first two terms on the right. Kilocalories per kilogram times
      kilograms a day is kilocalories a day. Kilocalories a day per kilogram times kilograms is
      kilocalories a day. Both match the left side.

      This section set the activity term and the glucose term to zero. Setting Δδ to zero
      assumes physical activity did not change. Setting UGE to zero assumes no energy was lost in
      urine, which is true for a person not taking a drug of this kind. What remains, rearranged,
      is ρ × dW/dt = ΔEI − ε × (W − W0).
    skill_ref: S02-R1-K01
  - type: teaching
    prompt: |
      A first-year resident has ten minutes and a whiteboard. They ask: "If energy in minus
      energy out is always true, why does the same diet give smaller losses each month?"
      Explain, with the equation, and expect them to want the mechanism.
    answer: |
      Start from what they already accept. Write the identity in rate form.

      ```working
      ρ × dW/dt = EI − EE
      ```

      It is always true, and it cannot predict tomorrow. Tomorrow's EE is not known today.

      Then add the one piece of physiology. A smaller body spends less. Draw expenditure as a
      straight line rising with weight, slope ε. Rewrite the right side as the cut in intake
      minus ε times the change in weight.

      ```working
      ρ × dW/dt = ΔEI − ε × (W − W0)
      ```

      Now point at the second term. On day one it is zero, so the whole cut is the deficit. As W
      falls below W0, the term takes a bite out of the deficit. The same cut buys a smaller
      deficit, so a slower loss.

      Put numbers in if they want them. Hall's 100 kg man cuts 480 kilocalories a day. With ε at
      20, once he is 10 kilograms down the fall in expenditure is 200 kilocalories a day. His
      deficit is then 280, not 480.

      Close with what the equation does not say. It does not say ε is 20 for this patient. It
      does not include appetite rising as weight falls. And it is a straight-line simplification.
    skill_ref: S02-R1-K02

quantitative: true
practice_note: |
  Sixteen problems. The technique has four moves that compose: reading a rate from a state,
  stepping forward, checking a candidate solution on both sides and at the start, and running
  the equation backwards for an input. Each move needs a mechanical problem and an applied
  one, and the two diagnostic kinds (a stale rate, a wrong sign, a unit slip, a wrong baseline)
  are distinct errors.
practice:
  - level: 1
    prompt: |
      A rule gives the rate of change of y as dy/dt = 6 − 0.5 × y. Work out the rate when y is
      4, when y is 12, and when y is 20.
    answer: |
      Put each value of y into the right side.

      ```working
      0.5 times 4 = 2
      6 minus 2 = 4
      0.5 times 12 = 6
      6 minus 6 = 0
      0.5 times 20 = 10
      6 minus 10 = -4
      ```

      The rates are 4, 0 and minus 4. The rate depends on where y is. Below 12, y rises. Above
      12, y falls.
  - level: 2
    prompt: |
      Say which of these are differential equations. For each one that is, say whether the rate
      depends on the state y, or on the time t alone.

      ```working
      (a)  y = 3t + 2
      (b)  dy/dt = 3t + 2
      (c)  dy/dt = −0.2 × y
      (d)  E = 4P + 9F + 4C
      ```
    answer: |
      A differential equation holds an unknown function and its derivative.

      (a) is not one. It gives y directly and holds no derivative.

      (b) is one. Its rate depends on t alone. An antiderivative of the right side solves it,
      which is the earlier section's move.

      (c) is one. Its rate depends on the state y. You cannot integrate the right side without
      already knowing y at every time, which is what you are looking for.

      (d) is not one. It is a weighted sum of three quantities, with no rate in it.

      Equations like (c) are the ones this section is about.
  - level: 2
    prompt: |
      Take dy/dt = 6 − 0.5 × y with y = 4 at t = 0. Take three forward steps of size 1. Give y at
      t = 1, 2 and 3.
    answer: |
      Each step: rate from the current y, then new y = old y + 1 × rate.

      ```working
      6 minus 0.5 times 4 = 4
      4 plus 4 = 8
      6 minus 0.5 times 8 = 2
      8 plus 2 = 10
      6 minus 0.5 times 10 = 1
      10 plus 1 = 11
      ```

      About 8 at t = 1, 10 at t = 2 and 11 at t = 3. Each step is smaller than the one before,
      because the rate falls as y rises.
  - level: 3
    prompt: |
      Take the initial-value problem dy/dt = 6 − 0.5 × y, with y = 4 at t = 0. Check whether
      y = 12 − 8 × e^(-0.5t) solves it. Then compare its value at t = 2 with the forward steps you would get
      from step size 1.
    answer: |
      The start first. At t = 0, e^(0) is 1.

      ```working
      12 minus 8 = 4
      ```

      The initial value holds.

      The left side. The derivative of e^(kt) is k × e^(kt), with k = −0.5 here.

      ```working
      dy/dt = −8 × (−0.5) × e^(-0.5t) = 4 × e^(-0.5t)
      ```

      The right side.

      ```working
      6 − 0.5 × (12 − 8 × e^(-0.5t)) = 6 − 6 + 4 × e^(-0.5t) = 4 × e^(-0.5t)
      ```

      The two sides match at every t, so the function solves the problem.

      At t = 2 the exponent is minus 1, and e^(-1) is 0.3679.

      ```working
      8 times 0.3679 = 2.9432
      12 minus 2.9432 = 9.0568
      ```

      About 9.06. Forward steps of size 1 give 10 at t = 2. The steps overshoot, because each
      holds the first rate of its step for the whole step while the true rate is falling.
  - level: 3
    prompt: |
      Three people offer a solution to dy/dt = 6 − 0.5 × y with y = 20 at t = 0.

      ```working
      (a)  y = 12 + 8 × e^(-0.5t)
      (b)  y = 20 − 4t
      (c)  y = 12 + 4 × e^(-0.5t)
      ```

      Which one solves the initial-value problem? Say what is wrong with each of the other two.
    answer: |
      Check each at t = 0, then on both sides.

      (a) At t = 0, 12 + 8 = 20. The start holds. The left side is −4 × e^(-0.5t). The right
      side is 6 − 6 − 4 × e^(-0.5t), the same. (a) solves it.

      (b) At t = 0, y = 20. The start holds. The left side is minus 4 at every t. The right side
      is 6 − 0.5 × (20 − 4t), which is −4 + 2t. The two agree only at t = 0. At t = 1:

      ```working
      20 minus 4 = 16
      0.5 times 16 = 8
      6 minus 8 = -2
      ```

      Minus 2 on the right against minus 4 on the left. (b) is not a solution.

      (c) The left side is −2 × e^(-0.5t). The right side is 6 − 6 − 2 × e^(-0.5t), the same, so
      it obeys the rule. But at t = 0 it gives 12 + 4 = 16, not 20. It is a solution of the
      equation and the wrong member of the family.
  - level: 4
    prompt: |
      Hall and Guo (2017) use a cut of 300 kilocalories a day from the diet. On the first day of
      the cut, the weight has not yet moved, so the whole cut is the deficit. With ρ = 7,716.18
      kilocalories per kilogram, the static rule's figure, work out dW/dt in kilograms a day and
      in kilograms a week.
    answer: |
      On day one, W equals W0, so the ε term is zero. The equation is 7,716.18 × dW/dt = −300.

      ```working
      300 divided by 7716.18 = 0.03888
      0.03888 times 7 = 0.27216
      ```

      dW/dt is about minus 0.0389 kilograms a day, or minus 0.272 kilograms a week.

      Check the unit. Kilocalories a day divided by kilocalories per kilogram leaves kilograms a
      day.

      This rate holds on day one only. Every later day, the weight is lower and the rate is
      smaller.
    refs: [hall_guo_2017]
  - level: 5
    prompt: |
      Same cut of 300 kilocalories a day, same ρ = 7,716.18 kilocalories per kilogram. Hall and
      Guo put the slope of expenditure against weight at 20 to 30 kilocalories a day per
      kilogram. A person, made up for this problem, is now 4 kilograms below their starting
      weight. Work out dW/dt at each end of that range.
    answer: |
      The equation is 7,716.18 × dW/dt = −300 − ε × (W − W0), with W − W0 = −4.

      With ε = 20:

      ```working
      20 times 4 = 80
      300 minus 80 = 220
      220 divided by 7716.18 = 0.02851
      ```

      With ε = 30:

      ```working
      30 times 4 = 120
      300 minus 120 = 180
      180 divided by 7716.18 = 0.02333
      ```

      About minus 0.0285 and minus 0.0233 kilograms a day. On day one it was minus 0.0389. Four
      kilograms in, the loss has slowed by a quarter to two-fifths, depending on ε. The range of
      ε is carried into the answer. It is not a rounding error to be smoothed away.
    refs: [hall_guo_2017]
  - level: 5
    prompt: |
      Polidori and colleagues computed dW/dt from weighings 52 days apart. A person, made up for
      this problem, weighed 98.0 kilograms at the start. They weighed 96.4 kilograms at one
      weighing and 95.8 kilograms at the next, 52 days later.

      Use ρ = 7,716.18 kilocalories per kilogram and ε = 30 kilocalories a day per kilogram,
      Polidori's round figure for the change in expenditure. Take W − W0 at the later weighing.
      Work out ΔEI with ρ × dW/dt = ΔEI − ε × (W − W0).
    answer: |
      The rate first, from the two weighings.

      ```working
      95.8 minus 96.4 = -0.6
      0.6 divided by 52 = 0.011538
      ```

      dW/dt is about minus 0.011538 kilograms a day. Now the change since the start.

      ```working
      98.0 minus 95.8 = 2.2
      ```

      W − W0 is minus 2.2 kilograms. Rearrange the equation for ΔEI by adding ε × (W − W0) to
      both sides.

      ```working
      ΔEI = ρ × dW/dt + ε × (W − W0)
      7716.18 times 0.011538 = 89.03
      30 times 2.2 = 66
      89.03 plus 66 = 155.03
      ```

      ΔEI is about minus 155 kilocalories a day. Both terms are negative here. The weight is
      still falling, and it is below the start.
    refs: [polidori_2016]
  - level: 6
    prompt: |
      Polidori and colleagues describe a commercial weight-loss programme. "After 1 year, the
      average energy intake was practically at baseline levels while body weight was still
      reduced by ~5 kg."

      Take ΔEI = 0 and W − W0 = −5 kilograms. Use ρ = 7,716.18 kilocalories per kilogram and ε at
      each end of Hall and Guo's 20 to 30 kilocalories a day per kilogram. Work out dW/dt, and
      the change over the next 30 days if it held. Say which way the weight is heading.
    answer: |
      The right side is 0 − ε × (−5), which is plus 5 × ε.

      With ε = 20:

      ```working
      20 times 5 = 100
      100 divided by 7716.18 = 0.012960
      0.012960 times 30 = 0.3888
      ```

      With ε = 30:

      ```working
      30 times 5 = 150
      150 divided by 7716.18 = 0.019440
      0.019440 times 30 = 0.5832
      ```

      dW/dt is plus 0.013 to plus 0.019 kilograms a day. Over 30 days that is about 0.39 to 0.58
      kilograms, if the rate held. It will not quite hold: as the weight rises the bracket
      shrinks and the rate falls. The weight is heading back up.

      The paper describes this course as a plateau "followed by slow weight regain". The
      equation gives the same direction, from intake alone and the lower expenditure of a
      smaller body. Nobody's effort appears anywhere in it.
    refs: [polidori_2016, hall_guo_2017]
  - level: 6
    prompt: |
      Hall and colleagues' 100 kg man cuts intake by 480 kilocalories a day. Use ρ = 7,716.18
      kilocalories per kilogram and ε = 20 kilocalories a day per kilogram. Take three forward
      steps of 30 days each, and give his weight at day 90. Then give the static rule's weight
      at day 90, which is 100 − 480 × 90 / 7,716.18.
    answer: |
      Step 1, from day 0. The bracket is zero.

      ```working
      480 divided by 7716.18 = 0.062207
      0.062207 times 30 = 1.86621
      100 minus 1.86621 = 98.13379
      ```

      Step 2, from 98.13379. The weight is 1.86621 below the start.

      ```working
      20 times 1.86621 = 37.3242
      480 minus 37.3242 = 442.6758
      442.6758 divided by 7716.18 = 0.057370
      0.057370 times 30 = 1.7211
      98.13379 minus 1.7211 = 96.41269
      ```

      Step 3, from 96.41269. The weight is 3.58731 below the start.

      ```working
      20 times 3.58731 = 71.7462
      480 minus 71.7462 = 408.2538
      408.2538 divided by 7716.18 = 0.052909
      0.052909 times 30 = 1.58727
      96.41269 minus 1.58727 = 94.82542
      ```

      About 94.83 kilograms at day 90. The static rule:

      ```working
      480 times 90 = 43200
      43200 divided by 7716.18 = 5.5986
      100 minus 5.5986 = 94.4014
      ```

      About 94.40 kilograms. The two differ by about 0.4 kilograms at 90 days, and the gap
      widens every month after. The curve formula from the illustration gives 95.01 at day 90.
      Thirty-day steps are coarse enough to fall a little short of it.
    refs: [hall_2011_lancet, hall_guo_2017]
  - level: 7
    prompt: |
      Here is a worked answer. Find the step that broke.

      ```working
      the man's equation is 7716.18 × dW/dt = −480 − 20 × (W − 100), starting at 100 kg
      on day 0, W − 100 is 0, so dW/dt = −480 / 7716.18 = −0.062207 kg a day
      over 90 days: 0.062207 × 90 = 5.5986 kg
      so the equation predicts 100 − 5.5986 = 94.40 kg at day 90
      ```
    answer: |
      The step that broke is the third. It takes the rate from day 0 and uses it for all 90
      days. The equation gives a new rate every day from that day's weight. By day 30 the weight
      is lower, so the ε term is no longer zero, and the rate is smaller.

      Stepping properly, as in the problem above with 30-day steps, gives about 94.83
      kilograms. The curve formula gives 95.01.

      Why the wrong answer looks reasonable. Lines one and two are correct. The day-0 rate is
      right. The error is to treat a rate at an instant as a rate for the whole stretch. That
      turns the model back into the static rule, which is exactly what 94.40 is.
  - level: 7
    prompt: |
      Here is a worked answer. Find the step that broke.

      ```working
      a person cuts intake by 300 kcal a day; ρ = 7716.18 kcal/kg; ε = 20
      model: ρ × dW/dt = ΔEI + ε × (W − W0)
      4 kg below the start: −300 + 20 × (−4) = −380
      dW/dt = −380 / 7716.18 = −0.04925 kg a day
      so at 4 kg down the loss has sped up from 0.0389 to 0.0492 kg a day
      ```
    answer: |
      The step that broke is the second: the sign in front of ε. The model should read
      ρ × dW/dt = ΔEI − ε × (W − W0).

      Test it with the physiology. When W is below W0, the body is smaller, so expenditure is
      lower. Lower expenditure means less going out, so the deficit should shrink, not grow.
      With the minus sign:

      ```working
      20 times 4 = 80
      300 minus 80 = 220
      220 divided by 7716.18 = 0.02851
      ```

      The rate is minus 0.0285 kilograms a day, slower than the day-one 0.0389, as it should be.

      Why the wrong answer looks reasonable. Every line after the second is correct arithmetic.
      A plus and a minus look alike in a methods section. The quick check is the direction: a
      model in which losing weight makes you lose faster runs away, and nobody's weight does
      that.
  - level: 8
    prompt: |
      Here is a worked answer. Find the step that broke.

      ```working
      Hall's man cuts intake by 2 MJ a day
      ρ = 7716.18 kcal per kg
      day one: dW/dt = −2 / 7716.18 = −0.000259 kg a day
      over a year: 0.000259 × 365 = 0.0946 kg
      so the cut barely moves his weight
      ```
    answer: |
      The step that broke is the third. It divides megajoules by kilocalories per kilogram. The
      units do not cancel to kilograms.

      Convert the cut first. The paper gives it as 480 kilocalories a day.

      ```working
      480 divided by 7716.18 = 0.062207
      ```

      Minus 0.0622 kilograms a day on day one, about 240 times the wrong figure.

      Why the wrong answer looks reasonable. Every line is correct arithmetic, and a small
      number after a division feels plausible. A unit check on line three catches it:
      megajoules a day divided by kilocalories per kilogram is not kilograms a day. So does a
      size check. A cut of about a fifth of a day's food moving weight by 95 grams in a year
      should stop anyone.
  - level: 8
    prompt: |
      Here is a worked answer to the Polidori-style problem at level 5. The person weighed 98.0
      kilograms at the start, then 96.4 and 95.8 kilograms at weighings 52 days apart. Take
      ρ = 7,716.18 and ε = 30. Find the step that broke.

      ```working
      dW/dt = (95.8 − 96.4) / 52 = −0.011538 kg a day
      W − W0 = 95.8 − 96.4 = −0.6 kg
      ΔEI = 7716.18 × (−0.011538) + 30 × (−0.6) = −89.03 − 18 = −107.03 kcal a day
      ```
    answer: |
      The step that broke is the second. W0 is the weight at the start of the study, 98.0
      kilograms, not the weight at the previous weighing. The ε term is about how far
      expenditure has fallen since the start. That depends on the whole loss so far, not on the
      last 52 days.

      ```working
      98.0 minus 95.8 = 2.2
      30 times 2.2 = 66
      89.03 plus 66 = 155.03
      ```

      ΔEI is about minus 155 kilocalories a day, not minus 107.

      Why the wrong answer looks reasonable. The first line correctly uses the two latest
      weighings for the rate. Using the same two weighings for the change looks consistent. It
      mixes up two quantities: the rate is recent, and the change is since the start.
  - level: 9
    prompt: |
      A commentator writes: "Energy balance is only an accounting identity. Any weight
      prediction built on it is circular, because it just restates that calories in minus
      calories out equals the change in stores." The commentator is made up for this problem.

      Decide what to compute, compute it, and say what your answer does not establish.
    answer: |
      What to compute: whether the prediction comes from the identity or from something added
      to it. Take Hall's man, cutting 480 kilocalories a day, with ρ = 7,716.18. Work out his
      rate when he is 4 kilograms down, under three rules for expenditure.

      ε = 0, expenditure ignores weight:

      ```working
      480 divided by 7716.18 = 0.06221
      ```

      ε = 20:

      ```working
      20 times 4 = 80
      480 minus 80 = 400
      400 divided by 7716.18 = 0.05184
      ```

      ε = 30:

      ```working
      30 times 4 = 120
      480 minus 120 = 360
      360 divided by 7716.18 = 0.04666
      ```

      Three different rates, all obeying the same identity. So the commentator is half right.
      The identity alone predicts nothing. The prediction comes from the rule for expenditure
      that was added, and that rule is a claim about bodies, open to test. Nothing about it is
      circular.

      What this does not establish. It does not show which ε is right, or that one straight
      line fits expenditure across a large loss. It does not show that ρ is constant; Chow and
      Hall say it need not be. And it says nothing about why intake or expenditure changed. Hall
      and Guo make that point about the identity itself.
    refs: [hall_2011_lancet, hall_guo_2017, chow_hall_2008]
  - level: 10
    prompt: |
      A review sentence reads: "Polidori and colleagues measured how much people's eating
      changed, using weights taken 52 days apart." The review is made up for this problem; the
      paper is real.

      Decide what to compute, compute it, and say what your answer does not establish.
    answer: |
      What to compute: whether the number depends on anything besides the weighings. Use the
      made-up person from the Polidori-style problem at level 5: dW/dt = −0.011538 kilograms a day and W − W0 =
      −2.2 kilograms. Compute ΔEI = ρ × dW/dt + ε × (W − W0) three ways.

      ρ = 7,716.18 and ε = 30, as before:

      ```working
      7716.18 times 0.011538 = 89.03
      30 times 2.2 = 66
      89.03 plus 66 = 155.03
      ```

      ρ = 7,716.18 and ε = 20:

      ```working
      20 times 2.2 = 44
      89.03 plus 44 = 133.03
      ```

      ρ taken as the energy of body fat, 39.5 megajoules a kilogram (Book 1), which is 9,440.73
      kilocalories, with ε = 30:

      ```working
      39500 divided by 4.184 = 9440.73
      9440.73 times 0.011538 = 108.93
      108.93 plus 66 = 174.93
      ```

      The same two weighings give minus 133, minus 155 or minus 175 kilocalories a day. So the
      intake figure is calculated through a model, and it moves with the model's constants. The
      paper's own word is "calculated".

      What this does not establish. It does not show that Polidori's figures are wrong. Their ρ
      and ε come from a model built on controlled feeding studies, not from these stand-ins. It
      does not tell you any one person's intake; the paper "restricted our analysis to the group
      mean". And it assumes activity did not change. The paper puts the bias from that at
      "<40 kcal/day when studying >100 individuals". Say "calculated", and name the model.
    refs: [polidori_2016, hall_2011_lancet]

retrieval_items:
  - q: What turns the energy balance identity into a differential equation?
    a: Writing expenditure, and where the model says so intake, as a function of weight, so
      that the right side gives the rate from the current weight.
  - q: How do you check that a function solves an initial-value problem?
    a: Put it and its derivative into the equation and show the two sides agree at every time,
      and check that it takes the stated initial value.
  - q: What is one forward step of a differential equation?
    a: Work out the rate from the current state, then add the step length times that rate to the
      state. The next step starts again from the new state.
  - q: Why is the static rule's straight line not a solution of ρ × dW/dt = ΔEI − ε × (W − W0)
      when ε is above zero?
    a: Its left side stays at ΔEI for ever, while the right side shrinks as W falls, so the two
      sides agree only at the start. It is a solution only when ε is zero.

