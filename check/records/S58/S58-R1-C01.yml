simplified_explanation: |
  A research paper reports one study. Most medical journals want it in the same four parts, in
  the same order.

  The introduction says why the study was needed and what question it asked. The methods say
  what was done, so that someone else could check it or do it again. The results say what was
  found. The discussion says what the findings mean, and where they stop.

  Before these four come a title and an abstract, a short summary of the whole paper. After them
  comes the list of references, the sources the paper leans on.

  The four-part shape has a name, IMRAD, from the first letters of the parts. It is a habit that
  editors spread in the twentieth century, not a rule of nature. So the journal you send your
  paper to has the last word on its shape.
illustrations:
- body: |
    Here is the opening of a draft paper. It is made up for this section, but both of its faults
    are common. The study measured women aged 15 to 49 who came to one urban health centre. Read
    each sentence and ask which question it answers for a reader: why the study was done, how it
    was done, what was found, or what it means.

    > **Introduction.** (1) Overweight and obesity are common among Indian women: in the fifth
    > National Family Health Survey (NFHS-5, 2019-21), {{n:nfhs5_women_ow_ob_pct}} per cent of
    > women aged 15-49 had overweight or obesity, against {{n:nfhs4_women_ow_ob_pct}} per cent in
    > the fourth (2015-16). (2) A national figure does not tell a health centre how many of the
    > women it serves are affected. (3) In our survey, 31 per cent of the women had overweight or
    > obesity. (4) We set out to estimate the share of women aged 15-49 attending the centre who have
    > overweight or obesity.
    >
    > **Methods.** (5) We weighed and measured consecutive women attending the centre. (6) Of the
    > 412 women approached, 380 agreed to be measured.

    The numbers in sentences 3 and 6 are made up. The two survey figures in sentence 1 are real.

    Start with sentence 3. It is a finding of this study, sitting in the introduction. ICMJE's
    Recommendations say the introduction should not "include data or conclusions from the work
    being reported". A reader who meets 31 per cent here has not yet been told how it was measured.
    So they cannot judge it, and they will meet it again in the results. Move it to the results.

    Now sentence 6. It reads like method, because it is about how the women were found. But you
    learnt 412 and 380 only by doing the study. The Recommendations put everything obtained during
    the study in the results; the methods hold only what was known when the protocol, the study's
    written plan, was drawn up.
    So the methods say how women were approached. The count of who agreed goes to the results.

    Then label the four that stay. Sentence 1 is context. Sentence 2 is the gap, what is not yet
    known. Sentence 4 is the purpose. Sentence 5 is method. Each now answers the question its
    section exists to answer, and a reader who goes to one section looks in the right place.
  analogy_breaks_when: |
    Each misplaced sentence here has one plain home. A real draft often runs a known fact and the
    study's own number into one sentence. Or it joins a result and what you think it means: the
    number goes to the results, the reading to the discussion. Split it first, then send each half
    to its section.

    The pattern is for original research. A case report (the account of one or a few patients),
    a narrative review (a summary of published work on a topic) or an editorial (a journal's
    opinion piece) has its own shape, and in every case the instructions of the journal you have chosen win over this pattern.
  numbers:
  - value: "{{n:nfhs5_women_ow_ob_pct}}"
    unit: per cent of women aged 15-49 overweight or obese, NFHS-5 (2019-21), India
    citekey: nfhs5_india_factsheet
    quote: "88. Women who are overweight or obese (BMI ≥25.0 kg/m2)21 (%) 33.2  19.7  24.0  20.6"
