must_know:
- point: |
    Before you draft, open the instructions for authors of the journal you are aiming at. Note its
    article types, its abstract format and its word limits.
  kind: move
  bearing: methodological
  refs: [icmje_2026_manuscript_preparation]
- point: |
    The two commonest misplacements are your own result in the introduction and a number you
    obtained during the study in the methods. A reader who meets a result before its method
    cannot judge it.
  kind: trap
  bearing: methodological
  refs: [icmje_2026_manuscript_preparation]
- point: |
    "Papers have always been written this way" is wrong. In four leading medical journals the IMRAD
    structure was absent in 1935. ICMJE calls it a reflection of how discovery works. Neither makes it
    a rule for every kind of article.
  kind: misconception
  bearing: teaching
  refs: [sollaci_pereira_2004_imrad, icmje_2026_manuscript_preparation]
- point: |
    Do not force a case report, a narrative review or an editorial into the four parts. ICMJE says
    such articles may be less structured or unstructured, and that a meta-analysis (a pooling of
    the results of several studies) may need a different format.
  kind: boundary
  bearing: methodological
  refs: [icmje_2026_manuscript_preparation]
- point: |
    Readers jump to the section where they expect to find a thing. So put it there.
  kind: consequence
  bearing: methodological
  refs: [sollaci_pereira_2004_imrad]
- point: |
    The four parts tell you where each kind of sentence goes. They do not tell you what the paper
    claims, or whether the data carry that claim.
  kind: boundary
  bearing: methodological
- point: |
    When you turn a thesis chapter into a paper, read the journal's instructions afresh.
  kind: india_deviation
  bearing: methodological
common_misreading: |
  It is tempting to read the IMRAD order as the order in which to write: introduction first, then
  methods, then results, then discussion. It is the order in which a reader looks things up.
  ICMJE's Recommendations say which section holds what, and nothing about which to write first.
  Mensh and Kording, who wrote ten simple rules for structuring papers, suggest starting
  elsewhere: build the outline around a description of each result. Those descriptions can become the headings of your results section.
exercises:
- type: retrieval
  prompt: |
    From memory, name the four sections of an original research article in the IMRAD structure,
    and the question each one answers for a reader. Then name the three parts that sit around
    them.
  answer: |
    Introduction: why was the study done, and what did it set out to find? It gives the context
    and states the purpose or hypothesis.

    Methods: how was it done? Enough detail for others with the data to reproduce the results,
    and only what was known when the protocol was written.

    Results: what was found? The findings in logical order, the most important first.

    Discussion: what does it mean, and where does it stop? The main findings, set among the other
    evidence, with the study's limitations and what follows from it.

    Around them: the title page with the title, the abstract, and the list of references.
  confidence_first: true
- type: critique
  prompt: |
    A colleague's draft has these four sentences in its methods section. The numbers are made up.

    > \(a) Adults aged 30 and over who came to the diabetes and blood pressure clinic on Mondays
    > were eligible. (b) Waist was measured with a tape that does not stretch, at the level set in
    > the protocol. (c) Of 260 adults who were eligible, 214 were measured. The rest said no or left
    > first. (d) Waist was above the clinic's cut-off in 58 per cent of those measured, more than we
    > expected.

    Say which sentences belong in the methods, where the others go, and why.
  answer: |
    Sentences (a) and (b) belong. Who was eligible and how waist was measured were both fixed when
    the protocol was written.

    Sentence (c) goes to the results. You learn that 214 of the 260 were measured only by doing the
    study. The Recommendations put everything obtained during the study in the results. The
    methods may say how adults were approached; the count of who took part is a result.

    Sentence (d) splits. "Waist was above the clinic's cut-off in 58 per cent of those measured"
    is a finding and goes to the results. The words "more than we expected" are
    interpretation and go to the discussion, where they need a reason: expected from what?
- type: teaching
  prompt: |
    For a first-year resident, ten minutes with a whiteboard. She asks why journals insist on
    four fixed sections when a paper would read better as a story. Answer her, and tell her the
    kinds of article that need not use the four sections.
  answer: |
    Start with how papers are read. Most readers do not go from start to finish. They read the
    title and abstract, then jump to the part they want. They go to the methods to judge how it was
    done, and to the results for the numbers.

    Mensh and Kording note that the title, abstract and figures are
    seen by far more people than the rest. The methods are read least of all. The four fixed
    sections let each reader find their part. Editors, by one account, pushed the structure to
    help readers and reviewers.

    Then the history, so she does not mistake it for a law. In four leading medical journals it
    was absent in 1935 and became the only pattern by the 1980s. It is a convention, and a useful
    one.

    Draw the four boxes and write one question in each: why, how, what was found, what it means.
    Tell her a sentence belongs where its question is.

    Then the exceptions. A case report, a narrative review or an editorial need not follow it. A
    meta-analysis may need a different format. The journal's own instructions for her article type
    decide.
retrieval_items:
- q: What does ICMJE say the methods section of an original article should and should not hold?
  a: Enough detail for others with the data to reproduce the results, and only what was known when the protocol was written; everything obtained during the study goes in the results.
- q: When did the IMRAD structure become the only pattern for original articles in the four journals Sollaci and Pereira studied?
  a: In the 1980s. None of their sampled original articles used it in 1935; it passed 80 per cent in the 1970s.
- q: Who decides the final format of your paper?
  a: The journal you send it to, through its instructions for authors; ICMJE tells authors to use the abstract format their chosen journal specifies.
