- body: |
    You will hear that papers have always been written in these four parts. Check it.

    Open Sollaci and Pereira's survey of the structure, free to read at
    https://pmc.ncbi.nlm.nih.gov/articles/PMC442179/. Read the Methods first. They took one issue
    in every ten of four leading journals of internal medicine: the British Medical Journal, the
    Journal of the American Medical Association (JAMA), The Lancet and the New England Journal of Medicine. They
    looked every five years from 1935 to 1985, and counted 1,297 original articles.

    Now read the first paragraph of the Results and write down each share the text states. In 1935
    they found no article in the four-part structure: 0 per cent. By 1955 the share had reached 20 per cent. By
    the 1970s it was over 80 per cent. Then read the next paragraph: the last two journals fully
    adopted it in 1985. So by 1985 every original article in the four journals used it: 100 per
    cent.

    So the claim fails. The structure that looks permanent became the usual one in these journals
    only in the 1970s. The Discussion says why it may have spread. Editors pushed for it, to help readers
    and reviewers. And readers do not read a paper from start to finish; they jump to the section
    where they expect to find what they want.

    That last reason is the one to keep. A reader who wants your sample size goes to the methods.
    A reader who wants your main number goes to the results. Put each thing where they will look.
  analogy_breaks_when: |
    These are four journals of internal medicine, counted every five years. The authors
    themselves warn against extending their findings to other journals. The year-by-year shares are in the paper's
    own figure, which is a picture and is not used here; only the shares its text states are.
  numbers:
  - value: "1,297"
    unit: original articles examined in four journals, 1935-1985
    citekey: sollaci_pereira_2004_imrad
    quote: "A total of 1,297 original articles—all those from each selected issue—were examined"
  - value: "20"
    unit: per cent of original articles in the IMRAD structure, 1955, four journals pooled
    citekey: sollaci_pereira_2004_imrad
    quote: "During the first 20 years, from 1935 to 1955, the pace of IMRAD increments was slow, from none to 20%."
  - value: "80"
    unit: per cent of original articles in the IMRAD structure, the 1970s, four journals
    citekey: sollaci_pereira_2004_imrad
    quote: "Thereafter, a pronounced increase can be observed until the 1970s, when it reached over 80%."
  - value: "100"
    unit: per cent of original articles in the IMRAD structure, 1985, four journals
    citekey: sollaci_pereira_2004_imrad
    quote: "Data collection began at 1960, moving forward and backward from that year until the frequency of IMRAD articles reached 100% and none respectively."
    derived: "the Methods sentence states the 100% at which counting forward stopped; the Results give its year: 'and *JAMA* and *The Lancet* in 1985.', the other two journals having fully adopted the structure in 1975 and 1980"
