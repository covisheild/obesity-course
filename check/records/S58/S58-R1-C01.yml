definition:
  text: |
    An original research article is a journal paper that reports a study for the first time. The
    International Committee of Medical Journal Editors (ICMJE) is a group of medical journal
    editors. Its Recommendations, updated January 2026, say the text of such an article is
    usually divided into Introduction, Methods, Results and Discussion (IMRAD).

    Around the text sit a title page, which carries the title; an abstract; and a numbered list of
    references.

    IMRAD is a convention that editors adopted, not a fixed law of science. In four leading
    journals of internal medicine it was absent from original articles in 1935, reached 80 per
    cent of them in the 1970s, and was the only pattern by the 1980s (Sollaci and Pereira, 2004).
