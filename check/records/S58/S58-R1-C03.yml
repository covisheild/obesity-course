concept_id: S58-R1-C03
subject: S58
rung: 1
sequence: 3
name: "The one message: your argument in one or two sentences, written first"
concept_type: derivable
clusters:
- craft-and-integrity
- evidence-to-action
ground_floor_deps: []
concept_deps:
- S58-R1-C01
- S58-R1-C02
definition:
  text: |
    A paper's one message is its central claim, stated in one or two sentences: what the study
    found, and why that matters.

    The message is written before the draft, and it is a test. It passes only if it is a claim,
    which would be false had the data come out differently, and if it answers the reader's "so
    what?".

    The title is the message in its shortest form. The abstract is the argument in small: the
    context, the gap, what was done, the main result, and what it means.
