simplified_explanation: |
  Before you write the paper, write one or two sentences that say what you found and why it
  matters. That is your one message.

  Test it two ways. First, would the sentence be false if your data had come out differently? If
  not, it says nothing yet. Second, does it answer "so what?" for someone who reads only that
  sentence? That is, does it say what the finding changes for someone: a programme, a clinician,
  the next study?

  The abstract is the message with its reasons: what was known, what was missing, what you did,
  what you found, and what it means. Check that the title, the abstract and the paper all say the
  same thing.
illustrations:
- body: |
    Take the running case of this book: the National Family Health Survey's figures for adults with
    overweight or obesity, in the fourth round (NFHS-4, 2015-16) and the fifth (NFHS-5, 2019-21).
    Try to write its one message. Here are three attempts, each made up for this section. Test each
    one by asking: would this sentence be false if the data had come out the other way?

    > (1) This paper is about overweight and obesity in Indian adults, using NFHS data.

    True whatever the data showed. It names a topic and claims nothing. A reader who stops here
    learns what you looked at, not what you found.

    > (2) We report the share of adults with overweight or obesity by sex, by urban and rural residence,
    > and in two survey rounds.

    Still true whatever the data showed. It is a list of contents. Five findings may be hiding in
    it, and the reader is not told which one the paper is for.

    > (3) Between 2015-16 and 2019-21, the share of Indian adults aged 15-49 with overweight or
    > obesity rose in women and in men, to about one woman in four and more than one man in five.

    This one could be false. Had the share fallen, the sentence would be wrong, so it says
    something. Check its two size phrases against the figures, {{n:nfhs5_women_ow_ob_pct}} per cent
    of women and {{n:nfhs5_men_ow_ob_pct}} per cent of men.

    ```working
    1 divided by 4 = 0.25, which is 25 per cent
    1 divided by 5 = 0.2, which is 20 per cent
    ```

    {{n:nfhs5_women_ow_ob_pct}} per cent is close to 25, so "about one woman in four" holds.
    {{n:nfhs5_men_ow_ob_pct}} per cent is above 20, so "more than one man in five" holds.

    Now the "so what?" test: does the message say what the finding changes for someone? The size
    phrases say how big the rise is, not what it changes. So add a second sentence.

    > So a programme that planned its reach on the 2015-16 shares would now plan for too few people.

    With it, attempt 3 passes both tests.

    Last, say what the message does not claim. It covers ages 15 to 49 only. Its women's figures
    leave out pregnant women and women who gave birth in the previous two months. It counts
    overweight and obesity together. And it shows that the share rose, not why it rose. Do not let
    the title or the abstract claim more.
  analogy_breaks_when: |
    This case has a thin gap: anyone can read the two columns of the fact sheet. A real paper's
    message reports something nobody had measured, and its "so what?" usually needs a sentence of
    its own. The test is the same.

    The figures hold for India as a whole, for adults aged 15-49, in the two rounds named.
  numbers:
  - value: "{{n:nfhs5_women_ow_ob_pct}}"
    unit: per cent of women aged 15-49 overweight or obese, NFHS-5 (2019-21), India
    citekey: nfhs5_india_factsheet
    quote: "88. Women who are overweight or obese (BMI ≥25.0 kg/m2)21 (%) 33.2  19.7  24.0  20.6"
  - value: "{{n:nfhs5_men_ow_ob_pct}}"
    unit: per cent of men aged 15-49 overweight or obese, NFHS-5 (2019-21), India
    citekey: nfhs5_india_factsheet
    quote: "89. Men who are overweight or obese (BMI ≥25.0 kg/m2) (%) 29.8  19.3  22.9  18.9"
- body: |
    Now build the title and the abstract from that message, and check them against each other.

    Start with a title that fails: "NFHS-5 and overweight". It names a topic, not a finding. It
    also opens on an abbreviation, which the Recommendations of the International Committee of
    Medical Journal Editors (ICMJE) ask authors to keep out of a title.
    A searcher who types "National Family Health Survey" may not find it.

    Cut the message down instead, keeping the finding and the words a searcher would use.

    > Overweight and obesity rose among women and men aged 15-49 in India between 2015-16 and
    > 2019-21: a comparison of two National Family Health Surveys

    The part after the colon names the design, which some journals require. Suppose your journal
    also wants a short title of no more than 40 characters, letters and spaces both counted. Try
    "Overweight and obesity rose, ages 15-49" and count it; the comma, digits and hyphen count too.

    ```working
    10 plus 3 plus 7 plus 5 plus 4 plus 5 = 34 characters without spaces
    34 plus 5 spaces = 39 characters
    ```

    It fits, and it still carries the finding and the age range.

    Then the abstract, one sentence for each part of the argument.

    > The National Family Health Survey reports the share of women and men aged 15-49 with
    > overweight or obesity [context]. The fifth round's India fact sheet prints the fourth round's
    > figures beside its own but does not state the change [gap]. We compared the two rounds for
    > each sex [what was done]. The share rose from {{n:nfhs4_women_ow_ob_pct}} to
    > {{n:nfhs5_women_ow_ob_pct}} per cent in women and from {{n:nfhs4_men_ow_ob_pct}} to
    > {{n:nfhs5_men_ow_ob_pct}} per cent in men, by {{n:nfhs5_women_ow_ob_change_pp}} and
    > {{n:nfhs5_men_ow_ob_change_pp}} percentage points [result]. So a programme that planned its
    > reach on the 2015-16 shares would now plan for too few people; the surveys show the rise, not
    > its cause [meaning].

    The labels in square brackets are there to show the parts; a real abstract leaves them out, or
    uses the headings its journal asks for.

    Last, the check that catches the commonest fault. Suppose your first draft of the abstract said
    "by 3.6 percentage points in women", written before you redid the subtraction. That 3.6 is
    planted here; the results give {{n:nfhs5_women_ow_ob_change_pp}}. ICMJE notes that information
    in abstracts often differs from that in the text. So list every number in the title and
    abstract, find each one in the results, and make them agree before anyone else reads the draft.
  analogy_breaks_when: |
    A five-sentence abstract fits this small case. A journal may ask for set headings and a word
    limit, and then its format wins; the parts of the argument stay the same.

    Counting characters by hand works for a short title. For a long one, let the word processor
    count, and check whether your journal counts spaces.
  numbers:
  - value: "40"
    unit: characters, the usual upper limit for a short title where a journal requires one, letters and spaces counted
    citekey: icmje_2026_manuscript_preparation
    quote: "Some journals require a short title, usually no more than 40 characters (including letters and spaces)"
figure_note: "The section's work is writing one sentence and fitting a title and an abstract to it; a chart would carry no number the prose does not, and would teach nothing more."
must_know:
- point: |
    Write your one message before you draft any section. If you cannot write it, you are not ready
    to draft.
  kind: move
  bearing: methodological
  refs: [mensh_kording_2017_structuring_papers]
- point: |
    "This study is about..." is a topic, not a message.
  kind: trap
  bearing: methodological
- point: |
    Make the title the message in its shortest form, with no abbreviations, which ICMJE's
    Recommendations ask authors to avoid there.
  kind: move
  bearing: methodological
  refs: [icmje_2026_manuscript_preparation]
- point: |
    Before anyone else reads your draft, list every number in the title and abstract and find each
    one in the results.
  kind: trap
  bearing: methodological
  refs: [icmje_2026_manuscript_preparation]
- point: |
    Mensh and Kording apply this rule, one of their first four, to grants and posters too. In this
    book, carry the same message into the talk and the answer to a journalist as well.
  kind: consequence
  bearing: public
  refs: [mensh_kording_2017_structuring_papers]
- point: |
    A clear message is not a true one. Writing the message does not test whether the data carry
    it. Check that separately, and if they carry less, cut the message to fit them.
  kind: boundary
  bearing: methodological
  refs: [mensh_kording_2017_structuring_papers]
common_misreading: |
  "One message" can be read as "report one result and drop the rest". That reading is wrong.
  ICMJE's Recommendations ask for data on every main and secondary outcome named in the methods.
  Mensh and Kording allow one contribution to have several parts. The one message decides what
  the paper is for. The other results stay in, each placed where it supports the message or marks
  a limit on it.
reporting_sentence: |
  Between 2015-16 and 2019-21, the share of Indian adults aged 15-49 with overweight or obesity
  rose in women and in men. By 2019-21 it was about one woman in four and more than one man in
  five. The two surveys show the rise, not its cause.
exercises:
- type: retrieval
  prompt: |
    From memory: what are the two tests a one-message sentence must pass? And what are the parts
    of an abstract's argument, in order?
  answer: |
    First, it must be a claim: it would be false had the data come out differently. Second, it
    must answer "so what?" for a reader told only that sentence.

    The abstract: the context, the gap, what was done, the main result, and what it means.
  confidence_first: true
- type: critique
  prompt: |
    Three residents offer the one message of their theses. All three are made up. Say which is a
    message, what is wrong with the other two, and what the message does not show.

    > (a) This thesis studies waist and body mass index in adults who come to a rural health centre.

    > (b) We measured waist, body mass index, blood pressure and fasting blood sugar in 300 adults.
    > We report each by age and sex.

    > (c) In 300 adults at a rural health centre, waist put more people above its cut-off than body
    > mass index did. So screening by body mass index alone would miss some of the people waist
    > would flag.
  answer: |
    (c) is a message. Had body mass index flagged as many people as waist did, or more, its first
    sentence would be false. So it claims something. Its second sentence answers "so what?". It
    follows from the first. If waist flags more people than body mass index does, some of the
    people waist flags must be missed by body mass index.

    (a) is a topic. It is true whatever the thesis found.

    (b) is a list of what was measured. It is also true whatever was found, and it does not say
    which finding the thesis is for.

    What (c) does not show: that the extra people flagged by waist are at higher risk of disease.
    That needs data on what happens to them, which this design does not collect.
- type: design
  prompt: |
    Write the one message of the section you chose for this book's build, in one or two sentences.
    Test it both ways. Then write a title from it, and an abstract of five sentences, one for each
    part of the argument.
  answer: |
    Check your work in this order.

    - Message: would it be false had your data come out differently? Does it say why it matters?
      Does it claim no more than the data carry, with no cause where you measured only an
      association?
    - Title: does it state the finding, with no abbreviation, in words a searcher would type? Does
      it name the design, if your journal asks?
    - Abstract: is there one sentence each for the context, the gap, what you did, the main result
      and the meaning? Does the meaning say what the finding changes for someone, and answer the
      question the context posed?
    - Agreement: is every number in the title and abstract the same as in your results?
- type: teaching
  prompt: |
    A journalist rings and asks: "Is obesity rising in India?" You have three minutes and the
    NFHS-4 and NFHS-5 figures. Give the one quotable sentence, and say how sure the evidence lets
    you be.
  answer: |
    The quotable sentence: "In the national family health surveys, a larger share of adults aged 15 to
    49 had overweight or obesity in 2019-21 than in 2015-16. By 2019-21 the share was about one woman in
    four, and more than one man in five."

    Then the confidence, in plain words. These are large national surveys, and the rise appears in
    both women and men. But the figures count overweight and obesity together. They cover ages 15
    to 49 only. They tell us the share rose, not why.

    If asked "why", say that these surveys cannot answer it, and do not guess.
retrieval_items:
- q: What is a paper's one message?
  a: Its central claim in one or two sentences, what the study found and why it matters, written before the draft.
- q: How do you tell a message from a topic?
  a: A message would be false if the data had come out differently; a topic is true whatever was found.
- q: What does ICMJE note about abstracts and the text, and what do you do about it?
  a: That information in abstracts often differs from that in the text; check every number in the title and abstract against the results.
