- body: |
    The book has now shown a one-point paragraph in two shapes. `S58-R1-C02` put the claim
    first. `S58-R1-C04` opened a results paragraph with its question and closed it with the
    answer. Here is one paragraph of the rewrite in each shape.

    ```working
    {{n:nfhs5_women_ow_ob_urban_pct}} minus {{n:nfhs5_women_ow_ob_rural_pct}} = {{n:nfhs5_women_ow_ob_urban_rural_gap_pp}}
    ```

    Point first:

    > The share with a BMI of {{n:nfhs5_ow_ob_bmi_cutoff}} kg/m^2 or more was higher among urban women than rural women.
    > In NFHS-5 it was {{n:nfhs5_women_ow_ob_urban_pct}} per cent among urban women aged 15-49 and
    > {{n:nfhs5_women_ow_ob_rural_pct}} per cent among rural women, a gap of {{n:nfhs5_women_ow_ob_urban_rural_gap_pp}} percentage points.

    Question first, answer last:

    > Did the share differ between towns and villages? In NFHS-5 it was
    > {{n:nfhs5_women_ow_ob_urban_pct}} per cent among urban women aged 15-49 and
    > {{n:nfhs5_women_ow_ob_rural_pct}} per cent among rural women, a gap of {{n:nfhs5_women_ow_ob_urban_rural_gap_pp}} percentage points. So
    > the share was higher in towns and cities.

    Both make one point, and both give the same margin note. The first tells a hurried reader
    the finding at once. The second leads a careful reader to it. Mensh and Kording say each
    such paragraph "convinces the reader of the answer given in its last sentence". That makes a
    doubtful conclusion easy to find and check.

    Choose one shape for a section and keep it. Mensh and Kording ask that "parallel messages
    should be communicated with parallel form". A reader who has learnt where the point sits
    finds it faster in every paragraph after.

    The margin notes also tell you when to split or merge. A note that needs "and" is two
    paragraphs. Two notes next to each other that say the same thing are one paragraph. A note
    that serves no claim on the way to your one message, from `S58-R1-C03`, belongs elsewhere
    or nowhere.

    Length follows the support, not a rule. The OpenStax writing guide puts it both ways.
    "When a paragraph is too short, it often lacks enough evidence and examples to
    back up your claims. When a paragraph is too long, readers can lose the point you are
    making."
  analogy_breaks_when: |
    The question-first shape needs a question the reader already wants answered. Opened with a
    question nobody asked, it delays the point for nothing; then put the point first.

    A margin note can be one tidy sentence and still be wrong. The reverse outline tests where
    the points are, not whether the evidence below each one supports it.
