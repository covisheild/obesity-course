concept_id: S58-R1-C10
subject: S58
rung: 1
sequence: 10
name: "One idea per paragraph: the topic sentence, its support, and the reverse outline"
concept_type: derivable
clusters:
- craft-and-integrity
ground_floor_deps:
- B0-R0-C42
concept_deps: [S58-R1-C02, S58-R1-C03, S58-R1-C04, S58-R1-C07]
definition:
  text: |
    A paragraph is a group of sentences that makes one point. Its topic sentence states that
    point. The other sentences support it, with evidence, examples or reasoning. The last
    sentence may close it by saying what the point means. Mensh and Kording call this shape
    context, content, conclusion. At the scale of a paragraph, the first sentence sets the topic
    and the body carries the content. The last sentence gives the conclusion to remember.

    A paragraph zig-zags when it leaves a topic and comes back to it later. A draft zig-zags when
    one topic is spread over paragraphs that are not next to each other.

    In this book, a reverse outline is the outline of `S58-R1-C04` made after the draft instead
    of before it. Beside each paragraph you write one sentence stating its one point, and then
    you read those sentences alone. A paragraph whose point cannot be written as one sentence
    without "and" carries more than one point.
  references:
  - citekey: openstax_writing_guide_handbook
    kind: textbook
    locator: "Handbook H2, Effective Paragraphs, Developing a Main Point"
    quote: |-
      A paragraph is easier to write and easier to read when it centers on a main point. The main point of the paragraph is usually expressed in a topic sentence.
    verified:
      resolved_id: https://openstax.org/books/writing-guide/pages/handbook
      opened: true
      claim_located: true
      checked_on: '2026-10-02'
      note: |-
        The next sentence: "The topic sentence frequently comes at the start of the paragraph, but
        not always."
  - citekey: openstax_writing_guide_handbook
    kind: textbook
    locator: "Handbook H2, Effective Paragraphs, Supporting Evidence and Analysis, first sentence"
    quote: |-
      All the sentences that develop the paragraph should support or expand on the main point given in the topic sentence.
    verified:
      resolved_id: https://openstax.org/books/writing-guide/pages/handbook
      opened: true
      claim_located: true
      checked_on: '2026-10-02'
  - citekey: mensh_kording_2017_structuring_papers
    kind: textbook
    locator: "Rule 3, second-last paragraph (C-C-C at the paragraph scale)"
    quote: |-
      Applying C-C-C at the paragraph scale, the first sentence defines the topic or context, the body hosts the novel content put forth for the reader’s consideration, and the last sentence provides the conclusion to be remembered.
    verified:
      resolved_id: https://doi.org/10.1371/journal.pcbi.1005619
      opened: true
      claim_located: true
      checked_on: '2026-10-02'
  - citekey: mensh_kording_2017_structuring_papers
    kind: textbook
    locator: "Rule 4, Avoiding zig-zag, first paragraph"
    quote: |-
      Only the central idea of the paper should be touched upon multiple times. Otherwise, each subject should be covered in only one place in order to minimize the number of subject changes.
    verified:
      resolved_id: https://doi.org/10.1371/journal.pcbi.1005619
      opened: true
      claim_located: true
      checked_on: '2026-10-02'
      note: |-
        The rule's heading is "Optimize your logical flow by avoiding zig-zag and using
        parallelism". The paper uses the word only in that heading; the definition of zig-zag
        in the record is the book's reading of this paragraph.
  - citekey: mensh_kording_2017_structuring_papers
    kind: textbook
    locator: "Rule 9, third paragraph"
    quote: |-
      Make an outline. We like to write one informal sentence for each planned paragraph.
    verified:
      resolved_id: https://doi.org/10.1371/journal.pcbi.1005619
      opened: true
      claim_located: true
      checked_on: '2026-10-02'
      note: |-
        Mensh and Kording's outline is made before the draft. The reverse outline, the same list
        made from a finished draft, is this book's procedure and is labelled "In this book"; no
        held source names it.
simplified_explanation: |
  `S58-R1-C07` asked for one idea per sentence. A paragraph is the next size up: one point,
  stated and then supported. You can test a whole draft for this without judging a single
  sentence. Write the point of each paragraph in the margin, in one sentence. Then read the
  margin alone. If a margin note needs an "and", that paragraph is two.
illustrations:
- body: |
    Start with a paragraph that fails. Its wording is made up for this example; its numbers are
    from the NFHS-5 India fact sheet. Its sentences are numbered so you can follow them.

    > (1) Overweight and obesity are becoming commoner among Indian women. (2) NFHS-5 measured
    > women aged 15-49 and counted those with a body mass index (BMI) of {{n:nfhs5_ow_ob_bmi_cutoff}} kg/m^2 or more.
    > (3) Urban women were more affected than rural women. (4) The share rose from
    > {{n:nfhs4_women_ow_ob_pct}} per cent in NFHS-4 to {{n:nfhs5_women_ow_ob_pct}} per cent in NFHS-5.
    > (5) Pregnant women and women who had given birth in the previous two months were left out.
    > (6) In urban areas the figure was {{n:nfhs5_women_ow_ob_urban_pct}} per cent, against
    > {{n:nfhs5_women_ow_ob_rural_pct}} per cent in rural areas. (7) This shows that action is needed.

    Every sentence is clear on its own. The paragraph is still hard to follow. Find out why.

    First, try the reverse outline. Write the paragraph's one point in a single sentence. You
    cannot do it without "and": the share is rising, and it is higher in towns, and here is what
    the survey counted. Three points.

    Next, give each topic a number. Topic 1 is how common it is and how it changed. Topic 2 is
    towns against villages. Topic 3 is what the survey counted. Label each sentence. Then
    rewrite the paragraph with each topic in one place, and label the new sentences the same way.

    ```table
    sentence  topic, before  topic, after
    1         1              3
    2         3              3
    3         2              1
    4         1              1
    5         3              1
    6         2              2
    7         1              2
    ```

    Count the changes of topic down each column. Before, the topic changes 6 times in 7
    sentences. The reader is taken to topic 1 three times, and to topics 2 and 3 twice each.
    After, it changes 2 times, and each change falls at a paragraph break. That is Mensh and
    Kording's rule: each subject in one place, so the reader changes subject as few times as
    possible.

    Here is the rewrite, in three paragraphs.

    > NFHS-5 counted a woman aged 15-49 as having overweight or obesity when her BMI was {{n:nfhs5_ow_ob_bmi_cutoff}} kg/m^2 or
    > more. It left out pregnant women and women who had given birth in the two months before.
    >
    > Among women aged 15-49, overweight and obesity became commoner between NFHS-4 and NFHS-5.
    > The share rose from {{n:nfhs4_women_ow_ob_pct}} per cent in 2015-16 to {{n:nfhs5_women_ow_ob_pct}} per cent
    > in 2019-21. That is a rise of {{n:nfhs5_women_ow_ob_change_pp}} percentage points.
    >
    > The share was higher in towns and cities than in villages. It was
    > {{n:nfhs5_women_ow_ob_urban_pct}} per cent among urban women and {{n:nfhs5_women_ow_ob_rural_pct}} per cent
    > among rural women.

    Sentence 7 of the old paragraph is gone. Its "this" pointed at nothing in particular, and
    "action is needed" is a claim no sentence in the paragraph supports. The first sentence of
    each new paragraph states its point, and the rest support it.

    Now write the reverse outline of the rewrite: one sentence per paragraph, in the margin.

    ```table
    | paragraph | its one point, written in the margin |
    | 1 | what NFHS-5 counted as overweight or obesity |
    | 2 | the share of women in that group rose between the two surveys |
    | 3 | the share was higher in towns and cities than in villages |
    ```

    Read the margin alone. Notes 2 and 3 are findings. Note 1 is not: it says how the
    measurement was made. In a paper, that paragraph goes to the methods, where `S58-R1-C04`
    put everything a reader needs to judge how the study was done. The reverse outline found
    that in one reading of three short lines.
  analogy_breaks_when: |
    The topic numbers are your own labels. Another reader might draw the line between topics in
    a different place. So the count of changes is a check on a draft, not a score to compare
    across writers.

    Two topics side by side are sometimes the point. A discussion paragraph that weighs two
    reasons for one interpretation holds both. Mensh and Kording ask for similar ideas to come
    "one immediately after the other". What fails is leaving a topic and coming back to it.
