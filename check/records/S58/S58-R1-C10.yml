must_know:
- point: |
    "One idea per paragraph" read as "short paragraphs" is the error. A paragraph is as long as
    its point needs: the point, then every sentence of support it takes. Cut a paragraph only
    when part of it supports a different point.
  kind: misconception
  bearing: teaching
  refs: [openstax_writing_guide_handbook]
- point: |
    Before you send a draft to anyone, make its reverse outline. Write each paragraph's point in
    the margin in one sentence, then read the margin alone. Split a paragraph whose note needs
    "and". Merge two neighbours whose notes say the same thing. Move or cut one whose note
    serves no claim.
  kind: move
  bearing: methodological
  refs: [mensh_kording_2017_structuring_papers]
- point: |
    The commonest fault is not a long paragraph but a topic visited twice. Before you edit
    sentences, label each one with its topic and gather each topic into one place. A reader
    who meets a subject three times reads three times.
  kind: trap
  bearing: methodological
  refs: [mensh_kording_2017_structuring_papers]
- point: |
    The two shapes of a one-point paragraph, point first and answer last, are both sound. Choose
    one for a section and use it in every paragraph, so the reader knows where to look.
    In a results section for a hurried reader, put the point first.
  kind: dispute
  bearing: methodological
  refs: [openstax_writing_guide_handbook, mensh_kording_2017_structuring_papers]
- point: |
    A reviewer checks a paper paragraph by paragraph. When each paragraph has one conclusion,
    the reviewer can find the one paragraph behind a doubtful claim. When conclusions are spread
    across paragraphs, the reviewer doubts them all.
  kind: consequence
  bearing: methodological
  refs: [mensh_kording_2017_structuring_papers]
- point: |
    The reverse outline checks where each point is. It cannot check that the point is true, or
    that the sentences under it support it. Read each paragraph's support against its point as
    Book 0 read premises against a conclusion (`B0-R0-C42`).
  kind: boundary
  bearing: methodological
- point: |
    When you correct a trainee's thesis chapter, do not rewrite their paragraphs. Ask them to
    write the margin note for each one. Where they cannot write it as one sentence, they have
    found the paragraph to fix, and they will find the next one without you.
  kind: move
  bearing: teaching
exercises:
- type: retrieval
  prompt: |
    From memory: what are the three parts of a paragraph in Mensh and Kording's scheme? What is
    a reverse outline, and what are the three things it can tell you to do with a paragraph?
  answer: |
    Context, content, conclusion: the first sentence sets the topic, the body carries the
    content, and the last sentence gives the conclusion to remember.

    A reverse outline is one sentence per paragraph, stating its one point, written from the
    finished draft and read alone. It tells you three things. Split a paragraph whose note needs
    "and". Merge two neighbours whose notes say the same thing. Move or cut one whose note
    serves no claim.
  confidence_first: true
- type: critique
  prompt: |
    Here is a made-up discussion paragraph from a thesis on a district survey of women aged
    15-49. The district's figures are made up; the national figure is from NFHS-5.

    > (1) The district's share of women with a BMI of {{n:nfhs5_ow_ob_bmi_cutoff}} kg/m^2 or more was higher than the
    > national figure. (2) Our sample came from two blocks only. (3) Urban wards had the
    > highest share, as in NFHS-5. (4) Weight and height were measured by trained staff, which
    > is a strength. (5) The national figure in NFHS-5 was {{n:nfhs5_women_ow_ob_pct}} per cent. (6) Screening in
    > urban wards should come first. (7) Our response rate was 82 per cent.

    Label each sentence with its topic, count the changes of topic, write the reverse outline
    you would want, and rewrite the paragraph.
  answer: |
    There are three topics. A is how the district compares with the nation: sentences 1, 3 and 5.
    B is what the method can and cannot support: sentences 2, 4 and 7. C is what to do:
    sentence 6. In order they run A, B, A, B, A, C, B. That is 6 changes of topic in 7
    sentences.

    The reverse outline you want, one paragraph per point, in the order a discussion needs:

    ```table
    | paragraph | its one point |
    | 1 | the district's share was higher than the nation's, and highest in urban wards |
    | 2 | how far the sample and the measurement let us trust that |
    | 3 | what the district should do first |
    ```

    The first note has an "and", but both halves compare the district with NFHS-5, so they are
    one point. A rewrite:

    > In the district, the share of women aged 15-49 with a BMI of {{n:nfhs5_ow_ob_bmi_cutoff}} kg/m^2 or more was
    > higher than the national figure. That figure was {{n:nfhs5_women_ow_ob_pct}} per cent in
    > NFHS-5. As in NFHS-5, the share was highest in urban wards.

    > Two features of the survey bear on that comparison. Weight and height were measured by
    > trained staff, and 82 per cent of the women approached took part. But the sample came from two
    > blocks only, so the figure may not hold for the whole district.

    > If the pattern holds, screening should start in the urban wards.

    The third paragraph now says what it rests on. A real discussion would also give the
    district's own figure, with its count.
  skill_ref: S58-R1-K01
- type: critique
  prompt: |
    Take the manuscript or thesis section you chose for this book. Write its reverse outline:
    one sentence per paragraph, in the margin or on a separate sheet. Read the sentences alone.
    Mark every paragraph to split, merge, move or cut, and rewrite the two worst.
  answer: |
    Check your work in four ways.

    - Every margin note is one sentence, with no "and" joining two separate points.
    - Read alone, the notes take a reader from your question to your answer, in the order the
      argument needs. A note that describes how the work was done belongs in the methods.
    - No topic appears in two paragraphs that are not next to each other.
    - In each rewritten paragraph the point is stated once, first or last, in the same place as
      in its neighbours. Every other sentence supports it.

    If you could not write a note for a paragraph at all, the paragraph has no point yet. Decide
    what it is for before you touch its sentences.
  skill_ref: S58-R1-K01
- type: teaching
  prompt: |
    A first-year resident says: "I read my chapter three times and it reads fine. Why do I need
    a reverse outline?" You have ten minutes and a whiteboard. Explain.
  answer: |
    Draw a column of boxes, one per paragraph, and a column beside it for the margin notes.

    Reading the chapter again tests sentences. You wrote them, so they all make sense to you,
    and each one reads fine. The faults that lose a reader are between sentences: a paragraph
    that makes two points, a topic left and taken up again three paragraphs later. You cannot see
    those while you read sentence by sentence, because you already know the argument.

    The reverse outline hides the sentences. You write one line per paragraph and read only the
    lines. Now a topic that turns up twice is two lines with the same words. A paragraph with
    two points is a line you cannot write without "and". A methods point among the results is a
    line that says how, not what.

    Then write two lines on the board: "split, merge, move or cut". Every fault the margin shows
    leads to one of those four actions.
retrieval_items:
- q: What is a reverse outline, and how do you read it?
  a: One sentence per paragraph stating its one point, written from the finished draft. Read the
    sentences alone and ask whether they carry the argument in order.
- q: What is a zig-zag, and how do you fix it?
  a: Leaving a topic and coming back to it later. Label each sentence with its topic and gather
    each topic into one place, so the topic changes only at paragraph breaks.
- q: Does "one idea per paragraph" mean short paragraphs?
  a: No. A paragraph is as long as its point needs. Too short and it lacks support; too long and
    the reader loses the point.
common_misreading: |
  "One idea per paragraph" is often read as "keep paragraphs short". A paragraph cut short has
  its point and too little support for it. One idea means one point with all the support it
  needs, and no second point. A long paragraph that makes one point passes; a three-sentence
  paragraph that makes two fails.
