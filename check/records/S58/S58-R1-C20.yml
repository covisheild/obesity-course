simplified_explanation: |
  A reader may look at your figure before reading a word of your paper. So the figure has to
  explain itself. Each axis says what it measures and in what unit. Each group has its name
  written beside it. The caption under the figure says what the finding is, who was measured, how
  many, and where the numbers came from.

  Error bars need special care. The same line through a mean can show how spread out the people
  are, or how sure you are of the mean itself. These are different things, and they look the
  same. So the caption has to say which one it is, every time.
illustrations:
- body: |
    `S58-R1-C14` gave the NFHS-5 urban and rural figure its claim, as the first sentence of the
    caption. The rest of the words on that figure are still to do. Start from a draft as a
    spreadsheet leaves it. The draft below is made up for this example; the numbers on it are the
    real ones.

    It has four bars. The side axis runs from 0 to 35 with no title. The bottom axis says "Women"
    and "Men". A legend box in the corner says "Series1" and "Series2". Hold it up and ask what a
    reader who has only this page can tell. Series1 of what? Per cent of whom, measured how, in
    which survey?

    Fix each element in turn.

    ```table
    | element | as the spreadsheet left it (made up) | finished |
    | side axis title | none | adults with BMI 25.0 kg/m^2 or more (%) |
    | bottom axis | Women, Men | women, men; no axis title needed |
    | legend | Series1, Series2 | none; "urban" and "rural" written beside the bars |
    | values | none | each bar's per cent printed on it |
    | text size | readable only with the figure filling the screen | readable at its printed width |
    ```

    The side axis title names the quantity and its unit. BMI is the body mass index, in
    kilograms per square metre (`B0-R0-C14`). "Women" and "men" are categories, so that axis
    needs no unit and no title. The legend goes, because the bars now carry their own names: the
    direct labelling of `S58-R1-C18`. The values go on the bars because the reader will want
    them. Rougier and colleagues: "If the numeric values are important, they must be provided
    elsewhere in your article or be written very clearly on the figure."

    For text size, Wilke's test is to shrink the figure on screen to three to five inches wide.
    One inch is 2.54 cm.

    ```working
    3 times 2.54 = 7.62
    5 times 2.54 = 12.7
    ```

    So look at it about 8 to 13 cm wide, or from across the room. If you cannot read the tick
    labels there, neither can a reader of the printed page.

    Now finish the caption. Put C14's sentence first, then everything a reader needs to read the
    bars without your paper:

    > Figure 2. A larger share of urban than of rural adults aged 15–49 had overweight or obesity,
    > in women and in men (NFHS-5, 2019–21). Bars show the per cent of women and of men with a
    > body mass index (BMI) of 25.0 kg/m^2 or more, by place of residence. Women who were pregnant
    > or had given birth in the preceding 2 months are excluded. n: [number of women and of men
    > weighed and measured]. Source: NFHS-5 India Fact Sheet, indicators 88 and 89.

    The bracket is deliberate. The fact sheet says the survey gathered information from 724,115
    women and 101,839 men. Those are the people interviewed. It does not say how many were weighed
    and measured, and that is the n for these bars. So the fact sheet alone cannot finish this
    caption. Find n in a source that gives it, before the figure goes out.

    There are no error bars on this figure, because the fact sheet gives no confidence intervals.
    Do not draw bars you do not have.
  analogy_breaks_when: |
    This figure has four bars and two groups, so every label fits. With dozens of points, label
    only the ones the text talks about, as Wilke does, and keep the full values for a table.

    A caption that names everything makes the figure readable. It does not make the numbers right.
    If n is wrong, or the exclusion is misstated, the caption carries the error with full
    confidence.
