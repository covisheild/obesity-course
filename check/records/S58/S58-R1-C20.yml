  - value: "101839"
    unit: "men about whom NFHS-5 gathered information (interviewed), India"
    citekey: nfhs5_india_factsheet
    quote: "gathered information from 636,699 households, 724,115 women, and 101,839 men"
  - value: "25.0"
    unit: "kg/m2, the BMI cut-off for overweight or obesity in the fact sheet"
    citekey: nfhs5_india_factsheet
    quote: "88. Women who are overweight or obese (BMI ≥25.0 kg/m2)21 (%) 33.2  19.7  24.0  20.6"
  - value: "2"
