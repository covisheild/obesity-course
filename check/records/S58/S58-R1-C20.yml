- body: |
    Now an error bar. Cumming, Fidler and Vaux, "Error bars in experimental biology" (Journal of
    Cell Biology, 2007, https://pmc.ncbi.nlm.nih.gov/articles/PMC2064100/), work one small case:
    three measurements, 28.7, 38.7 and 52.6. Work its bars yourself.

    The mean and the standard deviation are Book 0's (`B0-R0-C28`): add the squared deviations,
    divide by one less than the count, take the square root.

    ```working
    28.7 plus 38.7 plus 52.6 = 120.0
    120.0 divided by 3 = 40.0
    28.7 minus 40.0 = -11.3
    38.7 minus 40.0 = -1.3
    52.6 minus 40.0 = 12.6
    -11.3 times -11.3 = 127.69
    -1.3 times -1.3 = 1.69
    12.6 times 12.6 = 158.76
    127.69 plus 1.69 plus 158.76 = 288.14
    288.14 divided by 2 = 144.07
    ```

    The square root of 144.07 is 12.0. So the mean is 40.0 and the SD is 12.0, as Cumming
    reports. The standard error is the SD divided by the square root of n, written √n. Here n is
    3, and √3 is 1.732.

    ```working
    12.0 divided by 1.732 = 6.93
    ```

    For a 95% confidence interval, Cumming give a rule of thumb: when n is 10 or more, double the
    SE; when n is 3, multiply it by 4. The exact multiplier comes from a table of the t
    statistic, which is beyond this book.

    ```working
    4 times 6.93 = 27.7
    ```

    Now set the three side by side. Each number is the length of one arm of the bar, drawn above
    and below the mean of 40.0.

    ```table
    | what the bar shows | one arm of the bar |
    | standard deviation (SD) | 12.0 |
    | standard error (SE) | 6.93 |
    | approximate 95% CI | 27.7 |
    ```

    The same three numbers can carry a bar four times as long as another. Shown a mean of 40.0
    with an arm of 12.0, a reader cannot tell which bar it is. If it is the SD, it describes the
    people: Cumming note that about two thirds of the data lie within one SD of the mean. If it
    is the SE or the CI, it describes the mean: how far from the true mean this estimate might be.

    So the caption names the bar and gives n, every time. Cumming's first two rules say exactly
    that:

    > Rule 1: when showing error bars, always describe in the figure legends what they are.

    > Rule 2: the value of n (i.e., the sample size, or the number of independently performed
    > experiments) must be stated in the figure legend.

    Their "figure legends" are what this book calls captions.
  analogy_breaks_when: |
    Three values are a teaching case, not a study. With n as small as 3, Cumming advise plotting
    the individual values instead of any error bar. The doubling rule for a 95% CI holds only when
    n is 10 or more; at n = 3 the multiplier is about 4, and in between it lies between the two.

    The SD stays about the same as n grows, while the SE and the CI shrink. So a short SE bar from a
    large sample says the mean is precise. It says nothing about how alike the people are.
  numbers:
  - value: "28.7"
    unit: "first of Cumming's three measurements (arbitrary units)"
    citekey: cumming_2007_error_bars
    quote: "Suppose three experiments gave measurements of 28.7, 38.7, and 52.6"
  - value: "38.7"
    unit: "second of Cumming's three measurements"
    citekey: cumming_2007_error_bars
    quote: "Suppose three experiments gave measurements of 28.7, 38.7, and 52.6"
  - value: "52.6"
    unit: "third of Cumming's three measurements"
    citekey: cumming_2007_error_bars
    quote: "Suppose three experiments gave measurements of 28.7, 38.7, and 52.6"
  - value: "40.0"
    unit: "mean of the three measurements"
    citekey: cumming_2007_error_bars
    quote: "The mean of the data is M = 40.0, and the SD = 12.0"
  - value: "12.0"
    unit: "standard deviation of the three measurements"
    citekey: cumming_2007_error_bars
    quote: "The mean of the data is M = 40.0, and the SD = 12.0"
  - value: "6.93"
    unit: "standard error of the mean, n = 3"
    citekey: cumming_2007_error_bars
    quote: "For the n = 3 case, SE = 12.0/√3 = 6.93"
  - value: "4"
    unit: "multiplier turning an SE bar into an approximate 95% CI when n = 3"
    citekey: cumming_2007_error_bars
    quote: "If n = 3, SE bars must be multiplied by 4 to get the approximate 95% CI."
  - value: "27.7"
    unit: "one arm of the approximate 95% CI, n = 3"
    citekey: cumming_2007_error_bars
    quote: "If n = 3, SE bars must be multiplied by 4 to get the approximate 95% CI."
    derived: "4 times 6.93 = 27.7, Cumming's rule applied to Cumming's SE"
figures:
- file: s58-r1-c20-three-error-bars.png
  caption: "One set of data, three error bars. Cumming, Fidler and Vaux's three measurements,
    28.7, 38.7 and 52.6, have a mean of 40.0. One arm of each bar, as it would be drawn above and
    below that mean: 12.0 for the standard deviation, 6.93 for the standard error, and 27.7 for an
    approximate 95% confidence interval (4 times the standard error, their rule for three values).
    A reader cannot tell these apart unless the caption names the bar."
  alt: "Three bars of different heights for the same data: 12.0 for the standard deviation, 6.93
    for the standard error, and 27.7 for an approximate 95% confidence interval."
  source: draw.py
  spec:
    kind: bar
    from_table: {block: 1, x: 0, y: [1]}
    x_label: "what the error bar shows"
    y_label: "length of one arm (units of the data)"
    value_labels: true
    relations:
    - check: "y[0] / y[1] = 1.732"
    - check: "y[2] / y[1] = 4"
must_know:
- point: |
    "An error bar shows the error" is the error. The same mean of 40.0 can carry an arm of 12.0, 6.93
    or 27.7 from the same three numbers. Write in every caption whether a bar is the SD, the SE or a
    95% CI, and give n beside it.
  kind: misconception
  bearing: methodological
  refs: [cumming_2007_error_bars]
- point: |
    Title every axis with the quantity and its unit: "body mass index (kg/m^2)", not "BMI". An axis
    of categories needs no unit. If a reader must guess, the axis is not finished.
  kind: move
  bearing: methodological
  refs: [wilke_2019_dataviz_ch22]
- point: |
    Write the caption in a fixed order. The finding comes first. Then what each mark shows; who,
    where and when; n; what any error bar is; and the source. Check it by covering the paper's
    text and reading only the figure and its caption.
  kind: move
  bearing: methodological
  refs: [wilke_2019_dataviz_ch22, cumming_2007_error_bars]
- point: |
    n counts separate people or units, not measurements. Weigh 40 children three times each and
    you have 120 readings and an n of 40. An error bar worked from all 120 readings looks
    narrower than the evidence allows.
  kind: trap
  bearing: methodological
  refs: [cumming_2007_error_bars]
- point: |
    "Legend" means two things. To a journal, the figure legend is the caption: ICMJE asks for
    "legends for illustrations" on a separate page. On the figure itself, a legend is the key to
    the colours. When an author's instructions ask for legends, send captions.
  kind: trap
  bearing: methodological
  refs: [icmje_2026_manuscript_preparation]
- point: |
    To show how spread out people are, draw the SD or, better, the points themselves. To show how
    precisely a mean or a prevalence is known, draw a 95% CI. ICMJE asks for measures of
    uncertainty such as confidence intervals, not P values alone.
  kind: move
  bearing: methodological
  refs: [cumming_2007_error_bars, icmje_2026_manuscript_preparation]
- point: |
    Before a figure leaves you, shrink it to 8 to 13 cm wide on screen and read every label. Most
    programs' default text is too small at that size.
  kind: move
  bearing: methodological
  refs: [wilke_2019_dataviz_ch24]
- point: |
    Naming the bar lets a reader read it; it does not license every comparison. Bars on the same
    group measured at different times cannot show whether the group changed (Cumming's Rule 8).
    For that, the change in each person has to be worked out and its own interval drawn.
  kind: boundary
  bearing: methodological
  refs: [cumming_2007_error_bars]
common_misreading: |
  "Short error bars mean the people were much alike." Only an SD bar describes the people. An SE or
  CI bar describes how precisely the mean is known. It shrinks as n grows, even when the people
  differ as much as before. A large survey can show a tiny CI around a mean of people who vary widely.
  Read the caption for which bar it is before you read its length.
reporting_sentence: |
  Points show group means and error bars show 95% confidence intervals. Each child counts once in
  n, however often measured.
exercises:
- type: retrieval
  prompt: |
    From memory: list what a figure caption should say, in order. Then name the two error bars that
    describe the data and the two that describe how precisely the mean is known.
  answer: |
    The caption starts with the finding, as its title. Then it says what each mark shows, and who,
    where and when. Then n, what any error bar is, and the source of the data.

    Describing the data: the range and the standard deviation. Describing the precision of the
    mean: the standard error and the 95% confidence interval. All four are drawn the same way.
- type: interpretation
  prompt: |
    The numbers here are made up. A figure shows mean waist circumference in two groups, 92 cm and
    88 cm. Each mean has an error bar whose arm is 3 cm long. The caption ends: "Values are mean ±
    SEM; n = 40 per group." SEM is the standard error of the mean.

    What does a 3 cm arm tell you about how much waist circumference varies among the people? What
    does it tell you about how precisely each mean is known?
  answer: |
    The bar is the SE, so it is about the mean, not the people. To see the people's spread, undo
    the SE: the SE is the SD divided by √n, so the SD is the SE times √n.

    ```working
    square root of 40 = 6.32
    3 times 6.32 = 18.96
    ```

    The SD is about 19 cm. Waist circumference varies a great deal among these people, far more
    than the 3 cm bar suggests at first glance.

    For the precision of the mean, n is 40, so the 95% CI is roughly the mean plus or minus 2 SE.

    ```working
    2 times 3 = 6
    92 minus 6 = 86
    92 plus 6 = 98
    88 minus 6 = 82
    88 plus 6 = 94
    ```

    Each mean is known to within about 6 cm either way: roughly 86 to 98 cm and 82 to 94 cm. The
    caption did its job: because it said SEM and gave n, you could work out both.
- type: critique
  prompt: |
    A draft thesis figure, made up for this exercise, has a side axis titled "BMI", no title on the
    bottom axis, and this caption:

    > Figure 3. Graph showing BMI of participants in the two groups. Error bars represent
    > variation. *p<0.05.

    List everything a reader cannot tell from it, and rewrite what you can.
  answer: |
    - The first sentence names a topic, "graph showing BMI". It should state the finding, such as
      which group's mean BMI was higher and by how much.
    - The side axis has no unit. It should read "body mass index (kg/m^2)".
    - The bottom axis gives no clue what the two groups are, unless their names sit on it. Name
      them on the axis or beside the bars.
    - "Variation" does not say whether the bars are the range, the SD, the SE or a 95% CI.
    - n is missing, for each group.
    - Who the participants were, where and when are missing.
    - The asterisk is explained only as "p<0.05", with no comparison named. Say which two values
      were compared, and by what test, or leave it out. P alone does not show how big the
      difference is.

    A rewrite states the finding, names the bar and gives n. For example: "Mean body mass index was
    higher in group A than in group B. Points are means, error bars 95% confidence intervals;
    n = [number] in each group." The real numbers come from your data.
- type: teaching
  prompt: |
    A first-year resident shows you two slides made from the same data. On one, the error bars are
    long; on the other, short. She asks which slide is right. You have ten minutes and a
    whiteboard.
  answer: |
    Both may be right; they may be showing different bars. Ask her what each bar is. She may have
    drawn the SD on one slide and the SE on the other.

    On the board, take three numbers, 28.7, 38.7 and 52.6. Their mean is 40.0 and their SD 12.0.
    The SE is the SD divided by √3, about 6.93. An approximate 95% CI for three values is about
    4 times the SE, 27.7. Draw the three bars on the same mean.

    Then the rule. The SD tells you how spread out the people are. The SE and the CI tell you how
    precisely the mean is known. Neither is wrong. What is wrong is a slide that does not say which
    it shows. Write it in the caption, with n, on both slides.
- type: design
  prompt: |
    Take the figure you are drawing for your build. Write its axis titles with units. Replace any
    legend with direct labels where you can. Write its full caption in the order this section
    gives. Then cover the rest of your text. Ask a colleague to tell you, from the figure and its
    caption alone, what was measured, in whom, how many, and what the finding is.
  answer: |
    Check your figure against five questions. Does every measured axis carry its unit? Does every
    group carry its name beside its data, or is there a reason a legend must stay? Is the first
    sentence of the caption the finding? Are who, where, when and n all there? If there are error
    bars, does the caption say which kind?

    If your colleague hesitated on any of the four things you asked, the words on the figure are not
    finished. Fix the one they hesitated on, then ask someone else.
  skill_ref: S58-R1-K02
retrieval_items:
- q: Which error bars describe the data, and which describe how precisely the mean is known?
  a: The range and the standard deviation describe the data. The standard error and the 95%
    confidence interval describe the precision of the mean.
- q: What is n in a caption, and what is it not?
  a: The number of independent people or units measured. It is not the number of measurements;
    repeated measurements of one person are replicates and count once.
- q: What must every axis title carry?
  a: The quantity and, for a measured quantity, its unit. An axis of categories needs no unit.
