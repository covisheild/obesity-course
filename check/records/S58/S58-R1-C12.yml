simplified_explanation: |
  First ask of each paragraph whether it serves your one message. Then ask it of each sentence.

  Big cuts first, because polishing a sentence you later delete is work thrown away. Most of the
  words you lose will go in whole sentences and paragraphs, not in single words.
illustrations:
- body: |
    Here is a draft of two paragraphs from a thesis discussion. It is invented, but you will
    recognise it. The section's one message, written first as `S58-R1-C03` asks, is
    this: among women aged 15 to 49 in India, overweight or obesity was commoner in NFHS-5 than in
    NFHS-4, and commoner in urban than in rural areas.

    > (1) Many definitions of obesity have been used in the literature over the years, and each
    > of them has its own advantages and disadvantages. A detailed discussion of these
    > definitions is beyond the scope of the present chapter.
    >
    > (2) Obesity is a major public health problem all over the world, and India is no exception
    > to this. In the present study, it was observed that the proportion of women aged 15 to 49
    > years who were overweight or obese increased from {{n:nfhs4_women_ow_ob_pct}}% in NFHS-4 to
    > {{n:nfhs5_women_ow_ob_pct}}% in NFHS-5. Thus, it can be seen that there has been an
    > increase in the proportion of women who are overweight or obese. It is important to note
    > that at this point in time the proportion was higher in urban areas
    > ({{n:nfhs5_women_ow_ob_urban_pct}}%) than in rural areas
    > ({{n:nfhs5_women_ow_ob_rural_pct}}%). The survey also collected a large amount of data on a
    > number of other important topics. Further studies are needed in order to find out the
    > reasons for this increase.

    Count the words: 161. Now cut in three passes, biggest first.

    **Pass 1, paragraphs.** Write the one point of each paragraph in the margin, the reverse
    outline of `S58-R1-C10`. Paragraph 1: "definitions of obesity vary". That serves no part of the
    message. The paragraph even says so: its subject is "beyond the scope". Delete all 37 words.

    ```working
    161 minus 37 = 124
    ```

    **Pass 2, sentences.** Hold each sentence of paragraph 2 against the message.

    - "Obesity is a major public health problem all over the world" is true of every thesis on
      obesity. It says nothing about these women. Delete: 18 words.
    - "Thus, it can be seen that there has been an increase" says the sentence before it again.
      Delete: 21 words.
    - "The survey also collected a large amount of data" serves no claim. Delete: 16 words. It
      contains "a number of", a phrase the Federal Plain Language Guidelines tell you to shorten
      to "several". Had you shortened it first, the work would now be thrown away.

    ```working
    18 plus 21 plus 16 = 55
    124 minus 55 = 69
    ```

    **Pass 3, words.** Three sentences are left. Go through them word by word.

    - "In the present study, it was observed that" delays the subject by 8 words. Delete them.
    - "It is important to note that at this point in time" is 11 words before the subject. The
      guidelines would turn "at this point in time" into "now". But "now" is wrong: NFHS-5 ended in
      2021. The phrase was hiding a missing fact, which survey. Replace the 11 words with "In
      NFHS-5," which is 2.
    - "in order to find out" becomes "to find": 3 words go.

    > The proportion of women aged 15 to 49 years who were overweight or obese increased from
    > {{n:nfhs4_women_ow_ob_pct}}% in NFHS-4 to {{n:nfhs5_women_ow_ob_pct}}% in NFHS-5. In NFHS-5,
    > the proportion was higher in urban areas ({{n:nfhs5_women_ow_ob_urban_pct}}%) than in rural
    > areas ({{n:nfhs5_women_ow_ob_rural_pct}}%). Further studies are needed to find the reasons
    > for this increase.

    ```working
    8 plus 11 minus 2 plus 3 = 20
    69 minus 20 = 49
    161 minus 49 = 112
    ```

    ```table
    | stage | words left | words removed in this pass |
    | first draft | 161 | 0 |
    | after cutting paragraphs | 124 | 37 |
    | after cutting sentences | 69 | 55 |
    | after cutting words | 49 | 20 |
    ```

    From 161 words to 49: 112 gone. Whole paragraphs and sentences took 92 of them, and single
    words only 20. Every fact the message needs is still there, and one fact is there that was
    missing before.
  analogy_breaks_when: |
    The split of 92 words to 20 belongs to this draft, which was padded on purpose to show each
    pass. A tight draft may lose little at the first two passes, and that is a result, not a
    failure.

    The last sentence, "Further studies are needed", survived because it states what the data
    leave open. Some guides would cut it too. Whether a sentence serves the message is a judgement
    you make against your own message, not a rule this example settles.
  numbers:
  - value: '{{n:nfhs5_women_ow_ob_urban_pct}}'
    unit: per cent of women aged 15-49 overweight or obese, NFHS-5, urban India
    citekey: nfhs5_india_factsheet
    quote: 88. Women who are overweight or obese (BMI ≥25.0 kg/m2)21 (%) 33.2 19.7 24.0 20.6
  - value: '{{n:nfhs5_women_ow_ob_rural_pct}}'
    unit: per cent of women aged 15-49 overweight or obese, NFHS-5, rural India
    citekey: nfhs5_india_factsheet
