definition:
  text: |
    Cutting is deleting words, sentences or paragraphs that do no work for the reader, so that
    what remains says the same thing in fewer words. A unit does no work when deleting it loses
    nothing the reader needs.

    The test for a word is whether the sentence means the same without it.

    Cutting is not compressing. Compressing keeps everything and packs it into fewer, longer
    sentences.
