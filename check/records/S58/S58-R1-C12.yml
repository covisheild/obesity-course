  - value: '{{n:nfhs4_women_ow_ob_pct}}'
    unit: per cent of women aged 15-49 overweight or obese, NFHS-4, India
    citekey: nfhs5_india_factsheet
    quote: 88. Women who are overweight or obese (BMI ≥25.0 kg/m2)21 (%) 33.2 19.7 24.0 20.6
  - value: '{{n:nfhs5_women_ow_ob_pct}}'
    unit: per cent of women aged 15-49 overweight or obese, NFHS-5, India
    citekey: nfhs5_india_factsheet
    quote: 88. Women who are overweight or obese (BMI ≥25.0 kg/m2)21 (%) 33.2 19.7 24.0 20.6
  - value: '2021'
    unit: year NFHS-5 fieldwork ended
    citekey: nfhs5_india_factsheet
    quote: phase two from 2 January 2020 to 30 April 2021
- body: |
    There are two ways to cut that look like the work above and are not.

    The first is compressing. A writer who wants fewer words fuses the three sentences into one.

    > Overweight or obesity in women aged 15 to 49 rose from {{n:nfhs4_women_ow_ob_pct}}% (NFHS-4)
    > to {{n:nfhs5_women_ow_ob_pct}}% (NFHS-5), higher in urban ({{n:nfhs5_women_ow_ob_urban_pct}}%)
    > than rural ({{n:nfhs5_women_ow_ob_rural_pct}}%) areas, reasons needing further study.

    That is 28 words against 49. It is also one sentence carrying three ideas, and the reader must
    hold all of them to the full stop. The Federal Plain Language Guidelines name this
    temptation: "Resist the temptation to put everything in one sentence". Measure it as in
    `S58-R1-C11`. The average sentence length goes from 49 words over 3 sentences to 28 words in
    one.

    ```working
    49 divided by 3 = 16.33333333
    28 minus 16.33 = 11.67
    1.015 times 11.67 = 11.845
    ```

    With the same syllables per word, the Flesch Reading Ease score falls by about 12 points. The
    word count went down and the sentence got harder.

    The second is cutting a word that does work. A writer in a hurry trims the first sentence to
    "The proportion of women who were overweight increased from {{n:nfhs4_women_ow_ob_pct}}% to
    {{n:nfhs5_women_ow_ob_pct}}%." Two cuts changed the claim. Without "aged 15 to 49", the
    sentence speaks for all women, and the survey measured only women of 15 to 49. Without "or
    obese", it speaks of overweight alone, and the survey's figure covers overweight and obesity
    together. Without the survey names, the reader cannot tell which figure came first. Each cut
    word looked like padding. Each was a limit on the claim.
  analogy_breaks_when: |
    Not every long sentence is compressed. A sentence with one idea and a long name in it, such
    as a survey's full title, is long and still fine. The fault is several ideas in one sentence,
    not length alone.

    The words that limit a claim differ from paper to paper: an age range, a place, a year, a
    denominator, "or obese". Read each candidate word and ask whether the claim gets wider
    without it. If it does, keep it.
common_misreading: |
  "Cutting means making every sentence shorter." Most of what a good cut removes goes in whole
  units. In the draft above, deleting one paragraph and three sentences removed 92 words, and
  word-level cuts removed 20. A writer who only trims words, sentence by sentence, polishes text
  that should not be there. And fusing sentences to save words makes the page harder, not
  easier.
must_know:
- point: |
    Cut in order: paragraphs first, then sentences, then words.
  kind: move
  bearing: methodological
  refs:
  - mensh_kording_2017_structuring_papers
- point: |
    Test each paragraph against your one message with a reverse outline. Where a margin note
    serves no part of the message, delete that paragraph.
  kind: move
  bearing: methodological
  refs:
  - mensh_kording_2017_structuring_papers
- point: |
    "Fewer words is better, so join short sentences into one" is the error. Cut whole units
    instead, and keep one idea a sentence.
  kind: misconception
  bearing: methodological
  refs:
  - plain_language_2011_guidelines
- point: |
    Cutting has no test for truth. Before you delete any word, ask whether the claim gets
    wider without it. If it does, the word stays.
  kind: boundary
  bearing: methodological
- point: |
    Before you cut, open a second file and paste every deleted passage into it.
  kind: move
  bearing: methodological
  refs:
  - mensh_kording_2017_structuring_papers
- point: |
    Delete the opener that delays the subject: "It was observed that", "It is important to note
    that", "In the present study".
  kind: trap
  bearing: methodological
  refs:
  - plain_language_2011_guidelines
- point: |
    When you correct a trainee's thesis chapter, mark the paragraphs and sentences to delete
    before you touch a single word.
  kind: move
  bearing: teaching
  refs:
  - mensh_kording_2017_structuring_papers
exercises:
- type: retrieval
  prompt: |
    From memory: in what order do you cut, and what question does each unit have to fail before
    you delete it? Then say how cutting differs from compressing.
  answer: |
    Paragraphs, then sentences, then words. A paragraph or a sentence goes when it serves no part
    of the piece's one message, or says again what is already said. A word goes when the sentence
    means the same without it.

    Compressing keeps all the content and packs it into fewer, longer sentences. Cutting deletes
    what does no work and leaves each sentence carrying one idea.
- type: critique
  prompt: |
    Cut this methods paragraph from a district survey by deleting words only. It is invented. Do
    not rewrite or join sentences. Say what you cut and why, and count the words before and after.

    > The present study was conducted in the Department of Community Medicine of a tertiary care
    > centre in central India. A cross-sectional study design was used for the purpose of this
    > study. The study was carried out over a period of six months, from January to June 2025.
    > The study participants were adults aged 18 years and above who were residing in the field
    > practice area. Each and every participant was weighed with a digital weighing scale, and the
    > weight was recorded to the nearest 0.1 kg.
  answer: |
    The paragraph has 86 words in five sentences: 19, 12, 16, 18 and 21.

    - "for the purpose of this study" adds nothing: the design is this study's. Delete 6 words.
    - "over a period of six months," repeats the dates that follow. Delete 6 words.
    - "who were" can go: "adults ... residing in the field practice area" means the same. Delete 2.
    - "and every" is a doublet: "each" says it. Delete 2.
    - "weighing" before "scale" repeats "weighed". Delete 1.
    - ", and the weight was recorded" says what weighing to the nearest 0.1 kg already says.
      Delete 5.

    ```working
    6 plus 6 plus 2 plus 2 plus 1 plus 5 = 22
    86 minus 22 = 64
    ```

    > The present study was conducted in the Department of Community Medicine of a tertiary care
    > centre in central India. A cross-sectional study design was used. The study was carried
    > out from January to June 2025. The study participants were adults aged 18 years and above
    > residing in the field practice area. Each participant was weighed with a digital scale to
    > the nearest 0.1 kg.

    64 words, every fact kept. Two things must stay: "18 years and above" and "to the nearest
    0.1 kg" each limit what the reader may conclude. A further rewrite into the active voice, as
    in `S58-R1-C07`, could shorten it more, but that is rewriting, not cutting.
- type: design
  prompt: |
    Take the manuscript or thesis section you chose for this book's build. Write its one message
    at the top. Make a reverse outline. Then cut it in three passes, paragraphs, sentences, words,
    pasting every deletion into a second file. Record the word count after each pass.
  answer: |
    Check your work against four things.

    - The message is written before any cut, and every paragraph left has a margin note that serves
      it.
    - The counts fall at each pass, and you can say which pass removed most. If the word pass
      removed most, look again at whole sentences: one that restates its neighbour is easy to miss.
    - No sentence left carries more ideas than before. If two sentences became one, undo it.
    - Every age range, place, year, denominator and qualifier in your claims is still there.

    A section that loses little has passed, not failed. Keep the second file until the paper is
    accepted.
  skill_ref: S58-R1-K01
retrieval_items:
- q: In what order do you cut a draft, and why that order?
  a: Paragraphs, then sentences, then words, because polishing words in a passage you later delete
    is wasted work.
- q: What is the difference between cutting and compressing?
  a: Cutting deletes what does no work and keeps one idea a sentence. Compressing packs the same
    content into fewer, longer sentences, which makes them harder to read.
- q: What kind of word must never be cut, however much it looks like padding?
  a: A word that limits the claim, such as an age range, a place, a year, a denominator or "or
    obese". Without it the claim gets wider than the data.
