simplified_explanation: |
  Every sentence in your paper that rests on someone else's work carries a number, such as (3).
  The number points to one entry in the list at the end of the paper, the reference list. Number
  your sources in the order the reader first meets them. A source you use again keeps the number it
  got first. The numbers are Arabic numerals, the ordinary 1, 2, 3.

  Cite what you actually read. Suppose you saw a figure in a review. Open the paper the review
  took it from, and cite that paper if it says what you claim. If you read a preprint, a paper posted
  publicly before a journal has checked and accepted it, cite the preprint and say it is one.

  Write every entry in the list in the same order, with the same punctuation, so a reader can find
  the paper in seconds. A reference manager, a program that stores your references and types out
  the list, can do the typing. It cannot tell whether an entry is right, or whether the paper says
  what you claim. You check that.

  One word needs a gloss. ICMJE asks you not to cite predatory or pseudo-journals, and the section
  does not define them. In this book, read the phrase as journals that present themselves as
  checking what they publish and do not. How to recognise one is taught at the next rung.
illustrations:
- body: |
    Start with a shortcut that fails. You want to cite a paper on figures that this book uses
    later. Its journal page offers a ready-made line, headed "Citation". Copy it into your
    reference list, and the entry reads:

    > Rougier NP, Droettboom M, Bourne PE (2014) Ten Simple Rules for Better Figures. PLoS Comput
    > Biol 10(9): e1003833. https://doi.org/10.1371/journal.pcbi.1003833

    That line is the journal's own style, not NLM's. Put it among entries in NLM format and it
    stands out. The year sits after the authors, every main word of the title has a capital, and
    the punctuation differs. Rebuild it one element at a time, in the order Citing Medicine lists
    them. The journal page also says "Published: September 11, 2014".

    ```table
    | element | the journal's line | the NLM rule | your entry |
    | authors | Rougier NP, Droettboom M, Bourne PE | surname first, at most two initials; a full stop after the last author | Rougier NP, Droettboom M, Bourne PE. |
    | article title | Ten Simple Rules for Better Figures | a capital only on the first word and on proper nouns; a full stop | Ten simple rules for better figures. |
    | journal title | PLoS Comput Biol | the abbreviation in the NLM Catalog; a full stop | PLoS Comput Biol. |
    | date | (2014), after the authors | year, month, day; the month in its first three letters; a semicolon | 2014 Sep 11; |
    | volume and issue | 10(9): | the volume, then the issue in parentheses, then a colon | 10(9): |
    | pages | e1003833 | where the pages go; a full stop | e1003833. |
    ```

    Put the right-hand column together:

    > Rougier NP, Droettboom M, Bourne PE. Ten simple rules for better figures. PLoS Comput Biol.
    > 2014 Sep 11;10(9):e1003833.

    Two checks remain. First, look the journal up in the NLM Catalog,
    https://www.ncbi.nlm.nih.gov/nlmcatalog/journals, and confirm that its abbreviation is the one
    the journal printed. Do not take the journal's line as proof of that. Second, this journal
    gives "e1003833" where a page range would go, in its line and so in yours. If your target
    journal asks for the DOI, the paper's permanent identifier, add it at the end, as Citing
    Medicine's example 71 does: doi:10.1371/journal.pcbi.1003833.

    Citing Medicine is at https://www.ncbi.nlm.nih.gov/books/NBK7256/, and its chapter 1 covers
    journals. ICMJE's references section is at
    https://www.icmje.org/recommendations/browse/manuscript-preparation/preparing-for-submission.html.
  analogy_breaks_when: |
    This rebuilds one kind of source: a journal article with three authors and no page range. A
    book, a report such as the NFHS fact sheet, a web page or a dataset follows other chapters of
    Citing Medicine, which this section does not teach. Open the right chapter before you format one.

    A journal may also ask for its own variant: fewer authors before "et al.", no day of the month,
    no issue number, or the DOI. Its instructions for authors win over this table.
  numbers:
  - value: "2014"
    quote: "Published: September 11, 2014"
    unit: year of publication of Rougier, Droettboom and Bourne's paper
    citekey: rougier_2014_ten_rules_figures
  - value: "11"
    quote: "Published: September 11, 2014"
    unit: day of the month of publication (September)
    citekey: rougier_2014_ten_rules_figures
  - value: "10"
    quote: "Citation: Rougier NP, Droettboom M, Bourne PE (2014) Ten Simple Rules for Better Figures. PLoS Comput Biol 10(9): e1003833. https://doi.org/10.1371/journal.pcbi.1003833"
    unit: volume number
    citekey: rougier_2014_ten_rules_figures
  - value: "9"
    quote: "Citation: Rougier NP, Droettboom M, Bourne PE (2014) Ten Simple Rules for Better Figures. PLoS Comput Biol 10(9): e1003833. https://doi.org/10.1371/journal.pcbi.1003833"
    unit: issue number
    citekey: rougier_2014_ten_rules_figures
- body: |
    Now the numbers in the text. Your draft introduction cites four sources, called A, B, C and D
    here, and has one table. Go through the text from the top. Each source gets the next free
    number the first time the text mentions it. A source cited only inside the table gets its
    number where the text first mentions the table.

    ```table
    | where in the text | what it cites | number in the text |
    | sentence 1 | A | (1) |
    | sentence 2 | B | (2) |
    | sentence 3 | A again | (1) |
    | sentence 4, which first mentions Table 1 | Table 1 cites D | D is (3) |
    | sentence 5 | C | (4) |
    ```

    Two things here catch people. A cited again in sentence 3 is still (1): a source keeps its
    first number however often you return to it. And D gets 3, before C, although D appears only
    in the table. The table entered the text at sentence 4, so D's number comes from there. C, in
    sentence 5, gets 4. The reference list then runs 1 to 4 in that order: A, B, D, C.

    Now move sentence 5 above sentence 4 in a later draft. C becomes (3) and D becomes (4), in
    the text, in the table and in the list. Let your reference manager do the renumbering, then
    read the numbers once more against the list.
  analogy_breaks_when: |
    This numbering is the system ICMJE describes, with the numbers in parentheses. A journal's
    instructions may show the numbers in another form, or may not number references at all; then
    its instructions tell you how to order the list.
- body: |
    Here is the trap with a number found second-hand. Suppose you read in a review that about a
    quarter of Indian women have overweight or obesity, citing the national survey. The review is
    invented for this example. Do not cite the review for the number. Do not cite the survey on the
    review's word either.

    Open the NFHS-5 India fact sheet at
    https://dhsprogram.com/pubs/pdf/OF43/India_National_Fact_Sheet.pdf and find indicator 88, women
    with overweight or obesity. The row reads {{n:nfhs5_women_ow_ob_urban_pct}},
    {{n:nfhs5_women_ow_ob_rural_pct}}, {{n:nfhs5_women_ow_ob_pct}} and {{n:nfhs4_women_ow_ob_pct}}:
    NFHS-5 urban, rural and total, then the NFHS-4 total, in per cent of women aged 15-49. "About a quarter" was the total,
    {{n:nfhs5_women_ow_ob_pct}} per cent. Write your sentence from the row you read, with the age
    range the row carries, and cite the fact sheet.

    The same rule covers versions of one paper. NLM's page of sample references lists a preprint,
    "Ten simple rules for structuring papers", posted on bioRxiv, a website for preprints. Its
    authors are given as "Kording KP, Mensh B", and it is dated 2016 and marked "[Preprint]". The paper this book cites under that title is the one published in 2017 in
    PLoS Computational Biology. Its copyright line reads "Mensh, Kording": the other name comes
    first. If you read the preprint, cite the preprint and mark it as one. If you read the journal's
    version, cite that. A reader who searches for one with the details of the other may not find it.
  analogy_breaks_when: |
    Opening the original tells you what it says. It does not tell you that it is right, or that a
    later paper has not overturned it; Book 0's section on checking a reference (`B0-R0-C41`)
    stops at the same place.

    The fact sheet's figure is a share of women aged 15-49 in 2019-21. It is not a figure for all
    adult women, and the review's "about a quarter" hides that.
  numbers:
  - value: "24.0"
    quote: "88. Women who are overweight or obese (BMI ≥25.0 kg/m2)21 (%) 33.2  19.7  24.0  20.6"
    unit: per cent of women aged 15-49 overweight or obese, NFHS-5 (2019-21), India total
    citekey: nfhs5_india_factsheet
  - value: "33.2"
    quote: "88. Women who are overweight or obese (BMI ≥25.0 kg/m2)21 (%) 33.2  19.7  24.0  20.6"
    unit: per cent, NFHS-5, urban India
    citekey: nfhs5_india_factsheet
  - value: "19.7"
    quote: "88. Women who are overweight or obese (BMI ≥25.0 kg/m2)21 (%) 33.2  19.7  24.0  20.6"
    unit: per cent, NFHS-5, rural India
    citekey: nfhs5_india_factsheet
  - value: "20.6"
    quote: "88. Women who are overweight or obese (BMI ≥25.0 kg/m2)21 (%) 33.2  19.7  24.0  20.6"
    unit: per cent, NFHS-4 (2015-16), India total
    citekey: nfhs5_india_factsheet
  - value: "2016"
    quote: "Kording KP, Mensh B. Ten simple rules for structuring papers. BioRxiv [Preprint]. 2016 bioRxiv 088278"
    unit: year of the bioRxiv preprint
    citekey: nlm_citing_medicine_2007
  - value: "2017"
    quote: "© 2017 Mensh, Kording"
    unit: year of the published paper in PLoS Computational Biology
    citekey: mensh_kording_2017_structuring_papers
must_know:
- point: |
    Open the original before you cite it. If you met a finding in a review, find the paper the
    review cites and read the passage. Cite that paper only if it says what you claim. If you
    have read only the abstract, find the full article; ICMJE asks for the article, not its
    abstract.
  kind: move
  bearing: methodological
  refs: [icmje_2026_manuscript_preparation]
- point: |
    "My reference manager makes my references correct" is the error. It formats what it was given,
    and what it was given can be wrong. Check every entry against PubMed or the paper itself, and
    check that the paper supports the sentence it is attached to. ICMJE puts both on the authors.
  kind: misconception
  bearing: methodological
  refs: [icmje_2026_manuscript_preparation]
- point: |
    Before you submit, check that no reference is a retracted paper. Search PubMed for
    "Retracted publication [pt]", or look each paper up in PubMed. Cite a retracted paper only to
    discuss the retraction.
  kind: trap
  bearing: methodological
  refs: [icmje_2026_manuscript_preparation]
- point: |
    Cite something not formally published by what it is. A preprint carries "[Preprint]". A paper
    accepted but not yet out is "forthcoming", NLM's preferred word, or "in press". A submitted
    manuscript is "unpublished observations" in the text, with written permission. Cite a personal
    communication only when no public source has the information. Put the person's name and the
    date in the text, and get their written permission.
  kind: move
  bearing: methodological
  refs: [icmje_2026_manuscript_preparation, nlm_citing_medicine_2007]
- point: |
    Never cite an AI tool as the source of a fact. ICMJE does not accept AI-generated material as
    the primary source. If a tool gives you a reference, find the paper, open it, and read the
    passage before you cite it. If you cannot find it, do not cite it.
  kind: trap
  bearing: methodological
  refs: [icmje_2026_manuscript_preparation]
- point: |
    Do not cite a paper from a predatory or pseudo-journal; ICMJE asks you to avoid them. Telling
    one apart is taught at the next rung. Until then, if you cannot say whether a journal really
    checks what it publishes, ask your guide before you cite it.
  kind: trap
  bearing: methodological
  refs: [icmje_2026_manuscript_preparation]
- point: |
    How many authors to list is the journal's choice. Citing Medicine gives all of them. NLM's
    sample page lists six and then "et al.", and notes that NLM itself now lists all. Read the
    journal's instructions, set your reference manager to match, and check the first entry with
    more than six authors by eye.
  kind: dispute
  bearing: methodological
  refs: [nlm_citing_medicine_2007]
- point: |
    The committee behind these Recommendations was once known as the Vancouver Group. If a
    journal asks for "Vancouver" references, read its instructions with this section open. Where
    the journal states its own variant, the journal wins. Where it is silent, ICMJE's numbering
    and NLM's format are the default.
  kind: move
  bearing: methodological
  refs: [sollaci_pereira_2004_imrad, icmje_2026_manuscript_preparation]
- point: |
    A reference in perfect NLM format can still point to a paper that does not say what your
    sentence says. Format tells a reader where to look; only the passage tells them whether you
    were right. When you check a student's thesis, open three of its references at random and
    read the passages they point to.
  kind: boundary
  bearing: teaching
  refs: [icmje_2026_manuscript_preparation]
common_misreading: |
  "Number the references in order" read as sorting the list, by author or by year. The order is
  the order in which the text first mentions each source. A source cited again keeps its first
  number. A source cited only in a table takes its number from where the text first mentions the
  table. The reference list is then printed in number order.
reporting_sentence: |
  Among women aged 15-49 in India, {{n:nfhs5_women_ow_ob_pct}} per cent had overweight or obesity in
  NFHS-5 (2019-21), against {{n:nfhs4_women_ow_ob_pct}} per cent in NFHS-4 (2015-16) (1).
figure_note: "The section's content is the order and punctuation of a written reference, which the illustration's table shows element by element; a chart would plot nothing."
exercises:
- type: retrieval
  prompt: |
    From memory: in what order does ICMJE number references, and how does it show them in the
    text? Then list, in order, the elements of an NLM reference to an ordinary journal article.
  answer: |
    References are numbered in the order the text first mentions them. A source cited again keeps
    its first number. A source cited only in a table or a figure legend gets its number where the
    text first mentions that table or figure. In the text, each number is in parentheses, such as
    (3).

    The elements, in order: authors; article title; journal title, abbreviated; date; volume;
    issue, in parentheses; pages.
  confidence_first: true
- type: critique
  prompt: |
    Your target journal follows ICMJE and NLM, and lists up to six authors before "et al.". A
    co-author hands you these two entries. Rewrite each in NLM format. The second paper is in
    volume 13, issue 4. Its four authors are Tracey L Weissgerber, Natasa M Milic, Stacey J Winham
    and Vesna D Garovic.

    1. Cole, T. J. (2015). Too Many Digits: The Presentation of Numerical Data. Archives of Disease
       in Childhood, 100(7), 608-609.
    2. Weissgerber TL et al. Beyond Bar and Line Graphs: Time for a New Data Presentation
       Paradigm. PLoS Biol 2015; 13: e1002128
  answer: |
    Entry 1:

    > Cole TJ. Too many digits: the presentation of numerical data. Arch Dis Child.
    > 2015;100(7):608-9.

    The initials lose their full stops and come straight after the surname. The year moves to the
    date position. The title keeps a capital only on its first word. The journal title is
    abbreviated; confirm "Arch Dis Child" in the NLM Catalog. The page range 608-609 becomes 608-9.
    No month is given, so the date is the year alone, as in NLM's sample entry "Brain Res.
    2002;935(1-2):40-6."

    Entry 2:

    > Weissgerber TL, Milic NM, Winham SJ, Garovic VD. Beyond bar and line graphs: time for a new
    > data presentation paradigm. PLoS Biol. 2015;13(4):e1002128.

    Four authors is fewer than six, so all four are listed and "et al." goes. The title drops its
    capitals after the first word, keeping the colon. The issue, 4, was missing; it goes in
    parentheses after the volume. A full stop follows the journal title, and the spaces round
    the semicolon go. Confirm "PLoS Biol" in the NLM Catalog.

    Last, check both against the papers themselves or PubMed, not against your co-author's list.
- type: interpretation
  prompt: |
    A draft paragraph cites sources P, Q, R and S. Sentence 1 cites P as (1). Sentence 2 cites Q as
    (2). Sentence 3 first mentions Table 1, which cites R; the draft numbers R as (5), "because it
    is only in a table". Sentence 4 cites S as (3). Sentence 5 cites P again, as (4). Which numbers
    are wrong under ICMJE's rule, and what should every number be?
  answer: |
    Two numbers are wrong. R is numbered where the text first mentions Table 1, which is sentence
    3. R is the third source met, so it is (3), not (5). And P in sentence 5 is a source already
    cited, so it keeps its first number, (1), not (4).

    S, first met in sentence 4 after R, then becomes (4). The correct numbers are P (1), Q (2),
    R (3), S (4), and P again (1). The reference list runs P, Q, R, S.
- type: teaching
  prompt: |
    A first-year resident asks: "I found the NFHS-5 figure for women in a review article. Why can
    I not cite the review, when it gives the same number?" Ten minutes, with a whiteboard.
  answer: |
    Start with what a reference promises. It tells the reader where the evidence for this sentence
    is. If you cite the review, you send them to someone else's account of the survey. ICMJE warns
    that reviews do not always report the original accurately.

    Then show the difference on the board. Write "about a quarter of Indian women have overweight or
    obesity", the kind of line a review might carry. Under it, write what the fact sheet's indicator
    88 says. It gives {{n:nfhs5_women_ow_ob_pct}} per cent of women aged 15-49 in 2019-21:
    {{n:nfhs5_women_ow_ob_urban_pct}} per cent in urban areas and {{n:nfhs5_women_ow_ob_rural_pct}}
    per cent in rural areas. The age range, the dates and the urban-rural split were lost in the second-hand line.
    Ask her which sentence she would rather defend in her viva.

    Then the rule: open the fact sheet, read the row, write the sentence from it, and cite the
    fact sheet. Cite the review only for what the review itself adds, such as its own judgement
    across several studies.
retrieval_items:
- q: In the ICMJE system, what number does a source cited for the second time get?
  a: The number it got when the text first mentioned it.
- q: How is a source cited only in a table numbered?
  a: By where the text first mentions that table.
- q: What does Citing Medicine say about versions?
  a: Cite the version you saw; for example, not the print version if you used the Internet one. A preprint you read is cited as a preprint.
- q: How should a personal communication be cited, according to ICMJE?
  a: Only if it gives essential information no public source has; the person's name and the date in parentheses in the text, with written permission and confirmation of accuracy.
