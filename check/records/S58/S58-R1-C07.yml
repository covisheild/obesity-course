simplified_explanation: |
  A reader reads your sentence once and decides what it said.

  Say one thing in each sentence.

  Put the verb soon after the subject.

  Put the action in the verb. Write "the proportion rose", not "an increase was observed".

  Start with what the reader already knows, and end with what is new.

  Name who did it when that matters. If it was you, write "we".
illustrations:
- body: |
    Start with a sentence that fails. It is made up, but its numbers are the survey's own, and
    sentences like it fill Indian thesis chapters. NFHS-4 is the round of the survey before NFHS-5.

    > An increase in the proportion of women in the age group of 15 to 49 years with overweight or obesity, from {{n:nfhs4_women_ow_ob_pct}} per cent in NFHS-4 (2015-16) to {{n:nfhs5_women_ow_ob_pct}} per cent in NFHS-5 (2019-21), as per the India fact sheet of the survey, was observed.

    Mend it in five steps.

    **1. Find the subject and the verb.** The verb is "was observed", the last two words. Ask what
    was observed: an increase. The subject's main word is "increase", the second word. Count the
    words between them: 41. The reader carries 41 words, waiting to learn what the increase did.
    When the verb arrives, it says only that somebody saw it.

    **2. Find the action.** What happened? A proportion rose. The action is hidden in the noun
    "increase", and an empty verb, "was observed", carries it. Turn the noun back into a verb:
    rose.

    **3. Find whose story it is.** Nobody in the sentence did anything worth naming. The story is
    the proportion's. Make it the subject, and put "rose" straight after it.

    **4. Put old information first and new information last.** The reader of your results chapter
    already knows the study is about women aged 15 to 49. That goes first. The new thing is where
    the proportion got to, {{n:nfhs5_women_ow_ob_pct}} per cent. That goes last, where a reader
    puts the most weight.

    **5. Take out what belongs somewhere else.** "As per the India fact sheet of the survey" is a
    source. It becomes a reference number, as the section on citing set out (`S58-R1-C05`).

    > Among women aged 15 to 49, the proportion with overweight or obesity rose from {{n:nfhs4_women_ow_ob_pct}} per cent in NFHS-4 (2015-16) to {{n:nfhs5_women_ow_ob_pct}} per cent in NFHS-5 (2019-21).

    Now count both sentences, and set them beside a published one. Gopen and Swan found the same
    fault in a paper on genes. Its first sentence was 42 words long. Search their article for "23
    words".

    > Note that the grammatical subject (“the smallest”) is separated from its verb (“has been identified”) by 23 words, more than half the sentence.

    The third sentence of the same passage was 62 words long, with 27 words between its subject,
    "experiments", and its verb, "have indicated".

    ```table
    | sentence | words in the sentence | words between subject and verb |
    | Gopen and Swan, first | 42 | 23 |
    | Gopen and Swan, third | 62 | 27 |
    | survey, before (made up) | 45 | 41 |
    | survey, after | 27 | 4 |
    ```

    The mended sentence is shorter. That is a side effect, not the aim. The gap between subject and
    verb fell by 37 words, from 41 to 4, and the number you want remembered now sits at the end.
  analogy_breaks_when: |
    The steps worked because this sentence had one point. Gopen and Swan's own rewrite of their
    gene passage was not shorter than the original, and they say sheer length was neither the
    problem nor the solution. If a sentence holds two points that each deserve weight, it needs
    two sentences, and the paragraph gets longer.

    "Old information first" depends on what the reader already has. The same sentence, opening the
    first paragraph of a paper, comes before the reader knows the study is about women aged 15 to
    49. There it may need a sentence of context before it.
