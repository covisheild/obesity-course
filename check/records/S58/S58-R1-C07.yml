- body: |
    Now the other direction. The active voice is not always the better sentence. Gopen and Swan
    give a pair: "Bees disperse pollen" and "Pollen is dispersed by bees". The first is a sentence
    about bees, the second a sentence about pollen. In a paragraph telling the story of pollen, the
    passive one is better.

    Try the same test on a methods paragraph. This one is made up.

    > Each woman was weighed twice. The two readings were averaged.

    Ask of each verb: does the reader need to know who did it? For the weighing, yes. A reviewer
    judging the measurement needs to know whether trained staff weighed the women, or the women
    read their own scales. So name the doer.

    > Two trained field staff weighed each woman twice. The two readings were averaged.

    For the averaging, no. The average comes out the same whoever works it out, and the sentence
    carries on the story of the readings. It can stay passive.

    When the doer is you, write "we". Gopen and Swan rewrote a chemistry passage so that it opened
    "We have directly measured", because the authors' own measurement was the news. In their words,
    "since the authors performed the first direct measurement, recognizing their agency in the
    topic position may well be appropriate."
  analogy_breaks_when: |
    Whether "we" is welcome is a matter for the journal or the university. Look at its instructions
    and at papers it has recently published. The test in this illustration still applies inside the
    passive: if a reader needs the doer, a passive sentence must name it after "by".

    "Does the reader need to know who did it?" has no answer fixed for all time. A step that seems
    to need no doer, such as averaging, needs one the day someone asks whether the averages were
    checked.
- body: |
    Last, a sentence with too many points. It is made up, of a kind common in methods chapters.

    > Height and weight were measured by trained field staff using a stadiometer and a digital scale respectively, and body mass index (BMI) was calculated and women were classified as having overweight or obesity using a cut-off of {{n:nfhs5_ow_ob_bmi_cutoff}} kg/m^2.

    Count the points that deserve weight. Who measured, with what, how BMI was worked out, and
    where the cut-off sits. That is four, and a sentence has one end. Split it, giving each point a
    sentence of its own.

    > Trained field staff measured each woman's height with a stadiometer and her weight with a digital scale. From these we worked out her body mass index (BMI). We counted a BMI of {{n:nfhs5_ow_ob_bmi_cutoff}} kg/m^2 or more as overweight or obesity.

    Here is the tempting wrong fix. It compresses instead of splitting.

    > Trained-staff stadiometer and digital-scale height-weight measurement-based BMI cut-off classification was done.

    It is shorter, and it is worse. It turns every action into a noun, stacks the nouns, and ends
    on an empty verb. The US Federal Plain Language Guidelines warn that "Readability suffers when
    three words that are ordinarily separate nouns follow in succession." This one stacks more than
    three.
  analogy_breaks_when: |
    Splitting can cut a link the reader needs. An "if" and its "then" belong together. When you
    split them, carry the link into the second sentence with a word such as "in this case", as the
    US Federal Plain Language Guidelines do with "suppose" and "in this case". Splitting is right
    when the points can stand apart; when they cannot, keep the link word.

    The cut-off of {{n:nfhs5_ow_ob_bmi_cutoff}} kg/m^2 is the one the NFHS-5 fact sheet uses for adults aged 15 to 49. A
    thesis that uses another cut-off states its own.
