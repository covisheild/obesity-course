must_know:
- point: |
    Find the subject and the verb, and count the words between them.
  kind: move
  bearing: teaching
  refs: [gopen_swan_1990_scientific_writing, plain_language_2011_guidelines]
- point: |
    "Long sentences are the problem, so cut words" is the error. The test is how many points in
    the sentence deserve weight.
  kind: misconception
  bearing: teaching
  refs: [gopen_swan_1990_scientific_writing]
- point: |
    Search your draft for the empty verbs that carry hidden actions: "was done", "was carried
    out", "was observed", "was performed".
  kind: trap
  bearing: teaching
  refs: [plain_language_2011_guidelines]
- point: |
    End a results sentence on the number or finding you want remembered.
  kind: move
  bearing: methodological
  refs: [gopen_swan_1990_scientific_writing, openstax_writing_guide_handbook]
- point: |
    In a methods section, name the doer of every step a reviewer would judge: who measured, who
    interviewed, who entered the data. Keep the passive only where the result is the same whoever
    did it.
  kind: consequence
  bearing: methodological
  refs: [plain_language_2011_guidelines, gopen_swan_1990_scientific_writing]
- point: |
    Split a sentence with several points into several sentences. A chain of three or more nouns
    makes the reader guess how they relate.
  kind: trap
  bearing: teaching
  refs: [plain_language_2011_guidelines]
- point: |
    These are principles, and they stop working when followed blindly. If a rewrite makes a
    sentence worse for its paragraph, as "Bees disperse pollen" would in a paragraph about pollen,
    keep the original.
  kind: boundary
  bearing: teaching
  refs: [gopen_swan_1990_scientific_writing]
common_misreading: |
  "One idea per sentence" read as "keep every sentence short", so that a draft is chopped until it
  scores well. That is not the principle. The test is the number of points that deserve weight,
  not the number of words. A 30-word sentence with one point and its subject next to its verb is
  clear. A 10-word sentence with two points is not. Chopping a draft into fragments also cuts the
  links that tell the reader how one sentence leads to the next.
reporting_sentence: |
  Among women aged 15 to 49 in India, the proportion with overweight or obesity rose from {{n:nfhs4_women_ow_ob_pct}} per cent in 2015-16 (NFHS-4) to {{n:nfhs5_women_ow_ob_pct}} per cent in 2019-21 (NFHS-5).
exercises:
- type: retrieval
  prompt: |
    Without looking back: where in a sentence does a reader put the most weight? Where does a
    reader look for the link to what came before? What should you put in each place?
  answer: |
    The most weight goes on the end of the sentence, the stress position. Put there the new
    information you want the reader to weigh most.

    The link to what came before is looked for at the start, the topic position. Put there the old
    information, which links back to what the reader already has, and the person or thing whose
    story the sentence tells.
- type: critique
  prompt: |
    This sentence is made up, from a clinic audit at a primary health centre.

    > Assessment of the adherence of the patients attending the hypertension clinic to their prescribed medicines by pill count was done at every visit by the staff nurse.

    Find the subject's main word and the verb, and count the words between them. Name the hidden
    verb and the doer. Then rewrite the sentence so that the doer is the subject and the action is
    the verb.
  answer: |
    The verb is "was done". Ask what was done: assessment. The subject's main word is
    "Assessment", the first word. Count the words between "Assessment" and "was done". There are
    17: "of the adherence of the patients attending the hypertension clinic to their prescribed
    medicines by pill count".

    The hidden verb is "assess", turned into the noun "assessment" and carried by the empty verb
    "was done". There is a second one: "adherence" hides "adhere", to take the medicines as
    prescribed. Both sit between "the" and "of", where hidden verbs often sit.

    The doer is the staff nurse, waiting at the end after "by".

    One rewrite:

    > At every visit, the staff nurse counted each patient's remaining pills to check whether they were taking their medicines as prescribed.

    The subject is now "the staff nurse", the doer, and the verb "counted" is the action. What the
    count is for comes last. Other rewrites are as good if they put the doer first and the action
    in the verb.
- type: teaching
  prompt: |
    A first-year resident brings you this pair from her thesis methods. She says you told her
    always to use the active voice, so she changed the first into the second.

    > Each blood sample was centrifuged within one hour of collection. Each blood sample was labelled with the participant's code.
    >
    > The laboratory technician centrifuged each blood sample within one hour of collection. The laboratory technician labelled each blood sample with the participant's code.

    You have ten minutes and a whiteboard. Explain when the active voice helps here and when it
    does not.
  answer: |
    Start with the test, not the rule. Ask of each verb: does a reader judging the study need to
    know who did it?

    For centrifuging within an hour, a reader may want to know who was responsible for the timing,
    because a delay changes the result. If that matters, the doer belongs in the sentence, and the
    active voice puts it there.

    For labelling, the doer matters less. Whoever writes the code, the label is the same. The
    passive keeps the story on the samples, which is what this paragraph is about.

    Then show what her change cost. Both sentences now begin "The laboratory technician", so the
    paragraph has become a story about the technician instead of the samples. Gopen and Swan's pair
    makes the same point. "Bees disperse pollen" and "Pollen is dispersed by bees" are each right
    in a paragraph about their own first word.

    One good version: "The laboratory technician centrifuged each blood sample within one hour of
    collection. Each sample was then labelled with the participant's code." The doer is named
    where it matters, and the second sentence carries on the samples' story.
- type: critique
  prompt: |
    Take five sentences from the results part of the manuscript section you chose for this book's
    build. For each, write down its subject, its verb, the number of words between them, and the
    last three words of the sentence. Rewrite any sentence whose gap is long, whose action hides
    in a noun, or whose last words are not the new information.
  answer: |
    Check your rewrites against four questions.

    - Is the subject next to its verb, or close to it, with any list or bracket moved to the end
      or to its own sentence?
    - Is the action a verb ("rose", "fell", "differed") rather than a noun carried by "was
      observed" or "was found"?
    - Does each sentence end on the new information, usually the number or the finding, and not
      on a source, a table number or "was seen"?
    - Does each sentence carry one point? If a rewrite holds two, split it, and carry any "if" or
      "because" link into the second sentence.

    Read your five rewrites aloud in order. If they now read as a sequence, with each start linking
    to the end of the sentence before, they pass.
retrieval_items:
- q: What is the gap between subject and verb, and why does it matter?
  a: The words that sit between a subject and its verb. Readers expect the verb straight after
    the subject and read anything long in between as an interruption of lesser importance.
- q: What is a hidden verb, and where do you often find one?
  a: An action turned into a noun, such as "assessment" or "increase", carried by an empty verb
    such as "was done". It often sits between "the" and "of".
- q: When is a sentence too long, by Gopen and Swan's test?
  a: When it has more points that deserve emphasis than it has places for emphasis. A word count
    does not decide it.
