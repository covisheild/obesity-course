  - value: '22.9'
    unit: per cent of men aged 15-49 overweight or obese, NFHS-5 total
    citekey: nfhs5_india_factsheet
    quote: 89. Men who are overweight or obese (BMI ≥25.0 kg/m2) (%) 29.8  19.3  22.9  18.9
  - value: '18.9'
    unit: per cent of men aged 15-49 overweight or obese, NFHS-4 total
    citekey: nfhs5_india_factsheet
    quote: 89. Men who are overweight or obese (BMI ≥25.0 kg/m2) (%) 29.8  19.3  22.9  18.9
- body: |
    Now give claim (b) its figure and its caption. Start with the caption, because it is where
    the claim is written down. Here is the draft's caption again, with the one this section
    builds beside it. The first is made up; the second uses the fact sheet's numbers.

    ```table
    | before | after |
    | Figure 3.2. Overweight and obesity in India, NFHS-4 and NFHS-5. | Figure 3.2. In NFHS-5 (2019-21), a larger share of urban than of rural adults aged 15-49 had overweight or obesity, in women and in men. Bars show the per cent with a body mass index of 25.0 kg/m^2 or more. Source: NFHS-5 India Fact Sheet, indicators 88 and 89. |
    ```

    The first names a topic. A reader who looks at it learns what the figure is about, and must
    work out the point alone. The second states the finding first, then says what the bars are,
    then where the numbers came from.

    Put the finding in the caption, not across the top of the drawing. The ICMJE Recommendations
    say: "Titles and detailed explanations belong in the legends—not on the illustrations
    themselves." Legend is the journals' word for the caption.

    Next, take off the drawing everything the claim does not use. The claim compares urban with
    rural, so the two totals go, and so do the two NFHS-4 bars. Four bars remain: urban and rural,
    for women and for men. Wilke puts the rule plainly: "We don’t need to visualize data
    dimensions that are tangential to our story". Tangential means off to one side of it.

    Then ask the harder question. Would anything you removed make a reader doubt the claim? The
    totals would not: they sit between urban and rural, as they must. Rural NFHS-4 numbers might.
    If the rural share had been rising faster than the urban one, a reader would want to know. This
    fact sheet gives NFHS-4 only as a total, so you cannot check it here. Say so in the text, and
    find the NFHS-4 report if the chapter's argument depends on it.

    Last, the medium. For your thesis, the figure sits on a page, with its caption, and the
    examiner can study it. For a talk, make it again. Rougier and colleagues say a slide figure
    needs thicker lines, bigger text and strong contrast, because the audience sees it from a
    distance for a short time. They also say to stop "extracting a figure from your article to be
    put, as is, in your oral presentation".
  analogy_breaks_when: |
    Removing the totals is safe here only because each total must lie between its urban and rural
    values. A dropped group that could fall outside the others, such as another survey round, is a
    different matter: check it before you cut it.

    The caption's first sentence is a claim about these two rows. It says nothing about any one
    state, about people over 49, or about why urban shares are higher.
  numbers: []
