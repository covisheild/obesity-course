concept_id: S58-R1-C14
subject: S58
rung: 1
sequence: 14
name: A figure makes one claim
concept_type: derivable
clusters:
- craft-and-integrity
- evidence-to-action
ground_floor_deps:
- B0-R0-C14
- B0-R0-C39
- B0-R0-C40
concept_deps:
- S58-R1-C03
definition:
  text: |
    A figure in a paper is drawn to make one claim: one statement about the data that a reader
    should be able to repeat after looking at it. The claim is written as a sentence before the
    kind of chart is chosen. One figure carries one claim.

    A result belongs in a sentence when it rests on a few numbers. It belongs in a table when the
    reader needs exact values, or will look up one row among many. It belongs in a figure when the
    claim is a pattern among many values, such as a trend, a gap or a ranking, that words would
    take too long to carry. The same numbers are not shown in both a table and a figure.

    The caption is the text printed with a figure; journals call it the figure legend. Its first
    sentence states the finding, not the topic.

    A figure on a printed page can be studied for as long as the reader likes. A figure on a slide
    is seen for a few seconds, from across a room, while someone talks. The two are made
    separately.
