simplified_explanation: |
  Before you draw anything, write down the one sentence you want a reader to take away from the
  figure. If you cannot write it, you do not have a figure yet.

  Then ask whether the claim needs a picture at all. Four numbers read well in a sentence. Forty do
  not.

  Last, put the sentence where the reader meets it first: the opening line of the caption.
illustrations:
- body: |
    Start with a figure that fails. A draft results chapter of a thesis has this caption. The
    draft is made up; the numbers under it are real.

    > Figure 3.2. Overweight and obesity in India, NFHS-4 and NFHS-5.

    Above it are eight bars in one cluster, with a key in the corner saying which colour is which. Find where the eight
    numbers came from. Open the *National Family Health Survey (NFHS-5), 2019-21: India Fact
    Sheet*, at https://dhsprogram.com/pubs/pdf/OF43/India_National_Fact_Sheet.pdf. Search for
    overweight or obese. Two rows come up.

    > 88. Women who are overweight or obese (BMI ≥25.0 kg/m2)21 (%) 33.2  19.7  24.0  20.6

    > 89. Men who are overweight or obese (BMI ≥25.0 kg/m2) (%) 29.8  19.3  22.9  18.9

    Read the rows as Book 0 taught you to read a table (`B0-R0-C39`). Each row is adults aged
    15-49. BMI is the body mass index (`B0-R0-C14`), and the sign ≥ means "greater than or equal
    to": the rows count a BMI of 25.0 kg/m^2 or more. The four columns are NFHS-5 (2019-21) urban,
    rural and total, then NFHS-4 (2015-16) total, all in per cent. The 21 after the bracket is a
    footnote mark.

    Now cover the figure and write the one sentence a reader should take away from it. Most people
    who try write two.

    > (a) Between NFHS-4 and NFHS-5, the share of adults aged 15-49 with overweight or obesity
    > rose, in women and in men.

    > (b) In NFHS-5, the share was higher in urban than in rural India, in women and in men.

    Each is a claim. The figure tries to carry both, so it carries neither. The reader faces eight
    bars and no hint of which comparison matters. Choose the claim your chapter argues: the one
    message you wrote for it (`S58-R1-C03`). Say the chapter is about the gap between town and
    village. Then (b) is this figure's claim.

    Claim (a) still has a home. Ask whether it needs a figure at all. It rests on four numbers, and
    a sentence holds four numbers easily.

    > Between NFHS-4 (2015-16) and NFHS-5 (2019-21), the share of adults aged 15-49 with
    > overweight or obesity rose from {{n:nfhs4_women_ow_ob_pct}} to {{n:nfhs5_women_ow_ob_pct}} per
    > cent in women, and from {{n:nfhs4_men_ow_ob_pct}} to {{n:nfhs5_men_ow_ob_pct}} per cent in men.

    That is a rise of {{n:nfhs5_women_ow_ob_change_pp}} percentage points in women and
    {{n:nfhs5_men_ow_ob_change_pp}} in men. No figure is needed, and the ICMJE Recommendations
    agree: "Restrict tables and figures to those needed to explain the argument of the paper".

    So where does each kind of result go? Ask how many numbers the result rests on, and what the
    reader has to do with them.

    ```table
    | the result rests on | the reader has to | put it in |
    | a few numbers | read them in passing | a sentence |
    | many exact values | look one up, or check it | a table |
    | many values | see a pattern: a trend, a gap, a ranking | a figure |
    ```

    Claim (b) also rests on four numbers, and in a paper it could be a sentence too. It becomes a
    figure's claim when the values multiply. Suppose your chapter compares urban and rural shares
    in every state. That is two numbers per state, too many for a sentence. If the reader needs
    to find their own state's values, use a table. If they need to see that urban sits above rural
    almost everywhere, use a figure. Never both: the same Recommendations say "do not duplicate
    data in graphs and tables".
  analogy_breaks_when: |
    Four national numbers are a sentence's job in a paper. The figure in this section draws claim
    (b) to show what a one-claim figure looks like, not because four numbers need one.

    The rows cover adults aged 15-49 only, and count overweight and obesity together. Whatever
    claim you choose has to stay inside those limits. Neither row says why the shares differ.
  numbers:
  - value: '33.2'
    unit: per cent of women aged 15-49 overweight or obese, NFHS-5 urban
    citekey: nfhs5_india_factsheet
    quote: 88. Women who are overweight or obese (BMI ≥25.0 kg/m2)21 (%) 33.2  19.7  24.0  20.6
  - value: '19.7'
    unit: per cent of women aged 15-49 overweight or obese, NFHS-5 rural
    citekey: nfhs5_india_factsheet
    quote: 88. Women who are overweight or obese (BMI ≥25.0 kg/m2)21 (%) 33.2  19.7  24.0  20.6
  - value: '24.0'
