must_know:
- point: |
    Write the figure's claim as one sentence before you open any program that draws charts.
  kind: move
  bearing: methodological
  refs: [rougier_2014_ten_rules_figures]
- point: |
    "A result looks more serious as a figure" is the error. A few numbers belong in a sentence,
    where the reader takes them in without stopping.
  kind: misconception
  bearing: methodological
  refs: [icmje_2026_manuscript_preparation]
- point: |
    Never show the same numbers in a table and in a figure.
  kind: trap
  bearing: methodological
  refs: [icmje_2026_manuscript_preparation]
- point: |
    Make the first sentence of every caption the finding, not the topic. "Overweight and obesity,
    NFHS-4 and NFHS-5" names a topic. "A larger share of urban than of rural adults had
    overweight or obesity" is a finding.
  kind: move
  bearing: methodological
  refs: [icmje_2026_manuscript_preparation]
- point: |
    Do not lift a figure from your paper onto a slide.
  kind: consequence
  bearing: teaching
  refs: [rougier_2014_ten_rules_figures]
- point: |
    The one-claim rule lets you cut data that are off to the side of the claim. It never lets you
    cut data that would weaken it.
  kind: boundary
  bearing: methodological
  refs: [rougier_2014_ten_rules_figures, wilke_2019_dataviz_ch29]
- point: |
    Wilke recommends three to six figures for a scientific paper, with the rest moved to an
    appendix or supplement. The journal's instructions to authors set the actual limit; read them
    first.
  kind: number
  bearing: methodological
  refs: [wilke_2019_dataviz_ch29]
- point: |
    A clear figure persuades whether or not its claim is true.
  kind: boundary
  bearing: public
common_misreading: |
  "One figure, one claim" is easily read as "one figure, few numbers". It limits what the figure
  says, not how much data it shows. A figure claiming that urban shares are above rural ones in
  every state shows two numbers for each state, and it still makes one claim. A figure with only
  four bars can make three claims at once and fail.
reporting_sentence: |
  Figure 1. In NFHS-5 (2019-21), a larger share of urban than of rural adults aged 15-49 had
  overweight or obesity, in both women and men. The shares were {{n:nfhs5_women_ow_ob_urban_pct}}
  against {{n:nfhs5_women_ow_ob_rural_pct}} per cent in women, and {{n:nfhs5_men_ow_ob_urban_pct}}
  against {{n:nfhs5_men_ow_ob_rural_pct}} per cent in men.
exercises:
- type: retrieval
  prompt: |
    From memory: when does a result belong in a sentence, when in a table, and when in a figure?
    Where does a figure's claim go, and what must never be shown twice?
  answer: |
    A sentence, when the result rests on a few numbers. A table, when the reader needs exact
    values or will look up one row among many. A figure, when the claim is a pattern among many
    values: a trend, a gap, a ranking.

    The claim goes in the first sentence of the caption, which journals call the legend, not on
    the drawing.

    The same numbers are never shown in both a table and a figure.
  confidence_first: true
- type: critique
  prompt: |
    A colleague's clinic audit has this caption over a figure of three panels. The audit is made
    up.

    > Figure 2. Clinic attendance, BMI categories and waist circumference, by age group and sex,
    > April 2024 to March 2025.

    Panel A shows monthly attendance as a line. Panel B shows the share of patients in each BMI
    category, by age group, as stacked bars. Panel C shows mean waist circumference by sex, as two
    bars. The text says the audit's main finding is that the share of patients with a BMI of 25.0
    kg/m^2 or more rises with age. Say what is wrong and what you would do.
  answer: |
    The caption names three topics and states no finding. So the figure has no claim, or three.

    The audit's finding is about BMI by age, so panel B is the figure. Its caption opens with the
    finding: "The share of patients with a BMI of 25.0 kg/m^2 or more rose with age group." Then
    it says what the bars show and where the data came from.

    Panel A, monthly attendance, is not part of that claim. It belongs in a sentence in the
    methods or results, such as how many patients were seen, or nowhere.

    Panel C rests on two numbers. A sentence holds them, with each mean and its count.

    Check one thing before cutting. Would attendance or waist circumference make a reader doubt
    the BMI finding? If attendance by older patients fell sharply in some months, for example, the
    reader needs to know who was measured. Say that in the text.
- type: design
  prompt: |
    Take the manuscript or thesis section you are rewriting for this book. List every result in
    it. For each, write the one-sentence claim, then decide: sentence, table or figure. For each
    figure, write the first sentence of its caption. Check that no numbers appear in both a table
    and a figure.
  answer: |
    Check your list against four tests.

    - Every result has a claim written as a sentence with a verb, not a topic. "BMI by age group"
      fails; "The share with a BMI of 25.0 kg/m^2 or more rose with age" passes.
    - Every result resting on a few numbers is in a sentence.
    - Every figure's claim is a pattern among many values, and each figure has one claim. Two
      claims in one figure means two figures, or one claim moved to the text.
    - No numbers appear in both a table and a figure. Where they do, keep the table if readers
      will look values up, and the figure if they need to see the pattern.

    If you have more than about six figures, ask which ones the argument needs. Move the others
    to a supplement, or cut them.
  skill_ref: S58-R1-K02
- type: teaching
  prompt: |
    A first-year resident wants to keep all eight NFHS bars in one figure, "so the reader has
    everything". Ten minutes, with a whiteboard. Explain why one claim per figure, and what
    happens to the numbers she takes off.
  answer: |
    Start with the reader. Ask her to look at her eight bars for five seconds, then say what the
    figure shows. She will name a topic, or two findings. That is the problem: a reader given
    everything has to choose the finding alone, and may choose the wrong one.

    Write the two candidate claims on the board: the rise between survey rounds, and the gap
    between urban and rural. Ask which one her chapter argues. That one gets the figure.

    Then show where the other numbers go. The rise rests on four numbers, so it becomes a
    sentence. The totals sit between urban and rural, so they add nothing to the gap. Nothing is
    hidden: every number is still in the chapter, in the place that suits it.

    End with the caption. Write the finding as its first sentence, and show her how the figure now
    reads in two seconds.
