simplified_explanation: |
  When you write up a study, the easy thing is to tell it the way it happened. First we did this,
  then we did that, and then we found this. That is a diary.

  Your reader does not want the diary. They want two things: what you found, and why they should
  believe it. So each part of the paper says what it found, and then gives the numbers and the
  reasons that back it up.

  The steps you took still matter, because a reader has to be able to check them. They go in the
  methods, once, and not scattered through the results.
illustrations:
- body: |
    Start with a results paragraph written as a diary. It is made up for this section, but its
    numbers are real: they are the overweight-or-obese rows of the National Family Health Survey
    fact sheet for India.

    > We opened the NFHS-5 India fact sheet and went to the section on the nutritional status of
    > adults. We first read the row for women aged 15-49 and found that
    > {{n:nfhs5_women_ow_ob_pct}} per cent were overweight or obese. We then read the row for men
    > and found {{n:nfhs5_men_ow_ob_pct}} per cent. Next we read the NFHS-4 column, which gave
    > {{n:nfhs4_women_ow_ob_pct}} per cent for women and {{n:nfhs4_men_ow_ob_pct}} per cent for
    > men. Finally, we subtracted each NFHS-4 figure from its NFHS-5 figure.

    Every sentence is true. Now ask of each one: what claim does this support? You cannot answer,
    because no sentence states a claim. The paragraph ends at the subtraction and never gives its
    result. The reader has to do the arithmetic and draw the conclusion, which is the writer's job.

    So ask the question the diary never answers: what did you find? Write the answer as one
    sentence. Here it is that the share of adults overweight or obese rose between the two
    surveys, in women and in men.

    Put that sentence first. Then keep only the evidence it needs, in the order it needs it: women
    with both surveys, then men with both surveys. Do the subtraction yourself and print the
    answer.

    ```working
    {{n:nfhs5_women_ow_ob_pct}} minus {{n:nfhs4_women_ow_ob_pct}} = {{n:nfhs5_women_ow_ob_change_pp}}
    {{n:nfhs5_men_ow_ob_pct}} minus {{n:nfhs4_men_ow_ob_pct}} = {{n:nfhs5_men_ow_ob_change_pp}}
    ```

    The differences are in percentage points, the plain difference between two percentages, as
    Book 0 taught it. Here is the paragraph rewritten.

    > The share of adults aged 15-49 who were overweight or obese rose between the two surveys, in
    > women and in men. In women it rose from {{n:nfhs4_women_ow_ob_pct}} per cent in NFHS-4
    > (2015-16) to {{n:nfhs5_women_ow_ob_pct}} per cent in NFHS-5 (2019-21), by
    > {{n:nfhs5_women_ow_ob_change_pp}} percentage points. In men it rose from
    > {{n:nfhs4_men_ow_ob_pct}} to {{n:nfhs5_men_ow_ob_pct}} per cent, by
    > {{n:nfhs5_men_ow_ob_change_pp}} percentage points.

    The steps did not vanish. "We took the share overweight or obese for each sex from the NFHS-4
    and NFHS-5 India fact sheets and subtracted the first from the second" is one sentence, and it
    goes in the methods.

    Last, say what the claim does not cover. It is about adults aged 15-49 only. Overweight and
    obese are counted together, because the fact sheet gives no separate row for obese. And two
    surveys of different people show that the share rose, not why it rose.
  analogy_breaks_when: |
    This paragraph carries one claim with four numbers, so the claim-first order is easy to see.
    A paragraph whose claim needs a chain of steps, such as a check that a measurement worked
    before it is used, keeps those steps in the order the logic needs. That order is still the
    argument's, not the diary's.

    The numbers hold for India as a whole, for the two survey rounds named. They are not a figure
    for any one state or district.
  numbers:
  - value: "{{n:nfhs5_women_ow_ob_pct}}"
    unit: per cent of women aged 15-49 overweight or obese, NFHS-5 (2019-21), India
