must_know:
- point: |
    "The results should follow the order in which the work was done" is the error. They follow the
    order the argument needs. The steps of the work go once, in the methods, and every results
    paragraph opens on what it found.
  kind: misconception
  bearing: methodological
  refs: [mensh_kording_2017_structuring_papers]
- point: |
    Before you write a results paragraph, write its claim as one sentence. Keep only the sentences
    that support that claim, and put the claim first. ICMJE's Recommendations ask for the main or
    most important findings first.
  kind: move
  bearing: methodological
  refs: [icmje_2026_manuscript_preparation]
- point: |
    If a paragraph ends on a step, such as "we then compared the two groups", the reader has to do
    your conclusion for you. Finish the step: print the result of the comparison and say what it
    shows.
  kind: trap
  bearing: methodological
- point: |
    Write the methods so a reader could use your result. In one study that Chalmers and Glasziou
    cite, only around 60 per cent of trial reports described the treatment adequately. The
    information existed for 90 per cent. The difference was lost in the writing.
  kind: number
  bearing: methodological
  refs: [chalmers_glasziou_2009]
- point: |
    Cut any table or figure that supports no claim. ICMJE's Recommendations restrict tables and
    figures to those needed to explain the argument of the paper and to assess its supporting data.
  kind: move
  bearing: methodological
  refs: [icmje_2026_manuscript_preparation]
- point: |
    When a trainee's draft reads "first we..., then we..., next we...", do not correct the grammar.
    Ask what they found, have them write that as the first sentence, and move the steps to the
    methods.
  kind: move
  bearing: teaching
- point: |
    Writing your paper as an argument makes your claim and its support easy to see. It cannot make
    a weak claim strong. If the data do not carry the claim, a clear argument shows that sooner,
    to you and to the reviewer. Treat that as the point of the exercise, and fix the claim, not the
    prose.
  kind: boundary
  bearing: methodological
common_misreading: |
  "Argument" can sound like persuasion: state your claim, and leave out whatever does not fit it.
  That reading is wrong. It leads straight to biased reporting.

  ICMJE's Recommendations ask for
  data on every main and secondary outcome named in the methods. Chalmers and Glasziou give two
  examples of biased reporting. Harms of a treatment are left out. The main outcome is changed
  between the plan and the report. An argument in a paper states its claim. Then it shows all the
  evidence on it, including the evidence against it.
reporting_sentence: |
  Between NFHS-4 (2015-16) and NFHS-5 (2019-21), the share of adults aged 15-49 in India who were
  overweight or obese rose in both sexes. It rose from {{n:nfhs4_women_ow_ob_pct}} to
  {{n:nfhs5_women_ow_ob_pct}} per cent in women and from {{n:nfhs4_men_ow_ob_pct}} to
  {{n:nfhs5_men_ow_ob_pct}} per cent in men.
exercises:
- type: retrieval
  prompt: |
    From memory: in the terms of Book 0's section on argument, what are a paper's claim, its data,
    and the reasoning between them? And what are the two separate ways the argument can fail?
  answer: |
    The claim is the conclusion. The data are the premises. The reasoning that carries the data to
    the claim is the inference.

    It fails if a premise is false: the data are wrong, for example mismeasured or miscounted. It
    also fails if the inference does not carry: the data are right but do not support the claim.
    The two are separate questions, and both must hold.
  confidence_first: true
- type: critique
  prompt: |
    A resident's clinic audit has this results paragraph. The numbers are made up.

    > We reviewed the outpatient registers of the non-communicable disease clinic for January to
    > March. First we counted the adults registered, who numbered 640. We then checked how many had
    > a weight recorded, which was 410. After that we looked for a height, which was recorded for
    > 152. Finally, we checked how many had a body mass index written in the register, and found
    > 96.

    Rewrite it as an argument. State the claim first, keep the evidence it needs, and say where the
    first sentence goes.
  answer: |
    First find the claim. The counts fall at each step, and height is where most are lost. A body
    mass index needs both weight and height, so it could be worked out for at most 152 of the 640.

    Work out the shares, so the reader does not have to.

    ```working
    410 divided by 640 = 0.641, about 64 per cent
    152 divided by 640 = 0.2375, about 24 per cent
    96 divided by 640 = 0.15, which is 15 per cent
    ```

    > Most adults attending the clinic could not have their body mass index worked out from the
    > register, because their height was not recorded. Of 640 adults registered from January to
    > March, 410 (64 per cent) had a weight recorded. Only 152 (24 per cent) had a height. A
    > body mass index was written for 96 (15 per cent).

    The first sentence of the old paragraph, which registers were reviewed and for which months,
    goes to the methods.
- type: design
  prompt: |
    Take one results paragraph from your own thesis or draft, the section you chose for this book's
    build. Mark each sentence with a letter. Write C if it states a claim, E if it is evidence for
    a claim, S if it describes a step of the work. Then rewrite the paragraph as an argument.
  answer: |
    Check your rewrite four ways.

    - Its first sentence states what you found. A reader who stops there knows your claim.
    - Every other sentence is evidence for that claim, in the order the claim needs. No sentence
      is left without a job.
    - No S sentence remains. Each one is in the methods, once, or deleted because the methods
      already say it.
    - Any comparison you made is finished. The paragraph prints its result and does not leave the
      reader to subtract.

    If your paragraph had two claims, it is now two paragraphs.
  skill_ref: S58-R1-K01
- type: teaching
  prompt: |
    For a first-year resident, ten minutes with a whiteboard. Her co-resident says the results
    section should walk through the analysis step by step, "so the examiner can see the work".
    Tell her what is right and what is wrong in that.
  answer: |
    Right: the examiner must be able to see the work. Wrong: the results are not where it goes.

    Draw two boxes, methods and results. The methods say what was done, in enough detail to judge
    and repeat it. That is where the examiner checks the work.

    The results say what was found. Each paragraph opens on a finding, then gives the numbers that
    support it. Walking through the steps in the results makes the examiner read the work twice
    and still hunt for the findings. Mensh and Kording put it plainly: readers care about the
    claim and the logic supporting it, not the path you took.

    Then show her one paragraph both ways: first the diary, then the claim with its evidence.
retrieval_items:
- q: What is the difference between a report of activities and an argument?
  a: A report of activities records what was done in the order it was done; an argument states a claim and gives the evidence and reasoning that support it, in the order the reasoning needs.
- q: Where do the steps of the work go in a paper written as an argument?
  a: In the methods, once, complete enough for a reader to judge and repeat them.
- q: Does writing a paper as an argument mean leaving out results that do not fit the claim?
  a: No. ICMJE asks for data on every primary and secondary outcome named in the methods; leaving them out is biased reporting.
