    citekey: nfhs5_india_factsheet
    quote: "88. Women who are overweight or obese (BMI ≥25.0 kg/m2)21 (%) 33.2  19.7  24.0  20.6"
  - value: "{{n:nfhs5_men_ow_ob_pct}}"
    unit: per cent of men aged 15-49 overweight or obese, NFHS-5 (2019-21), India
    citekey: nfhs5_india_factsheet
    quote: "89. Men who are overweight or obese (BMI ≥25.0 kg/m2) (%) 29.8  19.3  22.9  18.9"
  - value: "{{n:nfhs4_men_ow_ob_pct}}"
    unit: per cent of men aged 15-49 overweight or obese, NFHS-4 (2015-16), India
    citekey: nfhs5_india_factsheet
    quote: "89. Men who are overweight or obese (BMI ≥25.0 kg/m2) (%) 29.8  19.3  22.9  18.9"
- body: |
    Here is what a report written for its writer costs a reader. Chalmers and Glasziou's 2009
    viewpoint on avoidable waste in research is at https://doi.org/10.1016/S0140-6736(09)60329-9. Find the
    section headed "Biased or unusable reports of research".

    There they cite a study of reports of clinical trials. Adequate information on the treatment
    tested was in around 60 per cent of the reports. By checking references, writing to authors
    and searching further, it could be found for 90 per cent of the trials. Work out the gap.

    ```working
    90 minus 60 = 30
    ```

    For about 30 trials in every 100, the authors knew what they had done. Their reports did not
    say it, so a clinician could not use the result without detective work. That is a loss made in
    the writing, not in the research.

    Notice what kind of loss it is. The missing pieces were methods: what the treatment was and how
    it was given. Writing a paper as an argument does not mean leaving out what you did. It means
    putting it where the reader needs it, complete enough to judge and repeat.
  analogy_breaks_when: |
    The 60 and 90 per cent come from one study of trial reports, which Chalmers and Glasziou cite
    rather than carried out. They describe treatments in trials, not every kind of paper, and they
    are not a measurement of Indian journals.
  numbers:
  - value: "60"
    unit: per cent of clinical trial reports with adequate information on the intervention, as cited by Chalmers and Glasziou
    citekey: chalmers_glasziou_2009
    quote: "Adequate information on interventions is available in around 60% of reports of clinical trials"
  - value: "90"
    unit: per cent of trials for which adequate information could be made available with further searching, as cited by Chalmers and Glasziou
    citekey: chalmers_glasziou_2009
    quote: "it is possible to increase to 90% the proportion of trials for which adequate information could be made available."
