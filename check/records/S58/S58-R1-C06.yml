simplified_explanation: |
  The verb is the word for what happens: measured, rose, is.

  Ask "who or what" in front of the verb: who measured? The answer is the subject.

  In "We measured the weight", the doer is "we", and "we" is also the subject. That is the active
  voice.

  Turn it round: "The weight was measured". Now the thing measured is the subject, and the doer
  has gone. That is the passive voice. Its sign is a form of "to be" with a verb ending, usually,
  in -ed.

  A main clause can stand as a sentence on its own. A clause that starts with "because", "when"
  or "although" cannot.
illustrations:
- body: |
    Take a sentence of the kind found in the methods chapter of almost any thesis. This one is made
    up.

    > Written informed consent was obtained from all participants by the investigator before the interview.

    Find the verb first. Ask what happens in the sentence: something was obtained. The verb is
    "was obtained". It carries both signs of the passive: a form of "to be", "was", and a past
    participle, "obtained".

    Now find the subject. Ask what was obtained: written informed consent. That is the subject,
    and it is not the doer. Consent did nothing. It received the action.

    Now find the doer. Look for "by". The investigator obtained the consent.

    Turn the sentence round so that the doer is the subject.

    > The investigator obtained written informed consent from all participants before the interview.

    The subject is now "the investigator", the verb is "obtained", and the object is "written
    informed consent". The facts have not changed. Neither has the tense: both sentences are in the
    past. Only the voice has changed.

    Now try a harder one, from the same made-up chapter.

    > Data were collected using a pretested questionnaire and entered in a spreadsheet.

    The verbs are "were collected" and "(were) entered". Both are passive. Look for "by". There is
    none. The sentence never says who collected the data, or who typed them in. To turn it into the
    active voice, you have to know the answer. "Two trained interviewers collected the data" is a
    different sentence from "I collected the data", and a reader judging the study needs to know
    which one is true. The passive let the writer skip that question. The reader cannot skip it.
  analogy_breaks_when: |
    The two signs of the passive are a test, not a proof. The guideline that lists them says both
    may not appear in every passive sentence. "The forms got lost" is passive with no form of "to
    be". And "the clinic was closed on Sunday" may describe how the clinic was, not something
    anybody did to it. When the signs mislead, ask the plain question: did the subject do the
    action, or receive it?

    Turning a sentence into the active voice is a test you can run, not an order to obey. Some
    passive sentences are the better sentence. The next section shows when.
- body: |
    The subject is not always one word. Read this sentence. It is made up, but its figure is the
    survey's own.

    > In the fifth National Family Health Survey (NFHS-5), the proportion of women aged 15 to 49 in India who had overweight or obesity was {{n:nfhs5_women_ow_ob_pct}} per cent.

    First take off any opening phrase that ends with a comma: "In the fifth National Family Health
    Survey (NFHS-5)". Then find the verb. It is "was".

    Ask what was {{n:nfhs5_women_ow_ob_pct}} per cent. The answer is the whole of "the proportion of
    women aged 15 to 49 in India who had overweight or obesity". That long phrase is the subject.
    Its main word is "proportion". The rest tells you which proportion.

    Count the words between "proportion" and "was". There are 13. The reader holds all 13 in mind
    while waiting for the verb. The next section calls this the gap between subject and verb, and
    asks you to close it.

    Inside that subject sits a clause of its own: "who had overweight or obesity". It has a subject,
    "who", and a verb, "had". Read it alone and it is not a sentence. So it is a subordinate clause.

    Now a sentence with two clauses side by side.

    > Because the fact sheet's adult rows cover ages 15 to 49 only, they say nothing about women of 50 or older.

    Read each clause alone. "They say nothing about women of 50 or older" stands as a sentence: it
    is the main clause. "Because the fact sheet's adult rows cover ages 15 to 49 only" does not
    stand: it is subordinate. The main point of the sentence belongs in the main clause, and here
    it is.
  analogy_breaks_when: |
    "Take off the opening phrase, then find the verb" works for most sentences in a paper. It fails
    on a question ("Did the proportion rise?"), where the verb comes first, and on a sentence that
    starts "There were", where "there" only fills the place of the subject. In "There were
    three villages without a road", the subject is "villages".

    The count of 13 words is for this one sentence. It shows what a long subject costs. It is not
    a limit.
