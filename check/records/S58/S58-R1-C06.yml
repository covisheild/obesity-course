must_know:
- point: |
    "The passive voice is the past tense" is the error. Voice says whether the subject did the
    action or received it. Tense says when. When an editor tells you to remove the passive,
    check voice, not tense.
  kind: misconception
  bearing: teaching
  refs: [plain_language_2011_guidelines]
- point: |
    Verb first. Then ask "who or what" in front of it to find the subject. Then look for "by", or
    ask who did it, to find the doer.
  kind: move
  bearing: teaching
- point: |
    A passive sentence with no "by" hides who did the work. Before you submit, find each passive
    verb and ask whether the reader needs the doer. If yes, name it.
  kind: trap
  bearing: methodological
  refs: [plain_language_2011_guidelines]
- point: |
    The two signs of the passive, a form of "to be" and an -ed word, are a quick test that can
    mislead. When the test is unsure, ask whether the subject did the action or received it.
  kind: boundary
  bearing: teaching
  refs: [plain_language_2011_guidelines]
- point: |
    Put the point of a sentence in its main clause. If your finding sits in the subordinate
    clause, the reader will weigh it less than you meant.
  kind: consequence
  bearing: methodological
  refs: [openstax_writing_guide_handbook]
common_misreading: |
  "The passive hides the doer, so every passive sentence is wrong and must go." It does not
  follow. A passive sentence is right when the doer does not matter, or when the paragraph is
  telling the story of the thing acted on. Gopen and Swan's example is "Pollen is dispersed by
  bees", which is the better sentence in a paragraph about pollen. The passive is a choice of
  subject. The next section shows how to make that choice.
reporting_sentence: |
  The investigator obtained written informed consent from every participant before the interview.
exercises:
- type: retrieval
  prompt: |
    Without looking back, name the two signs of a passive verb. Then say what is wrong with the
    statement "the passive voice is the past tense", with one example.
  answer: |
    The first sign is a form of "to be": is, was, were, has been. The second is a past participle,
    the form that follows "has" or "was", which usually ends in -ed. Both may not appear in every
    passive sentence.

    Voice and tense are different things. Voice says whether the subject did the action or received
    it. Tense says when. "Weight is measured" is passive and present. "We measured weight" is active
    and past.
- type: interpretation
  prompt: |
    The three sentences below are made up. In each one, mark the verb, the subject and its main
    word, the object if there is one, and the voice. Name the doer, or say that the sentence does
    not name one. Where there are two clauses, say which is the main clause.

    1. The auxiliary nurse midwife weighed every child at the anganwadi, the government child care centre of the village.
    2. Three villages were left out because the road was closed.
    3. There were many households without a weighing scale.
  answer: |
    1. Verb: "weighed". Subject: "the auxiliary nurse midwife", main word "midwife". Object: "every
       child". Active voice. The doer is the subject, the midwife. One clause.

    2. Two clauses. The main clause is "Three villages were left out". Its verb is "were left
       out", its subject "three villages", main word "villages". It is passive, and it names no
       doer: the sentence does not say who left the villages out.

       The subordinate clause is "because the road was closed". Its subject is "the road" and its
       verb "was closed". It may be passive (someone closed the road) or describe how the road was
       (shut). The sentence does not tell you which.

       A reader judging the survey would want to know who decided to drop the villages.

    3. Verb: "were". The word "there" stands where a subject usually stands, but it names nothing.
       Ask what there were: households. The subject is "many households without a weighing
       scale", main word "households". No object, and no action, so no doer and no voice to change.
       A rewrite gives the sentence a real subject and verb: "Many households had no weighing
       scale."
- type: critique
  prompt: |
    Open the manuscript section you chose for this book's build. Find every passive verb in it.
    For each one, write down the doer, if you know it. Then mark the ones where a reader judging
    your work would need to know who did it.
  answer: |
    There is no single right list, so check your own against three tests.

    - You found the verb first, then the subject, then looked for "by". A passive with no "by" is
      the kind most worth marking.
    - For each marked verb, the doer is something a reviewer could ask about. Who measured? Who
      interviewed? Who entered or cleaned the data? Who decided which participants to leave out?
    - Verbs whose doer does not change the result are left unmarked. "The two readings were
      averaged" gives the same average whoever did the sum.

    If you could not name the doer of a marked verb, that is a gap in your methods, not only in
    your sentence. Find out, and write it down.
retrieval_items:
- q: What is the subject of a clause, and how do you find it?
  a: What the clause is about, the thing the verb is said of. Find the verb first, then ask "who or
    what" in front of it.
- q: How does a passive sentence differ from an active one?
  a: In the active voice the subject does the action. In the passive voice the subject receives it,
    the verb takes a form of "to be" with a past participle, and the doer moves after "by" or
    disappears.
- q: What is the difference between a main clause and a subordinate clause?
  a: A main clause can stand alone as a sentence and carries the main idea. A subordinate clause
    has its own subject and verb, opens with a word such as because, when or although, and cannot
    stand alone.
