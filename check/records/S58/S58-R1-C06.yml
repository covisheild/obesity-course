name: The parts of a sentence a writer works with
concept_type: derivable
clusters:
- craft-and-integrity
ground_floor_deps: []
concept_deps: []
definition:
  text: |
    A sentence is built from clauses. A clause is a group of words with a subject and a verb. A
    subordinate clause also has a subject and a verb, but it cannot stand alone. Words such as
    although, because, even if, when, since or while open one.

    The verb expresses an action, an occurrence or a state of being. A verb may carry a small word
    with it, as in "left out"; the two together are the verb.

    The subject names what the clause is about: the thing the verb is said of. Its main word is
    the noun the verb is said of, and the rest of the phrase describes that noun.

    The object is the noun that receives the action of the verb.

    The doer is whoever or whatever performs the action, whether or not it is the subject.

    Voice says which of them is the subject. In the active voice, the subject performs the action
    of the verb. In the passive voice, the subject receives the action: the active sentence's
    object becomes the subject. The doer moves into a phrase beginning "by", or is left out.
    A passive verb has a form of "to be" and a past participle, the form that follows "has" or
    "was": measured, given, left.
