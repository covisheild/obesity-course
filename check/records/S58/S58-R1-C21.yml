simplified_explanation: |
  A table is for the reader who wants exact numbers, or wants to find one row. It has to make
  sense on its own, because a reader may look at the tables before reading the text.

  So the title above it says what was measured, in whom, where and when. Each column heading is
  short and gives the unit. Anything longer goes in a footnote under the table. Every percentage
  has its count beside it.

  Keep it plain. No grid of lines, no lines between rows. Numbers line up on the right and keep the
  same number of decimal places. And never print the same numbers in a table and in a figure too.
illustrations:
- body: |
    Start with a published table and test it. Krishnamurthy and colleagues' paper on colour-vision
    deficiency in school boys, met in `S58-R1-C19` (Indian Journal of Ophthalmology, 2021,
    https://pmc.ncbi.nlm.nih.gov/articles/PMC8482944/), prints this as its first table. Its title:

    > Association between color vision deficiency, age groups, location and type of schools

    Here are its first four columns. A fifth, of odds ratios and P values, is left out.

    ```table
    | Demographics | Total (n) | Color vision deficiency (n) | Prevalence (%) |
    | Total | 74986 | 2073 | 2.76 |
    | Class groups | | | |
    | Middle | 58907 | 1608 | 2.73 |
    | Higher secondary | 16079 | 465 | 2.89 |
    | Type of school | | | |
    | Private | 21422 | 535 | 2.50 |
    | Public | 53564 | 1538 | 2.87 |
    | Location of school | | | |
    | Rural | 21911 | 392 | 1.79 |
    | Urban | 53075 | 1681 | 3.17 |
    ```

    Cover the paper and ask Book 0's four questions of the table alone (`B0-R0-C39`). What does a
    row stand for? A group of children, but which children? The title does not say they are boys,
    aged 11 to 17, in schools of one district of Tamil Nadu. It says "age groups", while the rows
    say "Class groups", and nothing gives the ages. A reader holding only the table cannot say
    whom it describes. It fails the first test of a table that stands alone.

    Now see what it does well. Every percentage has its two counts beside it. The unit sits in the
    heading, "(%)", not in every cell. The per cents all carry two decimal places. By the rule in
    `S58-R1-C09`, one decimal place would be enough for values under 10 per cent. But the column
    is consistent, and consistency is what lets the eye compare down it.

    Last, hold the table against the paper's text. The Results say there were:

    > 21422 (28.57%) and 53564 (71.43%) in public and private schools, respectively

    The table puts 21422 against Private and 53564 against Public. One of the two is wrong. The
    text's own percentages, 2.87 for public schools and 2.50 for private, match the table's labels.
    So the slip is probably in the sentence. Either way, a reader holding both cannot be sure. This
    is one reason not to give the same numbers twice.

    Rewrite the title so the table stands alone:

    > Table 1. Colour-vision deficiency confirmed in boys aged 11–17 years screened in schools of
    > Kanchipuram district, Tamil Nadu, by school level, type and location

    Then add a footnote for what the headings cannot carry: "Middle school: classes 6–10, ages
    11–15 years; higher secondary: classes 11–12, ages 16–17 years."
  analogy_breaks_when: |
    This critique is of the table's words and layout. It says nothing about whether the counts
    are right; for that you would need the study's data. A table can stand alone perfectly and
    still carry a wrong number.

    The fifth column, of odds ratios and P values, is left out because this book does not teach
    odds ratios. Its heading, "Odds ratio (95%Confidence Interval) (P)", packs three things into
    one heading, which is the explanatory matter ICMJE asks you to put in footnotes.
