- body: |
    Now build one. Say you are writing a report for district programme officers. Each will set
    their own district's figures beside the national ones, so they need the exact values. That is a
    job for a table. `S58-R1-C14` chose a figure for the same rows when the claim was a pattern,
    urban above rural. A paper uses one or the other for these numbers, never both.

    Take the NFHS-5 India Fact Sheet, indicators 88 and 89. Build the table in five steps.

    1. Write the title above the table: what, in whom, where, when. Spell out the survey's name
       once.
    2. Give each column a short heading with its unit, "(%)". Put the survey round in the heading,
       not in a sentence above.
    3. Keep the decimals the same all the way down. The fact sheet prints women's NFHS-5 total as
       {{n:nfhs5_women_ow_ob_pct}}. A spreadsheet will try to show it as 24; type the zero back.
    4. Move everything else into footnotes. The fact sheet's own footnote to the women's row says
       pregnant women and women who gave birth in the preceding 2 months are excluded. That goes
       in a footnote, marked a. Abbreviations are spelled out there too.
    5. Add a source line, and say what the source does not give.

    The result:

    > Table 1. Women and men aged 15–49 years with overweight or obesity (body mass index 25.0
    > kg/m^2 or more), India, National Family Health Survey 2019–21 (NFHS-5), by residence, with
    > the 2015–16 (NFHS-4) total

    ```table
    | group | NFHS-5 urban (%) | NFHS-5 rural (%) | NFHS-5 total (%) | NFHS-4 total (%) |
    | women (a) | {{n:nfhs5_women_ow_ob_urban_pct}} | {{n:nfhs5_women_ow_ob_rural_pct}} | {{n:nfhs5_women_ow_ob_pct}} | {{n:nfhs4_women_ow_ob_pct}} |
    | men | {{n:nfhs5_men_ow_ob_urban_pct}} | {{n:nfhs5_men_ow_ob_rural_pct}} | {{n:nfhs5_men_ow_ob_pct}} | {{n:nfhs4_men_ow_ob_pct}} |
    ```

    > (a) Excludes pregnant women and women who gave birth in the preceding 2 months. Counts of
    > women and men weighed and measured are not given in the source; NFHS-5 interviewed 724,115
    > women and 101,839 men. Source: NFHS-5 India Fact Sheet, indicators 88 and 89 [reference
    > number].

    Now the lines and the alignment, which the page here cannot show. In your word processor, draw
    one line under the headings and one above and below the whole table. Delete every other line.
    Wilke's verdict on his word processor's default table: "if you pick the default, you will end
    up with a poorly formatted table every time." Align "women" and "men" left. Align every number
    column right, so the decimal points line up, and align each heading like its column.

    Last, cite it in the text, and say only the most important thing the table shows:
    "Overweight or obesity was more common in urban than in rural India, in women and in men
    (Table 1)." Do not walk the reader through all eight numbers.
  analogy_breaks_when: |
    Here the source gave no counts, so the table says so instead of inventing them. With your own
    data you have the counts, and they go beside each percentage, as `S58-R1-C09` showed:
    "1608 of 58907 (2.7)" or a separate column for n.

    This table has two rows. With every state and union territory as a row, it is still a table
    if the reader will look up a state. If the point is the pattern across states, ICMJE offers a
    graph as the alternative to a table with many entries.

    The fact sheet is a public government report. ICMJE asks you to acknowledge such a source fully
    and to obtain permission for data from another source. Whether a public report needs written
    permission depends on its terms, which the next rung takes up. Unpublished data, such as a
    colleague's clinic register, needs the owner's permission before you use it at all.
