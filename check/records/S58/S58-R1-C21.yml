    quote: "gathered information from 636,699 households, 724,115 women, and 101,839 men"
figure_note: "This section is about tables and its illustrations are tables; a chart of the same numbers would break the rule it teaches, that one result is shown once."
must_know:
- point: |
    "Put the numbers in a table and in a figure, to be safe" is the error. ICMJE says do not
    duplicate data in graphs and tables, and do not repeat all of a table in the text. Choose one
    home for each result. The text then states the most important observation and cites it.
  kind: misconception
  bearing: methodological
  refs: [icmje_2026_manuscript_preparation]
- point: |
    Write the title above the table, short and self-explanatory: what was measured, in whom,
    where and when. Test it by covering the text. If a reader cannot say whom the rows describe,
    the title is not finished.
  kind: move
  bearing: methodological
  refs: [icmje_2026_manuscript_preparation, wilke_2019_dataviz_ch22]
- point: |
    Keep headings short, with the unit in brackets. Put exclusions, definitions, cut-offs and
    every nonstandard abbreviation in footnotes under the table, marked with letters or the
    symbols your journal asks for.
  kind: move
  bearing: methodological
  refs: [icmje_2026_manuscript_preparation]
- point: |
    Give every percentage its count, and name every measure of variation. A column of "mean ±
    value" is unfinished until its heading or a footnote names the value. It may be a standard
    deviation, a standard error or a confidence interval.
  kind: move
  bearing: methodological
  refs: [icmje_2026_manuscript_preparation]
- point: |
    When your source gives no counts, as the NFHS fact sheet does not, say so in a footnote. Never
    work a count back from a percentage and a total you guessed, and never leave the gap silent.
  kind: trap
  bearing: methodological
- point: |
    Delete the word processor's default grid. No vertical lines, no lines between rows; a line
    under the headings and one above and below the table. Align numbers right with the same
    decimal places, and text left. Wilke found most of his word processor's ready-made table
    styles break these rules.
  kind: move
  bearing: methodological
  refs: [wilke_2019_dataviz_ch22]
- point: |
    "Many rows, so a table" is a half-truth. A table is for exact values and for a reader who
    looks up rows. For a pattern among many values, ICMJE offers a graph instead. Decide by what
    the reader has to do.
  kind: boundary
  bearing: methodological
  refs: [icmje_2026_manuscript_preparation]
- point: |
    Acknowledge every table's outside data in a source line, every time. Before you use
    unpublished data, such as a colleague's register or another department's survey, get the
    owner's permission. ICMJE asks for both.
  kind: consequence
  bearing: policy
  refs: [icmje_2026_manuscript_preparation]
common_misreading: |
  "A good results section walks the reader through the table." It does the opposite. ICMJE asks
  you not to repeat all of a table's data in the text. State only the most important observations,
  and cite the table. A paragraph that reads out every cell makes the reader check
  two copies of each number. And, as Krishnamurthy and colleagues' paper shows, two copies can
  disagree.
reporting_sentence: |
  Overweight or obesity was more common in urban than in rural India, in women and in men
  (Table 1).
exercises:
- type: retrieval
  prompt: |
    From memory: what must a table's title do, where do explanations and abbreviations go, and
    what are the rules for lines and for aligning numbers?
  answer: |
    The title goes above the table. It is short and says what was measured, in whom, where and
    when. A reader should not need the text to understand it. Notes, exclusions and abbreviations
    go in footnotes under the table, not in the headings.

    Draw no lines down the table and none between rows. One line under the headings, and one above
    and below the table, are enough. Words line up on the left. Numbers line up on the right, with
    the same number of decimal places all the way down. Each heading lines up like its column.
- type: critique
  prompt: |
    A resident's thesis draft has the table below, made from the real NFHS-5 India Fact Sheet
    numbers for anaemia; the layout is made up for this exercise. Haemoglobin, written Hb, is the
    oxygen-carrying protein of the blood, measured in grams per decilitre (g/dl). The table has a
    border round every cell, and every number is centred.

    The table has no title. Its first column heading reads "Prevalence of anaemia among non
    pregnant women (Hb<12) and men (Hb<13) as per NFHS 5 survey conducted in 2019-21 in India
    (capillary blood)". Its rows are:

    ```table
    | | Urban | Rural | Total |
    | Women | 54.1% | 58.7 | 57.2 |
    | Men | 20.4% | 27.4 | 25 |
    ```

    Under the table, the draft reads out all six numbers in a sentence: "Anaemia was 54.1% in
    urban women, 58.7% in rural women ..." and so on. A bar chart of the same six numbers follows.
    List what you would change.
  answer: |
    - Add a title above the table: "Table 2. Non-pregnant women and men aged 15–49 years with
      anaemia, India, NFHS-5 (2019–21), by residence."
    - Cut the long heading. The column headings become "urban (%)", "rural (%)", "total (%)".
      The rest goes into footnotes. They give the cut-offs: haemoglobin below 12.0 g/dl for
      non-pregnant women and below 13.0 g/dl for men. They also expand Hb and the survey's name.
    - The fact sheet's own footnote warns that NFHS-5 measured anaemia in capillary blood, so its
      results "need not be compared with other surveys using venous blood". That caution belongs
      in a footnote too, because a reader will compare.
    - Put "%" in the headings, not in some cells. Write 25 as 25.0, the fact sheet's figure, so
      every number has one decimal place.
    - Remove the cell borders. Keep one line under the headings and lines above and below the
      table. Align the numbers right and the words left.
    - Add a source line, and say that the fact sheet gives no counts.
    - Cut the duplication. Keep the table or the bar chart, not both. Replace the sentence that
      lists six numbers with the one observation that matters, citing the table. For example:
      anaemia was more than twice as common in women as in men.

    The two cut-offs and the capillary-blood caution are from the fact sheet's indicators 93 and
    97 and its footnote 22.
- type: interpretation
  prompt: |
    Krishnamurthy and colleagues write that the 74,986 boys they screened had a "mean age: 13.75 ±
    1.91", without saying what 1.91 is. Can you tell whether it is a standard deviation or a
    standard error? Show your reasoning. Then say how the authors should have written it in a
    table.
  answer: |
    Try each reading. If 1.91 years were the standard error, the standard deviation would be the
    SE times the square root of n.

    ```working
    square root of 74986 = 273.84
    1.91 times 273.84 = 523.0
    ```

    A standard deviation of 523 years is impossible for boys aged 11 to 17. So 1.91 must be the
    standard deviation: about two thirds of the boys were within 1.91 years of 13.75.

    That you could work it out does not excuse the omission. In a table, the heading should read
    "age, mean (SD), years", or a footnote should say that values are mean ± standard deviation.
    ICMJE asks authors to identify statistical measures of variation.
- type: teaching
  prompt: |
    A first-year resident brings you a thesis table in her word processor's default style. It has
    a grid of lines round every cell, centred numbers, and a heading three lines long. She says the
    grid "makes it easier to read". You have ten minutes. Answer her.
  answer: |
    Agree with her aim, then show her the cost. The lines are meant to help the eye follow a row.
    But we do not rule lines between the lines of a paragraph, and we read those easily. Every
    extra line is something the eye has to look past to reach the numbers.

    Then show her. Delete the vertical lines and the lines between rows. Keep one line under the
    headings and one above and below the table. Right-align the numbers so the decimal points
    line up, and the column can be compared at a glance. Put the three-line heading's explanation
    in a footnote, so the heading shrinks to a few words and a unit.

    Then the reason that matters most: an examiner or reviewer may look at the table before
    reading the text. Ask her to cover the text and read the table alone. If she cannot say whom
    the rows describe, the title needs work before the lines do.
- type: design
  prompt: |
    Take one result from your build section that belongs in a table: exact values a reader will
    look up. Lay it out as a table that stands alone. It needs a title above, short headings with
    units, counts beside percentages, the measure of variation named, footnotes and a source line.
    Then write the one sentence in your text that cites it.
  answer: |
    Check it against this list. The title says what, in whom, where and when. Each heading is a
    few words and a unit. Every percentage has its count. Any "±" or bracketed value is named as
    SD, SE or CI. Exclusions and abbreviations are in footnotes. A source line names any outside
    data.

    There are no lines down the table or between rows. Numbers are right-aligned with the same
    decimals. The table is not repeated in a figure or read out in the text. Your one sentence
    states the most important observation and ends "(Table 1)".

    Then cover the text and give the table alone to a colleague. If they cannot say whom it
    describes, fix the title first.
retrieval_items:
- q: Where does a table's title go, and what must it let the reader do?
  a: Above the table. It must let the reader understand the table without going back to the text.
- q: Name four layout rules for a table.
  a: No vertical lines; no lines between data rows; text left-aligned; numbers right-aligned with
    the same number of decimal places throughout.
- q: When is a table, rather than a figure, the right home for a result?
  a: When the reader needs exact values or will look up particular rows. A pattern among many
    values is better shown in a figure; never both.
