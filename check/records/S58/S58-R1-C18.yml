- point: |
    Never draw flat data in 3-D. The third dimension carries no data and it bends the bars: in
    Wilke's example, 322 first-class passengers read as fewer than 300.
  kind: consequence
  bearing: methodological
  refs: [wilke_2019_dataviz_ch26]
- point: |
    Use direct labels: write each line's or group's name beside its data, and delete the legend.
    The reader then reads the figure without moving the eye back and forth.
  kind: move
  bearing: methodological
  refs: [wilke_2019_dataviz_ch20]
- point: |
    "Useful junk?" found that cartoon charts were described no worse, and were remembered better
    two to three weeks later. That was 20 students, with no time limit. It does not show that
    decoration is harmless when a reader needs exact values, and the authors say so. A picture tied
    to the message may suit a poster. Keep it out of a paper's figure.
  kind: dispute
  bearing: methodological
  refs: [bateman_2010_useful_junk]
- point: |
    A picture on a chart carries an opinion. In Bateman's study readers found the designer's
    "value message" more often in the decorated charts. On a public chart, choose a picture only if
    you are willing to say its message out loud.
  kind: trap
  bearing: public
  refs: [bateman_2010_useful_junk]
- point: |
    Removing decoration cannot fix a dishonest axis. A plain bar chart that starts above zero is
    still wrong. Check the axis as well as the ink.
  kind: boundary
  bearing: methodological
- point: |
    When a trainee brings you a chart straight from a spreadsheet, do not redraw it for them. Have
    them delete one element at a time, and ask after each whether the reader lost anything.
  kind: move
  bearing: teaching
exercises:
- type: retrieval
  prompt: |
    From memory: what is data-ink, what is the data-ink ratio, and what two words does Tufte attach
    to his rule to maximise it? Name two elements that are not data-ink but should stay.
  answer: |
    Data-ink is the ink that changes when the data change: the bars, points and lines. The
    data-ink ratio is the data-ink divided by all the ink used to print the figure.

    Tufte's rule is to maximise it "within reason".

    Any two of: the axis titles with their units, the tick labels, a light grid or reference line,
    direct labels. They are context. Without them the data cannot be read.
- type: critique
  prompt: |
    A made-up district report has a figure for six blocks. It shows the share of children under 5
    weighed last month at the anganwadi, the village child-care centre. The figure has:

    - 3-D cylinders in six colours, with a shadow under each;
    - a legend matching the colours to block names;
    - a dark grid every 5%;
    - a picture of a weighing scale behind the bars;
    - no axis title;
    - a value axis running from 60% to 100%.

    List what you would change, in the order you would change it, and say why for each.
  answer: |
    Start with the axis, because no amount of tidying fixes it. Bars from 60% exaggerate every gap
    between blocks (`S58-R1-C17`). Start the axis at zero, or draw the six values as dots on a
    stated range.

    Then the elements, asking of each what it tells the reader.

    The 3-D cylinders and their shadows tell nothing and bend the heights against the grid. Draw
    flat bars or dots.

    The six colours tell nothing the block names do not. Use one colour, and write each block's
    name under its bar. The legend then goes.

    The picture of a scale behind the bars is decoration, and it competes with the data. Delete it.

    The dark grid: keep a few light lines, or none.

    Add what is missing. An axis title with its unit: "children under 5 weighed last month (%)".
    The month and the source in the caption.

    Last, sort the blocks from highest to lowest if the order of blocks means nothing.
  skill_ref: S58-R1-K02
- type: teaching
  prompt: |
    A first-year resident has read the abstract of "Useful junk?" and says: "So chartjunk is fine
    now. Decorated charts are remembered better." You have ten minutes and a whiteboard. Say what
    you would teach.
  answer: |
    Start with what the study found, fairly. In 20 students, charts built into cartoon pictures
    were described as accurately as plain charts. Ten of them, tested two to three weeks later,
    remembered the decorated charts better.

    Then draw the design on the board. Fourteen charts by one illustrator. Untimed viewing. The task
    was to describe each chart aloud, not to read off exact values. Ten people per memory group.
    The paper reports t-tests, not how many points better.

    Then the second finding: readers saw the designer's opinion, the "value message", more often in
    the decorated charts. A picture argues.

    Then what it does not cover. The pictures were tied to each chart's subject. A 3-D effect, a
    shadow or a background fill carries no message at all, and 3-D bends the bars. Nothing in the
    study speaks for those.

    End with the rule. In a paper's figure, delete what tells the reader nothing and keep the
    labels. On a poster, a picture tied to the one message may help people remember it, if you
    accept the opinion it adds. The authors themselves do not advocate it "as a general principle".
retrieval_items:
- q: What is the data-ink ratio?
  a: The ink that shows data divided by all the ink used to print the figure, or 1 minus the share
    of the ink that could be erased without losing any data. Tufte says to maximise it "within
    reason".
- q: What did "Useful junk?" (Bateman and colleagues, 2010) find, and in whom?
  a: In 20 students, cartoon-decorated charts were described as accurately as plain ones and were
    remembered better after two to three weeks (10 people in that group). Viewing was untimed and
    the task was spoken description.
- q: Which non-data elements of a figure should stay?
  a: Context. Axis titles with units, tick labels, a light grid or reference line, and direct
    labels. Without them the data cannot be read.
common_misreading: |
  "A study showed decorated charts are remembered better, so decoration is fine." The study had 20
  students. They had no time limit, and they described each chart aloud. Each picture was tied to
  its chart's subject. The study found no loss for that task, and better memory weeks later.

  It also found that the pictures carried the designer's opinion. It says nothing for 3-D, shadows or
  coloured backgrounds, which carry no message. And it says nothing for a figure read for exact
  values.
