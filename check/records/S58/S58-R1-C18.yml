- body: |
    Now the case for decoration, and it is a real one. Open Bateman and colleagues, "Useful junk?
    The effects of visual embellishment on comprehension and memorability of charts", at
    https://doi.org/10.1145/1753326.1753716. Read the abstract.

    > We found that people’s accuracy in describing the embellished charts was no worse than for plain charts, and that their recall after a two-to-three-week gap was significantly better.

    Before you use this, read how it was done. Twenty students saw 14 charts by the graphic artist
    Nigel Holmes, whose charts are built into cartoon pictures, and plain versions of the same
    charts. Each person saw one version of each chart. They described each chart aloud, with as
    much time as they wanted. Then 10 of them were tested on the charts after five minutes, and
    10 after two to three weeks.

    An eye tracker recorded where they looked while the charts were on screen. Search for 67%.

    > participants spent 67% of their on-screen time looking at data or data and embellishments for Holmes charts as compared to 78% for Plain charts.

    > For Holmes charts, users spent 27% of their on-screen time looking at areas that contained both data and embellishments, and 13% of their time looking at embellishments that did not communicate any data.

    Split the Holmes charts' time four ways.

    ```working
    67 minus 27 = 40
    100 minus 67 minus 13 = 20
    40 plus 27 plus 13 plus 20 = 100
    100 minus 78 = 22
    ```

    On the Holmes charts, 40% of the time went on data alone, 27% on data drawn as part of a
    picture, 13% on picture alone and 20% elsewhere on the screen. On the plain charts, 78% went
    on data and 22% elsewhere. The pictures took looking time, and still the descriptions were no
    worse.

    Now read what else they found. Search for value message.

    > with better descriptions of a value message for the Holmes charts than the plain charts

    A value message is the opinion a chart carries: "costs are monstrous". The pictures carried
    one, and readers picked it up. The authors write that "we do not advocate this strategy as a
    general principle".

    So here is what the study allows. A picture tied to the message may help a poster or a public
    leaflet be remembered. It does not allow a 3-D bar, a shadow or a background in a paper's
    figure. Those carry no message and some bend the data. And it does not show that decoration is
    harmless when a reader studies exact values against a clock.
  analogy_breaks_when: |
    One study, 20 students at one university, 14 charts by one artist, and 10 people in each
    memory group. Viewing was untimed and the task was to describe each chart aloud. The paper
    reports t-tests and p values in its text, not the size of the difference in points. A reader
    of a methods section, checking a confidence interval against an axis, is doing a different
    task.

    Plain charts are not neutral either. The authors point out that a minimal chart can still
    mislead through "the scale of axes" and the choice of data. Removing decoration does not fix
    an axis; `S58-R1-C17` does.
