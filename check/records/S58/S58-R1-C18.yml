simplified_explanation: |
  Every mark on a figure either tells the reader something or gets in the way. The bars and points
  tell. So do the axis titles and the labels: without them the bars mean nothing. A 3-D tilt, a
  shadow, a coloured background or a thick grid tells nothing, and some of them bend the data.

  So ask one question of each mark: what does this tell the reader? If the answer is "nothing",
  delete it. Then stop before you delete the labels.

  There is one real argument for decoration. In one small study, cartoon charts were remembered
  better weeks later, and were described no worse. That is a reason to think about a poster, not
  a licence for a 3-D bar in a paper.
illustrations:
- body: |
    Here is a figure of the kind spreadsheet defaults and slide templates produce. It is made up
    for this example, from real numbers. It shows the NFHS-5 share of women and men aged 15-49 who
    were overweight or obese, {{n:nfhs5_women_ow_ob_pct}}% and {{n:nfhs5_men_ow_ob_pct}}%. The
    bars are 3-D columns on a shaded background. A dark grid sits behind them, and a frame runs
    round the whole. A legend box says which colour is which. The value is printed on top of
    each bar.

    Go through it one element at a time. For each, ask: what does this tell the reader about the
    data, or about how to read them?

    ```table
    | element | what it tells the reader | what to do |
    | 3-D columns | nothing; the third dimension carries no data | draw flat bars |
    | shaded background | nothing | delete |
    | dark grid | where values fall, but it competes with the bars | keep a few light grey lines, or none |
    | frame round the figure | nothing | delete |
    | legend box | which bar is which, but the eye must travel to it | direct labels: "women" and "men" under the bars |
    | value on each bar | the exact number, a second time | keep only if readers need the exact values |
    | axis title with its unit | what the bars measure | keep |
    ```

    The 3-D columns are not only useless. They bend the data. Open Wilke's *Fundamentals of Data
    Visualization*, chapter 26, at https://clauswilke.com/dataviz/no-3d.html, and search for 322.

    > there were 322 passengers total traveling in 1st class, yet Figure 26.2 suggests that the number was less than 300.

    A 3-D bar's top floats away from the back wall where the grid lines are drawn. Readers read it
    against the wrong line.

    The value printed on each bar is a smaller case. Tufte counts six ways a plain labelled bar
    shows one number: its left edge, its right edge, its shading, its top line, the position of
    the label and the label itself. Any five can go and the sixth still shows it. Keep the printed
    value when readers will want the exact number. Otherwise the bar is enough.

    Now stop. Wilke shows the opposite mistake: a figure whose axis labels are so faint, and whose
    grid is so bare, that the points "seem to float in space". Tufte's own rule ends "within
    reason". The axis title, the tick labels and the direct labels stay.
  analogy_breaks_when: |
    The table works for a figure read on a page. A light grid that is clutter in a paper can help
    on a figure people use to look up values, and Tufte himself says a grid may help "When a
    graphic serves as a look-up table". Rougier and colleagues put it generally: "an element that
    could be considered chartjunk in one figure can be justified in another". Ask what the reader
    will do with the figure before you delete anything.

    The made-up slide uses real NFHS numbers. The Titanic figure is Wilke's, and the 322 is his.
