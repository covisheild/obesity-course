figures:
- file: s58-r1-c22-anaemia-two-rounds.png
  caption: "Between NFHS-4 (2015-16) and NFHS-5 (2019-21), the share with anaemia rose in each of the five groups shown, by 1.9 to 8.5 percentage points. Bars show the per cent anaemic, by each group's own haemoglobin cut-off; ages in years. Counts are not given in the source. Source: NFHS-5 India Fact Sheet, indicators 92 and 95 to 98."
  alt: "Five pairs of bars from zero, NFHS-4 on the left of each pair and NFHS-5 on the right, named over the first pair, each bar's value printed on it: children 6-59 months 58.6 and 67.1; women 15-19 54.1 and 59.1; women 15-49 53.1 and 57.0; men 15-19 29.2 and 31.1; men 15-49 22.7 and 25.0. In every pair the NFHS-5 bar is taller."
  source: draw.py
  spec:
    kind: bar
    # Literal rather than from_table: a table series takes its header as a legend entry, and this
    # book's two series colours merge in grey (RECONCILE.md), so the rounds are named directly over
    # the first pair and the series are left unnamed, which leaves no legend.
    x: ["children 6-59 months", "women 15-19", "women 15-49", "men 15-19", "men 15-49"]
    series:
    - name: ""
      y: ["58.6", "54.1", "53.1", "29.2", "22.7"]
    - name: ""
      y: ["67.1", "59.1", "57.0", "31.1", "25.0"]
    labels:
    - {text: "NFHS-4", at: [-0.335, 63.5], offset: [0, 2]}
    - {text: "NFHS-5", at: [0.015, 72], offset: [0, 2]}
    x_label: ""
    y_label: "anaemic (%)"
    value_labels: true
    y_range: [0, 80]
    size: [7.4, 3.2]
    derived:
    - {value: "8.5", from: "67.1 - 58.6"}
    - {value: "5.0", from: "59.1 - 54.1"}
    - {value: "3.9", from: "57.0 - 53.1"}
    - {value: "1.9", from: "31.1 - 29.2"}
    - {value: "2.3", from: "25.0 - 22.7"}
    relations:
    - check: "y2[0] - y1[0] = 8.5"
    - check: "y2[1] - y1[1] = 5.0"
    - check: "y2[2] - y1[2] = 3.9"
    - check: "y2[3] - y1[3] = 1.9"
    - check: "y2[4] - y1[4] = 2.3"
must_know:
- point: |
    Write the figure's decisions down before you open the program, in order: claim, mark, axis,
    words, defaults, colour, caption, saving, checks. If you start by fixing what the first
    chart shows, you fix what you happen to notice.
  kind: move
  bearing: methodological
  refs: [rougier_2014_ten_rules_figures, wilke_2019_dataviz_ch28]
- point: |
    "The program drew it, so it is a neutral picture of the numbers" is the error. Every setting
    you did not choose was chosen for any chart at all. Check each one, the axis start first.
  kind: misconception
  bearing: methodological
  refs: [rougier_2014_ten_rules_figures]
- point: |
    A spreadsheet will do only if you change nearly every default. If a spreadsheet is what you
    have, keep a figure sheet beside the file, and record every change as you make it.
  kind: trap
  bearing: methodological
  refs: [wilke_2019_dataviz_preface, wilke_2019_dataviz_ch28]
- point: |
    Never finish a figure by hand in a drawing program and leave no record. When a reviewer
    asks for one changed number, every hand edit has to be done again, and some will be
    forgotten.
  kind: consequence
  bearing: methodological
  refs: [wilke_2019_dataviz_preface]
- point: |
    Read the journal's instructions for figures before you save. Where they leave it to you, save
    a vector graphic such as a pdf for print. Use a png where a bitmap is required, and never a
    jpeg for a chart.
  kind: move
  bearing: methodological
  refs: [icmje_2026_manuscript_preparation, wilke_2019_dataviz_ch27]
- point: |
    Check the figure at the size it will be printed, not at the size of your screen. Shrink it to
    one column's width, then view it in grey and through a simulator.
  kind: move
  bearing: methodological
  refs: [icmje_2026_manuscript_preparation]
- point: |
    When a trainee shows you a chart, ask for the figure sheet before you look at the chart.
  kind: move
  bearing: teaching
- point: |
    The procedure makes sure each decision is taken on purpose. A perfectly made figure of a
    wrong table is a wrong figure, so check the data against their source before step 1.
  kind: boundary
  bearing: methodological
common_misreading: |
  "Wilke says Excel is not recommended, so a figure made in a spreadsheet is wrong." A figure is
  right or wrong by what it shows: its claim, its mark, its axis and its words. Wilke's objection
  is that a figure made by hand cannot be made again exactly. In his own words, "The best
  visualization software is the one that allows you to make the figures you need." A spreadsheet
  figure made from a written figure sheet, with every default checked, can be a good figure. It is
  harder to repeat than one drawn by code. Drawing figures by code is taught in the course's book on
  R and reproducibility (S52).
reporting_sentence: |
  Figures were drawn in [program and version] from the data in [table or file]. The decisions
  for each figure, including axis ranges and colours, are listed in [supplementary file].
exercises:
- type: retrieval
  prompt: |
    From memory: list the nine decisions for making a figure, in order. Which four decide what
    the figure shows, and which come after?
  answer: |
    Claim, mark, axis, words; then defaults, colour, caption, saving, checks.

    The first four decide what the figure shows: the claim, the mark, the axis range, and the
    axis titles with units. The rest come after. Check the defaults one by one. Give colour a job.
    Write the caption. Choose the file type and size. Last, check it at printed size, in grey and
    through a simulator.
  confidence_first: true
- type: critique
  prompt: |
    A colleague hands you the figure sheet below for a figure in her thesis. It is invented. Say
    what is wrong with each line you would change, and what you would write instead.

    ```table
    | step | decision |
    | claim | anaemia in NFHS-5 |
    | mark | 3-D columns, the program's first offer |
    | axis | the program's own range, which starts at 50 |
    | words | title on top: "Anaemia"; axis untitled |
    | colour | red for women, green for men |
    | saving | jpeg, so the file is small |
    ```
  answer: |
    - Claim: "anaemia in NFHS-5" is a topic. Write the finding, for example "anaemia was more than
      twice as common in women as in men aged 15-49 in NFHS-5". Then decide what to draw.
    - Mark: a 3-D effect adds depth that is not in the data (`S58-R1-C18`). Use flat bars, or dots.
    - Axis: bars start at zero. Men aged 15-49 were at 25.0 per cent in NFHS-5, so an axis from 50
      cannot show the men's bar at all. Take the axis from 0, and title it "anaemic (%)".
    - Words: the title moves into the caption, as a finding. The value axis needs its quantity
      and unit.
    - Colour: red against green fails in grey and for readers with the commonest colour-vision
      deficiency. Two groups with no order take two colours of clearly different lightness, or
      direct labels and one colour.
    - Saving: jpeg blurs lines and text. Use the journal's format; otherwise pdf, or png where a
      bitmap is required.

    Three lines are missing: no step for checking the defaults that are left, none for the
    caption, and none for the checks at printed size and in grey.
  skill_ref: S58-R1-K02
- type: design
  prompt: |
    Take the figure you are drawing for your build section. Write its figure sheet, the data and
    all nine decisions, before you open any program. Then draw it, and note every place where you had to change
    something the sheet did not mention. Add those to the sheet.
  answer: |
    Judge your sheet by whether a colleague could draw the same figure from it and your data
    without asking you anything. Check four lines in particular.

    - The claim is a sentence that would be false if the data had come out otherwise.
    - The axis line gives the start and the end. Bars start at zero; any other start for points is
      stated, with the reason.
    - The defaults line names each default you changed, not "tidied up".
    - The checks line records what you did: the width you shrank it to, and that you viewed it in
      grey and through a simulator.

    Every change you had to add after drawing is a decision you were about to make by accident.
    The list of them is worth keeping for your next figure.
  skill_ref: S58-R1-K02
- type: teaching
  prompt: |
    A first-year resident says: "I only have a spreadsheet, and my guide says it is fine. Why
    should I bother with all these steps?" Ten minutes, with a whiteboard.
  answer: |
    Agree with the guide first: a spreadsheet can draw a good figure. Wilke's own test is whether
    the software lets you make the figure you need.

    Then draw the program's first chart on the board, from her own data if she has them. Give it a
    title on top, a key saying "Series1", an axis starting above zero, and small text. Ask her what each
    element tells the reader. Most tell nothing, and the axis start misleads. Rougier and
    colleagues' point is that defaults suit every chart and so suit none.

    Then the real cost. Ask what happens when her guide finds one wrong value in the data. If she
    changed fifteen things by hand, she must remember and repeat all fifteen. Show her the figure
    sheet: the data and nine decisions, written once, kept beside the file. With it, the redraw takes minutes.

    End on what the sheet does not do. It does not make her data right. She checks those first.
retrieval_items:
- q: What are the nine decisions for making a figure, in order?
  a: Claim, mark, axis, words; then defaults, colour, caption, saving, checks (at printed size, in grey, through a simulator).
- q: Why does Wilke not recommend Excel for figures?
  a: It is an interactive program, so every figure is made by hand and cannot be repeated exactly; manual edits make a figure irreproducible.
- q: Which file types suit a chart?
  a: A vector graphic such as a pdf for print, a png where a bitmap is required; never a jpeg, which blurs lines and text. Follow the journal's instructions first.
- q: What is a figure sheet for?
  a: It records every decision for one figure, beside its data, so that you or anyone else can draw the same figure again.
