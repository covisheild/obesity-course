simplified_explanation: |
  A program will draw a chart from your numbers in one click. That chart is the program's guess,
  made for every chart at once.

  So decide first, then draw. Write your decisions down in order.

  Keep that list. When a number changes, or a reviewer asks for a change, you can draw the
  figure again in minutes and get the same result.
illustration:
  body: |
    Here is the trap with the chart a program offers first. It looks finished.

    Open the *National Family Health Survey (NFHS-5), 2019-21: India Fact Sheet* at https://dhsprogram.com/pubs/pdf/OF43/India_National_Fact_Sheet.pdf. Search
    for anaemic. The fact sheet counts a person as anaemic when their haemoglobin, measured in grams
    per decilitre (g/dl), is below a cut-off for their group. For women it is 12.0 g/dl, or 11.0 if
    pregnant (indicators 93 and 94). Five of its rows are these ([22] marks a footnote).

    > 92. Children age 6-59 months who are anaemic (<11.0 g/dl)[22] (%) 64.2 68.3 67.1 58.6

    > 95. All women age 15-49 years who are anaemic[22] (%) 53.8 58.5 57.0 53.1

    > 96. All women age 15-19 years who are anaemic[22] (%) 56.5 60.2 59.1 54.1

    > 97. Men age 15-49 years who are anaemic (<13.0 g/dl)[22] (%) 20.4 27.4 25.0 22.7

    > 98. Men age 15-19 years who are anaemic (<13.0 g/dl)[22] (%) 25.0 33.9 31.1 29.2

    The four columns are NFHS-5 (2019-21) urban, rural and total, then NFHS-4 (2015-16) total, as
    in the overweight rows you have used all through this book. Take the two totals for each
    group into a table of your own.

    ```table
    | group | NFHS-4, 2015-16 (%) | NFHS-5, 2019-21 (%) |
    | children 6-59 months | 58.6 | 67.1 |
    | women 15-19 | 54.1 | 59.1 |
    | women 15-49 | 53.1 | 57.0 |
    | men 15-19 | 29.2 | 31.1 |
    | men 15-49 | 22.7 | 25.0 |
    ```

    Now suppose you select the table and ask your program for a column chart.

    It has a title
    across the top, "Chart 1". A key in a box says "Series1" and "Series2". The value axis
    starts at 20. The text is small and grey. The bars are red and green. A dark grid line runs
    every 5 points. It saves as a jpeg.

    Do not start fixing what you see.

    **1. The claim.** Cover the chart and write the one sentence it should make. Here: between NFHS-4 and NFHS-5, the share with anaemia rose in every group.

    Keep every row, even one that would weaken the claim. Here none does: indicators 93 and 94, for
    non-pregnant and pregnant women, rose too. The fact sheet prints no confidence intervals. So it
    cannot show whether the smallest rises are more than sampling variation.

    **2. The mark.** The shape of the data is amounts for a set of groups, at two times. That
    takes bars, or dots where the bars would end, on one shared axis (`S58-R1-C15`). Put each
    group's two bars side by side, because the claim compares the two rounds within a group.

    **3. The axis.** Bars start at zero, so the starting point of 20 goes.

    **4. The words.** Title the value axis with the quantity and its unit: "anaemic (%)". Delete "Chart 1": the finding goes in the caption, not across the
    drawing.

    **5. The defaults.** Go through the rest one at a time and ask of each what it tells the reader (`S58-R1-C18`). The dark grid goes, or becomes faint. Make
    the small grey text larger and darker.

    **6. Colour.** Its job here is to separate two rounds. Red against green fails in grey and for a reader with colour-vision deficiency (`S58-R1-C19`).
    Choose two colours that differ clearly in lightness. Where you cannot, keep the order fixed and
    name each round on the figure.

    **7. The caption.** Finding first, then what the bars are, who, when, and the source (`S58-R1-C20`).

    **8. Saving.** Read the journal's instructions on file type and size first. Never use a jpeg for a chart: Wilke says to avoid it for "images containing
    line drawings or text".

    **9. The checks.** Shrink the figure on screen to about {{n:figure_check_width_low_cm}} to {{n:figure_check_width_high_cm}} cm wide, the size of one column
    of a printed page, and read every label (`S58-R1-C20`).

    Here is the figure sheet you have written. It records the data as well as the nine decisions.

    ```table
    | step | decision for this figure |
    | claim | anaemia rose between NFHS-4 and NFHS-5 in every group the fact sheet reports |
    | data | five rows of the NFHS-5 India fact sheet, NFHS-4 and NFHS-5 totals; pregnant and non-pregnant women left out, contained in all women |
    | mark | bars, the two rounds side by side within each group |
    | axis | value axis from 0 to 80, titled "anaemic (%)" |
    | words | groups under the bars with ages in years; no title on the drawing |
    | defaults changed | no key; faint grid; larger, darker text |
    | colour | this book's two colours merge in grey, so NFHS-4 always on the left and each round named over the first pair |
    | caption | finding first; what the bars show; ages; no counts in the source; source and indicator numbers |
    | saving | the journal's format and size; otherwise pdf, and png where a bitmap is required |
    | checks | read at {{n:figure_check_width_low_cm}} cm wide; in grey; through a simulator |
    ```

    The figure drawn from this sheet is the one at the start of this section. That is the point: any program that will take these decisions can draw it again.
  analogy_breaks_when: |
    The sheet makes the figure repeatable only as far as you wrote it down. A change you make by
    dragging a label with the mouse and forget to record is lost the next time.

    Each group has its own cut-off for haemoglobin, so the bars compare shares, not haemoglobin
    levels.
