definition:
  text: |
    Making a figure is a sequence of decisions, taken in a fixed order, which any program can be made to
    carry out. The first four decide the figure's content. They are the claim, the mark that suits the
    shape of the data, the range of the value axis (the side axis that carries the numbers), and the
    words on it, with each axis titled and given its unit.

    A default is a setting a program uses when you have not chosen one. Defaults are made to suit
    any plot, so they suit no particular plot well.

    In this book, a figure sheet is the written list of the decisions for one figure, kept beside the data.

    An image is saved either as a bitmap, a grid of coloured dots called pixels, or as a vector
    graphic, which stores the shapes themselves and is redrawn at any size without losing
    sharpness. A png or jpeg file is a bitmap; a pdf can hold a vector graphic.
