simplified_explanation: |
  You cannot tell whether your draft is clear by reading it yourself. You know what it means, so
  you read that meaning into it.

  So write your argument in a sentence and hide it. Give the draft to someone who does not know
  your work. Ask them to read it once, mark where they got stuck, and then write down what it
  argues. Put their sentence next to yours. Where they lost a part, or added one, the draft has a
  hole, and their marks show you where to look.
illustration:
  body: |
    Start with the test that is not a test. You finish the discussion section of your thesis
    chapter on the NFHS figures and give it to your guide. Two days later it comes back: "Looks
    good. Go ahead."

    It tells you almost nothing. Your guide planned the analysis with you and
    knows the argument before reading a word. Mensh and Kording say the writer is "the world's
    least qualified person" to judge a draft as a new reader would. The same holds for anyone
    who already knows the work.

    Now the test. The case is invented; the steps are the ones you will use.

    First, write your one message and seal it in an envelope, or in a file the reader will not
    see.

    > Among women aged 15 to 49 in India, overweight or obesity was commoner in NFHS-5 than in
    > NFHS-4, and commoner in urban than in rural areas. These survey data cannot say why.

    Next, find a reader outside the work: a resident in Physiology, say, who knows what a survey
    is and nothing about yours. Hand over the four pages with a pencil and these instructions.

    > Please read this once, at your normal speed, without going back. Put a mark in the margin
    > wherever you stop or read something twice. When you finish, turn it face down and write one
    > or two sentences: what is this section arguing?

    She hands back one mark, beside paragraph 3, and this sentence.

    > Obesity is increasing among Indian women because of urbanisation.

    Now open the envelope and compare, part by part.

    ```table
    | part | your message | her sentence | verdict |
    | about whom | women aged 15 to 49 in India | Indian women | age range lost |
    | what was found | commoner in NFHS-5 than in NFHS-4 | increasing | kept |
    | compared with what | urban higher than rural | because of urbanisation | a difference turned into a cause |
    | how far it reaches | the data cannot say why | nothing | lost, and contradicted |
    ```

    The added cause is the worst failure. Your draft never claims one, and a reader of your paper
    could still leave with it and repeat it. Find where it came from. Her mark sits beside
    paragraph 3. You open it: the urban and rural figures come straight after two sentences on
    diet and work changing in Indian cities. The order invites the reader to join them.

    Revise only what the test pointed to. Move the urban and rural figures into the paragraph that
    reports the findings. Give the possible explanations a paragraph of their own, opening with
    the sentence that these data cannot test them. Put the age range into the first sentence of
    the discussion, where the claim is made, and not only in the methods.

    Then test again, with a new reader. The resident from Physiology now knows your argument: her
    second summary would test her memory, not your draft. A resident in Microbiology reads it
    once, makes no mark, and writes this.

    > Overweight among women of 15 to 49 went up between the two surveys and is higher in towns.
    > The survey can't tell us why.

    Every part is there and nothing is added. The words differ from yours, and that does not
    matter. The draft passes.
  analogy_breaks_when: |
    One reader is one reader. A resident from another department reads like the colleague the
    gate of this book describes. An examiner or a journal reviewer in your field will read more
    closely and know more. A pass with one reader does not promise a pass with them.

    The test shows that the argument gets across. It does not show that the argument is right.
    If the analysis is wrong, a clear draft carries the wrong claim clearly.
figure_note: The test is a procedure in words and a comparison of two sentences, already set out as a table; a picture would redraw the steps and add nothing.
common_misreading: |
  "My reader got it wrong, so my reader was careless." The test assumes a reader who reads once
  and does not know the work, because that is how most of your readers will read. Mensh and
  Kording note that for most readers the abstract is the only part of a paper they read at all.
  If one careful reader outside the work misses or changes a part, the draft let them. Revise the
  draft, not the reader.
must_know:
- point: |
    Never count your guide's or co-author's approval as the test. They know the argument already,
    and they read it into the draft. Choose a reader outside the work for the one-pass test.
  kind: trap
  bearing: methodological
  refs:
  - mensh_kording_2017_structuring_papers
- point: |
    Write your own one-message sentence and put it away before the reader starts. If you write it
    after reading theirs, you will find their sentence closer to yours than it is.
  kind: move
  bearing: methodological
- point: |
    "Did you like it?" and "Any comments?" are the wrong questions. They bring back general praise
    or general doubt. Mensh and Kording read non-specific feedback as a sign that the reader did
    not get the story. Ask for the one sentence and the marks.
  kind: misconception
  bearing: methodological
  refs:
  - mensh_kording_2017_structuring_papers
- point: |
    Treat a part the reader added as worse than a part the reader lost. An added cause, a wider
    group, a stronger verdict: readers will repeat these. Find the paragraph whose order or
    wording invited it, and change that paragraph.
  kind: move
  bearing: public
- point: |
    Use a new reader for each round. A reader who has read the draft once and talked to you about
    it cannot be new to it again. In return, read your colleagues' drafts the same way when they
    ask.
  kind: move
  bearing: teaching
  refs:
  - mensh_kording_2017_structuring_papers
- point: |
    A pass shows that one reader, minutes after reading, could state your argument. It does not
    show that a reader will remember it a year later, which is Mensh and Kording's own measure. It
    also does not show that the argument is true or the methods sound. That is the examiners' and
    reviewers' job, and a clear draft makes their job possible, not unnecessary.
  kind: boundary
  bearing: methodological
  refs:
  - mensh_kording_2017_structuring_papers
exercises:
- type: retrieval
  prompt: |
    From memory, list the five steps of the one-pass test. Then say why the reader must not know
    your work, and why each round needs a new reader.
  answer: |
    Write your one message and put it away. A reader outside the work reads the draft once,
    without going back, marking where they stop or reread. The reader writes in one or two
    sentences what it argues. You compare their sentences with yours, part by part. You revise the
    paragraphs the comparison and the marks point to, and test again with a new reader.

    A reader who knows your work reads your argument into the draft, so the test would pass
    whatever the draft says. A reader who has done the test once knows your argument, so a second
    summary tests their memory and not the draft.
- type: build
  prompt: |
    This book's build: one section of a manuscript or thesis, rewritten so that each paragraph
    carries one idea, and shown to a reader. Use the section you have been working on since the
    start of the book.

    1. Write the section's one message at the top of a separate page, and put the page away.
    2. Make a reverse outline. Rewrite until each paragraph has one point, stated in its first
       sentence.
    3. Cut it in three passes, paragraphs, sentences, words, keeping the cuts in a second file.
    4. Score each paragraph for readability with one program, and reread the longest sentences of
       any paragraph that scores far harder than the rest.
    5. Run the one-pass test with a reader outside the work. Fill in the four-part comparison.
    6. Revise what the test pointed to, and run it again with a new reader until the draft passes.

    Keep the dated versions, the reverse outlines, the readers' sentences and their marks.
  answer: |
    Check your pack against this list.

    - The one message was written before the rewrite. It names whom the claim is about, what was
      found, compared with what, and how far it reaches.
    - Each paragraph's first sentence states its point, and the reverse outline of the final draft
      reads as the argument in order.
    - Word counts after each cutting pass are recorded. No two sentences were joined to save words,
      and no age range, place, year or qualifier was cut.
    - The readability scores came from one program, and you say how it counts figures. No
      sentence was chopped only to raise a score.
    - Each reader's sentence is kept beside yours, with the four parts marked kept, lost, changed
      or added. Each change in the next draft is traced to one of them.
    - The last reader's sentence carries every part of your message and adds none.

    The build is met when the last condition holds. That is this book's gate too: a colleague
    reading your draft can state your argument after one pass.
  skill_ref: S58-R1-K01
- type: teaching
  prompt: |
    A first-year resident hands you her thesis introduction and asks, "Can you read it and tell me
    if it's OK?" You have ten minutes and a whiteboard. Explain what you will do instead of reading
    it for her, and why.
  answer: |
    Start with why "is it OK?" fails. If you read it as her senior, you will mark words and say it
    is fine or not fine. Neither tells her whether a reader gets her argument, and comments that
    are general usually mean the reader missed the main line.

    Draw the five steps on the board. Ask her first to write, on a separate page, the one sentence
    her introduction exists to say, and to fold it away. Then you, or better a resident from
    another department, read it once without going back, marking where you stop. Then write what
    it argues, before you talk.

    Then compare the two sentences together, part by part: whom it is about, what is known, what
    is missing, and what the study will do. Show her that a part you lost points to a paragraph
    that hid it. A part you added points to a paragraph that invited it.

    Last, tell her the rule that makes the test work: a new reader each round. And offer to be her
    reader once, not every time.
retrieval_items:
- q: What does the reader write at the end of the one-pass test, and when?
  a: One or two sentences on what the draft argues, written after a single reading, without looking
    back at the draft.
- q: When does a draft pass the one-pass test?
  a: When the reader's sentences carry every part of your message, whom it is about, what was found,
    compared with what and how far it reaches, and add no part of their own. The wording need not
    match.
- q: Why is a part the reader added worse than a part the reader lost?
  a: Because readers repeat what they think the paper said. An added cause or a wider claim spreads
    as if the paper had made it.
