simplified_explanation: |
  A bar is a length, and a reader reads a length as a value. A small rise then looks like a leap.
illustrations:
- body: |
    Start with a real chart that went wrong. A newspaper drew the fuel-economy standards the United
    States set for new cars. The standard rose from 18 miles per gallon in 1978 to 27.5 in 1985.
    Each year's standard was drawn as a line, longer for a higher standard. Tufte measured the
    lines in *The Visual Display of Quantitative Information* (1983), on page 57.

    > This line, representing 18 miles per gallon in 1978, is 0.6 inches long.

    > This line, representing 27.5 miles per gallon in 1985, is 5.3 inches long.

    Work out the change in the data first, as a percentage change.

    ```working
    27.5 minus 18.0 = 9.5
    9.5 divided by 18.0 = 0.528
    0.528 times 100 = 52.8
    ```

    About 53 per cent, as Tufte gives it. Now the change in the drawing, measured on the page.

    ```working
    5.3 minus 0.6 = 4.7
    4.7 divided by 0.6 = 7.83
    7.83 times 100 = 783
    ```

    The lines grew by 783 per cent. Divide the drawn change by the change in the data.

    ```working
    783 divided by 53 is about 14.8
    ```

    The Lie Factor is about 14.8. The chart drew a rise of 53 per cent as a rise of 783 per cent.
    Nothing on it was a wrong number. The lengths were wrong.
  analogy_breaks_when: |
    Tufte's Lie Factor needs a length or an area you can measure on the page. It works for bars,
    lines whose length is the value, shaded areas and pictures. It does not apply to a point on a
    line chart, which carries its value by position: there is no drawn length to measure.

    The 14.8 is this one chart's. It says nothing about newspaper charts in general.
