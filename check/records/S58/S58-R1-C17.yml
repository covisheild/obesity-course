      88. Women who are overweight or obese (BMI ≥25.0 kg/m2)21 (%) 33.2 19.7 24.0 20.6
- body: |
    You have a slide that exaggerates. Here are four honest ways to redraw the same numbers. Which
    one you choose depends on the one claim the figure makes (`S58-R1-C14`).

    First, bars from zero. The NFHS-4 and NFHS-5 bars stand at {{n:nfhs4_women_ow_ob_pct}} and
    {{n:nfhs5_women_ow_ob_pct}} for women, and at
    {{n:nfhs4_men_ow_ob_pct}} and {{n:nfhs5_men_ow_ob_pct}} for men (indicator 89). The rise now
    looks modest. It is modest beside the level: about one adult in five had overweight or obesity
    in NFHS-4, and nearly one in four in NFHS-5. Bars from zero carry the level.

    Second, points joined by a line, on an axis near the data. A point is read by its position,
    so its axis may start above zero. Bergstrom and West say how to choose the range: "usually by
    allowing the axis to span the region not much larger than the range of the data values". The
    four values run from 18.9 to 24.0. An axis from 18 to 26 holds them with a little room, and it
    carries the change. Say in the caption that the axis starts at 18. Along the bottom, put each
    round at the year its fieldwork ended: 2016 for NFHS-4, and 2021 for NFHS-5, which ran to 30
    April 2021.

    Third, bars of the change itself, from zero. Wilke allows this: bars may show a difference "as
    long as we make it explicit which differences we are showing". Women rose by
    {{n:nfhs5_women_ow_ob_change_pp}} percentage points and men by {{n:nfhs5_men_ow_ob_change_pp}}.
    Two bars of 3.4 and 4.0, from zero, show the rise at its true size.

    Fourth, for a ratio, a logarithmic axis. Overweight or obesity was found in
    {{n:nfhs5_women_ow_ob_urban_pct}}% of urban women and {{n:nfhs5_women_ow_ob_rural_pct}}% of rural
    women in NFHS-5.

    ```working
    33.2 divided by 19.7 = 1.685
    19.7 divided by 33.2 = 0.593
    ```

    "Urban about {{n:nfhs5_women_ow_ob_urban_rural_ratio}} times rural" and "rural about 0.593 times urban" are the same fact said two
    ways. On a log axis that starts at 1, the two bars have the same length and point opposite
    ways: log10 of 1.685 is 0.227 and log10 of 0.593 is −0.227. Drawn from 0 on a linear axis,
    the first bar would be almost three times the second. Wilke: "Bars on a log scale represent ratios and must
    always start at 1".
  analogy_breaks_when: |
    The four redraws are honest about lengths. None of them settles which message is right. Bars
    from zero say "about one adult in four or five"; a line from 18 says "it rose". Both are true. Choosing
    between them is the claim of the figure, and the caption should state the numbers either way.

    The log axis is for ratios. Never draw an amount, such as a percentage, as a bar on a log axis:
    zero lies infinitely far down it, so any start you pick is arbitrary.
  numbers:
  - value: "22.9"
    unit: "% of men aged 15-49 overweight or obese, NFHS-5, India"
    citekey: nfhs5_india_factsheet
    as_of: '2026-10-02'
    quote: |-
      89. Men who are overweight or obese (BMI ≥25.0 kg/m2) (%) 29.8 19.3 22.9 18.9
  - value: "18.9"
