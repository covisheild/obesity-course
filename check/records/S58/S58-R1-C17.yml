must_know:
- point: |
    "Every number on the axis is correct, so the chart cannot mislead" is the error. Readers judge
    the lengths. In Correll's experiments the exaggeration stayed even when readers reported the
    numbers accurately. Fix the drawing, not the labels.
  kind: misconception
  bearing: methodological
  refs: [correll_2020_truncating_yaxis]
- point: |
    Before you show or accept a bar chart whose axis starts above zero, work out a ÷ (a − s) with
    the smaller bar. If it is above 1.05, redraw it before anyone discusses the size of the gap.
  kind: move
  bearing: methodological
  refs: [tufte_1983_visual_display]
- point: |
    A break mark on the axis does not make a truncated bar chart honest.
  kind: trap
  bearing: methodological
  refs: [correll_2020_truncating_yaxis]
- point: |
    Shading counts as ink. If you fill the area under a line, take the axis down to zero, or
    leave the line unfilled.
  kind: consequence
  bearing: methodological
  refs: [bergstrom_west_2016_proportional_ink]
- point: |
    To show a small change honestly, draw the change itself as bars from zero, or draw points on
    a stated range near the data.
  kind: move
  bearing: methodological
  refs: [wilke_2019_dataviz_ch17]
- point: |
    Draw a ratio on a logarithmic axis, with bars from 1. Then "twice" and "half" have the same
    length, pointing opposite ways, as the same fact said two ways should.
  kind: move
  bearing: methodological
  refs: [wilke_2019_dataviz_ch17]
- point: |
    The range you pick for a line chart still sets how big the change feels. So state the axis
    start in the caption, and give the change in numbers.
  kind: boundary
  bearing: methodological
  refs: [correll_2020_truncating_yaxis]
- point: |
    Repeat the change in percentage points and in per cent, with both values.
  kind: consequence
  bearing: public
exercises:
- type: retrieval
  prompt: |
    From memory: what does the Lie Factor divide by what? What value means the drawing is honest,
    and from what value does Tufte call it substantial distortion? What does it come to for two
    bars drawn from an axis start s?
  answer: |
    The percentage change drawn in the figure, divided by the percentage change in the data.

    An LF of 1 draws the change at its true size. Tufte counts above 1.05, or below 0.95, as
    substantial distortion.

    For two bars a and b, a the smaller, drawn from an axis start s, the LF is a ÷ (a − s). With
    s at zero it is 1.
- type: design
  prompt: |
    Take one result from the manuscript or thesis section you are rewriting for this book. Plan
    its figure's value axis.

    Write down four things. The mark you will use, and why. Where the value axis starts, and the
    range it shows. If you use bars, the Lie Factor of that start. The sentence of the caption that
    tells the reader where the axis starts and how big the change is in numbers.
  answer: |
    A good plan decides the axis from the mark, and the mark from the one claim.

    The mark. Bars if the claim is about the level of something, such as "a quarter of women".
    Points, joined by a line where time runs along the bottom, if the claim is about a change.
    The change itself as bars, if the change is the claim.

    The axis. Bars start at zero, so their Lie Factor is 1. Points may start near the data: a range
    not much wider than the values, with round tick marks. A ratio goes on a log axis, with bars
    from 1.

    The caption sentence names the start whenever it is not zero, and gives the values. For
    example: "The vertical axis starts at 18%. The share of women with overweight or obesity rose from {{n:nfhs4_women_ow_ob_pct}}% to {{n:nfhs5_women_ow_ob_pct}}%,
    a rise of 3.4 percentage points."

    If your draft has bars from an axis above zero, work out a ÷ (a − s) and write it down. A
    plan that leaves an LF above 1.05 in place has not finished.
  skill_ref: S58-R1-K02
retrieval_items:
- q: What is the Lie Factor of two bars, values a and b with a the smaller, drawn from an axis start s?
  a: a ÷ (a − s). It is 1 when s is zero, and it grows fast as s nears a.
- q: Where must a bar start on a linear axis, and where on a logarithmic axis?
  a: At zero on a linear axis, because its length is its value. At 1 on a log axis, because there
    a bar stands for a ratio and 1 means "no difference".
- q: Does a break mark on a truncated axis stop readers judging the difference as larger?
  a: No. In Correll and colleagues' experiments it did not, and the exaggeration stayed even when
    readers reported the numbers accurately.
common_misreading: |
  "The bars start at 20, but the axis says so, so anyone who reads the numbers is fine." The
  numbers are right and the picture is still wrong. Readers judge the drawn lengths, and in
  Correll and colleagues' experiments the exaggeration stayed even for readers who reported the
  numbers accurately. The axis label does not change the Lie Factor. Only the lengths do.
reporting_sentence: |
  The vertical axis of the figure starts at 18%, not at zero. The share of women aged 15-49 with
  overweight or obesity rose from {{n:nfhs4_women_ow_ob_pct}}% in NFHS-4 (2015-16) to
  {{n:nfhs5_women_ow_ob_pct}}% in NFHS-5 (2019-21). That is a rise of
  {{n:nfhs5_women_ow_ob_change_pp}} percentage points.
quantitative: true
practice:
- level: 1
  prompt: |
    Two bars stand for 40 and 50. The value axis starts at 30. Work out the height each bar is
    drawn above the axis start, the drawn ratio and the data ratio.
  answer: |
    ```working
    40 minus 30 = 10
    50 minus 30 = 20
    20 divided by 10 = 2
    50 divided by 40 = 1.25
    ```

    Drawn heights of 10 and 20. The second bar is drawn twice as tall as the first. The data
    ratio is 1.25.
- level: 2
  prompt: |
    Two bars stand for 40 and 50, and the value axis starts at 30. Work out the percentage change
    in the data, the percentage change in the drawing, and the Lie Factor.
  answer: |
    The data.

    ```working
    50 minus 40 = 10
    10 divided by 40 = 0.25
    ```

    A rise of 25 per cent. The drawing: the heights are 10 and 20.

    ```working
    20 minus 10 = 10
    10 divided by 10 = 1
    ```

    A rise of 100 per cent. Divide the drawn change by the change in the data.

    ```working
    100 divided by 25 = 4
    40 divided by 10 = 4
    ```

    The Lie Factor is 4. The second line checks it with a ÷ (a − s): 40 divided by 40 minus 30.
- level: 2
  prompt: |
    A value rises from 10 to 20. An infographic shows each value as a picture, and doubles the
    picture's height and its width for the second value. Work out how many times larger the second
    picture's area is, and the Lie Factor if readers judge by area.
  answer: |
    The area is height times width, and both doubled.

    ```working
    2 times 2 = 4
    ```

    The second picture covers 4 times the area. As percentage changes:

    ```working
    4 minus 1 = 3
    3 times 100 = 300
    20 minus 10 = 10
    10 divided by 10 = 1
    1 times 100 = 100
    300 divided by 100 = 3
    ```

    The area grew by 300 per cent for a rise of 100 per cent. The Lie Factor by area is 3.
- level: 3
  prompt: |
    Two bars stand for 60 and 66. On the page, the second bar is three times as tall as the first.
    Where does the value axis start?
  answer: |
    Call the axis start s. The drawn heights are 60 − s and 66 − s, and the second is three times
    the first.

    ```working
    66 − s = 3 × (60 − s)
    66 − s = 180 − 3 × s
    ```

    Add 3 × s to both sides, and take 66 from both sides.

    ```working
    3 × s − s = 2 × s
    180 minus 66 = 114
    114 divided by 2 = 57
    ```

    The axis starts at 57. Check it.

    ```working
    60 minus 57 = 3
    66 minus 57 = 9
    9 divided by 3 = 3
    ```
- level: 3
  prompt: |
    Two ratios, 2 and 0.5, are drawn as bars on a logarithmic axis. Work out each bar's length, in
    units of log10, when the bars start at 1. Then work them out when the bars start at 0.1.
  answer: |
    Starting at 1, a bar's length is the log10 of the ratio.

    ```working
    log10 of 2 = 0.301
    log10 of 0.5 = −0.301
    ```

    Equal lengths, pointing opposite ways. That is right: 2 is "twice" and 0.5 is "half".

    Starting at 0.1, each bar runs from 0.1 to its value, so its length is the log10 of the value
    divided by 0.1.

    ```working
    2 divided by 0.1 = 20
    0.5 divided by 0.1 = 5
    log10 of 20 = 1.301
    log10 of 5 = 0.699
    1.301 divided by 0.699 = 1.86
    ```

    Both bars now point up, so the half reads as a gain. And the bar for 2 is less than twice the
    bar for 0.5, though 2 is four times 0.5.
- level: 4
  prompt: |
    In NFHS-4 (2015-16), {{n:nfhs4_men_ow_ob_pct}}% of men aged 15-49 in India had overweight or obesity. In NFHS-5
    (2019-21) it was {{n:nfhs5_men_ow_ob_pct}}%. A slide draws the two as bars on an axis starting at 18%. Work out the
    drawn heights, the drawn ratio, the data ratio and the Lie Factor.
  answer: |
    ```working
    18.9 minus 18 = 0.9
    22.9 minus 18 = 4.9
    4.9 divided by 0.9 = 5.44
    22.9 divided by 18.9 = 1.21
    ```

    Drawn heights of 0.9 and 4.9 percentage points. The NFHS-5 bar is 5.44 times the NFHS-4 bar,
    for a data ratio of 1.21. Now the Lie Factor, with the smaller bar.

    ```working
    18.9 divided by 0.9 = 21.0
    ```

    A Lie Factor of 21. The rise of 4.0 percentage points, about 21 per cent, is drawn as a rise of
    about 444 per cent.
  refs: [nfhs5_india_factsheet]
- level: 5
  prompt: |
    Bergstrom and West describe a bar chart of jobs in Tennessee. The value for 2014 is about 1.08
    times the value for 2010, but the 2014 bar uses about 2.7 times as much ink. Work out the Lie
    Factor. Then work out where the axis started, as a fraction of the 2010 value.
  answer: |
    As percentage changes: the data rose by 8 per cent, the ink by 170 per cent.

    ```working
    1.08 minus 1 = 0.08
    2.7 minus 1 = 1.7
    1.7 divided by 0.08 = 21.25
    ```

    A Lie Factor of about 21.

    For the axis start, measure everything in units of the 2010 value, so a = 1 and b = 1.08. The
    drawn heights are 1 − s and 1.08 − s, and the second is 2.7 times the first.

    ```working
    1.08 − s = 2.7 × (1 − s)
    1.08 − s = 2.7 − 2.7 × s
    ```

    Add 2.7 × s to both sides, and take 1.08 from both sides.

    ```working
    2.7 minus 1 = 1.7
    2.7 minus 1.08 = 1.62
    1.62 divided by 1.7 = 0.953
    ```

    The axis started at about 0.953 of the 2010 value: about 95 per cent of the way up the first
    bar. Check with the shortcut: 1 ÷ (1 − 0.953) is about 21, as before.
  refs: [bergstrom_west_2016_proportional_ink]
- level: 5
  prompt: |
    In NFHS-5, {{n:nfhs5_women_ow_ob_urban_pct}}% of urban women aged 15-49 and {{n:nfhs5_women_ow_ob_rural_pct}}% of rural women had overweight or
    obesity.
    A slide draws the two as bars on an axis starting at 15%. Work out the Lie Factor of the
    comparison.
  answer: |
    The smaller bar is rural, 19.7, so the percentage changes are measured from it.

    ```working
    33.2 minus 19.7 = 13.5
    13.5 divided by 19.7 = 0.685
    19.7 minus 15 = 4.7
    33.2 minus 15 = 18.2
    18.2 minus 4.7 = 13.5
    13.5 divided by 4.7 = 2.87
    2.87 divided by 0.685 = 4.19
    ```

    The urban figure is 68.5 per cent above the rural one. The drawing shows 287 per cent. The Lie
    Factor is about 4.19, the same as 19.7 ÷ (19.7 − 15).
  refs: [nfhs5_india_factsheet]
- level: 6
  prompt: |
    You want one figure for the change in overweight or obesity in adults aged 15-49 between NFHS-4 and
    NFHS-5. Women went from {{n:nfhs4_women_ow_ob_pct}}% to {{n:nfhs5_women_ow_ob_pct}}%, and men from {{n:nfhs4_men_ow_ob_pct}}% to {{n:nfhs5_men_ow_ob_pct}}%. You choose points joined
    by lines.
    Choose the value axis's range, say why, and say what would happen if a colleague drew bars on
    the same axis.
  answer: |
    The four values run from 18.9 to 24.0.

    ```working
    24.0 minus 18.9 = {{n:nfhs_ow_ob_totals_range_pp}}
    ```

    A spread of {{n:nfhs_ow_ob_totals_range_pp}} percentage points. An axis from 18 to 26, marked every 2 points, holds all four
    with a little room at each end. It is not much wider than the data, which is what Bergstrom and
    West advise for a line. Points are read by position, so this is honest, if the caption says the
    axis starts at 18.

    Bars on that axis would not be honest. With the smaller bar of each pair:

    ```working
    20.6 minus 18 = 2.6
    20.6 divided by 2.6 = 7.92
    18.9 minus 18 = 0.9
    18.9 divided by 0.9 = 21.0
    ```

    Lie Factors of about {{n:nfhs_women_lf_axis18}} for women and 21 for men. If the message is the level, about one
    adult in four or five, use bars from zero instead.
  refs: [nfhs5_india_factsheet, bergstrom_west_2016_proportional_ink]
- level: 6
  prompt: |
    In NFHS-5, {{n:nfhs5_men_ow_ob_urban_pct}}% of urban men aged 15-49 and {{n:nfhs5_men_ow_ob_rural_pct}}% of rural men had overweight or obesity.
    For women the two figures were {{n:nfhs5_women_ow_ob_urban_pct}}% and {{n:nfhs5_women_ow_ob_rural_pct}}%. Draw the urban-to-rural ratio for women and for men
    as bars on a logarithmic axis. Work out each ratio and each bar's length in units of log10, and
    the ratio of the two lengths.
  answer: |
    ```working
    33.2 divided by 19.7 = 1.685
    29.8 divided by 19.3 = 1.544
    log10 of 1.685 = 0.227
    log10 of 1.544 = 0.189
    0.227 divided by 0.189 = 1.20
    ```

    The women's bar is about 1.2 times the men's bar, both drawn up from 1. Urban women are about
    {{n:nfhs5_women_ow_ob_urban_rural_ratio}} times rural women; urban men are about 1.54 times rural men. Had the bars started at 0 on a linear
    axis, they would stand for amounts, not ratios. A ratio below 1 could not point the other way.
  refs: [nfhs5_india_factsheet, wilke_2019_dataviz_ch17]
- level: 7
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
    women overweight or obese: 20.6% in NFHS-4, 24.0% in NFHS-5
    bars drawn from an axis start of 20
    drawn heights: 0.6 and 4.0
    drawn ratio: 4.0 divided by 0.6 = 6.67
    data ratio: 24.0 divided by 20.6 = 1.165
    Lie Factor: 6.67 divided by 1.165 = 5.73
    ```
  answer: |
    The first five lines are right. The last line broke. The Lie Factor divides percentage
    changes, not ratios. Take 1 from each ratio to turn it into a change.

    ```working
    4.0 divided by 0.6 = 6.6667
    6.6667 minus 1 = 5.6667
    24.0 divided by 20.6 = 1.16505
    1.16505 minus 1 = 0.16505
    5.6667 divided by 0.16505 = 34.33
    ```

    The Lie Factor is about 34.3, as a ÷ (a − s) gives: 20.6 divided by 0.6.

    Why it looks reasonable: the ratio of the two ratios is a real comparison of picture against
    data. Bergstrom and West use ink ratios that way. But it is not Tufte's Lie Factor, and
    Tufte's 1.05 belongs to the Lie Factor. Here the wrong method understates the distortion six
    times over.
  refs: [tufte_1983_visual_display]
- level: 8
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
    the slide: bars for 20.6% and 24.0% on an axis from 20, Lie Factor 34.3
    the fix: a zig-zag break mark added to the axis and to both bars
    the axis numbers are correct, and the break tells the reader the axis was cut
    so readers now read the values, not the lengths: the Lie Factor is 1
    ```
  answer: |
    The fourth line broke. The Lie Factor belongs to the drawing. The bars are still 0.6 and 4.0
    high, so it is still 20.6 divided by 0.6.

    ```working
    20.6 divided by 0.6 = 34.33
    ```

    Readers did not switch to the numbers either. In Correll and colleagues' second experiment a
    break mark on the axis and the bars did not stop truncation raising how severe the difference
    looked. In their third, it stayed even when readers reported the numbers accurately.

    An honest fix changes the lengths: bars from zero, points on a stated range, or bars of the 3.4
    percentage-point change from zero.

    Why it looks reasonable: the break mark is true, and it is what many style guides advise. It
    tells the reader a fact; the picture tells them a different one, and the picture wins.
  refs: [correll_2020_truncating_yaxis]
- level: 9
  prompt: |
    Correll and colleagues reproduce a bar chart shown on Fox News. Their caption says the second
    bar is 6 times taller than the first. It goes on: "even though there is only a 4.6% increase in
    tax rate (ratio of 1.13 to 1)". A colleague says: "So the chart made a 4.6% rise look like a 500% rise."

    Decide what to compute, compute it, and say what the chart's critics cannot claim from it.
  answer: |
    Compute the Lie Factor from the two ratios, and check what "4.6%" is.

    ```working
    6 minus 1 = 5
    1.13 minus 1 = 0.13
    5 divided by 0.13 = 38.5
    ```

    The bars changed by 500 per cent for a rise of 13 per cent: a Lie Factor of about 38.

    The colleague's "4.6%" is a rise of 4.6 percentage points, not a 4.6 per cent rise. A ratio of
    1.13 with a gap of 4.6 points puts the first rate near 4.6 divided by 0.13.

    ```working
    4.6 divided by 0.13 = 35.4
    ```

    About 35%. So the true rise is 13 per cent, and the sentence should say "a 4.6-point rise,
    about 13 per cent".

    What it does not establish. The chart's numbers were right; only its lengths were wrong. The
    Lie Factor says nothing about whether a 4.6-point rise in a tax rate matters: that is a
    judgement about tax, not about charts. And it does not show the designer meant to mislead.
  refs: [correll_2020_truncating_yaxis]
- level: 10
  prompt: |
    A district officer presents NFHS results with a bar slide and says: "Look at this. Overweight
    and obesity in men almost doubled between the two surveys."

    Decide what to compute, compute it, and say what the claim and the slide do not establish.
  answer: |
    Compute the real change both ways, then find the axis start that would make the bars look
    doubled. The men's figures are {{n:nfhs4_men_ow_ob_pct}}% in NFHS-4 and
    {{n:nfhs5_men_ow_ob_pct}}% in NFHS-5.

    ```working
    22.9 minus 18.9 = 4.0
    4.0 divided by 18.9 = 0.212
    22.9 divided by 18.9 = 1.21
    ```

    A rise of 4.0 percentage points, about 21 per cent. Not a doubling. Now the start that draws a
    doubling: the NFHS-5 height, 22.9 − s, equals twice the NFHS-4 height, 2 × (18.9 − s).

    ```working
    22.9 − s = 37.8 − 2 × s
    37.8 minus 22.9 = 14.9
    ```

    Add 2 × s to both sides and take 22.9 from both sides: s = 14.9. Any bar slide whose axis starts
    near 15% will show the men's bar about twice as tall. The officer read the lengths.

    What it does not establish. The figures are for men aged 15 to 49 only, with overweight and
    obesity combined in one row. NFHS-4 and NFHS-5 are two separate samples, so this is a change in
    the share, not in any group of men followed over time. Nothing in the two numbers says why it
    rose. And whether a rise of 4 points matters is a question for the programme, not for the
    chart.
  refs: [nfhs5_india_factsheet]
