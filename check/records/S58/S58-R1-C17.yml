    citekey: nfhs5_india_factsheet
    as_of: '2026-10-02'
    quote: |-
      phase two from 2 January 2020 to 30 April 2021
  - value: "33.2"
    unit: "% of urban women aged 15-49 overweight or obese, NFHS-5"
    citekey: nfhs5_india_factsheet
    as_of: '2026-10-02'
    quote: |-
      88. Women who are overweight or obese (BMI ≥25.0 kg/m2)21 (%) 33.2 19.7 24.0 20.6
  - value: "19.7"
    unit: "% of rural women aged 15-49 overweight or obese, NFHS-5"
    citekey: nfhs5_india_factsheet
    as_of: '2026-10-02'
    quote: |-
      88. Women who are overweight or obese (BMI ≥25.0 kg/m2)21 (%) 33.2 19.7 24.0 20.6
- body: |
    Does any of this change what readers think? Correll, Bertini and Franconeri tested it. Open
    "Truncating the Y-Axis: Threat or Menace?" at https://arxiv.org/abs/1907.02035. In their first
    experiment, 40 people rated how big the change in each chart looked, on a scale from 1 to 5. The same
    data were drawn with the axis starting at 0, 25 or 50%. Search for 0.36.

    > compared to an increase of 0.36 for starting the y-axis at 25% rather than 0%

    Starting the axis a quarter of the way up raised the rating by 0.36 on the 5-point scale. Bar
    charts and line charts behaved alike.

    Next they tried the usual fix: a break mark on the axis and on the bars. Search for Merely.

    > Merely indicating that truncation has occurred, even in a prominent and unambiguous way, may not be

    The break mark did not stop the exaggeration. In a third experiment, people wrote down the
    first and last values before rating. Their estimate of the change was no worse on a cut axis.
    The exaggeration stayed.

    > This bias is not merely a misreading of values, but seems to be connected to the visual

    So labelling a cut axis does not repair a bar chart. Changing the lengths does.
  analogy_breaks_when: |
    These were online volunteers rating plain charts with no subject matter, 40, 32 and 25 people
    in the three experiments. The size of the shift will differ for a district officer reading
    a slide about her own district.

    The authors do not conclude that every axis must start at zero. They write that "There is no
    a priori, domain-agnostic ground truth" for how severe an effect ought to look. The axis start
    is a choice, and the person who makes it owns the impression it gives.
  numbers:
  - value: "40"
    unit: "participants, Experiment One"
    citekey: correll_2020_truncating_yaxis
    as_of: '2026-10-02'
    quote: |-
      We recruited 40 participants for this task
  - value: "0.36"
    unit: "rise in perceived severity, 1-5 rating, axis at 25% against 0%"
    citekey: correll_2020_truncating_yaxis
    as_of: '2026-10-02'
    quote: |-
      compared to an increase of 0.36 for starting the y-axis at 25% rather than 0%
  - value: "32"
