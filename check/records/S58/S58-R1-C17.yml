- body: |
    Now run the same check on the running case of this book. Open the NFHS-5 India fact sheet at
    https://dhsprogram.com/pubs/pdf/OF43/India_National_Fact_Sheet.pdf and find indicator 88. In
    NFHS-5 (2019-21), {{n:nfhs5_women_ow_ob_pct}}% of women aged 15 to 49 had overweight or
    obesity. In NFHS-4 (2015-16) the figure was {{n:nfhs4_women_ow_ob_pct}}%.

    Suppose a district slide, made up for this example, draws the two values as bars on an axis
    that starts at 20. Each bar runs from 20 up to its value.

    ```working
    20.6 minus 20 = 0.6
    24.0 minus 20 = 4.0
    4.0 divided by 0.6 = 6.67
    ```

    The NFHS-5 bar is 6.67 times the NFHS-4 bar. The data ratio is much smaller.

    ```working
    24.0 divided by 20.6 = 1.165
    ```

    Now the Lie Factor. The change in the data is 3.4 percentage points on a start of 20.6. The
    change in the drawing is 3.4 points of height on a start of 0.6.

    ```working
    3.4 divided by 20.6 = 0.16505
    3.4 divided by 0.6 = 5.6667
    5.6667 divided by 0.16505 = 34.33
    ```

    A Lie Factor of about 34.3, far past Tufte's 1.05.

    Look at what happened in those lines. The 3.4 sat on top of both fractions and dropped out.
    What was left was 20.6 divided by 0.6. That holds for any two bars. Written as fractions, the
    change drawn is (b − a) ÷ (a − s), and the change in the data is (b − a) ÷ a.
    Divide the first by the second. The b − a cancels, top and bottom.

    ```working
    LF = a ÷ (a − s)
    ```

    So the Lie Factor of a truncated bar chart depends only on the smaller bar and where the axis
    starts. Try it on the slide.

    ```working
    20.6 divided by 0.6 = 34.33
    ```

    The same answer. Now move the axis start and watch the Lie Factor grow.

    ```table
    axis start (%)  NFHS-4 bar drawn (points)  NFHS-5 bar drawn (points)  drawn ratio  Lie Factor
    0               20.6                       24.0                       1.17         1.00
    10              10.6                       14.0                       1.32         1.94
    15              5.6                        9.0                        1.61         3.68
    18              2.6                        6.0                        2.31         7.92
    20              0.6                        4.0                        6.67         34.3
    ```

    Starting the axis halfway to the smaller value, at 10, already draws the rise almost twice
    its size. The last few points before 20.6 do most of the damage.
  analogy_breaks_when: |
    The shortcut a ÷ (a − s) holds for two bars, with the percentage change measured from the
    smaller one, a. For a fall, measure from the larger bar instead, or work the two percentage
    changes out in full. With several bars, work it out for each pair you expect the reader to
    compare.

    The NFHS values are real; the slide is made up. The fact sheet's figures are for ages 15 to
    49, and "overweight or obese" is one combined row.
  numbers:
  - value: "24.0"
    unit: "% of women aged 15-49 overweight or obese, NFHS-5, India"
    citekey: nfhs5_india_factsheet
    as_of: '2026-10-02'
    quote: |-
