- body: |
    Last, four statistical words used in their everyday sense. Each sentence is made up.

    > A significant number of women had overweight or obesity.

    In a paper, "significant" reads as the verdict of a statistical test: roughly, a difference too
    large to put down to chance. This book does not teach the test. No test was run here, so write
    the number: "Nearly a quarter of women aged 15 to 49 ({{n:nfhs5_women_ow_ob_pct}} per cent) had
    overweight or obesity."

    > Households were selected randomly.

    Suppose the field team walked down each lane and called at whichever houses were open. That is
    not random. As `B0-R0-C29` showed, a random sample needs a real chance process, so that every
    household has the same chance of being picked. That section also gives "sample" its exact
    sense: the part of a population that is measured. Write what was done: "The team
    visited every house that was open on the survey day."

    > Most men had a normal BMI.

    In statistics, "normal" also names the shape of a distribution, which is beyond this book. As
    a category of BMI, it means nothing until you give its cut-offs. The fact sheet's own row 86
    shows the habit to copy: it says "below normal" and gives the cut-off beside it, "BMI <18.5
    kg/m2". Name the range your source uses.

    > Screen time was correlated with BMI.

    A correlation is a number worked out from paired measurements, and this book does not teach it.
    If you did not compute one, describe what you saw: "Children who reported more screen time
    tended to have a higher BMI."
  analogy_breaks_when: |
    The rule is against the everyday sense, not against the words. If you did run a test, or did
    use a chance process, or did compute a correlation, the technical word is the right one. Name
    the test, the process or the number beside it, so the reader can check it.

    "Nearly a quarter" is fair for {{n:nfhs5_women_ow_ob_pct}} per cent of women aged 15 to 49. It is
    not a figure for all adults, nor for men, whose own figure is {{n:nfhs5_men_ow_ob_pct}} per
    cent.
  numbers:
  - value: '18.5'
    unit: kg/m^2, the fact sheet's cut-off for BMI below normal
    citekey: nfhs5_india_factsheet
    quote: |-
      86. Women whose Body Mass Index (BMI) is below normal (BMI <18.5 kg/m2)21 (%) 13.2  21.2  18.7  22.9
