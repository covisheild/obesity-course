- body: |
    Now the abbreviations. Here is a made-up sentence of a kind found in Indian theses. It uses
    five: accredited social health activist (ASHA), primary health centre (PHC), waist
    circumference (WC), cardiovascular disease (CVD) and non-communicable disease (NCD).

    > ASHAs of the PHC were trained on WC measurement for CVD risk screening in the NCD clinic.

    That is five abbreviations in 17 words. Put three questions to each one. Is it standard for
    the reader who will read this paper? Does it save the reader anything, or only ink? Will it
    appear often enough to be worth learning?

    "PHC" can become "the primary health centre" once and "the centre" after that. The US Federal
    Plain Language Guidelines call this a nickname, and prefer it to an abbreviation. "WC", "CVD"
    and "NCD" each appear once, so spell them out. "ASHA" is the one worth keeping if the chapter
    is about these workers. An Indian reader knows it. A reviewer abroad may not, so spell it out
    at first mention.

    > We trained the accredited social health activists (ASHAs) of one primary health centre to measure waist circumference, as part of the centre's screening for cardiovascular disease.

    Is this a real problem, or a matter of taste? Barnett and Doubleday counted acronyms in titles
    and abstracts in PubMed, the National Library of Medicine's index of medical journals, from
    1950 to 2019. Search their article (https://doi.org/10.7554/eLife.60080) for "per 100 words".

    > We found that the proportion of acronyms in titles increased from 0.7 per 100 words in 1950 to 2.4 per 100 words in 2019

    > the proportion of acronyms in abstracts also increased, from 0.4 per 100 words in 1956 to 4.1 per 100 words in 2019.

    ```table
    | where | acronyms per 100 words, first year counted | acronyms per 100 words, 2019 |
    | titles (first year 1950) | 0.7 | 2.4 |
    | abstracts (first year 1956) | 0.4 | 4.1 |
    ```

    Work out how many times as dense the acronyms became, as a ratio (`B0-R0-C05`).

    ```working
    2.4 divided by 0.7 = 3.43
    4.1 divided by 0.4 = 10.25
    ```

    In abstracts, acronyms became about ten times as dense. Now search for "only once".

    > with 30% occurring only once, and 49% occurring between two and ten time times. Only 0.2% of acronyms (just over 2,000) occurred more than 10,000 times.

    Most of the 1.1 million different acronyms were rare: 30 per cent appeared once, and another
    49 per cent two to ten times. A year after first use, only 11 per cent had been used again in
    another paper in the same journal.

    Acronyms also collide. The same paper reports, from Lang (2019), that "UA" has 18 different
    meanings in medicine. The authors' own example is heart rate (HR), which can also mean hazard
    ratio, or hour.
  analogy_breaks_when: |
    Barnett and Doubleday counted acronyms. They did not test whether readers understood less.
    Their own abstract says acronyms "are not the biggest current problem in science
    communication". Read the rise as a fact about how papers are written, not as a measure of how
    much each acronym costs a reader.

    The count covers titles and abstracts in English-language PubMed, not full texts, and not
    Indian journals on their own. The authors expect it to be an undercount, because their method
    missed acronyms with symbols and lower-case letters.

    The ratio of about ten compares 1956 with 2019. It says nothing about any one paper, or about
    your field.
