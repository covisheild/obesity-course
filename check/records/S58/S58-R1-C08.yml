simplified_explanation: |
  Use the word a reader would say out loud. "Many", not "a number of".

  Once you have named a thing, keep the name.

  Spell out an abbreviation the first time you use it. Then ask whether it earns its place.
illustrations:
- body: |
    Start with a results paragraph that changes its words. It is made up, but its numbers are those
    of India's National Family Health Survey (NFHS).

    > Among women aged 15 to 49, overweight or obesity rose from {{n:nfhs4_women_ow_ob_pct}} per cent in NFHS-4 to {{n:nfhs5_women_ow_ob_pct}} per cent in NFHS-5. Obesity was more common in urban areas ({{n:nfhs5_women_ow_ob_urban_pct}} per cent) than in rural areas ({{n:nfhs5_women_ow_ob_rural_pct}} per cent). Excess weight was also found in {{n:nfhs5_men_ow_ob_pct}} per cent of men. High BMI therefore affects about a quarter of Indian adults.

    Count the names for the condition. There are four: overweight or obesity, obesity, excess
    weight, high BMI (body mass index). A reader meeting "obesity" in the second sentence will take it for a smaller
    group than "overweight or obesity" in the first. Is it?

    Open the NFHS-5 India fact sheet at
    https://dhsprogram.com/pubs/pdf/OF43/India_National_Fact_Sheet.pdf and find indicator 88.

    > 88. Women who are overweight or obese (BMI ≥25.0 kg/m2)21 (%) 33.2  19.7  24.0  20.6

    The urban and rural figures come from that same row. The adult rows of the table give
    overweight and obesity together, and none gives obesity alone. So the second sentence claims
    something the fact sheet does not report. The change of word did that, not the numbers.

    Now look at the group. The paragraph ends with "Indian adults". The table's adult rows sit
    under the heading "Nutritional Status of Adults (age 15-49 years)". The group's name drifted
    too, and the last sentence now covers people the survey's rows do not.

    Pick one term and define it once. Then use it in every sentence, even when it feels repetitive.

    > Among women aged 15 to 49, the proportion with overweight or obesity (a body mass index of {{n:nfhs5_ow_ob_bmi_cutoff}} kg/m^2 or more) rose from {{n:nfhs4_women_ow_ob_pct}} per cent in NFHS-4 to {{n:nfhs5_women_ow_ob_pct}} per cent in NFHS-5. Overweight or obesity was more common among urban women ({{n:nfhs5_women_ow_ob_urban_pct}} per cent) than among rural women ({{n:nfhs5_women_ow_ob_rural_pct}} per cent). Among men aged 15 to 49, the proportion with overweight or obesity was {{n:nfhs5_men_ow_ob_pct}} per cent.

    Mensh and Kording put the rule plainly: "There is nothing wrong with using the same word
    multiple times in a sentence or paragraph."
  analogy_breaks_when: |
    One term for one thing holds only while the thing stays the same. When you do mean a different
    group, such as obesity alone from a source that reports it, a different term is right, and it
    needs its own definition.

    The fact sheet's row says "women who are overweight or obese". This book writes "women with
    overweight or obesity", putting the person first. Choose your wording once, quote the source's
    label once where you define the term, and keep your own wording from then on.
