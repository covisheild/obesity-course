concept_id: S58-R1-C08
subject: S58
rung: 1
sequence: 8
name: 'Words: the everyday word, one term for one thing, abbreviations that cost the reader'
concept_type: empirical
clusters:
- craft-and-integrity
- india-specificity
ground_floor_deps:
- B0-R0-C05
- B0-R0-C14
- B0-R0-C29
concept_deps:
- S58-R1-C07
definition:
  text: |
    Four practices govern the choice of words in a scientific paper.

    The everyday word. Of two words that carry the same meaning, the familiar, short and concrete one is used.

    One term for one thing. Once a concept has a name, the same name is used for it throughout.

    Abbreviations. An abbreviation is a shortened form of a word or phrase. The International
    Committee of Medical Journal Editors (ICMJE) asks for standard abbreviations only, and none in
    the title. At first mention it asks for the full term followed by the abbreviation in
    brackets, except for a standard unit of measurement. The US Federal Plain Language Guidelines,
    written for government writing, advise no more than three abbreviations in a document, and
    preferably two. For papers, Barnett and Doubleday (2020) cite a recommendation of at most three
    acronyms (Talk Medicine BMJ, 2019). In this book, the limit counts a paper's nonstandard
    abbreviations. A long document, such as a thesis, may keep more if it spells each out again in
    every chapter, as this book does in every section.

    Statistical words. "Random", "normal", "significant", "correlation" and "sample" have exact
    meanings in statistics. ICMJE asks authors not to use them in their everyday senses.

    In this section, an acronym is the kind of abbreviation Barnett and Doubleday counted: a word
    in which half or more of the characters are capital letters. They counted acronyms in
    24,873,372 titles and 18,249,091 abstracts of English-language papers in PubMed, published from
    1950 to 2019. Their yearly figures for abstracts start in 1956, when enough abstracts became
    available.

    The study counted acronyms in titles and abstracts. It did not test whether readers understood less.
