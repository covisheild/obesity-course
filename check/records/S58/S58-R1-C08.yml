must_know:
- point: |
    "Using a different word each time makes writing less repetitive, and so better" is the error.
    A reader who meets a new word assumes a new thing.
  kind: misconception
  bearing: teaching
  refs: [mensh_kording_2017_structuring_papers, plain_language_2011_guidelines]
- point: |
    Do not write "obesity" for the NFHS-5 row that reports "overweight or obese". The fact sheet's adult rows give the
    two together, at a body mass index of {{n:nfhs5_ow_ob_bmi_cutoff}} kg/m^2 or more, and none gives obesity alone.
  kind: trap
  bearing: public
  refs: [nfhs5_india_factsheet]
- point: |
    Put three questions to every abbreviation in your draft. Is it standard for the reader of this
    paper? Does it save the reader anything but ink? Will it appear often? In a paper, keep no more
    than three nonstandard ones, spell each out at first mention, and use none in the title.
  kind: move
  bearing: teaching
  refs: [icmje_2026_manuscript_preparation, plain_language_2011_guidelines, barnett_doubleday_2020_acronyms]
- point: |
    "Significant", "random", "normal", "correlation" and "sample" make a statistical claim when a
    reviewer reads them. If you ran no test, drew no sample by a chance process, or computed no
    correlation, use other words, or state the number itself.
  kind: trap
  bearing: methodological
  refs: [icmje_2026_manuscript_preparation]
- point: |
    In PubMed abstracts, acronyms rose from 0.4 to 4.1 per 100 words between 1956 and 2019, about
    ten times as dense (Barnett and Doubleday, 2020). The count measured use, not understanding,
    and only in English-language titles and abstracts. When it matters, as in a report that ASHAs or patients will read, give the text to
    one such reader and watch where they stop.
  kind: boundary
  bearing: methodological
  refs: [barnett_doubleday_2020_acronyms]
- point: |
    An abbreviation every Indian community medicine reader knows, such as ASHA, may be unknown to a
    journal's reviewer abroad.
  kind: india_deviation
  bearing: teaching
  refs: [icmje_2026_manuscript_preparation]
common_misreading: |
  "Once an abbreviation is defined at first use, it costs the reader nothing." It still costs. A
  reader who meets it three pages later has to stop and look back. The US Federal Plain Language
  Guidelines and Mensh and Kording both name that cost. Many acronyms are rare, so
  a reader may well not know the one in front of them: Barnett and Doubleday found 30 per cent used
  only once, and 49 per cent two to ten times. Defining one is the minimum, not a licence.
reporting_sentence: |
  In this chapter, overweight or obesity means a body mass index of {{n:nfhs5_ow_ob_bmi_cutoff}} kg/m^2 or more, the NFHS-5 cut-off for adults aged 15 to 49.
exercises:
- type: retrieval
  prompt: |
    Without looking back: what does the International Committee of Medical Journal Editors ask
    for at an abbreviation's first mention? Where does it ask you to use none? Name four
    statistical words that should not be used in their everyday sense.
  answer: |
    At first mention, the term spelled out, followed by the abbreviation in brackets. A standard
    unit of measurement is the exception. No abbreviations in the title.

    Any four of: random, normal, significant, correlation, sample.
- type: critique
  prompt: |
    This results paragraph is made up, but its two numbers are the survey's own. Find every word
    problem in it and rewrite it.

    > Urban men showed significantly higher obesity ({{n:nfhs5_men_ow_ob_urban_pct}}%) than rural males ({{n:nfhs5_men_ow_ob_rural_pct}}%), and high BMI was correlated with urbanisation.
  answer: |
    Five problems.

    1. "Significantly" makes a statistical claim. No test is reported, so it has to go, or the
       test has to be named.
    2. "Obesity" is not what the numbers measure. Indicator 89 of the fact sheet is "Men who are
       overweight or obese (BMI ≥25.0 kg/m2)". These are the urban and rural figures for
       overweight or obesity together.
    3. "Men", then "males": two words for one group. Keep one.
    4. "High BMI" is a third name for the same condition.
    5. "Correlated with urbanisation" claims a correlation was computed. Two numbers, urban and
       rural, cannot give one. Describe the difference instead.

    A rewrite:

    > Among men aged 15 to 49, overweight or obesity was more common in urban areas ({{n:nfhs5_men_ow_ob_urban_pct}} per cent) than in rural areas ({{n:nfhs5_men_ow_ob_rural_pct}} per cent).

    The rewrite says less than the original, and all of it is true.
- type: critique
  prompt: |
    A colleague's slide reads: "A study of 24 million papers proved that acronyms make science
    harder to understand." Say what the study measured, and what the slide claims that it did not.
  answer: |
    Barnett and Doubleday counted acronyms in 24,873,372 titles and 18,249,091 abstracts in PubMed
    from 1950 to 2019. They measured how often acronyms appear (per 100 words), how many different
    ones there are, and how often each is used again. Acronyms rose from 0.4 to 4.1 per 100 words in
    abstracts.

    They did not test any reader. "Harder to understand" is a reasonable worry, and the authors
    give examples and a reason, but the study does not measure it. Their own abstract says acronyms
    are "not the biggest current problem in science communication".

    Two smaller errors. The 24 million are titles; abstracts were about 18 million. And the count
    covers titles and abstracts in English, not whole papers.

    A fair slide: "Acronyms in medical abstracts grew about ten times as dense between 1956 and
    2019, and most are used only a few times."
- type: design
  prompt: |
    Make the word list for the manuscript section you chose for this book's build. List every
    abbreviation in it and every term for its main outcome. Decide which abbreviations stay, and
    which single term you will use for the outcome. Write the sentence that defines that term.
  answer: |
    Check your list against four tests.

    - No more than three abbreviations stay, each standard for your reader or used often in the
      section. Each is spelled out at first mention, and none is in the title.
    - Every abbreviation that appears only once or twice is spelled out instead, or given a short
      plain name such as "the centre" or "the survey".
    - The outcome has one term. Every other word you found for it (excess weight, high BMI, obesity
      when you mean overweight or obesity) is replaced.
    - The defining sentence gives the term, its cut-off or rule, and its source. The sentence
      under "Reporting it" in this section is one model.

    Then search the section for "significant", "random", "normal" and "correlat". Each hit either
    names its test, process or number, or is rewritten.
retrieval_items:
- q: Why keep one term for one thing, even when it feels repetitive?
  a: A reader who meets a different word assumes a different thing is meant. Keeping the term
    avoids that doubt.
- q: How did acronym use in PubMed abstracts change between 1956 and 2019, by Barnett and
    Doubleday's count?
  a: From 0.4 to 4.1 acronyms per 100 words, about ten times as dense. The study counted use in
    titles and abstracts; it did not test readers.
- q: What three questions do you put to an abbreviation before keeping it?
  a: Is it standard for this paper's reader? Does it save the reader anything but ink? Will it
    appear often enough to be worth learning?
