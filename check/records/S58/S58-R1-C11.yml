- body: |
    Now a sentence of the kind a thesis is full of. It is invented, but you have read many like
    it. It reports the National Family Health Survey (NFHS), whose fourth round, NFHS-4, ran in
    2015-16 and whose fifth, NFHS-5, in 2019-21.

    > It was observed in the present study, which was based on an analysis of the data of the
    > National Family Health Survey, that the proportion of women in the age group of 15 to 49
    > years who were overweight or obese showed an increase from {{n:nfhs4_women_ow_ob_pct}}% in
    > NFHS-4 to {{n:nfhs5_women_ow_ob_pct}}% in NFHS-5.

    Count it. Take each numeral, abbreviation or symbol (such as {{n:nfhs4_women_ow_ob_pct}}%, NFHS
    or NFHS-4) as one word of one syllable. That is Flesch's own
    rule from 1979. Where a word can be said two ways, this book counts the fuller one (Flesch in
    1979 took the shorter); state your choice. There are 52 words. The words with more than one
    syllable add 19 extra beats: observed 1, present 1, study 1, analysis 3, data 1, National 2,
    Family 2, Survey 1, proportion 2, women 1, overweight 2, obese 1, increase 1.

    ```working
    52 plus 19 = 71
    71 divided by 52 = 1.365384615
    1.015 times 52 = 52.78
    84.6 times 1.3654 = 115.51
    206.835 minus 52.78 minus 115.51 = 38.545
    0.39 times 52 = 20.28
    11.8 times 1.3654 = 16.11
    20.28 plus 16.11 minus 15.59 = 20.80
    ```

    An FRE of 38.5 and a grade of 20.8. Its words are short. The one long sentence does the damage.

    Here are two rewrites. Score both before you read on.

    > Rewrite A. We analysed data from the National Family Health Survey. Among women aged 15 to
    > 49, the share with overweight or obesity rose from {{n:nfhs4_women_ow_ob_pct}}% in NFHS-4
    > to {{n:nfhs5_women_ow_ob_pct}}% in NFHS-5.

    > Rewrite B. We used NFHS. Women were measured. They were 15 to 49. Some were overweight.
    > Some were obese. It was {{n:nfhs4_women_ow_ob_pct}}%. It is now
    > {{n:nfhs5_women_ow_ob_pct}}%.

    Rewrite A has 30 words in 2 sentences, with 15 extra beats: analysed 2, data 1, National 2,
    Family 2, Survey 1, Among 1, women 1, overweight 2, obesity 3. Rewrite B has 24 words in 7
    sentences, with 5 extra beats: women 1, measured 1, overweight 2, obese 1.

    ```working
    30 plus 15 = 45
    30 divided by 2 = 15
    45 divided by 30 = 1.5
    206.835 minus 1.015 times 15 minus 84.6 times 1.5 = 64.71
    24 plus 5 = 29
    24 divided by 7 = 3.428571429
    29 divided by 24 = 1.208333333
    206.835 minus 1.015 times 3.4286 minus 84.6 times 1.2083 = 101.13
    ```

    ```table
    | version | words | sentences | syllables | ASL | ASW | FRE |
    | the draft | 52 | 1 | 71 | 52 | 1.3654 | 38.5 |
    | Rewrite A | 30 | 2 | 45 | 15 | 1.5 | 64.7 |
    | Rewrite B | 24 | 7 | 29 | 3.4286 | 1.2083 | 101.1 |
    ```

    Rewrite B scores best, above even the 100 at the top of Flesch's scale. It is also the worst
    of the three. It splits "overweight or obese", one group, into two, as if each had its own
    number. It drops which survey each number came from. It says "now" of a survey that ended in
    2021. The score rose because the sentences got shorter, and it would rise just as far whatever
    they said.

    Rewrite A keeps everything the draft said and scores 64.7, above Flesch's minimum of 60 for
    Plain English. It is the one to keep, and the score is not what tells you so. Reading it is.
  analogy_breaks_when: |
    These are single sentences and two short paragraphs, chosen to show the arithmetic. A score
    for a whole results section, a few hundred words, is steadier. The ranking of A and B would
    not change: a formula that counts lengths cannot tell a clear sentence from a short broken
    one.

    The counts here take each numeral as one syllable. The next illustration counts the same
    sentences the other way.
  numbers:
  - value: '{{n:nfhs4_women_ow_ob_pct}}'
    unit: per cent of women aged 15-49 overweight or obese, NFHS-4 (2015-16), India
    citekey: nfhs5_india_factsheet
    quote: 88. Women who are overweight or obese (BMI ≥25.0 kg/m2)21 (%) 33.2 19.7 24.0 20.6
  - value: '{{n:nfhs5_women_ow_ob_pct}}'
    unit: per cent of women aged 15-49 overweight or obese, NFHS-5 (2019-21), India
    citekey: nfhs5_india_factsheet
    quote: 88. Women who are overweight or obese (BMI ≥25.0 kg/m2)21 (%) 33.2 19.7 24.0 20.6
  - value: '2015-16'
    unit: years of NFHS-4
    citekey: nfhs5_india_factsheet
    quote: NFHS-5 (2019-21) NFHS-4 (2015-16)
  - value: '2019-21'
    unit: years of NFHS-5
    citekey: nfhs5_india_factsheet
    quote: NFHS-5 (2019-21) NFHS-4 (2015-16)
  - value: '2021'
    unit: year NFHS-5 fieldwork ended (phase two to 30 April 2021)
    citekey: nfhs5_india_factsheet
    quote: phase two from 2 January 2020 to 30 April 2021
  - value: '60'
    unit: Flesch Reading Ease, Flesch's minimum for Plain English
    citekey: flesch_1979_plain_english
    quote: The minimum score for Plain English is 60
- body: |
    Here is the trap with counting numerals. Flesch himself gave two rules. In 1948 he counted a
    numeral or symbol the way it is read aloud: "two for $ (“dollars”) and four for 1918". So did
    Kincaid and colleagues. In 1979 he counted every numeral, symbol and abbreviation as one
    syllable. Plavén-Sigray
    and colleagues, scoring 709,577 abstracts by computer, removed the numbers altogether.

    Count the draft and Rewrite A again, reading each numeral and abbreviation aloud. "15" is fifteen, 2 beats. "49"
    is forty-nine, 3. "{{n:nfhs4_women_ow_ob_pct}}%" is twenty point six per cent, 6. "{{n:nfhs5_women_ow_ob_pct}}%" is twenty-four
    point zero per cent, 8. Each "NFHS" with its number is four letters and a numeral, said one by
    one: 5. Each of these words had 1 beat before.

    ```working
    1 plus 2 plus 5 plus 7 plus 4 plus 4 = 23
    71 plus 23 = 94
    94 divided by 52 = 1.807692308
    206.835 minus 1.015 times 52 minus 84.6 times 1.8077 = 1.12
    45 plus 23 = 68
    68 divided by 30 = 2.266666667
    206.835 minus 1.015 times 15 minus 84.6 times 2.2667 = -0.15
    ```

    The same draft scores 38.5 or 1.1. The same rewrite scores 64.7 or -0.15. Nothing in either
    sentence changed. Only the counting rule did.

    So a score means nothing until you know how it was counted. A results paragraph is thick with
    numerals, and the rule for numerals can move its score more than any rewrite. When you compare
    two drafts, score both with the same program or the same rule. When you read someone else's
    score, look for how they counted numerals before you compare it with yours.
  analogy_breaks_when: |
    The gap is this large because these sentences are thick with numerals: 6 of the draft's 52
    words. In a paragraph of discussion with no numerals, symbols or abbreviations in it, the two
    rules give the same score. Most word processors can score readability; one 2022 study used
    Microsoft Word for both scores. Yours may follow yet another rule, and may not say which. So
    test it: score one sentence with numerals by hand, and see which rule its answer matches.
  numbers:
  - value: '709,577'
    unit: abstracts scored by Plavén-Sigray and colleagues
    citekey: plavensigray_2017_readability
    quote: Here, in a corpus consisting of 709,577 abstracts published between 1881 and 2015
      from 123 scientific journals
common_misreading: |
  "A Flesch–Kincaid grade of 12 means a reader needs twelve years of school to understand this."
  That is not what the number is. It is what a formula predicts from two lengths.

  Kincaid's numbers were fitted to United States Navy personnel reading Navy training manuals, in
  a 1975 report. Flesch's own numbers were fitted to schoolchildren answering questions on short
  reading passages. He wrote that children's grades were not the best yardstick for how readable
  a text is in general. Neither formula was tested on your readers. A grade is a guess about
  difficulty from the outside of the words, not a measured need for schooling.
reporting_sentence: |
  "We scored each leaflet with the Flesch Reading Ease score [ref] and the Flesch–Kincaid grade
  level [ref], using [program and version]. The program counts each numeral
  as [one syllable / the syllables it has when read aloud]. Both scores estimate difficulty from
  the length of words and sentences alone. We did not test our readers' understanding."
must_know:
- point: |
    "The score went up, so the text is clearer" is the error. The formula counts lengths and
    nothing else.
  kind: misconception
  bearing: methodological
  refs:
  - plavensigray_2017_readability
- point: |
    Before you compare two scores, find out how each counted numerals. Flesch in 1948 read them
    aloud, Flesch in 1979 counted each as one syllable, and one large study dropped them.
  kind: trap
  bearing: methodological
  refs:
  - flesch_1948_readability_yardstick
  - flesch_1979_plain_english
  - plavensigray_2017_readability
- point: |
    Use the score as a trip-wire on your own draft, never as a target. Where one scores far
    harder than the rest, read its longest sentences and rewrite them for the reader.
  kind: move
  bearing: methodological
  refs:
  - plavensigray_2017_readability
- point: |
    A grade level is carried over from the people the formulas were fitted on: Flesch's
    schoolchildren and Kincaid's 531 Navy personnel. Flesch wrote that his score tracks a school
    grade only up to about seventh grade.
  kind: boundary
  bearing: methodological
  refs:
  - flesch_1948_readability_yardstick
  - kincaid_1975_readability
- point: |
    These formulas were fitted on schoolchildren's test passages and Navy training manuals, so they
    say nothing about a Hindi or Tamil translation. For a health
    leaflet in any language, give it to a few people from the audience and ask them what it tells
    them to do.
  kind: boundary
  bearing: public
  refs:
  - flesch_1948_readability_yardstick
  - kincaid_1975_readability
- point: |
    Mind the unit of the syllable term. Flesch's 1948 article multiplies syllables per 100 words
    by 0.846; his 1979 book multiplies syllables per word by 84.6. Mix the two and the score comes
    out in the thousands below zero.
  kind: trap
  bearing: methodological
  refs:
  - flesch_1948_readability_yardstick
  - flesch_1979_plain_english
- point: |
    Quote the rise in abstracts scoring below 0 on the FRE (14 per cent in 1960, 22 per cent in
    2015, in one study of 709,577) as a rise in long words and long sentences. It does not show
    that specialists understand the newer abstracts less well.
  kind: number
  bearing: public
  refs:
  - plavensigray_2017_readability
quantitative: true
practice:
- level: 1
  prompt: |
    A paragraph has 120 words, 6 sentences and 180 syllables. Find its average sentence length
    and its average syllables per word.
  answer: |
    Divide the words by the sentences, then the syllables by the words.

    ```working
    120 divided by 6 = 20
    180 divided by 120 = 1.5
    ```

    ASL is 20 words a sentence. ASW is 1.5 syllables a word.
- level: 2
  prompt: |
    A passage has an average sentence length of 20 words and an average of 1.5 syllables per
    word. Find its Flesch Reading Ease score and its Flesch–Kincaid grade level, each to one
    decimal place.
  answer: |
    The Flesch Reading Ease score first.

    ```working
    1.015 times 20 = 20.3
    84.6 times 1.5 = 126.9
    20.3 plus 126.9 = 147.2
    206.835 minus 147.2 = 59.635
    ```

    FRE 59.6. Then the grade level.

    ```working
    0.39 times 20 = 7.8
    11.8 times 1.5 = 17.7
    7.8 plus 17.7 = 25.5
    25.5 minus 15.59 = 9.91
    ```

    Grade level 9.9.
- level: 3
  prompt: |
    A passage averages 1.6 syllables per word. What average sentence length, to the nearest
    whole word, gives it a Flesch Reading Ease score of 50?
  answer: |
    Work out the part of the formula you know, then undo the rest (`B0-R0-C16`).

    ```working
    84.6 times 1.6 = 135.36
    206.835 minus 135.36 = 71.475
    ```

    So 71.475 minus 1.015 times ASL must equal 50. The part taken away is the difference.

    ```working
    71.475 minus 50 = 21.475
    21.475 divided by 1.015 = 21.16
    ```

    About 21 words a sentence. Longer sentences than that would push the score below 50.
- level: 4
  prompt: |
    In 1948 Flesch scored an issue of the New Yorker magazine from October 1946. His counts were
    an average sentence length of 20 words and 148 syllables per 100 words. He printed a reading
    ease of 61. Recompute the score from his counts, to one decimal place. Then find the
    Flesch–Kincaid grade level for the same counts.
  answer: |
    Turn syllables per 100 words into syllables per word first.

    ```working
    148 divided by 100 = 1.48
    1.015 times 20 = 20.3
    84.6 times 1.48 = 125.208
    206.835 minus 20.3 minus 125.208 = 61.327
    ```

    FRE 61.3, which rounds to Flesch's 61. His 1948 form gives the same: 0.846 times 148 is
    also 125.208.

    ```working
    0.39 times 20 = 7.8
    11.8 times 1.48 = 17.464
    7.8 plus 17.464 minus 15.59 = 9.674
    ```

    Grade level 9.7. The grade formula was made 27 years after Flesch's article, for Navy personnel. It
    gives a number for a 1946 magazine, but nobody tested that number on the magazine's readers.
  refs:
  - flesch_1948_readability_yardstick
- level: 5
  prompt: |
    Flesch (1979) gives this sentence a score of 32.

    > Even though John is not normally given to a display of his deeper emotions, he allegedly
    > has developed a profound affection for Mary, as compared to the more equable feelings he
    > seems to have for Lucy, Fran and, to a lesser extent, Sue.

    Count its words and syllables, and compute its Flesch Reading Ease score to one decimal
    place. Then work out how far one syllable more or less in your count moves the score.
  answer: |
    Count the words: 43, in one sentence. Then the extra beats in the longer words.

    ```table
    | word | even | normally | given | display | deeper | emotions | allegedly | developed | profound |
    | extra beats | 1 | 2 | 1 | 1 | 1 | 2 | 3 | 2 | 1 |
    ```

    ```table
    | word | affection | Mary | compared | equable | feelings | Lucy | lesser | extent |
    | extra beats | 2 | 1 | 1 | 2 | 1 | 1 | 1 | 1 |
    ```

    ```working
    1 plus 2 plus 1 plus 1 plus 1 plus 2 plus 3 plus 2 plus 1 plus 2 plus 1 plus 1 plus 2 plus 1 plus 1 plus 1 plus 1 = 24
    43 plus 24 = 67
    67 divided by 43 = 1.558139535
    1.015 times 43 = 43.645
    84.6 times 1.5581 = 131.82
    206.835 minus 43.645 minus 131.82 = 31.37
    ```

    FRE 31.4, against Flesch's 32. Now one syllable. It changes ASW by 1 divided by 43.

    ```working
    1 divided by 43 = 0.02325581395
    84.6 times 0.0233 = 1.97
    ```

    About 2 points. If you say allegedly in three beats, not four, your score is about 33.3.
    Flesch's 32 sits between the two counts. Careful counters differ by a syllable or two, so a
    score is good to a point or two, not to the decimal.
  refs:
  - flesch_1979_plain_english
- level: 5
  prompt: |
    Suppose the 43-word sentence of the last problem could be split into three sentences. No word
    is added or removed, so it keeps every syllable you counted in the last problem. Compute its new Flesch Reading Ease
    score, and how much it changed.
  answer: |
    Only the average sentence length changes.

    ```working
    43 divided by 3 = 14.33333333
    1.015 times 14.33 = 14.545
    206.835 minus 14.545 minus 131.82 = 60.47
    60.47 minus 31.37 = 29.1
    ```

    FRE 60.5, up 29.1 points, with the same words. Two full stops moved the sentence from
    Flesch's "college" band (30 to 50) to just above his Plain English minimum of 60. That is why
    Flesch's own advice for a higher score is to "sprinkle periods". Whether the three sentences
    are clearer depends on how you split them, and the score cannot tell you.
  refs:
  - flesch_1979_plain_english
- level: 6
  prompt: |
    Score this results sentence twice: once taking each numeral as one syllable, and once counting
    each numeral as it is read aloud. Give both Flesch Reading Ease scores to one decimal place.

    > Among men aged 15 to 49, {{n:nfhs5_men_ow_ob_pct}}% had overweight or obesity in NFHS-5,
    > against {{n:nfhs4_men_ow_ob_pct}}% in NFHS-4.
  answer: |
    17 words, one sentence. With numerals as one syllable, the extra beats are: among 1,
    overweight 2, obesity 3, against 1.

    ```working
    17 plus 7 = 24
    24 divided by 17 = 1.411764706
    1.015 times 17 = 17.255
    84.6 times 1.4118 = 119.44
    206.835 minus 17.255 minus 119.44 = 70.14
    ```

    FRE 70.1. Now read the numerals aloud. Fifteen adds 1 beat. Forty-nine adds 2.
    "{{n:nfhs5_men_ow_ob_pct}}%", twenty-two point nine per cent, is 7 beats, so it adds 6.
    "{{n:nfhs4_men_ow_ob_pct}}%", eighteen point nine per cent, is 6, so it adds 5. Each
    "NFHS" with its number is 5 beats, adding 4 each.

    ```working
    1 plus 2 plus 6 plus 5 plus 4 plus 4 = 22
    24 plus 22 = 46
    46 divided by 17 = 2.705882353
    84.6 times 2.7059 = 228.92
    206.835 minus 17.255 minus 228.92 = -39.34
    ```

    FRE -39.3. The same 17 words score 70.1 or -39.3. State your counting rule beside any score
    you report.
  refs:
  - nfhs5_india_factsheet
  - flesch_1948_readability_yardstick
  - flesch_1979_plain_english
- level: 7
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
    a paragraph: 200 words, 10 sentences, 300 syllables
    ASL = 200 divided by 10 = 20
    syllables per 100 words = 300 divided by 200 times 100 = 150
    FRE = 206.835 minus 1.015 times 20 minus 84.6 times 150 = -12503.465
    so the paragraph is unreadable
    ```
  answer: |
    The step that broke is the fourth. The number 84.6 goes with syllables per word. With
    syllables per 100 words, Flesch's 1948 number is 0.846. Use either pair, not a mix.

    ```working
    300 divided by 200 = 1.5
    84.6 times 1.5 = 126.9
    206.835 minus 20.3 minus 126.9 = 59.635
    0.846 times 150 = 126.9
    ```

    FRE 59.6, just under Flesch's Plain English minimum of 60.

    Why the wrong answer looks reasonable. Both forms of the formula are in print, one per 100
    words and one per word. They differ only by where the decimal point sits. A score in the
    thousands below zero should have stopped the writer: almost all ordinary prose scores
    between 0 and 100.
  refs:
  - flesch_1948_readability_yardstick
  - flesch_1979_plain_english
- level: 8
  prompt: |
    Here is a student's worked score of a two-sentence paragraph. Find the step that broke.

    ```working
    the paragraph has 60 words and 90 syllables
    it has 2 full stops and 3 more clauses joined by "and", so 5 sentences
    ASL = 60 divided by 5 = 12; ASW = 90 divided by 60 = 1.5
    FRE = 206.835 minus 12.18 minus 126.9 = 67.755
    a score above 60, so it is Plain English
    ```
  answer: |
    The step that broke is the second. Flesch says: "don't break up sentences that are joined by
    conjunctions like and or but." The paragraph has 2 sentences.

    ```working
    60 divided by 2 = 30
    1.015 times 30 = 30.45
    206.835 minus 30.45 minus 126.9 = 49.485
    ```

    FRE 49.5, in Flesch's band for college readers (30 to 50), not Plain English.

    Why the wrong answer looks reasonable. The rules do count some marks inside a sentence as
    ending one. Flesch in 1979 counted a colon, a semicolon or a dash as a sentence end. And a
    clause joined by "and" looks like a sentence of its own. But a reader still has to carry the
    whole thing to the full stop.
  refs:
  - flesch_1948_readability_yardstick
  - flesch_1979_plain_english
- level: 9
  prompt: |
    In *How to Write Plain English* (1979), Flesch writes this.

    > Conversational English for consumers should score at least 80, or about 15 words per
    > sentence and 1 1/2 syllables per word.

    A colleague writes a patient leaflet to exactly those two averages and says it is now
    conversational English. Decide what to compute, compute it, and say what your answer does not
    establish.
  answer: |
    What to compute: the score those two averages give, from Flesch's own formula.

    ```working
    1.015 times 15 = 15.225
    84.6 times 1.5 = 126.9
    206.835 minus 15.225 minus 126.9 = 64.71
    ```

    64.7, not 80. The two averages do not give the score they are quoted for. Work back to see
    what would.

    ```working
    206.835 minus 15.225 = 191.61
    191.61 minus 80 = 111.61
    111.61 divided by 84.6 = 1.3193
    ```

    At 15 words a sentence, a score of 80 needs about 1.32 syllables a word, nearer 1 1/3 (1.33) than
    1 1/2. The same page's other pair works: 20 words and 1 1/2 syllables give 59.6, about the 60
    it is quoted for. So one number in the 80 sentence is probably a slip, in Flesch's book or in
    the retyped copy online. The arithmetic shows a mismatch; it cannot show which number is wrong.

    What this does not establish. Even a leaflet that does score 80 has not been shown to read as
    conversation, or to be understood by its readers. The score counts lengths. To know whether
    the leaflet works, give it to people it was written for and ask them what it tells them to do.
  refs:
  - flesch_1979_plain_english
- level: 10
  prompt: |
    A newspaper column says: "A study of 709,577 scientific abstracts found that more than a fifth
    of them now score below zero for readability. So a fifth of science cannot be understood by
    anyone." Decide what to compute, compute it, and say what your answer does not establish.
  answer: |
    What to compute: what a score below 0 takes, and whether the formula was built for these
    readers.

    Take an abstract with sentences of 25 words. Find the syllables per word that would bring its
    score to 0.

    ```working
    1.015 times 25 = 25.375
    206.835 minus 25.375 = 181.46
    181.46 divided by 84.6 = 2.1449
    ```

    About 2.14 syllables a word, at 25 words a sentence. Many medical words have three or four
    syllables: proportion, obesity, prevalence. In the study, 14 per cent of abstracts scored below 0 in 1960 and
    22 per cent in 2015. So "more than a fifth" is right for 2015.

    What this does not establish. A score below 0 means long words in long sentences. It does not
    mean nobody can understand the text. Flesch fitted his formula on children's reading passages
    and said its link to school grades holds only up to about seventh grade. Neither formula was fitted
    on specialists reading their own field. The authors themselves say the scores are an estimate, not
    a measure of how well a text will be understood.

    What the study does support is narrower, and still worth saying. Abstracts have grown harder
    by this measure, partly from more general scientific jargon. In one study the authors cite,
    abstracts rewritten to read more easily were better understood by academics.
  refs:
  - plavensigray_2017_readability
  - flesch_1948_readability_yardstick
exercises:
- type: retrieval
  prompt: |
    Without looking back, write down the two averages the Flesch Reading Ease formula uses. Say how
    you get each from the counts, and which way the score moves when each one grows. Then say what
    the formula cannot see.
  answer: |
    The average sentence length, words divided by sentences, and the average syllables per word,
    syllables divided by words. As either grows, the score falls, which means harder. The formula
    cannot see meaning, order, or whether the sentences connect: it counts lengths only.
- type: critique
  prompt: |
    A colleague's paper on patient leaflets at a district hospital reports: "Mean Flesch–Kincaid
    grade 11.2. The leaflets are therefore suitable only for patients who have completed class 11."
    Find what is wrong with the conclusion, and say what the paper would need to show it.
  answer: |
    Three things are wrong. First, the grade is a school grade predicted by a formula fitted on
    United States Navy personnel reading Navy manuals. Nothing has shown that it matches a class in an
    Indian school. Second, the formula counts word and sentence length only. A leaflet can score
    grade 11 and still be clear, or score grade 6 and leave out what the patient must do. Third,
    "suitable" is a claim about understanding, and nobody's understanding was tested.

    The paper would need to give the leaflets to patients from the clinic and test what they
    understood. For example, ask each one what the leaflet tells them to do. Mark the answers
    against a key written in advance. It should also say which program computed the grade, and how
    that program counts numerals and abbreviations.
- type: teaching
  prompt: |
    A journalist rings you: "Is it true scientific papers are getting harder to read?" You have
    three minutes. Give one quotable sentence, and say how sure the evidence lets you be.
  answer: |
    The quotable sentence: "Scientific abstracts have been getting harder to read for decades, by
    a measure that counts long words and long sentences. Part of the reason is that scientists use
    more of their own jargon."

    Then the size, in words a reader can picture. One study scored over seven lakh abstracts from
    123 journals. The share scoring below zero on that scale rose from about one in seven in 1960 to
    more than one in five in 2015.

    Then the limit, plainly. The measure counts lengths, not understanding. It was built on
    schoolchildren's reading tests and refitted on Navy personnel, not on scientists reading their
    own field. So the
    trend is well measured, but whether experts understand papers less well is not shown. Rewriting
    abstracts more plainly did help academics understand them, in one study the authors cite.
retrieval_items:
- q: What two counts make the average syllables per word, and what two make the average sentence
    length?
  a: Syllables divided by words; words divided by sentences.
- q: Give the Flesch Reading Ease formula in words.
  a: 206.835, minus 1.015 times the average sentence length, minus 84.6 times the average syllables
    per word. Higher means easier.
- q: Why can the same paragraph get two very different readability scores?
  a: The counting rules differ, above all for numerals and abbreviations, which one rule counts as one
    syllable and another reads aloud. In a paragraph thick with numerals, that can move the score by
    more than any rewrite.
figures:
- file: s58-r1-c11-score-lines.png
  caption: "The Flesch Reading Ease score falls by 1.015 points for each extra word in the average
    sentence. Each line holds one version's average syllables per word: about 1.37 for the 52-word
    draft of illustration 2, below, and 1.5 for its Rewrite A. The draft sits at 38.5; Rewrite A at
    64.7, above Flesch's Plain
    English minimum of 60. The whole gain comes from shorter sentences: Rewrite A's words are a
    little longer, so its line sits lower."
  alt: "Two nearly parallel falling lines of the FRE score against average sentence length. A point
    at 52 words and a score of 38.5 on the upper, solid line; a point at 15 words and 64.7 on the
    lower, dashed line. A dashed horizontal line at 60."
  source: draw.py
  spec:
    kind: scatter
    x: ["52", "15"]
    series:
    - name: "the draft and Rewrite A"
      y: ["38.5", "64.7"]
    x_label: "average sentence length, ASL (words)"
    y_label: "Flesch Reading Ease, FRE"
    curves:
    - {y: "y = 206.835 - 1.015*x - 84.6*71/52", x0: 0, x1: 52, label: "ASW of the draft, about 1.37"}
    - {y: "y = 206.835 - 1.015*x - 84.6*45/30", x0: 0, x1: 52, label: "ASW of Rewrite A, 1.5"}
    refs:
    - {y: 60, label: "Plain English minimum, 60"}
    labels:
    - {text: "the draft:\n52 words, 38.5", at: [52, 38.5], offset: [-56, 32]}
    - {text: "Rewrite A:\n15 words, 64.7", at: [15, 64.7], offset: [-80, -36]}
    derived:
    - {value: "1.37", from: "71/52"}
    relations:
    - check: "206.835 - 1.015*x[0] - 84.6*71/52 = 38.5"
    - check: "206.835 - 1.015*x[1] - 84.6*45/30 = 64.7"
- file: s58-r1-c11-counting-rule.png
  caption: "The draft and Rewrite A of illustration 2, below, scored under Flesch's two rules for
    numerals (illustration 3). Counting each numeral as one syllable, the draft scores 38.5 and
    Rewrite A 64.7. Reading each aloud, they score 1.1 and -0.15. The rule for numerals moved each
    score more than the rewrite did."
  alt: "Two pairs of bars. The draft: 38.5 with each numeral as one syllable, 1.1 with numerals read
    aloud. Rewrite A: 64.7 and -0.15, just below zero."
  source: draw.py
  spec:
    kind: bar
    x: ["the draft", "Rewrite A"]
    series:
    - name: "each numeral counted as one syllable"
      y: ["38.5", "64.7"]
    - name: "each numeral counted as read aloud"
      y: ["1.1", "-0.15"]
    y_label: "Flesch Reading Ease, FRE"
    value_labels: true
    labels:
    - {text: "numerals as\none syllable", at: [-0.336, 38.5], offset: [0, 14]}
    - {text: "numerals\nread aloud", at: [0.014, 1.1], offset: [0, 14]}
    relations:
    - check: "206.835 - 1.015*52 - 84.6*71/52 = 38.5"
    - check: "206.835 - 1.015*15 - 84.6*45/30 = 64.7"
    - check: "206.835 - 1.015*52 - 84.6*94/52 = 1.1"
    - check: "206.835 - 1.015*15 - 84.6*68/30 = -0.15"
- file: s58-r1-c11-three-scores.png
  caption: "The three versions of illustration 2, below, scored by the same rule. Rewrite B scores 101.1, above the 100 at the
    top of Flesch's scale, and it is the worst of the three: it splits one group in two and drops
    which survey each number came from. Rewrite A, at 64.7, keeps everything the draft said. The
    score counts lengths; only reading tells you which to keep."
  alt: "Three bars from zero: the draft 38.5, Rewrite A 64.7, Rewrite B 101.1. Dashed lines at 60,
