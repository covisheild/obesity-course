simplified_explanation: |
  A readability formula reads your draft with a ruler, not with a mind. Long sentences and long
  words push the score towards hard.

  Use it as a trip-wire.

  Never use it as a target. A row of four-word fragments scores as very easy, and it can still
  leave out the one thing the reader needed.
illustrations:
- body: |
    Start with a sentence short enough to count on your fingers. In *How to Write Plain English*
    (1979), Rudolf Flesch scores three ways of saying one thing. A copy of his chapter is at
    https://pages.stern.nyu.edu/%7Ewstarbuc/Writing/Flesch.htm. Search for profound.

    > Now let's say the same thing with a little more sophistication - "John has a profound
    > affection for Mary." This adds some complexity to the idea. It rates "Plain English"-a
    > score of 67

    Score it yourself. First count. The sentence has 7 words. Now count the beats in each word,
    saying it aloud.

    ```table
    | word | John | has | a | profound | affection | for | Mary |
    | syllables | 1 | 1 | 1 | 2 | 3 | 1 | 2 |
    ```

    Flesch gives a quicker way to count. Every word has at least one syllable, so start from the
    number of words, 7. Then add the extra beats in the longer words: 1 for profound, 2 for
    affection, 1 for Mary.

    ```working
    7 plus 1 plus 2 plus 1 = 11
    ```

    One sentence, 7 words, 11 syllables. Now the two averages. Each is one count divided by
    another (`B0-R0-C05`), and the average sentence length is a mean (`B0-R0-C28`).

    ```working
    7 divided by 1 = 7
    11 divided by 7 = 1.571428571
    ```

    So ASL is 7 and ASW, rounded to four decimal places, is 1.5714. Keep four places from here.
    Now the formula, in Flesch's own order. Multiply ASL by 1.015. Multiply ASW by 84.6. Add the
    two. Subtract the sum from 206.835.

    ```working
    1.015 times 7 = 7.105
    84.6 times 1.5714 = 132.94
    7.105 plus 132.94 = 140.045
    206.835 minus 140.045 = 66.79
    ```

    66.79 rounds to 67, Flesch's score. Now the grade level, for the same counts. Multiply ASL by
    0.39 and ASW by 11.8, add them, and take away 15.59.

    ```working
    0.39 times 7 = 2.73
    11.8 times 1.5714 = 18.54
    2.73 plus 18.54 minus 15.59 = 5.68
    ```

    A grade level of about 5.7. Now Flesch's first version, "John loves Mary.": 3 words, 4
    syllables, one sentence.

    ```working
    4 divided by 3 = 1.333333333
    1.015 times 3 = 3.045
    84.6 times 1.3333 = 112.80
    206.835 minus 3.045 minus 112.80 = 90.99
    ```

    Flesch prints 92 for it. The formula gives 91.0. Printed scores and your own can differ by a
    point, so say how you counted, and trust the arithmetic you can show.

    The short version scores 24 points easier. It also says something different: loving someone
    is not the same as having a profound affection for them. The formula cannot see that.
  analogy_breaks_when: |
    One sentence is far too small a sample. Flesch's own instructions take samples of 100 words,
    three to five of them from an article. Score whole paragraphs before you act on a number.

    The syllable count is a judgement, not a measurement. If you say "family" in two beats where
    someone else says three, your total moves. In a 7-word sentence one syllable moves the score
    by about 12 points. In a paragraph of 100 words it moves it by less
    than 1.
