simplified_explanation: |
  Colour in a chart should have a job. It can tell groups apart, stand for a number, or point at
  one thing. If it does none of these, take it out and draw in black or grey.

  Some of your readers cannot tell red from green. Some copies of what you write will be printed
  or photocopied in black and white. A grey copy keeps only how light or dark each colour is. So two
  colours of the same lightness turn into the same grey, and the reader loses what they meant.

  So test every colour figure twice before it leaves you. Look at it in grey. Then run it through a
  program that shows it as a reader with colour-vision deficiency sees it.
illustrations:
- body: |
    Start with a chart that fails. You draw the National Family Health Survey (NFHS-5) results
    for adults aged 15 to 49. In urban India, {{n:nfhs5_women_ow_ob_urban_pct}} per cent of women
    had overweight or obesity, and {{n:nfhs5_women_ow_ob_rural_pct}} per cent in rural India. For
    men the two numbers were {{n:nfhs5_men_ow_ob_urban_pct}} and {{n:nfhs5_men_ow_ob_rural_pct}}
    per cent. You draw four bars, grouped by sex. You colour urban red and rural green, because
    those are the first two colours your program offers. A legend in the corner says which is
    which.

    Now test it two ways.

    First, print it on a black-and-white printer, or photocopy it. A grey copy keeps only how light
    or dark each colour is. A red and a green of about the same lightness print as the same grey.
    The legend now tells the reader nothing.

    Second, think of the reader who cannot tell red from green. Crameri, Shephard and Heron, "The
    misuse of colour in science communication" (Nature Communications, 2020,
    https://pmc.ncbi.nlm.nih.gov/articles/PMC7595127/), list four checks any reader can run on a
    colour figure. One of them:

    > The colour map should not contain red and green at a similar luminosity

    Luminosity there means how bright or dark a colour looks. Run your chart through a
    colour-vision-deficiency simulator. Claus Wilke's book *Fundamentals of Data Visualization*
    (2019, free online at https://clauswilke.com/dataviz/) says several exist, online and as
    programs for your computer. In the simulated copy, the red and green bars look alike.

    Now fix it, in this order.

    1. Ask what the colour is for. Here it separates two groups, urban and rural. That is a real
       job, so the colour may stay.
    2. Put the words on the chart. Write "urban" and "rural" beside the bars and delete the legend.
       This is the direct labelling of the last section. The chart now reads with no colour at
       all.
    3. Make the two colours differ in lightness, not only in hue. Hue is the name of the colour:
       red, green, blue. A dark blue for urban and a light blue for rural survives a grey copy.
    4. Or take two colours from a palette built for colour-vision deficiency. Wilke uses the
       Okabe–Ito palette throughout his book. Its orange is #E69F00 and its blue is #0072B2, codes
       most programs accept. Keep large bars soft: Wilke warns against "large filled areas of
       overly saturated colors".
    5. Print it in grey again, and run it through the simulator again. In both copies a reader
       should still be able to say which bar is urban.

    Step 2 did most of the work. Once the words are on the chart, colour only helps; nothing
    depends on it. Wilke calls this redundant coding: the same information carried two ways.
  analogy_breaks_when: |
    Labels beside the bars work when there are few groups and room for the words. Wilke's rule of
    thumb is that colours for groups work best with three to five groups. At eight to ten or more,
    matching colours to groups becomes too hard. Then label directly, or label only the groups the
    text talks about.

    A palette built for colour-vision deficiency is not a pass. Wilke shows that colours are harder
    to tell apart on thin lines and small points than on large bars, and harder still under
    colour-vision deficiency. Test the figure itself, at its printed size, not the palette.
