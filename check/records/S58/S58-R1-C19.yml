name: "Colour: for meaning only, readable by everyone, and in grey"
concept_type: empirical
clusters:
- craft-and-integrity
- india-specificity
ground_floor_deps:
- B0-R0-C29
- B0-R0-C40
concept_deps:
- S58-R1-C14
