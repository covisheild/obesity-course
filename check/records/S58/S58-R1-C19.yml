must_know:
- point: |
    "More colours make a figure clearer" is the error. Colour with no job gives the reader a
    puzzle to solve.
  kind: misconception
  bearing: methodological
  refs: [rougier_2014_ten_rules_figures]
- point: |
    Each job takes its own kind of colour. A rainbow fits none of them.
  kind: move
  bearing: methodological
  refs: [wilke_2019_dataviz_ch04]
- point: |
    Red against green is the tempting pair: good and bad, urban and rural, before and after. At
    similar lightness it fails twice: in a grey copy and for
    readers with red-green colour-vision deficiency, the commonest kind. Change one of the pair, or
    make them differ in lightness.
  kind: trap
  bearing: methodological
  refs: [crameri_2020_misuse_colour]
- point: |
    The general estimate cited worldwide is 8 per cent of men and 0.5 per cent of women with
    colour-vision deficiency.
  kind: number
  bearing: public
  refs: [crameri_2020_misuse_colour]
- point: |
    The one Indian measurement here found 2.76 per cent of 74,986 school boys in Kanchipuram
    district, Tamil Nadu. It is boys in one district, with block figures from 1.12 to 3.40 per
    cent.
  kind: india_deviation
  bearing: public
  refs: [krishnamurthy_2021_cvd_india]
- point: |
    Write "urban" on the urban bar so that nothing depends on colour at all.
  kind: move
  bearing: methodological
  refs: [wilke_2019_dataviz_ch19, wilke_2019_dataviz_ch20]
- point: |
    A palette sold as colour-blind safe stops being safe on thin lines and small points. Wilke
    shows colours are harder to tell apart there, and harder still under colour-vision deficiency.
    So test the finished figure at its printed size, not the palette.
  kind: boundary
  bearing: methodological
  refs: [wilke_2019_dataviz_ch19]
- point: |
    When you review a colleague's map or heat map (a table whose cells are shaded by value), run Crameri and colleagues' checks aloud. Is
    there a colour bar? Does the scale get steadily lighter or darker? Are red and green at similar
    lightness? Is it a rainbow?
  kind: move
  bearing: teaching
  refs: [crameri_2020_misuse_colour]
common_misreading: |
  "Eight per cent of men are colour-blind, so 8 per cent of Indian men are." The 8 per cent is a
  general estimate for the world that Crameri and colleagues cite; they did not measure it. The one
  Indian measurement in this section found 2.76 per cent, in school boys of one district of Tamil
  Nadu. Even there, the share varied from block to block. Neither number is a rate for Indian adults. Your
  figure needs the same two tests whichever number is true.
reporting_sentence: |
  Colour in Figure 2 only separates urban from rural residence; each bar is also labelled, so the
  figure reads the same in black and white.
exercises:
- type: retrieval
  prompt: |
    Without looking back: name the three jobs colour can do in a data figure, and the kind of colour
    each job takes. Then name the two tests a colour figure should pass before it leaves you.
  answer: |
    To separate groups with no order, use a few colours that look clearly different and equally
    strong. That is a qualitative scale. To stand for a value, use colours that run from light to
    dark: a sequential scale. If the value can go either way from a middle such as zero, join two
    of them at a light middle colour: a diverging scale. To pick out one thing, use one strong
    colour and make the rest grey.

    The two tests: look at the figure in grey, and run it through a simulator of colour-vision
    deficiency. If its meaning survives both, the colour is doing its job.
- type: critique
  prompt: |
    A colleague's thesis draft has this figure, described in words. It is made up for this
    exercise.

    Figure 4 is a map of the districts of a state. Each district is shaded on a rainbow scale, blue
    through green and yellow to red, by the per cent of women with overweight or obesity. There is
    no colour bar. The caption ends "Red districts have the highest burden."

    Figure 5 is a line chart of the same percentage in four age groups over two survey rounds. The
    four lines are red, green, brown and orange, all thin and of the same thickness. A legend box
    in the corner names the age groups in the order youngest to oldest.

    List what is wrong with the colour, and how you would fix each problem.
  answer: |
    Figure 4.

    - The rainbow scale is not even. Yellow pulls the eye wherever it falls, and the wide green
      band hides real differences. In grey the order of districts is lost. Use a sequential scale
      that runs from light to dark.
    - There is no colour bar. Without it a reader cannot turn any shade into a number. Print one,
      with values marked.
    - The caption asks the reader to find "red". A reader with red-green colour-vision deficiency
      may not be able to. On a light-to-dark scale the caption can say "darker districts".

    Figure 5.

    - Red, green, brown and orange at similar lightness are hard to tell apart for many readers
      with colour-vision deficiency, and thin lines make it worse.
    - The legend sends the reader back and forth. Write each age group's name at the end of its
      line instead. If a legend stays, put its entries in the order the lines appear.
    - The age groups have an order, so use four steps of one colour, lightest for the youngest.
      Then check the figure in grey and in a simulator.
- type: teaching
  prompt: |
    A first-year resident says: "In that Tamil Nadu study only about 3 boys in 100 were
    colour-blind. Why should I redraw my red and green slides for so few people?" You have ten
    minutes and a whiteboard. Answer her.
  answer: |
    Start with what the number is. It is 2.76 per cent of 74,986 boys aged 11 to 17 in one
    district, about one boy in 36. It is not a rate for Indian adults, and girls were not tested.
    The general estimate cited worldwide is higher for men, 8 per cent, about one in 12 or 13.

    Then say why the number does not decide the question. Any room of examiners or reviewers may
    hold one person who cannot tell red from green. And some copies of her slides and thesis will
    be printed or photocopied in black and white. There, a red and a green of the same lightness
    become the same grey. That second problem affects every reader of a grey copy.

    Then show the cost of fixing it. Draw a red and green pair on the board, then the same chart
    with "urban" and "rural" written beside the bars. The labelled version needs no colour at all.
    Changing one colour and checking in grey takes minutes.
- type: design
  prompt: |
    Take the figure you are drawing for your build. For each colour in it, write down the job it
    does: separating groups, standing for a value, or picking out one thing. Remove every colour
    that has no job. Then print the figure in grey and run it through a colour-vision-deficiency
    simulator, and write down what you changed after each test.
  answer: |
    A good record of this has three parts. A list of colours, each with its job, or "none,
    removed". A grey copy in which every group or value can still be told apart. Usually that is
    because the groups are labelled directly or the colours differ in lightness. And a note of what the
    simulator showed, with the change you made.

    If a colour stands for a value, check three more things. The scale runs steadily from light to
    dark. It is not a rainbow. A colour bar is printed. If you used a palette built for
    colour-vision deficiency, check thin lines and small points at the printed size; the palette
    alone does not guarantee them.
  skill_ref: S58-R1-K02
retrieval_items:
- q: What does a greyscale copy of a figure keep, and what does it lose?
  a: It keeps how light or dark each colour is and loses the hue. Two colours of the same lightness
    become the same grey.
- q: What did the one Indian study in this section measure, and what is it not?
  a: 2.76 per cent of 74,986 boys aged 11 to 17 in Kanchipuram district, Tamil Nadu, had
    colour-vision deficiency confirmed on Ishihara plates. It is not a rate for India, for adults or
    for women.
- q: Why does a rainbow colour scale fail for values?
  a: It is not even, so some differences look bigger than others, and its lightness goes up and
    down, so the order of the values is lost in grey.
