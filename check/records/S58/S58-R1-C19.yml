- body: |
    Now colour does a different job: it stands for a number. Say you want a map of your state's
    districts, each shaded by the per cent of women with overweight or obesity. NFHS-5 publishes a
    fact sheet for every district, so the numbers exist.

    Your program offers a rainbow: blue for low, through green and yellow, to red for high. It
    looks lively. Turn the map grey and see what happens. Wilke describes the rainbow scale in
    grey:

    > The scale goes from medium dark to light to very dark and back to medium dark

    So in grey the order is lost. A district at the bottom of the scale and one at the top come
    out about equally dark. In colour the rainbow fails another way. Its yellow is the brightest
    colour and pulls the eye, wherever it falls on the scale. Its greens cover a wide band in which
    real differences are hard to see. Crameri and colleagues put a size on the damage: the colours
    can misrepresent the data "by more than seven percent of the displayed data variation".

    Use instead:

    - For a value that runs from low to high, a sequential scale. One colour going from light to
      dark will do. Scales built to be even, such as viridis or cividis, are listed with their
      sources in Crameri and colleagues' Box 2.
    - For a change that can go either way, such as each district's rise or fall from NFHS-4 to
      NFHS-5, a diverging scale. Put its light middle colour at zero, where the change is nothing.
      Wilke's warning: "Diverging scales need to be balanced". The colours should darken at the same
      rate on both sides, or a rise will look bigger than a fall of the same size.
    - Always print the colour bar: the strip, like an axis, that shows which colour stands for
      which value. Crameri and colleagues say that leaving it out is like leaving the labels and
      tick marks off an axis.

    Then turn the map grey again. A sequential scale that runs from light to dark keeps its order
    in grey.
  analogy_breaks_when: |
    An even colour scale makes equal differences look equal. It does nothing for the numbers
    themselves. A district's percentage from a survey carries its own error, and the colour hides
    it: two neighbouring shades may differ by less than that error. If the reader needs the
    numbers, give them in a table as well, as Wilke suggests for any figure whose data the reader
    may want in full.
  numbers:
  - value: "7"
    unit: "% of the displayed data range: distortion a rainbow-type colour map can introduce, at least"
    citekey: crameri_2020_misuse_colour
    quote: |-
      Such a colour-introduced blind interpretation can diverge from an objective representation by more than seven percent of the displayed data variation
- body: |
    How many of your readers is this about? One figure appears almost everywhere. Crameri and
    colleagues give it as "the general estimate":

    > worldwide 0.5% of women and 8% of men are subject to a colour-vision deficiency

    It is a general estimate they cite, not something they measured. They add that it is lower in
    sub-Saharan Africa and probably higher in some European populations.

    Now look for an Indian measurement. Krishnamurthy and colleagues, "Prevalence of color vision
    deficiency among school-going boys in South India" (Indian Journal of Ophthalmology, 2021,
    https://pmc.ncbi.nlm.nih.gov/articles/PMC8482944/), screened every boy in classes 6 to 12,
    aged 11 to 17, in the schools they visited in Kanchipuram district, Tamil Nadu. Boys who failed
    a first set of colour plates were tested on Ishihara's plates to confirm. Their Table 1 gives
    the counts by school location:

    ```table
    | school location | boys screened | colour-vision deficiency | per cent |
    | rural | 21911 | 392 | 1.79 |
    | urban | 53075 | 1681 | 3.17 |
    | all | 74986 | 2073 | 2.76 |
    ```

    Check the total row, and turn it into "one boy in how many".

    2073 divided by 74986 is 0.0276, to four decimal places.

    ```working
    0.0276 times 100 = 2.76
    100 divided by 2.76 = 36.2
    100 divided by 8 = 12.5
    ```

    So about one boy in 36 in this district, against one man in 12 or 13 in the general
    estimate.

    Now say what the 2.76 is. It is boys, at school, in one district, found by colour plates. Girls
    were not screened. Within the same district, the share differed between blocks, from 1.12 per
    cent in one to 3.40 per cent in another. So it is not a rate for India. The authors go further
    than their data in one sentence:

    > Extrapolating this, there could be 17 million boys affected with CVD in the country.

    That sentence assumes one district's boys stand for every boy in India. Book 0's section on
    sampling (`B0-R0-C29`) says why a sample speaks only for the population it was drawn from. This
    study did not sample India.

    For your figure, none of this changes the rule. Whether it is one man in 12 or one boy in 36,
    some of the people on your thesis committee, or among a journal's reviewers, may not tell red
    from green. Designing for them costs you two tests and a few labels.
  analogy_breaks_when: |
    Both numbers are counts of people who failed colour plates. The 8 per cent is a figure the
    authors cite from others, for the world as a whole; it is not an Indian measurement. The 2.76
    per cent is a measurement, but of boys aged 11 to 17 in one district, screened in school
