must_know:
- point: |
    Put the values a reader must compare on one shared axis, next to each other: bars from one
    shared start, or dots. Avoid making the reader compare pieces stacked inside bars, or slices of a
    pie. Those are lengths without a shared start, and angles.
  kind: move
  bearing: methodological
  refs: [cleveland_mcgill_1984_graphical_perception]
- point: |
    In Cleveland and McGill's experiments, large errors were 5.3 times as frequent per judgment on
    length as on position.
  kind: number
  bearing: methodological
  refs: [cleveland_mcgill_1984_graphical_perception]
- point: |
    "The ranking of marks was proved by experiment" is the error. The full order of ten
    judgments is Cleveland and McGill's hypothesis.
  kind: misconception
  bearing: methodological
  refs: [cleveland_mcgill_1984_graphical_perception, heer_bostock_2010_crowdsourcing_perception]
- point: |
    Before you draw a pie, check that its numbers are parts of one whole: shares of the same group
    of people, adding to 100 per cent. Prevalences in different groups are not. Neither are
    conditions a person can have together, such as stunting and underweight in the same child.
  kind: trap
  bearing: methodological
- point: |
    When a trainee shows you a pie chart or a stacked bar chart, ask for the same numbers as dots
    or grouped bars on one axis.
  kind: consequence
  bearing: teaching
  refs: [cleveland_mcgill_1984_graphical_perception]
- point: |
    Name the shape of your numbers before you choose the chart.
  kind: move
  bearing: methodological
  refs: [wilke_2019_dataviz_ch05]
- point: |
    When the value axis cannot start at zero, as on a logarithmic axis, draw dots, not bars.
  kind: move
  bearing: methodological
  refs: [wilke_2019_dataviz_ch17]
- point: |
    Use the order as a guide, as its authors did, not as a rule that settles every choice.
  kind: boundary
  bearing: methodological
  refs: [cleveland_mcgill_1984_graphical_perception]
common_misreading: |
  "Position beats length, so bar charts are second-rate." A bar chart whose bars stand on one
  shared start is read by where each bar ends, against the shared axis: that is position. Cleveland
  and McGill replace the pie with a bar chart for exactly this reason, "thus replacing angle
  judgments by position judgments". What does badly is a length with no shared start, such as the
  upper pieces of a stacked bar.
exercises:
- type: retrieval
  prompt: |
    From memory: list the first four places in Cleveland and McGill's order of judgments, from
    most accurate down. Which comparisons did their two experiments actually test, and which
    judgment won?
  answer: |
    Position along a common scale; positions along scales that are not lined up; length,
    direction and angle, tied; area.

    The experiments tested position against length, and position against angle. Position won
    both. The rest of the order is the authors' hypothesis.
  confidence_first: true
- type: critique
  prompt: |
    A district nutrition report shows one pie chart of children under 5, titled "Child
    undernutrition and overweight, India, NFHS-5". Its four slices are stunted 35.5%, wasted 19.3%,
    underweight 32.1% and overweight 3.4%. The numbers are the NFHS-5 India Fact Sheet's totals
    for indicators 81, 82, 84 and 85. Say what is wrong and what you would draw instead.
  answer: |
    Add the slices first.

    ```working
    35.5 plus 19.3 plus 32.1 plus 3.4 = 90.3
    ```

    The total is 90.3, not 100. That alone shows the slices are not parts of one whole, and the
    pie has stretched 90.3 to fill a circle.

    The deeper problem would remain even if they added to 100. Each number is the share of all
    children under 5 with one condition, and one child can have more than one. A child who is
    can be stunted and underweight at once. So the four groups overlap, and a pie, which shows parts
    that do not overlap, cannot hold them.

    Draw the four values as dots or bars on one axis from 0 to 100 per cent, one row each. The
    reader then compares positions on a shared scale. The caption states the finding the report
    needs, for example that stunting and underweight each affect about a third of children.
- type: design
  prompt: |
    Take the results you listed for figures in your own section. For each, name the shape of the
    numbers from the table in this section, then choose the mark. Say which judgment the reader
    will make to compare the values you most want compared.
  answer: |
    Check each choice in three steps.

    - The shape is named: amounts for groups, many values per group, parts of one whole, one
      quantity against another, or change over time.
    - The mark fits the shape. Amounts take bars from zero or dots. Many values per group take a
      chart of the distribution. Parts of a whole take side-by-side bars. Two measured quantities
      take a scatterplot. Time takes a line.
    - The comparison that carries your claim is made by position on one shared axis. Suppose the
      reader must compare two pieces stacked in a bar, or two slices. Then redraw it so the two
      values sit side by side on one axis.
  skill_ref: S58-R1-K02
- type: teaching
  prompt: |
    A district health officer wants a pie chart for the monthly review meeting. It is to show the
    share of adults with overweight or obesity in each of the district's six blocks. One page for her,
    answer first.
  answer: |
    Answer first: a pie is the wrong chart for these numbers. I will send a chart of six dots on
    one scale, sorted from highest to lowest block.

    Why. Each block's figure is a share of that block's own adults. The six shares are not parts
    of one whole, so slices of a circle misstate them. Even when a pie is the right kind of chart,
    people compare its slices less accurately than points on one scale. In one experiment, large
    errors were about seven times as frequent per judgment on a pie as on bars.

    What the chart will show. Each block as one dot, on one axis marked in per cent, labelled with
    the block's name and its value. The meeting can then see at once which blocks sit highest.

    What it will not show. Why the blocks differ, or whether a small difference between two blocks
    is real. For that we need each block's sample size beside its share.
