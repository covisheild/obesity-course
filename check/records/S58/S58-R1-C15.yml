simplified_explanation: |
  Your eye reads some marks better than others. So put the numbers a reader must compare on one
  shared axis, side by side.

  Many values from one group take a chart of how they spread, which the next section is about.
illustrations:
- body: |
    Start with a chart that fails. A draft district report puts the four NFHS-5 numbers from the last
    section into a pie: urban women, rural women, urban men, rural men. The draft is made up; the
    numbers are the fact sheet's.

    Before you look at the angles, add up the slices.

    ```working
    {{n:nfhs5_women_ow_ob_urban_pct}} plus {{n:nfhs5_women_ow_ob_rural_pct}} plus {{n:nfhs5_men_ow_ob_urban_pct}} plus {{n:nfhs5_men_ow_ob_rural_pct}} = 102.0
    ```

    A pie says its slices are parts of one whole. These four are not. Each is a share of a
    different group of people: urban women, rural women, and so on. Their sum, 102.0, means
    nothing. The program drew the pie anyway: it made 102.0 into a full circle, and each slice
    became a share of that meaningless total.

    Now suppose the numbers were parts of one whole. The pie would still ask the reader to compare
    angles and areas. Wilke gives the reason this goes badly: "human perception primarily judges
    distances and not areas".

    The fix is the figure of the last section (`S58-R1-C14`). There the four values stand as bars
    from one shared start, read against one axis. The reader compares where each bar ends. That is
    position along a common scale, the judgment people make best.
  analogy_breaks_when: |
    A pie is not always wrong. When a few parts make one whole, such as how a clinic's patients
    split across four BMI categories, a pie shows that the parts add up to the whole. Wilke says
    that is what pies do well, and that side-by-side bars still compare the parts better.

    The sum of 102.0 is a quick test, not a proof. Four shares of different groups could add to
    100 by chance and still not be parts of one whole. Ask what group each number is a share of.
