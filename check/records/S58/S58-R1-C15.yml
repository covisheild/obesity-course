- body: |
    How much worse are the other judgments? Open Cleveland and McGill, "Graphical perception:
    theory, experimentation, and application to the development of graphical methods", *Journal
    of the American Statistical Association* 1984, at
    https://doi.org/10.1080/01621459.1984.10478080.

    In their first experiment, people looked at bar charts with two marks on them. They wrote down
    what per cent the smaller marked value was of the larger. In some charts the two values could
    be read against one axis: position. In others they could only be compared as lengths, such as
    two pieces stacked inside a bar. Search for the summary of the experiments.

    > In the first experiment, po- sition judgments were more accurate than length judg- ments by
    > factors varying from 1.4 to 2.5. In the second experiment, position judgments were 1.96
    > times as ac- curate as angle judgments.

    The broken words are the scanned page's line breaks. The second experiment drew the same
    numbers as a bar chart and as a pie.

    Now look at the worst mistakes, the ones the authors call large errors. Search for
    Seventy-eight.

    > Seventy-eight percent of the large errors occurred for the length judgments; since there
    > were three position judgments for each two length judgments, the rate of occurrence of large
    > errors for length judgments is 5.3 times that for position judgments.

    Rebuild the 5.3 yourself. It is a ratio of two rates (`B0-R0-C05`). Length judgments made 2
    of every 5 judgments, which is 40 per cent, and position judgments 3 of every 5, which is 60
    per cent. Share out the large errors, then divide each share by how many judgments of that
    kind there were. The sign ≈ means "is approximately equal to".

    ```working
    100 minus 78 = 22
    78 divided by 2 = 39
    22 divided by 3 ≈ 7.33
    39 divided by 7.33 ≈ 5.32
    ```

    The second experiment drew each set of numbers once as bars and once as a pie. So position and
    angle judgments were equal in number, and the shares can be compared directly.

    ```working
    100 minus 88 = 12
    88 divided by 12 ≈ 7.33
    ```

    The paper prints 7.3. Per judgment, a large error was about seven times as likely on the pie
    as on the bars beside it. In only 3 of 40 comparisons was the pie more
    accurate on average than the bar chart.

    Heer and Bostock (2010) ran the first experiment again, online, with 50 people per chart.
    Position again beat length. They also tested angle and area with the same question. Area did
    worse than angle, and both did worse than position.
  analogy_breaks_when: |
    Both experiments asked one question: what per cent is this value of that one? A paper's reader
    may instead need to see which group is largest, or that the parts make a whole. The
    experiments do not measure those.

    The 5.3 and the 7.3 come from two different experiments with different charts. Do not set them
    side by side to rank angle below length. Heer and Bostock, testing both the same way, found
    angle no worse than length.

    Cleveland and McGill say so themselves: the order "does not provide a complete prescription
    for how to make a graph".
  numbers:
