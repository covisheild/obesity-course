- body: |
    The order of judgments tells you how to draw. The shape of the data tells you what to draw.
    Before you choose a chart, say which of five kinds of numbers you have. The table puts
    chapter 5 of Wilke's *Fundamentals of Data Visualization* (https://clauswilke.com/dataviz/)
    in this book's words, with examples from your own work.

    ```table
    | what the numbers are | an example from your work | marks that suit it |
    | amounts, one for each group | per cent with overweight or obesity, urban and rural | bars from zero, or dots on one axis |
    | many values in each group | the BMI of every adult in a district survey | a chart of the distribution, such as a strip chart or box plot |
    | parts of one whole | how a clinic's patients split across BMI categories | side-by-side bars; a pie only for a few parts |
    | one measured quantity against another | waist circumference against BMI, one point per adult | a scatterplot |
    | change over time | one indicator across survey rounds | a line through the values |
    ```

    Try it on the running case. In the two fact-sheet rows of the last section, the last number is
    NFHS-4 (2015-16) and the third is NFHS-5 (2019-21). So you have the share of women and of men
    aged 15-49 with overweight or obesity, in two survey rounds. That is change over time, for
    two groups.

    So draw a line for women and a line for men, each joining its two survey rounds, on one shared
    axis. Each point is read by its position. The women's line runs from
    {{n:nfhs4_women_ow_ob_pct}} to {{n:nfhs5_women_ow_ob_pct}} per cent and the men's from
    {{n:nfhs4_men_ow_ob_pct}} to {{n:nfhs5_men_ow_ob_pct}}. The lines climb by
    {{n:nfhs5_women_ow_ob_change_pp}} and {{n:nfhs5_men_ow_ob_change_pp}} percentage points.

    The value axis of this chart need not start at zero. It could start at 15 per cent, a little
    below the lowest point. For points and lines that is allowed, because each value is carried by where
    the point sits, not by a length from zero (`B0-R0-C40`). Wilke makes the same move for amounts that need a logarithmic axis
    (`B0-R0-C07`), on which zero lies infinitely far away. He drops the bars and places "a dot at
    the appropriate location along the scale".
  analogy_breaks_when: |
    Two survey rounds give two points, and a straight line between them says nothing about the
    years in between. The line shows the change from one round to the next, not a steady rise.

    Each NFHS round measures different people. The line joins two population shares, not the same
    people measured twice.
  numbers:
  - value: '20.6'
    unit: per cent of women aged 15-49 overweight or obese, NFHS-4 total
    citekey: nfhs5_india_factsheet
    quote: 88. Women who are overweight or obese (BMI ≥25.0 kg/m2)21 (%) 33.2  19.7  24.0  20.6
