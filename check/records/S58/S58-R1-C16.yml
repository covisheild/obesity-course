must_know:
- point: |
    "The bar chart summarises the group" is the error. Very different sets of values give the same
    mean and the same error bar: an even spread, one far value, two clusters.
  kind: misconception
  bearing: methodological
  refs: [weissgerber_2015_beyond_bar_graphs]
- point: |
    When each group has only a handful of values, draw every value as a dot, with a short line at
    the median or mean. Say in the caption which the line is, and how many values each group has.
  kind: move
  bearing: methodological
  refs: [weissgerber_2015_beyond_bar_graphs, wilke_2019_dataviz_ch09]
- point: |
    A box plot is a summary too. It can draw two clusters as one wide box with a median where
    nobody is.
  kind: trap
  bearing: methodological
  refs: [wilke_2019_dataviz_ch09]
- point: |
    When the same people are measured twice, never draw the two occasions as two bars. Join each
    person's two values with a line, so the reader sees who went up, who went down and who stayed
    the same.
  kind: move
  bearing: methodological
  refs: [weissgerber_2015_beyond_bar_graphs]
- point: |
    A systematic review covered 703 papers in leading physiology journals from early 2014. Of these, 85.6% had
    at least one bar chart, and only 13.4% had a chart showing every value.
  kind: number
  bearing: methodological
  refs: [weissgerber_2015_beyond_bar_graphs]
- point: |
    When you review a colleague's draft with bars of means for small groups, ask for the values as
    dots.
  kind: consequence
  bearing: teaching
- point: |
    Leaf through a recent issue of the journal you will submit to and count for yourself before you
    assume its habits.
  kind: india_deviation
  bearing: methodological
  refs: [weissgerber_2015_beyond_bar_graphs]
- point: |
    Showing every value shows the shape and the count. It does not tell you whether a gap between
    groups is real or large enough to matter. And it is for measured quantities. A share of people
    with a condition is one number per group, and a bar or dot is right for it.
  kind: boundary
  bearing: methodological
common_misreading: |
  "Show the data" is easily read as "never show a mean". A strip chart with a short line at each
  group's mean shows the summary and what it summarises, side by side. What the rule forbids is
  the mean on its own, standing in for values the reader never sees.
reporting_sentence: |
  Each dot is one participant's value; the short horizontal line marks the median of each group.
  We show every value because no group had more than ten participants.
exercises:
- type: retrieval
  prompt: |
    From memory: name three different ways a group of values can produce the same bar of the mean
    and the same error bar. Which chart do Weissgerber and colleagues recommend for small groups,
    and why not a box plot?
  answer: |
    Values spread evenly; values bunched together with one far from the rest; values in two
    separate clusters. A group of very few values is a fourth.

    For small groups, a univariate scatterplot, which this book calls a strip chart: every value
    as a dot. A box plot or a histogram is hard to read with so few values, and a box plot can draw
    two clusters as one wide box.
  confidence_first: true
- type: interpretation
  prompt: |
    A made-up student survey compares hours of sleep a night in two hostels, six students each. The
    draft shows two bars of equal height and says, "Sleep did not differ between hostels."

    ```table
    | hostel | each student's hours of sleep a night |
    | hostel A | 6.5, 7.0, 7.0, 7.5, 7.5, 8.0 |
    | hostel B | 5.0, 5.5, 5.5, 6.0, 6.0, 15.5 |
    ```

    Work out each hostel's mean and median. Sketch the values as a strip chart. Say what the bars
    hid and what you would do before writing the sentence again.
  answer: |
    The means.

    ```working
    6.5 plus 7.0 plus 7.0 plus 7.5 plus 7.5 plus 8.0 = 43.5
    43.5 divided by 6 = 7.25
    5.0 plus 5.5 plus 5.5 plus 6.0 plus 6.0 plus 15.5 = 43.5
    43.5 divided by 6 = 7.25
    ```

    The medians: with six values, the mean of the third and fourth.

    ```working
    (7.0 plus 7.5) divided by 2 = 7.25
    (5.5 plus 6.0) divided by 2 = 5.75
    ```

    The strip chart shows hostel A from 6.5 to 8.0 hours. In hostel B, five students sleep 5.0 to
    6.0 hours and one value sits at 15.5. That single value lifts hostel B's mean to equal A's.

    First, check 15.5 against the student's form. A value of 5.5 typed as 15.5 is one possibility;
    a student who really reported 15.5 is another. Do not delete it because it is inconvenient.

    Then write what the values show. Five of six students in hostel B slept less than everyone in
    hostel A, and the medians are 5.75 and 7.25 hours. Six students per hostel cannot tell you whether
    this holds for the hostels as a whole.
- type: design
  prompt: |
    Find one figure in your own section, or in a recent paper in your field, that shows a measured
    quantity as bars of means. Redraw it by hand as a strip chart, or say exactly what you would
    need from the authors to do so. Write the caption's sentence that says what the dots and the
    line mean.
  answer: |
    A good redraw keeps the groups on one shared axis, puts every value as a dot, and marks the
    median or mean with a short line. The caption says which the line is and how many values each
    group has.

    If you could not redraw it, you needed the individual values, which a bar chart never shows.
    That is the point: the bar chart gave you no way to check the claim it was drawn to support.
    Asking authors for their data, or for the values in a supplement, is a reasonable request for
    a reviewer to make.

    If the same people were measured twice, your redraw joins each person's two values with a line.
  skill_ref: S58-R1-K02
- type: teaching
  prompt: |
    A first-year resident has drawn her thesis results as bars of means, eight patients per group,
    and asks why her guide wants "the dots". Ten minutes, with a whiteboard.
  answer: |
    Draw three bars of the same height on the board, and write 30 above each. Ask her what she
    can say about the three groups. She will say they are the same.

    Now draw three columns of dots behind the bars: one spread evenly, one bunched with a single
    dot far above, one in two clusters. Every column has the same mean. Ask again.

    Make three points. First, with eight values a group, the reader can see every value; a bar
    throws seven of them away. Second, one far value can make a group's mean match another's, and
    only the dots show it. Third, her examiner will want to check her claim, and the dots are what
    lets them.

    End with what to draw: one dot per patient, a short line at each group's median, and a caption
    that says so.
