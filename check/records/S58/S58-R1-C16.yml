definition:
  text: |
    A bar chart of a measured quantity draws each group as one bar, the height of its mean.

    Many different sets of values give the same bar and the same error bar. The values may be spread evenly, or
    bunched with one far from the rest, or split into two clusters. There may be only three of them.

    Showing the data means drawing every value. A strip chart puts each value as a dot along the value axis, one
    column of dots per group; Weissgerber and colleagues call it a univariate scatterplot.
  references:
  - citekey: weissgerber_2015_beyond_bar_graphs
    kind: primary
    locator: Introduction, second paragraph
    quote: |-
      Bar graphs are designed for categorical variables; yet they are commonly used to present continuous data in laboratory research, animal studies, and human studies with small sample sizes.
    verified:
      resolved_id: https://doi.org/10.1371/journal.pbio.1002128
      opened: true
      claim_located: true
      checked_on: '2026-10-02'
      note: |-
        CC BY 4.0. The same paragraph: bar and line graphs of continuous data "typically show the
        mean and standard error (SE) or standard deviation (SD)".
  - citekey: weissgerber_2015_beyond_bar_graphs
    kind: primary
