simplified_explanation: |
  A bar chart of a measured quantity shows one number per group: the average. It hides everything
  else.

  So when your groups are small, draw every value as a dot. The reader sees how many people there
  were, how they spread, and whether one person is pulling the average.
illustrations:
- body: |
    Start with a figure that fails. A draft survey report shows three bars of equal height: the
    mean minutes of moderate activity a day reported by adults in three wards of a town. Under it
    the draft says, "Activity was similar across the three wards." The survey is made up, and so
    are its 24 values, eight adults per ward.

    ```table
    | ward | each adult's minutes of moderate activity a day |
    | ward 1 | 10, 15, 21, 27, 33, 39, 45, 50 |
    | ward 2 | 22, 23, 24, 25, 26, 27, 28, 65 |
    | ward 3 | 15, 16, 17, 19, 41, 43, 44, 45 |
    ```

    Check the means first. Do ward 2.

    ```working
    22 plus 23 plus 24 plus 25 plus 26 plus 27 plus 28 plus 65 = 240
    240 divided by 8 = 30
    ```

    Wards 1 and 3 also add to 240, so every mean is 30 minutes. Now the standard deviation, as
    Book 0 built it (`B0-R0-C28`), again for ward 2. Subtract the mean from each value, square,
    add, divide by one less than the count.

    ```working
    8 squared plus 7 squared plus 6 squared plus 5 squared plus 4 squared plus 3 squared plus 2 squared plus 35 squared = 1428
    1428 divided by 7 = 204
    ```

    The square root of 204 is 14.28. Wards 1 and 3 come to 14.29 and 14.25. To one decimal, all
    three are 14.3 minutes. So the three bars match, and so would their error bars.

    ```table
    | ward | adults | mean (minutes) | standard deviation (minutes) | median (minutes) |
    | ward 1 | 8 | 30 | 14.3 | 30 |
    | ward 2 | 8 | 30 | 14.3 | 25.5 |
    | ward 3 | 8 | 30 | 14.3 | 30 |
    ```

    Now draw every value as a dot and look again. In the second figure, each ward's adults are
    numbered 1 to 8, from the lowest value to the highest. They are set out from left to right, so
    that no dot hides another. Ward 1 is spread fairly
    evenly from 10 to 50. In ward 2, seven adults report 22 to 28 minutes, and one reports 65.
    That one value lifts the mean to 30, though seven of the eight report less; the median is
    25.5. In ward 3 the adults fall into two clusters, 15 to 19 and 41 to 45. Nobody in ward 3 is
    within 11 minutes of the mean.

    "Activity was similar across the three wards" is true of the means and false of the people.
    Weissgerber and colleagues make the same point with four example datasets behind one bar
    chart: "many different data distributions can lead to the same bar or line graph".
  analogy_breaks_when: |
    These values were made up to share a mean and a standard deviation exactly. Real groups will
    not match so neatly. The lesson is that matching bars do not show matching groups, not that
    real wards look like these.

    The single 65 in ward 2 is not wrong only because it is far from the rest. Check it against
    the form before you decide anything. If it was recorded correctly, it stays in the figure.
  numbers: []
- body: |
    Now choose how to show the values. The choice turns on how many values each group has.

    With a handful per group, draw a strip chart: every value as a dot, one column per group. The
    figure for the three wards does the same job with each ward's dots spread out in order. Add a short line at each group's median or mean, and say
    which in the caption. Weissgerber and colleagues found that in 75% of the papers they
    reviewed, the smallest group in a figure had between two and six values. For groups that small, they
    call this chart "the best choice", because box plots and histograms "would be difficult to
    interpret".

    Watch what a box plot does to ward 3. Work its quartiles the way Book 0 did: the median of the
    lower four values and the median of the upper four.

    ```working
    (16 plus 17) divided by 2 = 16.5
    (43 plus 44) divided by 2 = 43.5
    ```

    The box runs from 16.5 to 43.5 minutes, with its median line at 30. A reader sees a wide, even
    spread with a middle at 30. No adult in ward 3 reports anything between 19 and 41. Wilke says
    it plainly: violin plots, a smoothed outline of where the values fall, "will accurately
    represent bimodal data whereas a boxplot will not". Bimodal means two clusters.

    With dozens or hundreds of values per group, as in a district survey, dots in one column sit on
    top of each other. Spread them a little sideways at random, which is jittering. Or draw a box
    plot, a violin or a histogram. Before you trust a histogram, redraw it with two or three
    different bin widths, the width of each bar. A pattern that comes and goes with the bin width
    is not a pattern in the data.

    Last, look at how the data were collected. If the same adults were measured twice, before and
    after something, the two sets of values are pairs. Two bars, one for before and one for after,
    hide whether each person went up or down. Draw each person's two values joined by a line.
  analogy_breaks_when: |
    The cut between "a handful" and "many" is not a fixed number. Draw the dots. If they still show
    the shape and the count, keep them. If they pile into a smear, change the chart.

    All of this is for measured quantities. A share of people with or without something, such as
    the NFHS rows of the last two sections, is one number per group. A bar or a dot is the right
    mark for it.
  numbers: []
