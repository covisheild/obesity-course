      gathered information from 636,699 households, 724,115 women, and 101,839 men
  - value: "60"
    unit: Flesch Reading Ease, Flesch's minimum for Plain English
    citekey: flesch_1979_plain_english
    as_of: '2026-10-02'
    quote: |-
      The minimum score for Plain English is 60
- body: |
    **The table.** The paper's readers include programme officers who will set their own state's
    figures beside the national ones. They need exact values, including urban and rural. Build the
    table as `S58-R1-C21` did: title above, short headings with the unit, a footnote for the
    exclusion and for the missing counts, a source line with its reference number.

    > Table 1. Women and men aged 15–49 years with overweight or obesity (body mass index {{n:nfhs5_ow_ob_bmi_cutoff}}
    > kg/m^2 or more), India, National Family Health Survey 2019–21 (NFHS-5), by residence, with
    > the 2015–16 (NFHS-4) total

    ```table
    | group | NFHS-5 urban (%) | NFHS-5 rural (%) | NFHS-5 total (%) | NFHS-4 total (%) |
    | women (a) | {{n:nfhs5_women_ow_ob_urban_pct}} | {{n:nfhs5_women_ow_ob_rural_pct}} | {{n:nfhs5_women_ow_ob_pct}} | {{n:nfhs4_women_ow_ob_pct}} |
    | men | {{n:nfhs5_men_ow_ob_urban_pct}} | {{n:nfhs5_men_ow_ob_rural_pct}} | {{n:nfhs5_men_ow_ob_pct}} | {{n:nfhs4_men_ow_ob_pct}} |
    ```

    > (a) Excludes pregnant women and women who gave birth in the preceding 2 months. Counts of
    > women and men weighed and measured are not given in the source. Source: NFHS-5 India Fact
    > Sheet, indicators 88 and 89 (1).

    Check the digits again, because the table holds eight numbers, not four. They run from
    {{n:nfhs4_men_ow_ob_pct}} to {{n:nfhs5_women_ow_ob_urban_pct}}.

    ```working
    {{n:nfhs5_women_ow_ob_urban_pct}} minus {{n:nfhs4_men_ow_ob_pct}} = 14.3
    ```

    A range of 14.3 is 10 or more, so Cole's range rule alone would print whole numbers. Then the
    women's totals read 21 and 24, and the paragraph's rise of {{n:nfhs5_women_ow_ob_change_pp}}
    points could not be read off the table. Cole says his rules are "recommendations not
    requirements". Keep one
    decimal place in the table and the text alike, so the two never disagree.

    **The figure.** Now make a figure of the claim, by the steps of `S58-R1-C22`. The claim is a
    rise in each sex. The shape of the data is amounts for two groups at two times, so the mark is
    bars, each sex's two rounds side by side.

    The axis comes next. Suppose your program starts the value axis at 18, just below the smallest
    value. Work out the Lie Factor (LF) of `S58-R1-C17` for each pair, with the smaller bar,
    a ÷ (a − s).

    ```working
    {{n:nfhs4_women_ow_ob_pct}} minus 18 = 2.6
    {{n:nfhs4_women_ow_ob_pct}} divided by 2.6 = 7.923076923
    {{n:nfhs4_men_ow_ob_pct}} minus 18 = 0.9
    {{n:nfhs4_men_ow_ob_pct}} divided by 0.9 = 21
    ```

    The program's chart drew the women's rise about {{n:nfhs_women_lf_axis18}} times its true size and the men's {{n:nfhs_men_lf_axis18}}
    times. Tufte counts anything above {{n:tufte_lf_threshold}} as substantial distortion, as `S58-R1-C17` showed.
    Start the bars at zero, and
    the Lie Factor is 1 for both.

    Then the words: the value axis titled "overweight or obese (%)", the groups named under the
    bars, the rounds named with their years. Colour separates the two rounds, but should not carry
    the difference alone: keep NFHS-4 on the left in each pair, and print each bar's value on it.
    Drawn this way, from zero, it is the figure of these four values that `S58-R1-C17` drew as
    bars from zero, so it is not drawn again here. Its caption, finding first:

    > Between NFHS-4 (2015-16) and NFHS-5 (2019-21), the share of adults aged 15-49 in India with
    > overweight or obesity rose in women and in men, by {{n:nfhs5_women_ow_ob_change_pp}} and
    > {{n:nfhs5_men_ow_ob_change_pp}} percentage points. Bars from zero show the per cent with a
    > body mass index of {{n:nfhs5_ow_ob_bmi_cutoff}} kg/m^2 or more. Counts are not given in the
    > source. Source: NFHS-5 India Fact Sheet, indicators 88 and 89.

    Shrink it to one column's width and read it; view it in grey.

    **One home.** You now hold a table and a figure of the same numbers, and the ICMJE
    Recommendations say "do not duplicate data in graphs and tables". Choose by what the reader
    has to do (`S58-R1-C14`). The claim rests on four totals, which the paragraph can carry. The
    officers need eight exact values, which only the table gives. The figure adds nothing a paper
    reader needs, so the paper keeps the table. The figure is not wasted: it goes to your talk,
    made again for a slide, with bigger text and fewer words.

    The table now holds the levels, so the paragraph need not read them out. ICMJE asks the text
    to "emphasize or summarize only the most important observations". Keep the claim and the two
    rises, and cite the table.
  analogy_breaks_when: |
    The choice of table over figure follows from these readers and these eight numbers. With every
    state as a row and a pattern to show, such as urban above rural almost everywhere, the figure
    would win and the table would go to a supplement.

    The Lie Factor checks only bars drawn from an axis start. It says nothing about whether a rise
    of {{n:nfhs5_women_ow_ob_change_pp}} points matters for health.
- body: |
    **The reference.** The table's source line and the paragraph cite the fact sheet as reference
    (1), the first source the text mentions (`S58-R1-C05`). Now write entry 1 in NLM format.

    `S58-R1-C05` taught the NLM pattern for a journal article. The fact sheet is not one, and
    Citing Medicine's chapter on journals says "Journal references omit information on place of
    publication and publisher, whereas book references carry these details." A short report read
    as a PDF on the Internet is cited under chapter 22, "Books and Other Individual Titles on the
    Internet", at https://www.ncbi.nlm.nih.gov/books/NBK7269/. The chapter says such a title "may
    also be smaller works such as a brochure, single-page fact sheet, or brief treatise".

    NLM prints the chapter's general format as a picture, and this book does not hold it. Its
    examples are text. Example 7, a title on the Internet with an organisation as author, is the
    nearest to the fact sheet:

    > Kaiser Commission on Medicaid and the Uninsured. The uninsured and their access to health
    > care [Internet]. Washington: Henry J. Kaiser Family Foundation; 2006 Oct [cited 2006 Nov 3].
    > 2 p. Available from:
    > http://www.kff.org/uninsured/upload/The-Uninsured-and-Their-Access-to-Health-Care-Oct-2004.pdf

    Read its parts in order: the organisation as author; the title, with a capital only on its
    first word and on proper nouns, then "[Internet]"; the place and the publisher; the date of
    publication; the date the citer saw it, "[cited ...]"; the number of pages; "Available from:"
    and the full address.

    Now collect every element the fact sheet itself prints, as the cover gives it:

    ```table
    | element | as the fact sheet prints it |
    | issued by | Ministry of Health and Family Welfare |
    | prepared by | International Institute for Population Sciences (Deemed University) |
    | title | National Family Health Survey - 5, 2019-21, India Fact Sheet |
    | where you read it | https://dhsprogram.com/pubs/pdf/OF43/India_National_Fact_Sheet.pdf |
    | when you read it | the date you opened it, from your own notes |
    ```

    Set them in example 7's order. The organisation that prepared it is the author. The chapter
    defines the publisher: "A publisher is defined as the individual or organization issuing the
    book". Two elements are not on the cover, the place and the year of publication, so they stay
    as marked gaps until you find them in the full document. Here is entry 1, modelled on example
    7; the date cited is the day this book read the fact sheet, so give your own.

    > 1. International Institute for Population Sciences. National Family Health Survey - 5,
    > 2019-21: India fact sheet [Internet]. *place*: Ministry of Health and Family Welfare; *year*
    > [cited 2026 Sep 24]. Available from:
    > https://dhsprogram.com/pubs/pdf/OF43/India_National_Fact_Sheet.pdf

    Replace *place* and *year* from the document, and count its pages for the extent if you want it.
    Until then the entry is unfinished, and should look it.
  analogy_breaks_when: |
    The entry is modelled on an example, not built from NLM's general format, which this book has
    not seen. The "(US)" that NLM's other examples put after a government body's name, and how an
    entry is shortened when one body both prepares and issues a report, follow specific rules this
    book does not hold. Check them
    in chapter 22, and follow your journal's instructions where they differ.
- body: |
    **The reader.** Write your one message on a separate page and put it away, as `S58-R1-C13`
    sets out. Give a colleague from another department the cut paragraph, with its last change
    made, and Table 1. She reads once. She marks one stop, at "NFHS-4": your draft began at the
    results, so give the next reader the methods sentence that names the survey. Then she writes
    what the paper says. Her sentence is invented here, but it is the kind readers write.

    > Obesity went up in Indian adults between the two surveys, a little more in men.

    Compare it with your message part by part.

    ```table
    | part | your message | her sentence | verdict |
    | whom | adults aged 15-49 in India | Indian adults | widened: the age range is lost |
    | what was found | the share with overweight or obesity rose | obesity went up | changed: overweight dropped |
    | compared with what | NFHS-4 against NFHS-5 | the two surveys | kept |
    | how far it reaches | a rise, in women and in men | a rise, larger in men | added: a comparison the paper does not make |
    ```

    Every fault is an addition, and readers repeat additions. Find the words that invited each.
    The draft's "overweight or obese" never said where overweight begins, so she heard "obese". The age range
    sat in the middle of a long noun phrase. And the two rises stood side by side, inviting a
    comparison. Two estimates from two samples, {{n:nfhs5_women_ow_ob_change_pp}} and
    {{n:nfhs5_men_ow_ob_change_pp}} points, do not show that men rose faster.

    Revise the paragraph:

    > Among adults aged 15-49 in India, the share with overweight or obesity rose between NFHS-4
    > (2015-16) and NFHS-5 (2019-21) (Table 1). It rose by {{n:nfhs5_women_ow_ob_change_pp}}
    > percentage points in women and by {{n:nfhs5_men_ow_ob_change_pp}} percentage points in men.
    > By 2019-21, about one woman in four and more than one man in five had a body mass index of
    > {{n:nfhs5_ow_ob_bmi_cutoff}} kg/m^2 or more.

    Give it, with the methods sentence, to a new reader, who writes:

    > Among people aged 15 to 49 in India, the share with a BMI of 25 or more went up between the
    > two surveys, in women and in men.

    Every part is there, and nothing is added. The paragraph passes.

    **What the finding does not mean.** Write these into the discussion, in plain words.

    - It is about adults aged 15 to 49. It says nothing of older adults, who are not in these rows.
    - It counts overweight and obese together, at a BMI of {{n:nfhs5_ow_ob_bmi_cutoff}} kg/m^2 or more. The fact sheet has
      no row for obesity alone.
    - It leaves out pregnant women and women with a birth in the preceding 2 months.
    - It shows that the share rose between two surveys of different people. It does not show why,
      and two surveys are not a trend.
    - It does not show that the rise was larger in men than in women.
    - It describes 2019-21, with fieldwork ending on 30 April 2021. It is not a figure for now.
    - It is a national figure. It is not a figure for any state or district.
  analogy_breaks_when: |
    Two readers are the smallest test that can work. A pass shows that one new reader could
    restate this paragraph minutes after reading it. It does not show that the claim is true, or
    that the survey's methods were sound.
  numbers:
  - value: "2021"
    unit: year NFHS-5 fieldwork ended (30 April 2021)
    citekey: nfhs5_india_factsheet
    as_of: '2026-10-02'
    quote: |-
      phase two from 2 January 2020 to 30 April 2021
