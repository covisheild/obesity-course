must_know:
- point: |
    Work in this order: the message, then the paragraph, then the table or figure, then the
    reference, then the reader.
  kind: move
  bearing: methodological
  refs: [mensh_kording_2017_structuring_papers, rougier_2014_ten_rules_figures]
- point: |
    Give every number one home. Decide by what the reader has to do with the numbers, then cut
    the other homes.
  kind: move
  bearing: methodological
  refs: [icmje_2026_manuscript_preparation]
- point: |
    A passing score never tells you a paragraph works. Read it for its claim before you look
    at the number.
  kind: trap
  bearing: methodological
  refs: [flesch_1979_plain_english]
- point: |
    Check the axis of every bar chart a program draws for you. Work out a ÷ (a − s) with the smaller bar; if it is
    above {{n:tufte_lf_threshold}}, start the bars at zero.
  kind: trap
  bearing: methodological
- point: |
    Use one number of decimal places for the same figures in the text and the table. Two copies
    of one number with different digits look like two different numbers.
  kind: move
  bearing: methodological
  refs: [cole_2015_too_many_digits]
- point: |
    When the source gives no counts, say so in a footnote. Never make one by multiplying a
    percentage by the survey's total sample. NFHS-5's {{n:nfhs5_women_interviewed}} women are those it gathered
    information from, not the women weighed for this row.
  kind: trap
  bearing: methodological
  refs: [nfhs5_india_factsheet]
- point: |
    Format each kind of source from its own chapter of Citing Medicine. Where you have only an
    example to work from, say the entry is modelled on it. Leave a marked gap for any element you
    have not found.
  kind: boundary
  bearing: methodological
  refs: [nlm_citing_medicine_2007_reports_web]
- point: |
    A reader's restatement that adds something, such as "obesity" for "overweight or obesity", or a
    comparison you did not make, is what readers will repeat. Find the words in your paragraph that
    invited it and change them, then test again with a new reader.
  kind: consequence
  bearing: public
  refs: [mensh_kording_2017_structuring_papers]
- point: |
    This finding covers adults aged 15 to 49, counts overweight and obese together, and shows a
    rise between two surveys, not its cause. It describes 2019-21, not now.
  kind: boundary
  bearing: public
  refs: [nfhs5_india_factsheet]
common_misreading: |
  "A finished result has a paragraph, a table and a figure, because the journey made all three."
  The journey made a table and a figure so that you could choose between them, and the paper
  kept the table. The figure went to the talk. Making both and keeping both is the duplication
  the ICMJE Recommendations ask you to avoid.
reporting_sentence: |
  Among adults aged 15-49 in India, the share with overweight or obesity rose between NFHS-4
  (2015-16) and NFHS-5 (2019-21) (Table 1). It rose by {{n:nfhs5_women_ow_ob_change_pp}}
  percentage points in women and by {{n:nfhs5_men_ow_ob_change_pp}} percentage points in men. By
  2019-21, about one woman in four and more than one man in five had a body mass index of {{n:nfhs5_ow_ob_bmi_cutoff}}
  kg/m^2 or more.
exercises:
- type: retrieval
  prompt: |
    From memory, list the steps of a finding's journey in order, from the question to what the
    finding does not mean. For each, name one check you make before moving on.
  answer: |
    1. The question and the data: read the source's row, columns and footnotes, and write its
       limits down.
    2. The one message: would it be false had the data come out otherwise?
    3. The paragraph: does it open on the claim, with the steps moved to the methods?
    4. The numbers: units, counts or a note that there are none, points for differences, digits
       by Cole's rules.
    5. Score and cut: the score as a trip-wire only; cut the largest units first.
    6. One home: table or figure, by what the reader does. For a figure, the steps of making the
       plot, and the Lie Factor of any bars.
    7. The reference: numbered by first mention, in the format for that kind of source.
    8. The reader: one pass, compared part by part with your hidden message.
    9. What it does not mean: population, measure, time, place and cause.
  confidence_first: true
- type: critique
  prompt: |
    A newspaper headline reads: "Obesity in Indian women up 17%, says national survey". Decide
    what was computed to get 17, compute it, and say what the headline gets wrong.
  answer: |
    The 17 is a relative change: the rise in percentage points divided by the NFHS-4 figure.

    ```working
    {{n:nfhs5_women_ow_ob_pct}} minus {{n:nfhs4_women_ow_ob_pct}} = {{n:nfhs5_women_ow_ob_change_pp}}
    {{n:nfhs5_women_ow_ob_change_pp}} divided by {{n:nfhs4_women_ow_ob_pct}} = 0.165
    ```

    About {{n:nfhs_women_ow_ob_rel_rise_pct}} per cent of the starting figure, so the arithmetic is right. Three things are wrong.

    - "Obesity": the row counts overweight and obese together, at a BMI of {{n:nfhs5_ow_ob_bmi_cutoff}} kg/m^2 or more.
      There is no row for obesity alone.
    - "Indian women": the row covers women aged 15 to 49, excluding pregnant women and women with
      a birth in the preceding 2 months.
    - "Up 17%" with no base: a reader may take it as 17 points. Say the absolute change first,
      {{n:nfhs5_women_ow_ob_change_pp}} percentage points, from {{n:nfhs4_women_ow_ob_pct}} to
      {{n:nfhs5_women_ow_ob_pct}} per cent, and label any relative change.

    The headline also says nothing of when: the survey ended in 2021.
- type: teaching
  prompt: |
    A journalist rings: "What does the new national survey say about obesity in India?" You have
    three minutes. Give her one sentence she can quote, and say how sure you are.
  answer: |
    Correct the question gently first. The survey, NFHS-5, ran in 2019-21, and its fact sheet
    reports overweight and obesity together, for adults aged 15 to 49.

    Then give her the sentence to quote.

    > In the national survey of 2019-21, about one woman in four and more than one man in five
    > aged 15 to 49 had overweight or obesity.

    Add, if she asks about change:
    "That is more than in the survey of 2015-16."

    How sure: be exact about what you know. The figures are the survey's own, read from its fact
    sheet. The fact sheet gives no counts and no margins of error for these rows, so do not tell
    her how precise they are. What the survey cannot tell her is why the share rose, or anything
    about people over 49. If she wants a number for obesity alone, this fact sheet does not have
    one.
- type: design
  prompt: |
    Take one finding from the section you have been building for this book. Run it through the
    nine steps of the journey, on one sheet of paper.

    Write down the limits of the data and the one
    message. Show the paragraph before and after, with its numbers checked, its score and its cut.
    Say which home the numbers get, and why. Write the reference. Compare a reader's sentence with
    yours. End with what the finding does not mean.
  answer: |
    Judge your sheet by three tests.

    - Can you point, for each step, to a change it made? A step that changed nothing was either
      done earlier or skipped.
    - Does every number in the paragraph appear once only, in the paragraph, the table or the
      figure, with the same digits wherever it is repeated?
    - Does your "does not mean" list name the population, the measure, the time, the place and the
      cause? Most findings need all five.

    Your reference may rest on a kind of source this book did not cover. Then the sheet should say
    which chapter of Citing Medicine you opened for it.
  skill_ref: S58-R1-K01
retrieval_items:
- q: Why did the paper keep the table and not the figure of the NFHS rows?
  a: The claim rested on four totals the paragraph could carry; the readers needed eight exact values, urban and rural, which only the table gave; ICMJE asks not to show the same data in both.
- q: What did the diary-style draft score on the Flesch Reading Ease, and what does that show?
  a: 61.6, above Flesch's Plain English minimum of 60, though it was the worst draft. A passing score does not show a paragraph works.
- q: Which chapter of Citing Medicine does the fact sheet's reference follow, and what is still missing from entry 1?
  a: Chapter 22, titles on the Internet; entry 1 is modelled on its example 7 (author, title [Internet], place, publisher, date, date cited, address). The place and the year of publication are not on the cover, so they stay marked until found in the full document.
- q: Name four things the NFHS overweight finding does not mean.
  a: "Any four of these: adults over 49; obesity alone; pregnant women; the cause of the rise; a trend; that men rose faster; now; any one state or district."
