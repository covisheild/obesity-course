simplified_explanation: |
  Each earlier section taught one tool. Real work uses them one after another, on one result.
  The result is the share of Indian adults with overweight or obesity in two national surveys.
illustrations:
- body: |
    Suppose you are writing a short paper, a research letter, on one question: did the share of
    Indian adults with overweight or obesity change between the fourth and fifth rounds of the
    National Family Health Survey, in women and in men?

    **The data.** Open the *National Family Health Survey (NFHS-5), 2019-21: India Fact Sheet* at
    https://dhsprogram.com/pubs/pdf/OF43/India_National_Fact_Sheet.pdf. Find the heading
    "Nutritional Status of Adults (age 15-49 years)". Two rows under it carry your question.

    > 88. Women who are overweight or obese (BMI ≥25.0 kg/m2)21 (%) 33.2 19.7 24.0 20.6

    > 89. Men who are overweight or obese (BMI ≥25.0 kg/m2) (%) 29.8 19.3 22.9 18.9

    Read them as `S58-R1-C14` did. The four columns are NFHS-5 (2019-21) urban, rural and total,
    then NFHS-4 (2015-16) total, in per cent. The rows count a body mass index (BMI) of {{n:nfhs5_ow_ob_bmi_cutoff}}
    kg/m^2 or more, overweight and obese together. Footnote 21 on the women's row excludes
    pregnant women and women with a birth in the preceding 2 months. The fact sheet prints no
    counts of the people weighed and measured.

    Write those limits down now, before you write anything else. Every later step has to stay
    inside them.

    **The one message.** `S58-R1-C03` wrote it for these rows. Keep it.

    > Between 2015-16 and 2019-21, the share of Indian adults aged 15-49 with overweight or
    > obesity rose in women and in men, to about one woman in four and more than one man in five.

    Test it once more. Had either share fallen, the sentence would be false, so it claims
    something. "About one woman in four" stands for {{n:nfhs5_women_ow_ob_pct}} per cent, close to
    25. "More than one man in five" stands for {{n:nfhs5_men_ow_ob_pct}} per cent, above 20. Put the
    sentence at the top of a page and keep it in view. Every step below is checked against it.
  analogy_breaks_when: |
    This question is answered by reading two columns, so the gap a real paper fills is thin here.
    The order of work is the same when the data are your own; then the limits come from your
    methods, not from a footnote.
