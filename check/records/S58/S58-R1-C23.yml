- body: |
    **The paragraph.** Here is a first draft of the results, of the kind a thesis is full of. It
    is invented; its numbers are the fact sheet's.

    > Data on the nutritional status of adults were taken from the NFHS-5 India fact sheet. The
    > proportion of overweight and obese individuals was examined in both sexes. The NFHS-4
    > figures were also noted for the purpose of comparison. It was observed that the proportion
    > was {{n:nfhs5_women_ow_ob_pct}}% in females and {{n:nfhs5_men_ow_ob_pct}}% in males in
    > NFHS-5, as compared to {{n:nfhs4_women_ow_ob_pct}}% and {{n:nfhs4_men_ow_ob_pct}}%
    > respectively in NFHS-4. Thus an increasing trend was seen.

    Mark what is wrong before you fix it. The first three sentences are a diary: taken, examined,
    noted (`S58-R1-C02`). The claim arrives in the last five words, and "trend" claims more than
    two surveys can show. "Females" and "males" drift from the fact sheet's women and men
    (`S58-R1-C08`). "Respectively" makes the reader pair four numbers by position. The age range
    and the cut-off are gone.

    Put the claim first, then the evidence it needs. Work out the two differences, as
    `S58-R1-C09` taught, in percentage points.

    ```working
    {{n:nfhs5_women_ow_ob_pct}} minus {{n:nfhs4_women_ow_ob_pct}} = {{n:nfhs5_women_ow_ob_change_pp}}
    {{n:nfhs5_men_ow_ob_pct}} minus {{n:nfhs4_men_ow_ob_pct}} = {{n:nfhs5_men_ow_ob_change_pp}}
    ```

    Here is the claim version, as first drafted. It is invented too.

    > It can be noted that the share of adults aged 15-49 who were overweight or obese rose
    > between NFHS-4 (2015-16) and NFHS-5 (2019-21), in women and in men. In women it rose from
    > {{n:nfhs4_women_ow_ob_pct}} to {{n:nfhs5_women_ow_ob_pct}} per cent, by
    > {{n:nfhs5_women_ow_ob_change_pp}} percentage points. In men it rose from
    > {{n:nfhs4_men_ow_ob_pct}} to {{n:nfhs5_men_ow_ob_pct}} per cent, by
    > {{n:nfhs5_men_ow_ob_change_pp}} percentage points. This clearly shows that obesity is
    > increasing in India.

    **The numbers.** Three checks. Units: every figure says per cent or percentage points. Counts:
    the source gives none, so you cannot put a count before each percentage. Say so where the
    numbers first appear, in the table's footnote. Never make a count by multiplying the {{n:nfhs5_women_interviewed}}
    women NFHS-5 interviewed by a percentage: they are not the women weighed for this row.
    Digits: the four totals run from {{n:nfhs4_men_ow_ob_pct}} to {{n:nfhs5_women_ow_ob_pct}}.

    ```working
    {{n:nfhs5_women_ow_ob_pct}} minus {{n:nfhs4_men_ow_ob_pct}} = {{n:nfhs_ow_ob_totals_range_pp}}
    ```

    Cole's rule for comparing groups gives one decimal place for a range between 1 and 10. Keep
    the fact sheet's one decimal.

    **The score.** Now measure the two drafts, as `S58-R1-C11` did, taking each figure as one word
    of one syllable. The diary has 69 words in 5 sentences. Its words of more than one syllable add
    38 beats: Data 1, nutritional 3, status 1, adults 1, taken 1, India 2, proportion 2 twice,
    overweight 2, obese 1, individuals 4, examined 2, sexes 1, figures 1, also 1, noted 1, purpose 1,
    comparison 3, observed 1, females 1, compared 1, respectively 3, increasing 2. The claim draft
    has 65 words in 4 sentences, with 20 extra beats: noted 1, adults 1, overweight 2, obese 1,
    between 1, women 1 twice, percentage 2 twice, clearly 1, obesity 3, increasing 2, India 2.

    ```working
    69 plus 38 = 107
    69 divided by 5 = 13.8
    107 divided by 69 = 1.550724638
    {{n:fre_constant}} minus {{n:fre_asl_weight}} times 13.8 minus {{n:fre_asw_weight}} times 1.5507 = 61.64
    {{n:fkgl_asl_weight}} times 13.8 plus {{n:fkgl_asw_weight}} times 1.5507 minus {{n:fkgl_constant}} = 8.09
    65 plus 20 = 85
    65 divided by 4 = 16.25
    85 divided by 65 = 1.307692308
    {{n:fre_constant}} minus {{n:fre_asl_weight}} times 16.25 minus {{n:fre_asw_weight}} times 1.3077 = 79.71
    {{n:fkgl_asl_weight}} times 16.25 plus {{n:fkgl_asw_weight}} times 1.3077 minus {{n:fkgl_constant}} = 6.18
    ```

    Look at the first score. The diary scores 61.6, above Flesch's minimum of 60 for Plain English.
    By the number, it passes. By reading, it fails: no claim until the end, and the wrong claim
    when it comes. The score counts the length of words and sentences. It cannot see where the
    claim is, so it could not catch this draft.

    **The cut.** Cut the claim draft in `S58-R1-C12`'s order, largest unit first. The last sentence
    restates the paragraph, and widens it: "obesity" alone, "India" with no age range, and
    "increasing" as if the rise went on. Delete it. Then the empty opener, "It can be noted that".
    What is left has 51 words in 3 sentences, with 11 extra beats: adults 1, overweight 2, obese 1,
    between 1, women 1 twice, percentage 2 twice.

    ```working
    51 plus 11 = 62
    51 divided by 3 = 17
    62 divided by 51 = 1.215686275
    {{n:fre_constant}} minus {{n:fre_asl_weight}} times 17 minus {{n:fre_asw_weight}} times 1.2157 = 86.73
    {{n:fkgl_asl_weight}} times 17 plus {{n:fkgl_asw_weight}} times 1.2157 minus {{n:fkgl_constant}} = 5.39
    ```

    ```table
    | draft | words | sentences | syllables | ASL | ASW | FRE | FKGL |
    | the diary | 69 | 5 | 107 | 13.8 | 1.5507 | 61.6 | 8.1 |
    | the claim draft | 65 | 4 | 85 | 16.25 | 1.3077 | 79.7 | 6.2 |
    | after the cut | 51 | 3 | 62 | 17 | 1.2157 | 86.7 | 5.4 |
    ```

    The cut version's sentences are longer on average than the diary's, and it scores higher. The
    long words went with the diary, and so did its missing claim. Keep the cut version for now.
  analogy_breaks_when: |
    Three short drafts are too small a sample for the score to mean much; `S58-R1-C11` asks for
    passages of about 100 words. The point here is the direction of the error: a bad paragraph can
    pass, so the score is never the reason to keep one.

    The syllable counts are judgements. If you say "India" in two beats, the diary scores a
    little higher still; the comparison does not change.
  numbers:
  - value: "724,115"
    unit: women from whom NFHS-5 gathered information (not the women weighed for indicator 88)
    citekey: nfhs5_india_factsheet
    as_of: '2026-10-02'
