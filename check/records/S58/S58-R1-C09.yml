must_know:
- point: |
    More decimal places look more careful, and that is the error. Round once, when you write the sentence,
    to the digits Cole's rules give.
  kind: misconception
  bearing: methodological
  refs: [cole_2015_too_many_digits]
- point: |
    Put the count before the percentage: "15 of 40 (38 per cent)".
  kind: move
  bearing: methodological
  refs: [icmje_2026_manuscript_preparation, lang_altman_2013_sampl]
- point: |
    A change between two percentages has two sizes. For women in NFHS it is {{n:nfhs5_women_ow_ob_change_pp}} percentage points, or about
    {{n:nfhs_women_ow_ob_rel_rise_pct}} per cent of the starting figure. Say the points first.
  kind: trap
  bearing: public
  refs: [nfhs5_india_factsheet]
- point: |
    When fewer than 100 people are counted, one person is worth more than a percentage point.
    In a small study the count is the result.
  kind: consequence
  bearing: methodological
- point: |
    Cole and SAMPL give different rules for P values. Neither allows 0.000.
  kind: dispute
  bearing: methodological
  refs: [cole_2015_too_many_digits, lang_altman_2013_sampl]
- point: |
    Rounding rules are for the page, not for the working. A figure rounded early and then used
    in a later sum carries its rounding into the answer.
  kind: boundary
  bearing: methodological
  refs: [cole_2015_too_many_digits]
- point: |
    These rules decide how many digits you print. They cannot tell you whether the number is
    right.
  kind: boundary
  bearing: methodological
- point: |
    The NFHS fact sheet prints percentages with no counts. Never make a count by multiplying
    the survey's {{n:nfhs5_women_interviewed}} women by the percentage.
  kind: india_deviation
  bearing: public
  refs: [nfhs5_india_factsheet]
exercises:
- type: retrieval
  prompt: |
    From memory: name the three things a reader needs with every number in a results sentence.
    Then state Cole's rule for the digits of a mean and of a percentage. Last, name the one
    value a P value may never be printed as.
  answer: |
    Its unit; for a percentage, the counts it came from (numerator and denominator); and no more
    digits than the data support.

    A mean gets enough decimal places to give the SD two significant figures, or the SE one. A
    percentage is a whole number, or has one decimal place below 10 per cent. A P value is
    never printed as 0.000.
  confidence_first: true
- type: critique
  prompt: |
    Here is a made-up results paragraph from a thesis on a school survey. Find every number that
    is incomplete or carries false precision. Then rewrite the paragraph so that it makes one
    point.

    > A total of 87 students participated. Overweight was seen in 19.54 per cent of students.
    > Mean age was 13.4782 years ± 1.2066. Girls had 9.2 per cent more overweight than boys
    > (p = 0.000).

    The counts behind the percentages are 17 of 87 in all, 11 of 42 girls and 6 of 45 boys. The
    cut-off was the one in the survey's protocol, which the methods section names.
  answer: |
    Work out what the counts give.

    ```working
    17 divided by 87 is about 0.1954
    11 divided by 42 is about 0.2619
    6 divided by 45 is about 0.1333
    26.19 minus 13.33 = 12.86
    ```

    Four faults. First, "19.54 per cent" has no count, and two decimal places from 87 students.
    Each student is worth more than one point, so write "17 of 87 (20 per cent)". Second, the
    mean age has four decimal places and the "±" form. The SD 1.2066 to two significant figures
    is 1.2, so write "13.5 years (SD 1.2)".

    Third, "9.2 per cent more" matches neither the points
    nor the per cent the counts give. The counts give 26 per cent of girls and 13 per cent of
    boys, about 13 percentage points apart. Fourth, "p = 0.000" is never printed. If the test
    gave less than 0.001, write P < 0.001.

    A rewrite with one point:

    > Of the 87 students, 17 (20 per cent) were at or above the protocol's cut-off for
    > overweight. They were 11 of 42 girls (26 per cent) and 6 of 45 boys (13 per cent). Their
    > mean age was 13.5 years (SD 1.2).

    The comparison of girls and boys belongs with its test, reported to one rule, in a sentence
    of its own.
  skill_ref: S58-R1-K01
- type: teaching
  prompt: |
    A journalist rings you: "So obesity among Indian women is up 17 per cent in five years?" You
    have three minutes and no jargon. Give the answer you would say, ending in one sentence she can
    quote.
  answer: |
    Not quite, and the difference matters. The survey measured women aged 15 to 49, and it
    counts overweight and obesity together; it has no figure for obesity alone. In the 2015-16
    survey, {{n:nfhs4_women_ow_ob_pct}} in every hundred women of that age were in that group.
    In the 2019-21 survey it was {{n:nfhs5_women_ow_ob_pct}} in every hundred. So about 3 or 4
    more women in every hundred. Your {{n:nfhs_women_ow_ob_rel_rise_pct}} per cent is that rise measured against the starting
    figure. It is true, but it sounds far bigger than it is.

    The sentence to quote: "About one woman in four aged 15 to 49 is now overweight or obese.
    In the survey before, it was about one in five."

    Calibrated: both figures come from national surveys. They tell you how the share changed,
    not why.
retrieval_items:
- q: What is the difference between a percentage-point change and a per cent change?
  a: The percentage-point change is the plain difference between two percentages. The per cent
    change divides that difference by the starting percentage. {{n:nfhs4_women_ow_ob_pct}} per
    cent to {{n:nfhs5_women_ow_ob_pct}} per cent is {{n:nfhs5_women_ow_ob_change_pp}} points, or
    about {{n:nfhs_women_ow_ob_rel_rise_pct}} per cent.
- q: How far does one person move a percentage when n people are counted, and what follows for a
    study of 40?
  a: 100 ÷ n percentage points. With 40 people each is 2.5 points, so a decimal place describes
    less than one person; give the count.
- q: What is the rule of four?
  a: Round a risk ratio or odds ratio to two significant figures if its first non-zero digit is 4
    or more, otherwise to three. 22.68 becomes 22.7; 4.183 becomes 4.2.
quantitative: true
practice_note: |
  Thirteen problems. The technique has six moves that compose in one sentence: significant
  figures, a percentage with its count, points against per cent, the mean rule, the rule of four
  and the two P-value rules. Each gets a mechanical or applied pass, then two diagnostic and two
  transfer problems.
practice:
- level: 1
  prompt: |
    Write each number with two significant figures: 0.04372, 3465.31, 22.68, 0.5049.
  answer: |
    ```working
    0.04372 rounds to 0.044
    3465.31 rounds to 3500
    22.68 rounds to 23
    0.5049 rounds to 0.50
    ```

    The leading zeros of 0.04372 do not count. Its first two significant figures are 4 and 3,
    and the 7 after them rounds the 3 up to 4. In 0.50 the final zero is significant, so it is
    kept.
- level: 2
  prompt: |
    37 of 412. Work out the percentage, then write it as Cole's rule for percentages asks, with
    its count.
  answer: |
    ```working
    37 divided by 412 is about 0.0898
    0.0898 times 100 = 8.98
    ```

    8.98 per cent is under 10 per cent, so it keeps one decimal place: 9.0 per cent. Write "37 of 412 (9.0 per cent)".
- level: 2
  prompt: |
    A percentage goes from 12.5 per cent to 15.0 per cent. Give the change in percentage points and in per cent.
  answer: |
    ```working
    15.0 minus 12.5 = 2.5
    2.5 divided by 12.5 = 0.2
    0.2 times 100 = 20
    ```

    A rise of 2.5 percentage points, which is a rise of 20 per cent on the starting figure.
- level: 3
  prompt: |
    Round each mean by Cole's rule, using the SD beside it.

    ```table
    mean    SD
    52.381  11.46
    3.0538  0.5712
    0.8147  0.0236
    ```
  answer: |
    Round each SD to two significant figures, then give the mean the same decimal places.

    ```working
    11.46 rounds to 11, no decimal places, so 52.381 rounds to 52
    0.5712 rounds to 0.57, two decimal places, so 3.0538 rounds to 3.05
    0.0236 rounds to 0.024, three decimal places, so 0.8147 rounds to 0.815
    ```

    52 (SD 11), 3.05 (SD 0.57) and 0.815 (SD 0.024).
- level: 3
  prompt: |
    Round each ratio by the rule of four: 0.3172, 1.0462, 4.183, 11.27, 0.0482.
  answer: |
    Look at the first digit that is not zero. If it is 4 or more, keep two significant figures;
    otherwise keep three.

    ```working
    0.3172: first digit 3, keep three, 0.317
    1.0462: first digit 1, keep three, 1.05
    4.183: first digit 4, keep two, 4.2
    11.27: first digit 1, keep three, 11.3
    0.0482: first digit 4, keep two, 0.048
    ```
- level: 4
  prompt: |
    NFHS-5 (2019-21) gives the share of women aged 15-49 with a BMI of {{n:nfhs5_ow_ob_bmi_cutoff}} kg/m^2 or more. It
    is {{n:nfhs5_women_ow_ob_urban_pct}} per cent in urban India and
    {{n:nfhs5_women_ow_ob_rural_pct}} per cent in rural India. Give the gap in percentage points and the urban figure as a ratio of the rural
    one, by the rule of four. Then use Cole's suggestion for comparing groups to decide how many
    decimal places the two percentages need. Write the sentence.
  answer: |
    ```working
    {{n:nfhs5_women_ow_ob_urban_pct}} minus {{n:nfhs5_women_ow_ob_rural_pct}} = {{n:nfhs5_women_ow_ob_urban_rural_gap_pp}}
    {{n:nfhs5_women_ow_ob_urban_pct}} divided by {{n:nfhs5_women_ow_ob_rural_pct}} = 1.685
    ```

    The ratio's first digit is 1, so keep three significant figures: {{n:nfhs5_women_ow_ob_urban_rural_ratio}}. The range across the
    two groups is {{n:nfhs5_women_ow_ob_urban_rural_gap_pp}}, which is 10 or more. So Cole's suggestion gives whole numbers: 33 per
    cent and 20 per cent.

    > In NFHS-5 (2019-21), 33 per cent of urban women aged 15-49 had a BMI of {{n:nfhs5_ow_ob_bmi_cutoff}} kg/m^2 or
    > more. Among rural women it was 20 per cent. The gap was about 13 percentage points.

    Whole numbers blur the gap a little: 33 minus 20 is 13, against {{n:nfhs5_women_ow_ob_urban_rural_gap_pp}} from the printed
    figures. If the gap is your point, keep the fact sheet's one decimal place and write {{n:nfhs5_women_ow_ob_urban_rural_gap_pp}}
    points. Either way, write the gap in points before any ratio.
  refs: [nfhs5_india_factsheet, cole_2015_too_many_digits]
- level: 5
  prompt: |
    Cole quotes a paper: "The mean birth weight of babies was 3.05±0.57 (95% CI 2.95 to 3.15)
    kg". The 0.57 is the SD. Rewrite the mean and SD in grams, in the SAMPL form, to the digits
    Cole's rule for a mean gives.
  answer: |
    One kilogram is 1000 grams.

    ```working
    3.05 times 1000 = 3050
    0.57 times 1000 = 570
    ```

    The SD of 570 g has two significant figures, the 5 and the 7, and its last significant digit
    is in the tens. So the mean goes to the nearest 10 g: 3050 g. Write "3050 g (SD 570 g)". Cole
    reaches the same place: birth weight in grams "ought to be rounded to the nearest 10 g".
  refs: [cole_2015_too_many_digits, lang_altman_2013_sampl]
- level: 6
  prompt: |
    Made-up output: mean age 34.2871 years, SD 9.8364 years. Give the mean by Cole's SD rule.
    Then give it by his SE rule for a sample of 100 and for a sample of 10,000. Say which you
    would print for 100 people.
  answer: |
    The SD rule: 9.8364 to two significant figures is 9.8, one decimal place, so 34.3 years.

    The SE rule, with the SE as the SD divided by the square root of the count.

    ```working
    square root of 100 = 10
    9.8364 divided by 10 = 0.98364
    square root of 10,000 = 100
    9.8364 divided by 100 = 0.098364
    ```

    For 100 people the SE is 0.98, which is 1 to one significant figure. That allows no decimal
    places: 34 years. For 10,000 people the SE is 0.1 to one significant figure: 34.3 years.

    For 100 people, print 34.3 years (SD 9.8) if you describe the people, or 34 years if you
    follow the SE rule. SAMPL notes that mean age "can often be rounded to the nearest year",
    which gives 34. Say which rule you used.
  refs: [cole_2015_too_many_digits, lang_altman_2013_sampl]
- level: 6
  prompt: |
    Made-up software output gives four P values: 0.67, 0.0086, 0.096 and 0.00004. Write each
    by Cole's rule and by SAMPL's.
  answer: |
    ```table
    | software prints | Cole: one significant figure | SAMPL: one or two decimal places |
    | 0.67 | 0.7 | 0.67 or 0.7 |
    | 0.0086 | 0.009 | 0.01 |
    | 0.096 | 0.1 | 0.10 or 0.1 |
    | 0.00004 | < 0.001 | < 0.001 |
    ```

    The two rules differ only for 0.0086. Cole's one significant figure keeps it below 0.01;
    SAMPL's two decimal places round it up to 0.01. For 0.00004, Cole allows a lower limit than
    0.001 but his examples stop there, and SAMPL's smallest is P < 0.001.
  refs: [cole_2015_too_many_digits, lang_altman_2013_sampl]
- level: 7
  prompt: |
    Here is a worked answer. The counts are made up. Find the step that broke.

    ```working
    village A: 15 of 40 women with a BMI of {{n:nfhs5_ow_ob_bmi_cutoff}} kg/m^2 or more = 37.50%
    village B: 18 of 40 women = 45.00%
    45.00 minus 37.50 = 7.50
    so village B has 7.50% more women in this group than village A
    ```
  answer: |
    The first three lines are right, apart from their digits.

    ```working
    15 divided by 40 = 0.375
    18 divided by 40 = 0.45
    45 minus 37.5 = 7.5
    ```

    The last line broke. The difference of 7.5 is in percentage points. As a per cent of
    village A's figure it is larger.

    ```working
    7.5 divided by 37.5 = 0.2
    ```

    Village B's share is 7.5 percentage points higher, or 20 per cent higher than village A's.
    The digits are false too. With 40 women each is worth 2.5 points, so write 15 of 40 (38 per
    cent) and 18 of 40 (45 per cent). And the whole difference is three women.

    Why it looks reasonable: both numbers are percentages, so "per cent" feels like the unit of
    their difference.
- level: 8
  prompt: |
    Cole cites a review that gives a hazard ratio of 0.03, rounded to two decimal places. A
    hazard ratio compares how fast an event happens in two groups; here the event was updating
    a reference work's citations. Here is a worked answer. Find the step that broke.

    ```working
    hazard ratio = 0.03
    turned the other way round: 1 divided by 0.03 = 33.33
    so the other reference work updates its citations 33.33 times as fast
    ```
  answer: |
    The arithmetic is right. The step that broke is treating 0.03 as exact. Rounded to two
    decimal places, 0.03 stands for any value from 0.025 up to, but not including, 0.035.

    ```working
    1 divided by 0.035 = 28.6
    1 divided by 0.025 = 40
    ```

    Turned round, the ratio could be anywhere from about 29 to 40. Cole makes the same point
    about this example. Four significant figures, 33.33, cannot come from a one-figure input.
    Write "about 30 times, somewhere between 29 and 40", or go back to the unrounded ratio.

    Why it looks reasonable: the calculator prints 33.33 and nothing on the screen says the
    input was rounded.
  refs: [cole_2015_too_many_digits]
- level: 9
  prompt: |
    A news report says: "One in four Indian women is now obese. That is about 1.7 lakh of the
    7.2 lakh women surveyed, up 16.5 per cent since the last survey." A lakh is 100,000. Decide
    what to compute, compute it, and say what the claim does not establish.
  answer: |
    Find where each figure came from.

    ```working
    {{n:nfhs5_women_interviewed}} times 0.24 is about 173,788
    {{n:nfhs5_women_ow_ob_change_pp}} divided by {{n:nfhs4_women_ow_ob_pct}} = 0.165
    ```

    The 1.7 lakh is the {{n:nfhs5_women_interviewed}} women multiplied by {{n:nfhs5_women_ow_ob_pct}} per cent. The
    16.5 per cent is the relative change. The arithmetic holds, and almost every word around it
    is wrong.

    What it does not establish. The row is for women aged 15-49, not Indian women. It counts
    overweight and obese together, and there is no figure for obesity alone.

    The {{n:nfhs5_women_interviewed}} women are everyone the survey gathered information from. The row leaves out pregnant women and
    women who gave birth in the two months before. So 1.7 lakh is not a count the survey gives.
    The rise is {{n:nfhs5_women_ow_ob_change_pp}} percentage points, and "up 16.5 per cent" said
    alone sounds far larger. Last, two surveys say nothing about why the share rose.
  refs: [nfhs5_india_factsheet]
- level: 10
  prompt: |
    A made-up project report says: "We visited 3 schools (n = 87). After the new menu, fewer
    students bought a sugar-sweetened drink at the canteen: 49 per cent, down from 62 per cent
    (p = 0.000). That is a 21 per cent reduction." Decide what to compute, compute it, and say
    what the claim does not establish.
  answer: |
    Compute the change both ways, and what one student is worth.

    ```working
    62 minus 49 = 13
    13 divided by 62 is about 0.21
    100 divided by 87 is about 1.15
    ```

    The share fell 13 percentage points. The 21 per cent is the relative change. Each student
    is worth more than one point, so the report should give counts. If the same 87 students
    were counted both times, 54 of 87 and 43 of 87 would fit. The report does not say they
    were. And "p = 0.000" is never printed: at most, P < 0.001.

    What it does not establish. A before-and-after count in three schools has no comparison
    group, so it cannot show the menu caused the fall. The schools were the ones visited, not a
    sample of a district. And a fall in buying at the canteen says nothing about what the
    students drank elsewhere.
