simplified_explanation: |
  So ask three questions of every number you write. In what unit? Out of how many? How finely do
  the data let you say it?
illustrations:
- body: |
    Start with a sentence from a district survey report. The sentence and its numbers are made
    up for this example.

    > The prevalence of overweight was found to be 37.50 per cent.

    Prevalence is how many people in a group have the condition, as Book 0 used the word
    (`B0-R0-C26`), here given as a share.

    Now ask the three questions. In what unit? A per cent, but of whom, and by what cut-off? Out
    of how many? The sentence does not say. How finely? To a hundredth of a percentage point.

    Go back to the survey's own counts. It weighed and measured 40 women. Fifteen had a body
    mass index (BMI) of {{n:nfhs5_ow_ob_bmi_cutoff}} kg/m^2 or more, BMI as Book 0 built it (`B0-R0-C14`).

    ```working
    15 divided by 40 = 0.375
    0.375 times 100 = 37.5
    ```

    Now see how far one woman moves that figure. One woman out of 40 is 100 divided by 40
    percentage points.

    ```working
    100 divided by 40 = 2.5
    16 divided by 40 = 0.4
    ```

    Each woman is worth 2.5 percentage points. With one more woman the figure jumps from 37.5
    per cent to 40 per cent. Nothing in between can happen. So "37.50 per cent" claims a
    fineness that 40 women cannot give. Cole's rule for a percentage is a whole number, or one
    decimal place below 10 per cent. Here 37.5 rounds to 38.

    Rewrite the sentence with its count first and its cut-off named.

    > Of the 40 women weighed and measured, 15 (38 per cent) had a body mass index of {{n:nfhs5_ow_ob_bmi_cutoff}}
    > kg/m^2 or more.

    Journals print the sign, %. This book writes the words. Follow your journal.

    The reader can now check the percentage, and can see how small the group was. The
    Recommendations of the International Committee of Medical Journal Editors (ICMJE) ask for
    "the absolute numbers" behind every percentage. The SAMPL guidelines ask for the numerator
    and denominator.

    Watch the step shrink as the count grows.

    ```working
    100 divided by 20 = 5
    100 divided by 100 = 1
    100 divided by 200 = 0.5
    100 divided by 400 = 0.25
    ```

    Below 100 people, each person is worth more than a whole percentage point. A decimal place
    on such a percentage describes less than one person. The count is what carries the
    information.

    Now a national figure, from the fifth National Family Health Survey (NFHS-5, 2019-21). It
    reports that {{n:nfhs5_women_ow_ob_pct}} per cent of women aged 15-49 had overweight or
    obesity, meaning a BMI of {{n:nfhs5_ow_ob_bmi_cutoff}} kg/m^2 or more. The fact sheet prints no count beside it.

    Its introduction says the survey gathered information from {{n:nfhs5_women_interviewed}} women. That is not the
    denominator. A footnote on the women's rows leaves out pregnant women and women who gave
    birth in the two months before. So quote what the fact sheet gives: the percentage, the
    survey and its years, the age range and the cut-off. Do not make a count by multiplying
    {{n:nfhs5_women_interviewed}} by 0.24.
  analogy_breaks_when: |
    The step of 100 ÷ n is the smallest move the count allows. It is not how uncertain the
    percentage is. A second random sample of 40 women would give a different count, and that
    sampling variation (`B0-R0-C29`) is a separate matter. So a step finer than your last digit
    is needed. It is not enough.

    The rule of the count binds your own data. For a figure you quote, you can only give what
    the source gives.
  numbers:
  - value: "{{n:nfhs5_women_ow_ob_pct}}"
    unit: per cent of women aged 15-49 overweight or obese (BMI 25.0 kg/m^2 or more), NFHS-5, India
    citekey: nfhs5_india_factsheet
    as_of: '2026-10-02'
    quote: |-
      (BMI ≥25.0 kg/m2)21 (%) 33.2 19.7 24.0 20.6
  - value: "724,115"
    unit: women from whom NFHS-5 gathered information (not the denominator of the overweight row)
    citekey: nfhs5_india_factsheet
    as_of: '2026-10-02'
    quote: |-
      gathered information from 636,699 households, 724,115 women, and 101,839 men
- body: |
    NFHS-4 (2015-16) put the same row for women at {{n:nfhs4_women_ow_ob_pct}} per cent. NFHS-5
    (2019-21) put it at {{n:nfhs5_women_ow_ob_pct}} per cent. Work out the change both ways, as Book 0
    did (`B0-R0-C04`).

    ```working
    {{n:nfhs5_women_ow_ob_pct}} minus {{n:nfhs4_women_ow_ob_pct}} = {{n:nfhs5_women_ow_ob_change_pp}}
    {{n:nfhs5_women_ow_ob_change_pp}} divided by {{n:nfhs4_women_ow_ob_pct}} = 0.165
    ```

    A rise of {{n:nfhs5_women_ow_ob_change_pp}} percentage points. That is a rise of about {{n:nfhs_women_ow_ob_rel_rise_pct}} per cent
    on the NFHS-4 figure. Both are true, and they are different quantities. A reader who meets
    "a {{n:nfhs_women_ow_ob_rel_rise_pct}} per cent rise" alone may take it for {{n:nfhs_women_ow_ob_rel_rise_pct}} points.

    So write the absolute change first. If you add the relative one, label it.

    > Among women aged 15-49, the share with a BMI of {{n:nfhs5_ow_ob_bmi_cutoff}} kg/m^2 or more rose from
    > {{n:nfhs4_women_ow_ob_pct}} per cent in NFHS-4 (2015-16) to {{n:nfhs5_women_ow_ob_pct}} per cent in NFHS-5
    > (2019-21). That is a rise of {{n:nfhs5_women_ow_ob_change_pp}} percentage points.

    Do the same for men.

    ```working
    {{n:nfhs5_men_ow_ob_pct}} minus {{n:nfhs4_men_ow_ob_pct}} = {{n:nfhs5_men_ow_ob_change_pp}}
    {{n:nfhs5_men_ow_ob_change_pp}} divided by {{n:nfhs4_men_ow_ob_pct}} = 0.212
    ```

    Men rose by {{n:nfhs5_men_ow_ob_change_pp}} points, about {{n:nfhs_men_ow_ob_rel_rise_pct}} per cent on their NFHS-4 figure.

    Now the digits. On its own, Cole's rule would print {{n:nfhs5_women_ow_ob_pct}} per cent as
    24 per cent. But you are comparing groups, and rounding must not blur the gaps between them.
    For that case Cole suggests a rule built on the range, the gap from the lowest value to the
    highest. In his words: "if the range is 10% or more use whole numbers, if less than 1% use
    two decimal places, and otherwise one". Your four figures run from
    {{n:nfhs4_men_ow_ob_pct}} to {{n:nfhs5_women_ow_ob_pct}}.

    ```working
    {{n:nfhs5_women_ow_ob_pct}} minus {{n:nfhs4_men_ow_ob_pct}} = {{n:nfhs_ow_ob_totals_range_pp}}
    ```

    The range is {{n:nfhs_ow_ob_totals_range_pp}}, between 1 and 10, so keep one decimal place, as the fact sheet does. Round
    the women's two figures to whole numbers and they become 21 and 24. Their gap would read as
    3, not the {{n:nfhs5_women_ow_ob_change_pp}} the survey gives.

    Absolute and relative changes in risk get their full treatment in the second rung of this
    subject. Here the habit is enough: points first, per cent labelled.
  analogy_breaks_when: |
    The two surveys measured different women, each a sample of its own time. The change is a
    difference between two estimates, and each has its own sampling variation. A rise of
    {{n:nfhs5_women_ow_ob_change_pp}} points describes the two surveys. It does not say why the
    share rose.

    The row covers ages 15-49 only, and counts overweight and obese together. It is not a
    figure for all Indian women, nor for obesity alone.
  numbers:
  - value: "{{n:nfhs4_women_ow_ob_pct}}"
    unit: per cent of women aged 15-49 overweight or obese, NFHS-4 (2015-16), India
    citekey: nfhs5_india_factsheet
    as_of: '2026-10-02'
    quote: |-
      (BMI ≥25.0 kg/m2)21 (%) 33.2 19.7 24.0 20.6
  - value: "{{n:nfhs5_men_ow_ob_pct}}"
    unit: per cent of men aged 15-49 overweight or obese, NFHS-5 (2019-21), India
    citekey: nfhs5_india_factsheet
    as_of: '2026-10-02'
    quote: |-
      (BMI ≥25.0 kg/m2) (%) 29.8 19.3 22.9 18.9
  - value: "{{n:nfhs4_men_ow_ob_pct}}"
    unit: per cent of men aged 15-49 overweight or obese, NFHS-4 (2015-16), India
    citekey: nfhs5_india_factsheet
    as_of: '2026-10-02'
    quote: |-
      (BMI ≥25.0 kg/m2) (%) 29.8 19.3 22.9 18.9
- body: |
    Statistical software prints every digit it has. Here is made-up output from a survey of 400
    women: mean BMI 24.6318 kg/m^2, SD 4.1237 kg/m^2. The SD is the standard deviation, the
    spread Book 0 built (`B0-R0-C28`).

    Cole's rule for a mean says: round the SD to two significant figures, then give the mean the
    same number of decimal places.

    ```working
    4.1237 rounds to 4.1
    24.6318 rounds to 24.6
    ```

    Write it in the SAMPL form: mean BMI 24.6 kg/m^2 (SD 4.1). Cole's other rule uses the
    standard error (SE), which Book 0 built as the SD divided by the square root of the count
    (`B0-R0-C29`).

    ```working
    square root of 400 = 20
    4.1237 divided by 20 = 0.206
    ```

    The SE to one significant figure is 0.2. That is one decimal place again, so 24.6. Now
    suppose the survey had 40,000 women and the same SD.

    ```working
    square root of 40,000 = 200
    4.1237 divided by 200 = 0.0206
    ```

    The SE is now 0.02, so the SE rule allows two decimal places: 24.63. The SD rule still gives
    24.6. The two rules answer different questions. The SD describes how the women differ. The
    SE describes how well the mean is known, and it shrinks as the count grows. Say which rule
    you used.

    Next, a ratio. Cole's own example is an odds ratio of 22.68. An odds ratio divides the
    odds of an outcome in one group by the odds in another, with odds as Book 0 built them
    (`B0-R0-C24`). The paper gave it with a 95 per cent confidence interval (CI) of 7.51 to 73.67. A CI
    is a range, worked out from the data, that shows how precisely the ratio is known. How it is
    worked out is beyond this book.

    Apply the rule of four. The first digit of 22.68 is 2, below 4, so keep three significant
    figures: 22.7. The first digits of 7.51 and 73.67 are both 7, so keep two: 7.5 and 74. The
    result is 22.7 (95 per cent CI 7.5 to 74). Cole also accepts one figure fewer throughout, which gives
    23 (8 to 70).

    Last, the P value, the number a statistical test prints beside a comparison. What it means
    is beyond this book; how many digits to give it is not. Here the two guides differ, so look
    at both. The four values are made up.

    ```table
    | software prints | Cole: one significant figure | SAMPL: one or two decimal places |
    | 0.38 | 0.4 | 0.38 or 0.4 |
    | 0.047 | 0.05 | 0.05 |
    | 0.0026 | 0.003 | no equality fits: 0.00 would be false |
    | 0.000 | < 0.001 | < 0.001 |
    ```

    The two agree at the top and part below 0.01. Two decimal places turn 0.0026 into 0.00,
    which says the P value is zero. Cole's point is that any rule counting decimal places fails
    there. Both forbid 0.000. Your journal's instructions for authors may name a rule. Follow
    them, and use one rule through the whole paper.
  analogy_breaks_when: |
    Cole writes "round up" for P values. For each value in the table, rounding up and rounding
    to the nearest give the same figure. For a value such as 0.032 they do not: up gives 0.04,
    and nearest gives 0.03. Say which you did.

    These rules decide how many digits to print. They do not make the mean, the ratio or the P
    value right. A mean printed to the right digits can still come from 400 women who do not
    stand for the district.
  numbers:
  - value: "22.68"
    unit: odds ratio (no unit), Cole's worked example
    citekey: cole_2015_too_many_digits
    as_of: '2026-10-02'
    quote: |-
      Take as an example the odds ratio (OR) of 22.68 (95% CI 7.51 to 73.67) comparing beta mimetics with placebo for side effects requiring a change of medication.
  - value: "7.51"
    unit: lower end of the 95 per cent confidence interval of that odds ratio
    citekey: cole_2015_too_many_digits
    as_of: '2026-10-02'
    quote: |-
      Take as an example the odds ratio (OR) of 22.68 (95% CI 7.51 to 73.67) comparing beta mimetics with placebo for side effects requiring a change of medication.
  - value: "73.67"
    unit: upper end of the 95 per cent confidence interval of that odds ratio
    citekey: cole_2015_too_many_digits
    as_of: '2026-10-02'
    quote: |-
      Take as an example the odds ratio (OR) of 22.68 (95% CI 7.51 to 73.67) comparing beta mimetics with placebo for side effects requiring a change of medication.
  - value: "22.7"
    unit: the same odds ratio by the rule of four
    citekey: cole_2015_too_many_digits
    as_of: '2026-10-02'
    quote: |-
      Applying it to the example of 22.68 above gives 22.7 (95% CI 7.5 to 74).
  - value: "23"
    unit: the same odds ratio with one significant figure fewer
    citekey: cole_2015_too_many_digits
    as_of: '2026-10-02'
    quote: |-
      Reporting it rounded to two significant digits, as 23 (7.5 to 74), or even as 23 (8 to 70), with one significant digit for the CI, would be simpler and clearer.
common_misreading: |
  "{{n:nfhs5_women_ow_ob_pct}} per cent of Indian women are obese." The fact sheet's row is narrower on
  three counts. It covers women aged 15-49 only. It counts overweight and obese together, at a
  BMI of {{n:nfhs5_ow_ob_bmi_cutoff}} kg/m^2 or more, and it has no row for obesity alone. And it leaves out pregnant
  women and women who gave birth in the two months before. Read the row's own words and its
  footnote before you write the sentence.
reporting_sentence: |
  In NFHS-5 (2019-21), {{n:nfhs5_women_ow_ob_pct}} per cent of women aged 15-49 had a body mass
  index of {{n:nfhs5_ow_ob_bmi_cutoff}} kg/m^2 or more. In NFHS-4 (2015-16) the figure was {{n:nfhs4_women_ow_ob_pct}}
  per cent, so the share rose by {{n:nfhs5_women_ow_ob_change_pp}} percentage points.
