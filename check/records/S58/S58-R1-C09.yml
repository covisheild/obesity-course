concept_id: S58-R1-C09
subject: S58
rung: 1
sequence: 9
name: "Numbers in a sentence: the unit, the count behind the percentage, and no more digits than the data hold"
concept_type: derivable
clusters:
- craft-and-integrity
- evidence-to-action
