simplified_explanation: |
  Think of the paper as one argument handed along four sections. The introduction says what is
  known, then what is not known, and ends on your question. The methods say what you did and why,
  so that a reader can judge it and could repeat it. The results answer the question in steps, one
  claim at a time, each with its numbers. The discussion gives the answer in its first lines, then
  what might explain it, what could make it wrong, and what it means.

  Plan this before you write a paragraph. Write one sentence for each paragraph you intend, and make
  each sentence the point that paragraph will make. Then read those sentences alone, top to bottom.
  If they do not carry the argument, polishing the paragraphs will not make them carry it.
illustrations:
- body: |
    Start with a plan that fails. A resident is turning her thesis work into a short paper on the
    national survey's figures for adults who are overweight or obese. Her plan is a list of
    headings. The plan is invented for this lesson.

    ```table
    | section | the resident's plan |
    | Introduction | obesity: definition, history, causes, complications; the burden worldwide and in India |
    | Methods | about the survey; sampling; body mass index; the urban figures we noticed later |
    | Results | Table 1; Table 2; Figure 1 |
    | Discussion | obesity is a growing problem; our results agree with other studies |
    ```

    Read each heading and ask what it claims. None of them claims anything. "Table 1" tells the
    reader where to look, not what they will find there. The introduction covers everything known
    about obesity and never reaches a question, so the reader cannot tell what the paper will
    answer. "The urban figures we noticed later" is something learnt during the work, so it does
    not belong in the methods.

    Now write the same paper as an outline: one sentence for each planned paragraph, and each
    sentence a claim. First get the data. Open the NFHS-5 India fact sheet at
    https://dhsprogram.com/pubs/pdf/OF43/India_National_Fact_Sheet.pdf and find indicators 88 and
    89, under "Nutritional Status of Adults (age 15-49 years)". Each row gives four numbers, all in
    per cent: NFHS-5 (2019-21) urban, rural and total, then the NFHS-4 (2015-16) total. Overweight
    or obese means a body mass index of 25.0 kg/m^2 or more, the measure Book 0 built (`B0-R0-C14`).

    ```table
    | paragraph | the claim it will make |
    | Introduction 1 | India's National Family Health Survey (NFHS) reports, in each round, the share of women and of men aged 15-49 who are overweight or obese. |
    | Introduction 2 | [What the papers you have read say is known, and what they leave open. Each sentence carries its reference. This outline cannot fill it for you.] |
    | Introduction 3 | We asked how that share changed between NFHS-4 (2015-16) and NFHS-5 (2019-21), and how it differs between urban and rural India in NFHS-5. |
    | Methods 1 | We used indicators 88 and 89 of the NFHS-5 India fact sheet, and fixed two comparisons before reading the numbers: between the rounds, and between urban and rural areas. |
    | Results 1 | A larger share of women aged 15-49 were overweight or obese in NFHS-5 than in NFHS-4: {{n:nfhs5_women_ow_ob_pct}} against {{n:nfhs4_women_ow_ob_pct}} per cent. |
    | Results 2 | The same held for men: {{n:nfhs5_men_ow_ob_pct}} against {{n:nfhs4_men_ow_ob_pct}} per cent. |
    | Results 3 | In NFHS-5, urban adults were more often overweight or obese than rural adults: {{n:nfhs5_women_ow_ob_urban_pct}} against {{n:nfhs5_women_ow_ob_rural_pct}} per cent of women, and {{n:nfhs5_men_ow_ob_urban_pct}} against {{n:nfhs5_men_ow_ob_rural_pct}} per cent of men. |
    | Discussion 1 | Between the two rounds, the share of adults aged 15-49 who were overweight or obese rose for women and for men, and in NFHS-5 it was higher in urban than in rural India for both. |
    | Discussion 2 | [Possible explanations, each from a paper you cite, and each called possible. The fact sheet offers none.] |
    | Discussion 3 | The rows cover only ages 15-49, put overweight and obesity together, leave out pregnant women and women with a birth in the last two months, and come from two separate surveys, so they cannot show what caused the change. |
    | Discussion 4 | [What the answer means for research or for programmes, claiming no more than the data support.] |
    ```

    Now read the right-hand column alone, top to bottom. Introduction 3 asks a question with two
    parts. Results 1 and 2 answer the first part, and Results 3 answers the second. Discussion 1
    answers the whole question in one sentence. Discussion 3 says how far that answer reaches.
    The argument is there before a single paragraph exists.

    Each results sentence would also work as a subheading: it states a finding, where "Table 1"
    only names a place. And notice what the outline stops you claiming. The fact sheet's NFHS-4
    column gives the total only, so you cannot say whether the urban-rural gap widened. You find
    that out here, in one line, rather than after writing three paragraphs about it.
  analogy_breaks_when: |
    This outline fits a short paper with one question and three results. A paper on an experiment,
    or on people followed over years, has more steps, such as showing that a measure works before
    using it. Its results section is
    longer, but each step is still one claim.

    The numbers are shares of adults aged 15-49 in India in two survey rounds, overweight and
    obesity together. They do not show why the share rose. They say nothing about adults over 49,
    and nothing about any one state or district.

    The bracketed rows are not decoration. An outline with them left empty is a plan for a paper
    whose gap and explanations are still unsupported. Fill them from papers you have read and can
    cite.
