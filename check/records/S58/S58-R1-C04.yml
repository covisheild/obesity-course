- body: |
    The second move is putting each sentence in the section whose job it does. Here are seven
    sentences from a draft paper on a district survey of women's weight. The draft and its
    sentences are invented. Cover the last two columns, decide where each sentence goes, then
    check.

    ```table
    | sentence in the draft | the draft put it in | it belongs in | why |
    | Obesity is a major public health problem all over the world. | Introduction | nowhere, as written | It names no gap and leads to no question. A context sentence has to narrow towards this study's question. |
    | We found that one woman in four was overweight or obese. | Introduction | Results | The introduction carries no data or conclusions from the work being reported. |
    | Some of the women we approached declined to be weighed. | Methods | Results | It was learnt during the study. The methods hold only what was known when the protocol was written. |
    | We planned to compare women in urban and rural blocks. | Results | Methods | It was decided before the data came in. |
    | Women in urban blocks were more often overweight or obese than women in rural blocks. | Discussion, paragraph 3 | Results, as a subheading; and again in Discussion, paragraph 1, as part of the answer | It is a finding. It is also part of the answer, so the discussion opens with it. |
    | Our survey covered one district, so it cannot speak for the state. | Results | Discussion | It is a limit on how far the answer reaches. |
    | A district programme for this would pay for itself. | Discussion | nowhere, unless the paper has cost data | A claim about money needs data on money. |
    ```

    Two of these moves surprise people. The first is the women who declined. It feels like a fact
    about method, but you learnt it while doing the study. ICMJE's Recommendations (the
    International Committee of Medical Journal Editors, section IV.A.3.d, at
    https://www.icmje.org/recommendations/browse/manuscript-preparation/preparing-for-submission.html)
    put everything obtained during the study in the results. A reader can then see what you
    planned and, separately, what happened.

    The second is the finding that appears twice. The results state it with its numbers. The
    discussion's first paragraph states it again, briefly, as the answer to the question the
    introduction asked. That is the one repetition the argument needs.
  analogy_breaks_when: |
    The sorting rule for methods and results follows ICMJE's general requirement. A journal's own
    instructions, or a reporting guideline for one kind of study, may ask for a particular item in
    a particular section; follow them where they speak. Reporting guidelines are taught in the
    course's book on protocols, reporting standards and research ethics.

    Some sentences do two jobs, as the urban-rural finding does. The test is the job the sentence
    does where it stands, not its topic.
must_know:
- point: |
    Write the outline before the prose: one sentence for each planned paragraph, each sentence the
    claim that paragraph makes. Then read the sentences alone. If they do not take a reader from
    your question to your answer, fix them there. Fixing a sentence takes a minute. Fixing a
    finished section means throwing away paragraphs you worked hard on.
  kind: move
  bearing: methodological
  refs: [mensh_kording_2017_structuring_papers]
- point: |
    An introduction that reviews everything known about obesity buries the gap. Keep only the
    references that lead to your question; ICMJE asks for directly pertinent references only. A
    reader should be able to underline the sentence that names the gap, and the one that states
    your question.
  kind: trap
  bearing: methodological
  refs: [icmje_2026_manuscript_preparation, mensh_kording_2017_structuring_papers]
- point: |
    The two sources this book follows disagree on how an introduction ends. Mensh and Kording's
    last paragraph summarises the results. ICMJE says to state the study's purpose and not to
    include data or conclusions from the work being reported. For a medical journal that follows
    ICMJE, end on the question or research objective. Then read the journal's instructions, which decide.
  kind: dispute
  bearing: methodological
  refs: [mensh_kording_2017_structuring_papers, icmje_2026_manuscript_preparation]
- point: |
    The methods hold what you knew when you wrote the protocol. How many people declined, who was
    excluded once the data came in, and anything you changed along the way are results. Keep them
    there. A reviewer needs to see what you planned separately from what happened.
  kind: trap
  bearing: methodological
  refs: [icmje_2026_manuscript_preparation]
- point: |
    Give the results subheadings that state findings, not topics: "Urban women were more often
    overweight or obese than rural women", not "Urban-rural comparison". Open each results
    paragraph with the question it answers and end it with the answer. A reader who doubts one
    conclusion can then find the one paragraph to check.
  kind: move
  bearing: methodological
  refs: [mensh_kording_2017_structuring_papers]
- point: |
    "The discussion begins with background and other people's studies" is the error. Begin with
    your main finding, briefly, as the answer to your question. Explanations, comparison with other
    evidence, limits and meaning follow, in that order.
  kind: misconception
  bearing: methodological
  refs: [icmje_2026_manuscript_preparation, mensh_kording_2017_structuring_papers]
- point: |
    Claim no more than your data carry. A prevalence survey cannot say that a programme will save
    money unless the paper contains cost data and their analysis. A new idea the data suggest is
    written as a hypothesis, and labelled as one. When you sit on a committee, read a paper's last
    paragraph against its results before you quote it.
  kind: consequence
  bearing: policy
  refs: [icmje_2026_manuscript_preparation]
- point: |
    "Stating limitations weakens the paper" is the error. A limitation you leave out is still
    there. A reviewer who finds it will ask about it, and Mensh and Kording's sign of a weak
    discussion is a reader left holding unanswered criticisms. Name each limit, say which way it
    could push the answer, and say what would settle it.
  kind: misconception
  bearing: methodological
  refs: [mensh_kording_2017_structuring_papers, icmje_2026_manuscript_preparation]
- point: |
    The structure shows the logic; it cannot add evidence. If an outline sentence has no data
    behind it, either cut the claim or get the data. Better paragraphs will not fill that gap, and a
    clear paper makes a missing step easier for a reviewer to see.
  kind: boundary
  bearing: methodological
  refs: [mensh_kording_2017_structuring_papers]
common_misreading: |
  "My paper has an Introduction, Methods, Results and Discussion, so it is structured." The four
  headings are containers. A paper can carry all four and still be a diary of what was done. Its
  introduction never names a gap. Its results list tables. Its discussion opens with other
  people's studies. The structure that matters is the chain inside the headings: the gap, the
  question, the evidence in steps, the answer and its limits.
reporting_sentence: |
  This analysis compared the share of adults aged 15-49 in India who were overweight or obese in
  NFHS-4 (2015-16) and in NFHS-5 (2019-21). It also compared urban and rural areas in NFHS-5.
figure_note: "The section teaches the order of moves in a paper; a chart would have to plot made-up numbers, and the outline table already lays the moves out in reading order."
exercises:
- type: retrieval
  prompt: |
    Without looking back: give the one job of each of the four main sections in a sentence each.
    Then say in which section the number of people who declined to take part belongs, and why.
  answer: |
    Introduction: move from what is known to the gap, and end on the study's question, research
    objective or hypothesis.

    Methods: say how and why the study was done. Give enough detail to judge it and, with the
    data, to reproduce it. Include only what was known when the protocol was written.

    Results: the findings as a sequence of claims, each with its data, the main findings first.

    Discussion: open with the main finding, as the answer. Then give possible explanations, the
    other evidence, the limits, and what it means, claiming no more than the data carry.

    The number who declined goes in the results. It was learnt during the study, and ICMJE puts
    everything obtained during the study there.
  confidence_first: true
- type: critique
  prompt: |
    Here is the first paragraph of the discussion in an invented paper on a survey of
    overweight among adults in one rural block.

    > Obesity is a major public health problem in India and the world. Several studies from
    > different states have reported different levels of overweight. Our study was conducted in a
    > rural block of Chhattisgarh. Table 2 shows the distribution of body mass index by age group.
    > Further research is needed.

    Say what is wrong with it. Then rewrite it so that it does the first paragraph's job. Where
    you need the study's own results, write a labelled blank rather than a number.
  answer: |
    It never answers the question. The first two sentences are background, which belongs in the
    introduction, if anywhere. The third repeats the methods. The fourth points to a table instead
    of saying what the table shows. The last sentence asks for more research without saying what
    research, or why. A reader finishes the paragraph not knowing what the study found.

    A rewrite opens with the answer and makes one point:

    1. "In this rural block, [the share of adults overweight or obese, with its count and
       denominator]."
    2. "It differed between [the groups the paper set out to compare, with their numbers]."
    3. "This is [above, below or close to] the rural figure for the state in NFHS-5 (reference)."
    4. "It adds [what this answer adds to what was known]."

    Every bracket is filled from the paper's own results or from a cited source. The explanations,
    limits and the "further research" go in later paragraphs. Each of those names the specific
    question that remains open.
  skill_ref: S58-R1-K01
- type: design
  prompt: |
    Take the manuscript or thesis section you chose to rewrite for this book. Write its outline:
    one sentence for each planned paragraph, each sentence the claim the paragraph will make.
    Then read the sentences alone and answer three questions. Where is the gap? Which sentence
    answers the question? Which claims have no data or reference behind them yet?
  answer: |
    Judge your outline with four checks.

    - Every sentence is a claim. A sentence such as "Table 2" or "Sociodemographic profile" is a
      topic. Rewrite it as what the table shows.
    - The introduction's sentences narrow to one gap, and its last sentence states the question,
      research objective or hypothesis.
    - Each results sentence answers part of that question, in an order where later sentences
      lean on earlier ones. Nothing learnt during the study sits in the methods.
    - The discussion's first sentence answers the whole question. A later sentence names each
      limit and which way it could push the answer.

    Mark every claim that has no data or reference behind it yet. Those marks are your work list.
    Do not write the paragraphs until the list is empty or the claims are cut.
- type: teaching
  prompt: |
    A first-year resident shows you the introduction to her draft paper. It runs to four pages and
    reviews obesity from its definition to its complications, worldwide and in India. Ten minutes,
    with a whiteboard: explain what an introduction is for, and how she should cut hers.
  answer: |
    Draw a funnel on the board. At the top write what is known; below it, what is not known; at
    the bottom, her question. An introduction is that funnel and nothing else. It earns the reader's
    attention by showing a gap that matters, then says what the study asks about it.

    Then work through her four pages with her. For each paragraph, ask one question: does this
    lead to the gap? The definition of obesity and its complications do not, unless her question
    is about them. A sentence on worldwide trends usually does not. What leads to the gap is what
    is known about her exact question, and the specific thing nobody has measured.

    Tell her what ICMJE asks: directly pertinent references only, and no data or conclusions from
    her own study. Her last paragraph states the research objective. Mensh and Kording's own example
    narrows to its gap in three paragraphs: the field, the subfield, then the untested idea. The
    cut pages are not wasted. Whatever is needed to explain her
    findings goes to the discussion, and the rest goes into a file of her notes.
retrieval_items:
- q: Where does information learnt during a study, such as how many people declined, belong in a paper?
  a: In the results. ICMJE puts in the methods only what was known when the protocol was written.
- q: What does the first paragraph of a discussion do?
  a: It states the main findings briefly, as the answer to the question the introduction asked.
- q: What is an outline, in this book?
  a: The argument written before the prose, one sentence for each planned paragraph, each sentence the claim that paragraph will make.
- q: On how an introduction ends, where do Mensh and Kording and ICMJE differ?
  a: Mensh and Kording's last paragraph summarises the results; ICMJE says to state the purpose and not to include data or conclusions from the work. For a medical journal, end on the question, and follow the journal's instructions.
