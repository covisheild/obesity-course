simplified_explanation: |
  Book 0 taught you two ways to get a sample. A random sample lets chance pick who is in it. A
  convenience sample takes whoever is easy to reach. A qualitative study uses a third way. You choose
  people on purpose, for what they can tell you.

  Suppose you want to know why patients stop coming to a clinic. The people who can tell you are the
  ones who stopped, so you go and find them. You choose some who live far away and some who live
  near, men and women, younger and older. You are after the widest spread of reasons, not an average.

  That choice has a price. Say seven of your twelve respondents, the people who answer, mention the
  bus fare. That does not mean 58 per cent of patients stop because of the fare. You might have picked
  more people from far villages. Pick differently, and the seven changes.

  What the study can claim is different, and it is still worth having. It can say what the reasons
  are, how each one works, and how they connect. A reader in another district can take that idea and
  test it against their own clinic.

  So a qualitative study is not judged by how many people it asked. Ask three things instead. Did the
  authors say how they chose people, and why? Did they say how they gathered and read what was said?
  Did they look for people whose story did not fit, and report them?
illustrations:
- body: |
    Here is a plan that fails, in the made-up clinic from the last section. You have one Tuesday free.
    You decide to interview whoever is in the waiting room that morning. It is easy, and the patients
    are right there.

    Now ask who is in that room. Every one of them came back. The people you want to hear from, the
    ones who stopped, are exactly the people who are not there. This convenience sample has left out
    the whole question.

    So build the group on purpose. Open the clinic register. Mark the adults with obesity who came once
    or twice and then missed their next date. From those, choose people who differ in the ways you
    suspect might matter. Write your reason beside each choice.

    ```table
    | Choose some who... | Because... |
    | live more than an hour away | travel may be one reason |
    | live within walking distance | if they stopped too, travel is not the whole story |
    | look after small children or older relatives | a clinic day may cost them more than the fare |
    | work for a daily wage | a clinic day may be a day's pay lost |
    | came only once | the first visit itself may have put them off |
    | came several times, then stopped | something may have changed later |
    ```

    Look at the second row. You chose those people because their story might break your first guess.
    Mays and Pope count this as one of the tests of a good qualitative study: looking for the case that
    contradicts the explanation, and discussing it.

    Keep the table. That written record of whom you chose, and why, is part of the study. A reader
    judging it will ask for it first.
  analogy_breaks_when: |
    The register helps only if the clinic keeps one and it is complete. Patients who never gave a
    working phone number or address cannot be found this way, and they may have the most to tell you.
    Say so in your account of how you chose people, so a reader knows who could not be reached.
  numbers: []
- body: |
    Now suppose you have interviewed twelve people chosen this way. The numbers here are made up. Seven
    of the twelve talked about the bus fare. A first draft of your report says: "58 per cent of patients
    stop coming because of the fare." Check the arithmetic first.

    ```working
    7 divided by 12 = 0.5833333333
    0.5833333333 times 100 = 58.33333333
    ```

    The arithmetic is right. The claim is still wrong. Lay it out the way Book 0's section on argument
    taught.

    - *Premise:* seven of these twelve respondents talked about the fare.
    - *Conclusion:* 58 per cent of the clinic's patients stop because of the fare.

    The inference needs a premise nobody wrote down: that the twelve stand for the clinic's patients in
    known proportions. They do not. You chose them, and you chose several from far villages on purpose.
    Suppose you had also chosen two more people from within walking distance, and neither mentioned the
    fare.

    ```working
    7 divided by 14 = 0.5
    ```

    The clinic has not changed. The share has, because your choice changed. So the share describes your
    choice, not the clinic. Pope, Ziebland and Mays make the same warning: results written as relative
    frequencies may mislead when the sample was never meant to be representative.

    Here is what the twelve can support. The fare came up often, and you can say how it works. In the
    made-up interviews, one woman explains she pays it twice, for herself and for the grandchild she
    cannot leave at home. And one respondent, R11, lives ten minutes' walk away and stopped too. She
    says she was weighed in the corridor, where other people could see. That case does not fit "the
    fare". You keep it and report it. It shows distance is not the whole story, and it names a reason
    no count of the first answers would have found.

    If a decision needs to know how common the fare is as a reason, say to budget for bus passes, that
    is a how-many question again. It needs a count from a random sample, or from the whole register.
  analogy_breaks_when: |
    Counts are not forbidden in a qualitative report. Authors sometimes write "most respondents", or
    give a simple count as a summary of what they heard. Read such a count as a description of the
    group they chose, never as a rate for the population.
  numbers: []
must_know:
- point: |
    A count of respondents is not a rate. "Seven of twelve mentioned the fare" describes the twelve you
    chose.
  kind: misconception
  bearing: methodological
- point: |
    When you read a qualitative study, find the account of how people were chosen before you read the
    findings.
  kind: move
  bearing: methodological
- point: |
    A reviewer trained on trials will ask for your sample-size or power calculation. There is none to
    give, because the study does not estimate a rate.
  kind: trap
  bearing: methodological
- point: |
    A small number is not, by itself, a weakness in this kind of study.
  kind: number
  bearing: methodological
  refs:
  - dejonckheere_vaughn_2019
- point: |
    The easiest people to reach can be the ones your question is not about.
  kind: consequence
  bearing: clinical
- point: |
    A qualitative study tells you which reasons exist and how they work among the people you chose. It
    cannot tell you how common any reason is. If a budget or a target depends on "how many", ask for a
    count from a random sample or a complete register.
  kind: boundary
  bearing: policy
- point: |
    When a trainee writes percentages into the results of an interview study, have them replace each
    one with what was said and how it works. Then have them add the case that did not fit.
  kind: move
  bearing: teaching
exercises:
- type: critique
  prompt: |
    Here is a made-up newspaper line. "A study interviewed 15 women with obesity in Raipur. It found that
    60 per cent avoid clinic visits because of long waiting times."

    Say what is wrong with the sentence, and rewrite it so that it claims only what an interview study
    can support.
  answer: |
    First the arithmetic behind the 60 per cent.

    ```working
    60 divided by 100 = 0.6
    0.6 times 15 = 9
    ```

    So nine of the fifteen women spoke about waiting times. That count is probably right. What is wrong
    is the move from nine women to "60 per cent avoid clinic visits". The fifteen were chosen for what
    they could say, not drawn at random from women with obesity in Raipur. Choose fifteen others and
    the nine changes. So the share describes the choice, not the city.

    Here is a rewrite that claims only what the study can support. "In interviews with 15 women with
    obesity in Raipur, long waits at the clinic came up as one reason for staying away. The women described how
    the wait costs them: [what they said]. Some gave other reasons." The rewrite names the reason and
    how it works. It says who was asked. It makes no claim about how common the reason is.
- type: design
  prompt: |
    You want to know why men with obesity in your district stop coming to follow-up at an NCD clinic.
    Write the list of the kinds of men you would choose to interview, at least five, with one line on
    why you chose each. Then say which row is there because it might break your first guess.
  answer: |
    One reasonable list, made up for this answer; others are as good if each row has a reason.

    ```table
    | Choose some who... | Because... |
    | work for a daily wage | a clinic day may be a day's pay lost |
    | have salaried jobs with fixed hours | the clinic's hours may clash with work |
    | live more than an hour away | travel may be a reason |
    | live close to the clinic | if they stopped too, travel is not the whole story |
    | came once only | the first visit may have put them off |
    | came for months, then stopped | something may have changed later |
    ```

    The row that might break a first guess is the men who live close by. If you expect distance to
    explain most of it, these men are where you will find out whether it does not. Mays and Pope call
    searching for such contradicting cases one of the tests of a good study.

    Notice what the list is not. It is not a random sample, and it will not tell you what share of men
    stop for each reason. It is built to find the range of reasons.
- type: teaching
  prompt: |
    A health secretary has asked for one page. A qualitative study of 20 patients found that bus fares
    keep some of them from the clinic. An officer wants to use "14 of 20 said fares" to size a bus-pass
    budget for the whole district. Write the page: answer first.
  answer: |
    Answer first: do not use "14 of 20" to size the budget. Use the study to decide what to count, and
    count it.

    Why: the 20 patients were chosen on purpose to cover a range of situations, not drawn at random.
    Fourteen of twenty is 70 per cent of that chosen group.

    ```working
    14 divided by 20 = 0.7
    ```

    A different choice of 20 would give a different share. The figure tells you about the choice, not
    about the district.

    What the study does give you is worth having. It shows that fares are a real reason. It shows how they
    work: for example, whether patients pay for a companion too, or lose a day's wage as well. That
    tells you what a bus pass would need to cover.

    What to do: add one question on fares to the clinic's follow-up call, or check a random sample of
    patient files, and count. That count sizes the budget. What it costs is staff time on calls and files, not a new study.
quantitative: false
retrieval_items:
- q: How are people chosen for a qualitative study, and how is that different from a random or a convenience
    sample?
  a: On purpose, for what they can tell you about the question, to cover the full range of cases. A random
    sample lets chance choose; a convenience sample takes whoever is available.
- q: Why is "7 of 12 respondents said X, so 58 per cent of patients..." wrong?
  a: The twelve were chosen, not drawn at random, so their make-up does not match the population in known
    proportions; a different choice gives a different share.
- q: Name three tests a qualitative study is judged by, instead of its sample size.
  a: A clear account of how people were chosen and how data were gathered and analysed; a search for cases
    that do not fit, reported; several perspectives, so one group is not presented as the whole truth.
