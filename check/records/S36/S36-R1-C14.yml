definition:
  text: |
    A pilot interview is a practice run of the whole procedure of an interview study, done with a
    few people before the study proper. It tests the topic guide and the interviewer, and it is your
    first real use of the recorder and the consent talk. It does not test an answer to the study
    question.

    The task that finishes this level of the subject is five pilot interviews. Before the first,
    get an ethics committee's written answer (`S36-R1-C07`). Then each pilot runs the same seven
    steps, in order.

    1. Consent, including separate agreement to be recorded.
    2. The recorded interview.
    3. Field notes, written the same day, before you listen to the recording.
    4. A transcript.
    5. A first reading, with rough codes and a memo.
    6. The interviewer's talk share.
    7. A revised topic guide, before the next interview.
  references:
