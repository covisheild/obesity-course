simplified_explanation: |
  Everything in this book so far comes together here, in five practice interviews that you run
  yourself.

  A pilot is a practice run. You are not yet finding out why patients stop coming to a clinic. You
  are finding out whether your questions work, whether your recorder works, whether your consent
  talk is clear, and whether you can listen without steering. The thing under test is you and your
  topic guide.

  Choose five people you can reach who know the topic from their own lives. Do not choose your own
  patients. A patient may worry that what they say will change their care. They may then tell you
  what they think you want to hear (the section on the interviewer as part of the data).

  Each pilot runs the same seven steps, in this order.

  1. Consent, with a separate yes to the recording (the section on consent, recording and privacy).
  2. The interview, recorded.
  3. Field notes, written straight after, before you speak to anyone else.
  4. The transcript, typed from the recording, with speaker labels and no names.
  5. A first reading: rough codes in the margin, and a memo (the section on reading a transcript).
  6. Your talk share: your words divided by all the words (the section on the talk share).
  7. A revised topic guide, ready for the next interview.

  Then look across the five. Which questions fell flat every time? Where did you lead? Is your share
  of the words falling as you get better at waiting? The transcripts answer these questions. Your
  memory of the interviews does not.

  Keep the five transcripts safely, on the terms each person agreed to. The next rung builds its
  analysis on them.
illustration:
  body: |
    Here is how five pilots might go. Everything below is made up: the people, the counts and the
    changes. It is a different set from the one in the section on the talk share, because here the
    point is what changes between pilots. The topic is the one this book has used throughout, why adult patients with obesity stop
    coming back to a district hospital clinic in Chhattisgarh.

    Start with the failure. After pilot 1 you count the words in the transcript. You said 1,150 words
    and R1 said 1,350. Your share is your words divided by all the words.

    ```working
    1,150 plus 1,350 = 2,500
    1,150 divided by 2,500 = 0.46
    0.46 times 100 = 46 per cent
    ```

    Your share is 46 per cent. That is under half, so the respondent spoke more than you. But only
    just, and the transcript shows why. You asked "Don't you find the clinic timings difficult?" and
    R1 said "Yes." Later you spent two minutes explaining why the clinic wants monthly visits. That is
    advice, not listening (the section on running the interview without leading it).

    So you change two things before pilot 2. The timings question becomes "Tell me about a clinic
    day, from when you leave home." And you write at the top of your guide: do not explain the
    clinic.

    Pilot 2 goes better, at 38 per cent. But the transcript shows R2 going quiet after "Why did you
    stop coming?" She heard it as blame (the section on open, closed and leading questions). It
    becomes "What was happening around the time you stopped coming?"

    Here are all five, with the share worked the same way each time.

    ```table
    | Pilot | Your words | Respondent's words | All words | Your share (per cent) |
    | 1 | 1,150 | 1,350 | 2,500 | 46 |
    | 2 | 950 | 1,550 | 2,500 | 38 |
    | 3 | 780 | 2,220 | 3,000 | 26 |
    | 4 | 600 | 2,400 | 3,000 | 20 |
    | 5 | 1,290 | 1,710 | 3,000 | 43 |
    ```

    The share falls across the first four pilots, from 46 per cent to 20. Then pilot 5 jumps back to
    43 per cent. Before you decide what that means, read the transcript.

    R5 is a man in his forties who answers in short lines. Each time he stopped, you filled the
    silence with a new question. Your guide did not break. You stopped waiting. The change for next
    time is the pause: ask, then wait, and let the silence do the asking (the section on running the
    interview).

    Pilot 3 also had a question that fell flat. "What does the clinic do for you?" drew one-word
    answers. You replaced it for pilot 4 with "Tell me about the last visit that felt worth the
    trip."

    Now plan the time honestly. Pope, Ziebland and Mays put one typical interview at several hours to
    transcribe, and 20 to 40 pages of single-spaced text. Five pilots are five of those, plus
    the reading and the memo after each. Space them so that each transcript is read before the next
    interview. If you run all five in one week and read them afterwards, pilots 2 to 5 cannot learn
    from pilot 1.
  analogy_breaks_when: |
    A falling share shows only that you spoke less. It does not show that you led less. A
    respondent can talk at length in answer to a leading question, and your share will look fine
    (the section on the talk share). Read the transcript for the questions themselves.

    The five made-up shares are one interviewer's practice. They say nothing about how much any
    interviewer should expect to talk, and nothing about why patients stop coming. Nothing a pilot
    finds about the clinic is a finding. It is a question to ask properly in the study itself.
  numbers:
  - value: '20'
    unit: pages of single-spaced text from one typical interview (lower end)
    citekey: pope_ziebland_mays_2000
    quote: transcribing a typical single interview takes several hours and can generate 20-40 pages of single spaced text.
  - value: '40'
    unit: pages of single-spaced text from one typical interview (upper end)
    citekey: pope_ziebland_mays_2000
    quote: transcribing a typical single interview takes several hours and can generate 20-40 pages of single spaced text.
must_know:
- point: |
    A pilot tests your guide and you, not the study question. Do not report what five pilot
    respondents said as the reason patients stop coming. Five people chosen because you could reach
    them tell you which questions work, and what to ask properly later.
  kind: misconception
  bearing: methodological
- point: |
    Do not pilot on your own patients. A patient may fear that answers will change their care, and
    tell you what the clinic wants to hear. If a patient of yours does take part, tell them plainly
    that nothing they say will affect their care.
  kind: trap
  bearing: clinical
  refs:
  - dejonckheere_vaughn_2019
- point: |
    Transcribe and read each pilot before the next one. The point of five pilots is that each
    changes the next. If you run them all and read them afterwards, you have done one pilot five
    times.
  kind: move
  bearing: methodological
  refs:
  - dejonckheere_vaughn_2019
- point: |
    When your talk share moves, read the transcript before you explain it. A rise can mean you
    stopped waiting, or that one respondent speaks briefly. The fix differs, and only the lines on
    the page tell you which it was.
  kind: move
  bearing: methodological
- point: |
    Listen to your own recording for four things. How much you steered. Whether you asked leading
    questions. Whether you picked up what the respondent offered. Whether you gave them time to say
    what they meant. Then ask someone else to listen to one recording with you.
  kind: move
  bearing: teaching
  refs:
  - britten_1995
- point: |
    Keep a dated copy of your topic guide after every pilot, with a line saying what changed and
    why. A trainee who shows you only the final guide cannot show you what the pilots taught.
  kind: consequence
  bearing: teaching
- point: |
    You plan to keep the transcripts for the next rung's analysis. So say so when you take consent,
    and keep them only if the person agrees. The research ethics guidelines taught earlier (the
    section on consent) say what consent must cover. They do not settle, for you, whether your
    practice interviews need review. Ask your own institution's ethics committee before the first
    pilot, and keep its answer in writing.
  kind: boundary
  bearing: methodological
exercises:
- type: build
  prompt: |
    Conduct five pilot interviews on a topic you can reach respondents for. The clinic question used
    in this book is one choice. Do not use your own patients.

    For each interview, produce seven things.

    - The consent record, kept without names.
    - The recording.
    - Field notes written the same day.
    - A transcript with speaker labels and no names.
    - Your codes and a memo.
    - Your talk share, with the working.
    - The topic guide you will use next, with a line saying what changed and why.

    Then write one page across all five. Which questions fell flat? Where did you lead? How did your
    talk share move, and what does each transcript say about why?
  answer: |
    There is no single right set of transcripts. The work is judged by what it contains, so check
    it against this list.

    1. Five consent records, each with a separate yes to recording and to keeping the transcript.
       Your ethics committee's written answer is filed with them.
    2. Five transcripts, labelled I and R1 to R5, with no names or places that identify anyone.
    3. Field notes dated the day of each interview.
    4. Codes and a memo for each transcript, written before the next interview. The dates show
       this.
    5. A talk share for each interview, worked as your words divided by all the words, times 100.
       The gate for this rung is met when the respondent spoke more than you, that is when your
       share is under 50 per cent. Aim well under.
    6. Five dated versions of the topic guide, each with its change and its reason.
    7. The one-page reading across the five. It names at least one question you changed. It names
       one place you led, and what you did about it. And it explains each rise in your share from
       the transcript, not from memory.

    If your share never fell below half, do not run a sixth interview straight away. Listen to your
    recordings first, then find the places where you explained, agreed, or asked a second question
    before the first was answered. Fix those, then run the next one.
  skill_ref: S36-R1-K01
- type: design
  prompt: |
    Here is a question from a made-up first-draft topic guide for the clinic study, and the lines it
    produced in pilot 1, translated from Hindi.

    ```table
    | Speaker | Words |
    | I | Do you think the clinic should give appointments, so people don't have to wait all day and lose work? |
    | R1 | Yes, that would be good. |
    ```

    Say what went wrong, and rewrite the question, with two probes, for pilot 2.
  answer: |
    The question does three things wrong at once.

    It is closed: it can be answered "yes", and was. It is leading: it names the answer it expects,
    waiting and lost work, before R1 has said anything about either. And it is a double question,
    asking about appointments and about waiting in one breath. Her "yes" tells you only that she
    agreed with you.

    A rewrite for pilot 2:

    > Tell me about your last clinic day, from when you left home to when you got back.

    Two probes to write under it, to use only if they are needed:

    - "You mentioned [her words]. Tell me more about that."
    - The pause: wait, and say nothing, when she stops.

    Neither probe names waiting or work. If the wait matters to her, she will bring it up, and then
    it is her account rather than yours.
  skill_ref: S36-R1-K02
- type: critique
  prompt: |
    A trainee reports after five pilots: "Four of my five respondents said the clinic is too far.
    So the pilots show distance is the main reason people stop. My talk share was 45, 44, 47, 46
    and 45 per cent, so I passed the gate." What would you say?
  answer: |
    Two separate problems.

    The first is the claim about distance. A pilot tests the guide and the interviewer, not the
    study question. Five people chosen because they could be reached cannot show the "main reason"
    anyone stops. "Four of five" also describes only those five (the section on who you talk to).
    What the pilots do give is a question worth asking properly: is distance the reason, or the
    first thing people mention? And were the answers about distance given to an open question, or to
    one that named it?

    The second is the share. Every figure is under 50 per cent, so the gate is technically met. But
    the share never fell, which means the pilots did not change the interviewing. Five pilots at a
    steady 45 per cent is one interview done five times. Ask for the transcripts and the guide
    versions. Then look for what the trainee changed between pilots, and where they explained,
    agreed or led.
  confidence_first: true
retrieval_items:
- q: What does a pilot interview test?
  a: The topic guide, the recording, the consent talk and the interviewer, not an answer to the study question.
- q: Name the seven steps each pilot runs through.
  a: Consent with a separate yes to recording; the recorded interview; field notes; the transcript; a first reading with codes and a memo; the talk share; a revised topic guide.
- q: Why transcribe and read each pilot before running the next?
  a: So that each pilot changes the next; read all at the end and you have run one pilot five times.
