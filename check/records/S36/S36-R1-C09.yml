simplified_explanation: |
  People answer the person in front of them. Many patients will say what they think the doctor would
  like to hear. The same patient, talking at home to someone with no link to the clinic, may say
  something quite different.

  Age, sex, class, the job you do and the clothes you wear all tell the person something about you.
  So does the place. A consultation room and a kitchen draw out different stories.

  So it is bias: an error that points one way and does not shrink when you collect more. Twenty
  interviews by the clinic's own doctor do not cancel it. They repeat it twenty times.

  What you can do is make the pull weaker, and make it visible. Say who you are and who you are not.
  Promise, truthfully, that nothing said will reach the clinic. Interview where the person is at
  ease. Then write down who you were to them, so that anyone reading your transcripts can judge.
illustrations:
- body: |
    Here are two made-up answers from the running example, translated from Chhattisgarhi. They show
    the direction of the pull. They are not a measurement of it. Suppose two different interviewers
    each talk to R3, a woman with obesity who stopped coming to the district hospital's NCD clinic.

    In the first, the clinic's own medical officer asks, in her white coat, in the consultation room,
    during clinic hours.

    ```table
    | Speaker | Words |
    | I | Tell me about coming to this clinic. |
    | R3 | The clinic is very good, doctor. Everyone is kind. We get busy at home, that is all. |
    ```

    In the second, a researcher with no job at the hospital asks the same question in R3's kitchen.
    Earlier, the researcher said: "I do not work at the clinic, and nothing you say will go back to
    them."

    ```table
    | Speaker | Words |
    | I | Tell me about coming to this clinic. |
    | R3 | The last time, the doctor said if I do not lose weight there is no point coming. In front of the others. After that I did not want to go. |
    ```

    Read the first answer with Britten's sentence in mind: a patient "may wish to please the doctor".
    Praise, and a reason that asks nothing of the clinic, is what that pull would produce. It may also
    be true. You cannot tell from the answer alone. That is exactly the difficulty.

    Now suppose the medical officer interviews twenty patients the same way. Each of the twenty meets
    the same person, the same coat and the same room. The pull is in every interview. So the twenty
    answers do not scatter around the truth and average out. They lean the same way together. That is
    Book 0's systematic error, which more readings on the same instrument do not remove.
  analogy_breaks_when: |
    The two answers are invented to show a direction, and the second is not "the truth" just because
    it is critical. An interviewer from outside the clinic brings their own pull. A respondent may,
    for example, tell a stranger a harsher story than the one they live with. Moving the interview
    changes the push. It does not remove it.
- body: |
    Now suppose you are the one with the white coat. You are a doctor at this hospital, and your five
    pilot interviews will be with people who know the clinic. Here is what you can do about the pull
    at this stage.

    Do not interview your own patients if you can avoid it. Britten says so directly. If you cannot
    avoid it, tell them in plain words that they may say what they really think. Then do not correct
    them when they say something you believe is wrong.

    Take off the coat. Say who you are and who you are not before the first question: "I am a doctor
    here, but today I am not your doctor. Nothing you tell me will change your care, and the clinic
    will not know who said what." DeJonckheere and Vaughn advise telling people that their answers
    will not influence their care.

    Choose the place with them. Britten notes that the setting changes what is said, and that home is
    usually better. At home, notice who else can hear.

    If you need an interpreter, choose with the same care. The ICMR guidelines advise against using a
    person from the respondent's own village, "keeping in mind the hierarchies existing in the context".

    Then write field notes about yourself, the same day. A made-up example:

    ```table
    | Field note | Why a reader needs it |
    | I am a doctor at the district hospital, though not in the NCD clinic. R3 knew this. | Her answers may lean towards what a doctor wants to hear. |
    | We sat in her kitchen. Her husband came in for the last ten minutes. | She may have said less once he could hear. |
    | I said "that must be hard" twice about the bus fare. | That line is agreement, not a neutral probe. |
    ```

    This is what Mays and Pope call reflexivity: showing how you and your methods may have shaped
    the data, so a reader can judge it.
  analogy_breaks_when: |
    These steps weaken the pull and record it. They cannot tell you how much of any one answer it
    shaped. Some pulls, such as the power differences the ICMR guidelines note between researchers and
    participants in India, run deeper than a removed coat. They are the subject of the second rung of
    this book.
must_know:
- point: |
    Doing more interviews does not average out the interviewer. To change it, change the interviewer
    or the setting. Adding interviews will not.
  kind: misconception
  bearing: methodological
- point: |
    A run of praise from patients interviewed by their own clinic's staff is not evidence that the
    clinic is liked. Before you accept such a finding, ask who did the interviews and where.
  kind: trap
  bearing: methodological
  refs:
  - britten_1995
- point: |
    Do not interview your own patients for research if you can avoid it.
  kind: move
  bearing: clinical
  refs:
  - britten_1995
- point: |
    Before the first question, say who you are and who you are not. Say that nothing the person says
    will change their care.
  kind: move
  bearing: clinical
  refs:
  - dejonckheere_vaughn_2019
- point: |
    Write field notes about yourself, not only about the respondent. Record who you are to them, where
    you sat, who else could hear, and any moment you steered. You cannot report what you did not write
    down.
  kind: consequence
  bearing: methodological
  refs:
  - mays_pope_2000
- point: |
    In India, power differences make it hard for people to refuse a researcher outright, as the ICMR
    guidelines note. Expect more agreement than people feel.
  kind: india_deviation
  bearing: clinical
  refs:
  - icmr_ethical_guidelines_2017
- point: |
    None of the sources this section rests on puts a size on the interviewer's effect. When a
    finding depends on it, the check is to compare what different interviewers heard, which is
    second-rung work.
  kind: boundary
  bearing: methodological
  refs:
  - britten_1995
  - mays_pope_2000
exercises:
- type: interpretation
  prompt: |
    A made-up report on the NCD clinic says: "All 12 patients interviewed by the clinic's diabetes
    educator said they were satisfied with the service. Missed follow-up is therefore not due to
    dissatisfaction." Say what this finding shows, what it does not show, and what you would ask
    first.
  answer: |
    It shows what 12 patients said to a member of the clinic's own staff. That is a real finding about
    those conversations.

    It does not show that the patients are satisfied, and still less that dissatisfaction plays no
    part in missed follow-up. A patient talking to clinic staff may, in Britten's words, wish to give
    the responses they think the staff want. That pull runs in the same direction in all 12
    interviews, so the uniform answer is what bias would produce, not evidence against it. Twelve out
    of twelve is agreement, not confirmation.

    Ask first: who did the interviews, and where? What were people told about whether their answers
    would reach the clinic? Were they current patients of the person asking? Are there field notes on
    the interviewer's role? Then ask whether anyone without a link to the clinic spoke to people who
    had stopped coming. They are the people the question is about.
- type: design
  prompt: |
    Plan the part of your five pilot interviews that deals with who you are. Write the two or three
    sentences you will say about yourself before the first question. Then write the headings of the
    field notes you will fill in about yourself after each interview.
  answer: |
    The opening sentences should say who you are, who you are not, and what happens to the answers.
    For example: "I am training in research at the medical college. I do not work in this clinic, and
    I am not anyone's doctor here. Nothing you tell me will change your care, and the clinic will not
    know who said what." If you do work at the clinic, say so. A hidden role that comes out later
    does more damage than one stated at the start.

    Headings for the field notes about yourself might be:

    - who I am to this person: job, age, sex, anything they knew about me;
    - what I wore, and where we sat;
    - who else was in the room or could hear, and when;
    - moments I agreed, advised, corrected or steered, with the time on the recording;
    - anything the person seemed to say for my benefit.

    Compare the headings across your five interviews. If the same heading keeps filling up, that is a
    habit of yours, and it is in all five transcripts.
  skill_ref: S36-R1-K01
- type: teaching
  prompt: |
    A journalist has three minutes. A hospital has told them: "Our interviews show patients love the
    NCD clinic." Help them decide what to ask the hospital, with no jargon.
  answer: |
    One quotable line: "What people tell you depends on who is asking."

    If the clinic's own doctors or staff did the interviews, patients had good reasons to be polite.
    Their care depends on those people. So praise in those interviews is what you would expect,
    whether or not patients are happy.

    Ask the hospital three things. Who did the interviews? Were the people interviewed told that
    nothing would get back to the clinic? And did they talk to people who stopped coming, not only to
    people who still come?

    Be fair to the hospital too. Friendly interviews are not proof of a cover-up. They just cannot
    prove that patients are happy. How much the interviewer changed the answers is something nobody
    can tell from the interviews alone.
retrieval_items:
- q: According to Britten (1995), what may a patient interviewed by a doctor try to do?
  a: Please the doctor by giving the responses they think the doctor wants.
- q: Why do more interviews by the same interviewer not cancel the interviewer's effect?
  a: Because the pull runs the same way in every interview the same person runs in the same setting. It is a systematic error, a bias, and more data of the same kind repeat it rather than average it out.
- q: What is reflexivity, in Mays and Pope's (2000) words?
  a: Sensitivity to the ways in which the researcher and the research process have shaped the collected data.
figure_note: "No honest chart: no held source measures the size of the interviewer's effect, so any drawn size would be invented. The diagram a reader wants shows direction only: twenty interviews by one interviewer in one room all leaning the same way, beside interviews that scatter."
