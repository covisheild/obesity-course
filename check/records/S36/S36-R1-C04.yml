must_know:
- point: |
    A focus group is not a quick way to interview six people. Read your transcript and check
    whether anyone ever answers anyone other than you.
  kind: misconception
  bearing: methodological
  refs:
  - kitzinger_1995
- point: |
    Refuse the sentence "the group agreed", and any count like "five of six said". First check who
    spoke first, and whether anyone was given a real chance to differ.
  kind: trap
  bearing: methodological
  refs:
  - kitzinger_1995
- point: |
    Choose the method from the question. If your question is "how many", a group is the wrong tool
    however well it is run.
  kind: move
  bearing: methodological
  refs:
  - kitzinger_1995
- point: |
    When many of the people you need to hear from cannot read or write, a written questionnaire
    shuts them out. A group does not.
  kind: india_deviation
  bearing: clinical
  refs:
  - kitzinger_1995
- point: |
    Where the topic is a private or stigmatised experience a person may not want neighbours to
    hear, the group stops being trustworthy for it. Offer that person an interview instead, and
    keep staff out of patient groups.
  kind: boundary
  bearing: clinical
  refs:
  - kitzinger_1995
- point: |
    If someone tells you focus groups give "more honest" or "truer" data than interviews, or the
    reverse, do not accept it. Kitzinger holds that group data are neither more nor less authentic
    than other data.
  kind: dispute
  bearing: public
  refs:
  - kitzinger_1995
exercises:
- type: interpretation
  prompt: |
    Here is a made-up excerpt from a session at the same clinic. The respondents' words are
    translated from Hindi.

    ```table
    | Speaker | Words |
    | M | What do you all think of the diet sheet the clinic gives? |
    | R2 | I cannot read it. My daughter reads it to me. |
    | R6 | You are lucky. Nobody at home reads it to me. |
    | R2 | Then how do you know what is on it? |
    | R6 | I ask the woman in the next bed at the ward. |
    | R3 | The sheet says no rice. How can we eat no rice? |
    | R1 | Nobody eats no rice. They just write that. |
    ```

    Is this a focus group or a group interview? Say what it shows that an interview with R2 alone
    could not. Then say one thing you could not write in your report on the strength of it.
  answer: |
    It is working as a focus group. The moderator asks the group one question and then stays out.

    Mark the respondents' turns. R2's first turn answers the moderator. R6 answers R2, R2 answers
    R6 with a question, and R6 answers it. R3 goes back to the moderator's question. R1 answers R3.
    Four of the six turns answer another participant.

    What it shows that an interview with R2 alone could not:

    - that people compare how they get the sheet read, and that some have nobody to read it;
    - a shared norm, voiced by R1 and not challenged: nobody takes the "no rice" line on the
      sheet as meant.

    What you could not write:

    - "Most patients cannot read the diet sheet." Two people mention reading. A group gives no
      count, and Kitzinger advises against percentages from focus groups.
    - "Patients agree the diet sheet is unrealistic." R1 speaks for "nobody", and the others do not
      reply. Silence after a confident line is not agreement. You would need to see whether anyone,
      given the chance, said otherwise.
- type: design
  prompt: |
    For each of these three questions about the clinic, choose a focus group, an interview, or
    neither. Give one reason for each choice.

    1. What do patients at this clinic call the follow-up visit among themselves, and what do they
       say about it to each other?
    2. What happened in the life of one man in the months after he stopped coming?
    3. How many patients registered in 2025 came back at least once?
  answer: |
    1. A focus group. The question is about shared words and what people say to each other. That
       is the talk between participants, which only a group produces.
    2. An interview. It is one person's own story over time. It may include things he would not say
       in front of other patients.
    3. Neither. It is a count, and the clinic's register answers it. Asking people in a group or an
       interview would give reasons, not a number, and the number would not be trustworthy.
retrieval_items:
- q: What makes a focus group different from a group interview?
  a: In a focus group the participants talk to one another, and that talk is the data. In a group
    interview the researcher asks each person in turn.
- q: Give two things a focus group does badly.
  a: A voiced group norm can silence someone who disagrees; and nothing said can be kept private
    from the others in the room. A hierarchy in the group can also hold members back.
- q: Kitzinger's ideal size for a focus group?
  a: Between four and eight people, for a session of one to two hours.
