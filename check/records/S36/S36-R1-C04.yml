simplified_explanation: |
  A focus group puts several people in a room with one moderator.

  Here is the trap. A room of six people answering one at a time is not a focus group. It is six short interviews with an audience. In a focus group the moderator
  asks people to talk to each other. That talk between them is the data.

  Kitzinger, who wrote a guide to the method for doctors, puts the ideal size at four to eight people, for one to two hours.

  What a group does well:

  - It shows what a group takes for granted — the things everyone nods at.
  - It shows the words people use among themselves, which are often not the clinic's words.
  - It can bring in people who would not sit through an interview alone, and people who cannot
    read or write.

  What a group does badly:

  - One loud voice can set the line, and the rest may go along with it.
  - Everyone hears everything. You cannot promise a person that what they say stays private.
  - A person of higher standing in the room, such as a staff member among patients, can hold
    others back.

  So choose from the question you are asking.

  ```table
  | If you want to know | Use | Because |
  | how patients at a clinic talk about coming back, and the reasons they share | a focus group | the shared words and reasons come out when they talk to each other |
  | one woman's own story of the months after she stopped coming | an interview | it is one person's story, and she tells it without an audience |
  | how many patients missed their last visit | neither: the clinic's register or a survey | that is a count |
  ```
illustrations:
- body: |
    Suppose you want to know why adult patients with obesity at a district hospital NCD clinic in
    Chhattisgarh stop coming back for follow-up. NCD stands for non-communicable disease. You invite
    six patients to talk as a group. What follows is a made-up exchange, written to show the
    method. The patients spoke Chhattisgarhi, and their words are given here in English.

    ```table
    | Speaker | Words |
    | M | Why do people stop coming back to this clinic? R1, you start. |
    | R1 | The doctors here are good. People are careless, that is all. |
    | M | R2? |
    | R2 | He is right. We are careless. |
    | M | R3? |
    | R3 | Yes. Careless. |
    | M | R4? |
    | R4 | Same as them. |
    | M | R5? |
    | R5 | Yes. |
    | M | R6? |
    | R6 | We should come. It is our own fault. |
    ```

    Go through the respondents' turns with a pencil. Beside each one, write M if the person is
    answering the moderator, and P if they are answering another participant. All six turns are M.
    Nobody spoke to anybody but the moderator.

    That is a group interview, not a focus group. The moderator asked each person in turn, so the
    one thing a group can give you never happened. The first answer set the line, and five people
    followed it.

    Now look at what you cannot write in your report. You cannot write "all six patients said
    people stop coming because they are careless". Kitzinger warns against giving percentages from
    focus groups. She says to tell apart one person's view from what the group actually agreed.
    Here you do not know what R2 to R6 think. You know only that they did not contradict R1 in
    front of each other.
  analogy_breaks_when: |
    The exchange is made up, and so short that every turn can be marked. In a real two-hour group,
    many turns answer the moderator and the group at once. A turn can also change the subject
    without answering anyone. The M and P marks are then a rough reading aid, not a measurement.

    A group that agrees quickly has not always been silenced. Sometimes people simply agree. The
    transcript alone cannot tell the two apart. What tells them apart is whether anyone, given a
    real chance, says something different.
- body: |
    Here is a second made-up group of six patients from the same clinic. This time the moderator
    reads out a sentence written on a card and asks the group to talk about it with each other.
    Kitzinger describes group exercises built on statements written on cards; this is the simplest
    kind.

    ```table
    | Speaker | Words |
    | M | I will read out a sentence. Talk about it with each other, not with me. "People stop coming because the visit takes the whole day." |
    | R3 | That is true. The bus from our village leaves at six. By the time the doctor sees you it is past two. |
    | R1 | But you get a month of tablets. Is one day a month so much? |
    | R3 | For you, maybe. My husband loses a day's wages when he brings me. |
    | R5 | Same for us. And after the whole day they weigh you and say the same thing. |
    | R2 | What do they say to you? |
    | R5 | Eat less, walk more. Every time. |
    | R4 | R5 is right about the words. For me it is the scale. It stands in the corridor, and the whole queue watches. |
    | M | R4, say more about that. |
    | R4 | I would rather not, here. |
    ```

    Mark the respondents' turns again. The first R3 turn answers the moderator's card, so it is M.
    The next six turns each answer another participant, so they are P. R4's last turn answers the
    moderator, so it is M.

    ```table
    group          answers to the moderator  answers to another participant
    first group    6                         0
    second group   2                         6
    ```

    Now look at what the talk between them produced. You could not have got it by asking six
    people in turn.

    - A shared phrase, "the whole day", which the group uses for the cost of a visit.
    - A disagreement. R1 thinks one day a month is small. R3 answers that it is not her day that
      is lost but her husband's wages. So the cost depends on who pays it.
    - A question you might not have thought to ask. R2 asks what the staff actually say.
    - Set beside the first group, a move away from blaming themselves, towards the bus, the wages
      and the scale in the corridor. Kitzinger describes group talk allowing exactly this shift, from personal,
      self-blaming explanations towards structural ones.

    R4's last turn shows the limit. Being weighed in front of the queue is something R4 will
    mention in the group but will not describe there. That is a private, possibly painful
    experience. It is the kind of thing one person's story in an interview is for. So you might
    offer R4, and anyone else, a one-to-one conversation later, away from the group.
  analogy_breaks_when: |
    Both groups are made up, and each was written to show one thing clearly. A real group mixes
    the two: some stretches of real talk between participants, some stretches of each person
    answering the moderator.

    Kitzinger's account of what groups do well and badly comes from a guide to the method, built
    on her own studies and others'. It is not a trial comparing the two methods on the same
    people. It gives no effect size. A study that ran groups and interviews on the same topic and
    the same kind of people, and found the groups added nothing the interviews missed, would count
    against it. Until then, treat its claims as practical guidance from experience.
