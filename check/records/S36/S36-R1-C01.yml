definition:
  text: |
    A research question of the first kind asks how many or how much: how common something is, how large a quantity is, or how
    large a difference a treatment makes. Research of this kind is called quantitative research.

    A question of the second kind asks what something is, what it means to the people involved, how
    it comes about and why. It is answered by qualitative research: research that gathers people's own
    words and actions, by interview, group discussion or watching, and analyses them without turning
    them into counts.

    The two kinds answer different questions, and neither is a weaker version of the other.
