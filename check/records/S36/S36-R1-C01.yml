simplified_explanation: |
  Some questions ask how many or how much. How many adults with obesity seen at a clinic last year
  came back for a second visit? By how much does a reminder message raise that number?

  Other questions ask what, how and why. Why do patients stop coming? You answer these by asking
  people and listening to what they say, in their own words. That is qualitative research.

  A trial cannot tell you why patients stop coming. An interview cannot tell you how many do.

  You may have met a ladder of study designs, called the evidence hierarchy, with the randomised
  controlled trial near the top. That ladder ranks designs for one question: does this treatment
  work, and by how much? It has no rung for "why do patients stop coming?"

  The two kinds also feed each other.
illustration:
  body: |
    Here is the setting this book uses from start to finish. It is made up. A district hospital in Chhattisgarh runs a non-communicable disease (NCD) clinic. Many of its
    adult patients with obesity come once or twice and then stop coming. You want to know why.

    Start with an attempt that fails. Suppose the clinic adds a question to its follow-up phone call: "Why did you not come back? Distance, cost, felt better, or other."

    Ask where the four choices came from. The clinic staff wrote them, before anyone had asked a patient. The count is exact. It is an exact count of the staff's guesses.

    Now sort four questions about the same clinic yourself, before you read the table. For each one,
    say whether it asks how many or how much, or what, how and why. Then say what would answer it.

    ```table
    | Question | Kind | What answers it |
    | How many adults with obesity seen last year came back for a second visit? | how many | Count the clinic register |
    | Does a reminder text message the day before raise the share who come back? | how much | A trial: chance decides who gets the message, then the groups are compared |
    | Why do adults with obesity stop coming back? | why | Find people who stopped, ask them, and listen |
    | What is a clinic day like for someone who works for a daily wage? | what and how | Ask such people, and listen |
    ```

    Look hard at the third row. No count answers it, because you do not yet know what to count.

    Suppose you go and ask. In a made-up example, one woman says the clinic is on the first floor. Her knees hurt on the stairs, and she waits standing because the
    benches are full. Nobody on the staff had put "stairs" on the tick-list. Now it can go on one.

    So the two kinds pass the work back and forth. Asking finds what matters and in what words. Counting says how common it is. A trial says whether a fix works.
  analogy_breaks_when: |
    The line between the two kinds is not always this clean. "Which patients stop coming, and why?"
    asks for a count and a reason at once. Split a question like that into its two halves before you
    choose a method, and give each half its own method.
  numbers: []
must_know:
- point: |
    The error is to treat an interview study as a trial that could not afford enough people. It is not
    a small trial. It answers a question a trial cannot, such as why patients stop coming.
  kind: misconception
  bearing: methodological
- point: |
    Before you choose a method, write the research question as one sentence and look at its first
    words. "How many" and "how much" send you to counting and measuring. "What", "how" and "why" send
    you to asking people.
  kind: move
  bearing: methodological
- point: |
    Someone in a meeting will call interview findings "anecdotal" because they sit low on the evidence
    hierarchy. Answer that the ladder ranks designs for testing whether a treatment works. It has no rung
    for why patients leave.
  kind: trap
  bearing: policy
- point: |
    A drop-out number tells a programme how big its problem is. It does not say what to change.
  kind: consequence
  bearing: policy
- point: |
    Asking people tells you which reasons exist and how they work. It cannot tell you how common each
    reason is, or whether a fix works.
  kind: boundary
  bearing: methodological
exercises:
- type: design
  prompt: |
    Here are five questions about the clinic in this section. For each, say whether it asks how many or
    how much, or what, how and why, and say what kind of study would answer it.

    1. What share of adults with obesity attending the clinic have also been told they have diabetes?
    2. How do patients decide whether a follow-up date is worth keeping?
    3. Does moving the clinic to the ground floor raise the share of patients who come back?
    4. What do patients understand the word "follow-up" to mean?
    5. Which patients stop coming, and why?
  answer: |
    1. How many. A share of a group is a count divided by a total. Count it from the clinic register,
       or from a random sample of patient files.
    2. How and why. It asks how people reach a decision. Ask patients who kept dates and patients who
       did not, and listen to how they describe it.
    3. How much. It asks how large a difference a change makes. Compare the share who come back with
       the stairs and without them. When the whole clinic moves, chance cannot decide which patients
       get the ground floor. So this is likely to be a before-and-after comparison, weaker than a
       trial. It is still a counting question.
    4. What. It asks what a word means to the people who hear it. Ask them. Pope and Mays note that the
       simplest use of this kind of work is to find which words people understand before a survey uses
       them. If "follow-up" means nothing to patients, a survey that asks about it counts nothing.
    5. Both. "Which patients" is a how-many question: count, from the register, who stops. "Why" is a
       why question: ask the people who stopped. Split it and give each half its own method.
- type: critique
  prompt: |
    A district programme officer writes: "Interviews are the weakest kind of evidence. We will wait for
    a trial before we look at why patients leave the clinic."

    Lay the argument out as premises and a conclusion. Then say where it fails.
  answer: |
    Premise: interviews are the weakest kind of evidence. Conclusion: wait for a trial before looking
    at why patients leave.

    Test the inference first, as Book 0's section on argument taught. The premise is true only for one
    kind of question: does a treatment work, and by how much. The ranking it comes from says nothing
    about questions of why. So "weakest" has quietly moved from one kind of question to another.

    There is a second fault. A trial tests a fix that already exists. To run one, you must already know
    what to change. Finding out why patients leave is how you would learn what fix to test. So waiting
    for the trial first puts the steps in the wrong order.

    A fair version of the officer's worry survives: an interview study cannot say how common each reason
    is. That is a reason to count after asking, not a reason not to ask.
- type: teaching
  prompt: |
    A journalist has three minutes and asks you: "Isn't qualitative research just people's opinions?"
    Answer without jargon, and give one sentence they could quote.
  answer: |
    Start with the kind of question. Some questions are about how many: how many patients stop coming
    to a clinic. You answer those by counting. Others are about why: why they stop. No count answers
    that, because you do not yet know what to count. You have to ask the people who stopped, and
    listen.

    Then separate it from opinion. A good study does not collect whatever people happen to say. It
    chooses people on a stated plan, including those whose story may not fit. It works through what
    they said step by step. And it looks for explanations that would prove its first idea wrong.

    Be honest about the limit. It tells you what the reasons are and how they work, not how common each
    one is.

    A quotable sentence: "Counting tells you how many patients stop coming; only asking them tells you
    why."
quantitative: false
retrieval_items:
- q: What two kinds of research question does this section separate, and which kind of research answers
    each?
  a: How many or how much, answered by counting and measuring (quantitative research); and what, how and
    why, answered by asking people and analysing their words (qualitative research).
- q: What does the evidence hierarchy rank, and what does it not say?
  a: It ranks designs for the question "does this treatment work, and by how much?". It says nothing about
    which design best answers a why or how question.
- q: Why can qualitative work come before counting?
  a: A thing cannot be counted until someone has said what it is; asking people finds what should be counted,
    and in what words.
figure_note: "A loop diagram would serve the reader: asking finds what to count and in what words, counting says how common it is, a trial says whether a fix works. The section states no quantity, so the tool has nothing honest to plot."
