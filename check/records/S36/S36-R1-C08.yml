simplified_explanation: |
  Listening sounds passive. It is not. You are deciding, all the time, which of the person's words
  to follow.

  You stay quiet and wait. You repeat the person's own words back. You say "tell me more", or "can you
  give me an example?", or "what do you mean by that?". None of these adds an idea of yours.

  Some things feel helpful and damage the interview. Giving advice is one. So is correcting a wrong
  belief, or finishing the person's sentence. Agreeing with what they said, as opposed to showing that you
  heard it, is another. Each one tells the person what you think.

  Then, the same day, write field notes — what happened, where, how it felt, what surprised you.
illustrations:
- body: |
    Here is a made-up exchange, translated from Hindi, from the running example: the district hospital
    NCD clinic in Chhattisgarh, and patients with obesity who stop coming back. The respondent, R2, is
    a man who works for a daily wage. Read it and count the moments where the interviewer, I, takes
    the interview away from him.

    ```table
    | Speaker | Words |
    | I | Tell me about the last time you came to the clinic. |
    | R2 | That was before the rains. After that, the bus fare, and the queue... |
    | I | ...takes the whole day, yes. But the doctor does need to check your sugar every month. |
    | R2 | Yes, madam. |
    | I | So you will try to come next month? |
    | R2 | Yes, I will come. |
    ```

    There are three. First, I finished his sentence, so the words about the queue are the
    interviewer's, not his. Second, I gave clinic advice. Now he is a patient being told what to do,
    and his next answer is the one a patient gives. Third, I asked a closed question with the answer
    built in. "Yes, I will come" is the least useful line in the transcript. It is what anyone would
    say to that question, so it tells you almost nothing about him.

    Now the same moment, run the other way. This version is made up too.

    ```table
    | Speaker | Words |
    | I | Tell me about the last time you came to the clinic. |
    | R2 | That was before the rains. After that, the bus fare, and the queue... |
    | I | (waits) |
    | R2 | The queue is the whole day. If I come here, I do not work that day. No work, no money. |
    | I | No work that day. |
    | R2 | And my son says, why go? They only tell you to lose weight. |
    | I | Tell me more about what your son says. |
    ```

    Name what the interviewer did. A pause, until he finished his own sentence. An echo, "no work that
    day", in his words. Then an expansion, "tell me more", on the thread he opened.

    Now look at your guide. Its next question was about the tablets. Leave it for now. The son's view
    of the clinic is a reason for not coming back that your guide did not have. Follow it to its end,
    and come back to the tablets after.
  analogy_breaks_when: |
    A pause works when the person is gathering words. It fails when they have finished and are
    waiting for you, or are uneasy. A silence that runs on can feel like pressure, and in the consent
    section's terms a very short reply or restlessness may be a sign they want to stop. Then ask, in
    plain words, whether they want to go on.
- body: |
    Here is a made-up moment from later in the same interview. R2 turns to you.

    ```table
    | Speaker | Words |
    | R2 | Madam, if my sugar is fine now, can I stop the tablet? |
    ```

    You may know the answer. If you are a clinician, the pull to answer is strong. Answer it now, and
    you undo the last half-hour. You become the clinic again, and he goes back to saying what a patient
    says. Refuse flatly, and he may stop answering you.

    Britten (1995) offers a middle way: say that such questions can be answered at the end. She notes
    this is not always satisfying. So say it with care, and keep the thread open:

    ```table
    | Speaker | Words |
    | I | That is an important question. I am not the right person to answer it, but before I go I will tell you who at the clinic can. What makes you think about stopping it? |
    ```

    At the end, keep your word. Give him the name of the clinic's doctor or nurse to ask. Ask your
    topic guide's closing question. Then thank him for helping you understand his experience, and
    switch off the recorder.

    Within the day, before you listen to the recording, write your field notes. Where you sat. Who
    else was in earshot. The moment he asked about the tablet, and what changed in his answers after
    it. Your own slip, if there was one. These notes are what you will need when you read the
    transcript later.
  analogy_breaks_when: |
    Waiting until the end works for questions that can wait. It stops working when what the person
    says suggests danger to their life or someone else's. The ICMR guidelines give researchers a
    responsibility to disclose such information to save life. They also want the plan for handling it
    written into the protocol in advance. Know that plan before the interview, not during it.
must_know:
- point: |
    Running an interview well does not mean never steering. Britten's point is that the amount of
    steering should be right for the moment, not zero.
  kind: misconception
  bearing: methodological
  refs:
  - britten_1995
- point: |
    Showing you heard is not agreeing with what was said. "Yes... okay..." keeps a person talking. "You
    are right, the diet is impossible" tells them which answer you like, and the next answers will
    lean towards it.
  kind: trap
  bearing: methodological
  refs:
  - dejonckheere_vaughn_2019
- point: |
    Before you say a probe, check it for words the respondent has not used. A probe made of their
    words, a pause, or "tell me more" adds nothing of yours. A probe that brings in a new word, such as
    "was it the cost?", has already suggested the answer.
  kind: move
  bearing: methodological
- point: |
    When a respondent says something medically wrong, do not correct it. What they believe is the
    data.
  kind: consequence
  bearing: clinical
  refs:
  - britten_1995
- point: |
    If a respondent asks you a medical question, say you will come back to it at the end. Then do
    come back to it: give them a name at the clinic to ask. Answering in the middle turns the
    interview into a consultation.
  kind: move
  bearing: clinical
  refs:
  - britten_1995
- point: |
    Write field notes the same day, before you listen to the recording. The recording keeps the words.
    It does not keep the room, who else was near, or the moment the person went quiet.
  kind: move
  bearing: methodological
  refs:
  - dejonckheere_vaughn_2019
- point: |
    If what a person says suggests danger to their life or another's, the ICMR guidelines give you a
    responsibility to disclose it to save life. Know your protocol's plan for this before the interview
    starts, and tell people at consent that confidentiality has limits.
  kind: boundary
  bearing: clinical
  refs:
  - icmr_ethical_guidelines_2017
exercises:
- type: critique
  prompt: |
    Here is a made-up exchange from an interview at the NCD clinic, translated from Chhattisgarhi. R4
    is a woman who stopped coming for follow-up. Find each line where the interviewer takes the
    interview away from her, say what the line does, and rewrite it.

    ```table
    | Speaker | Words |
    | I | What was it like, coming here for your check-ups? |
    | R4 | The sister weighs me in front of everyone. Then the doctor... |
    | I | I know, the doctors can be very strict about weight. |
    | R4 | Hmm. |
    | I | You should still come, though. Obesity leads to diabetes. |
    | R4 | Yes. |
    | I | Was it the weighing that stopped you, or the travel? |
    ```
  answer: |
    Line 3 does two things. It finishes her thought for her, since she had begun on the doctor and
    had not said what. It also agrees with a view she had not yet stated, that doctors are strict. A
    better line is a pause, or an echo in her words: "In front of everyone."

    Line 5 is advice, and a correction of sorts. She is now a patient being told what to do, and her
    answer shrinks to "Yes". Drop the line. If her health comes up, leave it to the end and point her
    to the clinic.

    Line 7 is a closed question that offers two answers, weighing or travel. Neither is her word:
    "travel" is new, and "the weighing that stopped you" puts a cause in her mouth. Ask instead:
    "What happened after that?", or go back to her unfinished sentence: "You said, then the doctor..."

    Her replies shrink from a sentence to "Hmm" to "Yes". That shrinking is the sign to watch for. It
    also fits the consent section's warning that very short replies may mean a person wants to stop.
  skill_ref: S36-R1-K01
- type: design
  prompt: |
    Here is a made-up answer from a respondent. "After my knee got bad, I stopped walking to the bus
    stand. And my daughter-in-law does not like to bring me." Write three probes, each of a different kind, that
    use no word the respondent did not use. Name the kind of each.
  answer: |
    Many answers work. For example:

    - A pause, then waiting. The respondent may carry on with the daughter-in-law without any prompt.
    - An echo: "Your daughter-in-law does not like to bring you."
    - An expansion: "Tell me more about the bus stand."
    - An explanation: "What do you mean when you say she does not like to?"

    Check each against the rule. "Does not like to", "bus stand" and "daughter-in-law" are all the
    respondent's words. A probe such as "Is she too busy?" or "Is it the cost?" fails. It brings in a
    reason the respondent never gave.
  skill_ref: S36-R1-K01
- type: teaching
  prompt: |
    A first-year resident has just run a practice interview. Every time the patient spoke, the
    resident said "Right, exactly". They think this built rapport. You have ten minutes and a
    whiteboard. Teach them what it did.
  answer: |
    Write two lines on the board: "Yes... okay..." and "Right, exactly."

    The first says: I heard you, go on. DeJonckheere and Vaughn list it as a probe, because it keeps a
    person talking.

    The second says: that is the right answer. After the third time, the patient knows which answers
    get approval. They are talking to a doctor they want to please.

    Then show them their own transcript. Point to the place where the patient's answers got shorter,
    or started to echo the resident's words. That is where the agreeing began to steer.

    End with the move to practise: acknowledge the person, never the content. "Mm", a nod, or an echo
    of their words, and never "exactly".
  skill_ref: S36-R1-K01
retrieval_items:
- q: Name four probes that ask for more without suggesting an answer.
  a: A pause (wait time), an echo of the respondent's words, an expansion ("tell me more"), and asking what a word meant (explanation).
- q: What should you do when a respondent asks you a medical question in the middle of an interview?
  a: Say you will come back to it at the end, keep the thread going, and at the end tell them who at the clinic can answer it.
- q: When do you write field notes, and why then?
  a: The same day, before listening to the recording, because you will not recall each moment in enough detail later.
figure_note: "No honest chart: the section is conduct inside one conversation, and any count of turns or probes would be invented. The diagram a reader wants is a flow of the interview's parts: introduction and consent, an easy open question, following with probes, leaving and returning to the guide, questions answered at the end, thanks, field notes the same day."
