definition:
  text: |
    A semi-structured interview runs in a fixed order of parts, and within them it follows the respondent.

    It opens with who you are, why you are talking to this person, the consent steps and the recorder. The first question after that is an open one the respondent can
    answer easily.

    From then on the interviewer's main work is listening. The interviewer follows the respondent's words with probes. In this book a probe is a short follow-up that asks
    for more of what the respondent just said without suggesting what that should be. DeJonckheere and Vaughn list, among others, the pause after a question ("wait time"),
    repeating or summarising the respondent's words ("echo"), short affirming words such as "yes... okay..." ("verbal agreement"), asking them to say more ("expansion")
    and asking what they meant by a word ("explanation").

    Either person may leave the topic guide to follow an idea. The interviewer comes back to the guide when that thread ends.

    The interviewer does not judge, teach, advise or correct. Questions the respondent asks can be answered at the end.

    Leaving the guide does not mean giving up direction altogether.

    The interview closes with thanks.
