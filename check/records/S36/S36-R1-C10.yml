definition:
  text: |
    An audio recording of an interview is the record of what was said. A transcript is a written
    version of that recording, made by a person or a program, and it is the text that analysis
    works on.
  references:
  - citekey: blackstone_2012
    kind: textbook
    locator: s. 9.2 Qualitative Interview Techniques and Considerations, Analysis of Qualitative Interview Data, first paragraph
    quote: "a complete, written copy of the recorded interview by playing the recording back and typing in each word that is spoken on the recording, noting who spoke which words"
    verified:
      resolved_id: https://saylordotorg.github.io/text_principles-of-sociological-inquiry-qualitative-and-quantitative-methods/
      opened: true
      claim_located: true
      checked_on: '2026-09-24'
      note: |-
        Carries the core: a transcript is a written copy of the recording with each speaker marked.
        Blackstone also advises aiming for verbatim and noting nonverbals; the full-verbatim versus
        cleaned distinction and the hours are carried by McMullin.
  - citekey: pope_ziebland_mays_2000
    kind: primary
    locator: opening paragraph
    quote: "transcribing a typical single interview takes several hours and can generate 20-40 pages of single spaced text. Transcripts and notes are the raw data of the research."
    verified:
      resolved_id: 10.1136/bmj.320.7227.114
      opened: true
      claim_located: true
      checked_on: '2026-09-24'
