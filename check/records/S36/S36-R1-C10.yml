simplified_explanation: |
  The recording is what was said in the room. The transcript is what you will read, mark and quote
  from for the rest of the study. They are not the same thing.

  Full verbatim keeps everything: every filler, every repeated word, every broken-off sentence.
  Cleaned transcription (papers often call it intelligent verbatim) tidies speech into readable sentences and drops the fillers and repeats.
  Choose before you start, write the choice down, and use it for every interview.
illustration:
  body: |
    Suppose you are interviewing a woman at the district hospital non-communicable disease clinic in Chhattisgarh. She has stopped coming for follow-up, and you want to know why. What follows is a made-up
    stretch of that interview, about twenty seconds of it, written in English.

    Here is the trap. Two people can type those twenty seconds and produce two different
    transcripts, and both can say they wrote down "what she said".

    First, the full verbatim version. `I` is you, the interviewer. `R1` is the respondent.

    ```table
    | Speaker | Words |
    | I | And after that, what happened? |
    | R1 | After that... um... I, I did not- I thought I will come next month. [pause, 4 seconds] But my husband, he said, what is the use, you are going there and the weight is not going. |
    | I | Mm-hm. |
    | R1 | [laughs] So. My son [son's name] also cannot take leave. [inaudible, 00:12:41] and the bus also. |
    ```

    Now the cleaned version of the same twenty seconds.

    ```table
    | Speaker | Words |
    | I | And after that, what happened? |
    | R1 | After that I thought I will come next month. But my husband said, what is the use, you are going there and the weight is not going. So my son also cannot take leave, and the bus also. |
    ```

    Read the two side by side. Here are five of the things the cleaned one dropped.

    - The broken-off "I did not-".
    - The four-second pause before her husband comes in.
    - The laugh before "So".
    - Your own "Mm-hm", a whole turn of yours, gone.
    - The place where something could not be heard.

    Now ask whether any of that matters for your question. A reader of the cleaned version sees a smooth list of reasons. A reader of the full version sees her hesitate at one of them.

    There is no single standard set, so here is one simple set to use in your pilot.

    ```table
    | Mark | What it means |
    | I, R1, R2 | who is speaking: you, then each respondent by number |
    | [pause, 4 seconds] | a silence long enough to notice, with its length |
    | [laughs] | a sound that is not a word |
    | did not- | a word or sentence broken off |
    | [inaudible, 00:12:41] | could not be heard, and the minute and second on the recording where it falls |
    | [son's name] | a name taken out, replaced by who the person is |
    ```

    The time on the inaudible mark is what lets you, or anyone checking you, go straight to that second of the recording.

    McMullin puts transcription at between three hours and over eight hours of work for one hour of audio, depending on typing speed. You plan five pilot
    interviews. Suppose each one runs about an hour. A shorter one is a fraction of an hour: 30 minutes is
    30 divided by 60 = 0.5 hours. Work out the typing time at each end of her range.

    ```working
    5 times 3 = 15 hours at the quick end
    5 times 8 = 40 hours at the slow end
    ```

    Forty is not a ceiling. Plan the hours before you book the interviews, not after.
  analogy_breaks_when: |
    The exchange is made up, and it is written in English. A real recording would be in
    Chhattisgarhi. Putting it into English adds a second set of choices. This example does not show
    those.

    The hours are for one person typing from a recording. They do not tell you how long it takes to
    check a draft made by speech-to-text software.
  numbers:
  - value: '3'
    unit: hours of transcribing for one hour of audio, the quick end of the range
    citekey: mcmullin_2023
    quote: "can take between three hours and over eight hours to transcribe one hour of audio"
  - value: '8'
    unit: hours of transcribing for one hour of audio, the slow end of the range, which the source says can be exceeded
    citekey: mcmullin_2023
    quote: "can take between three hours and over eight hours to transcribe one hour of audio"
must_know:
- point: |
    A transcript is not the recording. Keep the recording until your analysis is finished. When a
    quotation or a reading turns on one line, go back and listen to that line.
  kind: misconception
  bearing: methodological
- point: |
    Decide full verbatim or cleaned before you type a word. Write the choice at the top of each
    transcript, and use the same one for all five pilots. There is no one best style. For a pilot,
    this course advises full verbatim, because the point of a pilot is to hear your own interviewing, and cleaning takes out the
    fillers, interruptions and half-questions that show it.
  kind: move
  bearing: methodological
- point: |
    Budget three to more than eight hours of typing for every hour of recording.
  kind: number
  bearing: methodological
  refs: [mcmullin_2023]
- point: |
    Speech-to-text software gives you a first draft, not a transcript. Check every line of a
    machine draft against the recording. Before a patient's voice leaves your own recorder, ask
    your institutional ethics committee where it may be kept.
  kind: trap
  bearing: clinical
  refs: [mcmullin_2023]
- point: |
    A transcript holds only what the recorder caught: not faces, gestures or the room. For those go
    to your field notes, and say when a reading rests on them.
  kind: boundary
  bearing: methodological
- point: |
    Putting their words into English is a second round of choices on top of transcription.
    This course's advice: transcribe in the language spoken, translate
    only the passages you quote, and note who translated and any word left untranslated. Say which version any count or quotation comes from,
    so that anyone checking you can find the words.
  kind: move
  bearing: methodological
- point: |
    Some papers say only "interviews were recorded and transcribed". Ask who transcribed, full
    verbatim or cleaned, and whether anyone checked the text against the audio.
  kind: consequence
  bearing: methodological
  refs: [mcmullin_2023]
exercises:
- type: calculation
  prompt: |
    Your first pilot recording runs 47 minutes. McMullin's range is three hours to over eight hours
    of work for one hour of audio. Work out how long transcribing it could take at each end.
    Give the answers in hours, to one decimal place, and say which of the two you would plan
    around.
  answer: |
    Turn the recording into hours first. There are 60 minutes in an hour.

    ```working
    47 divided by 60 = 0.7833... hours
    ```

    Then multiply by each end of the range.

    ```working
    0.7833... times 3 = 2.35, about 2.4 hours at the quick end
    0.7833... times 8 = 6.27, about 6.3 hours at the slow end
    ```

    Plan around the slow end. The source says "over eight hours", so 6.3 hours is not even a
    ceiling. A first transcript is the slowest you will type, because the marks and the choices are
    new to you.
  confidence_first: true
- type: critique
  prompt: |
    Here is the whole of what a made-up draft report says about its transcripts.

    > Interviews were conducted in Chhattisgarhi with twelve patients, recorded, and transcribed.

    List what a reader cannot tell from this sentence, and say for each why it matters to someone
    judging the findings.
  answer: |
    Four things are missing.

    Who transcribed. The researcher who sat in the room, or a typist who never met the respondents.
    McMullin says that, at a minimum, a report should say who transcribed.

    Full verbatim or cleaned. A cleaned transcript has already dropped the pauses, repeats and
    false starts. Any claim about hesitation, or about how the interviewer spoke, cannot be checked
    from it.

    What happened to the language. Were the transcripts typed in Chhattisgarhi and then translated,
    or typed straight into English? Who translated, and which version was analysed? Every
    quotation in the report depends on that answer.

    Whether anyone checked the text against the recordings. A transcript nobody checked is one
    person's hearing of the tape, and a machine draft nobody checked is less than that.

    The sentence is not dishonest. It is simply empty. The reporting standards that ask for these
    details (COREQ, the Consolidated criteria for Reporting Qualitative research) are taught at the
    next stage.
retrieval_items:
- q: What is the difference between full verbatim and cleaned transcription?
  a: Full verbatim keeps everything said, including fillers, false starts, repetitions and grammatical errors. Cleaned transcription tidies speech into written sentences and drops the fillers and repeats.
- q: Roughly how long does it take to transcribe one hour of interview audio?
  a: Between three hours and over eight hours, depending on typing speed (McMullin 2023).
- q: Why does a transcript mark an inaudible passage with the time on the recording?
  a: So that you, or anyone checking you, can go straight to that point in the audio and listen again.
