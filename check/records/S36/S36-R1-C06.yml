    quote: |-
      is a list of topics or questions that the interviewer hopes to cover during the course of an interview. It is called a guide because it is simply that—it is used to guide the interviewer, but it is not set in stone.
    verified:
      resolved_id: https://saylordotorg.github.io/text_principles-of-sociological-inquiry-qualitative-and-quantitative-methods/s12-02-qualitative-interview-techniqu.html
      opened: true
      claim_located: true
      checked_on: '2026-09-24'
      note: |-
        Blackstone calls it the interview guide; this book calls it the topic guide. Blackstone is the
        textbook anchor for this derivable concept; the journal articles below are primary.
  - citekey: blackstone_2012
