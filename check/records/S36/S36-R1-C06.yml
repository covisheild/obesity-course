simplified_explanation: |
  A topic guide is the sheet you take into the interview, with all your questions on it in the order
  you expect to use them.

  It is not a script. You do not read it out top to bottom.

  A guide has four parts.

  - **A warm-up question.** Something easy the person knows all about, to get them talking. "Tell
    me about a usual day for you."
  - **Main questions.** These are the questions your study turns on.
  - **Prompts under each main question.** Short notes of the things you hope the answer covers. You
    use a prompt only if the respondent does not get there on their own.
  - **A closing question.** "Is there anything I have not asked about that I should have?"

  Three rules for the order and the words:

  - Easy and factual first, personal later.
  - Every main question comes from your study question.
  - Use the respondent's words, not the clinic's.

  Last, a guide is never finished on paper. Try it in a pilot interview, see which questions fall
  flat, and change it.
illustrations:
- body: |
    Start with a guide that goes wrong. Here are the first five lines of a made-up first draft for
    the clinic study, from a guide that runs to nineteen questions.

    ```table
    | No. | Question |
    | 1 | How do you feel about your weight? |
    | 2 | Why did you stop coming for follow-up? |
    | 3 | How many times did you come last year? |
    | 4 | Are you compliant with the diet chart? |
    | 5 | What is your BMI? |
    ```

    Read it the way a respondent would hear it.

    - It opens on the most personal question in the whole study, before the person has said a word
      about anything easier.
    - Question 2 is the "why" trap from the last section. It takes for granted that the person
      decided to stop, and asks them to defend it.
    - "Follow-up", "compliant", "diet chart" and "BMI" are the clinic's words. A patient may not use
      them, and may not know the last one.
    - Every line is a full question to read out. There are no prompts, so every answer the person
      gives has to be followed by the next line on the sheet.
    - Nineteen questions is a questionnaire, not a guide. There is no time left to follow what the
      respondent says.
  analogy_breaks_when: |
    The draft is made up, and every fault is put in on purpose. A real first draft usually has one
    or two of these faults, not all five, and they are harder to see in your own writing than in
    someone else's.
- body: |
    Now build the guide properly. Suppose your study question is: why do adult patients with
    obesity at a district hospital NCD clinic in Chhattisgarh stop coming back for follow-up? The
    study question can use the clinic's word. The questions you ask patients cannot.

    Break the study question into the parts of a patient's experience it covers. Getting to the
    clinic. What happens at a visit. What happens after it. What being talked to about weight is
    like. What the person would change. Each part becomes one main question. The guide below is
    made up for this book. Respondents would be asked in Hindi or Chhattisgarhi.

    ```table
    | Part | Question | Prompts, only if not covered |
    | warm-up | Tell me about a usual day for you. | work; who lives at home |
    | main 1 | How did you first come to this clinic? | who suggested it; how you travel here |
    | main 2 | Tell me about the last time you came here. | the journey; the wait; what happened inside; what you were told |
    | main 3 | What happened after that visit? | the tablets; meals at home; the next date on the card |
    | main 4 | What is it like to talk about your weight at the clinic? | who brings it up; how it is said; what you do afterwards |
    | main 5 | If you could change something about coming here, what would it be? | the day; the place; the people |
    | closing | Is there anything I have not asked about that I should have? | anything you want to ask me |
    ```

    Check the order. The warm-up and main 1 are easy and factual. Main 2 and main 3 are about
    events. Main 4 is the most personal, and it comes after the person has been talking for a while.
    Main 5 lets them end on what they would do, not on what was hard.

    Check each question against the last section's three checks. All seven are open. None takes
    the person's experience for granted. None asks two things. The prompts are not questions to read
    out. They are notes for you, so that if the person talks about the wait but not the journey,
    you remember to ask.

    Now plan the time. A guide that runs out of time before main 4 has lost the question the study
    most needs. Here is a plan, which is your own choice, not a rule.

    ```table
    part     planned minutes
    warm-up  5
    main 1   5
    main 2   10
    main 3   10
    main 4   10
    main 5   5
    closing  5
    ```

    Add it up.

    ```working
    5 plus 5 plus 10 plus 10 plus 10 plus 5 plus 5 = 50
    ```

    The plan comes to 50 minutes. Most of it goes to main 2, main 3 and main 4, which carry the
    study question.

    Then you try it. Suppose that in your first pilot interview, main 1 gets a one-line answer and
    main 2 takes twenty minutes. That is not a failure. It tells you to cut main 1's time and give
    main 2 more. If a question falls flat in two pilots running, replace it. Write the new version
    of the guide with its date on it.
  analogy_breaks_when: |
    The guide fits one study question about one clinic. A different study question gives different
    main questions, even with the same patients. The minutes are a plan, not a finding. A real
    interview runs to whatever length the respondent needs, and the plan only tells you where you
    are when you look at the clock.

    Main 4 assumes weight is talked about at an obesity clinic, which is the reason the patients are
    there. At another kind of clinic the same question would carry a premise.
must_know:
- point: |
    A topic guide read out word for word, in order, is a structured interview with extra steps.
    Change the order to follow what the respondent says, and use their words in your follow-ups.
  kind: misconception
  bearing: methodological
  refs:
  - britten_1995
  - dejonckheere_vaughn_2019
- point: |
    Put the easy, factual questions first and the most personal one late, after the person has
    been talking for a while.
  kind: move
  bearing: clinical
  refs:
  - dejonckheere_vaughn_2019
- point: |
    Write each main question from a part of your study question, and cut any main question you
    cannot tie to one.
  kind: move
  bearing: methodological
  refs:
  - dejonckheere_vaughn_2019
- point: |
    DeJonckheere and Vaughn suggest five to 10 core questions, their name for main questions. Treat
    ten as a ceiling for a pilot guide.
  kind: number
  bearing: methodological
  refs:
  - dejonckheere_vaughn_2019
- point: |
    Refuse the clinic's words in your questions: "follow-up", "compliance", "BMI". Use the words
    patients use, and once a respondent gives you their own word, switch to it.
  kind: trap
  bearing: clinical
  refs:
  - dejonckheere_vaughn_2019
  - britten_1995
- point: |
    A guide on paper cannot tell you whether its questions work. Only a pilot interview can. Keep
    every version dated, because respondents who heard different versions answered different
    questions, and your analysis has to know which was which.
  kind: boundary
  bearing: methodological
  refs:
  - dejonckheere_vaughn_2019
exercises:
- type: design
  prompt: |
    Write a topic guide for the five pilot interviews you will run at the end of this book. Choose a
    study question you can ask of people you can reach who are not your patients. For example: how
    do families in which one adult has obesity decide what is cooked for the evening meal?

    Your guide should have a warm-up question and five to 10 main questions, with prompts under
    each. End it with a closing question. Add a time plan that adds up. Then put every question through the three checks
    from the last section.
  answer: |
    Here is one guide for the example study question. Yours will differ. Check it against the list
    that follows the guide, not against this guide.

    ```table
    | Part | Question | Prompts, only if not covered |
    | warm-up | Tell me about the people who live in your home. | who eats together; who works outside |
    | main 1 | Tell me about yesterday's evening meal, from when it was first thought of to when it was eaten. | who decided; who bought; who cooked |
    | main 2 | How is it decided what to cook on a usual day? | who is asked; who has the last word |
    | main 3 | How is it different on a festival or when guests come? | who decides then; what changes |
    | main 4 | Has anyone at home ever asked for food to be cooked differently for their health? | what was asked; what happened next |
    | main 5 | What would make cooking for the family easier for you? | time; money; what others want |
    | closing | Is there anything I have not asked about that I should have? | anything you want to ask me |
    ```

    ```working
    5 plus 10 plus 10 plus 5 plus 10 plus 5 plus 5 = 50
    ```

    A plan of 5, 10, 10, 5, 10, 5 and 5 minutes comes to 50 minutes.

    Main 4 is closed as written (yes or no). It is kept because a "no" is itself informative, and
    the prompts turn a "yes" into an account. It is placed late, because it touches health.

    Check your own guide:

    - Does every main question come from a part of your study question?
    - Is the first question easy, and the most personal question late?
    - Is every main question open, or closed for a reason you can state?
    - Does any question take the person's experience for granted, or ask two things?
    - Are the words ones your respondents use?
    - Does the time plan add up, and does most of it go to the main questions?
  skill_ref: S36-R1-K02
- type: critique
  prompt: |
    A trainee shows you this guide for the clinic study and says it is ready.

    1. Warm-up: What is your name, age, address, occupation and monthly income?
    2. Do you think obesity is a disease?
    3. Tell me about the last time you came to the clinic.
    4. Why don't you follow the diet?
    5. Closing: Thank you.

    Say what to change, in order of how much it matters.
  answer: |
    1. Question 4 matters most. It takes for granted that the person does not follow the diet, and
       "why don't you" asks them to defend it. Replace it with an event: "What happened with the
       diet after your last visit?"
    2. Question 2 asks for an opinion on a medical category, in the clinic's word, as a closed
       question. It does not come from the study question, which is about coming back. Cut it.
    3. The warm-up is five questions in one, and income is sensitive. It is a form, not a warm-up.
       Collect plain facts on a short sheet at the end, if you need them. Open with "Tell me about a
       usual day for you."
    4. There is only one main question left that serves the study: question 3. Question 3 is good,
       but the guide needs more main questions, one for each part of the study question, with
       prompts under each.
    5. The closing gives the respondent no last word. Add "Is there anything I have not asked about
       that I should have?"

    Then pilot it before calling it ready.
  skill_ref: S36-R1-K02
retrieval_items:
- q: What are the four parts of a topic guide?
  a: A warm-up question, main questions (DeJonckheere and Vaughn suggest five to 10) with prompts
    under each, and a closing question.
- q: What is the difference between a topic guide and a questionnaire read aloud?
  a: A topic guide is not read word for word in order. The interviewer changes the order and the
    wording to follow the respondent. A fixed list read aloud is a structured interview.
- q: Where do the main questions come from?
  a: From the study question. Each main question serves a part of it; one that serves none is cut.
