definition:
  text: |
    A research interview is a conversation in which a researcher asks a respondent about a topic in
    order to gather the respondent's account of it. Interviews are sorted into three kinds by how much
    is fixed before the interview begins.

    A structured interview administers a questionnaire. A questionnaire read aloud is a structured
    interview, and its answers are counted.

    A semi-structured interview follows a short guide of open-ended questions that define the area to
    be explored.

    An in-depth interview fixes less still. No interview is wholly without structure, so "unstructured
    interview" is a misleading name.

    A research interview is not a clinical consultation. The interviewer therefore does not diagnose,
    advise or correct.
