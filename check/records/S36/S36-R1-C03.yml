simplified_explanation: |
  Interviews come in three kinds. What separates them is how much is decided before you sit down.

  In a structured interview, everything is decided. You read out a questionnaire. Most answers are
  picked from a list.

  In a semi-structured interview, the topics are decided and the path is not. You carry a short guide
  of open questions: questions the person answers in their own words, not by picking from a list. You
  change the order and the wording to suit the person. When they say something you did not expect,
  you follow it, then come back to the guide.

  In an in-depth interview, almost nothing is decided. You open with one broad question about one or
  two issues. Everything after that comes from what the person has said: "What happened then?" "What
  do you mean by that?"

  The semi-structured kind is the most common, usually with one person, face to face, and recorded
  with their agreement.

  A research interview is not taking a history. In a history, you steer the patient's story toward a
  diagnosis and a plan. You do not diagnose, you do not advise, and you do not correct.
illustrations:
- body: |
    Take the question from the last two sections: why do adults with obesity stop coming back to the
    clinic? Here is the same topic set up three ways. Every question here is made up for this book.

    **Structured.** You read from a printed form and tick boxes.

    ```table
    | Question | Answers allowed |
    | In the last three months, how many clinic dates did you miss? | none; one or two; three or more |
    | What was the main reason? | distance; cost; felt better; other |
    ```

    **Semi-structured.** You carry a guide of a few open questions, and use it as a map, not a script.

    - "Tell me about the first time you came to this clinic."
    - "What has made it easier or harder to come back?"
    - "Tell me about the last date you did not come for."

    **In-depth.** You open once, then follow.

    - "I am trying to understand what coming to this clinic is like for people. Can you tell me about
      it, from the beginning?"

    Now decide what each one can give you, before you read on.

    The structured form gives a tick in a box. You can count the ticks across a hundred people, and a
    count is what it is for. It cannot give a reason nobody put on the form. That is the tick-list from
    the first section again.

    The semi-structured guide makes sure the same few areas come up with everyone. It still leaves room
    for the answer you did not expect.

    The in-depth opening goes deepest into one person's story. It covers only what that person chooses
    to bring up.

    For a why question, the structured form is the wrong tool. Choose between the other two by how
    much you already know about what matters. Knowing the areas but not the answers points to the
    semi-structured guide.
  analogy_breaks_when: |
    The three kinds are points on a line, not boxes with walls. A structured form may end with one open
    question, and a semi-structured interview can turn into an in-depth one halfway through.

    Papers also use the names loosely. DeJonckheere and Vaughn call the interviews they describe both
    semi-structured and in-depth. When you read a study, look at what the interviewer fixed in advance,
    not at the name it uses.
  numbers: []
- body: |
    Now a made-up exchange, translated from Chhattisgarhi. You are the interviewer, I. The respondent,
    R1, is a woman in her fifties who stopped coming to the clinic. Each made-up interview in this book
    is separate, and the labels R1, R2 and so on start again in each one. You are also a doctor, and the
    habit of taking a history is strong. Here is what the habit does.

    ```table
    | Speaker | Words |
    | I | Why did you stop coming? |
    | R1 | After the second time, my knees were very bad. |
    | I | Which knee? Is the pain worse in the morning? |
    | R1 | Both. Mornings, yes. |
    | I | Are you taking the tablet the doctor gave you? You should take it every day. |
    | R1 | Yes, yes, I take it. |
    ```

    Look at what happened. She mentioned her knees, and you turned them into a diagnosis. You asked
    closed questions to fit them into a medical category. Then you gave advice. She gave the answer
    that ends the topic. You now know about her knees. You still do not know why she stopped coming.

    Now run the same opening as a research interview.

    ```table
    | Speaker | Words |
    | I | Tell me about the last time you came to the clinic. |
    | R1 | After the second time, my knees were very bad. |
    | I | Your knees. Tell me more about that. |
    | R1 | The clinic is upstairs, and there is no lift. I climb, then I wait standing, because the benches are full. By the time my name is called, I cannot think. |
    | I | And after that visit? |
    | R1 | My son said, why go and suffer. So I stopped. |
    ```

    This time the knees led somewhere. The stairs, the full benches and a son's advice are reasons a
    clinic can act on. You got them by asking her to say more, and then by waiting. You did not
    diagnose, advise or correct.

    Her knees still matter. If she asks for help with them, Britten's way out is to say you will come
    back to it at the end of the interview, and then do.
  analogy_breaks_when: |
    This exchange is built to make the contrast plain. Real respondents do not always open up when
    asked to say more. Some keep to short answers whatever you do.

    A respondent who knows you are a doctor may also answer as a patient does, with what she thinks a
    doctor wants to hear. Britten warns of exactly this. The second exchange removes the history-taking,
    not the white coat.
  numbers: []
must_know:
- point: |
    A research interview is not a history with a recorder running. In a research interview,
    steering the account into your own categories is the error, because it swaps the respondent's account for yours.
  kind: misconception
  bearing: methodological
- point: |
    Choose the kind of interview from the question. A how-many question with known answer options
    takes a structured form whose answers you count. A why or how question takes a semi-structured
    guide. One story told in full, such as one family's experience of a diagnosis, can take an in-depth
    interview.
  kind: move
  bearing: methodological
- point: |
    When a respondent mentions a symptom, you will feel pulled back into doctor mode. Do not ask the
    diagnostic question and do not advise. Ask her to say more, and offer to come back to her health
    question when the interview ends.
  kind: trap
  bearing: clinical
- point: |
    A questionnaire read aloud is still a questionnaire.
  kind: consequence
  bearing: methodological
- point: |
    The labels are used loosely in papers, so the name of the interview tells you little. Look in the
    methods for what the interviewer fixed in advance and what they followed.
  kind: boundary
  bearing: methodological
- point: |
    When you teach a resident to interview, have them play back their own recording. They mark every
    place they diagnosed, advised or corrected.
  kind: move
  bearing: teaching
exercises:
- type: interpretation
  prompt: |
    Three made-up descriptions of how interviews were run. Name the kind of interview in each, and say
    what in the description told you.

    1. "Field workers read 24 questions from a printed form. Each answer was marked on a four-point
       scale."
    2. "The interviewer opened with: 'Tell me about your life since the diagnosis.' She then asked only
       about what the respondent raised."
    3. "Interviews followed a guide of six open questions on meals at home. Interviewers were free to
       change the order and to follow up on what respondents said."
  answer: |
    1. Structured. The questions were fixed, read from a form, and the answers were chosen from a
       fixed scale. These answers are for counting.
    2. In-depth. There was one broad opening question, and everything after it came from what the
       respondent said.
    3. Semi-structured. A short guide of open questions fixed the areas. The order and the follow-up
       questions were left to the interviewer.
- type: critique
  skill_ref: S36-R1-S1
  prompt: |
    Here is a made-up exchange from a practice interview on why patients stop coming to the clinic,
    translated from Hindi. R2 is a woman in her forties.

    ```table
    | Speaker | Words |
    | I | So you stopped coming after March? |
    | R2 | Yes. My sugar was fine by then. |
    | I | Fine? What was your last reading? You know, sugar can be high without any symptoms. |
    | R2 | I don't remember the reading. |
    ```

    Say where the interviewer left the research interview. Then rewrite the interviewer's second line
    so the interview stays one.
  answer: |
    The interviewer left the research interview at the second line. The respondent gave her own reason
    for stopping: she believed her sugar was fine. The interviewer treated that as a clinical error.
    The line asks for a reading, which is diagnosing, and warns about hidden high sugar, which is
    correcting. The respondent then has nothing to say but that she does not remember.

    What got lost is the respondent's own way of seeing it. How she decided her sugar was fine is
    exactly the kind of reason the study is looking for.

    A rewrite of the second line: "Your sugar was fine. How did you know it was fine?" Or: "Tell me
    more about that." Either asks her to go on in her own words. If her belief worries you clinically,
    say so after the interview, not during it.
- type: teaching
  prompt: |
    A first-year resident asks: "I take histories every day. Why would a research interview need any
    new skill?" You have ten minutes and a whiteboard.
  answer: |
    Draw two columns on the board: "history" and "research interview". In each, write what the talk is
    for.

    Under history: fit the problem into a medical category, then choose a treatment. The doctor steers,
    because time is short and a diagnosis is the goal.

    Under research interview: find how the person sees the matter, in their own words. The interviewer
    avoids steering the account into the interviewer's categories, because that replaces the person's account with the interviewer's.

    Then act out the first exchange of this section's second illustration with the resident as R1.
    Ask "Which knee? Is it worse in the morning?" and let them feel the conversation close. Run it again
    with "Tell me more about that" and wait.

    Finish with the three things a history does that an interview must not: diagnose, advise, correct.
    Many history skills carry over: listening, and noticing what is left out. The habit of steering is
    what has to be unlearned.
quantitative: false
retrieval_items:
- q: What separates the three kinds of interview?
  a: 'How much is fixed in advance: everything in a structured interview (a questionnaire), the areas
    and a few open questions in a semi-structured one, and almost nothing after the opening in an in-depth
    one.'
- q: How does a research interview differ from taking a clinical history?
  a: A history fits the problem into a medical category to choose treatment; a research interview seeks
    the respondent's own way of seeing it, so the interviewer does not diagnose, advise or correct.
- q: What is the most common kind of qualitative interview?
  a: Semi-structured, usually with one respondent, face to face, and audio recorded with their agreement.
