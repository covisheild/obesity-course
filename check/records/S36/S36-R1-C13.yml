definition:
  text: |
    In a qualitative report, a quotation from a respondent is evidence offered for a claim the
    author makes about the data. It is not decoration.

    A reader checks a quotation with the four acts used on any reference. Find the transcript.
    Confirm the speaker is the one named. Find the passage. Read whether it says what it was quoted
    for.

    Choosing only the quotations that fit the author's view, or cutting a quotation so that it fits,
    is cherry-picking. It fails the last of those checks.
  references:
  - citekey: dejonckheere_vaughn_2019
    kind: primary
    locator: 'Step 11: presenting findings in a paper or report'
    quote: In interview research, the participant words are your data. Presenting findings in a report requires the integration of quotes into a more traditional written format.
    verified:
      resolved_id: https://doi.org/10.1136/fmch-2018-000057
      opened: true
      claim_located: true
      checked_on: '2026-09-24'
      note: |
        The respondent's words are the data, and quotations carry them into the report.
  - citekey: dejonckheere_vaughn_2019
    kind: primary
    locator: 'Step 11: presenting findings in a paper or report'
    quote: This involves providing an in-depth description of participant perspectives and being sure to include multiple perspectives.
    verified:
      resolved_id: https://doi.org/10.1136/fmch-2018-000057
      opened: true
      claim_located: true
      checked_on: '2026-09-24'
      note: |
        Supports presenting more than one perspective, against cherry-picking.
  - citekey: mays_pope_2000
    kind: primary
    locator: Assessing the validity of qualitative research, Clear exposition of methods of data collection and analysis
    quote: the written account should include sufficient data to allow the reader to judge whether the interpretation proffered is adequately supported by the data.
    verified:
      resolved_id: https://doi.org/10.1136/bmj.320.7226.50
      opened: true
      claim_located: true
      checked_on: '2026-09-24'
      note: |
        Quoted data are what let a reader judge whether the claim is supported.
  - citekey: mays_pope_2000
    kind: primary
    locator: Assessing the validity of qualitative research, Attention to negative cases
    quote: a long established tactic for improving the quality of explanations in qualitative research is to search for, and discuss, elements in the data that contradict, or seem to contradict, the emerging explanation of the phenomena under study.
    verified:
      resolved_id: https://doi.org/10.1136/bmj.320.7226.50
      opened: true
      claim_located: true
      checked_on: '2026-09-24'
      note: |
        Supports reporting the exception rather than choosing only the quotations that agree.
  - citekey: mays_pope_2000
    kind: primary
    locator: Assessing the validity of qualitative research, Fair dealing
    quote: so that the viewpoint of one group is never presented as if it represents the sole truth about any situation.
    verified:
      resolved_id: https://doi.org/10.1136/bmj.320.7226.50
      opened: true
      claim_located: true
      checked_on: '2026-09-24'
      note: |
        Fair dealing: one voice is not presented as the whole.
  - citekey: pope_ziebland_mays_2000
    kind: primary
    locator: Software packages designed to handle qualitative data, paragraph 1
    quote: this can protect the narrative structure of the data to avoid the problem of decontextualisation or data fragmentation.
    verified:
      resolved_id: https://doi.org/10.1136/bmj.320.7227.114
      opened: true
      claim_located: true
      checked_on: '2026-09-24'
      note: |
        Names the problem of a passage cut away from its context. The sentence is about software;
        it is cited only for the named problem, which is why a quotation must carry its context.
  - citekey: blackstone_2012
    kind: textbook
    locator: '9.2 Qualitative Interview Techniques and Considerations, Table 9.1 and the paragraph introducing it'
    quote: 'I also include a brief description of each code and a few (of many) interview excerpts from which each code was developed.'
    verified:
      resolved_id: https://saylordotorg.github.io/text_principles-of-sociological-inquiry-qualitative-and-quantitative-methods/
      opened: true
      claim_located: true
      checked_on: '2026-09-24'
      note: |
        Interview excerpts presented as the data a claim (here, a code) rests on. The textbook carries only this part of the concept: it does not give the four checks on a quotation, context, or cherry-picking, which rest on the primary references.
simplified_explanation: |
  A report on interviews usually carries quotations: a respondent's own words, set in quotation
  marks. They make the page come alive. That is not their job.

  Their job is to be evidence. The author claims something about what people said. The quotation is
  offered as a reason to believe it. The words may not be what the person said, or not what they
  meant. Or they may be true, and still not carry the claim built on them.

  So you check a quotation the way you check any reference (the section on checking a reference).
  Find the transcript. Confirm the speaker is the person named. Find the lines. Then read them, and
  read the lines around them, and ask: does this say what it was quoted for?
illustrations:
- body: |
    Suppose a colleague has drafted a short report on practice interviews at the district hospital
    clinic in Chhattisgarh, where adult patients with obesity stop coming back. Everything below is
    made up, and the respondent's words are translated from Hindi. The report says:

    > Patients stop coming because the clinic is too far. As one woman put it, "The bus is the
    > problem" (R3, woman, 40s).

    Check it with the four acts, one at a time.

    First, find it. Open R3's transcript. Search inside it for "bus". There is a hit.

    Second, confirm the speaker. Read the line before the hit, not only the hit itself.

    ```table
    | Speaker | Words |
    | I | So it is the bus that is the problem? |
    | R3 | The bus is the problem, yes. But I came for two years on that bus. |
    | I | Mm. |
    | R3 | I stopped when I started work at the brick kiln. They do not give a day off. If I go to the clinic, I lose the job. |
    ```

    R3 did say "The bus is the problem". But the words were the interviewer's first. They arrived in
    a leading question, and she agreed with it (the section on open, closed and leading questions).
    The quotation is hers only in the sense that she repeated it.

    Third, find the exact place. You have it: her first answer.

    Fourth, read it, with the lines around it. The rest of her answer says the bus was not the
    reason. She rode it for two years. She stopped when a job came that gives no day off. The
    quotation is real, spoken by the right person, found at the right place. It says the opposite
    of what it was quoted for.

    Now write it as evidence. The claim changes, and the quotation carries its context:

    > R3 (woman, 40s) had managed the bus journey for two years. She stopped when she began work
    > that gives no day off: "If I go to the clinic, I lose the job."
  analogy_breaks_when: |
    Inside a study, you can open the transcripts. A reader of a published report usually cannot.
    They see only the lines the author chose, so the author's label, context and statement of
    typical or exception are all they have. That is why reporting standards for quotations exist,
    and they are taught in S36-R2.

    The four acts also test only whether a quotation matches the transcript. They cannot test
    whether the transcript matches the recording, or whether a translation kept the sense. When a
    claim turns on one quotation, ask for that passage of the audio, and the words in the language
    spoken.
- body: |
    Take the corrected claim from the first case and ask the next question: what does the quotation
    stand for? Suppose there are five practice transcripts, R1 to R5, all made up.

    Read each one for anything about work and clinic days. Here is what you find, set out by
    respondent.

    ```table
    | Respondent | What they said about work and clinic days |
    | R1 | Her son takes unpaid leave to bring her. |
    | R2 | Nothing about work. |
    | R3 | Stopped when she began kiln work with no day off. |
    | R4 | Works too, and still comes. The clinic's Saturday session fits his shift. |
    | R5 | Keeps the shop closed on clinic days, and nobody earns that day. |
    ```

    Three people tie a clinic visit to a lost day of work, their own or a relative's. One, R4, runs
    the other way. He works and still comes, because a session fits his shift.

    So a fair report says who said what. For example: "R1, R3 and R5 each described a clinic visit
    costing a day of paid work, their own or a family member's. R4 also works, and has kept coming
    because the Saturday session fits his shift." R3's quotation goes under that sentence, marked as
    one of the three.

    Look at what R4 does to the report. Without him, the page reads as "work stops people coming".
    With him, it reads as "a visit that costs a working day stops people coming, and a session
    outside working hours may let them keep coming". That second sentence is something the clinic
    could test.
  analogy_breaks_when: |
    "Three of five" here describes these five people and nobody else. They were chosen for what they
    could tell you, not drawn at random (the section on who you talk to). So the count says how the
    pattern sits inside this set of transcripts. It does not say how common the reason is among the
    clinic's patients.
must_know:
- point: |
    A vivid quotation does not show that something is common. It shows that one person said it, in
    those words.
  kind: misconception
  bearing: methodological
- point: |
    Run the four reference checks on any quotation you are handed. Expect the failure at the last
    act, where the words are real and the claim is not.
  kind: move
  bearing: methodological
- point: |
    Read the line before a quotation. If the interviewer said the words first and the respondent
    agreed, the quotation is the interviewer's idea in the respondent's mouth.
  kind: trap
  bearing: methodological
- point: |
    Give enough of the surrounding talk for the sense to be clear. Say whether others said
    something like it.
  kind: move
  bearing: methodological
- point: |
    Before a service is changed on the strength of a quoted reason, ask for the transcript lines
    around the quotation. Moving the clinic nearer does nothing for R3, whose reason was a job
    with no day off.
  kind: consequence
  bearing: policy
- point: |
    Keep the quotation that runs against the author's claim in the report, beside the ones that
    support it.
  kind: move
  bearing: teaching
- point: |
    These checks tell you whether a quotation is faithful to the transcript. When a claim rests
    on one quotation, check that passage against the audio and the words in the language spoken.
  kind: boundary
  bearing: methodological
exercises:
- type: critique
  prompt: |
    A draft report on practice interviews at the clinic says, with no other quotation on the topic:

    > Patients feel judged by the staff. "They look at me like I have done something wrong" (R2).

    Here are the lines around it in R2's transcript. They are made up, and translated from
    Chhattisgarhi.

    ```table
    | Speaker | Words |
    | I | How do the staff treat you? |
    | R2 | The sister is good to me. Only once, at the registration desk, a new boy was there. He looked at me like I had done something wrong. The next time it was the usual lady and it was fine. |
    ```

    Run the four checks, and say what the report should write instead.
  answer: |
    Find it: open R2's transcript and search for the quoted words. They are not there. The nearest
    line is "He looked at me like I had done something wrong."

    Confirm the speaker: that line is R2's own, and the question before it was open, so it is not an
    echo of the interviewer.

    Find the place: this is where the first failure shows. The quotation is not her words. "He
    looked" became "They look". One person on one day became all the staff, every time.

    Read it, with the lines around it: this is where the claim fails outright. R2 describes one
    occasion with one new person at the registration desk. She says the nurse ("the sister") is
    good to her, and that the next visit was fine. The draft turns that into "Patients feel judged by
    the staff": one incident into a habit, and one woman into all the patients.

    The lines just before and after the quotation reverse its sense, and they were left out. That is
    cherry-picking, whether or not it was meant.

    A fair version: "R2 described one visit on which a new person at the registration desk made her
    feel she had done something wrong. She said the nurse is good to her and that the next visit was
    fine." If other transcripts describe something similar, say which. If none do, say that too.
  confidence_first: true
- type: teaching
  prompt: |
    A health secretary has read a district report. It quotes one patient saying "The clinic is too
    far to come every month". On that basis the secretary proposes to fund a mobile van. Write the
    one page you would send: answer first, no methods section.
  answer: |
    The page should open with the answer. For example: "One quotation is not enough to fund the van
    on. Ask the team for three things first."

    Then the three things, in plain words:

    1. The lines around the quotation, from the transcript. They may say more than the report
       shows. In this section, R3's words about distance were followed by her real reason.
    2. Which other patients said something about distance, and which said something else. One
       quotation can be the exception.
    3. Whether the words were the patient's own, or an answer to a question that suggested them.

    Close with what would justify the van. Several patients would describe distance, in their own
    words, as the reason they stopped. And nobody in similar circumstances would keep coming. Then
    say what the interviews cannot tell them. They show reasons, not how many patients hold each
    one. How many patients a van would bring back needs a count of its own.

    What not to write: an explanation of qualitative methods. The secretary needs the decision and
    the check, not the theory.
retrieval_items:
- q: What is a quotation in a qualitative report for?
  a: It is evidence offered for a claim the author makes about the data, not decoration.
- q: What three things should a quotation carry in a report?
  a: A label tying it to one transcript without naming the person, enough surrounding talk for its sense, and whether it is typical or an exception.
- q: At which of the four reference acts do most quotation failures show?
  a: The last, reading the lines with their context, where the words are real but do not say what they were quoted for.
figure_note: A quotation is checked by reading words against words, and the transcript lines in the tables show that better than any chart the figure tool draws.
