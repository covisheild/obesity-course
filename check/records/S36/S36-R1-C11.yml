        here for the arithmetic of a share, which the reader rebuilds from that Book 0 section. No
        held source states the talk share or its gate: the gate is the course map's (S36 rung 1,
        "the respondent speaks more than you do"). DeJonckheere and Vaughn, below, are cited only
        for the nearest thing they do say, not for the rule.
