simplified_explanation: |
  This rung ends with a simple test. In your interview, did the respondent speak more than you did?

  Your words divided by all the words, times a hundred, is your share. If it is under 50 per cent,
  the respondent spoke more.

  Count words, not turns.

  A low share is good news about one thing only: who spoke more. It cannot tell you whether your
  questions pushed the answers in one direction. For that you read the questions.
illustrations:
- body: |
    Suppose you have interviewed two women at the district hospital NCD clinic in Chhattisgarh.
    Both have stopped coming back for follow-up. Here are two made-up stretches of those
    interviews, put into English from Chhattisgarhi. `I` is you.

    The first one.

    ```table
    | Speaker | Words |
    | I | What happened after your last visit here? |
    | R1 | I went home with the tablets and the diet paper. The tablets finished in a month. To get more I had to come back, and coming back means a whole day. My husband drops me at the bus stand at seven, and the clinic bus is often full. |
    | I | A whole day? |
    | R1 | Yes. By the time the doctor sees me it is afternoon. Then there is the line at the pharmacy. I reach home after dark and the cooking is not done. |
    | I | Tell me more about that. |
    | R1 | My mother-in-law does not say anything, but I can see she is tired. So the next month I thought, let the tablets wait. And then I did not come again. |
    ```

    The second one.

    ```table
    | Speaker | Words |
    | I | Last time you were here the doctor gave you tablets and a diet chart and asked you to come back in a month, and you did not come, so I wanted to ask whether it was the distance or the cost or something about the clinic itself, because many patients tell us the waiting is very long? |
    | R2 | The distance. |
    | I | The distance. So is it the bus fare, or is it more that it takes the whole day and you have work at home and cannot leave the children? |
    | R2 | The whole day. |
    | I | I see. And did anyone at home say anything about you coming here, or did they support you? |
    | R2 | They support me. |
    ```

    Here is the trap. Count the turns first. In each excerpt you spoke three times, and the
    respondent spoke three times. By turns, both are an even split. By turns, the two interviews
    look the same.

    Now count words. A word is whatever stands between two spaces, so "mother-in-law" is one word.
    Count each turn, then add up each speaker's turns.

    ```working
    first excerpt, you: 7 plus 3 plus 5 = 15 words
    first excerpt, R1: 48 plus 30 plus 30 = 108 words
    second excerpt, you: 57 plus 29 plus 18 = 104 words
    second excerpt, R2: 2 plus 3 plus 3 = 8 words
    ```

    Now each share. Your words, divided by all the words, times a hundred.

    ```working
    15 plus 108 = 123 words in the first excerpt
    15 divided by 123 = 0.1219...
    0.1219... times 100 = 12.2 per cent

    104 plus 8 = 112 words in the second excerpt
    104 divided by 112 = 0.9285...
    0.9285... times 100 = 92.9 per cent
    ```

    ```table
    | Excerpt | Your turns | Respondent's turns | Your words | Respondent's words | All words | Your share (per cent) |
    | first | 3 | 3 | 15 | 108 | 123 | 12.2 |
    | second | 3 | 3 | 104 | 8 | 112 | 92.9 |
    ```

    The same three turns each. In one you said about an eighth of the words. In the other you said
    more than nine words in every ten.

    The ratio says the same thing another way. Divide the respondent's words by yours.

    ```working
    108 divided by 15 = 7.2
    8 divided by 104 = 0.0769...
    ```

    In the first, R1 said 7.2 words for each one of yours. In the second, R2 said less than a
    tenth of a word for each of yours. Above 1 means the respondent spoke more.

    Look at what the second interviewer did with all those words. The answers are offered inside
    the questions, the distance or the cost, and R2 picks one. The section on open, closed and
    leading questions showed why that happens.
  analogy_breaks_when: |
    Both excerpts are made up and short. A real interview runs to thousands of words, and the share
    over a whole interview can differ from the share over any stretch of it.

    The counts are of the English version. The same talk counted in Chhattisgarhi would give other
    numbers. The two speakers' counts need not change by the same amount, so compare shares only
    when both were counted on the same version.
- body: |
    Now suppose you have done all five pilot interviews for this rung and transcribed them. The
    word counts below are made up, to show the move.

    ```table
    | Interview | Your words | Respondent's words | All words | Your share (per cent) |
    | 1 | 1,150 | 3,850 | 5,000 | 23.0 |
    | 2 | 800 | 3,200 | 4,000 | 20.0 |
    | 3 | 2,730 | 2,470 | 5,200 | 52.5 |
    | 4 | 1,080 | 3,720 | 4,800 | 22.5 |
    | 5 | 900 | 4,100 | 5,000 | 18.0 |
    ```

    Work out each share the same way as before. Here is interview 3, the one that stands out.

    ```working
    2,730 divided by 5,200 = 0.525
    0.525 times 100 = 52.5 per cent
    ```

    Now the mean of the five shares, as Book 0 taught the mean: add them, then divide by how many
    there are.

    ```working
    23.0 plus 20.0 plus 52.5 plus 22.5 plus 18.0 = 136
    136 divided by 5 = 27.2 per cent
    ```

    A mean of 27.2 per cent sounds like a clear pass. It hides interview 3, where you said more than
    the respondent did. Four interviews passed the gate and one did not.

    So open transcript 3 and find where your words went. Suppose you find it quickly. Halfway
    through, the respondent asked what the numbers on her report meant. You spent several minutes
    explaining them, as you would in clinic. That is a useful thing to find in a pilot. The
    respondent asked a clinical question, and you slipped from interviewing into consulting.

    Why aim well below half, and not just below it? Your counts depend on choices from the last
    section. A cleaned transcript drops your "Mm-hm"s and her repeats. A count on the English
    version differs from a count on the Chhattisgarhi one. A share of 48 per cent can become 52 per
    cent under a different counting rule. A share of 25 per cent will not. The gate asks only that
    the respondent speak more. A wide margin means the answer does not depend on how you counted.

    You will not find this rule in the methods papers. DeJonckheere and Vaughn advise "prioritising
    listening over talking", and they set no number. The 50 per cent line is this course's own
    gate for this rung.
  analogy_breaks_when: |
    The five counts are made up. Real pilot interviews vary more in length than these, and the
    more they vary, the further the mean share can sit from the share of all your words taken
    together.

    Nothing in the table says whether the respondents' long answers were their own. A respondent
    can speak at length in answer to a leading question and still have the gate met.
must_know:
- point: |
    Count words, not turns. Turns alternate, so they split close to evenly in almost any interview.
  kind: trap
  bearing: methodological
- point: |
    The share and the ratio are different numbers. Say which one you are quoting.
  kind: misconception
  bearing: methodological
- point: |
    A low talk share does not show that you did not lead. Once the share passes, read your own
    questions for leading, turn by turn. The count cannot do that part for you.
  kind: boundary
  bearing: methodological
- point: |
    A mean share across five interviews can pass while one interview fails. Report each interview's
    share, and open the transcript of any that sits near or above half.
  kind: trap
  bearing: teaching
- point: |
    Aim well under half, not just under it. Write down how you counted beside every share you
    report.
  kind: move
  bearing: methodological
- point: |
    The 50 per cent line is this course's gate, not a published standard.
  kind: misconception
  bearing: teaching
- point: |
    When a trainee says "I barely spoke", ask for the two word counts.
  kind: move
  bearing: teaching
exercises:
- type: interpretation
  skill_ref: S36-R1-K01
  prompt: |
    Take the transcript of your own first practice interview. Count your words and the
    respondent's, and work out your talk share. Then find your three longest turns and read them.
    For each, say what you were doing with those words, and whether the respondent's next answer
    took up your words or her own.
  answer: |
    There is no single right number here, because the transcript is yours. The working has a fixed
    shape, though.

    First the count. Add your words turn by turn, then the respondent's. Add the two for all the
    words. Your words divided by all the words, times a hundred, is your share. Write beside it
    which transcript you counted, full verbatim or cleaned, and in which language.

    Then the three longest turns. Long interviewer turns in a first interview are usually one of
    four things. The first is a question with its possible answers built in ("was it the distance or
    the cost"). The second is an explanation or advice, which is the clinician coming back. The
    third is a summary of what the respondent said, which invites her to agree. The fourth is a
    story of your own. Name which one each turn is.

    Then look at the answer that follows each long turn. If it repeats your words back ("yes, the
    distance"), the turn steered her. If it goes somewhere you did not mention, it did not.

    If your share is under half and none of the three turns steered her, you have met the gate.
    If your share is under half and a turn did steer her, the share has passed and the interview
    has not. That second case is the one this exercise exists to catch.
quantitative: true
practice:
- level: 1
  prompt: |
    In a transcript, the interviewer says 450 words and the respondent says 1,350. Work out the
    interviewer's talk share, the respondent's talk share, and the ratio of the respondent's words
    to the interviewer's.
  answer: |
    All the words first.

    ```working
    450 plus 1,350 = 1,800 words
    ```

    The interviewer's share.

    ```working
    450 divided by 1,800 = 0.25
    0.25 times 100 = 25 per cent
    ```

    The respondent's share is what is left of the hundred.

    ```working
    100 minus 25 = 75 per cent
    ```

    The ratio, respondent's words over interviewer's.

    ```working
    1,350 divided by 450 = 3
    ```

    Three words from the respondent for every one from the interviewer.
- level: 2
  prompt: |
    A respondent's talk share is 64 per cent. What is the interviewer's share? What is the ratio of
    the respondent's words to the interviewer's?
  answer: |
    The two shares make a hundred between them.

    ```working
    100 minus 64 = 36 per cent
    ```

    The ratio does not need the word counts. The shares are the counts scaled by the same amount,
    so their ratio is the ratio of the counts.

    ```working
    64 divided by 36 = 1.777...
    ```

    The respondent said about 1.78 words for each word of the interviewer's. Above 1, so the
    respondent spoke more.
- level: 3
  prompt: |
    Count the words in each line, then give the first speaker's share of all the words, to one
    decimal place.

    > What did you eat yesterday, from morning to night?

    > Tea in the morning, then rice and dal at noon, and roti at night.
  answer: |
    Count what stands between the spaces.

    ```working
    first line: 9 words
    second line: 14 words
    9 plus 14 = 23 words
    ```

    The first speaker's share.

    ```working
    9 divided by 23 = 0.3913...
    0.3913... times 100 = 39.1 per cent
    ```

    Short exchanges often give the asker a large share. One question and one answer is not an
    interview, and the share only means something over a whole transcript.
- level: 4
  prompt: |
    Here is a made-up stretch of a transcript from the NCD clinic, put into English from Hindi.

    ```table
    | Speaker | Words |
    | I | How did you first come to this clinic? |
    | R4 | The health worker in our village told me. She checked my pressure at the village centre and said it was high, and that I should get my sugar tested at the district hospital. |
    | I | What was that first visit like? |
    | R4 | Long. I left the children with my sister. The doctor was kind, but she wrote many things on the paper and I could not read all of it. |
    | I | And what did you do with the paper? |
    | R4 | I kept it in the tin with the ration card. |
    ```

    Work out the interviewer's talk share over this stretch, and say whether it would meet the
    gate.
  answer: |
    Count each turn.

    ```working
    interviewer: 8 plus 6 plus 8 = 22 words
    R4: 33 plus 28 plus 10 = 71 words
    22 plus 71 = 93 words
    ```

    The interviewer's share.

    ```working
    22 divided by 93 = 0.2365...
    0.2365... times 100 = 23.7 per cent
    ```

    Under half, and well under it, so this stretch would meet the gate. The questions are short and
    open. The respondent takes each one somewhere of her own: the health worker, her sister, the
    tin with the ration card.

    Keep two limits in view. This is one stretch, not the whole interview. And the count is of the
    English version.
- level: 5
  prompt: |
    Here are the word counts from five practice interviews.

    ```table
    | Interview | Interviewer's words | All words |
    | A | 600 | 4,000 |
    | B | 1,400 | 3,500 |
    | C | 900 | 4,500 |
    | D | 700 | 5,000 |
    | E | 2,100 | 3,000 |
    ```

    Work out the interviewer's share in each, the mean of the five shares, and which interviews
    met the gate.
  answer: |
    Each share: interviewer's words divided by all the words, times a hundred.

    ```working
    600 divided by 4,000 = 0.15, so 15 per cent
    1,400 divided by 3,500 = 0.4, so 40 per cent
    900 divided by 4,500 = 0.2, so 20 per cent
    700 divided by 5,000 = 0.14, so 14 per cent
    2,100 divided by 3,000 = 0.7, so 70 per cent
    ```

    The mean of the five.

    ```working
    15 plus 40 plus 20 plus 14 plus 70 = 159
    159 divided by 5 = 31.8 per cent
    ```

    A, B, C and D met the gate. E did not: the interviewer said 70 per cent of the words, more than
    twice what the respondent said. B passed, but at 40 per cent it is the next one to read.

    The mean of 31.8 per cent would pass on its own. It is the wrong number to report, because it
    hides interview E.
- level: 6
  prompt: |
    In a practice interview, the respondent said 3,500 words. You want your talk share to be no more
    than 30 per cent. What is the largest number of words you could have said?
  answer: |
    If your share is 30 per cent, the respondent's is what is left.

    ```working
    100 minus 30 = 70 per cent
    ```

    So her 3,500 words are 70 per cent of all the words. Find all the words from that.

    ```working
    70 per cent = 0.70
    3,500 divided by 0.70 = 5,000 words in all
    ```

    Your words are what remains.

    ```working
    5,000 minus 3,500 = 1,500 words
    ```

    Check it the forward way.

    ```working
    1,500 divided by 5,000 = 0.3, so 30 per cent
    ```

    At most 1,500 words. Any fewer and your share drops below 30 per cent.
- level: 7
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
    interviewer: 22 turns, 1,100 words
    respondent: 22 turns, 4,400 words
    22 turns each, so the interviewer's share is 50 per cent
    so the gate was not met
    ```
  answer: |
    The step that broke is the third line. It counts turns where it should count words.

    Redo it on words.

    ```working
    1,100 plus 4,400 = 5,500 words
    1,100 divided by 5,500 = 0.2
    0.2 times 100 = 20 per cent
    ```

    The interviewer's share is 20 per cent. The respondent said four words for every one of the
    interviewer's, and the gate was met with room to spare.

    Why the wrong answer looks reasonable: a turn feels like a fair unit of "speaking", and 22 each
    looks like balance. But turns alternate by the nature of an interview, so equal turns are
    almost guaranteed. They say nothing about how long each person spoke.
- level: 7
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
    I said 1,200 words and R2 said 4,800 words
    1,200 divided by 4,800 = 0.25
    so my talk share was 25 per cent
    ```
  answer: |
    The division is right. The step that broke is the last line. It calls a ratio a share.

    1,200 divided by 4,800 compares your words with hers. A share compares your words with all the
    words.

    ```working
    1,200 plus 4,800 = 6,000 words
    1,200 divided by 6,000 = 0.2
    0.2 times 100 = 20 per cent
    ```

    Your share was 20 per cent. The 0.25 is the ratio of your words to hers: a quarter of a word
    from you for each of hers.

    Why it looks reasonable: both numbers are "your words divided by something", and both come out
    small. Your words divided by hers is always the larger of the two, because it divides by less.
    So the mix-up always makes your share look bigger than it is. Here both numbers pass. At 2,000
    words against 3,000 they would not agree. The real share is 2,000 divided by 5,000 = 0.4, which
    is 40 per cent, and passes. The ratio is 2,000 divided by 3,000, about 0.667, and read as 66.7 per
    cent it would fail.
- level: 8
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
    interview A: I said 200 words, the respondent 800, so my share was 20 per cent
    interview B: I said 3,000 words, the respondent 2,000, so my share was 60 per cent
    20 plus 60 = 80
    80 divided by 2 = 40
    so across the two interviews I said 40 per cent of all the words
    ```
  answer: |
    The two shares are right, and so is their mean. The step that broke is the last line, which
    reads the mean of two shares as the share of all the words.

    The mean of the shares gives each interview an equal say. But interview A has 1,000 words and
    interview B has 5,000. Pool the words instead.

    ```working
    200 plus 3,000 = 3,200 of your words
    1,000 plus 5,000 = 6,000 words in all
    3,200 divided by 6,000 = 0.5333...
    0.5333... times 100 = 53.3 per cent
    ```

    Across the two interviews you said 53.3 per cent of all the words, which is more than half. The
    worked answer said 40.

    Why it looks reasonable: averaging two percentages feels like the natural way to combine them.
    It is right only when the two interviews are the same length. Here the long interview is the one
    where you talked most, so the pooled share is pulled up towards it.

    And one thing neither number should hide. Interview B failed the gate on its own, whichever
    way the two are combined.
- level: 9
  prompt: |
    A trainee hands you this note about a practice interview, with the stretch of transcript it is
    about. The exchange is made up.

    > I barely spoke in this part. R3 did nearly all the talking.

    ```table
    | Speaker | Words |
    | I | Most of our patients tell us the diet is too hard to follow when you are cooking for a whole family, so I think you also found it hard, no? Tell me about that. |
    | R3 | Yes, it is hard. I cook for six people. They want rice and I am told to eat less rice, so I make two things, and that is too much work, so I stopped. |
    | I | So the diet was the reason you stopped coming? |
    | R3 | Yes, the diet. |
    ```

    Decide what to compute, compute it, and say what your answer does not establish.
  answer: |
    The claim is about who spoke more, so compute the trainee's talk share over this stretch.

    ```working
    trainee: 34 plus 9 = 43 words
    R3: 34 plus 3 = 37 words
    43 plus 37 = 80 words
    43 divided by 80 = 0.5375
    0.5375 times 100 = 53.75, about 53.8 per cent
    ```

    The trainee said more than half the words in this stretch. "Barely spoke" is wrong, and so is
    "nearly all the talking". R3 did not pass the gate here.

    What the count does not establish is the bigger problem. Suppose the numbers had come out the
    other way, with R3 saying most of the words. The stretch would still be steered. The first
    question tells R3 what other patients say and what the trainee thinks she found. The second
    question hands her a conclusion to agree with. Her "Yes, the diet" is an answer to that, not a
    reason she offered.

    So the count answers the trainee's claim and nothing more. It cannot tell you whether the diet
    is really why R3 stopped coming. After this exchange, nobody can.
- level: 10
  prompt: |
    A colleague's pilot report says:

    > All five of my pilot interviews met the gate. My average talk share was 38 per cent.

    The appendix gives the five shares as 22, 31, 64, 35 and 38 per cent. Decide what to compute,
    compute it, and say what your answer does not establish.
  answer: |
    Two claims are made. The average, and "all five met the gate". Check the average first.

    ```working
    22 plus 31 plus 64 plus 35 plus 38 = 190
    190 divided by 5 = 38 per cent
    ```

    The average is right. The first sentence is not. The third interview has a share of 64 per
    cent, so in that interview the colleague said more than the respondent. Four of the five met
    the gate.

    The slip is reading an average below 50 as meaning every value is below 50. Book 0 warned about
    exactly this with means and cut-offs.

    What the check does not establish. The report gives shares, not word counts, so you cannot
    work out the pooled share of all the words. You cannot tell whether the four passing interviews
    were free of leading questions, because a share cannot show that. And the shares may have been
    counted on cleaned or translated transcripts, so ask which version was counted before
    comparing them with anyone else's.
retrieval_items:
- q: How do you work out an interviewer's talk share?
  a: Count the interviewer's words and everyone's words in the transcript. Divide the interviewer's words by all the words and multiply by a hundred.
- q: Why count words and not turns?
  a: Turns alternate, so they come out close to equal in almost any interview. Words show who actually spoke more.
- q: Your mean talk share over five interviews is 30 per cent. Did every interview meet the gate?
  a: Not necessarily. A mean below 50 can hide one interview above 50. Check each interview's share.
