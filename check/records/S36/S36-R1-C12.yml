simplified_explanation: |
  First, read the whole transcript once, start to end, with the pen down.

  Then read it again, line by line. When a passage bears on your question, mark it. Write a short
  label in the margin saying what it is about. That label is a code.

  A passage is the stretch that says one thing. It bears on the question if it says something about
  why the person came or stopped.

  Keep a memo as you go.

  Watch for the passage that does not fit. Mark it and keep it. It tells you where your pattern stops
  being true.

  Last, you do not wait until every interview is done. You read the second transcript before the
  third interview, and what you read changes what you ask.
illustration:
  body: |
    Suppose you are running the practice interviews for the clinic question: why do adult patients
    with obesity stop coming back to a district hospital clinic in Chhattisgarh? The exchange below
    is made up, and translated from Hindi. The respondent, R2, is a woman in her fifties who came for a year and then stopped.

    ```table
    | Speaker | Words |
    | I | Tell me about the last time you came to the clinic. |
    | R2 | It was in the rains. The bus from our village goes only in the morning, so I lose the whole day. My son has to take leave to bring me. |
    | I | Mm. |
    | R2 | And that time the sugar was fine. The doctor said it is under control. So I thought, if it is fine, why go every month? |
    | I | You said the sugar was fine. What was coming every month for, then? |
    | R2 | Standing in the line for the weighing. Everybody is there. The sister reads the number out loud. I did not want the whole line to hear it. |
    ```

    Read all six lines first, pen down.

    ```table
    | Passage | Code |
    | The bus goes only in the morning, so I lose the whole day | a whole day lost to one visit |
    | My son has to take leave to bring me | needs family to take time off |
    | If it is fine, why go every month? | "if it is fine, why go" |
    | The sister reads the number out loud | weighed in front of the line |
    ```

    The third label is her own words, because nothing you could write names it better.

    Then write a memo. For example: "Distance came up first, but she did not stop when the bus was
    hard. She stopped after she was told her sugar was under control. Next time, ask what a visit is
    for, in their words. Ask what happens from the moment they arrive, and do not name the weighing
    first."

    Suppose, last, that R4, a man in his sixties, lives further out than R2 and has not missed a visit. Mark it and keep it. It tells you distance
    alone does not decide who stops, and it gives you a question: what does R4 have that R2 does not?
  analogy_breaks_when: |
    A code here is your own label for finding and comparing passages. It is not yet a finding.
    Suppose two transcripts out of five carry "weighed in front of the line". That does not tell you
    what share of the clinic's patients stop for that reason. The five were chosen, not drawn at
    random (the section on who you talk to).

    The labels also belong to one reader. The next level of this subject takes up
    checking them with a second person.
  numbers: []
must_know:
- point: |
    Coding is not counting. If you tally how many transcripts carry it and report a percentage,
    you have made a rate out of people who were chosen, not drawn. Write "two respondents
    described..." and say who they were, not "two in five patients".
  kind: misconception
  bearing: methodological
  refs:
  - pope_ziebland_mays_2000
- point: |
    Read the whole transcript once before you mark anything. An early label can steer how you read
    the rest.
  kind: move
  bearing: methodological
  refs:
  - pope_ziebland_mays_2000
- point: |
    Label with the respondent's words or a plain description of what happened, never with the
    clinic's verdict. "Non-compliance" names the patient as the problem before you have understood
    her reason.
  kind: trap
  bearing: teaching
- point: |
    Keep the case that does not fit, and mark it.
  kind: move
  bearing: methodological
  refs:
  - pope_ziebland_mays_2000
- point: |
    Write a memo after each transcript, before the next interview, and let it change the topic
    guide.
  kind: consequence
  bearing: methodological
  refs:
  - dejonckheere_vaughn_2019
- point: |
    Many researchers check first codes by having a second person apply them; whether that is
    required is disputed. Until your codes have been checked in some way, present them as your
    working notes.
  kind: boundary
  bearing: methodological
  refs:
  - pope_ziebland_mays_2000
exercises:
- type: interpretation
  prompt: |
    Here is a made-up passage from a practice interview for the clinic question, translated from
    Hindi. R5 is a man in his forties.

    ```table
    | Speaker | Words |
    | I | What happens on a clinic day, from when you leave home? |
    | R5 | I leave before six. At the clinic there is a token, then a long wait. By the time the doctor sees me it is afternoon. The shop stays closed that day. |
    | I | Tell me more about the shop. |
    | R5 | It is my shop. If it is closed, nobody earns that day. My wife says go, your health comes first. But she is not the one who has to open the shop late. |
    ```

    Read it through once. Then write a code beside each passage that bears on why people stop coming,
    using his own words for at least one of them. Then write a one-line memo for your next interview.
  answer: |
    One reasonable set of codes, passage by passage:

    - "I leave before six ... it is afternoon": *a whole day for one visit*.
    - "The shop stays closed that day ... nobody earns that day": *"nobody earns that day"*, his own
      words, because they name the cost exactly.
    - "My wife says go, your health comes first": *family urges him to go*.
    - "she is not the one who has to open the shop late": *he carries the cost of going*.

    His second turn carries two codes that pull against each other: the family pushes him to go,
    and the cost falls on him. Both belong on the page.

    A memo, for example: "Waiting time, not travel, took his day. Ask the next person how long the
    visit itself takes, and who in the family decides whether they go."

    Your labels need not match these words. Check three things. Did you label what he said rather
    than judge him? Did one label use his words? Did the memo end with something to ask next time?
- type: critique
  prompt: |
    A colleague has read five practice transcripts from the clinic and hands you this note:

    > Codes: non-compliance (4 of 5). Main reason: distance, 80 per cent. R4 left out, as he is not
    > typical.

    Say what is wrong with the note, point by point, and what the note should say instead.
  answer: |
    Three things are wrong.

    First, the label. *Non-compliance* is a verdict from the clinic's side. It names the patients as
    the problem and says nothing about their reasons. Replace it with labels that describe what each
    person said, in their words where possible.

    Second, the count. "80 per cent" turns five chosen people into a rate. The five were picked for
    what they could tell you, not drawn at random, so the percentage describes nobody beyond them.
    Write which respondents described distance, and what each said about it.

    Third, R4. He is the case that does not fit, which is why he has to stay. Leaving him out makes
    distance look like the whole story. Keeping him asks the useful question: what lets him keep
    coming from further away?

    A better note, for example: "R1, R2 and R5 described a whole day lost to a visit, from travel or the wait. R2
    stopped after being told her sugar was under control. R4 lives furthest out and has not missed a
    visit. Next interview: ask what a visit is for, and what makes one possible."
  confidence_first: true
retrieval_items:
- q: What is a code, at this stage?
  a: A short label written beside a passage saying what it is about, so the passage can be found again and compared with others carrying the same label.
- q: Why read the whole transcript before marking anything?
  a: An early label can steer how you read the rest, and the first reason given need not be the one that mattered.
- q: What do you do with a passage that runs against the pattern?
  a: Keep it and mark it as a deviant or negative case; it tests and sharpens the pattern.
figure_note: "No honest chart: the only one the figure tool could draw is a tally of codes, the counting this section warns against."
