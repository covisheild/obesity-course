definition:
  text: |
    Reading a transcript for analysis starts with reading all of it once. On the second reading you
    mark each passage that bears on the study question. You write a short label beside it. That
    label is a code.

    A memo is a note, written while you read, of what you notice and what you want to ask next.
    Field notes (`S36-R1-C08`) are written straight after the interview. Some authors call both memos.

    A passage that runs against the pattern the other passages seem to show is a deviant or negative
    case. It is kept and marked, not dropped, because it is what tests and sharpens the pattern.
