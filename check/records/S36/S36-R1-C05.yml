    verified:
      resolved_id: https://saylordotorg.github.io/text_principles-of-sociological-inquiry-qualitative-and-quantitative-methods/s12-02-qualitative-interview-techniqu.html
      opened: true
      claim_located: true
      checked_on: '2026-09-24'
      note: |-
