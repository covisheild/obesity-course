definition:
  text: |
    A closed question fixes the possible answers before the respondent speaks. The answer is yes or
    no, a number, or one of a set of options the question supplies.

    An open question leaves the form of the answer to the respondent.

    Open and closed describe the form of the answer. Whether a question is leading is a separate
    property. A leading question shows the answer the asker expects, or takes for granted part of
    what it is asking about. "Don't you find the diet hard?" is closed and leading. "How hard is
    the diet for you?" is open in form and leading, because it takes for granted that the diet is
    hard.

    A double question asks two things in one sentence.

    The standard for the questions of a semi-structured interview, in DeJonckheere and Vaughn's
    words: "All questions should be open ended, neutral, clear and avoid leading language." This book
    applies it to the questions that carry the study. A plain fact, such as age, may be asked closed.
  references:
