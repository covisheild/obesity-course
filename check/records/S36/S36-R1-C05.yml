simplified_explanation: |
  Every question you write can be put through three checks.

  **Check 1: the form of the answer.** Could the person answer with yes, no, a number, or one of the options you gave
  them? Then it is a closed question. If they have to answer in their own words, it is an open question.
  "How many", "how often" and "how long" want a number, so they are closed. "How much" and "how hard" are open
  in form, but ask only for an amount.

  **Check 2: what the question takes for granted.** In `B0-R0-C42`, a premise is a statement an argument rests on.
  Some questions carry a premise the respondent never offered. "How hard is the diet for you?" rests on
  "the diet is hard".

  Other questions show which answer you would like: "Don't you think the tablets help?" Both kinds are leading
  questions. A leading question can be open or closed.

  **Check 3: how many questions are in it.** "Did the doctor explain the diet, and did you follow it?" is two
  questions. That is a double question. Split it.

  One more trap, about the word "why". "Why did you stop coming?" is open. It also asks the person
  to give reasons for what they did, as if they owed you an explanation.

  It carries the premise that they decided to stop. Ask what happened instead: "Tell me about the last time you came
  here."

  Closed questions are not wrong. "How old are you?" should be closed.

  Last, a clash of words to know about. DeJonckheere and Vaughn's guide to interviewing lists probes: short
  follow-ups that ask for more. One of them is called "leading". There it means asking someone to explain their reasoning, as in "Tell me how you came to that decision". It is not a
  leading question.
illustrations:
- body: |
    You are studying why adult patients with obesity at a district hospital non-communicable disease (NCD) clinic in
    Chhattisgarh stop coming back for follow-up. Here is the first question you wrote, tried on a
    made-up respondent. The exchange is invented to show the method, and translated from Hindi.

    ```table
    | Speaker | Words |
    | I | Don't you find it hard to come back every month? |
    | R1 | Yes, it is hard. |
    | I | Why? |
    | R1 | It is just hard. |
    ```

    Put the first question through the three checks. It can be answered yes or no, so it is closed.
    "Don't you" shows the answer you expect, and "hard" is your word, so it is leading. It asks one
    thing. You learned that R1 agreed with you. You did not learn what coming back is like for her.

    Your "Why?" then asked her to defend a feeling you had handed her. She had nothing to add.

    Try the first rewrite most people reach for: "How hard is it to come back every month?" It is
    open in form. But it still rests on "it is hard". R1 can now only tell you how much.

    Now ask about an event instead of a judgement.

    ```table
    | Speaker | Words |
    | I | Tell me about the last time you came to the clinic. |
    | R1 | My son brought me on his motorcycle. He works at the rice mill, so it has to be his day off. We waited from nine. The sister weighed me and wrote on the paper. The doctor said the sugar is high. Then we went home. |
    | I | You said the sister wrote on the paper. |
    | R1 | Yes. I did not understand what she wrote. I did not want to ask in front of everyone. |
    ```

    The question is open, takes nothing about her experience for granted, and asks one thing. R1
    now tells you things you had no word for in your draft. Her visit depends on her son's day off.
    She waited. She did not understand the paper, and did not ask in front of others. Whether any
    of this is why she stopped coming is still open. But it is her account, not yours.
  analogy_breaks_when: |
    The exchange is made up and tidy. A real respondent may answer a leading question with a long
    account anyway, or answer an open one with "fine". One exchange shows what a question allows.
    It does not show what a question will always produce.

    "Takes nothing for granted" is never literally true. "The last time you came to the clinic"
    takes for granted that she came at least once, which the clinic's register already shows. The
    check is for premises about what you are trying to find out: her experience, her reasons, her
    feelings.
- body: |
    Now run the three checks on a whole first draft. Here are eight made-up questions for the same
    study, with each one's result.

    ```table
    | No. | Question | Open or closed | Leading | Double |
    | 1 | How old are you? | closed | no | no |
    | 2 | Don't you find it hard to come back every month? | closed | yes | no |
    | 3 | Did you stop coming because of the distance or the cost? | closed | yes | no |
    | 4 | Why did you stop taking the tablets? | open | yes | no |
    | 5 | Was the doctor rude to you, and did the nurse explain things? | closed | yes | yes |
    | 6 | Do you eat rice at night? | closed | no | no |
    | 7 | What do you think about the diet the nurse gave you? | open | no | no |
    | 8 | How does your family help with the diet and the walking? | open | yes | yes |
    ```

    Question 3 offers two reasons and no others, so the respondent's own reason has no room.
    Question 4 takes for granted that she stopped the tablets. Question 5 puts "rude" in her mouth
    and asks two things. Question 8 takes for granted that
    the family helps, and asks about two things.

    Here is the draft after rewriting.

    ```table
    | No. | Question | Open or closed | Leading | Double |
    | 1 | How old are you? | closed | no | no |
    | 2 | Tell me about the last time you came to the clinic. | open | no | no |
    | 3 | What happened after that visit? | open | no | no |
    | 4 | Tell me about any medicines you have been given here. | open | no | no |
    | 5 | What was it like talking to the doctor? | open | no | no |
    | 6 | What does a usual evening meal at home look like? | open | no | no |
    | 7 | What do you think about the diet the nurse gave you? | open | no | no |
    | 8 | Who at home, if anyone, knows about the diet? | open | no | no |
    ```

    Question 1 stays closed, because age is a plain fact. The nurse half of question 5 and the
    walking half of question 8 are not lost. They wait as follow-ups, to ask if the respondent
    raises them.

    Count each result in the two drafts. Each draft has eight questions.

    ```table
    result   first draft  after rewriting
    open     3            7
    closed   5            1
    leading  5            0
    double   2            0
    ```

    Check the counts. Every question is either open or closed, so those two rows must add to eight.

    ```working
    3 plus 5 = 8
    7 plus 1 = 8
    ```
  analogy_breaks_when: |
    A table of results is a check on your own draft, not a score for it. A guide with no leading
    questions can still be a poor guide. Its questions may be in the clinic's words rather than
    the respondent's, or may miss what matters. And the results are judgements: two careful readers
    can disagree about a borderline question, such as whether "if anyone" fully removes the premise
    in question 8.
must_know:
- point: |
    An open question can still lead. Run the premise check on every question, including the ones
    that start with "how" or "what".
  kind: misconception
  bearing: methodological
  refs:
  - dejonckheere_vaughn_2019
- point: |
    Refuse the quick fix of deleting "don't you". A rewrite that removes the signal words and keeps
    the premise is still leading.
  kind: trap
  bearing: methodological
- point: |
    Ask "what happened" before "why". "Why did you stop coming?" asks a patient to defend a
    decision you have assumed she made.
  kind: move
  bearing: clinical
  refs:
  - blackstone_2012
- point: |
    A yes to a leading question tells you the respondent did not contradict you. If the question
    carried the premise, the answer cannot be evidence for it.
  kind: consequence
  bearing: methodological
  refs:
  - britten_1995
- point: |
    The three checks tell you whether a question gives the respondent room. They do not tell you
    whether it asks about the right thing, or in words the respondent uses.
  kind: boundary
  bearing: methodological
- point: |
    When a trainee's list of questions is all closed, do not tell them "use open questions". Take one
    of their questions, ask them what answer they expect, and show them that the question already
    contains it.
  kind: move
  bearing: teaching
exercises:
- type: critique
  prompt: |
    A colleague's made-up draft for the clinic study opens with these three questions.

    1. Did you know that coming every month keeps your sugar under control?
    2. Why haven't you been coming?
    3. Is it the cost, the distance or your family?

    Say what is wrong with each. Then write one opening question that fixes all three problems.
  answer: |
    1. It is closed (yes or no). It is also not really a question. It is advice, with a premise
       the respondent is being asked to agree with. It turns the interview into a consultation.
    2. It is open in form. It takes for granted that the person decided to stop. It asks them to
       justify that, as if they owed the clinic an explanation.
    3. It is closed: it offers three answers and leaves no room for a fourth. It is leading,
       because it supplies the reasons.

    One opening question that avoids all three: "Tell me about the last time you came to the
    clinic." It is open, it asks about an event rather than a judgement, it gives no advice, and
    it asks one thing.
  skill_ref: S36-R1-K01
quantitative: true
practice:
- level: 1
  prompt: |
    Put this question through the three checks: open or closed, leading or not, double or not.

    Do you travel to the clinic by bus?
  answer: |
    ```table
    | Check | Result | Because |
    | form of the answer | closed | it can be answered yes or no |
    | leading | no | it takes nothing about the person's experience for granted, and shows no preferred answer |
    | double | no | it asks one thing |
    ```
- level: 2
  prompt: |
    Put each question through the three checks.

    a. Tell me about your last visit to the clinic.
    b. How many kilometres is it from your home to the clinic?
    c. Don't you think the tablets help?
    d. How hard is the walking the doctor asked for?
  answer: |
    ```table
    | Question | Form | Leading | Double | Because |
    | a | open | no | no | it needs the person's own words and takes nothing about the visit for granted |
    | b | closed | no | no | the answer is a number |
    | c | closed | yes | no | yes or no, and "don't you" shows the answer expected |
    | d | open | yes | no | open in form, but it takes for granted that the walking is hard |
    ```

    Question d is the one to notice. It passes check 1 and fails check 2.
- level: 3
  prompt: |
    Put this question through the three checks. Then split it into separate open questions.

    Did the doctor explain the diet, and did you follow it?
  answer: |
    ```table
    | Check | Result | Because |
    | form of the answer | closed | each half can be answered yes or no |
    | leading | no | neither half shows a preferred answer |
    | double | yes | it asks whether the doctor explained, and whether the person followed |
    ```

    A "no" could mean the doctor did not explain, or the person did not follow, or both. Split it,
    and ask each half as an event.

    - What did the doctor tell you about the diet?
    - What happened with the diet after that?
- level: 4
  prompt: |
    This line is from a made-up first list of interview questions for the clinic study.

    Did you stop coming because the clinic is too far?

    Put it through the three checks. Then write a neutral open question to replace it.
  answer: |
    ```table
    | Check | Result | Because |
    | form of the answer | closed | it can be answered yes or no |
    | leading | yes | it supplies the reason, "too far", and takes for granted that the person decided to stop |
    | double | no | it asks one thing |
    ```

    Replace it with a question about an event: "Tell me about the last time you came to the
    clinic." If distance matters to this person, it will come up in their account, in their words.
    If it does not come up, you can ask a plain factual follow-up later: "How do you get here?"
- level: 5
  prompt: |
    Here are two lines from a made-up interview transcript at the clinic, translated from
    Chhattisgarhi.

    ```table
    | Speaker | Words |
    | R2 | I have the tablets at home. A whole strip is still there. |
    | I | Why did you stop taking the tablets? |
    ```

    Put the interviewer's question through the three checks. Say how R2 might hear it. Then write
    a better next line for the interviewer.
  answer: |
    ```table
    | Check | Result | Because |
    | form of the answer | open | R2 has to answer in her own words |
    | leading | yes | it takes for granted that she stopped, which she did not say, and asks her to justify it |
    | double | no | it asks one thing |
    ```

    R2 said a strip is still at home. She did not say she stopped. The question turns her words
    into an admission, and "why did you" asks her to defend it. She may hear the question a staff
    member asks before a telling-off, and give the answer that ends it fastest.

    A better next line uses her own words and asks for more: "A whole strip is still there. Tell me
    about that."
- level: 6
  prompt: |
    A colleague's made-up draft guide on family meals has six questions.

    1. How old are you?
    2. What does a usual evening meal at home look like?
    3. Is rice served every night?
    4. Don't you think a late dinner is bad for your weight?
    5. How does your family support your diet and your walking?
    6. Why do you eat after the others have finished?

    Put each through the three checks. Count how many are open, closed, leading and double. Say which
    questions to rewrite first.
  answer: |
    ```table
    | No. | Form | Leading | Double | Because |
    | 1 | closed | no | no | a plain fact |
    | 2 | open | no | no | asks for an account and takes nothing about the meal for granted |
    | 3 | closed | no | no | yes or no, with no preferred answer shown |
    | 4 | closed | yes | no | "don't you" shows the answer wanted, and it carries the premise that a late dinner is bad for weight |
    | 5 | open | yes | yes | takes for granted that the family supports her, and asks about the diet and the walking together |
    | 6 | open | yes | no | takes for granted that she eats after the others, and asks her to justify it |
    ```

    Count each result.

    ```working
    open: questions 2, 5 and 6, so 3
    closed: questions 1, 3 and 4, so 3
    3 plus 3 = 6
    leading: questions 4, 5 and 6, so 3
    double: question 5, so 1
    ```

    Rewrite the three leading questions first, 4, 5 and 6, because each one plants an answer.
    Question 5 is also double, so split it as you rewrite it. Only question 2 is both open and
    neutral as it stands.
- level: 7
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
    question: "Tell me, do you eat rice at night?"
    check 1: it begins "Tell me", so it invites the respondent's own account: open
    check 2: it takes nothing about her experience for granted: not leading
    check 3: it asks one thing: not double
    ```
  answer: |
    Check 1 broke. Check 1 asks about the form of the answer, not the first words of the question.
    The answer to "do you eat rice at night?" is yes or no, so the question is closed. "Tell me" in
    front of it changes nothing about what the person can answer.

    Checks 2 and 3 are right: it shows no preferred answer, and it asks one thing.

    An open question on the same topic asks for an account: "What does a usual evening meal at home
    look like?"

    Why the wrong answer looks reasonable: "Tell me about..." is a common way to open a question.
    So the words have come to feel like a mark of an open question. The words are a habit, not the
    test.
- level: 8
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
    original: "Don't you find the diet hard?"
    check 1: yes or no, so closed
    check 2: "don't you" shows the answer wanted, so leading
    rewrite: "How hard do you find the diet?"
    the rewrite needs the respondent's own words, so it is open
    "don't you" is gone, so the rewrite is not leading
    ```
  answer: |
    The last line broke. The rewrite removed the words that signalled the wanted answer. It kept
    the premise, "the diet is hard". "How hard" can only be answered with an amount of hardness. A
    respondent for whom the diet is easy, or who stopped following it for some other reason, has
    no room to say so.

    The first four lines are right. The rewrite is open, as line 5 says.

    A rewrite that removes the premise too asks about the event: "Tell me about the diet since you
    were given it." Or: "What has the diet been like for you?"

    Why the wrong answer looks reasonable: the signal words are the most visible sign of a leading
    question, and removing them feels like fixing it. The premise is less visible, because it sits
    in a word that looks like a description.
- level: 9
  prompt: |
    A made-up draft protocol for the clinic study says:

    "We will ask patients whether they find the diet hard."

    Turn this into a question to ask. Then say what the answers to it still cannot
    show.
  answer: |
    Taken word for word, the line becomes "Do you find the diet hard?" That is closed, and it hands
    the respondent your word, "hard". So do not ask it as written.

    Ask about the diet as an event, and write follow-ups under it.

    - Question: "Tell me about the diet the clinic gave you."
    - Follow-ups, if the respondent raises them: "What happened in the first week?" and "Who else at
      home eats the same food?"

    If the diet is hard for this person, that will come out in their account, with the reasons.

    What the answers still cannot show:

    - How many of the clinic's patients find the diet hard. The people you interview were chosen,
      not drawn at random, so a count of them is not a rate for the clinic.
    - That the diet is why people stop coming. A respondent can find the diet hard and stop coming
      for a different reason. Your guide needs to ask about stopping separately, as an event.
- level: 10
  prompt: |
    A colleague says: "None of my questions lead. They are all open. Every one starts with 'how'."

    Here are the four interviewer lines from one of their made-up transcripts.

    ```table
    | Speaker | Words |
    | I | How much does your weight worry you? |
    | I | How did the nurse's advice help you? |
    | I | How often do you miss the evening walk? |
    | I | How do you get to the clinic? |
    ```

    Test the claim. Then say what your answer does not establish.
  answer: |
    Put each line through checks 1 and 2.

    ```table
    | Line | Form | Leading | Because |
    | 1 | open | yes | takes for granted that weight worries the person; "how much" asks only for an amount |
    | 2 | open | yes | takes for granted that the advice helped |
    | 3 | closed | yes | "how often" wants a number; it takes for granted that there is a regular evening walk, and that it gets missed |
    | 4 | open | no | asks for an account of an event; that the person comes to the clinic is already known |
    ```

    ```working
    open: lines 1, 2 and 4, so 3
    closed: line 3, so 1
    3 plus 1 = 4
    leading: lines 1, 2 and 3, so 3
    ```

    Neither half of the claim holds. Line 3 is closed, and 3 of the 4 lead. Starting with "how"
    settles neither check.

    What this does not establish:

    - That the respondents' answers were distorted. For that you read the answers. A respondent may
      have said "it does not worry me" despite the question.
    - That line 4 will get a truthful or full answer. A neutral question gives room. It does not
      guarantee what fills it.
    - Anything about the colleague's other transcripts. Four lines from one interview are a sample
      of their questions, not all of them.
retrieval_items:
- q: What makes a question closed?
  a: The possible answers are fixed before the respondent speaks - yes or no, a number, or one of
    the options the question supplies.
- q: Can an open question be leading? Give an example.
  a: Yes. "How hard is the diet for you?" is open in form and takes for granted that the diet is
    hard.
- q: What is a double question, and what do you do with one?
  a: A question that asks two things in one sentence, so you cannot tell which the answer answers.
    Split it into two questions.
