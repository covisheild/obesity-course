simplified_explanation: |
  Before you ask anyone a research question, three things have to be settled. Does the person
  agree, knowing what they are agreeing to? Do they agree to be recorded? And what will happen to
  their words afterwards?

  In India the rulebook for this is the ICMR's National Ethical Guidelines of 2017. No legislature
  passed it, so it is not a statute. A statute on personal data also covers recordings, but most of
  it is not yet in force.

  An ethics committee is a group of people at a hospital, college or research body. It reads a
  researcher's plan before any research starts, and it can say yes, no, or change this first.

  Consent, in the guidelines' own words, has three parts. You give the person the information. You
  make sure they understood it. And you make sure they are free to say no.

  Ask about the recorder on its own, and take no for an answer.

  Privacy is the person's right to decide who hears about them. Confidentiality is your duty to keep
  safe what they told you. An interview recording carries a voice, a name, a village, a family story.

  Last, the question every learner asks: does my practice interview need an ethics committee? You
  send the committee its forms, and the committee decides.
illustrations:
- body: |
    Suppose you are about to interview a woman who comes to the district hospital's NCD clinic in
    Chhattisgarh — the clinic for non-communicable diseases such as diabetes. She has obesity, and
    she stopped coming back for follow-up. You want to know why. Here is a made-up exchange,
    translated from Chhattisgarhi, showing how the first minute can go wrong. You are wearing the
    clinic's white coat. The recorder is already running on the table.

    ```table
    | Speaker | Words |
    | I | Namaste. This is for a study. Just sign here, it is nothing. |
    | R1 | What study? Will the doctor see this? |
    | I | Don't worry. So, Sunita-ji, tell me why you stopped coming. |
    | R1 | Theek hai. The tablets are good. |
    ```

    Now read it the way the ICMR guidelines would have you read it. Count what went wrong.

    The recorder was on before she agreed to anything. She was never asked about it separately.

    "It is nothing" is not information. She was not told what the study is, how long it takes, or
    that she can stop at any time. Box 5.1 of the guidelines lists those among the things she must be
    told.

    She asked the most important question herself: will the doctor see this? It went unanswered.
    Section 5.3.10 says you must tell her that saying no will not affect "the patient–clinician
    relationship". In a white coat, in her own clinic, she has every reason to think it will.

    You said her name aloud on the tape. Now her name and her reasons for leaving the clinic sit in
    one file.

    And her answer is two words, then praise for the tablets. The guidelines warn that in India people
    often cannot say no out loud. They name "silence, monosyllabic replies, or restlessness" as signs
    of refusal (Box 9.4). "Theek hai" here may mean "let me go".

    Now do it again, in order. Recorder off. Say who you are and who you are not: "I work on this
    study. I am not your doctor, and I will not tell the doctor who said what." Explain the study in
    Chhattisgarhi, in words she uses. Say what stays private, and its limits. Say she can stop at any
    time, and her treatment stays the same whether she takes part or not. Ask whether she has questions, and wait. If she agrees, take her
    signature, or her thumb impression if she cannot sign. If she cannot read the form, an impartial
    literate witness hears it read to her. Then ask, as a separate question: "May I record our talk?
    Only the study team will hear it, except in the rare cases I told you about." Switch on only
    after she says yes. Open the recording by speaking her speaker label, R1, and never her name.
  analogy_breaks_when: |
    The steps here follow ICMR 2017 as issued. They do not tell you what your own institution adds on
    top. An ethics committee can ask for more, such as a particular form, a translated sheet checked
    back into English, or a named place to store the files. Its instructions come first.
- body: |
    Now the question that stops most learners. You plan five practice interviews. Do they need an
    ethics committee? Do not answer from memory, yours or anyone's. Look it up.

    Open the National Ethical Guidelines for Biomedical and Health Research Involving Human
    Participants on the ICMR website. Search inside the document for "routine questioning". It sits in
    Table 2.1, on minimal risk. Minimal risk means harm no greater than "that ordinarily encountered in
    routine daily life activities". That looks like good news for an interview.

    Now search for "linked identifiers". It sits in Table 4.2. Exemption from review is for proposals
    "with less than minimal risk where there are no linked identifiers". Your recording has a voice on
    it, and her consent form has a name. Is that a linked identifier? You may think not. The
    guidelines do not let you think it for the committee.

    Search for "cannot decide". Section 4.8.3 reads: "A researcher cannot decide that her/his proposal
    falls in the exempted, expedited or full review category. All research proposals must be
    submitted to the EC."

    Last, search for "Preliminary activity". Section 9.2.12 says notes from observing, made before the
    research itself begins, "need not be submitted for EC's review". Is a practice interview that kind
    of note-making? The same passage goes on: any ethical issue in that early phase "should be
    included in the research proposal for review by the EC". So even this passage sends you back to
    the committee.

    The answer to your question is therefore not yes and not no. It is: fill in the committee's forms
    (Box 4.4). They include a protocol, the consent sheet in English and the local language, and the
    questionnaire, here your topic guide. Send them to your institution's ethics committee, and ask
    it which kind of review applies. You may ask it, with reasons, to consider exemption (section
    4.8.3). If you have no institution, this book's suggestion is to ask the ethics committee of the
    hospital or college where you would do the interviews.
  analogy_breaks_when: |
    This reading covers the sections of the guidelines named here. Other sections, and later ICMR
    notices, can change the answer. The guidelines themselves urge you to check the latest
    government rules. Whatever you find, the committee's written reply to your plan is what you act
    on, not your own reading.
must_know:
- point: |
    None of the review categories in the guidelines (Tables 2.1 and 4.2, section 4.8.3) makes an
    exception for a practice interview. Send your plan to an ethics committee and let it decide,
    before you record anyone.
  kind: misconception
  bearing: methodological
  refs:
  - icmr_ethical_guidelines_2017
- point: |
    An interview can feel harmless and still carry risk. The guidelines warn that risks in social and
    behavioural research can be "misconstrued as no/minimum risk research" (Box 9.1). One of the main
    risks is information getting out. So before you ask for consent, decide where the recordings
    live: one locked device or folder that only the study team can open. The guidelines ask that
    access to stored records "should be limited" (section 2.3.5). Do not delete them the day you
    finish either. Records, data and notes "should be retained for the required period" (section
    1.1.10). Your ethics committee tells you how long.
  kind: trap
  bearing: methodological
  refs:
  - icmr_ethical_guidelines_2017
- point: |
    Ask about the recorder as its own question, after consent to the interview. Someone may agree to
    talk and refuse to be recorded. Then take written notes instead, or do not go ahead, but never
    record anyway.
  kind: move
  bearing: methodological
  refs:
  - icmr_ethical_guidelines_2017
  - dejonckheere_vaughn_2019
- point: |
    In a clinic, tell the person in plain words that saying no will not change their treatment.
  kind: consequence
  bearing: clinical
  refs:
  - icmr_ethical_guidelines_2017
- point: |
    In India a person may not say no out loud. The guidelines tell researchers to read silence, very
    short replies or restlessness as possible refusal, and not to carry on (Box 9.4).
  kind: india_deviation
  bearing: clinical
  refs:
  - icmr_ethical_guidelines_2017
- point: |
    Keep names out of everything but the consent form. Give each person a speaker label such as R1 and
    use it on the recording, the file name and the transcript. Keep the signed forms, and the list
    that joins labels to names, apart from the recordings.
  kind: move
  bearing: methodological
  refs:
  - icmr_ethical_guidelines_2017
- point: |
    Tell people the limits of confidentiality, not a promise of perfect secrecy. The guidelines
    require you to say that it "may not be possible" to protect privacy in every circumstance
    (section 2.3.2). Name the limits: a court's order, a threat to someone's life, a public-health
    risk (section 2.3.6).
  kind: trap
  bearing: clinical
  refs:
  - icmr_ethical_guidelines_2017
- point: |
    The law on recordings is the Digital Personal Data Protection Act, 2023 (Act No. 22 of 2023). It
    is a statute, passed by Parliament (`B0-R0-C43`). ICMR's guidelines are not. The Act's
    definitions and its Data Protection Board are in force from 13 November 2025. Personal data is
    "any data about an individual who is identifiable by or in relation to such data" (section
    2(t)). By that definition, a recording or transcript that can identify someone is personal data.
    That person is the Data Principal. The Data Fiduciary is whoever "determines the purpose and
    means of processing" (section 2(i)). Recording and storage are processing (section 2(x)). The
    rest of the Act starts later: notice, consent, withdrawal, the duties and the exemptions. They
    start "eighteen months from the date of publication" of notice G.S.R. 843(E). 13 November 2025
    + 18 months = 13 May 2027. Until then they are law on paper, not yet in force. From then,
    section 17(2)(b) exempts processing "necessary for research". The data must not be used to
    decide something about the person. And the work must meet the standards in the 2025 Rules
    (Second Schedule). It must be lawful and for that purpose only. It uses only the data needed,
    kept accurate, kept safe, and kept only while needed. One person is accountable. The Act does
    not define "research". It does not say whether a practice interview counts. It does not mention
    ethics committees. So your ethics committee and institution still decide. Plan as if the duties
    applied, because ICMR 2017 already asks for most of them. A legal question goes to a lawyer.
  kind: boundary
  bearing: policy
  refs:
  - dpdp_act_2023
  - dpdp_commencement_2025
  - dpdp_rules_2025
  - icmr_ethical_guidelines_2017
exercises:
- type: design
  prompt: |
    A patient of the NCD clinic stopped coming for follow-up, and you are about to interview her.
    Write what you will say before the first question, in the order you will say it. Write it as spoken sentences,
    not headings. Then write one line saying when the recorder goes on.
  answer: |
    A good script covers, in this order:

    1. Who you are, and who you are not. "I work on this study. I am not your doctor. I will not tell
       the clinic who said what."
    2. What the study is, in the person's own language. "We want to understand why some people stop
       coming back to this clinic. I will ask you about your visits and your life around them. Some
       questions may feel personal." Then say how long it will take.
    3. That taking part is free and can stop. "You can say no. You can stop at any time, or skip any
       question. Your treatment here stays exactly the same either way."
    4. What happens to their words, and its limits. "Only the study team will hear what you say. I
       will not use your name. There are rare exceptions. If a court orders it, or someone's life or
       the public's health is in danger, the ethics committee can allow it to be shared."
    5. Questions. "What would you like to ask me? If you have a question later, call [name] on
       [number]." Then wait.
    6. Consent: a signature, or a thumb impression. If the person cannot read the form, an impartial
       literate witness who is not a relative is present.
    7. The recorder, separately. "May I record our talk, so I do not miss anything? You can say no,
       and we will still talk."

    The recorder goes on only after step 7 gets a yes, and the first thing said on it is the label
    (R1), never the name.

    Check your script against sections 5.3.10, 2.3.2 and 2.3.6 and Box 5.1 of the ICMR guidelines. Then
    check it against whatever your ethics committee asks for. Its form overrides this list.
- type: critique
  prompt: |
    A colleague writes: "It's only a practice interview with a clinic patient, so it's minimal risk
    under ICMR. That means no ethics committee. I'll record in the waiting area so she is
    comfortable." Find each claim that the guidelines do not support.
  answer: |
    First, "minimal risk under ICMR". Table 2.1 does give "routine questioning or history taking" as
    an example of minimal risk. But the colleague has placed the study in a category by themselves.
    Section 4.8.3 says a researcher cannot decide which review category their proposal falls in. The
    ethics committee decides. Table 2.1 also says identifiable personal data carry indirect risks,
    which can put the study in the next category up.

    Second, "that means no ethics committee". Even minimal risk is not the category Table 4.2 exempts
    from review. Exemption is for "less than minimal risk where there are no linked identifiers". A
    recording of a named patient's voice may well carry linked identifiers. And every proposal goes to
    the committee in any case (section 4.8.3).

    Third, "I'll record". For interviews in social and behavioural research, the guidelines ask for
    prior permission from the ethics committee to record at all (Box 9.3).

    Fourth, "the waiting area". Other patients and staff can overhear. One of the main risks in this kind of
    research is information getting out (section 9.2.3). A private room protects her. Her comfort is
    better served by saying her treatment will not change.
- type: teaching
  prompt: |
    A first-year resident wants to "just chat" with five patients from the NCD clinic about why they
    stop coming. They plan to record on a phone and use the recordings in a presentation. You have ten
    minutes and a whiteboard. Teach them what has to happen first.
  answer: |
    Draw three boxes: agree, record, afterwards.

    Agree. Treat it as research and let the committee decide (section 4.8.3). The ICMR guidelines ask for informed consent. That has three parts: information, understanding, and freedom to say no.
    Write "your care will not change" in the box, because in a clinic that is the sentence patients
    need most.

    Record. It is a separate yes, asked after the first. The guidelines also need the ethics
    committee's permission to record interviews.

    Afterwards. Where does the phone go? Who can open it? Write "labels, not names". Treat a talk like
    a publication: no identifiable clip without fresh consent. Section 2.3.3 says publication must not
    reveal who a person is, and needs "re-consent" if that was not obtained before.

    Then draw an arrow above all three boxes to "ethics committee". Section 4.8.3 says the researcher
    cannot decide the review category. The resident sends the committee its forms (Box 4.4), and does
    not start until the committee replies.
retrieval_items:
- q: Who published the National Ethical Guidelines for Biomedical and Health Research Involving Human Participants, and when?
  a: The Indian Council of Medical Research, in October 2017. They are guidelines issued by a council, not a statute.
- q: What three parts does the ICMR guidelines' informed consent process have?
  a: Giving the person relevant information, making sure they understood it, and making sure their taking part is voluntary.
- q: Who decides whether a research plan is exempt from ethics review, under ICMR 2017?
  a: The ethics committee. Section 4.8.3 says a researcher cannot decide the category of their own proposal.
- q: What must you tell a clinic patient about refusing, under section 5.3.10?
  a: That saying no will not affect their rights, their relationship with their clinician, or any other benefit they are entitled to.
- q: On 1 October 2026, is the consent section (section 6) of the Digital Personal Data Protection Act, 2023 in force?
  a: No. Its consent rules (all of section 6 except sub-section (9)) start eighteen months after 13 November 2025, on 13 May 2027 by that count. Only the definitions and the Board are in force.
