definition:
  text: |
    In India the rules a researcher follows with people who take part in health research are set out
    in the National Ethical Guidelines for Biomedical and Health Research Involving Human
    Participants. The Indian Council of Medical Research (ICMR) published them in October 2017.

    Informed consent, in the guidelines' words, is a process with "three components – providing
    relevant information to potential participants, ensuring the information is comprehended by them
    and assuring voluntariness of participation" (section 2.2). The researcher "must obtain voluntary
    written informed consent from the prospective participant" (section 5.0). Spoken consent, without
    a signature or thumb impression, is allowed only in exceptional cases, with the approval of an ethics
    committee, or EC (section 5.3.8).

    The information given must say that this is research, its purpose and methods in simple words,
    how long taking part lasts, any foreseeable risks, and who the research team is, with contact
    details (Box 5.1). It must include the person's "Freedom of the individual to participate and/or
    withdraw from research at any time without penalty or loss of benefits" (Box 5.1). It must include
    how far confidentiality can be kept, and its limits (section 2.3.2). With the ethics committee's
    permission, what a person said may be disclosed on a court's order, when someone's life is
    threatened, or for a public-health risk (section 2.3.6).

    A person who cannot read gives consent in front of an impartial literate witness (section 5.4.3).
    A person who cannot sign gives a thumb impression (section 5.4.4).

    Privacy is the person's right to control what is collected about them and who sees it.
    Confidentiality is the researcher's duty to protect what was entrusted, including "from
    unauthorized access, use, disclosure, modification, loss or theft" (section 2.3). Raw data,
    audio-visual material included, should be shared only after processing "to mask identifiers"
    (section 9.2.12).

    Every proposal goes to an ethics committee. The committee, not the researcher, decides the kind of
    review: exemption, a quick review by a few members, or review by the full committee (section
    4.8.3, Table 4.2).
