concept_id: S01-R1-C08
subject: S01
rung: 1
sequence: 8
name: Spotting a claim that breaks conservation

concept_type: derivable

clusters: [measurement-inference, body-and-person]
ground_floor_deps: [B0-R0-C33, B0-R0-C08, B0-R0-C42]
concept_deps: [S01-R1-C05, S01-R1-C07]

definition:
  text: |
    A weight-loss claim breaks conservation when the fat change it asserts could not have
    happened given the energy that could plausibly have crossed the boundary drawn round the
    person over the stated time. Checking a claim against this test has three steps.

    First, draw the boundary and list the routes energy can cross it: in, as food and drink;
    out, as heat, as work done on things around the person, and in whatever is not absorbed.
    An explanation that names no route is not yet an explanation, whatever else it says.

    Second, put a number on the claimed fat change, using the static rule's own conversion
    from this subject's C07: 3,500 kilocalories for each pound, about 7,716 for each
    kilogram. This gives the energy the claim requires to have crossed, if the change is
    entirely fat.

    Third, compare that required amount with the largest deficit that has plausibly crossed
    the person's boundary over the stated time. A deficit is bounded above by the person's
    total expenditure over that time, because intake cannot be negative: even eating nothing
    at all, the largest possible deficit in a day is that day's whole expenditure. A claim
    whose required energy exceeds every plausible deficit for the stated interval is
    impossible on energy grounds alone, regardless of what method is claimed to produce it.

    One case does not fail this test even though it looks alarming at first. Weight lost in
    the first days of a diet, especially one that cuts carbohydrate sharply, is often faster
    than the deficit alone would predict. The reason is not a broken boundary. The body
    stores some energy as glycogen, and Hall and colleagues note that the energy stored in a
    given mass of carbohydrate, fat and protein "varies considerably, especially when
    accounting for the intracellular water associated with stored glycogen and protein".
    Glycogen is stored together with water. Using up glycogen releases that water as well,
    and a loss of water is a loss of mass with no fat energy behind it at all. Fast early
    loss that is mostly glycogen and its water is not a violation; it is a different
    substance leaving the boundary, at a different energy cost per kilogram than fat.
  references:
    - citekey: openstax_college_physics_2e
      kind: textbook
      locator: "\xA7 7.6 Conservation of Energy, the law as printed under the heading Law of\
        \ Conservation of Energy"
      quote: |-
        Total energy is constant in any process. It may change in form or be transferred from one system to another, but the total remains the same.
      verified:
        resolved_id: https://openstax.org/books/college-physics-2e/pages/7-6-conservation-of-energy
        opened: true
        claim_located: true
        checked_on: '2026-09-23'
        note: |-
          The same quote and locator this subject's Book 0 anchor, B0-R0-C33, uses for the
          law itself. This concept applies that already-taught balance to a person's
          boundary rather than re-deriving it; the passage is repeated here only so this
          record carries its own reference of the kind concept_type derivable requires.
    - citekey: hall_2011_lancet
      kind: primary
      locator: 'Panel, "Does diet composition matter?", first paragraph'
      quote: |-
        The energy stored per unit mass of carbohydrate, fat, and protein varies considerably, especially when accounting for the intracellular water associated with stored glycogen and protein.
      verified:
        resolved_id: https://pmc.ncbi.nlm.nih.gov/articles/PMC3880593/
        opened: true
        claim_located: true
        checked_on: '2026-09-23'
    - citekey: ftc_gut_check_2014
      kind: primary
      locator: "The 7 Gut Check Claims, Claim 1 and its explanation"
      quote: |-
        Meaningful weight loss requires taking in fewer calories than you use.
      verified:
        resolved_id: https://www.ftc.gov/business-guidance/resources/gut-check-reference-guide-media-spotting-false-weight-loss-claims
        opened: true
        claim_located: true
        checked_on: '2026-09-23'
        note: |-
          The specimen claim used in the illustration and practice below, "Lose up to 2
          pounds a day without diet or exercise," is the FTC's own example of a false claim
          type, quoted from the same page's Claim 1 section, not a real advertisement found
          in the wild. It is presented to the reader as the regulator's illustration, never
          as a genuine ad.

simplified_explanation: |
  Somebody claims a person lost a certain amount of fat in a certain number of days. Is that
  possible? You do not need to know anything about the diet to check. You need three things:
  a boundary, a number, and a limit.

  Draw the boundary round the person. Food and drink cross in. Heat, work done on things
  around the person, and whatever the body does not absorb cross out. If a claim gives no
  route at all for how the change happened, that is already a problem, whatever else it
  says.

  Turn the claimed fat change into an energy number, using the rate from the previous
  section: 3,500 kilocalories for a pound, about 7,716 for a kilogram.

  Now the limit. Over any stretch of time, the biggest possible deficit a person can run is
  their whole expenditure for that stretch, because you cannot eat less than nothing.
  Somebody who ate absolutely nothing for a day still could not have burned more than that
  day's total expenditure. So if the energy the claim requires is bigger than any plausible
  deficit for the time given, the claim cannot be true. It does not matter what method is
  claimed. No method gets round the boundary.

  One thing looks like a violation and is not. In the first few days of a diet, especially
  one that cuts carbohydrate hard, people often lose weight faster than their deficit alone
  would explain. That is because the body stores some energy as a starch-like fuel called
  glycogen, and glycogen is stored together with water. Burn through the glycogen and the
  water that went with it leaves too. That is real weight loss. It is not fat, and it is not
  a broken boundary, because it did not need anywhere near as much energy to cross as a
  fat-only figure would suggest. Fast, and mostly water, are not the same as impossible.
illustration:
  body: |
    Open the US Federal Trade Commission's "Gut Check" reference guide for spotting false
    weight-loss claims, at https://www.ftc.gov/business-guidance/resources/gut-check-reference-guide-media-spotting-false-weight-loss-claims.
    It lists seven claim types the regulator says are false on their face, and gives its own
    example wording for each. These examples are the FTC's own illustrations of a claim
    type, not real advertisements: treat the wording the same way you would treat a specimen
    handed to you to test, never as evidence that any real product said it.

    Claim 1's own example reads: "Lose up to 2 pounds a day without diet or exercise."

    Draw the boundary round a person making this claim work for a week. Turn 2 pounds a day
    into an energy requirement using the static rule.

    ```working
        2 times 3500 = 7000
    ```

    7,000 kilocalories a day, every day, as fat alone.

    Now find a real number to compare it with. Thomas and colleagues' pooled study put 103
    adults on supervised diets, with every calorie prescribed and measured. The largest
    average deficit anyone in that pooled group sustained, across the whole cohort, over
    weeks, under total dietary control, was 1,439 kilocalories a day.

    ```table
    what                                     kcal/day
    the FTC specimen's implied deficit        7,000
    the largest deficit Thomas et al. measured under total supervision   1,439
    ```

    The claim requires roughly five times the biggest deficit ever measured in that
    supervised cohort, and it claims this happens "without diet or exercise" — naming no
    route at all for where 7,000 kilocalories a day would come from. Whatever a boundary is
    drawn round, food in and output out are the only routes there are, and a claim that
    invokes neither cannot supply the energy it asserts.

    Contrast this with a real case that looks alarming and is not. A person starting a
    low-carbohydrate diet loses 3 kilograms in the first five days. Using the static rule,
    that would require:

    ```working
        3 times 7716.18 = 23148.54
        23148.54 divided by 5 = 4629.71
    ```

    About 4,630 kilocalories a day as fat, which is itself an implausible deficit for most
    people over five days. But this loss is not a fat claim. Cutting carbohydrate sharply
    depletes the body's glycogen store fast, and glycogen carries intracellular water with
    it, which Hall and colleagues name directly. Three kilograms lost mostly as glycogen and
    its water costs far less energy than three kilograms of fat, so the boundary is not
    broken; the mistake would be assuming every kilogram lost is a fat kilogram, which the
    static rule's own rate is never entitled to assume for the first days of a diet.
  analogy_breaks_when: |
    This test rules claims out; it does not rule anything in. A claimed fat loss that stays
    under the expenditure limit is merely not disproved by this check, and could still be
    false for other reasons this test cannot see, such as a made-up study or a biased
    measurement. The test also needs a real time interval and a real bound on expenditure to
    be worth anything: applied to "over a lifetime" or with no stated period, almost any
    total becomes achievable and the check stops discriminating. And it only tests the fat
    figure against energy; it says nothing about whether the reported change was fat,
    glycogen, water, or measurement error, which is a separate question this concept's
    glycogen-and-water case exists to flag before someone applies the energy check to the
    wrong substance.
  numbers:
    - value: '2'
      unit: "lb/day, the FTC's own Claim 1 specimen wording, not a real advertisement"
      quote: |-
        Lose up to 2 pounds a day without diet or exercise.
      citekey: ftc_gut_check_2014
      as_of: '2026-09-23'
    - value: '7000'
      unit: "kcal/day the specimen implies as fat, at 3,500 kcal/lb"
      derived: "2 times 3500"
      quote: |-
        Lose up to 2 pounds a day without diet or exercise.
      citekey: ftc_gut_check_2014
      as_of: '2026-09-23'
    - value: '1439'
      unit: "kcal/day, the largest average deficit measured under total supervision"
      quote: |-
        Subjects were prescribed a target intake of 1409±569 kcal/d, an average deficit of 1439±784 kcal/d.
      citekey: thomas_2013_3500kcal
      as_of: '2026-09-23'

must_know:
  - point: |
      A deficit is bounded above by total expenditure for the period, because intake cannot
      go below zero. If the energy a claim requires exceeds every plausible expenditure for
      the stated time, the claim is impossible, whatever mechanism it names.
    kind: boundary
    bearing: methodological
  - point: |
      A claim that names no route for the energy — "without diet or exercise" is the common
      wording — has not merely failed to explain itself. It has claimed a crossing with no
      route, which this subject's B0-R0-C33 already rules out for any boundary, a person's
      included.
    kind: misconception
    bearing: public
  - point: |
      Fast early weight loss, especially on a diet that cuts carbohydrate sharply, is often
      real and is often mostly glycogen and the water stored with it, not fat. Do not run
      the energy check on it using the fat rate; doing so manufactures a false violation out
      of a substance the rule was never about.
    kind: trap
    bearing: clinical
  - point: |
      When a journalist brings you a headline figure, ask for the time period before doing
      anything else. The same total kilocalories looks impossible over a week and
      unremarkable over a year, and the check cannot even be run without that number.
    kind: move
    bearing: public
  - point: |
      This check clears a claim of one specific defect, an energy impossibility. It does not
      verify the study behind the claim, the measurement, or the honesty of who reported it.
      Say what the check did and did not do, every time you report its result.
    kind: boundary
    bearing: methodological

exercises:
  - type: critique
    prompt: |
      A magazine advertisement, invented for this exercise, reads: "Our patch helped users
      lose 1 pound a day for 10 days — with no change to diet or exercise." Say what is
      wrong with the claim, and what you would ask the advertiser for.
    answer: |
      Two separate things are wrong, and they are found by the same three-step check.

      First, put a number on it. Ten pounds in ten days, on the static rule, is 3,500
      kilocalories a day required as fat, every day, for ten days straight.

      Second, ask what route supplies that. The ad says no change to diet, no change to
      exercise. That leaves nothing named at all: not more output, not less input. A
      boundary drawn round the person has exactly two kinds of route, in and out, and the ad
      has claimed neither moved.

      What to ask the advertiser for: a description of what, physically, changed at the
      boundary to account for 3,500 kilocalories a day leaving the person, given that intake
      and expenditure are both being claimed as unchanged. There is no answer to that
      question that keeps the ad's own wording true, because a patch worn on the skin is not
      a route energy crosses a person's boundary through in the first place.
    skill_ref: S01-R1-K02
  - type: teaching
    prompt: |
      A first-year resident has ten minutes and a whiteboard. They ask: "A patient tells me
      they lost 5 kilograms of pure fat in one week eating normally. How do I know if that's
      even physically possible before I ask about their diet?"
    answer: |
      Draw a circle on the board and call it the patient. Write in, for food and drink, and
      out, for heat, work, and what is not absorbed. Nothing else crosses.

      Turn 5 kilograms of fat into an energy figure using the rate from the previous
      section, about 7,716 kilocalories a kilogram.

      ```working
          5 times 7716.18 = 38580.9
      ```

      About 38,600 kilocalories, over seven days.

      ```working
          38580.9 divided by 7 = 5511.6
      ```

      About 5,512 kilocalories a day, as a deficit, if every gram of the five kilograms was
      fat.

      Now compare that with what a day's whole expenditure could plausibly be for this
      patient. If "eating normally" means intake stayed roughly where it was, the entire
      5,512 has to come from expenditure alone, which would have to be several times an
      ordinary day's total output, sustained for a week. That is the number to be skeptical
      of before asking a single question about the diet: either the reported weight is not
      five kilograms of fat, the week is not really a week, or the history is incomplete.
    skill_ref: S01-R1-K02

quantitative: true
practice:
  - level: 1
    prompt: |
      A claimed weight change is 6 units of mass, said to be entirely fat. Using a rate of
      3,500 for each unit, work out the total energy the claim requires.
    answer: |
      Multiply the count by the rate.

      ```working
          6 times 3500 = 21000
      ```

      21,000.
  - level: 2
    prompt: |
      A claimed energy crossing totals 24,500. Using a rate of 3,500 for each unit of mass,
      work out how many units of mass that could account for, if the crossing were entirely
      fat.
    answer: |
      Divide the total by the rate.

      ```working
          24500 divided by 3500 = 7
      ```

      7 units.
  - level: 4
    prompt: |
      The FTC's own Claim 1 specimen wording reads "Lose up to 2 pounds a day without diet
      or exercise." This is the regulator's illustration of a false claim type, not a real
      advertisement. Using the static rule, work out the daily energy requirement the
      specimen implies, in kilocalories, treating the claimed loss as entirely fat.
    answer: |
      Multiply the claimed pounds a day by the rate.

      ```working
          2 times 3500 = 7000
      ```

      7,000 kilocalories a day.
    refs: [ftc_gut_check_2014]
  - level: 5
    prompt: |
      Thomas and colleagues' pooled cohort achieved an average deficit of 1,439 kcal a day
      under total dietary supervision. Work out what multiple of that deficit the 7,000 kcal
      a day figure from the previous problem represents, to one decimal place.
    answer: |
      Divide the larger figure by the smaller.

      ```working
          7000 divided by 1439 = 4.864489229
      ```

      About 4.9 times the largest supervised deficit this subject's held sources report.
    refs: [thomas_2013_3500kcal]
  - level: 7
    prompt: |
      Here is a worked answer. Find the step that broke.

      ```working
          a claim says a person lost 4 kg of fat in a week eating nothing but water
          the body obeys the laws of physics, and energy is conserved
          so wherever the 4 kg's worth of energy went, it had to come from somewhere
          therefore the claim must be true, because energy cannot simply vanish
      ```
    answer: |
      The step that broke is the last one, and the word doing the damage is "therefore".

      Conservation does say the energy had to come from somewhere, and for a person eating
      nothing, that somewhere is the body's own stores. That much is correctly reasoned.
      What does not follow is that the claim must therefore be true. Conservation fixes what
      the numbers must add up to; it says nothing about whether the specific numbers given
      are the real ones. The missing step is exactly the one this concept teaches: put a
      figure on 4 kilograms of fat, about 30,860 kilocalories, divide by 7 days, and check it
      against what a real week of total starvation can plausibly supply as a deficit, rather
      than treating "energy is conserved" as if it settled the size of the number.

      Why the wrong answer looks reasonable. It correctly invokes a true law and correctly
      says that law rules out one specific thing, energy vanishing. It then slides from
      "this is not impossible in principle" to "this is true", which conservation was never
      able to establish either way.
  - level: 8
    prompt: |
      Here is a worked answer. Find the step that broke.

      ```working
          a person starts a strict low-carbohydrate diet and loses 3 kg in the first five days
          the static rule needs 7716.18 kcal per kg
          3 times 7716.18 = 23148.54
          23148.54 divided by 5 = 4629.71 kcal/day required
          nobody can run a deficit that size for five days, so the reported loss must be fabricated
      ```
    answer: |
      The step that broke is the last one. The arithmetic that gets to 4,629.71 kcal a day is
      correct, but it silently assumes every kilogram lost was fat, and this concept's own
      illustration names exactly the case where that assumption fails: the first days of a
      diet that cuts carbohydrate sharply. Glycogen is stored with water, and using it up
      releases both, at nowhere near 7,716 kcal a kilogram, because most of that mass is
      water carrying almost no energy of its own.

      The fabrication conclusion does not follow, because the energy check was run against
      the wrong substance. What should have been asked first is whether 3 kilograms in five
      days, at the start of a carbohydrate-restricted diet, is consistent with a glycogen-
      and-water loss, which it plausibly is, rather than treating the whole three kilograms
      as fat and then rejecting the figure as physically impossible.

      Why the wrong answer looks reasonable. Every individual line of arithmetic is correct,
      and the conclusion sounds like exactly the kind of impossibility this concept trains a
      reader to catch. The catch itself depends on asking what the lost mass was made of
      before running the fat rate on it, and that question was skipped.
    refs: [hall_2011_lancet]
  - level: 9
    prompt: |
      A social media post says: "I lost 8 kg of pure fat in 10 days on this new plan — that
      proves calories don't matter, only what you eat does." Decide what to compute, compute
      it, and say what your answer does not establish.
    answer: |
      What to compute: the daily energy requirement the claim implies, and whether it is
      plausible against any real deficit for a 10-day window, before anything about what the
      person ate is even relevant.

      ```working
          8 times 7716.18 = 61729.44
          61729.44 divided by 10 = 6172.94
      ```

      About 6,173 kilocalories a day required, if the whole 8 kilograms is fat. That figure
      alone, compared with the largest supervised deficit this subject's held sources
      report, 1,439 kcal a day, is over four times as large, which is the first thing worth
      naming out loud before discussing the diet at all.

      What this does not establish. It does not establish that the claim is false, because a
      first-ten-days loss on a plan that likely restricts carbohydrate could be substantially
      glycogen and water, at a far lower energy cost per kilogram than fat, and this check
      alone cannot tell fat from water in a reported number. It also does not establish
      anything at all about whether "what you eat" matters independently of how much energy
      it supplies; that claim is not one this energy check is built to test, and answering it
      would need a different kind of evidence than an arithmetic bound.
  - level: 10
    prompt: |
      A colleague at a conference says: "A bariatric patient of mine dropped 12 kg in the
      first three weeks after surgery — with the tiny amount they're eating, that's clearly
      just calories in versus calories out, nothing else going on." Decide what to compute,
      compute it, and say what your answer does not establish.
    answer: |
      What to compute: whether 12 kilograms in three weeks is plausible as an energy-only,
      fat-only figure, and whether the timing gives a reason to doubt the fat-only part of
      that assumption before accepting the colleague's "nothing else going on".

      ```working
          12 times 7716.18 = 92594.16
          92594.16 divided by 21 = 4409.24
      ```

      About 4,409 kilocalories a day required, as fat alone, for three straight weeks. That
      is roughly three times the largest deficit this subject's held sources report under
      total dietary supervision, 1,439 kcal a day, sustained for far longer than three weeks.

      What this does not establish. It does not establish that the colleague is wrong to
      describe the mechanism as calories in versus calories out; surgery can produce a very
      large, real reduction in intake, so a large true deficit is entirely plausible here.
      What the figure does establish is that "just calories in versus calories out" is doing
      more work than the number alone can support: at least part of the first three weeks
      after major surgery is a period, like the early days of any sharp restriction, where
      glycogen and its associated water are plausible contributors to the total, and this
      check has no way to separate that contribution from a fat-only figure. It does not
      establish how much of the 12 kilograms was fat, only that treating all of it as fat is
      an assumption, not a finding.
    refs: [hall_2011_lancet]

retrieval_items:
  - q: What three things does checking a claim against conservation require?
    a: A boundary drawn round the person with its routes named, the claimed change converted
      to an energy figure using the static rule's rate, and a comparison of that figure with
      the largest plausible deficit for the stated time, which is bounded above by total
      expenditure over that time.
  - q: Why is fast early weight loss on a low-carbohydrate diet usually not a violation of
      conservation?
    a: Because a large share of it is glycogen and the water stored with it leaving the
      body, which costs far less energy per kilogram than fat, so the fat conversion rate
      should not be applied to it.
  - q: A claim gives no route at all for a large energy change ("without diet or exercise").
      What does that mean for the claim?
    a: It has not merely failed to explain itself; a boundary has only two kinds of route,
      intake and output, and naming neither leaves nothing that could have supplied the
      claimed energy.

