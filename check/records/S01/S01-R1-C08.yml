concept_id: S01-R1-C08
subject: S01
rung: 1
sequence: 8
name: Spotting a claim that breaks conservation

concept_type: derivable

clusters: [measurement-inference, body-and-person]
ground_floor_deps: [B0-R0-C33, B0-R0-C08, B0-R0-C42]
concept_deps: [S01-R1-C02, S01-R1-C03, S01-R1-C05, S01-R1-C07]

definition:
  text: |
    A weight-loss claim breaks conservation when the fat change it asserts could not have
    happened, given the energy that could plausibly have crossed the boundary drawn round the
    person over the stated time.

    First, draw the boundary and list the routes energy can cross it: in, as food and drink;
    out, as heat, as work done on things around the person, and in whatever is not absorbed.

    Second, put a number on the claimed fat change. Use the static rule's conversion from
    `S01-R1-C07`: 3,500 kilocalories (kcal) for each pound, about 7,716 for each kilogram (kg).
    Use it here because it is kind to the claim. Pure fat holds more, 39.5 megajoules a
    kilogram, about 9,440 kilocalories (`S01-R1-C02`). So a claim that fails at 7,716 fails at
    9,440 too.

    Third, compare that amount with the largest deficit the person could plausibly have run
    over that time. A claim that needs more than the person's whole expenditure over the
    interval is impossible. One that needs more than any deficit people are known to manage
    is implausible. Neither verdict depends on the method claimed.

    One case looks alarming and does not fail this test. The body stores some energy as
    glycogen, a form of carbohydrate. Hall and colleagues note that the energy stored per
    unit mass "varies considerably, especially when accounting for the intracellular water
    associated with stored glycogen and protein". Glycogen holds 17.6 megajoules a kilogram,
    less than half of fat's 39.5. The water stored with it holds none. Cutting carbohydrate
    also changes how much salt, and so fluid, the kidneys let go.

    So fast early loss, especially when carbohydrate is cut, can be largely glycogen, its
    water and that fluid. Glycogen's share comes in the first week. None of this is a
    violation. It is a different substance leaving, at a far lower energy cost per kilogram
    than fat.
  references:
