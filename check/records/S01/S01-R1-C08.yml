simplified_explanation: |
  You do not need to know anything about the diet to check. You need three things: a
  boundary, a number, and a limit.

  Draw the boundary round the person.

  Turn the claimed fat change into an energy number. Use the rate from the previous
  section: 3,500 kilocalories for a pound, about 7,716 for a kilogram.

  Now the limit. Over any stretch of time, the biggest deficit a person can run is their
  whole expenditure for that stretch. You cannot eat less than nothing. If a claim needs
  more than that, it is impossible. If it needs more than any deficit people are known to
  manage, it is implausible.

  One thing looks like a violation and is not. The body stores some energy as a starch-like
  fuel called glycogen, and stores it with water. Cut carbohydrate, and glycogen, its water
  and some extra fluid can leave fast. Glycogen's part comes in the first week. Fast is not
  the same as impossible.
illustration:
  body: |
    Open the US Federal Trade Commission's (FTC) "Gut Check" guide to spotting false
    weight-loss claims, at
    https://www.ftc.gov/business-guidance/resources/gut-check-reference-guide-media-spotting-false-weight-loss-claims.
    Its examples are the FTC's own specimens of a claim type. They are not real
    advertisements. Treat each one as a specimen handed to you to test, never as proof that
    a real product said it.

    Claim 1's own example reads: "Lose up to 2 pounds a day without diet or exercise."

    Turn 2 pounds a day into an energy requirement using the static rule.

    ```working
        2 times 3500 = 7000
    ```

    7,000 kilocalories a day, every day, as fat alone.

    Now the hard ceiling. Even eating nothing, your deficit cannot beat your whole
    expenditure. The worked examples in `S01-R1-C03` put a whole day's expenditure at 1,975 to
    3,925 kilocalories for their example groups. These are calculated, not measured. 7,000 is
    more than that. So for anyone like them, the claim is impossible as fat.

    It is also far past what people manage. Thomas and colleagues pooled 103 adults whose
    intake was supervised or measured. Their average prescribed deficit was 1,439
    kilocalories a day. The claim needs roughly five times that. And it says this happens
    "without diet or exercise", naming no route for the energy at all.

    Take a made-up case. A person starting a low-carbohydrate diet loses 3 kilograms in the
    first five days. Using the static rule, that would require:

    ```working
        3 times 7716.18 = 23148.54
        23148.54 divided by 5 = 4629.71
    ```

    About 4,630 kilocalories a day. That is also above that range, so for anyone like
    them it is impossible as fat. But the loss need not be fat. Much of it can be glycogen, its water,
    and fluid the kidneys let go. The fat rate does not apply to those.
  analogy_breaks_when: |
    This test rules claims out; it does not rule anything in.
