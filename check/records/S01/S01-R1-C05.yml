definition:
  text: |
    A person's body energy stores are a stock, in the sense Book 0 gives that word. Energy
    intake and energy expenditure are flows that change that stock: intake adds to it, and
    expenditure takes from it.

    Draw the boundary at the mouth and skin, as `B0-R0-C33` shows for a person, and count intake
    at the metabolisable line: the energy that crosses in after the losses in faeces, gas and
    urine have already left, which `B0-R0-C32` defines. Then the balance line for a stock,
    `B0-R0-C23`, gives the energy balance equation for a day.

    The rate of change of body energy stores equals energy intake minus energy expenditure, both
    counted over the same day.

    The word "equals" here means "if and only if". Whenever the two sides are computed correctly
    for the same boundary and the same interval, they match, with no exception and no remainder.
    A day on which they appear not to match is a day on which a route was left off one side, not a
    day on which the identity failed.

    Because it is a balance line applied to one particular stock, the identity carries no
    direction and no cause. It says what the numbers must do. It does not say why intake or
    expenditure took the value it did.
  references:
  - citekey: openstax_anatphys_2e
    kind: textbook
    locator: "§ 24.1 Overview of Metabolic Reactions, the paragraph on catabolic and anabolic balance"
    quote: |-
      Because catabolic reactions produce energy and anabolic reactions use energy, ideally, energy usage would balance the energy produced. If the net energy change is positive (catabolic reactions release more energy than the anabolic reactions use), then the body stores the excess energy by building fat molecules for long-term storage. On the other hand, if the net energy change is negative (catabolic reactions release less energy than anabolic reactions use), the body uses stored energy to compensate for the deficiency of energy released by catabolism.
    verified:
      resolved_id: https://openstax.org/books/anatomy-and-physiology-2e/pages/24-1-overview-of-metabolic-reactions
      opened: true
      claim_located: true
      checked_on: '2026-09-23'
      note: |-
        Read in the Part E / S01 source pack. This paragraph is the textbook anchor for
        "positive net energy stores it as fat, negative net energy draws on the store":
        the physiological half of the identity. It does not itself state a daily balance
        equation for a whole person in energy-intake / energy-expenditure terms, which is
        why the balance-line half is anchored separately below.
  - citekey: openstax_chemistry_2e
    kind: textbook
    locator: "§ 5.1 Energy Basics, the paragraph naming the law of conservation of energy"
    quote: |-
      Energy can be converted from one form into another, but all of the energy present before a change occurs always exists in some form after the change is completed. This observation is expressed in the law of conservation of energy: during a chemical or physical change, energy can be neither created nor destroyed, although it can be changed in form. (This is also one version of the first law of thermodynamics, as you will learn later.)
    verified:
      resolved_id: https://openstax.org/books/chemistry-2e/pages/5-1-energy-basics
      opened: true
      claim_located: true
      checked_on: '2026-09-23'
      note: |-
        Read on 2026-09-23. This is the law the balance line in `B0-R0-C33` applies at a
        boundary. It is repeated here because this record is where the boundary is drawn
        specifically round a person's energy stores rather than round a pan or a room.
  - citekey: hall_guo_2017
    kind: textbook
    locator: "opening paragraphs, the sentence introducing the energy-balance framework"
    quote: |-
      Obesity is often described as a disorder of energy balance arising from consuming calories in excess to the energy expended to maintain life and perform physical work.
    verified:
      resolved_id: https://pmc.ncbi.nlm.nih.gov/articles/PMC5568065/
      opened: true
      claim_located: true
      checked_on: '2026-09-23'
      note: |-
        Read in the S01-R1 source pack (PMC Article Dataset text, an NIH author
