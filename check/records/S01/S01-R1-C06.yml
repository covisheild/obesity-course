definition:
  text: |
    The one-sentence statement: a person's energy stores change only by the energy that crosses
    the boundary drawn round them, and the rate of that change equals energy intake minus energy
    expenditure.

    An identity of this kind constrains the numbers on either side of it and names nothing else.
    The inference that most often gets attached to it — that a person should therefore eat less —
    does not follow from the identity alone. It needs a further premise, about what happens to
    expenditure and appetite when intake changes, that the identity itself is silent on.
  references:
  - citekey: openstax_chemistry_2e
    kind: textbook
    locator: "§ 5.1 Energy Basics, the paragraph naming the law of conservation of energy"
    quote: |-
      Energy can be converted from one form into another, but all of the energy present before a change occurs always exists in some form after the change is completed. This observation is expressed in the law of conservation of energy: during a chemical or physical change, energy can be neither created nor destroyed, although it can be changed in form. (This is also one version of the first law of thermodynamics, as you will learn later.)
    verified:
      resolved_id: https://openstax.org/books/chemistry-2e/pages/5-1-energy-basics
      opened: true
      claim_located: true
      checked_on: '2026-09-23'
      note: |-
        Read on 2026-09-23. The law itself; `S01-R1-C05` applies it as a balance line at a
        boundary drawn round a person. This record adds nothing to the law and everything
        to what may and may not be inferred once it is applied.
  - citekey: hall_guo_2017
    kind: textbook
    locator: "opening paragraphs, the two sentences on energy balance and causal explanation"
    quote: |-
      Obesity is often described as a disorder of energy balance arising from consuming calories in excess to the energy expended to maintain life and perform physical work. While this energy balance concept is a useful framework for investigating obesity, it does not provide a causal explanation for why some people have obesity or what to do about it.
    verified:
      resolved_id: https://pmc.ncbi.nlm.nih.gov/articles/PMC5568065/
      opened: true
      claim_located: true
      checked_on: '2026-09-23'
      note: |-
        Read in the S01-R1 source pack (PMC Article Dataset text, an NIH author
        manuscript). This is the load-bearing sentence for the whole record: a useful
        framework, explicitly not a causal explanation. Hall KD et al., Am J Clin Nutr
        2012;95:989, named in the inventory for this concept, is not held in this
        environment (gated and paywalled everywhere it was checked); nothing in this
        record depends on that paper's own wording, only on the framework-versus-cause
        distinction, which Hall & Guo 2017 states in the terms quoted here.
simplified_explanation: |
  Here is the whole identity again, in one line.

  ```working
      the change in a person's energy stores = energy intake minus energy expenditure
  ```

  Read it as a rule about arithmetic, because that is all it is. It says the two sides have to
  match.

  A step people take next, all the time, sounds almost like it follows from the line above. "So if
  you want your stores to stop rising, eat less." That step is a separate claim. The inference
  needs something the identity never supplied — that cutting intake actually lowers the left-hand
  side, rather than expenditure also falling to keep the difference where it was.

  Whatever the true answer is, it has to come from evidence about bodies, not from the accounting
  line.
illustration:
  body: |
    Lay the "eat less" step out the way `B0-R0-C42` teaches, as a premise, an inference, and a
    conclusion, and test the inference before asking whether the premise is true.

    *Premise:* the change in a person's energy stores equals energy intake minus energy
    expenditure.

    *Conclusion:* if this person eats less, their energy stores will fall.

    Now ask the inference test's question: does the conclusion follow?

    It does not, not on the premise alone. It says nothing about what happens to expenditure if
    intake is reduced. If expenditure stayed exactly where it was, the conclusion would follow. If
    expenditure fell by the same amount intake fell, the difference would stay where it was, and
    the conclusion would fail, while the identity held exactly as before.

    Picture the missing premise written out loud, the way `B0-R0-C42`'s own illustration does it:
    "and expenditure does not change when intake does." Nobody who makes the "eat less" argument
    usually says that sentence. It is doing the work anyway, hidden, and it is a claim about
    physiology, not a consequence of the accounting line above it.
  analogy_breaks_when: |
    This illustration tests one inference, from one premise, and it does not settle whether "eat
    less" works as an instruction.

    The inference that fails is the one that adds a direction of control the identity never
    supplied.
must_know:
- point: |
    "Energy in minus energy out" is a premise, not a conclusion.
  kind: misconception
  bearing: methodological
- point: |
    When you hear the identity used to defend a specific instruction, ask what has been assumed
    about expenditure that was never stated.
  kind: move
  bearing: methodological
- point: |
    The identity is consistent with every serious account of why weight changes, because every one
    of them can be written so the two sides balance.
  kind: boundary
  bearing: methodological
- point: |
    Say what changed, in energy terms, if you know it. Do not let the identity stand in for an
    account of why it changed, which you may not have.
  kind: move
  bearing: clinical
- point: |
    A trainee who has just learned this identity will reach for "energy in, energy out" as an
    explanation the first time someone asks why a patient's weight moved. Watch for the sentence
    doing the work of an inference nobody has actually made.
  kind: trap
  bearing: teaching
- point: |
    When a journalist repeats "it's just calories in, calories out", the accurate short reply is
    that the arithmetic is real and settles nothing about cause.
  kind: consequence
  bearing: public
exercises:
- type: critique
  prompt: |
    A clinic pamphlet says: "Energy balance is simple physics: calories in minus calories out
    equals weight change. So weight change is entirely under a person's control."

    Lay the argument out as a premise and a conclusion, in the style of `B0-R0-C42`, and say
    whether the inference holds.
  answer: |
    Premise: the change in energy stores equals intake minus expenditure. Conclusion: weight
    change is entirely under a person's control.

    The inference does not hold. Granting the premise fully changes nothing about whether either
    side of it is under anyone's control. Expenditure includes resting metabolism, which is not
    chosen; and later concepts in this rung show intake and expenditure interact rather than
    moving independently. "The two sides must balance" and "a person can freely set either side"
    are different claims, and only the first follows from physics.

    The pamphlet needed a further premise — that intake and expenditure each respond only and
    fully to choice — and did not state it. Stated aloud, it is the premise a reader can actually
    check.
  skill_ref: S01-R1-K01
retrieval_items:
- q: State the one-sentence identity for a body's energy stores, and then say in one sentence what
    it does not tell you.
  a: The rate of change of a person's energy stores equals energy intake minus energy expenditure.
    It does not tell you why either side took the value it did, or what happens to one side when
    the other changes.
- q: Somebody argues, "energy in minus energy out, so eat less." What is the missing premise, and
    what kind of claim is it?
  a: That expenditure does not change when intake changes. It is an empirical claim about
    physiology, not something the identity supplies, and it needs its own evidence.
- q: Why does the identity fail to choose between competing accounts of why weight changes?
  a: Because every serious account — appetite-driven, expenditure-driven, environment-driven — can
    be written so intake minus expenditure still equals the change in stores. The identity rules
    out only an account where the two sides do not balance, which none of the serious ones is.
