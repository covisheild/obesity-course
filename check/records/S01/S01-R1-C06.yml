simplified_explanation: |
  Here is the whole identity again, in one line.

  ```working
      the change in a person's energy stores = energy intake minus energy expenditure
  ```

  Read it as a rule about arithmetic, because that is all it is. It says the two sides have to
  match. It does not say which side moved first, or why, any more than "the amount inside a
  boundary changes only by what crosses it" said why a burner was lit.

  A step people take next, all the time, sounds almost like it follows from the line above. "So
  if you want your stores to stop rising, eat less." That step is a separate claim. It is an
  inference, in the sense the section on arguments gave that word: a move from a premise to a
  conclusion. The premise here is true. The inference needs something the identity never supplied
  — that cutting intake actually lowers the left-hand side, rather than expenditure also falling
  to keep the difference where it was.

  Nothing said here claims that inference is wrong. It says the identity by itself cannot tell you
  whether it is right, because the identity is silent about what happens to expenditure when
  intake changes. Whatever the true answer is, it has to come from evidence about bodies, not from
  the accounting line.

  And that silence cuts both ways. Anyone who tells a different story about why weight changes —
  appetite driven by hormones, expenditure that falls when a person eats less, an environment that
  makes overeating easy — can write their story so the two sides of the line still balance. The
  identity does not rule any of them out. It rules out only a story where the two sides fail to
  add up, and almost nobody is telling that story.
illustration:
  body: |
    Lay the "eat less" step out the way `B0-R0-C42` teaches, as a premise, an inference, and a
    conclusion, and test the inference before asking whether the premise is true.

    *Premise:* the change in a person's energy stores equals energy intake minus energy
    expenditure.

    *Conclusion:* if this person eats less, their energy stores will fall.

    Grant the premise. It is the identity from `S01-R1-C05`, and nothing about it is in dispute
    here. Now ask the inference test's question: does the conclusion follow?

    It does not, not on the premise alone. The premise names two quantities, intake and
    expenditure, and says how their difference relates to the change in stores. It says nothing
    about what happens to expenditure if intake is reduced. If expenditure stayed exactly where it
    was, the conclusion would follow. If expenditure fell by the same amount intake fell, the
    difference would stay where it was, and the conclusion would fail, while the identity held
    exactly as before.

    Both of those are compatible with the one sentence in the premise. The identity cannot tell
    you which one happens in a real body. That is a separate, empirical question, and it belongs
    to concepts later in this rung, not to this one.

    Picture the missing premise written out loud, the way `B0-R0-C42`'s own illustration does it:
    "and expenditure does not change when intake does." Nobody who makes the "eat less" argument
    usually says that sentence. It is doing the work anyway, hidden, and it is a claim about
    physiology, not a consequence of the accounting line above it.
  analogy_breaks_when: |
    This illustration tests one inference, from one premise, and it does not settle whether "eat
    less" works as an instruction. It may or it may not; that is an empirical question about how
    expenditure and appetite respond, and this record does not carry the evidence either way.

    It also does not mean every conclusion drawn from the identity is unsupported. "If a person's
    energy stores fell over a stretch of time, then intake was below expenditure over that
    stretch, once both are counted correctly" does follow from the premise alone, because it says
    nothing about what caused either side to move. The inference that fails is the one that adds a
    direction of control the identity never supplied.

    And the missing-premise move stops working once somebody states the extra premise openly and
    defends it with evidence. At that point the argument no longer rests on the identity doing
    work it cannot do; it rests on whatever evidence was offered, which is a different thing to
    evaluate.
must_know:
- point: |
    "Energy in minus energy out" is a premise, not a conclusion. The step from it to "so eat less"
    is a separate inference, and the identity alone does not carry it, because the identity says
    nothing about what expenditure does when intake changes.
  kind: misconception
  bearing: methodological
- point: |
    When you hear the identity used to defend a specific instruction, ask what has been assumed
    about expenditure that was never stated. Naming that hidden premise is usually the whole of
    the disagreement.
  kind: move
  bearing: methodological
- point: |
    The identity is consistent with every serious account of why weight changes, because every one
    of them can be written so the two sides balance. It cannot be used to choose between them, and
    citing it as if it settles a causal dispute settles nothing.
  kind: boundary
  bearing: methodological
- point: |
    In front of a patient or in public, keep the arithmetic and the explanation separate on
    purpose. Say what changed, in energy terms, if you know it. Do not let the identity stand in
    for an account of why it changed, which you may not have.
  kind: move
  bearing: clinical
- point: |
    A trainee who has just learned this identity will reach for "energy in, energy out" as an
    explanation the first time someone asks why a patient's weight moved. Watch for the sentence
    doing the work of an inference nobody has actually made.
  kind: trap
  bearing: teaching
- point: |
    When a journalist repeats "it's just calories in, calories out", the accurate short reply is
    that the arithmetic is real and settles nothing about cause. That sentence is calibrated
    honesty, not a hedge, and it is more defensible in the room than either agreeing outright or
    dismissing the arithmetic.
  kind: consequence
  bearing: public
exercises:
- type: critique
  prompt: |
    A clinic pamphlet says: "Energy balance is simple physics: calories in minus calories out
    equals weight change. So weight change is entirely under a person's control."

    Lay the argument out as a premise and a conclusion, in the style of `B0-R0-C42`, and say
    whether the inference holds.
  answer: |
    Premise: the change in energy stores equals intake minus expenditure. Conclusion: weight
    change is entirely under a person's control.

    The inference does not hold. Granting the premise fully changes nothing about whether either
    side of it is under anyone's control. Expenditure includes resting metabolism, which is not
    chosen; and later concepts in this rung show intake and expenditure interact rather than
    moving independently. "The two sides must balance" and "a person can freely set either side"
    are different claims, and only the first follows from physics.

    The pamphlet needed a further premise — that intake and expenditure each respond only and
    fully to choice — and did not state it. Stated aloud, it is the premise a reader can actually
    check.
  skill_ref: S01-R1-K01
retrieval_items:
- q: State the one-sentence identity for a body's energy stores, and then say in one sentence what
    it does not tell you.
  a: The rate of change of a person's energy stores equals energy intake minus energy expenditure.
    It does not tell you why either side took the value it did, or what happens to one side when
    the other changes.
- q: Somebody argues, "energy in minus energy out, so eat less." What is the missing premise, and
    what kind of claim is it?
  a: That expenditure does not change when intake changes. It is an empirical claim about
    physiology, not something the identity supplies, and it needs its own evidence.
- q: Why does the identity fail to choose between competing accounts of why weight changes?
  a: Because every serious account — appetite-driven, expenditure-driven, environment-driven — can
    be written so intake minus expenditure still equals the change in stores. The identity rules
    out only an account where the two sides do not balance, which none of the serious ones is.
