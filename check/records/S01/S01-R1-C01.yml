simplified_explanation: |
  Pack enough fat cells together and you have adipose tissue, the fatty layer and the pockets
  of fat scattered round a body. That is the store.

  It is a large store. For most people, the fat sitting in adipose tissue holds more spare
  energy than anything else in the body does.

  A person carrying more body fat is not simply carrying fat mass in place of fat-free mass.
  They generally carry more of both.

  So weight on a scale is one number covering two different things. A kilogram gained or lost
  could be mostly fat, mostly the other compartment, or some mixture, and the scale alone
  cannot tell you which.
illustration:
  body: |
    You are handed a weighing scale and a number: 90 kilograms.

    Open the review, Hall and Guo, "Obesity energetics", *Gastroenterology* 2017, at
    https://pmc.ncbi.nlm.nih.gov/articles/PMC5568065/. Open your browser's find box and search
    for fat-free mass.

    > It has long been recognized that fat-free mass comprises the metabolically active tissues
    > of the body and therefore contributes more to REE than body fat.

    REE is resting energy expenditure, the energy spent at rest. Metabolically active tissue is
    the tissue that spends most of that energy.

    Read on, in the same paragraph.

    > Fat-free mass is elevated in obesity, along with body fat, resulting in increased REE
    > compared with lean subjects.

    Two people can carry the same 90 kilograms and split it differently between fat mass and
    fat-free mass. Neither split is visible in the number 90.

    Now search the same page for vast majority.

    > Body fat represents the vast majority of energy stores in the body compared with the
    > energy content of body protein and glycogen.

    Protein and glycogen are the other stores. When intake falls short, the body draws on all
    three.
  analogy_breaks_when: |
    It does not say how much of adipose tissue's own weight is fat, or how much energy either
    compartment holds for each kilogram. That is the next section.
must_know:
- point: |
    A kilogram of body weight is not a kilogram of fat.
  kind: misconception
  bearing: clinical
- point: |
    A person carrying more body fat generally carries more fat-free mass too, not less.
  kind: misconception
  bearing: clinical
- point: |
    Ask how a fat-mass or fat-free-mass figure was measured before you accept it. A scale
    alone cannot give it.
  kind: move
  bearing: methodological
retrieval_items:
- q: What are body weight's two compartments, and which one is the metabolically active one?
  a: Fat mass, the triglyceride held in adipose tissue, and fat-free mass, everything else the
    body weighs. Fat-free mass is the metabolically active compartment.
- q: Does more body fat mean less fat-free mass?
  a: No. Fat-free mass is generally elevated in obesity alongside body fat, not displaced by
    it.
figure_note: "The section's one number is a 90 kg total whose split into fat mass and fat-free mass it deliberately does not give, so any drawn split would print masses no held source states."
