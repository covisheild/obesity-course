definition:
  text: |
    Fat is stored in the body as triglyceride, packed inside fat cells, adipocytes, which
    together make up adipose tissue.

    Body weight is not one substance on a scale. Split it into two compartments. Fat mass is
    the triglyceride held in adipose tissue. Fat-free mass is everything else the body weighs.
    Some papers call it lean body mass.

    Adipose tissue also holds fluid and protein. On this split, those count as fat-free mass.

    Naming a change in body weight is not yet naming a change in fat.
