definition:
  text: |
    "Eat less, move more" is usually offered as an argument with an unstated premise. Written out
    in full it runs: the identity says the rate of change of stored energy equals intake minus
    expenditure (premise one). Cutting intake, with expenditure held fixed, therefore reduces
    stored energy (premise two, which is arithmetic and true). Conclusion: cutting intake and
    raising expenditure is a sufficient instruction for losing weight and keeping it off.

    The inference fails, and it fails at premise two's hidden clause: "with expenditure held
    fixed". Intake and expenditure are not fixed once a person acts on the instruction; they move
    in response to the fall in stored energy, in the direction that opposes it, exactly as an
    earlier concept establishes.

    This is not a claim that the accounting is wrong.
  references:
  - citekey: openstax_chemistry_2e
    kind: textbook
    locator: "5.1 Energy Basics, paragraph on the law of conservation of energy"
    quote: "Energy can be converted from one form into another, but all of the energy present
      before a change occurs always exists in some form after the change is completed. This
      observation is expressed in the law of conservation of energy: during a chemical or
      physical change, energy can be neither created nor destroyed, although it can be changed
      in form."
    verified:
      resolved_id: https://openstax.org/books/chemistry-2e/pages/5-1-energy-basics
      opened: true
      claim_located: true
      checked_on: '2026-09-23'
  - citekey: hall_guo_2017
    kind: primary
    locator: "Opening paragraphs, second and third paragraphs"
    quote: "obesity prevention is often erroneously portrayed as a simple matter of bookkeeping
      whereby calorie intake must be balanced by calorie expenditure.1 Under this “calories in,
      calories out” model, treating obesity amounts to advising people to simply eat less and
      move more, thereby tipping the scales of calorie balance and resulting in steady weight loss
      that accumulates according to the widely known, but erroneous, 3500 kcal per pound rule.2,3
      Therefore, failure to experience substantial weight loss implies that an individual lacks
      the willpower to adhere to a modest lifestyle intervention over a sufficient period of time."
    verified:
