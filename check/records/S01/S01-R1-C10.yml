simplified_explanation: |
  Stores go up when intake is bigger than expenditure, and down when it is smaller. So cut
  intake, with expenditure unchanged, and stores must fall.

  But the instruction says more than the arithmetic does. It quietly assumes expenditure does
  stay unchanged. Cut intake, and expenditure itself falls, further than the lost weight alone
  explains. Appetite rises, and pulls harder than expenditure falls.
illustration:
  body: |
    Suppose a newspaper runs a quote like this from a doctor: "Weight loss is just maths.
    Calories in, calories out. If someone isn't losing weight, they aren't sticking to the plan."

    Premise one: stored energy changes at a rate equal to intake minus expenditure. True; it is
    the identity.

    Premise two, left unsaid: once intake is cut, expenditure and appetite stay where they were.

    Premise three, also unsaid: a fall in stored energy shows up as a fall in weight. True; the
    stores are body tissue (`S01-R1-C01`).

    Conclusion: a person not losing weight has not really cut intake.

    The evidence in this book says premise two is false. Expenditure falls as weight falls, and
    further than the lost mass explains. So a held cut produces a loss that slows and stops.
    Appetite rises as well. That is why the cut is so hard to hold, and why a stall is no
    evidence about effort.

    The doctor's quote does not misstate the arithmetic. It misstates what follows from it, by
    adding a premise that was never checked and is not true.
  analogy_breaks_when: |
    This section shows the instruction rests on a false premise; it does not say the instruction
    never works. Some people do lose weight and keep it off this way, with long-term, sustained
    effort.
must_know:
- point: |
    The identity is never in dispute and is never what breaks. State the identity and the
    instruction as two separate claims, every time, so the second one can be checked rather than
    assumed.
  kind: misconception
  bearing: methodological
- point: |
    "They must not be sticking to it" is the same unlicensed move as the instruction itself: an
    observation (the scale has stalled) explained by inventing a premise (lack of effort) instead
    of checking the one already shown to be false.
  kind: trap
  bearing: clinical
- point: |
    You can give this whole argument to a non-specialist in about three minutes, using no
    mechanism and no moral claim: the accounting is true, the instruction adds an assumption, the
    assumption is false, and the difficulty that follows is physiological.
  kind: move
  bearing: public
- point: |
    Do not turn this argument into advice for a patient; it says what the arithmetic cannot
    license, not what to do instead.
  kind: boundary
  bearing: methodological
exercises:
- type: teaching
  prompt: |
    A health secretary has one page and wants the one paragraph they can put in front of a
    minister who has just said "obesity is simple, it's calories in versus calories out."
    Write it. No methods section, answer first.
  answer: |
    The accounting is correct: stored energy changes at a rate equal to intake minus
    expenditure, and that is always true. What is not correct is the instruction built on it -
    "eat less, move more, and the rest follows" - because it assumes expenditure and appetite
    hold still once a person acts on it. They do not. Cutting intake makes the body burn somewhat
    less and want to eat somewhat more, automatically. So the accounting supports
    the direction of the policy and does not support the assumption that the arithmetic alone
    will carry a person the rest of the way. A policy built only on the arithmetic will
    under-predict how much support people need to keep the change going.
- type: build
  prompt: |
    Write a one-page explanation of why energy balance is arithmetically true and practically
    insufficient. State the identity, name the instruction people draw from it, name the
    unstated premise, and say what the evidence in this book shows about that premise. No
    mechanism, no verdict on any individual's effort. Then read it to a non-medical reader and
    note where they stopped you to ask a question. You should be able to give the same
    explanation from memory in about three minutes.
  answer: |
    There is no single correct page; the answer is judged against the four things the prompt
    names. A page that states the identity without also stating that it is an identity - always
    true by the way stores are defined - has not done the first job. A page that names the
    instruction but not the unstated premise (once intake is cut, expenditure and appetite stay
    where they were) has not done the second. A page that cites evidence without naming a number
    (the 20-25% fall in expenditure, and the rise in intake of about 100 kcal a day per kg lost, as the reason a cut
    is hard to hold, both from `S01-R1-C09`) has not done the third. A page that slides into "so
    it isn't the patient's fault" as a moral verdict, rather than stopping at the physiological
    explanation, has broken the prompt's no-verdict condition.
retrieval_items:
- q: What, specifically, breaks in the argument from "the identity is true" to "eat less, move
    more is a sufficient instruction"?
  a: An unstated second premise - that expenditure and appetite hold still once intake is cut -
    which the evidence shows is false; the identity itself never breaks.
- q: What is wrong with explaining a stalled weight loss as "they must not be sticking to it"?
  a: It repeats the same move as the naive instruction, inventing a premise (lack of effort)
    instead of checking the one already shown false. A stall is what falling expenditure
    produces even when the cut is held, and rising appetite makes the cut hard to hold. Neither
    is evidence about effort.
- q: What should you be able to do by the end of this part of the course?
  a: Explain the accounting identity in about three minutes, without presenting it as a
    mechanism and without turning it into a moral judgement.
