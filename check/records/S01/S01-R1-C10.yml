definition:
  text: |
    "Eat less, move more" is usually offered as an argument with an unstated premise. Written out
    in full, its eat-less half runs like this. Premise one: the rate of change of stored energy
    equals intake minus expenditure. Premise two, unstated: once intake is cut, expenditure and
    appetite stay where they were. Premise three: a fall in stored energy shows up as a fall in
    weight. Conclusion: cutting intake is a sufficient instruction for losing weight.

    The inference holds: grant every premise and the conclusion follows. What fails is premise
    two, which is false. Once a person acts on the instruction, expenditure and appetite move.
    They move in response to the fall in body weight, or a signal that tracks it, in the
    direction that opposes it, as `S01-R1-C09` shows.

    This is not a claim that the accounting is wrong.
