simplified_explanation: |
  Stores go up when intake is bigger than expenditure, and down when it is smaller. So cut
  intake, or raise expenditure, and stores must fall.

  But the instruction says more than the arithmetic does. It says cut intake once, and stores
  keep falling on their own, because it quietly assumes expenditure stays where it was. Cut
  intake, and expenditure itself falls, further than the lost weight alone explains. Appetite
  rises, and pulls harder than expenditure falls.
illustration:
  body: |
    A national newspaper runs a quote from a well-known doctor: "Weight loss is just maths.
    Calories in, calories out. If someone isn't losing weight, they aren't sticking to the plan."

    Premise one: stored energy changes at a rate equal to intake minus expenditure. True; it is
    the identity.

    Premise two, left unsaid: once a person cuts intake, expenditure and appetite do not move.

    Conclusion: a person not losing weight has not really cut intake.

    The evidence in this booklet says premise two is false: expenditure falls further than the
    lost mass explains, and appetite rises by more again.

    The doctor's quote does not misstate the arithmetic. It misstates what follows from it, by
    adding a premise that was never checked and is not true.
  analogy_breaks_when: |
    This concept says the naive inference from the identity to the instruction fails; it does not
    say the instruction never works. Many people do lose weight and keep it off by eating less and
    moving more, sometimes with support this booklet has not covered.
must_know:
- point: |
    The identity is never in dispute and is never what breaks. State the identity and the
    instruction as two separate claims, every time, so the second one can be checked rather than
    assumed.
  kind: misconception
  bearing: methodological
- point: |
    "They must not be sticking to it" is the same unlicensed move as the instruction itself: an
    observation (the scale has stalled) explained by inventing a premise (lack of effort) instead
    of checking the one already shown to be false.
  kind: trap
  bearing: clinical
- point: |
    You can give this whole argument to a non-specialist in about three minutes, using no
    mechanism and no moral claim: the accounting is true, the instruction adds an assumption, the
    assumption is false, and the difficulty that follows is physiological.
  kind: move
  bearing: public
- point: |
    It gives you an argument to check, not a treatment plan; a plan needs the later rungs of
    this subject.
  kind: boundary
  bearing: methodological
exercises:
- type: teaching
  prompt: |
    A health secretary has one page and wants the one paragraph they can put in front of a
    minister who has just said "obesity is simple, it's calories in versus calories out."
    Write it. No methods section, answer first.
  answer: |
    The accounting is correct: stored energy changes at a rate equal to intake minus
    expenditure, and that is always true. What is not correct is the instruction built on it -
    "eat less, move more, and the rest follows" - because it assumes expenditure and appetite
    hold still once a person acts on it. They do not. Cutting intake makes the body burn somewhat
    less and want to eat somewhat more, automatically, in everyone. So the accounting supports
    the direction of the policy and does not support the assumption that the arithmetic alone
    will carry a person the rest of the way. A policy built only on the arithmetic will
    under-predict how much support people need to keep the change going.
- type: build
  prompt: |
    Write the one-page explanation this rung's build target asks for: why energy balance is
    arithmetically true and practically insufficient. State the identity, name the instruction
    people draw from it, name the unstated premise, and say what the evidence in this rung shows
    about that premise. No mechanism, no verdict on any individual's effort. Then read it to a
    non-medical reader and note where they stopped you to ask a question - that is the gate this
    rung sets: you should be able to give the same explanation from memory in about three minutes.
  answer: |
    There is no single correct page; the answer is judged against the four things the prompt
    names. A page that states the identity without also stating that it is an identity - always
    true by the way stores are defined - has not done the first job. A page that names the
    instruction but not the unstated premise (expenditure and appetite held fixed) has not done
    the second. A page that cites evidence without naming a number (the 20-25% fall in
    expenditure, the ~100 kcal per kg rise in intake, both from this rung) has not done the
    third. A page that slides into "so it isn't the patient's fault" as a moral verdict, rather
    than stopping at the physiological explanation, has broken the no-mechanism, no-moral-claim
    condition the gate sets.
retrieval_items:
- q: What, specifically, breaks in the inference from "the identity is true" to "eat less, move
    more is a sufficient instruction"?
  a: An unstated second premise - that expenditure and appetite hold still once intake is cut -
    which the evidence shows is false; the identity itself never breaks.
- q: What is wrong with explaining a stalled weight loss as "they must not be sticking to it"?
  a: It repeats the same move as the naive instruction, inventing a premise (lack of effort)
    instead of checking the one already shown false; a stall is the expected output of rising
    expenditure resistance and appetite, not evidence about effort.
- q: What is this rung's gate?
  a: Being able to explain the accounting identity in about three minutes, without presenting it
    as a mechanism and without turning it into a moral judgement.
