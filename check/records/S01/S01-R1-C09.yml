must_know:
- point: |
    "Cut intake and weight keeps falling at the same rate" is incomplete. Treat a plateau in
    weight loss as the expected output of this loop, not as proof the patient has stopped trying.
  kind: misconception
  bearing: clinical
- point: |
    A conversation about "slower metabolism" that never mentions rising hunger is describing
    the smaller half of what the patient is fighting.
  kind: consequence
  bearing: clinical
- point: |
    A formerly heavier person needs roughly 300 to 400 fewer kcal a day than someone who was
    always that weight, to hold the same weight. How long that lasts is still disputed.
  kind: consequence
  bearing: clinical
- point: |
    Do not quote the 100 kcal per kg or the 300-400 kcal figures to a patient as what will
    happen to them.
  kind: boundary
  bearing: methodological
exercises:
- type: critique
  prompt: |
    A colleague says: "This patient's weight loss has stalled because they've stopped sticking
    to the diet. The arithmetic hasn't changed, so the only thing that can have changed is their
    behaviour." Using this section, say what is wrong with that inference.
  answer: |
    The arithmetic - intake minus expenditure - still holds, but the colleague has assumed both
    sides are still what they were at the start. As weight falls, expenditure falls with it, so
    even a fixed intake gives a loss that slows and levels off. Appetite rises at the same time,
    which makes the prescribed intake harder and harder to hold. A stall therefore cannot tell
    "stopped trying" apart from either effect. Concluding "stopped sticking to the diet" needs a
    check on intake, and self-report is a poor check.
retrieval_items:
- q: Name the two things that move against a person once they cut intake and start losing weight.
  a: Energy expenditure falls by more than the loss of fat and lean mass alone predicts, and
    appetite rises.
- q: Which of the two responses is larger, and by roughly how much?
  a: The appetite response. Per kilogram lost, it is more than three times the fall in
    expenditure that other studies measured.
- q: About how many fewer kcal a day does a formerly heavier person need than a person who was
    always that weight, after sustaining a 10% or greater loss?
  a: Roughly 300 to 400 fewer kcal a day.
