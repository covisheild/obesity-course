definition:
  text: |
    Energy intake and energy expenditure are not two independent dials a person sets and then
    leaves alone. They are outputs of a system that senses body weight, or a signal that tracks
    it, and pushes back when weight falls. Cut intake, and two things move against the cut.

    Expenditure falls by more than the loss of fat and lean mass alone accounts for. After a
    person sustains a loss of 10% or more of body weight, 24-hour energy expenditure falls by
    about 20% to 25%, and that fall runs about 10% to 15% below what a change of that size in fat
    and lean mass alone would predict. The extra fall is the adaptive part: a formerly heavier
    person now needs roughly 300 to 400 fewer calories a day than a person of the same weight and
    composition who was never heavier.

    Appetite rises. That pull is more than three times the size of the matching fall in
    expenditure, so the appetite response, not the metabolic one, is the larger of the two.

    Both responses run in the direction that returns stored energy toward where it was.
  references:
  - citekey: rosenbaum_leibel_2010
    kind: primary
    locator: "Metabolic responses to attempts to sustain weight loss: Energy expenditure, first paragraph"
    quote: "Maintenance of a 10% or greater reduction in body weight in lean or obese individuals
      is accompanied by an approximate 20%-25% decline in 24-hour energy expenditure. This
      decrease in weight maintenance calories is 10–15% below what is predicted solely on the
      basis of alterations in fat and lean mass 11, 12. Thus, a formerly obese individual will
      require ~300–400 fewer calories per day to maintain the same body weight and physical
      activity level as a never-obese individual of the same body weight and composition."
    verified:
      resolved_id: https://pmc-oa-opendata.s3.amazonaws.com/PMC3673773.1/PMC3673773.1.txt
      opened: true
      claim_located: true
      checked_on: '2026-09-23'
  - citekey: polidori_2016
    kind: primary
    locator: "Abstract, Results sentence"
    quote: "We discovered that weight loss leads to a proportional increase in appetite resulting
      in eating above baseline by ~100 kcal/day per kg of lost weight – an amount more than
      3-fold larger than the corresponding energy expenditure adaptations."
    verified:
      resolved_id: https://pmc-oa-opendata.s3.amazonaws.com/PMC5108589.1/PMC5108589.1.txt
      opened: true
      claim_located: true
      checked_on: '2026-09-23'
  - citekey: hall_guo_2017
    kind: primary
    locator: "Opening paragraphs, third paragraph"
    quote: "We now understand that energy intake and expenditure are interdependent variables
      that are dynamically influenced by each other and body weight.4 Attempts to alter energy
      balance through diet or exercise are countered by physiological adaptations that resist
      weight loss.5"
    verified:
      resolved_id: https://pmc-oa-opendata.s3.amazonaws.com/PMC5568065.1/PMC5568065.1.txt
      opened: true
