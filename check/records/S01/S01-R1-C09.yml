must_know:
- point: |
    "Cut intake and only fat is lost" is incomplete. Treat a plateau in weight loss as the
    expected output of this loop, not as the patient having stopped trying.
  kind: misconception
  bearing: clinical
- point: |
    A conversation about "slower metabolism" that never mentions rising hunger is describing
    the smaller half of what the patient is fighting.
  kind: number
  bearing: clinical
- point: |
    A formerly heavier person needs roughly 300 to 400 fewer calories a day than someone who was
    always that weight, to hold the same weight.
  kind: consequence
  bearing: clinical
- point: |
    Do not quote the 100 kcal per kg or the 300-400 kcal figures to a patient as what will
    happen to them.
  kind: boundary
  bearing: methodological
- point: |
    It does not teach the neuroendocrine mechanism that carries the signal; that sits in a
    later subject.
  kind: boundary
  bearing: teaching
exercises:
- type: critique
  prompt: |
    A colleague says: "This patient's weight loss has stalled because they've stopped sticking
    to the diet. The arithmetic hasn't changed, so the only thing that can have changed is their
    behaviour." Using this section, say what is wrong with that inference.
  answer: |
    The arithmetic - intake minus expenditure - has not changed as an identity, but the colleague
    has assumed the two sides of it are still what they were at the start. They are not, on
    either side. As weight has fallen, expenditure has dropped by more than the loss of body
    mass explains, and appetite has risen, both automatically. A stalled loss is the expected
    output of these two effects even if the patient is eating exactly what they were told to
    eat. Concluding "stopped sticking to the diet" from a stalled scale, without checking intake,
    treats a physiological response as if it could only be a behavioural one.
retrieval_items:
- q: Name the two things that move against a person once they cut intake and start losing weight.
  a: Energy expenditure falls by more than the loss of fat and lean mass alone predicts, and
    appetite rises.
- q: Which of the two responses is larger, and by roughly how much?
  a: The appetite response, at more than three times the size of the matching fall in expenditure,
    in the trial that measured both.
- q: About how many fewer calories a day does a formerly heavier person need than a person who was
    always that weight, after sustaining a 10% or greater loss?
  a: Roughly 300 to 400 fewer calories a day.
