simplified_explanation: |
  Ask a simple question: how much energy does a kilogram of "fat" gained or lost hold? There are
  two different honest answers, and mixing them up is the whole trap.

  The first answer is about pure fat, the triglyceride itself. Fat in food carries about 9
  kilocalories a gram, which is 9,000 a kilogram, or about 37 megajoules. Fat stored in the body
  carries 39.5 megajoules a kilogram.

  The second answer is about adipose tissue, the actual stuff that is gained or lost. It is not
  pure fat — `S01-R1-C01` already told you that. By how much depends on what fraction of it is
  fat, and here the honesty runs out: the only figure for that fraction in the sources this book
  cites is 87%, and it is not a measurement.

  Do the sum anyway, to see the size of the effect. Multiply 0.87 by fat's 37 kilojoules a gram.
  You get 32.19 megajoules a kilogram, close to the famous rule's 32.2, but partly by luck.
  Start from 9,000 kilocalories instead and the same sum gives 7,830, not the rule's 7,700.

  That is arithmetic on an assumption.
illustration:
  body: |
    Open the table of prefixes kept by the International Bureau of Weights and Measures (BIPM),
    "The International System of Units (SI): Prefixes", at
    https://www.bipm.org/en/measurement-units/si-prefixes, and search the table for mega.

    > mega | M | 106

    The page prints 10 with a small raised 6. Copied as plain text it can come out as 106. Read
    it as ten to the sixth, a million. A megajoule is a million joules, a thousand kilojoules.

    Open FAO Food and Nutrition Paper 77, chapter 3, at https://www.fao.org/4/y5022e/y5022e04.htm,
    and search for the word Atwater.

    > The energy values are 17 kJ/g (4.0 kcal/g) for protein, 37 kJ/g (9.0 kcal/g) for fat and
    > 17 kJ/g (4.0 kcal/g) for carbohydrates.

    Fat: 37 kilojoules a gram. Scale that to a kilogram.

    ```working
        37 kJ/g times 1000 g/kg = 37000 kJ/kg
        37000 kJ/kg divided by 1000 kJ/MJ = 37 MJ/kg
    ```

    37 megajoules a kilogram. The multiplication and the division cancel: a kilojoule-per-gram
    figure is already a megajoule-per-kilogram figure.

    Open Hall, "What is the required energy deficit per unit weight loss?", *International
    Journal of Obesity* 2008, at https://pmc.ncbi.nlm.nih.gov/articles/PMC2376744/, and search for
    the word respectively.

    > the metabolizable energy densities of body glycogen, protein and fat are 17.6, 19.7, and
    > 39.5 MJ/kg, respectively

    39.5 megajoules a kilogram for fat in the body, against FAO's 37 for fat in food.

    Now search the same paper for 87%.

    > The origin of this rule can be traced back to a calculation that assumes exclusive loss of
    > adipose tissue consisting of 87% fat

    It says a calculation assumes 87%. It does not say a measurement found 87%. Search on for the word
    variable.

    > the change of body fat,ΔF, is not equivalent to the loss adipose tissue, which includes a
    > variable contribution of fluid and protein in addition to triglyceride

    Run the assumed fraction through the arithmetic once.

    ```working
        0.87 times 37 = 32.19
    ```

    Search the same paper, near the start, for MJ per kg.

    > a cumulative energy deficit of 3500 kcal is required to lose 1 pound of body weight, or
    > equivalently 32.2 MJ per kg

    32.19 lands close to 32.2. That is partly luck. FAO's footnote gives fat's precise value as
    37.4 kilojoules a gram; 37 is its rounding. Try 37.4, Hall's 39.5, and 9,000 kilocalories.

    ```working
        0.87 times 37.4 = 32.538
        0.87 times 39.5 = 34.365
        0.87 times 9000 = 7830
    ```

    32.5, 34.4, and 7,830 kilocalories. The rule is 3,500 kilocalories a pound, about 7,700 a
    kilogram (`S01-R1-C07` works that out). Hall does not say which figure for fat the original
    calculation used. What the sum shows is the size of the effect an 87% assumption has, not how
    the rule was built.

    Search the same paper for 7.6.

    > This results in a calculated energy density for lean body mass changes of ρL = 7.6 MJ/kg.

    ρL is the paper's symbol for it: the energy in a kilogram of lean mass lost or gained.

    ```table
    | quantity | value | source |
    | fat in food, FAO Atwater factor | 9.0 kcal/g; 37 MJ/kg | FAO 2003 |
    | fat in the body | 39.5 MJ/kg | Hall 2008 |
    | adipose tissue, the rule's assumption | 32.2 MJ/kg (about 7,700 kcal/kg) | Hall 2008 (the rule, not a measurement) |
    | lean mass change | 7.6 MJ/kg | Hall 2008 |
    ```
  analogy_breaks_when: |
    The third row is different in kind, not just in size. It is one assumption, 87% fat, carried
    through one piece of arithmetic; the paper that reports the assumption also says the true
    figure is variable.

    The closeness of 32.19 to Hall's 32.2 MJ/kg is not a confirmation. With 37.4 or 39.5 for fat,
    the same 87% lands elsewhere. And `S01-R1-C07`'s pound conversion restates the rule; it does
    not check the 87%.

    The fourth row is named, not explained.
must_know:
- point: |
    Pure fat holds about 9 kilocalories a gram (9,000 a kilogram), or 37 to 39.5 megajoules a
    kilogram: 37 for fat in food (FAO), 39.5 for fat stored in the body (Hall 2008).
  kind: number
  bearing: clinical
  refs:
  - fao_food_energy_2003
  - hall_2008_ijo
- point: |
    A kilogram of adipose tissue lost or gained is not a kilogram of pure fat. It is a
    mixture, and it holds less energy per kilogram than pure fat does. Never quote 9,000 kilocalories
    or 37-39.5 megajoules a kilogram for a kilogram of weight a patient has lost or gained.
  kind: misconception
  bearing: clinical
- point: |
    The figure of about 32 megajoules, or 7,700 kilocalories, for a kilogram of adipose tissue is
    the static rule's own number, which Hall (2008) traces to an assumed 87% lipid fraction that
    no source this book cites measures. Say "the rule assumes" when you use it, never "adipose tissue is".
  kind: trap
  bearing: methodological
- point: |
    A sum that lands near the rule's 32.2, like 0.87 times 37, does not confirm the rule. Use 37.4
    or 39.5 for fat and the same 87% lands elsewhere.
  kind: trap
  bearing: methodological
- point: |
    A kilogram of lean mass lost or gained carries about 7.6 megajoules (Hall 2008), about a fifth
    of fat's figure. That is the energy of the change, not of lean tissue as a whole; Hall warns
    the two "are not equivalent".
  kind: number
  bearing: methodological
  refs:
  - hall_2008_ijo
- point: |
    Because fat and lean tissue differ this much, and `S01-R1-C01` already showed a scale cannot
    tell you which compartment moved, no single kilocalories-per-kilogram figure is safe to apply
    to a patient's weight change without separately knowing, or reasonably assuming, what that
    change was made of.
  kind: consequence
  bearing: clinical
quantitative: true
practice:
- level: 1
  prompt: |
    A tissue's energy per gram (counting only the fat) is found by multiplying its lipid fraction
    by 9.0. Work out the result for a lipid fraction of 0.80, and separately for a lipid fraction of 0.60.
  answer: |
    Multiply each fraction by 9.0.

    ```working
        0.80 times 9.0 = 7.2
        0.60 times 9.0 = 5.4
    ```

    7.2 and 5.4.
- level: 2
  prompt: |
    Convert 34,000 kilojoules into megajoules. Then convert 2.5 megajoules into kilojoules.
  answer: |
    A megajoule is a thousand kilojoules, so kilojoules to megajoules means dividing by 1,000.

    ```working
        34000 divided by 1000 = 34
    ```

    34 megajoules.

    Megajoules to kilojoules means multiplying by 1,000.

    ```working
        2.5 times 1000 = 2500
    ```

    2,500 kilojoules.
- level: 3
  prompt: |
    Two energy densities are quoted for two different tissues: 39.5 and 7.6, in the same units.
    Work out how many times larger the first is than the second.
  answer: |
    Divide the larger by the smaller.

    ```working
        39.5 divided by 7.6 = 5.197368421
    ```

    Round once, at the end: about 5.2 times larger.
- level: 4
  prompt: |
    FAO Food and Nutrition Paper 77 gives the Atwater general factor for fat as 9.0 kilocalories
    a gram. Work out how many kilocalories that is for one kilogram of pure fat, then convert to
    megajoules using 1 kilocalorie = 0.004184 megajoules.
  answer: |
    Scale the gram figure to a kilogram first.

    ```working
        9.0 times 1000 = 9000
    ```

    9,000 kilocalories a kilogram. Convert to megajoules.

    ```working
        9000 times 0.004184 = 37.656
    ```

    37.656 megajoules a kilogram. That is close to the 37 FAO prints, not equal: 9.0 and 37 are
    rounded separately.
  refs:
  - fao_food_energy_2003
  - nist_sp811
- level: 5
  prompt: |
    Hall (2008) gives the metabolizable energy density of body fat as 39.5 megajoules a kilogram.
    Convert this to kilocalories a kilogram, using 1 kilocalorie = 4.184 kilojoules.
  answer: |
    Put both figures in kilojoules first. 39.5 megajoules is 39,500 kilojoules.

    ```working
        39.5 times 1000 = 39500
    ```

    Divide by the size of one kilocalorie in kilojoules.

    ```working
        39500 divided by 4.184 = 9440.73
    ```

    About 9,440.7 kilocalories a kilogram, close to but not the same as FAO's 9,000. The two
    describe different fat: FAO's is fat eaten, corrected for what digestion loses; Hall's is fat
    already stored in the body.
  refs:
  - hall_2008_ijo
  - nist_sp811
  - fao_food_energy_2003
- level: 6
  prompt: |
    Hall (2008) traces the static rule to a calculation assuming adipose tissue is
    87% fat. Take FAO's 37 kilojoules a gram for fat and work out the adipose-tissue energy
    density in kilojoules a gram this assumption produces, and say how it compares with Hall's own statement of the rule as "32.2 MJ per kg".
  answer: |
    Multiply the assumed fraction by the energy per gram.

    ```working
        0.87 times 37 = 32.19
    ```

    32.19 kilojoules a gram, which is the same number in megajoules a kilogram: 32.19 MJ/kg.

    Hall's own figure for the rule is 32.2 MJ per kg. 32.19 lands close to it, but that is partly
    luck. Try FAO's precise 37.4, and Hall's 39.5.

    ```working
        0.87 times 37.4 = 32.538
        0.87 times 39.5 = 34.365
    ```

    32.5 and 34.4. Hall does not say which figure for fat the original calculation used. The sum
    shows the size of the effect an 87% assumption has, not how the rule was built.
  refs:
  - hall_2008_ijo
  - fao_food_energy_2003
- level: 7
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
        pure fat holds 39.5 MJ/kg, Hall (2008)
        a patient's weight falls by 4 kg over a diet
        4 times 39.5 = 158
        so the deficit responsible for the loss was 158 MJ
    ```
  answer: |
    The step that broke is the third. 39.5 megajoules a kilogram is pure fat's own energy
    density, from Hall (2008). The 4 kilograms the patient lost is not 4 kilograms of pure fat.
    It is adipose tissue plus some lean mass; Hall (2008) notes that lean mass is lost alongside
    fat. Even
    the adipose tissue is diluted by whatever part of it is not triglyceride.

    Using 39.5 on a figure that is not pure fat overstates the deficit. Even taking the rule's own
    assumed adipose figure, 32.2 MJ/kg, instead:

    ```working
        4 times 32.2 = 128.8
    ```

    128.8 megajoules, noticeably below 158 — and this second number still rests on an unverified
    87% assumption, so neither figure should be reported as if it were exact.

    Why the wrong answer looks reasonable. 39.5 is a real, correctly quoted figure from a cited
    source, and the multiplication is arithmetically correct. What is missing is the check this
    whole section turns on: which kilogram, pure fat's or adipose tissue's, the 4 kilograms lost
    actually refers to.
  refs:
  - hall_2008_ijo
- level: 8
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
        the static rule's adipose figure is about 7,700 kcal/kg
        FAO's Atwater factor for fat is 9.0 kcal/g, or 9,000 kcal/kg
        7,700 is close to 9,000
        so the two figures confirm each other, and adipose tissue is essentially pure fat
    ```
  answer: |
    The step that broke is the last. Closeness between the two figures is not confirmation, and
    the direction of the gap says the opposite of the conclusion.

    7,700 is lower than 9,000 because the rule assumes adipose tissue is less than 100% fat.

    ```working
        9000 minus 7700 = 1300
    ```

    That 1,300 kilocalories a kilogram is roughly the dilution the rule assumes, not evidence that
    there is none. 7,700 is the rule's own figure, which Hall traces to an assumed 87% fat.

    ```working
        0.87 times 9000 = 7830
    ```

    0.87 times 9,000 gives 7,830, the same neighbourhood.

    Why the wrong answer looks reasonable. Both figures are real and correctly quoted, and
    "close, so consistent" is a reasonable-sounding move in other settings. Here it inverts the
    relationship: the two numbers are close because the rule assumes a fraction near 1, not
    because two separate measurements agree.
- level: 9
  prompt: |
    A colleague says: "A kilogram of fat is worth about 9,000 kilocalories, so losing 5 kilograms
    needs a 45,000-kilocalorie deficit." Decide what to compute, compute it, and say what your
    answer does not establish.
  answer: |
    What to compute: the arithmetic as stated, and then which of the two things "a kilogram of
    fat" could mean in it.

    ```working
        9000 times 5 = 45000
    ```

    45,000 kilocalories, exactly the colleague's figure — if 9,000 is the right rate to use for
    the 5 kilograms in question.

    9,000 kilocalories a kilogram is FAO's figure for fat in food. It is not the figure for
    adipose tissue, which the static rule puts at about 7,700. Using the adipose figure instead:

    ```working
        7700 times 5 = 38500
    ```

    38,500, noticeably below 45,000.

    What this does not establish. It does not establish which of the two figures, or some other
    one entirely, is right for this patient's 5 kilograms, because that depends on whether the 5
    kilograms is being treated as pure triglyceride or as adipose tissue, and on how much of it is
    fat-free mass at all — a question this section does not answer and `S01-R1-C01` says a scale
    cannot answer either. It does not establish that 7,700 is a measured figure either: it carries
    the same unverified 87% assumption this section has flagged throughout.

    What to say to the colleague: name which kilogram, pure fat's or adipose tissue's, before
    quoting either number.
- level: 10
  prompt: |
    A slimming clinic's brochure says: "Body fat holds 7,700 kilocalories per kilogram, a figure
    confirmed by peer-reviewed research (Hall, 2008)." Decide what to compute, compute it, and
    say what your answer does not establish.
  refs:
  - hall_2008_ijo
  - fao_food_energy_2003
  answer: |
    What to compute: whether Hall (2008) reports 7,700 kcal/kg (about 32.2 MJ/kg) as a confirmed
    finding, or as something else, and whether the arithmetic behind it is a measurement.

    Check the figure against the paper's own words. Hall (2008) states the static rule "can be
    traced back to a calculation that assumes exclusive loss of adipose tissue consisting of 87%
    fat." Run that assumption through FAO's fat factor, and through Hall's.

    ```working
        0.87 times 37 = 32.19
        0.87 times 39.5 = 34.365
    ```

    32.19 megajoules a kilogram lands close to the paper's "32.2 MJ per kg" for the rule, about
    7,700 kilocalories a kilogram. That is partly luck: with Hall's 39.5 the same sum gives 34.4,
    and Hall does not say which figure for fat the original calculation used. The sum shows the
    size of the effect an 87% assumption has, not how the rule was built.

    The word "traced" is doing the opposite of the word "confirmed". Hall (2008) is explaining
    where an existing rule's number came from, an assumed 87%, and then goes on to warn that the
    change in body fat "is not equivalent to the loss adipose tissue, which includes a variable
    contribution of fluid and protein in addition to triglyceride." A paper that calls a
    composition variable, right after naming the fixed figure a rule assumes, is not confirming
    that figure.

    What this does not establish. It does not establish that 87% is wrong for any particular
    patient. Nor that the paper rejects the rule. Hall does compare the rule with weight-loss
    studies. The rule roughly fits people with obesity and more than 30 kg of body fat, and overstates
    the deficit for leaner people. And it does not tell you what a real, measured lipid fraction
    for adipose tissue would be, because no source this book cites reports one.

    What to say about the brochure: "confirmed" is wrong. The paper traces the number to an
    assumption and calls the real composition variable. "Roughly right for some patients, by
    comparison with data" is what the paper says.
retrieval_items:
- q: What does pure fat's own energy density come to, and how solid is that figure?
  a: About 9 kilocalories a gram (9,000 a kilogram). FAO's 37 megajoules a kilogram is for fat
    in food; Hall 2008's 39.5 is for fat stored in the body. Both are well established.
- q: Where does the ~7,700 kcal/kg (~32.2 MJ/kg) figure for adipose tissue come from, and what is
    the status of the 87% behind it?
  a: It is the static rule's own figure. Hall (2008) traces the rule to a calculation
    assuming 87% fat, without saying which figure for fat it used. 87% is an assumption, not a
    measurement, and Hall calls adipose tissue's fluid and protein contribution variable.
- q: 0.87 times 37 gives 32.19, close to the rule's 32.2 MJ/kg. Does that confirm the rule?
  a: No. The closeness is partly luck. With FAO's precise 37.4 the sum gives 32.5, and with Hall's
    39.5 it gives 34.4. It shows the size of an 87% assumption's effect, not how the rule was
    built.
