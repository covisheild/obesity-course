simplified_explanation: |
  Ask a simple question: how many kilocalories does a kilogram of body fat hold? There are two
  different honest answers, and mixing them up is the whole trap.

  The first answer is about pure fat, the triglyceride itself. It is about 9 kilocalories a gram,
  which is 9,000 a kilogram, or in the unit this record is built on, about 37 to 39.5 megajoules a
  kilogram.

  The second answer is about adipose tissue, the actual stuff that is gained or lost. It is not
  pure fat — `S01-R1-C01` already told you that. By how much depends on what fraction of it is
  fat, and here the honesty runs out: the only figure for that fraction in this subject's held
  sources is 87%, and it is not a measurement.

  Do the sum anyway, because it shows you where the famous 32.2-megajoules-a-kilogram, or roughly
  7,700-kilocalories-a-kilogram, figure comes from. Take the fraction, 0.87, and multiply by fat's
  own energy per gram.

  That is arithmetic on an assumption.
illustration:
  body: |
    Open BIPM's own table of SI prefixes, "The International System of Units (SI): Prefixes", at
    https://www.bipm.org/en/measurement-units/si-prefixes, and search the table for mega.

    > mega | M | 106

    Read the exponent as ten to the sixth, a million — the source's own extraction note says the
    superscript formatting is lost in the fetch. A megajoule is a million joules, a thousand
    kilojoules.

    Open FAO Food and Nutrition Paper 77, chapter 3, at https://www.fao.org/4/y5022e/y5022e04.htm,
    and search for the word Atwater.

    > The energy values are 17 kJ/g (4.0 kcal/g) for protein, 37 kJ/g (9.0 kcal/g) for fat and
    > 17 kJ/g (4.0 kcal/g) for carbohydrates.

    Fat: 37 kilojoules a gram. Scale that to a kilogram.

    ```working
        37 times 1000 = 37000
        37000 divided by 1000 = 37
    ```

    37 megajoules a kilogram (the two divisions and multiplications cancel; a kilojoule-per-gram
    figure is already a megajoule-per-kilogram figure, because both the numerator and the
    denominator scale by a thousand together).

    Open Hall, "What is the required energy deficit per unit weight loss?", *International
    Journal of Obesity* 2008, at https://pmc.ncbi.nlm.nih.gov/articles/PMC2376744/, and search for
    the word respectively.

    > the metabolizable energy densities of body glycogen, protein and fat are 17.6, 19.7, and
    > 39.5 MJ/kg, respectively

    39.5 megajoules a kilogram for fat, against FAO's 37.

    Now search the same paper for 87%.

    > The origin of this rule can be traced back to a calculation that assumes exclusive loss of
    > adipose tissue consisting of 87% fat

    It says a calculation assumes 87%. It does not say a measurement found 87%. Search on for the word
    variable.

    > the change of body fat,ΔF, is not equivalent to the loss adipose tissue, which includes a
    > variable contribution of fluid and protein in addition to triglyceride

    Run the assumed fraction through the arithmetic once, to see the classic rule's number
    appear.

    ```working
        0.87 times 37 = 32.19
    ```

    Search the same paper, near the start, for MJ per kg.

    > a cumulative energy deficit of 3500 kcal is required to lose 1 pound of body weight, or
    > equivalently 32.2 MJ per kg

    32.19 against 32.2. The small gap is rounding; the arithmetic reproduces the paper's own
    statement of the rule. In kilocalories a kilogram that is about 7,700 — the same figure
    `S01-R1-C07` reaches by converting 3,500 kcal a pound directly. Two routes, one assumption:
    the fraction 0.87 is what both calculations are built on, and neither route checks it against
    a measurement.

    ```table
    quantity                              value                 source
    pure fat, FAO Atwater factor          9.0 kcal/g, 37 MJ/kg  fao_food_energy_2003
    pure fat, Hall's physiological figure 39.5 MJ/kg            hall_2008_ijo
    adipose tissue, the rule's assumption 32.2 MJ/kg (≈7,700 kcal/kg)  hall_2008_ijo (rule, not a measurement)
    lean mass change                      7.6 MJ/kg             hall_2008_ijo
    ```
  analogy_breaks_when: |
    The third row is different in kind, not just in size. It is one assumption, 87% fat, carried
    through one piece of arithmetic; the paper that reports the assumption also says the true
    figure is variable.

    The near-exact match between 32.19 and Hall's own 32.2 MJ/kg, and between this record's route
    and `S01-R1-C07`'s pound-conversion route, is not two confirmations. It is the same 87%
    reappearing wherever the same rule is computed.

    The fourth row is named, not explained.
must_know:
- point: |
    Pure fat holds about 9 kilocalories, or 37 to 39.5 megajoules, for each kilogram.
  kind: number
  bearing: clinical
  refs:
  - fao_food_energy_2003
  - hall_2008_ijo
- point: |
    A kilogram of body fat lost or gained is not a kilogram of pure fat; it is adipose tissue, a
    mixture, and holds less energy per kilogram than pure fat does. Never quote 9 kilocalories or
    37-39.5 megajoules a kilogram for a kilogram of weight a patient has lost or gained.
  kind: misconception
  bearing: clinical
- point: |
    The figure of about 32 megajoules, or 7,700 kilocalories, for a kilogram of adipose tissue is
    the classic rule's own assumed number, built from an assumed 87% lipid fraction that no held
    source measures. Say "the rule assumes" when you use it, never "adipose tissue is".
  kind: trap
  bearing: methodological
- point: |
    Reaching the same ~7,700 or ~32.2 figure by two different pieces of arithmetic, as this record
    and `S01-R1-C07` both do, is not two independent confirmations of it.
  kind: trap
  bearing: methodological
- point: |
    Lean tissue's energy density, about 7.6 megajoules for a kilogram of lean mass change, is far
    lower than fat's.
  kind: boundary
  bearing: methodological
- point: |
    Because fat and lean tissue differ this much, and `S01-R1-C01` already showed a scale cannot
    tell you which compartment moved, no single kilocalories-per-kilogram figure is safe to apply
    to a patient's weight change without separately knowing, or reasonably assuming, what that
    change was made of.
  kind: consequence
  bearing: clinical
quantitative: true
practice:
- level: 1
  prompt: |
    A tissue's energy per gram is found by multiplying its lipid fraction by 9.0. Work out the
    result for a lipid fraction of 0.80, and separately for a lipid fraction of 0.60.
  answer: |
    Multiply each fraction by 9.0.

    ```working
        0.80 times 9.0 = 7.2
        0.60 times 9.0 = 5.4
    ```

    7.2 and 5.4.
- level: 2
  prompt: |
    Convert 34,000 kilojoules into megajoules. Then convert 2.5 megajoules into kilojoules.
  answer: |
    A megajoule is a thousand kilojoules, so kilojoules to megajoules means dividing by 1,000.

    ```working
        34000 divided by 1000 = 34
    ```

    34 megajoules.

    Megajoules to kilojoules means multiplying by 1,000.

    ```working
        2.5 times 1000 = 2500
    ```

    2,500 kilojoules.
- level: 3
  prompt: |
    Two energy densities are quoted for two different tissues: 39.5 and 7.6, in the same units.
    Work out how many times larger the first is than the second.
  answer: |
    Divide the larger by the smaller.

    ```working
        39.5 divided by 7.6 = 5.197368421
    ```

    Round once, at the end: about 5.2 times larger.
- level: 4
  prompt: |
    FAO Food and Nutrition Paper 77 gives the Atwater general factor for fat as 9.0 kilocalories
    a gram. Work out how many kilocalories that is for one kilogram of pure fat, then convert to
    megajoules using 1 kilocalorie = 0.004184 megajoules.
  answer: |
    Scale the gram figure to a kilogram first.

    ```working
        9.0 times 1000 = 9000
    ```

    9,000 kilocalories a kilogram. Convert to megajoules.

    ```working
        9000 times 0.004184 = 37.656
    ```

    37.656 megajoules a kilogram, matching the 37 megajoules a kilogram this record gets directly
    from the kilojoule figure.
  refs:
  - fao_food_energy_2003
  - nist_sp811
- level: 5
  prompt: |
    Hall (2008) gives the metabolizable energy density of body fat as 39.5 megajoules a kilogram.
    Convert this to kilocalories a kilogram, using 1 kilocalorie = 4.184 kilojoules.
  answer: |
    Put both figures in kilojoules first. 39.5 megajoules is 39,500 kilojoules.

    ```working
        39.5 times 1000 = 39500
    ```

    Divide by the size of one kilocalorie in kilojoules.

    ```working
        39500 divided by 4.184 = 9440.73
    ```

    About 9,440.7 kilocalories a kilogram, close to but not the same as FAO's 9,000: the two
    sources' figures for pure fat sit near each other, not on top of each other.
  refs:
  - hall_2008_ijo
  - nist_sp811
- level: 6
  prompt: |
    Hall (2008) traces the classic weight-loss rule to a calculation assuming adipose tissue is
    87% fat, using an energy-per-gram figure for fat of 37 kilojoules a gram (FAO's Atwater
    factor). Work out the adipose-tissue energy density in kilojoules a gram this assumption
    produces, and say how it compares with Hall's own statement of the rule as "32.2 MJ per kg".
  answer: |
    Multiply the assumed fraction by the energy per gram.

    ```working
        0.87 times 37 = 32.19
    ```

    32.19 kilojoules a gram, which is the same number in megajoules a kilogram: 32.19 MJ/kg.

    Hall's own figure for the same rule is 32.2 MJ per kg. The two agree to within rounding,
    because they are the same 87% assumption worked through the same conversion, not two separate
    measurements landing in the same place.
  refs:
  - hall_2008_ijo
  - fao_food_energy_2003
- level: 7
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
        pure fat holds 39.5 MJ/kg, Hall (2008)
        a patient's weight falls by 4 kg over a diet
        4 times 39.5 = 158
        so the deficit responsible for the loss was 158 MJ
    ```
  answer: |
    The step that broke is the third. 39.5 megajoules a kilogram is pure fat's own energy
    density, from `hall_2008_ijo`. The 4 kilograms the patient lost is not 4 kilograms of pure
    fat; it is a mix of adipose tissue and, `S01-R1-C01` already showed, quite possibly some
    fat-free mass as well, and even the fat-bearing part of that mix is diluted by whatever
    fraction of adipose tissue is not triglyceride.

    Using 39.5 on a figure that is not pure fat overstates the deficit. Even taking the rule's own
    assumed adipose figure, 32.2 MJ/kg, instead:

    ```working
        4 times 32.2 = 128.8
    ```

    128.8 megajoules, noticeably below 158 — and this second number still rests on an unverified
    87% assumption, so neither figure should be reported as if it were exact.

    Why the wrong answer looks reasonable. 39.5 is a real, correctly quoted figure from a held
    source, and the multiplication is arithmetically correct. What is missing is the check this
    whole record turns on: which kilogram, pure fat's or adipose tissue's, the 4 kilograms lost
    actually refers to.
- level: 8
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
        the classic rule's adipose figure is about 7,700 kcal/kg
        FAO's Atwater factor for fat is 9.0 kcal/g, or 9,000 kcal/kg
        7,700 is close to 9,000
        so the two figures confirm each other, and adipose tissue is essentially pure fat
    ```
  answer: |
    The step that broke is the last. Closeness between the two figures is not confirmation, and
    the direction of the gap says the opposite of the conclusion.

    7,700 is lower than 9,000 precisely because adipose tissue is assumed to be less than 100%
    fat — the rule's own 87% figure is what produces the gap.

    ```working
        9000 minus 7700 = 1300
    ```

    That 1,300 kilocalories a kilogram is the size of the dilution the rule assumes, not evidence
    that there is none. And 7,700 itself is not a second, independent figure to compare against
    9,000; it is 9,000's own Atwater fat value (rounded to 37 kJ/g) multiplied by the rule's
    assumed 0.87, so the two numbers were never going to be far apart by construction.

    Why the wrong answer looks reasonable. Both figures are real and correctly quoted, and
    "close, so consistent" is a reasonable-sounding move in other settings. Here it inverts the
    relationship: the two numbers are close because one was built out of the other times a
    fraction near 1, not because two separate measurements agree.
- level: 9
  prompt: |
    A colleague says: "A kilogram of fat is worth about 9,000 kilocalories, so losing 5 kilograms
    needs a 45,000-kilocalorie deficit." Decide what to compute, compute it, and say what your
    answer does not establish.
  answer: |
    What to compute: the arithmetic as stated, and then which of the two things "a kilogram of
    fat" could mean in it.

    ```working
        9000 times 5 = 45000
    ```

    45,000 kilocalories, exactly the colleague's figure — if 9,000 is the right rate to use for
    the 5 kilograms in question.

    9,000 kilocalories a kilogram is FAO's figure for pure fat. It is not the figure for adipose
    tissue, which this record's own working puts at about 7,700 for the same rule's assumption.
    Using the adipose figure instead:

    ```working
        7700 times 5 = 38500
    ```

    38,500, noticeably below 45,000.

    What this does not establish. It does not establish which of the two figures, or some other
    one entirely, is right for this patient's 5 kilograms, because that depends on whether the 5
    kilograms is being treated as pure triglyceride or as adipose tissue, and on how much of it is
    fat-free mass at all — a question this record does not answer and `S01-R1-C01` says a scale
    cannot answer either. It does not establish that 7,700 is a measured figure either: it carries
    the same unverified 87% assumption this record has flagged throughout.

    What to say to the colleague: name which kilogram, pure fat's or adipose tissue's, before
    quoting either number.
- level: 10
  prompt: |
    A slimming clinic's brochure says: "Body fat holds 7,700 kilocalories per kilogram, a figure
    confirmed by peer-reviewed research (Hall, 2008)." Decide what to compute, compute it, and
    say what your answer does not establish.
  answer: |
    What to compute: whether Hall (2008) reports 7,700 kcal/kg (about 32.2 MJ/kg) as a confirmed
    finding, or as something else, and whether the arithmetic behind it is a measurement.

    Reconstruct the figure from the paper's own words. Hall (2008) states the classic rule "can
    be traced back to a calculation that assumes exclusive loss of adipose tissue consisting of
    87% fat." Run that assumption through FAO's fat factor.

    ```working
        0.87 times 37 = 32.19
    ```

    32.19 megajoules a kilogram, matching the paper's own "32.2 MJ per kg" for the same rule, and
    equivalent to about 7,700 kilocalories a kilogram.

    The word "traced" is doing the opposite of the word "confirmed". Hall (2008) is explaining
    where an existing rule's number came from, an assumed 87%, and then goes on to warn that the
    change in body fat "is not equivalent to the loss adipose tissue, which includes a variable
    contribution of fluid and protein in addition to triglyceride." A paper that calls a
    composition variable, right after naming the fixed figure a rule assumes, is not confirming
    that figure.

    What this does not establish. It does not establish that 87% is wrong for any particular
    patient; nothing in this subject's held sources gives a better number to use instead. It does
    not establish that the paper is critical of the classic rule in every respect, only that it
    does not offer 87% as a measured fact. And it does not tell you what a real, measured lipid
    fraction for adipose tissue would be, because no source held here reports one.

    What to say about the brochure: the number is arithmetic on an assumption the cited paper
    itself calls variable, not a measurement the paper confirms. "Peer-reviewed" describes where
    the assumption was written down, not that it was checked.
retrieval_items:
- q: What does pure fat's own energy density come to, and how solid is that figure?
  a: About 9 kilocalories a gram, or 37 to 39.5 megajoules a kilogram, from two independent
    sources (FAO's Atwater factor and Hall 2008's own figure); this figure is well established.
- q: Where does the ~7,700 kcal/kg (~32.2 MJ/kg) figure for adipose tissue come from, and what is
    the status of the 87% behind it?
  a: It is the classic weight-loss rule's own assumed lipid fraction, 87% fat, multiplied by fat's
    own energy per gram. Hall (2008) reports 87% as what the rule's calculation assumes, not as
    something measured, and separately calls adipose tissue's fluid and protein contribution
    variable.
- q: This record and S01-R1-C07 both reach close to 7,700 kcal/kg by different routes. Does that
    make the figure more trustworthy?
  a: No. Both routes carry the same 87% assumption through different unit conversions (the pound
    conversion in C07, the lipid-fraction multiplication here), so the agreement is the same
    assumption reappearing, not two independent confirmations of it.
