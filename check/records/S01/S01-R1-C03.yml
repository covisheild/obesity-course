definition:
  text: |
    An adult's daily energy intake and daily energy expenditure are both, for most people,
    somewhere in the low thousands of kilocalories: from about 7 to about 16 megajoules.
    Three kinds of number carry that claim, and they are not the same kind of number.

    The first kind is a calculation of what a typical group would spend. The Food and
    Agriculture Organization (FAO), the World Health Organization (WHO) and the United Nations
    University (UNU) give worked examples in their 2004 report. Each multiplies a physical
    activity level (PAL), a multiplier for how active the group is, by a basal metabolic rate
    (BMR), the energy spent lying at rest after a fast. The product is total energy expenditure
    (TEE). The examples give 8.26 megajoules a day (1,975 kilocalories) for sedentary or lightly
    active 55 kg women, 9.86 megajoules (2,355 kilocalories) for active women, and 16.42
    megajoules (3,925 kilocalories) for vigorously active men. None of these is a measurement.
    The method that would measure what a group actually spent is doubly labelled water.

    The second kind is an adopted requirement: a number a body of experts has set, not measured
    in the person in front of you. India's Indian Council of Medical Research and National
    Institute of Nutrition (ICMR-NIN) set the adult energy requirement in 2020. It is 2,110
    kilocalories a day for a sedentary man and 1,660 for a sedentary woman. It rises to 3,470
    and 2,720 for heavy work. These are for a reference man of 65 kg and woman of 55 kg. They are
    calculated the same way, BMR times PAL.

    The third kind is a survey estimate of consumption. India's National Sample Survey (NSS)
    takes the food each household recorded as consumed and converts it to energy with a
    conversion table, a table giving the energy in a unit of each food. It puts the all-India
    average at 2,212 kilocalories a person a day in rural areas and 2,240 in urban areas for
    2023-24. The report warns that actual intake "depends on how these foods are processed
    and/or cooked". It calls its per consumer unit figures, which allow for age and sex, a
    sharper indicator of adequacy than the per person ones.
