  bearing: clinical
retrieval_items:
- q: Name three different kinds of number that can each be called "daily energy" and say what
    each one actually measures.
  a: A doubly labelled water measurement of what a group of free-living people actually spent
    over ten to fourteen days; a committee's adopted energy requirement, a recommendation set
    for a population as of a stated year; and a household survey's estimate of energy acquired,
    converted from recorded food purchases.
- q: What does India's National Sample Survey estimate, and what does it not measure?
  a: It estimates the energy a household's recorded food purchases convert to, per person per
    day, using a nutrient conversion table; all-India per capita figures for 2022-23 were about
    2,233 kcal/day rural and 2,250 urban. It does not measure what any individual actually ate
    or burned.
- q: Why does doubly labelled water exist, given that a person could just be asked what they
    ate?
  a: Self-reported intake is known to be unreliable, so a method that measures expenditure
    directly in a free-living person, without relying on their own account, is needed instead.
