simplified_explanation: |
  How much energy does one adult eat and burn in a day?

  The first question is what a typical group burns. Experts work it out: an activity multiplier
  times the energy spent at rest. For three example groups the answer came out between about 8
  and 16 megajoules a day, roughly 2,000 to 4,000 kilocalories. That is a calculation, not a
  measurement.

  The method that measures it is called doubly labelled water. A person drinks water carrying
  rare, stable forms of hydrogen and oxygen. How fast they leave the body over the next 10 to 14
  days gives the average energy spent.

  The second question is what a committee recommends somebody eat. This is a target, set by
  experts as of a particular year, not a measurement of any one person on any one day.

  The third question is what a household survey says people consume. India's National Sample
  Survey estimates that, on average, a person in the country gets a bit over 2,200 kilocalories
  a day. The figure is the food each household recorded as consumed, converted to energy with a
  conversion table.

  There is a fourth thing worth knowing before you trust any number a person tells you
  themselves. Ask somebody to report what they ate and the answer is known to be unreliable.

  So be careful when somebody says "an adult needs about 2,000 kilocalories a day." Keep the
  order of magnitude. Drop the idea that it is one fixed number.
illustration:
  body: |
    A clinic in an Indian town sees a sedentary adult man and a sedentary adult woman on the same
    morning.

    Open the ICMR-NIN Brief Note on Nutrient Requirements for Indians, 2020, at
    https://www.nin.res.in/rdabook/brief_note.pdf, and search for sedentary work.

    > Age group Category ICMR 2020 ICMR 2010 Difference
    > Kcal/d
    > Adult Men
    > Sedentary work 2110 2320 -210
    > [...]
    > Adult Women
    > Sedentary work 1660 1900 -240

    The number under ICMR 2020 is the committee's figure for a 65 kg man and a 55 kg woman doing
    sedentary work: 2,110 kilocalories a day for him, 1,660 for her.

    Now open the FAO/WHO/UNU 2004 report's chapter 5 at https://www.fao.org/4/y5686e/y5686e07.htm
    and search for sedentary or light activity.

    > If this PAL was from a female population, 30 to 50 years old, with mean weight of 55 kg
    > and mean BMR of 5.40 MJ/day (1 290 kcal/day), TEE = 1.53 × 5.40 = 8.26 MJ (1 975 kcal), or
    > 150 kJ (36 kcal)/kg/d.

    Both figures are for 55 kg women. ICMR-NIN's is lower for two reasons. The committee lowered
    the sedentary PAL from 1.53, the value in this example, to 1.40. And it set the BMR for
    Indians 5% below the FAO/WHO/UNU equations, then another 5% below that. Both are BMR times
    PAL. Neither is a measurement.

    Now open the NSS Report 594 highlight at
    https://www.mospi.gov.in/sites/default/files/publication_reports/Nutritional_Intake_in_India_L.pdf
    and search for the All-India row of Table 3.1.

    > 2022-23 2023-24 2022-23 2023-24
    > Rural Urban Rural Urban Rural Urban Rural Urban
    > [...]
    > All-India 2233 2250 2212 2240 2407 2488 2383 2472

    The first four columns are per person, the last four per consumer unit. The third figure,
    2,212 kilocalories a day, is rural, 2023-24: the food households recorded as consumed,
    converted to energy with a conversion table.

    Three numbers, all near 2,000 kilocalories. The first two are the same sum with different
    inputs: one a worked example, one a country's adopted figure. The third counts food. None
    of them measures the patient in front of you. Before you use any one of them, say out loud
    which kind it is.
  analogy_breaks_when: |
    Every figure quoted here belongs to a specific group, at a specific activity level, in a
    specific year.

    This section does not say how to reconcile the three kinds when they disagree. Nor does it
    say which one to trust for one patient.
must_know:
- point: |
    "An adult needs 2,000 kilocalories a day" treats three different kinds of number as one. A
    daily energy figure is a calculated or measured spend, a committee's requirement, or a
    survey's estimate of consumption. Say which before you repeat it.
  kind: misconception
  bearing: methodological
- point: |
    India's adopted adult energy requirement is set by activity level and sex, as of 2020. A
    woman's runs from roughly 1,660 to 2,720 kilocalories a day, sedentary to heavy work. A
    man's runs from 2,110 to 3,470. These are for a reference man of 65 kg and woman
    of 55 kg.
  kind: india_deviation
  bearing: clinical
  refs:
  - icmr_nin_2020_brief
- point: |
    A patient's own account of what they ate is known to be unreliable.
  kind: trap
  bearing: clinical
  refs:
  - polidori_2016
- point: |
    Do not use a population's figure as one patient's prescription: ICMR-NIN's own table says to
    adjust for actual weight and activity.
  kind: boundary
  bearing: clinical
  refs:
  - icmr_nin_2020_brief
retrieval_items:
- q: Name three different kinds of number that can each be called "daily energy" and say what
    each one is.
  a: A calculated spend, an activity multiplier times a resting rate, as in the FAO/WHO/UNU
    worked examples (doubly labelled water would measure it instead, over ten to fourteen
    days); a committee's adopted requirement, set for a reference person as of a stated year;
    and a household survey's estimate of consumption, the food households recorded as consumed,
    converted to energy with a conversion table.
- q: What does India's National Sample Survey estimate, and what does it not measure?
  a: It estimates the energy in the food households recorded as consumed, per person per day,
    converted with a conversion table; all-India per capita figures for 2023-24 were about
    2,212 kcal/day rural and 2,240 urban. It does not measure what any individual actually ate
    or burned, and actual intake depends on how the food is processed and cooked.
- q: Why does doubly labelled water exist, given that a person could just be asked what they
    ate?
  a: Self-reported intake is known to be unreliable. Doubly labelled water measures what was
    spent, without relying on the person's own account. When weight is steady, what was spent
    equals what was eaten, so it also checks a reported intake.
exercises:
- type: interpretation
  prompt: |
    Three sentences reach you in one week.

    (a) "An Indian woman needs 1,660 kilocalories a day."

    (b) "Urban Indians eat 2,240 kilocalories a day."

    (c) "A sedentary woman burns 1,975 kilocalories a day."

    For each, say which kind of number it is and one thing it does not tell you.
  answer: |
    (a) An adopted requirement: ICMR-NIN 2020, for a 55 kg reference woman doing sedentary
    work, calculated as BMR times PAL. It does not tell you what a particular woman needs. The
    committee's own table says to adjust for actual weight and activity, and the sentence has
    dropped "sedentary" as well.

    (b) A survey estimate of consumption: NSS Report 594, all-India urban, per person, 2023-24.
    It is the food households recorded as consumed, converted to energy with a conversion
    table. It does not tell you what any one person ate, and the report says actual intake
    depends on how the food is processed and cooked. It is also per person, not per consumer
    unit, so it does not allow for age and sex.

    (c) A calculated spend: the FAO/WHO/UNU worked example. It multiplies a PAL of 1.53 by a
    BMR of 5.40 megajoules, for a hypothetical group of 55 kg women aged 30 to 50. It is not a
    measurement, and it is a group's average, not one woman's day. Measuring it would take
    doubly labelled water.
