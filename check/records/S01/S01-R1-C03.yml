definition:
  text: |
    An adult's daily energy intake and daily energy expenditure are both, for most people,
    somewhere in the low thousands of kilocalories, a few megajoules to about ten of them.
    Three kinds of number carry that claim, and they are not the same kind of number.

    The first kind is a measurement of what a group of people actually spent. Worked examples
    given for three populations put total energy expenditure at 8.26 megajoules a day (1,975
    kilocalories) for a sedentary or lightly active group of women, 9.86 megajoules (2,355
    kilocalories) for an active group, and 16.42 megajoules (3,925 kilocalories) for a
    vigorously active group of men.

    The second kind is an adopted requirement: a number a body of experts has set, not measured
    in the person in front of you. India's Indian Council of Medical Research and National
    Institute of Nutrition set the adult energy requirement, as of 2020, at 2,110 kilocalories a
    day for a sedentary man and 1,660 for a sedentary woman, rising to 3,470 and 2,720 for heavy
    work.

    The third kind is a survey estimate of what households acquired, converted to energy through
    a nutrient conversion table. India's National Sample Survey puts the all-India average
    acquisition at 2,233 kilocalories a person a day in rural areas and 2,250 in urban areas for
    2022-23.
