name: Sizing an imbalance, and the static rule

concept_type: derivable

clusters: [measurement-inference, body-and-person]
ground_floor_deps: [B0-R0-C05, B0-R0-C06, B0-R0-C08, B0-R0-C10, B0-R0-C20]
