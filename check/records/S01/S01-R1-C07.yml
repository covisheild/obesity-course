must_know:
  - point: |
      Convert the unit before you argue about the number.
    kind: move
    bearing: methodological
  - point: |
      A rule that holds a daily amount fixed and multiplies it by time always draws a
      straight line, whatever the real quantity does.
    kind: trap
    bearing: methodological
  - point: |
      The static rule's assumption that expenditure stays put is closest to true in the first
      days. Its assumption that the loss is fat is furthest from true then. Trust it for
      neither the first week nor the long run.
    kind: boundary
    bearing: clinical
  - point: |
      When you tell a patient a target using this rule, say that it over-predicts from the
      first weeks.
    kind: consequence
    bearing: clinical
  - point: |
      At the rule's 7,716 kcal, a kilogram of fat is two to four whole days of a person's
      total expenditure. That uses `S01-R1-C03`'s 8 to 16 megajoules a day.
    kind: number
    bearing: public
    refs: [thomas_2013_3500kcal]
  - point: |
      A figure like 3,500 kcal per pound being widely printed, including in textbooks, does not
      make it a measured property of fat.
    kind: misconception
    bearing: teaching
    refs: [openstax_anatphys_2e]

exercises:
  - type: calculation
    prompt: |
      A person keeps to a deficit of 600 kcal a day for 40 days. Using the static rule,
      work out the predicted loss in kilograms.
    answer: |
      Total the deficit, then divide by the per-kilogram rate.

      ```working
          600 times 40 = 24000
          24000 divided by 7716.18 = 3.11
      ```

      About 3.1 kilograms predicted, on the static rule's own terms.
    skill_ref: S01-R1-K02
  - type: teaching
    prompt: |
      A health secretary has one page and wants an answer first. They have asked: "Is the
      3,500-calorie rule good enough to put in a public information leaflet?"
    answer: |
      Answer first: not as a bare rule. If it goes in at all, it needs a warning that it
      promises too much.

      Why. The rule is simple arithmetic, and it is printed widely, including in nutrition
      textbooks. Even over the first two months it over-predicts: dieters whose intake was checked lost about
      three-quarters of what it promised. Past the first year it is further off. The rule
      assumes intake and expenditure never change. A published model built on energy balance
      predicts a loss that slows and levels off. In that model's worked example, the rule's
      first-year number is about double the model's.

      What to print instead of the bare rule. Real loss falls short of the rule from the
      start. It slows over time. A smaller body needs less to maintain itself.
      Quote no week-fifty-two number from this rule at all.
    skill_ref: S01-R1-K02

quantitative: true
practice:
  - level: 1
    prompt: |
      A rule says 3,500 kcal removes one pound. One pound is 0.45359237 kilogram. How many
      kcal per kilogram is that?
    answer: |
      Divide the kilocalories by the kilograms.

      ```working
          3500 divided by 0.45359237 = 7716.18
      ```

      7,716.18 kcal per kilogram, to two decimal places.
  - level: 2
    prompt: |
      Using a rate of 3,500 for one unit, work out the total for 5 units, and separately for
      12 units.
    answer: |
      Multiply the rate by the count each time.

      ```working
          3500 times 5 = 17500
          3500 times 12 = 42000
      ```

      17,500 and 42,000.
  - level: 4
    prompt: |
      Thomas and colleagues' pooled dieters were prescribed an average deficit of 1,439 kcal a
      day. They were on the diet for an average of 64.8 days. Use the static rule's 3,500 kcal
      a pound to work out the predicted loss in pounds. Then convert it to kilograms. One pound
      is exactly 0.45359237 kg.
    answer: |
      Total the deficit over the days, then divide by 3,500.

      ```working
          1439 times 64.8 = 93247.2
          93247.2 divided by 3500 = 26.64
      ```

      26.64 pounds predicted. Convert to kilograms by multiplying by the exact factor.

      ```working
          26.64 times 0.45359237 = 12.08
      ```

      About 12.08 kilograms.
    refs: [thomas_2013_3500kcal]
  - level: 5
    prompt: |
      Hall and colleagues model a 100 kg sedentary man. He cuts his intake by 2 megajoules a
      day and holds that cut for a year. One kilocalorie is 0.004184 megajoules. Use that to
      turn the daily cut into kilocalories. Then run the static rule forward for 365 days at
      7,716.18 kcal per kilogram. Compare your figure with the paper's static-rule prediction
      of "22 kg lost in the first year".
    answer: |
      Divide the megajoules by the size of one kilocalorie in megajoules.

      ```working
          2 divided by 0.004184 = 478.01
      ```

      About 478.01 kcal a day. Total it over the year and divide by the per-kilogram rate.

      ```working
          478.01 times 365 = 174473.65
          174473.65 divided by 7716.18 = 22.61
      ```

      About 22.6 kilograms, against the paper's 22 kilograms. The two are close. The small gap
      is rounding, in the conversion and in the paper's own figures. So this arithmetic
      reproduces the paper's static-rule prediction. It is not the figure the paper's dynamic
      model gives.
    refs: [hall_2011_lancet]
  - level: 7
    prompt: |
      A textbook states: "The accumulation of an extra 3500 calories adds one pound of
      weight. If an excess of 200 calories per day is ingested, one extra pound of body
      weight will be gained every 18 days. At that rate, an extra 20 pounds can be gained
      over the course of a year." A student extends the reasoning. "So anyone eating 200
      calories over their needs, every day, for the rest of their life, will gain 20 pounds
      a year, every year, forever." Find the step that broke.
    answer: |
      The textbook's own arithmetic is not the broken step; check it first.

      ```working
          3500 divided by 200 = 17.5
          365 divided by 17.5 = 20.86
      ```

      About 21 pounds a year on 200 extra kilocalories a day, matching the textbook's
      rounded "20 pounds" closely enough. The arithmetic holds.

      The first break is the textbook's own step to a whole year. The body starts to respond
      well inside a year. "Forever" repeats the same mistake. The rule was run forward on a fixed daily
      surplus. It never asked whether a heavier body needs more each day. A heavier body
      spends more at rest and more to move itself. So the same 200-calorie habit gives a
      shrinking surplus as the weight comes on.

      Why the wrong answer looks reasonable. The arithmetic for one year is correct, and
      repeating a correct calculation feels safe. What breaks is an assumption carried
      silently past the point where it stops holding.
    refs: [openstax_anatphys_2e]
  - level: 8
    prompt: |
      Here is a worked answer. Find the step that broke.

      ```working
          a clinic wants a target for 8 kilograms of fat loss
          the static rule gives 3,500 for a unit of weight change
          8 times 3500 = 28,000
          so the patient needs a total deficit of 28,000 kcal
      ```
    answer: |
      The step that broke is the second-to-last one. It is a unit swap, not a wrong
      multiplication. The static rule's 3,500 is a rate for one pound, not one kilogram.
      Multiplying kilograms by the pound rate treats a kilogram as a pound. That understates
      the deficit by a factor of about 2.2, since one kilogram is about 2.2 pounds.

      The correct version uses the rate per kilogram.

      ```working
          8 times 7716.18 = 61729.44
      ```

      About 61,730 kcal, not 28,000: more than double the wrong figure.

      Why the wrong answer looks reasonable. 8 times 3,500 is correct multiplication, and
      28,000 looks like a plausible target. Nothing in the arithmetic signals an error. The
      mistake is which rate got attached to which unit. Problem 1 trains exactly that
      check.
  - level: 9
    prompt: |
      A slimming programme's leaflet says: "Cut 500 calories a day and you will lose about a
      pound a week — in six months, that is 26 pounds off." Decide what to compute, compute
      it, and say what your answer does not establish.
    answer: |
      What to compute: whether the leaflet's numbers fit the static rule it quietly uses.
      Then, over what interval that rule is being trusted.

      Check the weekly figure first.

      ```working
          500 times 7 = 3500
          3500 divided by 3500 = 1
      ```

      One pound a week is exactly what 500 kcal a day gives under the static rule; that part
      is arithmetically sound. Now the six-month figure.

      ```working
          1 times 26 = 26
      ```

      Six months is about 26 weeks, so 26 pounds is what a straight line through the weekly
      figure gives. The leaflet's arithmetic is internally consistent.

      What this does not establish. It does not show that a person on the diet for six
      months actually loses 26 pounds. The static rule assumes the same 500-kcal deficit keeps
      giving the same weekly loss. The data in this section's illustration show that failing
      within about nine weeks.

      It does not show that 500 kcal a day can be kept up for 26
      weeks. That is a question about behaviour, which this arithmetic cannot touch. And it
      says nothing about whether the pounds lost are fat. The rule fixes a rate per pound
      without asking what the pound is made of.
  - level: 10
    prompt: |
      A dietitian tells a patient: "Keep to 500 kcal under your target and you'll reliably
      lose a pound a week — do the maths yourself if you don't believe me." Decide what to
      compute, compute it, and say what your answer does not establish.
    answer: |
      What to compute: how the promised rate compares with a real cohort on a bigger
      deficit. That is the closest real check among the sources this book cites.

      The patient's promised deficit, in the same terms Thomas and colleagues report.

      ```working
          500 times 7 = 3500
      ```

      3,500 kcal a week, or exactly one pound a week by the static rule, before the body
      responds. Thomas and colleagues' dieters were prescribed a bigger deficit: 1,439 kcal a
      day. In a week, that is:

      ```working
          1439 times 7 = 10073
      ```

      Their intake was supervised or measured. Their loss still fell short of the rule's
      prediction for their own deficit. On average they lost 7.4 pounds less than the
      predicted 27.6.

      What this does not establish. It does not show that this patient will do better,
      relative to prediction, than that cohort. The patient has a smaller deficit and less
      control over intake. Nor does it give a number for how far this patient will fall
      short. It shows only that "reliably" is not a word the static rule has earned.
    refs: [thomas_2013_3500kcal]

retrieval_items:
  - q: What is the static rule's rate in kcal per kilogram, and how is it obtained from the
      pound figure?
    a: About 7,716 kcal per kilogram, obtained by dividing 3,500 kcal per pound by the exact
      pound-to-kilogram factor, 0.45359237.
  - q: Why does the static rule always predict a straight line against time?
    a: Because it holds the daily surplus or deficit fixed and multiplies by the number of
      days, so the predicted rate of change of mass never changes.
  - q: In Hall and colleagues' worked example, how did the static rule's one-year prediction
      compare with their dynamic model's prediction for the same 100 kg man?
    a: The static rule predicted about 22 kg lost in the first year; the dynamic model
      predicted roughly half that, and was 95% of the way to its plateau near 75 kg only
      after about three years.

