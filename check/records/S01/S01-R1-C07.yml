  - file: s01-r1-c07-thomas-shortfall.png
    caption: "Thomas's cohort: 1,439 kcal a day for 64.8 days gives 26.64 lb on the static rule. Measured loss was 20.1 lb, 7.4 lb less than the paper's own 27.6 lb prediction."
    alt: "Pounds lost against days on the diet. A dashed line rises from 0 to 26.64 lb at day 64.8. A single measured point at day 64.8 sits at 20.1 lb, below the line."
    source: draw.py
    spec:
      kind: scatter
      x_label: days on the diet
      y_label: weight lost (lb)
      x: [0, 64.8]
      series:
        - name: measured, as the paper reports it
          y: [0, 20.1]
        - name: "static rule, 1,439 kcal a day / 3,500 kcal a pound"
          y: [0, 26.64]
      relations:
        - fit: "y = 1439*x/3500"
          series: "static rule, 1,439 kcal a day / 3,500 kcal a pound"
          draw: true
          label: "static rule: 1,439 x days / 3,500"
      labels:
        - {text: "measured 20.1 lb:\n6.5 below this line,\n7.4 below the paper's own 27.6", at: [64.8, 20.1], offset: [-125, -62]}
      y_range: [0, 30]
      derived:
        - {value: "0", from: "1439 - 1439"}
        - {value: "6.5", from: "26.64 - 20.1"}
