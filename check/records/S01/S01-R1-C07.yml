must_know:
  - point: |
      Convert the unit before you argue about the number.
    kind: move
    bearing: methodological
  - point: |
      A rule that holds a daily amount fixed and multiplies it by time always draws a
      straight line, whatever the real quantity does.
    kind: trap
    bearing: methodological
  - point: |
      The straight line from the static rule is not wrong on day one.
    kind: boundary
    bearing: clinical
  - point: |
      When you tell a patient a target using this rule, say over what interval it holds.
    kind: consequence
    bearing: clinical
  - point: |
      A kilogram of fat is several days of a person's total daily expenditure, not a few
      hours of it.
    kind: number
    bearing: public
    refs: [thomas_2013_3500kcal]
  - point: |
      A figure like 3,500 kcal per pound being widely printed, including in textbooks, does not
      make it a measured property of fat.
    kind: misconception
    bearing: teaching
    refs: [openstax_anatphys_2e]

exercises:
  - type: calculation
    prompt: |
      A person keeps to a deficit of 600 kcal a day for 40 days. Using the static rule,
      work out the predicted loss in kilograms.
    answer: |
      Total the deficit, then divide by the per-kilogram rate.

      ```working
          600 times 40 = 24000
          24000 divided by 7716.18 = 3.11
      ```

      About 3.1 kilograms predicted, on the static rule's own terms.
    skill_ref: S01-R1-K02
  - type: teaching
    prompt: |
      A health secretary has one page and wants an answer first. They have asked: "Is the
      3,500-calorie rule good enough to put in a public information leaflet?"
    answer: |
      Answer first: only with a stated time limit attached, and it should not go in without
      one.

      Why. The rule is correct arithmetic and it is a well-known one, cited in tens of
      thousands of weight-loss materials and in nutrition textbooks. Over the first several
      weeks of a diet it gives a usable, roughly correct estimate; published data from
      supervised diets land within a plausible range of what it predicts. Past the first
      year it does not, because the rule assumes intake and expenditure never change, and a
      published model built from the same physics predicts a slowing, plateauing loss
      instead of the rule's straight line — about half the rule's number by the end of the
      first year, in the published worked example.

      What to print instead of the bare rule: a range for the first few months, with a
      sentence saying the rate slows after that and a smaller body needs less to maintain
      itself. No specific week-fifty-two number should be quoted from this rule at all.
    skill_ref: S01-R1-K02

quantitative: true
practice:
  - level: 1
    prompt: |
      A rule states that 3,500 removes one unit of weight for every 0.45359237 of a
      different unit that measures the same thing. Work out the rate per whole unit of the
      second measure.
    answer: |
      Divide the first number by the second.

      ```working
          3500 divided by 0.45359237 = 7716.18
      ```

      7,716.18, to two decimal places.
  - level: 2
    prompt: |
      Using a rate of 3,500 for one unit, work out the total for 5 units, and separately for
      12 units.
    answer: |
      Multiply the rate by the count each time.

      ```working
          3500 times 5 = 17500
          3500 times 12 = 42000
      ```

      17,500 and 42,000.
  - level: 4
    prompt: |
      Thomas and colleagues' pooled dieters were prescribed a target intake giving them an
      average deficit of 1,439 kcal a day, over an average of 64.8 days on the diet. Using
      the static rule's rate of 3,500 kcal a pound, work out the predicted loss in pounds,
      then convert it to kilograms using the exact factor 1 pound equals 0.45359237 kg.
    answer: |
      Total the deficit over the days, then divide by 3,500.

      ```working
          1439 times 64.8 = 93247.2
          93247.2 divided by 3500 = 26.64
      ```

      26.64 pounds predicted. Convert to kilograms by multiplying by the exact factor.

      ```working
          26.64 times 0.45359237 = 12.08
      ```

      About 12.08 kilograms.
    refs: [thomas_2013_3500kcal]
  - level: 5
    prompt: |
      Hall and colleagues model a 100 kg sedentary man cutting his intake by 2 megajoules a
      day and holding that cut for a year. Using the thermochemical kilocalorie, 1 kcal
      equals 0.004184 megajoules, convert the daily cut to kilocalories. Then run the static
      rule forward for 365 days using 7,716.18 kcal per kilogram, and compare your figure
      with the paper's own reported prediction for the static rule of "22 kg lost in the
      first year".
    answer: |
      Convert the megajoules to kilocalories by dividing by the size of one kilocalorie in
      megajoules.

      ```working
          2 divided by 0.004184 = 478.01
      ```

      About 478.01 kcal a day. Total it over the year and divide by the per-kilogram rate.

      ```working
          478.01 times 365 = 174473.65
          174473.65 divided by 7716.18 = 22.61
      ```

      About 22.6 kilograms, against the paper's reported 22 kilograms. The two figures are
      close; the small gap is rounding in the conversion and in the paper's own numbers, and
      it confirms this arithmetic is reproducing the same static-rule prediction the paper
      describes, not the different figure its dynamic model gives for the same scenario.
    refs: [hall_2011_lancet]
  - level: 7
    prompt: |
      A textbook states: "The accumulation of an extra 3500 calories adds one pound of
      weight. If an excess of 200 calories per day is ingested, one extra pound of body
      weight will be gained every 18 days. At that rate, an extra 20 pounds can be gained
      over the course of a year." A student extends the reasoning: "So anyone eating 200
      calories over their needs, every day, for the rest of their life, will gain 20 pounds
      a year, every year, forever." Find the step that broke.
    answer: |
      The textbook's own arithmetic is not the broken step; check it first.

      ```working
          3500 divided by 200 = 17.5
          365 divided by 17.5 = 20.86
      ```

      About 21 pounds a year on 200 extra kilocalories a day, matching the textbook's
      rounded "20 pounds" closely enough. That part holds.

      The break is the student's word "forever". The static rule was run forward for one
      year using a fixed daily surplus. Nothing in that calculation licenses running it
      forward for a second year, a tenth year, or a fiftieth, because the calculation never
      asked whether a body that is now 20 pounds heavier still needs the same daily amount
      to stay in the same surplus. A heavier body spends more at rest and more to move
      itself, so the same 200-calorie habit produces a shrinking surplus as the weight comes
      on, not the same 200 every year. The straight line is only ever a statement about the
      interval it was computed over.

      Why the wrong answer looks reasonable. The arithmetic for one year is genuinely
      correct, and repeating a correct calculation feels like a safe way to extend it. What
      breaks is an assumption carried silently past the point where it stops holding.
    refs: [openstax_anatphys_2e]
  - level: 8
    prompt: |
      Here is a worked answer. Find the step that broke.

      ```working
          a clinic wants a target for 8 kilograms of fat loss
          the static rule gives 3,500 for a unit of weight change
          8 times 3500 = 28,000
          so the patient needs a total deficit of 28,000 kcal
      ```
    answer: |
      The step that broke is the second-to-last one, and it is a unit swap rather than a
      wrong multiplication. The static rule's 3,500 figure is a rate for one pound, not one
      kilogram. Multiplying a count of kilograms by the pound rate treats a kilogram as if
      it were a pound, understating the true deficit needed by a factor of about 2.2, since
      one kilogram is about 2.2 pounds.

      The correct version converts first.

      ```working
          8 divided by 0.45359237 = 17.64
          17.64 times 3500 = 61,740
      ```

      About 61,740 kcal, not 28,000: more than double the wrong figure.

      Why the wrong answer looks reasonable. The arithmetic 8 times 3,500 is correct
      multiplication and the number it produces is plausible-looking for a clinical target.
      Nothing in the arithmetic itself signals an error; the mistake is entirely in which
      rate got attached to which unit, which is exactly the check the level 1 problem in
      this set trains.
  - level: 9
    prompt: |
      A slimming programme's leaflet says: "Cut 500 calories a day and you will lose about a
      pound a week — in six months, that is 26 pounds off." Decide what to compute, compute
      it, and say what your answer does not establish.
    answer: |
      What to compute: whether the leaflet's own numbers are consistent with the static rule
      it is implicitly using, and over what interval that rule is being trusted.

      Check the weekly figure first.

      ```working
          500 times 7 = 3500
          3500 divided by 3500 = 1
      ```

      One pound a week is exactly what 500 kcal a day gives under the static rule; that part
      is arithmetically sound. Now the six-month figure.

      ```working
          1 times 26 = 26
      ```

      Six months is about 26 weeks, so 26 pounds is what a straight line through the weekly
      figure gives. The leaflet's arithmetic is internally consistent.

      What this does not establish. It does not establish that a person following the diet
      for six months actually loses 26 pounds, because the static rule assumes the same
      500-kcal deficit keeps producing the same weekly loss the whole time, and the
      real-world data in this section's illustration show that assumption failing well
      inside a year. It does not establish that 500 kcal a day is achievable or sustained for
      26 weeks, which is a behavioural question this arithmetic cannot touch. And it says
      nothing about whether the pounds lost are fat, since the rule fixes a kilocalorie rate
      per pound without asking what the pound is made of.
  - level: 10
    prompt: |
      A dietitian tells a patient: "Keep to 500 kcal under your target and you'll reliably
      lose a pound a week — do the maths yourself if you don't believe me." Decide what to
      compute, compute it, and say what your answer does not establish.
    answer: |
      What to compute: how the dietitian's promised rate compares with what was actually
      achieved in a real supervised cohort managing an even larger average deficit, since
      that is the closest real check available among this subject's held sources.

      The patient's promised deficit, in the same terms Thomas and colleagues report.

      ```working
          500 times 7 = 3500
      ```

      3,500 kcal a week, or exactly one pound a week by the static rule, before anything
      about the body responds.

      Thomas and colleagues' cohort managed a larger deficit than this, 1,439 kcal a day, or
      10,073 kcal a week, under total dietary supervision, and their observed loss still fell
      short of what the static rule predicted for their own deficit, by 7.4 pounds on
      average out of a predicted 27.6.

      What this does not establish. It does not establish that this particular patient, on a
      smaller deficit and without total supervision, will do any better relative to
      prediction than a cohort that was more tightly controlled and still undershot. It does
      not establish a number for how much this patient will fall short, only that "reliably"
      is not a word the static rule, on its own, is entitled to.
    refs: [thomas_2013_3500kcal]

retrieval_items:
  - q: What is the static rule's rate in kcal per kilogram, and how is it obtained from the
      pound figure?
    a: About 7,716 kcal per kilogram, obtained by dividing 3,500 kcal per pound by the exact
      pound-to-kilogram factor, 0.45359237.
  - q: Why does the static rule always predict a straight line against time?
    a: Because it holds the daily surplus or deficit fixed and multiplies by the number of
      days, so the predicted rate of change of mass never changes.
  - q: In Hall and colleagues' worked example, how did the static rule's one-year prediction
      compare with their dynamic model's prediction for the same 100 kg man?
    a: The static rule predicted about 22 kg lost in the first year; the dynamic model
      predicted roughly half that by the same point, plateauing at about 75 kg only after
      several years.

