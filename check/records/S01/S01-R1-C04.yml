simplified_explanation: |
  Every day, a body spends energy on three different kinds of work, and it does not spend the
  same amount on each.

  Most of it goes on staying alive, doing nothing else. That is resting expenditure, and it is
  the biggest of the three by a wide margin. It is bigger in a bigger body, because more tissue
  means more of that background work. A person with more fat-free mass spends more at rest,
  whether or not they move at all that day.

  A smaller share goes on the meal itself. Protein takes more effort to process than
  carbohydrate, and carbohydrate takes more than fat. This is the smallest of the three shares.

  The rest goes on movement: everything from a deliberate workout to walking to the bus. Carry
  more weight through the same walk and it costs more.

  A bigger body spends more, mostly because resting expenditure and movement both scale with
  size.

  None of this tells you a formula.
illustration:
  body: |
    Two patients come to the same clinic on the same day, both adults, both sedentary. One
    weighs 55 kilograms. The other weighs 95 kilograms, of which a larger fat-free mass is part.

    Ask which of them has the higher daily energy expenditure, before checking anything.

    Open the review, Hall and Guo 2017, at https://pmc.ncbi.nlm.nih.gov/articles/PMC5568065/,
    and search for linearly related.

    > Across a wide range of weights, REE is linearly related to both fat-free mass and body
    > fat, such that the elevated REE with obesity is generally in line with what is expected
    > for the body weight and composition.

    The heavier patient's resting expenditure, the largest of the three components, is expected
    to be higher, because a heavier body generally carries more fat-free mass, and fat-free mass
    is what resting expenditure tracks.

    Now search the same page for proportion to overall body weight.

    > The energy expended in physical activities is determined by their duration and intensity
    > in proportion to overall body weight.

    Now imagine the heavier patient loses ten kilograms over the following year, some of it
    fat-free mass along with the fat. Search the same page for declines with weight loss.

    > physical activity energy expenditure declines with weight loss unless its quantity or
    > intensity increases to compensate.

    A smaller body doing the same daily activities spends less doing them. That is not a failure
    of anything.
  analogy_breaks_when: |
    "Bigger body, more expenditure" holds for resting expenditure and physical activity
    expenditure, which this record has sourced. It is not established here for the thermic
    effect of food, which this record ties to what was eaten, not to body size.

    The pattern describes what is generally expected for a given body weight and composition.
must_know:
- point: |
    Daily expenditure is not one thing. It is resting expenditure, the largest share; the
    thermic effect of food, the smallest; and physical activity expenditure.
  kind: misconception
  bearing: clinical
- point: |
    Resting expenditure rises with fat-free mass, and a person carrying more body fat generally
    carries more fat-free mass too. So do not assume a person with obesity has a slow
    metabolism; the sourced pattern is the opposite; their resting expenditure is generally
    higher in absolute terms than a leaner person's, in line with their larger body.
  kind: misconception
  bearing: clinical
  refs:
  - hall_guo_2017
- point: |
    Both resting expenditure and physical activity expenditure scale with body size. So a
    maintenance requirement worked out for a person at one weight does not hold once their
    weight, and the fat-free mass carried with it, has changed. Expect the number that once held
    their weight steady to fall as their weight falls.
  kind: consequence
  bearing: clinical
  refs:
  - hall_guo_2017
- point: |
    This record names the three components and says each depends on body size. Do not use it to
    compute a patient's requirement; use it to say what a computed requirement would have to
    account for.
  kind: boundary
  bearing: methodological
retrieval_items:
- q: Name the three components of daily energy expenditure, in order of size, largest first.
  a: Resting energy expenditure, largest; physical activity expenditure; and the thermic effect
    of food, smallest.
- q: Why does a person with obesity generally have a higher absolute resting energy expenditure,
    not a lower one?
  a: Resting expenditure is linearly related to fat-free mass and body fat, and a person with
    obesity generally carries more fat-free mass alongside more body fat, not less. The elevated
    resting expenditure is in line with the larger body weight and composition.
- q: What happens to physical activity expenditure when a person loses weight, and why?
  a: It declines, unless the activity's quantity or intensity is increased to compensate,
    because the energy cost of a given movement is set in proportion to overall body weight.
