simplified_explanation: |
  Every day, a body spends energy on three different kinds of work, and it does not spend the
  same amount on each.

  Much of it goes on staying alive, doing nothing else. That is resting expenditure, and it is
  usually the biggest of the three. It is bigger in a bigger body, because more tissue
  means more of that background work. A person with more fat-free mass spends more at rest,
  whether or not they move at all that day.

  A smaller share goes on the meal itself. Protein takes more effort to process than
  carbohydrate, and carbohydrate takes more than fat. This is the smallest of the three shares.

  The rest goes on movement: everything from a deliberate workout to walking to the bus. Carry
  more weight through the same walk and it costs more.

  A bigger body spends more, mostly because resting expenditure and movement both scale with
  size.
illustration:
  body: |
    Two patients come to the same clinic on the same day, both adults, both sedentary. One
    weighs 55 kilograms. The other weighs 95 kilograms and carries more fat-free mass than the
    first.

    Ask which of them has the higher daily energy expenditure, before checking anything.

    Open the review, Hall and Guo 2017, at https://pmc.ncbi.nlm.nih.gov/articles/PMC5568065/,
    and search for linearly related.

    > Across a wide range of weights, REE is linearly related to both fat-free mass and body
    > fat, such that the elevated REE with obesity is generally in line with what is expected
    > for the body weight and composition.

    So the heavier patient's resting expenditure is expected to be higher. Fat-free mass counts
    for more of resting expenditure than body fat does, though both add to it.

    Now search the same page for proportion to overall body weight.

    > The energy expended in physical activities is determined by their duration and intensity
    > in proportion to overall body weight.

    Now imagine the heavier patient loses ten kilograms over the following year, some of it
    fat-free mass along with the fat. Search the same page for declines with weight loss.

    > physical activity energy expenditure declines with weight loss unless its quantity or
    > intensity increases to compensate.

    A smaller body doing the same daily activities spends less doing them. That is not a failure
    of anything.
  analogy_breaks_when: |
    "Bigger body, more expenditure" holds for resting and activity expenditure. It does not hold
    for the thermic effect of food, which follows what was eaten.

    The pattern describes what is generally expected for a given body weight and composition.
must_know:
- point: |
    Daily expenditure is not one thing. It is resting expenditure, usually the largest share; the
    thermic effect of food, the smallest; and physical activity expenditure.
  kind: misconception
  bearing: clinical
- point: |
    Resting expenditure rises with both fat-free mass and body fat. A person with more body fat
    generally has more fat-free mass too. So do not assume a person with obesity has a slow
    metabolism. The source reports the opposite. Their resting expenditure is generally higher in
    total than a leaner person's, in line with their larger body.
  kind: misconception
  bearing: clinical
  refs:
  - hall_guo_2017
- point: |
    Both resting expenditure and physical activity expenditure scale with body size. The energy
    it takes to keep a person at a steady weight is their maintenance requirement. It is set by
    that weight. So it does not hold once their weight has changed, and their fat-free mass with
    it. Expect it to fall as their weight falls.
  kind: consequence
  bearing: clinical
  refs:
  - hall_guo_2017
- point: |
    Knowing the three components does not give you a patient's requirement. Use them to check
    what any computed requirement has left out.
  kind: boundary
  bearing: methodological
retrieval_items:
- q: Name the three components of daily energy expenditure, in order of size, largest first.
  a: Resting energy expenditure, usually the largest; physical activity expenditure; and the thermic effect
    of food, smallest.
- q: Why does a person with obesity generally have a higher absolute resting energy expenditure,
    not a lower one?
  a: Resting expenditure is linearly related to fat-free mass and body fat, and a person with
    obesity generally carries more fat-free mass alongside more body fat, not less. The elevated
    resting expenditure is in line with the larger body weight and composition.
- q: What happens to physical activity expenditure when a person loses weight, and why?
  a: It declines, unless the activity's quantity or intensity is increased to compensate,
    because the energy cost of a given movement is set in proportion to overall body weight.
exercises:
- type: interpretation
  prompt: |
    A colleague says a patient with obesity must have a slow metabolism. Open Hall and Guo 2017
    at https://pmc.ncbi.nlm.nih.gov/articles/PMC5568065/ and search for Contrary to popular
    belief. Say what that paragraph shows, and what it does not.
  answer: |
    It shows the colleague has the direction wrong. People with obesity generally have a higher
    absolute REE, not a lower one. Fat-free mass is elevated in obesity along with body fat, and
    REE is linearly related to both.

    It does not show that metabolism is fast for the body's size. The paragraph says the elevated
    REE is "generally in line with what is expected for the body weight and composition". So it
    is higher because the body is bigger, not because it spends more than its size predicts.

    It also says "generally". It does not tell you this patient's REE. Only a measurement would.
