must_know:
- point: |
    A long tail on one side of a distribution pulls the mean toward it. Reading this backwards,
    "the mean is higher, so most values are higher", is an error.
  kind: misconception
  bearing: methodological
- point: |
    Compute the median alongside the mean whenever a handful of extreme values might be present.
    Compare the two before you quote either one on its own. A gap between them is itself a finding,
    not a rounding difference to ignore.
  kind: move
  bearing: methodological
- point: |
    A mean, on its own, says nothing about any one person in the group it was computed from.
  kind: boundary
  bearing: clinical
- point: |
    Divide by one less than the count whenever you compute a standard deviation from a sample.
  kind: move
  bearing: methodological
- point: |
    A mean sitting below a cut-off does not mean most of a group is below it.
  kind: trap
  bearing: public
- point: |
    Check a printed median against the two quartiles printed beside it before you trust any of the
    three.
  kind: move
  bearing: methodological
- point: |
    In a lopsided distribution, the standard deviation hides that the two sides spread out
    differently. Where the mean and median disagree by much, look at the quartiles instead of
    trusting a single standard deviation to describe both sides.
  kind: boundary
  bearing: methodological
exercises:
- type: critique
  prompt: |
    A report states this. "Average daily step count in our clinic's patients is 6,200, comfortably
    above the report's own target of 5,000 steps. So inactivity is not a major concern here." (The
    figures are made up for this exercise.)

    The same report's raw data shows a median of 4,100 steps. Say what the gap between the two
    numbers tells you. Say what you would ask for before agreeing with the conclusion.
  answer: |
    The mean, 6,200, sits well above the median, 4,100. The patients above the median reach far
    enough up to pull the mean past it. At least half of all patients walk at or below 4,100
    steps, which is already under the report's own target of 5,000.

    "Comfortably above the target" describes the mean, not the typical patient. The typical
    patient, by the median, sits below it.

    What to ask for instead: the proportion of patients whose own step count sits below 5,000. Work
    that out directly, rather than inferring it from the average. That number, not the mean,
    answers the question the report is actually trying to answer.
- type: teaching
  prompt: |
    A first-year resident reads a paper's abstract, sees a mean below a clinical cut-off, and
    concludes "so this group is fine". You have ten minutes and a whiteboard.

    Teach them why a mean sitting below a cut-off does not mean the group is.
  answer: |
    Ten minutes, for somebody who expects a mechanism.

    Write two numbers on the board. One is a mean of 24.2, from a real study of 131 men. The other
    is 25, the WHO cut-off that paper used. Both are body-mass index, in kilograms per square
    metre. Ask the resident what the mean means for the group.

    They will likely say the group is under the cut-off. Write a second real fact from the same
    study underneath: 52 of the 131 men individually have a body-mass index of 25 or more.

    ```working
        52 divided by 131 = 0.396946565...
        0.396946565 times 100 = 39.6946565
    ```

    About 39.7 per cent, close to two in five. Let the resident sit with that fact. The mean is
    under the line. Nearly two in five of the actual men are at it or over.

    Ask what would have to be true for the mean to sit below 25 while some men sit above it. The
    answer is that other men sit far enough below 25 to balance them out. Nothing about the mean
    tells you how many are on which side, or by how much.

    Close with the rule to carry into the next chart they read. A mean below a line is a fact about
    the mean. Whether most of the group is below that same line is a different question. Whether the
    one patient in front of them is below it is a third. Both need the group's spread, not just its
    average.
quantitative: true
practice:
- level: 1
  prompt: |
    Find the mean and the median of these seven numbers.

    ```working
        4   9   2   15   7   9   3
    ```
  answer: |
    The mean first.

    ```working
        4 plus 9 plus 2 plus 15 plus 7 plus 9 plus 3 = 49
        49 divided by 7 = 7
    ```

    For the median, order the numbers first.

    ```working
        2   3   4   7   9   9   15
    ```

    Seven numbers, so the middle one is the fourth. That is 7.

    The mean and the median both come out at 7 here. They do not have to agree, and the next
    problem shows a case where they do not.
- level: 2
  prompt: |
    Find the mean and the median of these six numbers.

    ```working
        6   9   11   14   18   50
    ```
  answer: |
    The mean.

    ```working
        6 plus 9 plus 11 plus 14 plus 18 plus 50 = 108
        108 divided by 6 = 18
    ```

    18.

    The median. The numbers are already ordered. With six of them, average the two in the middle.

    ```working
        11 plus 14 = 25
        25 divided by 2 = 12.5
    ```

    12.5.

    The mean, 18, sits well above the median, 12.5. The single value 50 is pulling the mean upward
    while the median stays close to where five of the six values actually are.
- level: 2
  prompt: |
    These eight numbers are already ordered.

    ```working
        3   5   5   9   11   11   15   19
    ```

    Find the first quartile, the second quartile, the third quartile, and the interquartile range.
  answer: |
    The second quartile is the median of the whole set. With eight numbers, average the two in the
    middle.

    ```working
        9 plus 11 = 20
        20 divided by 2 = 10
    ```

    The second quartile is 10.

    The lower half is 3, 5, 5, 9. Its middle two are the second and third values.

    ```working
        5 plus 5 = 10
        10 divided by 2 = 5
    ```

    The first quartile is 5.

    The upper half is 11, 11, 15, 19.

    ```working
        11 plus 15 = 26
        26 divided by 2 = 13
    ```

    The third quartile is 13. The interquartile range is the third quartile minus the first.

    ```working
        13 minus 5 = 8
    ```

    The interquartile range is 8.
- level: 2
  prompt: |
    These seven numbers are already ordered.

    ```working
        2   5   7   9   12   15   20
    ```

    Find the first quartile, the second quartile, the third quartile, and the interquartile range.
  answer: |
    Seven is odd, so the middle value, the fourth one, is the second quartile on its own. Leave it
    out of both halves before you take their medians.

    ```working
        second quartile = 9
    ```

    The lower half, with the middle value left out, is 2, 5, 7. Its own middle value is the first
    quartile.

    ```working
        first quartile = 5
    ```

    The upper half, with the middle value left out, is 12, 15, 20. Its own middle value is the
    third quartile.

    ```working
        third quartile = 15
    ```

    The interquartile range is the third quartile minus the first.

    ```working
        15 minus 5 = 10
    ```

    The interquartile range is 10. Software sometimes computes quartiles by a different rule and
    can print a slightly different number from this one. That is not a sign either calculation is
    wrong.
- level: 3
  prompt: |
    Work out the sample standard deviation of these six numbers, step by step.

    ```working
        8   6   10   4   12   8
    ```
  answer: |
    The mean first.

    ```working
        8 plus 6 plus 10 plus 4 plus 12 plus 8 = 48
        48 divided by 6 = 8
    ```

    The deviation of every value from the mean.

    ```working
        8 minus 8 = 0
        6 minus 8 = -2
        10 minus 8 = 2
        4 minus 8 = -4
        12 minus 8 = 4
        8 minus 8 = 0
    ```

    Square every deviation.

    ```working
        0 times 0 = 0
        -2 times -2 = 4
        2 times 2 = 4
        -4 times -4 = 16
        4 times 4 = 16
        0 times 0 = 0
    ```

    Add the squares.

    ```working
        0 plus 4 = 4
        4 plus 4 = 8
        8 plus 16 = 24
        24 plus 16 = 40
        40 plus 0 = 40
    ```

    Divide by one less than the count, which is five.

    ```working
        40 divided by 5 = 8
    ```

    The variance is 8. Take its square root for the standard deviation.

    ```working
        square root of 8 = 2.828427125
    ```

    The sample standard deviation is about 2.83.
- level: 3
  prompt: |
    Give the sample variance and the sample standard deviation of a sample whose deviations from its
    own mean are the five values below.

    ```working
        -2   4   -1   3   -4
    ```
  answer: |
    Square each deviation.

    ```working
        -2 times -2 = 4
        4 times 4 = 16
        -1 times -1 = 1
        3 times 3 = 9
        -4 times -4 = 16
    ```

    Add them.

    ```working
        4 plus 16 = 20
        20 plus 1 = 21
        21 plus 9 = 30
        30 plus 16 = 46
    ```

    Divide by one less than the count, which is four.

    ```working
        46 divided by 4 = 11.5
    ```

    The variance is 11.5. The standard deviation is its square root.

    ```working
        square root of 11.5 = 3.391164992
    ```

    The standard deviation is about 3.39.
- level: 4
  prompt: |
    Table 1 of Kiran et al. (2022) gives men's mean body-mass index as 24.2 kg/m^2 and their median
    as 23.8 kg/m^2.

    Work out the gap between the two, and say which side of the distribution its tail is likely on.
  answer: |
    ```working
        24.2 minus 23.8 = 0.4
    ```

    The gap is 0.4 kg/m^2.

    The mean sits a little above the median. That pattern happens when values above the median
    pull the mean upward more than values below it pull it down. The gap here is small next to the
    spread of the whole group. So this is only a slight sign of a tail on the high side, not a
    firm one.
  refs:
  - kiran_2022_muac_nc
- level: 5
  prompt: |
    Men's body-mass index in the same table has a median of 23.8 kg/m^2, with the two quartiles
    printed beside it as 21.2 and 26.8.

    Work out the interquartile range as a single number, and check whether the median sits between
    the two quartiles it is printed beside.
  answer: |
    ```working
        26.8 minus 21.2 = 5.6
    ```

    The interquartile range is 5.6 kg/m^2.

    Check the median against the two quartiles. 23.8 sits between 21.2 and 26.8. So this row of the
    table is internally consistent, unlike the weight row worked through in the illustration above.
  refs:
  - kiran_2022_muac_nc
- level: 5
  prompt: |
    The same table prints men's body-mass index as a median of 23.8 kg/m^2, with a first quartile
    of 21.2 and a third quartile of 26.8.

    Work out how far each quartile sits from the median. Say what the two distances suggest about
    which side of the distribution has the longer tail.
  answer: |
    ```working
        23.8 minus 21.2 = 2.6
        26.8 minus 23.8 = 3.0
    ```

    The first quartile sits 2.6 kg/m^2 below the median, and the third sits 3.0 above it. So the
    quarter of men just above the median is spread a little wider than the quarter just below it.
    That points the same way as the mean sitting above the median in the level 4 problem: a tail on
    the high side. The two distances differ by only 0.4, so this is a slight sign, not a firm one.
  refs:
  - kiran_2022_muac_nc
- level: 6
  prompt: |
    Suppose a man in this group had a body-mass index of 30 kg/m^2. The men's mean is 24.2 with a
    standard deviation of 3.9.

    Work out how many standard deviations above the mean his reading would sit.
  answer: |
    Find the deviation first.

    ```working
        30 minus 24.2 = 5.8
    ```

    Divide by the standard deviation to express it in standard deviations.

    ```working
        5.8 divided by 3.9 = 1.487179487
    ```

    That reading would sit about 1.49 standard deviations above the men's mean.
  refs:
  - kiran_2022_muac_nc
- level: 6
  prompt: |
    Table 1 of Kiran et al. (2022) gives the 151 women's body fat as a mean of 33.8 per cent. The
    median is 34.0 per cent, with the two quartiles printed beside it as 28.1 and 39.2.

    Work out the interquartile range as a single number. Check whether the median sits between the
    two quartiles. Then say which way the mean sitting below the median points.
  answer: |
    ```working
        39.2 minus 28.1 = 11.1
    ```

    The interquartile range is 11.1 percentage points.

    Check the median against the two quartiles. 34.0 sits between 28.1 and 39.2, so this row is
    internally consistent.

    Here the mean, 33.8, sits below the median, 34.0, the other way round from the men's rows
    worked through above. A mean below the median happens when the values below the median reach
    further down than those above it reach up. If this pattern holds, the tail here points toward the low side
    rather than the high side.
  refs:
  - kiran_2022_muac_nc
- level: 7
  prompt: |
    Five patients were picked from a clinic's much larger patient list. Here is someone's worked
    sample standard deviation of their ages, in years. Find the step that broke.

    ```working
        the numbers are 12, 15, 9, 21, 18
        mean = (12 plus 15 plus 9 plus 21 plus 18) divided by 5 = 15
        deviations: -3, 0, -6, 6, 3
        squares: 9, 0, 36, 36, 9
        sum of squares = 90
        variance = 90 divided by 5 = 18
        standard deviation = square root of 18 = 4.242640687
    ```
  answer: |
    The mean, the deviations and the squares are all correct, and so is their sum, 90. The step
    that broke is the division for the variance.

    These five patients are a sample from the clinic's larger list, and the question asked for the
    sample standard deviation. Its variance divides the sum of squared deviations by one less than
    the count, which is four here, not five.

    ```working
        90 divided by 4 = 22.5
    ```

    The variance is 22.5, not 18. Take its square root.

    ```working
        square root of 22.5 = 4.743416490
    ```

    The correct standard deviation is about 4.74, not 4.24.

    Why it looks reasonable: dividing by the count of values, five, is exactly what the mean itself
    does two lines earlier. Re-using the same 5 feels consistent. The sample rule uses one less
    than the count only at this one step. It appears nowhere else in the working, which is exactly
    what makes it easy to miss.
- level: 8
  prompt: |
    A teammate is about to quote this line from Table 1 of Kiran et al. (2022) in a talk.

    "Median weight among the women was 57.4 kilograms, with quartiles of 155.0 and 163.0."

    Find what is wrong with the line. Say what you would check before quoting any pair of
    quartiles taken from a table you have not read closely.
  answer: |
    The median has to sit between the two quartiles printed beside it. Here the median, 57.4, sits
    below both 155.0 and 163.0, not between them, so the three numbers cannot all describe the same
    row.

    The height row printed just below it gives a median of 159, with 51.3 and 63.9 printed beside
    it. Swap the two rows' quartiles and check both medians again. The weight row's median, 57.4,
    sits between the height row's printed numbers, 51.3 and 63.9. The height row's median, 159,
    sits between the weight row's printed numbers, 155.0 and 163.0. Both checks pass with the
    quartiles swapped. The numbers fit if the two rows' quartiles were printed in each other's
    places, the same pattern as in the men's rows above.

    What to check before quoting any pair of quartiles: does the paired median actually sit
    between the two quartiles printed with it. That check takes a moment, and it is the one this
    line fails.
  refs:
  - kiran_2022_muac_nc
- level: 8
  prompt: |
    Somebody makes this claim from the body fat figures in Table 1 of Kiran et al. (2022).

    "The mean body fat among the men is 22.1 per cent and the median is 20.3 per cent. Since the
    mean is higher, most men must have a body fat percentage above 22.1."

    Find the error in the reasoning.
  answer: |
    The conclusion has the direction backwards. By the median's own definition, at least half of
    the men are at or below 20.3. And 20.3 sits below the mean of 22.1. So at least half of the men
    are below the mean, not above it.

    The men above the median reach far enough up to pull the mean past it. At least half sit at or
    below the median.

    Why it looks reasonable: "the mean is higher, so more men must be higher" sounds right. It is
    the wrong direction. A higher mean is the sign of a tail on the high side. Some readings go
    far up. It is not a sign that most readings sit above the mean.
- level: 9
  prompt: |
    A note about the study says this. "Women's average body-mass index was 23.0, under the cut-off
    of 25, so weight was not a concern in this group of students."

    Decide what to compute, compute it, and say what your answer does not establish.
  answer: |
    What to compute: where the women's own quartiles sit against 25, rather than resting on the
    group's average. Table 1 prints the women's body-mass index as 22.7 (20.5, 25.6). That is a
    median of 22.7, with quartiles of 20.5 and 25.6.

    ```working
        25.6 minus 25 = 0.6
    ```

    The third quartile, 25.6, sits 0.6 above the cut-off. About a quarter of the women sit at or
    above 25.6. Since 25.6 is above 25, at least about a quarter of the 151 women are at 25 or
    above, even though the mean is 23.0.

    What this does not establish. Body-mass index does not measure body fat directly. It cannot
    tell fat from lean mass. So this figure does not establish anything about any one woman's
    health.

    Nor does it show that 25 is where risk starts for this group. The figure 25 is the WHO cut-off the paper used. The
    same paper notes that some Asian groups show metabolic risk at a lower body-mass index than
    that. And it says nothing about students elsewhere. This figure is for one college in one
    year.
  refs:
  - kiran_2022_muac_nc
- level: 10
  prompt: |
    A colleague says this about the same study. "Body fat in this group of men averages 22 per
    cent, so most men have a body fat percentage somewhere between 20 and 24."

    Decide what to compute, compute it, and say what your answer does not establish.
  answer: |
    What to compute: what the quartiles in the same row of Table 1 say about where the men sit.
    That is better than guessing a narrow band around the mean.

    Men's body fat is printed as a median of 20.3 per cent, with quartiles of 16.7 and 28.8.

    ```working
        28.8 minus 16.7 = 12.1
    ```

    By definition, about a quarter of the men sit at or below 16.7 and about a quarter sit at or
    above 28.8. So about half the men lie between 16.7 and 28.8. The colleague's 20 to 24 sits
    inside that stretch, so at most about half can lie in it. The mean, 22.1, also sits
    above the median, 20.3, by 1.8 points.

    ```working
        22.1 minus 20.3 = 1.8
    ```

    The median says at least half of the men sit at or below 20.3. The men above it reach far
    enough up to pull the mean past it.

    What this does not establish. Neither the mean nor the quartiles tell you what fraction of men
    actually fall inside 20 to 24 specifically. That needs a frequency table of the individual
    readings, the way Table 2 gave one for body-mass index. No such table is given here for body
    fat. And the quartiles already show that "most men" cannot be packed into a band as narrow as
    20 to 24.
  refs:
  - kiran_2022_muac_nc
retrieval_items:
- q: What is the difference between the mean and the median, and what happens to each when one
    value in a set is far from the rest?
  a: The mean is the sum divided by the count, and it uses every value, so one far-off value pulls
    it toward itself. The median is the middle value by position, so a far-off value barely moves
    it.
- q: Why does the sample variance divide by one less than the count rather than by the count
    itself?
  a: Because measuring each value's distance from a mean built out of the same sample slightly
    understates the population variance, on average. Dividing by a smaller number makes the
    variance come out right on average. The standard deviation, its square root, still runs a
    little low on average even after this correction.
- q: A group's mean sits below a threshold, and many individuals in the group sit above it. What
    does the mean establish, and what does it not?
  a: The mean is a true statement about the group as a whole. It establishes nothing about any one
    member of the group, who may sit on either side of the threshold regardless of where the mean
    sits.
