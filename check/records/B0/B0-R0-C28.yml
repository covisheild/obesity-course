- level: 6
  prompt: |
    Table 1 of Kiran et al. (2022) gives the 151 women's body fat as a mean of 33.8 per cent with a
    median of 34.0 per cent and an interquartile range printed as 28.1 to 39.2.

    Work out the interquartile range as a single number. Check whether the median sits between the
    two quartiles. Then say which way the mean sitting below the median points.
  answer: |
    ```working
        39.2 minus 28.1 = 11.1
    ```

    The interquartile range is 11.1 percentage points.

    Check the median against the two quartiles. 34.0 sits between 28.1 and 39.2, so this row is
    internally consistent.

    Here the mean, 33.8, sits below the median, 34.0, the other way round from the men's rows
    worked through above. A mean below the median happens when a smaller number of values well
    below the middle pull it down. If this pattern holds, the tail here points toward the low side
    rather than the high side.
  refs:
  - kiran_2022_muac_nc
- level: 7
  prompt: |
    Five patients were picked from a clinic's much larger patient list. Here is someone's worked
    sample standard deviation of their ages, in years. Find the step that broke.

    ```working
        the numbers are 12, 15, 9, 21, 18
        mean = (12 plus 15 plus 9 plus 21 plus 18) divided by 5 = 15
        deviations: -3, 0, -6, 6, 3
        squares: 9, 0, 36, 36, 9
        sum of squares = 90
        variance = 90 divided by 5 = 18
        standard deviation = square root of 18 = 4.242640687
    ```
  answer: |
    The mean, the deviations and the squares are all correct, and so is their sum, 90. The step
    that broke is the division for the variance.

    These five patients are a sample from the clinic's larger list, and the question asked for the
    sample standard deviation. Its variance divides the sum of squared deviations by one less than
    the count, which is four here, not five.

    ```working
        90 divided by 4 = 22.5
    ```

    The variance is 22.5, not 18. Take its square root.

    ```working
        square root of 22.5 = 4.743416490
    ```

    The correct standard deviation is about 4.74, not 4.24.

    Why it looks reasonable: dividing by the count of values, five, is exactly what the mean itself
    does two lines earlier. Re-using the same 5 feels consistent. The sample rule uses one less
    than the count only at this one step. It appears nowhere else in the working, which is exactly
    what makes it easy to miss.
- level: 8
  prompt: |
    A teammate is about to quote this line from Table 1 of Kiran et al. (2022) in a talk.

    "Median weight among the women was 57.4 kilograms, with an interquartile range of 155.0 to
    163.0."

    Find what is wrong with the line. Say what you would check before quoting any interquartile
    range taken from a table you have not read closely.
  answer: |
    The median has to sit between the two quartiles printed beside it. Here the median, 57.4, sits
    below both 155.0 and 163.0, not between them, so the three numbers cannot all describe the same
    row.

    The height row printed just below it gives a median of 159 with a printed range of 51.3 to
    63.9. Swap the two rows' ranges and check both medians again. The weight row's median, 57.4,
    sits between the height row's printed numbers, 51.3 and 63.9. The height row's median, 159,
    sits between the weight row's printed numbers, 155.0 and 163.0. Both checks pass once the
    ranges are swapped back to the rows they belong to. The two rows have had their interquartile
    ranges swapped in the paper's own table, the same slip Table 1 makes in the men's rows above.

    What to check before quoting any interquartile range: does the paired median actually sit
    between the two quartiles printed with it. That check takes a moment, and it is the one this
    line fails.
  refs:
  - kiran_2022_muac_nc
- level: 8
  prompt: |
    Somebody makes this claim from the body fat figures in Table 1 of Kiran et al. (2022).

    "The mean body fat among the men is 22.1 per cent and the median is 20.3 per cent. Since the
    mean is higher, most men must have a body fat percentage above 22.1."

    Find the error in the reasoning.
  answer: |
    The conclusion has the direction backwards. By the median's own definition, at least half of
    the men are at or below 20.3. And 20.3 sits below the mean of 22.1. So at least half of the men
    are below the mean, not above it.

    A smaller number of men, with a much higher body fat percentage, are what pull the mean up.
    Most men sit near or below the median.

    Why it looks reasonable: "the mean is higher, so more men must be higher" sounds right. It is
    the wrong direction. A higher mean is the sign of a tail on the high side. A few readings go
    far up. It is not a sign that most readings sit above the mean.
- level: 9
  prompt: |
    A note about the study says this. "Women's average body-mass index was 23.0, under the cut-off
    of 25, so weight was not a concern in this group of students."

    Decide what to compute, compute it, and say what your answer does not establish.
  answer: |
    What to compute: what fraction of the 151 women individually have a body-mass index at or above
    25, rather than resting on the group's average.

    ```working
        41 plus 5 = 46
        46 divided by 151 = 0.304635762...
        0.304635762 times 100 = 30.4635762
    ```

    About 30.5 per cent of the 151 women individually sit at 25 or above, even though the group's
    mean sits under it.

    What this does not establish. Body-mass index does not measure body fat directly: it cannot
    tell fat mass from lean mass, so it does not establish anything about any one woman's health.
    It also does not establish that 25 is where risk actually starts for this group; 25 is the WHO
    cut-off the paper adopted, and the same paper notes that some Asian populations show
    metabolic risk at a lower body-mass index than that. And it says nothing about students
    elsewhere: this figure describes one college in one year.
  refs:
  - kiran_2022_muac_nc
- level: 10
  prompt: |
    A colleague says this about the same study. "Body fat in this group of men averages 22 per
    cent, so most men have a body fat percentage somewhere between 20 and 24."

    Decide what to compute, compute it, and say what your answer does not establish.
  answer: |
    What to compute: what the quartiles printed in the same row of Table 1 say about where the men
    actually sit, rather than guessing a narrow band around the mean.

    Men's body fat is printed as a median of 20.3 per cent with an interquartile range of 16.7 to
    28.8.

    ```working
        28.8 minus 16.7 = 12.1
    ```

    By definition, about a quarter of the men sit at or below 16.7 and about a quarter sit at or
    above 28.8. So at most about half of the men can lie anywhere between 16.7 and 28.8, and the
    colleague's "20 to 24" is a narrower band sitting inside that half. The mean, 22.1, also sits
    above the median, 20.3, by 1.8 points.

    ```working
        22.1 minus 20.3 = 1.8
    ```

    That gap says at least half of the men sit at or below 20.3, with a smaller number reading well
    above 22.1 pulling the mean up past them.

    What this does not establish. Neither the mean nor the quartiles tell you what fraction of men
    actually fall inside 20 to 24 specifically. That needs a frequency table of the individual
    readings, the way Table 2 gave one for body-mass index. No such table is given here for body
    fat, and the quartiles already show that "most men" cannot be packed into a band as narrow as
    20 to 24.
  refs:
  - kiran_2022_muac_nc
retrieval_items:
- q: What is the difference between the mean and the median, and what happens to each when one
    value in a set is far from the rest?
  a: The mean is the sum divided by the count, and it uses every value, so one far-off value pulls
    it toward itself. The median is the middle value by position, so a far-off value barely moves
    it.
- q: Why does the sample variance divide by one less than the count rather than by the count
    itself?
  a: Because measuring each value's distance from a mean built out of the same sample slightly
    understates the population variance, on average. Dividing by a smaller number makes the
    variance come out right on average. The standard deviation, its square root, still runs a
    little low on average even after this correction.
- q: A group's mean sits below a threshold, and many individuals in the group sit above it. What
    does the mean establish, and what does it not?
  a: The mean is a true statement about the group as a whole. It establishes nothing about any one
    member of the group, who may sit on either side of the threshold regardless of where the mean
    sits.
