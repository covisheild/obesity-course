must_know:
- point: |
    A long tail on one side of a distribution pulls the mean toward it. It leaves the median close
    to where most of the values actually sit. Reading this backwards, "the mean is higher, so most
    values are higher", is an error.
  kind: misconception
  bearing: methodological
- point: |
    Compute the median alongside the mean whenever a handful of extreme values might be present.
    Compare the two before you quote either one on its own. A gap between them is itself a finding,
    not a rounding difference to ignore.
  kind: move
  bearing: methodological
- point: |
    A mean, on its own, says nothing about any one person in the group it was computed from. Before
    you use it to describe the person in front of you, ask where that person sits in the group's
    spread.
  kind: boundary
  bearing: clinical
- point: |
    Divide by one less than the count whenever you compute a standard deviation from a sample. Most
    papers you read will have done the same, on the same sample logic.
  kind: move
  bearing: methodological
- point: |
    A mean sitting below a cut-off does not mean most of a group is below it. Ask what fraction of
    individuals actually sit on the other side before you repeat an average as reassurance.
  kind: trap
  bearing: public
- point: |
    Check a printed median against the two quartiles printed beside it before you trust any of the
    three: the first quartile has to sit below the median and the third has to sit above it.
  kind: move
  bearing: methodological
- point: |
    In a lopsided distribution, the standard deviation hides that the two sides spread out
    differently. Where the mean and median disagree by much, look at the quartiles instead of
    trusting a single standard deviation to describe both sides.
  kind: boundary
  bearing: methodological
exercises:
- type: critique
  prompt: |
    A report states this. "Average daily step count in our clinic's patients is 6,200, comfortably
    above the report's own target of 5,000 steps. So inactivity is not a major concern here." (The
    figures are made up for this exercise.)

    The same report's raw data shows a median of 4,100 steps. Say what the gap between the two
    numbers tells you. Say what you would ask for before agreeing with the conclusion.
  answer: |
    The mean, 6,200, sits well above the median, 4,100. A smaller number of patients with a very
    high step count are pulling the mean up. More than half of all patients walk at or below 4,100
    steps, which is already under the report's own target of 5,000.

    "Comfortably above the target" describes the mean, not the typical patient. The typical
    patient, by the median, sits below it.

    What to ask for instead: the proportion of patients whose own step count sits below 5,000. Work
    that out directly, rather than inferring it from the average. That number, not the mean,
    answers the question the report is actually trying to answer.
- type: teaching
  prompt: |
    A first-year resident reads a paper's abstract, sees a mean below a clinical cut-off, and
    concludes "so this group is fine". You have ten minutes and a whiteboard.

    Teach them why a mean sitting below a cut-off does not mean the group is.
  answer: |
    Ten minutes, for somebody who expects a mechanism.

    Write two numbers on the board: a mean of 24.2, from a real study of 131 men, and a cut-off of
    25, the WHO cut-off that paper used, both kilograms per square metre of body-mass index. Ask
    the resident what it means for the group.

    They will likely say the group is under the cut-off. Write a second real fact from the same
    study underneath: 52 of the 131 men individually have a body-mass index of 25 or more.

    ```working
        52 divided by 131 = 0.396946565...
        0.396946565 times 100 = 39.6946565
    ```

    About 39.7 per cent, close to two in five. Let the resident sit with that fact. The mean is
    under the line. Nearly two in five of the actual men are at it or over.

    Ask what would have to be true for the mean to sit below 25 while some men sit above it. The
    answer is that other men sit far enough below 25 to balance them out. Nothing about the mean
    tells you how many are on which side, or by how much.

    Close with the rule to carry into the next chart they read. A mean below a line is a fact about
    the mean. Whether most of the group is below that same line is a different question. Whether the
    one patient in front of them is below it is a third. Both need the group's spread, not just its
    average.
quantitative: true
practice:
- level: 1
  prompt: |
    Find the mean and the median of these seven numbers.

    ```working
        4   9   2   15   7   9   3
    ```
  answer: |
    The mean first.

    ```working
        4 plus 9 plus 2 plus 15 plus 7 plus 9 plus 3 = 49
        49 divided by 7 = 7
    ```

    For the median, order the numbers first.

    ```working
        2   3   4   7   9   9   15
    ```

    Seven numbers, so the middle one is the fourth. That is 7.

    The mean and the median both come out at 7 here. They do not have to agree, and the next
    problem shows a case where they do not.
- level: 2
  prompt: |
    Find the mean and the median of these six numbers.

    ```working
        6   9   11   14   18   50
    ```
  answer: |
    The mean.

    ```working
        6 plus 9 plus 11 plus 14 plus 18 plus 50 = 108
        108 divided by 6 = 18
    ```

    18.

    The median. The numbers are already ordered. With six of them, average the two in the middle.

    ```working
        11 plus 14 = 25
        25 divided by 2 = 12.5
    ```

    12.5.

    The mean, 18, sits well above the median, 12.5. The single value 50 is pulling the mean upward
    while the median stays close to where five of the six values actually are.
- level: 2
  prompt: |
    These eight numbers are already ordered.

    ```working
        3   5   5   9   11   11   15   19
    ```

    Find the first quartile, the second quartile, the third quartile, and the interquartile range.
  answer: |
    The second quartile is the median of the whole set. With eight numbers, average the two in the
    middle.

    ```working
        9 plus 11 = 20
        20 divided by 2 = 10
    ```

    The second quartile is 10.

    The lower half is 3, 5, 5, 9. Its middle two are the second and third values.

    ```working
        5 plus 5 = 10
        10 divided by 2 = 5
    ```

    The first quartile is 5.

    The upper half is 11, 11, 15, 19.

    ```working
        11 plus 15 = 26
        26 divided by 2 = 13
    ```

    The third quartile is 13. The interquartile range is the third quartile minus the first.

    ```working
        13 minus 5 = 8
    ```

    The interquartile range is 8.
- level: 2
  prompt: |
    These seven numbers are already ordered.

    ```working
        2   5   7   9   12   15   20
    ```

    Find the first quartile, the second quartile, the third quartile, and the interquartile range.
  answer: |
    Seven is odd, so the middle value, the fourth one, is the second quartile on its own. Leave it
    out of both halves before you take their medians.

    ```working
        second quartile = 9
    ```

    The lower half, with the middle value left out, is 2, 5, 7. Its own middle value is the first
    quartile.

    ```working
        first quartile = 5
    ```

    The upper half, with the middle value left out, is 12, 15, 20. Its own middle value is the
    third quartile.

    ```working
        third quartile = 15
    ```

    The interquartile range is the third quartile minus the first.

    ```working
        15 minus 5 = 10
    ```

    The interquartile range is 10. Software sometimes computes quartiles by a different rule and
    can print a slightly different number from this one. That is not a sign either calculation is
    wrong.
- level: 3
  prompt: |
    Work out the sample standard deviation of these six numbers, step by step.

    ```working
        8   6   10   4   12   8
    ```
  answer: |
    The mean first.

    ```working
        8 plus 6 plus 10 plus 4 plus 12 plus 8 = 48
        48 divided by 6 = 8
    ```

    The deviation of every value from the mean.

    ```working
        8 minus 8 = 0
        6 minus 8 = -2
        10 minus 8 = 2
        4 minus 8 = -4
        12 minus 8 = 4
        8 minus 8 = 0
    ```

    Square every deviation.

    ```working
        0 times 0 = 0
        -2 times -2 = 4
        2 times 2 = 4
        -4 times -4 = 16
        4 times 4 = 16
        0 times 0 = 0
    ```

    Add the squares.

    ```working
        0 plus 4 = 4
        4 plus 4 = 8
        8 plus 16 = 24
        24 plus 16 = 40
        40 plus 0 = 40
    ```

    Divide by one less than the count, which is five.

    ```working
        40 divided by 5 = 8
    ```

    The variance is 8. Take its square root for the standard deviation.

    ```working
        square root of 8 = 2.828427125
    ```

    The sample standard deviation is about 2.83.
- level: 3
  prompt: |
    Give the variance and the sample standard deviation of a set whose deviations from its own mean
    are the five values below.

    ```working
        -2   4   -1   3   -4
    ```
  answer: |
    Square each deviation.

    ```working
        -2 times -2 = 4
        4 times 4 = 16
        -1 times -1 = 1
        3 times 3 = 9
        -4 times -4 = 16
    ```

    Add them.

    ```working
        4 plus 16 = 20
        20 plus 1 = 21
        21 plus 9 = 30
        30 plus 16 = 46
    ```

    Divide by one less than the count, which is four.

    ```working
        46 divided by 4 = 11.5
    ```

    The variance is 11.5. The standard deviation is its square root.

    ```working
        square root of 11.5 = 3.391164992
    ```

    The standard deviation is about 3.39.
- level: 4
  prompt: |
    Table 1 of Kiran et al. (2022) gives men's mean body-mass index as 24.2 kg/m^2 and their median
    as 23.8 kg/m^2.

    Work out the gap between the two, and say which side of the distribution its tail is likely on.
  answer: |
    ```working
        24.2 minus 23.8 = 0.4
    ```

    The gap is 0.4 kg/m^2.

    The mean sits a little above the median. That pattern happens when values above the median
    pull the mean upward more than values below it pull it down. The gap here is small next to the
    spread of the whole group, so this is only a slight sign of a tail on the high side, not a
    firm one.
  refs:
  - kiran_2022_muac_nc
- level: 5
  prompt: |
    The same table gives women's mean body-mass index as 23.0 kg/m^2 and their median as 22.7
    kg/m^2.

    Work out the gap between the two, and say which side of the distribution its tail is likely on.
  answer: |
    ```working
        23.0 minus 22.7 = 0.3
    ```

    The gap is 0.3 kg/m^2, with the mean again a little above the median. A smaller number of women
    with a body-mass index well above the middle pull the mean up past where most of the group sits.
    The tail, if there is one worth naming from a gap this size, is on the high side.
  refs:
