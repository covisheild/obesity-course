simplified_explanation: |
  Start with the mean and the median on a small set, so the machinery is visible before any real
  numbers arrive.

  Take six numbers: 5, 8, 12, 15, 20, 40. Add them and divide by how many there are for the mean.

  ```working
      5 plus 8 plus 12 plus 15 plus 20 plus 40 = 100
      100 divided by 6 = 16.6666666667...
  ```

  The mean is about 16.7.

  For the median, put the same six numbers in order, which they already are, and find the middle.
  With six values there is no single middle one, so take the two in the middle and average them.

  ```working
      12 plus 15 = 27
      27 divided by 2 = 13.5
  ```

  The median is 13.5, noticeably below the mean of 16.7. One number in this set, the 40, sits a
  long way above the rest. It drags the mean up with it and leaves the median almost where it would
  have been without it. That is why the two are worth computing together rather than picking one.
  Whichever one moves more, and by how much, tells you something the other cannot.

  Quartiles use the same ordering. Take eight ordered numbers: 2, 4, 4, 6, 8, 8, 10, 12. The middle
  value, the second quartile, is the average of the two central values.

  ```working
      6 plus 8 = 14
      14 divided by 2 = 7
  ```

  Now split the set into its lower half and its upper half, four numbers each, and find the middle
  of each half the same way. The lower half is 2, 4, 4, 6.

  ```working
      4 plus 4 = 8
      8 divided by 2 = 4
  ```

  That gives the first quartile, 4. Now the upper half, 8, 8, 10, 12.

  ```working
      8 plus 10 = 18
      18 divided by 2 = 9
  ```

  That gives the third quartile, 9. The interquartile range is the third quartile minus the first.

  ```working
      9 minus 4 = 5
  ```

  Five. It says the middle half of these eight values is spread across five units. It says nothing
  about the quarter below the first quartile, or the quarter above the third. That is exactly what
  it is for: a spread that is not dragged around by one extreme value the way the
  range is.

  Now the standard deviation, step by step, on six more bare numbers: 5, 7, 3, 7, 10, 4.

  First, the mean.

  ```working
      5 plus 7 plus 3 plus 7 plus 10 plus 4 = 36
      36 divided by 6 = 6
  ```

  The mean is 6. Now the deviation of every value: how far it sits from that mean, kept with its
  sign. A deviation below the mean comes out negative, the kind of number the section on counting
  introduced.

  ```working
      5 minus 6 = -1
      7 minus 6 = 1
      3 minus 6 = -3
      7 minus 6 = 1
      10 minus 6 = 4
      4 minus 6 = -2
  ```

  Square every deviation next, which means multiplying each one by itself. The first one below the
  mean, -1, squared, is -1 times -1. A negative number times a negative number gives a positive
  number: multiplying by a negative flips a value to the other side of zero, and flipping twice
  brings it back to the positive side it started on.

  ```working
      -1 times -1 = 1
  ```

  Squaring removes the sign this way for every deviation, so a value below the mean counts the same
  as one the same distance above it.

  ```working
      -1 times -1 = 1
      1 times 1 = 1
      -3 times -3 = 9
      1 times 1 = 1
      4 times 4 = 16
      -2 times -2 = 4
  ```

  Add the squares.

  ```working
      1 plus 1 = 2
      2 plus 9 = 11
      11 plus 1 = 12
      12 plus 16 = 28
      28 plus 4 = 32
  ```

  Thirty-two. Divide that by one less than the count of values, which is five here, not six. That
  division is the variance.

  ```working
      32 divided by 5 = 6.4
  ```

  The variance is 6.4, and it is in the wrong unit. Squaring every deviation squared the unit too,
  so a variance worked out from kilograms is really in kilograms squared, which nobody can picture.
  Take the square root and the unit comes back to the one you started in. That last step is the
  standard deviation.

  ```working
      square root of 6.4 = 2.529822128
  ```

  The standard deviation of these six numbers is about 2.53.

  Go back to the division by five rather than six. Most papers do the same thing: a sample's
  variance is divided by one less than the count. Distances from the sample's own mean come out a
  little small on average, because that mean sits in the middle of these particular numbers.
  Dividing by one less than the count makes the variance come out right on average, which is the
  same reason the anchor textbook this book follows gives for the rule.

  This holds for the variance, on average, across many samples. It does not mean every single
  sample's variance is too small before the correction, and taking a square root afterwards does
  not carry the correction over exactly: the standard deviation, unlike the variance, still runs a
  little low on average even after dividing by one less than the count.

  If you divide by the full count instead, you will get a slightly smaller number than most
  published tables use. That is not a mistake in your arithmetic. It is a different, and less
  usual, convention.
illustration:
  body: |
    Open Table 1 of the paper used in the section on variation: Kiran, Harshitha and Bhargava, 282
    medical students in Mangaluru. It gives weight, height, body-mass index and more, each as a
    mean with its standard deviation beside a median with its interquartile range. Papers write the
    standard deviation (SD) by its two initials. Read the first two rows for the 131 men.

    ```table
    indicator     mean (SD)      median (interquartile range)
    weight (kg)   72.0 (13.1)    70.9 (167.7, 177.8)
    height (cm)   172.2 (6.8)    173 (62.6, 80.9)
    ```

    Stop on the weight row's interquartile range, and check it yourself. The median has to sit
    between the two quartiles printed beside it: the first quartile below it, the third above it.
    Here the median is 70.9, and the two numbers printed beside it are 167.7 and 177.8. 70.9 sits
    below both of them, not between them.

    Try the same check on the height row underneath it. The median there is 173, and the two
    numbers printed beside it are 62.6 and 80.9. 173 sits above both of them, not between them
    either.

    Both rows fail the same way, and each one fails against the other row's numbers. Try swapping
    the two printed ranges between the rows, and run the check a third time. Put the weight row's
    median, 70.9, against the height row's printed numbers, 62.6 and 80.9. 70.9 sits between them.
    Now put the height row's median, 173, against the weight row's printed numbers, 167.7 and
    177.8. 173 sits between them too. Both checks pass once the two ranges are swapped back to the
    rows they actually belong to. The numbers fit if the two rows had their interquartile ranges
    printed in each other's places, and the paper's own table for the 151 women shows the identical
    pattern in the same two rows.

    You did not need the paper to say this happened. The technique this section teaches, the median
    against its own two quartiles, found it on its own. This one survived the paper's own
    reviewers.

    Now the finding this section takes its title from, printed correctly in the same table. Men's
    mean body-mass index is 24.2 kilograms per square metre, with a standard deviation of 3.9.

    Table 2 of the same paper sorts those same 131 men by body-mass index, the way the section on
    variation used it already. It uses the World Health Organization's own bands. Forty-two of the
    men are in the band from 25 to 29.9. Ten more are at 30 or more.

    ```working
        42 plus 10 = 52
    ```

    Fifty-two of the 131 men have a body-mass index of 25 or more.

    ```working
        52 divided by 131 = 0.396946565...
        0.396946565 times 100 = 39.6946565
    ```

    That rounds to about 39.7 per cent, close to two in every five. The mean of the group, 24.2,
    sits under the line at 25. Close to two in five of the individual men in that same group sit at
    it or above it. The mean describes the group. It was never a description of any one of the 131
    men. Deciding whether one particular man is above or below 25 needs his own reading, not the
    group's average.

    The same shape shows up again in body fat. Men's mean body fat is 22.1 per cent and their
    median is 20.3 per cent. The mean sits above the median.

    ```working
        22.1 minus 20.3 = 1.8
    ```

    By the median's own definition, at least half of the 131 men have a body fat percentage at or
    below 20.3. That is also below the mean of 22.1. A smaller number of men, with a much higher
    body fat percentage, pull the mean up past them. It is bunched in the middle, with a longer
    stretch running upward than downward. That is exactly
    the shape the section on variation described in words.
  analogy_breaks_when: |
    Checking a median against its own two quartiles catches a range that sits nowhere near the
    median. It would not catch a smaller slip, such as one digit typed wrong that still leaves the
    median sitting inside the range by chance.

    The mean sitting below 25 while many men sit above it is a fact about this one group. It is 131
    men, measured this way, in this college, in 2019. It says nothing about any other group. It
    says nothing about any one of these men beyond what his own reading gives you.

    The standard deviation and the interquartile range answer different questions about the same
    spread. Neither can be worked out from the other. A table that gives you one is not quietly
    giving you the other as well.
