- level: 5
  prompt: |
    Men's body-mass index in the same table has a median of 23.8 kg/m^2 with an interquartile range
    of 21.2 to 26.8.

    Work out the interquartile range as a single number, and check whether the median sits between
    the two quartiles it is printed beside.
  answer: |
    ```working
        26.8 minus 21.2 = 5.6
    ```

    The interquartile range is 5.6 kg/m^2.

    Check the median against the two quartiles. 23.8 sits between 21.2 and 26.8. So this row of the
    table is internally consistent, unlike the weight row worked through in the illustration above.
  refs:
