must_know:
- point: |
    Multiply a rate by the time it held for before you quote any total. A rate alone is not an
    amount, and the missing step is where the two get confused.
  kind: move
  bearing: methodological
- point: |
    Check the unit of every total. A rate in kilograms per month multiplied by months leaves
    kilograms. If the unit of your answer still has a time on the bottom, you have added rates
    instead of accumulating them.
  kind: move
  bearing: methodological
- point: |
    Taking one measurement of a rate and multiplying it by a whole year is the commonest way a
    total goes wrong. It is right only where the rate held all year, which is a claim about the
    world and needs evidence like any other.
  kind: trap
  bearing: methodological
- point: |
    The area under a rate line is a total and not a rate. A large area means a large amount
    accumulated, and it says nothing about how fast the quantity is moving now.
  kind: misconception
  bearing: methodological
- point: |
    A total carries its interval assumption with it, and narrower intervals shrink the error
    without ever removing it. Say which readings a total was built from whenever you give it, so
    that whoever uses it knows what was assumed between them.
  kind: boundary
  bearing: methodological
- point: |
    Before accepting an annual figure built from one measurement, ask how many times the rate was
    measured and when. A yearly total from a single reading is a forecast wearing the clothes of a
    count.
  kind: consequence
  bearing: policy
- point: |
    When somebody quotes a total to a journalist, give the rate alongside it, or the other way
    round. A total says how much has piled up, a rate says how fast it is piling up now, and the
    two answer different questions.
  kind: move
  bearing: public
- point: |
    Teach a trainee to draw the rectangles before reaching for a formula. A stack of rectangles under a rate line makes the idea of a total visible. It survives long after
    any formula they were taught has gone.
  kind: move
  bearing: teaching
exercises:
- type: interpretation
  prompt: |
    A figure has months along the bottom and litres a day up the side. The line starts high, falls
    for six months, and then runs flat for six more.

    Say what the area under the line stands for, and give its unit. Then say what the figure does
    not tell you.
  answer: |
    The area under the line is the total number of litres over the twelve months. It is the running
    total, drawn.

    The unit comes off the two axes. Litres a day up the side and months along the bottom, so the
    area is in litres a day multiplied by months.

    That is not yet a usable unit, and the fix is a conversion from the section on converting
    units. Turn the months into days, and litres a day multiplied by days leaves litres.

    What the figure does not tell you. It does not tell you the rate now. For that you read the height of the line at the right-hand end,
    rather than the area under it. Those are two different
    readings of the same picture, and only one of them answers "how fast".

    It does not tell you how the rate moved inside each month. A line drawn between monthly
    readings is an assumption about the days between them.

    And it does not tell you whether a total of that size matters. The picture carries no threshold
    and no comparison, so nothing in it says whether the number is large.
  confidence_first: true
- type: critique
  prompt: |
    A district file carries this line.

    > The depot issued 400 bags in the first week of April. That is 400 a week, so it will issue
    > about 20,800 bags this year.

    Say what has been assumed, say what you would ask for, and say what you would write in its
    place.
  answer: |
    The arithmetic is right. Fifty-two weeks at 400 bags is 20,800.

    ```working
        400 times 52 = 20800
    ```

    What has been assumed: that a rate measured across one week held across fifty-two. The file has
    one rectangle, one week wide, and has stretched it to cover a year.

    That assumption is doing all the work and it is nowhere stated. It is also the least likely thing in the sentence. Issue rates move with the season, with the
    month of the entitlement cycle, and with whatever else the depot is doing.

    What to ask for: the weekly issue figures for as many past weeks as exist. Fifty-two readings
    give fifty-two rectangles and a total that assumes almost nothing. Twelve monthly readings give
    twelve, which is far better than one.

    What to write in its place. Say that the depot issued 400 bags in the first week of April. Then say that a yearly figure needs the rate across the year. The 20,800 is what the year would
    come to if every week matched that one. Give the 20,800 as a conditional and never as a count.

    One more line worth adding. Ask whether the first week of April is a typical week. A cycle that
    starts at the beginning of the month makes the first week the busiest one there is.
- type: teaching
  prompt: |
    A health secretary has one page and three minutes. Two reports have reached them about the same
    programme. One gives a monthly rate and one gives a yearly total, and the two do not look like
    they can both be true.

    Write what you would put on that page.
  answer: |
    Answer first, because that is what the page is for.

    The two reports may both be right. A rate and a total are different quantities. One says how fast something is happening and the other says how much has happened. Neither can be
    checked against the other without the time it applied over.

    Then the one line of arithmetic that settles it. Multiply the monthly rate by twelve months. If
    that lands near the yearly total, the two reports agree.

    ```working
        the yearly total = the monthly rate, times twelve months
    ```

    Then the question to send back if the two do not agree. Ask how many times the rate was
    measured across the year. A single month stretched to twelve is a forecast, and a figure built
    from twelve monthly readings is a count. The two arrive on the page looking identical.

    Then one sentence on what to require in future. Every total should say what readings it was
    built from. Every rate should say the interval it covers.

    No methods section. The secretary does not need rectangles. They need to know that a rate and a
    total are different things, and that the multiplication between them hides an assumption.
quantitative: true
practice:
- level: 1
  prompt: |
    A quantity grows at a steady rate of 7 for each unit of time.

    Work out how much is added over 9 units of time, over 20 units of time, and over half a unit of
    time.
  answer: |
    The amount is the rate multiplied by the time.

    ```working
        7 times 9 = 63
    ```

    ```working
        7 times 20 = 140
    ```

    ```working
        7 times 0.5 = 3.5
    ```

    So 63, then 140, then 3.5.

    The last one is worth a second look. A time shorter than one unit gives an amount smaller than
    the rate, which is what multiplying by a number below one always does.
- level: 2
  prompt: |
    A quantity changes at different rates over three successive stretches of time.

    ```table
    stretch  the rate  how long it held
    first    12        4 units of time
    second   5         6 units of time
    third    20        2 units of time
    ```

    Work out the amount over each stretch, and the total over all three.
  answer: |
    Each amount is the rate multiplied by the time it held for.

    ```working
        12 times 4 = 48
        5 times 6 = 30
        20 times 2 = 40
    ```

    So 48, then 30, then 40.

    Now add them.

    ```working
        48 plus 30 = 78
        78 plus 40 = 118
    ```

    A total of 118.

    Notice the third stretch. It had the highest rate of the three and it contributed less than the
    first, because it lasted two units of time instead of four. A rate on its own does not tell you
    how much a stretch contributed.
- level: 2
  prompt: |
    A quantity is added at these rates over six successive intervals, each one unit of time long:
    9, 9, 4, 4, 4, 2.

    Write the running total after each interval.
  answer: |
    Each interval is one unit of time long, so each amount is the rate itself.

    Add them one at a time.

    ```working
        9 plus 9 = 18
        18 plus 4 = 22
        22 plus 4 = 26
        26 plus 4 = 30
        30 plus 2 = 32
    ```

    So the running total reads 9, 18, 22, 26, 30, 32.

    Two things to notice. The running total never falls, because every rate here is positive. And
    it climbs in steps of different sizes, because the rate changed while the intervals did not.
- level: 3
  prompt: |
    A quantity accumulates over three stretches. Over the first it grows at 10 for 5 units of time.
    Over the second it grows at 6 for 5 units of time. Over the third it grows at 6 for 10 units of
    time.

    Work out the total. Then work out the average rate over the whole twenty units of time.
  answer: |
    Each stretch first.

    ```working
        10 times 5 = 50
        6 times 5 = 30
        6 times 10 = 60
    ```

    Now the total.

    ```working
        50 plus 30 = 80
        80 plus 60 = 140
    ```

    A total of 140.

    Now the average rate. The whole time is 5 plus 5 plus 10.

    ```working
        5 plus 5 = 10
        10 plus 10 = 20
    ```

    Twenty units of time. The average rate is the total divided by the time.

    ```working
        140 divided by 20 = 7
    ```

    Seven for each unit of time.

    That 7 is the height of a single rectangle twenty units wide that would hold the same area as
    the three real ones. It is a useful summary and it matches the rate over none of the three
    stretches.
- level: 4
  prompt: |
    Section 3(1) of the National Food Security Act, 2013 entitles a person in a priority household
    to five kilograms of foodgrains per person per month.

    Work out the grain a household of seven is counted for over a full year. Show the rate you used
    and the time you multiplied it by, and give the unit at every line. Then say which figure in
    your working comes from the Act and which are yours.
  answer: |
    Start with the monthly rate for the household.

    ```working
        5 times 7 = 35
    ```

    Thirty-five kilograms a month. The unit comes from the Act's own rate: kilograms per person per
    month, multiplied by seven people, leaves kilograms per month.

    Now multiply by the time.

    ```working
        35 times 12 = 420
    ```

    Four hundred and twenty kilograms.

    Check the unit before accepting it.

    ```working
        kilograms per month, times months
        = kilograms
    ```

    The months cancel, so the answer is a mass and not a rate. Four hundred and twenty kilograms a
    year for the household.

    Which figure is whose. The five kilograms per person per month is the Act's. The seven people,
    the twelve months, the 35 and the 420 are all yours. Say so whenever you quote the 420. A figure that came out of your calculator reads exactly like
    one that came out of a statute.
  refs:
  - nfsa_2013
- level: 5
  prompt: |
    A rate is recorded once a month for six months, in litres a month: 300, 300, 450, 450, 200,
    100.

    Work out the running total after each month, and the total over the six months. Then state the
    assumption the total rests on.
  answer: |
    Each month is one interval, so each amount is that month's rate multiplied by one month.

    ```working
        300 plus 300 = 600
        600 plus 450 = 1050
        1050 plus 450 = 1500
        1500 plus 200 = 1700
        1700 plus 100 = 1800
    ```

    So the running total reads 300, 600, 1,050, 1,500, 1,700 and 1,800 litres.

    The total over the six months is 1,800 litres.

    Check the unit. Litres per month multiplied by months leaves litres, so the answer is a volume
    and not a rate.

    The assumption. Each figure was read once and then treated as the rate for that whole month.
    Where the rate moved inside a month, the rectangle for that month is too tall or too short.
    Nothing in the six readings shows which, and nothing in the total warns you about it.
- level: 5
  prompt: |
    A rate is measured every three months and comes out at 40 units a month, then 60, then 60, then
    20.

    Work out the total across the year. Then work out what you would get by adding the four
    readings, and say what unit that sum is in.
  answer: |
    Each reading stands for a three-month interval, so each amount is the rate multiplied by three
    months.

    ```working
        40 times 3 = 120
        60 times 3 = 180
        60 times 3 = 180
        20 times 3 = 60
    ```

    Now add the four amounts.

    ```working
        120 plus 180 = 300
        300 plus 180 = 480
        480 plus 60 = 540
    ```

    Five hundred and forty units across the year.

    Now the other sum, which is what people write down when they are hurrying.

    ```working
        40 plus 60 = 100
        100 plus 60 = 160
        160 plus 20 = 180
    ```

    A hundred and eighty. Its unit is units a month, because adding four rates gives a rate and
    never an amount.

    So 180 is not a wrong total. It is not a total at all. It is four rates added together, and the
    unit says so before the number does.
- level: 6
  prompt: |
    A quantity accumulates over 8 months and the total comes to 96 kilograms. Over the first 2 months
    the rate was 18 kilograms a month.

    Work out the average rate over the whole 8 months. Then work out the total over the remaining 6
    months, and the average rate over those 6 months.
  answer: |
    This one runs backwards from the total, which is the direction you will need more often than
    the other.

    The average rate over the whole stretch is the total divided by the time.

    ```working
        96 divided by 8 = 12
    ```

    Twelve kilograms a month.

    Now the first two months. Their amount is the rate multiplied by the time.

    ```working
        18 times 2 = 36
    ```

    Thirty-six kilograms. So the remaining six months hold the rest.

    ```working
        96 minus 36 = 60
    ```

    Sixty kilograms over six months. Their average rate is that amount divided by that time.

    ```working
        60 divided by 6 = 10
    ```

    Ten kilograms a month.

    Look at the three figures together. The average over the whole stretch is 12, the early rate was
    18 and the later average is 10. The whole-stretch average sits between them and describes
    neither part.
- level: 7
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
        a tank is filling and the rate is measured at four times
        the readings are 12, 9, 6 and 3 litres a minute
        the total is 12 plus 9 plus 6 plus 3
        12 plus 9 plus 6 plus 3 = 30
        so 30 litres went in
    ```
  answer: |
    The step that broke is the third. Four rates were added together, and a sum of rates is not a
    total.

    The units say it first. Litres a minute added to litres a minute gives litres a minute. The
    answer is labelled litres, so somewhere a unit was dropped rather than cancelled.

    An amount needs a time. Each reading has to be multiplied by the length of the interval it
    stands for, and the working never says what that length is. Take the readings as five minutes
    apart and each rectangle is five minutes wide.

    ```working
        12 times 5 = 60
        9 times 5 = 45
        6 times 5 = 30
        3 times 5 = 15
    ```

    Now add the four amounts.

    ```working
        60 plus 45 = 105
        105 plus 30 = 135
        135 plus 15 = 150
    ```

    A hundred and fifty litres, if the readings are five minutes apart.

    Notice what that means. The broken answer cannot be corrected from what it gives you, because
    the interval was never recorded. Without it there is no total to be had.

    Why it looks reasonable: adding a column of numbers is what a total feels like, and the four
    readings are right there in a column. The arithmetic is correct. The step that never happened
    is the one that leaves no trace on the page.
- level: 8
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
        a figure has months along the bottom and kilograms in the store up the side
        the line runs at about 300 kilograms for all twelve months
        the area under the line is 300 times 12
        300 times 12 = 3600
        so 3,600 kilograms passed through the store during the year
    ```
  answer: |
    The step that broke is the third, and it broke on the side axis rather than on the arithmetic.

    Read the axis label again. It carries kilograms in the store, which is a quantity, not
    kilograms a month, which would be a rate.

    The area under a line is a total only where the side axis carries a rate. Here the area is in
    kilograms multiplied by months, which is not a quantity of grain and not a quantity of anything
    else anybody uses.

    What the figure does say is worth stating, because it is useful and it is not what was claimed.
    The store held about 300 kilograms at every month of the year. The line is flat, so the amount
    in the store did not change.

    What the figure does not say: how much passed through. A store can hold a steady 300 kilograms while
    thousands of kilograms move in and out. It can also hold a steady 300 kilograms with nothing
    moving at all. The picture cannot tell those apart, and that is the next section.

    Why it looks reasonable: the phrase "area under the line" is exactly right for a rate graph. Here
    it has been carried across to a graph of a quantity, and nobody reread the axis. The
    number 3,600 is plausible, has a unit attached, and answers a question nobody could have
    answered from this figure.
- level: 9
  prompt: |
    A note reaches you from a block office.

    > Our vehicle used 8 litres of fuel an hour on the day we measured it. It runs about 6 hours a
    > day. So budget for about 17,500 litres this year.

    The office, the vehicle and all three figures are made up for this problem. No real service is
    being described.

    Decide what to compute, compute it, and say what your answer does not establish.
  answer: |
    What to compute: the daily amount from the rate, and then the yearly total the note is
    claiming, so you can see what it assumed.

    The daily amount is the rate multiplied by the hours.

    ```working
        8 times 6 = 48
    ```

    Forty-eight litres a day. Check the unit: litres an hour multiplied by hours leaves litres.

    Now a year of that.

    ```working
        48 times 365 = 17520
    ```

    About 17,520 litres, so the note's arithmetic holds.

    What this does not establish. It does not establish that the vehicle runs every day of the
    year. Three hundred and sixty-five is the note's own assumption and it is nowhere stated. At
    250 working days the figure is different.

    ```working
        48 times 250 = 12000
    ```

    Twelve thousand litres, which is about a third less.

    It does not establish that 8 litres an hour is the rate on other days. One measurement was
    stretched across a year, which is one rectangle drawn a year wide.

    And it does not establish that six hours is typical. Every one of the three numbers is a single
    reading doing the work of a year of readings.

    What to ask for: the fuel actually drawn over the last twelve months. A count beats a total
    built from one day, and the depot already holds it.
- level: 10
  prompt: |
    A line in a review meeting goes like this.

    > The scheme distributed 24 lakh kilograms of grain last year. The year before it was 20
    > lakh. It is clearly reaching more people than ever.

    The scheme and both figures are made up for this problem. No real scheme is being described.

    Decide what to compute, compute it, and say what your answer does not establish.
  answer: |
    What to compute: the change between the two totals, and what a monthly rate would have to be to
    produce each of them.

    Write both figures out in full first.

    ```working
        24 lakh = 24 times 10^5 = 2400000
        20 lakh = 20 times 10^5 = 2000000
    ```

    Now the change.

    ```working
        2400000 minus 2000000 = 400000
    ```

    Four lakh kilograms more, which as a share of the earlier year is this.

    ```working
        400000 divided by 2000000 = 0.2
    ```

    A fifth more, or twenty per cent.

    Now turn the later total back into a rate, since a total on its own hides the year it came from.

    ```working
        2400000 divided by 12 = 200000
    ```

    Two lakh kilograms a month, averaged across the twelve months.

    What this does not establish. It does not establish that more people were reached. A total of
    grain divided among fewer people, at a larger amount each, gives exactly the same number.
    Kilograms are not people, and the note has swapped one for the other with no working in
    between.

    It does not establish that the rise happened evenly. A yearly total is one rectangle. Two good
    months and ten flat ones give the same total as twelve steady ones.

    And it does not establish that either year met what was owed. That question needs the
    entitlement, the number of people entitled, and a comparison against those. None of the three
    is in the sentence.

    What to ask for: the monthly distribution figures, and the number of people who collected in
    each month. The second is the one the claim was actually about.
retrieval_items:
- q: How do you turn a rate into an amount, and what happens to the units?
  a: Multiply the rate by the length of time it held for. The time unit on the bottom of the rate
    cancels the time you multiplied by, leaving the unit of the quantity itself.
- q: What is the area under a rate-versus-time graph?
  a: The total accumulated over that stretch of time. Each rectangle is one interval's amount, its
    width is the interval and its height is the rate, so the whole area is the running total.
- q: Why is a total only as good as the intervals it was built from?
  a: Because each rectangle assumes the rate held steady across its whole width. Where the rate
    moved inside an interval the rectangle counts too much or too little, and narrower intervals
    shrink that error without removing it.
- q: What is an integral, and what is the sign for it?
  a: The running total under a rate line. It is written with the sign ∫, a stretched letter S for
    sum. Recognising it is all this book asks for.
