must_know:
- point: |
    A bigger sample is not a repair for a biased one. Enlarging a convenience sample tightens its
    estimate of whatever population it actually came from.
  kind: misconception
  bearing: methodological
- point: |
    Before trusting a report's sample size, ask how the people in it were found. A small random
    sample can outperform a huge convenience sample.
  kind: move
  bearing: methodological
- point: |
    Kiran and colleagues' 282 medical students gave 34.8 per cent with a body-mass index of 25 or
    more, worked out from Table 2. The planning figure the authors rounded from NFHS-4 was 20 per
    cent. Size alone cannot tell you what made the two figures differ.
  kind: number
  bearing: methodological
  refs:
  - kiran_2022_muac_nc
- point: |
    The square-root law describes only how a random sample's answer scatters around the population
    it was actually drawn from. Quoting it does not rescue a sample that was never random.
  kind: boundary
  bearing: methodological
- point: |
    Halving the scatter of a sample's average costs four times as many people, every time.
  kind: number
  bearing: methodological
- point: |
    Teach a trainee to name the intended population before looking at a study's sample size. If
    they cannot say who a convenience sample leaves out, they have not learned the part of this
    that matters.
  kind: move
  bearing: teaching
exercises:
- type: critique
  prompt: |
    A hospital's social media post reads: "We surveyed 4,000 followers and found 60 per cent
    support a new clinic timing. With a sample this large, the result is extremely reliable."

    Say what the sample size claim gets right and what it leaves out.
  answer: |
    It is right that 4,000 is a large number. A genuinely random sample of 4,000 would have a
    small spread around whatever population it was drawn from. Size does buy precision against
    sampling variation, and the claim is not wrong about that part.

    What it leaves out is how the 4,000 were chosen. A hospital's social media followers are a
    particular kind of person. They may be more engaged, more online, younger or more urban than
    the hospital's whole patient population. That is a convenience sample, whatever its size.

    So "extremely reliable" is doing two different jobs in that sentence, and only one of them is
    supported. The 60 per cent is a precise estimate of what these 4,000 followers think. It is not
    shown to be a precise estimate of what the hospital's patients, or the public it serves, think.
    Enlarging the survey to 40,000 followers would sharpen the first claim and do nothing for the
    second.
- type: teaching
  prompt: |
    A first-year resident says a colleague's finding "must be right because they had a huge sample
    size." You have ten minutes and a whiteboard.

    Teach them the difference between a sample being big and a sample being random.
  answer: |
    Ten minutes, for someone who expects a mechanism rather than a slogan.

    Draw two circles on the board. Label the first "population" and put a hundred dots in it.
    Circle a random handful of dots inside it and label that circle "sample". Ask what decided
    which dots got circled. The honest answer is: nothing about the dots themselves, only chance.

    Now draw a second population circle. This time circle a cluster of dots sitting together in one
    corner, leaving the rest of the circle untouched. Ask the same question. This time the answer
    is: something about those dots, namely being easy to reach, decided the circling.

    Write the square-root law on the board.

    ```working
        spread of a sample average = spread of the population, divided by square root of sample size
    ```

    Point at the first picture. Say that this formula describes exactly how far the circled dots'
    average will typically sit from the true average of the hundred dots. Say too that a bigger
    circle makes that distance smaller, in a way you can calculate.

    Then point at the second picture. Ask what the formula has to say about the gap between the
    corner cluster's average and the true average of all hundred dots. The honest answer is
    nothing, because the formula was never about that gap. Let the resident sit with that before
    moving on. The move you want them to keep is: ask how a sample was drawn before asking how big
    it was.
quantitative: true
practice:
- level: 1
  prompt: |
    A population has a spread (standard deviation) of 10. Work out the spread of the average of a
    sample of size 4 from it.
  answer: |
    The square-root law: divide the population's spread by the square root of the sample size.

    ```working
        square root of 4 = 2
        10 divided by 2 = 5
    ```

    The spread of the sample average is 5.
- level: 2
  prompt: |
    A population has a spread of 8. Work out the spread of the average of a sample of size 16.
    Then work out the spread of the average of a sample of size 64, and say what happened to it.
  answer: |
    Size 16 first.

    ```working
        square root of 16 = 4
        8 divided by 4 = 2
    ```

    A spread of 2. Now size 64.

    ```working
        square root of 64 = 8
        8 divided by 8 = 1
    ```

    A spread of 1. Sixty-four is four times sixteen, and the spread has gone from 2 to 1: exactly
    halved. That is the square-root law again — four times the sample, half the spread — on a
    different pair of numbers.
- level: 3
  prompt: |
    A population has a spread of 15. What sample size gives a sample average with a spread of 3?
  answer: |
    Run the law backwards. The spread of the sample average is the population's spread divided by
    the square root of the sample size. So the square root of the sample size is the population's
    spread divided by the target spread.

    ```working
        15 divided by 3 = 5
    ```

    The square root of the sample size is 5, so the sample size itself is 5 times 5.

    ```working
        5 times 5 = 25
    ```

    A sample of 25 gives a spread of 3. Check it forwards: square root of 25 is 5, and 15 divided
    by 5 is 3, which matches.
- level: 4
  prompt: |
    Kiran and colleagues report a standard deviation of 3.9 kg/m² for body-mass index among the 131
    men in their sample (Table 1). Suppose a fresh sample of 25 men is drawn from a population with
    that same spread. Work out the spread of that sample's average body-mass index.
  answer: |
    Divide the spread by the square root of the sample size.

    ```working
        square root of 25 = 5
        3.9 divided by 5 = 0.78
    ```

    The spread of the sample average is 0.78 kg/m². Sampled at 25 people, a population this
    variable would typically give an average within a kilogram per square metre of its own true
    average.
  refs:
  - kiran_2022_muac_nc
- level: 5
  prompt: |
    Kiran and colleagues report a body-mass index spread of 3.9 kg/m² for the men in their own
    sample. Suppose a random sample of 131 men is drawn from a population with that same spread.
    Work out the spread of the sample average. Then say what the spread would be for a fresh sample
    of 524 men from the same population.
  answer: |
    First the 131 men.

    ```working
        square root of 131 = 11.4455
        3.9 divided by 11.4455 = 0.3407
    ```

    A spread of about 0.34 kg/m² around the population's own average.

    Now 524 men. 524 is four times 131. The square-root law says four times the sample halves the
    spread, so there is no need to work out a second square root.

    ```working
        0.3407 divided by 2 = 0.17035
    ```

    About 0.17 kg/m². Four times the sample bought exactly half the spread, as the law predicts.
- level: 6
  prompt: |
    Suppose a population's spread for body-mass index is 3.9 kg/m². What sample size would bring
    the spread of the sample average down to 0.1 kg/m²?
  answer: |
    Run the law backwards, as before.

    ```working
        3.9 divided by 0.1 = 39
        39 times 39 = 1521
    ```

    A sample of 1,521 people would be needed. Notice how much bigger this jump is than the jump
    from a spread of 0.34 to 0.17 in the previous problem. The sample size itself is never squared
    here. What gets squared is the factor by which the spread has to shrink.

    ```working
        0.3407 divided by 0.1 = 3.407
        3.407 times 3.407 = 11.607649
        131 times 11.607649 = 1520.602
    ```

    Shrinking the previous problem's spread of about 0.34 down to 0.1 is a shrink of about 3.4
    times. That shrink has to be squared to get the growth in sample size: about 3.4 times 3.4,
    which is roughly 11.6. Multiplying 131 by that comes out close to 1,521, matching the direct
    working above.
  refs:
  - kiran_2022_muac_nc
- level: 7
  prompt: |
    A colleague writes in a report: "Kiran and colleagues' men have a mean body-mass index of 24.2
    kg/m². The standard deviation is 3.9. So the true mean for the population lies between 20.3
    and 28.1."

    Find the step that broke.
  answer: |
    Check the arithmetic first.

    ```working
        24.2 minus 3.9 = 20.3
        24.2 plus 3.9 = 28.1
    ```

    Both sums are right. The step that broke is calling that interval a range for "the true mean".

    The standard deviation, 3.9, describes how the individual men's own body-mass index values are
    spread out around 24.2. It answers how far from the mean one man typically sits. A different
    question is how far the sample's own mean, 24.2, might sit from the true mean of the wider
    population. Answering that needs the spread of the sample average. Suppose, for the moment,
    that these 131 men were a random sample from a population whose spread is 3.9. The square-root
    law then gives that spread from the same two numbers.

    ```working
        square root of 131 = 11.4455
        3.9 divided by 11.4455 = 0.3407
    ```

    A spread of about 0.34 kg/m² for the sample's own mean, not 3.9. That 0.34 describes random
    samples. These men volunteered, so it says nothing about how far 24.2 sits from any wider
    population's mean.

    Why it looks reasonable: both numbers, 24.2 and 3.9, are real figures straight from the same
    table. Adding and subtracting a spread from a mean is exactly the move this section has used
    before. The flaw is using the spread of the people in place of the spread of the average. Those
    are two different numbers describing two different questions.
  refs:
  - kiran_2022_muac_nc
- level: 7
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
        a population has a spread of 50
        a sample of 100 has a spread of 50 divided by square root of 100, which is 5
        doubling the sample to 200 should halve the spread
        so the new spread is 5 divided by 2, which is 2.5
    ```
  answer: |
    The first two lines are right: the square root of 100 is 10, and 50 divided by 10 is 5.

    The step that broke is the third line. The square-root law does not halve when the sample size
    doubles. Halving the spread needs the square root of the sample-size ratio to equal 2. That
    needs the sample size itself to be multiplied by 4, not by 2.

    Work it out properly for a sample of 200.

    ```working
        square root of 200 = 14.142
        50 divided by 14.142 = 3.5355
    ```

    The correct spread at 200 is about 3.54, not 2.5. Doubling the sample only takes the spread down
    to about 71 per cent of what it was, not to half.

    Why it looks reasonable: "double the sample, halve the spread" sounds like the same idea as
    "four times the sample, halve the spread". The two are easy to blur together. The law scales
    with the square root of the sample size, not with the sample size itself. That is exactly the
    distinction this section exists to fix.
- level: 8
  prompt: |
    Here is a note passed round a department.

    ```working
        Kiran and colleagues found 98 of 282 medical students, 34.8%, at a body-mass index of 25 or more
        NFHS-4 gives 20% for young adults nationally
        a sample four times the size, 1,128, would have half the sampling spread by the square-root law
        so a bigger sample would bring the 34.8% much closer to the true national 20%
    ```

    Find the step that broke.
  answer: |
    The first line is worked out from Table 2 and is right: 83 plus 15 is 98, and 98 of 282 is 34.8
    per cent. The second line claims more than the paper does. The paper gives 19 and 21 per cent
    for men and women. It reports these as NFHS-4's figures for India, without saying which ages or
    which people they cover. The authors rounded them to 20 for planning. The
    third line is correct arithmetic. The square-root law really does say that quadrupling a
    random sample's size halves the spread of its average around the population it was drawn from.

    The step that broke is the fourth line, and it is not an arithmetic error. It applies a fact
    about random-sample spread to a gap that random-sample spread never produced. Line 4 also calls
    20 per cent the true national figure. It is the authors' rounded planning number, not a true
    value.

    The 282 medical students were not drawn at random. They were volunteers from one college who
    came forward after an announcement. Nothing in this arithmetic can say why the gap between 34.8
    and 20 per cent is there. It could be that. It could be the years between NFHS-4 and this
    study. It could be how each drew its own line for "overweight". The rounding in the second line
    moves it by at most a point either way.

    Quadrupling the invitation would shrink the spread around whatever these particular medical
    student volunteers answer. It does nothing to settle which of those explanations is right.

    Why it looks reasonable: the square-root law is applied correctly right up to the conclusion. A
    reader who checks only the arithmetic finds nothing wrong. The mistake is in which quantity the
    arithmetic was ever entitled to say something about.
  refs:
  - kiran_2022_muac_nc
- level: 9
  prompt: |
    A colleague sends you this line for a newsletter.

    > Kiran and colleagues found that medical students are far more overweight than India's young
    > adults generally.

    Decide what to compute, compute it, and say what your answer does not establish.
  answer: |
    What to compute: the study's own numbers, and how far they sit from the comparison figure the
    claim leans on. Table 2 puts 83 students at 25 to 29.9 and 15 at 30 or more.

    ```working
        83 plus 15 = 98
        98 divided by 282 = 0.3475177305
    ```

    Ninety-eight of 282 students, about 34.8 per cent, had a body-mass index of 25 or more. The
    researchers themselves used 20 per cent to plan the study. They rounded that from 19 and 21 per
    cent for men and women. The paper reports these as NFHS-4's figures for India, without saying
    which ages or which people they cover. The sample's 34.8 and the planning figure's 20 differ by
    about fifteen percentage points.

    What it is not is a gap the square-root law can explain or explain away. The law describes how
    a random sample's own answer scatters. These 282 were not a random sample of anything. So the
    law has nothing to say about why their figure differs from the authors' planning figure.

    So the arithmetic shows a difference between this sample's figure and the planning figure. What
    it does not establish is the sentence as written.

    "Medical students are far more overweight than India's young adults generally" makes a claim
    about two groups: medical students, and young Indian adults. Said carefully, about 34.8 per cent
    of these 282 students had a body-mass index of 25 or more. That is more than the 20 per cent the
    authors rounded from the paper's NFHS-4 figures.

    The 282 students were volunteers from one college. They came forward after an announcement.
    That is not a random sample of medical students anywhere, still less of young adults generally.
    People who choose to come forward for a study may differ from those who do not. That difference
    need not have anything to do with being a medical student. They may be more health-conscious,
    more curious, or more worried about their weight — or the opposite.

    Nothing in this arithmetic can tell "medical students, as a group, have a higher body-mass
    index" apart from a narrower claim. That narrower claim is "the kind of medical student who
    volunteers for a study like this has a higher body-mass index". A bigger sample of volunteers
    from more colleges would narrow the estimate of what such volunteers look like. It would still
    not answer the question the newsletter line is actually asking.
  refs:
  - kiran_2022_muac_nc
- level: 10
  prompt: |
    A colleague says: "A random sample of 2,000 people can't possibly tell us anything reliable
    about a whole country. You would need several million to get a trustworthy number."

    Decide what to compute, compute it, and say what your answer does not establish.
  answer: |
    What to compute: how the spread of a sample average changes between a sample of 2,000 and a
    sample of several million. Use the square-root law on a stated spread, not a real one, since no
    real figure for this quantity is given.

    Say the quantity being measured has a spread of 40, in whatever units it is recorded in.

    ```working
        square root of 2000 = 44.7214
        40 divided by 44.7214 = 0.8944
    ```

    A sample of 2,000 gives a spread of about 0.89 around the true population average. Now a sample
    of 2 million, a thousand times as large.

    ```working
        square root of 2000000 = 1414.2136
        40 divided by 1414.2136 = 0.0283
    ```

    A spread of about 0.028. Going from 2,000 to 2 million is a thousandfold increase. It only
    shrinks the spread by about thirty-two times. That is because the square-root law shrinks
    spread with the square root of the sample size, not with the sample size itself. The claim that
    "several million" is needed does not follow from how sampling spread behaves. A sample of 2,000
    already has a fairly tight spread relative to the population's own variation. The colleague's
    number is not doing the arithmetic work they think it is.

    Notice that the country's size appears nowhere in this working. The spread of a random sample's
    average depends on the sample's own size, not on the size of the population it was drawn from.
    "A whole country" sounds like it should demand a bigger sample. The
    square-root law has no term for it at all.

    What this does not establish. It does not establish that 2,000 is always enough. The right
    sample size depends on how variable the quantity is, and how tight an answer needs to be.
    Neither of those was stated here.

    It also does not establish that any sample of 2,000 is trustworthy, regardless of how it was
    chosen. Say those 2,000 people were a convenience sample rather than a random one. Then no
    sample size, however large, closes the gap between who was asked and who the answer is supposed
    to be about. This arithmetic only answers "how big a random sample needs to be". It never
    answers "was this particular sample drawn that way".
retrieval_items:
- q: What is the difference between a parameter and a statistic, and what is a statistic sometimes
    called?
  a: A parameter describes the whole population exactly. A statistic is the same kind of number
    computed from a sample, and it is called an estimate of the parameter because the sample is not
    the whole population.
- q: What does the square-root law say happens to the spread of a sample average when the sample
    size is multiplied by four?
  a: The spread is divided by two, because the square root of four is two, and the sample average's
    spread is the population's spread divided by the square root of the sample size.
- q: Why does a bigger convenience sample not fix a biased sample?
  a: A bigger sample shrinks sampling variation, the scatter of a random sample's answer around the
    population it was actually drawn from. It does nothing to close the gap between that population
    and a different, intended population, because that gap is fixed by how the sample was chosen,
    not by its size.
