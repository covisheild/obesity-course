must_know:
- point: |
    Two distributions can share exactly the same range and look nothing alike. The range cannot
    tell the two apart, because it only ever looks at the two most extreme values.
  kind: trap
  bearing: methodological
- point: |
    Before you trust a frequency table's percentages, divide each count by the printed total and
    check you get back the percentage beside it. Then match each label to the band it covers. A
    count can pass the first check and still sit under the wrong label.
  kind: move
  bearing: methodological
- point: |
    A frequency table built from bands has already thrown away the individual values inside each
    band. Ask for the raw values when any of those is what you actually need.
  kind: boundary
  bearing: methodological
- point: |
    Before you explain why two readings differ, decide which of three sources produced it. Call a
    scale's own error a difference between people, and you invent a health difference that is not
    there. Call a real change within a person a measurement glitch, and you miss it.
  kind: move
  bearing: clinical
- point: |
    An instrument that is wrong by the same amount every time gives two matching readings, and
    both are wrong. Two readings agreeing is not, by itself, a reason to trust either one.
  kind: boundary
  bearing: methodological
- point: |
    A single figure, such as the share of a group above one band's edge, says nothing about the
    rest of the group. The edge itself may not sit where you assume it does. Do not let one
    band, or one comparison between two bands, stand in for a whole distribution.
  kind: trap
  bearing: public
exercises:
- type: critique
  prompt: |
    A colleague sends you two facts about the same set of 500 patients' waiting times at a clinic.

    > The shortest wait was 2 minutes and the longest 340, a range of 338 minutes.
    > The average patient waits about 45 minutes.

    They conclude: "So most patients wait somewhere between 2 and 340 minutes." Say what is wrong
    with that conclusion. Say what you would ask for instead.
  answer: |
    The range only tells you the two most extreme waiting times out of the 500. It says nothing
    about where the other 498 patients fall between them. A single patient waiting 340 minutes sets
    the top of the range alone; everybody else could be clustered anywhere below it.

    "Most patients wait somewhere between 2 and 340" is true only in a trivial sense. Every value
    lies between the smallest and the largest. That is not the same claim as most patients waiting
    somewhere in the middle of that stretch. Nothing given so far tells you which is true.

    What to ask for instead: a frequency table of waiting times in useful bands. Or ask how many of
    the 500 patients waited more than an hour. Either one describes where patients actually sit,
    rather than where the two extremes happen to be.
- type: teaching
  prompt: |
    A first-year resident keeps saying "the readings don't match" whenever two measurements on the
    same patient disagree, and treats every mismatch the same way.

    You have ten minutes and a whiteboard. Teach them the three sources of difference, so they
    leave able to ask the right next question about a real disagreement.
  answer: |
    Ten minutes, for somebody who expects a mechanism.

    Draw three labelled boxes on the board: between people, within a person, between measurements.
    Ask the resident for a patient's two weight readings that disagreed, taken at the same visit.

    Ask the first question: were the two readings taken on two different patients by mistake? If
    so, the difference is between people, and it says nothing about either patient's own weight.

    Ask the second: were the two readings taken on the same patient, but hours or days apart? If so,
    part of the gap can be a real change in that one patient. Food, fluid and the time of day can
    each move it, and that is a difference within a person.

    Ask the third: were the two readings taken minutes apart, on the same scale, with nothing about
    the patient changing? If so, any gap left over is a difference between measurements. It comes
    from the scale or from how the reading was taken, not from the patient.

    Close by having them re-sort their own mismatched readings into the three boxes, out loud. The
    box a disagreement lands in decides what they do next: trust the first reading, the second,
    their average, or neither. That decision is the whole reason the three boxes exist.
quantitative: true
practice:
- level: 1
  prompt: |
    A count of 50 events is sorted into four categories with these counts.

    ```working
        10      25      10      5
    ```

    Work out the relative frequency of each category, and check that the four add to 1.
  answer: |
    Divide each count by the total, 50.

    ```working
        10 divided by 50 = 0.2
        25 divided by 50 = 0.5
        10 divided by 50 = 0.2
        5 divided by 50 = 0.1
    ```

    Add the four relative frequencies to check them.

    ```working
        0.2 plus 0.5 = 0.7
        0.7 plus 0.2 = 0.9
        0.9 plus 0.1 = 1.0
    ```

    They add to 1, as every set of relative frequencies covering a whole count must.
- level: 2
  prompt: |
    Work out the range of this list of six numbers.

    ```working
        3   17   9   42   8   15
    ```
  answer: |
    Find the largest and the smallest, then subtract.

    ```working
        largest = 42
        smallest = 3
        42 minus 3 = 39
    ```

    The range is 39.
- level: 3
  prompt: |
    Two sets of six numbers are given below.

    ```table
    set A   10   11   12   13   14   50
    set B   10   20   30   40   45   50
    ```

    Work out the range of each set. Say what you notice, and say what it does not tell you about
    the two sets.
  answer: |
    ```working
        set A: 50 minus 10 = 40
        set B: 50 minus 10 = 40
    ```

    Both sets have a range of 40.

    What it does not tell you: how the six values inside each set are actually spread out. Set A
    sits bunched between 10 and 14, with one value, 50, sitting a long way out on its own. Set B is
    spread almost evenly across the whole distance from 10 to 50. Two sets with the same range can
    have completely different shapes, because the range only ever looks at the two most extreme
    values.
- level: 4
  prompt: |
    Three pairs of readings are listed below, each under stated conditions. For each pair, say
    which source of difference mainly produced the gap. The three are: between people, within a
    person, and between measurements.

    (a) Two different patients are weighed once each, on the same scale. The readings are 58
    kilograms and 71 kilograms.

    (b) The same patient is weighed on Monday morning and again on Friday evening. The readings are
    64.0 kilograms and 65.2 kilograms.

    (c) The same patient is weighed twice on the same scale, one minute apart. Nothing about them
    changes in between. The readings are 70.4 kilograms and 70.6 kilograms.
  answer: |
    (a) Between people. Two different patients were weighed, so the 13-kilogram gap is a real
    difference between them. Nothing here says either reading is wrong.

    (b) Mostly within a person. The same patient gave two different numbers days apart. What they
    ate, what they drank and the time of day can each move a weight reading. Part of the 1.2
    kilograms could still come from the scale, and nothing here separates the two.

    (c) Between measurements. The same patient, the same scale, one minute apart, with nothing
    about the patient changing. The 0.2-kilogram gap came from the act of measuring, not from the
    patient.
- level: 4
  prompt: |
    Table 2 of Kiran et al. (2022) sorts 282 medical students into four bands of body-mass index.
    The counts are 24 under 18.5, 160 from 18.5 to 24.9, 83 from 25 to 29.9, and 15 at 30 or more.

    Work out the relative frequency of the band at 30 or more, and give it as a percentage.
  answer: |
    Divide the count in that band by the total counted.

    ```working
        15 divided by 282 = 0.053191489...
        0.053191489 times 100 = 5.3191489
    ```

    That rounds to about 5.3 per cent, matching the percentage the paper itself prints beside the
    count.
  refs:
  - kiran_2022_muac_nc
- level: 5
  prompt: |
    The same table, split by sex, gives the men's counts across the four bands as 5, 74, 42 and 10.
    There are 131 men in the study.

    Check that the four counts add up to 131. Then work out the relative frequency, among the men
    only, of the band at 30 or more.
  answer: |
    Add the four counts first.

    ```working
        5 plus 74 = 79
        79 plus 42 = 121
        121 plus 10 = 131
    ```

    They add to 131, which matches the stated number of men, so this row of the table passes the
    check.

    Now the relative frequency of the band at 30 or more, among the men.

    ```working
        10 divided by 131 = 0.076335878...
        0.076335878 times 100 = 7.6335878
    ```

    About 7.6 per cent of the 131 men are in that band.
  refs:
  - kiran_2022_muac_nc
- level: 5
  prompt: |
    The same paper, describing what it counts as its own strength, says this.

    > The strength of the study was single observer measurements with minimum inter-observer
    > variation.

    Inter-observer means between different people taking the measurement.

    Say which of the three sources of difference having one observer take every measurement
    reduces, and which two it leaves untouched.
  answer: |
    One observer removes differences between observers. Two different people measuring the same
    student can place the tape or read the scale a little differently. That gap is one kind of
    difference between measurements. One observer, measuring everyone the same way, removes it.

    It does not touch a real difference between the people being measured. Two students still
    really differ in weight and height, whoever measures them.

    It does not touch a real difference within one person from one occasion to the next. If a student
    weighs more in the evening than in the morning, one observer does not change that.

    And it does not remove every difference between measurements, either. The same observer, with
    the same tool on the same person, can still get two slightly different readings a few minutes
    apart. One observer only removes the part of the gap that comes from who holds the tool.
  refs:
  - kiran_2022_muac_nc
- level: 6
  prompt: |
    Among the 151 women in the same study, 41 have a body-mass index from 25 to 29.9, and 5 more
    are at 30 or more.

    Work out what fraction of the 151 women have a body-mass index of 25 or more, as a percentage.
  answer: |
    Add the two bands first, since both are at 25 or more.

    ```working
        41 plus 5 = 46
    ```

    Now divide by the total number of women.

    ```working
        46 divided by 151 = 0.304635762...
        0.304635762 times 100 = 30.4635762
    ```

    About 30.5 per cent of the 151 women have a body-mass index of 25 or more.
  refs:
  - kiran_2022_muac_nc
- level: 7
  prompt: |
    Here is a worked answer to this question, using Table 2 of Kiran et al. (2022): what share of
    the men are in the band from 25 to 29.9?

    ```working
        42 divided by 282 = 0.148936170
        0.148936170 times 100 = 14.8936170
        so about 14.9 per cent of the men are in the band from 25 to 29.9
    ```

    Find the step that broke.
  answer: |
    The division itself is correct arithmetic. The step that broke is the choice of denominator:
    282 is the total number of students, not the total number of men.

    There are 131 men, not 282, and the 42 is a count of men. Divide by the count it actually came
    out of.

    ```working
        42 divided by 131 = 0.320610687...
        0.320610687 times 100 = 32.0610687
    ```

    About 32.1 per cent of the men are in that band, not 14.9 per cent.

    Why it looks reasonable: 282 is a number from the very same table. It is also the biggest number
    on the page, which makes it look like the obvious total to divide by. The table has more than
    one total in it: one for everybody, one for each sex. Only one of them matches the count in the
    numerator.
- level: 8
  prompt: |
    A colleague looks at Table 2 of Kiran et al. (2022) and says this.

    "The band under 18.5 holds 8.5 per cent of the 282 students, and the band at 30 or more holds
    5.3 per cent. Those two are close in size, so the distribution of body-mass index in this
    sample must be roughly symmetric."

    Find the flaw in that reasoning.
  answer: |
    Two bands being close in size is not the same claim as the whole distribution being symmetric.
    Symmetry is about how far every value sits from the middle, on both sides. It is not about how
    many people fall into two chosen bands at the edges.

    The flaw is that band counts depend on where the band edges fall. The band "under 18.5" and the
    band "30 or more" are both open-ended, and the table does not say how far either one actually
    reaches. Comparing their sizes tests nothing about shape. A wide-reaching open band and a
    narrow one can hold similar counts for reasons that have nothing to do with symmetry.

    The comparison also rests on very little of the sample.

    ```working
        24 plus 15 = 39
        282 minus 39 = 243
    ```

    The two bands being compared hold 39 students between them. The other 243, in the two middle
    bands, never enter the comparison at all.

    Why it looks reasonable: 8.5 and 5.3 really are close numbers, and "the two ends look similar"
    sounds like exactly what symmetry means. It checks only the two ends, and it never looks at
    where the other 243 students, out of 282, actually are.
- level: 9
  prompt: |
    A note about the same study says this.

    "In our sample of 282 students, body-mass index ranges from underweight to 30 or more. So weight
    varies enormously in this group."

    Underweight is the paper's name for its band under 18.5.

    Decide what to compute, compute it, and say what your answer does not establish.
  answer: |
    What to compute: where the 282 students actually sit across the four bands, rather than just
    which bands are occupied.

    ```working
        24 plus 160 = 184
        184 plus 83 = 267
        267 plus 15 = 282
    ```

    Well over half of the group, 160 of 282, sits in one single band, from 18.5 to 24.9. Only 24
    students, 8.5 per cent, are below it. Add the two bands above it.

    ```working
        83 plus 15 = 98
    ```

    So 98 students, about a third of the group, are above it.

    What this does not establish. Naming the two extreme bands says nothing about how many people
    are actually in them. Here it is a small minority on the low side and a larger minority on the
    high side. Of the 282, 160 sit in the one band from 18.5 to 24.9.

    It also does not establish the true range of body-mass index in this sample. Once every value
    has been sorted into one of four bands, the single largest and single smallest values are gone.
    No band boundary can give them back. "Varies enormously" needs the individual numbers this
    table no longer holds.

    And a spread of body-mass index bands is not a spread of weight. The table sorts body-mass
    index, not weight. Two students with the same index can differ in weight by many kilograms if
    their heights differ. The note's own last sentence swaps one quantity for another without
    saying so.
  refs:
  - kiran_2022_muac_nc
retrieval_items:
- q: What is a distribution, and what does a frequency table do with it?
  a: A distribution is the set of values a quantity takes, together with how often each value turns
    up. A frequency table lists each value or band against a count of how many times it occurred.
- q: What check should you run on a frequency table before trusting its percentages?
  a: Divide each count by the printed total and check that you get back the percentage printed
    beside it. A table that fails the check should not be used until the mismatch is resolved.
- q: Name the three sources of difference that can produce a spread of measured values.
  a: A real difference between the people or things measured, a real difference within one person
    or thing over time, and a difference between repeated measurements produced by the act of
    measuring itself.
