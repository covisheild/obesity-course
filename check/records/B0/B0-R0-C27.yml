definition:
  text: |
    A distribution is the set of values a quantity takes, across the people, occasions or
    measurements counted, together with how often each value turns up.

    A frequency table lists each value, or each band of values, against the count of times it
    occurred. Dividing a count by the total number counted gives the relative frequency.

    The range of a distribution is its largest value minus its smallest.

    The shape of a distribution describes where its values sit relative to each other. They can be
    bunched together near the middle, or spread evenly across it. Or they can thin out slowly on
    one side and quickly on the other, which is a long tail.

    A spread of measured values comes from one or more of three sources. It can be a real
    difference between the people or things measured. It can be a real difference within one
    person or thing from one occasion to another. Or it can be a difference between repeated
    measurements of the same person or thing at the same moment.
