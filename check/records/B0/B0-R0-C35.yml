simplified_explanation: |
  Everything alive is made of cells.

  A cell is a bag of watery jelly with a skin round it. The skin has a name: the plasma membrane.

  The nucleus is the compartment that holds the cell's instructions, which are written in its DNA.

  The ribosomes are the machines that build proteins.

  The mitochondria make a small molecule called adenosine triphosphate, written ATP, which the cell
  uses to carry energy from one reaction to another.

  The membrane is built out of one kind of molecule, and that molecule has two ends that behave
  differently. One end mixes with water. The other end will not mix with water and mixes with
  grease instead.

  Put a lot of them in water and they sort themselves out. The water-hating ends turn inwards and
  huddle together, away from the water. The water-loving ends turn outwards, where the water is.
  What you get is a sheet two molecules thick.

  So a membrane is wet on both faces and greasy in the middle.

  A molecule that dissolves in grease can slip through the greasy middle on its own. A molecule
  that dissolves in water cannot, and has to be carried across. The carrying is done by proteins
  that sit in the membrane and take things through.

  A protein is a chain. The links of the chain are called amino acids, and there is a small fixed
  set of kinds. The chain folds up into a shape, and the shape is decided by the order of the
  links.

  The shape is what the protein does. Not the chain, the shape. Change the shape and you change
  what it does, and a shape that is pulled apart far enough stops working altogether. Heat does
  that. So does acid.

  An enzyme is a protein that makes one particular reaction go faster. It works because of its
  shape: the thing it acts on fits into it. Every enzyme speeds its reaction up.

  Some proteins are shaped so that one particular molecule fits into them. The molecule that fits
  is called the ligand. The protein it fits into is called the receptor.

  When the ligand sits in the receptor, the receptor changes shape. The new shape does something
  the old shape could not do.

  A water-hating ligand crosses the membrane on its own, so its receptor can sit inside the cell. A
  water-loving ligand cannot cross, so its receptor sits in the membrane itself, sticking out on
  both sides. The ligand lands on the outside end and never enters. The inside end changes shape
  and carries the message in.
illustration:
  body: |
    Nearly everyone who has met the membrane once remembers the phrase selectively permeable. Go
    and find it.

    Open OpenStax Biology 2e, section 5.1, Components and Structure, at
    https://openstax.org/books/biology-2e/pages/5-1-components-and-structure. Open your browser's
    find box. Type the words selectively permeable and press enter.

    Nothing. The section that describes the membrane does not use the phrase anywhere.

    Now search the same page for the word exclude. One sentence comes up.

    > Cells exclude some substances, take in others, and excrete still others, all in controlled
    > quantities.

    It says the membrane picks.

    Take a glass of water. Pour in a spoonful of cooking oil. Stir it hard, then stop and watch.
    The oil comes back together and sits apart from the water.

    Now read the phospholipid paragraph on the page you already have open, with that glass in front
    of you.

    > ...phospholipids arrange themselves with their hydrophobic tails facing each other and their
    > hydrophilic heads facing out.

    Hydrophilic means water-loving, and hydrophobic means water-hating.

    Draw the result on paper. Two rows of molecules. Tails pointing at each other in the middle,
    heads facing out on both sides.

    Open section 9.1, Signaling Molecules and Cellular Receptors, at
    https://openstax.org/books/biology-2e/pages/9-1-signaling-molecules-and-cellular-receptors.
    Search inside it for the word hydrophobic.

    > ...respond to hydrophobic ligand molecules that are able to travel across the plasma
    > membrane.

    Water-hating molecules travel across the membrane.

    A signal arriving at a cell is a molecule. The word for it is the ligand, which means the thing
    that binds. The protein it binds to is the receptor.

    Take any claim that a substance acts on the body and ask three questions in order. What is the
    molecule? What does it bind? What changes when it binds?

    The third question is the one that does the work. A claim that cannot answer it has described
    something that was present, not something that acted.
  analogy_breaks_when: |
    The glass of oil and water gets you the greasy middle and nothing else. A membrane is not a
    puddle.

    Water-hating in, water-loving out is a rule with real exceptions, and the book says so itself.
    The membrane controls the passage of water too, and water is the most water-loving thing there
    is. Take the rule as telling you what usually crosses unaided, not as a law about every
    molecule.

    The key-in-a-lock picture for a ligand and a receptor breaks in two places. A lock does not
    change shape when the key turns, and a receptor does, and that change is the entire point. And
    one key can open more than one kind of lock here: the same signal can reach several kinds of
    cell.

    Binding and acting are not the same event. Something can sit in a receptor and do nothing, and
    something can sit in it and stop the usual ligand getting in.

    This whole section is about what can happen and never about how much. Any question that has a
    number in its answer is outside it.
must_know:
- point: |
    A substance being present in a tissue is not the same as it acting there. So ask which
    cells carry the receptor before you accept any claim about where a medicine works.
  kind: misconception
  bearing: clinical
- point: |
    Ask three questions of every mechanism claim, in this order. What is the molecule, what does it
    bind, and what changes when it binds.
  kind: move
  bearing: methodological
- point: |
    Binding and acting are two claims, not one. A molecule can sit in a receptor and do nothing, or
    sit in it and keep the usual ligand out.
  kind: trap
  bearing: methodological
- point: |
    A protein's shape is what it does, so anything that changes the shape changes the job. So
    before you accept that a protein can be given by mouth, ask what the stomach does to it.
  kind: consequence
  bearing: clinical
- point: |
    Refuse any claim that a mechanism settles whether an effect is big enough to matter. A
    mechanism tells you what can happen and never how much.
  kind: boundary
  bearing: methodological
- point: |
    When a product claims to work at the cellular level, ask what it binds and what changes when it
    does. The phrase names no molecule and no receptor, so it commits to nothing.
  kind: move
  bearing: public
- point: |
    Teach the two receptor places before you teach a single drug. A water-hating signal crosses the
    membrane and meets its receptor inside; everything else is handled by a receptor built through
    the wall.
  kind: move
  bearing: teaching
- point: |
    An enzyme makes one reaction go faster, and its shape is the reason. Ask which enzyme, and ask
    how the rate was measured.
  kind: move
  bearing: public
exercises:
- type: retrieval
  prompt: |
    Without looking back, write down what happens from the moment a signal molecule reaches a cell
    to the moment something changes inside it. Do it twice: once for a water-hating signal and once
    for a water-loving one.

    Then say, in one sentence, why the two go different ways.
  answer: |
    The water-hating signal first. It dissolves in grease, so it crosses the middle of the membrane
    on its own. Inside the cell it meets its receptor, which is waiting in the jelly. It fits into
    it. The receptor changes shape. The new shape does a job the old shape could not.

    Now the water-loving signal. It cannot cross the greasy middle, so it never enters. Its
    receptor is built right through the membrane, with one end outside and one end inside. The
    signal lands on the outside end and stays there. The receptor changes shape. The inside end,
    now a different shape, starts something happening inside the cell.

    Why the two go different ways. The middle of the membrane is greasy. So what dissolves in
    grease goes through, and what dissolves in water does not.

    One thing to check in your own answer. Did you write the shape change in both versions? That is
    the event. A version that stops at "it binds" has left out the part that does the work.
  confidence_first: true
- type: critique
  prompt: |
    A company sheet for a herbal capsule says this.

    > The active molecule has been shown to bind the same receptor as the prescription medicine. It
    > therefore has the same action, without the side effects.

    Say what is wrong, and say what you would ask for. The capsule and the sheet are made up for
    this exercise.
  answer: |
    Take the two sentences separately, because the first one may well be true and the second does
    not follow from it.

    The first sentence is a binding claim. It says the molecule fits into that receptor. On its own
    that is checkable and it may be right.

    The second sentence is an action claim, and it is a different claim. A ligand binds a receptor,
    and in some cases delivers a signal in the process. In some cases. Three things can happen when
    a molecule sits in a receptor. It can change the shape the way the usual ligand does, and the
    usual thing happens. It can change it some other way. Or it can sit there, change nothing, and
    keep the usual ligand out, so less happens than before.

    The sheet has picked the first of those three and reported it as though binding settled it.
    Nothing in a binding result chooses between them.

    The last clause is a third claim again. Side effects come from everywhere else the molecule
    goes and everything else it binds. A sheet that has measured one receptor has measured nothing
    about the rest. "No side effects" from that evidence is a claim about what nobody looked for.

    What to ask for. First, what happened downstream in a cell that carries the receptor, not just
    whether binding occurred. Second, what else the molecule binds. Third, at what amount the
    binding was seen, and whether a person taking the capsule reaches it.

    And say the size point out loud, because it is the one that gets waved through. Binding at some
    concentration in a dish tells you the shapes fit. It does not tell you the effect is big enough
    to matter in a person.
- type: teaching
  prompt: |
    A first-year resident has ten minutes and a whiteboard. They can recite that insulin acts on
    cells, and they cannot say what "acts on" means.

    Teach them the membrane and the receptor so that they leave able to place a drug they have
    never met.
  answer: |
    Ten minutes, a whiteboard, and somebody who wants a mechanism rather than a rule.

    Draw the membrane first, and draw it as two rows of lollipops with the sticks pointing at each
    other. Heads out on both sides, sticks meeting in the middle. Then write two words on the
    board: wet outside, greasy inside. Do not say anything about drugs yet.

    Ask them which of two molecules gets through on its own: one that dissolves in water, or one
    that dissolves in oil. They will get it right, because you have drawn the answer. That is the
    moment to stop and let them see they have just derived something rather than been told it.

    Now put a receptor on the board. Draw a shape with a notch in it and a small molecule that fits
    the notch. Say the two names once: the small molecule is the ligand, the notched protein is the
    receptor.

    Then draw the same protein again with the ligand sitting in the notch, and draw it a different
    shape. That second drawing is the whole lesson. The event is not the arrival. The event is the
    shape change.

    Now put the two ideas together and let them do it. Ask where the receptor has to be for an
    oil-loving signal, and where it has to be for a water-loving one. They will place the first
    inside the cell and the second through the wall. They have now built the general rule
    themselves.

    Close with the thing you want them using on Monday. When they meet a new drug, three questions,
    in order. What is the molecule. What does it bind. What changes when it binds. Tell them the
    third question is the one that is usually missing. A drug they cannot answer it for is a drug
    they do not yet understand.
retrieval_items:
- q: What is a cell, and what is the membrane round it made of?
  a: A cell is the smallest unit of a living thing. Its membrane is a double layer of phospholipid
    molecules, arranged with their water-hating tails facing each other in the middle and their
    water-loving heads facing out on both sides.
- q: Why does a membrane let some things through and not others?
  a: Because its middle is greasy and its two faces are wet. A molecule that dissolves in grease can
    cross it unaided. One that dissolves in water cannot, and has to be carried across by a protein
    in the membrane, which costs the cell energy when the movement is against a concentration
    gradient.
- q: What decides what a protein does?
  a: Its shape, which comes from the order of the amino acids in its chain. Change the shape and you
    change the job; unfold it far enough, with heat or acid, and it stops working.
- q: What happens when a ligand binds a receptor?
  a: The receptor changes shape, and the new shape does something the old shape could not. Binding
    alone is not the event; the shape change is, and a molecule can bind without producing the usual
    effect or bind and block the usual ligand.
- q: Where does a receptor sit, and what decides which place?
  a: Inside the cell for a water-hating ligand, which crosses the membrane by itself. Through the
    membrane for everything else, with the ligand landing on the outer end and the inner end passing
    the message on without the ligand ever entering.
