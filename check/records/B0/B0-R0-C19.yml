  - nfsa_2013
retrieval_items:
- q: What are the four things to check on a graph, and in what order?
  a: The quantity on each axis, the unit on each axis, the scale printed on each axis, and only
    then the shape of the line.
- q: What is a slope, and what unit does it carry?
  a: The rise divided by the run between two points on a straight line. Its unit is the y-axis unit
    divided by the x-axis unit, which makes every slope a rate.
- q: When does the intercept on the y-axis mean something about the world?
  a: Only when zero is a value the x quantity can actually take. Otherwise it is a property of the
    drawn line and not a fact anybody can check.
- q: Two figures of the same numbers look completely different. What is the first thing to look at?
  a: The numbers printed on the side axis. A shorter span of them makes the same change fill more
    of the picture, and both figures can be honest.
