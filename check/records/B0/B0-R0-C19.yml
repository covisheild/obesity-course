must_know:
- point: |
    Read both axes, with their units, before you look at the shape of anything. A figure you have
    reacted to before reading its axes is a figure you have not read.
  kind: move
  bearing: methodological
- point: |
    A steep line is not a large effect. Steepness is set by the scale, and the scale was chosen by
    whoever drew the figure, so it is not a measurement of anything.
  kind: misconception
  bearing: methodological
- point: |
    A side axis that does not start at zero makes every small wiggle on it look like a cliff. Look
    at the first number on that axis before you call a rise sharp. Say the number out loud whenever
    you describe the figure to anybody.
  kind: trap
  bearing: methodological
- point: |
    A slope carries the y unit divided by the x unit. Quote it with that unit attached, because
    "twenty kilograms a month" is a claim somebody can check and "twenty" is not.
  kind: move
  bearing: methodological
- point: |
    An intercept is a fact about the world only where zero is a value the bottom quantity can
    actually take. Where it cannot, you are quoting the drawing rather than the data. A number like
    that, said once in a committee room, gets repeated for years.
  kind: boundary
  bearing: policy
- point: |
    When a figure alarms you, redraw it with the side axis starting at zero before you repeat it to
    a journalist. If the alarm survives, it was in the numbers. If it does not, it was in the
    drawing.
  kind: move
  bearing: public
- point: |
    Teach a trainee to read a figure in a fixed order: axes, then units, then the numbers on the
    scale, then the shape. Reading the shape first is what produces a confident wrong summary.
  kind: move
  bearing: teaching
- point: |
    Before you read a value off any printed chart in clinic, find what one small division on each
    axis stands for. Two charts of the same quantity often use different divisions, and the eye
    does not notice the change.
  kind: move
  bearing: clinical
exercises:
- type: interpretation
  prompt: |
    Two figures are printed side by side. Both plot the same seven monthly values of one quantity.
    The left figure has a side axis running from 0 to 100. The right figure has a side axis running
    from 58 to 66. The values run from 60 up to 64.

    Say what each figure shows and what neither of them shows. Then say which you would print, and
    why.
  answer: |
    Both figures show the same seven numbers. Neither is false.

    The left figure shows a quantity that barely moves against the full height of the axis. A
    change of 4 sits in a height of 100.

    ```working
        64 minus 60 = 4
        4 divided by 100 = 0.04
    ```

    So the line uses four per cent of the height, and the picture reads as flat.

    The right figure shows the same change of 4 in a height of 8.

    ```working
        66 minus 58 = 8
        4 divided by 8 = 0.5
    ```

    Half the height. The same rise now crosses the middle of the picture and reads as a climb.

    What neither shows: whether a change of 4 matters. That question is settled by what the
    quantity is, how precisely it was measured, and what counts as a difference worth acting on.
    None of those three is in either drawing.

    Which to print: the one whose axis you are willing to defend out loud. Printing the full-height
    version and saying the change is small is honest. Printing the short-axis version is also
    honest, as long as the caption says the axis starts at 58. The defect is not a short axis. It
    is a short axis that the caption does not mention.
  confidence_first: true
- type: critique
  prompt: |
    A slide in a meeting shows a straight line rising across the whole picture. The speaker says:

    > You can see the effect is dramatic. Look at the slope.

    The side axis is labelled in kilograms and runs from 19.8 to 20.4. The bottom axis is labelled
    in months and runs from 0 to 12.

    Say what is wrong with what the speaker said, and say what you would ask for.
  answer: |
    What is wrong: the speaker has read the steepness as though it measured the size of the change.
    It does not. The steepness was set when somebody chose the side axis.

    Work out what the axis actually holds.

    ```working
        20.4 minus 19.8 = 0.6
    ```

    Six tenths of a kilogram, across the whole height of the slide. So a line that climbs from the
    bottom of the picture to the top is a change of at most 0.6 kg over twelve months.

    Now the slope, with its unit taken off the axes.

    ```working
        0.6 divided by 12 = 0.05
    ```

    Five hundredths of a kilogram a month. Say it with the unit, because the unit is the part that
    makes it checkable.

    What to ask for. First, the same figure with the side axis starting at zero, which takes one
    minute and settles the argument. Second, what change would have been large enough to act on,
    decided before the figure was drawn. Third, the spread of the underlying values, since a line
    drawn through scattered points hides how scattered they were.

    What not to say: that the speaker is wrong about the numbers. They are not. They are wrong
    about what a picture can measure.
- type: teaching
  prompt: |
    A health secretary has one page and three minutes. They have been shown two figures of the same
    data by two different groups, and the figures look nothing alike. They want to know which one
    to believe.

    Write what you would put on that page.
  answer: |
    Answer first, because that is what the page is for.

    Both figures are correct. They plot the same numbers. They look different because the two
    groups chose different heights for the side axis, and nothing stops either of them doing that.

    Then the one thing to do about it. Ask for both figures redrawn with the side axis starting at
    zero and ending at the same value. Any two figures of one set of numbers then look identical,
    and the argument moves to where it belongs.

    Then the question that actually decides the matter. How big a change is worth acting on here,
    and who decided that? Until somebody answers it, no figure of any shape settles anything,
    because the picture cannot tell you what counts as big.

    Then one sentence on what to watch for in future submissions. A side axis that does not start
    at zero is not a fault, and a caption that does not say so is.

    No methods section. The secretary does not need to know how a slope is computed. They need to
    know that steepness is a choice and that the size of the change is not.
quantitative: true
practice:
- level: 1
  prompt: |
    A straight line passes through the points (2, 7) and (6, 19).

    Work out its rise, its run and its slope.
  answer: |
    The rise is the change in the second number of each pair.

    ```working
        19 minus 7 = 12
    ```

    The run is the change in the first number of each pair.

    ```working
        6 minus 2 = 4
    ```

    The slope is the rise divided by the run.

    ```working
        12 divided by 4 = 3
    ```

    The slope is 3. There are no units here, because the two quantities were not named.
- level: 2
  prompt: |
    Work out the slope of the line through each of these pairs of points.

    ```working
        (0, 5) and (4, 13)
        (1, 10) and (6, 10)
        (2, 20) and (7, 5)
    ```
  answer: |
    Take each one as rise divided by run.

    The first.

    ```working
        13 minus 5 = 8
        4 minus 0 = 4
        8 divided by 4 = 2
    ```

    The second.

    ```working
        10 minus 10 = 0
        6 minus 1 = 5
        0 divided by 5 = 0
    ```

    A slope of zero. The line is flat, which is what a slope of zero means: the y quantity does not
    change as the x quantity does.

    The third.

    ```working
        5 minus 20 = -15
        7 minus 2 = 5
        -15 divided by 5 = -3
    ```

    A slope of minus 3. The minus sign says the line falls as you go right, and the 3 says how
    fast.
- level: 2
  prompt: |
    A straight line goes through (0, 12) and (5, 27).

    Work out the slope, and write down the intercept on the y-axis. Then say what the intercept is
    the value of.
  answer: |
    The slope first.

    ```working
        27 minus 12 = 15
        5 minus 0 = 5
        15 divided by 5 = 3
    ```

    The slope is 3.

    The intercept is the value of y where x is zero, and one of the two points given has x equal to
    zero. So the intercept is 12, read straight off that point.

    The intercept is the value the y quantity takes when the x quantity is nothing at all. It is
    not where the line starts, and it is not the smallest value on the line. Lines run in both
    directions.
- level: 3
  prompt: |
    A straight line has a slope of 4 and an intercept of 6 on the y-axis.

    Work out y at x equal to 0, 1, 3 and 10. Then work out the x at which y reaches 46.
  answer: |
    The slope of 4 means y goes up by 4 for every 1 across. The intercept of 6 is the value at
    x equal to zero, so start there and add 4 each step.

    ```working
        y at 0 = 6
        6 plus 4 = 10
    ```

    So y is 10 at x equal to 1.

    ```working
        4 times 3 = 12
        12 plus 6 = 18
    ```

    So y is 18 at x equal to 3.

    ```working
        4 times 10 = 40
        40 plus 6 = 46
    ```

    So y is 46 at x equal to 10.

    The last part is already answered by the line above, and it is worth seeing why. You were asked
    where y reaches 46, and the working ran the other way: take the intercept off first, then undo
    the multiplying.

    ```working
        46 minus 6 = 40
        40 divided by 4 = 10
    ```

    At x equal to 10.
- level: 4
  prompt: |
    A line is drawn with kilograms of grain in a house up the side and months along the bottom. It
    passes through the point at one month and 30 kilograms, and the point at five months and
    110 kilograms.

    Work out the slope, give it with its unit, and say where the line meets the side axis.
  answer: |
    Rise first, from the side axis.

    ```working
        110 minus 30 = 80
    ```

    Then the run, from the bottom axis.

    ```working
        5 minus 1 = 4
    ```

    Then the slope.

    ```working
        80 divided by 4 = 20
    ```

    Now the unit, taken off the axes. Kilograms up the side and months along the bottom give
    kilograms divided by months, which is kilograms per month. So the slope is 20 kilograms a
    month.

    For the intercept, walk back from the point at one month by one month's worth of grain.

    ```working
        30 minus 20 = 10
    ```

    The line meets the side axis at 10 kilograms. That is the grain in the house at month zero.
- level: 5
  prompt: |
    Section 3(1) of the National Food Security Act, 2013 entitles a person in a priority household
    to five kilograms of foodgrains per person per month.

    A figure plots kilograms a month up the side against the number of people along the bottom, for
    households of one to eight people. Work out the slope from the points for three people and
    seven people. Give it with its unit. Then say what the intercept is and whether it means
    anything.
  answer: |
    Work out the two points from the rule first.

    ```working
        5 times 3 = 15
        5 times 7 = 35
    ```

    So the figure has a point at three people and 15 kilograms, and one at seven people and
    35 kilograms.

    Rise.

    ```working
        35 minus 15 = 20
    ```

    Run.

    ```working
        7 minus 3 = 4
    ```

    Slope.

    ```working
        20 divided by 4 = 5
    ```

    The unit comes off the axes. Kilograms a month up the side, people along the bottom, so the
    slope is 5 kilograms per person per month. That is the figure section 3(1) states, recovered
    from the drawing.

    The intercept is at zero people and zero kilograms. As arithmetic it is correct. As a statement
    about the world it means the grain for a household with nobody in it, and there is no such
    household. So the intercept here is a property of the line and not a fact you can check.
  refs:
  - nfsa_2013
- level: 5
  prompt: |
    A quantity is measured once a month for a year. The smallest value is 60 and the largest is 64.

    One figure draws it with the side axis running from 0 to 100. Another draws it with the side
    axis running from 59 to 67.

    Work out what fraction of the height of each figure the change takes up. Then say what that
    means for somebody looking at the two figures side by side.
  answer: |
    The change is the same in both figures.

    ```working
        64 minus 60 = 4
    ```

    Four. Now the height each axis offers.

    ```working
        100 minus 0 = 100
        4 divided by 100 = 0.04
    ```

    Four hundredths of the height in the first figure.

    ```working
        67 minus 59 = 8
        4 divided by 8 = 0.5
    ```

    Half the height in the second.

    What it means: the same change occupies four per cent of one picture and half of the
    other. A reader who looks at the shape sees a flat line and a steep climb. A reader who reads
    the axis numbers sees a change of 4 in both, because there is a change of 4 in both.
- level: 6
  prompt: |
    Work out the unit of the slope of a line drawn on each of these pairs of axes.

    ```table
    up the side              along the bottom
    kilograms                months
    kilocalories             grams
    rupees                   kilograms
    number of people         square kilometres
    ```
  answer: |
    The unit of a slope is always the side unit divided by the bottom unit. Take them in order.

    Kilograms divided by months is kilograms per month.

    Kilocalories divided by grams is kilocalories per gram, which is an energy in every gram of
    something.

    Rupees divided by kilograms is rupees per kilogram, which is a price.

    People divided by square kilometres is people per square kilometre, which is a density of
    people.

    None of those four came from looking at the line. They came from reading the two axis labels,
    which is why a figure with an unlabelled axis has a slope you cannot state.
- level: 7
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
        a line passes through (2, 30) and (8, 90)
        the run is 8 minus 2, which is 6
        the rise is 90 minus 30, which is 60
        the slope is the run divided by the rise
        6 divided by 60 = 0.1
        so the slope is 0.1
    ```
  answer: |
    The step that broke is the fourth. The rise and the run were worked out correctly and then
    divided the wrong way round.

    A slope is the rise divided by the run, not the run divided by the rise.

    ```working
        60 divided by 6 = 10
    ```

    The slope is 10.

    Check it against the picture. Between the two points the line goes up 60 while it goes across
    6, so it climbs steeply. A slope of 0.1 describes a line that is nearly flat, which is the
    opposite of the line described.

    The units catch it too, when the axes are labelled. Put kilograms up the side and months along
    the bottom: the broken answer is in months per kilogram, and nobody asked for that.

    Why it looks reasonable: both subtractions are right, the division is right, and the answer is
    a tidy number. The one wrong step is the one with no arithmetic in it.
- level: 8
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
        figure A rises across the whole picture, from the bottom left to the top right
        figure B rises only a little, staying near the bottom
        figure A is steeper than figure B
        so the quantity in figure A changed more than the quantity in figure B
        figure A's side axis runs from 19.8 to 20.4
        figure B's side axis runs from 0 to 200
    ```
  answer: |
    The step that broke is the fourth. Steepness was read as though it measured the change, and the
    last two lines are the evidence that it does not.

    Work out what each axis can hold.

    ```working
        20.4 minus 19.8 = 0.6
    ```

    Figure A's whole height is six tenths of a unit. A line crossing all of it has changed by at
    most 0.6.

    ```working
        200 minus 0 = 200
    ```

    Figure B's whole height is 200 units. A line staying near the bottom, say a fifth of the way
    up, has changed by 40.

    ```working
        200 divided by 5 = 40
    ```

    So the figure that looks flat carries the larger change, by a wide margin.

    The order to work in: read the numbers on each axis, then the values, then the shape. The
    broken answer read the shape first and never revisited it.

    Why it looks reasonable: lines three and four sound like the same statement said twice, and the
    step between them is the whole error. The numbers on both axes are even printed in the working, so
    the answer had what it needed and did not use it.
- level: 9
  prompt: |
    A press line crosses your desk.

    > The chart is almost vertical. The average bag of grain leaving the depot has shot up over the
    > last six months.

    You open the chart. The side axis runs from 4.90 to 5.10 kilograms. The line goes from 4.95 at
    the start to 5.02 at the end. All four figures are made up for this problem.

    Decide what to compute, compute it, and say what your answer does not establish.
  answer: |
    What to compute: the size of the change in the unit of the axis, and the slope with its unit.
    The steepness is not computable as anything, because it is a choice.

    The change first.

    ```working
        5.02 minus 4.95 = 0.07
    ```

    Seven hundredths of a kilogram, across six months.

    Now the slope.

    ```working
        0.07 divided by 6 = 0.0117
    ```

    About 0.012 kilograms a month. Say the unit, because the number on its own is what let the
    press line happen.

    And the reason the line looks vertical.

    ```working
        5.10 minus 4.90 = 0.2
        0.07 divided by 0.2 = 0.35
    ```

    The change uses about a third of the height of a picture whose whole height is two tenths of a
    unit.

    What this does not establish. It does not establish that a change of 0.07 is small. Small and
    large are decided by what the quantity is, and by who set a threshold. Arithmetic does not
    decide it. It does not establish that the change is real either, since two readings six months
    apart carry whatever the weighing itself varies by. And it does not establish that anything
    shot up, because a drawing cannot carry that claim. What you have shown is that the word "vertical"
    describes the axis and not the data.
- level: 10
  prompt: |
    A note from a district office says this.

    > We plotted grain against household size for our blocks and fitted a straight line. The line
    > crosses the side axis at 12 kilograms. So even a household with nobody in it is being counted
    > for 12 kilograms a month, which is leakage we should recover.

    Decide what to compute, compute it, and say what your answer does not establish.
  answer: |
    What to compute: what the entitlement rule says the intercept should be, and what an intercept
    of 12 would have to mean.

    Section 3(1) of the National Food Security Act, 2013 entitles a person in a priority household
    to five kilograms of foodgrains per person per month. So the rule gives zero for zero people.

    ```working
        5 times 0 = 0
    ```

    The rule's own intercept is zero.

    Now take the note's line seriously for one step. At one person it would give 12 plus 5.

    ```working
        12 plus 5 = 17
    ```

    Seventeen kilograms for one person, against the five the Act states. At four people it gives 32
    against 20.

    ```working
        5 times 4 = 20
        20 plus 12 = 32
    ```

    So if the fitted line were true of the blocks, every household would be over-counted, not just
    the empty ones. The 12 is not a finding about households with nobody in them. It is a statement
    about the whole line.

    What this does not establish. It does not establish that any grain went missing. An intercept
    at a household size nobody has is a number the fitting produced. Zero people is outside every
    household size that was fitted.

    It does not tell you why the line sits high. That could be a handful of wrong rows, a second
    entitlement under another provision, or an error in the household-size column. And it does not
    establish that a straight line was the right thing to fit at all.

    Before recovering anything from anybody, go and read the rows at the small household sizes.
    That is where the claim is supposed to live, and there may be no rows there at all.
