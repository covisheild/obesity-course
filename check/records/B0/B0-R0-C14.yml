simplified_explanation: 'Mass is measured in kilograms, written kg. Length is measured in metres,
  written m. So 100 cm make one metre, and any height in centimetres

  becomes metres when you divide by 100.


  Take a mass in kilograms. Take a height in metres and multiply it by itself, which

  is the squaring you met in the section on powers. Divide the first by the second.


  It carries a unit, and the unit comes out of the division:

  kilograms on top, metres times metres underneath.


  That is a derived unit.


  The height must be in metres. Put centimetres in and the answer is not slightly off. It is ten

  thousand times too small, because the squaring squares the mistake as well.


  And the number this gives you does not mean anything on its own. Where the line falls between one
  value and another is a decision

  somebody made, and this section does not make it.

  '
illustration:
  body: "Work the wrong one first.\n\nA person weighs 70 kg and stands 168 cm tall. The height is\
    \ in centimetres, which is how a\nclinic form usually collects it. Square it as it stands and\
    \ divide.\n\n```working\n    168 times 168 = 28,224\n```\n\nNow divide the 70 by that. The answer\
    \ is 0.00248, and the unit that falls out of the division is\nkilograms per centimetre squared,\
    \ not kilograms per metre squared.\n\nNow do it properly. Put the height into metres first.\n\n\
    ```working\n    168 divided by 100 = 1.68\n    1.68 times 1.68 = 2.8224\n    70 divided by 2.8224\
    \ = 24.8\n```\n\n24.8 kg/m^2. Say it out loud as kilograms per metre squared, because the unit\
    \ is what tells you\nthe first answer was not an answer at all.\n\nOne hundred centimetres in\
    \ a metre, and the denominator is squared, so the mistake is squared\ntoo.\n\n```working\n   \
    \ 100 times 100 = 10,000\n```\n\nTake a shape and make\nevery length twice as long, keeping everything\
    \ else the same. Mass goes with volume, and volume\nhas three lengths in it, so the mass goes\
    \ up by 2 times 2 times 2.\n\n```working\n    2 times 2 times 2 = 8\n```\n\nThe denominator has\
    \ only two lengths in it.\n\n```working\n    2 times 2 = 4\n```\n\nSo the index itself goes up.\n\
    \n```working\n    8 divided by 4 = 2\n```\n\nDividing by the square of a height\ndoes not remove\
    \ size from the number. It removes some of it, and a squared denominator is a\nchoice somebody\
    \ made rather than a law you can check.\n"
  analogy_breaks_when: 'The doubling argument holds only while the shape and the density stay the
    same. Real bodies are

    not scaled copies of each other.


    The ten-thousand check holds only for centimetres against metres.

    '
  numbers:
  - value: '7'
    unit: SI base units, of which the metre and the kilogram are two, and whose role continues in
      the present SI
    citekey: bipm_si
    quote: 'The seven base units were chosen for historical reasons, and were, by convention, regarded
      as dimensionally independent: the metre, the kilogram, the second, the ampere, the kelvin, the
      mole, and the candela. This role for the base units continues in the present SI even though
      the SI itself is now defined in terms of the defining constants listed above'
must_know:
- point: 'A height in centimetres does not give a slightly wrong index. It gives one ten thousand
    times

    too small, because the denominator squares the error.

    '
  kind: trap
  bearing: methodological
- point: 'Convert the height to metres before anything else, by dividing by 100.

    '
  kind: move
  bearing: clinical
- point: 'Say the unit with the number: 24.8 kilograms per metre squared.

    '
  kind: move
  bearing: teaching
- point: 'In a dataset, find out which unit height was collected in before you compute a single row.

    '
  kind: consequence
  bearing: methodological
- point: 'Dividing by the square of a height does not take size out of the number. Scale a shape up
    and

    the index rises with it.

    '
  kind: misconception
  bearing: methodological
- point: 'The arithmetic stops at the number and its unit. What counts as a high value is not in it.

    Somebody decided that, and decisions like that get revised. Quote a cut-off only with whose

    it is and when it was set.

    '
  kind: boundary
  bearing: policy
exercises:
- type: calculation
  prompt: 'A person weighs 64 kg and is 155 cm tall. Work out the index, showing the height conversion
    as

    its own line, and state the unit. Then write one sentence saying what your answer does not tell

    you.

    '
  answer: "Height into metres first.\n\n```working\n    155 divided by 100 = 1.55\n```\n\nSquare it.\n\
    \n```working\n    1.55 times 1.55 = 2.4025\n```\n\nDivide the mass by that.\n\n```working\n  \
    \  64 divided by 2.4025 = 26.6\n```\n\n26.6 kilograms per metre squared.\n\nWhat it does not tell\
    \ you: anything about this person's health. The number is a mass divided by\na squared length.\
    \ Turning it into a judgement needs a cut-off, and a cut-off is a decision taken\nby some body,\
    \ on some date, for some population. Book 0 gives you the arithmetic and the unit.\nThe subject\
    \ books take up whose line it is and whether it holds here.\n"
  confidence_first: true
- type: teaching
  prompt: 'A first-year resident has ten minutes and a whiteboard. They ask why the height is squared
    and

    why it matters that the answer is in kilograms per metre squared. Explain it so they could

    reconstruct it afterwards, and give them one error to watch for.

    '
  answer: "Start with the unit, not the formula. Write kg on the board, then m times m underneath\
    \ it, and\nsay that dividing one quantity by another divides their units too. That is where kg/m^2\
    \ comes\nfrom. It was built, not chosen from a list.\n\nThen square it on purpose. Draw a shape,\
    \ then the same shape with every length doubled. Mass\nfollows volume and volume carries three\
    \ lengths, so mass goes up eight times. The denominator\ncarries two lengths, so it goes up four\
    \ times. Eight divided by four is two: the index doubles\nfor the same shape at a different size.\
    \ That is the honest statement of what the square does\nand does not do.\n\nThe error to watch\
    \ for is the centimetre. Show it on the board once.\n\n```working\n    100 times 100 = 10,000\n\
    ```\n\nTell them the value comes out ten thousand times too small. It looks nothing like a small\
    \ slip,\nso it usually survives a read-through of a spreadsheet.\n\nThen stop. Do not go on to\
    \ what any value means. That is a separate decision, taken by a named\nbody on a named date. A\
    \ resident who learns a cut-off as though it fell out of the arithmetic\nhas learned something\
    \ to unlearn later.\n"
quantitative: true
practice:
- level: 1
  prompt: "Work each of these out. Square the second number, then divide the first by it.\n\n```working\n\
    \    72 and 1.8\n    81 and 1.5\n    45 and 1.5\n```\n"
  answer: "Square first, divide second.\n\n```working\n    1.8 times 1.8 = 3.24\n    72 divided by\
    \ 3.24 = 22.2\n```\n\n```working\n    1.5 times 1.5 = 2.25\n    81 divided by 2.25 = 36\n```\n\
    \n```working\n    1.5 times 1.5 = 2.25\n    45 divided by 2.25 = 20\n```\n\nThe last two share\
    \ a denominator, so the answers are in the same ratio as the two masses. That\nis worth noticing:\
    \ with the height fixed, the index moves in step with the mass.\n"
- level: 2
  prompt: "Turn each of these lengths into metres.\n\n```working\n    168 cm      155 cm      180\
    \ cm      96 cm\n```\n"
  answer: "One metre is 100 cm, so divide each by 100.\n\n```working\n    168 divided by 100 = 1.68\n\
    \    155 divided by 100 = 1.55\n    180 divided by 100 = 1.8\n    96 divided by 100 = 0.96\n```\n\
    \nThe decimal point moved two places left every time, which is what dividing by 100 does.\n"
- level: 3
  prompt: 'A quantity is divided by the square of a length. Somebody supplies the length in centimetres

    when metres were wanted. By what factor is the answer wrong, and in which direction? Show the

    step that produces the factor.

    '
  answer: "One metre is 100 cm, so the number in centimetres is 100 times the number in metres. The\n\
    denominator is squared, so the factor is squared with it.\n\n```working\n    100 times 100 = 10,000\n\
    ```\n\nThe denominator comes out 10,000 times too big, so the answer comes out 10,000 times too\
    \ small.\n\nSay the direction out loud. A bigger denominator makes a smaller answer, every time.\n"
- level: 4
  prompt: 'A person weighs 58 kg and is 1.52 m tall. Work out the index and give it with its unit,
    showing

    every line.

    '
  answer: "The height is already in metres, so square it.\n\n```working\n    1.52 times 1.52 = 2.3104\n\
    ```\n\nDivide the mass by that.\n\n```working\n    58 divided by 2.3104 = 25.1\n```\n\n25.1 kilograms\
    \ per metre squared.\n\nKeep both parts of the answer. The number without the unit could be anything,\
    \ and the unit is\nhow anybody checks you used metres.\n"
- level: 5
  prompt: 'A record gives an index of 27.0 kg/m^2 and a height of 1.60 m, but the mass is missing.
    Work out

    the mass in kilograms, showing every line.

    '
  answer: "This runs the move backwards. The index was the mass divided by the squared height, so\
    \ the mass\nis the index times the squared height.\n\nSquare the height.\n\n```working\n    1.60\
    \ times 1.60 = 2.56\n```\n\nMultiply.\n\n```working\n    27.0 times 2.56 = 69.12\n```\n\nAbout\
    \ 69 kilograms. Write 69, not 69.12: the height was given to three digits and the index to\nthree,\
    \ so a fourth digit in the answer is invented.\n\nCheck the direction. Multiplying undoes dividing,\
    \ so the mass must come out larger than the\nindex here, and it does.\n"
- level: 7
  prompt: "Here is a worked answer. Find the step that broke.\n\n```working\n    a person weighs 65\
    \ kg and is 170 cm tall\n    170 divided by 100 = 1.7\n    65 divided by 1.7 = 38.2\n    so the\
    \ index is 38.2 kg/m^2\n```\n"
  answer: "The conversion on line two is right. The division on line three is by the height, not by\
    \ the\nsquare of the height.\n\nSquare it first.\n\n```working\n    1.7 times 1.7 = 2.89\n   \
    \ 65 divided by 2.89 = 22.5\n```\n\n22.5 kilograms per metre squared, not 38.2.\n\nLook at the\
    \ unit the broken working actually produced. Kilograms divided by metres is kg/m, and\nthe last\
    \ line claims kg/m^2. The label was written from memory rather than read off the\ndivision.\n\n\
    Why it looks reasonable: the centimetre conversion was done, which is the step everybody warns\n\
    about, so the working feels careful. The answer is a two-digit number of the ordinary size, so\n\
    nothing about it looks alarming. Only the unit gives it away.\n"
- level: 8
  prompt: "Here is a worked answer. Find the step that broke.\n\n```working\n    a person weighs 62\
    \ kg and is 158 cm tall\n    158 times 158 = 24,964\n    62 divided by 24,964 = 0.00248\n    that\
    \ is far too small, so multiply by 100\n    the index is 0.248 kg/m^2\n```\n"
  answer: "Two things broke, and the second one hides the first.\n\nThe height was never converted.\
    \ Line two squares 158 centimetres, so line three is kilograms\nper centimetre squared, whatever\
    \ the last line calls it.\n\nThen the repair used the wrong factor. There are 100 centimetres\
    \ in a metre, but the\ndenominator is squared, so the factor is 100 times 100.\n\n```working\n\
    \    100 times 100 = 10,000\n```\n\nDo it from the start instead of patching it.\n\n```working\n\
    \    158 divided by 100 = 1.58\n    1.58 times 1.58 = 2.4964\n    62 divided by 2.4964 = 24.8\n\
    ```\n\n24.8 kilograms per metre squared. The patched answer, 0.248, is a hundred times too small.\n\
    \nWhy it looks reasonable: the working noticed its own error and did something about it, which\n\
    reads as care. A correction applied in the right direction feels finished even when the size of\n\
    it is wrong. And 0.248 still looks like a number from a calculation rather than an absurdity,\n\
    where 0.00248 did not.\n\nThe habit that prevents it: convert the unit before the arithmetic,\
    \ never after it.\n"
- level: 9
  prompt: 'A colleague sends you this line about a survey.


    > Our height column turned out to be in centimetres, and the index column looks wrong because

    > of it. It is only a scaling problem, so we can multiply the whole column by 100 and move on.


    Decide what to compute, compute it, and say what your answer does not establish.

    '
  answer: "What to compute: the factor that a centimetre height actually puts into the index.\n\n\
    The height enters the denominator squared, so the factor is squared.\n\n```working\n    100 times\
    \ 100 = 10,000\n```\n\nThe values are 10,000 times too small, not 100 times. Multiplying the column\
    \ by 100 leaves\nevery value a hundred times too small. The repaired figures will look far more\
    \ plausible than\nthe ones they started with. That is the dangerous part of the proposal.\n\n\
    What this does not establish. It does not establish that every row was in centimetres. A column\n\
    filled in by different people can hold both units at once. One multiplication applied to all of\n\
    it repairs some rows and ruins the rest. Before multiplying anything, look at the heights\nthemselves\
    \ and see which unit each row is in.\n\nIt also says nothing about whether the heights and masses\
    \ are any good. Fixing a unit fixes a\nunit. It does not make a badly taken measurement into a\
    \ good one.\n"
retrieval_items:
- q: What unit does dividing a mass in kilograms by the square of a height in metres give, and what
    kind of unit is that?
  a: Kilograms per metre squared, written kg/m^2. It is a derived unit, built from base units by dividing
    and by squaring one of them.
- q: A height is entered in centimetres instead of metres. What happens to the index, and by how much?
  a: It comes out 10,000 times too small, because one metre is 100 cm and the denominator is squared,
    so 100 times 100 enters the sum.
- q: Does the value of the index tell you anything on its own?
  a: No. It is an amount with a unit. What counts as high is a decision taken by a body, on a date,
    for a population, and the subject books are where that is taken up.
