definition:
  text: 'A centimetre, written cm, is one hundredth of a metre, so one metre is 100 cm.


    Dividing a mass in kilograms by the square of a length in metres gives a quantity whose unit is

    the kilogram per metre squared, written kg/m^2.


    A length entered in centimetres rather than metres therefore divides the value by 10^4.


    The index is a number together with its unit. Nothing in its construction states which values

    are high or low. That is a separate decision, made by a body rather than by the arithmetic.

    '
  references:
  - citekey: openstax_prealgebra_2e
    kind: textbook
    locator: ch. 10, Polynomials, integer exponents and scientific notation
    verified:
      resolved_id: PENDING
      opened: false
      claim_located: false
      checked_on: '2026-09-22'
      note: 'Not opened from this authoring environment. The anchor wanted is a school-level chapter
        on

        index notation and on squaring a quantity, which is what the denominator of this index

