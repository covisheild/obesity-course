must_know:
- point: |
    Odds of a figure are not the same as a probability of that figure. Reading "odds of 0.25"
    as a one-in-four chance is a common slip. Odds of 0.25 convert to a probability of 0.25
    divided by 1.25, which is 0.2 — a one-in-five chance. Convert before you speak.
  kind: misconception
  bearing: methodological
- point: |
    Near 0, odds and probability are almost the same number. Above one half they pull apart, and
    near 1 they pull apart fast: 0.99 to 0.999 multiplies the odds by ten. Ask which end of the
    scale you are near before you trust a guess about the size of a change.
  kind: trap
  bearing: methodological
- point: |
    A probability describes a group, or a process repeated many times. It does not describe the one
    person in front of you. Knowing that 0.75 of a population is covered by an entitlement tells you
    nothing about whether this particular person is one of them. Use the figure to plan for a group.
    Then go and check the individual case on its own.
  kind: boundary
  bearing: clinical
- point: |
    A statute's own words often give you a ceiling, marked "up to", rather than a measured figure.
    Every probability, complement and odds you compute from a ceiling is itself a ceiling. Say so
    in the same sentence you quote the number, or the reader will treat it as a count.
  kind: consequence
  bearing: policy
- point: |
    When a journalist reads you an odds figure over the phone, do not repeat it as a percentage
    without converting it first. "Odds of three to one" means three chances in four. Say "three
    in four" and the journalist hears it right.
  kind: move
  bearing: public
exercises:
- type: teaching
  prompt: |
    A journalist calls about the National Food Security Act's rural ceiling. She says, "so the odds
    of being covered are seventy-five per cent." You have three minutes and no jargon.

    Correct the sentence, explain the difference between the two figures, and give the journalist
    one sentence they can print.
  answer: |
    Start with what is right in the sentence. Seventy-five per cent is a real figure from the Act,
    and it is a probability, at most, not odds.

    Explain odds in one move. Odds compare the chance something happens with the chance it does
    not, as one number. A probability of seventy-five per cent gives odds of three to one, because
    three-quarters divided by one-quarter is three.

    ```working
        0.75 divided by 0.25 = 3
    ```

    Say plainly that "odds of seventy-five per cent" is not a sentence anyone can act on. Odds are
    not written as a percentage. When somebody does that, they are quoting the probability and
    calling it odds by mistake. The two look interchangeable right up until the figures move
    away from the middle of the scale.

    What to hand them: "Under the law, up to three in four of India's rural population can be
    covered. That is a ceiling set by the Act, not a count of how many actually are."
  confidence_first: true
- type: critique
  prompt: |
    A briefing paper contains this line: "The odds of coverage in this block are 60%."

    Say what is wrong with the sentence, and rewrite it so the figure means something.
  answer: |
    Odds are not expressed as a percentage. A percentage is a probability's natural home, because a
    probability is bounded between 0 and 1 and a percentage is just that scaled by 100. Odds have
    no upper bound — odds of 99 are a real number, for a probability of 0.99. Writing them as a
    percentage silently assumes they behave like a probability. That assumption is the whole of
    the mistake.

    Two honest rewrites, depending on which figure was actually meant.

    If 60% is the probability of coverage, say so, and give the odds only if the audience needs
    them.

    ```working
        0.6 divided by 0.4 = 1.5
    ```

    "Sixty per cent of the block is covered. That is odds of three to two in favour, for anyone who
    needs the odds form."

    If 60% was meant as the odds themselves — an odds of 0.6, or three to five — convert it back to
    the probability. Do this before printing anything.

    ```working
        0.6 divided by 1.6 = 0.375
    ```

    "Odds of three to five in favour of coverage is a probability of 37.5 per cent, not sixty."

    Either way, the fix is the same: name which figure you have, in words, before the number.
quantitative: true
practice:
- level: 1
  prompt: |
    A bag holds 5 red balls and 3 blue balls, and nothing else. One ball is drawn at random.

    Work out the probability of drawing red, and the probability of drawing blue. Check that they
    add to 1.
  answer: |
    Count the outcomes in the event, then the outcomes in the whole sample space.

    ```working
        5 divided by 8 = 0.625
    ```

    Red: 0.625.

    ```working
        3 divided by 8 = 0.375
    ```

    Blue: 0.375.

    ```working
        0.625 plus 0.375 = 1
    ```

    They add to 1, as they must: red and blue between them are every outcome there is.
- level: 2
  prompt: |
    An event has a probability of 0.2. Work out its odds.

    Separately, an event has odds of three to two — that is, 1.5. Work out its probability.
  answer: |
    Odds are the probability divided by its complement.

    ```working
        1 minus 0.2 = 0.8
    ```

    ```working
        0.2 divided by 0.8 = 0.25
    ```

    Odds of 0.25, which is one to four.

    Going the other way, probability equals odds divided by 1 plus odds.

    ```working
        1 plus 1.5 = 2.5
    ```

    ```working
        1.5 divided by 2.5 = 0.6
    ```

    A probability of 0.6.
- level: 3
  prompt: |
    An event has a probability of 0.4. Work out its complement, and then work out the odds.
  answer: |
    The complement first, since the odds are built from it.

    ```working
        1 minus 0.4 = 0.6
    ```

    Now divide the probability by the complement.

    ```working
        0.4 divided by 0.6 = 0.6666...
    ```

    Odds of about 0.667, which is two to three. Notice that the probability, 0.4, is smaller than
    the complement, 0.6. The odds come out smaller than 1 to match. Odds below 1 always mean
    the event is less likely than its opposite.
- level: 4
  prompt: |
    Section 3(2) of the National Food Security Act, 2013 sets the entitlement's reach at up to 75
    per cent of the rural population. Pick one rural person at random.

    Work out the largest that the probability they are covered can be, and the smallest that the
    probability they are not covered can be.
  answer: |
    The Act's own figure is the probability of coverage, read as a ceiling.

    ```working
        P(covered) is at most 0.75
    ```

    The complement is the probability of not being covered.

    ```working
        1 minus 0.75 = 0.25
    ```

    At most 0.75 covered, at least 0.25 not covered. Both figures are ceilings and floors taken
    from the Act's own "up to" wording, not counts of anyone actually reached.
  refs: [nfsa_2013]
- level: 5
  prompt: |
    Use the rural ceiling of 0.75 from section 3(2) of the National Food Security Act, 2013. Work
    out the odds, at most, that a randomly picked rural person is covered.
  answer: |
    Divide the probability by its complement.

    ```working
        1 minus 0.75 = 0.25
    ```

    ```working
        0.75 divided by 0.25 = 3
    ```

    Odds of three to one, at most. Here the odds figure and "three in four" happen to describe the
    same fact in a way that is easy to eyeball. That will not hold at the urban ceiling, which is
    the next problem.
  refs: [nfsa_2013]
- level: 6
  prompt: |
    Section 3(2) of the National Food Security Act, 2013 sets the urban ceiling at up to 50 per
    cent. Work out the odds, at most, of coverage in the urban population, and compare them with
    the rural odds of three to one. Say what the comparison shows about how odds behave.
  answer: |
    The urban complement first.

    ```working
        1 minus 0.5 = 0.5
    ```

    ```working
        0.5 divided by 0.5 = 1
    ```

    Odds of one to one — "evens" — for the urban ceiling, against three to one for the rural
    ceiling.

    The rural probability is only 1.5 times the urban one.

    ```working
        0.75 divided by 0.5 = 1.5
    ```

    But the odds are three times as large, not 1.5 times.

    ```working
        3 divided by 1 = 3
    ```

    The comparison shows that odds do not scale the way probability does. The stretching grows as
    the probabilities approach 1. Near 0 it almost vanishes.
  refs: [nfsa_2013]
- level: 7
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
        a report gives the odds of household coverage as 0.25
        odds of 0.25 mean a probability of 0.25
        so a quarter of households are covered
    ```
  answer: |
    The step that broke is the second line, where odds are read straight across as a probability.

    Odds and probability are different numbers built from the same fact. Odds and probability
    are equal only at zero. At every other value the odds are the larger number.

    ```working
        0.25 divided by 1.25 = 0.2
    ```

    A probability of 0.2, not 0.25. One household in five is covered, not one in four.

    Why it looks reasonable: both odds and probability are written as plain decimals between
    roughly zero and one. This happens whenever the event is more likely to fail than succeed. A
    reader has nothing on the page to tell the two apart. The only fix is to ask, every time,
    whether the number was labelled odds or probability. The label is the only thing that survives
    being printed.
- level: 8
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
        a probability of coverage is 0.6
        odds equal probability divided by 1 plus probability
        0.6 divided by 1.6 = 0.375
        so the odds of coverage are 0.375
    ```
  answer: |
    The formula on the second line is wrong. Odds are the probability divided by its complement —
    one minus the probability — not by one plus the probability.

    ```working
        1 minus 0.6 = 0.4
    ```

    ```working
        0.6 divided by 0.4 = 1.5
    ```

    Odds of 1.5, not 0.375.

    The two formulas look alike. That is exactly why this slip is common: "1 minus p" and
    "1 plus p" share three of their four characters. A quick check catches it without redoing the
    division. A probability above 0.5 means the event is more likely than not, so its odds must be
    above 1. And 0.375 is below 1. That already says the working is wrong, before you even find
    the broken line.
- level: 9
  prompt: |
    A briefing note says: "Under the food security law, three in four rural people here are
    covered."

    Decide what to compute, compute it, and say what your answer does not establish.
  answer: |
    What to compute: whether "three in four" matches the Act's own figure, and what kind of figure
    it is.

    Section 3(2) sets the rural ceiling at up to 75 per cent, which is the same fraction as three
    in four.

    ```working
        3 divided by 4 = 0.75
    ```

    So the note's figure matches the Act's ceiling exactly.

    What this does not establish. The Act's word is "up to". A ceiling states the most that can be
    covered, and the note has silently turned it into a statement of fact about this place. It does
    not tell you the actual number of people covered here, because that needs the district's
    population count as well as the ceiling.

    And the 75 per cent is a national ceiling. The Act leaves each State's share to the Central
    Government under section 9, so it says nothing about this place in particular. Nor does it
    tell you whether the people entitled under the ceiling have actually been identified and
    issued a ration card. That is a separate administrative step, and the Act does not guarantee
    it happens up to the limit it sets.
retrieval_items:
- q: What is the difference between a probability and its odds?
  a: When every outcome is equally likely, probability is the count of outcomes in an event
    divided by the count in the whole sample space, bounded between 0 and 1. Odds are that
    probability divided by its complement, and have no upper bound. A probability of 0.75 gives
    odds of 3.
- q: An event has a probability of 0.6. Roughly what are its odds, and why can they not be read
    straight off the percentage?
  a: 'Odds equal the probability divided by 1 minus the probability: 0.6 divided by 0.4, which is
    1.5. Odds are not a percentage, so "0.6" and "60 per cent" describe the probability, never the
    odds.'
- q: Why does a small change in probability near 1 produce a large change in odds?
  a: Because odds divide by the complement, and the complement shrinks toward zero as probability
    approaches 1. Dividing by an ever-smaller number makes the odds grow much faster than the
    probability that produced them.
