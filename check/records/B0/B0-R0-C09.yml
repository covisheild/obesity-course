practice_note: 'No drill set here, and that is a decision rather than an omission. This section does
  ask the

  reader to carry something out: the illustration has them assemble m/s, m^2, m^3 and kg/m^3, and

  the retrieval exercise has them build two derived units from base units alone. That technique is

  drilled in B3''s mechanical band, at B0-R0-C11 levels 1 to 3, where the same construction and

  cancelling is worked on bare units. Repeating it here would drill one technique twice and teach

  nothing the reader could not already do.

  '
