simplified_explanation: 'A measurement has two halves. A number, and a unit. Take one half away and
  the other half says

  nothing.


  A unit is an agreed amount that everybody measures against. One metre is an agreed length.


  The agreement is only worth something if it is the same agreement everywhere. That is the job the

  SI does.


  Seven units are called base units. They are the second, the metre, the kilogram, the ampere, the

  kelvin, the mole and the candela.


  Every other unit is built out of those seven by multiplying and dividing. A unit built that way

  is called a derived unit.

  '
illustration:
  body: "A strip of tablets is labelled 500. Five hundred what? Five hundred milligrams and five hundred\n\
    micrograms are both ordinary strengths, and one is a thousand times the other. So you go and\n\
    find the unit, every time, and you never carry a bare number into a calculation.\n\nNow build\
    \ some units yourself. You only need two to start: the metre for length and the second\nfor time.\n\
    \nSpeed is how far, divided by how long. So its unit is a length divided by a time.\n\n```working\n\
    \    metres divided by seconds\n    = m/s\n```\n\nArea is a length times a length.\n\n```working\n\
    \    metres times metres\n    = m^2\n```\n\nVolume is a length three times over, which gives m^3.\
    \ Density is a mass divided by a volume,\nwhich gives kg/m^3.\n\nNow go and read the SI's own\
    \ words. The page is called The International System of Units (SI),\nand it is published by the\
    \ International Bureau of Weights and Measures (BIPM) at\nhttps://www.bipm.org/en/measurement-units.\
    \ Open it and search inside the page for \"J =\".\n\n```working\n    J = kg m2 s-2\n```\n\nSay\
    \ it out loud as a sentence. A joule is a kilogram, times a square metre, divided by a second\n\
    squared.\n\nA prefix is a name for a power of ten stuck on the front of a unit. It changes the\
    \ size of the\nunit and nothing else.\n\n```table\n    prefix  multiply the unit by  so\n    kilo\
    \    10^3                  one kilometre is 1,000 metres\n    centi   10^-2                 one\
    \ centimetre is 0.01 metres\n    milli   10^-3                 one milligram is 0.001 grams\n\
    \    micro   10^-6                 one microgram is 0.000001 grams\n```\n\nThe symbol for kilo\
    \ is k, for centi is c and for milli is m. The symbol for micro is the Greek\nletter mu, written\
    \ µ.\n\nOne minute is 60 seconds. One hour is 3,600 seconds.\n"
  analogy_breaks_when: 'Building a unit out of base units tells you what kind of quantity you are
    holding. It tells you

    nothing about whether the number beside it is right.


    And all of this is decided, not discovered.

    '
