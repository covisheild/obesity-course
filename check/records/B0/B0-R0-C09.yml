must_know:
- point: 'It is not a measurement at all. Send it back for the unit. Never work out which unit was
    meant

    from how big the number looks.

    '
  kind: misconception
  bearing: methodological
- point: 'Read the unit off the label or the report before you read the number.

    '
  kind: move
  bearing: clinical
- point: 'On its own m is the metre; in front of another unit it is milli, meaning a thousandth. So
    mg is

    a milligram.

    '
  kind: trap
  bearing: clinical
- point: 'A derived unit is a recipe rather than a label. When an unfamiliar quantity turns up in
    a paper,

    read its unit before you read its value.

    '
  kind: consequence
  bearing: methodological
- point: 'The SI fixes every unit through seven constants with exact values. One of them is the speed
    of

    light in vacuum, at 299 792 458 metres per second.

    '
  kind: number
  bearing: policy
  refs:
  - bipm_si
- point: 'Getting the units right proves nothing about accuracy. A machine reading twice the true
    value still

    reports in correct units.

    '
  kind: boundary
  bearing: methodological
exercises:
- type: retrieval
  prompt: 'Without looking back, write down the seven SI base units. Then say in one sentence what
    makes a

    unit a derived unit, and build two derived units yourself from base units alone.

    '
  answer: "The seven base units are the second, the metre, the kilogram, the ampere, the kelvin, the\
    \ mole\nand the candela.\n\nFour of them do nearly all the work in this course. The second measures\
    \ time, the metre\nmeasures length, the kilogram measures mass, and the mole measures an amount\
    \ of a substance.\nThe ampere is for electric current, the kelvin for temperature and the candela\
    \ for the\nbrightness of a light source. You will meet those three rarely.\n\nA derived unit is\
    \ one built out of base units by multiplying and dividing them.\n\nTwo you can build without being\
    \ told.\n\n```working\n    speed   = metres divided by seconds = m/s\n    area    = metres times\
    \ metres       = m^2\n```\n\nIf you also wrote kg/m^3 for density, or m^3 for volume, those are\
    \ right too. There is no fixed\nlist to have learnt. There is a way of building them.\n"
  confidence_first: true
- type: critique
  prompt: 'Here is a column out of a block stores register. The header says Rice. The entries under
    it are

    250, 180, 4.2 and 300.


    Say what you would ask for before using any of it, and say what the 4.2 tells you.

    '
  answer: 'What is missing is the unit. The header names the thing measured and not the quantity,
    so none

    of the four numbers is a measurement yet.


    Ask for two things, in this order. First, the unit each column is recorded in. Second, who

    enters it and on what form. A column with no unit in its header is usually one where the unit

    lives in somebody''s habit.


    Now the 4.2. The tempting move is to work out what it must be from its size. It sits beside

    numbers in the hundreds. So it looks like a different unit, or a typing slip.


    Do not do that. You can say that the 4.2 is evidence the column is not uniform, which is a

    reason to stop and ask. You cannot say what it is. Guessing the unit from the size of the

    number is the habit this section exists to remove. A guess written into a report becomes a

    figure somebody else quotes.

    '
- type: teaching
  prompt: 'A first-year resident tells you they can never remember whether the joule is kg m^2 s^-2
    or

    kg m s^-2. You have ten minutes and a whiteboard. Teach them so that the question stops

    arising.

    '
  answer: "Ten minutes, for a resident who expects a mechanism.\n\nStart by agreeing with them. Memorising\
    \ it is a bad plan, and forgetting it is what happens to\neverybody who tries.\n\nThen show the\
    \ two halves of the answer.\n\nFirst, where the statement lives. Open the SI's own page at bipm.org\
    \ and search for \"J =\". The\nline is there, on the SI's own page. A unit is decided by a body.\
    \ So the body's own page is\nwhere you settle it. That takes twenty seconds and you never have\
    \ to trust your memory again.\n\nSecond, how to read it once you have it. Write on the board.\n\
    \n```working\n    J = kg m^2 s^-2\n```\n\nSay it as a sentence: a kilogram, times a square metre,\
    \ divided by a second squared. Ask them\nto say it back. Then ask what kg m s^-2 would be a sentence\
    \ about instead. Let them notice that it\nnames a different quantity. It is not a worse way of\
    \ writing the same one.\n\nClose on the move you actually want them to keep. When they meet a\
    \ unit they do not recognise,\nwrite it out in base units and read it as a sentence. That works\
    \ for every unit they will ever\nmeet, and there is nothing in it to forget.\n"
retrieval_items:
- q: What are the two halves of a measurement, and what does the number tell you on its own?
  a: A number and a unit. On its own the number tells you nothing, because the same digits stand for
    quantities a thousand times apart depending on the unit.
- q: Since 20 May 2019, what fixes the size of every SI unit?
  a: Seven defining constants whose numerical values are fixed exactly, such as the speed of light
    in vacuum at 299 792 458 metres per second. Every SI unit follows from those fixed values.
- q: What does J = kg m^2 s^-2 say?
  a: That a joule is a kilogram, times a square metre, divided by a second squared. It says what energy
    is built from, and it is a statement in the SI rather than a fact to memorise.
