definition:
  text: |
    In India the Constitution divides the power to make law from the power to apply it.

    Parliament and the State Legislatures enact statutes.

    The executive carries statutes out.

    The Central Government may make rules. A body that the statute creates may make regulations.
  references:
  - citekey: constitution
    kind: instrument
    locator: Articles 32, 53, 79, 226, 245 and 246
    quote: "Subject-matter of laws made by Parliament and by the Legislatures of States"
    verified:
      resolved_id: https://indiacode.gov.in/handle/123456789/618394
      opened: true
      claim_located: true
      checked_on: '2026-09-19'
      note: |
        Consolidated 2026 text; each article located by search in the retrieved file. An earlier India
        Code item dated 1949 was rejected for this purpose - its latest cited amendment is from 2003 and
        it does not contain Article 279A at all.
simplified_explanation: |
  Three different jobs, done by three different sets of people.

  A legislature makes law — Parliament for the country, a State Legislature for its own state.

  Below the legislature sits the executive — the day-to-day running of government. It is held by
  the President under Article 53, and carried out beneath the President by ministries and
  departments.

  A statute often leaves its detail blank on purpose, then hands the power to fill that blank
  onward. Neither a rule nor a regulation comes from a legislature, yet both bind you, because a
  statute said they could.

  Above all this sit the courts, reading statutes and testing whether the executive stayed inside
  its permission.
illustration:
  body: |
    Pick up a packet of biscuits from your kitchen. Turn it over. Read the nutrition panel on the
    back.

    Search for the Food Safety and Standards Act, 2006, on the India Code website and open it.

    Now read section 23(1) of the Act. It says no one may sell a packaged food that is not labelled
    "in the manner as may be specified by regulations". Stop there. The Act hands you a duty, not
    the detail. The detail sits in a regulation — a rule written by a body, not by Parliament.

    Section 4 sets up the body that writes it, the Food Safety and Standards Authority of India.
    Section 92 gives that body the power to make regulations.

    Now suppose you think the rule on this packet is wrong. Do not go to a court expecting a new
    label. Write instead to the Authority that wrote the regulation, because that is where the power
    to change it sits.
  analogy_breaks_when: |
    Some of the largest programmes shaping health in India rest on nothing but an executive decision
    and a budget line. No statute, no section to open, no list of amendments to check. That makes
    them quick to start and just as quick to stop.
  numbers:
  - value: '3'
    quote: "List I — Union List. List II— State List. List III— Concurrent List."
    derived: "counted, not stated: the Seventh Schedule names List I, List II and List III, and the Constitution contains no List IV"
    unit: lists in the Seventh Schedule (Union, State, Concurrent)
    citekey: constitution
must_know:
- point: |
    A statute needs a legislature and a debate. A regulation needs a meeting and a notification in
    the Gazette — the government's official newspaper.
  kind: misconception
  bearing: policy
- point: |
    Four levels, hardest to easiest to change: the Constitution, a statute, a rule or regulation, a
    notification. Lawyers call any one of them an instrument.
  kind: move
  bearing: policy
- point: |
    Before repeating a label rule to anyone, open the regulation itself. The Act tells you a label
    is compulsory; it does not tell you what goes on the label.
  kind: consequence
  bearing: clinical
- point: |
    Food is not one subject belonging to one government. Article 246 and the Seventh Schedule split
    subjects between Union, State and Concurrent lists, so both Parliament and the State
    Legislatures act in this space. Expect two authorities where you assumed one.
  kind: india_deviation
  bearing: policy
  refs:
  - constitution
- point: |
    When you want something changed, find the instrument first. Ask a minister to change a
    regulation and you get sympathy. Ask the body that wrote it, and you get a process with dates
    you can chase.
  kind: consequence
  bearing: policy
- point: |
    A programme resting on an executive decision and a budget line can be stopped as quickly as it
    was started.
  kind: consequence
  bearing: policy
- point: |
    Asked who regulates food labelling in India, the weak answer is "the government". The strong
    answer names the body, the statute that created it, the section granting the power, and the kind
    of instrument it issues.
  kind: trap
  bearing: public
- point: |
    This tells you who may act and through which instrument. It says nothing about whether the
    instrument is sensible, whether anyone enforces it, or whether it works.
  kind: boundary
  bearing: policy
exercises:
- type: retrieval
  prompt: |
    Write down, hardest to easiest to change, the four kinds of instrument named here. For each, say
    who is able to change it.
  answer: |
    The Constitution is changed by Parliament, by a special majority. For some parts the states must
    agree as well. A statute is changed by Parliament, or by a State Legislature. A rule or a
    regulation is changed by the Central Government, or by the body the statute gave the power to. A
    notification is issued by that same body and published in the Gazette.

    The ordering is useful because it predicts how quickly something can change, and who would have
    to be persuaded.
  confidence_first: true
- type: interpretation
  prompt: |
    A news report says "the government has banned the sale of energy drinks in school canteens".
    List three questions you must answer before you can tell whether this is a statute, a
    regulation, or an advisory with no legal force.
  answer: |
    Which government is it — the Union or a State? The Seventh Schedule splits the subject, so this
    has to be settled first.

    Which instrument — was anything notified in the Gazette, and under which statutory power?

    And who is bound? A binding rule names who commits a breach and what follows. An advisory names
    nobody and carries no consequence.

    A report that answers none of these has not established that anything legally happened.
- type: teaching
  prompt: |
    Explain to a journalist, in three minutes and without jargon. Why can a Health Minister not
    change what is printed on a food packet next week?
  answer: |
    The label requirement is a regulation, not a ministerial decision. It was written by the body an
    Act of Parliament created for that purpose, using a power that Act granted.

    Changing it means that body drafting an amendment, taking comments, notifying it in the Gazette
    and laying it before Parliament. The Minister can push, and can be blamed, but cannot sign it
    away.

    So the accurate story is not "Minister refuses". It is "here is how long this process takes, and
    here is where it has reached".
retrieval_items:
- q: Which article vests the executive power of the Union in the President?
  a: Article 53.
- q: Which article, with which schedule, decides whether Parliament or a State Legislature may legislate on a subject?
  a: Article 246, with the Seventh Schedule sorting subjects into Union, State and Concurrent lists.
- q: A regulator issues a regulation. Where does its authority come from?
  a: From a section of the statute that created it, which delegated that specific power.
