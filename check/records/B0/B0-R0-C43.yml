definition:
  text: |
    In India the Constitution divides the power to make law from the power to apply it.

    Parliament and the State Legislatures enact statutes. Which of them may legislate on a given
    subject is fixed by Article 246 together with the Seventh Schedule, which sorts subjects into a
    Union List, a State List and a Concurrent List.

    The executive carries statutes out. That means the President, and beneath the President the
    ministries and departments; the executive power of the Union is vested in the President by
    Article 53.

    The courts interpret statutes, and they can be moved directly against unlawful state action —
    the Supreme Court under Article 32, a High Court under Article 226.

    A statute may also hand onward a narrow power to write the detail it deliberately left blank.
    The Central Government may make rules. A body that the statute creates may make regulations.
    Both are written by the executive rather than by a legislature, and they bind because a statute
    said they may.
  references:
  - citekey: constitution
    kind: instrument
    locator: Articles 32, 53, 79, 226, 245 and 246
    quote: "Subject-matter of laws made by Parliament and by the Legislatures of States"
    verified:
