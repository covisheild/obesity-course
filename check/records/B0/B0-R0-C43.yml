must_know:
- point: |
    "There is a law against it" and "there is a rule about it" sound like the same claim. They are
    not, and the difference decides who can change it and how fast. A statute needs a legislature
    and a debate. A regulation needs a meeting and a notification in the Gazette — the government's
    official newspaper.
  kind: misconception
  bearing: policy
- point: |
    Four levels, hardest to easiest to change: the Constitution, a statute, a rule or regulation, a
    notification. Lawyers call any one of them an instrument. Place whatever you are told about on
    that list before you argue about it. Where it sits predicts how fast it can move, and who has to
    be persuaded.
  kind: move
  bearing: policy
- point: |
    Before repeating a label rule to anyone, open the regulation itself. The Act tells you a label
    is compulsory; it does not tell you what goes on the label. Quoting the Act's wording as though
    it were the rule is how a confident answer turns out to be the wrong one.
  kind: consequence
  bearing: clinical
- point: |
    Food is not one subject belonging to one government. Article 246 and the Seventh Schedule split
    subjects between Union, State and Concurrent lists, so both Parliament and the State
    Legislatures act in this space. Expect two authorities where you assumed one.
  kind: india_deviation
  bearing: policy
  refs:
  - constitution
- point: |
    When you want something changed, find the instrument first. Ask a minister to change a
    regulation and you get sympathy. Ask the body that wrote it, and you get a process with dates
    you can chase.
  kind: consequence
  bearing: policy
- point: |
    A programme resting on an executive decision and a budget line can be stopped as quickly as it
    was started. If you are asked to design something meant to outlast a government, your first
    question is which instrument would carry it.
  kind: consequence
  bearing: policy
- point: |
    Asked who regulates food labelling in India, the weak answer is "the government". The strong
    answer names the body, the statute that created it, the section granting the power, and the kind
    of instrument it issues.
  kind: trap
  bearing: public
- point: |
    This tells you who may act and through which instrument. It says nothing about whether the
    instrument is sensible, whether anyone enforces it, or whether it works.
  kind: boundary
  bearing: policy
exercises:
- type: retrieval
  prompt: |
    Write down, hardest to easiest to change, the four kinds of instrument named here. For each, say
    who is able to change it.
  answer: |
    The Constitution is changed by Parliament, by a special majority. For some parts the states must
    agree as well. A statute is changed by Parliament, or by a State Legislature. A rule or a
    regulation is changed by the Central Government, or by the body the statute gave the power to. A
    notification is issued by that same body and published in the Gazette.

    The ordering is useful because it predicts how quickly something can change, and who would have
    to be persuaded.
  confidence_first: true
- type: interpretation
  prompt: |
    A news report says "the government has banned the sale of energy drinks in school canteens".
    List three questions you must answer before you can tell whether this is a statute, a
    regulation, or an advisory with no legal force.
  answer: |
    Which government is it — the Union or a State? The Seventh Schedule splits the subject, so this
    has to be settled first.

    Which instrument — was anything notified in the Gazette, and under which statutory power?

    And who is bound? A binding rule names who commits a breach and what follows. An advisory names
    nobody and carries no consequence.

    A report that answers none of these has not established that anything legally happened.
- type: teaching
  prompt: |
    Explain to a journalist, in three minutes and without jargon. Why can a Health Minister not
    change what is printed on a food packet next week?
  answer: |
    The label requirement is a regulation, not a ministerial decision. It was written by the body an
    Act of Parliament created for that purpose, using a power that Act granted.

    Changing it means that body drafting an amendment, taking comments, notifying it in the Gazette
    and laying it before Parliament. The Minister can push, and can be blamed, but cannot sign it
    away.

    So the accurate story is not "Minister refuses". It is "here is how long this process takes, and
    here is where it has reached".
retrieval_items:
- q: Which article vests the executive power of the Union in the President?
  a: Article 53.
- q: Which article, with which schedule, decides whether Parliament or a State Legislature may legislate on a subject?
  a: Article 246, with the Seventh Schedule sorting subjects into Union, State and Concurrent lists.
- q: A regulator issues a regulation. Where does its authority come from?
  a: From a section of the statute that created it, which delegated that specific power.
