simplified_explanation: "Milligrams per decilitre, written mg/dL, is a weight of something in a volume\
  \ of blood. What mg/dL counts is weight.\n\nMillimoles per litre, written mmol/L, counts something\
  \ else. A mole is a fixed count of\nthings, molecules here. What mmol/L counts is how many of those\
  \ things there are.\n\nThose are two different kinds of quantity. One says how heavy. The other\
  \ says how many.\n\nTo get from how heavy to how many, you have to\nknow how heavy one mole is.\
  \ That weight is called the molar mass, and it is written in grams\nper mole, g/mol.\n\nThe molar\
  \ mass belongs to the substance. Glucose has one. Cholesterol has a\ndifferent one. So there is\
  \ no single conversion factor between mg/dL and mmol/L, and there\nnever can be.\n\nSo the job has\
  \ four steps.\n\n1. Find out what the substance is. Read the row label, not the number.\n2. Get\
  \ its molar mass in grams per mole. Look it up. Do not guess it.\n3. Multiply the mg/dL figure by\
  \ ten, because a litre holds ten decilitres. That gives\n   milligrams per litre.\n4. Divide by\
  \ the molar mass. That gives millimoles per litre.\n\nTo go the other way, run the same steps backwards.\
  \ Multiply by the molar mass, then divide by\nten.\n\nA conversion renames an\namount. It does not\
  \ make the amount better known.\n"
illustration:
  body: |
    Start with the sum you cannot do, because that is the one this section is really about.

    Do the glucose one first.

    The record is compound 5793. The page gives
    the molecular formula as C6H12O6 and the molecular weight as 180.16 g/mol.

    Take a glucose value of 100 mg/dL and work it a line at a time.

    ```working
        100 mg in every decilitre
        a litre holds ten decilitres
        100 times 10 = 1,000
        so 1,000 mg in every litre
        one mole weighs 180.16 grams, so one millimole weighs 180.16 milligrams
        1,000 divided by 180.16 = 5.5506
        so 5.5506 mmol in every litre
    ```

    Write 5.55
    mmol/L. The calculator's 5.550621670 is a claim about the laboratory's work, not about
    yours.

    Now the cholesterol, and watch it stop.

    Go back to PubChem and search for cholesterol. The record is compound 5997. The page gives
    the molecular formula as C27H46O.

    And you still cannot do the sum.

    You cannot turn a mass into an amount of substance without the molar mass of the
    substance in front of you. Glucose's 180.16 is glucose's, and it says nothing about
    cholesterol.

    You know the method. You know the substance. None of that is enough. The one number the method needs is a measured property of
    cholesterol, and nothing you know produces it.

    Do not reuse glucose's divisor because both numbers came
    off the same report.

    Write down that the conversion is pending. Name what you need,
    which is cholesterol's molar mass in grams per mole. Go and read it off PubChem compound
    5997. Looking it up is not a detour around the method. It is part of the method.
  analogy_breaks_when: 'The 180.16 g/mol belongs to D-glucose and to nothing else. The working carries
    over to another substance only once that substance''s

    own molar mass is in your hand.


    And the conversion renames an amount. It cannot improve it.

    '
