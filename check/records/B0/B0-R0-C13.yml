must_know:
- point: |
    There is no single number that turns mg/dL into mmol/L. The factor belongs to the substance,
    not to the pair of units. Dividing by 18 is a glucose move and it is wrong on everything
    else. The answer it gives looks exactly as reasonable as a right one.
  kind: misconception
  bearing: methodological
- point: |
    One mole of D-glucose weighs 180.16 grams, as PubChem's record for compound 5793 gives it.
    That one figure moves a glucose value between mg/dL and mmol/L in either direction. Quote it
    by name when somebody asks where your conversion came from.
  kind: number
  bearing: clinical
  refs: [pubchem_molar_masses]
- point: |
    Convert in four steps and say them out loud. Name the substance. Get its molar mass in grams
    per mole. Multiply the mg/dL figure by ten, because a litre holds ten decilitres. Divide by
    the molar mass, and the answer is in mmol/L.
  kind: move
  bearing: clinical
- point: |
    Two laboratory numbers in the same unit are not two numbers about the same thing. Nothing in
    mg/dL or mmol/L names a substance. Read the row label before you convert, and carry the
    substance with every converted value you hand on.
  kind: trap
  bearing: methodological
- point: |
    This conversion needs one substance with one molar mass. A figure that is a mixture reported
    as a single total has no molar mass, so it cannot be put into mmol/L at all. Meeting such a
    conversion in a paper means somebody chose a molar mass for a mixture. Ask which one, and
    ask why.
  kind: boundary
  bearing: methodological
- point: |
    A conversion never adds a digit. A value the laboratory gave you as 100 mg/dL comes out as
    5.55 mmol/L, not as 5.550621670 mmol/L. Writing the long form claims a laboratory did work
    it never did.
  kind: consequence
  bearing: clinical
- point: |
    When you do not hold the molar mass, say so and stop. Saying you need to look up the molar
    mass for that substance costs you one sentence in a committee. Quoting a converted value you
    cannot source costs you everything you say after it.
  kind: move
  bearing: policy
exercises:
- type: critique
  prompt: |
    Here is a line from a draft laboratory protocol.

    > To convert any laboratory value from mg/dL to mmol/L, divide by 18.

    Say what is wrong with it, and write the sentence you would put in its place.
  answer: |
    The word that fails is "any". The 18 is not a property of the two units. It is glucose's own
    molar mass divided by ten.

    ```working
        180.16 divided by 10 = 18.016
    ```

    So the rule as written is a glucose rule wearing a general coat. Apply it to a different
    substance and you get a number with the right unit on it and the wrong value inside it.

    You can tell from the shape of the claim. Grams and kilograms measure the same kind of
    quantity, so one fixed factor crosses between them. mg/dL and mmol/L do not. One is a mass
    and the other is a count. Crossing between those has to involve the substance. So any rule
    that never mentions a substance has lost something on the way.

    The replacement sentence names the substance and names the step that fetches the number.

    > To convert a value from mg/dL to mmol/L, multiply by 10. Then divide by the molar mass of
    > that substance in grams per mole. For D-glucose the molar mass is 180.16 g/mol, so the
    > divisor is 18.016. For any other substance, look its molar mass up first.

    One thing follows from that. A protocol that lists conversions must list them substance by
    substance. A single line covering all of them is not a shortcut, it is a defect.
- type: teaching
  prompt: |
    A journalist has three minutes. They have two papers open. One reports a blood sugar figure
    as 92 and the other reports it as 5.1, and they want to know which paper is right.

    Explain it without jargon. Give one quotable sentence, and say how confident you are.
  answer: |
    Answer first, in their words.

    > Both papers are right. They are describing the same blood in two different ways, the way
    > the same distance can be a mile or a kilometre.

    Then the mechanism, briefly. One paper is weighing the sugar in a fixed amount of blood. The
    other is counting the sugar molecules in a fixed amount of blood. Weighing and counting give
    different numbers for the same blood. The sum that links them needs the weight of one
    molecule of that particular sugar.

    Show them the sum if they want it.

    ```working
        92 times 10 = 920
        920 divided by 180.16 = 5.1066
    ```

    Round it to the digits the first paper gave you, and 92 becomes 5.1. That is the second
    paper's number.

    Say the confidence out loud. This part is arithmetic and it is not in doubt at all. What is
    worth doubting is the blood sugar figure itself, and that is a different question from the
    unit.

    What not to say: that one unit is the correct one. Neither is. What matters is that a paper
    says which unit it used, and which substance it measured.
quantitative: true
practice:
- level: 1
  prompt: |
    A litre holds ten decilitres. Rewrite each of these.

    ```working
        5 per decilitre, as a figure per litre
        0.7 per decilitre, as a figure per litre
        120 per litre, as a figure per decilitre
        96 per litre, as a figure per decilitre
    ```
  answer: |
    Going from a decilitre to a litre multiplies by ten, because a litre holds ten of them.
    Going the other way divides by ten.

    ```working
        5 times 10 = 50
        0.7 times 10 = 7
        120 divided by 10 = 12
        96 divided by 10 = 9.6
    ```

    Nothing about the amount changed on any line. Only the size of the container the figure is
    quoted against changed.
- level: 2
  prompt: |
    Work each of these out and write the answer to four digits.

    ```working
        1,000 divided by 180.16
        920 divided by 180.16
        2,500 divided by 180.16
    ```
  answer: |
    ```working
        1,000 divided by 180.16 = 5.551
        920 divided by 180.16 = 5.107
        2,500 divided by 180.16 = 13.88
    ```

    Every answer is much smaller than the number you started with, because you divided by a
    number near two hundred. If an answer came out bigger, you multiplied where you should have
    divided.
- level: 3
  prompt: |
    Take each number below, multiply it by ten, then divide the result by 180.16. Write each
    answer to four digits.

    ```working
        72      110      45
    ```
  answer: |
    Two steps each, in that order.

    ```working
        72 times 10 = 720
        720 divided by 180.16 = 3.996
        110 times 10 = 1,100
        1,100 divided by 180.16 = 6.106
        45 times 10 = 450
        450 divided by 180.16 = 2.498
    ```

    Notice that multiplying by ten and then dividing by about a hundred and eighty leaves you
    with roughly a twentieth of what you started with. That rough check is worth keeping in your
    head for later.
- level: 3
  prompt: |
    Now reverse the order. Take each number below, multiply it by 180.16, then divide the result
    by ten.

    ```working
        4      6.5      9
    ```
  answer: |
    ```working
        4 times 180.16 = 720.64
        720.64 divided by 10 = 72.064
        6.5 times 180.16 = 1,171.04
        1,171.04 divided by 10 = 117.104
        9 times 180.16 = 1,621.44
        1,621.44 divided by 10 = 162.144
    ```

    This is the previous problem run backwards. Multiplying undoes dividing and dividing undoes
    multiplying, so nothing is lost either way.
- level: 4
  prompt: |
    A laboratory reports a glucose value of 92 mg/dL. PubChem gives the molecular weight of
    D-glucose as 180.16 g/mol.

    Give that value in mmol/L, keep the unit on the answer, and say how many digits you would
    write down.
  answer: |
    Milligrams per decilitre into milligrams per litre first.

    ```working
        92 times 10 = 920
    ```

    So 920 mg/L. Now divide by the molar mass, because one millimole of glucose weighs 180.16
    milligrams.

    ```working
        920 divided by 180.16 = 5.1066
    ```

    Now the digits. The laboratory gave 92, which carries two digits you can trust. Writing
    5.1066 claims five. Write 5.1 mmol/L.

    Keep the substance with it. That is 5.1 millimoles of glucose per litre, not 5.1 millimoles
    of anything else.
  refs: [pubchem_molar_masses]
- level: 5
  prompt: |
    A paper gives a glucose value as 7.2 mmol/L and your form needs it in mg/dL. PubChem gives
    the molecular weight of D-glucose as 180.16 g/mol.

    Convert it, keep the unit on the answer, and say how many digits you would write down.
  answer: |
    You are going the other way now, so the two steps reverse. Multiply by the molar mass first,
    which turns millimoles per litre into milligrams per litre.

    ```working
        7.2 times 180.16 = 1,297.152
    ```

    Then divide by ten, which turns milligrams per litre into milligrams per decilitre.

    ```working
        1,297.152 divided by 10 = 129.7152
    ```

    Now the digits. The paper gave 7.2, which carries two. Write 130 mg/dL.

    Check the direction before you move on. A mg/dL figure for glucose is always much bigger
    than the same value in mmol/L. Yours went from 7.2 to 130, which is the right way.
  refs: [pubchem_molar_masses]
- level: 5
  prompt: |
    People often say that a glucose value in mg/dL becomes mmol/L if you divide it by 18.
    PubChem gives the molecular weight of D-glucose as 180.16 g/mol.

    Work out the exact divisor. Then convert a glucose value of 180 mg/dL twice, once with the
    exact divisor and once with 18. Say how far apart the two answers are, as a share of the
    answer.
  answer: |
    The two steps can be done as one. Multiplying by ten and then dividing by the molar mass is
    the same as dividing by the molar mass over ten.

    ```working
        180.16 divided by 10 = 18.016
    ```

    Now the same value both ways.

    ```working
        180 divided by 18.016 = 9.9911
        180 divided by 18 = 10
    ```

    The gap between them.

    ```working
        10 minus 9.9911 = 0.0089
    ```

    As a share of the answer, divide the gap by the exact figure.

    ```working
        0.0089 divided by 9.9911 = 0.00089
    ```

    About nine parts in ten thousand, which is under a tenth of one per cent. At the two digits
    a laboratory glucose value deserves, the shortcut and the exact divisor give the same answer.

    So the shortcut is fine, and it is fine for one reason only: it is built out of glucose's
    molar mass. It carries no information about any other substance.
  refs: [pubchem_molar_masses]
- level: 6
  prompt: |
    A report gives a glucose value of 110 mg/dL and a total cholesterol value of 200 mg/dL.
    Somebody asks you for both in mmol/L. PubChem gives the molecular weight of D-glucose as
    180.16 g/mol, and its record for cholesterol gives the molecular formula as C27H46O.

    Do what can be done. Then say plainly what cannot be done, and what you would do about it.
  answer: |
    The glucose first, because that one has everything it needs.

    ```working
        110 times 10 = 1,100
        1,100 divided by 180.16 = 6.1057
    ```

    Three digits are what 110 deserves, so write 6.11 mmol/L of glucose.

    Now the cholesterol, and this is the part of the answer that matters.

    You know the substance. You know its formula, atom by atom. You know the method, and you
    have just used it. You still cannot do this sum, because the method needs cholesterol's
    molar mass in grams per mole and you do not have it.

    So the answer is not a number. It is this: the cholesterol conversion is pending, and what
    is needed is cholesterol's molar mass, which is on PubChem compound 5997. Read it off the
    page, then run the same two lines you ran for the glucose.

    What you must not do is divide 200 by 18.016. That divisor is glucose's molar mass divided
    by ten. It would give you a number, and the number would carry the unit mmol/L. Nobody
    reading your form could tell that it is wrong.
  refs: [pubchem_molar_masses]
- level: 7
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
        total cholesterol is 200 mg/dL
        to turn a mg/dL figure into mmol/L you divide by 18
        200 divided by 18 = 11.1
        so the cholesterol is 11.1 mmol/L
    ```
  answer: |
    The second line broke, and everything after it inherits the break.

    The 18 is not a property of the units. It is glucose's molar mass divided by ten.

    ```working
        180.16 divided by 10 = 18.016
    ```

    Cholesterol is a different substance, so its molar mass is a different number, so its
    divisor is a different number. Nothing in the working says which substance the 18 came from.
    That is how it travelled from a glucose sum to a cholesterol one unnoticed.

    What is the right answer? There isn't one here, and saying so is the point. The sum needs
    cholesterol's molar mass. Go to PubChem compound 5997, read the molecular weight off the
    page, and then finish.

    Why it looks reasonable: both figures are in mg/dL, both answers are asked for in mmol/L, and
    the arithmetic on line three is correct. The working has the shape of a finished conversion.
    Only the provenance of the 18 is wrong, and provenance is the one thing a number cannot
    carry on its face.
- level: 7
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
        a glucose value is 90 mg/dL
        the molecular weight of D-glucose is 180.16 g/mol
        90 divided by 180.16 = 0.4996
        so the glucose is 0.4996 mmol/L
    ```
  answer: |
    The third line broke. It divided a per-decilitre figure and reported a per-litre answer.

    The 90 is milligrams in a decilitre. The answer is wanted in millimoles in a litre. A litre
    holds ten decilitres, so the decilitre figure has to be taken up to a litre before anything
    else happens.

    ```working
        90 times 10 = 900
        900 divided by 180.16 = 4.9956
    ```

    At the two digits 90 deserves, that is 5.0 mmol/L, not 0.50.

    Why it looks reasonable: the molar mass named on line two is the right one, and the division
    on line three is arithmetically correct. The answer even carries the right unit. The missing
    step is a factor of ten hidden inside a prefix. Ten is a small enough factor that the answer
    still looks like a laboratory number.

    The habit that prevents it: write the unit on every line, not just the first and the last.
    The line that reads "900 mg per litre" cannot be confused with the line that reads "90 mg
    per decilitre".
  refs: [pubchem_molar_masses]
- level: 8
  prompt: |
    Here is a worked answer. Every line of arithmetic in it is correct. Find the step that broke
    anyway.

    ```working
        a glucose value is 100 mg/dL
        the molecular weight of D-glucose is 180.16 g/mol
        100 times 10 = 1,000
        1,000 divided by 180.16 = 5.550621670
        so the glucose is 5.550621670 mmol/L
    ```
  answer: |
    The last line broke, and it broke on digits rather than on arithmetic.

    The laboratory reported 100 milligrams per decilitre, to the nearest whole milligram. Three
    digits are real. The conversion factor renames the amount and cannot make it better known,
    so the answer has three real digits too.

    ```working
        1,000 divided by 180.16 = 5.5506
    ```

    Write 5.55 mmol/L.

    Why it looks reasonable: nothing in the working is wrong. Each line follows from the one
    before it. The molar mass is the right one. The step from decilitres to litres is there. A
    calculator produced every digit of the final figure. This is the failure the earlier section
    on significant figures exists for. It survives a unit check, a direction check and a size
    check.

    What the long figure actually says, to a reader who takes it at face value, is that somebody
    measured that blood to ten digits. Nobody did.
  refs: [pubchem_molar_masses]
- level: 9
  prompt: |
    A colleague sends you this line about a planned pooled analysis.

    > Their glucose figures are all in mmol/L and ours are all in mg/dL. The two sets cannot be
    > pooled, so we would have to sample our participants again.

    Decide what to compute, compute it, and say what your answer does not establish.
  answer: |
    What to compute: whether the unit is the obstacle. Take a figure, move it into the other
    unit, then move it back, and see whether it comes home unchanged. PubChem gives the
    molecular weight of D-glucose as 180.16 g/mol.

    Out first.

    ```working
        5 times 180.16 = 900.8
        900.8 divided by 10 = 90.08
    ```

    And back.

    ```working
        90.08 times 10 = 900.8
        900.8 divided by 180.16 = 5
    ```

    The figure came home unchanged. The molar mass is one fixed number, so moving a glucose
    value between mg/dL and mmol/L loses nothing. Nobody needs sampling again for this reason,
    and the proposal in the message would spend money on a rename.

    What this does not establish. It does not show the two sets can be pooled. Two sets of
    glucose figures can differ because different assays were used. They can differ because one
    set was taken fasting and the other was not. They can differ because the two groups of
    people are not alike. No conversion touches any of those.

    And it worked only because both columns hold glucose. Put a different substance in one of
    them and the same two lines give a wrong answer with a right-looking unit on it.
  refs: [pubchem_molar_masses]
- level: 10
  prompt: |
    In a meeting somebody says this.

    > The trial reports mean total cholesterol as 5.2 mmol/L. Our audit reports it as 200 mg/dL.
    > Those are the same figure, near enough, so the two groups are comparable on this.

    Decide what to compute, compute it, and say what your answer does not establish.
  answer: |
    What to compute: put the two figures in one unit, which means turning 5.2 mmol/L into mg/dL.
    Write the move out with the molar mass left standing as the letter M. M is the number you
    are about to discover you do not have.

    ```working
        5.2 mmol in a litre, times M grams in a mole
        gives 5.2 times M milligrams in a litre
        then divided by ten
        gives 0.52 times M milligrams in a decilitre
    ```

    Now try to put a number on M. This course holds the molar mass of D-glucose and it does not
    hold the molar mass of cholesterol. So the computation stops here, and stopping is the
    answer.

    What you say in the room is short. You cannot check that claim yet. You need cholesterol's
    molar mass in grams per mole, it is on PubChem compound 5997, and you will have the
    comparison in five minutes.

    What you must not do is reach for 18.016. That divisor is glucose's molar mass divided by
    ten. Using it here would give you a number that agrees or disagrees with the claim for no
    reason at all.

    What your answer does not establish, even once you have the molar mass. Two figures matching
    after a conversion is arithmetic, not evidence. It would not tell you the two groups are
    alike in anything else. It would not tell you the trial and the audit measured cholesterol
    the same way. It would not tell you they sampled people of the same ages. The unit was never
    the only question, and it is the easiest one in the room to answer.
retrieval_items:
- q: What must you know about a substance before you can turn a mg/dL value into mmol/L?
  a: Which substance it is, and its molar mass in grams per mole. The bridge between a mass and
    an amount of substance is the mass of one mole, and that differs from substance to substance.
- q: What is the molecular weight of D-glucose, and where does that figure come from?
  a: 180.16 grams per mole, read off the PubChem record for D-glucose, compound 5793. It is a
    computed value that carries the release it was computed in, so it can be revised.
- q: Why does dividing a mg/dL figure by 18 work for glucose and for nothing else?
  a: Because 18 is glucose's own molar mass divided by ten, and 180.16 divided by 10 is 18.016.
    Another substance has another molar mass, so it has another divisor.
