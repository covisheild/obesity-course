simplified_explanation: |
  Write a number down and two things decide what it means. Which digits you used, and where you put
  them.

  Take 4,505. There are two fives in it, and one of them is worth five hundred while the other is
  worth five. Nothing about the digit 5 tells you that. Its place does. Move one step to the left
  and a digit is worth ten times as much. That is the whole rule.

  Now the part that catches people in India. Where you put the commas is a different question from
  what the digits are worth. And India does not do it the way most places do. Here the last three
  digits go together and everything above that is grouped in pairs: 10,00,000. In most other places
  they run in threes all the way along: 1,000,000. Same number, same value, different commas.

  The names follow the commas. India counts thousand, lakh, crore. Most other places count
  thousand, million, billion. One lakh is a hundred thousand and one crore is ten million, so the
  two ladders never line up. That is where the mistakes come from.

  A calculator does base ten for you, fast and without complaint, but it cannot read your mind.
  Type one zero too many and it will work the sum out correctly and hand you an answer ten times
  too big.
illustration:
  body: |
    Open `sources/fss_act_2006.txt`, which is the Food Safety and Standards Act, 2006. Search inside
    it for "misleading advertisement".

    The first hit is not what you want, and it is worth knowing why. Every Indian Act opens with a
    list of its section names, so your first hit is the line `53. Penalty for misleading
    advertisement` in that list. It names the section and carries no figure. Search again and take
    the second hit, which is section 53 itself.

    Now read what it says the penalty may extend to. It says ten lakh rupees. Write that in digits, the Indian way, and then the international way.

    ```
        10,00,000      1,000,000
    ```

    Count the zeros in each. Five, and five. The number has not changed. Only the commas moved.

    Now watch the mistake happen, because it is worth seeing once. Somebody reading the Act writes a
    note in English for a reader abroad. Ten lakh, they think, and lakh sounds like million. So ten
    lakh becomes ten million, and they type this.

    ```
        1,00,00,000
    ```

    Look at what they have done. Ten million is one crore. They have multiplied the penalty by ten,
    in a note that other people will quote back at them.

    The slow way stops it. Say the number out loud in the naming system you are writing in. Ten lakh
    is one million. One crore is ten million. A lakh is a hundred thousand, and a crore is a hundred
    lakh, so the two ladders step at different places.

    Now a clean case, so you can feel the difference. Search the same file for "Penalty for
    sub-standard food". The contents list comes up first again, and the section itself is the second
    hit. That is the pattern in every Act, so expect it from now on.

    Section 51 caps that penalty at five lakh rupees. Five lakh is five hundred thousand. Write it
    both ways.

    ```
        5,00,000      500,000
    ```

    Six digits each time. They agree, so no place has slipped.

    Last, the calculator. Section 53's ceiling is ten lakh and section 51's is five lakh. Type one
    million, then divide by five hundred thousand, and it returns 2. That is right: the first
    ceiling is twice the second. Now type it again and leave one zero off the second number. It
    returns 20.

    The calculator did not object either time, and it never will. Checking the question is your job.
    Counting the digits before you press equals is how you do it.
  analogy_breaks_when: |
    Place value is a rule about writing numbers down. It tells you what 10,00,000 means. It tells you
    nothing about whether ten lakh rupees is a large penalty or a small one. It tells you nothing
    about whether anybody has ever been made to pay it.

    The commas break in a second way, and quietly. A spreadsheet or a website prints the grouping it
    was built for, and does not say which one that is. So count the digits, not the commas. Where the
    two disagree, the digits are right.

    A calculator is only as good as what you typed. It does not know what the number is about. It
    will divide a sum of money by a count of children and hand you an answer. That answer is
    arithmetic rather than sense.

    One thing about the figures themselves. They are what this copy of the Act says, and the copy in
    `sources/` names no change to it after 2008. A later section of this book teaches you how to
    check whether a copy of a law is up to date. Until then, treat these as the numbers in this
    file rather than as the penalties in force today.
  numbers:
  - value: '10,00,000'
    unit: rupees, ceiling on the penalty for a misleading food advertisement, s.53
    citekey: fss_act_2006
  - value: '5,00,000'
    unit: rupees, ceiling on the penalty for sub-standard food, s.51
    citekey: fss_act_2006
must_know:
- point: |
    A lakh is not a million. One lakh is a hundred thousand. One crore is ten million. A note that
    slides from one ladder to the other is wrong by a factor of ten. That is the size of error
    nobody spots in a table, because every digit in it still looks reasonable.
  kind: misconception
  bearing: methodological
- point: |
    Before you press equals, count the digits in each number you typed. Then say the number out
    loud, in the naming system you are writing in. Two habits, a few seconds, and between them they
    catch the whole class of error above.
  kind: move
  bearing: methodological
- point: |
    Indian statutes, budgets and ministry papers state money in lakh and crore. Journals and
    international agencies state it in million and billion. Every time a figure crosses between the
    two, write it in digits first and count them. That is the only step where the mistake is
    visible.
  kind: india_deviation
  bearing: policy
- point: |
    Asked on the spot how big a crore is, do not answer "a lot". Say ten million, say a hundred lakh,
    and say how many digits that is. A number you can place immediately is the difference between
    being quoted and being talked over.
  kind: trap
  bearing: public
- point: |
    A trainee who cannot move between the two groupings will hand you a broken table. It will be
    right in one column and ten times wrong in the next. When a table looks odd, check the conversion
    before you check the arithmetic. The arithmetic is usually fine.
  kind: consequence
  bearing: teaching
- point: |
    This gets you to what a written number means and no further. It does not tell you whether the
    number is right, how it was counted, or whether the thing it counts is worth caring about.
  kind: boundary
  bearing: methodological
exercises:
- type: calculation
  prompt: |
    Section 50 of the Food Safety and Standards Act, 2006 sets a ceiling of five lakh rupees. A
    proviso lowers it to twenty-five thousand rupees for small food businesses — petty retailers,
    hawkers, temporary stalls and the like. Write both figures in digits, in both groupings. Then
    say how many times larger the ceiling is than the proviso figure.
  answer: |
    Five lakh, Indian grouping: 5,00,000. International grouping: 500,000. Six digits either way.

    Twenty-five thousand, in the Indian grouping: 25,000. In the international grouping: 25,000.
    They are
    identical, and that is worth noticing. Below one lakh the two systems group the digits the same
    way, so every number under a hundred thousand looks the same in both. The ladders only separate
    above that, which is exactly why the mistake feels safe right up to the point where it happens.

    Now the division, line by line.

    ```
        500,000 divided by 25,000
        = 500 divided by 25          (take three zeros off each)
        = 20
    ```

    The ceiling is twenty times the proviso figure.
  confidence_first: true
- type: critique
  prompt: |
    Here is a sentence from a report.

    > The maximum penalty for a misleading food advertisement in India is one million rupees. That
    > is about ten crore.

    Find the mistake, and say which step it happened at.
  answer: |
    The first half is right. Section 53 of the Food Safety and Standards Act, 2006 caps that penalty
    at ten lakh rupees, and ten lakh is one million.

    "Ten crore" is wrong. One crore is ten million, so ten crore is a hundred million. That is a
    hundred times the real figure.

    The step it happened at matters more than the size of it. No arithmetic was done here, so no
    arithmetic went wrong. The writer converted a number by matching names instead of by counting
    digits. Had they written 10,00,000 and 1,000,000 side by side, there would have been nothing left
    to get wrong.
quantitative: true
practice:
- level: 1
  prompt: |
    In the number 90,807, say what each digit is worth. Then say how many digits the number has.
  answer: |
    Going from the left, one digit at a time.

    ```
        9  ninety thousand
        0  no thousands
        8  eight hundred
        0  no tens
        7  seven
    ```

    Five digits. The two zeros are doing work: they hold the other digits in their places. Take
    them out and you have 987, which is a different number entirely.
- level: 2
  prompt: |
    Write each of these in digits, twice: once in the Indian grouping and once in the
    international one. Two lakh. Twelve lakh. Three crore.
  answer: |
    ```
        two lakh      2,00,000        200,000
        twelve lakh   12,00,000       1,200,000
        three crore   3,00,00,000     30,000,000
    ```

    Check each pair by counting digits rather than commas. Six, seven and eight digits, and the
    two columns agree every time.
- level: 3
  prompt: |
    Which is larger, 90,90,000 or 9,900,000? Say how you decided, in one line.
  answer: |
    Count the digits first. Seven in each, so they are the same size of number and the commas are
    the only difference.

    Now read the digits themselves, left to right.

    ```
        90,90,000   =  9090000
        9,900,000   =  9900000
    ```

    The first two digits are 90 against 99, so the second number is larger. It is ninety-nine lakh
    against ninety lakh and ninety thousand.

    How you decided: count the digits, then compare digit by digit from the left. Never compare
    comma patterns, because the two systems put them in different places.
- level: 4
  prompt: |
    Section 21(2) of the Consumer Protection Act, 2019 caps a penalty for a false or misleading
    advertisement at ten lakh rupees. A proviso raises it to fifty lakh for a repeat. Write both
    figures in both groupings, then say how many times larger the second is.
  answer: |
    ```
        ten lakh     10,00,000       1,000,000
        fifty lakh   50,00,000       5,000,000
    ```

    Now the division, taking the shared zeros off both first.

    ```
        50,00,000 divided by 10,00,000
        = 50 divided by 10
        = 5
    ```

    Five times larger.
  refs: [consumer_prot_2019]
- level: 5
  prompt: |
    Section 34(1) of the Consumer Protection Act, 2019 gives the District Commission complaints
    worth up to one crore rupees. Section 47 gives the State Commission up to ten crore. Write both
    in both groupings and count the digits in each.
  answer: |
    ```
        one crore    1,00,00,000      10,000,000     8 digits
        ten crore    10,00,00,000     100,000,000    9 digits
    ```

    One digit apart, so one is ten times the other.

    Notice what the Indian commas do here and the international ones do not. The Indian grouping
    puts a break at the crore, so the word and the comma agree. The international grouping breaks
    at the million, which falls in a different place, so the same number looks unfamiliar.
  refs: [consumer_prot_2019]
- level: 6
  prompt: |
    A district serves 1,00,000 lower primary meals. The second schedule of the National Food
    Security Act, 2013 sets that meal at 450 calories. Work out the total calories. Write the
    answer in digits in both groupings, and name it in both naming systems.
  answer: |
    ```
        450 times 1,00,000
        = 450 times 100000
        = 4,50,00,000       (Indian grouping)
        = 45,000,000        (international grouping)
    ```

    Eight digits either way, so nothing has slipped.

    Named: four crore fifty lakh calories, or forty-five million calories.

    Keep the label on it. These are calories, not rupees and not meals, and the number is
    meaningless the moment the word comes off it.
  refs: [nfsa_2013]
- level: 7
  prompt: |
    Here is a line from a note. Find the step that broke.

    > The repeat ceiling is fifty lakh rupees, which is 5,000,000, or five crore.
  answer: |
    Take it a step at a time.

    ```
        fifty lakh   = 50,00,000
                     = 5,000,000     correct
                     = five crore    wrong
    ```

    The digits step is right. Fifty lakh really is 5,000,000.

    The naming step is wrong. One crore is 1,00,00,000, which is eight digits. 5,000,000 has seven.
    So fifty lakh is half a crore, not five.

    Why it looks reasonable: the 5 survives from "fifty" into "five", so the sentence reads as
    though one conversion carried through both halves. It did not.
- level: 8
  prompt: |
    A colleague adds three penalty ceilings — ten lakh, three lakh and five lakh — and reports the
    total as "18,00,000, or about 1.8 crore". Find the step that broke and say what the total
    should be called.
  answer: |
    The addition first.

    ```
        10,00,000
       + 3,00,000
       + 5,00,000
       = 18,00,000
    ```

    That is right. Eighteen lakh.

    Now the naming. A crore is 1,00,00,000, which is eight digits. 18,00,000 has seven.

    ```
        1.8 crore  =  1,80,00,000     eight digits
        18 lakh    =    18,00,000     seven digits
    ```

    So the report is out by a factor of ten. The total should be called eighteen lakh, or 1.8
    million.

    Why it looks reasonable: the digits 1 and 8 appear in both, in that order. Only the digit count
    separates them, which is exactly why you count digits.
- level: 9
  prompt: |
    Here is a press line.

    > India's food regulator can fine a company up to ten million rupees for a misleading food
    > advertisement.

    You have the Food Safety and Standards Act, 2006 open. Decide what to check, check it, then say
    what your answer does not establish.
  answer: |
    What to check: the figure, by converting it into the grouping the Act uses.

    Section 53 caps the penalty at ten lakh rupees.

    ```
        ten lakh      = 10,00,000 = 1,000,000  = one million
        ten million   = 1,00,00,000            = one crore
    ```

    So the line is out by a factor of ten. It should say one million, or ten lakh.

    What this does not establish. It does not tell you whether any such penalty has ever been
    imposed, or what was actually collected. It does not tell you who imposes it. And the figure
    comes from a copy of the Act that names no change to it after 2008. It is what this copy says,
    not what is in force today.
  refs: [fss_act_2006]
- level: 10
  prompt: |
    In a meeting somebody says this.

    > The scheme costs 400 crore, which is about 4 billion rupees. That is roughly 4,000 rupees for
    > each of the ten lakh people it reaches.

    Decide what to compute, compute it, and say what your answer does not establish.
  answer: |
    Two claims are buried in that sentence. Check them separately.

    First, 400 crore against 4 billion.

    ```
        400 crore = 400 times 1,00,00,000
                  = 4,00,00,00,000
                  = 4,000,000,000
                  = 4 billion          correct
    ```

    Second, the figure per person.

    ```
        4,000,000,000 divided by 10,00,000
        = 4,000,000,000 divided by 1,000,000
        = 4,000 rupees per person       correct
    ```

    Both hold. This is worth feeling: checking is not the same as finding a mistake, and a check
    that confirms is not wasted.

    What it does not establish. Nothing here says whether 4,000 rupees a person is a lot or a
    little, what it buys, or whether the money was spent. Nor whether ten lakh is who the scheme
    reaches or who it was designed for. The arithmetic is sound and the sentence is still not yet
    a fact about the world.
retrieval_items:
- q: What makes the two fives in 4,505 worth different amounts?
  a: Their places. Each place is worth ten times the place immediately to its right, so the left-hand five is worth five hundred and the right-hand one is worth five.
- q: How many is one lakh, and how many is one crore, stated in the international names?
  a: One lakh is a hundred thousand. One crore is ten million.
- q: Below what figure do the Indian and international groupings look identical, and why does that matter?
  a: Below one lakh. Every number under a hundred thousand is written the same way in both, so the conversion feels safe right up to the point where the two ladders separate.
