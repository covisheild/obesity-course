must_know:
- point: |
    A lakh is not a million. One lakh is a hundred thousand. One crore is ten million.
  kind: misconception
  bearing: methodological
- point: |
    Before you press equals, count the digits in each number you typed. Then say the number out
    loud, in the naming system you are writing in.
  kind: move
  bearing: methodological
- point: |
    Indian statutes, budgets and ministry papers state money in lakh and crore. Journals and
    international agencies state it in million and billion. Every time a figure crosses between the
    two, write it in digits first and count them.
  kind: india_deviation
  bearing: policy
- point: |
    Asked on the spot how big a crore is, do not answer "a lot". Say ten million, say a hundred
    lakh, and say how many digits that is.
  kind: trap
  bearing: public
- point: |
    A trainee who cannot move between the two groupings will hand you a broken table. When a table
    looks odd, check the conversion before you check the arithmetic.
  kind: consequence
  bearing: teaching
- point: |
    When a quantity that cannot go below zero comes out negative, do not report it as the amount and
    do not round it to zero. Report that the figures do not add up. A mass, a count of people or a
    volume below zero means a figure, a step or a sign went wrong earlier. Or a rule was run past
    where it holds. Go back and find which.
  kind: move
  bearing: methodological
- point: |
    A calculator that shows the whole line follows the agreed order, and only on a line you type
    whole. A basic desk calculator does not follow it at all, so test yours with 3 plus 2 times 4.
    Press equals part way and you have chosen the order yourself. Type mixed sums as one line, with
    brackets round whatever must happen first.
  kind: trap
  bearing: methodological
exercises:
- type: calculation
  prompt: |
    Section 50 of the Food Safety and Standards Act, 2006 sets a ceiling of five lakh rupees. A
    proviso lowers it to twenty-five thousand rupees for small food businesses — petty retailers,
    hawkers, temporary stalls and the like. Write both figures in digits, in both groupings. Then
    say how many times larger the ceiling is than the proviso figure.
  answer: |
    Five lakh, Indian grouping: 5,00,000. International grouping: 500,000. Six digits either way.

    Twenty-five thousand, in the Indian grouping: 25,000. In the international grouping: 25,000.
    They are
    identical, and that is worth noticing. Below one lakh the two systems group the digits the same
    way, so every number under a hundred thousand looks the same in both. The ladders only separate
    above that, which is exactly why the mistake feels safe right up to the point where it happens.

    Now the division, line by line.

    ```working
        500,000 divided by 25,000
        = 500 divided by 25          (take three zeros off each)
        = 20
    ```

    The ceiling is twenty times the proviso figure.
  confidence_first: true
- type: critique
  prompt: |
    Here is a sentence from a report.

    > The maximum penalty for a misleading food advertisement in India is one million rupees. That
    > is about ten crore.

    Find the mistake, and say which step it happened at.
  answer: |
    The first half is right. Section 53 of the Food Safety and Standards Act, 2006 caps that penalty
    at ten lakh rupees, and ten lakh is one million.

    "Ten crore" is wrong. One crore is ten million, so ten crore is a hundred million. That is a
    hundred times the real figure.

    The step it happened at matters more than the size of it. No arithmetic was done here, so no
    arithmetic went wrong. The writer converted a number by matching names instead of by counting
    digits. Had they written 10,00,000 and 1,000,000 side by side, there would have been nothing left
    to get wrong.
quantitative: true
practice:
- level: 1
  prompt: |
    In the number 90,807, say what each digit is worth. Then say how many digits the number has.
  answer: |
    Going from the left, one digit at a time.

    ```table
        9  ninety thousand
        0  no thousands
        8  eight hundred
        0  no tens
        7  seven
    ```

    Five digits. The two zeros are doing work: they hold the other digits in their places. Take
    them out and you have 987, which is a different number entirely.
- level: 1
  prompt: |
    Work these out. 15 minus 40. 8 minus -5. -6 plus -9. -6 times -7. -36 divided by 4.
  answer: |
    ```working
        15 minus 40 = -25
        8 minus -5 = 13
        -6 plus -9 = -15
        -6 times -7 = 42
        -36 divided by 4 = -9
    ```

    Taking 40 from 15 runs 25 steps past zero. Taking away a negative is the same as adding, so 8
    minus -5 is 8 plus 5. Adding two negatives goes further below zero. Two negatives multiplied
    give a positive. A negative divided by a positive is negative.
- level: 2
  prompt: |
    Write each of these in digits, twice: once in the Indian grouping and once in the
    international one. Two lakh. Twelve lakh. Three crore.
  answer: |
    ```table
        two lakh      2,00,000        200,000
        twelve lakh   12,00,000       1,200,000
        three crore   3,00,00,000     30,000,000
    ```

    Check each pair by counting digits rather than commas. Six, seven and eight digits, and the
    two columns agree every time.
- level: 2
  prompt: |
    Work these out in the agreed order. 5 plus 3 times 6. (5 plus 3) times 6. 20 divided by 4 times
    5. 18 minus 6 divided by 3. Then say which of the four would give a different answer if you
    worked strictly from left to right.
  answer: |
    ```working
        5 plus 3 times 6 = 5 plus 18 = 23
        (5 plus 3) times 6 = 8 times 6 = 48
        20 divided by 4 times 5 = 5 times 5 = 25
        18 minus 6 divided by 3 = 18 minus 2 = 16
    ```

    Now strictly left to right, ignoring the order.

    ```working
        5 plus 3 = 8
        8 times 6 = 48
        18 minus 6 = 12
        12 divided by 3 = 4
    ```

    The first and the fourth change. In each, a multiplying or dividing comes after an adding or
    taking away. Strict left to right then does the lower step first, which the agreed order does
    not. Mixing the two is not enough on its own. A line like 3 times 4 plus 5 comes out the same
    either way, because the multiplying already comes first. The second has brackets, so it comes out the same.
    The third has only multiplying and dividing, which run left to right anyway.
- level: 3
  prompt: |
    Which is larger, 90,90,000 or 9,900,000? Say how you decided, in one line.
  answer: |
    Count the digits first. Seven in each, so they are the same size of number and the commas are
    the only difference.

    Now read the digits themselves, left to right.

    ```working
        90,90,000   =  9090000
        9,900,000   =  9900000
    ```

    The first two digits are 90 against 99, so the second number is larger. It is ninety-nine lakh
    against ninety lakh and ninety thousand.

    How you decided: count the digits, then compare digit by digit from the left. Never compare
    comma patterns, because the two systems put them in different places.
- level: 4
  prompt: |
    A school kitchen has a budget of 3,50,000 rupees for a month and spends 4,20,000 rupees. Its
    store starts the month with 40 sacks of rice, receives 25 sacks, and records 70 sacks issued.
    All of these figures are made up for this problem. Work out the money left and the sacks left.
    For each answer, say whether its sign makes sense.
  answer: |
    The money first.

    ```working
        3,50,000 minus 4,20,000 = -70,000
    ```

    Minus 70,000 rupees. The kitchen has spent 70,000 rupees more than it had. That is a deficit,
    and a budget can run one. So the sign is a real answer: the kitchen is 70,000 rupees short.

    Now the rice.

    ```working
        40 plus 25 = 65
        65 minus 70 = -5
    ```

    Minus five sacks. A store cannot hold less than nothing, so this is not a fact about the store.
    It says the register is wrong somewhere. A delivery may not have been written down, or a sack
    written out twice. Somebody should count the sacks before anyone uses the figure.
- level: 5
  prompt: |
    Section 34(1) of the Consumer Protection Act, 2019 gives the District Commission complaints
    worth up to one crore rupees. Section 47 gives the State Commission up to ten crore. Write both
    in both groupings and count the digits in each.
  answer: |
    ```table
        one crore    1,00,00,000      10,000,000     8 digits
        ten crore    10,00,00,000     100,000,000    9 digits
    ```

    One digit apart, so one is ten times the other.

    Notice what the Indian commas do here and the international ones do not. The Indian grouping
    puts a break at the crore, so the word and the comma agree. The international grouping breaks
    at the million, which falls in a different place, so the same number looks unfamiliar.
  refs: [consumer_prot_2019]
- level: 5
  prompt: |
    The second schedule of the National Food Security Act, 2013 sets a lower primary meal at 450
    calories. A school serves 1,200 of those meals in a week, and adds 50,000 calories of fruit.
    The 1,200 meals and the 50,000 calories of fruit are made up for this problem. Write the total
    as one line and work it out. Then say what a calculator shows if you press equals straight
    after the first addition.
  answer: |
    The line is 50,000 plus 1,200 times 450. The agreed order multiplies first.

    ```working
        1,200 times 450 = 5,40,000
        50,000 plus 5,40,000 = 5,90,000
    ```

    Five lakh ninety thousand calories, which is 590,000 in the international grouping.

    Now press equals after 50,000 plus 1,200, and carry on.

    ```working
        50,000 plus 1,200 = 51,200
        51,200 times 450 = 2,30,40,000
    ```

    That is two crore thirty lakh forty thousand calories. It has eight digits against six. Two
    extra digits say it is roughly a hundred times too big, and that is only a rough guide. Divide
    to get the real size of the error.

    ```working
        2,30,40,000 divided by 5,90,000
        = 2,304 divided by 59        (take four zeros off each)
        = about 39
    ```

    It is about 39 times too big. The pressing did it. The calculator added the fruit to the count
    of meals, then multiplied calories by the result. Keep the label on each figure and that mistake
    shows itself: 50,000 calories and 1,200 meals cannot be added.
  refs: [nfsa_2013]
- level: 6
  prompt: |
    A district serves 1,00,000 lower primary meals. The second schedule of the National Food
    Security Act, 2013 sets that meal at 450 calories. Work out the total calories. Write the
    answer in digits in both groupings, and name it in both naming systems.
  answer: |
    ```working
        450 times 1,00,000
        = 450 times 100000
        = 4,50,00,000       (Indian grouping)
        = 45,000,000        (international grouping)
    ```

    Eight digits either way, so nothing has slipped.

    Named: four crore fifty lakh calories, or forty-five million calories.

    Keep the label on it. These are calories, not rupees and not meals, and the number is
    meaningless the moment the word comes off it.
  refs: [nfsa_2013]
- level: 7
  prompt: |
    A colleague is checking two ceilings in the Food Safety and Standards Act, 2006. Section 53
    sets ten lakh rupees for a misleading advertisement. Section 51 sets five lakh rupees for
    sub-standard food. They want to know how many times larger the first one is. Here is what they
    typed, and what came back.

    ```working
        10000000 divided by 500000 = 20
    ```

    > The advertising ceiling is twenty times the sub-standard food ceiling.

    Find the step that broke, and say why the answer looks reasonable.
  answer: |
    The calculator is not the step that broke. It divided exactly what it was handed, and 20 is the
    right answer to the sum that was typed.

    The step that broke is the typing. Count the digits in each number against the Act.

    ```working
        ten lakh     10,00,000  = 1000000     7 digits    typed 8 digits
        five lakh     5,00,000  =  500000     6 digits    typed 6 digits
    ```

    One zero too many went into the first number. What they actually divided was one crore.

    Done properly:

    ```working
        1000000 divided by 500000
        = 10 divided by 5
        = 2
    ```

    Twice, not twenty times.

    Why it looks reasonable: 20 is a clean whole number, and a clean answer feels like a confirmed
    one. Nothing on the display marks a mistyped figure, because from the calculator's side nothing
    went wrong. The only place this can be caught is before the equals sign, by counting the digits
    you typed against the digits in the source.
  refs: [fss_act_2006]
- level: 7
  prompt: |
    A colleague wants the average number of meals served over two days: the two days added
    together, then divided by 2. Monday had 1,150 meals and Tuesday 1,250. These figures are made
    up for this problem. They type one line into a phone calculator, and here is what came back.

    ```working
        1150 plus 1250 divided by 2 = 1775
    ```

    > The average is 1,775 meals a day.

    Find the step that broke, and say why the answer looks reasonable.
  answer: |
    The calculator did what the agreed order says. It divided first, so it halved only Tuesday's
    figure.

    ```working
        1250 divided by 2 = 625
        1150 plus 625 = 1775
    ```

    The step that broke is the typing. The adding had to happen first, and nothing on the line said
    so. Brackets say so.

    ```working
        (1150 plus 1250) divided by 2 = 1200
    ```

    The average is 1,200 meals a day. Pressing equals after the 1250 would also have worked, because
    then you choose the order yourself.

    Why it looks reasonable: 1,775 has four digits, like both days, and the calculator gave it
    without complaint. But there is a quick check it fails. An average of two numbers must sit
    between them, and 1,775 is bigger than both.
- level: 8
  prompt: |
    A colleague adds three penalty ceilings — ten lakh, three lakh and five lakh — and reports the
    total as "18,00,000, or about 1.8 crore". Find the step that broke and say what the total
    should be called.
  answer: |
    The addition first.

    ```working
        10,00,000
       + 3,00,000
       + 5,00,000
       = 18,00,000
    ```

    That is right. Eighteen lakh.

    Now the naming. A crore is 1,00,00,000, which is eight digits. 18,00,000 has seven.

    ```working
        1.8 crore  =  1,80,00,000     eight digits
        18 lakh    =    18,00,000     seven digits
    ```

    So the report is out by a factor of ten. The total should be called eighteen lakh, or 1.8
    million.

    Why it looks reasonable: the digits 1 and 8 appear in both, in that order. Only the digit count
    separates them, which is exactly why you count digits.
- level: 8
  prompt: |
    A ration shop's register shows 120 sacks of wheat at the start of the month, 30 sacks received
    and 165 sacks issued. These figures are made up for this problem. A clerk works out the stock
    at the end of the month.

    ```working
        120 plus 30 = 150
        150 minus 165 = 15
    ```

    > Stock at the end of the month: 15 sacks.

    Find the step that broke, and say why the wrong answer looks reasonable.
  answer: |
    The first line is right. The second is not.

    ```working
        150 minus 165 = -15
    ```

    Taking 165 from 150 goes 15 steps past zero. The clerk worked out 165 minus 150 instead, and
    dropped the sign.

    Now read what the right answer says. Minus fifteen sacks cannot exist. So the register is wrong
    somewhere: more sacks were written out than came in. The shelf needs counting, and the entries
    need checking.

    Why the wrong answer looks reasonable: 15 sacks is an ordinary stock. Dropping the sign did more
    than get the number wrong. It hid the only evidence that the register did not add up.
- level: 9
  prompt: |
    Here is a press line.

    > India's food regulator can fine a company up to ten million rupees for a misleading food
    > advertisement.

    You have the Food Safety and Standards Act, 2006 open. Decide what to check, check it, then say
    what your answer does not establish.
  answer: |
    What to check: the figure, by converting it into the grouping the Act uses.

    Section 53 caps the penalty at ten lakh rupees.

    ```working
        ten lakh      = 10,00,000 = 1,000,000  = one million
        ten million   = 1,00,00,000            = one crore
    ```

    So the line is out by a factor of ten. It should say one million, or ten lakh.

    What this does not establish. It does not tell you whether any such penalty has ever been
    imposed, or what was actually collected. It does not tell you who imposes it. And the figure
    comes from a copy of the Act that names no change to it after 2008. It is what this copy says,
    not what is in force today.
  refs: [fss_act_2006]
- level: 9
  prompt: |
    In a meeting somebody says this.

    > Enrolment at the school changed by plus 300 last year and by minus 400 this year. So
    > enrolment is now minus 100.

    The figures are made up for this problem. Decide what to compute, compute it, and say what your
    answer does not establish.
  answer: |
    The two figures are changes, not amounts. Add them to get the change across both years.

    ```working
        300 plus -400 = -100
    ```

    Across the two years, enrolment went down by 100. That part is right.

    The mistake is the word "enrolment". Enrolment is a count of children, and a count cannot go
    below zero. The change in it can. What the speaker has found is a fall of 100 from two years
    ago, not a school with minus 100 children.

    What it does not establish. How many children are enrolled now. For that you need the count two
    years ago, and nobody gave it. Why the number fell. Whether a fall of 100 is large, which
    depends on whether the school had 200 children or 2,000.
- level: 10
  prompt: |
    In a meeting somebody says this.

    > The scheme costs 400 crore, which is about 4 billion rupees. That is roughly 4,000 rupees for
    > each of the ten lakh people it reaches.

    Decide what to compute, compute it, and say what your answer does not establish.
  answer: |
    Two claims are buried in that sentence. Check them separately.

    First, 400 crore against 4 billion.

    ```working
        400 crore = 400 times 1,00,00,000
                  = 4,00,00,00,000
                  = 4,000,000,000
                  = 4 billion          correct
    ```

    Second, the figure per person.

    ```working
        4,000,000,000 divided by 10,00,000
        = 4,000,000,000 divided by 1,000,000
        = 4,000 rupees per person       correct
    ```

    Both hold. This is worth feeling: checking is not the same as finding a mistake, and a check
    that confirms is not wasted.

    What it does not establish. Nothing here says whether 4,000 rupees a person is a lot or a
    little, what it buys, or whether the money was spent. Nor whether ten lakh is who the scheme
    reaches or who it was designed for. The arithmetic is sound and the sentence is still not yet
    a fact about the world.
- level: 10
  prompt: |
    A note to a district office says this.

    > Cost per child: 4,00,000 plus 2,00,000 divided by 400 children, which comes to 1,500 rupees a
    > child.

    The figures are made up for this problem. Decide what to compute, compute it, and say what your
    answer does not establish.
  answer: |
    First read the line the way the agreed order reads it, dividing first.

    ```working
        2,00,000 divided by 400 = 500
        4,00,000 plus 500 = 4,00,500
    ```

    Read that way, the line says 4,00,500 rupees a child. That cannot be what the writer meant. They
    meant the two costs added together, then shared among 400 children.

    ```working
        4,00,000 plus 2,00,000 = 6,00,000
        (4,00,000 plus 2,00,000) divided by 400 = 1,500
    ```

    So 1,500 rupees a child is right, and the line as written is wrong. Anyone who types it whole
    into a calculator that shows the whole line gets 4,00,500. They will either trust it or throw
    the note away. A basic desk calculator works each step as the next key is pressed, so it gives
    1,500. That is the right figure from a line that is still wrong. The fix is brackets round the
    two costs.

    What it does not establish. Whether the two sums are the whole cost. Whether 400 is the number
    of children served or the number enrolled. Whether 1,500 rupees buys what the scheme promises.
retrieval_items:
- q: What makes the two fives in 4,505 worth different amounts?
  a: Their places. Each place is worth ten times the place immediately to its right, so the left-hand five is worth five hundred and the right-hand one is worth five.
- q: How many is one lakh, and how many is one crore, stated in the international names?
  a: One lakh is a hundred thousand. One crore is ten million.
- q: Below what figure do the Indian and international groupings look identical, and why does that matter?
  a: Below one lakh. Every number under a hundred thousand is written the same way in both, so the conversion feels safe right up to the point where the two ladders separate.
- q: A mass, a count of people or a volume comes out negative. What has the arithmetic told you?
  a: That something went wrong earlier. Those quantities cannot go below zero, so a figure, a step or a sign is wrong upstream, or a rule was run past where it holds. Report that the figures do not add up, not the negative amount. A change in them can be negative; the amount cannot.
- q: In what order is a written calculation carried out, and what is 3 plus 2 times 4?
  a: Brackets, then powers, then multiplying and dividing, then adding and taking away, left to right within each level. So 3 plus 2 times 4 is 11. A calculator that shows the whole line does this on a line typed whole, but not if you press equals part way. A basic desk calculator does not do it at all; test yours with 3 plus 2 times 4.
