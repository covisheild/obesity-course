must_know:
- point: |
    One equation with two unknowns has many answers, not one. Anyone who reads a single
    relationship as fixing a single quantity is reading something that is not there. That is
    the commonest way a number gets invented out of a real formula.
  kind: misconception
  bearing: methodological
- point: |
    Count the unknowns and count the equations before you start. Two unknowns need two
    statements, and if you have only one, the honest answer is a range rather than a number.
  kind: move
  bearing: methodological
- point: |
    Check a solved pair in both equations. A pair that satisfies one of them and not the other
    is not a solution. Check only the equation you solved last and you will never see it.
  kind: trap
  bearing: methodological
- point: |
    When somebody draws a conclusion about one quantity from a single relationship, ask what the
    second statement is and where it came from. That question is usually more productive in a
    meeting than arguing about the arithmetic.
  kind: consequence
  bearing: policy
- point: |
    Two statements pin two unknowns down only when they say different things. Two that repeat
    each other leave you with as many answers as before. Two that contradict each other leave
    you with none, which is itself worth reporting.
  kind: boundary
  bearing: methodological
- point: |
    Pick the method by the shape in front of you. Use substitution when one equation already has
    a letter standing nearly alone. Use elimination when the same letter carries matching numbers
    in both lines.
  kind: move
  bearing: teaching
- point: |
    Solving a pair tells you what follows from the two statements, and nothing about whether
    either is true. So the value of an answer is set by the weaker of the two inputs, and you
    report it with both of them named.
  kind: boundary
  bearing: methodological
exercises:
- type: interpretation
  prompt: |
    A district officer shows you one line from a planning note.

    > Every meal served costs us the grain plus the cooking fuel, and the two together come to 18
    > rupees a meal.

    They then ask you how much the grain alone costs.

    Say what you can and cannot answer from that line. Then say exactly what one further piece of
    information would let you answer it, and give two different forms that piece could take.
  answer: |
    What the line gives you is a relation between two quantities. Call the grain cost g and the
    fuel cost k, both in rupees a meal.

    ```working
        g + k = 18
    ```

    What you can say: the grain cost and the fuel cost add to 18 rupees a meal. So neither of
    them can be more than 18, and if one goes up the other must come down by the same amount.

    What you cannot say: what the grain costs. Any pair adding to 18 fits this line, and the line
    carries nothing that prefers one pair to another.

    What would settle it is a second statement about the same two quantities, true at the same
    time. It could take either of these forms, among others.

    The first form names one of them outright.

    ```working
        k = 5
    ```

    Then the grain cost follows at once.

    ```working
        18 minus 5 = 13
    ```

    The second form relates them again, differently.

    ```working
        g = 2k
    ```

    Then substitute and solve.

    ```working
        2k + k = 18
        3k = 18
        18 divided by 3 = 6
    ```

    The fuel is 6 rupees and the grain is 12.

    ```working
        18 minus 6 = 12
    ```

    What matters in the answer you give the officer is the order of the two sentences. First: I
    cannot answer that from this line. Second: here is what I would need. Giving a number instead
    would be inventing one.
- type: teaching
  prompt: |
    A journalist has three minutes and no appetite for algebra. They have been told two things
    about a scheme. Its total spend went up, and its total number of meals went up. They want
    to write that the cost of each meal went up.

    Explain why that does not follow, in words they can use, with one sentence they could quote.
  answer: |
    Three minutes, no symbols, and one picture.

    Start with the shape of what they have. Two numbers went up. The thing they want to write
    about is a third number, built out of both. Knowing that two numbers rose does not tell you
    what happened to something made by dividing one by the other.

    Give them a case they can hold. Say a scheme spent more money and served more meals, and that
    the meals went up faster than the money. Then the cost of each meal went down while both
    totals went up. Nothing in the two rising figures rules that out.

    Then say what would settle it. The spend in each year and the meal count in each year, all
    four numbers. With those, the cost of a meal in each year is one division, and the comparison
    is a fact rather than a guess.

    The quotable sentence: "Two totals going up tells you nothing about the cost of a meal. The four
    numbers that would settle it take a morning to get."

    What not to say: do not say the claim is false. You do not know that either. You know it
    does not follow. That is a different statement, and a stronger one. It survives whatever
    the four numbers turn out to be.
quantitative: true
practice:
- level: 1
  prompt: |
    Two statements have to hold at the same time.

    ```working
        x + y = 7
        x minus y = 1
    ```

    Say for each of these pairs whether it is a solution.

    ```table
        x   y
        4   3
        5   2
        6   1
    ```
  answer: |
    Test each pair in both statements.

    The first pair.

    ```working
        4 plus 3 = 7
        4 minus 3 = 1
    ```

    Both hold, so this pair is a solution.

    The second pair.

    ```working
        5 plus 2 = 7
        5 minus 2 = 3
    ```

    The first holds and the second does not, because 3 is not 1. So this pair is not a solution.

    The third pair.

    ```working
        6 plus 1 = 7
        6 minus 1 = 5
    ```

    Again the first holds and the second does not. Not a solution.

    Notice that all three pairs passed the first test. That is exactly why a pair is checked in
    both statements and never in one.
- level: 2
  prompt: |
    Write down four different pairs of numbers that make this statement true.

    ```working
        x + y = 12
    ```

    Then say how many such pairs there are, and what that means about what this one line can tell
    you.
  answer: |
    Four pairs, and any four will do.

    ```table
        x   y
        0   12
        3   9
        5   7
        10   2
    ```

    Check one of them.

    ```working
        5 plus 7 = 12
    ```

    How many are there: as many as you like. Pick any number for x at all and subtract it from 12
    to get y, and the pair works. There is no end to them.

    What that means: this line cannot tell you what x is. It can only tell you what y is once
    somebody else has told you x. One statement, two unknowns, no answer.
- level: 3
  prompt: |
    Solve this pair by substitution.

    ```working
        y = 2x
        x + y = 18
    ```
  answer: |
    The first line already has y standing alone, so put 2x in place of y in the second line.

    ```working
        x + 2x = 18
        3x = 18
    ```

    Divide both sides by 3.

    ```working
        18 divided by 3 = 6
    ```

    So x is 6. Now go back to the first line for y.

    ```working
        2 times 6 = 12
    ```

    So y is 12.

    Check the pair in both statements.

    ```working
        6 plus 12 = 18
    ```

    And 12 is twice 6, so the first statement holds too.
- level: 3
  prompt: |
    Solve this pair by elimination.

    ```working
        x + y = 15
        x minus y = 3
    ```
  answer: |
    Add the two statements together, left side to left side and right side to right side. The y
    on the first line and the minus y on the second cancel each other.

    ```working
        2x = 15 plus 3
        15 plus 3 = 18
        18 divided by 2 = 9
    ```

    So x is 9. Put that into the first statement to get y.

    ```working
        15 minus 9 = 6
    ```

    So y is 6.

    Check the pair in both statements.

    ```working
        9 plus 6 = 15
        9 minus 6 = 3
    ```

    Both hold.

    Why elimination was the easier route here: the y carried the same number in both lines. One line
    had a plus and the other a minus. So adding removed it in a single step. Had neither
    letter matched, substitution would have been the shorter way.
- level: 4
  prompt: |
    A panel gives the energy as 440 kilocalories in every 100 grams and the protein as 10 grams.
    The carbohydrate line and the fat line are missing. A note attached to the packet says the
    carbohydrate and the fat together weigh 75 grams. All four figures are made up for this
    problem.

    Using the factors the Food Safety and Standards (Labelling and Display) Regulations, 2020 set
    for calculating declared energy, work out the carbohydrate and the fat. Show every line and
    check the pair in both statements.
  answer: |
    Write the label rule and take the protein term out of it.

    ```working
        E = 4c + 4p + 9f
        4 times 10 = 40
        440 minus 40 = 400
    ```

    So the first statement is this.

    ```working
        4c + 9f = 400
    ```

    The note gives the second statement.

    ```working
        c + f = 75
    ```

    Rearrange the second to put c on its own, then substitute it into the first.

    ```working
        c = 75 minus f
        4 times the whole of 75 minus f, plus 9f = 400
    ```

    Work the bracket out. Four times 75 is 300, and four times minus f is minus 4f.

    ```working
        4 times 75 = 300
        300 minus 4f + 9f = 400
        300 + 5f = 400
    ```

    Take 300 off both sides, then divide by 5.

    ```working
        400 minus 300 = 100
        100 divided by 5 = 20
    ```

    Twenty grams of fat. Now the carbohydrate.

    ```working
        75 minus 20 = 55
    ```

    Fifty-five grams of carbohydrate.

    Check the pair in both statements.

    ```working
        4 times 55 = 220
        9 times 20 = 180
        220 plus 180 = 400
    ```

    ```working
        55 plus 20 = 75
    ```

    Both hold.
  refs:
  - fssai_labelling_2020
- level: 5
  prompt: |
    Schedule II of the National Food Security Act, 2013 sets two figures you need here. The hot
    cooked meal for lower primary classes is 450 kilocalories. The one for upper primary classes
    is 700 kilocalories.

    A kitchen serves 50 meals in a day, some lower primary and some upper primary, and its plan
    totals 27,500 kilocalories for the day. The 50 and the 27,500 are made up for this problem.

    Work out how many meals of each kind the plan is for. Show every line, and check the pair in
    both statements.
  answer: |
    Name the two unknowns. Let L stand for the number of lower primary meals and U for the number
    of upper primary meals.

    The first statement is the count of meals.

    ```working
        L + U = 50
    ```

    The second is the total kilocalories, with each meal carrying its own figure from Schedule
    II.

    ```working
        450L + 700U = 27,500
    ```

    Rearrange the first statement and substitute into the second.

    ```working
        L = 50 minus U
        450 times the whole of 50 minus U, plus 700U = 27,500
    ```

    Work the bracket out.

    ```working
        450 times 50 = 22,500
        22,500 minus 450U + 700U = 27,500
    ```

    The two U terms collect into one.

    ```working
        700 minus 450 = 250
        22,500 + 250U = 27,500
    ```

    Take 22,500 off both sides, then divide by 250.

    ```working
        27,500 minus 22,500 = 5,000
        5,000 divided by 250 = 20
    ```

    Twenty upper primary meals. Now the lower primary count.

    ```working
        50 minus 20 = 30
    ```

    Thirty lower primary meals.

    Check the pair in both statements.

    ```working
        30 plus 20 = 50
    ```

    ```working
        450 times 30 = 13,500
        700 times 20 = 14,000
        13,500 plus 14,000 = 27,500
    ```

    Both hold. The two figures from Schedule II come from the Act. The split of 30 and 20 is your own
    arithmetic on a made-up plan. Say so whenever you quote it.
  refs:
  - nfsa_2013
- level: 6
  prompt: |
    Schedule II of the National Food Security Act, 2013 sets four figures you need here. The hot
    cooked meal for lower primary classes is 450 kilocalories and 12 grams of protein. The one
    for upper primary classes is 700 kilocalories and 20 grams of protein.

    A kitchen's day sheet gives only two totals: 27,500 kilocalories and 760 grams of protein.
    The meal count has not been written down. Both totals are made up for this problem.

    Work out how many meals of each kind the sheet describes. Use elimination rather than
    substitution. Show every line, and check the pair in both statements.
  answer: |
    Let L stand for the number of lower primary meals and U for the number of upper primary
    meals. Each kind carries its own pair of figures from Schedule II, so each total gives you
    one statement.

    ```working
        450L + 700U = 27,500
        12L + 20U = 760
    ```

    To eliminate U, make the U terms match. The first line carries 700U and the second carries
    20U, so multiply the whole of the second line by 35.

    ```working
        20 times 35 = 700
        12 times 35 = 420
        760 times 35 = 26,600
    ```

    So the second statement, multiplied through, says this.

    ```working
        420L + 700U = 26,600
    ```

    Now subtract that from the first statement, left from left and right from right. The U terms
    cancel.

    ```working
        450 minus 420 = 30
        27,500 minus 26,600 = 900
        30L = 900
    ```

    Divide both sides by 30.

    ```working
        900 divided by 30 = 30
    ```

    Thirty lower primary meals. Now go back for U, using the protein statement.

    ```working
        12 times 30 = 360
        760 minus 360 = 400
        400 divided by 20 = 20
    ```

    Twenty upper primary meals.

    Check the pair in both statements.

    ```working
        450 times 30 = 13,500
        700 times 20 = 14,000
        13,500 plus 14,000 = 27,500
    ```

    ```working
        12 times 30 = 360
        20 times 20 = 400
        360 plus 400 = 760
    ```

    Both hold. Notice what you were given and what you were not: no meal count at all, and two
    totals of different kinds. Two totals were enough, because energy and protein are different
    statements about the same two unknowns.
  refs:
  - nfsa_2013
- level: 7
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
        two statements have to hold at the same time
        x + y = 20
        x minus y = 6
        rearrange the first statement
        x = 20 minus y
        put that into the first statement
        20 minus y + y = 20
        20 = 20
        so both statements hold whatever y is
        and any pair adding to 20 will do
    ```
  answer: |
    The step that broke is the sixth line. The rearranged first statement was put back into the
    first statement.

    That can only ever give something true and useless. The rearranged line says the same thing
    as the line it came from, so putting one into the other says it twice. The 20 equals 20 that
    came out is not a finding. It is the working going round in a circle.

    The whole point of substituting is to carry what you learned from one statement into the
    other one. Put the rearranged first line into the second.

    ```working
        20 minus y minus y = 6
        20 minus 2y = 6
    ```

    Take 20 off both sides, then divide by minus 2. Easier still, add 2y to both sides and take 6
    off both sides.

    ```working
        20 minus 6 = 14
        2y = 14
        14 divided by 2 = 7
    ```

    So y is 7. Now go back for x.

    ```working
        20 minus 7 = 13
    ```

    So x is 13.

    Check in both statements.

    ```working
        13 plus 7 = 20
        13 minus 7 = 6
    ```

    Why it looks reasonable: every line of the working is a true statement, and the last line
    is the truest of all. Nothing was miscalculated. A reader watching for arithmetic errors
    finds none. The error is in which statement the substitution went into, and the page does
    not label them.
- level: 8
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
        a note carries two statements about a kitchen's day
        the lower primary and upper primary meals together number 50
        L + U = 50
        twice the lower primary meals and twice the upper primary meals together number 100
        2L + 2U = 100
        that is two statements and two unknowns, so the pair can be solved
        from the first, L = 50 minus U
        put it into the second
        2 times the whole of 50 minus U, plus 2U = 100
        100 minus 2U + 2U = 100
        100 = 100
        so L is 25 and U is 25
    ```
  answer: |
    Two things broke, and the second one is the one that matters.

    The first is the last line. The working reached a statement that is true for every pair, and
    then a pair was named anyway. Nothing in the working produced 25 and 25. The numbers were
    chosen because the two unknowns looked symmetrical.

    The second is upstream, and it is why the working could not have ended any other way. The
    second statement is the first statement doubled. Multiply the first by 2 and you get the
    second exactly, so the second says nothing the first did not already say.

    ```working
        50 times 2 = 100
    ```

    So this is one statement written twice, not two statements. Two unknowns and one statement
    means many answers, and 25 with 25 is only one of them.

    ```working
        30 plus 20 = 50
        10 plus 40 = 50
    ```

    Both of those pairs satisfy the note just as well as 25 and 25 does.

    What a real second statement would look like: one that says something the first cannot. A
    total of kilocalories for the day does that, because a lower primary meal and an upper
    primary meal carry different figures.

    Why it looks reasonable: the working counted two lines and two unknowns and drew the usual
    conclusion, and counting lines is what most people do. The substitution was carried out
    correctly. And 25 with 25 is a pair that does satisfy the statement, so checking it back
    against the note would not have caught this either. The only thing that catches it is asking
    whether the second line says anything new.
- level: 10
  prompt: |
    A programme note says this about a school kitchen.

    > Between last year and this year the kitchen's total number of meals went up, and its total
    > kilocalories went up. So it served more lower primary meals and more upper primary meals
    > than it did last year.

    Schedule II of the National Food Security Act, 2013 sets the lower primary hot cooked meal at
    450 kilocalories. It sets the upper primary hot cooked meal at 700 kilocalories. Take last year as
    30 lower primary meals and 20 upper primary meals a day. Those two counts are made up for
    this problem.

    Decide what to compute, compute it, and say what your answer does not establish.
  answer: |
    What to compute: whether a pair of counts exists in which both totals rise and one of the two
    counts falls. If one does, the claim does not follow, whatever this kitchen actually did.

    Start with last year's two totals.

    ```working
        30 plus 20 = 50
    ```

    ```working
        450 times 30 = 13,500
        700 times 20 = 14,000
        13,500 plus 14,000 = 27,500
    ```

    Fifty meals and 27,500 kilocalories.

    Now try this year as 26 lower primary meals and 25 upper primary meals.

    ```working
        26 plus 25 = 51
    ```

    ```working
        450 times 26 = 11,700
        700 times 25 = 17,500
        11,700 plus 17,500 = 29,200
    ```

    Fifty-one meals and 29,200 kilocalories. Both totals went up. The lower primary count went
    down, from 30 to 26.

    So the claim does not follow. Two totals are two statements about two unknowns, and knowing
    that both totals rose is not knowing either unknown. The upper primary meal carries a larger
    figure, so shifting meals towards it lifts the kilocalorie total even while one count falls.

    What this does not establish. It does not establish that the lower primary count actually
    fell, and nothing here says the note's conclusion is false. It says the two totals do not
    reach it. It also does not establish what the kitchen did at all, because the counts used
    here were invented to test the reasoning. And it says nothing about whether any child ate a
    meal, since a meal counted and a meal eaten are two different things.

    What to ask for instead: both counts for both years. Two counts and two totals for one year
    would also do it, because then you have two statements and two unknowns and the pair solves.
  refs:
  - nfsa_2013
retrieval_items:
- q: How many solutions does one equation with two unknowns have?
  a: As many as you like. Fix either unknown and the equation fixes the other, so the equation
    ties the two together rather than pinning either of them down.
- q: What are the two ways of solving two equations in two unknowns, and when does each suit?
  a: Substitution, which rearranges one equation to give a letter alone and puts that into the
    other, and suits a pair where one letter nearly stands alone already. Elimination, which adds
    a multiple of one equation to the other so a letter cancels, and suits a pair where the same
    letter carries matching numbers.
- q: What are the two ways a pair of equations can fail to give one answer?
  a: The second can repeat the first, in which case there are as many answers as before. Or the
    two can contradict each other, in which case there is no answer at all and one of the two
    statements is wrong.
