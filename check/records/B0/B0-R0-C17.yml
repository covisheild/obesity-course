simplified_explanation: |
  The section before this one solved equations with one letter in them. This one starts where a
  line has two.

  Here is such a line.

  ```working
      x + y = 10
  ```

  Ask what x is. There is no single answer. Try some pairs and see.

  ```table
      x   y
      1   9
      4   6
      7   3
  ```

  Every pair in that list makes the statement true, and there are as many more as you care to
  write down.

  That is the point to hold on to, and it is the one worth more than the method that follows. One
  equation with two unknowns does not pin either of them down. It ties them together. Fix one and
  the other follows; fix neither and you have nothing.

  So when somebody gives you one relationship between two quantities and then tells you a fact
  about one of them, they have told you something. When they give you the relationship alone and
  then say what one of the quantities is, they have not.

  Now add a second statement that has to be true at the same time.

  ```working
      x + y = 10
      x minus y = 4
  ```

  Now there is one pair that works, and only one. Two statements, two unknowns.

  There are two ways to find it, and they are the same idea approached from different sides.

  The first is substitution. You have substituted a number for a letter before now. This is the
  same move with an expression in place of the number, and what it leaves behind is algebra rather
  than arithmetic.

  Rearrange one equation so that one letter stands alone, then put that into the other equation.
  The second equation then holds only one letter, which you already know how to solve.

  Rearrange the first line to give x on its own.

  ```working
      x = 10 minus y
  ```

  Now put that in place of x in the second line.

  ```working
      10 minus y minus y = 4
      10 minus 2y = 4
      2y = 6
      y = 3
  ```

  Then go back and get x.

  ```working
      x = 10 minus 3
      x = 7
  ```

  The second way is elimination. Add the two equations together, left to left and right to right.
  The y and the minus y cancel.

  ```working
      2x = 10 plus 4
      10 plus 4 = 14
      14 divided by 2 = 7
  ```

  Same answer, fewer steps here, because this pair happened to be built for it.

  Now check. Put both numbers into both statements, not into one of them.

  ```working
      7 plus 3 = 10
      7 minus 3 = 4
  ```

  Both hold, so the pair is the solution.

  Two more shapes to recognise, because they arrive without warning.

  Sometimes the second statement repeats the first.

  ```working
      x + y = 10
      2x + 2y = 20
  ```

  The second line is the first line doubled. It is true whenever the first is true, so it adds
  nothing, and you are back to as many answers as you like.

  And sometimes the two statements cannot both hold.

  ```working
      x + y = 10
      x + y = 12
  ```

  Two numbers cannot add to 10 and to 12. There is no pair at all, and the useful thing to say is
  not the answer but that one of the two statements is wrong.
illustration:
  body: |
    A packet reaches you with two lines of its panel gone. The energy is still there, 468
    kilocalories in every 100 grams, and so is the protein, 12 grams. The carbohydrate line and
    the fat line have torn away. Those figures are made up for this problem. The label rule is
    the real one you have used in the two sections before this.

    ```working
        E = 4c + 4p + 9f
    ```

    Put in what the panel still gives you. The protein is 12 grams, so the protein term is 4
    times 12.

    ```working
        4 times 12 = 48
    ```

    Take that 48 off both sides.

    ```working
        468 minus 48 = 420
    ```

    So what you know is this.

    ```working
        4c + 9f = 420
    ```

    One line, two unknowns. What comes back first is not a wrong sum. It is the belief that there
    is one answer to find. There is not.

    Look at three pairs that all satisfy that line.

    ```table
        carbohydrate grams   fat grams   from carbohydrate   from fat   total
        60   20   240   180   420
        105   0   420   0   420
        15   40   60   360   420
    ```

    Every row is a genuine answer. The packet could have been any of them, and this line cannot
    tell you which. Work out any one of the rows yourself and you will see it hold.

    ```working
        4 times 15 = 60
        9 times 40 = 360
        60 plus 360 = 420
    ```

    That is what one equation with two unknowns does. It ties c and f together. It fixes neither.

    So what would fix them? A second statement that has to be true at the same time.

    Suppose the maker tells you the carbohydrate is three times the fat. That sentence is made up
    for this problem too, and where a second statement comes from is the thing to check hardest.
    Write it beside the first.

    ```working
        4c + 9f = 420
        c = 3f
    ```

    Now substitute. The second line says c is 3f, so put 3f wherever c stands in the first line.

    ```working
        4 times 3f, plus 9f = 420
        12f + 9f = 420
        21f = 420
    ```

    Divide both sides by 21.

    ```working
        420 divided by 21 = 20
    ```

    Twenty grams of fat. Now go back for the carbohydrate.

    ```working
        3 times 20 = 60
    ```

    Sixty grams of carbohydrate.

    Check both numbers in both statements. Checking one is not checking the pair.

    ```working
        4 times 60 = 240
        9 times 20 = 180
        240 plus 180 = 420
    ```

    The first statement holds. And 60 is three times 20, so the second holds as well.
  analogy_breaks_when: |
    The second statement was handed to you here. In real work it has to come from somewhere, and
    where it came from is the part that decides whether your answer means anything.

    Two statements pin two unknowns down only when they say different things. A second
    statement that repeats the first leaves you exactly where you started. That can be hard to
    spot. A repeat wearing different numbers does not look like a repeat.

    And solving a pair tells you what follows from the two statements. It does not tell you that
    either statement is true. Feed in a wrong panel and you get a wrong pair, with no sign on the
    page that anything went wrong.
