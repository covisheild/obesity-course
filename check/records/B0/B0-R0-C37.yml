definition:
  text: |
    DNA is a molecule built from repeating units called nucleotides. Each nucleotide has three
    parts: a base containing nitrogen, a sugar with five carbons, and a phosphate group. The base
    is one of four — adenine, guanine, cytosine and thymine, written A, G, C and T.

    A DNA molecule is two strands twisted around each other into a right-handed helix. The sugars
    and the phosphates form the backbone of each strand. The bases are stacked inside, and every
    base is paired with a base opposite it on the other strand. A pairs with T, and C pairs with G.
    Bases that pair in this way are called complementary. Because the pairing is fixed, the order
    of the bases along one strand fixes the order along the other.

    Genes are carried on chromosomes. An organism holding two matching copies of each chromosome,
    one inherited from each parent, is diploid. Peas are diploid, and so are virtually all animals.
    The gene that encodes a protein determines the order of amino acids in that protein.

    Where one gene exists in more than one version, the versions are called alleles. An allele
    arises by mutation and sits at the same relative position on the matching chromosome. A diploid
    organism therefore carries two alleles of a gene, and the two may be the same or different.

    The traits an organism visibly expresses are its phenotype. Its underlying genetic make-up,
    counting both the alleles that are expressed and those that are not, is its genotype. Where one
    allele is dominant and the other recessive, an organism carrying two dominant alleles and an
    organism carrying one of each look identical. They have different genotypes and the same
    phenotype.

    Everything above describes the case in which a single gene controls a single characteristic.
    That case is what the cited section sets out, and it sets it out as a case. Nothing in it fixes
    how many genes lie behind any particular human trait, and nothing in it establishes that a
    trait is settled at conception. A gene fixes the order of amino acids in a protein. Whether
    that protein is made at a given moment is regulated by signals arriving at the cell, and
    whether it works once made depends on the conditions it sits in.
