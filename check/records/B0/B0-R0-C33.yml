  analogy_breaks_when: |
    The four energy figures in the kitchen — 60,000, 42,000, 11,000 and 7,000 joules — are made up
    for this example. No burner was measured. Only the size of the joule comes from a source.

    The shut kitchen is an idealisation and it has a time limit. Over two minutes, a closed room
    loses little enough through its walls that treating the crossing as zero is fair. Over an hour
    it is not fair, and over a day it is wrong. Every sealed boundary in this course is sealed for
    a stated stretch of time.

    Every route across the line has to be on your paper. Miss one — a window left open, a wire, a
    drain, light going out through glass. The energy that went that way then turns up in your
    arithmetic as an error in a route you did count. So a balance that does not close has two
    possible causes. Either a route was left off the paper, or a figure on the paper is wrong. The
    balance cannot tell you which.

    Conservation is exact and it is not the whole story about energy. The 7,000 joules spread
    through the kitchen air is every bit as real as the 42,000 in the water, and it will not cook
    anything. The balance counts joules. It says nothing about which joules you can still use.

    The balance holds for a person exactly as it holds for a pan. What it will not do is turn
    joules into kilograms of a body. That conversion needs to know what the kilograms are made of,
    which is a question about bodies and not about arithmetic. Nothing in this course has given you
    that figure, and nothing in this section can produce one. If a figure in kilocalories for each
    kilogram is offered to you as though it followed from conservation, it does not follow from
    anything here.
must_know:
- point: |
    An energy figure with no boundary attached is not a measurement yet. Ask "round what?" before
    you argue about the number. Two people quoting different figures for one event are often both
    right. They drew different lines, and the argument ends the moment somebody says where their
    line was.
  kind: move
  bearing: methodological
- point: |
    Energy is never lost, so refuse the word when somebody uses it to close an inquiry. Energy that
    has left your system is in the surroundings, by some route. Naming the route is the work. A
    claim that energy was lost tells you only that the speaker stopped counting.
  kind: misconception
  bearing: methodological
- point: |
    A system gains or loses energy only by energy crossing its boundary. So every explanation of a
    change has to name a crossing. A mechanism that adds no route, and makes no existing route
    bigger, cannot move the balance. Say that to anyone who offers you one.
  kind: move
  bearing: clinical
- point: |
    The balance tells you the numbers must add up. It never tells you why one of them moved. So do
    not use conservation to explain anything. It is an identity, in the way a shop's ledger is an
    identity, and no ledger has ever explained a purchase. Anyone arguing from "energy must be
    conserved" to a cause has changed the subject.
  kind: boundary
  bearing: methodological
- point: |
    Nothing turns joules into kilograms of a body. That is a limit of the tool, not a gap to be
    filled from somewhere handy. How much energy a kilogram of change holds
    depends on what the change is made of. So a single conversion figure, handed to you as
    arithmetic, carries a claim about composition that nobody has said out loud. Say so when you
    meet one.
  kind: trap
  bearing: clinical
- point: |
    A person is not a closed system, so "the energy has to go somewhere" is true and names nothing.
    Energy crosses a person's line inwards in food and drink. It crosses outwards as heat, as work
    done on things around them, and in what leaves the body unabsorbed. Until those routes are
    counted, the sentence is a reminder to count rather than a finding.
  kind: consequence
  bearing: clinical
- point: |
    Teach the line before the equation. A trainee who draws a closed boundary and lists the
    crossings can set up a problem they have never seen. One who has learnt the balance and not the
    boundary will apply it to whichever things the question happens to name.
  kind: move
  bearing: teaching
- point: |
    When a claim is defended on the ground that energy is conserved, say plainly what conservation
    does. It rules things out. On its own it establishes nothing. It is the cheapest check you have
    and the weakest evidence you have, and those two facts are the same fact.
  kind: move
  bearing: public
exercises:
- type: retrieval
  prompt: |
    Without looking back, write down the balance line for energy across a boundary, in words.

    Then say, in one sentence each, what it rules out and what it cannot tell you.
  answer: |
    The balance line, in words. Start with the energy inside the boundary at the start. Add
    everything that crossed the boundary inwards. Take away everything that crossed it outwards.
    What you are left with is the energy inside the boundary at the end.

    What it rules out: any change in the energy inside that did not happen by something crossing
    the line. There is no other route, so a proposed mechanism that adds no crossing cannot change
    the balance.

    What it cannot tell you: which route energy took, or why a crossing changed size. It also
    cannot tell you what a quantity of energy is worth in any unit other than a unit of energy.

    One thing to check in your own answer. Did you write "inside the boundary" rather than just
    "inside"? The line is the part people drop, and it is the part that makes the sentence mean
    anything.
  confidence_first: true
- type: critique
  prompt: |
    A note about a community kitchen contains this line.

    > We measured the gas going in and the heat going into the food. Only about two thirds of the
    > energy reached the food, so a third of the energy was lost. The burners are faulty and should
    > be replaced.

    The kitchen and the figures are made up for this exercise. Say what is wrong with the reasoning,
    and say what you would ask for.
  answer: |
    Two separate things are wrong, and the first one is a word.

    The word "lost" is doing damage. Energy does not leave the accounts. The third of the energy that did not reach the food went somewhere. The note has not said where. So it has
    reported that the writer stopped counting, dressed up as a finding.

    Redraw the line and the sentence changes. Put the boundary round the food, and that third
    crossed out of it. Put it round the whole kitchen, and the flue is a hole in your line, so
    somebody has to say how much went up it. That third is in the air, in the steel of the pans, in
    the walls, and in whatever went up the flue. Name those routes and you have an account. Do not
    name them and you have a gap.

    The second thing wrong is the conclusion. A fraction reaching the food is not by itself evidence
    of a fault, because no figure has been given for what a working burner does. A number becomes a
    finding only when it is compared with something.

    What to ask for. First, the routes: how much went up the flue, how much into the pans, how much
    into the room, measured or at least estimated separately. Second, the same measurement on a
    burner known to be in good order, so that the two thirds has something to be worse than. Third,
    the time over which each figure was taken. A boundary treated as sealed is only sealed for a
    stated stretch of time.

    And one thing to say out loud. The energy in the room is real energy and it is no use for
    cooking. That is a fair complaint about a kitchen. It is not the same complaint as energy going
    missing, and only one of the two is possible.
- type: teaching
  prompt: |
    A journalist has three minutes and no jargon. They have read this: "the body obeys the laws of
    physics, so weight is just energy in minus energy out". They want to know whether it is true.

    Say what you would tell them, and give them one quotable sentence.
  answer: |
    Three minutes, no jargon, and they need a line they can print. Say yes and no in that order,
    because the yes is the easy half.

    The yes. Energy really is never made and never destroyed. Draw a line round a person and the
    energy inside that line can only change by energy crossing it. That much is arithmetic and
    nobody serious argues with it.

    Now the no, and keep it concrete. That sentence has two words in it that are not doing what
    they look like they are doing.

    The first is "out". Energy leaves a person by several routes at once. It leaves as heat. It
    leaves as work done on things around them. And it leaves in what passes through the body
    without being absorbed. "Out" is a list, not a number, and the list has to be measured route by
    route.

    The second is "weight". Weight is measured in kilograms and energy is measured in joules, and
    the balance line never converts one into the other. To do that you would have to say what a
    kilogram of change in a body is made of. That is a question about bodies, not about physics. So
    the physics does not hand them the sentence they read. Something else has to, and that
    something else is evidence.

    The quotable sentence: "Energy in minus energy out is a ledger, not an explanation. It tells you
    the numbers have to add up. It never tells you why one of them moved."

    What not to offer: a figure for how many kilocalories make a kilogram. You do not have one, and
    a number given to fill a pause is the part that gets printed.
quantitative: true
practice:
- level: 1
  prompt: |
    A system holds 1,200 at the start of an interval. Over that interval 450 crosses in and 610
    crosses out.

    Work out the amount inside at the end, and the net crossing.
  answer: |
    Use the balance line. The amount inside at the end is the amount inside at the start, plus what
    crossed in, minus what crossed out.

    ```working
        1200 plus 450 = 1650
        1650 minus 610 = 1040
    ```

    One thousand and forty inside at the end.

    The net crossing is what came in minus what went out.

    ```working
        450 minus 610 = -160
    ```

    Minus 160 over the interval. It is negative, in the way the section on counting showed you, and
    the amount inside fell by exactly that much.

    Check it in one line.

    ```working
        1200 plus 450 minus 610 = 1040
    ```
- level: 2
  prompt: |
    Each row below is one boundary over one interval. Two of the four numbers in each row are
    given. Work out the missing one.

    ```table
    | inside at the start | crossed in | crossed out | inside at the end |
    | 900 | 300 | 100 | |
    | 900 | 300 | | 1050 |
    | 900 | | 250 | 1100 |
    | 900 | 0 | 0 | |
    ```
  answer: |
    The same line does all four, run forwards in the first row and backwards in the rest.

    First row. Start, plus in, minus out.

    ```working
        900 plus 300 minus 100 = 1100
    ```

    Eleven hundred inside at the end.

    Second row. The end is given, so work out what must have crossed out. Start plus in comes to
    this.

    ```working
        900 plus 300 = 1200
    ```

    Twelve hundred if nothing had left. It ended at 1,050, so the difference is what crossed out.

    ```working
        1200 minus 1050 = 150
    ```

    A hundred and fifty crossed out.

    Third row. Now the inflow is missing. The end plus what left is what the start plus the inflow
    must have been.

    ```working
        1100 plus 250 = 1350
        1350 minus 900 = 450
    ```

    Four hundred and fifty crossed in.

    Fourth row. Nothing crossed either way, so nothing changed.

    ```working
        900 plus 0 minus 0 = 900
    ```

    Nine hundred at the end. Notice what the fourth row does and does not say. The amount inside is
    unchanged because nothing crossed the line. That is a different situation from an amount
    unchanged because two large crossings matched, and the end figure alone cannot tell the two
    apart.
- level: 4
  prompt: |
    A kerosene lamp burns in a room for an hour. The kerosene releases 900,000 joules of chemical
    energy in that hour. Of that, 840,000 joules ends up warming the air and the walls of the room,
    and the rest leaves through the window as light. The room is otherwise shut.

    The lamp, the room and both figures are made up for this problem.

    Work out how much energy leaves through the window. Then give the change in the energy inside
    each of these three boundaries, with its unit, and say for each one what crossed.

    a) Round the kerosene in the lamp.

    b) Round the lamp, the air and the walls together. Count the window as a hole in the boundary.

    c) Round the room and everything outside it that the light reaches.
  answer: |
    First the light, which is what the hour's energy did not leave in the room.

    ```working
        900000 minus 840000 = 60000
    ```

    Sixty thousand joules leaves through the window as light.

    Now take the three boundaries one at a time, and for each one ask what crossed it.

    **a) Round the kerosene.** At the start the kerosene holds 900,000 joules of chemical energy.
    At the end it is burnt and holds none of it. All 900,000 joules crossed out of that boundary,
    into the flame and from there into the air, the walls and the light. Nothing crossed in.

    ```working
        0 minus 900000 = -900000
    ```

    The change is minus 900,000 joules.

    **b) Round the lamp, the air and the walls.** The chemical energy of the kerosene starts inside
    this line, so it is not a crossing. The only crossing is the light going out of the window.

    ```working
        840000 minus 900000 = -60000
    ```

    The change is minus 60,000 joules, and it is exactly the light. Check it against the routes:
    840,000 joules stayed inside as warmth, 60,000 left.

    ```working
        840000 plus 60000 = 900000
    ```

    **c) Round the room and everything the light reaches.** Now the light is inside the line too,
    so nothing crosses it at all.

    ```working
        0 minus 0 = 0
    ```

    The change is zero joules. Inside that line, 900,000 joules of chemical energy became 900,000
    joules of warmth and light. The form changed and the total did not.

    Read the three answers together. Minus 900,000, minus 60,000, and zero, for one hour of one
    lamp. Each is the correct answer to its own question, and the question is the line.
- level: 5
  prompt: |
    A solar water heater sits on a roof. Over one day, 5,000,000 joules of sunlight crosses into the
    tank of water. At the end of the day the energy in the water is 4,100,000 joules higher than it
    was at the start.

    The heater and both figures are made up for this problem.

    Work out how much energy crossed out of the tank over the day, and say what fraction of the
    sunlight that is. Then say what your answer does not tell you.
  answer: |
    Run the balance line backwards. The change inside is what crossed in minus what crossed out, so
    what crossed out is what crossed in minus the change inside.

    ```working
        5000000 minus 4100000 = 900000
    ```

    Nine hundred thousand joules crossed out of the tank over the day.

    Now the fraction, which is the crossing out divided by the crossing in.

    ```working
        900000 divided by 5000000 = 0.18
    ```

    Nought point one eight, which as a percentage is 18 per cent.

    ```working
        0.18 times 100 = 18
    ```

    Check it forwards before you trust it.

    ```working
        5000000 minus 900000 = 4100000
    ```

    Four million one hundred thousand joules, which is the figure given.

    What this does not tell you. It does not tell you by which route the 900,000 joules left. It could have gone through the tank's walls into the air, or along the pipes. It could have gone
    back out from the hot surface, or in water drawn off and used. The balance fixes the total
    that crossed and says nothing about how many routes it was shared between.

    It also does not tell you that 18 per cent is a lot or a little, because nothing here says what
    a well-made tank does. A fraction becomes a finding only when it is set against something.
- level: 7
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
        a burner releases 60,000 joules of chemical energy in two minutes
        the water in the pan gains 42,000 joules in those two minutes
        60,000 minus 42,000 = 18,000
        so 18,000 joules was destroyed
        energy cannot be destroyed, so one of the two measurements must be wrong
    ```
  answer: |
    The step that broke is the fourth. Nothing was destroyed. Eighteen thousand joules went
    somewhere the accounting did not look.

    The trouble starts one line earlier, and it is a boundary that changed without anybody saying
    so. The 60,000 is counted round the burner and the gas. The 42,000 is counted round the water
    alone. Those are two different lines, so the difference between the two figures is not a
    shortfall. It is the energy that ended up between the two lines — in the steel of the pan, in
    the air, in the flue.

    Write the third line out with its line named and the arithmetic stops looking alarming.

    ```working
        60000 minus 42000 = 18000
    ```

    Eighteen thousand joules crossed out of the boundary that holds the burner and the water, and
    it is now in the surroundings. That is a finding about routes, not a violation.

    What to do instead: put both numbers on the same boundary before subtracting. One way is to
    bring the pan and the air inside the line. Then nothing has crossed, and the two figures no
    longer need to match. The other way is to keep the line round the water. Then you need a figure
    for what crossed into the water, not a figure for what the gas released.

    Why the wrong answer looks reasonable. The subtraction is correct arithmetic on two correct
    measurements, and the conclusion even appeals to a real law to check itself. Every part of it
    is careful except the part nobody wrote down, which is where each number's line was.
- level: 8
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
        a room is shut for an hour and nothing goes in or out of the door
        a fan inside the room runs for that hour on 300,000 joules of electricity from the mains
        energy is conserved, so the total energy inside the room cannot change
        300,000 minus 300,000 = 0
        so the room cannot have got any warmer
    ```
  answer: |
    The step that broke is the third, and the word that broke it is "so".

    Conservation says the total energy is constant. It does not say the energy inside any line you
    happen to draw is constant. Those become the same statement only when nothing crosses the line,
    and here something does: the mains wire.

    Go and look at the boundary. The door is shut and the window is shut, and a cable runs through
    the wall. Electricity crossing that cable is energy crossing the boundary, exactly as much as
    anything carried through the door would be.

    So the balance line reads like this.

    ```working
        0 plus 300000 minus 0 = 300000
    ```

    The energy inside the room went up by 300,000 joules over the hour. The fan turned it into
    moving air and the moving air turned it into warmth, and all of it stayed inside. The room got
    warmer.

    The fourth line is arithmetic with nothing behind it. It subtracts the 300,000 from itself because line three assumed the answer. Subtracting a number
    from itself always gives zero, and tells you nothing at all.

    Why the wrong answer looks reasonable. The first two lines are correct, the law quoted is the
    right law, and the conclusion has the shape of a conservation argument. The check that catches
    it is the one this section asks for every time. Draw the line, then walk round it naming every
    route that crosses. A cable through a wall is easy to miss precisely because it is not a door.
- level: 9
  prompt: |
    A wellness page says this.

    > Energy cannot be created or destroyed. So every kilojoule of energy in the food you eat has
    > to end up somewhere in your body.

    Decide what to compute, compute it, and say what your answer does not establish.
  answer: |
    What to compute: the balance across a boundary drawn round a person, with every crossing named.
    The claim rests on conservation, so the way to test it is to use conservation properly.

    Draw the line round the person. Then list the routes by which energy crosses it. Inwards: food
    and drink. Outwards: heat leaving the body to the air and to whatever it touches. Also work done on things
    outside the body. Also the energy in everything that leaves the body unabsorbed.

    Now put the balance line on that.

    ```working
        the change in the energy inside = the energy in, minus the energy out
    ```

    Take a day where 9,000 kilojoules crosses in with food, 1,000 kilojoules leaves unabsorbed, and
    7,600 kilojoules leaves as heat and work. All three figures are made up, to show the shape.

    ```working
        1000 plus 7600 = 8600
        9000 minus 8600 = 400
    ```

    Four hundred kilojoules stays inside. Not 9,000. The word "somewhere" in the claim was doing
    the work of four routes, three of which point outwards.

    What this does not establish. It does not establish that the answer is 400 rather than some
    other figure, because the three numbers are invented and this section measures nothing. The
    shape is the finding. The size is not.

    It does not establish anything about weight. The answer is in kilojoules. Weight is in
    kilograms. Nothing in the balance converts one to the other. Doing so would mean saying what a
    kilogram of change in a body is made of.

    And it does not establish that the crossings are independent of each other. The balance holds
    whatever they do. Whether changing one of them leaves the others where they were is a question
    about bodies. The subject booklet on energy balance is where it is asked.

    What to say instead of the page's sentence. Energy in food that is not stored has left the
    person by a route you can name. Naming the routes is the entire content of the claim.
- level: 10
  prompt: |
    A colleague says this in a meeting.

    > The label says this packet holds 1,200 kilojoules. So eating it puts 1,200 kilojoules into
    > the person.

    The packet and the figure are made up for this problem.

    Decide what to compute, compute it, and say what your answer does not establish.
  answer: |
    What to compute: whether the boundary the label's figure was measured round is the same boundary
    the colleague is applying it to. That is the only question here, and it is answered by drawing
    both lines.

    The label's line. A food's energy figure is measured, or calculated, for the food burnt
    completely. The boundary is drawn round the food sample, and what crosses out is everything the
    sample holds. Call that figure 1,200 kilojoules.

    The colleague's line. This one is drawn round a person. What crosses in is not what the sample
    holds. It is what the sample holds, minus whatever leaves the person without being absorbed.

    So write both and subtract, with the unabsorbed part called U because nobody in the room has a
    figure for it.

    ```working
        the energy crossing into the person = 1200 minus U
    ```

    Now the only honest computation available. If U is zero the two lines give the same answer, and
    if U is anything at all they do not. Nobody in the meeting has a value for U. So the correct
    output of this computation is a sentence, not a number: we do not have that figure.

    What this does not establish. It does not establish that 1,200 is wrong. It is very likely the
    right answer to the question the label was answering.

    It does not establish how big U is. This section gives you no way to find out. It only shows
    you that the two boundaries differ, so a figure is needed.

    And it does not establish anything at all about the person's weight. That would need a second
    balance, in kilograms. It would also need a claim about what any change is made of, and the
    ground floor does not carry that claim.

    What to say in the meeting. The number is fine and the sentence is not. The label measures what
    crossed out of a food sample. The claim is about what crossed into a person. Those are two
    boundaries, and the difference between them is a quantity somebody has to measure rather than
    assume away.
retrieval_items:
- q: What is a system, what is its boundary, and who decides where the boundary goes?
  a: A system is whatever has been enclosed for the purpose of an accounting, the boundary is the
    closed surface enclosing it, and the surroundings are everything outside. The person doing the
    accounting decides where the boundary goes; nothing in the situation selects it.
- q: State the law of conservation of energy, and then state the balance line that follows from it
    once a boundary is drawn.
  a: Total energy is constant in any process; it may change form or be transferred from one system
    to another, but the total remains the same. So the energy inside a boundary at the end equals
    the energy inside at the start, plus everything that crossed inwards, minus everything that
    crossed outwards.
- q: Two people give different figures for the change in energy in the same event. What is the first
    thing to ask?
  a: Where each of them drew the boundary. Two boundaries round one situation give two different
    changes, both correct, because they answer different questions, so the figures cannot be
    compared until the lines are named.
- q: Somebody says energy was lost. What is wrong with the word, and what should be asked for
    instead?
  a: Energy is never lost; it crossed the boundary and is in the surroundings. What is missing is
    the route, so ask by which route it crossed and how much went each way. "Lost" reports that the
    counting stopped.
- q: Why can the energy balance not tell you how many kilojoules a kilogram of a body is worth?
  a: Because the balance counts energy in energy units and says nothing about what a kilogram of
    change is made of, and the answer depends on exactly that. The conversion is a claim about
    composition, not a consequence of conservation.
