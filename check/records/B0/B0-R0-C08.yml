simplified_explanation: |
  Round every number in sight to one digit and a power of ten. Do the arithmetic on the powers of
  ten, which is adding and subtracting small numbers. Then compare the answer against something
  whose size you already know.

  What you get back is not an answer. It is a verdict on somebody else's answer.
illustration:
  body: |
    Somebody asks you, in a meeting, roughly how much food energy a district's school meal programme
    puts out in a year. You do not have the figures. Do it anyway, on paper, in front of them.

    The second schedule of the National Food Security Act, 2013 sets a lower primary hot cooked meal
    at 450 calories. Round it to one digit.

    ```working
        450 calories, to one digit: 5 times 10^2
    ```

    Now the two numbers you do not have. Write each one down and mark it.

    ```working
        children in the district      1,00,000  =  10^5      <- a guess
        school days in a year         200       =  2 times 10^2   <- a guess
    ```

    Multiply, working on the powers of ten.

    ```working
        5 times 10^2, times 10^5, times 2 times 10^2
        = (5 times 2) times 10^(2 plus 5 plus 2)
        = 10 times 10^9
        = 10^10 calories in a year
    ```

    An estimate is only worth anything once you compare it against something.

    So compare. About how much does one person eat in a year? Take two thousand calories a day and
    mark it a guess as well.

    ```working
        2,000 a day  =  2 times 10^3      <- a guess
        365 days     =  4 times 10^2      (rounded to one digit)
        2 times 10^3, times 4 times 10^2 = 8 times 10^5, call it 10^6 calories a year
    ```

    Now divide the programme by the person.

    ```working
        10^10 divided by 10^6 = 10^(10 minus 6) = 10^4
    ```

    The programme delivers about as much food energy in a year as ten thousand people eat in a year.
    Does that sound right for a lakh of children getting one meal on some of the days?

    Check it roughly. One meal of 450 against a day of 2,000 is about a fifth. Two hundred school
    days out of 365 is about half. A fifth of a half is a tenth, and a tenth of a lakh of children
    is ten thousand. It agrees, so nothing has fallen over.

    Now the failure, which is why anyone bothers with the second half. Suppose that while typing you
    had put the district's children at ten lakh instead of one lakh.

    ```working
        10^6 children instead of 10^5
        answer becomes 10^11 calories
        10^11 divided by 10^6 = 10^5
    ```

    A hundred thousand people's worth of annual eating, from school meals, in one district. Hold
    that against a district population of a few lakh and it cannot be right. The school meals would
    be feeding a large part of everybody, all year, on one meal a day for part of the week.

    Notice what caught it. Not the arithmetic, which was faultless both times. The comparison
    against something whose size you already knew. That is the whole method, and the first half of
    it is useless without the second.

    Last, what you say out loud when you have done this. Not "it is ten to the ten". Say something
    like this.

    > On a rough calculation this comes out around the amount ten thousand people eat in a year. I
    > assumed a lakh of children and two hundred school days. If it is wrong by a factor of ten,
    > one of those assumptions is wrong and I want the real figures.
  analogy_breaks_when: |
    This method is built to catch a factor of ten and it is blind to a factor of two. It answers one
    question: is this number possible.

    The method only works if the thing you compare against is one you actually know. Compare against
    another estimate and you have two guesses agreeing with each other, which feels like
    confirmation and is not.

    And rounding to one digit cuts both ways. Round three numbers down and your answer is low by a
    factor of two or three before you start.
  numbers:
  - value: '450'
    quote: "Ration 800 20-25 4. Lower primary classes Hot Cooked Meal 450 12 5. Upper primary classes Hot Cooked Meal 700 20 6"
    unit: calories per hot cooked meal, lower primary classes, second schedule
    citekey: nfsa_2013
must_know:
- point: |
    An order-of-magnitude estimate is not a rough version of the right answer. It is a different
    tool with a different job: deciding whether a number somebody else has given you is possible.
  kind: misconception
  bearing: methodological
- point: |
    Then compare the answer against a quantity whose size you already know. The comparison is not
    the last step. It is the step that does the work.
  kind: move
  bearing: methodological
- point: |
    Write down every number you supplied yourself and label it a guess, in the working, where
    somebody can argue with it.
  kind: move
  bearing: methodological
- point: |
    This catches an error of a factor of ten and never one of a factor of two. So it cannot be used
    to argue that an effect is big enough to matter.
  kind: boundary
  bearing: methodological
- point: |
    When a journalist reads you a figure on the phone, you can usually say within thirty seconds
    whether it is possible. Say exactly that and no more: whether it is possible, and what you
    assumed.
  kind: consequence
  bearing: public
- point: |
    Indian figures cross between lakh, crore and million inside one discussion, and this is where a
    power of ten goes missing.
  kind: india_deviation
  bearing: policy
- point: |
    In a committee, an estimate offered with its assumptions written on the page is very hard to
    dismiss and very easy to improve. Someone will correct one of your guesses, which is the point.
  kind: consequence
  bearing: policy
- point: |
    Asked to check a calculation under time pressure, do not redo it. Estimate it independently and
    see whether the two land on the same power of ten.
  kind: trap
  bearing: teaching
exercises:
- type: calculation
  prompt: |
    A note claims that a state's school meal programme served 2 crore meals last year. Take the 450
    calorie lower primary standard from the second schedule of the National Food Security Act, 2013.
    Estimate the total food energy. Then estimate how many people's annual eating that represents.
    Write down every assumption you make and mark it. Then say whether the claim of 2 crore meals is
    possible for a state, and what you assumed to decide that.
  answer: |
    Energy first, in powers of ten.

    ```working
        450 calories, to one digit: 5 times 10^2
        2 crore meals = 2 times 10^7
    ```

    ```working
        5 times 10^2, times 2 times 10^7
        = 10 times 10^9
        = 10^10 calories
    ```

    Now the comparison, and both numbers in it are guesses.

    ```working
        one person eats about 2,000 calories a day   =  2 times 10^3    <- a guess
        days in a year, to one digit                 =  4 times 10^2
        so about 8 times 10^5, call it 10^6 calories a year
    ```

    ```working
        10^10 divided by 10^6 = 10^4
    ```

    About ten thousand people's worth of annual eating.

    Is 2 crore meals possible for a state? Work backwards to what it implies.

    ```working
        2 times 10^7 meals, over about 200 school days       <- a guess
        = 2 times 10^7 divided by 2 times 10^2
        = 10^5 children fed each day
    ```

    A lakh of children a day. For a large state that is low rather than impossible, and for a small
    one it is high. So the verdict is: possible. The figure to ask for next is the number of
    children enrolled, because that is the assumption doing all the work.

    The assumptions, gathered.

    - Two hundred school days.
    - Two thousand calories a day for one person.
    - That every meal was a lower primary meal, when the schedule sets a larger one for upper
      primary.

    The third is the one that would move the energy figure most.
  confidence_first: true
- type: critique
  prompt: |
    A press note says a proposed scheme will "reach 12 crore children at a cost of 40 crore rupees a
    year". Do an order-of-magnitude check on the cost per child and say what you conclude. Then say
    what your check can and cannot establish.
  answer: |
    Cost per child, in powers of ten.

    ```working
        40 crore rupees  = 4 times 10^8
        12 crore children, to one digit = 1 times 10^8
    ```

    ```working
        4 times 10^8 divided by 1 times 10^8 = 4 rupees per child per year
    ```working

    Four rupees a child for a year. Compare that against something you know: the price of one small
    item of food. Four rupees is around the cost of a single item, once.

    So the conclusion is that one of the two figures is wrong, or the scheme does something much
    smaller than "reach" suggests. The likeliest reading is that 40 crore is an administrative line
    and not the cost of whatever the children receive.

    What the check establishes: that the two numbers, taken together, cannot mean what the sentence
    implies. That is a strong finding and it took one division.

    What it cannot establish: which of the two numbers is wrong, or what the right figure is. It
    also cannot establish that the scheme is bad. A four rupee scheme that hands out one piece of
    information might be exactly right. The check tells you to ask, not what the answer is.
quantitative: true
practice:
- level: 1
  prompt: |
    Round each of these to one digit and a power of ten.

    ```working
        4,820      61       938,000      0.0037
    ```
  answer: |
    Keep the first digit, look at the next one to decide whether it goes up, and count the places.

    ```table
        4,820     -> 5 times 10^3
        61        -> 6 times 10^1
        938,000   -> 9 times 10^5
        0.0037    -> 4 times 10^-3
    ```

    The first one rounded up from 4.8 to 5. At this level of roughness that is the point: you are
    not trying to keep the 8.
- level: 2
  prompt: |
    Estimate each of these by rounding both numbers to one digit first. Then say, for the first
    one, whether your estimate is above or below the true answer.

    ```working
        412 times 7,900        61,000 divided by 290
    ```
  answer: |
    ```working
        412 times 7,900
        -> 4 times 10^2, times 8 times 10^3
        = 32 times 10^5
        = 3.2 times 10^6, call it 3 times 10^6
    ```

    ```working
        61,000 divided by 290
        -> 6 times 10^4, divided by 3 times 10^2
        = 2 times 10^2
    ```

    Above or below, for the first. The 412 was rounded down to 400 and the 7,900 up to 8,000. One
    each way, so the two pull in opposite directions and the estimate should be close. The true
    answer is 3,254,800, and the estimate of 3 million is a little under.
- level: 3
  prompt: |
    Two quantities are 4 times 10^6 and 9 times 10^7. Are they of the same order of magnitude? Show
    the working that decides it.
  answer: |
    Divide one by the other and see whether the answer is under about ten.

    ```working
        9 times 10^7, divided by 4 times 10^6
        = (9 divided by 4) times 10^(7 minus 6)
        = 2.25 times 10^1
        = about 22
    ```

    Twenty-two is more than ten, so no: they are not of the same order of magnitude. One is about
    an order of magnitude and a bit above the other.

    Notice that the exponents alone, 6 against 7, would have told you they were one step apart. The
    digits in front moved that to a bit more than one step. So divide, rather than reading the
    exponents off.
- level: 5
  prompt: |
    Estimate the number of school meals served in one Indian district in a school year. Mark every
    input you supply yourself, and give your answer to the nearest power of ten.
  answer: |
    Two inputs are needed and neither was given, so both are guesses and both get marked.

    ```working
        children fed in a district   1,00,000 = 10^5    <- a guess
        school days in a year        200 = 2 times 10^2 <- a guess
    ```

    Multiply.

    ```working
        10^5 times 2 times 10^2
        = 2 times 10^7 meals
    ```

    Two crore meals, so 10^7 to the nearest power of ten.

    Both guesses are the answer's real content. Suppose a district turns out to feed three lakh
    children. The answer moves to 6 times 10^7, which is still 10^7 to the nearest power of ten.
    That stability is what the method buys: the answer survived a guess being wrong threefold.
- level: 6
  prompt: |
    Section 3(1) of the National Food Security Act, 2013 gives 5 kilograms per person per month.
    Estimate the tonnes a district needs in a year. Mark every input you supply, and say which one
    your answer depends on most.
  answer: |
    One input is given, one is a guess.

    ```working
        5 kilograms per person per month
        people covered in a district   5,00,000 = 5 times 10^5   <- a guess
    ```

    Work it through.

    ```working
        5 kilograms times 5 times 10^5 people = 25 times 10^5 kilograms a month
        = 2.5 times 10^6 kilograms a month
        times 12 months = 30 times 10^6
        = 3 times 10^7 kilograms a year
    ```

    Now the unit. A tonne is a thousand kilograms.

    ```working
        3 times 10^7 divided by 10^3 = 3 times 10^4 tonnes a year
    ```

    About thirty thousand tonnes.

    Which input it depends on most: the population guess, because it is the only one that can be
    wrong. The 5 kilograms and the 12 months are both exact.
  refs: [nfsa_2013]
- level: 7
  prompt: |
    Here is a worked estimate. Find the step that broke.

    ```working
        3 times 10^4 households
        each getting 20 kilograms a month
        3 times 20 = 60
        so 60 times 10^4 = 6 times 10^4 kilograms a month
    ```
  answer: |
    The digits were multiplied correctly and then the power of ten was mishandled in the last step.

    ```working
        60 times 10^4 = 6 times 10^5
    ```

    Sixty is 6 times 10^1, and that extra ten has to go into the exponent, not disappear.

    ```working
        3 times 10^4, times 2 times 10^1
        = 6 times 10^5 kilograms a month
    ```

    Six lakh kilograms, or 600 tonnes, and the worked answer said sixty thousand.

    Why it looks reasonable: the digit 6 and the exponent 4 both sit in the line above. So the last
    line looks like a tidy-up rather than a step. It is a step. Putting one digit in front changes
    the exponent every time the digits reach ten.
- level: 7
  prompt: |
    Here is a worked estimate. Find the step that broke.

    ```working
        a scheme covers 30 lakh people
        each is to get 2 kilograms of grain a month
        30 lakh = 3 million = 3 times 10^5
        3 times 10^5, times 2 = 6 times 10^5 kilograms a month
        = 600 tonnes a month
    ```
  answer: |
    The third line crosses from the Indian ladder to the international one and drops a power of ten
    on the way. A lakh is 10^5, so thirty lakh is thirty of them.

    ```working
        30 lakh = 30,00,000 = 3 times 10^6
    ```

    Three million is right. Three times 10^5 is not. That is three lakh, ten times too small.

    Carry the corrected figure through.

    ```working
        3 times 10^6, times 2 = 6 times 10^6 kilograms a month
        6 times 10^6 divided by 10^3 = 6 times 10^3 tonnes a month
    ```

    Six thousand tonnes, and the worked estimate said six hundred.

    The comparison would have caught it without any of this. Six hundred tonnes shared among thirty
    lakh people is 0.2 kilograms each, and the line above says two. An estimate that contradicts
    its own input is finished before you look at the exponents at all.

    Why it looks reasonable: the line holds a true statement. Thirty lakh really is three million.
    The 3 was then taken from "million". The 10^5 was left behind from "lakh". Two halves of a
    correct sentence got fitted to the wrong number.
- level: 8
  prompt: |
    Here is a worked estimate. Find what is wrong with it, and it is not the arithmetic.

    ```working
        a district has about 10 lakh people          <- a guess
        about 2 per cent need the service            <- a guess
        each needs about 3 visits a year             <- a guess
        10^6 times 0.02 times 3 = 6 times 10^4 visits a year
    ```
  answer: |
    Check the arithmetic first, since it is offered.

    ```working
        10^6 times 0.02 = 2 times 10^4
        2 times 10^4 times 3 = 6 times 10^4
    ```

    That is right. Sixty thousand visits.

    What is wrong is that every input is a guess and nothing was compared against anything. The
    method has two halves and only the first was done. An estimate that is never checked against a
    quantity you actually know is three guesses multiplied together and presented as a finding.

    What the second half would look like. Sixty thousand visits a year is about 160 a day across
    the district. How many facilities and how many staff does that imply, and is that possible?
    That comparison is where an impossible answer shows itself.

    Why it looks reasonable: the guesses are all marked, which is the honest part, and it makes the
    working look complete. Marking a guess does not test it.
- level: 8
  prompt: |
    Here is a worked estimate and the conclusion drawn from it. The arithmetic is right. Say what
    is wrong with the conclusion.

    ```working
        district A   4 lakh households      <- a guess
                     3 visits each a year   <- a guess
                     4 times 10^5, times 3 = 1.2 times 10^6 visits
        district B   6 lakh households      <- a guess
                     3 visits each a year   <- a guess
                     6 times 10^5, times 3 = 1.8 times 10^6 visits
        so district B needs half as many staff again as district A
    ```
  answer: |
    Work out the factor the conclusion rests on.

    ```working
        1.8 times 10^6, divided by 1.2 times 10^6 = 1.5
    ```

    One and a half. That sits well inside a factor of two, and this method is blind to a factor of
    two. Every input was rounded to one digit, and the answer is claimed only to the nearest power
    of ten.

    ```working
        1.2 times 10^6, to the nearest power of ten = 10^6
        1.8 times 10^6, to the nearest power of ten = 10^6
    ```

    Both districts come out at 10^6 visits. The estimate says the two are the same size and says
    nothing else. A staffing sentence needs a real count of households in each district.

    What the method could have supported. Had district B come out at 10^7, a tenfold gap would have
    survived the rounding and the conclusion would have stood.

    Why it looks reasonable: the arithmetic is faultless, both guesses are marked, and the 1.5 came
    out of a division rather than being asserted. A number carries the precision of what went into
    it, and one-digit inputs cannot carry one and a half.
- level: 9
  prompt: |
    Here is a claim from a press note.

    > The programme will provide 50 lakh children with a daily glass of milk for 200 days at a cost
    > of 100 crore rupees.

    Decide what to compute, compute it, and say what your answer does not establish.
  answer: |
    Compute the cost of one glass, since that is the only quantity you have any feel for.

    ```working
        50 lakh children = 5 times 10^6
        200 days = 2 times 10^2
        glasses = 5 times 10^6, times 2 times 10^2 = 10^9 glasses

        100 crore rupees = 100 times 10^7 = 10^9 rupees

        10^9 rupees divided by 10^9 glasses = 1 rupee a glass
    ```

    One rupee a glass of milk. Compare that against a price you know: a glass of milk costs
    several times that at any shop in India.

    So something in the sentence is not as stated. Perhaps one of the three figures is wrong.
    Perhaps the milk is not bought at retail. Perhaps "provide" is doing work the note never
    explains.

    What this does not establish. It does not say which figure is wrong, and it does not say the
    programme is a bad one. It establishes that the three numbers cannot all be right as stated,
    which is enough to ask before repeating any of them.
- level: 10
  prompt: |
    A journalist reads you a figure over the phone and wants a comment in the next ten minutes.

    > A new tax on sugary drinks will raise 40,000 crore rupees a year.

    Decide what to compute, compute it, say what you would tell the journalist, and say what your
    answer does not establish.
  answer: |
    Work backwards to something you can judge. Per person is usually the way.

    ```working
        40,000 crore = 4 times 10^4 times 10^7 = 4 times 10^11 rupees
        population of India, roughly 1.4 times 10^9    <- a guess
        4 times 10^11 divided by 1.4 times 10^9
        = about 2.9 times 10^2
        = roughly 300 rupees per person per year
    ```

    Three hundred rupees a person a year, from every person in the country, on sugary drinks tax
    alone. Now compare against something you know. That is a meaningful share of what many
    households spend on all drinks in a year, and it assumes nobody avoids the tax.

    What to tell the journalist, in one sentence.

    > That works out at about 300 rupees a year from every person in India. That is high enough
    > that I would want the assumed consumption and tax rate before repeating it.

    What this does not establish. It does not show the figure is wrong. A narrow tax at a high rate
    on heavy consumers could reach it. It establishes which two numbers to ask for, and it took one
    division and one comparison.
retrieval_items:
- q: What is an order-of-magnitude estimate for?
  a: Testing whether a figure somebody has given you is possible, not producing a figure of your own.
- q: What size of error does this method catch, and what size does it miss?
  a: It catches an error of a factor of ten or more. It never catches one of a factor of two.
- q: What has to be written down alongside the arithmetic, and why?
  a: Every input you assumed rather than obtained, labelled as a guess, because the result is a claim about the arithmetic and those assumptions together.
