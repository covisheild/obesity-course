must_know:
- point: |
    An order-of-magnitude estimate is not a rough version of the right answer. It is a different
    tool with a different job: deciding whether a number somebody else has given you is possible.
    Using it to produce a figure for a document is the misuse to watch for in yourself.
  kind: misconception
  bearing: methodological
- point: |
    Round every input to one digit and a power of ten. Do the arithmetic on the exponents. Then
    compare the answer against a quantity whose size you already know. The comparison is not the
    last step. It is the step that does the work.
  kind: move
  bearing: methodological
- point: |
    Write down every number you supplied yourself and label it a guess, in the working, where
    somebody can argue with it. An estimate is a claim about the arithmetic and about your
    assumptions jointly, and an unlabelled assumption turns it into a claim about the world.
  kind: move
  bearing: methodological
- point: |
    This catches an error of a factor of ten and never one of a factor of two. So it cannot be used
    to argue that an effect is big enough to matter. Anyone who uses it that way, including you,
    should be stopped.
  kind: boundary
  bearing: methodological
- point: |
    When a journalist reads you a figure on the phone, you can usually say within thirty seconds
    whether it is possible. Say exactly that and no more: whether it is possible, and what you
    assumed. It is far more useful to them than a refusal and far safer than agreement.
  kind: consequence
  bearing: public
- point: |
    Indian figures cross between lakh, crore and million inside one discussion, and this is where a
    power of ten goes missing. Doing the estimate in powers of ten rather than in names is what
    stops it, because 10^5 and 10^7 cannot be confused by ear.
  kind: india_deviation
  bearing: policy
- point: |
    In a committee, an estimate offered with its assumptions written on the page is very hard to
    dismiss and very easy to improve. Someone will correct one of your guesses, which is the point.
    An estimate offered without them is a number that can only be believed or disbelieved.
  kind: consequence
  bearing: policy
- point: |
    Asked to check a calculation under time pressure, do not redo it. Estimate it independently and
    see whether the two land on the same power of ten. Redoing somebody's arithmetic repeats their
    assumptions; estimating it does not.
  kind: trap
  bearing: teaching
exercises:
- type: calculation
  prompt: |
    A note claims that a state's school meal programme served 2 crore meals last year. Take the 450
    calorie lower primary standard from the second schedule of the National Food Security Act, 2013.
    Estimate the total food energy. Then estimate how many people's annual eating that represents.
    Write down every assumption you make and mark it. Then say whether the claim of 2 crore meals is
    possible for a state, and what you assumed to decide that.
  answer: |
    Energy first, in powers of ten.

    ```
        450 calories, to one digit: 5 times 10^2
        2 crore meals = 2 times 10^7
    ```

    ```
        5 times 10^2, times 2 times 10^7
        = 10 times 10^9
        = 10^10 calories
    ```

    Now the comparison, and both numbers in it are guesses.

    ```
        one person eats about 2,000 calories a day   =  2 times 10^3    <- a guess
        days in a year, to one digit                 =  4 times 10^2
        so about 8 times 10^5, call it 10^6 calories a year
    ```

    ```
        10^10 divided by 10^6 = 10^4
    ```

    About ten thousand people's worth of annual eating.

    Is 2 crore meals possible for a state? Work backwards to what it implies.

    ```
        2 times 10^7 meals, over about 200 school days       <- a guess
        = 2 times 10^7 divided by 2 times 10^2
        = 10^5 children fed each day
    ```

    A lakh of children a day. For a large state that is low rather than impossible, and for a small
    one it is high. So the verdict is: possible. The figure to ask for next is the number of
    children enrolled, because that is the assumption doing all the work.

    The assumptions, gathered.

    - Two hundred school days.
    - Two thousand calories a day for one person.
    - That every meal was a lower primary meal, when the schedule sets a larger one for upper
      primary.

    The third is the one that would move the energy figure most.
  confidence_first: true
- type: critique
  prompt: |
    A press note says a proposed scheme will "reach 12 crore children at a cost of 40 crore rupees a
    year". Do an order-of-magnitude check on the cost per child and say what you conclude. Then say
    what your check can and cannot establish.
  answer: |
    Cost per child, in powers of ten.

    ```
        40 crore rupees  = 4 times 10^8
        12 crore children, to one digit = 1 times 10^8
    ```

    ```
        4 times 10^8 divided by 1 times 10^8 = 4 rupees per child per year
    ```

    Four rupees a child for a year. Compare that against something you know: the price of one small
    item of food. Four rupees is around the cost of a single item, once.

    So the conclusion is that one of the two figures is wrong, or the scheme does something much
    smaller than "reach" suggests. The likeliest reading is that 40 crore is an administrative line
    and not the cost of whatever the children receive.

    What the check establishes: that the two numbers, taken together, cannot mean what the sentence
    implies. That is a strong finding and it took one division.

    What it cannot establish: which of the two numbers is wrong, or what the right figure is. It
    also cannot establish that the scheme is bad. A four rupee scheme that hands out one piece of
    information might be exactly right. The check tells you to ask, not what the answer is.
retrieval_items:
- q: What is an order-of-magnitude estimate for?
  a: Testing whether a figure somebody has given you is possible, not producing a figure of your own.
- q: What size of error does this method catch, and what size does it miss?
  a: It catches an error of a factor of ten or more. It never catches one of a factor of two.
- q: What has to be written down alongside the arithmetic, and why?
  a: Every input you assumed rather than obtained, labelled as a guess, because the result is a claim about the arithmetic and those assumptions together.
