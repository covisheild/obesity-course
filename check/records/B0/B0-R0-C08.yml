definition:
  text: |
    The order of magnitude of a quantity is the power of ten nearest to it. Two quantities are of
    the same order of magnitude when their ratio is smaller than about ten.

    An order-of-magnitude estimate rounds every input to one significant figure, carries out the
    arithmetic on the powers of ten, and claims the answer only to the nearest power of ten.

    Its purpose is to test a figure, not to produce one.
  references:
  - citekey: openstax_prealgebra_2e
    kind: textbook
    locator: ch. 10, Polynomials, scientific notation
    verified:
      resolved_id: PENDING
      opened: true
      claim_located: false
      checked_on: '2026-09-20'
      note: |-
        Anchor confirmed to exist and to cover this topic: the book was opened on
        2026-09-22 and the named chapter located in its table of contents. The passage
        behind this definition has not been read yet, which is why claim_located is
        false. The content is a derivation the reader checks with a calculator, so it
