must_know:
- point: |
    An equals sign states that two things are the same number.
  kind: misconception
  bearing: methodological
- point: |
    Do the same thing to both sides, and write both sides of that step on the same line.
  kind: move
  bearing: methodological
- point: |
    A side that is a sum is divided or multiplied as a whole.
  kind: trap
  bearing: methodological
- point: |
    Check every rearrangement by putting your answer back into the equation you started from.
    One line, every time, before the number leaves your desk.
  kind: move
  bearing: methodological
- point: |
    Any one quantity in a formula can be recovered from the others, as long as every one of the
    others is known. Two more conditions apply. The rearranging must never divide by something that
    could be zero. And only one value may fit: where two values of the missing quantity give the
    same result, the formula cannot choose between them. So a register with one missing column is not always a register with missing
    information. Two gaps in the same row are a different matter, and one formula cannot fill
    both.
  kind: consequence
  bearing: policy
- point: |
    Never divide both sides by a letter unless you know that letter is not zero.
  kind: boundary
  bearing: methodological
- point: |
    A recovered number carries the rounding of everything you put in. Multiplying or dividing by
    a rounded figure can make that rounding larger, and a squared figure brings its rounding in
    twice.
  kind: boundary
  bearing: methodological
- point: |
    Teach the order before the moves. Undo what was done last, first.
  kind: move
  bearing: teaching
exercises:
- type: calculation
  prompt: |
    A formula says that a total cost T is a fixed charge F plus a rate r for each of n items.

    ```working
        T = F + rn
    ```

    Rearrange it to give n on its own, showing every step and saying at each step what you did to
    both sides.

    Then work n out for a total of 950, a fixed charge of 200 and a rate of 25.
  answer: |
    Start from the formula and get the term holding n by itself.

    Take F off both sides.

    ```working
        T minus F = F + rn minus F
        T minus F = rn
    ```

    Now the side holding n is a single term, so divide both sides by r.

    ```working
        the whole of T minus F, divided by r = n
    ```

    That is n on its own, which is what was asked for.

    Now the numbers. Subtract first.

    ```working
        950 minus 200 = 750
    ```

    Then divide.

    ```working
        750 divided by 25 = 30
    ```

    Thirty items.

    Check it by putting 30 back into the formula you started from.

    ```working
        25 times 30 = 750
        200 plus 750 = 950
    ```

    950, which is the total you were given.
  confidence_first: true
- type: critique
  prompt: |
    A colleague sends you this line and asks you to look at it before it goes into a note.

    > The formula is T = F + rn, and we know T, F and r. So n is T divided by r, minus F.

    Say what has gone wrong and give the right rearrangement. Then say what you would have them
    change in how they work, rather than in this one line.
  answer: |
    The division by r was applied to T only. The right side of the formula is a sum of two
    terms, F and rn, so dividing that side by r divides both of them.

    What they have written gives F its full size where it should have been shrunk by r. The
    larger r is, the further out the answer goes.

    Do it in the other order and the problem disappears.

    ```working
        T minus F = rn
        the whole of T minus F, divided by r = n
    ```

    Take the F off first, while the side is still a sum. Then divide, when the side is a single
    term and there is nothing for the division to miss.

    Try it on numbers to make the size of the error visible. Take T as 950, F as 200 and r as 25.
    Their line gives this.

    ```working
        950 divided by 25 = 38
        38 minus 200 = -162
    ```

    Minus 162 items. The correct rearrangement gives 30.

    What to change in how they work. Two habits, and the second is the one that matters. Move the
    added terms before the multiplied ones, so that every division happens to a single term. And
    put the answer back into the original formula before sending it. A negative count of items
    would have stopped this line at their own desk.
quantitative: true
practice:
- level: 1
  prompt: |
    Solve each of these for x. Show the step you did to both sides.

    ```working
        x + 7 = 12
        x minus 4 = 9
        3x = 21
    ```
  answer: |
    Take 7 off both sides.

    ```working
        x + 7 minus 7 = 12 minus 7
        x = 5
    ```

    Add 4 to both sides.

    ```working
        x minus 4 + 4 = 9 + 4
        x = 13
    ```

    Divide both sides by 3.

    ```working
        3x divided by 3 = 21 divided by 3
        x = 7
    ```

    Check all three by putting the answers back.

    ```working
        5 plus 7 = 12
        13 minus 4 = 9
        3 times 7 = 21
    ```
- level: 2
  prompt: |
    Solve each of these for x. Two steps each, and say which step you did first and why.

    ```working
        2x + 3 = 11
        5x minus 4 = 26
    ```
  answer: |
    Undo what was done last, first. In both lines the multiplication was done first and the
    adding or subtracting second, so the adding or subtracting comes off first.

    ```working
        2x + 3 minus 3 = 11 minus 3
        2x = 8
        2x divided by 2 = 8 divided by 2
        x = 4
    ```

    ```working
        5x minus 4 + 4 = 26 + 4
        5x = 30
        5x divided by 5 = 30 divided by 5
        x = 6
    ```

    Check both.

    ```working
        2 times 4 = 8
        8 plus 3 = 11
    ```

    ```working
        5 times 6 = 30
        30 minus 4 = 26
    ```

    Doing it the other way round is not wrong, but it is harder. Divide first and you have to
    divide the 3 by 2 as well. The side is a sum, and a division applies to all of it.
- level: 3
  prompt: |
    Solve each of these for x.

    ```working
        5x minus 2 = 3x + 8
        x divided by 4 = 6
    ```
  answer: |
    The first one has x on both sides. Gather the x terms on one side by taking 3x off both.

    ```working
        5x minus 2 minus 3x = 3x + 8 minus 3x
        2x minus 2 = 8
    ```

    Now it is the shape you have already done. Add 2 to both sides, then divide by 2.

    ```working
        2x = 10
        x = 5
    ```

    Check by working out each side of the original with 5 in place of x.

    ```working
        5 times 5 = 25
        25 minus 2 = 23
    ```

    ```working
        3 times 5 = 15
        15 plus 8 = 23
    ```

    Both sides come to 23, so the two sides really are the same number when x is 5. That is what
    solving an equation means.

    The second one is one step. The x was divided by 4, so multiply both sides by 4.

    ```working
        x = 24
    ```

    ```working
        24 divided by 4 = 6
    ```
- level: 3
  prompt: |
    Rearrange each of these to give the named letter on its own. There are no numbers to work
    out.

    - A = L W, make W the subject
    - y = m x + k, make x the subject
    - v = u + a t, make t the subject
  answer: |
    In the first, W is multiplied by L, so divide both sides by L.

    ```working
        A divided by L = W
    ```

    In the second, x was multiplied by m and then k was added. Undo the adding first.

    ```working
        y minus k = m x
    ```

    Now the side holding x is a single term, so divide both sides by m.

    ```working
        the whole of y minus k, divided by m = x
    ```

    The third works the same way. Take u off both sides, then divide by a.

    ```working
        v minus u = a t
        the whole of v minus u, divided by a = t
    ```

    In all three, the subtraction came before the division. That order is what keeps the division
    working on a single term instead of on a sum.

    And in all three you should ask whether the letter you divided by could be zero. A width of
    zero, a slope of zero or an acceleration of zero each make the division meaningless, and the
    page does not warn you.
- level: 4
  prompt: |
    A clinic register records a person's body mass index as 27.0 kg/m^2 and their height as
    1.60 m. The mass column has been left empty.

    The index is the mass in kilograms divided by the square of the height in metres. Rearrange
    that to give the mass, then work the mass out and give it with its unit. Show every line.

    Then say in one sentence what your answer does not tell you.
  answer: |
    Write the rule down first. Let the letters stand for the three quantities: I for the index, m
    for the mass in kilograms, h for the height in metres.

    ```working
        I = m divided by h^2
    ```

    The mass was divided by the square of the height, so multiply both sides by the square of the
    height.

    ```working
        I times h^2 = m
    ```

    The mass is the index times the square of the height. Now the numbers, one line at a time.

    Square the height first.

    ```working
        1.60 times 1.60 = 2.56
    ```

    Then multiply.

    ```working
        27.0 times 2.56 = 69.12
    ```

    69.1 kilograms.

    Check it by going forwards again.

    ```working
        69.12 divided by 2.56 = 27.0
    ```

    What it does not tell you: anything about this person's health. The index is a mass divided
    by a squared length. What any value of it means is a separate decision. Some body took that
    decision, on some date, for some population. This arithmetic does not reach it.
- level: 4
  prompt: |
    A panel gives the energy as 396 kilocalories in every 100 grams, the carbohydrate as 45 grams
    and the protein as 9 grams. The fat line is missing. These three figures are made up for this
    problem.

    Using the factors the Food Safety and Standards (Labelling and Display) Regulations, 2020 set
    for calculating declared energy, work the fat out. Show every line and check your answer.
  answer: |
    The rule is four kilocalories for every gram of carbohydrate, four for every gram of protein
    and nine for every gram of fat.

    ```working
        E = 4c + 4p + 9f
    ```

    Get the fat term on its own by taking the other two terms off both sides.

    ```working
        E minus 4c minus 4p = 9f
    ```

    Now divide both sides by 9.

    ```working
        the whole of E minus 4c minus 4p, divided by 9 = f
    ```

    Put the numbers in.

    ```working
        4 times 45 = 180
        4 times 9 = 36
        180 plus 36 = 216
        396 minus 216 = 180
        180 divided by 9 = 20
    ```

    Twenty grams of fat.

    Check by going forwards.

    ```working
        9 times 20 = 180
        180 plus 216 = 396
    ```

    396 kilocalories, which is the figure on the panel.
  refs:
  - fssai_labelling_2020
- level: 5
  prompt: |
    Schedule II of the National Food Security Act, 2013 sets a nutritional standard for the hot
    cooked meal in lower primary classes. It is 450 kilocalories and 12 grams of protein.

    A kitchen plans a meal that meets that standard exactly, and its recipe supplies 78 grams of
    carbohydrate. The 78 grams is made up for this problem.

    The Food Safety and Standards (Labelling and Display) Regulations, 2020 set the factors for
    calculating declared energy. Use them to work out how many grams of fat the meal must carry. Show
    every line. Then say in one line what your answer does not establish about the meal.
  answer: |
    Write the rule and put in what you know.

    ```working
        E = 4c + 4p + 9f
    ```

    The energy is 450 kilocalories, the protein is 12 grams and the carbohydrate is 78 grams.

    Get the fat term on its own.

    ```working
        E minus 4c minus 4p = 9f
    ```

    Now the numbers.

    ```working
        4 times 78 = 312
        4 times 12 = 48
        312 plus 48 = 360
        450 minus 360 = 90
        90 divided by 9 = 10
    ```

    Ten grams of fat.

    Check by going forwards.

    ```working
        9 times 10 = 90
        360 plus 90 = 450
    ```

    What this does not establish. The Act sets an energy figure and a protein figure. It sets
    no figure for fat and none for carbohydrate. So the 10 grams follows from the recipe
    somebody chose. It is not a standard anybody laid down. Quote it as your own arithmetic on
    a made-up recipe, and quote the 450 and the 12 as the Act's.
  refs:
  - nfsa_2013
  - fssai_labelling_2020
- level: 6
  prompt: |
    A store's register gives the energy in each gram of a packed food as 4.5 kilocalories. It gives
    the energy in one whole packet as 900 kilocalories. The weight column is empty. Both figures
    are made up for this problem.

    The energy in each gram is the energy of the whole packet divided by the weight of the packet
    in grams. Rearrange that to give the weight, then work the weight out and give it with its
    unit. Show every line.

    Then say what this needed that the same work does not need when the letter you want is already
    above the division line. Say why the direction of a rearrangement changes what you have to do.
  answer: |
    Name the three quantities. Let d stand for the energy in each gram and E for the energy of the
    whole packet. Let w stand for the weight of the packet in grams.

    ```working
        d = E divided by w
    ```

    This time the letter you want is underneath. Multiply both sides by the weight to bring it up.
    A packet does not weigh nothing, so you know that multiplication is by something other than
    zero.

    ```working
        d times w = E
    ```

    Now the side holding the weight is a single term, and the weight is multiplied by d. So divide
    both sides by d. The register gives d as 4.5, which is not zero, so that division is a move you
    are allowed.

    ```working
        w = E divided by d
    ```

    The weight is the energy of the packet divided by the energy in each gram. Now the numbers.

    ```working
        900 divided by 4.5 = 200
    ```

    Two hundred grams.

    Check by going forwards.

    ```working
        900 divided by 200 = 4.5
    ```

    What this needed that the other direction does not: a second step. A letter that already sits
    above the division line comes free in one multiplication. This one started underneath, so
    you had to lift it out from under the division first, and only then divide it loose.

    Why the direction changes what you have to do: the rule was written to give the energy in each
    gram. So the energy stands on top and the weight underneath. Recovering the energy runs the
    rule the way it was written. Recovering the weight runs it backwards, and every letter you
    have to cross on the way costs a step.
- level: 7
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
        a rule says the index is the mass in kilograms divided by the square of the height in metres
        a register gives the index as 25.0 and the height as 1.80 m
        the mass is wanted, so multiply the index by the height
        25.0 times 1.80 = 45
        so the mass is 45 kg
    ```
  answer: |
    The step that broke is the third one, and the fourth line carries it out faithfully.

    The height enters the rule squared. So undoing the division puts back the square of the
    height, not the height.

    Square the height first.

    ```working
        1.80 times 1.80 = 3.24
    ```

    Then multiply.

    ```working
        25.0 times 3.24 = 81
    ```

    Eighty-one kilograms, not 45.

    The unit check catches it too. The index is in kilograms per metre squared. Multiply that by
    metres and you are left with kilograms per metre, which is not a mass.

    Why it looks reasonable: 45 is the right order of magnitude for the quantity asked for, so
    nothing about the answer looks alarming. The arithmetic in the line is correct. And multiplying to undo a
    dividing is the right idea, applied to the wrong quantity. Every part of the move is right
    except what it was applied to, which is the shape this error nearly always has.
- level: 8
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
        a rule says E = 4c + 4p + 9f
        a panel gives the energy as 500 kilocalories and the fat as 20 grams
        the carbohydrate is wanted
        9 times 20 = 180
        500 minus 180 = 320
        so 4c + 4p = 320
        divide both sides by 4
        c + p = 80
        the panel also says the protein is 15 grams
        so the carbohydrate is 80 grams and the panel holds together
    ```
  answer: |
    Every line of the rearranging is right. The step that broke is the last one, and it is a
    reading error rather than an arithmetic one.

    The line before it says that the carbohydrate and the protein together come to 80 grams. It
    does not say the carbohydrate comes to 80 grams. Two letters are still on that side.

    Take the protein off.

    ```working
        80 minus 15 = 65
    ```

    Sixty-five grams of carbohydrate.

    Check it by going forwards through the whole rule.

    ```working
        4 times 65 = 260
        4 times 15 = 60
        9 times 20 = 180
        260 plus 60 plus 180 = 500
    ```

    500 kilocalories, which is the figure the panel gives.

    Why it looks reasonable: the rearranging was done correctly and shown line by line, so the
    working reads as careful. The 80 arrived from a division that was genuinely valid. And the
    figure that came out is the same size as the other figures on the panel, so nothing about it
    looks out of place. The error is in what the final line was taken to be about, and a
    rearranged equation always needs reading before it is used.
  refs:
  - fssai_labelling_2020
- level: 9
  prompt: |
    A colleague writes this in a note about a clinic register.

    > The height column is in metres and the index column is filled in. We do not need to keep
    > the mass column, because we can always work the mass back out.

    Take one row, with the height recorded as 1.65 m and the index recorded as 22.0 kg/m^2.

    Decide what to compute, compute it, and say what your answer does not establish.
  answer: |
    What to compute: the mass the row gives back. Then how much that mass moves, given that both
    figures in the row were rounded before they were written down.

    The mass is the index times the square of the height.

    ```working
        1.65 times 1.65 = 2.7225
        22.0 times 2.7225 = 59.895
    ```

    About 59.9 kilograms. So the colleague is right that the mass can be recovered.

    Now the part the note does not mention. Both figures in that row were rounded before anybody
    wrote them down, and both roundings move the answer.

    Start with the index. An index written as 22.0 was rounded to one decimal place, so the real
    value lies somewhere between 21.95 and 22.05. Work the mass out at each end, with the height
    left where it is.

    ```working
        21.95 times 2.7225 = 59.76
        22.05 times 2.7225 = 60.03
    ```

    A quarter of a kilogram, and that is not the whole of it. A height written as 1.65 was rounded
    in the same way, to two decimal places. So the real height lies somewhere between 1.645 and
    1.655. The height enters the rule squared, so square both of those ends.

    ```working
        1.645 times 1.645 = 2.706025
        1.655 times 1.655 = 2.739025
    ```

    Now put the two roundings together. The smallest mass the row can stand for is the smallest
    index times the smallest square. The largest is the largest index times the largest square.

    ```working
        21.95 times 2.706025 = 59.40
        22.05 times 2.739025 = 60.40
    ```

    The recovered mass is somewhere between about 59.4 and 60.4 kilograms.

    ```working
        60.40 minus 59.40 = 1.00
    ```

    About a kilogram of uncertainty, not a quarter, and most of it came from the height rather
    than from the index. Leave either rounding out of the arithmetic and you will quote a tighter
    answer than you have.

    What this does not establish. It does not establish that the recovery is good enough. Whether
    a kilogram matters depends on what the register is for, and nothing in the arithmetic decides
    that.

    It says nothing about whether the height or the index was measured well in the first place.

    And it says nothing about the rows where the index was worked out from a height in
    centimetres. No amount of rearranging will find those. A wrong index rearranges into a wrong
    mass just as smoothly as a right one.
- level: 10
  prompt: |
    In a meeting about a school kitchen somebody says this.

    > The label rule counts nine kilocalories for every gram of fat. So if we take five grams of
    > fat out of the recipe, the meal loses five kilocalories.

    Decide what to compute, compute it, and say what your answer does not establish.
  answer: |
    What to compute: what a change in one letter does to the total. That is a question about the
    rule, not about any one meal.

    ```working
        E = 4c + 4p + 9f
    ```

    The fat sits in the line multiplied by 9. So a change in the fat of five grams changes the
    energy by nine times five.

    ```working
        9 times 5 = 45
    ```

    Forty-five kilocalories, not five. The speaker has read the change in grams straight across
    as a change in kilocalories, which is the multiplication being dropped again.

    Now the part that matters more. Taking five grams out of a recipe usually puts something else
    in, and whatever goes in carries its own factor. If five grams of carbohydrate replace the
    five grams of fat, work both terms.

    ```working
        4 times 5 = 20
        45 minus 20 = 25
    ```

    The meal loses twenty-five kilocalories, not forty-five and not five. Which answer is right
    depends on a fact about the recipe that nobody in the meeting has stated.

    What this does not establish. It says nothing about whether the meal still meets any standard
    set for it, which is a separate question with its own figures. It says nothing about what
    anybody eats, since a meal served is not a meal eaten. And it says nothing about what the
    change does to a child, which is not a question the label rule was built to answer.
  refs:
  - fssai_labelling_2020
retrieval_items:
- q: What does an equals sign claim, and what does it not tell you to do?
  a: It claims that the expression on its left and the expression on its right stand for the same
    number. It does not tell you to work the left side out and write the answer on the right.
- q: What is the one rule that makes every rearrangement legal?
  a: Whatever you do to one side, do to the other. Adding, subtracting, multiplying or dividing
    both sides by the same quantity leaves a true statement true, as long as you never divide by
    zero.
- q: Why do you take the added terms off a side before dividing it?
  a: Because an operation on a side applies to the whole of that side. While the side is a sum,
    a division has to be applied to every term of it; once the side is a single term, there is
    nothing for the division to miss.
