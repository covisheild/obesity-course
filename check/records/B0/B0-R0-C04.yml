must_know:
- point: |
    A percentage point and a per cent are different quantities. Whichever is quoted at you, ask for
    the other.
  kind: misconception
  bearing: methodological
- point: |
    For any percentage in front of you, ask two questions before you use it: per cent of what, and
    how many people is that.
  kind: move
  bearing: methodological
- point: |
    A rise and the fall that undoes it are different percentages, because the starting value sits
    underneath. Say which end you measured from whenever you quote a change.
  kind: trap
  bearing: methodological
- point: |
    A percentage of a percentage multiplies, so it is always smaller than either.
  kind: consequence
  bearing: public
- point: |
    In a committee a relative change will be offered when it is the larger number and an absolute
    one when it is the smaller. Bring both to the meeting yourself.
  kind: consequence
  bearing: policy
- point: |
    When a journalist gives you a percentage on the phone, do not react to it. Ask what it is a
    percentage of and what the two underlying counts were.
  kind: move
  bearing: public
exercises:
- type: calculation
  prompt: |
    The second schedule of the National Food Security Act, 2013 sets 12 grams of protein for a lower
    primary meal. It sets 20 grams for an upper primary meal. Express the step from 12 to 20 as a
    percentage, and the step from 20 back to 12 as a percentage. Then say which of the two you would
    put in a note, and why.
  answer: |
    Going up, from 12.

    ```working
        20 minus 12 = 8
        8 divided by 12 = 0.6666...
        times 100 = 66.7 per cent more
    ```

    Coming down, from 20.

    ```working
        8 divided by 20 = 0.4
        times 100 = 40 per cent less
    ```working

    Same 8 grams either way. The denominator changed, so the percentage changed.

    Which to put in a note: neither on its own. Write the absolute figures and one percentage with
    its direction named. "20 grams against 12 grams, about 67 per cent more." That sentence cannot
    be read the wrong way round. A bare "67 per cent" in a note will be quoted back
    at you as "40 per cent". The person quoting it read from the other end, and you cannot prove
    which of you meant what.
  confidence_first: true
- type: teaching
  prompt: |
    Explain to a journalist, in three minutes and without jargon. The claim is that obesity in this
    group rose by fifty per cent. Say why that may be a smaller story than it sounds, and why it may
    also be a larger one. Give them one sentence they can print.
  answer: |
    The spine of it. Fifty per cent is a comparison with the starting point, and the starting point
    is not in the sentence. Two in a hundred becoming three in a hundred is a rise of fifty per cent.
    So is twenty in a hundred becoming thirty, and those are not the same story at all.

    Then give them the second half, because it is the half that makes you useful rather than merely
    cautious. One extra person in a hundred, across a population of several crore, is a large number
    of people. So the percentage alone can understate it as easily as overstate it.

    What to hand them: "The share went from two in a hundred to three in a hundred. That is one more
    person in every hundred, which across this population is roughly this many people."

    Then give them the count, or say plainly that you cannot until you have the denominator. Say it
    in those words. A journalist can print a number with a caveat and cannot print a refusal.
quantitative: true
practice:
- level: 1
  prompt: |
    Write each of these as a decimal, and then as a fraction over one hundred.

    ```working
        7 per cent      40 per cent      125 per cent      0.5 per cent
    ```
  answer: |
    Per cent means per hundred, so divide by a hundred each time.

    ```table
        7 per cent      0.07     7 over 100
        40 per cent     0.40     40 over 100
        125 per cent    1.25     125 over 100
        0.5 per cent    0.005    0.5 over 100
    ```

    The third one matters. A percentage can be more than a hundred: that just means more than the
    whole you started from. A proportion cannot, and the two are often confused.
- level: 2
  prompt: |
    Work out 35 per cent of 840. Then work out 840 as a percentage of 1,200.
  answer: |
    Thirty-five per cent of 840. Turn the percentage into a decimal, then multiply.

    ```working
        35 per cent = 0.35
        0.35 times 840 = 294
    ```

    Now the other direction. Divide, then multiply by a hundred.

    ```working
        840 divided by 1,200 = 0.7
        0.7 times 100 = 70 per cent
    ```

    Two different questions. The first asks for a part; the second asks what share a part is. Read
    which one you have been given before you touch the calculator.
- level: 3
  prompt: |
    A figure goes from 80 to 92. Express the change as a percentage. Then express the step from 92
    back to 80 as a percentage.
  answer: |
    Going up, starting from 80.

    ```working
        92 minus 80 = 12
        12 divided by 80 = 0.15
        times 100 = 15 per cent more
    ```

    Coming down, starting from 92.

    ```working
        12 divided by 92 = 0.13043...
        times 100 = 13.0 per cent less
    ```

    Same 12 either way. The number underneath changed, so the percentage changed with it. Fifteen
    up, thirteen down, and neither is wrong.
- level: 3
  prompt: |
    Work out 40 per cent of 30 per cent. Then work out 5 per cent of 60 per cent. Give each answer
    as a percentage of the whole you started with.
  answer: |
    A percentage of a percentage multiplies. Turn both into decimals, then multiply.

    ```working
        0.40 times 0.30 = 0.12, so 12 per cent of the whole
        0.05 times 0.60 = 0.03, so 3 per cent of the whole
    ```

    Both answers are smaller than either percentage that went into them.

    They have to be. You are taking a part of a part, and multiplying by anything under one makes a
    number smaller. Twelve is below thirty and below forty. Three is below five and below sixty.

    So there is a check you can run before the arithmetic. The answer can never be larger than the
    smaller of the two percentages you started with.
- level: 4
  prompt: |
    Section 3(2) of the National Food Security Act, 2013 says entitlements shall extend up to 75
    per cent of the rural population. For the urban population the figure is up to 50 per cent. A
    district has 18 lakh rural and 6 lakh urban residents. Work out the ceiling on the number
    covered in each.
  answer: |
    Rural first.

    ```working
        75 per cent = 0.75
        0.75 times 18,00,000 = 13,50,000
    ```

    Then urban.

    ```working
        50 per cent = 0.50
        0.50 times 6,00,000 = 3,00,000
    ```

    Thirteen lakh fifty thousand and three lakh. Sixteen lakh fifty thousand between them.

    Now read the words again. The Act says "up to". These are ceilings, not counts and not targets.
    A figure worked out from a ceiling is the most that may be covered, and says nothing about how
    many are.
  refs: [nfsa_2013]
- level: 6
  prompt: |
    In a survey, 45 per cent of respondents buy a packaged snack in a week. Of those who do, 20 per
    cent buy it at a shop next to a school. What share of all respondents is that? Then say how
    many people that is, out of 2,400 respondents.
  answer: |
    A percentage of a percentage multiplies.

    ```working
        0.20 times 0.45 = 0.09
        = 9 per cent of all respondents
    ```

    Now the count.

    ```working
        0.09 times 2,400 = 216 people
    ```

    Nine per cent, which is 216 of the 2,400.

    The count is the part to carry into a meeting. Nine per cent sounds like a rounding error and
    216 people sounds like 216 people, and they are the same finding.
- level: 7
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
        a figure rises from 4 per cent to 6 per cent
        6 minus 4 = 2
        so the rise is 2 per cent
    ```
  answer: |
    The subtraction is right. The step that broke is the last line, where a difference in
    percentage points is called a per cent.

    Both statements exist and they are different quantities.

    ```working
        6 minus 4 = 2 percentage points
        2 divided by 4 = 0.5, so a rise of 50 per cent
    ```

    So the rise is two percentage points, or fifty per cent, and the worked answer has used the
    first number with the second name.

    Why it looks reasonable: the words "per cent" sit in the original figures, so carrying them
    into the difference feels automatic. Percentage points subtract. Per cent divides.
- level: 7
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
        in a survey, 30 per cent of respondents buy a packaged snack on a school day
        of those who do, 40 per cent buy it at a shop by the school gate
        30 plus 40 = 70
        so 70 per cent of all respondents buy a snack at a shop by the school gate
    ```
  answer: |
    The step that broke is the addition on the third line.

    Two percentages can be added only when they are parts of the same whole. These are not. The 40
    per cent is a percentage of the 30 per cent, not a percentage of everybody.

    A percentage of a percentage multiplies.

    ```working
        0.40 times 0.30 = 0.12
        = 12 per cent of all respondents
    ```

    Twelve per cent, not seventy. The broken answer is nearly six times the right one.

    There is a second way to see that 70 cannot be right, and it needs no arithmetic at all. The
    group being described sits inside the 30 per cent who buy a snack at all. So the answer cannot
    be bigger than 30, whatever the second percentage is.

    Why it looks reasonable: both numbers are percentages, and both are quoted in one breath about
    one survey. Adding percentages is a thing you are sometimes allowed to do. Here the second
    percentage is a part of the first, so it is not.
- level: 8
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
        a budget of 100 is cut by 20 per cent
        the following year it is raised by 20 per cent
        20 minus 20 = 0, so the budget is back to 100
    ```
  answer: |
    Do the two steps on the actual number instead of on the percentages.

    ```working
        100 minus 20 per cent of 100
        = 100 minus 20
        = 80

        80 plus 20 per cent of 80
        = 80 plus 16
        = 96
    ```working

    Ninety-six, not a hundred. The budget is four per cent below where it started.

    The step that broke is treating the two percentages as though they could be added and
    subtracted. They cannot, because they are taken from different numbers: the first twenty per
    cent is of 100 and the second is of 80.

    Why it looks reasonable: the two percentages are equal and opposite, which is exactly the shape
    of something that cancels. Percentages of different bases never cancel.
- level: 9
  prompt: |
    Here is a line you are asked to comment on.

    > Overweight among women in this district rose by sixty per cent in a decade.

    Decide what to compute, compute it, and say what your answer does not establish.
  answer: |
    You cannot compute anything yet, and saying so precisely is the answer.

    A sixty per cent rise is a rise measured against a starting value, and the line does not give
    it. Two readings fit the same sentence.

    ```table
        from 5 in 100 to 8 in 100     rise of 3 percentage points
        from 20 in 100 to 32 in 100   rise of 12 percentage points
    ```

    Both are a sixty per cent rise. The second is four times the first in people.

    So what to ask for: the two underlying figures, and the two counts they came from.

    What this does not establish, once you have them. It will not tell you whether the change is
    real or the two surveys simply differ. It will not tell you whether they measured the same
    thing both times, or what caused any of it. It will tell you how many more women, which is the number anybody acting on
    this needs.
- level: 10
  prompt: |
    A colleague brings you two sentences about the same programme and asks which to put in the
    brief.

    > Coverage rose by 50 per cent.

    > Coverage rose by 4 percentage points, from 8 per cent to 12 per cent.

    Decide what to compute, compute it, and say what your answer does not establish.
  answer: |
    Check that the two sentences describe one change.

    ```working
        12 minus 8 = 4 percentage points
        4 divided by 8 = 0.5, so 50 per cent
    ```

    They do. Both are true, and one sounds several times larger than the other.

    Which to put in the brief: both, in one sentence, with the counts. Something of the shape
    "coverage rose from 8 to 12 per cent, a rise of half, which is this many more households".

    Why not choose. A brief carrying only the fifty per cent will be read as a transformation. A
    brief carrying only the four points will be read as nothing happening. Bringing both is what
    makes the sentence hard to quote against you in either direction.

    What this does not establish. Neither figure says how many households the four points are, and
    neither says whether coverage is the right measure of whether the programme works.
retrieval_items:
- q: What is the difference between a rise of one percentage point and a rise of fifty per cent?
  a: Percentage points subtract; per cent divides. Two per cent going to three per cent is both at once, because one is the difference and fifty per cent is that difference divided by the starting two.
- q: Why is a rise from 450 to 700 not the same percentage as the fall from 700 to 450?
  a: Because the percentage is the change divided by the value you started from, and the two starting values differ. It is about 56 per cent up and about 36 per cent down.
- q: How do you find a percentage of a percentage, and is the answer larger or smaller than either?
  a: Multiply the two fractions. It is always smaller than either — 40 per cent of 30 per cent is 12 per cent.
