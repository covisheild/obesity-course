simplified_explanation: |
  A cell on its own tells you nothing.

  You have to settle four things first. What does one row stand for — one person, one household,
  one whole state? That is called the unit of observation. What does each column report about that
  row? What units does a column use, and if it is a percentage, what is it a percentage of — its
  denominator? And where did the numbers come from, who counted them, and how?

  Forty-five could be a headcount, a percentage, or a rank.
illustration:
  body: |
    | State | Women surveyed | Overweight or obese (%) | Year |
    | --- | --- | --- | --- |
    | A | 42,100 | 24.1 | 2019-21 |
    | B | 18,750 | 39.6 | 2019-21 |

    States A and B and all four figures in this table are made up for this section.

    Ask first what one row stands for. Run your finger along the first row under the headings. It is
    one state, not one woman. So the figure 24.1 describes nobody in particular.

    Ask next what each column reports. The second column counts people. The third column, sitting
    right beside it, looks like the same kind of thing and is not. It is a percentage — a fraction,
    always of something. Of what? Of the count in the column next to it.

    'Overweight or obese' is one category, made by cutting a measurement at chosen values. It counts
    the overweight and the obese together, so it is larger than 'obese' alone. The heading does not
    say whose cut-offs were used, and that is a question to ask.

    Look at the last column and read it slowly. It is not a single year but a span, 2019 to 2021,
    telling you the fieldwork ran across those years and not on one date.

    Search the table for a line naming the source. There is none here.

    Now put the question you were going to ask anyway: is state B worse than state A?

    You cannot tell from this table alone. The two percentages differ, and that much sits on the
    page. But you have not been shown who was surveyed in each state, how those women were chosen,
    or how precise either figure is.

    Say only what you can defend: the two reported figures differ.
  analogy_breaks_when: |
    Two people can build two honest tables from the same underlying numbers and leave two opposite
    impressions. Neither has lied. A table settles what was measured and reported. It does not
    settle whether the comparison you want to make is a fair one.
  numbers: []
must_know:
- point: |
    Before comparing two percentages across rows, check the count sitting beside each one.
    Twenty-four per cent of 42,100 women and twenty-four per cent of two hundred women are not the
    same evidence. The section on sampling says why: for a random sample, the typical error shrinks
    with the square root of the count. For a sample that was not random, no count rescues it.
  kind: misconception
  bearing: methodological
- point: |
    Ask the four questions in order, every time, before you look at any value.
  kind: move
  bearing: methodological
- point: |
    In an Indian national survey table, check the count in every row: states need not have been
    sampled equally.
  kind: india_deviation
  bearing: methodological
- point: |
    When a table arrives in a ministry deck or a press release, somebody chose its rows and columns
    before you saw it. Ask what was left out.
  kind: consequence
  bearing: policy
- point: |
    If asked which of two percentages is higher, do not stop at naming the bigger number. Say
    whether the table supports a comparison at all, and name what is missing.
  kind: trap
  bearing: public
- point: |
    This section gets you only to what a table says. It does not tell you whether the numbers are
    right, how precise they are, or whether a gap is real.
  kind: boundary
  bearing: methodological
exercises:
- type: interpretation
  prompt: |
    In the table above, what exactly does the number 39.6 describe? Write one sentence, and make
    sure it contains the unit of observation, the denominator and the time span.
  answer: |
    Among the 18,750 women surveyed in state B during fieldwork conducted across 2019 to 2021, 39.6
    per cent were recorded as overweight or obese. It is a property of a surveyed group, in one
    state, over a period. It is not a property of any woman, of the state's whole population, or of
    a date.
  confidence_first: true
- type: critique
  prompt: |
    Here is what a colleague writes. "State B has 15.5 percentage points more obesity than state A."
    Name two things wrong with that sentence, read as a description of this table.
  answer: |
    First, it describes the states, when the table reports surveyed samples.

    Second, it treats the gap as a measured quantity. Nothing in the table tells you the precision
    of either figure. The difference may be solid or may be noise, and the table cannot tell you
    which.

    A third and subtler point: "obesity" and "overweight or obese" are different categories, and the
    column heading says the second one.
retrieval_items:
- q: What are the four things to establish before reading any number in a table?
  a: What one row stands for, what each column reports, the units and denominators, and the source.
- q: Why is a percentage meaningless without its denominator?
  a: Because the same proportion can rest on a handful of observations or on tens of thousands, and those are very different evidence.
- q: A column heading says "2019-21". What does that tell you?
  a: That fieldwork ran across a span of years, so the figure is not a snapshot of any single date.
