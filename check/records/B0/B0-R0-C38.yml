definition:
  text: |
    The mechanical and digestive processes of the alimentary canal have one goal: to convert food
    into molecules small enough to be absorbed by the epithelial cells of the intestinal villi.
    Absorbed material leaves the gut by two different routes. Water-soluble nutrients enter the
    capillary blood in the villi and travel to the liver via the hepatic portal vein. Lipid-soluble
    nutrients diffuse through the plasma membrane, are packaged inside the cell, and enter the
    lacteals of the villi. Lymphatic vessels then carry them to the general circulation. So what
    dissolves in water reaches the liver before it reaches the rest of the body, and what dissolves
    in fat does not.

    The liver is the largest gland in the body. Besides its role in digestion it has many roles in
    metabolism and regulation. Under the hepatic portal circulation, all blood from the alimentary
    canal passes through the liver. Drugs and toxins are absorbed along with the nutrients. After
    processing what the blood brings, the liver releases the nutrients other cells need back into
    the blood. It stores excess glucose as glycogen and converts glycogen back into glucose.

    The liver's digestive role is to produce bile and export it to the duodenum. Bile accomplishes
    the emulsification of lipids in the small intestine, which pulls large lipid globules apart
    into many tiny fragments. The gallbladder stores, concentrates and releases that bile.

    The pancreas has two separate functions. As an exocrine gland it produces pancreatic juice,
    containing digestive enzymes and bicarbonate ions, and delivers it to the duodenum through a
    duct. As an endocrine gland it secretes hormones directly into the surrounding fluid. Its
    pancreatic islets, formerly known as the islets of Langerhans, secrete glucagon, insulin,
    somatostatin and pancreatic polypeptide. The alpha cell produces glucagon and the beta cell
    produces insulin. Receptors located in the pancreas sense blood glucose levels, and the
    pancreatic cells secrete glucagon or insulin accordingly.

    An endocrine organ secretes a chemical, the hormone, into the extracellular fluid. The
    interstitial fluid and the blood vessels then transport hormones throughout the body. A hormone
    binds to receptors on target cells, inducing a characteristic response. Endocrine glands are
    ductless, which distinguishes them from exocrine glands, whose secretions leave by a duct.
    Endocrine signalling is slower than neural signalling and typically less specific: the same
    hormone may play a role in a variety of different physiological processes, depending on the
    target cells involved. Adipose tissue is among the tissues known to produce hormones.

    Elevated blood glucose stimulates the release of insulin. The primary function of insulin is to
    facilitate the uptake of glucose into body cells. It triggers movement of glucose transporter
    vesicles to the cell membrane, where the transporters are exposed and move glucose into the
    cell by facilitated diffusion. Insulin also stimulates the liver to convert excess glucose into
    glycogen for storage, and promotes triglyceride and protein synthesis. Skeletal muscle cells
    and adipose cells are the primary targets of insulin. Red blood cells, and the cells of the
    brain, liver, kidneys and the lining of the small intestine, have no insulin receptors on their
    membranes and do not require insulin for glucose uptake.

    Low blood glucose stimulates the release of glucagon. Glucagon stimulates the liver to convert
    its stores of glycogen back into glucose, which is released into the circulation. It stimulates
    the liver to take up amino acids from the blood and convert them into glucose. It also
    stimulates lipolysis, the breakdown of stored triglycerides into free fatty acids and glycerol.
    Taken together, these actions increase blood glucose levels. The secretion of both hormones is
    regulated by negative feedback: rising blood glucose inhibits further glucagon secretion, and
    falling blood glucose inhibits further insulin release.

    Glucose is required for cellular respiration and is the preferred fuel for all body cells.
    Certain key organs, including the brain, can use only glucose as an energy source, so the body
    must maintain a minimum blood glucose concentration. Glucose not immediately taken up by cells
    for fuel can be stored by the liver and muscles as glycogen, or converted to triglycerides and
    stored in the adipose tissue.

    Nothing stated here fixes how much of anything any of these organs handles. No share of energy
    expenditure, no rate and no concentration is given, and none may be taken from the text this
    account rests on.
