exercises:
- type: retrieval
  prompt: |
    Without looking back, name the six organs or tissues this section covers. Write one line for
    each, saying what it does with energy.

    Then say what a hormone is, and how it gets to the place where it acts.
  answer: |
    The six are the gut, the liver, the pancreas, adipose tissue, muscle and the brain.

    The gut cuts food into pieces small enough to cross its wall, and lets them through into the
    blood. What dissolves in water goes from there to the liver. What dissolves in fat takes
    another road and joins the blood further along.

    The liver takes all the blood coming from the gut before anything else does. It works on what
    arrives and passes on what the body needs. It stores spare sugar as glycogen and turns glycogen
    back into sugar. It also makes bile, which breaks large blobs of fat into tiny ones.

    The pancreas does two jobs. It sends a juice full of enzymes down a tube into the gut. And
    small islands inside it put insulin and glucagon straight into the blood.

    Adipose tissue holds triglyceride until it is needed. It is one of the two tissues insulin acts
    on most, and it makes hormones of its own.

    Muscle is the other tissue insulin acts on most, and it holds glycogen.

    The brain runs on glucose and can use nothing else. It takes glucose from the blood without
    needing insulin.

    Now the hormone. A hormone is a chemical that a gland puts into the fluid around its own cells.
    That fluid drains into the blood, and the blood carries it all over the body.

    How it gets where it acts: it does not go anywhere in particular. It goes everywhere. It acts
    only where a cell carries a receptor shaped to hold it. When it binds, the receptor changes
    shape, and something happens inside that cell.

    One check on your own answer. If you wrote that a hormone travels to its target organ, go back.
    That picture will make every later sentence about side effects come out wrong.
  confidence_first: true
- type: critique
  prompt: |
    A patient information leaflet contains this paragraph.

    > Fat cells are simply storage bags. Once they are full, the body has nowhere left to put the
    > extra energy, and that is when the problems start. The answer is to stop filling them.

    The leaflet is made up for this exercise. Say what is wrong with it, sentence by sentence, and
    say what you would put in its place.
  answer: |
    Three sentences, and each one is wrong in a different way.

    The first sentence is wrong as biology. Adipose tissue is not a bag. It makes hormones of its
    own and puts them into the blood, which makes it an organ that signals to the rest of the body.
    The word "simply" is doing the damage, and it is doing it in a leaflet a patient will read.

    The second sentence is a claim with a number hidden in it. "Once they are full" asserts a
    capacity. Nothing in this section gives you one. No figure in the book behind this section
    would survive a check either, because every figure in it is stated with no study named. A
    quantity asserted without a measurement is the kind of sentence that sounds like physiology and
    is not.

    It is also wrong about the loop. This section gives you a store that fills and a store that
    empties, several times a day, under two hormones that run opposite ways. The leaflet describes
    a one-way process. A store that only ever filled would not be a store.

    The third sentence takes a mechanism and turns it into an instruction for the reader. That is a
    separate move and it needs its own evidence, which the leaflet does not offer.

    What to put in its place. Say what adipose tissue does, in the same voice you would use for the
    liver. It holds triglyceride until it is needed. It releases it under a signal. It also makes
    hormones, which is why it counts as an organ rather than a place.

    And take out the word "simply", wherever it appears. Nothing in this section is simple, and the
    word is only ever doing work on the reader rather than on the subject.
- type: teaching
  prompt: |
    A first-year resident has ten minutes and a whiteboard. They have just told a patient that
    insulin is the key that unlocks the cell and lets sugar in.

    Teach them insulin and glucagon so that they never say a sentence about insulin again without
    naming a tissue.
  answer: |
    Ten minutes and a whiteboard, and the sentence they used is the one everybody is taught. Say
    that first, because it is true and it stops them defending it.

    Draw a line across the board and mark two ends. Write "sugar high" at one end and "sugar low"
    at the other. Nothing else yet.

    Ask them what the pancreas does at each end. They will get insulin and glucagon in the right
    places. Write the two names under the two ends.

    Now add one row under each: what it does to the stores. Insulin fills them. Glucagon empties
    them. Let them see that the picture is a loop and not a rule.

    Now break their sentence, and do it by asking rather than telling. Ask which organ runs on
    glucose and can use nothing else. They will say the brain. Ask whether the brain needs insulin
    to take glucose in.

    Let them answer, then give them the sentence from the book. The brain, the liver, the kidneys,
    red blood cells and the lining of the gut need no insulin to take glucose in. The liver still
    answers to insulin in other ways: insulin makes it store glycogen.

    Now go back to the board and write the two tissues that do wait for insulin: muscle and fat.

    Then ask the question that fixes the habit. If the brain needs no insulin, what was the key
    unlocking? They will see it. The key picture had one door in it, and there are at least two
    kinds of cell and only one of them needs the key to let sugar in.

    Close with the rule you want them using tomorrow. Any sentence about a hormone names a tissue.
    Not "insulin lets sugar into cells", but "insulin brings glucose carriers to the surface of
    muscle and fat cells".

    And tell them why it matters to the patient and not only to the exam. A patient who is told
    that insulin lets sugar into cells will conclude that without it the brain starves for want of
    a way in. That is not what happens, and a patient acting on it will do the wrong thing.
retrieval_items:
- q: What happens to everything absorbed from the gut in water, before the rest of the body sees it?
  a: It goes through the liver. All blood from the alimentary canal passes through the liver under
    the hepatic portal circulation, so the liver works on nutrients, drugs and toxins alike before
    releasing into the blood what other cells need. What dissolves in fat takes another route and
    joins the general circulation without that first pass.
- q: What is a hormone, and how does it reach the place where it acts?
  a: It is a chemical an endocrine gland secretes into the fluid around its own cells. That fluid
    and the blood vessels carry it throughout the body. It does not travel to a target. It reaches
    everything, and binds only where a target cell carries a receptor for it, which produces the
    response.
- q: What are the pancreas's two jobs?
  a: As an exocrine gland it makes pancreatic juice, containing digestive enzymes and bicarbonate
    ions, and delivers it to the small intestine through a duct. As an endocrine gland its islets secrete
    hormones straight into the surrounding fluid and so into the blood. The alpha cell makes
    glucagon and the beta cell makes insulin.
- q: What does insulin do, which cells does it act on most, and which cells do not need it?
  a: Its primary function is to help glucose get into body cells, which it does by bringing glucose
    transporters to the cell membrane. It also makes the liver store glucose as glycogen and
    promotes triglyceride and protein synthesis. Skeletal muscle and adipose cells are its primary
    targets. Red blood cells and the cells of the brain, liver, kidneys and the lining of the small
    intestine do not need insulin to take glucose in. The liver still answers to insulin, which
    makes it store glycogen.
- q: Why does the body need glucagon as well as insulin?
  a: Because some key organs, the brain among them, can use only glucose, so blood glucose must not
    fall too far. When it falls, alpha cells release glucagon, which makes the liver turn glycogen
    back into glucose, build new glucose from amino acids, and start stored triglyceride being
    broken into fatty acids and glycerol. Together those actions raise blood glucose.
