must_know:
- point: |
    A fraction on its own is not a finding. Nine fourteenths is only a fact once you can say what
    the fourteen was.
  kind: misconception
  bearing: methodological
- point: |
    To simplify a fraction, divide the top and the bottom by the same number. To compare or add two,
    put them over the same denominator first.
  kind: move
  bearing: methodological
- point: |
    Name which standard, and name the group it was written for.
  kind: india_deviation
  bearing: policy
- point: |
    Asked in public what fraction of a child's need a meal covers, do not answer with the fraction
    you happen to have.
  kind: trap
  bearing: public
- point: |
    Ask for the denominator every time, of your own numbers first.
  kind: consequence
  bearing: policy
exercises:
- type: calculation
  prompt: |
    The second schedule of the National Food Security Act, 2013 gives a take-home ration for
    children aged six months to three years of 500 calories. For a malnourished child aged six
    months to six years it gives 800 calories. Write the first as a fraction of the second and
    reduce it as far as it will go. Then say, in one sentence, what that fraction is and is not a
    fraction of.
  answer: |
    Start with 500 over 800.

    ```working
        500 over 800
        = 50 over 80        (both ended in a zero, so divide both by ten)
        = 5 over 8          (both are in the ten times table, so divide both by ten again)
    ```working

    Five eighths. Check it backwards: five times a hundred is five hundred, eight times a hundred is
    eight hundred.

    What it is: the ordinary take-home ration standard for a child of six months to three years. It
    is expressed as a fraction of the standard set for a malnourished child of six months to six
    years. The two rows cover different age bands, so even this is a comparison across two groups.

    What it is not: a fraction of what either child needs, or of what either child eats. Both figures
    are standards for a ration. The Act sets them; it does not measure anybody.
  confidence_first: true
- type: critique
  prompt: |
    Here is a line from a draft note.

    > Lower primary children get 12 grams of protein and upper primary children get 20 grams. So
    > lower primary children are getting three fifths of their protein.

    The arithmetic is right. Say what is wrong with the sentence, and rewrite it so it is defensible.
  answer: |
    Twelve over twenty does reduce to three fifths, so nothing has gone wrong in the sum.

    The whole has been swapped. Three fifths is the lower primary standard as a fraction of the
    upper primary standard. The sentence turns it into a fraction of "their protein", which would
    have to mean a daily requirement for a child of that age. No such figure appears in those rows.
    One fraction has been quietly moved from one denominator to a different one.

    A defensible rewrite. "The protein standard for a lower primary meal is 12 grams. That is three
    fifths of the 20 grams set for an upper primary meal."

    Notice what the rewrite costs. It is longer, it names both wholes, and it makes no claim about
    what a child needs. That is the trade every time.
quantitative: true
practice:
- level: 1
  prompt: |
    Reduce each of these as far as it will go. Show the number you divided by at each step.

    ```working
        6 over 8        20 over 50        36 over 48
    ```
  answer: |
    ```working
        6 over 8    = 3 over 4       (divide both by 2)
        20 over 50  = 2 over 5       (divide both by 10)
        36 over 48  = 18 over 24     (divide both by 2)
                    = 9 over 12      (divide both by 2)
                    = 3 over 4       (divide both by 3)
    ```

    Check the last one backwards: three times twelve is thirty-six, four times twelve is
    forty-eight.

    Notice that the first and the last came out the same. Two fractions that look nothing alike can
    be one number.
- level: 2
  prompt: |
    Which is larger, three fifths or five eighths? Put them over the same denominator first.
  answer: |
    Forty is the smallest number that both five and eight divide into, so use forty.

    ```working
        3 over 5  = 24 over 40      (multiply top and bottom by 8)
        5 over 8  = 25 over 40      (multiply top and bottom by 5)
    ```

    Same denominator now, so the tops can be compared directly. Twenty-five is more than
    twenty-four, so five eighths is larger.

    The gap is one fortieth, which is small. Guessing by eye would have been a coin toss.
- level: 3
  prompt: |
    Add two fifths and one third. Then say why you could not simply add the tops and the bottoms.
  answer: |
    Fifteen is the smallest number both five and three divide into.

    ```working
        2 over 5  =  6 over 15      (multiply top and bottom by 3)
        1 over 3  =  5 over 15      (multiply top and bottom by 5)

        6 over 15 + 5 over 15 = 11 over 15
    ```

    Eleven fifteenths.

    Why not add tops and bottoms: that would give 3 over 8, which is less than a half. Two fifths
    on its own is nearly a half, so adding something to it cannot leave you below a half. The
    method has to be wrong, and you can see it is wrong without knowing the right answer.
- level: 5
  prompt: |
    The same schedule sets protein at 12 grams for a lower primary meal and 20 for an upper primary
    meal. It sets calories at 450 for the lower primary meal and 500 for a take-home ration for a
    child of six months to three years. Reduce each of those two pairs to a fraction.
  answer: |
    Protein first.

    ```working
        12 over 20
        = 3 over 5      (divide both by 4)
    ```

    Then calories.

    ```working
        450 over 500
        = 45 over 50    (divide both by 10)
        = 9 over 10     (divide both by 5)
    ```

    Three fifths and nine tenths.

    Two different columns, and two different pairs of things. The protein fraction compares two
    meals. The calorie fraction compares a meal with a ration. Neither can be quoted without naming
    the two things it sets against each other.

    One thing to notice about the schedule itself. Four of its six rows give protein as a range —
    12 to 15, 20 to 25, 18 to 20. Only the lower and upper primary rows give one figure. So those
    are the only two protein numbers you can divide without first picking an end of a range. Picking
    an end is a choice, and a choice has to be declared.
  refs: [nfsa_2013]
- level: 6
  prompt: |
    A block has 400 households. Two hundred and forty of them lift their full grain entitlement in
    a month. Write the share that did as a fraction reduced as far as it will go, and say what the
    whole was.
  answer: |
    ```working
        240 over 400
        = 24 over 40        (divide both by 10)
        = 3 over 5          (divide both by 8)
    ```

    Three fifths.

    What the whole was: the 400 households in the block, not the people in them, and not the
    households in any other block. Say that out loud when you report the fraction. Three fifths of
    households and three fifths of people are different claims, and this table supports only one of
    them.
- level: 6
  prompt: |
    A block has 320 households. Three eighths of them lifted grain in the first fortnight of the
    month and a quarter of them lifted it in the second. No household is in both counts. What
    fraction of the block's households lifted grain in the month, and how many households is that?
  answer: |
    Check first that the two fractions can be added at all. Both are fractions of the same whole,
    the 320 households of this block, and no household is counted twice. Both of those have to hold
    before any arithmetic is allowed.

    Eight is the smallest number that both eight and four divide into, so work in eighths.

    ```working
        3 over 8  =  3 over 8       (already there)
        1 over 4  =  2 over 8       (multiply top and bottom by 2)
        3 over 8  +  2 over 8  =  5 over 8
    ```

    Five eighths. Now turn that back into households.

    ```working
        5 over 8 of 320
        = 320 divided by 8, times 5
        = 40 times 5
        = 200 households
    ```

    Check it the other way round: three eighths of 320 is 120, a quarter of 320 is 80, and 120 plus
    80 is 200.

    Keep the whole attached when you report it. Five eighths of the households in this block, in
    this month. Not of the people in them, and not of any other block.
- level: 7
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
        1 over 4  +  1 over 4  =  2 over 8  =  1 over 4
    ```
  answer: |
    The step that broke is the first one. The tops and the bottoms were both added.

    ```working
        1 over 4 + 1 over 4 = 2 over 4 = 1 over 2
    ```

    Adding fractions adds the tops only. The denominator says what size the parts are, and that
    does not change when you take more of them. Two quarters is a half.

    Why it looks reasonable: the answer came back as one quarter, which is a tidy fraction and one
    of the two you started with. A wrong method that returns a plausible-looking fraction is the
    hard case, because nothing about the shape of the answer warns you.
- level: 8
  prompt: |
    Here is a line from a note.

    > The lower primary meal is 450 calories and the upper primary meal is 700. So the lower
    > primary meal is about two thirds of a child's daily energy.

    The arithmetic behind "two thirds" is right. Find what broke.
  answer: |
    The arithmetic first, to confirm it.

    ```working
        450 over 700
        = 45 over 70
        = 9 over 14
    ```

    Nine fourteenths is a little under two thirds, so that much holds.

    What broke is the whole. Nine fourteenths is the lower primary meal as a fraction of the
    **upper primary meal**. The sentence turns it into a fraction of a child's daily energy, which
    is a different quantity and appears nowhere in the schedule.

    Why it looks reasonable: both numbers came off the same table, so the fraction feels as though
    it belongs to that table. It does. The sentence built on it does not.
  refs: [nfsa_2013]
- level: 9
  prompt: |
    Here is a line from a district note.

    > Two fifths of our anganwadi centres and half of our schools reported a shortage, so nine
    > tenths of our facilities had one.

    Decide what to compute, compute it, and say what your answer does not establish.
  answer: |
    What to compute: whether two fifths and a half can be added at all.

    They cannot, as they stand. They are fractions of two different wholes — centres in one case,
    schools in the other. Adding them adds parts cut from different things.

    Watch what adding them properly would give, even if the wholes did match.

    ```working
        2 over 5 = 4 over 10
        1 over 2 = 5 over 10
        4 over 10 + 5 over 10 = 9 over 10
    ```

    So nine tenths is where the number came from. But a fraction of all facilities needs counts,
    not fractions. With 50 centres and 200 schools it would be 120 out of 250, which is under a
    half.

    What this does not establish. It does not tell you the real figure, because the note gives no
    counts. It does not tell you whether "a stock shortage" means the same thing in both places.
    Ask for the two counts, and ask for the definition.
- level: 10
  prompt: |
    Somebody hands you a one-line finding.

    > Protein provision improved: the meal now meets three fifths of the standard, up from a half.

    Decide what to compute, compute it, and say what your answer does not establish.
  answer: |
    What to compute: the size of the change, and whether the two fractions share a whole.

    ```working
        3 over 5 = 6 over 10
        1 over 2 = 5 over 10
        6 over 10 - 5 over 10 = 1 over 10
    ```

    A tenth of the standard. That is the change, and it is worth stating that way rather than as
    "three fifths, up from a half", which sounds larger.

    Now the whole. Both are fractions of "the standard", so they can be compared — but only if it
    is the same standard on both dates. The schedule sets different standards for lower primary,
    upper primary and take-home rations, so this needs saying.

    What this does not establish. It says nothing about how many children that tenth reaches, or
    whether the standard itself changed between the two dates. A rising fraction of a falling
    standard is not an improvement, and this sentence cannot tell the two apart.
retrieval_items:
- q: What do the numerator and the denominator of a fraction each tell you?
  a: The denominator says how many equal parts the whole was cut into. The numerator says how many of those parts are being counted.
- q: What is the one move that leaves a fraction's value unchanged?
  a: Multiplying the top and the bottom by the same number, or dividing both by the same number. Changing one alone changes the fraction.
- q: Before comparing or adding two fractions, what has to be true?
  a: They have to be fractions of the same whole, and they have to stand over the same denominator.
