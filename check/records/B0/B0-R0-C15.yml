must_know:
- point: |
    Two things written side by side are multiplied. So 2x is two times x. Reading it as a two next
    to an x is the error that makes every later line unreadable. Say the multiplication out loud
    the first few times.
  kind: misconception
  bearing: methodological
- point: |
    A letter in a formula is a number, not a unit. In a line that ends 9f, the f is a count of
    grams and not the symbol for gram.
  kind: trap
  bearing: methodological
- point: |
    Substitute, and the algebra turns into arithmetic you can check.
  kind: move
  bearing: methodological
- point: |
    One line with letters in it covers every case at once. So you check a whole column of a
    spreadsheet by checking the rule once and then testing two rows, rather than by reading the
    column.
  kind: consequence
  bearing: methodological
- point: |
    A letter standing for a number says nothing about which numbers are allowed. Read every
    answer back as a quantity before you use it.
  kind: boundary
  bearing: methodological
- point: |
    Name every letter in words when you put a formula on a board, in the same breath as you write
    it.
  kind: move
  bearing: teaching
exercises:
- type: calculation
  prompt: |
    A rule is written like this.

    ```working
        T = 5a + 2b
    ```

    Say the rule out loud in words. Then work T out for a equal to 6 and b equal to 4, showing
    every line.

    Then work it out again for a equal to 6 and b equal to 9. Say in one sentence which part of your
    working you had to repeat, and which part you did not.
  answer: |
    In words: T is five times a, plus two times b.

    First case, with a as 6 and b as 4.

    ```working
        5 times 6 = 30
        2 times 4 = 8
        30 plus 8 = 38
    ```

    T is 38.

    Second case, with a as 6 and b as 9.

    ```working
        5 times 6 = 30
        2 times 9 = 18
        30 plus 18 = 48
    ```

    T is 48.

    What you repeated was the arithmetic. What you did not repeat was the rule. You wrote it
    once, and it held for both cases, which is the whole reason for putting letters in it.
  confidence_first: true
- type: teaching
  prompt: |
    A first-year resident reads 2x as a two and an x written together. They have ten minutes and
    a whiteboard, and they expect a mechanism rather than a rule to memorise.

    Teach them why the two symbols side by side mean a multiplication, so that they can read the
    next formula they meet.
  answer: |
    Ten minutes, and do not start with the notation.

    Start with a number they already read that way. Write a price on the board and ask for the
    cost of three of them. They multiply without being asked. Then write the same thing with the
    price replaced by a letter.

    ```working
        3x
    ```

    Ask what they would do if you told them x was 40. They will say 120. Let them say it before
    you name the rule.

    ```working
        3 times 40 = 120
    ```

    Now name it. Two things side by side are multiplied. That is a convention, and it was
    chosen for a reason. A multiplication sign between every pair of symbols makes a long line
    unreadable.

    Then show them what the convention costs, because this is the part they will meet in the
    wild. Write a formula with three letters in it and ask them to read it aloud.

    ```working
        E = 4c + 4p + 9f
    ```

    Make them say "four times c" rather than "four c". The moment they say times, the line stops
    being a string of symbols and starts being an instruction.

    Close with the error to watch for. A letter is a number, not a unit. Tell them that f in
    that line is a count of grams. It is not the symbol for gram. Read it as a unit and the
    multiplication gets dropped, which is how a wrong formula reaches a spreadsheet.
quantitative: true
practice:
- level: 1
  prompt: |
    Work each of these out for x equal to 4.

    ```working
        3x
        x + 9
        2x + 5
        x^2
    ```
  answer: |
    Put 4 in place of x every time.

    ```working
        3 times 4 = 12
    ```

    ```working
        4 plus 9 = 13
    ```

    ```working
        2 times 4 = 8
        8 plus 5 = 13
    ```

    ```working
        4 times 4 = 16
    ```

    So the four answers are 12, 13, 13 and 16.

    The second and third came out the same, which is worth a second look. Two different
    expressions can agree at one value of x and part company at every other one. Try x as 5 and
    they do.
- level: 2
  prompt: |
    Write each of these as a line of algebra. Use n for the number.

    - five times the number
    - the number plus seven
    - twice the number, less three
    - the number multiplied by itself
    - three times the whole of the number plus one
  answer: |
    ```working
        5n
        n + 7
        2n minus 3
        n^2
        3(n + 1)
    ```

    The first one is where the convention does its work. You write 5n and you read it as five
    times n.

    The last one needs the brackets. Without them, 3n + 1 means three times the number, and then
    one added. With them, the whole of n + 1 is tripled. Try n as 4 and the two differ.

    ```working
        3 times 4 = 12
        12 plus 1 = 13
    ```

    ```working
        4 plus 1 = 5
        3 times 5 = 15
    ```

    Thirteen against fifteen, from the same words said in a different order.
- level: 3
  prompt: |
    Work each of these out for a equal to 5 and b equal to 2.

    ```working
        ab
        3a + 2b
        a^2 minus b
        4(a + b)
    ```
  answer: |
    Put 5 in place of a and 2 in place of b.

    ```working
        5 times 2 = 10
    ```

    ```working
        3 times 5 = 15
        2 times 2 = 4
        15 plus 4 = 19
    ```

    ```working
        5 times 5 = 25
        25 minus 2 = 23
    ```

    ```working
        5 plus 2 = 7
        4 times 7 = 28
    ```

    So the four answers are 10, 19, 23 and 28.

    The first one is the one to watch. Reading ab as a multiplication is the whole move. Nothing on
    the page says to multiply except that the two letters are touching.
- level: 5
  prompt: |
    A panel declares this for every 100 grams of a food. Carbohydrate 50 grams, protein 15 grams,
    fat 10 grams. The three gram figures are made up for this problem.

    Using the factors the Food Safety and Standards (Labelling and Display) Regulations, 2020 set
    for calculating declared energy, work out the energy in kilocalories. Show every line and
    give the answer with its unit.

    Then say in one sentence what your answer does not tell you.
  answer: |
    The rule is four kilocalories for every gram of carbohydrate. Four for every gram of protein.
    Nine for every gram of fat.

    ```working
        E = 4c + 4p + 9f
    ```

    Substitute the three figures.

    ```working
        4 times 50 = 200
        4 times 15 = 60
        9 times 10 = 90
        200 plus 60 plus 90 = 350
    ```

    350 kilocalories per 100 grams.

    What it does not tell you: anything about what the food does in a person. The number is what the
    rule says a label must declare. It is worked out from grams, by multiplying. It is not a
    measurement of the food. And it says nothing about anybody's health.
  refs:
  - fssai_labelling_2020
- level: 7
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
        a rule says E = 4c + 4p + 9f
        a panel gives c as 55, p as 9 and f as 18
        substitute the three numbers into the rule
        4c becomes 455
        4p becomes 49
        9f becomes 918
        455 plus 49 plus 918 = 1,422
        so the energy is 1,422 kilocalories
    ```
  answer: |
    The step that broke is the substitution, and it broke in the same way three times.

    4c means 4 times c. Putting 55 in place of c gives 4 times 55. It does not give a 4 with 55
    written after it.

    Do it properly.

    ```working
        4 times 55 = 220
        4 times 9 = 36
        9 times 18 = 162
        220 plus 36 plus 162 = 418
    ```

    418 kilocalories, not 1,422.

    Why it looks reasonable: every digit of every number given is there in the answer. The
    addition at the end is correct. And 1,422 is a number a label could carry. Nothing about
    the working looks careless. Only one thing was missed: the convention that two symbols side
    by side are multiplied. It is invisible on the page, because it is written with nothing at
    all.
- level: 9
  prompt: |
    In a meeting somebody says this about a packet.

    > The panel says 40 grams of carbohydrate, 5 grams of protein and 30 grams of fat in every
    > 100 grams. It is mostly carbohydrate, so most of its energy comes from the carbohydrate.

    The three gram figures are made up for this problem. The factors for calculating declared
    energy are the ones the Food Safety and Standards (Labelling and Display) Regulations, 2020
    set.

    Decide what to compute, compute it, and say what your answer does not establish.
  answer: |
    What to compute: the energy each of the three contributes, rather than the grams of each.
    That is what the claim is actually about.

    ```working
        4 times 40 = 160
        4 times 5 = 20
        9 times 30 = 270
        160 plus 20 plus 270 = 450
    ```

    450 kilocalories in total, of which 270 come from the fat.

    ```working
        270 divided by 450 = 0.6
        0.6 times 100 = 60
    ```

    Sixty per cent of the energy comes from the fat, which has fewer grams than the carbohydrate.
    So the claim does not follow. The letters in the rule each carry their own multiplier, and
    the multiplier on fat is more than twice the one on carbohydrate. More grams does not mean
    more energy.

    What this does not establish. It says nothing about what the food does in a person, which
    is not a question arithmetic on a panel can reach. It says nothing about any other packet,
    since a different set of grams can go the other way. And both the grams and the energy came
    from the same panel. So what you checked is whether the panel agrees with itself, not
    whether it is right.
  refs:
  - fssai_labelling_2020
retrieval_items:
- q: What does 2x mean, and why is it written with nothing between the 2 and the x?
  a: It means 2 times x. Two things written side by side in algebra are multiplied, and the
    multiplication sign is left out because a long line with a sign between every pair of symbols
    becomes unreadable.
- q: What are the two reasons for putting a letter in place of a number?
  a: Either the number is not known yet and you want to write about it anyway, or the number
    changes from one case to the next and you want one line that covers all of them.
- q: What does substituting mean, and what does it leave you with?
  a: Replacing a letter, everywhere it appears, with a number. It leaves you with arithmetic,
    which you can do on a calculator and check.
