simplified_explanation: |
  A letter in a sum is a number wearing a name.

  ```working
      2x
  ```

  That is not a two sitting beside an x. It is 2 times x. In algebra, writing two things side by
  side means multiply them.

  A letter obeys every rule a number obeys. It has to, because it is a number.

  So you add letters the way you add numbers.

  ```working
      x plus x = 2x
  ```

  Brackets do one job. They say treat what is inside as one quantity.

  ```working
      2(x + 5)
  ```

  That is 2 times the whole of x + 5. It is not 2 times x with a 5 added on afterwards.

  When you do find out what the number is, you put it in. Putting a number in place of a letter is
  called substituting.

  Say x turns out to be 7.

  ```working
      2x
      2 times 7 = 14
  ```

  Fourteen. The letter went away and arithmetic was left.

  An expression is a piece of algebra that stands for a number, like 2x + 5. An equation is a
  statement that two expressions are the same number, like 2x + 5 = 19.
illustration:
  body: |
    An Indian food label gets its energy figure by arithmetic, not by burning the food. The Food
    Safety and Standards (Labelling and Display) Regulations, 2020 fix the numbers to multiply
    by. Four kilocalories for every gram of carbohydrate. Four for every gram of protein. Nine
    for every gram of fat.

    Take a packet whose panel says this for every 100 grams. Carbohydrate 60 grams, protein 12
    grams, fat 20 grams. Those three gram figures are made up for this problem. The three factors
    are not.

    Here is the working that comes back first. It is wrong.

    ```working
        60 plus 12 plus 20 = 92
        92 times 4 = 368
    ```

    The arithmetic is fine. What is wrong is using one factor for all three quantities.

    Write the rule with letters instead. Let c stand for the number of grams of carbohydrate. Let
    p stand for the number of grams of protein. Let f stand for the number of grams of fat. And
    let E stand for the energy in kilocalories.

    ```working
        E = 4c + 4p + 9f
    ```

    Read 9f as nine times f. And the f is not the symbol for gram.

    Now substitute.

    ```working
        4 times 60 = 240
        4 times 12 = 48
        9 times 20 = 180
        240 plus 48 plus 180 = 468
    ```

    468 kilocalories.

    A second packet comes along with 70 grams of carbohydrate, 5 grams of protein and 15 grams of
    fat. These are made up too.

    ```working
        4 times 70 = 280
        4 times 5 = 20
        9 times 15 = 135
        280 plus 20 plus 135 = 435
    ```

    435 kilocalories.

    You wrote the same rule and put different numbers into it. That is what varies in a variable.
  analogy_breaks_when: |
    The letters stand for numbers of grams. They do not stand for grams.

    And the three factors here cover carbohydrate, protein and fat only.
