simplified_explanation: |
  Take any measurement. Its error is what it says minus what is actually true. If a scale says 61.2
  kilograms and the true weight is 60.5, the error is 0.7 kilograms. An error can be positive or negative.
  Stating it needs you to already know the true value, which in real life usually comes from a trusted
  reference instrument, not from guessing.

  A systematic error pushes every reading off in the same direction by roughly the same amount. Say a
  kitchen scale reads 0.5 kilograms with nothing on the pan, instead of nothing. That is a systematic
  error: everything you weigh on it afterward comes out half a kilogram heavy. Take a hundred readings on
  this scale and average them. The half-kilogram is still there, because every single reading carried it.

  A random error pushes readings around in a way that is not predictable from one reading to the next.
  Take a hundred readings from an instrument with only random error, and average them. The average comes
  out close to the truth.

  Averaging more readings fixes random error. It does nothing at all for systematic error. A very careful,
  very repeated measurement on a badly calibrated instrument is not a truer measurement. It is a more
  confident wrong one.

  A scale that reads 61.4, 61.4, 61.4 and 61.4 kilograms on the same object agrees with itself to the last
  digit it shows. If the true weight is 60.0 kilograms, it is also wrong every time. Trueness is how close
  the average of many repeated readings sits to the true value. Accuracy needs both: small scatter and no
  push off target.

  Resolution is the smallest step an instrument's display can move by. A scale reading to the nearest 100
  grams has a resolution of 100 grams. It tells you nothing about whether those digits are close to being
  true.
illustration:
  body: |
    Kiran and colleagues' methods section states a figure worth testing before it is used.

    > Weight and height were recorded with accuracy of 100 g and 0.1 cm.

    Read that sentence the way the definition above teaches you to. A hundred grams is the step the
    weights were written down in. No reading can show a change smaller than that. That is a
    statement about resolution: the "smallest change in a quantity being measured that causes a
    perceptible change in the corresponding indication" (VIM 4.14). It is not a measured closeness
    to a true value. That would need the readings checked against a known reference weight, and
    nothing in the paper's methods reports such a check for this scale.

    This mix-up is common enough to be worth seeing worked through with numbers on a stated case. No
    real scale's repeated calibration readings are held in this book's sources. Say a calibration
    weight — a weight already checked and trusted to be correct — is known to be exactly 60.0
    kilograms. Two stated scales are each weighed against it twenty times.

    ```table
    scale A readings (kg), tight and shifted
    60.5  60.5  60.5  60.5  60.5  60.4  60.5  60.5  60.5  60.5
    60.5  60.6  60.5  60.5  60.5  60.4  60.5  60.6  60.5  60.5
    ```

    ```table
    scale B readings (kg), centred and wide
    59.7  60.2  60.2  60.4  60.0  59.6  59.4  60.6  58.7  59.7
    59.4  60.0  59.7  59.7  60.4  59.7  59.4  60.5  60.5  60.7
    ```

    Scale A's twenty readings barely move: they sit within a tenth of a kilogram of their own
    average. That is precision: how closely repeated readings agree with each other. Average them.

    ```working
        604.9 plus 605.1 = 1210.0
        1210.0 divided by 20 = 60.5
    ```

    Against the known 60.0 kilograms, every reading is 0.4 to 0.6 kilograms high, and the average is
    0.5 high.

    ```working
        60.5 minus 60.0 = 0.5
    ```

    No amount of repeating the weighing removes it, because this part of the error does not vary
    from reading to reading. It is systematic.

    Scale B's twenty readings scatter far more widely, from 58.7 up to 60.7, including two readings
    of exactly 60.0. That is wide, so this scale is much less precise than scale A. Average them
    anyway.

    ```working
        598.5 plus 600.0 = 1198.5
        1198.5 divided by 20 = 59.925
    ```

    This scale's error is random: it wobbles both above and below the truth from reading to reading.
    The wobbles partly cancel when averaged, and a few more readings would tend to bring the average
    closer still.

    Scale A looks better reading by reading: tighter, more repeatable, a more confident-looking
    number each time. Yet its average sits further from the truth than scale B's average does: half
    a kilogram out against seven and a half hundredths. Precision and trueness are not the same
    property, and a fine resolution tells you about neither one.
  analogy_breaks_when: |
    In most real measurement, the true value is exactly what you are trying to find out, so you
    cannot compute an error this way. Instead, you check an instrument's trueness once, in advance,
    against a trusted reference standard, using exactly this arithmetic.

    An instrument that reads true at 60 kilograms can drift at 120.
  numbers:
  - value: '100'
    unit: grams, the step weights were recorded in (the paper calls it "accuracy")
    citekey: kiran_2022_muac_nc
    as_of: '2026-09-23'
    quote: Weight and height were recorded with accuracy of 100 g and 0.1 cm
must_know:
- point: |
    Averaging more readings on a biased instrument does not get you a truer answer.
  kind: misconception
  bearing: methodological
- point: |
    Measurement bias is the VIM's own word (entry 2.18) for the same shape of problem. It is an error that
    points one way and does not shrink when you collect more.
  kind: consequence
  bearing: methodological
  refs:
  - jcgm_vim3
- point: |
    An instrument's stated "accuracy" is often a number of grams, millimetres or decimal places.
    It is not a closeness to a known true value. Check which one a paper means.
  kind: trap
  bearing: methodological
  refs:
  - jcgm_vim3
- point: |
    Knowing an instrument's precision (VIM 2.15), how closely repeated readings agree with each
    other, tells you nothing about whether they agree with the truth.
  kind: boundary
  bearing: methodological
  refs:
  - jcgm_vim3
- point: |
    Differences between observers are each observer's own systematic habit. Mixed across many
    observers, those habits scatter like random error. A single observer taking every measurement
    removes that scatter, but not the one observer's own habit. That habit then reaches every
    reading in the study, and no amount of data from that study alone can reveal it.
  kind: consequence
  bearing: methodological
  refs:
  - kiran_2022_muac_nc
- point: |
    Once a systematic error's size is known, subtract it. Finding the size needs an independent
    check against a known value, not simply more readings from the same instrument.
  kind: move
  bearing: methodological
  refs:
  - jcgm_vim3
- point: |
    Teach a trainee to ask two separate questions of any instrument. How closely do repeated
    readings agree with each other? That is precision. How close does the average of many repeated
    readings sit to the true value? That is trueness. Accuracy needs both together.
  kind: move
  bearing: teaching
exercises:
- type: critique
  prompt: |
    mmHg means millimetres of mercury. It is the unit blood pressure is read in. A device maker
    says: "Our new blood-pressure monitor is accurate to within 1 mmHg." Here is where that number
    comes from. Used again and again on the same person inside one minute, the monitor gives the
    same reading each time, to within 1 mmHg.

    Say what word this number really describes. Say what question it leaves unanswered.
  answer: |
    The figure describes precision, not accuracy. It is about how closely repeated readings agree
    with each other, here on the same person, taken close together in time. That is a real property worth
    stating. A tight one is a genuine strength of the device.

    It leaves unanswered whether those readings sit close to the person's true blood pressure. A
    monitor could read within 1 mmHg of itself on every repeat. It could still read 15 mmHg high
    every single time, if it carries a systematic error. Repeating the same check on the same
    faulty device will not catch that, no matter how many times it is repeated.

    What would answer it: compare the monitor's readings against a reference device already shown
    to be accurate. Use it on a set of people whose true
    blood pressure by that method is known. Only that comparison speaks to accuracy. The
    manufacturer's own figure, however it is worded, speaks only to precision.
- type: teaching
  prompt: |
    A trainee says a colleague's instrument "must be fine because it gives the same number every
    time." You have ten minutes and a whiteboard.

    Teach them why that is not enough.
  answer: |
    Ten minutes, for someone who expects a mechanism rather than reassurance.

    Draw a small target on the board. Mark a cluster of shots tightly grouped in the top-right
    corner, well away from the bullseye. Say that this is what "the same number every time" looks
    like: tight, repeatable, and a whole target's-width away from the truth.

    Ask the trainee what would fix this pattern. Let them try "shoot more times and average the
    positions."

    Mark the average of the cluster: it lands in almost the same spot, still off the bullseye.
    Repetition of a systematic error changes nothing about it.

    Now draw a second target with shots scattered loosely all around the bullseye itself. Mark that
    this one is far less repeatable, shot to shot, and average its positions. The average lands
    close to the bullseye, because the scatter is random and partly cancels.

    Write the two words on the board next to their targets. The tight, off-target cluster is
    precise, not true. The loose, centred scatter is true, not precise. Close with the question
    you want the trainee to ask from now on, about every "fine because it's consistent" instrument.
    Is it consistent with itself, or consistent with the truth?
quantitative: true
practice:
- level: 1
  prompt: |
    A device is checked against a known true value of 200. On one occasion it reads 194. Work out
    the error, and say what its sign tells you.
  answer: |
    Error is the measured value minus the true value.

    ```working
        194 minus 200 = -6
    ```

    The error is -6. The negative sign says the reading came out below the true value, by 6.
- level: 2
  prompt: |
    A device is checked five times against a known true value of 75. It reads 78, 77, 79, 76 and 80.
    Work out the error for each reading.
  answer: |
    Subtract 75 from each reading.

    ```working
        78 minus 75 = 3
        77 minus 75 = 2
        79 minus 75 = 4
        76 minus 75 = 1
        80 minus 75 = 5
    ```

    The five errors are 3, 2, 4, 1 and 5.
- level: 4
  prompt: |
    Two instruments are each checked five times against a known true value. Their errors are
    listed below. For each set, work out the average error and the range of the errors. Say which
    set looks more systematic and which looks more random.

    ```working
        set P: 3, 2, 4, 1, 5
        set Q: -3, 4, -5, 2, -1
    ```
  answer: |
    Set P first.

    ```working
        3 plus 2 plus 4 plus 1 plus 5 = 15
        15 divided by 5 = 3
        5 minus 1 = 4
    ```

    Average error 3, range 4. Every error is positive and none strays far from the average: this
    looks systematic, pushed one way by about the same amount each time.

    Now set Q.

    ```working
        -3 plus 4 plus -5 plus 2 plus -1 = -3
        -3 divided by 5 = -0.6
        4 minus -5 = 9
    ```

    Subtracting a negative number adds its size. On a number line, the distance from -5 up to 4 is
    5 plus 4, which is 9.

    Average error -0.6, close to zero. The range is 9, far wider than set P's own range. The
    errors cross zero and spread out a long way either side. This looks random, with little or no
    consistent push in one direction.
- level: 4
  prompt: |
    A scale is checked against a calibration weight of 20.0 kg. It gives five readings: 20.3, 20.2,
    20.4, 20.3 and 20.3 kg. Work out the error for each reading and the average error, with its
    unit.
  answer: |
    Subtract 20.0 kg from each reading.

    ```working
        20.3 minus 20.0 = 0.3
        20.2 minus 20.0 = 0.2
        20.4 minus 20.0 = 0.4
        20.3 minus 20.0 = 0.3
        20.3 minus 20.0 = 0.3
    ```

    Errors of 0.3, 0.2, 0.4, 0.3 and 0.3 kg. Average them.

    ```working
        0.3 plus 0.2 plus 0.4 plus 0.3 plus 0.3 = 1.5
        1.5 divided by 5 = 0.3
    ```

    An average error of 0.3 kg. Every reading is high by close to the same amount, which is the
    pattern of a systematic error.
- level: 5
  prompt: |
    A thermometer is checked against a reference temperature of 37.0 °C (degrees Celsius). It gives
    five readings: 36.4, 37.6, 36.9, 37.3 and 37.0 °C. Work out the error for each reading, the
    average error, and the range of the errors. Say whether this instrument looks more like the
    scale in the previous problem or not.
  answer: |
    Subtract 37.0 °C from each reading.

    ```working
        36.4 minus 37.0 = -0.6
        37.6 minus 37.0 = 0.6
        36.9 minus 37.0 = -0.1
        37.3 minus 37.0 = 0.3
        37.0 minus 37.0 = 0.0
    ```

    Errors of -0.6, 0.6, -0.1, 0.3 and 0.0 °C.

    ```working
        -0.6 plus 0.6 plus -0.1 plus 0.3 plus 0.0 = 0.2
        0.2 divided by 5 = 0.04
        0.6 minus -0.6 = 1.2
    ```

    Subtracting a negative number adds its size, as the earlier problem on set Q showed: 0.6 minus
    -0.6 is 0.6 plus 0.6, which is 1.2.

    An average error of about 0.04 °C, close to zero, and a range of 1.2 °C, wide compared with the
    average. This is the opposite pattern from the scale. The errors scatter both above and below
    zero and mostly cancel out, which is the pattern of random error, not systematic error.
- level: 6
  prompt: |
    Kiran and colleagues' scale recorded weight in steps of 100 g. Suppose one student's weight is
    recorded as 68.3 kg on this scale. A reference scale, checked against a known weight, gives
    68.0 kg for the same student. Work out the error. Can knowing how the scale records its
    weights tell you whether this error is systematic or random?
  answer: |
    Error is the measured value minus the true value.

    ```working
        68.3 minus 68.0 = 0.3
    ```

    An error of 0.3 kg, or 300 g.

    Knowing the scale's recording step, on its own, cannot answer that question. The step tells you
    the smallest change the display can show. It says nothing about the pattern of the scale's
    errors across repeated readings. Answering that needs several readings of the same known
    weight, not one reading and not the size of the display's steps.
  refs:
  - kiran_2022_muac_nc
- level: 7
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
        a thermometer has a zero error: with its probe in melting ice, it reads 0.3 °C instead of 0.0
        twenty readings of a pan of boiling water are taken and averaged, giving 100.3 °C
        averaging twenty readings reduces error, since averaging is how error is reduced
        so 100.3 °C can be treated as an accurate reading
    ```
  answer: |
    The first two lines are fine as stated: a zero error of 0.3 °C, and an average reading of
    100.3 °C.

    Line 3 states a rule that is true of random error as if it held for all error. That is the
    break. Averaging reduces random error, because random error varies from reading to reading and
    partly cancels. A zero error is a systematic error. If it is the same at every temperature, it
    adds the same 0.3 °C to every reading of the boiling water too. So it is still fully present in
    the average.

    ```working
        100.3 minus 0.3 = 100.0
    ```

    Subtracting the known zero error is a correction (VIM 2.53). Corrected for it, the best
    estimate is 100.0 °C. Twenty readings, or two thousand, would change nothing about that 0.3 °C
    error, until it is corrected for.

    Why it looks reasonable: "averaging reduces error" is true of random error. The third line
    states it as if it were true of all error. The flaw is applying that rule to the wrong case. It
    only works for random error, and this case is systematic. Nothing in the arithmetic itself flags
    which kind of error is in play.
  refs:
  - jcgm_vim3
- level: 7
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
        a scale is checked twenty times against a known 40.0 kg weight
        the readings average to 40.05 kg
        the average is close to the true weight, so the scale is accurate
        each individual reading is therefore also close to the true weight
    ```
  answer: |
    The first two lines are fine: an average 0.05 kg from the truth is good trueness (VIM 2.14).

    ```working
        40.05 minus 40.0 = 0.05
    ```

    Line 3 is where it starts to break: a close average shows trueness, not accuracy. Line 4 then
    draws the conclusion that the mislabel invites. Trueness describes the average of many readings.
    It says nothing about how far any one reading might sit from that average. A scale can have this
    exact same average and still scatter widely, reading by reading. Say five of its readings were
    38.0, 42.0, 39.0, 41.0 and 40.25 kg.

    ```working
        38.0 plus 42.0 plus 39.0 plus 41.0 plus 40.25 = 200.25
        200.25 divided by 5 = 40.05
    ```

    The same average, 40.05 kg, true on average to within 0.05 kg. Yet no single reading sits
    anywhere near that close: they range from 38.0 to 42.0, four kilograms apart. Good trueness on
    average and poor precision, reading by reading, sit together without contradiction.

    Why it looks reasonable: "accurate" is being used the way people use it in speech, for the
    whole instrument. The VIM keeps trueness apart from precision, because one can be good while
    the other is not.
  refs:
  - jcgm_vim3
- level: 8
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
        a paper states: neck circumference was measured with 1 mm precision
        precision means how closely repeated readings agree with each other
        so the paper has shown its neck-circumference readings agree with each other to within 1 mm
        this supports treating the reported neck-circumference figures as free of measurement error
    ```
  answer: |
    The first line quotes the paper correctly. The second line is also right about what precision
    means in the VIM's sense (entry 2.15): how closely repeated readings agree with each other.

    The step that broke is the third line. Showing that readings agree needs several readings of the
    same person, compared against one another. The paper's methods do not name the instrument used
    on the neck, and report no repeat measurement. "With 1 mm precision" most likely names the step
    the readings were recorded in. That is closer to resolution than to precision. Resolution is the
    "smallest change in a quantity being measured that causes a perceptible change in the
    corresponding indication" (VIM 4.14).

    The fourth line inherits the error, and adds one of its own. Even a genuinely precise
    instrument is not automatically free of error. Precision says nothing about trueness, and
    "free of measurement error" would need both.

    Why it looks reasonable: the paper's own sentence uses the word "precision". Taking a source at
    its own word feels like careful reading, not carelessness. A term of art can be used loosely
    by the very people who would be expected to use it precisely.
  refs:
  - kiran_2022_muac_nc
  - jcgm_vim3
- level: 8
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
        a scale has a known zero error: with nothing on it, it reads 0.4 kg
        a reading of 62.1 kg is taken on this scale
        to correct for the zero error, add it back: 62.1 plus 0.4 = 62.5
        so the corrected weight is 62.5 kg
    ```
  answer: |
    The first two lines are fine as stated: a zero error of 0.4 kg, and a reading of 62.1 kg.

    The step that broke is the third line. The reading of 62.1 kg already carries the +0.4 kg zero
    error built into it, since the scale adds that much to everything it weighs. A correction (VIM
    2.53) removes a known systematic error. It has to work against the direction the error pushed
    in: subtract it, not add it.

    ```working
        62.1 minus 0.4 = 61.7
    ```

    The corrected estimate is 61.7 kg. Adding the zero error instead of subtracting it does not
    remove the error. It adds a second dose of the same push. The reported 62.5 kg sits 0.8 kg away
    from the corrected estimate. That is twice the size of the zero error itself, in the same
    direction the scale was already wrong in.

    Why it looks reasonable: "correcting" sounds like it should add something back, the way you
    might add a missing item to a total. A correction for a known error runs the other way: it
    takes the error back out.
  refs:
  - jcgm_vim3
- level: 9
  prompt: |
    A colleague says: "Our new digital scale must be more accurate than the old one — it shows an
    extra decimal place."

    Here are five readings from each scale, weighing the same known 50.00 kg calibration weight.

    ```table
    old scale (kg)   50.1   49.9   50.2   49.9   50.0
    new scale (kg)   50.63  50.57  50.71  50.55  50.64
    ```

    Decide what to compute, compute it, and say what your answer does not establish.
  answer: |
    Compute the average reading and the average error for each scale.

    ```working
        50.1 plus 49.9 plus 50.2 plus 49.9 plus 50.0 = 250.1
        250.1 divided by 5 = 50.02
        50.02 minus 50.00 = 0.02
    ```

    The old scale averages 50.02 kg, an error of 0.02 kg.

    ```working
        50.63 plus 50.57 plus 50.71 plus 50.55 plus 50.64 = 253.1
        253.1 divided by 5 = 50.62
        50.62 minus 50.00 = 0.62
    ```

    The new scale averages 50.62 kg, an error of 0.62 kg, thirty-one times the old scale's.

    This does not establish that the new scale is more accurate. It points the other way. Every new
    reading sits at least 0.55 kg from the truth, against at most 0.2 kg for the old scale. Its
    trueness (VIM 2.14) is far worse too, despite the extra decimal place.

    The extra digit is a statement about resolution. That is the "smallest change in a quantity being measured that
    causes a perceptible change in the corresponding indication" (VIM 4.14). For a digital display, that is
    in practice the step of its last digit. It says nothing about how close the average sits to the
    truth, and here it sits further away. A finer display can dress up a worse instrument exactly as
    confidently as a better one.

    Nor does this show the new scale is worse in every way. Its readings agree more closely with
    each other: a range of 0.16 kg against 0.3 kg. And five readings at
    50 kg say nothing about either scale at other weights.
  refs:
  - jcgm_vim3
- level: 10
  prompt: |
    A methods section says: "One trained observer took every measurement, so this study has no
    measurement error to consider."

    Kiran and colleagues also used one observer. They call it a strength: no two people's readings
    can then differ.

    Now say a second person also measures the necks of the same five people. Each writes down the
    size round the neck in cm.

    ```table
    observer 1 (cm)   34.2   35.6   33.8   36.1   34.9
    observer 2 (cm)   34.6   36.0   34.3   36.4   35.2
    ```

    Decide what to compute, compute it, and say what the claim does not establish.
  answer: |
    Compute each person's difference between the two observers, then the average difference.

    ```working
        34.6 minus 34.2 = 0.4
        36.0 minus 35.6 = 0.4
        34.3 minus 33.8 = 0.5
        36.4 minus 36.1 = 0.3
        35.2 minus 34.9 = 0.3
    ```

    ```working
        0.4 plus 0.4 plus 0.5 plus 0.3 plus 0.3 = 1.9
        1.9 divided by 5 = 0.38
    ```

    Observer 2 reads about 0.38 cm higher than observer 1. This is true on every person, not just
    on average. All five differences come out positive.

    That is the shape of a systematic error: one observer's own habit. It shows up only once a
    second observer's readings exist to check against.

    This does not prove the one-observer study had no measurement error.

    It shows that two observers, measuring the same necks, can disagree by an amount that looks
    systematic.

    A study using only one of these two observers would carry that same habit through every
    reading. Nothing in its own data would reveal it.

    Nor does this say which observer is closer to the truth. Comparing two observers to each
    other is not the same as comparing either one to a known correct value.
  refs:
  - kiran_2022_muac_nc
retrieval_items:
- q: What is a measurement's error, and what are its two components called?
  a: The measured value minus the true value. Its systematic component stays constant or varies
    predictably across repeats; its random component varies unpredictably.
- q: Why does averaging repeated readings reduce random error but not systematic error?
  a: Random error pushes readings both above and below the true value, so they partly cancel when
    averaged. Systematic error pushes every reading the same way, so averaging keeps all of it.
- q: What is the difference between a scale's resolution and its accuracy?
  a: Resolution is the smallest change its display can show, the size of its steps. Accuracy is how
    close a measured value comes to the true value, and a fine resolution says nothing about that.
