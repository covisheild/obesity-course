    citekey: fss_act_2006
  - value: '10,00,000'
    unit: rupees, ceiling on the penalty for a misleading food advertisement, s.53
    citekey: fss_act_2006
must_know:
- point: |
    On a logarithmic axis equal distances are equal multiples, not equal amounts. Reading them as
    amounts is the standard mistake, and it is made by people who are confident about the figure
    because they can see it.
  kind: misconception
  bearing: methodological
- point: |
    Before reading any figure, look at the axis and decide which kind it is. If the marks go 1, 10,
    100, 1,000 the steps are multiplications. If they go 1, 2, 3 they are additions. Everything you
    then say about the shape of the line depends on which answer you got.
  kind: move
  bearing: methodological
- point: |
    A logarithmic axis cannot show zero or anything below it, because no power of ten produces
    them. So a figure on that axis has dropped every zero in the underlying data and says nothing
    about it. Ask what happened to those observations.
  kind: boundary
  bearing: methodological
- point: |
    A log axis makes a large difference look modest. If you are arguing about the size of an effect
    rather than its presence, that axis is working against you. The same is true when somebody else
    chose it. Say which axis you are reading from before you quote a figure in public.
  kind: consequence
  bearing: public
- point: |
    Indian charts are often labelled in lakh or crore, and the labels do not tell you the axis. Steps
    of one lakh, two lakh, three lakh are an ordinary scale. Steps of one lakh, ten lakh, one crore
    are a log scale. Read the steps rather than the words.
  kind: india_deviation
  bearing: methodological
- point: |
    Asked in a viva what the logarithm of one is, the answer is zero, because ten to the power zero
    is one. The question is asked because a candidate who has learnt the button and not the idea
    will guess one. They will then be unable to say why.
  kind: trap
  bearing: teaching
- point: |
    You will not be asked to compute a logarithm by hand and there is no reason to learn how. What
    you must be able to do is say what one means and read an axis built from them. And notice when a
    figure has been drawn on one without saying so.
  kind: move
  bearing: teaching
exercises:
- type: interpretation
  prompt: |
    A figure has a vertical axis marked 1, 10, 100, 1,000, 10,000, with the marks evenly spaced. A
    line climbs steadily across it, at a constant angle, from the bottom left to the top right. Say
    what a straight line on this figure means about the quantity, and say what the same data would
    look like on an ordinary scale.
  answer: |
    Equal distances up this axis are equal multiplications. A straight line means the quantity is
    multiplying by the same factor in each equal step along the bottom. Doubling every year, say, or
    rising tenfold every decade.

    That is a very different claim from the one a straight line usually carries. On an ordinary
    scale a straight line means the same amount is being added each step.

    On an ordinary scale, this same data would not be a straight line at all. It would hug the
    bottom of the page for most of its length and then turn sharply upward near the right-hand edge.
    Almost all of the visible movement would happen in the last part of the figure, and the early
    values would be indistinguishable from zero.

    Which is worth saying out loud: the log axis did not change the data. It changed which part of
    the data you can see.
  confidence_first: true
- type: calculation
  prompt: |
    Take the four penalty ceilings from the Food Safety and Standards Act, 2006 in the worked
    example. Say how many times larger the largest is than the smallest, first by dividing and then
    by subtracting the logarithms. Then say what the logarithm of ten crore would be.
  answer: |
    By dividing.

    ```
        10,00,000 divided by 25,000
        = 1,000 divided by 25          (take three zeros off each)
        = 40
    ```

    By subtracting the logarithms.

    ```
        6.0 minus 4.4 = 1.6
    ```

    A difference of 1.6 on the logarithm scale means a factor of 10^1.6. A calculator gives about
    40, which agrees with the division. Note the shape of it: the division needed the zeros counted,
    and the subtraction did not.

    Ten crore. A crore is 10^7, so ten crore is 10^8, and the logarithm is 8.

    Check it against the ladder. Ten crore is a hundred times the largest penalty in the Act. A
    hundred is two powers of ten, so the logarithm should be 6 plus 2. It is.
quantitative: true
practice:
- level: 1
  prompt: |
    Give the logarithm to base ten of each of these, without a calculator.

    ```
        100      10,000      1      10^9
    ```
  answer: |
    The logarithm is the power of ten, so read the exponent off each number.

    ```
        100     = 10^2   so the logarithm is 2
        10,000  = 10^4   so the logarithm is 4
        1       = 10^0   so the logarithm is 0
        10^9             so the logarithm is 9
    ```

    The third is the one people get wrong under pressure. The logarithm of one is zero, because ten
    to the power zero is one.
- level: 2
  prompt: |
    Each of these logarithms belongs to a number. Say which number.

    ```
        3      6      0      -2
    ```
  answer: |
    Raise ten to each one.

    ```
        3   -> 10^3  = 1,000
        6   -> 10^6  = 10,00,000    (ten lakh)
        0   -> 10^0  = 1
        -2  -> 10^-2 = 0.01
    ```

    A negative logarithm belongs to a number between zero and one. It does not belong to a negative
    number, and no logarithm does.
- level: 3
  prompt: |
    Without a calculator, say between which two whole numbers the logarithm of 4,800 lies. Then say
    which of the two it is closer to, and why.
  answer: |
    Put 4,800 between the two powers of ten that bracket it.

    ```
        1,000  = 10^3
        4,800
        10,000 = 10^4
    ```

    So the logarithm lies between 3 and 4.

    Which end it is nearer. The halfway point on a logarithm scale is not the halfway point in the
    number. Halfway between 10^3 and 10^4 is about 3,160, and 4,800 is above that. So the logarithm
    is above 3.5, nearer 4. A calculator gives 3.68.
- level: 4
  prompt: |
    Section 21(2) of the Consumer Protection Act, 2019 caps a penalty at ten lakh rupees. Sections
    34 and 47 cap District and State Commission complaints at one crore and ten crore. Give the
    logarithm of each figure.
  answer: |
    Write each as a power of ten first. Every one of the three is an exact power, which is why this
    problem has clean answers.

    ```
        ten lakh   = 10,00,000     = 10^6   logarithm 6
        one crore  = 1,00,00,000   = 10^7   logarithm 7
        ten crore  = 10,00,00,000  = 10^8   logarithm 8
    ```

    Six, seven, eight. Each step up the ladder is one on the logarithm scale and ten times in
    rupees, which is what a logarithm scale is for.
  refs: [consumer_prot_2019]
- level: 5
  prompt: |
    Take the four penalty figures from the Food Safety and Standards Act, 2006: 25,000, 3,00,000,
    5,00,000 and 10,00,000. Using a calculator for the logarithms, say how many times larger the
    three lakh figure is than the twenty-five thousand one, by subtracting logarithms.
  answer: |
    The two logarithms.

    ```
        25,000    logarithm 4.4
        3,00,000  logarithm 5.5
    ```

    Subtract.

    ```
        5.5 minus 4.4 = 1.1
    ```

    A difference of 1.1 on the logarithm scale means a factor of 10^1.1, which a calculator gives
    as about 12.6.

    Check it by dividing directly.

    ```
        3,00,000 divided by 25,000
        = 300 divided by 25
        = 12
    ```

    Twelve against 12.6. The small gap is the rounding in the two logarithms, each given to one
    place. That is the price of working on the logarithm scale, and it is usually worth paying.
  refs: [fss_act_2006]
- level: 6
  prompt: |
    A figure has a vertical axis marked 100, 1,000, 10,000 and 1,00,000, evenly spaced. Two points
    sit on it: one at 300 and one at 30,000. Say how far apart they are in logarithms, and how many
    times larger one value is than the other.
  answer: |
    The logarithms, from a calculator.

    ```
        300     logarithm 2.5
        30,000  logarithm 4.5
    ```

    The distance between them.

    ```
        4.5 minus 2.5 = 2
    ```

    Two whole steps on the axis, which is two powers of ten.

    ```
        10^2 = 100
    ```

    So one value is a hundred times the other. Check it directly: 30,000 divided by 300 is 100.

    Notice what the axis showed you. Two marks apart always means a hundred times, wherever on the
    axis you measure it.
- level: 7
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```
        logarithm of 200 = 2.3
        logarithm of 300 = 2.5
        2.3 plus 2.5 = 4.8
        so 200 plus 300 = 10^4.8 = about 63,000
    ```
  answer: |
    Adding logarithms corresponds to multiplying the numbers, not adding them.

    Check what the working actually computed.

    ```
        200 times 300 = 60,000
    ```

    Sixty thousand, and 10^4.8 is about 63,000, which is that figure with the rounding in the two
    logarithms. So the arithmetic performed a multiplication correctly and the answer was given the
    wrong name.

    The sum itself is simply 500, and logarithms are no help with it at all.

    Why it looks reasonable: the words "add" and "plus" appear in the working and in the question,
    so the operations look matched. Adding logarithms multiplies. There is no logarithm rule for
    adding two numbers.
- level: 8
  prompt: |
    Here is a claim about a figure whose vertical axis runs 1, 10, 100, 1,000 in evenly spaced
    marks.

    > The line rose one mark between 2015 and 2020, and one mark again between 2020 and 2025, so
    > the increase was steady.

    Find what is wrong with the word "steady".
  answer: |
    Each mark is a multiplication by ten, so equal marks are equal multiples and not equal amounts.

    Suppose the line started at 1.

    ```
        2015   1
        2020   10      an increase of 9
        2025   100     an increase of 90
    ```

    The second rise is ten times the first in amount.

    "Steady" is right only if it means multiplying by the same factor each period. That is
    exponential growth, and it is the opposite of what most readers hear in the word.

    Why it looks reasonable: the line is straight and the gaps are equal. On an ordinary axis that
    is exactly what steady growth looks like. The axis changed and the eye did not.
- level: 9
  prompt: |
    Here is a caption under a figure in a report.

    > Values below the axis minimum are not shown. The vertical axis is logarithmic.

    Decide what to work out about the data, and say what the figure cannot establish.
  answer: |
    What to work out: what happened to the zeros.

    A logarithm scale has no position for zero, because no power of ten gives zero. So every
    observation with a value of zero has been dropped from the figure, and the caption's first
    sentence is describing that without saying so.

    ```
        logarithm of 1    = 0
        logarithm of 0.1  = -1
        logarithm of 0.01 = -2
        logarithm of 0    = does not exist
    ```

    Going down the axis makes values smaller for ever and never reaches zero.

    What the figure cannot establish. It cannot tell you how many observations were zero. Those may
    be the most important ones: a district with no cases, a facility with no stock. A figure that
    drops them can show a rising line while the number of places reporting nothing also rises. Ask
    for the count of zeros before you quote the figure.
- level: 10
  prompt: |
    A colleague shows you two charts of the same data and asks which to use in a briefing. One has
    an ordinary vertical axis, the other a logarithmic one. On the log chart the rise looks modest;
    on the ordinary one it looks dramatic. Decide what to work out, and say what your answer does
    not settle.
  answer: |
    What to work out: what the argument is about. That decides the axis, and nothing else does.

    If the question is **whether the thing is growing by a constant factor**, doubling every year
    say, the log axis answers it. Constant multiplication is a straight line there, and nothing
    else is.

    If the question is **how many more people are affected**, the ordinary axis answers it, because
    that is the axis on which distance means amount.

    ```
        from 100 to 1,000 on a log axis   one step
        from 100 to 1,000 in people       900 more people
    ```

    Same data. The log axis shows the shape of the growth and hides its size; the ordinary axis
    does the reverse.

    What this does not settle. Neither chart tells you whether the rise is real or whether the
    counting changed. And whichever you choose, say in the briefing which axis it is. A reader who
    assumes the other one takes away the opposite of what you meant.
