simplified_explanation: 'Energy is measured, so energy has a unit. The SI unit is the joule.


  A thousand joules is one kilojoule. Kilo means a thousand, here and everywhere else.


  The calorie is not part of the SI. Its size was decided by committees, and two of them decided

  differently.


  Both numbers are exact, because both are decisions. Nobody went to a laboratory and got 4.184.


  A kilocalorie is a thousand calories. It is the unit used for the energy in food.


  In food work people write calories when they mean kilocalories. So when a packet, a paper or a

  scheme document says calories, read kilocalories. Then check the size of the number to be sure.

  '
illustration:
  body: "Start with the mistake, because it is the one waiting for you.\n\nOpen the National Food\
    \ Security Act, 2013, and go to Schedule II. Find the row for lower\nprimary classes. The hot\
    \ cooked meal is set at 450.\n\nTake that 450 as calories and turn it into joules.\n\n```working\n\
    \    450 times 4.184 = 1,882.8\n```\n\nA meal of 1,882.8 joules. Something has gone wrong, and\
    \ it is not the arithmetic.\n\nGo back to the table and read the head of the column instead of\
    \ the number under it. It says\nCalories, and then, in brackets, Kcal.\n\nSo the meal is 450 kilocalories.\
    \ Do it again properly, one line at a time.\n\n```working\n    450 kilocalories, first into calories\n\
    \    450 times 1,000 = 4,50,000\n    now into joules\n    4,50,000 times 4.184 = 18,82,800\n \
    \   and into kilojoules\n    18,82,800 divided by 1,000 = 1,882.8\n```\n\nThe digits are the same\
    \ and the unit is not. Kilocalories\nto kilojoules uses the same 4.184 as calories to joules,\
    \ because both sides of the sum were\nmultiplied by a thousand.\n\nTake the upper primary figure\
    \ from the same table, 700 kilocalories, and convert it with each of\nthe two calories in turn.\n\
    \n```working\n    700 times 4.184 = 2,928.8\n    700 times 4.1868 = 2,930.76\n```\n\nTwo answers,\
    \ from one figure, both correct.\n\n```working\n    2,930.76 minus 2,928.8 = 1.96\n```\n\nJust\
    \ under two kilojoules apart. The gap is in the fourth digit.\n\nIf\ntheir kilojoule figure and\
    \ yours part company in the fourth digit, neither of you has slipped.\nYou used different calories.\n"
  analogy_breaks_when: 'The two conversion factors are exact and they stay exact.


    What a conversion cannot do is improve the number you started with. It renames an amount.

    '
