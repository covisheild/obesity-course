must_know:
- point: 'Nobody measured the calorie. Committees fixed it, and both of their values are exact by

    definition.

    '
  kind: misconception
  bearing: methodological
  refs:
  - nist_sp811
- point: 'One thermochemical calorie is 4.184 joules. That is the factor to use unless a paper tells
    you

    otherwise, and the same 4.184 turns kilocalories into kilojoules.

    '
  kind: number
  bearing: methodological
  refs:
  - nist_sp811
- point: 'A second calorie is in use. The International Table calorie is 4.1868 joules. Check which
    calorie

    each of them used before you tell either of them they are wrong.

    '
  kind: trap
  bearing: methodological
  refs:
  - nist_sp811
- point: 'When food material says calories, read kilocalories, because the prefix is usually left
    off in

    practice. Then check the size. A meal in the hundreds is kilocalories.

    '
