concept_id: B0-R0-C12
subject: B0
rung: 0
sequence: 12
name: 'Energy units: joule, kilojoule, calorie, kilocalorie'
concept_type: institutional
clusters:
- measurement-inference
- body-and-person
ground_floor_deps: []
concept_deps:
- B0-R0-C03
