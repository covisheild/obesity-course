exercises:
- type: critique
  prompt: 'Here is a line from a draft teaching note.


    > Careful measurement has established that one calorie is equal to 4.184 joules.


    Say what is wrong with it, and write the sentence you would put in its place.

    '
  answer: 'The word that fails is measurement. The value is a definition. A committee set the

    thermochemical calorie at 4.184 joules exactly, and a different committee set the International

    Table calorie at 4.1868 joules.


    You can tell from the number itself. A measured quantity comes with a spread and gets sharper

    as instruments improve. This one is exact and always was, because it was chosen.


    The replacement sentence names the decision and leaves the door open.


    > The thermochemical calorie is defined as 4.184 joules exactly. A second definition, the

    > International Table calorie, is 4.1868 joules, so a paper should say which one it used.


    One more thing follows. Nothing an experiment finds can change either figure. Only a standards

    body can, which is why this section carries an as-of date and the arithmetic sections do not.

    '
- type: teaching
  prompt: 'A journalist has three minutes and asks you what the energy number on a food packet actually

    means. Explain it without jargon. Give one quotable sentence, and say plainly how much the

    two-calorie business matters to a reader.

    '
  answer: 'Answer first, in their words.


    > The number on the packet is in kilocalories, even when the packet just says calories. One

    > kilocalorie is 4.184 kilojoules, and that factor is fixed by agreement rather than measured.


    Then the part they asked about without knowing it. There are two calories in use and they differ

    by about seven parts in ten thousand. For a reader looking at a packet that difference is

    invisible. It only shows up when two published figures are compared to four digits.


    Say the confidence out loud. The conversion is exact and not in doubt. What is worth doubting
    is

    the energy figure itself, and that is a different question from the unit.


    What not to say: that one of the two calories is the right one. Neither is. They are two

    decisions, and a paper should tell you which it used.

    '
quantitative: true
practice:
- level: 1
  prompt: "Write each of these as the other unit asks for.\n\n```working\n    1,000 joules into kilojoules\n\
    \    2.5 kilojoules into joules\n    3 kilocalories into calories\n    7,000 calories into kilocalories\n\
    ```\n"
  answer: "Kilo means a thousand, so every line here is a multiplication or a division by 1,000.\n\
    \n```working\n    1,000 divided by 1,000 = 1\n    2.5 times 1,000 = 2,500\n    3 times 1,000 =\
    \ 3,000\n    7,000 divided by 1,000 = 7\n```\n\nGoing to the bigger unit divides. Going to the\
    \ smaller unit multiplies. Nothing about the amount\nof energy changed on any line.\n"
- level: 2
  prompt: "Turn each of these into joules, using the thermochemical calorie.\n\n```working\n    1\
    \      10      250      1,500\n```\n"
  answer: "Multiply each by 4.184.\n\n```working\n    1 times 4.184 = 4.184\n    10 times 4.184 =\
    \ 41.84\n    250 times 4.184 = 1,046\n    1,500 times 4.184 = 6,276\n```\n\nEvery answer is bigger\
    \ than the number you started with. A joule is smaller than a calorie, so\nit takes more of them\
    \ to hold the same energy.\n"
- level: 3
  prompt: "Now go the other way. Turn each of these joule figures into thermochemical calories.\n\n\
    ```working\n    8.368      2,092      4,184\n```\n"
  answer: "Divide each by 4.184, because you are going back the way you came.\n\n```working\n    8.368\
    \ divided by 4.184 = 2\n    2,092 divided by 4.184 = 500\n    4,184 divided by 4.184 = 1,000\n\
    ```\n\nCheck the direction on the last one. Four thousand joules is a thousand calories, so the\n\
    calorie figure is the smaller of the two. If your answer came out larger, you multiplied where\n\
    you should have divided.\n"
- level: 4
  prompt: 'Schedule II of the National Food Security Act, 2013 sets the hot cooked meal for lower
    primary

    classes at 450 kilocalories. Give that figure in kilojoules, using the thermochemical calorie,

    and keep the unit on the answer. Then say how many digits you would write down.

    '
  answer: "Kilocalories to kilojoules uses the same factor as calories to joules.\n\n```working\n\
    \    450 times 4.184 = 1,882.8\n```\n\nSo 1,882.8 kilojoules.\n\nNow the digits. The Act gives\
    \ 450, which carries two digits you can trust. Writing 1,882.8\nclaims five. Write 1,900 kilojoules,\
    \ or say about 1,900 kilojoules a meal.\n\nKeep the label with it. Kilojoules of food energy per\
    \ hot cooked meal, not per child per day.\n"
  refs:
  - nfsa_2013
- level: 5
  prompt: 'The same Schedule sets the upper primary hot cooked meal at 700 kilocalories. Convert it
    twice,

    once with the thermochemical calorie and once with the International Table calorie. Say how far

    apart the two answers are, in kilojoules and as a share of the figure.

    '
  answer: "Once each way.\n\n```working\n    700 times 4.184 = 2,928.8\n    700 times 4.1868 = 2,930.76\n\
    ```\n\nThe gap between them.\n\n```working\n    2,930.76 minus 2,928.8 = 1.96\n```\n\nJust under\
    \ two kilojoules. As a share of the figure, divide the gap by either answer.\n\n```working\n \
    \   1.96 divided by 2,928.8 = 0.00067\n```\n\nAbout seven parts in ten thousand, which is under\
    \ a tenth of one per cent.\n\nBoth answers are right. Which one you report depends on which calorie\
    \ you say you used, and the\nAct's two digits cannot tell the two apart.\n"
  refs:
  - nfsa_2013
- level: 5
  prompt: 'A figure of 2,000 kilojoules is handed to you and the meeting wants it in kilocalories.
    Convert

    it, then say which of the two calorie definitions could have changed your answer at two digits.

    '
  answer: "Divide, because kilojoules are the smaller unit and the count must come down.\n\n```working\n\
    \    2,000 divided by 4.184 = 478.0\n```\n\nSo 478 kilocalories, or about 480 with the digits\
    \ the figure deserves.\n\nNow the same sum with the other calorie.\n\n```working\n    2,000 divided\
    \ by 4.1868 = 477.7\n```\n\n478.0 one way and 477.7 the other. At two digits both are 480 kilocalories,\
    \ so the choice of\ncalorie could not have changed the answer you say out loud. Note which one\
    \ you used anyway, so\nsomebody checking you to four digits knows.\n"
- level: 6
  prompt: 'A note gives a day''s energy figure as 8,400 kilojoules. Turn it into kilocalories, then
    turn

    your answer back into kilojoules and say whether you get the number you started with.

    '
  answer: "Into kilocalories first.\n\n```working\n    8,400 divided by 4.184 = 2,007.6\n```\n\nRound\
    \ it the way a four-digit figure allows, and you would report about 2,000 kilocalories.\n\nNow\
    \ back again, starting from the rounded figure.\n\n```working\n    2,000 times 4.184 = 8,368\n\
    ```\n\nEight thousand three hundred and sixty-eight against the 8,400 you began with. Not the\
    \ same\nnumber.\n\nThe conversion did not lose anything. The rounding did. Convert once, from\
    \ the figure you were\ngiven, and never chain a conversion onto a rounded answer.\n"
- level: 6
  prompt: 'A food packet gives, for every 100 g, 60 g of carbohydrate, 8 g of protein and 22 g of
    fat.


    Regulation 5(3)(e)(i) of the labelling regulations of 2020 fixes the factors. Carbohydrate

    is 4 kcal/g. Protein is 4 kcal/g. Fat is 9 kcal/g.


    Work out the energy the label should declare for every 100 g. Then give the same figure in

    kilojoules, using the thermochemical calorie.

    '
  answer: "Take each part of the food in turn, grams times its factor.\n\n```working\n    60 times\
    \ 4 = 240\n    8 times 4 = 32\n    22 times 9 = 198\n```\n\nNow add the three together.\n\n```working\n\
    \    240 plus 32 plus 198 = 470\n```\n\nSo 470 kcal for every 100 g. That is the figure the label\
    \ should carry, because the\nregulation says the declared energy is worked out this way rather\
    \ than measured.\n\nNow into kilojoules, with the same 4.184 that turns kilocalories into kilojoules.\n\
    \n```working\n    470 times 4.184 = 1,966.48\n```\n\nRound it before you write it. The grams on\
    \ the label carry two digits each, so the last\ndigits of 1,966.48 are not yours to keep. Report\
    \ about 2,000 kilojoules for every 100 g.\n\nTwo things follow from this problem. Where a label\
    \ declares only carbohydrate, protein and\nfat, you can reproduce its energy figure from the grams\
    \ beside it, with no equipment. Where\nthe food carries dietary fibre, polyols or organic acid,\
    \ the panel need not print those\ngrams. Your total then falls short of the declared figure, and\
    \ nothing is wrong. And the\nregulation asks for no kilojoule figure, so the number you have just\
    \ produced is one the\nlabel will never show you.\n"
  refs:
  - fssai_labelling_2020
- level: 7
  prompt: "Here is a worked answer. Find the step that broke.\n\n```working\n    a meal is set at\
    \ 450 kilocalories\n    one calorie is 4.184 joules\n    450 divided by 4.184 = 107.6\n    so\
    \ the meal is 107.6 kilojoules\n```\n"
  answer: "The third line divides where it should multiply.\n\nA kilojoule is smaller than a kilocalorie,\
    \ so the same energy needs more of them. The number has\nto go up, and this one went down.\n\n\
    ```working\n    450 times 4.184 = 1,882.8\n```\n\nOne thousand eight hundred and eighty-three\
    \ kilojoules, not a hundred and eight.\n\nWhy it looks reasonable: the working names the right\
    \ factor and uses it once, so it has the\nshape of a finished conversion. Nothing in the digits\
    \ shouts. Only the direction is wrong, and\ndirection is the one thing the number cannot tell\
    \ you.\n\nThe habit that prevents it: before you touch the calculator, say which unit is the smaller\
    \ one\nand whether your answer should grow or shrink.\n"
- level: 8
  prompt: "Here is a worked answer. Find the step that broke.\n\n```working\n    a portion is 250\
    \ kilocalories\n    one calorie is 4.184 joules\n    250 times 4.184 = 1,046\n    so the portion\
    \ is 1,046 joules\n```\n"
  answer: "The arithmetic on line three is right and the unit on line four is wrong. The 250 was in\n\
    kilocalories and the factor was applied as though it were in calories.\n\nTake it in two steps.\n\
    \n```working\n    250 times 1,000 = 2,50,000\n    2,50,000 times 4.184 = 10,46,000\n```\n\nTen\
    \ lakh forty-six thousand joules, which is 1,046 kilojoules. The digits 1,046 were right all\n\
    along. The prefix was dropped.\n\nWhy it looks reasonable: the answer carries a plausible number\
    \ and a real unit, and the\nmultiplication checks out if you redo it. A prefix error never shows\
    \ up in the digits. It shows\nup only as a factor of a thousand, and you have to be looking for\
    \ it.\n\nThe habit that prevents it: write the prefix into every line of the working, not just\
    \ the first.\n"
- level: 9
  prompt: 'A colleague sends you this line.


    > The two papers disagree. One gives the energy content of the food as 2,510 kilojoules. The

    > other gives 600 kilocalories. So at least one of them is wrong.


    Decide what to compute, compute it, and say what your answer does not establish.

    '
  answer: "What to compute: put the two figures in the same unit before deciding anything.\n\n```working\n\
    \    600 times 4.184 = 2,510.4\n```\n\nTwo thousand five hundred and ten kilojoules, against the\
    \ 2,510 in the other paper. The two\npapers agree exactly at the digits they printed. Nobody is\
    \ wrong.\n\nWhat this does not establish. The agreement is arithmetic, not evidence. Both papers\
    \ may be\nquoting one original measurement, and a conversion between two units cannot tell you\
    \ whether\nthat measurement was any good. It does not tell you the two papers measured the same\
    \ food, or\nprepared it the same way, or counted the same parts of it.\n\nTwo numbers agreeing\
    \ after a conversion tells you the arithmetic is consistent. It says nothing\nabout either number\
    \ being true.\n"
- level: 10
  prompt: 'In a planning meeting somebody says this.


    > Their dataset is in kilojoules and ours is in kilocalories, so the two cannot be compared.

    > We would have to collect ours again.


    Decide what to compute, compute it, and say what your answer does not establish.

    '
  answer: "What to compute: whether the unit is the obstacle. Take a figure in one form and put it\
    \ in the\nother, then reverse it.\n\n```working\n    500 times 4.184 = 2,092\n    2,092 divided\
    \ by 4.184 = 500\n```\n\nThe number came back unchanged. The conversion factor is exact, so moving\
    \ between kilocalories\nand kilojoules loses nothing at all. No data need collecting again for\
    \ this reason, and the\nproposal in the room would spend money on a rename.\n\nWhat this does\
    \ not establish. It does not show that the two datasets can be compared. Two sets\nof energy figures\
    \ can differ because different foods were sampled. They can differ because the\nenergy was worked\
    \ out by different methods. No conversion touches either of those.\n\nSay both halves out loud\
    \ in the meeting. The unit is not the problem. Whether the two sets\nmeasured the same thing still\
    \ is, and that is the question worth the money.\n"
retrieval_items:
- q: How many joules is a thermochemical calorie, and was that figure measured or decided?
  a: 4.184 joules, exactly, and it was decided. It is a definition fixed by a standards body, not
    a laboratory result that could be sharpened.
- q: What are the two calories in use, and how far apart are they?
  a: The thermochemical calorie at 4.184 joules and the International Table calorie at 4.1868 joules.
    They differ by about seven parts in ten thousand, so the choice shows from the fourth digit onwards.
- q: A food document says calories. What unit is that likely to be, and how do you check?
  a: Kilocalories, because the prefix kilo is usually left off in food writing. Check by size, and
    by reading the head of the column rather than the number under it.
