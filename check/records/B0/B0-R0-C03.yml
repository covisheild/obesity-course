simplified_explanation: |
  A decimal is the same place-value rule, carried on past the point. To the right, each step is
  ten times smaller: tenths, then hundredths, then thousandths.

  Rounding is deciding where to stop. Pick the place you want to stop at and look at the very next
  digit. If it is four or less, leave your last digit alone. If it is five or more, push it up by
  one.

  Significant figures are the digits that carry the information. Start counting at the first digit
  that is not a zero. Stop at the last digit written down. Everything in between counts, zeros
  included.

  So 0.00420 has three of them: the four, the two and the final zero. The zeros in front are only
  holding the place. The zero at the end is holding nothing, so somebody put it there on purpose,
  and it says the measurement reached that far.

  Whole numbers ending in zeros are the awkward case. Write 4,200 and nobody can tell whether you
  counted to the nearest hundred or to the nearest one. The digits cannot tell you. The person, the
  table heading or the document has to. If none of them does, you do not know how precise the
  number is. Do not treat it as exact until somebody tells you it is.

  Your answer cannot be more exact than the numbers you put in. Divide something you know to two
  digits by something you know to two digits, and you know the answer to about two digits.
illustration:
  body: |
    Open the National Food Security Act, 2013 again and search inside it for "five kilograms". The first is section
    3(1), which gives a person in a priority household five kilograms of foodgrains per person per
    month.

    How much is that a day?

    Type five, divide by thirty, and read what the calculator says.

    ```working
        5 divided by 30 = 0.1666666667
    ```

    Here is the mistake, and it goes into real documents. The figure is copied straight across, and
    a report goes out saying each person receives 0.1666666667 kilograms of grain a day.

    Count the digits after the point. Ten of them. Nothing you did could possibly support that.

    The five is exact: it is not a measurement, it is a figure written into an Act, and it is five
    and nothing else. The thirty is not exact at all. You chose it. A month is twenty-eight days, or
    thirty, or thirty-one.

    So work the two ends instead of one middle.

    ```working
        5 divided by 31 = 0.16129...
        5 divided by 28 = 0.17857...
    ```

    The honest answer sits somewhere between 0.16 and 0.18 kilograms a day. Two digits, not ten.

    Now round the middle case properly, so you can see the rule work. You have 0.1666666667 and you
    want two places after the point. The next digit along is a 6, which is five or more, so the 6
    you are keeping goes up to 7.

    ```working
        0.1666666667 rounds to 0.17
    ```

    Round to 0.17, then multiply by 30 to get back to a month.

    ```working
        0.17 times 30 = 5.1
    ```

    You started with exactly 5 and came back with 5.1. The rounding leaked.

    If somebody needs a daily figure, give them 0.16 to 0.18 kilograms and say where the spread came
    from.
  analogy_breaks_when: |
    Significant figures are a rough guide to precision, not a measure of it. They do not tell you
    how wrong the number might be.

    The rounding rule itself has an edge. When the digit you are dropping is exactly five and
    nothing follows it, the rule above always pushes up. That nudges a long column of numbers
    slightly high. It rarely matters. It matters when you are rounding thousands of values and then
    adding them.
  numbers:
  - value: '5'
    unit: kilograms of foodgrains per person per month, priority households, s.3(1)
    citekey: nfsa_2013
must_know:
- point: |
    The digits on a calculator display are not precision. They are what the division produced.
  kind: misconception
  bearing: methodological
- point: |
    Keep full precision while you work and round once, at the end, to what your weakest input
    earned.
  kind: move
  bearing: methodological
- point: |
    Five kilograms in an Act is exactly five. Five kilograms on a scale is not. Ask which kind you
    are holding before you decide how to round it.
  kind: boundary
  bearing: methodological
- point: |
    Indian entitlements are commonly written per month while reporting wants a daily figure. That
    one division is where false precision enters.
  kind: india_deviation
  bearing: policy
- point: |
    When a number you are given carries more digits than its source could support, say so at the
    time.
  kind: consequence
  bearing: policy
- point: |
    Do not quote a spuriously precise figure in public even when it is the one you were handed.
  kind: trap
  bearing: public
exercises:
- type: calculation
  prompt: |
    A household of six people is in a priority household under section 3(1) of the National Food
    Security Act, 2013. Work out the household's monthly entitlement, then its daily entitlement.
    Give the daily figure to a precision you can defend, and say in one line why you stopped there.
  answer: |
    Monthly first.

    ```working
        5 kilograms per person per month, times 6 people
        = 30 kilograms per household per month
    ```

    That figure is exact. Both numbers that went into it are counts, not measurements.

    Now daily. A month is not a fixed number of days, so work both ends.

    ```working
        30 divided by 31 = 0.9677...
        30 divided by 28 = 1.0714...
    ```

    So the household gets roughly one kilogram a day, somewhere between 0.97 and 1.07.

    Where to stop: one figure. Round it to 1 kilogram a day. The spread across the ends is more than
    a tenth of a kilogram. A second decimal place would claim to know something the month length has
    already taken away from you.
  confidence_first: true
- type: critique
  prompt: |
    A district report reads: "Average grain lifted per beneficiary was 4.8732 kg per month against
    an entitlement of 5 kg." Nothing here is arithmetically wrong. Name what you would ask about the
    figure 4.8732, and say what you expect the answer to be.
  answer: |
    Ask two things, in this order.

    First: what two numbers were divided to make it? An average per person is a total divided by a
    count of people. Say the total was in tonnes, rounded to the nearest tonne, and the count was a
    registered beneficiary count. Then the fourth decimal place is carrying a precision that neither
    input had.

    Second: how exact is the count on the bottom? A beneficiary list is almost never exact to the
    last person, and the divisor moving by a few hundred would change the third decimal place.

    What you expect: that 4.8732 is what the spreadsheet printed and nobody chose it. The defensible
    version is 4.9 kilograms, and the interesting sentence is not the average at all. It is the gap
    from 5, and whether that gap is real.
quantitative: true
practice:
- level: 1
  prompt: |
    Round each of these to two places after the point.

    ```working
        0.3849      12.0761      0.0955      7.2950
    ```
  answer: |
    Look at the third digit after the point each time. Four or less, the second digit stands. Five
    or more, it goes up by one.

    ```working
        0.3849   third digit 4   ->  0.38
        12.0761  third digit 6   ->  12.08
        0.0955   third digit 5   ->  0.10
        7.2950   third digit 5   ->  7.30
    ```

    The third one is worth a second look. Rounding 0.09 up carries into the next place and gives
    0.10, not 0.1. Both are the same number, and 0.10 is the one that shows you stopped at two
    places on purpose.
- level: 2
  prompt: |
    How many significant figures does each of these carry?

    ```working
        450      0.0072      6.030      1,200
    ```
  answer: |
    Count from the first digit that is not zero.

    ```working
        450      2 or 3   the trailing zero is ambiguous
        0.0072   2        leading zeros only hold the place
        6.030    4        the trailing zero after a point is real
        1,200    2, 3 or 4   ambiguous the same way as 450
    ```

    Two of the four cannot be answered from the number alone, and that is the useful part of this
    problem. A trailing zero with no point after it may be a measured digit or a placeholder. Only
    whoever wrote it down knows, and if they are not available, say so rather than guess.
- level: 3
  prompt: |
    Work out 17 divided by 7. Write the calculator's full display, then give the answer to three
    significant figures.
  answer: |
    ```working
        17 divided by 7 = 2.428571429
    ```

    To three significant figures, count from the 2.

    ```working
        2.42|8571429
        the next digit is 8, which is five or more
        so the 2 goes up to 3
        = 2.43
    ```

    Two point four three. The other seven digits the calculator offered were never yours to give
    away.
- level: 4
  prompt: |
    Section 3(1) of the National Food Security Act, 2013 gives five kilograms of foodgrains per
    person per month. Work out the figure per week, using 4 weeks in a month, and give it to a
    precision you can defend.
  answer: |
    ```working
        5 divided by 4 = 1.25 kilograms a week
    ```

    That division is exact: it stops after two places on its own, with nothing rounded away.

    But the 4 is not exact. A month is not four weeks — it is closer to 4.3 — so work the honest
    end too.

    ```working
        5 divided by 4.3 = 1.16... kilograms a week
    ```

    So the answer sits between about 1.16 and 1.25. Report it as roughly 1.2 kilograms a week, two
    significant figures, and say you assumed a month of about four and a third weeks.
  refs: [nfsa_2013]
- level: 5
  prompt: |
    A hot cooked meal is set at 450 calories by the second schedule of the National Food Security
    Act, 2013. A child attends on 196 of the year's school days. Work out the year's calories from
    the meal, and say how many significant figures the answer deserves.
  answer: |
    ```working
        450 times 196 = 88,200 calories
    ```

    Now the precision. Both inputs are exact counts: 450 is fixed by the schedule and 196 is a
    count of days, not a measurement. Nothing was rounded on the way in.

    So 88,200 is exact, and all of it is significant. Write it as 88,200 calories.

    This is the case worth noticing. The rule that an answer cannot beat its weakest input is about
    measurements. Where both inputs are exact, the answer is exact too, and rounding it away would
    throw something real overboard.
  refs: [nfsa_2013]
- level: 6
  prompt: |
    A store issues 1,850 kilograms of grain to 387 households in a month. Work out the average per
    household and report it to a precision you can defend. Say in one line what fixed the
    precision.
  answer: |
    ```working
        1,850 divided by 387 = 4.780361757...
    ```

    Now ask what each input was worth. The 1,850 is a weight, and a weight recorded to the nearest
    ten kilograms is good to three significant figures at best. The 387 is a count, and counts are
    exact if the register is right.

    So the weakest input carries three significant figures, and the answer carries three.

    ```working
        4.78 kilograms per household
    ```

    What fixed the precision: the weight, not the division and not the household count.
- level: 7
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
        2.4 times 3.6 = 8.64
        8.64 rounded to 2 significant figures = 8.6
        8.6 divided by 4 = 2.15
        final answer, to 2 significant figures = 2.2
    ```
  answer: |
    The arithmetic in every line is right. The step that broke is the second one: the rounding
    happened in the middle.

    Carry the full figure through instead and compare.

    ```working
        2.4 times 3.6 = 8.64
        8.64 divided by 4 = 2.16
        to 2 significant figures = 2.2
    ```

    Here the two routes agree, at 2.2. That is the trap. Rounding in the middle does not always
    change the answer, so it survives every time it happens to be harmless and then bites once.

    Why it looks reasonable: the worked answer rounds to the stated precision at every stage, which
    looks like care. It is the opposite. Round once, at the end.
- level: 8
  prompt: |
    A district report reads: "Coverage stands at 64.8135 per cent."

    It was computed from a count of covered households and a count of total households, both taken
    from a register. Find what is wrong with the figure as reported.
  answer: |
    Nothing is wrong with the arithmetic. Both inputs are counts, so the division is exact and the
    digits are all really there.

    What is wrong is what those digits claim. Four places after the point in a percentage means the
    figure is being pinned to one part in a million.

    ```working
        64.8135 per cent of 10,000 households = 6,481.35 households
    ```

    You cannot have 0.35 of a household. The fourth decimal place is describing a fraction of a
    household that does not exist, so it carries no information about the world.

    And the register itself is not exact in practice, whatever the arithmetic says. Report 64.8 per
    cent, or 65 per cent, and give the two counts underneath.
- level: 9
  prompt: |
    Here is a line from a note.

    > Average household grain offtake was 4.8732 kg against an entitlement of 5 kg, a shortfall of
    > 2.536 per cent.

    Decide what to compute, compute it, and say what your answer does not establish.
  answer: |
    First check the shortfall, because a stated figure is worth testing before it is argued about.

    ```working
        5 minus 4.8732 = 0.1268
        0.1268 divided by 5 = 0.02536
        times 100 = 2.536 per cent
    ```

    The arithmetic holds. Now the precision. The 4.8732 came from a total divided by a count of
    households, and neither of those is known to five figures. So the shortfall is about 2.5 per
    cent, and the last two digits are decoration.

    What this does not establish. It says nothing about how many households the shortfall is spread
    across. A 2.5 per cent average gap could be every household lifting slightly less, or a small
    number lifting nothing at all. Those need different responses, and the average cannot tell them
    apart.
- level: 10
  prompt: |
    Somebody sends you a one-line finding and asks whether to publish it.

    > Mean intake fell from 2,014.6 to 1,987.3 calories a day, a fall of 1.36 per cent.

    Decide what to compute, compute it, and say what your answer does not establish.
  answer: |
    Check the stated figure first.

    ```working
        2,014.6 minus 1,987.3 = 27.3
        27.3 divided by 2,014.6 = 0.013550...
        times 100 = 1.36 per cent
    ```

    The arithmetic holds. Now ask where five significant figures in a mean intake could have come
    from. Dietary intake is estimated, not weighed, and the estimate for one person is uncertain by
    a long way more than 27 calories.

    So the decimal place on each mean is claiming a precision the method cannot deliver. The
    difference between the two means is smaller than the uncertainty in either.

    What this does not establish. It does not establish that intake fell at all. The two figures
    could be two draws from the same underlying quantity. Before publishing, ask how intake was
    measured and how precise a single mean is. Those are later sections of this book. This section
    is enough to know the question has to be asked.
retrieval_items:
- q: What does each place to the right of the decimal point represent?
  a: One tenth of the place on its left — tenths, hundredths, thousandths — so a decimal is a fraction with a denominator of ten, a hundred, a thousand.
- q: How many significant figures may a calculated quantity carry?
  a: No more than the least precise quantity that went into it.
- q: Why round once at the end rather than as you go?
  a: Because rounding in the middle of a chain leaks into everything after it, and the error grows with each further step.
