  - fao_food_energy_2003
- level: 9
  prompt: |
    A packet in a shop carries this line. The packet and the figure are made up for this problem.

    > Contains 250 kilocalories.

    A colleague reads it and says that eating the packet adds 250 kilocalories to the person who
    eats it.

    Decide what to compute, compute it, and say what your answer does not establish.
  answer: |
    What to compute. Two things. First, the same figure in the other unit, so you can see what size of quantity is
    being talked about. Second, where the 250 came from.

    The conversion, using 4.184 kilojoules to the kilocalorie.

    ```working
        250 times 4.184 = 1,046
    ```

    About a thousand kilojoules.

    Where it came from. If the packet is sold in India, the figure was calculated rather than
    measured. Regulation 5(3)(e)(i) of the labelling regulations of 2020 says the energy to be listed is
    calculated using conversion factors. So somebody took the grams of carbohydrate, protein and
    fat, and multiplied each by its factor. Nothing was burned.

    Now what the 250 does not establish, which is the part your colleague needs.

    It does not establish what the person absorbs. The Atwater factors that produced it carry an
    average correction for losses in digestion, in absorption and in the urine. An average correction is not this person's losses on this food. The factors use one value for each
    of protein, fat and carbohydrate, whatever the food.

    It does not establish that the packet holds exactly that. It is arithmetic on declared
    weights, and the weights are themselves rounded.

    It does not establish anything about what the person spends. That is a different quantity
    entirely and nothing on a packet measures it.

    And it does not establish anything about what would change in their body. Going from an intake figure to a change in a body needs one more number. You would need to know
    what a kilogram of that change is made of. This book does not give you that number, because it
    depends on what the change is made of. Do not supply it from memory.

    The line to say out loud: 250 kilocalories is a property of the packet. It is not an event in
    a person.
  refs:
  - nist_sp811
  - fssai_labelling_2020
- level: 10
  prompt: |
    In a district meeting, somebody says this.

    > Schedule II of the National Food Security Act, 2013 sets the upper primary hot cooked meal
    > at 700 calories. It also sets 20 grams of protein. So every upper primary child gets 700
    > kilocalories a day from school. We can take that straight off what they need from home.

    Decide what to compute, compute it, and say what your answer does not establish.
  answer: |
    What to compute. First, read the unit off the Schedule rather than off the sentence. The
    energy column of Schedule II is headed Calories with Kcal in brackets, so the figure is 700
    kilocalories. The speaker said calories and meant kilocalories, and this time they happen to
    be right.

    Second, work out the one thing the two figures in the Schedule can tell you together. That is how
    much of the energy standard the protein standard accounts for.

    ```working
        20 times 4.0 = 80
    ```

    ```working
        80 divided by 700 = 0.1142857143
    ```

    Round that to three figures, 0.114, and turn it into a percentage.

    ```working
        0.114 times 100 = 11.4
    ```

    About eleven per cent of the energy standard is accounted for by the protein standard. The
    other eighty-nine per cent has to come from fat and carbohydrate, and Schedule II sets no
    figure for either. That is worth saying in the meeting, because it is a real gap in what the
    Schedule fixes.

    Now what none of this establishes.

    It does not establish that any child received 700 kilocalories. Schedule II is a standard a
    meal must meet. A standard is a requirement, not a measurement, and the sentence has read one
    as the other.

    It does not establish that a meal that met the standard was eaten, or eaten whole. Nothing in
    an Act measures a plate.

    It does not establish that 700 kilocalories reached a child even if a meal met the standard
    exactly and was finished. Seven hundred is a food-energy figure. Between the energy in a food and the energy available to
    the body sit the faecal, gaseous and urinary losses. The
    figure that reaches the body is always the smaller one.

    And the last clause is the one to stop. Taking it straight off what a child needs from home assumes the two flows are independent. It
    assumes that adding to one leaves the other where it was.
    The section on stocks and flows says why you cannot assume that. The balance line holds whatever
    the flows do. It never tells you what happens to one flow when another changes.
    Whether a school meal displaces food at home is a question about behaviour, and it has to be
    measured, not assumed.

    What to ask for. Weighed portions and plate waste on a sample of days, which turns the
    Schedule's requirement into a measurement of what children actually received.
  refs:
  - nfsa_2013
  - fao_food_energy_2003
retrieval_items:
- q: How does a bomb calorimeter turn a temperature rise into an energy?
  a: By a constant found beforehand. Something of known energy is burned in that machine and the
    rise it causes is measured; the known energy divided by that rise is the calorimeter's energy
    equivalent, in joules for each degree. Any later rise, multiplied by that constant, gives the
    energy released.
- q: What does a bomb calorimeter figure for a food measure, and what does it not?
  a: It measures the total combustible energy of the food, called the gross or ingested energy,
    which is the most the food could ever supply. It does not measure what reaches a person, because
    energy is lost in the faeces, as gas, and in the urine.
- q: What is the cascade the Food and Agriculture Organization's 2003 report gives for food energy?
  a: Gross or ingested energy, then metabolizable energy, with faecal, gaseous, urinary and surface
    losses named in between. Below metabolizable energy the report carries a third step, net
    metabolizable energy, which takes off what the body spends on digesting and handling the food.
    There is no digestible-energy step anywhere; the phrase does not occur in the report.
- q: What are the Atwater general factors, and what are they used for?
  a: One energy value for each of protein, fat and carbohydrate, used regardless of the food it is
    found in. They are 17 kilojoules or 4.0 kilocalories a gram for protein, 37 or 9.0 for fat, and
    17 or 4.0 for carbohydrate. The energy figure on a food label is calculated by multiplying the
    grams of each by its factor and adding the products.
- q: Somebody hands you a food-energy figure. What three questions do you ask?
  a: Was it burnt or was it calculated. Is it the gross figure or the metabolizable one. And is it
    a standard somebody set, or a measurement somebody took.
