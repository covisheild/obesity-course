  analogy_breaks_when: |
    Every figure in the calorimeter example is made up. The 26,400 joules, the 2.2 degrees, the
    1.50 gram pellet and the 1.85 degree rise describe no real machine and no real food. Only the
    4.184, the Atwater factors and the two Schedule II figures come from a source.

    The energy equivalent belongs to one calorimeter on one day. Carry it to another machine and
    every answer it gives is wrong, and wrong silently, because the arithmetic still works. That
    is what the report's "each time" is guarding against.

    The method needs the sample to burn completely. A pellet that does not burn through gives a small rise, and so a small answer. Nothing in the
    arithmetic will tell you it happened. That is why the fuse wire is weighed before and after.

    The Atwater factors are averages over foods. One factor covers every protein, in every food,
    prepared any way. So the method cannot tell apart two foods with the same grams of protein, fat and carbohydrate. It
    was never built to, whatever the body does with them.

    The two printed columns pair up for protein and for carbohydrate. They do not pair up for
    fat. Fat's precise value is 37.4 kilojoules a gram, and the report prints 9.0 kilocalories
    beside it. Try the conversion both ways round.

    ```working
        37.4 divided by 4.184 = 8.9388
        9.0 times 4.184 = 37.656
    ```

    Neither line lands on a figure the report prints. So fat's two numbers are not conversions of
    one another in either direction. Read each column as its own set of numbers and do not work
    one out from the other.

    The eleven per cent figure is a share of two numbers the Act sets, not a share of anything a
    child ate. It holds for a meal that exactly met both standards and for nothing else.

    None of the arithmetic here says anything about a person. It gives you what is in a food and
    what an average person would get out of it. What one person absorbs, what they spend, and what any change in their body would be made of are
    three separate questions. This book answers none of them.
must_know:
- point: |
    A bomb calorimeter figure is the food's total combustible energy. It is not the energy a
    person gets. Between the two sit losses in the faeces, in gas from the large intestine, and in
    the urine. The 2003 report from the Food and Agriculture Organization names those three. It
    names a small surface loss too. So never quote a burning figure as what somebody received.
  kind: misconception
  bearing: methodological
  refs:
  - fao_food_energy_2003
- point: |
    That report has no digestible-energy step anywhere. Its cascade runs from gross or ingested
    energy to metabolizable energy. The losses named are faecal, gaseous, urinary and surface. A
    third step sits below, net metabolizable energy. So do not object to a three-step reading of
    this report. Object to the word digestible, which is not in it anywhere. Name the step that
    was made up.
  kind: trap
  bearing: methodological
  refs:
  - fao_food_energy_2003
- point: |
    A temperature rise is not an energy until the machine that produced it has been calibrated. The
    calibration is repeated before each set of runs, not done once. So ask when a calorimeter was
    last calibrated before you accept a figure from it. A stale constant gives wrong answers that
    look entirely reasonable.
  kind: move
  bearing: methodological
- point: |
    The Atwater general factors are the numbers behind nearly every food-energy figure you will ever
    be handed. They are 17 kilojoules, or 4.0 kilocalories, for each gram of protein. For fat they
    are 37 or 9.0, and for carbohydrate 17 or 4.0. Knowing them means you can recompute any label yourself
    instead of trusting it.
  bearing: clinical
  refs:
  - fao_food_energy_2003
- point: |
    Those factors use one value for each of protein, fat and carbohydrate, whatever the food. So a
    figure worked out from them can tell two foods apart only by their grams. It cannot show that
    one food is taken up better than another. It is the wrong tool for that question, and no
    amount of precision fixes it.
  kind: boundary
  bearing: methodological
  refs:
  - fao_food_energy_2003
- point: |
    The energy declared on an Indian packet is worked out from the grams, not measured by burning
    anything. The rule is regulation 5(3)(e)(i) of the labelling regulations of 2020. So two
    packets showing the same figure have been through the same arithmetic, not the same
    measurement. A real difference between them would not show up on either label.
  kind: india_deviation
  bearing: policy
  refs:
  - fssai_labelling_2020
- point: |
    When a journalist gives you a food-energy figure, the useful sentence is about what it
    describes. It is a property of the food, measured or calculated, and it says nothing whatever
    about what happens in any person who eats it. Give them that line before you argue about the
    number itself.
  kind: move
  bearing: public
- point: |
    Teach the calibration before the formula. A trainee who has seen a known burn turned into a constant will never again treat a thermometer
    reading as an energy. They will also carry the question to every instrument they meet
    afterwards: what was this measured against.
  kind: move
  bearing: teaching
exercises:
- type: retrieval
  prompt: |
    Without looking back, write down the two steps that turn a bomb calorimeter reading into an
    energy, in order, and say what each step needs.

    Then write down the cascade the Food and Agriculture Organization's report gives for what
    happens to a food's energy in a person, naming the losses.
  answer: |
    The two steps of the instrument.

    First, calibrate. Burn something whose energy is already known and measure the rise it
    produces. Divide the known energy by that rise. What you get is the calorimeter's energy
    equivalent, in joules for each degree, and it belongs to that one machine.

    Second, measure. Burn the unknown sample, measure its rise, and multiply the rise by that same
    energy equivalent. That is the energy released.

    What each step needs: the first needs a substance of known energy, the second needs nothing
    except the constant from the first.

    The cascade. The food that is eaten holds its gross energy, also called ingested energy, which
    is what a bomb calorimeter measures. Then come the losses.

    Energy is lost in the faeces, from food that is not digested and absorbed. Energy is lost as
    gas, from unabsorbed carbohydrate fermented in the colon. Energy is lost in the urine, mostly
    as nitrogenous waste from protein that was not fully broken down. A small amount is lost from
    the body surface. What remains is metabolizable energy.

    Below that the report carries one more step, net metabolizable energy. It takes off the energy
    the body itself spends on digesting the food and handling it.

    One thing to check in your own answer. Did you write a digestible-energy step in the middle?
    It is not in the report, and the habit of putting it there is exactly what this section is
    for.
  confidence_first: true
- type: critique
  prompt: |
    A supplement company's sheet says this. The company and the sheet are made up for this
    exercise. Read it twice before you answer.

    > Independent laboratory testing by bomb calorimetry confirms that each serving delivers 480
    > kilocalories of energy to the body. The measurement was made by burning, so it is more
    > accurate than the numbers worked out on paper for ordinary packets.

    Say what is wrong. Then say what you would ask for.
  answer: |
    There are three claims here and they fail in three different ways.

    The first is the phrase delivers to the body. A bomb calorimeter burns the sample to nothing
    in pure oxygen. What it measures is the gross energy, which is the most the food could ever
    supply. It cannot measure what reaches a person, because the faecal, gaseous and urinary
    losses happen in a person and not in a steel pot.

    The second is the comparison with a label figure. A calculated label figure uses the Atwater
    factors, and those factors already have average losses taken out of them. So the calculated
    figure is an estimate of metabolizable energy and the burning figure is gross energy. They are
    numbers about different things. The burning figure will be the larger of the two, and being
    larger is not being more accurate.

    The third is the word confirms, doing work that one measurement cannot do. A single run in one
    calorimeter rests entirely on that machine's calibration constant on that day.

    What to ask for. The calibration record for the machine, with the date and the substance of
    known energy that was burnt. The number of runs and the spread across them. Whether the fuse
    wire was weighed before and after, which is how anyone knows the sample burnt completely. And
    the composition of the serving in grams, so you can do the Atwater sum yourself and see how
    far the two figures sit apart.

    And say the main point in one line, because it is the one that gets waved through. Burning a
    food tells you what is in the food. It does not tell you what the food gives to a person, and
    no amount of care with the instrument will make it do so.
- type: teaching
  prompt: |
    A health secretary has one page. They have been handed a proposal about a school meal scheme. It argues the scheme is meeting its
    target, because the menu adds up to the energy figure in the standard.

    Write what you would put on the page. Answer first, no methods section.
  answer: |
    Answer first, one page, no methods.

    The proposal has shown that the menu is designed to meet the standard. It has not shown that
    the scheme is meeting it. Those are two different claims and only the first has evidence
    behind it.

    Three gaps, in the order they matter.

    The first is between the menu and the plate. A menu is an intention. What a child receives
    depends on what was cooked, how much of it was served, and whether it was eaten. None of that
    is in an arithmetic total.

    The second is between the plate and the child. The figure in the standard is a food-energy
    figure. Some of the energy in any food is lost in the faeces, some as gas, and some in the urine. So the
    energy available to a child is always less than the energy in the food. The
    proposal's total is the upper figure.

    The third is between the child's intake and any outcome anyone cares about. What a child
    spends is not in this arithmetic at all, and nothing in a menu total establishes a result.

    What would close the gaps, in order of cost. Weighed portions on a sample of days at a sample
    of schools, which turns the menu into a measurement. Plate waste on the same days, which turns
    what was served into what was eaten. Both are ordinary field measurements and neither needs a
    laboratory.

    What not to spend money on: burning food samples in a calorimeter. It would answer, very precisely, the question the proposal has already answered. It would say
    nothing about the two that are open.

    One line for the meeting. The menu arithmetic is right. It is arithmetic about a plan, and the
    question in front of you is about a plate.
quantitative: true
practice:
- level: 1
  prompt: |
    One kilocalorie is 4.184 kilojoules.

    Turn 2,092 kilojoules into kilocalories.
  answer: |
    Kilojoules to kilocalories means dividing, because a kilocalorie is the bigger unit and there
    will be fewer of them.

    ```working
        2,092 divided by 4.184 = 500
    ```

    Five hundred kilocalories.

    Check the direction before you move on. The answer came out smaller than the number you started with, and that is right. One kilocalorie
    is worth more than four kilojoules. So any amount of energy is a smaller number when it is
    counted in kilocalories.
  refs:
  - nist_sp811
- level: 2
  prompt: |
    A calorimeter's energy equivalent is 9,500 joules for each degree.

    In one run the thermometer rises by 3.4 degrees. Work out the energy released, first in joules
    and then in kilojoules. The figures in this problem are made up.
  answer: |
    The energy equivalent is a number of joules for each degree, so multiply it by the number of
    degrees.

    ```working
        9,500 times 3.4 = 32,300
    ```

    Thirty-two thousand three hundred joules.

    A kilojoule is a thousand joules, so divide.

    ```working
        32,300 divided by 1,000 = 32.3
    ```

    Thirty-two point three kilojoules.
- level: 2
  prompt: |
    A sample whose energy is known to be 44,000 joules is burned in a calorimeter. The thermometer
    rises by 4.00 degrees.

    Work out how many joules one degree is worth in that calorimeter. The figures in this problem
    are made up.
  answer: |
    This is the calibration, and it runs the other way from the last problem. There you had the
    constant and wanted the energy. Here you have the energy and want the constant.

    Divide the known energy by the rise it produced.

    ```working
        44,000 divided by 4.00 = 11,000
    ```

    Eleven thousand joules for each degree.

    Check the unit, because it is what tells you the answer is the right kind of thing.

    ```working
        joules, divided by degrees
        = joules per degree
    ```

    That number now belongs to this calorimeter and to no other.
- level: 3
  prompt: |
    A sample holds 12 grams of protein, 8 grams of fat and 40 grams of carbohydrate.

    Using 4.0 for each gram of protein, 9.0 for each gram of fat and 4.0 for each gram of
    carbohydrate, work out the total.
  answer: |
    Take each of the three on its own, then add.

    ```working
        12 times 4.0 = 48
    ```

    ```working
        8 times 9.0 = 72
    ```

    ```working
        40 times 4.0 = 160
    ```

    Now add the three.

    ```working
        48 plus 72 plus 160 = 280
    ```

    Two hundred and eighty.

    Look at the three parts before you leave it. The fat is a fifth of the weight of the carbohydrate. It gives almost half as much energy. That is
    what a factor of nine does against a factor of four.
  refs:
  - fao_food_energy_2003
- level: 4
  prompt: |
    Food and Nutrition Paper 77 is a report on food energy. The Food and Agriculture Organization
    of the United Nations published it in 2003.

    It gives the Atwater general factor for protein twice over. Once as 17 kilojoules for each
    gram, and once as 4.0 kilocalories for each gram. A footnote on the same page gives the
    precise figure as 16.7 kilojoules a gram.

    Turn both of those kilojoule figures into kilocalories a gram. One kilocalorie is 4.184
    kilojoules. Then say which of the two the report's 4.0 was rounded from.
  answer: |
    Take the rounded figure first.

    ```working
        17 divided by 4.184 = 4.063
    ```

    Four point zero six kilocalories a gram.

    Now the precise figure from the footnote.

    ```working
        16.7 divided by 4.184 = 3.991
    ```

    Three point nine nine kilocalories a gram.

    Which one the 4.0 came from: the second. Three point nine nine rounds to four point zero. Four
    point zero six does not, at least not without throwing away a digit you were given.

    So the report's two columns are not exact conversions of one another. They were set down
    separately, and for protein the precise kilojoule figure does round to the printed kilocalorie
    one. Convert the rounded 17 instead and you land near the printed figure, not on it.

    What to do about it in practice. Use whichever unit the source you are quoting used, and
    convert only when you have to. Every conversion of a rounded figure moves the answer. A move of a few parts in a thousand is
    enough to make two people think one of them has slipped.
  refs:
  - fao_food_energy_2003
  - nist_sp811
- level: 4
  prompt: |
    A laboratory calibrates a bomb calorimeter by burning a sample whose energy is known to be
    52,500 joules. The thermometer rises by 3.50 degrees Celsius.

    It then burns a 2.00 gram dried pellet of a food, and the thermometer rises by 2.80 degrees
    Celsius.

    Work out the energy the food released, in kilojoules, and then the energy for each gram of
    food. Write the unit on every line. Every figure in this problem is made up; no real
    calorimeter and no real food is being described.
  answer: |
    Calibrate first. Known energy divided by the rise it caused.

    ```working
        52,500 divided by 3.50 = 15,000
    ```

    Fifteen thousand joules for each degree, for this calorimeter.

    Now the food. Rise times the energy equivalent.

    ```working
        15,000 times 2.80 = 42,000
    ```

    Forty-two thousand joules. Into kilojoules.

    ```working
        42,000 divided by 1,000 = 42
    ```

    Forty-two kilojoules from the whole pellet. The pellet weighed 2.00 grams, so divide.

    ```working
        42 divided by 2.00 = 21
    ```

    Twenty-one kilojoules in each gram of that food.

    Keep the label as well as the unit. This is twenty-one kilojoules of gross energy for each gram of the dried food. Dried is not the
    same as eaten, because the water was taken out. And gross energy is not the same as what a
    person would get from it.
- level: 5
  prompt: |
    Schedule II of the National Food Security Act, 2013 sets standards for a hot cooked meal. For
    lower primary classes it sets 450 in the energy column and 12 grams in the protein column. The
    energy column is headed Calories, with Kcal in brackets.

    The Atwater general factor for protein is 4.0 kilocalories for each gram. Work out how many of
    those 450 kilocalories the protein standard accounts for. Then work out what share of the meal
    that is, as a percentage.
  answer: |
    The protein first. Grams times the factor for protein.

    ```working
        12 times 4.0 = 48
    ```

    Forty-eight kilocalories from the protein standard.

    Now the share. Divide the part by the whole, which here is the energy standard for the same
    meal.

    ```working
        48 divided by 450 = 0.1066666667
    ```

    Round that to three figures and you have 0.107. Turn the proportion into a percentage by
    multiplying by a hundred.

    ```working
        0.107 times 100 = 10.7
    ```

    About ten point seven per cent.

    Read the unit on the 450 before you leave this. The column is headed Calories with Kcal in
    brackets, so the figure is kilocalories. Taken as plain calories it would be a meal of 450
    calories, which is under half a kilojoule, and no meal is that.

    And read what the answer is about. It is the share of the Act's energy standard that the Act's
    protein standard accounts for. It is not the protein share of any meal a child ate.
  refs:
  - nfsa_2013
  - fao_food_energy_2003
- level: 6
  prompt: |
    Two laboratories are given the same dried food and asked for its energy for each gram.

    The first burns it. Its calorimeter is worth 8,000 joules for each degree, and a 1.25 gram
    sample makes the thermometer rise by 2.50 degrees.

    The second does not burn anything. It measures the composition instead. In each gram it finds 0.10 grams of protein, 0.05 grams of
    fat and 0.70 grams of carbohydrate. The rest is water and minerals. It uses the Atwater general factors of 4.0, 9.0 and 4.0 kilocalories a gram.

    Work out both answers in kilocalories for each gram. Say which is larger, by how much, and why
    you would have expected that before doing the arithmetic. All the figures are made up for this
    problem.
  answer: |
    The first laboratory. Rise times the energy equivalent.

    ```working
        8,000 times 2.50 = 20,000
    ```

    ```working
        20,000 divided by 1,000 = 20
    ```

    Twenty kilojoules from a 1.25 gram sample.

    ```working
        20 divided by 1.25 = 16
    ```

    Sixteen kilojoules for each gram. Into kilocalories.

    ```working
        16 divided by 4.184 = 3.824
    ```

    Three point eight two kilocalories a gram.

    The second laboratory. Each component times its own factor, then add.

    ```working
        0.10 times 4.0 = 0.4
    ```

    ```working
        0.05 times 9.0 = 0.45
    ```

    ```working
        0.70 times 4.0 = 2.8
    ```

    ```working
        0.4 plus 0.45 plus 2.8 = 3.65
    ```

    Three point six five kilocalories a gram.

    The difference:

    ```working
        3.824 minus 3.65 = 0.174
    ```

    The burning answer is the larger, by about 0.17 kilocalories a gram.

    Why that was the expected direction. The calorimeter measures gross energy: everything the
    food gives up when it is burnt to nothing. The Atwater factors were built from burning
    measurements and then corrected for what is lost in digestion, in absorption and in the urine.
    So the factors are already a step down the cascade. A figure worked out from them should come out
    below a burning figure for the same food.

    What the size of the gap does not tell you. It is not a measurement of anybody's losses. The corrections inside the factors are averages, taken over foods and over people. So the 0.17 is
    the gap between one measurement and one average. It is not a finding about this food.
  refs:
  - fao_food_energy_2003
  - nist_sp811
- level: 7
  prompt: |
    Here is a worked answer. Find the step that broke. The figures in this problem are made up.

    ```working
        the calorimeter is worth 10,000 joules for each degree
        the thermometer read 21.4 degrees before the sample was lit
        the thermometer read 24.9 degrees after the sample had burned
        10,000 times 24.9 = 249,000
        so the sample released 249,000 joules, which is 249 kilojoules
    ```
  answer: |
    The step that broke is the fourth. The energy equivalent converts a rise, and 24.9 is not a
    rise. It is a reading.

    Get the rise first, by taking one reading from the other.

    ```working
        24.9 minus 21.4 = 3.5
    ```

    Three and a half degrees. Now use the constant on that.

    ```working
        10,000 times 3.5 = 35,000
    ```

    ```working
        35,000 divided by 1,000 = 35
    ```

    Thirty-five kilojoules, not 249.

    What went wrong underneath the arithmetic. A Celsius reading is counted from a zero that
    somebody chose, so the reading itself is not an amount of anything. Only the gap between two
    readings is. Start the same burn in the same machine from a colder room. You get the same rise and a completely
    different final reading. The broken method would then give a different energy for the same
    event.

    Why the wrong answer looks reasonable. Every line of the arithmetic is correct. The constant is right and the multiplication is right. And 249 kilojoules is an ordinary size for
    a food-energy figure, so nothing about the answer looks strange. Only the units catch it: joules
    for each degree, times degrees, needs a number of degrees, and 24.9 is a position on a scale.
- level: 8
  prompt: |
    A packet's nutritional information panel reads: total carbohydrate 30 grams, of which sugars
    12 grams; protein 6 grams; total fat 5 grams. The packet is made up for this problem.

    Here is a worked answer for the energy in the packet. Find the step that broke.

    ```working
        carbohydrate: 30 times 4 = 120
        sugars: 12 times 4 = 48
        protein: 6 times 4 = 24
        fat: 5 times 9 = 45
        120 plus 48 plus 24 plus 45 = 237
        so the packet holds 237 kilocalories
    ```
  answer: |
    The step that broke is the second. The twelve grams of sugars are not a fourth item. They are
    part of the thirty grams of carbohydrate, and their energy has already been counted on the
    line above.

    Do it again with three lines instead of four.

    ```working
        30 times 4 = 120
    ```

    ```working
        6 times 4 = 24
    ```

    ```working
        5 times 9 = 45
    ```

    ```working
        120 plus 24 plus 45 = 189
    ```

    One hundred and eighty-nine kilocalories.

    How far out the wrong answer was:

    ```working
        237 minus 189 = 48
    ```

    ```working
        48 divided by 189 = 0.253968254
    ```

    Round that to three figures and you have 0.254.

    ```working
        0.254 times 100 = 25.4
    ```

    Twenty-five per cent too high, from one extra line.

    Why it looks reasonable. Every multiplication is correct and every factor is the right factor.
    The error is not in the arithmetic at all; it is in reading the panel. A panel nests. The words of which mean the line is a part of the line above it. A part is never added to the
    whole it came out of.

    The habit that catches it. Before you add anything from a panel, check whether the weights you
    are adding could come to more than the packet does. Thirty plus twelve plus six plus five is fifty-three grams of material. The packet holds thirty
    grams of carbohydrate in all. The sum has invented twelve grams of food.
