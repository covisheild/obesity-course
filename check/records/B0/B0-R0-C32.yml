simplified_explanation: |
  The last section left you with the idea that the energy in a food is the difference between two
  sums. This section is about measuring that difference, and about what the number you get is
  worth.

  Start with the measuring, because it is simpler than it sounds.

  You cannot weigh energy. What you can do is burn the food and watch a thermometer.

  The machine for it is called a bomb calorimeter. The name is unhelpful and the thing is
  straightforward. It is a thick steel pot, sealed, sitting in a tank of water. You put a weighed
  scrap of dried food inside, fill the pot with oxygen, seal it, and set it off with an electric
  spark. The food burns completely. The warmth spreads into the steel and the water. A thermometer
  in the water reads higher than it did before.

  So you have a thermometer reading that went up. What you wanted was joules.

  Here is the step everybody skips, and it is the one the machine actually turns on. Nothing about
  a temperature rise tells you how many joules it took. That depends on the machine: how much
  steel, how much water, how it is built. So you find out, once, by measuring it.

  **You burn something whose energy you already know.** You watch how far the thermometer goes up.
  Then you divide.

  ```working
      the energy equivalent = the known energy, divided by the rise it caused
  ```

  That gives you a number of joules for each degree, and it belongs to that one machine. Call it
  the calorimeter's energy equivalent. Doing this is called calibrating the machine, and it is
  done again before each set of measurements rather than once when the machine is bought.

  After that the work is one multiplication.

  ```working
      the energy released = the rise, times the energy equivalent
  ```

  That is the whole instrument. Burn a known thing to get the constant, then burn the unknown
  thing and multiply.

  Now the second half, which is the half that matters in a meeting.

  What you have measured is all the energy the food will give up when it is burnt to nothing. The
  Food and Agriculture Organization of the United Nations calls it the gross energy. It is the
  most the food could ever supply.

  A person is not a furnace. Several things happen to that energy on the way through, and each one
  takes some of it away.

  Some food is not digested and absorbed at all, and leaves in the faeces, carrying its energy
  with it. Some unabsorbed carbohydrate is fermented in the large intestine and leaves as gas,
  which also carries energy. Some of what is absorbed leaves in the urine, mostly as the waste
  left when protein is broken down and not finished off. And a small amount is lost from the body
  surface.

  What is left after those losses has a name. It is called metabolizable energy, spelt with a z in
  the report that names it.

  So the cascade is gross energy, then metabolizable energy. Below that the report carries one
  more step, called net metabolizable energy. It takes off the energy the body itself spends on
  digesting the food and handling it. What the report has no step for anywhere is digestible
  energy. You may hear somebody put one in the middle and say the report has it. If they do, they
  have not opened it.

  One more thing, and it undoes an assumption almost everybody carries.

  The number on a packet was almost certainly never measured by burning anything. It was
  calculated. Somebody found the grams of protein, fat and carbohydrate, multiplied each by a
  fixed figure, and added the three up.

  The fixed figures are called the Atwater general factors. There is one figure for each of the
  three, and the same figure is used whatever the food is.

  ```table
  what it is     kilojoules a gram  kilocalories a gram
  protein        17                 4.0
  fat            37                 9.0
  carbohydrate   17                 4.0
  ```

  Those factors already have the losses taken out of them. They were built from burning
  measurements and then corrected for what is lost in digestion, in absorption and in the urine.

  So the figure on the packet is an estimate of metabolizable energy for an average, arrived at by
  arithmetic on three weights. It is a good estimate and it is not a measurement of that packet.

  Keep both halves of this section in your head at once, because they answer different questions.
  Burning tells you what is in the food. The factors tell you what an average person would get out
  of it. Neither one tells you anything about the person in front of you.
illustration:
  body: |
    Two things to do here. First put a number on a temperature rise. Then find out what that
    number is worth.

    Start with the machine, and start by reading how it is really used.

    Open OpenStax Chemistry 2e, section 5.2, Calorimetry, at
    https://openstax.org/books/chemistry-2e/pages/5-2-calorimetry. Open your browser's find box and
    search inside the page for the word bomb.

    > A different type of calorimeter that operates at constant volume, colloquially known as a
    > bomb calorimeter, is used to measure the energy produced by reactions that yield large
    > amounts of heat and gaseous products, such as combustion reactions.

    Read on in the same paragraph and you get the working of it.

    > The sample is placed in the bomb, which is then filled with oxygen at high pressure. A small
    > electrical spark is used to ignite the sample.

    Now search the same page for the word calibration, because that is the word this whole section
    turns on.

    > ...such as a measured quantity of benzoic acid ignited by a spark from a nickel fuse wire
    > that is weighed before and after the reaction.

    > The calibration is generally performed each time before the calorimeter is used to gather
    > research data.

    Stop on that second sentence. Each time. Not once when the machine arrives. Ask yourself why a
    machine would need measuring again before every set of runs, and you have the idea.

    Here it is. A thermometer rise is not an energy and never will be. How many joules one degree is worth depends on this machine. How much steel is in it, how much
    water is round it, how it is put together. So somebody has to go and find that number out, and they find it out by
    burning something whose energy they already know.

    So do that, with a machine and some figures. Every figure in this calorimeter example is made
    up. No real calorimeter and no real food is being described.

    The known sample releases 26,400 joules. The thermometer goes up by 2.2 degrees Celsius, which
    is the ordinary degree marked on a kitchen thermometer.

    Divide the energy by the rise.

    ```working
        26,400 divided by 2.2 = 12,000
    ```

    Twelve thousand joules for every degree, in this machine, today. That is the calorimeter's
    energy equivalent, and it is the only thing you needed.

    Now burn the unknown. A dried pellet of food weighing 1.50 grams goes in, and the thermometer
    goes up by 1.85 degrees.

    ```working
        12,000 times 1.85 = 22,200
    ```

    Twenty-two thousand two hundred joules. Put it in kilojoules, because nobody quotes food in
    joules.

    ```working
        22,200 divided by 1,000 = 22.2
    ```

    Now for each gram, since the pellet weighed 1.50 grams.

    ```working
        22.2 divided by 1.50 = 14.8
    ```

    Fourteen point eight kilojoules in every gram. Turn it into the unit food is quoted in, using
    the 4.184 from the section on energy units.

    ```working
        14.8 divided by 4.184 = 3.5373
    ```

    Round it, because the figures going in had three digits. About 3.5 kilocalories in each gram.

    Look back at what you just did. Two multiplications, two divisions, and not one thing about
    water or steel or how much of either. All of it was hidden inside the 12,000, and the 12,000
    came from a single known burn.

    Now the second half, and this is the one that changes what you say out loud.

    You have a number for the food. The question nobody asks is what it is a number about.

    Go and get the answer from the people who wrote the rules for it. The Food and Agriculture Organization of the United Nations published a report on this in 2003. It
    is Food and Nutrition Paper 77, Food energy — methods of analysis and conversion factors. Open
    chapter 3 of it at https://www.fao.org/4/y5022e/y5022e04.htm.

    Before you read anything, test what you think you already know. Almost everybody who has met
    this once remembers three steps: gross energy, then digestible energy, then metabolisable
    energy. Search the page for digestible energy.

    Nothing. The phrase is not in the chapter. It is not in the next chapter either.

    So read what the report does say. Search for gross energy instead.

    > Food that is ingested contains energy - the maximum amount being reflected in the heat that
    > is measured after complete combustion to carbon dioxide (CO2) and water in a bomb
    > calorimeter. This energy is referred to as ingested energy (IE) or gross energy (GE).

    That is your burning measurement, named. It is the most the food could ever give.

    Keep reading and the losses arrive, one at a time.

    > Incomplete digestion of food in the small intestine, in some cases accompanied by
    > fermentation of unabsorbed carbohydrate in the colon, results in losses of energy as faecal
    > energy (FE) and so-called gaseous energy (GaE) in the form of combustible gases (e.g.
    > hydrogen and methane).

    > Most of the energy that is absorbed is available to human metabolism, but some is lost as
    > urinary energy (UE), mainly in the form of nitrogenous waste compounds derived from
    > incomplete catabolism of protein.

    > The energy that remains after accounting for the important losses is known as
    > “metabolizable energy” (ME) (see Figure 3.1).

    Now read one paragraph further. There is a third step, and it is not the one you went looking
    for. Some energy is spent on digesting the food and handling it afterwards, and some is lost
    to microbes. Take those off metabolizable energy and the report names what is left.

    > ...the result is an expression of the energy content of food, which is referred to as net
    > metabolizable energy (NME).

    So the report's cascade runs gross energy, then metabolizable energy, then net metabolizable
    energy. The third step sits below metabolizable energy, not above it. The digestible-energy
    step is nowhere in the report at all. Cite this report for a gross, digestible and
    metabolisable split and you have cited a page that says something else.

    Now find where the numbers on packets come from. Search the same chapter for Atwater.

    > It uses a single factor for each of the energy-yielding substrates (protein, fat,
    > carbohydrate), regardless of the food in which it is found.

    > The energy values are 17 kJ/g (4.0 kcal/g) for protein, 37 kJ/g (9.0 kcal/g) for fat and 17
    > kJ/g (4.0 kcal/g) for carbohydrates.

    Three numbers, one for each of the three. Now use them on something real.

    Open the National Food Security Act, 2013 at
    https://indiacode.gov.in/handle/123456789/496105 and go to Schedule II. Find the row for upper
    primary classes. The hot cooked meal is set at 700 in the energy column, and at 20 grams in the
    protein column.

    Work out how much of that 700 the protein standard accounts for.

    ```working
        20 times 4.0 = 80
    ```

    Eighty kilocalories from the protein. As a share of the meal, divide the part by the whole.

    ```working
        80 divided by 700 = 0.1142857143
    ```

    That is what the calculator shows. Round it to three figures and you have 0.114. Multiply by a
    hundred to turn the proportion into a percentage.

    ```working
        0.114 times 100 = 11.4
    ```

    About eleven per cent. So the Act fixes an energy figure and a protein figure, and the protein
    figure accounts for roughly a ninth of the energy. The other eight ninths have to come from
    fat and carbohydrate, and Schedule II sets no figure for either of them.

    Now do the same sum in kilojoules and watch something strange happen. The factor for protein
    in kilojoules is 17.

    ```working
        20 times 17 = 340
    ```

    And the 700 kilocalories, in kilojoules:

    ```working
        700 times 4.184 = 2,928.8
    ```

    ```working
        340 divided by 2,928.8 = 0.116
    ```

    Multiply by a hundred, exactly as you did before.

    ```working
        0.116 times 100 = 11.6
    ```

    Eleven point six per cent this time, against eleven point four the other way. Same Act, same
    report, same protein.

    Neither of you has slipped. The report's kilojoule column and its kilocalorie column were each
    rounded on their own, and they are not exact conversions of one another. A footnote on the same
    page gives protein's precise value as 16.7 kilojoules a gram, and that one does convert
    properly.

    ```working
        16.7 divided by 4.184 = 3.991
    ```

    Four kilocalories a gram, which is what the report prints. The 17 is the rounded figure, and
    rounding it is what moved your answer in the third digit.

    Now say what you have and, more importantly, what you have not.

    You have the energy standard the Act sets for one meal, and the share of it the protein
    standard would account for. That is a statement about the Act.

    You do not have a measurement of any meal. Schedule II says what a meal must meet, not what any
    meal contained.

    You do not have what reaches a child either, even if a meal met the standard exactly. Between
    the energy in the food and the energy available to the body sit the losses you have just read
    the report name. They are the faecal, the gaseous and the urinary losses, and a small loss
    from the body surface.

    And you have nothing at all about what any one child spends, or about what a change in anybody's
    body would be made of. This book does not carry either number, and you should not supply one
    from memory.

    Here is the habit to take away. Every time somebody hands you a food-energy figure, ask three
    questions in order. Was it burnt or was it calculated. Is it the gross figure or the
    metabolizable one. And is it a standard somebody set, or a measurement somebody took.
