definition:
  text: |
    Combustion is burning: a substance combines vigorously with oxygen. A change that releases
    heat is called an exothermic process, and the combustion of a food is one.

    Calorimetry measures the amount of energy transferred to or from a substance by a chemical or
    physical change. The energy is exchanged with a calibrated object, the calorimeter, and the
    temperature change the calorimeter shows is what the amount of energy is worked out from.

    A bomb calorimeter operates at constant volume and is used for reactions that release large
    amounts of energy and produce gases, which is what combustion does. It is a strong steel
    container, the bomb, which holds the sample and is itself submerged in water. The bomb is
    filled with oxygen at high pressure and a small electrical spark ignites the sample. The
    energy produced is taken up by the steel bomb and the water around it, and a thermometer
    records the rise.

    A bomb calorimeter is calibrated before it is used, and the calibration is what turns a
    temperature rise into an energy. A substance whose energy is already known is burned in it,
    and the rise that produces is measured. The known energy divided by that rise is the
    calorimeter's energy equivalent, in joules for each degree. Afterwards any rise measured in
    that calorimeter, multiplied by that same energy equivalent, gives the energy the reaction
    released. The calibration is generally performed each time before the calorimeter is used to
    gather research data.

    The caloric content of a food can be determined by bomb calorimetry, that is, by burning the
    food and measuring the energy it contains. A sample is weighed, blended, freeze-dried, ground
    to a powder and pressed into a pellet, and the temperature change its burning produces is
    converted into energy for each gram of food.

    What that measures is the total combustible energy content of the food, also called its
    theoretical maximum energy content. The Food and Agriculture Organization of the United
    Nations calls this the ingested energy, or the gross energy.

    Not all of it is available to a person. Incomplete digestion in the small intestine,
    sometimes with fermentation of unabsorbed carbohydrate in the colon, loses energy as faecal
    energy and as gaseous energy in combustible gases. Some of the energy that is absorbed is
    then lost as urinary energy, mainly as nitrogenous waste compounds from incomplete breakdown
    of protein. A small amount is lost from the body surface. What remains after those losses is
    metabolizable energy.

    Below that the Organization's 2003 report carries one further step, net metabolizable energy.
    It takes off the energy the body itself spends on digesting the food and on handling what is
    absorbed. What the report has no step for anywhere is digestible energy.

    The energy figure on a food label is not a burning measurement. It is derived using the
    Atwater system, which uses the average caloric content of protein, carbohydrate and fat. Those
    averages are the Atwater general factors. There is one value for each of the three, used
    regardless of the food it is found in. They are based on the heats of combustion of protein,
    fat and carbohydrate, corrected for losses in digestion, absorption and urinary excretion of
    urea.

    The three values are 17 kilojoules for each gram of protein, 37 for each gram of fat and 17
    for each gram of carbohydrate. In kilocalories for each gram the same three values are 4.0,
    9.0 and 4.0.

    One thing the general system does not do is take fibre out. Atwater's carbohydrate is
    determined by difference, and thus includes fibre. Label systems differ from that and from
    each other. On a US label the carbohydrate amount is discounted a certain amount for the fibre
    content, which is indigestible carbohydrate. On an Indian label dietary fibre has its own
    factor of 2 kilocalories a gram, under regulation 5(3)(e)(i) of the labelling regulations of
    2020.

    To work out the energy content of a food, the quantities of carbohydrate, protein and fat are
    each multiplied by the factor for that one, and the products are added.
