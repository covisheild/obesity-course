retrieval_items:
- q: What is the difference between heat and temperature, and what unit does each carry?
  a: Heat is the spontaneous transfer of energy caused by a temperature difference, it is an amount
    of energy, and its unit is the joule. Temperature is how hot something is, it is a level rather
    than an amount, and its unit is the degree Celsius or the kelvin. Heat is a form of energy;
    temperature is not.
- q: Write the relationship between heat and temperature change, naming every letter in it.
  a: The quantity of heat Q equals the mass m, times the specific heat c of the material, times the
    change in temperature ΔT, where the change in temperature is the final temperature minus the
    initial one. A negative ΔT gives a negative Q, which means energy left.
- q: What is the difference between heat capacity and specific heat?
  a: Heat capacity belongs to a particular object and is the joules it needs for a one-degree change,
    in joules per degree Celsius. Specific heat belongs to a material and is the joules one kilogram
    of it needs for a one-degree change, in joules per kilogram per degree Celsius. A calorimeter's
    energy equivalent is its heat capacity.
- q: Why does a bigger temperature rise not mean more heat?
  a: Because the rise is the heat divided by the object's mass times its specific heat, and those
    differ between objects. A kilogram of steel and a kilogram of water given the same energy rise
    by 9.26 degrees and 1 degree, using 452 and 4186 joules per kilogram per degree.
- q: Name the three methods of heat transfer, with one sentence of definition each.
  a: Conduction is heat transfer through stationary matter by physical contact. Convection is heat
    transfer by the macroscopic movement of a fluid. Radiation is heat transfer that occurs when
    electromagnetic radiation, such as microwaves, infrared or visible light, is emitted or
    absorbed.
- q: When does the heat equation stop holding?
  a: At any phase change and at any chemical change. While water boils or ice melts the temperature
    does not move while energy goes in, so a formula containing the change in temperature returns
    zero for an energy that is not zero. Specific heat also varies with temperature, so a wide
    range breaks the assumption that it is constant.
