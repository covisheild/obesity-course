  analogy_breaks_when: |
    The heat equation holds only while the substance stays the same substance in the same phase. Boil the water and it stops. The energy then goes into turning liquid into
    steam, and the temperature sits still while that happens. Any calculation that crosses a boiling point or a melting point has left this section behind.

    Specific heat is not truly a constant. Over the ranges used here the variation is small enough to ignore.

    A person is not one substance and has no single specific heat you can look up. Nothing here gives you a figure for heating or cooling a person, and none of these numbers
    should be carried across to one.

    All three routes run at once in every real situation. Naming the route a control acts on does not settle what the other two then do.

    This section gives no rates. It says by which routes heat moves and never how fast.

    Sweating is not one of the three, and the book does not treat it as one. Any claim that turns on evaporation is outside what you are holding.

    "Only three methods" is a claim about routes across a boundary. It is not a promise that every warming or cooling you meet is explained by naming one. A person getting
    warmer may be doing it by running a chemical reaction inside their own boundary. That is not a transfer across the boundary at all.
must_know:
- point: |
    A bigger temperature rise does not mean more heat went in. Give a kilogram of steel and a
    kilogram of water the same energy. The steel rises more than nine times as far. So a
    thermometer reading is not an energy.
  kind: misconception
  bearing: methodological
  refs:
  - openstax_college_physics_2e
- point: |
    Heat is energy on the way, not a thing an object holds, so refuse the sentence "this object
    contains so much heat". Heat is the name of a transfer.
  kind: trap
  bearing: methodological
- point: |
    When anyone turns a temperature reading into an energy, ask two things. What heat capacity did
    they use? Where did it come from? Inside one machine the heat capacity is fixed, so the reading
    can be trusted. Across two machines a degree is not a degree. Rises set side by side with no
    heat capacity named are not energies set side by side.
  kind: move
  bearing: methodological
- point: |
    Water needs more than nine times the energy that iron or steel needs, for the same rise in the
    same mass. The figures are 4186 joules per kilogram per degree Celsius at 15.0 °C, against 452.
  kind: number
  bearing: methodological
  refs:
  - openstax_college_physics_2e
- point: |
    The heat equation holds only while the substance stays the same substance in the same phase. It breaks at every
    boiling point, every melting point and every chemical reaction. When a calculation reaches one of those points, stop
    rather than substitute.
  kind: boundary
  bearing: clinical
- point: |
    A temperature is not an amount of energy, so never read a patient's temperature as a statement
    about energy gained or lost. One is in degrees and the other in joules.
  kind: consequence
  bearing: clinical
- point: |
    Heat moves by conduction, convection and radiation, and by nothing else, so make every claim
    about keeping warm or cool name its route. Once the route is named, the question becomes how
    much was arriving that way, and that can be answered.
  kind: move
  bearing: public
- point: |
    Teach the two-objects demonstration before the formula. After that they will not read a rise as
    an energy again.
  kind: move
  bearing: teaching
exercises:
- type: retrieval
  prompt: |
    Without looking back, write down the difference between heat and temperature, with the unit of
    each.

    Then name the three ways heat moves, and give one example of each from a kitchen.
  answer: |
    Heat is the transfer of energy from a hotter thing to a colder thing, and it happens because
    the two are at different temperatures. It is an amount of energy and its unit is the joule.

    Temperature is how hot something is. It is a level rather than an amount, and its unit is the
    degree Celsius or the kelvin.

    The test that separates them: temperature does not care how much of the thing there is, and
    heat does. A spoonful and a bucket of boiling water are at the same temperature and hold very
    different amounts of energy.

    The three ways heat moves.

    Conduction is transfer through matter that is staying put, by contact. A steel tumbler of hot
    chai warming your fingers.

    Convection is transfer by a fluid moving and taking the energy with it. The hot air rising off
    a tawa onto your palm held above it.

    Radiation is transfer as electromagnetic radiation, emitted or absorbed, with nothing needed in
    between. The warmth on your face from an open tandoor across the room.

    One thing to check in your own answer. Did you write a unit for each of the first two? If heat
    and temperature came out with the same unit, or with no unit, the distinction has not been made
    yet.
  confidence_first: true
- type: critique
  prompt: |
    A sheet for a "heat-retaining" food container says this.

    > The double steel wall keeps food hot for six hours, so no energy escapes and the food keeps
    > all its calories.

    The container and the sheet are made up for this exercise. Say what is wrong, and say what you
    would ask for.
  answer: |
    There are three claims stacked here and they get weaker as you go along.

    The first claim is about a rate. A double wall slows conduction, because the gap between the two walls has less matter in it to
    conduct through. It slows convection too, if the air in the gap cannot circulate. That is a real mechanism and it is checkable. Note that it says nothing
    about radiation, which is the third route and crosses a gap perfectly well.

    The second claim does not follow from the first. "Keeps food hot for six hours" is a statement
    about how fast energy leaves. "No energy escapes" is a statement that none does. Those are different claims, and only the weaker one can be true. If the food is still hotter than
    the room after six hours, energy is still crossing. Energy crosses whenever there is a
    temperature difference. What the container has done is make the crossing slow, not stop it.

    The third claim is a change of subject. Calories in food are chemical energy sitting in the
    food's molecules. The energy leaving a hot container is thermal energy, and it is leaving
    because the food is hotter than the room. Letting the food go cold does not remove the chemical
    energy from it, and keeping it hot does not add any. A cold roti and a hot roti hold the same
    chemical energy. The sheet has run two different energies together under one word.

    What to ask for. First, the rate: how many degrees does the food fall in six hours, starting
    from what temperature, in a room at what temperature. That is the only measurable version of
    the first claim. Second, which of the three routes the wall acts on, and what it does about
    radiation. Third, nothing at all for the third claim, because it should be withdrawn rather
    than supported.
- type: teaching
  prompt: |
    A first-year resident has ten minutes and a whiteboard. They have used a calorimeter and they
    are confident that a bigger temperature rise means more energy.

    Teach them why that is true inside one instrument and false between two, so that they leave
    able to challenge a temperature-based energy claim.
  answer: |
    Ten minutes, a whiteboard, and somebody who is not wrong yet — they are right about the
    instrument and about to over-apply it.

    Start by agreeing with them, out loud, and write the calorimeter sentence on the board. Twice
    the rise, twice the energy. Tell them it is correct and you are not going to take it away.

    Then draw two circles and label them: one kilogram of water, one kilogram of steel. Ask the
    room how far each goes up if you put the same energy into both. Let them answer before you
    write anything; most will say the same amount.

    Now write the two numbers from the table. Water 4186 joules per kilogram per degree. Steel 452.
    Then bracket the steel's rise on the board, so they watch it happen rather than watch a
    calculator.

    ```working
        452 times 9 = 4068
        452 times 10 = 4520
    ```

    Four thousand one hundred and eighty-six joules sits between those two. So the tawa goes up by
    between nine and ten degrees, while the water goes up by one. Same energy, one goes up nine times
    as far. That is the moment to stop and say nothing for a few seconds. The sentence they walked
    in with has just broken in front of them.

    Now rebuild it, and this is the part they will keep. Write the equation, naming every letter as you write it. Q is the quantity of heat. m is the mass. c
    is the specific heat of the material. ΔT is the change in temperature. Then point at c and say that this is the thing that
    was hiding.

    Inside one calorimeter, m and c never change from run to run. So the rise is the energy divided
    by a number that never moves, and their original sentence is exactly right. Give that number
    its name on the board: the heat capacity of the instrument, joules per degree.

    Change the instrument and the number changes. Change the object and the number changes. Then
    degrees from one are not degrees from the other, and a comparison of rises is not a comparison
    of energies.

    Close with the question you want them asking on Monday. When anybody reports an energy that
    came from a temperature, ask what heat capacity was used and where it came from. Tell them that "we
    used the calorimeter's energy equivalent" is a good answer. "We compared the temperature rises"
    is not an answer at all.
quantitative: true
practice:
- level: 1
  prompt: |
    Work out the value of m times c times ΔT when m is 2, c is 500 and ΔT is 30.
  answer: |
    Put the three numbers in place of the three letters and multiply.

    ```working
        2 times 500 times 30 = 30000
    ```

    Thirty thousand.

    Take the multiplication in two steps if that is easier, and check you get the same.

    ```working
        2 times 500 = 1000
        1000 times 30 = 30000
    ```
- level: 2
  prompt: |
    Two parts, both on the same relationship.

    a) Q is 30,000, m is 2 and c is 500. Work out ΔT.

    b) Q is 9,000, m is 3 and ΔT is 6. Work out c.
  answer: |
    Both parts run the same relationship backwards. Q is the product of the other three, so any one
    of them is Q divided by the product of the two you have.

    **a)** Multiply the two you have.

    ```working
        2 times 500 = 1000
    ```

    Then divide.

    ```working
        30000 divided by 1000 = 30
    ```

    ΔT is 30.

    **b)** Same move, with a different letter missing.

    ```working
        3 times 6 = 18
        9000 divided by 18 = 500
    ```

    c is 500.

    Check each one forwards before you leave it.

    ```working
        2 times 500 times 30 = 30000
        3 times 500 times 6 = 9000
    ```
- level: 4
  prompt: |
    A steel degchi weighing 1.2 kilograms holds 2 kilograms of water. Both are heated from 28
    degrees Celsius to 100 degrees Celsius.

    Take the specific heat of water as 4186 joules per kilogram per degree Celsius. Take that of
    steel as 452.

    Work out the energy that went into the water, the energy that went into the steel, and the
    total. Keep the unit on every answer. Then say which of the two took more, and why.
  answer: |
    First the change in temperature, which is the same for both.

    ```working
        100 minus 28 = 72
    ```

    Seventy-two degrees Celsius.

    Now the water. Mass times specific heat first.

    ```working
        2 times 4186 = 8372
    ```

    Eight thousand three hundred and seventy-two joules for every degree. Now times the 72 degrees.

    ```working
        8372 times 72 = 602784
    ```

    Six hundred and two thousand seven hundred and eighty-four joules into the water.

    Now the steel, the same way.

    ```working
        1.2 times 452 = 542.4
        542.4 times 72 = 39052.8
    ```

    Thirty-nine thousand and fifty-two point eight joules into the steel.

    The total.

    ```working
        602784 plus 39052.8 = 641836.8
    ```

    Six hundred and forty-one thousand eight hundred and thirty-six point eight joules altogether.

    Which took more, and why. The water, by a long way — about fifteen times as much. Two reasons
    stack. There is more of it, 2 kilograms against 1.2. And water needs more than nine times as
    many joules per kilogram per degree as steel does. The vessel is almost an afterthought in the arithmetic. That is why a pan of water takes so long to
    heat, and the empty pan takes almost no time at all.
  refs:
  - openstax_college_physics_2e
- level: 6
  prompt: |
    A glass tumbler weighing 0.18 kilograms and a steel tumbler weighing 0.18 kilograms are each
    filled with hot chai. Each tumbler itself rises by 55 degrees Celsius.

    Take the specific heat of glass as 840 joules per kilogram per degree Celsius. Take that of
    iron and steel as 452.

    Work out how much energy each tumbler absorbed, with its unit. Then say which tumbler takes
    more energy out of the chai, and what that means for the chai in each.
  answer: |
    The glass first. Mass times specific heat.

    ```working
        0.18 times 840 = 151.2
    ```

    A hundred and fifty-one point two joules for each degree. Now times 55 degrees.

    ```working
        151.2 times 55 = 8316
    ```

    Eight thousand three hundred and sixteen joules into the glass tumbler.

    Now the steel.

    ```working
        0.18 times 452 = 81.36
        81.36 times 55 = 4474.8
    ```

    Four thousand four hundred and seventy-four point eight joules into the steel tumbler.

    Which takes more. The glass. Now put a size on how many times more, and bracket it rather than
    divide. Try 1.8 times the steel's figure.

    ```working
        4474.8 times 1.8 = 8054.64
    ```

    Eight thousand and fifty-four, and the glass took 8,316. So the factor is more than 1.8. Now
    try 1.9.

    ```working
        4474.8 times 1.9 = 8502.12
    ```

    Eight thousand five hundred and two, which is more than the glass took. So the factor sits
    between 1.8 and 1.9. A calculator puts it at 1.858.

    Now check that against the two specific heats, by multiplying 452 by the same figure and seeing
    whether 840 comes back.

    ```working
        452 times 1.858 = 839.816
    ```

    Eight hundred and thirty-nine point eight, which is 840 to the nearest whole number. The ratio of the energies is the ratio of the specific heats. It has to be. The two tumblers have
    the same mass and the same temperature change, and differ only in the material.

    What it means for the chai. Every joule that goes into warming the tumbler came out of the
    chai. So the glass tumbler takes about 1.86 times as much energy out of it. The chai in the
    glass ends up cooler once both tumblers have warmed, for that reason alone.

    And one thing this does not settle. How fast the chai then goes on cooling depends on the routes out of the tumbler. How well each
    material conducts, how thick the wall is, how much surface meets the air. This calculation is about the energy taken up in warming the vessel, and it
    is only the first part of the story.
  refs:
  - openstax_college_physics_2e
- level: 7
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
        500 grams of water is heated from 30 degrees Celsius to 80 degrees Celsius
        the specific heat of water is 4186 joules per kilogram per degree Celsius
        80 minus 30 = 50
        500 times 4186 times 50 = 104650000
        so the water absorbed 104,650,000 joules
    ```
  answer: |
    The step that broke is the fourth, and the arithmetic in it is correct. What broke is a unit.

    The specific heat is quoted per kilogram. The mass was put in as grams. Multiplying grams by a per-kilogram figure gives an answer a thousand times too big. Nothing on the
    page says so, because the units were never written beside the numbers.

    Convert the mass first.

    ```working
        500 divided by 1000 = 0.5
    ```

    Half a kilogram. Now the same calculation with the mass in the unit the specific heat is quoted
    in.

    ```working
        0.5 times 4186 times 50 = 104650
    ```

    A hundred and four thousand six hundred and fifty joules, which is about 105 kilojoules.

    A size check would have caught it without any of this. A hundred million joules is roughly what
    a small burner would deliver in a day of continuous running. Half a litre of water going from
    warm to very hot is a few minutes on a stove. Two answers three orders of magnitude apart is the
    kind of gap the section on orders of magnitude exists to make visible.

    Why the wrong answer looks reasonable. Every number in it is a real number. The subtraction is
    right and the multiplication is right. The specific heat is the correct one for water. The only
    thing wrong is that two of the quantities were measured in units that do not go together. That
    never shows up in the digits.
- level: 8
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
        a 1 kilogram steel tawa and 1 kilogram of water start at 30.0 degrees Celsius
        each is put on an identical burner for the same length of time
        after that time the tawa reads 39.3 degrees Celsius and the water reads 31.0
        the tawa's temperature rose by much more than the water's
        so much more heat went into the tawa than into the water
    ```
  answer: |
    The step that broke is the last one. The two temperature rises are very different and the two
    quantities of heat are almost the same.

    Work out each one, using the specific heats from the table: water 4186 joules per kilogram per
    degree Celsius, steel 452.

    The tawa first.

    ```working
        39.3 minus 30.0 = 9.3
        1 times 452 times 9.3 = 4203.6
    ```

    About 4,204 joules.

    Now the water.

    ```working
        31.0 minus 30.0 = 1.0
        1 times 4186 times 1.0 = 4186
    ```

    About 4,186 joules.

    Put the two side by side.

    ```working
        4203.6 minus 4186 = 17.6
    ```

    Seventeen point six joules apart, out of roughly four thousand two hundred each. That is well
    under one per cent, which is smaller than the error in reading either thermometer. The two
    burners delivered the same energy, which is what the second line of the working said they did.

    What the fourth line should have led to instead. A temperature rise is the heat divided by the
    object's mass times its specific heat. The two objects have the same mass and very different
    specific heats, so the same heat has to produce very different rises. The rises differ because
    the objects differ, not because the energies differ.

    Why the wrong answer looks reasonable. Lines one to four are all correct, and the last line is
    the sentence anybody carries away from using a calorimeter, where it is true. The missing step is the one that asks whether the two things being compared need the same energy per
    degree. Inside a single instrument that question never has to be asked.
  refs:
  - openstax_college_physics_2e
- level: 9
  prompt: |
    A poster in a gym says this.

    > Drink four litres of chilled water a day, straight from the fridge at 5 degrees. Your body has
    > to warm every litre up to 37 degrees, and that is energy spent without moving a muscle.

    The poster and both temperatures are made up for this problem.

    Decide what to compute, compute it, and say what your answer does not establish.
  answer: |
    What to compute: the energy needed to warm four kilograms of water through the temperature
    range the poster names. Four litres of water is four kilograms closely enough for this. That
    figure is the only quantity the poster's claim actually pins down, and it is worth knowing
    before arguing about anything else.

    The change in temperature first.

    ```working
        37 minus 5 = 32
    ```

    Thirty-two degrees Celsius. Now the mass times the specific heat of water.

    ```working
        4 times 4186 = 16744
    ```

    Then times the change.

    ```working
        16744 times 32 = 535808
    ```

    Five hundred and thirty-five thousand eight hundred and eight joules, which is about 536
    kilojoules. Now put it in the unit food labels use. One kilocalorie is 4,184 joules, from the
    section on energy units.

    That 4,184 is the calorie's definition, not water's specific heat. The two are different
    quantities. They are not the two books' disagreement about water, which this section described
    earlier.

    So ask how many kilocalories fit in 535,808 joules. Try 128.

    ```working
        4184 times 128 = 535552
    ```

    Five hundred and thirty-five thousand five hundred and fifty-two, which is just short of what
    you have.

    ```working
        535808 minus 535552 = 256
    ```

    Two hundred and fifty-six joules short, which is well under one kilocalorie. So the answer is a
    shade over 128 kilocalories a day, if every part of the poster's set-up holds.

    What this does not establish, and there are four things.

    It does not establish that the body spends that energy on top of what it was already spending.
    The balance from the section on conservation and the boundary says the numbers must add up
    across that boundary. It says nothing about whether the other crossings stay put when you
    change one of them.
    Whether they do is a question about bodies, and it is the subject of the booklet on energy
    balance rather than of this section.

    It does not establish anything about body weight. The answer is in kilojoules. Weight is in
    kilograms. Nothing here converts one into the other.

    It does not establish the two temperatures. They are the poster's, and they were taken as given
    so that the arithmetic could be done. A different pair gives a different answer in proportion.

    And it does not establish that all four litres arrive at 5 degrees and are warmed through the
    full 32 degrees inside the person. Water sitting in a glass in an Indian kitchen does not stay
    at fridge temperature for long.

    What is left after all that is a number: 128 kilocalories a day. It is a ceiling on the size of
    the effect the poster describes, not a measurement of it. That is still worth having,
    because it stops the claim being either dismissed or believed without a figure.
  refs:
  - openstax_college_physics_2e
- level: 10
  prompt: |
    Someone says this in a meeting about food testing.

    > The bomb in our calorimeter has a heat capacity of 893 joules per degree Celsius. We ran two
    > foods. One gave a rise of 4.2 degrees and the other 2.1 degrees. So the first food holds twice
    > the energy of the second.

    Decide what to compute, compute it, and say what your answer does not establish.
  answer: |
    What to compute: the energy behind each rise, using the bomb's own heat capacity, and then the
    ratio of the two. The heat capacity is in joules per degree, so multiply it by the degrees.
    Note what that figure is and is not. It is the bomb, not the whole calorimeter.

    The first food.

    ```working
        893 times 4.2 = 3750.6
    ```

    About 3,751 joules absorbed by the bomb.

    The second.

    ```working
        893 times 2.1 = 1875.3
    ```

    About 1,875 joules.

    Now the ratio.

    ```working
        3750.6 divided by 1875.3 = 2
    ```

    Exactly two, which it was always going to be, because the same heat capacity multiplies both rises.
    On the conditions stated, the colleague's arithmetic is right.

    What this does not establish, and the conditions are where all of it sits.

    It does not establish anything if the two runs were not done in the same calorimeter. A degree is worth 893 joules in this bomb and some other figure in another one. So rises from two
    instruments cannot be compared at all until both heat capacities are in hand.

    It does not establish that one food holds twice the energy of the other unless the two samples
    weighed the same. Energy content is quoted per gram. Burn twice as much of an identical food
    and you get twice the rise, and nothing about the food has changed.

    It does not account for everything that absorbed the energy. The 893 joules per degree is the
    bomb itself. A bomb calorimeter sits in water, and the water takes up energy too. So the total
    released by the food is larger than either figure computed here.

    And it does not establish what reaches a person. The boundary round the bomb is not the boundary
    round a body, and what crosses the two is not the same quantity.

    What to say in the meeting. The ratio is sound and it is a ratio of temperature rises in one
    instrument. Before it becomes a statement about two foods, someone has to confirm three things.
    The same calorimeter, the same sample mass, and the water as well as the bomb.
