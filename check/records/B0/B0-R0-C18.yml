simplified_explanation: |
  A function is a machine with one slot in and one slot out.

  You drop a number in. One number comes out. Drop the same number in tomorrow and the same number
  comes out, because the rule has not changed.

  One input may give one output and no more. If the same input gives you 20 today and 35 tomorrow,
  you are not holding a rule at all. You are holding something else, and you cannot use it to
  answer a question.

  There is a short way to write a rule down. Give it a name, say f. Write f(4), said out loud as
  "f of 4", for the output the rule gives when you put 4 in. The brackets here do not mean times.

  Two names, so you recognise them on somebody else's page. The inputs a rule will accept are
  called its domain. The outputs it can give back are called its range. Ask a rule what it accepts
  and what it does not. That is often the quickest way to catch somebody running it outside what
  it was built for. A rule that counts people takes whole numbers from one upwards. Half a person
  is not an input it has an answer for.

  Be careful with the second of those two words. In statistics, range means something else
  entirely, which is the largest value in a set of measurements minus the smallest. The two
  meanings have nothing to do with each other and you will meet both. Which one is meant depends
  on whether the thing being described is a rule or a set of measurements.
illustration:
  body: |
    A block register lands on your desk. It lists four households, how many people are in each, and
    the foodgrains each is counted for in a month.

    ```table
    household  people  kilograms a month
    A          4       20
    B          6       30
    C          4       35
    D          5       25
    ```

    How many kilograms does it give for a household of four?

    You cannot answer. Household A says 20 and household C says 35. One input has two outputs, so
    this table is not a function of the number of people.

    That is a finding rather than a dead end. Something other than the number of people differs
    between A and C, and the register does not say what. Until somebody tells you what, you cannot
    work out a single row from the number of people alone.

    Section 3(1) of the National Food Security Act, 2013 entitles a person in a priority household
    to five kilograms of foodgrains per person per month.

    That sentence is a function. The input is the number of people. The rule is "multiply by five
    kilograms a month". The output is kilograms of foodgrains a month.

    Put four in.

    ```working
        5 times 4 = 20
    ```

    Twenty kilograms a month.

    Write the rule short. Call it g. Let n stand for the number of people, in the way a letter
    stood for a number in the section on variables.

    ```working
        g(n) = 5 times n
    ```

    Households A, B and D match it. Household C does not.

    ```working
        5 times 4 = 20
    ```

    One input, one output, and anything that does not match is a question for whoever wrote the
    register.
  numbers:
  - value: '5'
    quote: entitled to receive five kilograms of foodgrains per person per month
    unit: kilograms of foodgrains per person per month, priority households, s.3(1)
    citekey: nfsa_2013
    as_of: '2026-09-23'
  analogy_breaks_when: |
    The one-slot machine holds while the rule takes one input. Many real rules take two.

    The index you met in the section on body-size units needs a mass and a height together. That is
    still a function.

    The machine says nothing about whether a rule is true of the world either. A rule can give
    exactly one output and still be the wrong rule.
must_know:
- point: |
    When a table lands in front of you, look for one input appearing twice with two different
    outputs before you compute anything from it.
  kind: move
  bearing: methodological
- point: |
    Two inputs sharing one output is fine. One input with two outputs is not.
  kind: misconception
  bearing: methodological
- point: |
    Outputs that climb for a while and then fall again break nothing. So look for the repeated
    input, never for the shape of anything.
  kind: trap
  bearing: methodological
- point: |
    When the same inputs give a different answer on a second run, something you did not notice
    changed. Find what changed before you trust either answer.
  kind: consequence
  bearing: clinical
- point: |
    Name the input, the output and the unit of each before you write anybody's rule on a
    whiteboard.
  kind: move
  bearing: teaching
- point: |
    A function says the output goes with the input. It never says the input produced it.
  kind: boundary
  bearing: policy
exercises:
- type: critique
  prompt: |
    A colleague sends you a two-column table of three hundred rows and calls it "the rule we use".
    You find that one value in the first column appears twice, with two different values beside it.

    Say what that means for the table, and say what you would ask for next.
  answer: |
    It means the table is not a function of its first column. One input has two outputs, so the
    table cannot answer the question "what does this give for that input?".

    Say it plainly. The table is a record of what happened, not a rule for working something out.
    Both rows may be perfectly correct as records.

    What to ask for next: the thing that differs between those two rows. Something not in the first
    column moved between them. Either it belongs in the table as a second input column, or one of
    the two rows is an error.

    Then ask how many other repeats there are. One repeat in three hundred rows is a question about
    one row. Forty repeats is a question about the whole table, and it usually means the first
    column was never the input the rule was built on.

    What you cannot do is average the two outputs and carry on. That produces a number that appears
    in neither row and matches nothing anybody recorded.
- type: teaching
  prompt: |
    A first-year resident says they can never keep formulas straight. You have ten minutes and a
    whiteboard.

    Teach them what a function is, so that they leave able to check whether something handed to
    them is one.
  answer: |
    Ten minutes, for somebody who expects a mechanism rather than a rule.

    Draw a box on the board with an arrow going in and an arrow coming out. Say that the box is the
    rule, the arrow in is the input, and the arrow out is the output. Ask them to name a rule they
    use, and write its input and output on the two arrows with their units.

    Now break it in front of them. Write a short table with four rows, and make two rows share an
    input and carry different outputs.

    ```table
    people  kilograms
    4       20
    6       30
    4       35
    5       25
    ```

    Ask what the rule gives for four people. Let them sit with it until somebody says the table
    gives two answers. That is the moment, and it lands because they found it.

    Then give them the test in one sentence: the same input must give the same output every time.
    Have them apply it to the rule they named at the start.

    Close with the direction it runs in. Two inputs may share an output, and that breaks nothing.
    A resident who learns the test backwards starts rejecting good rules. That habit is harder to
    undo than never having had the test.
quantitative: true
practice:
- level: 1
  prompt: |
    A rule multiplies the input by 3 and then adds 2.

    Work out the output for the inputs 0, 1, 5 and 10.
  answer: |
    Multiply first, then add. Take them one at a time.

    ```working
        3 times 0 = 0
        0 plus 2 = 2
    ```

    ```working
        3 times 1 = 3
        3 plus 2 = 5
    ```

    ```working
        3 times 5 = 15
        15 plus 2 = 17
    ```

    ```working
        3 times 10 = 30
        30 plus 2 = 32
    ```

    So the outputs are 2, 5, 17 and 32.

    Notice that the input 0 gave the output 2. An input of nothing does not mean an output of
    nothing, because the rule adds after it multiplies.
- level: 2
  prompt: |
    Three tables are below. For each one, say whether it is a function of its first column, and say
    what told you.

    ```table
    first   second
    1       4
    2       8
    3       12
    ```

    ```table
    first   second
    1       4
    2       8
    1       9
    ```

    ```table
    first   second
    1       4
    2       4
    3       4
    ```
  answer: |
    The first is a function. Each value in the first column appears once, so no input has two
    outputs.

    The second is not. The input 1 appears twice, once with 4 and once with 9. Ask it for the
    output at 1 and it gives you two answers.

    The third is a function. Three different inputs all give 4, and that breaks nothing. The rule
    only forbids one input having two outputs. It says nothing about outputs being shared.

    The third table is the one people get wrong. A column of identical outputs looks broken and is
    not.
- level: 3
  prompt: |
    A rule adds 7 to its input.

    The outputs are 12, 19 and 40. Work out the input that produced each one.
  answer: |
    The rule adds 7, so going backwards means taking 7 away.

    ```working
        12 minus 7 = 5
        19 minus 7 = 12
        40 minus 7 = 33
    ```

    The inputs were 5, 12 and 33.

    Check one of them forwards, which is how you find a slip.

    ```working
        33 plus 7 = 40
    ```

    It comes back to 40, so the third one holds.
- level: 4
  prompt: |
    A district office runs this rule to plan its grain lifting. Let n stand for the number of
    people in a household. The rule gives the kilograms of foodgrains a month that household is
    counted for.

    ```working
        g(n) = 5 times n
    ```

    Say what the domain of that rule is, in words, and say what its range is. Then say what the
    office has done wrong if a row of its planning sheet reads n = 4.5.
  answer: |
    The domain is what the rule will accept. The input counts people in a household, so the inputs
    it has an answer for are the whole numbers from 1 upwards. There is no household of nought
    people and no household of four and a half.

    The range is what the rule can give back. Multiply each of those inputs by five kilograms a
    month and you get 5, 10, 15, 20 and so on, upwards in steps of five.

    ```working
        5 times 1 = 5
        5 times 2 = 10
        5 times 3 = 15
    ```

    So the range is the whole numbers of kilograms a month that are multiples of five, from five
    upwards.

    What the office has done wrong with n = 4.5: it has put an input into the rule that the rule
    does not take. The arithmetic will still produce a number.

    ```working
        5 times 4.5 = 22.5
    ```

    Twenty-two and a half kilograms a month, and nothing about that figure looks wrong on a page.
    That is the whole difficulty. A rule run outside its domain does not stop and does not warn
    you. It answers, and the answer is about no household that exists.

    Where a 4.5 comes from is usually an average household size that somebody has fed into a rule
    built for one household at a time. The fix is to multiply after the rule rather than inside
    it: count the people in the district, then apply the rule to that count.
  refs:
  - nfsa_2013
- level: 5
  prompt: |
    Under section 3(1) of the National Food Security Act, 2013, a person in a priority household is
    entitled to five kilograms of foodgrains a month.

    Work out the grain for a household of three, and for a household of seven. Give each answer
    with its unit. Then work out how many people are in a household counted for 45 kilograms a
    month. Say which way round you ran the rule each time.
  answer: |
    The rule takes a number of people in and gives kilograms a month out. Run it forwards twice.

    ```working
        5 times 3 = 15
    ```

    Fifteen kilograms of foodgrains a month.

    ```working
        5 times 7 = 35
    ```

    Thirty-five kilograms of foodgrains a month.

    The third part runs the rule backwards. You are given the output and asked for the input, so
    undo the multiplying by dividing.

    ```working
        45 divided by 5 = 9
    ```

    Nine people.

    Check it forwards before you write it down.

    ```working
        5 times 9 = 45
    ```

    So the first two parts put an input in and read an output. The third put an output in and
    worked back to the input, which only works because each output here comes from one input.
  refs:
  - nfsa_2013
- level: 6
  prompt: |
    Section 3(1) of the National Food Security Act, 2013 entitles a person in a priority household
    to five kilograms of foodgrains a month. So a household of five is counted for 25 kilograms of
    foodgrains a month.

    Treat the number of months as the input and the total kilograms as the output. Write the rule,
    work out the total for four months, and work out how many months it takes to reach
    150 kilograms. Give every answer with its unit.
  answer: |
    First the rule. Call the number of months m and the total t.

    ```working
        t = 25 times m
    ```

    The input is months, the output is kilograms, so the 25 carries kilograms per month.

    Four months, running it forwards.

    ```working
        25 times 4 = 100
    ```

    A hundred kilograms of foodgrains.

    Now backwards, from an output of 150 kilograms to the input that gives it.

    ```working
        150 divided by 25 = 6
    ```

    Six months.

    Read the unit of the answer off the division to be sure of it. Kilograms divided by kilograms
    per month leaves months standing, which is the check you met in the section on dimensions.
  refs:
  - nfsa_2013
- level: 7
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
        a register lists a household of four counted for 20 kilograms
        it lists another household of four counted for 35 kilograms
        the rule for four people is the average of the two
        20 plus 35 = 55
        55 divided by 2 = 27.5
        so four people gives 27.5 kilograms a month
    ```
  answer: |
    The step that broke is the third one. Everything after it is arithmetic on a decision that
    should never have been taken.

    Two rows with the same input and different outputs mean the register is not a function of
    household size. That is the finding. Averaging does not repair it, because the average is an
    output that neither row records and that no rule produced.

    Look at what the answer now claims. It says a household of four is counted for 27.5 kilograms a
    month, and no household in the register is counted for that.

    What to do instead: find out what differs between the two rows. Either a second input is
    missing from the table, or one of the rows is wrong.

    Why it looks reasonable: averaging two numbers that disagree is a move that is right in other
    places. The arithmetic in lines four and five is correct as well. A correct calculation sitting
    under a wrong decision reads as a finished piece of work.
- level: 9
  prompt: |
    A colleague sends you this line about a block register.

    > Our register lists grain per household each month. Divide any row by five and you get the
    > number of people. So we can drop the people column and save the data entry.

    Decide what to compute, compute it, and say what your answer does not establish.
  answer: |
    What to compute: whether the rule runs backwards, and then whether the register was actually
    built from it.

    Take the rule first. Five kilograms a person a month means the output is the input times five.

    ```working
        5 times 4 = 20
        20 divided by 5 = 4
    ```

    So one output comes from one input, and dividing by five does recover the household size. The
    arithmetic in the proposal is sound.

    Now test it on the register itself. The four-person household counted for 35 kilograms is the
    row that settles it.

    ```working
        35 divided by 5 = 7
    ```

    Seven people, for a household the register elsewhere records as four. So the proposal turns one
    bad row into an invented household of seven, and nothing downstream will show that it happened.

    What this does not establish. It does not tell you whether the 35 is the error or the 4 is.
    The arithmetic cannot say which of the two the register got wrong. It does not tell you how
    many other rows disagree, because you have looked at one. And it says nothing about whether any
    of these households were counted correctly to begin with. Recovering an input from an output
    tells you what the rule would have needed, never what happened.
  refs:
  - nfsa_2013
retrieval_items:
- q: What are a rule's domain and its range, and what is the trap in the second word?
  a: |-
    The domain is the inputs the rule accepts. The range is the outputs it can give back. The trap
    is that statistics uses range for something else entirely, the largest measurement in a set
    minus the smallest, and the two meanings are unrelated.
- q: What is the one requirement that makes a rule a function?
  a: Every input it accepts is attached to exactly one output. Two inputs may share an output, but
    one input may never have two.
- q: You are handed a two-column table. What do you check before computing anything from it?
  a: Whether any value in the input column appears twice with different values beside it. If one
    does, the table is not a function of that column and cannot answer a question about it.
- q: What does f(4) mean, and what does it not mean?
  a: The output the rule named f gives for the input 4. The brackets are not multiplication.
