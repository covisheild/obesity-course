simplified_explanation: |
  Everything you eat is made of atoms.

  An atom has a tiny heavy centre, and a cloud of much lighter particles
  around it, called electrons.

  An atom is mostly space.

  A bond is an attraction between two atoms that holds them together.

  A group of atoms held together by bonds is a molecule. Sugar is a molecule.

  In an ionic bond, one atom hands an electron over to the other. One is left positive, the other
  negative, and opposite charges pull. An atom left carrying a charge this way is called an ion.

  In a covalent bond, the two atoms share a pair of electrons instead of handing them over.

  The energy in a food is held in the arrangement of its atoms. It is in which atom is bonded to
  which, and not in the atoms themselves.

  Pulling a bond apart costs energy. Making a bond gives energy back.

  Most people have that the wrong way round, so say it out loud. Breaking costs. Making pays.

  Strong means it takes a lot of energy to break, and it means nothing else.

  When a food burns, old bonds break and new bonds form. The reaction hands you the difference
  between the two.

  If the new bonds are stronger than the old ones, more comes out than went in. That is heat you
  can measure, and it is what anyone means by the energy in a food.

  A reaction that gives heat out is exothermic. A reaction that takes heat in is endothermic.

  So the energy in a food is not a stuff sitting in it, waiting to be poured out. It is a
  difference between two sums. It shows up only when the arrangement changes.
illustration:
  body: |
    Open OpenStax Chemistry 2e, section 2.3, Atomic Structure and Symbolism, at
    https://openstax.org/books/chemistry-2e/pages/2-3-atomic-structure-and-symbolism. Open your
    browser's find box. Type the words An atom is and press enter.

    Nothing.

    Open section 2.4, Chemical Formulas, at
    https://openstax.org/books/chemistry-2e/pages/2-4-chemical-formulas, and search inside it for
    A molecule is.

    Nothing again.

    So search that page for the word bond instead.

    > (A chemical bond is an attraction between atoms or ions that holds them together in a
    > molecule or a crystal.)

    Search for the claim, not for the heading.

    Open section 7.5, Strengths of Ionic and Covalent Bonds, at
    https://openstax.org/books/chemistry-2e/pages/7-5-strengths-of-ionic-and-covalent-bonds.
    Search inside it for the word Separating.

    > Separating any pair of bonded atoms requires energy.

    Pulling a bond apart costs you energy.

    Search for the word released.

    > ...the energy released when all bonds are formed in the products.

    Two energies, opposite in direction, inside one reaction. Whether the reaction gives you
    anything depends on which of the two is bigger.

    Hydrogen gas is molecules of two hydrogen atoms, joined by one bond each. Chlorine gas is
    molecules of two chlorine atoms, joined by one bond each. Put them together and they make
    hydrogen chloride, in which each hydrogen atom is joined to one chlorine atom.

    Count the bonds with a pencil. Take one hydrogen molecule and one chlorine molecule. Two bonds
    break: the hydrogen-to-hydrogen bond, and the chlorine-to-chlorine bond. Two bonds are then
    made, each one hydrogen to chlorine.

    The page gives you all three numbers, in kilojoules per mole of bonds. A mole is the fixed
    count of things from the section on concentration units (B5).

    ```table
    bond                    energy in kilojoules, per mole of bonds
    hydrogen to hydrogen    436
    chlorine to chlorine    243
    hydrogen to chlorine    432
    ```

    None of them is the energy of a single pair of atoms.

    Energy in, to break the two bonds.

    ```working
        436 plus 243 = 679
    ```

    Energy out, from making the two new bonds.

    ```working
        432 times 2 = 864
    ```

    In, minus out.

    ```working
        679 minus 864 = -185
    ```

    Read the sign before you read the digits. The answer is negative, which means more came out
    than went in. One hundred and eighty-five kilojoules left the reaction as heat.

    A food is molecules. Burning it breaks the bonds inside those molecules, and makes new bonds
    with oxygen from the air. The new bonds are stronger than the old ones. So the sum runs the
    way it just ran for hydrogen and chlorine, and the difference comes out as heat.

    That difference is what anybody means when they say a food contains energy.

    There is no energy sitting in the food the way tea sits in a cup.

    Change the arrangement and you collect the difference. Leave it alone and there is nothing
    there to collect.

    When somebody tells you that a substance releases energy, ask two questions. What gets broken,
    and what gets made. If the answer names only one of the two, you have been handed half a sum.
  numbers:
  - value: '436'
    unit: kilojoules to break the hydrogen-to-hydrogen bond, per mole of bonds broken
    citekey: openstax_chemistry_2e
    quote: the bond energy of the pure covalent H–H bond, DH–H, is 436 kJ per mole of H–H bonds
      broken
  - value: '243'
    unit: kilojoules to break the chlorine-to-chlorine bond, per mole of bonds broken
    citekey: openstax_chemistry_2e
    quote: The energy required to break these bonds is the sum of the bond energy of the H–H bond
      (436 kJ/mol) and the Cl–Cl bond (243 kJ/mol)
  - value: '432'
    unit: kilojoules released when the hydrogen-to-chlorine bond forms, per mole of bonds formed
    citekey: openstax_chemistry_2e
    quote: two moles of H–Cl bonds are formed (bond energy = 432 kJ/mol)
  - value: '864'
    unit: kilojoules released by forming two moles of hydrogen-to-chlorine bonds
    citekey: openstax_chemistry_2e
    quote: two moles of H–Cl bonds are formed (bond energy = 432 kJ/mol), releasing 2 ×× 432 kJ; or
      864 kJ
  - value: '-185'
    unit: kilojoules, the net energy change of hydrogen plus chlorine forming hydrogen chloride
    citekey: openstax_chemistry_2e
    quote: '[436+243]−2(432)=−185kJ'
  analogy_breaks_when: |
    The three bond energies are quoted for a mole of each, not for one pair of atoms. So 185 kilojoules is not what one molecule gives up. No figure here is the
    energy of a single bond you could point at.

    The sum is approximate and the book says so. It gives the difference as approximately the net
    change, not as the net change. Two bonds with the same name in two different molecules are not
    quite the same bond, and the tables carry averages.

    Hydrogen and chlorine is not a food. Nothing about the shape of the sum changes.

    The sum gives you the size of an energy change and tells you nothing about whether the change
    happens, or how fast. Sugar can sit in a jar, in air, for years, unchanged, though burning it
    releases a great deal. Something, such as a flame, has to start it.

    And it tells you nothing about where the energy goes after it leaves.
must_know:
- point: |
    Energy is not a substance sitting inside a food. So refuse any claim that something can
    release a food's energy without changing what its molecules are.
  kind: misconception
  bearing: public
- point: |
    A strong bond is one that takes a lot of energy to break, and that is all the word means. It
    does not mean the bond is holding more energy for you.
  kind: trap
  bearing: methodological
- point: |
    When someone gives you a figure for what a reaction releases, ask what was broken and what
    was made. A figure that names only one side of that is half a sum.
  kind: move
  bearing: methodological
- point: |
    Bond energies give you the size of an energy change and nothing else. They cannot tell you
    whether the reaction happens, or how fast, or what starts it.
  kind: boundary
  bearing: methodological
- point: |
    Teach the two-sided sum before you teach a single step of metabolism. Break, then make, then
    subtract.
  kind: move
  bearing: teaching
- point: |
    A substance that goes into a person and comes out unchanged has supplied nothing, whatever
    the bonds inside it are worth.
  kind: consequence
  bearing: clinical
exercises:
- type: retrieval
  prompt: |
    Without looking back, write down what happens to the energy when a bond breaks, and what
    happens when a bond forms.

    Then write the rule for working out whether a reaction gives heat out or takes heat in.
  answer: |
    Breaking a bond takes energy in. You have to supply it. Pulling two bonded atoms apart always
    costs energy, and a stronger bond costs more.

    Forming a bond gives energy out. The energy is released as the bond is made.

    The rule for the whole reaction. Add up the energy needed to break every bond in the starting
    materials. Add up the energy released by making every bond in the products. Take the second
    away from the first.

    If more comes out than went in, the reaction releases heat. That is the exothermic case, and
    it is what burning a food is.

    If more went in than came out, the reaction takes heat in. That is the endothermic case.

    One thing to check in your own answer. Did you write both halves, or only the breaking half?
    Half a sum is the commonest way this gets remembered. That half is what makes a food look like
    a container with energy in it.
  confidence_first: true
- type: critique
  prompt: |
    A wellness brochure says this. The brochure is made up for this exercise.

    > Our drink is built from molecules with unusually strong chemical bonds. More energy is
    > locked inside each bond, so more energy is released into your body when you drink it.

    Say what is wrong, and say what you would ask for.
  answer: |
    Take the two sentences apart, because they fail in different ways.

    The first sentence uses strong to mean full. A strong bond is one that takes a lot of energy
    to break. The word describes what it costs to pull the bond apart, and nothing at all about
    what the bond will pay out.

    The second sentence then runs the sum backwards. Energy comes out of a reaction when the new
    bonds formed are stronger than the old bonds broken. Starting with unusually strong bonds
    makes the breaking half of the sum bigger, which makes the release smaller, not larger.

    So the brochure has described a drink that would give you less, and sold it as giving you
    more.

    There is a third problem underneath both. The claim talks about energy locked inside a bond,
    as though a bond were a small container. It is not. There is no energy in a bond to be let
    out. There is only a difference between two arrangements, and the difference only exists once
    you say what the second arrangement is.

    What to ask for. First, what the molecules turn into, because a release is a difference
    between a before and an after and they have named only the before. Second, the two totals
    separately: energy to break, energy released on forming. Third, whether the reaction they
    describe happens in a person at all. The size of a possible release says nothing about
    whether anything occurs.
- type: teaching
  prompt: |
    A first-year resident has ten minutes and a whiteboard. They can say that food gives you
    energy and they cannot say where the energy is.

    Teach them where it sits, so that they leave able to check a claim about any substance they
    have not met.
  answer: |
    Ten minutes, a whiteboard, and somebody who has been told the answer without being told the
    reason.

    Draw two dots on the board and a line between them. Say the line is a bond, and that a bond is
    just two atoms attracting each other.

    Now ask them what it would take to pull the two dots apart. They will say effort. Write energy
    in beside it. Then rub the line out, draw it again, and ask what happens on the way back.
    Write energy out.

    Stop there and let that sit, because it is the whole section. Breaking costs. Making pays.

    Now draw four dots: two of one kind, two of another, in two joined pairs. Rub out both lines
    and draw two new lines across the pairs, so each atom is now joined to the other kind. Say out
    loud what you did. Two bonds broken. Two bonds made.

    Write the sum on the board in words. Energy in to break, minus energy out to make. Ask them
    what has to be true for the answer to be a release. They will get it: the new bonds have to be
    stronger than the old ones.

    That is the moment to say the sentence you want them keeping. The energy is in the
    arrangement, not in the atoms.

    Close with the test they can use on Monday. Any time somebody says a substance releases
    energy, ask what it turns into. If they cannot say, they have described a before with no after
    and there is no sum to do.
quantitative: false
retrieval_items:
- q: Where is the energy in a food held?
  a: In the arrangement of its atoms, which is to say in which atom is bonded to which. It is not
    held in the atoms themselves, and it is not a substance inside the food. It appears as a
    difference when the arrangement changes.
- q: What happens to energy when a bond breaks, and when a bond forms?
  a: Breaking a bond takes energy in; separating any pair of bonded atoms requires energy, and a
    stronger bond requires more. Forming a bond gives energy out.
- q: How do you tell whether a reaction releases heat or absorbs it?
  a: Add the energy needed to break every bond in the starting materials, add the energy released
    by forming every bond in the products, and subtract the second from the first. More out than in
    means heat is released, which is called exothermic. More in than out means heat is absorbed,
    which is called endothermic.
- q: What does it mean to call a bond strong?
  a: That it takes a lot of energy to break. Nothing more. It does not mean the bond holds more
    energy available to you, and a molecule built of already-strong bonds has less to release, not
    more.
- q: What are the two kinds of bond this course uses, and how do they differ?
  a: An ionic bond, where one atom transfers an electron to another and the resulting opposite
    charges attract; and a covalent bond, where two atoms share a pair of electrons instead.
    Covalent bonds are the ones this course will keep meeting.
