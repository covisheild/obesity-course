definition:
  text: |
    Tossing a coin n times has 2 to the power n outcomes, one factor of 2 for every toss.

    Independence is checked, not assumed: A and B are independent exactly when P(A and B) — the
    probability that A and B both happen — equals P(A) times P(B), and dependent otherwise. When
    they are independent, multiply to get P(A and B).

    When A and B cannot both happen — they are mutually exclusive — P(A or B), the probability
    that at least one of A or B happens, equals P(A) plus P(B): add.
  references:
