simplified_explanation: |
  Twelve grams against twenty grams is a ratio of twelve to twenty, or three to five.

  If three of every five children in a room had the meal, the proportion is three fifths, or 0.6.
  A proportion can never be more than one.

  Five kilograms a month is a rate. Fifteen deaths per thousand people per year is a rate.

  The bottom of a rate is not a footnote. It is part of the number. Change it and you have a
  different quantity, even when the digits look the same.
illustration:
  body: |
    Go back to section 3(1) of the National Food Security Act, 2013, which you opened two sections
    ago. It gives a person in a priority household five kilograms of foodgrains per person per
    month. This time read the sentence after it.

    A proviso just below sets a different figure for households covered by the Antyodaya Anna
    Yojana. It is thirty-five kilograms of foodgrains per household per month. That figure applies
    to the extent the Central Government specifies for each State under that scheme.

    Here is the sentence somebody writes.

    > Antyodaya households get seven times as much as priority households.

    Look at where that seven came from. Thirty-five divided by five. The arithmetic is perfect and
    the claim is meaningless, because the five is per person and the thirty-five is per household.
    Two different denominators went into one division.

    Make them the same and the picture changes. Take a household of six people.

    ```working
        5 kilograms per person per month, times 6 people
        = 30 kilograms per household per month
    ```

    ```working
        35 against 30
        35 minus 30 = 5 kilograms more
        5 divided by 30 = 0.1666..., so about 17 per cent more
    ```

    Seventeen per cent more, not seven times as much.

    Now change the household and watch the answer move.

    ```working
        household of 7:   5 times 7 = 35, so the two are identical
        household of 3:   5 times 3 = 15, so 35 is more than twice as much
        household of 10:  5 times 10 = 50, so 35 is less
    ```

    The comparison does not have one answer. It depends entirely on the denominator that the
    original sentence dropped.

    One more thing to take from this, because it comes up in every table you will read. Rates for
    uncommon events are written per thousand or per hundred thousand people rather than per person.
    The only reason is to avoid a string of zeros after the point. Fifteen per thousand and 0.015
    per person are the same rate.
  analogy_breaks_when: |
    Making the denominators match is arithmetic. Deciding which denominator is the right one is not,
    and this section cannot help you with it.

    So the conversion above is a tool for catching a false comparison. It is not a way of deciding
    who is better off.

    And a rate per thousand people says nothing about which thousand. One figure for a state can
    hold districts that differ several times over. The rate will not show you that. It was never
    built to.
  numbers:
  - value: '5'
    unit: kilograms of foodgrains per person per month, priority households, s.3(1)
    citekey: nfsa_2013
  - value: '35'
    unit: kilograms of foodgrains per household per month, Antyodaya Anna Yojana households, proviso to s.3(1)
    citekey: nfsa_2013
must_know:
- point: |
    Two rates with different denominators cannot be compared, and dividing one by the other still
    produces a number.
  kind: misconception
  bearing: methodological
- point: |
    Say the denominator out loud before you use any rate: per what, and over how long. If either
    half is missing you do not have a quantity yet.
  kind: move
  bearing: methodological
- point: |
    Indian entitlements and scheme figures move between per person, per household and per
    beneficiary without warning. Read the whole provision, including the proviso, before you take a
    number out of it.
  kind: india_deviation
  bearing: policy
- point: |
    When two schemes are stated on different denominators, find the point at which they are equal
    and quote that.
  kind: move
  bearing: policy
- point: |
    Converting a per-household figure to a per-person one using an average household size assumes
    every household is average.
  kind: boundary
  bearing: methodological
- point: |
    Asked to say which of two programmes delivers more, do not answer with the larger number. Ask
    what each is divided by.
  kind: trap
  bearing: public
- point: |
    Rates per thousand or per hundred thousand exist only to keep the zeros off the page. Convert
    freely, and check the denominator first whenever two tables disagree.
  kind: consequence
  bearing: methodological
exercises:
- type: calculation
  prompt: |
    A block has 1,200 priority households with an average of five people each, and 300 Antyodaya
    households. Use section 3(1) of the National Food Security Act, 2013 and the proviso beneath it.
    Work out the monthly foodgrain entitlement of each group, and of the block as a whole. Then
    state the grain per household per month for each group and say which is higher.
  answer: |
    Priority households first. They are entitled per person, so count the people.

    ```working
        1,200 households times 5 people = 6,000 people
        6,000 people times 5 kilograms per person per month = 30,000 kilograms per month
    ```

    Antyodaya households are entitled per household, so count the households.

    ```working
        300 households times 35 kilograms per household per month = 10,500 kilograms per month
    ```

    The block as a whole.

    ```working
        30,000 plus 10,500 = 40,500 kilograms per month
    ```

    Now put both on the same denominator, which is kilograms per household per month.

    ```working
        priority:   30,000 divided by 1,200 = 25
        Antyodaya:  10,500 divided by 300   = 35
    ```working

    Antyodaya is higher on this denominator, at 35 against 25. Note what did the work: the average
    of five people a household. At an average of seven they would be equal, and above seven the
    priority households would come out ahead.
  confidence_first: true
- type: critique
  prompt: |
    Here is a line from a district presentation.

    > Grain offtake rose from 1,850 tonnes to 2,050 tonnes, so coverage improved by 11 per cent.

    The arithmetic in the percentage is right. Name the step that is missing, and say what you would
    ask for.
  answer: |
    The percentage is a rate of change in tonnes. It is being reported as a change in coverage,
    which is a proportion of people. Those are different quantities and nothing in the line connects
    them.

    Tonnes can rise for at least three reasons that have nothing to do with more people being
    covered.

    - More households on the list.
    - The same households lifting a larger share of what they were already entitled to.
    - A change in what the entitlement is.

    What to ask for, in this order. How many people or households were entitled in each period, so
    the tonnes have a denominator. How much they were entitled to in total. Then the offtake can be
    read as a proportion of the entitlement rather than as a bare weight. Only then does the word
    coverage have anything underneath it.

    And keep the 11 per cent. It is a perfectly good statement about tonnes. It has simply been
    given the wrong noun.
quantitative: true
practice:
- level: 1
  prompt: |
    Reduce each ratio as far as it will go.

    ```working
        18 to 24        45 to 15        200 to 500
    ```
  answer: |
    ```working
        18 to 24    = 3 to 4      (divide both by 6)
        45 to 15    = 3 to 1      (divide both by 15)
        200 to 500  = 2 to 5      (divide both by 100)
    ```

    A ratio reduces the way a fraction does. It is a division written another way.

    None of the three carries a unit. Whatever the 18 and the 24 were measured in has cancelled
    out, and that is what makes a ratio a bare number.
- level: 2
  prompt: |
    Of 250 households in a block, 90 lift their full entitlement. Write that as a ratio of lifting
    to not lifting, and as a proportion of all households.
  answer: |
    The ratio first. Lifting against not lifting means 90 against the rest.

    ```working
        250 minus 90 = 160 not lifting
        90 to 160 = 9 to 16     (divide both by 10)
    ```

    Now the proportion, which is out of all of them.

    ```working
        90 divided by 250 = 0.36
    ```

    Nine to sixteen, and 0.36.

    Notice the two denominators. The ratio is against the 160 who did not; the proportion is
    against all 250. Neither number is wrong and they answer different questions.
- level: 3
  prompt: |
    A rate is 15 per 1,000 people per year. Write the same rate per 100,000 people per year, and
    per person per year.
  answer: |
    Per 100,000 first. That is a hundred times as many people, so a hundred times as many events.

    ```working
        15 times 100 = 1,500 per 100,000 per year
    ```

    Per person, divide by a thousand.

    ```working
        15 divided by 1,000 = 0.015 per person per year
    ```

    One rate, three ways of writing it. Nothing has been measured differently, and none of the
    three is more precise than the others. The denominator was chosen to keep the zeros off the
    page.
- level: 4
  prompt: |
    Section 3(1) of the National Food Security Act, 2013 gives 5 kilograms per person per month. A
    household of four is entitled under it. Work out the household's entitlement per month and per
    year, and state the denominator of each answer.
  answer: |
    ```working
        5 kilograms per person per month, times 4 people
        = 20 kilograms per household per month

        20 times 12 months
        = 240 kilograms per household per year
    ```

    The denominators, said out loud. The first is per household per month. The second is per
    household per year.

    Both had to change together when you multiplied by four: the per-person denominator became a
    per-household one, and that is the step worth watching. The number 20 means nothing until it
    carries "per household per month" with it.
  refs: [nfsa_2013]
- level: 5
  prompt: |
    Under the proviso to section 3(1), an Antyodaya household gets 35 kilograms per household per
    month. Work out the household size at which a priority household on 5 kilograms per person per
    month receives the same amount.
  answer: |
    Put both on the same denominator, which is kilograms per household per month.

    ```working
        priority household of n people = 5 times n
        set that equal to 35
        5 times n = 35
        n = 35 divided by 5
        n = 7
    ```

    Seven people.

    That number is worth carrying. Below seven, an Antyodaya household receives more; above seven,
    a priority household does. "They match at a household of seven" is a sentence that settles an
    argument, and it took one division.
  refs: [nfsa_2013]
- level: 6
  prompt: |
    A block has 3,200 people and records 48 events in a year. A second block has 12,500 people and
    records 160 events in a year. Work out each rate per 1,000 people per year and say which is
    higher.
  answer: |
    First block.

    ```working
        48 divided by 3,200 = 0.015 per person per year
        times 1,000 = 15 per 1,000 per year
    ```

    Second block.

    ```working
        160 divided by 12,500 = 0.0128 per person per year
        times 1,000 = 12.8 per 1,000 per year
    ```

    The first block is higher, at 15 against 12.8, even though it recorded fewer events.

    That reversal is the point of the problem. The raw counts say 48 against 160. The rates say the
    opposite, because the second block has nearly four times the people.
- level: 7
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
        in a block, 72 households lift their full entitlement and 108 do not
        the ratio of lifting to not lifting is 72 to 108, or 2 to 3
        72 divided by 108 = 0.6666...
        so about 67 per cent of households lift their full entitlement
    ```
  answer: |
    The first two lines hold. Seventy-two against 108 is the ratio, and it does reduce to 2 to 3.

    The step that broke is the last one. A ratio has been divided out and the answer read as a
    proportion. A ratio compares one part with another part. A proportion is a part over the whole
    it came from, and the whole here is every household in the block.

    ```working
        72 plus 108 = 180 households in all
        72 divided by 180 = 0.4
        times 100 = 40 per cent lift their full entitlement
    ```

    Forty per cent, not 67.

    The 0.6666 is not a meaningless number. It says the lifting households are two thirds as many
    as the households that do not lift. That is true. It has been given the wrong denominator and
    then the wrong noun.

    Why it looks reasonable: a ratio and a proportion are both one number divided by another, and
    both come out as a decimal. A decimal below one invites being read as a percentage. The check
    is to say the denominator out loud. Divided by 108 is per non-lifting household. Divided by 180
    is per household.
- level: 7
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
        block A: 15 cases per 1,000 people
        block B: 40 cases per 100,000 people
        40 is more than 15, so block B is worse
    ```
  answer: |
    The step that broke is the comparison, which sets two rates side by side without matching their
    denominators.

    Put both on the same denominator.

    ```working
        block A: 15 per 1,000
                 = 15 times 100
                 = 1,500 per 100,000
        block B: 40 per 100,000
    ```

    Block A is nearly forty times block B, not the other way round.

    Why it looks reasonable: both lines end in "people", both numbers are small, and the larger
    number belongs to the block being called worse. Everything about the shape of the sentence is
    right except the only thing that mattered.
- level: 8
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
        a scheme delivers 2 kg per person per week
        a month is 4 weeks
        so it delivers 8 kg per person per month
        a household has 5 people
        so it delivers 8 kg per household per month
    ```
  answer: |
    The first three lines hold. Two kilograms a week for four weeks is eight kilograms a month.

    The step that broke is the last one. The denominator was changed from per person to per
    household with no arithmetic done at all.

    ```working
        8 kilograms per person per month, times 5 people
        = 40 kilograms per household per month
    ```

    Forty, not eight.

    Why it looks reasonable: the household size appears in the line just above, so the reader feels
    it has been used. It has been mentioned. Mentioning a denominator is not the same as dividing
    or multiplying by it.
- level: 9
  prompt: |
    A note crosses your desk with one line in it.

    > Households here average five people, so an Antyodaya household gets 40 per cent more grain.

    Section 3(1) of the National Food Security Act, 2013 gives 5 kilograms per person per month.
    The proviso beneath it gives an Antyodaya household 35 kilograms per household per month.
    Decide what to compute, compute it, and say what your answer does not establish.
  answer: |
    What to compute: both entitlements on one denominator, which is kilograms per household per
    month.

    ```working
        priority household of 5:  5 times 5 = 25 kilograms per household per month
        Antyodaya household:      35 kilograms per household per month
        35 minus 25 = 10
        10 divided by 25 = 0.4, so 40 per cent more
    ```

    The 40 per cent is right, for a household of five.

    Now the part the line hides. It is a statement about the average household, and the average
    household is a calculation rather than an address. Run the same division at other sizes.

    ```working
        household of 3:  5 times 3 = 15, so 35 is well over twice as much
        household of 7:  5 times 7 = 35, so the two are equal
        household of 9:  5 times 9 = 45, so the priority household gets more
    ```

    The gap is 40 per cent at one household size, nothing at all at another, and the other way
    round above seven.

    What this does not establish. It says nothing about how household sizes are spread here. An
    average of five holds whether every household has five people or half have two and half have
    eight. It says nothing about how many households are in either group. And it says nothing
    about whether either figure feeds anybody, which is a different question from which is larger.
  refs: [nfsa_2013]
- level: 10
  prompt: |
    A journalist calls with one line and wants a comment by the evening.

    > District A has twice the case rate of district B, so it needs twice the resources.

    Decide what to compute, compute it, and say what your answer does not establish.
  answer: |
    Nothing can be computed until one thing is known: what each rate is divided by.

    Suppose both are per 1,000 people, and A has 2 lakh people and B has 8 lakh. Then a doubled
    rate is not a doubled count.

    ```working
        district A: 20 per 1,000, times 200 thousand people = 4,000 cases
        district B: 10 per 1,000, times 800 thousand people = 8,000 cases
    ```

    Twice the rate and half the cases. Resources follow people, so the conclusion is backwards.

    Those population figures are made up, to show the move. The move is not. Ask for the two
    denominators before you agree or disagree with the sentence.

    What this does not establish. Even with both counts in hand, nothing here says what resource a
    case needs, or whether the two districts counted cases the same way. A rate comparison decides
    which question to ask next, not what to do.
retrieval_items:
- q: What is the difference between a ratio, a proportion and a rate?
  a: A ratio compares two quantities of the same kind and has no unit. A proportion is a part over the whole it came from and runs from zero to one. A rate is a count divided by the time or the number of people it was counted over.
- q: Why can five kilograms per person per month not be compared directly with thirty-five kilograms per household per month?
  a: The denominators differ. Until the household size is supplied the two numbers are not measuring the same thing, and dividing one by the other still returns a number.
- q: Why are rates written per thousand or per hundred thousand people?
  a: Only to keep a long string of zeros off the page. Fifteen per thousand and 0.015 per person are the same rate.
