must_know:
- point: |
    A conversion factor is not a rule about when to multiply and when to divide. It is a fraction
    equal to one, and which way up you write it is settled by which unit you want to cancel.
  kind: misconception
  bearing: methodological
- point: |
    Inverting the factor is the error to watch for, because the answer it gives looks like an
    ordinary number. Check the unit that fell out of the working. If it is not the unit you were
    asked for, the factor was upside down.
  kind: trap
  bearing: methodological
- point: |
    Write the unit beside every line while you work, not once at the end. The units are what tell
    you the line is right, and a line of bare numbers cannot tell you anything.
  kind: move
  bearing: methodological
- point: |
    Run the size check before you act on any converted dose or dispensed amount. A bigger unit
    gives a smaller number. A smaller unit gives a bigger number. An answer that moved the wrong
    way is wrong, however tidy it looks.
  kind: consequence
  bearing: clinical
- point: |
    There is a conversion factor only between two units of the same kind. Nothing converts
    kilograms to litres, and wanting such a factor means the quantity in your hands is not the
    quantity you think it is.
  kind: boundary
  bearing: methodological
- point: |
    A monthly entitlement becomes a daily figure only by choosing a number of days. You make that
    choice, and no statute makes it for you. Say which number of days you used whenever you quote
    a daily figure built from the five kilograms per person per month in the Act.
  kind: india_deviation
  bearing: policy
  refs: [nfsa_2013]
exercises:
- type: calculation
  prompt: |
    A ward register records a child's height as 96 centimetres. It records a sack of grain as 0.4
    kilograms per packet, with 25 packets to the sack.

    Write the height in metres. Write the sack in grams. Show the factor you used each time, and
    say which unit cancelled.
  answer: |
    The height first. One metre is 100 centimetres, so the factor is 1 m over 100 cm, and the cm
    cancels.

    ```working
        96 cm times 1 m over 100 cm
        = 0.96 m
    ```

    A metre is bigger than a centimetre, so the number had to get smaller. It did.

    Now the sack, in two steps. First the kilograms in the sack.

    ```working
        0.4 kg per packet, times 25 packets
        = 10 kg
    ```

    The packets cancelled there, which is worth noticing: a unit does not have to be a unit of
    measurement to cancel.

    Then kilograms into grams, with the factor the other way up from the height one.

    ```working
        10 kg times 1,000 g over 1 kg
        = 10,000 g
    ```

    Ten thousand grams. A gram is smaller than a kilogram, so the number had to get bigger.
  confidence_first: true
- type: critique
  prompt: |
    A colleague sends you this line and asks you to check it before it goes into a note.

    > Each packet holds 250 millilitres, so the 40-packet carton holds 10 millilitres.

    Say what has gone wrong and give the right answer. Then say what you would have them change in
    how they work, rather than in this one line.
  answer: |
    The arithmetic that produced the 10 is a division by 1,000 somewhere, after a correct
    multiplication.

    ```working
        250 times 40 = 10,000
    ```

    Ten thousand millilitres. The number is right; the unit on it is not.

    A millilitre is a thousandth of a litre, so ten thousand millilitres is ten litres.

    ```working
        10,000 mL times 1 L over 1,000 mL
        = 10 L
    ```

    So the carton holds 10 litres, and the sentence dropped the conversion while keeping its
    result. That is the most dangerous shape of this error, because the 10 survives and only its
    unit is wrong.

    What to change in how they work. Write the unit on every line. Read the unit off the last line,
    rather than deciding it from what the sentence is about. The unit is an output of the working,
    not a label added at the end.
quantitative: true
practice:
- level: 1
  prompt: |
    Convert each of these.

    ```working
        3 km into metres
        4,500 g into kilograms
        2.5 m into centimetres
    ```
  answer: |
    ```working
        3 km times 1,000 m over 1 km      = 3,000 m
        4,500 g times 1 kg over 1,000 g   = 4.5 kg
        2.5 m times 100 cm over 1 m       = 250 cm
    ```

    Check each one for direction. Metres are smaller than kilometres, so 3 became 3,000.
    Kilograms are bigger than grams, so 4,500 became 4.5. Centimetres are smaller than metres, so
    2.5 became 250.
- level: 2
  prompt: |
    Write the conversion factor between kilograms and grams both ways up. Say which one turns
    grams into kilograms, and say why the other one does not.
  answer: |
    One kilogram is 1,000 grams, so the two orientations are these.

    ```working
        1,000 g over 1 kg
        1 kg over 1,000 g
    ```

    Both are equal to one, because the top and the bottom of each are the same mass written two
    ways.

    The one that turns grams into kilograms is 1 kg over 1,000 g. The grams you start with sit on
    the top, the grams in the factor sit on the bottom, and they cancel. Kilograms are left.

    The other one does not cancel anything. Grams on the top, multiplied by grams on the top, give
    grams squared per kilogram, and there is no such quantity in the question.
- level: 3
  prompt: |
    Do each of these with two factors in one line.

    ```working
        2 hours into seconds
        0.75 kg into milligrams
    ```
  answer: |
    Two hours, through minutes.

    ```working
        2 h times 60 min over 1 h times 60 s over 1 min
        = 2 times 60 times 60 s
        = 7,200 s
    ```

    The hours cancel against the hours, then the minutes cancel against the minutes. Seconds are
    left.

    Now the mass, through grams.

    ```working
        0.75 kg times 1,000 g over 1 kg times 1,000 mg over 1 g
        = 0.75 times 1,000 times 1,000 mg
        = 750,000 mg
    ```

    Both answers got bigger, which is right: seconds are smaller than hours and milligrams are
    smaller than kilograms.
- level: 4
  prompt: |
    The proviso to section 3(1) of the National Food Security Act, 2013 covers households under the
    Antyodaya Anna Yojana. It entitles such a household to 35 kilograms of foodgrains per household
    per month. Two limits ride with that figure. The entitlement runs to the extent the Central
    Government specifies for each State under the scheme. And the grain comes at the prices set out
    in Schedule I of the Act.

    Write that 35 kilograms per household per month in grams per household per month, and in
    kilograms per household per year. Keep the whole denominator on every answer. Then say in one
    line what those two limits stop you from saying about any one household.
  answer: |
    Grams first.

    ```working
        35 kg per household per month, times 1,000 g over 1 kg
        = 35,000 g per household per month
    ```

    Now the year. Twelve months make a year, so the factor is 12 months over 1 year, and the
    months cancel.

    ```working
        35 kg per household per month, times 12 months over 1 year
        = 420 kg per household per year
    ```

    Say both denominators out loud. The first is per household per month. The second is per
    household per year. Only one half of the denominator changed in the second conversion, and the
    per-household half was carried through untouched.

    Now the last line. The proviso does not hand 35 kilograms to every Antyodaya household by
    itself. The figure reads "thirty-five kilograms of foodgrains per household per month at the
    prices specified in Schedule I". And the entitlement runs "to such extent as may be specified by
    the Central Government for each State in the said scheme". So you can convert the 35. You cannot
    say, from this clause alone, that a named household in a named State is due 35 kilograms. You
    cannot say it comes free either.

    What the extent is, in that State, is set under the scheme. Look it up before you quote a figure
    for anybody.

    The arithmetic was never the risk here. Quoting a conditional entitlement as a flat quantity is.
  refs: [nfsa_2013]
- level: 5
  prompt: |
    A chart is written in micrograms and the label on the bottle is in milligrams.

    Write 0.25 milligrams in micrograms. Then write 4,000 micrograms in milligrams. State which
    orientation of the factor you used each time.
  answer: |
    One milligram is 1,000 micrograms. The symbol for micro is the Greek letter mu, written µ, so
    a microgram is µg.

    Going down to the smaller unit, put mg on the bottom.

    ```working
        0.25 mg times 1,000 µg over 1 mg
        = 250 µg
    ```

    Going back up to the bigger unit, turn the same factor over.

    ```working
        4,000 µg times 1 mg over 1,000 µg
        = 4 mg
    ```

    Two conversions, one agreement, two orientations. The direction check holds both times: the
    number grew going to the smaller unit and shrank going to the bigger one.
- level: 7
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
        a prescription is written as 0.5 g and the chart wants milligrams
        1 gram is 1,000 milligrams
        0.5 g times 1 g over 1,000 mg
        = 0.0005
        so the chart entry is 0.0005 mg
    ```
  answer: |
    The first two lines hold. The agreement is right: one gram is 1,000 milligrams.

    The step that broke is the third. The factor is upside down. It puts grams on the top, where
    there are already grams, so nothing cancels.

    Turn it over and the grams cancel.

    ```working
        0.5 g times 1,000 mg over 1 g
        = 500 mg
    ```

    Five hundred milligrams, not 0.0005.

    Two checks would each have caught it on its own. The direction check: a milligram is smaller
    than a gram, so the number had to get bigger. And the unit check: the working as written leaves
    grams squared per milligram, which is not a unit anybody prescribes in.

    Why it looks reasonable: the number 0.0005 is small, doses are often small, and the line
    contains the correct agreement one line above. Every ingredient of a right answer is present,
    in the wrong arrangement. That is the shape this error always has, and it is why the unit that
    falls out matters more than the number.
- level: 8
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
        a plot covers 12,000 square metres and the report wants square kilometres
        1 kilometre is 1,000 metres
        12,000 divided by 1,000 = 12
        so the plot covers 12 square kilometres
    ```
  answer: |
    The step that broke is the third one, and what broke it is the square.

    The factor between metres and kilometres was applied once. The quantity is not a length. It is
    a length times a length, so the factor has to be applied twice.

    ```working
        1 km^2 = 1 km times 1 km
               = 1,000 m times 1,000 m
               = 1,000,000 m^2
    ```

    Now convert with that.

    ```working
        12,000 m^2 times 1 km^2 over 1,000,000 m^2
        = 0.012 km^2
    ```

    Twelve thousandths of a square kilometre, not twelve.

    The answer as given is out by a factor of a thousand, which is the factor that was left out.

    Why it looks reasonable: the arithmetic is right, the agreement quoted is right, and the words
    "square kilometres" appear in the answer. Nothing in the line says the square was ignored. The
    guard is to write the unit with its power on every line. Squared metres on one side and plain
    kilometres on the other is a mismatch you can see. The same mismatch written out in words is
    not.
- level: 10
  prompt: |
    In a meeting somebody says this about two strengths of the same medicine.

    > The new tablet is 500 micrograms and the old one was 0.5 milligrams, so the new one is a
    > thousand times stronger.

    Decide what to compute, compute it, and say what your answer does not establish.
  answer: |
    What to compute: both strengths in one unit, so that they can be compared at all. Take
    micrograms.

    ```working
        0.5 mg times 1,000 µg over 1 mg
        = 500 µg
    ```

    The two tablets are the same strength. Five hundred micrograms is 0.5 milligrams, written
    another way.

    The sentence has read a change of unit as a change of amount. That is what a conversion factor
    is for, and it is why multiplying by one is worth a whole section: the amount did not move.

    What this does not establish. It says nothing about whether the two tablets behave the same
    way in a person, because strength is only the amount of drug in them. It says nothing about how
    many tablets are taken or how often. And it says nothing about why the label changed units,
    which is the question actually worth asking in that meeting.
retrieval_items:
- q: Why is a conversion factor equal to one?
  a: Because its top and its bottom are the same quantity written in two different units, and anything divided by itself is one. Multiplying by it changes the name on the quantity and not the quantity.
- q: How do you decide which way up to write a conversion factor?
  a: Put the unit you want to get rid of where it cancels, which is the bottom if it is on the top of the quantity you started with. The unit left over is the unit of the answer.
- q: What is the quickest check that a conversion has gone the right way?
  a: A bigger unit gives a smaller number and a smaller unit gives a bigger number. If the number moved the other way, the factor was upside down.
