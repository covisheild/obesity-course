definition:
  text: |
    A conversion factor is a fraction whose top and bottom are the same quantity written in two
    different units. Because the top and the bottom are equal, the fraction is equal to one.

    Multiplying a quantity by a conversion factor changes the unit the quantity is written in and
    leaves the quantity itself unchanged, because multiplying by one changes nothing.

    Every conversion factor may be written either way up, and the two orientations are both equal
    to one. The orientation to use is the one that puts the unwanted unit where it cancels. A unit
    on the top of one fraction cancels a unit of the same name on the bottom of another, exactly as
    a shared number in a ratio does.

    Several conversion factors may be multiplied in one line, each cancelling the unit the one
    before it left behind.
