definition:
  text: 'A conversion factor is a fraction whose top and bottom are the same quantity written in two

    different units. Because the top and the bottom are equal, the fraction is equal to one.


    The orientation to use is the one that puts the unwanted unit where it cancels.

    '
  references:
  - citekey: openstax_prealgebra_2e
    kind: textbook
    locator: ch. 4, Fractions, on equivalent fractions and multiplying by a fraction equal to one
    verified:
      resolved_id: https://openstax.org/books/prealgebra-2e/pages/1-introduction
