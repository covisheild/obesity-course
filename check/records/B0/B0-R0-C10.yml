simplified_explanation: |
  One kilometre is 1,000 metres. That is an agreement, and you can write it as a fraction in two
  ways.

  ```working
      1,000 m over 1 km
      1 km over 1,000 m
  ```

  Both of those fractions are equal to one. The top and the bottom are the same length, written two
  ways, and any number divided by itself is one.

  Multiplying by one does not change an amount. So you can multiply a length by either of those
  fractions and the length stays the same length. Only the name on it changes.

  Which of the two do you use? The one that cancels the unit you want to get rid of.

  Turn 7 kilometres into metres. You want the km gone, so put km on the bottom.

  ```working
      7 km times 1,000 m over 1 km
      = 7 times 1,000 m
      = 7,000 m
  ```

  The km on the top cancels the km on the bottom, the way a number on the top and the bottom of a
  fraction cancels. Metres are left, which is what you asked for.

  Now do it the wrong way on purpose, so that you know what wrong looks like.

  ```working
      7 km times 1 km over 1,000 m
      = 0.007 km squared per metre
  ```

  Look at what came out. Not just a number of the wrong size, but a unit nobody asked for and
  nobody wants. That is the tell.

  So write the units down while you work, not at the end. If the unit that falls out is not the
  unit you were asked for, the factor was upside down.

  One more habit, and it takes a second. A bigger unit always gives a smaller number, and a smaller
  unit always gives a bigger number. Metres are smaller than kilometres, so 7 km had to come out as
  more than 7 metres. It came out as 7,000. That is the right direction.
illustration:
  body: |
    Take a real entitlement and change its units.

    Section 3(1) of the National Food Security Act, 2013 entitles a person in a priority household
    to five kilograms of foodgrains per person per month. Somebody on a call asks you what that is
    in grams a day.

    Here is the answer that comes back first. It is wrong.

    ```working
        5 divided by 1,000 = 0.005
    ```

    Nothing is wrong with that arithmetic. What is wrong is the choice to divide.

    Watch it fail twice over. A gram is smaller than a kilogram, so the number of grams has to be
    bigger than 5, not smaller. And written out as a factor, the unit that comes out is not grams
    at all.

    ```working
        5 kg times 1 kg over 1,000 g
        = 0.005 kg squared per gram
    ```

    Now do it properly. Put the kg where it cancels.

    ```working
        5 kg per person per month, times 1,000 g over 1 kg
        = 5,000 g per person per month
    ```

    Five thousand grams. Bigger number, smaller unit, as it had to be.

    Now the second step, from a month to a day. There is no agreed number of days in a month, so
    you have to choose one and say so. Take 30 days.

    ```working
        5,000 g per person per month, times 1 month over 30 days
        = 166.67 g per person per day
    ```

    About 167 grams a day.

    You can also run both factors in one line, which is how you will do it once your hands know the
    move. Write the quantity, then each factor, then cancel.

    ```working
        5 kg per person per month
        times 1,000 g over 1 kg
        times 1 month over 30 days
        = 166.67 g per person per day
    ```

    Read the cancelling out loud as you go. The kg cancels against the kg. The month cancels
    against the month. What is left on the top is grams, and what is left on the bottom is a person
    and a day. That is the unit of the answer, and you did not have to decide it separately.

    Now run it backwards, because you will meet the reverse just as often. A store has 45,000 grams
    of a commodity and the register wants kilograms.

    ```working
        45,000 g times 1 kg over 1,000 g
        = 45 kg
    ```

    The same factor, the other way up, chosen for the same reason: it puts the unwanted unit where
    it cancels.
  analogy_breaks_when: |
    The 30 days is a choice, not a fact. Months run from 28 to 31 days, so a daily figure worked
    out this way moves by about a tenth across the year.

    The Act gives a monthly entitlement. The daily figure is yours, and you say so when you quote
    it. "About 167 grams a day, taking a month as 30 days" is honest. "167 grams a day" on its own
    hands your choice to the next person as though the Act had made it.

    And conversion only ever works between two units of the same kind. There is no factor from
    kilograms to litres, or from grams to rupees. If you find yourself wanting one, the thing you
    are converting is not the thing you think it is.
  numbers:
  - value: '5'
    quote: entitled to receive five kilograms of foodgrains per person per month
    unit: kilograms of foodgrains per person per month, priority households, s.3(1)
