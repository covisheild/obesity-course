simplified_explanation: "One kilometre is 1,000 metres. That is an agreement, and you can write it\
  \ as a fraction in two\nways.\n\n```working\n    1,000 m over 1 km\n    1 km over 1,000 m\n```\n\
  \nBoth of those fractions are equal to one.\n\nMultiplying by one does not change an amount. Only\
  \ the name on it changes.\n\nWhich of the two do you use? The one that cancels the unit you want\
  \ to get rid of.\n\nTurn 7 kilometres into metres. You want the km gone, so put km on the bottom.\n\
  \n```working\n    7 km times 1,000 m over 1 km\n    = 7 times 1,000 m\n    = 7,000 m\n```\n\nMetres\
  \ are left, which is what you asked for.\n"
illustration:
  body: "Section 3(1) of the National Food Security Act, 2013 entitles a person in a priority household\n\
    to five kilograms of foodgrains per person per month. Somebody on a call asks you what that is\n\
    in grams a day.\n\nHere is the answer that comes back first. It is wrong.\n\n```working\n    5\
    \ divided by 1,000 = 0.005\n```\n\nNothing is wrong with that arithmetic. What is wrong is the\
    \ choice to divide.\n\nA gram is smaller than a kilogram, so the number of grams has to be bigger\
    \ than 5, not smaller.\nAnd written out as a factor, the unit that comes out is not grams at all.\n\
    \n```working\n    5 kg times 1 kg over 1,000 g\n    = 0.005 kg squared per gram\n```\n\nNow do\
    \ it properly. Put the kg where it cancels.\n\n```working\n    5 kg per person per month, times\
    \ 1,000 g over 1 kg\n    = 5,000 g per person per month\n```\n\nFive thousand grams. Bigger number,\
    \ smaller unit, as it had to be.\n\nThere is no agreed number of days in a month, so you have\
    \ to choose one and say so. Take 30\ndays.\n\n```working\n    5,000 g per person per month, times\
    \ 1 month over 30 days\n    = 166.67 g per person per day\n```\n\nAbout 167 grams a day.\n\nWrite\
    \ the quantity, then each factor, then cancel.\n\n```working\n    5 kg per person per month\n\
    \    times 1,000 g over 1 kg\n    times 1 month over 30 days\n    = 166.67 g per person per day\n\
    ```\n\nA store has 45,000 grams of a commodity and the register wants kilograms.\n\n```working\n\
    \    45,000 g times 1 kg over 1,000 g\n    = 45 kg\n```\n\nThe same factor, the other way up,\
    \ chosen for the same reason: it puts the unwanted unit where\nit cancels.\n"
  analogy_breaks_when: 'The 30 days is a choice, not a fact.


    The Act gives a monthly entitlement. The daily figure is yours, and you say so when you quote

    it.


    And conversion only ever works between two units of the same kind. There is no factor from

    kilograms to litres, or from grams to rupees.

    '
  numbers:
  - value: '5'
    quote: entitled to receive five kilograms of foodgrains per person per month
    unit: kilograms of foodgrains per person per month, priority households, s.3(1)
    citekey: nfsa_2013
    as_of: '2026-09-22'
must_know:
- point: 'A conversion factor is not a rule about when to multiply and when to divide. It is a fraction
    equal to one, and which way up you write it is settled by which unit you want

    to cancel.

    '
  kind: misconception
  bearing: methodological
- point: 'Check the unit that fell out of the working. If it is not the unit you were asked for, the

    factor was upside down.

    '
  kind: trap
  bearing: methodological
- point: 'Write the unit beside every line while you work, not once at the end.

    '
  kind: move
  bearing: methodological
- point: 'Run the size check before you act on any converted dose or dispensed amount. A bigger unit

    gives a smaller number. A smaller unit gives a bigger number.

    '
  kind: consequence
  bearing: clinical
- point: 'There is a conversion factor only between two units of the same kind.

    '
  kind: boundary
  bearing: methodological
- point: 'A monthly entitlement becomes a daily figure only by choosing a number of days. You make
    that

    choice, and no statute makes it for you.

    '
  kind: india_deviation
  bearing: policy
  refs:
  - nfsa_2013
exercises:
- type: calculation
  prompt: 'A ward register records a child''s height as 96 centimetres. It records a sack of grain
    as 0.4

    kilograms per packet, with 25 packets to the sack.


    Write the height in metres. Write the sack in grams. Show the factor you used each time, and

    say which unit cancelled.

    '
  answer: "The height first. One metre is 100 centimetres, so the factor is 1 m over 100 cm, and the\
    \ cm\ncancels.\n\n```working\n    96 cm times 1 m over 100 cm\n    = 0.96 m\n```\n\nA metre is\
    \ bigger than a centimetre, so the number had to get smaller. It did.\n\nNow the sack, in two\
    \ steps. First the kilograms in the sack.\n\n```working\n    0.4 kg per packet, times 25 packets\n\
    \    = 10 kg\n```\n\nThe packets cancelled there, which is worth noticing: a unit does not have\
    \ to be a unit of\nmeasurement to cancel.\n\nThen kilograms into grams, with the factor the other\
    \ way up from the height one.\n\n```working\n    10 kg times 1,000 g over 1 kg\n    = 10,000 g\n\
    ```\n\nTen thousand grams. A gram is smaller than a kilogram, so the number had to get bigger.\n"
  confidence_first: true
- type: critique
  prompt: 'A colleague sends you this line and asks you to check it before it goes into a note.


    > Each packet holds 250 millilitres, so the 40-packet carton holds 10 millilitres.


    Say what has gone wrong and give the right answer. Then say what you would have them change in

    how they work, rather than in this one line.

    '
  answer: "The arithmetic that produced the 10 is a division by 1,000 somewhere, after a correct\n\
    multiplication.\n\n```working\n    250 times 40 = 10,000\n```\n\nTen thousand millilitres. The\
    \ number is right; the unit on it is not.\n\nA millilitre is a thousandth of a litre, so ten thousand\
    \ millilitres is ten litres.\n\n```working\n    10,000 mL times 1 L over 1,000 mL\n    = 10 L\n\
    ```\n\nSo the carton holds 10 litres, and the sentence dropped the conversion while keeping its\n\
    result. That is the most dangerous shape of this error, because the 10 survives and only its\n\
    unit is wrong.\n\nWhat to change in how they work. Write the unit on every line. Read the unit\
    \ off the last line,\nrather than deciding it from what the sentence is about. The unit is an\
    \ output of the working,\nnot a label added at the end.\n"
quantitative: true
practice:
- level: 1
  prompt: "Convert each of these.\n\n```working\n    3 km into metres\n    4,500 g into kilograms\n\
    \    2.5 m into centimetres\n```\n"
  answer: "```working\n    3 km times 1,000 m over 1 km      = 3,000 m\n    4,500 g times 1 kg over\
    \ 1,000 g   = 4.5 kg\n    2.5 m times 100 cm over 1 m       = 250 cm\n```\n\nCheck each one for\
    \ direction. Metres are smaller than kilometres, so 3 became 3,000.\nKilograms are bigger than\
    \ grams, so 4,500 became 4.5. Centimetres are smaller than metres, so\n2.5 became 250.\n"
- level: 2
  prompt: 'Write the conversion factor between kilograms and grams both ways up. Say which one turns

    grams into kilograms, and say why the other one does not.

    '
  answer: "One kilogram is 1,000 grams, so the two orientations are these.\n\n```working\n    1,000\
    \ g over 1 kg\n    1 kg over 1,000 g\n```\n\nBoth are equal to one, because the top and the bottom\
    \ of each are the same mass written two\nways.\n\nThe one that turns grams into kilograms is 1\
    \ kg over 1,000 g. The grams you start with sit on\nthe top, the grams in the factor sit on the\
    \ bottom, and they cancel. Kilograms are left.\n\nThe other one does not cancel anything. Grams\
    \ on the top, multiplied by grams on the top, give\ngrams squared per kilogram, and there is no\
    \ such quantity in the question.\n"
- level: 3
  prompt: "Do each of these with two factors in one line.\n\n```working\n    2 hours into seconds\n\
    \    0.75 kg into milligrams\n```\n"
  answer: "Two hours, through minutes.\n\n```working\n    2 h times 60 min over 1 h times 60 s over\
    \ 1 min\n    = 2 times 60 times 60 s\n    = 7,200 s\n```\n\nThe hours cancel against the hours,\
    \ then the minutes cancel against the minutes. Seconds are\nleft.\n\nNow the mass, through grams.\n\
    \n```working\n    0.75 kg times 1,000 g over 1 kg times 1,000 mg over 1 g\n    = 0.75 times 1,000\
    \ times 1,000 mg\n    = 750,000 mg\n```\n\nBoth answers got bigger, which is right: seconds are\
    \ smaller than hours and milligrams are\nsmaller than kilograms.\n"
- level: 4
  prompt: 'The proviso to section 3(1) of the National Food Security Act, 2013 covers households under
    the

    Antyodaya Anna Yojana. It entitles such a household to 35 kilograms of foodgrains per household

    per month. Two limits ride with that figure. The entitlement runs to the extent the Central

    Government specifies for each State under the scheme. And the grain comes at the prices set out

    in Schedule I of the Act.


    Write that 35 kilograms per household per month in grams per household per month, and in

    kilograms per household per year. Keep the whole denominator on every answer. Then say in one

    line what those two limits stop you from saying about any one household.

    '
  answer: "Grams first.\n\n```working\n    35 kg per household per month, times 1,000 g over 1 kg\n\
    \    = 35,000 g per household per month\n```\n\nNow the year. Twelve months make a year, so the\
    \ factor is 12 months over 1 year, and the\nmonths cancel.\n\n```working\n    35 kg per household\
    \ per month, times 12 months over 1 year\n    = 420 kg per household per year\n```\n\nSay both\
    \ denominators out loud. The first is per household per month. The second is per\nhousehold per\
    \ year. Only one half of the denominator changed in the second conversion, and the\nper-household\
    \ half was carried through untouched.\n\nNow the last line. The proviso does not hand 35 kilograms\
    \ to every Antyodaya household by\nitself. The figure reads \"thirty-five kilograms of foodgrains\
    \ per household per month at the\nprices specified in Schedule I\". And the entitlement runs \"\
    to such extent as may be specified by\nthe Central Government for each State in the said scheme\"\
    . So you can convert the 35. You cannot\nsay, from this clause alone, that a named household in\
    \ a named State is due 35 kilograms. You\ncannot say it comes free either.\n\nWhat the extent\
    \ is, in that State, is set under the scheme. Look it up before you quote a figure\nfor anybody.\n\
    \nThe arithmetic was never the risk here. Quoting a conditional entitlement as a flat quantity\
    \ is.\n"
  refs:
  - nfsa_2013
- level: 5
  prompt: 'A chart is written in micrograms and the label on the bottle is in milligrams.


    Write 0.25 milligrams in micrograms. Then write 4,000 micrograms in milligrams. State which

    orientation of the factor you used each time.

    '
  answer: "One milligram is 1,000 micrograms. The symbol for micro is the Greek letter mu, written\
    \ µ, so\na microgram is µg.\n\nGoing down to the smaller unit, put mg on the bottom.\n\n```working\n\
    \    0.25 mg times 1,000 µg over 1 mg\n    = 250 µg\n```\n\nGoing back up to the bigger unit,\
    \ turn the same factor over.\n\n```working\n    4,000 µg times 1 mg over 1,000 µg\n    = 4 mg\n\
    ```\n\nTwo conversions, one agreement, two orientations. The direction check holds both times:\
    \ the\nnumber grew going to the smaller unit and shrank going to the bigger one.\n"
- level: 7
  prompt: "Here is a worked answer. Find the step that broke.\n\n```working\n    a prescription is\
    \ written as 0.5 g and the chart wants milligrams\n    1 gram is 1,000 milligrams\n    0.5 g times\
    \ 1 g over 1,000 mg\n    = 0.0005\n    so the chart entry is 0.0005 mg\n```\n"
  answer: "The first two lines hold. The agreement is right: one gram is 1,000 milligrams.\n\nThe\
    \ step that broke is the third. The factor is upside down. It puts grams on the top, where\nthere\
    \ are already grams, so nothing cancels.\n\nTurn it over and the grams cancel.\n\n```working\n\
    \    0.5 g times 1,000 mg over 1 g\n    = 500 mg\n```\n\nFive hundred milligrams, not 0.0005.\n\
    \nTwo checks would each have caught it on its own. The direction check: a milligram is smaller\n\
    than a gram, so the number had to get bigger. And the unit check: the working as written leaves\n\
    grams squared per milligram, which is not a unit anybody prescribes in.\n\nWhy it looks reasonable:\
    \ the number 0.0005 is small, doses are often small, and the line\ncontains the correct agreement\
    \ one line above. Every ingredient of a right answer is present,\nin the wrong arrangement. That\
    \ is the shape this error always has, and it is why the unit that\nfalls out matters more than\
    \ the number.\n"
- level: 8
  prompt: "Here is a worked answer. Find the step that broke.\n\n```working\n    a plot covers 12,000\
    \ square metres and the report wants square kilometres\n    1 kilometre is 1,000 metres\n    12,000\
    \ divided by 1,000 = 12\n    so the plot covers 12 square kilometres\n```\n"
  answer: "The step that broke is the third one, and what broke it is the square.\n\nThe factor between\
    \ metres and kilometres was applied once. The quantity is not a length. It is\na length times\
    \ a length, so the factor has to be applied twice.\n\n```working\n    1 km^2 = 1 km times 1 km\n\
    \           = 1,000 m times 1,000 m\n           = 1,000,000 m^2\n```\n\nNow convert with that.\n\
    \n```working\n    12,000 m^2 times 1 km^2 over 1,000,000 m^2\n    = 0.012 km^2\n```\n\nTwelve\
    \ thousandths of a square kilometre, not twelve.\n\nThe answer as given is out by a factor of\
    \ a thousand, which is the factor that was left out.\n\nWhy it looks reasonable: the arithmetic\
    \ is right, the agreement quoted is right, and the words\n\"square kilometres\" appear in the\
    \ answer. Nothing in the line says the square was ignored. The\nguard is to write the unit with\
    \ its power on every line. Squared metres on one side and plain\nkilometres on the other is a\
    \ mismatch you can see. The same mismatch written out in words is\nnot.\n"
- level: 10
  prompt: 'In a meeting somebody says this about two strengths of the same medicine.


    > The new tablet is 500 micrograms and the old one was 0.5 milligrams, so the new one is a

    > thousand times stronger.


    Decide what to compute, compute it, and say what your answer does not establish.

    '
  answer: "What to compute: both strengths in one unit, so that they can be compared at all. Take\n\
    micrograms.\n\n```working\n    0.5 mg times 1,000 µg over 1 mg\n    = 500 µg\n```\n\nThe two tablets\
    \ are the same strength. Five hundred micrograms is 0.5 milligrams, written\nanother way.\n\n\
    The sentence has read a change of unit as a change of amount. That is what a conversion factor\n\
    is for, and it is why multiplying by one is worth a whole section: the amount did not move.\n\n\
    What this does not establish. It says nothing about whether the two tablets behave the same\n\
    way in a person, because strength is only the amount of drug in them. It says nothing about how\n\
    many tablets are taken or how often. And it says nothing about why the label changed units,\n\
    which is the question actually worth asking in that meeting.\n"
retrieval_items:
- q: Why is a conversion factor equal to one?
  a: Because its top and its bottom are the same quantity written in two different units, and anything
    divided by itself is one. Multiplying by it changes the name on the quantity and not the quantity.
- q: How do you decide which way up to write a conversion factor?
  a: Put the unit you want to get rid of where it cancels, which is the bottom if it is on the top
    of the quantity you started with. The unit left over is the unit of the answer.
- q: What is the quickest check that a conversion has gone the right way?
  a: A bigger unit gives a smaller number and a smaller unit gives a bigger number. If the number
    moved the other way, the factor was upside down.
