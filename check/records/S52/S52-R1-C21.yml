simplified_explanation: |
  Here is the trap with a script that works on your computer. While you work, R remembers. Every
  object you made, in the script or typed in the console, sits in the workspace. Every package you
  loaded stays loaded. Your script can use all of that without saying where it came from. Then a
  colleague runs it on their computer, where none of it exists, and it stops.

  So test the script the way a stranger would run it. Start a new R with nothing in it, and run
  every line from the top. There are two ways to do that.

  - In RStudio, restart R (the menu Session, then Restart R), then run the whole script.
  - In a terminal, in the project folder, type one command: `Rscript code/analysis.R`. It starts a
    new R, runs the file from the first line to the last, and stops at the first error.

  The second way is the one to write in your README, because it is one line anyone can type.

  If the script passes, three more habits make its result the same every time.

  - It writes every table and figure into `output/` with code. Nothing is copied off the screen.
  - If any step is random, `set.seed()` comes first, with a number you choose. The same seed gives
    the same "random" picks on every run.
  - Its last line is `sessionInfo()`, which prints the version of R and of each package. That is
    the record of what made the result.

  Two tools for later rungs grow out of this. Git keeps a record of every change to the script. You
  meet it in the next rung of this subject. renv fixes the package versions, so that another
  computer uses the same ones. It comes two rungs up.
illustrations:
- body: |
    Start with a script that works for you and for nobody else. An hour ago, exploring the penguin
    file, you typed these lines in the console:

    ```r
    library(readr)
    library(dplyr)

    penguins_raw <- read_csv(
      here::here("data-raw", "penguins_raw.csv"),
      show_col_types = FALSE
    )
    ```

    ```output

    Attaching package: ‘dplyr’

    The following objects are masked from ‘package:stats’:

        filter, lag

    The following objects are masked from ‘package:base’:

        intersect, setdiff, setequal, union
    ```

    Then you tried a few things, and saved the line worth keeping as your script, `code/analysis.R`:

    ```r file=code/analysis.R
    library(dplyr)

    penguins_raw |>
      count(Island)
    ```

    Select all of it in the editor and run it. Your session runs these lines:

    ```r
    library(dplyr)

    penguins_raw |>
      count(Island)
    ```

    ```output
    # A tibble: 3 × 2
      Island        n
      <chr>     <int>
    1 Biscoe      168
    2 Dream       124
    3 Torgersen    52
    ```

    It works. Now run it the way anyone else would. Open a terminal in the project folder and type
    the one command:

    ```sh error
    Rscript code/analysis.R
    ```

    ```output

    Attaching package: ‘dplyr’

    The following objects are masked from ‘package:stats’:

        filter, lag

    The following objects are masked from ‘package:base’:

        intersect, setdiff, setequal, union

    Error: object 'penguins_raw' not found
    Execution halted
    ```

    Read the error literally. The new R has no object called `penguins_raw`. Nothing in the script
    makes one. In your session it existed because you typed the reading line in the console an
    hour ago. The script was never complete. Your workspace was hiding the gap.

    Trisovic and colleagues reran R files that researchers had shared alongside published studies,
    and {{n:trisovic_fail_initial_pct}} failed to complete without error the first time they were
    run, as the last section showed. "Object not found" was one of the errors they met, and they write that it is "often
    related to missing files or incomplete code". This one is incomplete code.

    Fix it in the script, not in the session. Put the packages first, then the reading line:

    ```r file=code/analysis.R
    library(readr)
    library(dplyr)
    library(here)

    penguins_raw <- read_csv(
      here("data-raw", "penguins_raw.csv"),
      show_col_types = FALSE
    )

    penguins_raw |>
      count(Island)
    ```

    Run the same command again:

    ```sh
    Rscript code/analysis.R
    ```

    ```output

    Attaching package: ‘dplyr’

    The following objects are masked from ‘package:stats’:

        filter, lag

    The following objects are masked from ‘package:base’:

        intersect, setdiff, setequal, union

    here() starts at ~/project
    # A tibble: 3 × 2
      Island        n
      <chr>     <int>
    1 Biscoe      168
    2 Dream       124
    3 Torgersen    52
    ```

    The same three counts, now from a script that makes everything it uses. Notice that `Rscript`
    printed the table without being asked. It prints what each line returns, just as the console
    does.
  analogy_breaks_when: |
    The fresh run catches what the script takes from your session: objects, attached packages, a
    working directory you set by hand. It does not catch what the script takes from your computer.
    A package that is installed on your computer and not on your colleague's still stops the script
    on theirs, at its `library()` line. A different version of a package may run without any error
    and give a different result.

    `Rscript` also stops at the first error. A script with three problems shows you one at a time.
    Fix it and run it again until it reaches the last line.
- body: |
    Now the second trap: clearing the workspace by hand looks like a fresh start and is not one.
    The function `rm()` removes objects. `rm(list = ls())` removes every object the workspace lists.
    Run it, then ask what is left:

    ```r
    rm(list = ls())
    ls()
    search()
    ```

    ```output
    character(0)
     [1] ".GlobalEnv"        "package:dplyr"     "package:readr"
     [4] "package:stats"     "package:graphics"  "package:grDevices"
     [7] "package:utils"     "package:datasets"  "package:methods"
    [10] "Autoloads"         "package:base"
    ```

    `ls()` prints `character(0)`, an empty list: no objects. But `search()`, which lists where R
    looks for a name, still shows `package:dplyr` and `package:readr`. They are still loaded. A
    script that forgot `library(dplyr)` would still find `count()` here, and stop on your
    colleague's computer. Only a new R clears both. In RStudio that is Session, then Restart R, or
    Ctrl + Shift + F10, followed by Ctrl + Shift + S to run the whole script. In a terminal it is
    `Rscript`.

    The same holds for `source()`. It reads a file and runs its lines in your current workspace, so
    a script run with `source()` can still lean on objects and packages you already have. Use it
    only straight after a restart.

    Now make the one command produce everything. Two more things go into the script. The first is a
    random step. Suppose you want five rows picked at random, to check by hand against the field
    notebooks. The function `sample()` picks at random, and `sample(344, 5)` picks five of the whole
    numbers from 1 to 344. Each run picks different ones, unless you set the seed first. The seed is
    the starting point R's random numbers are worked out from. See what it does:

    ```r
    set.seed(2026)
    sample(344, 5)
    set.seed(2026)
    sample(344, 5)
    set.seed(7)
    sample(344, 5)
    ```

    ```output
    [1] 221 121 294  45 111
    [1] 221 121 294  45 111
    [1] 298 103 194 271 218
    ```

    The same seed gives the same five rows. A different seed gives different ones. The seed is a
    number you choose and write in the script, so the next person gets your five rows, not their
    own.

    The second is `sessionInfo()` as the last line. Here is the whole script:

    ```r file=code/analysis.R
    # analysis.R: penguin rows by island, and five rows to check by hand
    # Run from the project folder: Rscript code/analysis.R

    library(readr)
    library(dplyr)
    library(here)

    penguins_raw <- read_csv(
      here("data-raw", "penguins_raw.csv"),
      show_col_types = FALSE
    )

    dir.create(here("output"), showWarnings = FALSE)

    island_counts <- penguins_raw |>
      count(Island)
    write_csv(island_counts, here("output", "island_counts.csv"))

    # Five row numbers, picked at random, to check against the
    # field notebooks. The seed makes the same five come out every run.
    set.seed(2026)
    rows_to_check <- tibble(row = sample(nrow(penguins_raw), 5))
    write_csv(rows_to_check, here("output", "rows_to_check.csv"))

    sessionInfo()
    ```

    `dir.create()` makes the `output` folder if it is not there, and `showWarnings = FALSE` keeps
    it quiet when it is. Without that line the script would stop on a fresh copy of the project,
    where `output/` does not exist yet. `write_csv()` writes a table to a CSV file, as in the
    section on summaries by group. `tibble()` makes a small table, here with one column, `row`.

    Run it:

    ```sh
    Rscript code/analysis.R
    ```

    ```output

    Attaching package: ‘dplyr’

    The following objects are masked from ‘package:stats’:

        filter, lag

    The following objects are masked from ‘package:base’:

        intersect, setdiff, setequal, union

    here() starts at ~/project
    R version 4.3.3 (2024-02-29)
    Platform: x86_64-pc-linux-gnu (64-bit)
    Running under: Ubuntu 24.04.5 LTS

    Matrix products: default
    BLAS:   /usr/lib/x86_64-linux-gnu/blas/libblas.so.3.12.0
    LAPACK: /usr/lib/x86_64-linux-gnu/lapack/liblapack.so.3.12.0

    locale:
     [1] LC_CTYPE=C.utf8       LC_NUMERIC=C          LC_TIME=C.utf8
     [4] LC_COLLATE=C.utf8     LC_MONETARY=C.utf8    LC_MESSAGES=C.utf8
     [7] LC_PAPER=C.utf8       LC_NAME=C             LC_ADDRESS=C
    [10] LC_TELEPHONE=C        LC_MEASUREMENT=C.utf8 LC_IDENTIFICATION=C

    time zone: UTC
    tzcode source: system (glibc)

    attached base packages:
    [1] stats     graphics  grDevices utils     datasets  methods   base

    other attached packages:
    [1] here_1.0.1  dplyr_1.1.4 readr_2.1.5

    loaded via a namespace (and not attached):
     [1] utf8_1.2.4       R6_2.5.1         bit_4.0.5        tidyselect_1.2.0
     [5] tzdb_0.4.0       magrittr_2.0.3   glue_1.7.0       tibble_3.2.1
     [9] parallel_4.3.3   pkgconfig_2.0.3  bit64_4.0.5      generics_0.1.3
    [13] lifecycle_1.0.4  cli_3.6.2        fansi_1.0.5      vctrs_0.6.5
    [17] compiler_4.3.3   rprojroot_2.0.4  tools_4.3.3      hms_1.1.3
    [21] pillar_1.9.0     crayon_1.5.2     rlang_1.1.3      vroom_1.6.5
    ```

    Nothing else printed, because the script writes its tables to files. Look in `output/`, and read
    one back as plain text:

    ```sh
    ls output
    cat output/rows_to_check.csv
    ```

    ```output
    island_counts.csv
    rows_to_check.csv
    row
    221
    121
    294
    45
    111
    ```

    The five row numbers in the file are the five from `set.seed(2026)` above. Now read the record
    at the bottom of the run. The first line names R {{n:r_version}}. Under "other attached
    packages" are the three this script loaded, each with its version: here {{n:here_version}},
    dplyr {{n:dplyr_version}}, readr {{n:readr_version}}. "Running under" names the computer's
    operating system. Anyone who gets a different answer from your script can compare their own
    `sessionInfo()` with yours, line by line.
  analogy_breaks_when: |
    `sessionInfo()` records the versions. It does not install them. A colleague with a newer dplyr
    can read that you used {{n:dplyr_version}} and still have to find and install the old version by
    hand. Pinning versions so that another computer gets the same ones is what renv does, two rungs
    up.

    A seed makes a random step repeat on the same version of R. It does not make the five rows a
    good sample, and it does not promise the same five on a version of R whose random-number method
    has changed. That is why the seed and the R version are both recorded.
must_know:
- point: |
    The error is to think that a script which runs on your computer is a script that runs. Your
    session may be supplying an object or a package the script never makes. Before you send a
    script to anyone, run it with `Rscript code/analysis.R` from the project folder. Send it only
    when it reaches the last line.
  kind: misconception
  bearing: methodological
- point: |
    `rm(list = ls())` empties the workspace and leaves every package loaded. `source()` runs a
    file in the workspace you already have. Neither is a fresh session. Restart R, or use
    `Rscript`.
  kind: trap
  bearing: methodological
- point: |
    When a script stops with "object not found" on someone else's computer, look for the line
    that makes that object. If it is missing, the line lived only in your console. Add it to the
    script, above the line that uses the object.
  kind: move
  bearing: methodological
- point: |
    Put `set.seed()` with a number you write down before any random step: a random sample of rows
    to check, a random allocation, a simulation. Without it nobody, including you next month, can
    get the same picks again.
  kind: move
  bearing: methodological
- point: |
    End every analysis script with `sessionInfo()`, and keep its printout with the outputs. When a
    reviewer reruns your work and gets a different number, the version lines are the first place
    to look.
  kind: move
  bearing: methodological
  refs:
  - trisovic_2022
- point: |
    A number in your thesis that you typed from the screen has no line of code behind it. Write
    every table to `output/` with code, and copy numbers into the text from those files. Rung 2 of
    this subject teaches a document in which the code writes the number itself.
  kind: consequence
  bearing: methodological
- point: |
    A trainee says "it runs, I checked". Ask how. If the answer is "I ran it in RStudio", ask them
    to restart R and run it again in front of you. The test takes one minute, and it is the one
    their examiner, or their reader, will do.
  kind: move
  bearing: teaching
- point: |
    One command in a fresh session tests the script against your computer only. It cannot show
    that a colleague with other package versions gets the same numbers, and it cannot show that
    the numbers are right. Say "it reruns on my computer", and no more, until someone else has run it.
  kind: boundary
  bearing: methodological
exercises:
- type: retrieval
  prompt: |
    Without looking back, say what "hidden state" is. Name the one command that tests a script for
    it. Say why `rm(list = ls())` is not enough.
  answer: |
    Hidden state is anything a script uses that the script did not make. It may be an object typed
    in the console, a package loaded earlier or a file made by hand.

    The command is `Rscript code/analysis.R`, typed in a terminal in the project folder. It starts
    a new R and runs the file from the first line to the last.

    `rm(list = ls())` removes the objects and leaves the packages loaded, so a script that forgot a
    `library()` line would still run.
- type: build
  prompt: |
    Take the script you have been building through this book. Restart R, or open a terminal in the
    project folder, and run it with `Rscript code/analysis.R`. Fix every error in the script, one at
    a time, until it reaches the last line. Then make sure that it writes its outputs to `output/`
    with code, that any random step follows `set.seed()`, and that it ends with `sessionInfo()`.
    Delete `output/` and run the command again. Write the command into your README.
  answer: |
    There is no single right script. Check yours against these:

    1. `Rscript code/analysis.R`, from the project folder, runs to the end with no error.
    2. Every `library()` line the script needs is in the script, at the top.
    3. The raw file is read in the script, with `here()`, from `data-raw/`.
    4. The script makes `output/` if it is missing (`dir.create()`), and every table and figure is
       written there by a line of code.
    5. A seed set with `set.seed()` comes before any random step.
    6. The last line is `sessionInfo()`.
    7. After you delete `output/` and run the command again, every output comes back.
    8. The README's "To rerun" line is that exact command.

    If any of these fails, the script still depends on something outside it.
  skill_ref: S52-R1-K01
- type: teaching
  prompt: |
    A journalist has three minutes. A research group has just been told that its published analysis
    "does not reproduce". The journalist asks what that usually means, and whether it means the
    result is false. Answer them.
  answer: |
    Usually it means that someone took the group's data and code and could not get the code to
    run, or got a different number. One study reran thousands of R files shared with published
    papers, and most failed to run to the end without an error the first time. Common causes are dull ones: a file kept
    in a folder only the author had, a missing step, a package that has since changed.

    So "does not reproduce" says that the analysis cannot be checked as it stands. It does not say
    that the result is false. It says nobody can yet show that it is true.

    The quotable sentence: "If an analysis cannot be rerun, you cannot tell whether it is wrong,
    and neither can its authors."
quantitative: true
practice_note: |
  Ten problems. The technique is one test, a fresh run, and the mechanical band covers its three
  parts (a seed, an empty workspace, loaded packages). The weight is on the diagnostic and transfer
  bands, because hidden state shows itself only when the code meets a second session.
practice:
- level: 1
  prompt: |
    Predict whether these lines print the same three numbers twice, then run them.

    ```r norun
    set.seed(11)
    sample(10, 3)
    set.seed(11)
    sample(10, 3)
    ```
  answer: |
    ```r
    set.seed(11)
    sample(10, 3)
    set.seed(11)
    sample(10, 3)
    ```

    ```output
    [1] 10  2  8
    [1] 10  2  8
    ```

    The same three, because the seed is set to the same number before each pick.
- level: 2
  prompt: |
    Predict what the last line prints, then run all three.

    ```r norun
    height_cm <- c(132, 141, 150)
    rm(list = ls())
    exists("height_cm")
    ```
  answer: |
    ```r
    height_cm <- c(132, 141, 150)
    rm(list = ls())
    exists("height_cm")
    ```

    ```output
    [1] FALSE
    ```

    `rm(list = ls())` removed every object, so `height_cm` no longer exists. `exists()` asks whether
    an object of that name exists, and answers FALSE.
- level: 3
  prompt: |
    Predict what the last line prints, then run all three. Does `rm(list = ls())` unload dplyr?

    ```r norun
    library(dplyr)
    rm(list = ls())
    "package:dplyr" %in% search()
    ```
  answer: |
    ```r
    library(dplyr)
    rm(list = ls())
    "package:dplyr" %in% search()
    ```

    ```output

    Attaching package: ‘dplyr’

    The following objects are masked from ‘package:stats’:

        filter, lag

    The following objects are masked from ‘package:base’:

        intersect, setdiff, setequal, union

    [1] TRUE
    ```

    TRUE. dplyr is still on the list of places R searches. `rm()` removes objects, not packages.
    The operator `%in%` asks whether the text on its left is among the values on its right.
- level: 4
  prompt: |
    Write a script, `code/analysis.R`, that reads the penguin file from `data-raw/`, counts the rows
    of each species, and writes the counts to `output/species_counts.csv`. It must run on a fresh
    copy of the project, where `output/` does not exist. Run it with `Rscript`, then show the file it
    wrote.
  answer: |
    ```r file=code/analysis.R
    library(readr)
    library(dplyr)
    library(here)

    penguins_raw <- read_csv(
      here("data-raw", "penguins_raw.csv"),
      show_col_types = FALSE
    )

    dir.create(here("output"), showWarnings = FALSE)

    species_counts <- penguins_raw |>
      count(Species)
    write_csv(species_counts, here("output", "species_counts.csv"))
    ```

    ```sh
    Rscript code/analysis.R
    cat output/species_counts.csv
    ```

    ```output

    Attaching package: ‘dplyr’

    The following objects are masked from ‘package:stats’:

        filter, lag

    The following objects are masked from ‘package:base’:

        intersect, setdiff, setequal, union

    here() starts at ~/project
    Species,n
    Adelie Penguin (Pygoscelis adeliae),152
    Chinstrap penguin (Pygoscelis antarctica),68
    Gentoo penguin (Pygoscelis papua),124
    ```

    152, 68 and 124 rows, which add up to {{n:penguins_rows}}. These are rows of the file, one per
    nesting observation, not counts of birds. The `dir.create()` line is what lets the script run
    on a copy with no `output/` folder.
- level: 5
  prompt: |
    Write a script that loads readr and dplyr and ends with `sessionInfo()`. Run it with `Rscript`,
    and read off the version of dplyr that produced the result. Then get the same version number
    with one line of code instead of reading it by eye.
  answer: |
    ```r file=code/analysis.R
    library(readr)
    library(dplyr)

    sessionInfo()
    ```

    ```sh
    Rscript code/analysis.R
    ```

    ```output

    Attaching package: ‘dplyr’

    The following objects are masked from ‘package:stats’:

        filter, lag

    The following objects are masked from ‘package:base’:

        intersect, setdiff, setequal, union

    R version 4.3.3 (2024-02-29)
    Platform: x86_64-pc-linux-gnu (64-bit)
    Running under: Ubuntu 24.04.5 LTS

    Matrix products: default
    BLAS:   /usr/lib/x86_64-linux-gnu/blas/libblas.so.3.12.0
    LAPACK: /usr/lib/x86_64-linux-gnu/lapack/liblapack.so.3.12.0

    locale:
     [1] LC_CTYPE=C.utf8       LC_NUMERIC=C          LC_TIME=C.utf8
     [4] LC_COLLATE=C.utf8     LC_MONETARY=C.utf8    LC_MESSAGES=C.utf8
     [7] LC_PAPER=C.utf8       LC_NAME=C             LC_ADDRESS=C
    [10] LC_TELEPHONE=C        LC_MEASUREMENT=C.utf8 LC_IDENTIFICATION=C

