    loaded via a namespace (and not attached):
     [1] utf8_1.2.4       R6_2.5.1         tidyselect_1.2.0 tzdb_0.4.0
     [5] magrittr_2.0.3   glue_1.7.0       tibble_3.2.1     pkgconfig_2.0.3
     [9] generics_0.1.3   lifecycle_1.0.4  cli_3.6.2        fansi_1.0.5
    [13] vctrs_0.6.5      compiler_4.3.3   hms_1.1.3        pillar_1.9.0
    [17] rlang_1.1.3
    ```

    Under "other attached packages", `dplyr_1.1.4` says dplyr version {{n:dplyr_version}}. The same
    number in one line, as the section on packages showed:

    ```r
    packageVersion("dplyr")
    ```

    ```output
    [1] ‘1.1.4’
    ```

    Your own computer may print a newer version. Then your outputs may differ from this book's,
    and the version line tells you why.
- level: 6
  prompt: |
    You want ten penguin rows picked at random, for a colleague to check against the field
    notebooks. She must get the same ten when she runs your script. Write the lines that pick ten
    row numbers from the penguin file with seed 52. Show that running them twice gives the same ten.
  answer: |
    ```r
    library(readr)

    penguins_raw <- read_csv(
      here::here("data-raw", "penguins_raw.csv"),
      show_col_types = FALSE
    )

    set.seed(52)
    first <- sample(nrow(penguins_raw), 10)
    set.seed(52)
    second <- sample(nrow(penguins_raw), 10)

    first
    identical(first, second)
    ```

    ```output
     [1]  82 179 339 317 133 142  55 220 273 117
    [1] TRUE
    ```

    `nrow(penguins_raw)` is {{n:penguins_rows}}, so the picks are row numbers from 1 to 344.
    `identical()` asks whether two objects are exactly the same, and answers TRUE. In the script,
    `set.seed(52)` goes once, directly above the pick. The same ten come out for anyone who runs it
    on the same version of R.
- level: 7
  prompt: |
    Meera's script reports the mean body mass of the penguins. Earlier in the same session she had
    typed two lines in the console. Here is everything her session ran, and what it printed:

    ```r
    library(readr)
    library(dplyr)
    penguins_raw <- read_csv(here::here("data-raw", "penguins_raw.csv"),
                             show_col_types = FALSE)
    penguins_raw <- penguins_raw |>
      filter(Island == "Biscoe")
    ```

    ```output

    Attaching package: ‘dplyr’

    The following objects are masked from ‘package:stats’:

        filter, lag

    The following objects are masked from ‘package:base’:

        intersect, setdiff, setequal, union
    ```

    Her script, `code/analysis.R`, run line by line in that session:

    ```r
    library(dplyr)
    penguins_raw |>
      summarise(mean_mass_g = mean(`Body Mass (g)`, na.rm = TRUE))
    ```

    ```output
    # A tibble: 1 × 1
      mean_mass_g
            <dbl>
    1       4716.
    ```

    She writes "mean body mass 4716 g" in her draft. What broke, and what is the right number for
    the whole file?
  answer: |
    The script uses `penguins_raw` without making it. In her session that object was the Biscoe
    rows only, because of the second console line. So 4716 g is the mean for one island, and the
    script does not say so. It looks reasonable because it is a real mean of real penguins.

    Save her script and run it as a stranger would:

    ```r file=code/analysis.R
    library(dplyr)
    penguins_raw |>
      summarise(mean_mass_g = mean(`Body Mass (g)`, na.rm = TRUE))
    ```

    ```sh error
    Rscript code/analysis.R
    ```

    ```output

    Attaching package: ‘dplyr’

    The following objects are masked from ‘package:stats’:

        filter, lag

    The following objects are masked from ‘package:base’:

        intersect, setdiff, setequal, union

    Error: object 'penguins_raw' not found
    Execution halted
    ```

    The fresh run finds the gap at once. Add the packages and the reading line to the script:

    ```r file=code/analysis.R
    library(readr)
    library(dplyr)
    penguins_raw <- read_csv(here::here("data-raw", "penguins_raw.csv"),
                             show_col_types = FALSE)
    penguins_raw |>
      summarise(mean_mass_g = mean(`Body Mass (g)`, na.rm = TRUE))
    ```

    ```sh
    Rscript code/analysis.R
    ```

    ```output

    Attaching package: ‘dplyr’

    The following objects are masked from ‘package:stats’:

        filter, lag

    The following objects are masked from ‘package:base’:

        intersect, setdiff, setequal, union

    # A tibble: 1 × 1
      mean_mass_g
            <dbl>
    1       4202.
    ```

    About 4202 g for every row with a body mass, against 4716 g for Biscoe alone. If she wants
    Biscoe, the filter belongs in the script, where a reader can see it.
- level: 8
  prompt: |
    Ravi checks his script before sending it. In his session the penguin file is already read. He
    runs the script with `source()`, sees no error, and tells his guide it is reproducible:

    ```r
    library(readr)
    penguins_raw <- read_csv(here::here("data-raw", "penguins_raw.csv"),
                             show_col_types = FALSE)
    ```

    ```r file=code/analysis.R
    n_rows <- nrow(penguins_raw)
    ```

    ```r
    source(here::here("code", "analysis.R"))
    n_rows
    ```

    ```output
    [1] 344
    ```

    What is wrong with his check?
  answer: |
    `source()` ran the script in Ravi's own workspace, where `penguins_raw` already existed. So the
    check could not find the missing reading line. It looks like a test because the whole file ran
    without an error. But it ran with Ravi's objects.

    The test that counts starts from nothing:

    ```r file=code/analysis.R
    n_rows <- nrow(penguins_raw)
    ```

    ```sh error
    Rscript code/analysis.R
    ```

    ```output
    Error: object 'penguins_raw' not found
    Execution halted
    ```

    The script needs `library(readr)` and the `read_csv()` line at its top. Then the same command
    runs to the end. `source()` is a fair test only straight after restarting R.
- level: 9
  prompt: |
    A thesis's methods chapter says: "All analyses were performed in R and are fully reproducible."
    The candidate gives you the project folder. Decide what to run to test the sentence, write it
    down, and then say what a successful run would still not establish.
  answer: |
    Run the README's command in a terminal, in the project folder, on your computer:

    ```sh norun
    Rscript code/analysis.R
    ```

    Then compare what lands in `output/` with the tables in the thesis, number by number. Read the
    `sessionInfo()` printout at the end of the run against the versions the candidate recorded.

    If the run reaches the last line and every number matches, you have shown one thing. The script
    reruns from the raw files on a second computer and gives the thesis's numbers.

    It does not establish:

    - that the numbers are right. A script can rerun perfectly and still compute the wrong thing;
    - that the raw files are the files that were collected. The run starts from whatever is in
      `data-raw/`;
    - that it will rerun next year. Newer package versions may stop it or change a result, unless
      the versions are pinned, which is renv's job two rungs up;
    - that every number in the text came from the script. A number typed into the chapter by hand
      has no line of code behind it.

    So the sentence the candidate can defend is narrower: "The analysis reruns from the raw data
    with one command, `Rscript code/analysis.R`, on R {{n:r_version}}."
- level: 10
  prompt: |
    In a department meeting a colleague says: "My script gives the same table every time. I ran it
    twice yesterday in RStudio and got the same numbers." His script reads the penguin file and
    writes the number of rows of each sex to `output/sex_counts.csv`. Decide what would actually
    test his claim, run it, and say what your result does not establish.
  answer: |
    Running twice in the same RStudio session tests nothing new: the second run had the first
    run's workspace. The test is two runs that each start from nothing, with `output/` deleted in
    between, and a comparison of the files. Here is his script:

    ```r file=code/analysis.R
    library(readr)
    library(dplyr)
    library(here)

    penguins_raw <- read_csv(
      here("data-raw", "penguins_raw.csv"),
      show_col_types = FALSE
    )

    dir.create(here("output"), showWarnings = FALSE)

    sex_counts <- penguins_raw |>
      count(Sex)
    write_csv(sex_counts, here("output", "sex_counts.csv"))
    ```

    Run it and keep a copy of the output. Delete `output/`, run it again, and compare. `cmp`
    compares two files and prints nothing when they are the same:

    ```sh
    Rscript code/analysis.R > /dev/null 2>&1
    cp output/sex_counts.csv first_run.csv
    rm -r output
    Rscript code/analysis.R > /dev/null 2>&1
    cmp first_run.csv output/sex_counts.csv && echo "identical"
    cat output/sex_counts.csv
    ```

    ```output
    identical
    Sex,n
    FEMALE,165
    MALE,168
    NA,11
    ```

    `> /dev/null 2>&1` throws away what each run prints, since only the files matter here. The two
    files are identical: 165, 168 and 11 rows, which add up to {{n:penguins_rows}}.

    What this does not establish:

    - that the script runs on his colleagues' computers, with their package versions;
    - that the counts are right. They are the rows of the file, and the 11 rows with no sex
      recorded are counted as NA, not hidden;
    - anything about penguins beyond this file.

    He can now say "the script gives the same table from a fresh start on my computer". That is
    more than he could say before, and less than "it reproduces".
retrieval_items:
- q: What does `Rscript code/analysis.R` do, and from which folder do you type it?
  a: It starts a new R with an empty workspace, runs the file from its first line to its last, and
    stops at the first error. You type it in a terminal whose working directory is the project
    folder.
- q: Why is `source()` in a session you have been working in not a test of a script?
  a: It runs the file in your current workspace, so the script can still use objects and packages
    you made or loaded earlier. Restart R first, or use `Rscript`.
- q: What does `set.seed()` do, and where does it go in a script?
  a: It fixes the starting point of R's random numbers, so a random step gives the same result on
    every run. It goes before the random step, with a number written in the script.
- q: What does `sessionInfo()` print, and why put it at the end of a script?
  a: The version of R, the operating system and the version of every attached package. At the end
    of the script it records what produced that run's outputs.
figure_note: "The section's evidence is the difference between two runs of the same script, shown as their printed outputs; it has no quantity for a chart to draw."
