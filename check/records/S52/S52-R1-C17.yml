simplified_explanation: |
  **The wide table.** A clinic writes a patient's weight at three visits in three columns: visit 1, visit 2, visit
  3. But "visit" is a variable, and here its values sit in the column names. In the column names,
  `summarise(.by = visit)` cannot reach them.

  `pivot_longer()` turns the three columns into two: one saying which visit, one saying the weight.

  **The two files.** A survey sends the demographics in one file and the measurements in another, with a
  participant number in both.

  Here is the trap with joins. Suppose a key appears twice in the second file, by a slip in data entry. Then the
  matching row of the first file appears twice in the result. No error, no warning.

  So count the rows before and after every join. Find keys that appear more than once. Find rows that did not match
  with `anti_join()`.
illustrations:
- body: |
    Start with a made-up weight register in the wide shape a clinic would write by hand. Each
    patient's weight in kilograms at three visits sits in three columns. Patient 103 missed
    visit 2.

    ```r
    library(dplyr, warn.conflicts = FALSE)
    library(tidyr)

    weights_wide <- tibble(
      id = c(101, 102, 103),
      weight_v1 = c(82.4, 95.0, 77.1),
      weight_v2 = c(80.9, 93.2, NA),
      weight_v3 = c(79.5, 92.8, 75.0)
    )
    ```

    Try to get the mean weight at each visit. The visit number is not in any column. It is part of
    three column names, so there is nothing to group by. You could write three `mean()` calls,
    one per column, and a fourth when a visit is added. Instead, make the visit a column:

    ```r
    weights_long <- weights_wide |>
      pivot_longer(
        cols = starts_with("weight_v"),
        names_to = "visit",
        names_prefix = "weight_v",
        values_to = "weight_kg"
      )

    weights_long
    ```

    ```output
    # A tibble: 9 × 3
         id visit weight_kg
      <dbl> <chr>     <dbl>
    1   101 1          82.4
    2   101 2          80.9
    3   101 3          79.5
    4   102 1          95
    5   102 2          93.2
    6   102 3          92.8
    7   103 1          77.1
    8   103 2          NA
    9   103 3          75
    ```

    Read the arguments in order. `cols` names the three columns to fold. `names_to` names the new
    column that receives their names. `names_prefix` takes "weight_v" off the front, so the visit
    column holds 1, 2 and 3. `values_to` names the column that receives the weights.

    Three patients times three visits is nine rows. Each row is one patient at one visit, which is
    what one observation is here. Patient 103's missing visit 2 is a row with `NA`, not a gap. Now
    the visit is a column, and the last section's tools work:

    ```r
    weights_long |>
      summarise(
        n_weights = sum(!is.na(weight_kg)),
        mean_kg = mean(weight_kg, na.rm = TRUE),
        .by = visit
      )
    ```

    ```output
    # A tibble: 3 × 3
      visit n_weights mean_kg
      <chr>     <int>   <dbl>
    1 1             3    84.8
    2 2             2    87.1
    3 3             3    82.4
    ```

    Look at the means: 84.8, 87.1, 82.4. The mean went up at visit 2, though every patient
    weighed there lost weight. The count explains it. Visit 2 has 2 weights, not 3: the lightest
    patient was missing, so the visit 2 mean is a mean of two different people. A mean over
    visits compares visits only when the same people are in every visit. The count beside the
    mean is how you see that.

    For the printed table, turn it back:

    ```r
    weights_long |>
      pivot_wider(
        names_from = visit,
        values_from = weight_kg,
        names_prefix = "weight_v"
      )
    ```

    ```output
    # A tibble: 3 × 4
         id weight_v1 weight_v2 weight_v3
      <dbl>     <dbl>     <dbl>     <dbl>
    1   101      82.4      80.9      79.5
    2   102      95        93.2      92.8
    3   103      77.1      NA        75
    ```

    The same three rows and four columns you started with. `names_from` names the column whose
    values become the new column names, and `values_from` the column that fills them. The
    remaining columns, here `id`, pick out the rows. `values_fill = 0` puts 0 where a combination
    has no value; use it only for counts. Long for working, wide for reading.
  analogy_breaks_when: |
    The three patients are made up. Their weights show the reshaping and say nothing about any
    treatment or any person.

    `pivot_longer()` is right only when the folded columns hold the same variable in the same unit.
    Folding a weight column and a height column into one value column would make a column with two
    units in it. The tools would compute a mean of it without complaint.
- body: |
    Now two files. A made-up clinic keeps demographics in one table and BMI in another, with the
    patient number `id` in both. Patient 102 was entered twice in the demographics table, by a
    slip at the registration desk. Patient 106 has a BMI and no demographic record.

    ```r
    demographics <- tibble(
      id = c(101, 102, 102, 103, 104, 105),
      sex = c("F", "M", "M", "F", "M", "F"),
      age = c(34, 51, 51, 45, 29, 60)
    )

    bmi <- tibble(
      id = c(101, 102, 103, 105, 106),
      bmi = c(27.1, 31.4, 24.9, 29.8, 22.3)
    )

    nrow(bmi)

    bmi_demo <- bmi |>
      left_join(demographics, by = "id")

    nrow(bmi_demo)
    bmi_demo
    ```

    ```output
    [1] 5
    [1] 6
    # A tibble: 6 × 4
         id   bmi sex     age
      <dbl> <dbl> <chr> <dbl>
    1   101  27.1 F        34
    2   102  31.4 M        51
    3   102  31.4 M        51
    4   103  24.9 F        45
    5   105  29.8 F        60
    6   106  22.3 <NA>     NA
    ```

    Five rows went in and six came out. Patient 102 is there twice, because the key 102 matched two
    rows of `demographics`. R printed no warning. Every later count and mean would include
    patient 102 twice, and a summary of 6 BMIs would be reported for 5 patients.

    Patient 106 is there once, with `NA` for sex and age. `left_join()` kept the row, because it
    keeps every row of the first table, and had nothing to fill in.

    Three lines find both problems. Count each key, and keep any that appear more than once. Then
    ask which BMI rows have no partner:

    ```r
    demographics |>
      count(id) |>
      filter(n > 1)

    bmi |>
      anti_join(demographics, by = "id")
    ```

    ```output
    # A tibble: 1 × 2
         id     n
      <dbl> <int>
    1   102     2
    # A tibble: 1 × 2
         id   bmi
      <dbl> <dbl>
    1   106  22.3
    ```

    Key 102 appears twice. Patient 106 has no demographic record. Neither is fixed by editing the
    raw file. Patient 106's missing record is a question for the clinic. The duplicate is removed
    by a line of code, with a comment saying why; a later section shows how to make the script
    stop on it.

    Last, make the join refuse to add rows. The `relationship` argument states how many matches
    each row is expected to have, and the join stops with an error if the data break it. Each BMI
    row should match at most one row of demographics, which `relationship = "many-to-one"` says:

    ```r error
    bmi |>
      left_join(demographics, by = "id", relationship = "many-to-one")
    ```

    ```output
    Error in `left_join()`:
    ! Each row in `x` must match at most 1 row in `y`.
    ℹ Row 2 of `x` matches multiple rows in `y`.
    ```

    Now the script stops at the join and names the row that broke the rule, instead of carrying a
    wrong count into every table after it.
  analogy_breaks_when: |
    The register is made up, and its five patients describe nobody.

    A duplicated key is not always an error. A table of visits has one row per visit, so a patient
    with three visits has the same id three times, and joining demographics to it should repeat
    each patient's age three times. The question is never "are there repeats?" but "should there
    be?", and the answer comes from what one row stands for.
- body: |
    Now the real case. NHANES, the American survey whose body measures file you read in the
    section on raw files, sends its demographics in a second file. Both files carry `SEQN`, the
    participant's sequence number. Read both, keep a few columns of each, and count rows before
    and after the join.

    ```r
    bmx <- haven::read_xpt(here::here("data-raw", "BMX_L.xpt"))
    demo <- haven::read_xpt(here::here("data-raw", "DEMO_L.xpt"))

    nrow(bmx)
    nrow(demo)

    body <- bmx |>
      select(SEQN, BMXWT, BMXHT, BMXBMI) |>
      left_join(
        demo |> select(SEQN, RIDSTATR, RIAGENDR, RIDAGEYR),
        by = "SEQN",
        relationship = "one-to-one"
      )

    nrow(body)
    ```

    ```output
    [1] 8860
    [1] 11933
    [1] 8860
    ```

    The body measures file has {{n:bmx_rows}} rows and the demographics file {{n:demo_rows}}. The join kept
    {{n:bmx_rows}}, the same as went in. `relationship = "one-to-one"` expects each key at most
    once on each side; it did not stop, so no `SEQN` appears twice in either file.

    The demographics file has 3073 more rows than the body measures file. Who are they? Ask
    which demographic rows found no body measures, and look at their `RIDSTATR`. The codebook says
    that column records whether a participant was interviewed and examined, or only interviewed.

    ```r
    bmx |>
      anti_join(demo, by = "SEQN") |>
      nrow()

    demo |>
      anti_join(bmx, by = "SEQN") |>
      count(RIDSTATR)
    ```

    ```output
    [1] 0
    # A tibble: 1 × 2
      RIDSTATR     n
         <dbl> <int>
    1        1  3073
    ```

    Every body-measures row found its demographics: 0 failed to match. The 3073 demographic rows
    with no body measures all have `RIDSTATR` 1. In the codebook's words, they were only
    interviewed, and never examined, so there was nothing to measure. The two counts agree:

    ```working
    11933 - 8860 = 3073
    ```

    ```table
    | Table | Rows |
    | body measures | 8860 |
    | demographics | 11933 |
    | joined | 8860 |
    | demographics, no match | 3073 |
    ```

    Now the joined table can answer a question neither file could alone. How many adults aged 20 or
    over have a body measures record, and what is their BMI, by the codebook's `RIAGENDR`, where 1
    is male and 2 is female?

    ```r
    body |>
      filter(RIDAGEYR >= 20) |>
      summarise(
        n_rows = n(),
        n_bmi = sum(!is.na(BMXBMI)),
        mean_bmi = mean(BMXBMI, na.rm = TRUE),
        median_bmi = median(BMXBMI, na.rm = TRUE),
        .by = RIAGENDR
      )
    ```

    ```output
    # A tibble: 2 × 5
      RIAGENDR n_rows n_bmi mean_bmi median_bmi
         <dbl>  <int> <int>    <dbl>      <dbl>
    1        1   2720  2680     29.3       28.1
    2        2   3344  3290     30.3       28.7
    ```

    2720 men and 3344 women, {{n:nhanes_adults_rows}} adults in all, of whom {{n:nhanes_men_bmi_n}} and {{n:nhanes_women_bmi_n}} have a
    BMI. Their mean BMI is {{n:nhanes_men_bmi_mean}} and 30.3 kg/m^2, and the medians are {{n:nhanes_men_bmi_median}} and 28.7 kg/m^2.

    These are the mean and median of the rows in the file, unweighted. The survey's documentation
    says its sample weights should be used to analyse these data. Without them, these numbers
    describe the people examined, and estimate nothing about adults in the United States. The
    book on survey data teaches the weights.
  analogy_breaks_when: |
    A join on a key is also the core of a database query; the next rung writes the same joins in
    SQL (Structured Query Language).

    The join worked cleanly because NHANES built both files around one key and published it. A
    thesis dataset with a register typed in one place and laboratory results in another rarely
    has a key that clean: names spelled two ways, IDs with and without a leading zero. The checks
    are the same; expect them to find more.

    The adult summary includes everyone aged 20 or over who was examined. It does not exclude
    anyone for whom BMI means something different, such as women who were pregnant at the
    examination. A real analysis would decide that, in code, before summarising, as the last
    section of this book does.
must_know:
- point: |
    Count the rows before and after every join. A `left_join()` that returns more rows than went
    in has found a key that appears more than once in the second table. It says nothing about it.
  kind: trap
  bearing: methodological
- point: |
    The error is to think a join only adds columns. It also adds rows when a key repeats, and every
    count and mean after it counts those rows again.
  kind: misconception
  bearing: methodological
- point: |
    Before a join, check the key in each table: count each value with `count()` and keep those with
    `n > 1`.
  kind: move
  bearing: methodological
- point: |
    Always write `by`. Left out, the join matches on every column the two tables share by name.
    A column called `year` or `date` may mean different things in each. It will then be matched
    too. dplyr names the columns it used in a message that is easy to miss.
  kind: trap
  bearing: methodological
- point: |
    When a wide table has values of a variable in its column names, make it long with
    `pivot_longer()` before summarising.
  kind: move
  bearing: methodological
- point: |
    A mean at each visit compares visits only if the same people are in every visit. Print the count
    at each visit.
  kind: consequence
  bearing: clinical
- point: |
    When a trainee's merged thesis file "has a few more rows than it should", do not let them delete
    rows by hand.
  kind: move
  bearing: teaching
- point: |
    The join checks can tell you that keys match and how often. They cannot tell you that two rows
    with the same key are really the same person.
  kind: boundary
  bearing: methodological
exercises:
- type: calculation
  prompt: |
    Add to a script the join of the NHANES body measures file to the demographics file on `SEQN`.
    Print five counts: the rows of each file, the rows of the result, the body-measures rows with no
    demographics, and the joined rows with an age of 20 or over. State what each count tells you.
  answer: |
    ```r
    library(dplyr, warn.conflicts = FALSE)

    bmx <- haven::read_xpt(here::here("data-raw", "BMX_L.xpt"))
    demo <- haven::read_xpt(here::here("data-raw", "DEMO_L.xpt"))

    body <- bmx |>
      left_join(demo, by = "SEQN", relationship = "one-to-one")

    nrow(bmx)
    nrow(demo)
    nrow(body)
    nrow(anti_join(bmx, demo, by = "SEQN"))
    nrow(filter(body, RIDAGEYR >= 20))
    ```

    ```output
    [1] 8860
    [1] 11933
    [1] 8860
    [1] 0
    [1] 6064
    ```

    {{n:bmx_rows}} rows of body measures and {{n:demo_rows}} of demographics. The join has {{n:bmx_rows}}
    rows: none was added, and `relationship = "one-to-one"` confirms no key repeats. No body
    measures row lacks demographics. {{n:nhanes_adults_rows}} joined rows are adults aged 20 or
    over. Every count is of rows in the files; none is a survey estimate.
  skill_ref: S52-R1-K01
- type: critique
  prompt: |
    A colleague merged her thesis questionnaire file with the laboratory results in a spreadsheet.
    She sorted both by participant ID, pasted the laboratory columns beside the questionnaire
    columns, and saved the result as a new file. Say what can go wrong, and how to do it in code.
  answer: |
    Pasting side by side matches rows by position, not by ID. It is right only if both files hold
    exactly the same participants, each exactly once, sorted the same way. One participant missing
    from the laboratory file, or entered twice, shifts every row below by one. Every participant
    below the slip then carries someone else's results, and nothing in the file shows it.

    The merged file also has no record of how it was made. Nobody can redo the step and check it.

    Do it in code instead, in four steps.

    1. Read both raw files, and count each ID in each with `count(id) |> filter(n > 1)`.
    2. Join with `left_join(questionnaire, lab, by = "id", relationship = "one-to-one")`.
    3. Compare the row counts before and after.
    4. List the unmatched participants with `anti_join()`, both ways round.

    The raw files stay as they arrived. The merge reruns whenever either file changes.
  skill_ref: S52-R1-K02
- type: retrieval
  prompt: |
    Without looking back, say what each of these returns: `pivot_longer()`, `pivot_wider()`,
    `left_join(x, y)` and `anti_join(x, y)`.
  answer: |
    What each returns:

    - `pivot_longer()`: the same data with more rows and fewer columns; a set of columns becomes a
      column of their names and a column of their values.
    - `pivot_wider()`: the reverse, with fewer rows and more columns.
    - `left_join(x, y)`: every row of `x`, with the columns of `y` added where the keys match; `NA`
      where they do not; a row repeated when its key matches several rows of `y`.
    - `anti_join(x, y)`: only the rows of `x` whose key has no match in `y`.
quantitative: true
practice_note: |
  Eleven problems: two moves (reshaping and joining), each with its own silent failure (a mixed-unit
  value column, a duplicated key, an unnamed key, keys of different types), so each move gets
  mechanical, applied and diagnostic problems, and the transfer problems use the joined NHANES file.
practice:
- level: 1
  prompt: |
    A made-up table:

    ```r
    library(tidyr)
    library(dplyr, warn.conflicts = FALSE)

    screen <- tibble(child = "A", height_2024 = 121, height_2025 = 127)
    ```

    Make it long, with a column `year` and a column `height_cm`. How many rows will it have?
  answer: |
    ```r
    screen |>
      pivot_longer(
        cols = starts_with("height_"),
        names_to = "year",
        names_prefix = "height_",
        values_to = "height_cm"
      )
    ```

    ```output
    # A tibble: 2 × 3
      child year  height_cm
      <chr> <chr>     <dbl>
    1 A     2024        121
    2 A     2025        127
    ```

    Two rows: one child, two years. The `year` column holds text, "2024" and "2025", because it came
    from column names.
- level: 2
  prompt: |
    A made-up long table:

    ```r
    library(tidyr)
    library(dplyr, warn.conflicts = FALSE)

    long <- tibble(
      district = c("Durg", "Durg", "Korba", "Korba"),
      round = c("r1", "r2", "r1", "r2"),
      screened = c(410, 455, 380, 362)
    )
    ```

    Make it wide, with one row per district and one column per round.
  answer: |
    ```r
    long |>
      pivot_wider(names_from = round, values_from = screened)
    ```

    ```output
    # A tibble: 2 × 3
      district    r1    r2
      <chr>    <dbl> <dbl>
    1 Durg       410   455
    2 Korba      380   362
    ```

    Two rows and three columns: Durg screened 410 and 455; Korba 380 and 362.
- level: 3
  prompt: |
    Two made-up tables:

    ```r
    library(dplyr, warn.conflicts = FALSE)

    x <- tibble(id = c(1, 2, 3), weight_kg = c(60, 72, 55))
    y <- tibble(id = c(2, 3, 3, 4), ward = c("A", "B", "C", "D"))
    ```

    Before you run `left_join(x, y, by = "id")`, say how many rows the result will have and which
    `ward` each row gets. Then run it.
  answer: |
    ```r
    left_join(x, y, by = "id")
    ```

    ```output
    # A tibble: 4 × 3
         id weight_kg ward
      <dbl>     <dbl> <chr>
    1     1        60 <NA>
    2     2        72 A
    3     3        55 B
    4     3        55 C
    ```

    Four rows. Id 1 has no match, so it stays once with `NA` for `ward`. Id 2 matches once, ward A.
    Id 3 matches two rows of `y`, so it appears twice, with wards B and C. Id 4 is only in `y`, and a
    left join keeps only the rows of `x`. Three rows went in; four came out.
- level: 4
  prompt: |
    Read the two NHANES files.

    ```r
    library(dplyr, warn.conflicts = FALSE)

    bmx <- haven::read_xpt(here::here("data-raw", "BMX_L.xpt"))
    demo <- haven::read_xpt(here::here("data-raw", "DEMO_L.xpt"))
    ```

    Check that `SEQN` identifies one row in each file: count how many values of `SEQN` appear more
    than once in each.
  answer: |
    ```r
    bmx |>
      count(SEQN) |>
      filter(n > 1) |>
      nrow()

    demo |>
      count(SEQN) |>
      filter(n > 1) |>
      nrow()
    ```

    ```output
    [1] 0
    [1] 0
    ```

    0 in each. No participant number repeats in either file, so a join on `SEQN` cannot add rows.
  refs:
  - nchs_nhanes_2021_2023_bmx_demo
- level: 5
  prompt: |
    Read the penguin file.

    ```r
    library(readr)
    library(dplyr, warn.conflicts = FALSE)
    library(tidyr)

    penguins_raw <- read_csv(
      here::here("data-raw", "penguins_raw.csv"),
      show_col_types = FALSE
    )
    ```

    Make a table with one row per species and one column per island, holding the number of rows of
    each species on each island. Put 0 where a species was not found on an island, and say why
    that is the right value here.
  answer: |
    ```r
    penguins_raw |>
      count(Species, Island) |>
      pivot_wider(
        names_from = Island,
        values_from = n,
        values_fill = 0
      )
    ```

    ```output
    # A tibble: 3 × 4
      Species                                   Biscoe Dream Torgersen
      <chr>                                      <int> <int>     <int>
    1 Adelie Penguin (Pygoscelis adeliae)           44    56        52
    2 Chinstrap penguin (Pygoscelis antarctica)      0    68         0
    3 Gentoo penguin (Pygoscelis papua)            124     0         0
    ```

    Three species, three islands. Adelie penguins were found on all three; Chinstrap only on
    Dream; Gentoo only on Biscoe. Without `values_fill = 0`, an island where a species was never
    recorded would show `NA`. Here 0 is right: the count of rows for that pair is truly zero, not
    unknown. In a table of weights, filling a gap with 0 would be wrong, because a missing weight
    is not a weight of zero.
- level: 6
  prompt: |
    Read the two NHANES files.

    ```r
    library(dplyr, warn.conflicts = FALSE)

    bmx <- haven::read_xpt(here::here("data-raw", "BMX_L.xpt"))
    demo <- haven::read_xpt(here::here("data-raw", "DEMO_L.xpt"))
    ```

    Join the age column `RIDAGEYR` to the body measures file. Then count how many examined
    participants are children under 2, and how many of those have a standing height (`BMXHT`).
    Say why the second count is what it is. The BMX codebook lists the ages at which each body
    measure is taken.
  answer: |
    ```r
    body <- bmx |>
      left_join(
        demo |> select(SEQN, RIDAGEYR),
        by = "SEQN",
        relationship = "one-to-one"
      )

    body |>
      filter(RIDAGEYR < 2) |>
      summarise(
        n_rows = n(),
        n_height = sum(!is.na(BMXHT))
      )
    ```

    ```output
    # A tibble: 1 × 2
      n_rows n_height
       <int>    <int>
    1    249        0
    ```

    The join keeps all {{n:bmx_rows}} rows. Of the 249 examined participants under 2, none has a
    standing height. The survey's documentation lists standing height for ages 2 years and older.
    Recumbent length, measured lying down, is taken from birth through 47 months, in its own column.
    So standing height is missing on purpose. A missing value can be part of
    how the survey works, not a failure to measure.
  refs:
  - nchs_nhanes_2021_2023_bmx_demo
- level: 7
  prompt: |
    A colleague wants one tidy column of penguin measurements. He writes this, and reports
    "the mean measurement of Gentoo penguins is 1780".

    ```r
    library(readr)
    library(dplyr, warn.conflicts = FALSE)
    library(tidyr)

    penguins_raw <- read_csv(
      here::here("data-raw", "penguins_raw.csv"),
      show_col_types = FALSE
    )

    penguins_raw |>
      pivot_longer(
        cols = c(`Culmen Length (mm)`, `Flipper Length (mm)`, `Body Mass (g)`),
        names_to = "measure",
        values_to = "value"
      ) |>
      summarise(mean_value = mean(value, na.rm = TRUE), .by = Species)
    ```

    ```output
    # A tibble: 3 × 2
      Species                                   mean_value
      <chr>                                          <dbl>
    1 Adelie Penguin (Pygoscelis adeliae)            1310.
    2 Gentoo penguin (Pygoscelis papua)              1780.
    3 Chinstrap penguin (Pygoscelis antarctica)      1326.
    ```

    Find what broke.
  answer: |
    The three folded columns are three different variables, in two units: two lengths in millimetres
    and a mass in grams. The mean of the `value` column adds grams to millimetres. The number is
    meaningless, and the large body masses swamp the lengths.

    Keep `measure` in the grouping, so each mean is of one variable in one unit:

    ```r
    penguins_raw |>
      pivot_longer(
        cols = c(`Culmen Length (mm)`, `Flipper Length (mm)`, `Body Mass (g)`),
        names_to = "measure",
        values_to = "value"
      ) |>
      summarise(mean_value = mean(value, na.rm = TRUE), .by = c(Species, measure)) |>
      filter(Species == "Gentoo penguin (Pygoscelis papua)")
    ```

    ```output
    # A tibble: 3 × 3
      Species                           measure             mean_value
      <chr>                             <chr>                    <dbl>
    1 Gentoo penguin (Pygoscelis papua) Culmen Length (mm)        47.5
    2 Gentoo penguin (Pygoscelis papua) Flipper Length (mm)      217.
    3 Gentoo penguin (Pygoscelis papua) Body Mass (g)           5076.
    ```

    Three means for Gentoo penguins, each with its unit in the measure's name.

    Why the wrong answer looks reasonable: `pivot_longer()` ran without complaint and the result
    looked tidy. But a tidy column holds one variable. These three were never one variable, so
    folding them made the data less tidy, not more.
- level: 8
  prompt: |
    A made-up clinic keeps two tables. In `visits`, `year` is the year of the visit. In `register`,
    `year` is the year of birth. A colleague joins them and reports "no patient's sex is recorded".

    ```r
    library(dplyr, warn.conflicts = FALSE)

    visits <- tibble(id = c(1, 2, 3), year = c(2025, 2025, 2026), bmi = c(26.2, 31.0, 23.4))
    register <- tibble(id = c(1, 2, 3), year = c(1980, 1972, 1991), sex = c("F", "M", "F"))

    visits |>
      left_join(register)
    ```

    ```output
    Joining with `by = join_by(id, year)`
    # A tibble: 3 × 4
         id  year   bmi sex
      <dbl> <dbl> <dbl> <chr>
    1     1  2025  26.2 <NA>
    2     2  2025  31   <NA>
    3     3  2026  23.4 <NA>
    ```

    Find what broke.
  answer: |
    No `by` was given, so the join matched on every column the two tables share: `id` and `year`.
    The message says so: it joined by `id` and `year`. A visit in 2025 never matches a birth in
    1980, so no row found a partner, and `sex` is `NA` everywhere.

    Name the key:

    ```r
    visits |>
      left_join(register, by = "id")
    ```

    ```output
    # A tibble: 3 × 5
         id year.x   bmi year.y sex
      <dbl>  <dbl> <dbl>  <dbl> <chr>
    1     1   2025  26.2   1980 F
    2     2   2025  31     1972 M
    3     3   2026  23.4   1991 F
    ```

    Now each visit gets its patient's sex. The two `year` columns are both kept, and the join adds
    `.x` and `.y` to their names to tell them apart. Rename them to what they mean, such as
    `visit_year` and `birth_year`.

    Why the wrong answer looks reasonable: "sex is not recorded" is a common problem in real
    registers, so the colleague believed it. The message naming both columns was the clue.
- level: 8
  prompt: |
    A colleague joins a made-up laboratory table to a register. The laboratory file was read with
    every column as text.

    ```r
    library(dplyr, warn.conflicts = FALSE)

    register <- tibble(id = c(101, 102, 103), sex = c("F", "M", "F"))
    lab <- tibble(id = c("101", "102", "103"), hb = c("12.1", "14.3", "11.8"))
    ```

    ```r error
    register |>
      left_join(lab, by = "id")
    ```

    ```output
    Error in `left_join()`:
    ! Can't join `x$id` with `y$id` due to incompatible types.
    ℹ `x$id` is a <double>.
    ℹ `y$id` is a <character>.
    ```

    Read the error. Say what broke and fix it.
  answer: |
    The key is a number in `register` and text in `lab`. R will not match `101` with `"101"`,
    because the two columns have different types. Convert in code, in a new column or by
    re-reading the file with its column types stated, never by editing the file:

    ```r
    lab_clean <- lab |>
      mutate(id = as.numeric(id), hb = as.numeric(hb))

    register |>
      left_join(lab_clean, by = "id")
    ```

    ```output
    # A tibble: 3 × 3
         id sex      hb
      <dbl> <chr> <dbl>
    1   101 F      12.1
    2   102 M      14.3
    3   103 F      11.8
    ```

    Three rows, each with its haemoglobin. The stopping error was the helpful case. Two
    text columns that differ in another way, such as IDs with and without a leading
    zero typed as text, would join without error. They would fail to match, and nothing would say so.

    Why the wrong code looks reasonable: the two IDs print the same. The type is only visible in
    the column heading, `<dbl>` against `<chr>`.
- level: 9
  prompt: |
    A made-up methods section says: "We merged the NHANES 2021–2023 body measures and demographic
    files on the sequence number; 11,933 participants had body measures." Check the claim, and say
    what the merge does not establish.
  answer: |
    ```r
    library(dplyr, warn.conflicts = FALSE)

    bmx <- haven::read_xpt(here::here("data-raw", "BMX_L.xpt"))
    demo <- haven::read_xpt(here::here("data-raw", "DEMO_L.xpt"))

    nrow(demo)
    nrow(bmx)

    bmx |>
      left_join(demo, by = "SEQN", relationship = "one-to-one") |>
      nrow()
    ```

    ```output
    [1] 11933
    [1] 8860
    [1] 8860
    ```

    {{n:demo_rows}} is the number of rows in the demographics file. It is not the number with body
    measures.
    {{n:bmx_rows}} participants have a body measures record, and the merged file has {{n:bmx_rows}}
    rows. The other 3073 were interviewed and not examined. The sentence took the wrong file's
    count, which is what happens when the count is read off a screen rather than printed after the
    join.

    What it does not establish:

    - That the {{n:bmx_rows}} have every measurement. Height, weight and BMI each have missing values, and
      each analysis has its own n.
    - Anything about the US population. The counts are rows of the files; estimates need the
      survey's sample weights.
  refs:
  - nchs_nhanes_2021_2023_bmx_demo
- level: 10
  prompt: |
    In a made-up journal club, someone says: "In NHANES, women have a higher BMI than men." Turn the
    sentence into code on the joined files, for adults aged 20 or over, run it, and say what the
    result does not establish.
  answer: |
    Join, keep adults, and summarise BMI by `RIAGENDR`, where the codebook says 1 is male and 2 is
    female:

    ```r
    library(dplyr, warn.conflicts = FALSE)

    bmx <- haven::read_xpt(here::here("data-raw", "BMX_L.xpt"))
    demo <- haven::read_xpt(here::here("data-raw", "DEMO_L.xpt"))

    bmx |>
      left_join(demo, by = "SEQN", relationship = "one-to-one") |>
      filter(RIDAGEYR >= 20) |>
      summarise(
        n_bmi = sum(!is.na(BMXBMI)),
        mean_bmi = mean(BMXBMI, na.rm = TRUE),
        median_bmi = median(BMXBMI, na.rm = TRUE),
        .by = RIAGENDR
      )
    ```

    ```output
    # A tibble: 2 × 4
      RIAGENDR n_bmi mean_bmi median_bmi
         <dbl> <int>    <dbl>      <dbl>
    1        1  2680     29.3       28.1
    2        2  3290     30.3       28.7
    ```

    In these rows, the {{n:nhanes_women_bmi_n}} women have a mean BMI of 30.3 kg/m^2, and the {{n:nhanes_men_bmi_n}} men {{n:nhanes_men_bmi_mean}} kg/m^2. The
    medians are 28.7 and {{n:nhanes_men_bmi_median}} kg/m^2. So the women examined have a higher mean and median BMI than
    the men examined.

    What it does not establish:

    - That women in the United States have a higher BMI than men. These summaries are unweighted.
      The survey's documentation says its sample weights should be used, and the weighted answer
      could differ.
    - That a difference of about one unit matters, or is more than chance. That needs the
      statistics books.
    - Anything about body fat. BMI is weight for height; it does not measure body fat.
  refs:
  - nchs_nhanes_2021_2023_bmx_demo
retrieval_items:
- q: What does pivot_longer() do to the number of rows and columns, and when do you need it?
  a: It increases the rows and decreases the columns. You need it when values of a variable, such as
    visit numbers or years, sit in column names.
- q: What does left_join(x, y) do with a row of x that has no match in y, and with one that matches
    two rows of y?
  a: The unmatched row is kept once, with NA in the columns from y. The row that matches two rows of
    y appears twice, once for each match.
- q: Name three checks to run around a join.
  a: Count the rows before and after; count each key and look for any with n greater than 1; list
    the unmatched rows with anti_join(). Stating relationship makes the join stop if a key repeats.
- q: Why should you always write by in a join?
  a: Left out, the join matches on every column the two tables share by name, which may include a
    column that means different things in each.
