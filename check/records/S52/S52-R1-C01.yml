      In their analysis with the 1946–2009 dataset, RR calculated both means and medians of cells in lines 30–44 instead of lines 30–49.
- body: |
    The third case is a transfer that dropped rows, and the numbers let you check the statement
    against itself.

    On 4 October 2020, PHE said that 15,841 positive COVID-19 test results had not reached the
    daily figures. The problem had been found overnight on Friday 2 October. The cause it gave:
    some files of results were bigger than the maximum file size the loading process could take.
    It put in a fix that splits large files.

    The statement gives the missing results day by day. Each was recorded on one day and should
    have appeared in the next day's published figure.

    ```table
    | Day it should have been reported | Results not included |
    | 25 Sep | 957 |
    | 26 Sep | 744 |
    | 27 Sep | 757 |
    | 28 Sep | 0 |
    | 29 Sep | 1415 |
    | 30 Sep | 3049 |
    | 1 Oct | 4133 |
    | 2 Oct | 4786 |
    ```

    Add the column. Then add the last three days alone.

    ```working
    957 + 744 + 757 + 0 + 1415 + 3049 + 4133 + 4786 = 15841
    3049 + 4133 + 4786 = 11968
    11968 ÷ 15841 = 0.7555
    ```

    The total matches the 15,841 in the statement. The last three days hold 11,968 results, and 11,968
    out of 15,841 is about 75.6%. The statement says "over 75% (11,968)". It checks.

    Now look at the shape of the column. The missing results were fewer than a thousand a day at
    first, then rose over the last four days to 4786. A loss that grows while the daily table still
    looks complete is one nobody sees until they compare one count with another.

    Here is what the statement does not say. It does not name the software, a file format or a
    row limit. You may read elsewhere that this was a spreadsheet problem. This statement does not
    say so, and neither does this book.
  analogy_breaks_when: |
    PHE says the problem did not change anyone's test result: everyone who tested positive got
    their result as normal and was advised to self-isolate. What was delayed was the count in the
    daily figures. The outstanding cases, the statement says, were passed to contact tracing by 1am
    on 3 October.

    The table gives the day each result should have been reported. The statement also describes the
    same results by the day they were recorded, one day earlier: 24 September to 1 October. Say
    which you mean when you quote the dates.
  numbers:
  - value: '15,841'
    unit: positive COVID-19 test results not included in daily figures, 25 September to 2 October 2020
    citekey: phe_2020_delayed
    as_of: '2026-10-02'
    quote: |-
      After rapid investigation, we have identified that 15,841 cases between 25 September and 2 October were not included in the reported daily COVID-19 cases.
  - value: '11,968'
    unit: of those, results that should have been reported 30 September to 2 October
    citekey: phe_2020_delayed
    as_of: '2026-10-02'
    quote: |-
      Of these, over 75% (11,968) relate to cases that should have been reported between 30 September and 2 October.
  - value: '957'
    unit: results not included, expected report date 25 September 2020
    citekey: phe_2020_delayed
    as_of: '2026-10-02'
    quote: |-
      | 24/09/2020 | 25/09/2020 | 957 |
  - value: '744'
    unit: results not included, expected report date 26 September 2020
    citekey: phe_2020_delayed
    as_of: '2026-10-02'
    quote: |-
      | 25/09/2020 | 26/09/2020 | 744 |
  - value: '757'
    unit: results not included, expected report date 27 September 2020
    citekey: phe_2020_delayed
    as_of: '2026-10-02'
    quote: |-
      | 26/09/2020 | 27/09/2020 | 757 |
  - value: '0'
    unit: results not included, expected report date 28 September 2020
    citekey: phe_2020_delayed
    as_of: '2026-10-02'
    quote: |-
      | 27/09/2020 | 28/09/2020 | 0 |
  - value: '1415'
    unit: results not included, expected report date 29 September 2020
    citekey: phe_2020_delayed
    as_of: '2026-10-02'
    quote: |-
      | 28/09/2020 | 29/09/2020 | 1415 |
  - value: '3049'
    unit: results not included, expected report date 30 September 2020
    citekey: phe_2020_delayed
    as_of: '2026-10-02'
    quote: |-
      | 29/09/2020 | 30/09/2020 | 3049 |
  - value: '4133'
    unit: results not included, expected report date 1 October 2020
    citekey: phe_2020_delayed
    as_of: '2026-10-02'
    quote: |-
      | 30/09/2020 | 01/10/2020 | 4133 |
  - value: '4786'
    unit: results not included, expected report date 2 October 2020
    citekey: phe_2020_delayed
    as_of: '2026-10-02'
    quote: |-
      | 01/10/2020 | 02/10/2020 | 4786 |
must_know:
- point: |
    The error is to believe a table because it looks complete. Before you trust a table, compare
    its row count, or a total, with the count you expected.
  kind: misconception
  bearing: methodological
- point: |
    Never edit the raw data file, and never save over it. Make every change in code that reads the
    raw file and writes a new one.
  kind: move
  bearing: methodological
  refs:
  - wilson_2017
  - sandve_2013
- point: |
    A choice about which data to leave out is part of the analysis. Write it as a line of code with
    a comment saying why.
  kind: consequence
  bearing: methodological
  refs:
  - herndon_2014_cje
- point: |
    Do not repeat "a spreadsheet slip caused austerity" or "Excel lost the COVID cases". The
    replication found the slip alone moved the result from 2.2% to 1.9% a year. The PHE statement
    names no software. Quote what each source says, and no more.
  kind: trap
  bearing: public
  refs:
  - herndon_2014_cje
  - phe_2020_delayed
- point: |
    When you open someone else's data file, look for values that have changed type, such as text turned into
    dates.
  kind: number
  bearing: methodological
  refs:
  - ziemann_2016
- point: |
    When a trainee says their numbers are right because they checked them on screen, ask how a
    second person would check them. If the answer is "by redoing it by hand", the work has no record.
  kind: move
  bearing: teaching
- point: |
    Writing every step in code does not make the steps right. What it changes is that the step is
    written down, so a reviewer can find the error and you can fix it once and rerun.
  kind: boundary
  bearing: methodological
  refs:
  - herndon_2013_wp322
exercises:
- type: retrieval
  prompt: |
    From memory, name the three documented failures in this section. For each, say in one sentence
    what changed or went missing, and how it came to light.
  answer: |
    Gene names turned into dates. Excel, with its default settings, turned names such as SEPT2
    into dates. Ziemann and colleagues found this by checking published files with their own
    programs. They found errors in 704 of 3597 papers with Excel gene lists.

    The Reinhart and Rogoff spreadsheet. A formula averaged rows 30 to 44, not 30 to 49. Some data
    were also left out without saying so. Herndon and colleagues found both when they rebuilt the
    results from the authors' own spreadsheet.

    The missing COVID-19 results. In England, 15,841 positive test results did not reach the daily
    figures. Some files were too big for the system that loaded them. PHE found the problem on
    2 October 2020 and said so two days later.
- type: critique
  prompt: |
    In a made-up department meeting, a senior colleague says: "Our thesis data are in one Excel
    file. Residents correct mistakes directly in the cells, so the file is always the cleanest
    version. That is good practice."

    Using the three cases in this section, say what is lost when corrections are made directly in
    the file, and what you would propose instead.
  answer: |
    Three things are lost.

    The original values. Once a cell is overwritten, the value that was first recorded is gone. If a
    correction was itself wrong, there is nothing to go back to. Ziemann and colleagues found 166
    files in which gene names, once turned into dates, could not be recovered from the file at all.

    The record of what changed. Nobody can later see which cells were corrected, by whom, or why.
    In the Reinhart and Rogoff case, the replication could not start from the posted files. They did
    not record which data and methods had been used.

    The chance to check. A reviewer cannot rerun a correction typed into a cell. They can only trust
    it.

    The proposal: keep the file as it arrived from the data collection, and never save over it.
    Make every correction as a line of code. The code reads the raw file and fixes the value. A
    comment says why. The code then writes a new, cleaned file.

    Count the rows before and after. The colleague's goal, a
    clean dataset, is still met. It is now made from the raw file every time the code runs.
  skill_ref: S52-R1-K02
- type: interpretation
  prompt: |
    A classmate's draft introduction says: "Excel deleted 15,841 COVID-19 cases in England in 2020
    because of its row limit." Check this sentence against what PHE's statement says, and rewrite
    it so that every part of it is supported.
  answer: |
    Check the reference as Book 0 taught: find the source, confirm it, find the passage, read it.

    The number holds: PHE says 15,841 cases from 25 September to 2 October were not included in the
    reported daily figures.

    "Deleted" does not hold. The cases were delayed, not deleted. PHE says everyone who tested
    positive got their result as normal, and the outstanding cases were passed to contact tracing.

    "Excel" and "row limit" do not hold. The statement says some files "exceeded the maximum file
    size" of the process that loads them into central systems. It names no software and no row
    limit.

    A supported version, in two sentences: "In England, 15,841 positive COVID-19 test results from
    25 September to 2 October 2020 were left out of the reported daily figures. Public Health
    England gave the cause as files that exceeded the maximum size the loading system could take."
- type: teaching
  prompt: |
    A first-year resident has ten minutes and a whiteboard. They say: "My data are small, a few
    hundred rows. I can see every cell. Why should I bother with code?" Teach them, using one of the
    three cases.
  answer: |
    Draw a column of gene names on the board: SEPT2, MARCH1, and a few others. Next to it, draw the
    same column as Excel showed it: 2-Sep, 1-Mar.

    Ask: if you had typed the first column and later opened the file, would you notice? Most people
    say yes, for two rows. Then point out that the errors Ziemann and colleagues found sat in
    published papers, checked by authors, reviewers and editors. Being able to see every cell is not
    the same as looking at every cell.

    Then make the real point. Size is not the issue. The issue is whether a second person can see
    what was done. If every change is a line of code, the change is there to read. If it was typed
    into a cell, it is invisible.

    End with the rule they can use tomorrow: keep the raw file as it came, never save over it, and
    put every change in code.
quantitative: false
retrieval_items:
- q: What did Excel, with its default settings, do to gene symbols such as SEPT2 and MARCH1, and how common was it in the papers Ziemann and colleagues screened?
  a: It turned them into dates ("2-Sep", "1-Mar"). Errors were confirmed in 704 of the 3597 papers with Excel gene lists, about one in five ({{n:ziemann_affected_pct}}), in 18 journals from 2005 to 2015.
- q: In the Reinhart and Rogoff replication, what did the spreadsheet error alone do to average growth in the high-debt category, and what did all the problems together do?
  a: The spreadsheet error alone moved it from 2.2% to 1.9% a year. All the problems together, the exclusions, the weighting and the error, gave the published −0.1%.
- q: What cause did Public Health England give for the 15,841 results missing from the daily figures in October 2020, and what does its statement not say?
  a: Some files exceeded the maximum file size of the process that loads them into central systems. The statement does not name Excel, any software, a file format or a row limit.
- q: What rule does this book follow because of cases like these?
  a: Never edit or save over the raw data file. Make every change in code that reads it and can be rerun, and count the rows before and after each step.
