simplified_explanation: |
  Here is the trap with data. A number can change, or a row can go missing, and nothing on the screen
  tells you. The table looks right, so you trust it.

  - **A program changed values as the file was opened.** About one in five genomics papers that came
    with Excel gene lists carried such errors.
  - **A formula covered the wrong rows, and choices went unsaid.** Other data had been left out on
    purpose, and the paper never said so.
  - **A transfer lost rows.** Some files were too big for the system that loaded them.

  So this book follows one rule. You never edit the raw data file. Every change you make to the
  data is a line of code, kept in a file, that anyone can read and run again. And you count your
  rows before and after each step.
illustrations:
- body: |
    Start with the gene names, because the failure is easy to picture.

    A gene symbol is a short code for one gene: SEPT2, MARCH1. Ziemann, Eren and El-Osta report
    that Excel, with its default settings, turns these into dates. SEPT2 becomes "2-Sep". MARCH1
    becomes "1-Mar". Nobody typed a date. The program decided the text looked like one.

    The authors then went looking for how often this reached published papers. They wrote programs
    to screen 35,175 supplementary Excel files from 18 journals, published from 2005 to 2015.
    Supplementary files are the extra files published alongside a paper. They found gene lists attached to 3597 papers. They confirmed errors in 704 of those papers.

    Now check their headline figure yourself, as Book 0's section on percentages taught you. Ask
    first: per cent of what? Of the papers that had gene lists in Excel files. Not of all papers in
    those journals.

    ```working
    704 ÷ 3597 = 0.1957
    0.1957 × 100 = 19.57
    ```

    That rounds to {{n:ziemann_affected_pct}}, the figure they state. It is about one paper in five.

    Here is what made the error so hard to undo. A date carries no trace of the name it replaced.
    Of the 987 files with errors, 166 held nothing else, such as a gene's position, from which the
    original names could be worked out. Those names are lost from the file.

    The world adjusted around the problem. In 2020 the committee that names human genes reported
    that it had renamed every symbol Excel turned into a date. SEPT1 is now SEPTIN1, and MARCH1 is now
    MARCHF1.
  analogy_breaks_when: |
    The {{n:ziemann_affected_pct}} describes papers with Excel gene lists in 18 journals from 2005 to 2015. It is not a
    rate for all papers, all journals or later years, and the authors could not screen supplementary
    files behind a paywall.

    The finding is about Excel's behaviour in 2016, as the authors report it. Spreadsheet programs
    change between versions, and this course has not tested a current one. What carries over is the
    pattern: a program can change a value as it reads a file, and say nothing.
