- body: |
    Now a case where the error sat inside a formula, and the larger problems were choices nobody
    wrote down.

    In 2010 Reinhart and Rogoff published figures on public debt and economic growth in 20 rich
    countries. Herndon, Ash and Pollin tried to rebuild them. From
    the data the authors had posted, they could not. The posted spreadsheets did not record which
    data series, years and methods the papers had used. Only when Reinhart and Rogoff sent their
    working spreadsheet could the replication begin.

    Follow what the working spreadsheet held. Count the years in which a country carried public
    debt above 90% of its GDP, the highest category the papers used.

    ```table
    | Step | Years counted |
    | All the data | 110 |
    | After the exclusions Reinhart and Rogoff chose | 96 |
    | After those exclusions and the spreadsheet error | 71 |
    ```

    The spreadsheet error was one formula. It averaged rows 30 to 44 when the data ran to row 49.
    Five countries, Australia, Austria, Belgium, Canada and Denmark, fell out of every average.
    The authors note that the countries left out run in alphabetical order, a block of rows.

    The exclusions were choices. Some early post-war years for Australia, Canada and New Zealand
    were left out, and the papers never said so.

    Then read what each problem did to the answer. With all the data, average growth in the
    high-debt category was 2.2% a year. The published figure was −0.1%. Herndon and colleagues
    corrected each problem alone, too. The spreadsheet error by itself moved the figure only from
    2.2% to 1.9%. So did the exclusions alone, and so did the weighting alone. It took all of them
    together, which the authors say interact strongly, to reach −0.1%.

    Reinhart and Rogoff acknowledged the spreadsheet errors. In their 2013 working paper, Herndon
    and colleagues drew a lesson for economists: the advantages of reproducible code over working
    spreadsheets.
  analogy_breaks_when: |
    It is tempting to tell this as "a spreadsheet slip changed world policy". The replication does
    not say that. The slip alone moved the figure by 0.3 of a percentage point. The undeclared
    exclusions and the way countries were weighted mattered as much, and the authors stress that the
    problems work together.

    Code would not have stopped anyone choosing to leave data out. What a script does is show the
    choice, as a line someone can read and question.
