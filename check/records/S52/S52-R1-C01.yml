    unit: per cent a year, mean real GDP growth above 90% debt/GDP, all data, country-year weighting
    citekey: herndon_2014_cje
    as_of: '2026-10-02'
    quote: |-
      Over 1946– 2009, countries with public debt/GDP ratios above 90% averaged 2.2% real annual GDP growth, not −0.1% as published.
