simplified_explanation: |
  1. **The question.** One sentence, saying who, what is measured, and how it is summarised.
  2. **The data.** Download the raw files. Read the terms that come with them. Record each file's
     checksum.
  3. **The dictionary.** One row per variable you will use: its name in the file, its meaning, its
     unit, its codes, and where you found them.
  4. **The project folder.** `data-raw/` for the files as they arrived, `code/` for the script,
     `output/` for what the script makes.
  5. **The script.** Read, check, join, clean, work out new columns, summarise, plot, write the
     outputs, print the versions.
  6. **The README.** What the project is, where the data came from, and the one command that
     reruns it.
  7. **The rerun.** Delete the outputs and run the command from nothing. The same table and the
     same figure must come back.
  8. **What it does not show.** Say it, next to the result.
illustrations:
- body: |
    Start with the question, written in one sentence before you touch the data:

    > Among adults aged 20 and over who were examined in NHANES between August 2021 and August
    > 2023 and were not pregnant at the exam, how is measured body mass index (BMI) spread in men
    > and in women?

    BMI is weight in kilograms divided by the square of height in metres, measured in kg/m^2. The
    question names who (adults examined in one survey cycle, not pregnant), what is measured
    (BMI from measured weight and height), and how it is summarised (its spread, by gender). It
    does not ask about the United States. That matters later.

    Now the data. NHANES, the National Health and Nutrition Examination Survey, publishes each
    part of the survey as its own file. The measurements are in the body measures file, `BMX_L`.
    Age, gender and pregnancy are in the demographics file, `DEMO_L`. Both carry `SEQN`, the
    respondent sequence number, which is the key that joins them. You download both `.xpt` files
    from the survey's website and put them, unchanged, in `data-raw/`.

    Before using them, read the terms. NHANES files come under the Data User Agreement of the
    National Center for Health Statistics, the American agency that runs the survey. Among other
    things, users agree to "Use the data in this dataset for statistical reporting and analysis
    only" and to "Make no attempt to learn the identity of any person or establishment included in
    these data". Neither the agreement nor the documentation states a copyright licence. Write the
    terms in the README.

    Then record what arrived. Take each file's MD5 checksum, as in the section on reading raw
    files, and count its rows:

    ```r
    library(haven)
    library(here)

    unname(tools::md5sum(here("data-raw", c("BMX_L.xpt", "DEMO_L.xpt"))))

    bmx <- read_xpt(here("data-raw", "BMX_L.xpt"))
    demo <- read_xpt(here("data-raw", "DEMO_L.xpt"))
    nrow(bmx)
    nrow(demo)
    ```

    ```output
    here() starts at ~/project
    [1] "ab25a36296e5b61881d42fef61c06b84"
    [2] "14555b1f4e3c909172e900f63a2ecd03"
    [1] 8860
    [1] 11933
    ```

    The body measures file has {{n:bmx_rows}} rows, one for each person examined. The demographics
    file has {{n:demo_rows}}, because it also holds people who were interviewed and never examined. The two
    checksums go in the README, so that anyone can confirm later that they have the same files.

    Next, the dictionary. Write it from the survey's own documentation, the codebook pages for the
    two files, for the variables the question needs and no others:

    ```table
    | Variable | File | Meaning | Unit | Codes | Source |
    | SEQN | both | respondent sequence number, one per person | none | a number | codebooks; checked unique in the file |
    | RIAGENDR | DEMO_L | gender | none | 1 Male, 2 Female | DEMO_L codebook |
    | RIDAGEYR | DEMO_L | age in years at the screening interview | years | 0 to 79; 80 means 80 and over | DEMO_L codebook |
    | RIDEXPRG | DEMO_L | pregnancy status at the exam | none | 1 pregnant, 2 not pregnant, 3 cannot tell; missing for anyone not asked | DEMO_L codebook |
    | BMXWT | BMX_L | weight | kg | measured value | BMX_L codebook |
    | BMXHT | BMX_L | standing height | cm | measured value | BMX_L codebook |
    | BMXBMI | BMX_L | BMI, worked out from weight and height and rounded to one decimal | kg/m^2 | worked-out value | BMX_L codebook |
    ```

    Two entries will matter in the script. Ages of 80 and over are all written as 80, so no age in
    the file is above 80. And the pregnancy question was asked only of some women, so the column
    is missing for every man and for most women. Type the dictionary once, by hand, and save it as
    `data-raw/nhanes_dictionary.csv` beside the raw files.

    The project folder is the one this book has used throughout: `data-raw/`, `code/` and
    `output/`. The README goes at the top. Write it now, with the outputs named, and treat its rerun
    line as a promise you are about to test:

    > BMI of adults in NHANES 2021–2023, by gender
    >
    > The spread of measured BMI in men and women aged 20 and over, not pregnant at the exam,
    > examined in NHANES August 2021–August 2023. Every summary is unweighted and describes these
    > participants only.
    >
    > Raw data: `data-raw/BMX_L.xpt` (MD5 ab25a36296e5b61881d42fef61c06b84) and
    > `data-raw/DEMO_L.xpt` (MD5 14555b1f4e3c909172e900f63a2ecd03), downloaded unchanged from the
    > NHANES website. Use is governed by the NCHS Data User Agreement: statistical reporting and
    > analysis only, and no attempt to identify anyone.
    >
    > Data dictionary: `data-raw/nhanes_dictionary.csv`.
    >
    > To rerun: open a terminal in this folder and type `Rscript code/analysis.R`. The script reads
    > `data-raw/`, never writes to it, and writes `output/bmi_by_gender.csv` (the table) and
    > `output/bmi_by_gender.png` (the figure).
    >
    > Written with R {{n:r_version}}; the versions of every package are printed at the end of each
    > run. Contact: your name and email address.
  analogy_breaks_when: |
    These files came with complete documentation, a stated key and published terms. A thesis
    dataset exported from a form tool, or a register typed up from a clinic, often comes with none
    of the three. Then the dictionary is written from the questionnaire and from asking the people
    who collected the data, and the README says so.

    The checksums prove that your files are the files you recorded. They cannot prove that those
    are the files the survey published, unless the survey also publishes checksums.
  numbers:
  - value: "8860"
