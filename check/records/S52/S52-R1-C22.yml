      Due to disclosure concerns, all responses of participants aged 80 years and older are coded as “80.”
- body: |
    Build the script a step at a time, checking the row count after each step. The first step that
    went wrong while this section was being written goes first.

    Join the demographics onto the body measures by `SEQN`, as in the section on joining. A
    `left_join()` keeps every row of the left table, so the count must stay at {{n:bmx_rows}}.
    `relationship = "one-to-one"` tells the join to stop with an error if a key turns up twice in
    either file:

    ```r
    library(dplyr)

    n_distinct(bmx$SEQN)
    n_distinct(demo$SEQN)

    nhanes <- bmx |>
      left_join(demo, by = "SEQN", relationship = "one-to-one")
    nrow(nhanes)
    ```

    ```output

    Attaching package: ‘dplyr’

    The following objects are masked from ‘package:stats’:

        filter, lag

    The following objects are masked from ‘package:base’:

        intersect, setdiff, setequal, union

    [1] 8860
    [1] 11933
    [1] 8860
    ```

    Each file has as many distinct `SEQN` values as rows, so the key is one per person in both. The
    join added no row and lost none. Now keep the adults:

    ```r
    adults <- nhanes |>
      filter(RIDAGEYR >= 20)
    nrow(adults)

    adults |>
      count(RIDEXPRG)
    ```

    ```output
    [1] 6064
    # A tibble: 4 × 2
      RIDEXPRG     n
         <dbl> <int>
    1        1    41
    2        2  1065
    3        3    28
    4       NA  4930
    ```

    {{n:nhanes_adults_rows}} adults. Of them, 41 were pregnant at the exam (code 1). The question
    leaves them out, so you expect {{n:nhanes_adults_rows}} minus 41, which is 6023 rows, after the next step. Here is the first draft of that line:

    ```r
    first_try <- adults |>
      filter(RIDEXPRG != 1)
    nrow(first_try)
    ```

    ```output
    [1] 1093
    ```

    1093, not 6023. The line meant to drop 41 people dropped 4971. The reason is the 4930 rows where
    `RIDEXPRG` is missing: every man, and every woman who was not asked. For them `RIDEXPRG != 1` is
    neither true nor false. It is `NA`, and `filter()` keeps only the rows where the test is
    `TRUE`. The line ran without a warning and gave a plausible table of 1093 adults. All of them
    were women whose pregnancy status was recorded as code 2 or 3, and no man was left. Only the
    expected count caught it.

    Say what you mean instead: keep a row if the value is missing, or if it is not 1.

    ```r
    adults <- adults |>
      filter(is.na(RIDEXPRG) | RIDEXPRG != 1)
    nrow(adults)
    sum(!is.na(adults$BMXBMI))
    ```

    ```output
    [1] 6023
    [1] 5929
    ```

    6023, as expected. Of these, 5929 have a BMI; the other 94 lack a weight or a height.

    One more check before trusting the BMI column. The codebook says BMI was worked out as weight
    in kilograms divided by height in metres squared, then rounded to one decimal. Work it out
    again and find the largest gap between yours and the file's:

    ```r
    bmi_check <- adults$BMXWT / (adults$BMXHT / 100)^2
    max(abs(bmi_check - adults$BMXBMI), na.rm = TRUE)
    ```

    ```output
    [1] 0.04996478
    ```

    The largest gap is under 0.05 kg/m^2, which is what rounding to one decimal allows. So the
    column is what the codebook says it is. Here are the counts at each step:

    ```table
    | Step | Rows |
    | body measures file as read | 8860 |
    | after the join | 8860 |
    | aged 20 and over | 6064 |
    | not pregnant at the exam | 6023 |
    | with a BMI | 5929 |
    ```
  analogy_breaks_when: |
    The expected count caught the pregnancy filter because the codebook gave the number of
    pregnant participants, so you knew what to expect. A filter whose correct result you cannot
    predict has no such check. Count the rows it removes, and look at a few of them.

    The BMI check compares the file with itself. It confirms the column was worked out as
    documented. It cannot catch a weight or height that was measured or recorded wrongly.
- body: |
    Now put the steps that survived into the script, in order, with a comment for each. This is the
    whole of `code/analysis.R`:

    ```r file=code/analysis.R
    # analysis.R
    # BMI of adults aged 20 and over, by gender, in NHANES August
    # 2021-August 2023 (files BMX_L and DEMO_L), leaving out anyone
    # pregnant at the exam.
    # Run from the project folder: Rscript code/analysis.R
    # Reads data-raw/ and never writes to it; writes two files to
    # output/. Every summary is unweighted: it describes these
    # participants only.

    library(haven)
    library(dplyr)
    library(readr)
    library(ggplot2)
    library(here)

    dir.create(here("output"), showWarnings = FALSE)

    # 1. Read the two raw files
    bmx <- read_xpt(here("data-raw", "BMX_L.xpt"))
    demo <- read_xpt(here("data-raw", "DEMO_L.xpt"))
    cat("Participants with body measures:", nrow(bmx), "\n")

    # 2. Check the key: one row per participant in each file
    stopifnot(
      n_distinct(bmx$SEQN) == nrow(bmx),
      n_distinct(demo$SEQN) == nrow(demo)
    )

    # 3. Join demographics onto body measures; no row added or lost
    nhanes <- bmx |>
      left_join(demo, by = "SEQN", relationship = "one-to-one")
    stopifnot(nrow(nhanes) == nrow(bmx))

    # 4. Keep adults not pregnant at the exam. RIDEXPRG is missing
    #    for everyone not asked, so missing rows are kept on purpose.
    adults <- nhanes |>
      filter(RIDAGEYR >= 20) |>
      filter(is.na(RIDEXPRG) | RIDEXPRG != 1) |>
      mutate(
        gender = factor(RIAGENDR, levels = c(1, 2),
                        labels = c("Male", "Female")),
        bmi_check = BMXWT / (BMXHT / 100)^2
      ) |>
      select(SEQN, gender, age = RIDAGEYR, weight_kg = BMXWT,
             height_cm = BMXHT, bmi = BMXBMI, bmi_check)
    cat("Adults kept:", nrow(adults), "\n")
    cat("Adults with a BMI:", sum(!is.na(adults$bmi)), "\n")

    # 5. Check the values. Limits set before looking at the data;
    #    a value outside them stops the script so that you look.
    stopifnot(
      "measured adult heights are between 50 and 250 cm" =
        all(adults$height_cm >= 50 & adults$height_cm <= 250,
            na.rm = TRUE),
      "measured adult weights are between 20 and 300 kg" =
        all(adults$weight_kg >= 20 & adults$weight_kg <= 300,
            na.rm = TRUE),
      "BMI agrees with weight / height^2 to rounding" =
        all(abs(adults$bmi - adults$bmi_check) <= 0.05, na.rm = TRUE)
    )

    # 6. Summarise BMI by gender, with the n behind every number.
    #    The mean is rounded for display, to BMI's one decimal.
    bmi_by_gender <- adults |>
      group_by(gender) |>
      summarise(
        n_adults = n(),
        n_bmi = sum(!is.na(bmi)),
        mean_bmi = round(mean(bmi, na.rm = TRUE), 1),
        q1_bmi = quantile(bmi, 0.25, na.rm = TRUE),
        median_bmi = median(bmi, na.rm = TRUE),
        q3_bmi = quantile(bmi, 0.75, na.rm = TRUE)
      )
    print(bmi_by_gender)
    write_csv(bmi_by_gender, here("output", "bmi_by_gender.csv"))

    # 7. Plot the spread of BMI by gender
    bmi_plot <- adults |>
      filter(!is.na(bmi)) |>
      ggplot(aes(x = gender, y = bmi)) +
      geom_boxplot() +
      labs(
        x = NULL,
        y = "BMI (kg/m^2)",
        caption = "NHANES 2021-2023, aged 20+, not pregnant; unweighted"
      )
    ggsave(here("output", "bmi_by_gender.png"), bmi_plot,
           width = 5, height = 4, dpi = 150)

    # 8. Record the versions that made these outputs
    sessionInfo()
    ```

    Read it from the top and you can name the section of this book behind each step: the project
    folder and `here()`, reading a raw file, checks that stop the script, the join, choosing rows,
    new columns and factors, summaries by group, the plot, and the fresh run. `cat()` prints its
    arguments as one line of text, which gives the run a short log of counts.

    Open a terminal in the project folder and type the README's command:

    ```sh
    Rscript code/analysis.R
    ```

    ```output

    Attaching package: ‘dplyr’

    The following objects are masked from ‘package:stats’:

        filter, lag

    The following objects are masked from ‘package:base’:

        intersect, setdiff, setequal, union

    here() starts at ~/project
