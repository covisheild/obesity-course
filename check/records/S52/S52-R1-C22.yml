    Read the table as the dictionary and the question tell you to. There are {{n:nhanes_men_bmi_n}} men and 3249 women
    with a BMI, and {{n:nhanes_men_bmi_n}} + 3249 = 5929, the count in the log. Every check passed, or the script
    would have stopped at it. The versions printed below the table are the record of what produced
    it.

    The three quartiles answer the question, as Book 0 taught them: a quarter of the values lie
    below the first quartile, half below the median, three quarters below the third quartile.

    ```table
    | Share of adults below the value (%) | Male | Female |
    | 25 | 24.9 | 24.4 |
    | 50 | 28.1 | 28.7 |
    | 75 | 32.4 | 34.7 |
    ```

    The median BMI is {{n:nhanes_men_bmi_median}} kg/m^2 in men and 28.7 kg/m^2 in women, close together. The spread is
    not. The middle half of the women runs from 24.4 to 34.7 kg/m^2, a width of 10.3 kg/m^2. The
    middle half of the men runs from 24.9 to 32.4 kg/m^2, a width of 7.5 kg/m^2. The women's upper
    quarter reaches higher. The means, {{n:nhanes_men_bmi_mean}} and 30.3 kg/m^2, sit above both medians, because a long
    tail of high values pulls a mean up and leaves a median where it is.
  analogy_breaks_when: |
    The range limits in step 5 are the ones the section on checks used, and they are wide on
    purpose: they stop the script for a height of 17 cm or a weight of 700 kg, not for an unusual
    but real adult. They passed here partly because the
    survey's own team had already reviewed the values. Their documentation says values judged
    unrealistic "were deleted from the file". A file nobody has reviewed may stop at step 5, and
    that is the step doing its job.

    The script handles these two files. If the survey releases a corrected file, its checksum will
    differ from the README's, and the counts in the log may change. Rerun, compare, and record the
    new checksum.
