- body: |
    The rerun is the test the whole book has been building to. Start from nothing: delete
    `output/`, run the command again, and compare the new table with the old one, byte for byte.

    ```sh
    cp output/bmi_by_gender.csv first_run.csv
    rm -r output
    Rscript code/analysis.R > /dev/null 2>&1
    ls output
    cmp first_run.csv output/bmi_by_gender.csv && echo "identical"
    cat output/bmi_by_gender.csv
    ```

    ```output
    bmi_by_gender.csv
    bmi_by_gender.png
    identical
    gender,n_adults,n_bmi,mean_bmi,q1_bmi,median_bmi,q3_bmi
    Male,2720,2680,29.3,24.9,28.1,32.4
    Female,3303,3249,30.3,24.4,28.7,34.7
    ```

    Both outputs came back, and the table is identical to the one before. A colleague with the
    project folder runs the same command on their computer. If their table differs, the checksums
    and the version lines are where the two of you start looking. This is the gate to the next
    rung: the analysis reproduces from the raw data with one command.

    Now say what it does not show, in the README and next to any number you quote from it.

    - It does not estimate anything about the United States. The survey's documentation says its
      sample weights "should be used to analyze the body measures data". This analysis uses none,
      so its summaries describe these 5929 participants and nobody else. Weights are taught in the
      subject on India's data infrastructure and complex surveys.
    - It says nothing about India, or about adults anywhere else.
    - BMI is worked out from weight and height. It is not a measurement of body fat.
    - It is one examination of each person. It says nothing about change over time, or about what
      causes a higher or lower BMI.
    - Its correctness rests on the checks. A mistake that passes every check reruns perfectly.

    The next rung of this subject takes the same project further. A block of code repeated three
    times becomes a function you write. Git records every change to the script. A Quarto document
    replaces the step where you copy 28.1 into your text: the code writes the number into the
    document itself. DuckDB queries files too big to read into R at once. A form tool such as
    KoboToolbox, ODK or REDCap writes the raw file at the point where the data are collected.
  analogy_breaks_when: |
    The rerun on one computer shows the script is complete. It does not show that a computer with
    other package versions gets the same table; only a second person's run shows that, and pinning
    the versions is two rungs up.

    The comparison here is of the CSV file. Compare a figure by looking at it: an image file can
    differ in its bytes when nothing you would see has changed.
must_know:
- point: |
    Write the question before you open the data, and write who it is about.
  kind: move
  bearing: methodological
- point: |
    The error is to trust a filter because it ran without a warning. Before each filter, write
    down how many rows you expect it to keep, and check.
  kind: misconception
  bearing: methodological
- point: |
    Record each raw file's checksum in the README on the day it arrives, and the terms it came
    with.
  kind: move
  bearing: policy
- point: |
    Put a printed row count after every step that can add or drop rows, and a `stopifnot()` where
    you know the right count.
  kind: move
  bearing: methodological
- point: |
    Any summary of an NHANES file without its sample weights describes the participants in the
    file. Write "unweighted" beside it, and never present it as the figure for the United States,
    still less for India.
  kind: boundary
  bearing: public
  refs:
  - nchs_nhanes_2021_2023_bmx_demo
- point: |
    The gate is one command from raw data to the same outputs. Ask for it before you read a single
    result.
  kind: move
  bearing: teaching
- point: |
    Reproducible means the result can be checked, not that it is right. A wrong cut-point or a
    wrong filter reruns perfectly.
  kind: boundary
  bearing: methodological
common_misreading: |
  "NHANES shows the median BMI of American women is 28.7 kg/m^2." The table does not say that. It
  gives the median of 3249 women examined in one survey cycle. It uses none of the survey's sample
  weights, and the survey's documentation says those weights should be used. So 28.7 kg/m^2 describes these
  participants. Read it as "in this sample", never as "in America".
exercises:
- type: retrieval
  prompt: |
    Without looking back, list the steps of an end-to-end analysis in the order real work runs
    them. Then say what the gate to the next rung is.
  answer: |
    1. The question.
    2. The raw files, their terms and their checksums.
    3. The data dictionary.
    4. The project folder.
    5. The script. It reads, checks, joins, cleans, works out new columns, summarises, plots,
       writes its outputs and prints the versions.
    6. The README, with the one command.
    7. A rerun from nothing.
    8. What the result does not show.

    The gate: the analysis reproduces from the raw data with one command, `Rscript code/analysis.R`,
    in a fresh session.
- type: build
  prompt: |
    Build the rung's target with a dataset of your own. It may be a thesis dataset, or a department
    register you have permission to use. It may be the NHANES files of this section, with a question
    of your own.

    Write the question in one sentence. Put the raw files in `data-raw/` and record their
    checksums and terms. Write the data dictionary.

    Write `code/analysis.R` so that it reads,
    checks, cleans, summarises and plots, writes one table and one figure to `output/`, and ends
    with `sessionInfo()`. Write the README. Then delete `output/`, run `Rscript code/analysis.R`
    in a fresh session, and give the project folder to a colleague to run the same command.
  answer: |
    The project passes when all of these hold.

    1. The question is one sentence and says who the answer is about.
    2. `data-raw/` holds the files exactly as they arrived. Their checksums in the README match
       `tools::md5sum()` on them now. No code writes to that folder.
    3. The dictionary has a row for every variable the script uses. Each row gives the name exactly
       as in the file, its meaning, unit and codes, and where each came from.
    4. The script reads every file with `here()`. It needs no object, package or file that it does
       not load or make itself.
    5. It prints the row count after each step that can add or drop rows. It stops with
       `stopifnot()` where a count, a key or a range is wrong.
    6. Every change to the data is a line of code with a comment. No cell was edited by hand.
    7. Every summary prints its n. A survey summary says whether it is weighted.
    8. The table and the figure are written to `output/` by code, and the script ends with
       `sessionInfo()`.
    9. After `output/` is deleted, `Rscript code/analysis.R` brings back the same table, byte for
       byte.
    10. Your colleague's run gives the same table. If it does not, the two `sessionInfo()`
        printouts are compared and the difference is written in the README.

    Write, beside the result, what it does not show.
  skill_ref: S52-R1-K01
- type: critique
  prompt: |
    A colleague sends you the project for her thesis chapter. The README says: "Run the scripts in
    code/ in order." `code/` holds `clean.R` and `analysis.R`. The first line of `clean.R` is
    `data <- read_excel("C:/Users/anita/Desktop/final data (2).xlsx")`. Its last line is
    `write_xlsx(data, "C:/Users/anita/Desktop/final data (2).xlsx")`. Her chapter reports "mean
    BMI 24.6 kg/m^2 (n = 412)". Find each thing that stops this project from passing the gate, and
    say what each one would cost her.
  answer: |
    - The README gives no single command, and "in order" leaves the reader guessing. Fix: one
      script, or one command that runs both, written in the README.
    - The path is absolute and names her desktop, so the script stops on every other computer.
      Fix: put the file in `data-raw/` and read it with `here()`.
    - The last line writes over the file it read. After one run the raw data are gone, replaced by
      the cleaned version, and nothing can be rerun from the original. Fix: never write to the raw
      file; write cleaned data to `output/` if it is needed at all.
    - The file name "final data (2)" says there was a "final data (1)". Nobody can tell which one the
      chapter used. Fix: record the raw file's checksum in the README.
    - The number 24.6 kg/m^2 has no line of code that writes it to a file, so it was copied off a
      screen. Fix: write the table to `output/` with code and take the number from there.

    The cost: as it stands, nobody, including Anita in a year, can show that 24.6 kg/m^2 comes from
    the data collected. Her examiner can ask, and she cannot answer.
  skill_ref: S52-R1-K02
- type: teaching
  prompt: |
    A health secretary asks why the department's analysts should hand over every analysis as a
    project folder that reruns with one command. Answer on one page. Put the answer first, then the
    reasons, with no methods section.
  answer: |
    Answer: because then someone else can check any number in a departmental report in minutes.
    Without it, nobody can check it at all.

    - **Mistakes are found before publication, not after.** A rerun by a second analyst catches a
      step that lived only on one laptop.
    - **Work survives people.** When an analyst leaves, the next one reruns the folder instead of
      starting again.
    - **Corrections are cheap.** When the raw data are corrected, the same command remakes every
      table.
    - **The cost is small.** It is a habit and free software, not a purchase.

    What it does not buy: a rerunnable analysis can still ask the wrong question. Someone still has
    to read it.
quantitative: false
retrieval_items:
- q: In what order does real work run an analysis from question to result?
  a: Question; raw data obtained, terms read, checksums recorded; data dictionary; project folder;
    script (read, check, join, clean, derive, summarise, plot, write outputs, print versions);
    README with the one command; a rerun from nothing; what the result does not show.
- q: Why did `filter(RIDEXPRG != 1)` keep only 1093 of {{n:nhanes_adults_rows}} adults?
  a: RIDEXPRG is missing for everyone not asked. For those rows the test gives NA, and `filter()`
    keeps only rows where the test is TRUE, so they were all dropped. Keep them explicitly with
    `is.na(RIDEXPRG) | RIDEXPRG != 1`.
- q: What is the gate to the next rung of this subject?
  a: The analysis reproduces from the raw data with one command, `Rscript code/analysis.R`, run in
    a fresh session.
- q: What does an unweighted summary of an NHANES file describe?
  a: The participants in the file only. It is not an estimate for the United States, because the
    survey's documentation says its sample weights should be used.
figures:
- file: "s52-r1-c22-bmi-quartiles.png"
  caption: "The first quartile, median and third quartile of measured BMI in 2680 men and 3249 women aged 20 and over, not pregnant, examined in NHANES 2021–2023. The medians are close, 28.1 and 28.7 kg/m^2; the women's third quartile, 34.7 kg/m^2, is higher than the men's, 32.4 kg/m^2. Unweighted: these values describe the participants, not the United States."
  alt: "A chart of points for two groups at 25, 50 and 75 per cent. Male: 24.9, 28.1, 32.4 kg/m^2. Female: 24.4, 28.7, 34.7 kg/m^2. The female points start lower and end higher."
  source: "draw.py"
  spec:
    kind: "scatter"
    from_table: {block: 2, x: 0, y: [1, 2]}
    x_label: "share of adults below the value (%)"
    y_label: "BMI (kg/m^2)"
    relations:
    - {check: "y2[2] - y2[0] = 10.3"}
    - {check: "y1[2] - y1[0] = 7.5"}
- file: "s52-r1-c22-pregnancy-filter.png"
  caption: "Rows left by two ways of dropping the 41 adults pregnant at the exam from the 6064 aged 20 and over. The first try, filter(RIDEXPRG != 1), keeps 1093: the 1065 coded 2 and the 28 coded 3. It drops the 4930 rows where RIDEXPRG is missing, every man among them, with no warning. Keeping a row if RIDEXPRG is missing or not 1 leaves 6023, the 6064 minus 41 expected before the line was run."
  alt: "A bar chart of three counts: adults aged 20 and over 6064; first try, RIDEXPRG not equal to 1, 1093; missing or not 1, 6023."
  source: "draw.py"
  spec:
    kind: "bar"
    x: ["aged 20 and over", "first try:\nRIDEXPRG != 1", "is.na(RIDEXPRG) |\nRIDEXPRG != 1"]
    series:
    - {name: "rows", y: ["6064", "1093", "6023"]}
    x_label: "step"
    y_label: "rows"
    y_range: [0, 7000]
    value_labels: true
    size: [5.8, 3.0]
    relations:
    - {check: "y[0] - y[2] = 41"}
    - {check: "y[1] = 1065 + 28"}
    - {check: "y[0] - y[1] = 41 + 4930"}
    - {check: "41 + 1065 + 28 + 4930 = 6064"}
- file: "s52-r1-c22-rows-per-step.png"
  caption: "Rows after each step of the end-to-end script: 8860 in the body measures file as read and after the join on SEQN, 6064 aged 20 and over, 6023 not pregnant at the exam, and 5929 with a BMI. The 41 pregnant adults and the 94 without a weight or a height are the two drops after the age filter. Each count is printed by the script, so a step that loses the wrong rows shows here first."
  alt: "A bar chart of five steps: body measures file as read 8860, after the join 8860, aged 20 and over 6064, not pregnant at the exam 6023, with a BMI 5929."
  source: "draw.py"
  spec:
    kind: "bar"
    from_table: {block: 1, x: 0, y: [1]}
    x_label: "step of the script"
    y_label: "rows"
    y_range: [0, 10000]
    value_labels: true
    size: [8.0, 3.0]
    relations:
    - {check: "y[0] = y[1]"}
    - {check: "y[2] - y[3] = 41"}
    - {check: "y[3] - y[4] = 94"}
