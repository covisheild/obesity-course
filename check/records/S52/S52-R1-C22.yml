    kind: textbook
    locator: 'Ch. 6 "Workflow: scripts and projects", 6.2.1 "What is the source of truth?", first paragraph'
    quote: |-
      your source of truth should be the R scripts. With your R scripts (and your data files), you can recreate the environment.
    verified:
