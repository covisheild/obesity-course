definition:
  text: |
    A data dictionary is a separate file, laid out as a table, that explains every variable in one data file. It has one
    row per variable.

    A README is a short plain-text file at the top of the project folder. It gives the one command that reruns the
    analysis, and the folder to run it from.
  references:
  - citekey: broman_woo_2018_tas
    kind: primary
    locator: 'section 8 "Create a Data Dictionary", first paragraph'
    quote: |-
      It is helpful to have a separate file that explains what all of the variables are. It is helpful if this is laid out in rectangular form, so that the data analyst can make use of it in analyses.
    verified:
      resolved_id: https://doi.org/10.1080/00031305.2017.1375989
      opened: true
      claim_located: true
      checked_on: '2026-10-02'
      note: |-
        Typeset article, CC BY-NC-ND 4.0: quoted briefly, not adapted. The section's list goes on:
        "The exact variable name as in the data file", "A longer explanation of what the variable
        means", "The measurement units", "Expected minimum and maximum values" (each line preceded
        in the text layer by a stray "r", the extraction's rendering of a bullet).
  - citekey: broman_woo_2018_tas
    kind: primary
    locator: 'section 8 "Create a Data Dictionary": the exact name, and the units'
    quote: |-
      The exact variable name as in the data file
    verified:
      resolved_id: https://doi.org/10.1080/00031305.2017.1375989
      opened: true
      claim_located: true
      checked_on: '2026-10-02'
  - citekey: broman_woo_2018_tas
    kind: primary
    locator: 'section 8 "Create a Data Dictionary", last paragraph: allowed values'
    quote: |-
      information about the allowed values for the variables would be helpful in identifying data entry errors.
    verified:
      resolved_id: https://doi.org/10.1080/00031305.2017.1375989
      opened: true
      claim_located: true
      checked_on: '2026-10-02'
  - citekey: broman_woo_2018_tas
    kind: primary
    locator: 'section 8 "Create a Data Dictionary": metadata and the ReadMe file'
    quote: |-
      This is part of the metadata that you will want to prepare: information about the data. You will also want a ReadMe file that includes an overview of the project and data.
    verified:
      resolved_id: https://doi.org/10.1080/00031305.2017.1375989
      opened: true
      claim_located: true
      checked_on: '2026-10-02'
  - citekey: wilson_2017
    kind: primary
    locator: 'Collaboration, 3a "Create an overview of your project": what a README holds'
    quote: |-
      This file (generally called README, README.txt, or something similar) should contain the project's title, a brief description, up-to-date contact information, and an example or 2 of how to run various cleaning or analysis tasks.
    verified:
      resolved_id: https://doi.org/10.1371/journal.pcbi.1005510
      opened: true
      claim_located: true
      checked_on: '2026-10-02'
  - citekey: wilson_2017
    kind: primary
    locator: 'Data management, 1a "Save the raw data": record how the raw data were obtained'
    quote: |-
      record the exact procedure used to obtain the raw data, as well as any other pertinent information, such as an official version number or the date of download.
    verified:
      resolved_id: https://doi.org/10.1371/journal.pcbi.1005510
      opened: true
      claim_located: true
      checked_on: '2026-10-02'
      note: |-
        Wilson and colleagues give this for data too large to copy locally; the README here records
        the version and source of a file that is copied, which the same sentence's reasoning covers.
  - citekey: wilson_2017
    kind: primary
    locator: 'Project organization, 4c: raw data and metadata in a data directory'
    quote: |-
      Put raw data and metadata in a data directory and files generated during cleanup and analysis in a results directory (4c)
    verified:
      resolved_id: https://doi.org/10.1371/journal.pcbi.1005510
      opened: true
      claim_located: true
      checked_on: '2026-10-02'
  - citekey: wilson_2017
    kind: primary
    locator: 'Collaboration, 3d "Make the license explicit"'
    quote: |-
      Have a LICENSE file in the project's home directory that clearly states what license(s) apply to the project's software, data, and manuscripts.
    verified:
      resolved_id: https://doi.org/10.1371/journal.pcbi.1005510
      opened: true
      claim_located: true
      checked_on: '2026-10-02'
  - citekey: wilson_2017
    kind: primary
    locator: 'Collaboration, 3d: the licences recommended, CC-0 among them'
    quote: |-
      We recommend Creative Commons licenses for data and text, either CC-0 (the "No Rights Reserved" license) or CC-BY
    verified:
      resolved_id: https://doi.org/10.1371/journal.pcbi.1005510
      opened: true
      claim_located: true
      checked_on: '2026-10-02'
      note: |-
        Wilson and colleagues write CC-0; the palmerpenguins DESCRIPTION writes CC0. Same licence
        name; the deed itself is not held.
  - citekey: wilson_2017
    kind: primary
    locator: 'Collaboration, 3e "Make the project citable"'
    quote: |-
      Make the project citable (3e) by including a CITATION file in the project's home directory that describes how to cite this project as a whole
    verified:
      resolved_id: https://doi.org/10.1371/journal.pcbi.1005510
      opened: true
      claim_located: true
      checked_on: '2026-10-02'
  - citekey: wilson_2017
    kind: primary
    locator: 'Data management, 1c "Create the data you wish to see in the world": variable names and codes'
    quote: |-
      replace artificial codes for missing data, such as "-99," with NA, a code used in most programming languages to indicate that data are "Not Available"
    verified:
      resolved_id: https://doi.org/10.1371/journal.pcbi.1005510
      opened: true
      claim_located: true
      checked_on: '2026-10-02'
  - citekey: sandve_2013
    kind: primary
    locator: 'Rule 1 "For Every Result, Keep Track of How It Was Produced", minimum'
    quote: |-
      As a minimum, you should at least record sufficient details on programs, parameters, and manual procedures to allow yourself, in a year or so, to approximately reproduce the results.
    verified:
      resolved_id: https://doi.org/10.1371/journal.pcbi.1003285
      opened: true
      claim_located: true
      checked_on: '2026-10-02'
  - citekey: horst_2020_palmerpenguins
    kind: textbook
    locator: 'help page "penguins_raw" (palmerpenguins 0.1.1), Format: the 17 variables'
    quote: |-
      A tibble with 344 rows and 17 variables:
    verified:
