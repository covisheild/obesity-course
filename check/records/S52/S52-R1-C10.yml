simplified_explanation: |
  It is itself a small table, one row per column of the data. For each column it says:

  - the exact name, letter for letter, as it is in the file;
  - what the column means, in plain words;
  - its unit;
  - its type: number, text or date;
  - the values it may take, or the range you expect;
  - how a missing value is written;
  - where you got each of these facts.

  A README is the note on the front of the project folder. It is a plain-text file that anyone can open. Someone who
  has never met you should be able to read it and rerun your analysis. That someone is often you, a year later.

  A project put online for others has two more files beside the README. A LICENSE says what others may do with it. A
  CITATION says how to cite it.
illustrations:
- body: |
    Write a dictionary for the penguin file, and watch the documentation and the file disagree.

    The documentation is the help page of the palmerpenguins package. It describes "a tibble with 344
    rows and 17 variables", one paragraph each. Copy its names into the first column of your
    dictionary: studyName, Sample Number, Species, and on to Culmen Length, Culmen Depth, Flipper
    Length, Body Mass, Sex, Delta 15 N, Delta 13 C, Comments.

    Now check them against the file. Read it, then ask `spec()` for the column specification that
    `read_csv()` used. It lists every column's name exactly as the file has it, with the type it was
    read as.

    ```r
    library(readr)
    library(dplyr)

    penguins_raw <- read_csv(
      here::here("data-raw", "penguins_raw.csv"),
      show_col_types = FALSE
    )

    spec(penguins_raw)

    nrow(penguins_raw)
    ```

    ```output

    Attaching package: ‘dplyr’

    The following objects are masked from ‘package:stats’:

        filter, lag

    The following objects are masked from ‘package:base’:

        intersect, setdiff, setequal, union

    cols(
      studyName = col_character(),
      `Sample Number` = col_double(),
      Species = col_character(),
      Region = col_character(),
      Island = col_character(),
      Stage = col_character(),
      `Individual ID` = col_character(),
      `Clutch Completion` = col_character(),
      `Date Egg` = col_date(format = ""),
      `Culmen Length (mm)` = col_double(),
      `Culmen Depth (mm)` = col_double(),
      `Flipper Length (mm)` = col_double(),
      `Body Mass (g)` = col_double(),
      Sex = col_character(),
      `Delta 15 N (o/oo)` = col_double(),
      `Delta 13 C (o/oo)` = col_double(),
      Comments = col_character()
    )
    [1] 344
    ```

    {{n:penguins_cols}} columns and {{n:penguins_rows}} rows, as the help page said. But read the names. The file says
    `Culmen Length (mm)`, `Flipper Length (mm)`, `Body Mass (g)` and `Delta 15 N (o/oo)`, with a unit
    in brackets after the name. Six of the names you copied
    are not the names in the file. Any line of code written from your dictionary would fail on
    them. The dictionary's first column must hold the name exactly as the file has it.

    The units are a second difference. The help page gives millimetres and grams in words. It gives
    no unit for the two isotope columns; the file's own header writes "o/oo" after them. So the unit
    column of your dictionary says "o/oo, as written in the column name; the help page gives no unit".
    That cell records exactly what you know and where it came from, and no more.

    The third difference is in the identifiers. The help page calls `Individual ID` "the unique ID for
    each individual in dataset". Count how many different values the column holds:

    ```r
    n_distinct(penguins_raw$`Individual ID`)
    ```

    ```output
    [1] 190
    ```

    {{n:penguins_ids}} different IDs in {{n:penguins_rows}} rows. So an ID can appear on more than one row. The help page does not
    say why, and this book does not guess. What the dictionary records is what you found. Then find
    something that does pick out one row each. Species with sample number does:

    ```r
    n_distinct(penguins_raw$Species, penguins_raw$`Sample Number`)
    ```

    ```output
    [1] 344
    ```

    344 combinations for {{n:penguins_rows}} rows: one each.

    Last, the allowed values and the missing code. The help page says only that Sex is "a character
    string". `count()` lists each value with the number of rows that hold it:

    ```r
    penguins_raw |>
      count(Sex)
    ```

    ```output
    # A tibble: 3 × 2
      Sex        n
      <chr>  <int>
    1 FEMALE   165
    2 MALE     168
    3 <NA>      11
    ```

    Two values, FEMALE and MALE, in capitals, and 11 rows missing. To see how the file writes a missing
    value, look at its first lines as plain text:

    ```sh
    head -n 5 data-raw/penguins_raw.csv
    ```

    ```output
    studyName,Sample Number,Species,Region,Island,Stage,Individual ID,Clutch Completion,Date Egg,Culmen Length (mm),Culmen Depth (mm),Flipper Length (mm),Body Mass (g),Sex,Delta 15 N (o/oo),Delta 13 C (o/oo),Comments
    PAL0708,1,Adelie Penguin (Pygoscelis adeliae),Anvers,Torgersen,"Adult, 1 Egg Stage",N1A1,Yes,2007-11-11,39.1,18.7,181,3750,MALE,NA,NA,Not enough blood for isotopes.
    PAL0708,2,Adelie Penguin (Pygoscelis adeliae),Anvers,Torgersen,"Adult, 1 Egg Stage",N1A2,Yes,2007-11-11,39.5,17.4,186,3800,FEMALE,8.94956,-24.69454,NA
    PAL0708,3,Adelie Penguin (Pygoscelis adeliae),Anvers,Torgersen,"Adult, 1 Egg Stage",N2A1,Yes,2007-11-16,40.3,18,195,3250,FEMALE,8.36821,-25.33302,NA
    PAL0708,4,Adelie Penguin (Pygoscelis adeliae),Anvers,Torgersen,"Adult, 1 Egg Stage",N2A2,Yes,2007-11-16,NA,NA,NA,NA,NA,NA,NA,Adult not sampled.
    ```

    The fourth penguin, N2A2, has `NA` where its measurements should be. So the file writes a missing
    value as `NA`, which `read_csv()` reads as missing without being told.

    Here is the dictionary, for the columns this book uses most. Each entry says where it came from.

    ```table
    | Variable, exactly as in the file | Meaning | Unit | Type | Allowed values | Source |
    | Species | penguin species | none | text | three spellings, listed by count(Species) | help page; values from the file |
    | Island | island where the sample was taken | none | text | Biscoe, Dream, Torgersen | help page; values from the file |
    | Individual ID | identifier of the penguin | none | text | not one per row: 190 values in 344 rows | help page says unique; the file disagrees |
    | Sample Number | running number of the sample | none | number | with Species, one per row | help page; checked in the file |
    | Culmen Length (mm) | length of the ridge along the top of the bill | mm | number | expected range not stated | help page; name from the file |
    | Body Mass (g) | body mass | g | number | expected range not stated | help page; name from the file |
    | Sex | sex of the penguin | none | text | FEMALE, MALE | help page; values from the file |
    | Delta 15 N (o/oo) | ratio of the nitrogen isotopes 15N to 14N | o/oo, from the column name | number | expected range not stated | help page; unit from the file |
    ```

    The full dictionary has {{n:penguins_cols}} rows, one for each column, and one more fact for the whole file:
    missing values are written `NA`. Save it as a CSV file, `penguins_raw_dictionary.csv`, beside the
    raw file in `data-raw/`. Raw data and the facts about it belong together. You type the dictionary
    once, by hand, before any cleaning. No code ever writes to that folder.

    Notice the cells that say "expected range not stated". Broman and Woo suggest giving the expected
    minimum and maximum of each variable. The help page gives none. Do not fill the cell with the
    smallest and largest values in this file: those describe the file, not what is possible, so they
    could not catch an error. Leave it saying what you know, until a source or a decision fills it.
  analogy_breaks_when: |
    The penguin file came with documentation written by the people who made it. Many files do not: a
    register handed over from a clinic may come with nothing. Then the dictionary is written from
    asking the people who collected it, and its source column says so, name and date.

    A dictionary says what the values should be. It does not check them. Turning "allowed values" and
    "expected range" into lines of code that stop the script comes later in this book.
- body: |
    Now the README. Picture the project folder handed to a colleague who has never seen it. They can
    see `data-raw/`, `code/` and `output/`. What can they not tell from the folder alone? Where the
    raw file came from, and whether they may use it. Which file to run, and from where. Which output
    is the final table. Whom to ask.

    The README answers those, in that order. Type it into a plain-text file called `README.txt` at the
    top of the folder:

    > Penguin body mass by species
    >
    > An analysis of adult penguin body mass by species and sex, written while learning R.
    >
    > Raw data: `data-raw/penguins_raw.csv`, copied unchanged from the palmerpenguins R package,
    > version 0.1.1, licence CC0. The data were collected by Palmer Station Antarctica LTER and
    > K. Gorman, and first published by Gorman, Williams and Fraser in PLoS ONE in 2014. MD5
    > checksum on arrival: 049da101568e078f9845c8b366481810.
    >
    > Data dictionary: `data-raw/penguins_raw_dictionary.csv`.
    >
    > To rerun: open a terminal in this folder and type `Rscript code/analysis.R`. The script reads
    > the raw file, writes everything it makes into `output/`, and changes nothing in `data-raw/`.
    >
    > Outputs: a table of body mass by species and a figure of it, both in `output/`.
    >
    > Written with R {{n:r_version}}. Contact: your name and email address.

    The checksum is the one the section on reading a raw file taught you to take on the day the file
    arrives.

    CC0 is the licence the package's own files state. Wilson and colleagues describe it as the "No
    Rights Reserved" licence: anyone may reuse the data without asking.

    Read it back as the colleague. Each question they had is answered in a line. The line "To rerun"
    is the one that matters most. If you cannot write it yet, because the analysis needs a click
    somewhere or a step done by hand, the analysis cannot be rerun, and the README has told you so
    before anyone else finds out.

    Notice what the README does not do. It does not describe each column; the dictionary does that.
    It does not explain each step of the analysis; the comments in the script do that. It points to
    both.
  analogy_breaks_when: |
    The README's "To rerun" line is a claim. It is true only if someone has run that command, in a
    fresh session, and got the outputs it promises. Writing the line does not make it true; running
    it from a clean start, later in this book, is how you find out.

    The outputs line here is general, because the script is not written yet. A finished README names
    each output file.
must_know:
- point: |
    The error is to think the documentation describes the file. Check every entry of your
    dictionary against the file in code: the names, the values, and whether an ID is really one per
    row.
  kind: misconception
  bearing: methodological
- point: |
    Write the variable name in the dictionary exactly as the file has it, letter for letter, with
    its spaces and brackets.
  kind: trap
  bearing: methodological
- point: |
    Write the dictionary before you clean. A dictionary written after cleaning describes your
    cleaned data and hides what the raw file held.
  kind: move
  bearing: methodological
- point: |
    Record how missing values are written in the raw file, for each column if they differ: blank,
    `NA`, -99, "not recorded".
  kind: consequence
  bearing: methodological
- point: |
    Never fill an "expected range" cell with the smallest and largest values in your own file. Leave
    it blank and say why, until a source or a protocol gives the range.
  kind: trap
  bearing: methodological
- point: |
    Write the README's rerun line as the exact command.
  kind: move
  bearing: methodological
- point: |
    When a trainee hands you a thesis dataset, ask for its dictionary before you look at a single
    number. If there is none, ask them to write one row: one variable, its unit, its missing code,
    and where they got each.
  kind: move
  bearing: teaching
- point: |
    A dictionary and a README describe the data and how to rerun the analysis. They do not make
    either one right.
  kind: boundary
  bearing: methodological
exercises:
- type: design
  prompt: |
    A made-up thesis dataset, `school_heights.csv`, has these columns: `child_id`, `school`, `sex`
    (coded 1 and 2), `dob`, `visit_date`, `height_cm` (to 0.1 cm), `weight_kg` (to 0.1 kg). The
    data-entry operator typed -99 wherever a measurement was not taken. The study protocol says
    `sex` is 1 for boys and 2 for girls, and gives no expected ranges. Write the data dictionary.
  answer: |
    One dictionary. Yours may word the meanings differently; check that every column is there, that
    names are exact, and that every entry says where it came from.

    ```table
    | Variable | Meaning | Unit | Type | Allowed values or range | Missing written as | Source |
    | child_id | the child's study number | none | text | one per child | none expected | protocol; check one per row in the file |
    | school | school the child attends | none | text | the schools listed in the protocol | none expected | protocol |
    | sex | sex of the child | none | number code | 1 = boy, 2 = girl | none expected | protocol |
    | dob | date of birth | none | date | before visit_date | none expected | protocol; check the date format in the file |
    | visit_date | date of measurement | none | date | within the study period | none expected | protocol |
    | height_cm | standing height, to 0.1 cm | cm | number | not stated | -99 | protocol; missing code from the operator |
    | weight_kg | weight, to 0.1 kg | kg | number | not stated | -99 | protocol; missing code from the operator |
    ```

    Three things to notice. The codes 1 and 2 are written out, because nobody can recover "1 = boy"
    from the file. The -99 is recorded, so it can be declared as missing when the file is read, and
    never averaged. And the expected ranges say "not stated" rather than being filled from the
    data, because the protocol gives none.

    Before cleaning, you would check each "one per child" and each code against the file, as the
    illustration did.
  skill_ref: S52-R1-K02
- type: critique
  prompt: |
    A colleague's project folder has this README, in full: "Analysis code for my thesis. Run the
    scripts in order. Data from the department." Name what is missing, and say what each gap would
    cost the next person.
  answer: |
    Almost everything a README is for.

    - **No title or purpose.** The next person cannot tell which thesis, or what question.
    - **No source for the raw data.** "The department" names no file, no version, no date and no
      terms. Nobody can get a fresh copy, or say whether they may use it.
    - **No rerun command.** "Run the scripts in order" leaves the order to be guessed, and says
      nothing about where to run them from. If the order matters, it belongs in the code: one
      script that runs the others, named in one line.
    - **No outputs.** The next person cannot tell which file is the final table.
    - **No pointer to a data dictionary**, so the meanings of columns and codes are lost.
    - **No contact.** When it breaks, there is nobody to ask.

    The cost is the same each time. The next person has to guess what one paragraph could have said.
    That person may be your colleague, a year later.
  skill_ref: S52-R1-K02
- type: retrieval
  prompt: |
    Without looking back, list what a data dictionary records for each variable, and what a README
    says.
  answer: |
    For each variable, the data dictionary records seven things:

    - its exact name as in the file;
    - what it means;
    - its unit;
    - its type;
    - its allowed values or expected range;
    - how a missing value is written;
    - where each of these facts came from.

    The README says six things:

    - the project's title and purpose;
    - where the raw data came from, which version, on what terms, and its checksum;
    - where the data dictionary is;
    - the one command that reruns the analysis, and where to run it from;
    - what each output is;
    - whom to contact.
- type: teaching
  prompt: |
    A health secretary asks, on one page: "Why should a district survey's data come with a data
    dictionary? We have the data."
  answer: |
    Without a dictionary, the data cannot be read safely by anyone except the people who entered it.

    A data file holds names and numbers. It does not say what "sex = 2" means, whether height is in
    centimetres or metres, or that -99 means "not measured". Those facts live in the heads of a few
    staff, or in a protocol nobody attaches. When those staff move on, the facts go with them.

    The cost of not having one is concrete. A -99 read as a real value pulls an average down. A
    height read in the wrong unit makes every derived index wrong by a large factor. A code read the
    wrong way round swaps two groups. Each produces a confident, wrong number in a report.

    A dictionary is one table, one row per column, written once when the data are collected. It
    costs an afternoon. Ask that every dataset the department releases or commissions comes with one,
    and that the dictionary is checked against the file before any analysis.
retrieval_items:
- q: What does a data dictionary hold for each variable?
  a: Its exact name as in the file, its meaning, its unit, its type, its allowed values or expected
    range, how a missing value is written, and where each entry came from.
- q: When is a data dictionary written, and from what?
  a: Once, before any cleaning, from the documentation of whoever made the data. Then each entry is
    checked against the file.
- q: Name the parts of a README.
  a: Title and purpose; where the raw data came from, which version, on what terms, and its checksum; where the
    data dictionary is; the one command that reruns the analysis and where to run it from; what each
    output is; whom to contact.
- q: Why should an "expected range" not be filled from the smallest and largest values in your file?
  a: A range taken from the data describes the data, so it can never flag an error in the data.
