      checked_on: '2026-10-02'
  - citekey: horst_2020_palmerpenguins
    kind: textbook
    locator: 'help page "penguins_raw", Format: Culmen Length and Body Mass, with their units'
    quote: |-
      Culmen Length a number denoting the length of the dorsal ridge of a bird's bill (millimeters)
    verified:
      resolved_id: https://cran.r-project.org/package=palmerpenguins
      opened: true
      claim_located: true
