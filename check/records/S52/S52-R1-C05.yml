simplified_explanation: |
  ```r
  heights_cm <- c(152, 160.5, 171)
  mean(heights_cm)
  ```

  ```output
  [1] 161.1667
  ```

  Whatever goes inside the brackets is an argument. Many functions take more than one. `round()` takes
  the number to round, called `x`, and how many decimal places to keep, called `digits`:

  ```r
  round(161.1667, digits = 1)
  ```

  ```output
  [1] 161.2
  ```

  Leave out an argument altogether and R uses its default. The default for `digits` is 0, so
  `round(161.1667)` gives a whole number.

  One call can sit inside another, and R works from the inside out:

  ```r
  round(mean(heights_cm), digits = 1)
  ```

  ```output
  [1] 161.2
  ```

  The pipe, written `|>`, puts the steps in the order they happen. Read it as "then". Type it as
  two characters, `|` then `>`. A line that ends in `|>` is unfinished, so R waits for the next
  line, as with the `+` prompt in `S52-R1-C02`. The indent is only for reading:

  ```r
  heights_cm |>
    mean() |>
    round(digits = 1)
  ```

  ```output
  [1] 161.2
  ```

  The pipe hands the thing on its left to the call on its right, as the first argument. So
  `round(digits = 1)` here means `round(the mean, digits = 1)`.

  To find out what a function's arguments are called and what they do, open its help page. Type
  a question mark and the name: `?round`.
illustrations:
- body: |
    Start where the last section stopped. Here again are the first ten body masses in the
    practice file, in grams, with the fourth missing. Ask for their mean:

    ```r
    body_mass_g <- c(3750, 3800, 3250, NA, 3450, 3650, 3625, 4675, 3475, 4250)
    mean(body_mass_g)
    ```

    ```output
    [1] NA
    ```

    `NA` again. Open the help page:

    ```r norun
    ?mean
    ```

    Read the Usage section first. It shows the call with every argument and its default:
    `mean(x, trim = 0, na.rm = FALSE, ...)`. Then read Arguments, which says what each one does.
    `na.rm` is "a logical evaluating to 'TRUE' or 'FALSE' indicating whether 'NA' values should be
    stripped before the computation proceeds". Its default is `FALSE`: do not remove them. That
    is why one missing value made the mean `NA`. You did not ask for anything to be removed.

    Ask for it:

    ```r
    mean(body_mass_g, na.rm = TRUE)
    ```

    ```output
    [1] 3769.444
    ```

    Now look at what that number is. It is not the mean of ten values. Check it with the tools
    from the last section, adding the known values and dividing by how many there are:

    ```r
    known_g <- body_mass_g[!is.na(body_mass_g)]
    sum(known_g)
    length(known_g)
    sum(known_g) / length(known_g)
    ```

    ```output
    [1] 33925
    [1] 9
    [1] 3769.444
    ```

    The nine known masses add up to 33925 g, and 33925 divided by 9 is the same 3769.444 g. So
    `na.rm = TRUE` changed the count behind the mean from ten to nine. That is the honest answer,
    as long as you report the nine with it. A short way to count the values that are present is
    to add up a logical vector. In arithmetic R counts each `TRUE` as 1 and each `FALSE` as 0:

    ```r
    sum(!is.na(body_mass_g))
    ```

    ```output
    [1] 9
    ```

    Here is the dishonest answer, which is easy to reach by accident. Suppose whoever typed the
    register wrote 0 where the weight was not taken:

    ```r
    body_mass_zero_g <- c(3750, 3800, 3250, 0, 3450, 3650, 3625, 4675, 3475, 4250)
    mean(body_mass_zero_g)
    ```

    ```output
    [1] 3392.5
    ```

    No warning, no `NA`, and a number that looks like a body mass. It is the 33925 g divided by
    10, not by 9, as though one penguin weighed nothing. And `median()` has the same argument:

    ```r
    median(body_mass_g, na.rm = TRUE)
    ```

    ```output
    [1] 3650
    ```

    ```table
    | how the missing value was handled | result (g) |
    | missing weight typed as 0, mean | 3392.5 |
    | na.rm = TRUE, mean | 3769.444 |
    | na.rm = TRUE, median | 3650 |
    ```

    Last, put the steps together for a report in kilograms. Nested, it reads inside out. Piped,
    it reads in order: take the masses, then convert to kilograms, then take the mean of the
    known values, then round to two decimal places.

    ```r
    round(mean(body_mass_g / 1000, na.rm = TRUE), digits = 2)

    (body_mass_g / 1000) |>
      mean(na.rm = TRUE) |>
      round(digits = 2)
    ```

    ```output
    [1] 3.77
    [1] 3.77
    ```

    Both give 3.77 kg. The sentence for the report is "mean body mass 3.77 kg (n = 9)".
  analogy_breaks_when: |
    The ten masses are real rows of the practice file. The register with a 0 typed in is made
    up, to show what a zero does to a mean.

    `na.rm = TRUE` gives the mean of the values present. It is the mean of all ten only if the
    missing one would have sat at that same mean, and nothing here can tell you whether it would.
    Which values go missing, and why, is a question for a later book in this course.
- body: |
    Error messages are about a call. Read them as sentences. Leave out an argument that has no
    default:

    ```r error
    mean()
    ```

    ```output
    Error in mean.default() : argument "x" is missing, with no default
    ```

    The message names the function (`mean.default` is the version of `mean()` that handles
    plain numbers) and says exactly what is wrong: the argument `x` is missing and has no default.

    Misspell a value:

    ```r error
    mean(body_mass_g, na.rm = true)
    ```

    ```output
    Error: object 'true' not found
    ```

    R knows `TRUE` in capitals. To it, `true` is the name of an object, and no object with that
    name exists. Give a function the wrong kind of value:

    ```r error
    round("3.77", digits = 1)
    ```

    ```output
    Error in round("3.77", digits = 1) :
      non-numeric argument to mathematical function
    ```

    `round()` needs a number and was given text.

    Errors are the friendly failures, because they stop you. The dangerous mistake is the call
    that runs. Suppose you want the mean of three body masses and forget `c()`:

    ```r
    mean(3750, 3800, 3250)
    ```

    ```output
    [1] 3750
    ```

    No error and no warning, and 3750 g is a believable body mass. It is wrong. Without `c()`,
    the three numbers are three separate arguments, matched by position. `mean()` took 3750 as
    `x`, 3800 as its second argument, `trim`, and 3250 went into the `...` that collects extra
    arguments. The help page says `trim` is "the fraction (0 to 0.5) of observations to be trimmed
    from each end of 'x' before the mean is computed", and that values outside that range are
    taken as the nearest end. So `trim` became 0.5, and the "mean" of the single
    value 3750 is 3750. The call you meant:

    ```r
    mean(c(3750, 3800, 3250))
    ```

    ```output
    [1] 3600
    ```

    The mean of the three is 3600 g.
  analogy_breaks_when: |
    Not every wrong call is silent and not every one errors; which happens depends on the
    function. The trim behaviour is particular to `mean()`. The general lesson is to put the
    values you mean to combine inside `c()` and to name every argument after the first.
must_know:
- point: |
    The error is to read `mean(x, na.rm = TRUE)` as the mean of all your values. It is the mean
    of the values present. Report the count with it, "3.77 kg (n = 9)", every time.
  kind: misconception
  bearing: methodological
- point: |
    A missing value typed as 0 gives no `NA` and no warning, and pulls the mean down.
  kind: trap
  bearing: methodological
- point: |
    Name every argument after the first. `round(x, digits = 1)` says what the 1 is.
    `mean(3750, 3800, 3250)` runs, gives 3750 and is wrong, because unnamed values were matched
    by position to arguments you did not intend.
  kind: move
  bearing: methodological
- point: |
    Before you use a function for the first time, open its help page and read Usage and
    Arguments.
  kind: move
  bearing: methodological
- point: |
    Read an error message as a sentence about one call: which function, which argument, what
    was wrong. Fix that argument and nothing else, then run the line again.
  kind: move
  bearing: teaching
- point: |
    No argument can tell you why a value is missing.
  kind: boundary
  bearing: methodological
- point: |
    If you find yourself copying the same block of calls three times with one thing changed, you
    need a function of your own. Writing one is taught in a later book in this course.
  kind: consequence
  bearing: methodological
exercises:
- type: teaching
  prompt: |
    A first-year resident has ten minutes and R open. They have never read a help page. Teach
    them to find out, from `?round` alone, what `round(3.14159)` will give and why.
  answer: |
    Ask them to type `?round` and look at the page with you. Point to three parts in turn.

    Description says, in one line, that `round` rounds "to the specified number of decimal
    places (default 0)".

    Usage shows the call written out with its defaults: `round(x, digits = 0)`. Ask them what
    `digits = 0` means. It means that if they give no `digits`, R uses 0.

    Arguments says what `x` and `digits` are. Ask them to predict `round(3.14159)` from that.
    No `digits` is given, so the default 0 applies, and the answer is a whole number, 3. Then let
    them run it:

    ```r
    round(3.14159)
    round(3.14159, digits = 2)
    ```

    ```output
    [1] 3
    [1] 3.14
    ```

    Finish by asking them to run one line from the Examples section at the bottom of the page.
    The habit to leave them with: Usage for the defaults, Arguments for what each one does,
    Examples to try it.
  skill_ref: S52-R1-K01
- type: retrieval
  prompt: |
    Without looking back, say what `na.rm = TRUE` does in `mean(x, na.rm = TRUE)` and what its
    default is. Then say what you must report beside a mean computed this way.
  answer: |
    It removes the missing values before the mean is computed. The default is `na.rm = FALSE`,
    which gives `NA` whenever a value is missing. Because the mean is then of the values present,
    report how many there were, as in "3.77 kg (n = 9)".
quantitative: true
practice_note: |
  Eleven problems: the moves are calling with named and positional arguments, defaults and na.rm,
  nesting against piping, and using a help page; each gets one mechanical try, the applied
  problems put na.rm and rounding onto the penguin measurements, and the three diagnostics are
  the three ways a call goes wrong (silently by position, by an error, by rounding too early).
practice:
- level: 1
  prompt: |
    A made-up adult's BMI is 24.83702 kg/m^2. Write one call that rounds it to one decimal
    place and one that rounds it to a whole number.
  answer: |
    ```r
    round(24.83702, digits = 1)
    round(24.83702)
    ```

    ```output
    [1] 24.8
    [1] 25
    ```

    With no `digits`, `round()` uses its default, 0, and gives a whole number.
- level: 2
  prompt: |
    Find the mean of the four numbers 4, 8, a missing value and 6, with the default behaviour.
    Then find it using only the values that are present.
  answer: |
    ```r
    mean(c(4, 8, NA, 6))
    mean(c(4, 8, NA, 6), na.rm = TRUE)
    ```

    ```output
    [1] NA
    [1] 6
    ```

    The default gives `NA`. With `na.rm = TRUE`, R averages 4, 8 and 6, which sum to 18, and 18
    divided by 3 is 6.
- level: 3
  prompt: |
    Rewrite this nested call with the pipe, one step per line, and check that it gives the same
    answer.

    ```r norun
    round(mean(c(61.2, 58.4, 70.9)), digits = 1)
    ```
  answer: |
    ```r
    round(mean(c(61.2, 58.4, 70.9)), digits = 1)

    c(61.2, 58.4, 70.9) |>
      mean() |>
      round(digits = 1)
    ```

    ```output
    [1] 63.5
    [1] 63.5
    ```

    The innermost call, `mean()`, comes first in the pipe. Each pipe hands the result on as the
    first argument of the next call.
- level: 4
  prompt: |
    The first ten flipper lengths in `penguins_raw.csv` are 181, 186, 195, a missing value, 193,
    190, 181, 195, 193 and 190 mm. Give their mean and their median in centimetres, each to one
    decimal place, and say how many values each is based on.
  answer: |
    ```r
    flipper_mm <- c(181, 186, 195, NA, 193, 190, 181, 195, 193, 190)
    flipper_cm <- flipper_mm / 10
    round(mean(flipper_cm, na.rm = TRUE), digits = 1)
    round(median(flipper_cm, na.rm = TRUE), digits = 1)
    sum(!is.na(flipper_cm))
    ```

    ```output
    [1] 18.9
    [1] 19
    [1] 9
    ```

    The mean is 18.9 cm and the median is 19 cm, each from the 9 rows whose flipper length is
    recorded. R prints 19 rather than 19.0: a single value is printed without a trailing zero.
- level: 5
  prompt: |
    Using only the help page of `sd()`, find how to make it leave out missing values. The first
    ten body masses in `penguins_raw.csv` are 3750, 3800, 3250, a missing value, 3450, 3650,
    3625, 4675, 3475 and 4250 g. Give their standard deviation, rounded to the nearest gram.
  answer: |
    The Usage section of `?sd` reads `sd(x, na.rm = FALSE)`, and Arguments says `na.rm` decides
    whether missing values are removed. The default is `FALSE`, so set it to `TRUE`:

    ```r
    body_mass_g <- c(3750, 3800, 3250, NA, 3450, 3650, 3625, 4675, 3475, 4250)
    round(sd(body_mass_g, na.rm = TRUE))
    ```

    ```output
    [1] 440
    ```

    The standard deviation of the 9 known body masses is 440 g. In Book 0, a standard deviation
    from a sample divides by one less than the count. The help page says `sd()` does the same:
    "Like 'var' this uses denominator n - 1."
- level: 6
  prompt: |
    Without using `mean()`, write code that gives the same number as
    `mean(body_mass_g, na.rm = TRUE)` for the ten body masses in problem 5. Then show that the
    two agree.
  answer: |
    ```r
    body_mass_g <- c(3750, 3800, 3250, NA, 3450, 3650, 3625, 4675, 3475, 4250)
    known_g <- body_mass_g[!is.na(body_mass_g)]
    sum(known_g) / length(known_g)
    mean(body_mass_g, na.rm = TRUE)
    ```

    ```output
    [1] 3769.444
    [1] 3769.444
    ```

    Both give 3769.444 g. Removing the missing value first and then dividing by the count of
    what is left is exactly what `na.rm = TRUE` does.
- level: 7
  prompt: |
    A colleague wants the mean of three body masses. Their code and output are below, and they
    report "the mean body mass was 3750 g". Find what broke, and say why the answer looks
    reasonable.

    ```r
    mean(3750, 3800, 3250)
    ```

    ```output
    [1] 3750
    ```
  answer: |
    The three numbers are not inside `c()`, so they are three separate arguments. R matched them
    by position: 3750 became `x`, 3800 became `trim`, and 3250 went into `...`. A `trim` above
    0.5 is taken as 0.5. `x` is the single value 3750, and any mean of one value, trimmed or not,
    is that value.

    ```r
    mean(c(3750, 3800, 3250))
    ```

    ```output
    [1] 3600
    ```

    The mean is 3600 g. The wrong answer looks reasonable because 3750 g is one of the masses.
    It lies inside the range of the data, and R gave no warning.
- level: 8
  prompt: |
    A colleague's script stops at this line. The error is below. Find what broke.

    ```r error
    body_mass_g <- c(3750, 3800, 3250, NA, 3450)
    mean(body_mass_g, na.rm = true)
    ```

    ```output
    Error: object 'true' not found
    ```
  answer: |
    R's logical values are written in capitals, `TRUE` and `FALSE`. Written in small letters,
    `true` is read as the name of an object, and there is no object called `true`.

    ```r
    mean(body_mass_g, na.rm = TRUE)
    ```

    ```output
    [1] 3562.5
    ```

    The mean of the four known masses is 3562.5 g. The error message gave the answer: it names
    the word R could not find.
- level: 8
  prompt: |
    A colleague reports the mean of the first ten body masses (problem 5) in kilograms, to two
    decimal places, as 3.78 kg. Their code and output are below. Find what broke, and say why the
    answer looks reasonable.

    ```r
    body_mass_g <- c(3750, 3800, 3250, NA, 3450, 3650, 3625, 4675, 3475, 4250)
    round(body_mass_g / 1000) |>
      mean(na.rm = TRUE) |>
      round(digits = 2)
    ```

    ```output
    [1] 3.78
    ```
  answer: |
    The masses were rounded to whole kilograms before the mean was taken. Each value lost up to
    half a kilogram first, and only then were the values averaged. Look at what went into the
    mean:

    ```r
    round(body_mass_g / 1000)
    ```

    ```output
     [1]  4  4  3 NA  3  4  4  5  3  4
    ```

    Round once, at the end:

    ```r
    (body_mass_g / 1000) |>
      mean(na.rm = TRUE) |>
      round(digits = 2)
    ```

    ```output
    [1] 3.77
    ```

    The mean of the 9 known masses is 3.77 kg. The wrong answer looks reasonable because it has
    the digits asked for and is only 0.01 kg away. It came from whole numbers, though, so its
    second decimal place means nothing. This is Book 0's rule again: keep full precision while
    you work and round once, at the end.
- level: 9
  prompt: |
    A made-up draft report says: "The average body mass in the first ten rows was 3392.5 g."
    The first ten body masses are as in problem 5. Work out with code how that number could have
    been produced. Say what the sentence gets wrong, and what a corrected sentence still does not
    establish.
  answer: |
    3392.5 is lower than every one of the nine known masses except 3250 g, which is a sign
    that something pulled it down. Try dividing the total of the known masses by ten instead of
    nine:

    ```r
    body_mass_g <- c(3750, 3800, 3250, NA, 3450, 3650, 3625, 4675, 3475, 4250)
    known_g <- body_mass_g[!is.na(body_mass_g)]
    sum(known_g) / 10
    mean(body_mass_g, na.rm = TRUE)
    ```

    ```output
    [1] 3392.5
    [1] 3769.444
    ```

    The report's number is the total of nine masses divided by ten: the missing weight was
    treated as zero. A corrected sentence: "The mean body mass of the 9 rows with a recorded
    weight was 3769.4 g."

    What the corrected sentence does not establish:

    - The mean of all ten. Penguin 4's weight is unknown, and it could lie anywhere.
    - Anything about the penguins in the rest of the file, or about penguins in general.
- level: 10
  prompt: |
    A made-up thesis table reports "median body mass 3650 g (n = 10)" for the first ten rows of
    the practice file. The values are as in problem 5. Check both numbers with code, and say
    what the checked result does not establish.
  answer: |
    ```r
    body_mass_g <- c(3750, 3800, 3250, NA, 3450, 3650, 3625, 4675, 3475, 4250)
    median(body_mass_g, na.rm = TRUE)
    sum(!is.na(body_mass_g))
    ```

    ```output
    [1] 3650
    [1] 9
    ```

    The median, 3650 g, is right. The n is wrong: the median was computed from 9 values, not 10,
    because `na.rm = TRUE` removed the missing one. The table should read "3650 g (n = 9)". The
    writer probably took n from `length(body_mass_g)`, which counts the missing value too.

    What the checked result does not establish:

    - The median of all ten values. With a tenth value, the median would be the mean of the
      two middle values, and that depends on the missing weight.
    - Anything about penguins beyond these ten rows.
retrieval_items:
- q: In mean(x, na.rm = TRUE), what is na.rm, and what does TRUE change?
  a: na.rm is an argument of mean(). Its default is FALSE, which gives NA if any value is
    missing. TRUE removes the missing values first, so the mean is of the values present and the
    count behind it is smaller.
- q: What does the pipe, |>, do?
  a: It passes the thing on its left to the call on its right as that call's first argument, so
    x |> f(y) means f(x, y). Read it as "then".
- q: Which section of a help page shows a function's arguments with their defaults?
  a: Usage.
- q: How does R match arguments that are given without names?
  a: By position, in the order the function lists its arguments.
