retrieval_items:
- q: What does filter() do with a row whose condition is NA?
  a: It drops it. A row stays only when the condition is TRUE.
- q: Why does filter(x == NA) return no rows, and what do you write instead?
  a: A comparison with NA gives NA on every row, and filter() drops NA. Write filter(is.na(x)).
- q: What is the difference between select() and rename()?
  a: select() keeps only the columns you name (and can rename them as it keeps them). rename()
    changes names and keeps every column.
- q: Where do missing values go when you sort with arrange(desc(x))?
  a: To the end, the same as when you sort smallest first.
- q: What happens to your data frame when you run a dplyr verb on it without <-?
  a: Nothing. The verb returns a new data frame, which is printed and then lost. The original is
    unchanged.
