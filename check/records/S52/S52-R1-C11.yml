    [1] 152
    ```

    {{n:penguins_adelie}} Adelie penguins. (`count()` gives the number of rows for each value of a column; it comes
    back in a later section.)

    Why the wrong answer looks reasonable: the code ran, the spelling looks right, and 0 is a real
    number. But a species the study was built around cannot have no rows. An answer of zero is the
    moment to print the values you tested against.
- level: 7
  prompt: |
    A colleague wants the penguins with no sex recorded and writes:

    ```r
    library(readr)
    library(dplyr)

    penguins_raw <- read_csv(
      here::here("data-raw", "penguins_raw.csv"),
      show_col_types = FALSE
    )

    penguins_raw |>
      filter(Sex == NA) |>
      nrow()
    ```

