    Attaching package: ‘dplyr’

    The following objects are masked from ‘package:stats’:

        filter, lag

    The following objects are masked from ‘package:base’:

        intersect, setdiff, setequal, union

    [1] 0
    ```

    They write in their notes: "sex was recorded for every penguin". Find what broke, and give the
    right count.
  answer: |
    The test `Sex == NA` is `NA` on every row. A comparison with an unknown value is unknown. The
    function `filter()` drops every row whose test is `NA`, so it drops all of them. The test must
    be `is.na()`:

    ```r
    penguins_raw |>
      filter(is.na(Sex)) |>
      nrow()
    ```

    ```output
    [1] 11
    ```

    11 penguins have no sex recorded.

    Why the wrong answer looks reasonable: zero missing is a common and welcome result, and nothing
    on the screen says the test was meaningless. The line reads correctly as English.
- level: 8
  prompt: |
    A colleague wants the male and female penguins on Dream island and writes:

    ```r
    library(readr)
    library(dplyr)

    penguins_raw <- read_csv(
      here::here("data-raw", "penguins_raw.csv"),
      show_col_types = FALSE
    )
    ```

    ```output

    Attaching package: ‘dplyr’

    The following objects are masked from ‘package:stats’:

        filter, lag

    The following objects are masked from ‘package:base’:

        intersect, setdiff, setequal, union
    ```

    ```r error
    penguins_raw |>
      filter(Island == "Dream", Sex == "MALE" | "FEMALE")
    ```

    ```output
    Error in `filter()`:
    ℹ In argument: `Sex == "MALE" | "FEMALE"`.
    Caused by error in `Sex == "MALE" | "FEMALE"`:
    ! operations are possible only for numeric, logical or complex types
    ```

    Read the error. Say what broke and fix it.
  answer: |
    `Sex == "MALE" | "FEMALE"` is English, not R. R works out `Sex == "MALE"` first, which gives
    `TRUE` or `FALSE`. Then it tries `|` between that and the text "FEMALE". The sign `|` needs
    `TRUE` or `FALSE` on both sides. A piece of text is neither, so R stops.

    Each side of `|` must be a whole test. Or use `%in%`, which says the same thing in one go:

    ```r
    penguins_raw |>
      filter(Island == "Dream", Sex %in% c("MALE", "FEMALE")) |>
      nrow()
    ```

    ```output
    [1] 123
    ```

    123 penguins on Dream with sex recorded as male or female.

    Why the wrong line looks reasonable: it is how you would say it aloud. With numbers instead of
    text, the same mistake does not stop with an error; it quietly keeps the wrong rows, which is
    worse.
