simplified_explanation: |
  **filter()** keeps rows. You write a test, and a row stays only if the test says `TRUE` for it.

  Here is the trap that catches everyone once. A test on a missing value gives neither `TRUE` nor `FALSE`. It gives `NA`, "don't know". `filter()`
  drops every row where the test says "don't know". To find the missing ones, ask `is.na()`, which answers `TRUE` or `FALSE`.

  Read each `|>` as "then": take the penguins, then keep these rows, then keep these columns, then sort.
illustrations:
- body: |
    Start with a question that fails. Which penguins have no body mass recorded?

    Load the two packages and read the raw file, as the section on reading a raw file showed.
    `show_col_types = FALSE` turns off the column report that `read_csv()` prints, because you have
    already read it once.

    ```r
    library(readr)
    library(dplyr)

    penguins_raw <- read_csv(
      here::here("data-raw", "penguins_raw.csv"),
      show_col_types = FALSE
    )
    ```

    ```output

    Attaching package: ‘dplyr’

    The following objects are masked from ‘package:stats’:

        filter, lag

    The following objects are masked from ‘package:base’:

        intersect, setdiff, setequal, union
    ```

    The message from `library(dplyr)` is the one about masked functions: dplyr's `filter()` now
    hides the `filter()` of the stats package. It is not an error.

    The column is called `Body Mass (g)`, with spaces and brackets. A name like that breaks R's
    rules for names, so you wrap it in backticks, as the section on tidy data showed. Now write the
    question the way it sounds in English: keep the rows where body mass equals missing.

    ```r
    penguins_raw |>
      filter(`Body Mass (g)` == NA)
    ```

    ```output
    # A tibble: 0 × 17
    # ℹ 17 variables: studyName <chr>, Sample Number <dbl>, Species <chr>,
    #   Region <chr>, Island <chr>, Stage <chr>, Individual ID <chr>,
    #   Clutch Completion <chr>, Date Egg <date>, Culmen Length (mm) <dbl>,
    #   Culmen Depth (mm) <dbl>, Flipper Length (mm) <dbl>,
    #   Body Mass (g) <dbl>, Sex <chr>, Delta 15 N (o/oo) <dbl>,
    #   Delta 13 C (o/oo) <dbl>, Comments <chr>
    ```

    R says: a tibble with 0 rows. No error, no warning. It would be easy to write down "no penguin
    is missing its body mass".

    That is wrong, and here is why. `==` compares each value with `NA`. A comparison with an unknown
    value is itself unknown, so the answer on every row is `NA`. `filter()` keeps a row only when
    the answer is `TRUE`, and drops it when the answer is `NA`. So it drops all {{n:penguins_rows}}.

    Ask the question with `is.na()` instead. It answers `TRUE` for a missing value and `FALSE` for
    anything else. Keep four columns, so the answer fits on the screen.

    ```r
    penguins_raw |>
      filter(is.na(`Body Mass (g)`)) |>
      select(Species, `Individual ID`, `Body Mass (g)`, Comments)
    ```

    ```output
    # A tibble: 2 × 4
      Species                       `Individual ID` `Body Mass (g)` Comments
      <chr>                         <chr>                     <dbl> <chr>
    1 Adelie Penguin (Pygoscelis a… N2A2                         NA Adult n…
    2 Gentoo penguin (Pygoscelis p… N38A2                        NA Adult n…
    ```

    Two penguins, N2A2 and N38A2. Their `Comments` column starts "Adult n", cut short to fit the
    screen; in the file it reads "Adult not sampled". The empty answer above was not a finding
    about the penguins. It was a property of `==`.
  analogy_breaks_when: |
    `is.na()` finds what R reads as missing. A missing value written in the file as -99, or as
    "not recorded", is not `NA` unless you told `read_csv()` about it when you read the file. For
    such a column `is.na()` finds nothing, for a different reason, and the section on missing values
    deals with it.
- body: |
    Now answer a real question in steps: among the female penguins on Dream and Torgersen islands,
    which were the heaviest?

    First keep the columns you need, and give them names you can type. Inside `select()`,
    `new_name = old_name` renames as it keeps. `starts_with("Culmen")` keeps both culmen columns
    (the culmen is the ridge along the top of the bill) without typing either name.

    ```r
    penguins_small <- penguins_raw |>
      select(
        species = Species,
        island = Island,
        sex = Sex,
        body_mass_g = `Body Mass (g)`,
        starts_with("Culmen")
      )

    penguins_small
    ```

    ```output
    # A tibble: 344 × 6
       species                 island sex   body_mass_g `Culmen Length (mm)`
       <chr>                   <chr>  <chr>       <dbl>                <dbl>
     1 Adelie Penguin (Pygosc… Torge… MALE         3750                 39.1
     2 Adelie Penguin (Pygosc… Torge… FEMA…        3800                 39.5
     3 Adelie Penguin (Pygosc… Torge… FEMA…        3250                 40.3
     4 Adelie Penguin (Pygosc… Torge… <NA>           NA                 NA
     5 Adelie Penguin (Pygosc… Torge… FEMA…        3450                 36.7
     6 Adelie Penguin (Pygosc… Torge… MALE         3650                 39.3
     7 Adelie Penguin (Pygosc… Torge… FEMA…        3625                 38.9
     8 Adelie Penguin (Pygosc… Torge… MALE         4675                 39.2
     9 Adelie Penguin (Pygosc… Torge… <NA>         3475                 34.1
    10 Adelie Penguin (Pygosc… Torge… <NA>         4250                 42
    # ℹ 334 more rows
    # ℹ 1 more variable: `Culmen Depth (mm)` <dbl>
    ```

    Still {{n:penguins_rows}} rows: `select()` never drops a row. Six columns. The two culmen columns keep their
    old names, because `starts_with()` chose them and nothing renamed them. Long text is cut short
    to fit the screen: `FEMA…` is "FEMALE".

    `rename()` does the renaming without dropping anything. Check that it keeps all {{n:penguins_cols}} columns:

    ```r
    penguins_raw |>
      rename(body_mass_g = `Body Mass (g)`) |>
      ncol()
    ```

    ```output
    [1] 17
    ```

    Now the rows. Keep the two islands with `%in%`, which asks "is this value one of these?". Then
    count the rows with `nrow()`.

    ```r
    penguins_small |>
      filter(island %in% c("Dream", "Torgersen")) |>
      nrow()
    ```

    ```output
    [1] 176
    ```

    Add the second condition after a comma. Both must be `TRUE` for a row to stay. The file writes
    sex in capitals, so the test is `sex == "FEMALE"`, not `"female"`.

    ```r
    penguins_small |>
      filter(island %in% c("Dream", "Torgersen"), sex == "FEMALE") |>
      nrow()
    ```

    ```output
    [1] 85
    ```

    Then sort the heaviest first, and look at the top five.

    ```r
    penguins_small |>
      filter(island %in% c("Dream", "Torgersen"), sex == "FEMALE") |>
      arrange(desc(body_mass_g)) |>
      print(n = 5)
    ```

    ```output
    # A tibble: 85 × 6
      species                  island sex   body_mass_g `Culmen Length (mm)`
      <chr>                    <chr>  <chr>       <dbl>                <dbl>
    1 Chinstrap penguin (Pygo… Dream  FEMA…        4150                 46
    2 Chinstrap penguin (Pygo… Dream  FEMA…        3950                 45.2
    3 Chinstrap penguin (Pygo… Dream  FEMA…        3900                 47.5
    4 Chinstrap penguin (Pygo… Dream  FEMA…        3850                 47.6
    5 Adelie Penguin (Pygosce… Torge… FEMA…        3800                 39.5
    # ℹ 80 more rows
    # ℹ 1 more variable: `Culmen Depth (mm)` <dbl>
    ```

    The heaviest of those 85 females weighed 4150 g, a Chinstrap penguin on Dream.

    Read the pipe aloud, with "then" for each `|>`: take the small table, then keep the rows on
    Dream or Torgersen where sex is FEMALE, then sort by body mass, largest first.

    Here is what each step left.

    ```table
    | Step | Rows left |
    | all penguins | 344 |
    | island is Dream or Torgersen | 176 |
    | and sex is FEMALE | 85 |
    ```

    Last, check that none of this changed the raw data.

    ```r
    nrow(penguins_raw)
    ```

    ```output
    [1] 344
    ```

    Still {{n:penguins_rows}}. Each verb handed back a new data frame. Only `penguins_small` was kept, because only
    it was given a name.
  analogy_breaks_when: |
    The 85 is a count of rows in this file with "FEMALE" in the sex column. Eleven penguins have no
    sex recorded, and some of them may be female. So 85 is the number of penguins known to be
    female on those two islands, not the number of females there.

    The count holds for this file only. It says nothing about how many penguins live on either
    island.
must_know:
- point: |
    The error is to write `filter(x == NA)` to find missing values. Write `filter(is.na(x))`.
  kind: misconception
  bearing: methodological
- point: |
    An empty result is a claim about your test before it is a claim about your data.
  kind: trap
  bearing: methodological
- point: |
    `filter()` drops a row whose test is `NA`. Whenever you report a count after a filter, say
    whether missing values were dropped by it.
  kind: consequence
  bearing: methodological
- point: |
    Never type a filter into the raw file by deleting rows. Write the `filter()` line in the script.
  kind: move
  bearing: methodological
- point: |
    A verb that is not assigned changes nothing.
  kind: trap
  bearing: teaching
- point: |
    Rename awkward column names once, near the top of the script, into snake case (lowercase words
    joined by `_`).
  kind: move
  bearing: methodological
- point: |
    `filter()` keeps the rows that pass the test you wrote. It cannot tell you whether that test
    matches your question.
  kind: boundary
  bearing: methodological
exercises:
- type: teaching
  prompt: |
    A first-year resident has ten minutes and a whiteboard. Their code `filter(hb == NA)` on an
    anaemia survey file returned no rows, and they have written "no missing haemoglobin values" in
    their results. Explain what happened and how to check.
  answer: |
    Write three values on the board: 11.2, NA, 9.8. Under each, write what `hb == NA` gives: NA, NA,
    NA. Comparing anything with an unknown value gives an unknown answer, even comparing NA with NA.

    Then say what `filter()` does with the answers. It keeps a row only when the answer is `TRUE`.
    It drops `FALSE` and it drops `NA`. Every answer was `NA`, so every row was dropped. The empty
    result is a property of `==`, not of their survey.

    Now write `is.na(hb)` under the same three values: FALSE, TRUE, FALSE. That is a real answer on
    every row, so `filter(is.na(hb))` keeps exactly the rows with no value.

    Ask them to run it and report the number it gives. Then ask them to put that number in their
    results. Ask them to add how many rows the survey had, so a reader can see the denominator.
  skill_ref: S52-R1-K01
- type: retrieval
  prompt: |
    Without looking back, take each of `select()`, `rename()`, `filter()` and `arrange()` in turn.
    Say what it does to the rows and to the columns. Then say what it does to the data frame you
    gave it.
  answer: |
    `select()` keeps the columns you name, in that order, and keeps every row. The function
    `rename()` changes column names and keeps every row and every column. The function `filter()`
    keeps the rows whose condition is `TRUE`, dropping `FALSE` and `NA`, and keeps every column. The
    function `arrange()` keeps every row and column and changes only the order of the rows, with
    missing values last.

    None of them changes the data frame you gave it. Each returns a new one, which is lost unless you
    assign it with `<-`.
- type: design
  prompt: |
    Write the first block of your analysis script after the line that reads the penguin file. It
    should keep the species, island, sex, flipper length and body mass columns, and give each a
    snake-case name that carries its unit. Show that the result has {{n:penguins_rows}} rows and 5 columns.
  answer: |
    One answer. Your names may differ; check that each is lowercase, joined by `_`, and ends in its
    unit where it has one.

    ```r
    library(readr)
    library(dplyr)

    penguins_raw <- read_csv(
      here::here("data-raw", "penguins_raw.csv"),
      show_col_types = FALSE
    )

    penguins <- penguins_raw |>
      select(
        species = Species,
        island = Island,
        sex = Sex,
        flipper_length_mm = `Flipper Length (mm)`,
        body_mass_g = `Body Mass (g)`
      )

    nrow(penguins)
    ncol(penguins)
    ```

    ```output

    Attaching package: ‘dplyr’

    The following objects are masked from ‘package:stats’:

        filter, lag

    The following objects are masked from ‘package:base’:

        intersect, setdiff, setequal, union

    [1] 344
    [1] 5
    ```

    `select()` with `new_name = old_name` keeps and renames in one step. No row is lost, because
    `select()` never drops rows. The raw object `penguins_raw` still has all {{n:penguins_cols}} columns.
  skill_ref: S52-R1-K02
quantitative: true
practice_note: |
  Thirteen problems: four verbs, each with its own trap (== NA, capitals in a value, the unassigned
  verb, the English "or", the sort direction), and every trap needs its own diagnostic problem.
practice:
- level: 1
  prompt: |
    A made-up clinic register has three rows.

    ```r
    library(dplyr)

    clinic <- tibble(
      id = c(101, 102, 103),
      sex = c("F", "M", "F"),
      weight_kg = c(61.2, 78.5, NA)
    )
    ```

    ```output

    Attaching package: ‘dplyr’

    The following objects are masked from ‘package:stats’:

        filter, lag

    The following objects are masked from ‘package:base’:

        intersect, setdiff, setequal, union
    ```

    Write one line that keeps the rows for women.
  answer: |
    ```r
    clinic |>
      filter(sex == "F")
    ```

    ```output
    # A tibble: 2 × 3
         id sex   weight_kg
      <dbl> <chr>     <dbl>
    1   101 F          61.2
    2   103 F          NA
    ```

    Two rows, ids 101 and 103. The test `sex == "F"` is `TRUE` on rows 1 and 3, so those stay. The
    missing weight on row 3 does not matter: the test was on `sex`, not on `weight_kg`.
- level: 2
  prompt: |
    The same made-up register:

    ```r
    library(dplyr)

    clinic <- tibble(
      id = c(101, 102, 103),
      sex = c("F", "M", "F"),
      weight_kg = c(61.2, 78.5, NA)
    )
    ```

    ```output

    Attaching package: ‘dplyr’

    The following objects are masked from ‘package:stats’:

        filter, lag

    The following objects are masked from ‘package:base’:

        intersect, setdiff, setequal, union
    ```

    Write one line that keeps only the `id` and `weight_kg` columns, in that order.
  answer: |
    ```r
    clinic |>
      select(id, weight_kg)
    ```

    ```output
    # A tibble: 3 × 2
         id weight_kg
      <dbl>     <dbl>
    1   101      61.2
    2   102      78.5
    3   103      NA
    ```

    Three rows and two columns. `select()` keeps every row and the named columns, in the order you
    named them.
- level: 3
  prompt: |
    The same made-up register:

    ```r
    library(dplyr)

    clinic <- tibble(
      id = c(101, 102, 103),
      sex = c("F", "M", "F"),
      weight_kg = c(61.2, 78.5, NA)
    )
    ```

    ```output

    Attaching package: ‘dplyr’

    The following objects are masked from ‘package:stats’:

        filter, lag

    The following objects are masked from ‘package:base’:

        intersect, setdiff, setequal, union
    ```

    Sort it heaviest first. Before you run it, say where the row with no weight will go.
  answer: |
    ```r
    clinic |>
      arrange(desc(weight_kg))
    ```

    ```output
    # A tibble: 3 × 3
         id sex   weight_kg
      <dbl> <chr>     <dbl>
    1   102 M          78.5
    2   101 F          61.2
    3   103 F          NA
    ```

    102 (78.5 kg), then 101 (61.2 kg), then 103. The missing value goes last. `arrange()` puts
    missing values at the end whichever direction you sort, so `desc()` does not bring it to the
    top.
- level: 4
  prompt: |
    Read the penguin file.

    ```r
    library(readr)
    library(dplyr)

    penguins_raw <- read_csv(
      here::here("data-raw", "penguins_raw.csv"),
      show_col_types = FALSE
    )
    ```

    ```output

    Attaching package: ‘dplyr’

    The following objects are masked from ‘package:stats’:

        filter, lag

    The following objects are masked from ‘package:base’:

        intersect, setdiff, setequal, union
    ```

    How many rows are Chinstrap penguins? The species is written in the file exactly as
    "Chinstrap penguin (Pygoscelis antarctica)".
  answer: |
    ```r
    penguins_raw |>
      filter(Species == "Chinstrap penguin (Pygoscelis antarctica)") |>
      nrow()
    ```

    ```output
    [1] 68
    ```

    {{n:penguins_chinstrap}} rows, so {{n:penguins_chinstrap}} Chinstrap penguins in this file. The test must match the text exactly, letter
    for letter, including the capital C and the part in brackets.
