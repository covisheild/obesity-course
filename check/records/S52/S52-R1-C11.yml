- level: 7
  prompt: |
    A colleague wants the number of Adelie penguins and writes:

    ```r
    library(readr)
    library(dplyr)

    penguins_raw <- read_csv(
      here::here("data-raw", "penguins_raw.csv"),
      show_col_types = FALSE
    )

    penguins_raw |>
