    The following objects are masked from ‘package:base’:

        intersect, setdiff, setequal, union

    [1] 0
    ```

    They report "there are no Adelie penguins in the file". Find what broke.
  answer: |
    The test does not match the text in the file. Look at the values that are there:

    ```r
    penguins_raw |>
      count(Species)
    ```

    ```output
    # A tibble: 3 × 2
      Species                                       n
      <chr>                                     <int>
    1 Adelie Penguin (Pygoscelis adeliae)         152
    2 Chinstrap penguin (Pygoscelis antarctica)    68
    3 Gentoo penguin (Pygoscelis papua)           124
    ```

    The file writes "Adelie Penguin", with a capital P. The other two species have a small p. The
    comparison `==` works letter for letter. So "penguin" never equals "Penguin", and the test is
    `FALSE` on every row. Copy the value exactly:

    ```r
    penguins_raw |>
      filter(Species == "Adelie Penguin (Pygoscelis adeliae)") |>
      nrow()
    ```

