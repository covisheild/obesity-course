    They report "the heaviest penguin was a Chinstrap at 2700 g". Find what broke.
  answer: |
    `arrange()` sorts smallest first. The top row is the lightest penguin, not the heaviest. Wrap the
    column in `desc()`:

    ```r
    penguins_raw |>
      arrange(desc(`Body Mass (g)`)) |>
      select(Species, `Body Mass (g)`) |>
      print(n = 1)
