      3 N58A2           MALE             6000
      4 N36A2           MALE             6000
      ```

      Four penguins, because two weighed exactly 6000 g, and all four are recorded as male. Here
      the two readings agree. They need not. Say which one you used.
    - Anything about the two penguins with no body mass. `filter()` dropped them, because their
      test was `NA`.
