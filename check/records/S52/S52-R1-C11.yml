      Species                           `Body Mass (g)`
      <chr>                                       <dbl>
    1 Gentoo penguin (Pygoscelis papua)            6300
    # ℹ 343 more rows
    ```

    The heaviest penguin was a Gentoo at 6300 g.

    Why the wrong answer looks reasonable: 2700 g is a real penguin's mass, and "top row" feels like
    "top value". Check a sort by looking at the last row as well as the first, or by asking whether
    the number is plausible as a maximum.
- level: 9
  prompt: |
    A line in a made-up field report says: "More than half of the Adelie penguins on Torgersen were
    female." Check it against the file, and say what your answer does not establish.
  answer: |
    Read the file and keep the Adelie penguins on Torgersen. Then count each value of `Sex`.

    ```r
    library(readr)
    library(dplyr)

    penguins_raw <- read_csv(
      here::here("data-raw", "penguins_raw.csv"),
      show_col_types = FALSE
    )

    penguins_raw |>
      filter(
        Species == "Adelie Penguin (Pygoscelis adeliae)",
        Island == "Torgersen"
      ) |>
      count(Sex)
    ```

    ```output

    Attaching package: ‘dplyr’

    The following objects are masked from ‘package:stats’:

        filter, lag

    The following objects are masked from ‘package:base’:

        intersect, setdiff, setequal, union

    # A tibble: 3 × 2
      Sex        n
      <chr>  <int>
    1 FEMALE    24
    2 MALE      23
    3 <NA>       5
    ```

    {{n:penguins_torgersen}} Adelie penguins on Torgersen: 24 female, 23 male, 5 with no sex recorded.

    The claim depends on the denominator.

    ```working
    out of all 52: 24 ÷ 52 = 0.46, so 46%, less than half
    out of the 47 with sex recorded: 24 ÷ 47 = 0.51, so 51%, more than half
    ```

    So "more than half" is true only if the 5 unrecorded penguins are left out of the bottom of the
    fraction. A report should say which denominator it used.

    What it does not establish: anything about penguins on Torgersen outside this file, or about
    the 5 whose sex is unknown. Counted out of all {{n:penguins_torgersen}}, the females number somewhere from 24 to 29,
    depending on those 5. They are more than half only if at least 3 of the 5 are female. 26 is
    exactly half, and 27 ÷ {{n:penguins_torgersen}} = 0.52.
- level: 10
  prompt: |
    In a made-up lab meeting, someone says: "The Gentoo penguins over 6 kg were all males." Turn
    this into code, run it, and say what the result does not establish.
  answer: |
    6 kg is 6000 g, the unit of the column. Keep Gentoo penguins heavier than 6000 g and look at
    their sex.

    ```r
    library(readr)
    library(dplyr)

    penguins_raw <- read_csv(
      here::here("data-raw", "penguins_raw.csv"),
      show_col_types = FALSE
    )

    penguins_raw |>
      filter(
        Species == "Gentoo penguin (Pygoscelis papua)",
        `Body Mass (g)` > 6000
      ) |>
      select(`Individual ID`, Sex, `Body Mass (g)`)
    ```

    ```output

    Attaching package: ‘dplyr’

    The following objects are masked from ‘package:stats’:

        filter, lag

    The following objects are masked from ‘package:base’:

        intersect, setdiff, setequal, union

    # A tibble: 2 × 3
      `Individual ID` Sex   `Body Mass (g)`
      <chr>           <chr>           <dbl>
    1 N39A2           MALE             6300
    2 N56A2           MALE             6050
    ```

    Two Gentoo penguins weighed more than 6000 g, at 6300 g and 6050 g, and both are recorded as
    male. The sentence is true of this file.

    What it does not establish:

    - That heavy Gentoo penguins are male in general. Two penguins are two penguins.
    - Anything about a penguin of exactly 6000 g. "Over 6 kg" became `> 6000`, which leaves 6000
      out. If the speaker meant "6 kg or more", the test is `>= 6000`. Run that too:

      ```r
      penguins_raw |>
        filter(
          Species == "Gentoo penguin (Pygoscelis papua)",
          `Body Mass (g)` >= 6000
        ) |>
        select(`Individual ID`, Sex, `Body Mass (g)`)
