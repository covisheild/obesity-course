definition:
  text: |
    A package is a collection of R functions, data and documentation that extends what base R,
    the set of standard packages installed with R itself, can do.

    Installing a package, with `install.packages()`, downloads it from a repository such as CRAN
    (the Comprehensive R Archive Network) and stores it on the computer. It is done once per
    computer, and again only to change the version. Loading a package, with `library()`, makes its
    functions available in the current R session (R from the moment it starts until it is closed
    or restarted). `install.packages()` and `packageVersion()` need the name in quotation marks;
    `library()` also accepts it without.

    Every package has a version number, read with `packageVersion()`. R itself has one, held in
    `R.version.string`. A package's behaviour, and the messages it prints, can change between
    versions.
