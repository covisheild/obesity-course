practice_note: |
  Eleven problems: parsing by order, the date as a day count, subtraction and age are separate
  moves, and each of the three ways parsing goes wrong (all NA, some silently wrong, a spreadsheet
  day count from the wrong start) gets a diagnostic problem.
practice:
- level: 1
  prompt: |
    Turn the text "2023-11-14" into a date. Say what class the result has.
  answer: |
    ```r
    library(lubridate, warn.conflicts = FALSE)

    d <- ymd("2023-11-14")
    d
    class(d)
    ```

    ```output
    [1] "2023-11-14"
    [1] "Date"
    ```

    The year comes first, so `ymd()`. The result prints as 2023-11-14 and its class is `Date`.
- level: 2
  prompt: |
    Before you run them, say what each line gives.

    ```r norun
    library(lubridate, warn.conflicts = FALSE)

    dmy("05/06/2022")
    mdy("05/06/2022")
    ```
  answer: |
    ```r
    library(lubridate, warn.conflicts = FALSE)

    dmy("05/06/2022")
    mdy("05/06/2022")
    ```

    ```output
    [1] "2022-06-05"
    [1] "2022-05-06"
    ```

    `dmy()` gives 5 June 2022 and `mdy()` gives 6 May 2022. The same text, two dates a month apart,
    and both look right.
- level: 3
  prompt: |
    Before you run it, say how many days this gives, and why.

    ```r norun
    library(lubridate, warn.conflicts = FALSE)

    ymd("2024-03-01") - ymd("2024-02-01")
    ```
  answer: |
    ```r
    library(lubridate, warn.conflicts = FALSE)

    ymd("2024-03-01") - ymd("2024-02-01")
    ```

    ```output
    Time difference of 29 days
    ```

    29 days. 2024 is a leap year, so February 2024 has 29 days. Date arithmetic counts the calendar,
    not 30 days a month.
- level: 4
  prompt: |
    Read the penguin file.

    ```r
    library(readr)

    penguins_raw <- read_csv(
      here::here("data-raw", "penguins_raw.csv"),
      show_col_types = FALSE
    )
    ```

    How many days separate the first nest observed in the file and the first nest of the
    second season, which starts on 2008-11-02?
  answer: |
    ```r
    library(lubridate, warn.conflicts = FALSE)

    ymd("2008-11-02") - min(penguins_raw$`Date Egg`)
    ```

    ```output
    Time difference of 359 days
    ```

    The first nest in the file was observed on 2007-11-09, so 359 days separate the two. The
    second season's date is typed as text and parsed with `ymd()`; the file's own date is already
    a date.
- level: 5
  prompt: |
    Read the penguin file.

    ```r
    library(readr)
    library(dplyr, warn.conflicts = FALSE)

    penguins_raw <- read_csv(
      here::here("data-raw", "penguins_raw.csv"),
      show_col_types = FALSE
    )
    ```

    How many rows have a `Date Egg` in November 2008?
  answer: |
    ```r
    library(lubridate, warn.conflicts = FALSE)

    penguins_raw |>
      filter(
        `Date Egg` >= ymd("2008-11-01"),
        `Date Egg` <= ymd("2008-11-30")
      ) |>
      nrow()
    ```

    ```output
    [1] 114
    ```

    114 rows. "On or after 1 November and on or before 30
    November" is two comparisons, as `filter()` would write for any number.
- level: 6
  prompt: |
    A made-up register records two children measured at a school camp. Work out each child's age at
    measurement in completed years.

    ```r
    library(dplyr, warn.conflicts = FALSE)
    library(lubridate, warn.conflicts = FALSE)

    children <- tibble(
      id = c("C1", "C2"),
      dob = dmy(c("21/06/2014", "05/12/2013")),
      measured = dmy(c("20/06/2024", "20/06/2024"))
    )
    ```
  answer: |
    ```r
    children |>
      mutate(
        age_years = as.numeric(measured - dob) / 365.25,
        age_completed = floor(age_years)
      )
    ```

    ```output
    # A tibble: 2 × 5
      id    dob        measured   age_years age_completed
      <chr> <date>     <date>         <dbl>         <dbl>
    1 C1    2014-06-21 2024-06-20      10.0             9
    2 C2    2013-12-05 2024-06-20      10.5            10
    ```

    C1 is 9 in completed years: measured on 20 June, a day before the 10th birthday. The printed
    10.0 is rounded to fit; the stored age is a little under 10. C2 is 10. A report that
    subtracted years, 2024 minus 2014, would have made C1 10.
- level: 7
  prompt: |
    A colleague reads a made-up register whose dates were typed day first, and reports: "Visit dates
    were missing for all three patients."

    ```r
    library(lubridate, warn.conflicts = FALSE)

    visits <- c("12/01/2022", "19/01/2022", "26/01/2022")
    ymd(visits)
    ```

    ```output
    [1] NA NA NA
    Warning message:
    All formats failed to parse. No formats found.
    ```

    Find what broke.
  answer: |
    The dates are not missing. They were read in the wrong order. `ymd()` expects the year first,
    nothing fitted, and every value became `NA`. The warning says no format was found.

    ```r
    dmy(visits)
    ```

    ```output
    [1] "2022-01-12" "2022-01-19" "2022-01-26"
    ```

    12, 19 and 26 January 2022.

    Why the wrong report looks reasonable: R prints `NA`, which is R's word for missing. Here it
    meant "could not be read". The warning above it said which.
- level: 7
  prompt: |
    A colleague reads a made-up register whose dates were typed day first. They report: "1 of the 3
    screening dates was missing; the first patient was screened on 3 February 2023."

    ```r
    library(lubridate, warn.conflicts = FALSE)

    screened <- c("02/03/2023", "11/03/2023", "17/03/2023")
    mdy(screened)
    ```

    ```output
    [1] "2023-02-03" "2023-11-03" NA
    Warning message:
     1 failed to parse.
    ```

    Find what broke.
  answer: |
    `mdy()` read the text month first. "02/03/2023" became 3 February 2023, a real date and the
    wrong one. "17/03/2023" failed, because there is no 17th month. The middle date, "11/03/2023",
    became 3 November 2023, also wrong. Nothing was missing.

    ```r
    dmy(screened)
    ```

    ```output
    [1] "2023-03-02" "2023-03-11" "2023-03-17"
    ```

    2, 11 and 17 March 2023.

    Why the wrong report looks reasonable: two of the three dates came out as dates. The one `NA`
    looked like a gap in the register. It was the only value whose day was above 12, and so
    the only one that could have shown the order was wrong.
- level: 8
  prompt: |
    A made-up spreadsheet export gives two visit dates as day counts, 45292 and 45306. The colleague
    who exported it remembers that the first visit was on 1 January 2024. A resident converts them:

    ```r
    library(lubridate, warn.conflicts = FALSE)

    ymd("1899-12-31") + c(45292, 45306)
    ```

    ```output
    [1] "2024-01-02" "2024-01-16"
    ```

    They report: "The first visit was on 2 January 2024." Find what broke.
  answer: |
    The start date is a day late for this kind of file. The resident trusted a starting date
    instead of checking against the one date they knew. Start from 30 December 1899:

    ```r
    ymd("1899-12-30") + c(45292, 45306)
    ```

    ```output
    [1] "2024-01-01" "2024-01-15"
    ```

    1 January and 15 January 2024. The first matches what the colleague remembers, so the second is
    right too.

    Why the wrong answer looks reasonable: 2 January 2024 is a real date, near the right one, and
    nothing failed. Only the known date gave it away. Always keep one.
- level: 9
  prompt: |
    A made-up clinic note says: "The median time from screening to the first clinic visit was 14
    days." Here are the dates for the five patients it describes, typed day first.

    ```r
    library(dplyr, warn.conflicts = FALSE)
    library(lubridate, warn.conflicts = FALSE)

    clinic <- tibble(
      id = c(1, 2, 3, 4, 5),
      screened = dmy(c("02/05/2024", "02/05/2024", "09/05/2024", "09/05/2024", "16/05/2024")),
      visited = dmy(c("13/05/2024", "20/05/2024", "23/05/2024", "06/06/2024", "30/05/2024"))
    )
    ```

    Check the claim, and say what your answer does not establish.
  answer: |
    ```r
    clinic <- clinic |>
      mutate(days = as.numeric(visited - screened))

    clinic$days
    median(clinic$days)
    ```

    ```output
    [1] 11 18 14 28 14
    [1] 14
    ```

    The gaps are 11, 18, 14, 28 and 14 days. In order, 11, 14, 14, 18, 28; the middle value is 14.
    The claim matches the dates.

    What it does not establish:

    - That 14 days is typical for anyone else. Five patients are five patients.
    - Anything about patients who were screened and never came. They have no visit date, so they
      are not in this table, and the median says nothing about them.
    - Why the gaps differ. The longest, 28 days, may be a clinic closure or a patient's own choice;
      the dates cannot tell you.
- level: 10
  prompt: |
    A made-up draft report on the penguin file says: "All penguins in the 2008–09 season laid their
    first egg in November 2008." The `studyName` column names the season; PAL0809 is 2008–09. Check
    the claim in code, and say what the file can and cannot support.
  answer: |
    ```r
    library(readr)
    library(dplyr, warn.conflicts = FALSE)

    penguins_raw <- read_csv(
      here::here("data-raw", "penguins_raw.csv"),
      show_col_types = FALSE
    )

    season <- penguins_raw |>
      filter(studyName == "PAL0809")

    nrow(season)
    min(season$`Date Egg`)
    max(season$`Date Egg`)
    ```

    ```output
    [1] 114
    [1] "2008-11-02"
    [1] "2008-11-25"
    ```

    The 114 rows of that season run from 2008-11-02 to 2008-11-25. Every date is in November 2008.

    What the file cannot support:

    - That the egg was laid on that date. The help page describes `Date Egg` as the date the study
      nest was "observed with 1 egg". An egg may have been laid before the visit.
    - "All penguins". Each row is one bird at a study nest, not every penguin in the colony.
    - A fair rewrite: "In the 2008–09 season, all 114 rows are of study nests first observed with
      one egg between 2 and 25 November 2008."
