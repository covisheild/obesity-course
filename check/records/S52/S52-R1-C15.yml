retrieval_items:
- q: How does R store a Date, and what does subtracting two dates give?
  a: As a number of days since 1 January 1970, printed as year-month-day. Subtracting two dates
    gives a time difference in days.
- q: Which lubridate function reads "15/04/2021", and how do you choose it?
  a: dmy(). Its name spells the order of the parts in the text, day, month, year.
- q: Why is 03/04/2021 dangerous and 15/04/2021 not?
  a: 03/04/2021 is a real date read either way, 3 April or 4 March. 15/04/2021 can only be read day
    first, because there is no 15th month, so it fails loudly if read the wrong way.
- q: What date form do Broman and Woo recommend, and why?
  a: ISO 8601, year-month-day such as 2013-02-27. It cannot be read two ways and sorts in date order.
