simplified_explanation: |
  To R, a date is a number of days, counted from 1 January 1970, that prints as year-month-day.
  Because it is a number underneath, you can subtract one date from another and get days.

  A date usually arrives as text, such as "03/04/2021". Is that 3 April or 4 March? The text
  cannot tell you.

  Here is the trap. If you pick the wrong order, some dates come out wrong and still look like
  dates. Others fail and become `NA`.

  Broman and Woo recommend the ISO 8601 form, year-month-day: 2021-04-03.
illustrations:
- body: |
    Start with a made-up camp register whose visit dates were typed with the day first. Here is
    its text, read with `I()` to mark it as data rather than a file name, as an earlier section did.

    ```r
    library(readr)
    library(dplyr, warn.conflicts = FALSE)
    library(lubridate)

    camp <- read_csv(I("id,visit
    1,03/04/2021
    2,15/04/2021
    3,28/02/2021"), show_col_types = FALSE)

    camp
    ```

    ```output

    Attaching package: ‘lubridate’

    The following objects are masked from ‘package:base’:

        date, intersect, setdiff, union

    # A tibble: 3 × 2
         id visit
      <dbl> <chr>
    1     1 03/04/2021
    2     2 15/04/2021
    3     3 28/02/2021
    ```

    The `visit` column is `<chr>`, text. These dates are not year-month-day, so `read_csv()` left
    them as they were. Loading lubridate printed a masking message, like dplyr's in an earlier
    section.

    Try the wrong order first. Year first:

    ```r
    ymd(camp$visit)
    ```

    ```output
    [1] NA NA NA
    Warning message:
    All formats failed to parse. No formats found.
    ```

    Every date is `NA`, and the warning says no format fitted. That failure is loud, which is
    good. Now month first:

    ```r
    mdy(camp$visit)
    ```

    ```output
    [1] "2021-03-04" NA           NA
    Warning message:
     2 failed to parse.
    ```

    This one is worse. Two dates failed: there is no 15th or 28th month. But the first, 03/04/2021,
    became 4 March 2021, which looks like a perfectly good date. If every date in the column had a
    day of 12 or less, nothing would fail and every date would be wrong.

    Day first is the order the register used:

    ```r
    camp <- camp |>
      mutate(visit_date = dmy(visit))

    camp
    ```

    ```output
    # A tibble: 3 × 3
         id visit      visit_date
      <dbl> <chr>      <date>
    1     1 03/04/2021 2021-04-03
    2     2 15/04/2021 2021-04-15
    3     3 28/02/2021 2021-02-28
    ```

    All three are dates now, printed year-month-day. The new column is `<date>`, and the text
    column is still beside it.

    A date is a number underneath, so you can do arithmetic with it. How many days after the first
    visit was each visit?

    ```r
    camp$visit_date - camp$visit_date[1]

    as.numeric(ymd("2021-04-03"))
    ```

    ```output
    Time differences in days
    [1]   0  12 -34
    [1] 18720
    ```

    Subtraction gives a time difference in days: 0, 12 and -34. The third visit, in February, came
    34 days before the first, so its difference is negative. The last line shows the number behind
    a date: 3 April 2021 is 18720 days after 1 January 1970. Dates compare like numbers too:
    `visit_date >= ymd("2021-04-01")` is `TRUE` for the two April visits.
  analogy_breaks_when: |
    The register is made up. A column that mixes orders, some day first and some month first, cannot
    be fixed by any single function. The 03/04 dates in it are lost unless another record says which
    was meant.

    One date with a day above 12 settles the order only if the whole column was written one way.
    Check the data dictionary or the form the data came from.
- body: |
    Now a date that arrives as a number. A colleague exports a spreadsheet, and the visit date
    column comes out as 41822. Data Carpentry's spreadsheet lesson says Excel "counts the days from
    a default of December 31, 1899, and thus stores July 2, 2014 as the serial number 41822". Take
    the first half of that sentence and add the days:

    ```r
    library(lubridate)

    ymd("1899-12-31") + 41822
    ```

    ```output
    [1] "2014-07-03"
    ```

    3 July 2014. The lesson's own example says 2 July. Its two statements, taken literally, are a
    day apart. You do not need to know why to protect yourself. Find a start that gives the date you
    know:

    ```r
    ymd("1899-12-30") + 41822
    ```

    ```output
    [1] "2014-07-02"
    ```

    2 July 2014, which matches. So the rule for this kind of file is: start from 30 December 1899.
    And the habit, which matters more than the rule: when you convert a spreadsheet's numbers to
    dates, check one date whose true value you know.

    The lesson warns of a second system too. Excel on a Mac has used a 1904 starting date, so the
    same number can mean a date about four years away. Broman and Woo say the same: Excel stores
    dates "internally as a number, with different conventions on Windows and Macs".

    Spreadsheets also make dates out of things that are not dates. Ziemann and colleagues found the
    gene symbol SEPT2 turned into "2006/09/02" in one supplementary file, a full date with a year
    the spreadsheet supplied. They found gene name errors in {{n:ziemann_affected_pct}} of the
    papers they screened whose Excel files held gene lists, as the first section of this book
    showed. R does not do this. Read the same text with `read_csv()`:

    ```r
    library(readr)

    genes <- read_csv(I("gene
    SEPT2
    MARCH1"), show_col_types = FALSE)

    genes
    ```

    ```output
    # A tibble: 2 × 1
      gene
      <chr>
    1 SEPT2
    2 MARCH1
    ```

    Still text. R parses a date only when you ask it to, with a function whose name says the order.
  analogy_breaks_when: |
    "Start from 30 December 1899" reproduces the lesson's one example, 41822 as 2 July 2014. This
    book has not checked it for dates before March 1900 or for files made on a Mac, and the lesson
    warns that both differ. Check against a known date in your own file.

    That R leaves text alone does not undo a spreadsheet's change. A gene list saved after the
    spreadsheet turned SEPT2 into a date holds the date, and R reads the date.
  numbers:
  - value: '41822'
    unit: Excel serial number of 2 July 2014, as Data Carpentry states it
    citekey: dc_spreadsheets
    as_of: '2026-10-02'
    quote: |-
      Essentially, it counts the days from a default of December 31, 1899, and thus stores July 2, 2014 as the serial number 41822.
  - value: '19.6%'
    unit: share of screened papers with Excel gene lists affected by gene name errors, 18 journals, 2005 to 2015
    citekey: ziemann_2016
    as_of: '2026-10-02'
    quote: |-
      Of the selected journals, the proportion of published articles with Excel files containing gene lists that are affected by gene name errors is 19.6 %.
- body: |
    Last, the calculation every clinic register needs: age at a visit. Here is a made-up register
    of three people, with the date of birth and the visit date both written day first.

    ```r
    library(dplyr)
    library(lubridate)

    patients <- tibble(
      id = c(1, 2, 3),
      dob = dmy(c("14/08/1990", "02/01/1985", "30/06/2001")),
      visit = dmy(c("10/08/2021", "10/08/2021", "10/08/2021"))
    )

    patients <- patients |>
      mutate(
        age_days = as.numeric(visit - dob),
        age_years = age_days / 365.25,
        age_completed = floor(age_years)
      )

    patients
    ```

    ```output
    # A tibble: 3 × 6
         id dob        visit      age_days age_years age_completed
      <dbl> <date>     <date>        <dbl>     <dbl>         <dbl>
    1     1 1990-08-14 2021-08-10    11319      31.0            30
    2     2 1985-01-02 2021-08-10    13369      36.6            36
    3     3 2001-06-30 2021-08-10     7346      20.1            20
    ```

    Read it one column at a time. `visit - dob` is the time difference in days, and `as.numeric()`
    keeps the number. Dividing by 365.25, the average length of a year counting leap years, gives
    age in years with a fraction. `floor()` rounds down to the whole number below, which is age in
    completed years, the way a register writes it.

    Patient 1 is 30, not 31. The visit was on 10 August and the birthday is on 14 August, so the
    31st birthday had not come. The tibble prints `age_years` as 31.0 because it rounds to fit the
    column; the stored value is a little under 31, and `floor()` sees the stored value.
    Subtracting the years, 2021 minus 1990, would have said 31.

    The same arithmetic works on the penguin file, whose `Date Egg` column `read_csv()` read as
    dates by itself:

    ```r
    library(readr)

    penguins_raw <- read_csv(
      here::here("data-raw", "penguins_raw.csv"),
      show_col_types = FALSE
    )

    min(penguins_raw$`Date Egg`)
    max(penguins_raw$`Date Egg`)
    max(penguins_raw$`Date Egg`) - min(penguins_raw$`Date Egg`)
    ```

    ```output
    [1] "2007-11-09"
    [1] "2009-12-01"
    Time difference of 753 days
    ```

    `Date Egg`, says the data's help page, is the date the study nest was observed with one egg.
    The first is 9 November 2007 and the last 1 December 2009, 753 days later.
  analogy_breaks_when: |
    Dividing by 365.25 is a rule of thumb. On the day before or after a birthday it can put a person
    in the wrong whole year. For an exact age in completed years, lubridate has functions that count
    calendar years, which this book does not cover. Where a cut-point at an exact age matters, check
    the people near it by hand.

    The three patients are made up. The penguin dates describe when study nests were observed, not
    anything about penguins in general.
must_know:
- point: |
    Read day-first text with `mdy()`, and every date whose day is 12 or less comes out as a real,
    wrong date. Only the others fail.
  kind: misconception
  bearing: methodological
- point: |
    Before parsing a date column, find out the order of its parts from the data dictionary or the
    form.
  kind: move
  bearing: methodological
- point: |
    Read every "failed to parse" warning. It says how many dates became `NA`, or that all of
    them did.
  kind: trap
  bearing: methodological
- point: |
    When you design a form or a register, write dates as year-month-day, ISO 8601, as Broman and Woo
    recommend.
  kind: move
  bearing: teaching
  refs:
  - broman_woo_2018_tas
- point: |
    A spreadsheet date may reach you as a day count such as 41822. The starting date differs
    between systems, and a one-day or four-year slip looks like a real date.
  kind: trap
  bearing: methodological
  refs:
  - dc_spreadsheets
- point: |
    Compute age from the date of birth and the visit date, never by subtracting years.
  kind: consequence
  bearing: clinical
- point: |
    If a spreadsheet already turned a gene name or a date into something else, no function in R
    can tell you what was there before.
  kind: boundary
  bearing: methodological
exercises:
- type: calculation
  prompt: |
    In your penguin script, check that `Date Egg` came in as a date, and count its missing values.
  answer: |
    ```r
    library(readr)

    penguins_raw <- read_csv(
      here::here("data-raw", "penguins_raw.csv"),
      show_col_types = FALSE
    )

    class(penguins_raw$`Date Egg`)
    sum(is.na(penguins_raw$`Date Egg`))
    ```

    ```output
    [1] "Date"
    [1] 0
    ```

    The column is already a `Date`, because the file writes it year-month-day. No date is
    missing, so `min()` and `max()` on it need no `na.rm`.
  skill_ref: S52-R1-K01
- type: retrieval
  prompt: |
    Without looking back, say which lubridate function reads "28/02/2021", and what `mdy()` would
    give for "03/04/2021".
  answer: |
    `dmy()`, because the day comes first. `mdy()` would read "03/04/2021" as month 3, day 4: 4 March
    2021. That is a real date, and the wrong one if the register meant 3 April.
- type: design
  prompt: |
    You are designing the data-entry sheet for a made-up school survey that records each child's
    date of birth and the date they were measured. Write the two lines of the data dictionary for
    these columns, and say what the analysis script will do with them.
  answer: |
    One possible answer.

    ```table
    | Variable | Label | Type | Format | Missing value code |
    | dob | date of birth | date | YYYY-MM-DD, for example 2014-06-21 | empty cell |
    | measure_date | date measured | date | YYYY-MM-DD | empty cell |
    ```

    The script reads the file with `read_csv()`, which recognises year-month-day dates by itself.
    It checks that both columns came in as dates, and counts any missing. Then it computes age at
    measurement from `measure_date - dob`, in completed years with `floor()`. Nobody types an age:
    the age is computed in code, so it can be checked.

    Writing the format in the dictionary, with an example, is the step that stops a data-entry
    operator from typing 21/06/2014.
quantitative: true
