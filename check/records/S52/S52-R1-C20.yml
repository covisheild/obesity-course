- type: critique
  prompt: |
    A classmate's thesis says, in its methods: "All code is available on request, so the analysis is
    fully reproducible." Say what is wrong with the sentence, using this section's evidence, and write
    a sentence that would be true.
  answer: |
    The sentence makes two claims, and neither follows.

    "Available on request" is not shared. On Peng's spectrum, a study is more or less reproducible
    depending on what data and code are made available. Code kept on the author's own computer has
    not been made available. A request may never be answered, and the computer may not last.

    "So the analysis is fully reproducible" claims that the code would run on someone else's computer
    and print the same numbers. Nobody has tested that. One large study took 9078 R files
    deposited with published papers. Its authors report that {{n:trisovic_fail_initial_pct}}
    failed to run without an error the first time. Among the common causes were a working directory
    on the author's computer and packages that were missing.

    And "reproducible" would not mean "right". Peng: being reproducible "does not guarantee the
    quality, correctness, or validity of the published results."

    A true sentence describes what was done. For example: "The raw data and one script that produces
    every table and figure from them are deposited at [website and identifier]. The script was run
    from a fresh R session on a second computer, and gave the reported results." Write the second
    sentence only if someone actually did it.
- type: interpretation
  prompt: |
    A blog post says: "A Harvard study found only 25% of research code works." Using the results table
    in this section, say what the 25% is a share of, what it leaves out, and what the sentence gets
    wrong.
  answer: |
    The 25% is the table's success rate for the run without code cleaning. Dividing 952 successes by
    952 successes plus 2878 errors gives 0.2486, which rounds to 25%. So it is a share of the files that
    finished, with or without an error.

    It leaves out the 3829 files that ran out of their hour. Some of those might have run with more
    time, which is why the authors left them out.

    What the sentence gets wrong:

    - "Research code" is too wide. The study is of R files on one website, the Harvard Dataverse,
      deposited from 2010 to July 2020, most from the social sciences.
    - "Works" is too wide. A success means the file ran to the end without an error on a clean computer,
      under one of three versions of R. It does not mean the file printed the paper's numbers.
    - "Harvard" names the website and the institute that built it. It says nothing about how far
      the finding reaches.
    - It leaves out the second run. After an automatic cleaning step, the table's success rate rose to
      40%.
- type: retrieval
  prompt: |
    Without looking back, say what "reproduce" and "replicate" each mean. Then name three reasons the
    study in this section found for shared R code failing to run.
  answer: |
    Reproduce: run the same code on the same data and get the same result. Replicate: collect new
    data on the same question, usually by other investigators, and see whether the answer holds.

    Any three of these reasons:

    - A line that sets the working directory to a folder on the author's computer, with `setwd()`.
    - A package that is not installed.
    - A package of a version that no longer works with the code.
    - A path to a folder or file that does not exist on the new computer, or an output file never saved.
    - An object the code uses before anything has made it.
- type: teaching
  prompt: |
    A journalist has three minutes and asks you: "Is it true that most scientists' code doesn't even
    run?" Answer without jargon, say how sure you are, and give them one sentence they could quote.
  answer: |
    For one large body of code, yes, as deposited. A team took over nine thousand files of code in the
    R language, shared by researchers alongside published papers on one big website. They tried to
    run each on a clean computer. In their own summary, about three in four did not run to the end without
    an error the first time. After a simple automatic fix-up they report a little over half still failing.

    How sure? Fairly, for that website. It was one website, mostly social science, code shared
    from 2010 to 2020. It does not tell you about every field, or about code that was never shared.

    Two things matter more than the figure. Many failures were boring: the code pointed at a folder on
    the author's own computer, or needed a piece of software that was not there. And running is not the
    same as being right. Code can run perfectly and still give a wrong answer.

    A quotable sentence: "One large study looked at R code shared on one research website. About three
    in four files did not run to the end without an error. Many of the reasons are simple to prevent."
quantitative: false
retrieval_items:
- q: What is the difference between reproducing a result and replicating it?
  a: Reproducing means running the same code on the same data and getting the same result. Replicating
    means collecting new data on the same question, usually by independent investigators, and getting
    the same answer.
- q: In Trisovic and colleagues' 2022 study, what share of R files does the abstract report failed to run without an error on first execution, and what was the sample?
  a: The abstract reports {{n:trisovic_fail_initial_pct}}, of 9078 R files in 2109 replication packages deposited on Harvard Dataverse from 2010 to July
    2020. After automatic code cleaning, the abstract reports {{n:trisovic_fail_cleaned_pct}} failed.
- q: What is the success rate in that study's results table a share of?
  a: Of the files that finished with a success or an error. Files that ran out of time were left out.
- q: Name two kinds of error that automatic code cleaning fixed in that study.
  a: Every error caused by setwd() pointing to a folder on the author's computer, and many errors caused
    by packages that were not installed.
- q: Does a reproducible analysis guarantee a correct result?
  a: No. Reproducing it shows it was done as described with that data and code. Peng (2011) says it does
    not guarantee the quality, correctness or validity of the results.
figures:
- file: "s52-r1-c20-reexecution-results.png"
  caption: "Trisovic and colleagues' results table for R files shared on Harvard Dataverse, 2010 to July 2020: files that ran without error, stopped with an error, or exceeded the time limit. Without code cleaning: 952, 2878 and 3829 of 7659 files. With cleaning: 1472, 2223 and 3719 of 7414. Best of both runs: 1581, 1238 and 5790 of 8609. The table's success rates, 25%, 40% and 56%, leave out the files that ran out of time."
  alt: "A bar chart with three groups: without code cleaning, with code cleaning, and best of both. Each has three bars: success 952, 1472 and 1581; error 2878, 2223 and 1238; time limit exceeded 3829, 3719 and 5790."
  source: "draw.py"
  spec:
    kind: "bar"
    from_table: {block: 0, x: 0, y: [1, 2, 3]}
    x_label: "run"
    y_label: "R files"
    y_range: [0, 6500]
    value_labels: true
    relations:
    - {check: "y1[0] + y2[0] + y3[0] = 7659"}
    - {check: "y1[1] + y2[1] + y3[1] = 7414"}
    - {check: "y1[2] + y2[2] + y3[2] = 8609"}
- file: "s52-r1-c20-success-share-two-bases.png"
  caption: "The same success counts from Trisovic and colleagues' table as shares on two bases. Over successes and errors only, the table's basis, they are 0.2486, 0.3984 and 0.5608: the table's 25%, 40% and 56%. Over every file with a result, time-outs included, they are 952 ÷ 7659 = 0.1243, 1472 ÷ 7414 = 0.1985 and 1581 ÷ 8609 = 0.1836. On that basis the best of both runs is no better than the run with cleaning, because 5790 of its files ran out of time. Per cent of what decides the number."
  alt: "A grouped bar chart of three runs, each with two bars. Share of files that finished: 0.2486, 0.3984, 0.5608. Share of all files with a result: 0.1243, 0.1985, 0.1836."
  source: "draw.py"
  spec:
    kind: "bar"
    x: ["without code cleaning", "with code cleaning", "best of both"]
    series:
    - {name: "success ÷ (success + error)", y: ["0.2486", "0.3984", "0.5608"]}
    - {name: "success ÷ all files with a result", y: ["0.1243", "0.1985", "0.1836"]}
    x_label: "run"
    y_label: "share of R files"
    y_range: [0, 0.7]
    value_labels: true
    derived:
    - {value: "0.1243", from: "952 / 7659"}
    - {value: "0.1985", from: "1472 / 7414"}
    - {value: "0.1836", from: "1581 / 8609"}
    relations:
    - {check: "952 / (952 + 2878) = 0.2486"}
    - {check: "1472 / (1472 + 2223) = 0.3984"}
    - {check: "1581 / (1581 + 1238) = 0.5608"}
    - {check: "1581 / 8609 = 0.1836"}
