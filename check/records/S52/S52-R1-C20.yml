simplified_explanation: |
  **Reproduce** means: take the same data, run the same code, get the same numbers.

  **Replicate** means: collect new data on the same question and see whether the answer holds.

  Reproducing is the smaller test. It cannot tell you whether the analysis was right, only whether it
  was done as described.

  The first step of reproducing is that the code runs at all. One large study tested that. It took
  thousands of R files that researchers had shared with their published papers, and tried to run
  each on a clean computer. Most did not run.

  A script that runs is still not a result reproduced. It may run and print different numbers.
illustrations:
- body: |
    Start with a script that worked, on the computer it was written on. Here are its first lines, made
    up but typical, and shown, not run:

    ```r norun
    setwd("C:/Users/resident/Desktop/thesis final")
    library(janitor)

    survey <- read.csv("data_clean_v3.csv")
    ```

    Now move it to a colleague's computer and run it. The first line asks for a folder that exists only
    on the author's computer, and R stops. Suppose the colleague deletes it. The second line asks for a
    package their computer does not have, and R stops again. Suppose they install it. The third line
    asks for a file the author made by hand somewhere along the way and never shared, and R stops a
    third time. Nothing in the script was wrong on the day it was written. It depended on things that
    were not in the project folder.

    Trisovic and colleagues measured how often this happens. They took 2109 replication packages from
    the Harvard Dataverse, a website where researchers deposit their files. A replication package is
    the data and code that authors deposit with a published paper. These were published from 2010 to July 2020, and together held 9078 R
    files. The team tried to run each file on a clean computer under three versions of R. They gave
    each file up to one hour, and each package up to five. Not every file got a result: when earlier
    files used up a package's five hours, the rest never ran. Then they tried again after an automatic
    cleaning step. It removed absolute paths, the `C:/Users/...` kind, fixed how the text of each file
    was stored, and added lines that install any package the code loads, if it is missing.

    Here is their results table, as they give it. A file counts as a success if any of the three
    versions of R ran it to the end without an error. "Time limit exceeded" means the file was still
    running when its hour ran out. The paper does not spell out the "best of both" row. Its counts fit
    the paper's rule applied to both runs together, so a file that errored in one run and ran out of
    time in the other is left out.

    ```table
    | Run | Success | Error | Time limit exceeded |
    | without code cleaning | 952 | 2878 | 3829 |
    | with code cleaning | 1472 | 2223 | 3719 |
    | best of both | 1581 | 1238 | 5790 |
    ```

    The table gives success rates of 25% without cleaning, 40% with cleaning and 56% for the best of
    both. Now ask Book 0's question: per cent of what? Add each row. Without cleaning, 952 + 2878 + 3829
    = 7659 files had a result. With cleaning, 1472 + 2223 + 3719 = 7414. For the best of both, 1581 +
    1238 + 5790 = 8609. The table gives the same totals.

    Now divide each success count by successes and errors only, leaving out the files that ran out of
    time:

    ```working
    952 ÷ (952 + 2878) = 0.2486
    1472 ÷ (1472 + 2223) = 0.3984
    1581 ÷ (1581 + 1238) = 0.5608
    ```

    Those round to the table's 25%, 40% and 56%. So the success rate is a share of the files that
    finished, one way or the other. The files that ran out of time are left out, as the paper says,
    because they might have run with more time. They are not a small group: 3829 of the 7659 files
    in the first run.

    The abstract gives its figures the other way round: {{n:trisovic_fail_initial_pct}} of R files "failed to complete without
    error" on first execution, and {{n:trisovic_fail_cleaned_pct}} after cleaning. Those two are the authors' summary. The table's
    rates are on a different basis, and its 56% is a success rate where the abstract's 56% is a failure
    rate. The paper does not show how the abstract's two figures were worked out. So quote the abstract's sentence as the abstract's, and the table's rates with the table's
    labels, and never mix the two.

    Last, the reasons. The cleaning fixed every error caused by `setwd()`, the line that set the
    working directory to a folder on the author's computer. It also fixed many errors about packages,
    by installing them. What was left included packages that were missing or of a version that no
    longer worked, paths to folders that did not exist, output files that were never saved, and
    objects the code used before anything had made them.
  analogy_breaks_when: |
    The three-line script is made up. Its three failures are the kinds the study reports, not a
    finding about any one script.

    The study is of one website, the Harvard Dataverse, and most of its packages came from the social
    sciences. Its success rate counts only whether a file ran to the end without an error. It does not
    say whether the file printed the paper's numbers.
