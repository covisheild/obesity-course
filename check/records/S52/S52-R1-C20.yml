definition:
  text: |
    A result is reproducible when the same data, analysed again with the same code, give the same result. A result is
    replicated when independent investigators collect new data on the same question and reach the same answer. Reproducing a
    result does not show that it is correct. Peng (2011) calls replication the ultimate standard for judging scientific
    claims. Between full replication and none he places a spectrum: a study is more or less reproducible depending on what
    data and code are made available.

    Trisovic, Lau, Pasquier and Crosas (2022) measured re-execution at scale. They took 2109
    replication packages, the data and code that authors deposit with a published paper, from the
    Harvard Dataverse, a website where researchers deposit such files. The packages were published
    from 2010 to July 2020 and held 9078 R files.

    Each was run once as deposited and once after an automatic code cleaning. Files that ran out of time were excluded from
    the success rate.

    Their abstract reports that {{n:trisovic_fail_initial_pct}} of the R files failed to complete without error on first
    execution, and {{n:trisovic_fail_cleaned_pct}} after code cleaning. Their results table gives success rates of 25% without
    cleaning, 40% with cleaning and 56% for the better of the two runs. Errors that remained included packages missing or of
    an incompatible version, wrong paths and output folders, and objects that did not exist. Journals with the strictest
    data-sharing policies had the highest re-execution rates. Most packages came from the social sciences, and all from one
    website.
