- body: |
    Now the second half of the claim: a file that runs is not a result reproduced. Trisovic and
    colleagues tested that too, on a small scale. They found 127 replication packages in which every R
    file ran without an error. They picked three at random and compared what the code printed with
    what the papers reported.

    In the first, two of the three logs came out almost identical to the authors' own. The third
    nearly matched, but some decimal digits differed. A package that the code used was not available
    for the version of R it ran under, which may explain the difference. In the second, the script
    printed its two correlation coefficients but could not save the plot it was meant to make. In the
    third, the numbers printed, and the plots, which were meant to pop up on a screen, did not appear.

    Three packages are too few to give a rate. What they show is the gap between the two words. "Ran
    without an error" is a fact about the code. "Reproduced" is a fact about the result, and it needs
    someone to compare the output with the paper.

    Now place your own thesis on Peng's spectrum. Where it sits depends, in his words, on "what data
    and code are made available". At the far end, someone collects new data in another district and
    asks the same question: that is replication, and no amount of tidy code gives it to you.

    A project folder that reruns from raw data with one command makes both your data and your code
    available. That is the build this book asks for.
  analogy_breaks_when: |
    The three packages were picked at random from 127, and three is a handful. The study reports what
    it found in them; it does not give a share of shared code that reproduces its paper.

    The spectrum is Peng's description, not a scale with measured steps. Where a given study sits on
    it is a judgement about what was shared, not a number.
