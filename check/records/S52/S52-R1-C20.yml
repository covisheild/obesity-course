- point: |
    One study took 9078 R files shared with published papers on the Harvard Dataverse, deposited from
    2010 to July 2020. Its authors report that {{n:trisovic_fail_initial_pct}} failed to run without
    an error on first execution. Quote it with that source, sample and date, never as "most research
    code is broken".
