simplified_explanation: |
  A raw file is the data as it first reached you.

  The commonest raw file is a CSV. The first line holds the column names.

  So `read_csv()` has to guess. Then it prints what it decided. Read that report every time. A column you
  expected to be numbers that comes out as text means some cell in it is not a number.

  Two habits keep the guess honest:

  - **Name the missing-value codes.** If the file uses -99, or "NR", for "not recorded", say so
    in `na = c("", "NA", "-99", "NR")`. Otherwise -99 is read as a real number.
  - **Say what you expect.** `col_types` tells `read_csv()` which type each column should have.

  Reading never changes the file.
illustrations:
- body: |
    Start with a failure. A school camp team sends you a file. Where a child could not be
    measured, they typed -99. The values below are made up. Here is the file's text, held in R as
    one piece of text so you can see every character:

    ```r
    library(readr)
    camp_text <- "child_id,height_cm,weight_kg
    S01,128,26.0
    S02,-99,24.5
    S03,131,-99"
    writeLines(camp_text)
    ```

    ```output
    child_id,height_cm,weight_kg
    S01,128,26.0
    S02,-99,24.5
    S03,131,-99
    ```

    That is the whole of a CSV file: a header line, then one line per child. Read it with
    `read_csv()`. Wrapping the text in `I()` tells `read_csv()` that this is the data itself,
    not the name of a file:

    ```r
    camp <- read_csv(I(camp_text))
    camp
    ```

    ```output
    Rows: 3 Columns: 3
    ── Column specification ────────────────────────────────────────────────
    Delimiter: ","
    chr (1): child_id
    dbl (2): height_cm, weight_kg

    ℹ Use `spec()` to retrieve the full column specification for this data.
    ℹ Specify the column types or set `show_col_types = FALSE` to quiet this message.
    # A tibble: 3 × 3
      child_id height_cm weight_kg
      <chr>        <dbl>     <dbl>
    1 S01            128      26
    2 S02            -99      24.5
    3 S03            131     -99
    ```

    The report says `height_cm` and `weight_kg` were read as `dbl`, numbers. That is true, and it
    is the trap. -99 is a number, so readr had no reason to object. Ask for the shortest child:

    ```r
    min(camp$height_cm)
    ```

    ```output
    [1] -99
    ```

    A height of -99 cm. Every summary of this column is now wrong, and nothing warned you. Tell
    `read_csv()` the code. The vector given to `na` replaces the default, so keep the empty string
    and `"NA"` in it as well:

    ```r
    camp <- read_csv(I(camp_text), na = c("", "NA", "-99"), show_col_types = FALSE)
    camp
    min(camp$height_cm, na.rm = TRUE)
    ```

    ```output
    # A tibble: 3 × 3
      child_id height_cm weight_kg
      <chr>        <dbl>     <dbl>
    1 S01            128      26
    2 S02             NA      24.5
    3 S03            131      NA
    [1] 128
    ```

    The -99s are `NA` now, and the shortest measured child is 128 cm.

    Now a second file from the same camp, where one entry says "not measured" in words:

    ```r
    camp_text_2 <- "child_id,height_cm,weight_kg
    S01,128,26.0
    S02,not measured,24.5
    S03,131,27.5"
    camp_2 <- read_csv(I(camp_text_2))
    ```

    ```output
    Rows: 3 Columns: 3
    ── Column specification ────────────────────────────────────────────────
    Delimiter: ","
    chr (2): child_id, height_cm
    dbl (1): weight_kg

    ℹ Use `spec()` to retrieve the full column specification for this data.
    ℹ Specify the column types or set `show_col_types = FALSE` to quiet this message.
    ```

    The report says `height_cm` is `chr`, text. One word in one cell turned the whole column into
    text, and `mean()` of it would fail. Say what you expect instead, with `col_types`. The
    function `cols()` takes one entry per column; `col_character()` means text and `col_double()`
    means numbers:

    ```r
    camp_2 <- read_csv(
      I(camp_text_2),
      col_types = cols(
        child_id = col_character(),
        height_cm = col_double(),
        weight_kg = col_double()
      )
    )
    camp_2
    ```

    ```output
    Warning message:
    One or more parsing issues, call `problems()` on your data frame for
    details, e.g.:
      dat <- vroom(...)
      problems(dat)
    # A tibble: 3 × 3
      child_id height_cm weight_kg
      <chr>        <dbl>     <dbl>
    1 S01            128      26
    2 S02             NA      24.5
    3 S03            131      27.5
    ```

    Now readr warns, keeps `height_cm` as numbers, and puts `NA` where the words were. Ask which
    values did not fit. The last column of `problems()` names a temporary file that changes from
    run to run, so keep the first four:

    ```r
    problems(camp_2)[c("row", "col", "expected", "actual")]
    ```

    ```output
    # A tibble: 1 × 4
        row   col expected actual
      <int> <int> <chr>    <chr>
    1     3     2 a double not measured
    ```

    Row 3 of the file, counting the header line as row 1, column 2: readr expected a number and
    found "not measured". You now know the value, and the raw file still says exactly what the camp
    team typed.
  analogy_breaks_when: |
    The camp files are made up and three rows long. In a real file of thousands of rows, a code
    such as -99 does not stand out by eye, which is the reason to declare it when you read.

    Declaring `na` works only for codes you know about. A file may use 999 for one column and 0
    for another, and 0 can be a real value. The codes come from the file's own documentation, not
    from guessing; where there is none, ask the person who made the file.
- body: |
    Now the real file. Read the penguin data and let `read_csv()` print its report:

    ```r
    library(readr)
    library(here)
    penguins_raw <- read_csv(here("data-raw", "penguins_raw.csv"))
    ```

    ```output
    here() starts at ~/project
    Rows: 344 Columns: 17
    ── Column specification ────────────────────────────────────────────────
    Delimiter: ","
    chr  (9): studyName, Species, Region, Island, Stage, Individual ID, ...
    dbl  (7): Sample Number, Culmen Length (mm), Culmen Depth (mm), Flip...
    date (1): Date Egg

    ℹ Use `spec()` to retrieve the full column specification for this data.
    ℹ Specify the column types or set `show_col_types = FALSE` to quiet this message.
    ```

    Read the report line by line. `Rows: 344 Columns: 17` gives the size. `Delimiter: ","` says
    the values were separated by commas. Then the guesses: nine columns as `chr`, text; seven as
    `dbl`, numbers; one as `date`. The list after each type is cut short to fit the line. `Date
    Egg` became a date because its values are written year-month-day, such as 2007-11-11, which
    readr recognises.

    Check each guess against what you know. Body mass should be a number, and it is in the `dbl`
    line. To make that expectation part of the script, name the column in `col_types`. Columns
    you do not name are still guessed:

    ```r
    penguins_raw <- read_csv(
      here("data-raw", "penguins_raw.csv"),
      col_types = cols(`Body Mass (g)` = col_double())
    )
    ```

    It reads quietly. When `col_types` is given, readr stops printing the report. If a later copy
    of this file ever arrives with "3750 g" typed in that column, this line warns, and the
    `problems()` list names the row.

    Last, prove that reading did not touch the file. `tools::md5sum()` computes an MD5 checksum,
    a 32-character code calculated from every byte of a file. Change one character in the file and
    the code changes. Take it, read the file again, and take it again:

    ```r
    before <- tools::md5sum(here("data-raw", "penguins_raw.csv"))
    penguins_raw <- read_csv(here("data-raw", "penguins_raw.csv"), show_col_types = FALSE)
    after <- tools::md5sum(here("data-raw", "penguins_raw.csv"))
    unname(before)
    unname(before == after)
    ```

    ```output
    [1] "049da101568e078f9845c8b366481810"
    [1] TRUE
    ```

    Same code before and after. Write the checksum into the project's README the day a raw file
    arrives. Then anyone can check, later, that the file the analysis reads is the file that
    arrived.
  analogy_breaks_when: |
    The checksum shows that the bytes of the file are unchanged since you computed it. It says
    nothing about whether the data were right when they arrived.

    The type report comes from a sample of rows. In a large file, a stray word far down a column
    may be missed by the guess. Stating `col_types` for the columns that matter closes that gap.
- body: |
    Not every raw file is a CSV. Here are the three other kinds this book's reader meets most.

    **Excel.** The readxl package comes with a small example workbook that is laid out the way
    people lay out sheets for printing, with notes above and below the table. Read it without
    instructions and the notes become rows:

    ```r
    library(readxl)
    read_excel(readxl_example("deaths.xlsx"))
    ```

    ```output
    New names:
    • `` -> `...2`
    • `` -> `...3`
    • `` -> `...4`
    • `` -> `...5`
    • `` -> `...6`
    # A tibble: 18 × 6
       `Lots of people`             ...2             ...3  ...4  ...5  ...6
       <chr>                        <chr>            <chr> <chr> <chr> <chr>
     1 simply cannot resist writing <NA>             <NA>  <NA>  <NA>  some…
     2 at                           the              top   <NA>  of    thei…
     3 or                           merging          <NA>  <NA>  <NA>  cells
     4 Name                         Profession       Age   Has … Date… Date…
     5 David Bowie                  musician         69    TRUE  17175 42379
     6 Carrie Fisher                actor            60    TRUE  20749 42731
     7 Chuck Berry                  musician         90    TRUE  9788  42812
     8 Bill Paxton                  actor            61    TRUE  20226 42791
     9 Prince                       musician         57    TRUE  21343 42481
    10 Alan Rickman                 actor            69    FALSE 16854 42383
    11 Florence Henderson           actor            82    TRUE  12464 42698
    12 Harper Lee                   author           89    FALSE 9615  42419
    13 Zsa Zsa Gábor                actor            99    TRUE  6247  42722
    14 George Michael               musician         53    FALSE 23187 42729
    15 Some                         <NA>             <NA>  <NA>  <NA>  <NA>
    16 <NA>                         also like to wr… <NA>  <NA>  <NA>  <NA>
    17 <NA>                         <NA>             at t… bott… <NA>  <NA>
    18 <NA>                         <NA>             <NA>  <NA>  <NA>  too!
    ```

    The first sheet was read. The notes became the first rows, the real header row became a row of
    data, and every column became text. Give the sheet and the cells that hold the table:

    ```r
    read_excel(readxl_example("deaths.xlsx"), sheet = "other", range = "A5:F15")
    ```

    ```output
    # A tibble: 10 × 6
       Name           Profession   Age `Has kids` `Date of birth`
       <chr>          <chr>      <dbl> <lgl>      <dttm>
     1 Vera Rubin     scientist     88 TRUE       1928-07-23 00:00:00
     2 Mohamed Ali    athlete       74 TRUE       1942-01-17 00:00:00
     3 Morley Safer   journalist    84 TRUE       1931-11-08 00:00:00
     4 Fidel Castro   politician    90 TRUE       1926-08-13 00:00:00
     5 Antonin Scalia lawyer        79 TRUE       1936-03-11 00:00:00
     6 Jo Cox         politician    41 TRUE       1974-06-22 00:00:00
     7 Janet Reno     lawyer        78 FALSE      1938-07-21 00:00:00
     8 Gwen Ifill     journalist    61 FALSE      1955-09-29 00:00:00
     9 John Glenn     astronaut     95 TRUE       1921-07-28 00:00:00
    10 Pat Summit     coach         64 TRUE       1952-06-14 00:00:00
    # ℹ 1 more variable: `Date of death` <dttm>
    ```

    Now there is one header row and ten rows of data. Ages are numbers, and the two date columns
    are dates, printed with a time of midnight that readxl attaches.
    If you want to look at an Excel file before reading it, open a copy and leave the original
    alone.

    **SPSS.** The haven package comes with an SPSS copy of a classic dataset of iris flowers:

    ```r
    library(haven)
    iris_spss <- read_sav(system.file("examples", "iris.sav", package = "haven"))
    iris_spss
    ```

    ```output
    # A tibble: 150 × 5
       Sepal.Length Sepal.Width Petal.Length Petal.Width Species
              <dbl>       <dbl>        <dbl>       <dbl> <dbl+lbl>
     1          5.1         3.5          1.4         0.2 1 [setosa]
     2          4.9         3            1.4         0.2 1 [setosa]
     3          4.7         3.2          1.3         0.2 1 [setosa]
     4          4.6         3.1          1.5         0.2 1 [setosa]
     5          5           3.6          1.4         0.2 1 [setosa]
     6          5.4         3.9          1.7         0.4 1 [setosa]
     7          4.6         3.4          1.4         0.3 1 [setosa]
     8          5           3.4          1.5         0.2 1 [setosa]
     9          4.4         2.9          1.4         0.2 1 [setosa]
    10          4.9         3.1          1.5         0.1 1 [setosa]
    # ℹ 140 more rows
    ```

    Look at `Species`. Its type is `dbl+lbl`, a number with a label: SPSS stored the number 1 and
    the label `setosa`, and haven keeps both. Missing-value codes declared inside an SPSS file
    become `NA` when it is read, unless you ask otherwise.

    **SAS transport.** NHANES, the National Health and Nutrition Examination Survey of the United
    States, publishes its files as `.xpt`. This book's project holds the body measures file of
    the 2021–2023 cycle. Read it with `read_xpt()`:

    ```r
    bmx <- read_xpt(here("data-raw", "BMX_L.xpt"))
    dim(bmx)
    attr(bmx$BMXWT, "label")
    ```

    ```output
    [1] 8860   22
    [1] "Weight (kg)"
    ```

    The file has {{n:bmx_rows}} rows, one per person examined, and {{n:bmx_cols}} columns. The
    column names are codes, and the label carries their meaning: `BMXWT` is weight in kg. The
    label came with the file; nobody typed it. Look at the labels of four columns, and count the
    missing values in each. `sapply()` asks each column in turn for its label, and `colSums()`
    adds up the missing values column by column:

    ```r
    body <- bmx[c("BMXWT", "BMXHT", "BMXBMI", "BMXWAIST")]
    sapply(body, attr, "label")
    colSums(is.na(body))
    ```

    ```output
                          BMXWT                       BMXHT
                  "Weight (kg)"      "Standing Height (cm)"
                         BMXBMI                    BMXWAIST
    "Body Mass Index (kg/m**2)"  "Waist Circumference (cm)"
       BMXWT    BMXHT   BMXBMI BMXWAIST
         106      361      389      670
    ```

    ```table
    | Column | What it holds | Missing values |
    | BMXWT | weight (kg) | 106 |
    | BMXHT | standing height (cm) | 361 |
    | BMXBMI | body mass index (kg/m^2) | 389 |
    | BMXWAIST | waist circumference (cm) | 670 |
    ```

    BMI is missing more often than weight or height. The documentation says BMI was calculated from
    weight and height, so it is missing whenever either one is. Check that, with `|` meaning "or":

    ```r
    sum(is.na(bmx$BMXWT) | is.na(bmx$BMXHT))
    ```

    ```output
    [1] 389
    ```

    Exactly 389 rows lack a weight or a height, the same as the rows that lack a BMI. The four
    counts also match the code tables printed in the survey's own codebook. These are
    counts of rows in the file. They are not survey estimates: the survey's documentation says its
    sample weights should be used to analyse these data, and no count or average in this book uses
    them.
  analogy_breaks_when: |
    The Excel and SPSS files are examples that come inside the readxl and haven packages. Their
    contents are not health data; they are there to show the reading.

    The NHANES counts describe the people examined in one American survey cycle, at all ages,
    infants included. They say nothing about how many people in India, or in the United States,
    lack a measurement.
  numbers:
  - value: "106"
    unit: rows with the value missing
    citekey: nchs_nhanes_2021_2023_bmx_demo
