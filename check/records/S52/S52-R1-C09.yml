- level: 5
  prompt: |
    Read the penguin file with its column report showing. How many columns were read as text, as
    numbers and as dates? Which numeric columns would you expect, from their names?
  answer: |
    ```r
    library(readr)
    library(here)
    penguins_raw <- read_csv(here("data-raw", "penguins_raw.csv"))
    ```

    ```output
    here() starts at ~/project
    Rows: 344 Columns: 17
    ── Column specification ────────────────────────────────────────────────
    Delimiter: ","
    chr  (9): studyName, Species, Region, Island, Stage, Individual ID, ...
    dbl  (7): Sample Number, Culmen Length (mm), Culmen Depth (mm), Flip...
    date (1): Date Egg

    ℹ Use `spec()` to retrieve the full column specification for this data.
    ℹ Specify the column types or set `show_col_types = FALSE` to quiet this message.
    ```

    Nine as text (`chr`), seven as numbers (`dbl`), one as a date. The seven numeric columns
    include the four measurements whose names carry a unit, `(mm)` or `(g)`, and the two isotope
    ratios. The seventh is `Sample Number`, a running number, which is stored as a number but is
    not a measurement.
- level: 6
  prompt: |
    Read the NHANES demographics file, `DEMO_L.xpt`, from the project's `data-raw` folder. Give its
    number of rows and columns, and the label of the column `RIDAGEYR`.
  answer: |
    ```r
    library(haven)
    library(here)
    demo <- read_xpt(here("data-raw", "DEMO_L.xpt"))
    dim(demo)
    attr(demo$RIDAGEYR, "label")
    ```

    ```output
    here() starts at ~/project
    [1] 11933    27
    [1] "Age in years at screening"
    ```

    {{n:demo_rows}} rows and 27 columns. `RIDAGEYR` is age in years at screening. The demographics file has
    more rows than the body measures file, because not everyone screened was examined.
  refs:
  - nchs_nhanes_2021_2023_bmx_demo
- level: 7
  prompt: |
    A resident wants all the measurements read as numbers. She writes this, gets a warning, and
    notes "child IDs missing in the file". Run it. Find what broke and why her note looks
    reasonable. The data are made up.

    ```r
    library(readr)
    camp <- read_csv(I("child_id,height_cm,weight_kg
    S01,128,26.0
    S02,133,24.5
    S03,131,27.5"), col_types = cols(.default = col_double()))
    camp
    ```

    ```output
    Warning message:
    One or more parsing issues, call `problems()` on your data frame for
    details, e.g.:
      dat <- vroom(...)
      problems(dat)
    # A tibble: 3 × 3
      child_id height_cm weight_kg
         <dbl>     <dbl>     <dbl>
    1       NA       128      26
    2       NA       133      24.5
    3       NA       131      27.5
    ```
  answer: |
    The `col_types` line broke. `.default = col_double()` says every column is numbers, including
    `child_id`. "S01" is not a number, so every ID became `NA`. The IDs are in the file. The code
    threw them away.

    Her note looks reasonable because the result shows `NA` in the ID column, and `NA` reads as
    "missing". The warning said what happened: values did not fit the type she asked for.

    Name the ID column as text and let the rest default to numbers:

    ```r
    camp <- read_csv(I("child_id,height_cm,weight_kg
    S01,128,26.0
    S02,133,24.5
    S03,131,27.5"), col_types = cols(child_id = col_character(), .default = col_double()))
    camp
    ```

    ```output
    # A tibble: 3 × 3
      child_id height_cm weight_kg
      <chr>        <dbl>     <dbl>
    1 S01            128      26
    2 S02            133      24.5
    3 S03            131      27.5
    ```
- level: 8
  prompt: |
    The penguin file has no -99 codes, but a resident adds `na = "-99"` to be safe. Then she counts
    the penguins of unknown sex and finds none. Run her code. Find what broke, and why the answer
    looked believable.

    ```r
    library(readr)
    library(here)
    penguins_raw <- read_csv(here("data-raw", "penguins_raw.csv"), na = "-99")
    sum(is.na(penguins_raw$Sex))
    ```

    ```output
    here() starts at ~/project
    Rows: 344 Columns: 17
    ── Column specification ────────────────────────────────────────────────
    Delimiter: ","
    chr  (15): studyName, Species, Region, Island, Stage, Individual ID,...
    dbl   (1): Sample Number
    date  (1): Date Egg

    ℹ Use `spec()` to retrieve the full column specification for this data.
    ℹ Specify the column types or set `show_col_types = FALSE` to quiet this message.
    [1] 0
    ```
  answer: |
    The `na = "-99"` argument broke it. It replaced the default list, so the text "NA" in the file
    is no longer read as missing. The 11 penguins of unknown sex now have the text "NA" as their
    sex, which is not `NA`, so the count is 0. The report gives it away: 15 columns are now `chr`,
    because "NA" in a number column is a word, not a number.

    The answer looked believable because 0 is a possible count, and nothing stopped. Keep the
    defaults in the list:

    ```r
    penguins_raw <- read_csv(here("data-raw", "penguins_raw.csv"), na = c("", "NA", "-99"),
                             show_col_types = FALSE)
    sum(is.na(penguins_raw$Sex))
    ```

    ```output
    [1] 11
    ```

    Eleven penguins have no sex recorded.
  refs:
  - horst_2020_palmerpenguins
- level: 9
  prompt: |
    A slide at a journal club says: "NHANES 2021–2023 measured {{n:bmx_rows}} people; their mean weight was
    70.5 kg." Check the two numbers against the body measures file, and say what the slide's
    sentence does not establish.
  answer: |
    ```r
    library(haven)
    library(here)
    bmx <- read_xpt(here("data-raw", "BMX_L.xpt"))
    nrow(bmx)
    sum(!is.na(bmx$BMXWT))
    mean(bmx$BMXWT, na.rm = TRUE)
    min(bmx$BMXWT, na.rm = TRUE)
    ```

    ```output
    here() starts at ~/project
    [1] 8860
    [1] 8754
    [1] 70.54904
    [1] 2.7
    ```

    The file has {{n:bmx_rows}} rows. Only 8754 of them have a weight, so the mean is over 8754 people, not
    {{n:bmx_rows}}:

    ```working
    8860 − 106 = 8754
    ```

    The mean of those weights is 70.54904 kg, which rounds to 70.5 kg. So both numbers can be
    reproduced from the file. The smallest weight is 2.7 kg, an infant: the file covers all ages.

    What the sentence does not establish:

    - The average weight of Americans. This mean is unweighted. The survey's documentation says its
      sample weights should be used, and they were not.
    - The average weight of adults. Children and infants are in the 8754.
    - Anything about India. It is one survey of the United States.
  refs:
  - nchs_nhanes_2021_2023_bmx_demo
- level: 10
  prompt: |
    A colleague says: "I only opened the CSV in Excel to look at it and saved it. Nothing changed;
    it is still the original." The project's README recorded the file's MD5 checksum on the day it
    arrived: `049da101568e078f9845c8b366481810`. Decide what to compute, and compute it for the
    project's copy. Then show what a single hand edit does to the checksum, using a copy in
    `output/`. Say what the check does not establish.
  answer: |
    Compute the checksum of the file the analysis reads, and compare it with the one in the
    README:

    ```r
    library(readr)
    library(here)
    raw_path <- here("data-raw", "penguins_raw.csv")
    unname(tools::md5sum(raw_path)) == "049da101568e078f9845c8b366481810"
    ```

    ```output
    here() starts at ~/project
    [1] TRUE
    ```

    TRUE: this copy is byte for byte the file that arrived. Now see what a single change does.
    Make a copy in `output/` and change one character on one line, the way a hand edit would:

    ```r
    lines <- readLines(raw_path)
    lines[2] <- sub("3750", "3760", lines[2])
    dir.create(here("output"), showWarnings = FALSE)
    writeLines(lines, here("output", "penguins_edited.csv"))
    unname(tools::md5sum(here("output", "penguins_edited.csv")))
    ```

    ```output
    [1] "ca70412ca7d8c1908ef8530279c1111f"
    ```

    One digit changed, and the checksum is completely different. If your colleague's saved file
    gives the README's checksum, nothing changed. If it gives anything else, something did, even if
    the cells look the same on screen.

    What the check does not establish:

    - What changed, or whether it matters. A different checksum says the bytes differ. It does not
      say which value, or whether a spreadsheet only changed how a date was written.
    - That the original was correct. The checksum only ties today's file to the day it arrived.
    - Which file the analysis used, if the script reads some other copy. Check the path in the
      script as well.
retrieval_items:
- q: What is inside a CSV file?
  a: Plain text. One line per row, values separated by commas, and a header line with the column names. Nothing says what type each column is.
- q: What are `read_csv()`'s default missing values, and what happens when you give `na` yourself?
  a: The empty string and the text "NA". Giving `na` replaces that list, so include `""` and `"NA"` along with your own codes.
- q: What does `col_types` do, and where do you find the values that did not fit?
  a: It states the type each column should have. A value that does not fit becomes `NA`, readr warns, and `problems()` lists each one with its row and column.
- q: Which functions read Excel, SPSS and SAS transport files, and from which packages?
  a: '`read_excel()` from readxl; `read_sav()` and `read_xpt()` from haven.'
