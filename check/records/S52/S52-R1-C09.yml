    Child A2's age is `NA`. The report still says `age_years` is `dbl`.
- level: 3
  prompt: |
    Read this made-up text with `col_types` given as a short string, one letter per column: `c`
    for text and `d` for numbers. Print the result.

    ```r norun
    "ward,beds,occupied
    A,30,27
    B,24,24"
    ```
  answer: |
    ```r
    library(readr)
    read_csv(I("ward,beds,occupied
    A,30,27
    B,24,24"), col_types = "cdd")
    ```

    ```output
    # A tibble: 2 × 3
      ward   beds occupied
      <chr> <dbl>    <dbl>
    1 A        30       27
    2 B        24       24
    ```

    The string `"cdd"` says: first column text, second and third numbers. No report is printed,
    because the types were given.
- level: 4
  prompt: |
    Read the Excel example workbook that comes with readxl, `readxl_example("deaths.xlsx")`, taking
    only the cells `A5:C8` of the sheet called `arts`. How many rows and columns do you get?
  answer: |
    ```r
    library(readxl)
    read_excel(readxl_example("deaths.xlsx"), range = "arts!A5:C8")
    ```

