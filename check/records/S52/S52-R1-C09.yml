must_know:
- point: |
    The error is to think that a file which reads without an error has been read correctly. -99
    read as a height raises no warning. Read the column report, and declare every missing-value
    code from the file's documentation in `na` before you compute anything.
  kind: misconception
  bearing: methodological
- point: |
    Giving `na` replaces the default list. Write `na = c("", "NA", "-99")`, not `na = "-99"`;
    the second form stops reading empty cells and the text "NA" as missing.
  kind: trap
  bearing: methodological
- point: |
    A number column that the report calls `chr` holds at least one value that is not a number.
    Never open the raw file and retype the cell.
  kind: move
  bearing: methodological
- point: |
    Record the MD5 checksum of every raw file in the README on the day it arrives.
  kind: move
  bearing: methodological
- point: |
    Open an Excel file you were sent only as a copy. Read the original into R with
    `read_excel()`, giving the sheet and range.
  kind: trap
  bearing: methodological
- point: |
    When a department hands over an SPSS file, read it with `read_sav()` rather than asking for an
    Excel export.
  kind: move
  bearing: policy
- point: |
    Any average you compute from an NHANES file without its sample weights describes the people in
    the file only.
  kind: boundary
  bearing: public
- point: |
    Reading carefully catches codes and types. It cannot catch a wrong value that is a valid
    number: a height of 182 cm typed for 128 cm reads perfectly.
  kind: boundary
  bearing: methodological
exercises:
- type: retrieval
  prompt: |
    Without looking back, write the argument that makes `read_csv()` treat -99 as missing without
    losing its default missing values. Then name the function that lists the values that did not
    fit the types given in `col_types`.
  answer: |
    `na = c("", "NA", "-99")`. Giving `na` replaces the default list, which is the empty string and
    the text "NA", so both go back in beside -99.

    `problems()`, called on the data frame that `read_csv()` returned. It gives the row, the
    column, the type expected and the value found.
- type: design
  prompt: |
    A district team sends you `screening_2026.csv`, exported from their form. Its documentation
    says four things:

    - height and weight are in cm and kg;
    - 999 means "not measured";
    - "NR" means "not recorded";
    - `village_code` is a code with leading zeros, such as 0042.

    Write the reading line, with every
    argument you need, and say what each argument protects you from.
  answer: |
    ```r norun
    library(readr)
    library(here)
    screening <- read_csv(
      here("data-raw", "screening_2026.csv"),
      na = c("", "NA", "999", "NR"),
      col_types = cols(
        village_code = col_character(),
        height_cm = col_double(),
        weight_kg = col_double()
      )
    )
    problems(screening)
    ```

    - `here("data-raw", ...)`: the address works on any computer that has the project.
    - `na`: 999 and "NR" become `NA`, so 999 cm never enters a summary. The empty string and
      "NA" stay in the list, because giving `na` replaces the default.
    - `village_code = col_character()`: read as a number, 0042 would become 42. Read as text, it
      stays 0042, as the documentation writes it.
    - `height_cm` and `weight_kg` as `col_double()`: any word typed in those columns is reported
      by `problems()` instead of turning the column into text.

    Columns not named in `cols()` are still guessed. The block is shown, not run, because the file
    is made up.
  skill_ref: S52-R1-K01
- type: interpretation
  prompt: |
    You read a made-up clinic file and `read_csv()` prints this report:

    `Rows: 1250 Columns: 6`, then `chr (3): patient_id, sex, weight_kg` and `dbl (3): age_years,
    height_cm, visit_no`.

    What does the report tell you, what does it not tell you, and what do you do next?
  answer: |
    It tells you the file has 1250 rows and 6 columns, and that `weight_kg` was read as text.
    Weight should be a number. So at least one cell in that column is not a number. It may hold a
    unit ("62 kg"), a word ("absent"), or a comma used as a decimal mark.

    It does not tell you which cells, how many, or whether the other numbers are right. It does
    not tell you whether 1250 rows means 1250 patients.

    Next, read again with `col_types = cols(weight_kg = col_double())`. Run `problems()` to list
    the cells that are not numbers, and decide in code what each means. If they are a missing-value
    code, add it to `na`.
quantitative: true
practice:
- level: 1
  prompt: |
    Read this made-up CSV text with `read_csv()` and print the result. Wrap the text in `I()`.

    ```r norun
    "district,children,with_obesity
    Raipur,410,23
    Durg,385,19"
    ```
  answer: |
    ```r
    library(readr)
    read_csv(I("district,children,with_obesity
    Raipur,410,23
    Durg,385,19"))
    ```

    ```output
    Rows: 2 Columns: 3
    ── Column specification ────────────────────────────────────────────────
    Delimiter: ","
    chr (1): district
    dbl (2): children, with_obesity

    ℹ Use `spec()` to retrieve the full column specification for this data.
    ℹ Specify the column types or set `show_col_types = FALSE` to quiet this message.
    # A tibble: 2 × 3
      district children with_obesity
      <chr>       <dbl>        <dbl>
    1 Raipur        410           23
    2 Durg          385           19
    ```

    Two rows and three columns. `district` is text; the two counts are numbers.
- level: 2
  prompt: |
    In this made-up text, -1 means "not recorded". Read it so that -1 becomes `NA`, keeping the
    default missing values too, and print it.

    ```r norun
    "child_id,age_years
    A1,7
    A2,-1
    A3,9"
    ```
  answer: |
    ```r
    library(readr)
    read_csv(I("child_id,age_years
    A1,7
    A2,-1
    A3,9"), na = c("", "NA", "-1"))
    ```

    ```output
    Rows: 3 Columns: 2
    ── Column specification ────────────────────────────────────────────────
    Delimiter: ","
    chr (1): child_id
    dbl (1): age_years

    ℹ Use `spec()` to retrieve the full column specification for this data.
    ℹ Specify the column types or set `show_col_types = FALSE` to quiet this message.
    # A tibble: 3 × 2
      child_id age_years
      <chr>        <dbl>
    1 A1               7
    2 A2              NA
    3 A3               9
