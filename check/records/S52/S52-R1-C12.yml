- level: 5
  prompt: |
    Read the penguin file.

    ```r
    library(readr)
    library(dplyr)

    penguins_raw <- read_csv(
      here::here("data-raw", "penguins_raw.csv"),
      show_col_types = FALSE
    )
    ```

    ```output

    Attaching package: ‘dplyr’

    The following objects are masked from ‘package:stats’:

        filter, lag

    The following objects are masked from ‘package:base’:

        intersect, setdiff, setequal, union
    ```

    Work out body mass in kilograms. Then put each penguin in one of three groups. The groups are
    "under 3.5 kg", "3.5 to under 4.5 kg" and "4.5 kg or more", cut-points chosen for practice.
    Count the penguins in each group.
  answer: |
    ```r
    penguins_raw |>
      mutate(
        body_mass_kg = `Body Mass (g)` / 1000,
        mass_group = case_when(
          body_mass_kg < 3.5 ~ "under 3.5 kg",
          body_mass_kg < 4.5 ~ "3.5 to under 4.5 kg",
          body_mass_kg >= 4.5 ~ "4.5 kg or more"
        )
      ) |>
      count(mass_group)
    ```

    ```output
    # A tibble: 4 × 2
      mass_group              n
      <chr>               <int>
    1 3.5 to under 4.5 kg   153
    2 4.5 kg or more        118
    3 under 3.5 kg           71
    4 <NA>                    2
    ```

    153 penguins from 3.5 to under 4.5 kg, 118 at 4.5 kg or more, 71 under 3.5 kg, and 2 with no
    body mass. The four counts add to 344, every row. `count()` sorts the labels alphabetically,
    which is why "3.5 to under 4.5 kg" comes first.
- level: 6
  prompt: |
    A made-up register typed sex by hand:

    ```r
    library(dplyr)
    library(stringr)

    register <- tibble(sex = c("Male", " female", "MALE ", "Female", "male"))
    ```

    ```output

    Attaching package: ‘dplyr’

    The following objects are masked from ‘package:stats’:

        filter, lag

    The following objects are masked from ‘package:base’:

        intersect, setdiff, setequal, union
