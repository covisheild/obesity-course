simplified_explanation: |
  The last section chose rows and columns that were already in the file. This one makes columns
  that were not there. A body mass index comes from weight and height. A body mass in kilograms
  comes from one in grams. A group label comes from a cut-point.

  **mutate()** adds a column. You give the new column a name and a rule, and R applies the rule to
  every row. The number of rows does not change. Book 0's rule for BMI, weight in kilograms divided
  by height in metres squared, becomes one line of code.

  Give the new column a new name. If you reuse an old name, the old column is replaced, and its
  values are gone from your data frame. The raw file still has them, but your script no longer
  shows where the new numbers came from.

  **if_else()** sorts rows into two groups by one test. **case_when()** sorts them into several
  groups. Its tests are checked in order, and each row takes the label of the first test it passes.
  So the order of
  the tests is part of the rule, and so is which side of each cut-point the boundary value falls on.
  A row with a missing value passes no test and gets `NA`, which is what you want. Be careful with
  `.default`, the label for "everything else": a missing value lands there too.

  **round()** is for showing a number, not for storing it. Keep full precision in the column you
  compute with, and round only what you print.

  Text columns get cleaned the same way. **str_trim()** takes spaces off the ends.
  **str_to_lower()** turns capitals into small letters. Together they turn "Male ", "male" and
  "MALE" into "male".

  All of it happens in the script. The raw file is never edited: not to convert a unit, not to fix
  a spelling, not to add a column.
illustrations:
- body: |
    Start with BMI, on a made-up clinic register of five adults. Heights are in centimetres, as a
    clinic writes them; weights are in kilograms. Patient 104 has no weight recorded.

    ```r
    library(dplyr)

    clinic <- tibble(
      id = c(101, 102, 103, 104, 105),
      height_cm = c(152, 160, 171, 158, 165),
      weight_kg = c(41, 64, 80.2, NA, 58)
    )
    ```

    ```output

    Attaching package: ‘dplyr’

    The following objects are masked from ‘package:stats’:

        filter, lag

    The following objects are masked from ‘package:base’:

        intersect, setdiff, setequal, union
    ```

    Write Book 0's rule straight in, with the height as it is:

    ```r
    clinic |>
      mutate(bmi = weight_kg / height_cm^2)
    ```

    ```output
    # A tibble: 5 × 4
         id height_cm weight_kg      bmi
      <dbl>     <dbl>     <dbl>    <dbl>
    1   101       152      41    0.00177
    2   102       160      64    0.0025
    3   103       171      80.2  0.00274
    4   104       158      NA   NA
    5   105       165      58    0.00213
    ```

    The code runs and every BMI is about 0.002. Nobody has a BMI of 0.002. The rule wants height in
    metres, and a height in centimetres is 100 times larger. Squared, it is 10,000 times larger, so
    every BMI came out 10,000 times too small. The order-of-magnitude check from Book 0 catches it in
    one glance.

    Convert first, in its own column, then use it. Within one `mutate()`, a column made on one line
    can be used on the next.

    ```r
    clinic <- clinic |>
      mutate(
        height_m = height_cm / 100,
        bmi = weight_kg / height_m^2
      )

    clinic
    ```

    ```output
    # A tibble: 5 × 5
         id height_cm weight_kg height_m   bmi
      <dbl>     <dbl>     <dbl>    <dbl> <dbl>
    1   101       152      41       1.52  17.7
    2   102       160      64       1.6   25
    3   103       171      80.2     1.71  27.4
    4   104       158      NA       1.58  NA
    5   105       165      58       1.65  21.3
    ```

    Now the numbers are BMIs, in kg/m^2. Patient 104 has `NA`: a missing weight gives a missing BMI,
    which is honest. The height in centimetres is still there beside the height in metres. Nothing
    was overwritten, so anyone reading the script can check the conversion row by row.
  analogy_breaks_when: |
    The five patients are made up, and their BMIs describe nobody. The code is the point, not the
    numbers.

    The conversion is right only if every height in the column is in centimetres. A register where
    some heights were written in metres would give a mix of sensible and absurd BMIs, and no line
    of code here would notice. Checking a range in code, so the script stops on a height of 1.6 cm,
    comes later in this book.
- body: |
    Now put the patients into groups. The National Family Health Survey, NFHS-5 (2019–21), uses
    two BMI cut-points in its India fact sheet. A BMI below 18.5 kg/m^2 is its "below normal"
    group. A BMI of 25.0 kg/m^2 or more is its "overweight or obese" group. Notice the boundary
    rule: 25.0 itself goes in the upper group, and 18.5 itself does not go in the lower one.

    Write the three groups with `case_when()`, labelled by their ranges. The cases are checked in
    order, so the second case only sees rows that failed the first.

    ```r
    clinic <- clinic |>
      mutate(
        bmi_group = case_when(
          bmi < 18.5 ~ "below 18.5",
          bmi < 25 ~ "18.5 to below 25",
          bmi >= 25 ~ "25 or more"
        )
      )

    clinic |>
      select(id, bmi, bmi_group)
    ```

    ```output
    # A tibble: 5 × 3
         id   bmi bmi_group
      <dbl> <dbl> <chr>
    1   101  17.7 below 18.5
    2   102  25   18.5 to below 25
    3   103  27.4 25 or more
    4   104  NA   <NA>
    5   105  21.3 18.5 to below 25
    ```

    Look at patient 102. The BMI prints as 25, and the group says "18.5 to below 25". By the
    survey's rule, 25.0 belongs in "25 or more". Something is wrong.

    Ask R whether that BMI equals 25, and then print it with more digits.

    ```r
    clinic$bmi[2] == 25

    print(clinic$bmi[2], digits = 17)
    ```

    ```output
    [1] FALSE
    [1] 24.999999999999996
    ```

    The stored number is a hair below 25. On paper, 64 ÷ 1.6^2 is exactly 25. But a computer stores
    numbers in binary, and many decimals, 1.6 among them, have no exact binary form, in the same way
    that one third has no exact decimal form. The tiny error survives the arithmetic, and
    `bmi < 25` is `TRUE`.
    The help page for `round()` warns of this: rounding applies to the number as stored, not as
    printed.

    Here is the trap. Printed digits are not stored digits, and a cut-point is exactly where a hair
    matters. The fix is a rule you choose and write down. The survey states its cut-points to one
    decimal place, so round the BMI to one decimal in a separate column, and group on that column.

    ```r
    clinic <- clinic |>
      mutate(
        bmi_1dp = round(bmi, 1),
        bmi_group = case_when(
          bmi_1dp < 18.5 ~ "below 18.5",
          bmi_1dp < 25 ~ "18.5 to below 25",
          bmi_1dp >= 25 ~ "25 or more"
        )
      )

    clinic |>
      select(id, bmi_1dp, bmi_group)
    ```

    ```output
    # A tibble: 5 × 3
         id bmi_1dp bmi_group
      <dbl>   <dbl> <chr>
    1   101    17.7 below 18.5
    2   102    25   25 or more
    3   103    27.4 25 or more
    4   104    NA   <NA>
    5   105    21.3 18.5 to below 25
    ```

    Patient 102 is now in "25 or more". Patient 104, with no BMI, has `NA` as a group: every test was
    `NA`, no case matched, and `case_when()` gives `NA` when no case matches and no `.default` is
    set. The full-precision `bmi` column is still there for any calculation.

    Reusing the name `bmi_group` replaced the first, wrong grouping. That is acceptable here,
    because `bmi_group` is a column your own script made two steps earlier, not a column from the
    file. Never reuse the name of a column that came from the raw file.

    The four patients with a BMI, as grouped:

    ```table
    | Patient | BMI to one decimal (kg/m^2) | Group |
    | 101 | 17.7 | below 18.5 |
    | 102 | 25.0 | 25 or more |
    | 103 | 27.4 | 25 or more |
    | 105 | 21.3 | 18.5 to below 25 |
    ```
  analogy_breaks_when: |
    Rounding to one decimal before grouping is a rule chosen here because the cut-points are written
    to one decimal. It is not taken from the fact sheet, which does not say how it rounds. A protocol
    has to state its own rule, and the code has to follow it.

    The labels name ranges, not conditions. Which range means what for a person's health is a
    decision made by a body, set out in the books on measurement and on obesity in adults, not in
    this one. The survey's cut-points apply to the adults it covers.
- body: |
    The same moves work on the penguin file. Its body mass is in grams; suppose your report wants
    kilograms. Its sex column is in capitals. Its species names are long. Fix all three in one
    `mutate()`, each into a new column.

    ```r
    library(readr)
    library(dplyr)
    library(stringr)

    penguins_raw <- read_csv(
      here::here("data-raw", "penguins_raw.csv"),
      show_col_types = FALSE
    )

    penguins <- penguins_raw |>
      mutate(
        body_mass_kg = `Body Mass (g)` / 1000,
        sex = str_to_lower(Sex),
        species = case_when(
          Species == "Adelie Penguin (Pygoscelis adeliae)" ~ "Adelie",
          Species == "Chinstrap penguin (Pygoscelis antarctica)" ~ "Chinstrap",
          Species == "Gentoo penguin (Pygoscelis papua)" ~ "Gentoo"
        )
      )

    penguins |>
      select(Species, species, Sex, sex, `Body Mass (g)`, body_mass_kg)
    ```

    ```output
    # A tibble: 344 × 6
       Species              species Sex   sex   `Body Mass (g)` body_mass_kg
       <chr>                <chr>   <chr> <chr>           <dbl>        <dbl>
     1 Adelie Penguin (Pyg… Adelie  MALE  male             3750         3.75
     2 Adelie Penguin (Pyg… Adelie  FEMA… fema…            3800         3.8
     3 Adelie Penguin (Pyg… Adelie  FEMA… fema…            3250         3.25
     4 Adelie Penguin (Pyg… Adelie  <NA>  <NA>               NA        NA
     5 Adelie Penguin (Pyg… Adelie  FEMA… fema…            3450         3.45
     6 Adelie Penguin (Pyg… Adelie  MALE  male             3650         3.65
     7 Adelie Penguin (Pyg… Adelie  FEMA… fema…            3625         3.62
     8 Adelie Penguin (Pyg… Adelie  MALE  male             4675         4.68
     9 Adelie Penguin (Pyg… Adelie  <NA>  <NA>             3475         3.48
    10 Adelie Penguin (Pyg… Adelie  <NA>  <NA>             4250         4.25
    # ℹ 334 more rows
    ```

    Each new column sits beside the column it came from. `sex` and `Sex` are two different columns,
    because R tells capitals from small letters.

    A `case_when()` with no `.default` gives `NA` to any row it did not match. So check that every
    row matched. Count the new column:

    ```r
    penguins |>
      count(species)
    ```

    ```output
    # A tibble: 3 × 2
      species       n
      <chr>     <int>
    1 Adelie      152
    2 Chinstrap    68
    3 Gentoo      124
    ```

    152, 68 and 124, and no `NA` row. Every species name in the file was caught by one of the three
    cases. If a fourth spelling had crept in, it would show up here as `NA`, and you would go and
    look.

    Last, the column names. `rename_with()` applies a function to every name. Give it
    `str_to_lower`:

    ```r
    penguins_raw |>
      rename_with(str_to_lower) |>
      select(species, starts_with("body"))
    ```

    ```output
    # A tibble: 344 × 2
       species                             `body mass (g)`
       <chr>                                         <dbl>
     1 Adelie Penguin (Pygoscelis adeliae)            3750
     2 Adelie Penguin (Pygoscelis adeliae)            3800
     3 Adelie Penguin (Pygoscelis adeliae)            3250
     4 Adelie Penguin (Pygoscelis adeliae)              NA
     5 Adelie Penguin (Pygoscelis adeliae)            3450
     6 Adelie Penguin (Pygoscelis adeliae)            3650
     7 Adelie Penguin (Pygoscelis adeliae)            3625
     8 Adelie Penguin (Pygoscelis adeliae)            4675
     9 Adelie Penguin (Pygoscelis adeliae)            3475
    10 Adelie Penguin (Pygoscelis adeliae)            4250
    # ℹ 334 more rows
    ```

    The names are now in lower case, but `body mass (g)` still has spaces and brackets, so it still
    needs backticks. Making a name safe in one step needs text patterns that this book does not
    teach. For a file with 17 columns, name the ones you use with `rename()` or inside `select()`,
    as the last section did.
  analogy_breaks_when: |
    Dividing by 1000 is exact only because grams and kilograms differ by a fixed factor. A column
    that mixed units, some rows in grams and some in kilograms, would need a test on each row before
    any conversion, and dividing every row by 1000 would hide the problem.

    The three species labels work because the file holds exactly three spellings. The count proves
    that for this file, and only for this file.
must_know:
- point: |
    Convert units in code, in a new column, before using them. Never type converted values into the
    raw file: the conversion is then invisible, and a second conversion by someone else doubles the
    error.
  kind: move
  bearing: methodological
- point: |
    A BMI computed from height in centimetres is 10,000 times too small. Before trusting any new
    column, look at a few of its values and ask whether they are the right size.
  kind: trap
  bearing: clinical
- point: |
    The error is to think a value that prints as 25 is 25. A stored number can sit a hair below
    or above what is printed. At a cut-point, decide a rounding rule, write it in a comment, and
    group on the rounded column.
  kind: misconception
  bearing: methodological
- point: |
    The order of the cases in `case_when()` is part of the rule. With `bmi >= 18.5` first and
    `bmi >= 25` second, nobody is ever put in "25 or more", and no error says so.
  kind: trap
  bearing: methodological
- point: |
    Leave `.default` out unless you mean it. With `.default` set, a missing value is given that
    label as if it had been measured. Without it, a missing value stays `NA`.
  kind: trap
  bearing: methodological
- point: |
    Give a new column a new name. Reusing the name of a column from the raw file replaces it, and
    the script no longer shows where the new values came from.
  kind: move
  bearing: teaching
- point: |
    Round for the table you print, not for the column you compute with. Rounding first and
    computing after carries the rounding error into every later number.
  kind: consequence
  bearing: methodological
- point: |
    A new column is only as right as the rule you wrote. `mutate()` will compute any rule on every
    row without complaint. It cannot tell you that a cut-point is the wrong one for the people in
    your data.
  kind: boundary
  bearing: clinical
exercises:
- type: critique
  prompt: |
    A colleague's thesis dataset has a weight column in kilograms. They opened the spreadsheet,
    typed a formula into a new column to compute BMI, filled it down, and saved the file. Then they
    read it into R. Say what is wrong with this, and what they should do instead.
  answer: |
    Three things went wrong, and all three are about the raw file.

    The raw file is no longer raw. A computed column now sits among the measured ones, and nothing in
    the file says which is which. Anyone reading it later may take the BMI as measured.

    The rule is hidden. Whether the formula converted height to metres, and how it rounded, lives
    inside a cell nobody will open. If a weight is corrected later, the BMI may or may not update,
    depending on whether the formula survived the save.

    There is no record of the step. Nothing shows when the column was added or by whom.

    Instead: keep the file exactly as collected, and compute BMI in the script with `mutate()`,
    converting height to metres in its own column first. The rule is then one visible line, it reruns
    whenever the data change, and the raw file stays clean.
  skill_ref: S52-R1-K02
- type: retrieval
  prompt: |
    Without looking back, name four ways a new column made with `mutate()` and `case_when()` can be
    wrong without any error message.
  answer: |
    Any four of these:

    - A unit not converted first: BMI from height in centimetres is 10,000 times too small.
    - Cases in the wrong order: an early, wide case catches rows meant for a later one.
    - A `.default` that catches missing values and labels them as if measured.
    - A value at a cut-point that prints as the cut-point but is stored a hair below or above it.
    - New values written over an old column, so the column's name and unit no longer match its
      values.
- type: calculation
  prompt: |
    Add to your penguin script a column of flipper length in centimetres. Add another that labels
    each penguin's body mass as "4.5 kg or more" or "under 4.5 kg". The cut-point is chosen for
    practice; it is not a biological threshold. Count how many penguins get each label, including
    any missing.
  answer: |
    ```r
    library(readr)
    library(dplyr)

    penguins_raw <- read_csv(
      here::here("data-raw", "penguins_raw.csv"),
      show_col_types = FALSE
    )

    penguins <- penguins_raw |>
      mutate(
        flipper_length_cm = `Flipper Length (mm)` / 10,
        body_mass_kg = `Body Mass (g)` / 1000,
        mass_group = if_else(
          body_mass_kg >= 4.5,
          "4.5 kg or more",
          "under 4.5 kg"
        )
      )

    penguins |>
      count(mass_group)
    ```

    ```output

    Attaching package: ‘dplyr’

    The following objects are masked from ‘package:stats’:

        filter, lag

    The following objects are masked from ‘package:base’:

        intersect, setdiff, setequal, union

    # A tibble: 3 × 2
      mass_group         n
      <chr>          <int>
    1 4.5 kg or more   118
    2 under 4.5 kg     224
    3 <NA>               2
    ```

    118 penguins weigh 4.5 kg or more, 224 weigh less, and 2 have no body mass, so no label. A
    millimetre is a tenth of a centimetre, so dividing by 10 converts. The function `if_else()` gives
    `NA` where the test is `NA`. So the two penguins with no body mass are not quietly counted as
    light.
  skill_ref: S52-R1-K01
quantitative: true
practice_note: |
  Thirteen problems: mutate() itself is one move, but each of its companions has a trap of its own
  (units, the order of cases, .default, the stored number at a cut-point, rounding to even,
  overwriting a column, using a column before it exists), and each needs a diagnostic problem.
practice:
- level: 1
  prompt: |
    A made-up table of three heights:

