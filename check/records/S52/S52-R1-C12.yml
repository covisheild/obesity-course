    How many different spellings are there now? Clean the column into a new one, and count the
    values of the new one.
  answer: |
    Count the spellings as typed:

    ```r
    register |>
      count(sex)
    ```

    ```output
    # A tibble: 5 × 2
      sex           n
      <chr>     <int>
    1 " female"     1
    2 "Female"      1
    3 "MALE "       1
    4 "Male"        1
    5 "male"        1
    ```

    Five rows, five different spellings: R treats " female" and "Female" as different values. Trim
    the spaces, then lower the case, in a new column:

    ```r
    register |>
      mutate(sex_clean = str_to_lower(str_trim(sex))) |>
      count(sex_clean)
    ```

    ```output
    # A tibble: 2 × 2
      sex_clean     n
      <chr>     <int>
    1 female        2
    2 male          3
    ```

    Two values: 2 female and 3 male. Read the nested call from the inside out: trim first, then
    lower. The original `sex` column is kept, so the cleaning can be checked.
- level: 7
  prompt: |
    A colleague computes BMI on a made-up register:

    ```r
    library(dplyr)

    register <- tibble(
      height_cm = c(158, 172, 149),
      weight_kg = c(62, 85, 47)
    )

    register |>
      mutate(bmi = weight_kg / height_cm^2) |>
      mutate(below_18_5 = bmi < 18.5)
    ```

    ```output

    Attaching package: ‘dplyr’

    The following objects are masked from ‘package:stats’:

        filter, lag

    The following objects are masked from ‘package:base’:

        intersect, setdiff, setequal, union

    # A tibble: 3 × 4
      height_cm weight_kg     bmi below_18_5
          <dbl>     <dbl>   <dbl> <lgl>
    1       158        62 0.00248 TRUE
    2       172        85 0.00287 TRUE
    3       149        47 0.00212 TRUE
    ```

    They report "all three patients have a BMI below 18.5 kg/m^2". Find what broke.
  answer: |
    The height is in centimetres. BMI needs metres, and a height 100 times too large, squared, makes
    the BMI 10,000 times too small. Every BMI is about 0.002, which is below 18.5, so the test says
    `TRUE` for everyone. Convert first:

    ```r
    register |>
      mutate(
        height_m = height_cm / 100,
        bmi = weight_kg / height_m^2
      )
    ```

    ```output
    # A tibble: 3 × 4
      height_cm weight_kg height_m   bmi
          <dbl>     <dbl>    <dbl> <dbl>
    1       158        62     1.58  24.8
    2       172        85     1.72  28.7
    3       149        47     1.49  21.2
    ```

    The BMIs are about 24.8, 28.7 and 21.2 kg/m^2. None is below 18.5.

    Why the wrong answer looks reasonable: the code ran without a warning, and the test that followed
    gave a tidy answer. Nobody looked at the BMI column itself, where 0.00248 would have given it away.
- level: 7
  prompt: |
    A colleague groups BMI on a made-up register:

    ```r
    library(dplyr)

    register <- tibble(bmi = c(17.2, 23.9, 26.4, 31.0))

    register |>
      mutate(
        bmi_group = case_when(
          bmi < 18.5 ~ "below 18.5",
          bmi >= 18.5 ~ "18.5 to below 25",
          bmi >= 25 ~ "25 or more"
        )
      )
    ```

    ```output

    Attaching package: ‘dplyr’

    The following objects are masked from ‘package:stats’:

        filter, lag

    The following objects are masked from ‘package:base’:

        intersect, setdiff, setequal, union

    # A tibble: 4 × 2
        bmi bmi_group
      <dbl> <chr>
    1  17.2 below 18.5
    2  23.9 18.5 to below 25
    3  26.4 18.5 to below 25
    4  31   18.5 to below 25
    ```

    They report "nobody in the register has a BMI of 25 or more". Find what broke.
  answer: |
    The cases are checked in order, and each row takes the first one it passes. A BMI of 26.4 passes
    `bmi >= 18.5`, the second case, so it is labelled "18.5 to below 25" and never reaches the
    third case. The second case must stop at 25:

    ```r
    register |>
      mutate(
        bmi_group = case_when(
          bmi < 18.5 ~ "below 18.5",
          bmi < 25 ~ "18.5 to below 25",
          bmi >= 25 ~ "25 or more"
        )
      )
    ```

    ```output
    # A tibble: 4 × 2
        bmi bmi_group
      <dbl> <chr>
    1  17.2 below 18.5
    2  23.9 18.5 to below 25
    3  26.4 25 or more
    4  31   25 or more
    ```

    Two of the four, 26.4 and 31.0, are in "25 or more".

    Why the wrong answer looks reasonable: each line, read alone, is true of its group. The label
    "18.5 to below 25" says "below 25", but the test beside it does not. The label is text; only the
    test decides.
- level: 8
  prompt: |
    A colleague groups BMI on a made-up register, and wants every row to have a group:

    ```r
    library(dplyr)

    register <- tibble(bmi = c(17.2, 23.9, NA, 26.4))

    register |>
      mutate(
        bmi_group = case_when(
          bmi < 18.5 ~ "below 18.5",
          bmi < 25 ~ "18.5 to below 25",
          .default = "25 or more"
        )
      ) |>
      count(bmi_group)
    ```

    ```output

    Attaching package: ‘dplyr’

    The following objects are masked from ‘package:stats’:

        filter, lag

    The following objects are masked from ‘package:base’:

        intersect, setdiff, setequal, union

    # A tibble: 3 × 2
      bmi_group            n
      <chr>            <int>
    1 18.5 to below 25     1
    2 25 or more           2
    3 below 18.5           1
    ```

    They report "2 of the 4 patients have a BMI of 25 or more". Find what broke.
  answer: |
    The third patient has no BMI. Both tests are `NA` for that row, so no case matches, and the row
    gets the `.default`, "25 or more". A missing value has been counted as a high BMI.

    Write the last case as a test, and leave `.default` out:

    ```r
    register |>
      mutate(
        bmi_group = case_when(
          bmi < 18.5 ~ "below 18.5",
          bmi < 25 ~ "18.5 to below 25",
          bmi >= 25 ~ "25 or more"
        )
      ) |>
      count(bmi_group)
    ```

    ```output
    # A tibble: 4 × 2
      bmi_group            n
      <chr>            <int>
    1 18.5 to below 25     1
    2 25 or more           1
    3 below 18.5           1
    4 <NA>                 1
    ```

    One patient in each group and one `NA`: 1 of the 3 with a BMI is at 25 or more.

    Why the wrong answer looks reasonable: "everything else is 25 or more" is true of every patient
    who has a BMI. The `.default` was written with measured values in mind, and the missing value
    slipped through.
- level: 8
  prompt: |
    A colleague converts body mass to kilograms and reports the mean:

    ```r
    library(readr)
    library(dplyr)

    penguins_raw <- read_csv(
      here::here("data-raw", "penguins_raw.csv"),
      show_col_types = FALSE
    )

    penguins <- penguins_raw |>
      mutate(`Body Mass (g)` = `Body Mass (g)` / 1000)

    mean(penguins$`Body Mass (g)`, na.rm = TRUE)
    ```

    ```output

    Attaching package: ‘dplyr’

    The following objects are masked from ‘package:stats’:

        filter, lag

    The following objects are masked from ‘package:base’:

        intersect, setdiff, setequal, union

    [1] 4.201754
    ```

    Their table says "mean body mass 4.2 g". Find what broke.
  answer: |
    The new values were written over the old column, under the old name. The column still says
    "(g)" but now holds kilograms. The arithmetic is right and the label is wrong, so the table
    reports a penguin of 4.2 grams.

    Make a new column with a name that carries its unit:

    ```r
    penguins <- penguins_raw |>
      mutate(body_mass_kg = `Body Mass (g)` / 1000)

    mean(penguins$body_mass_kg, na.rm = TRUE)
    ```

    ```output
    [1] 4.201754
    ```

    The mean body mass is 4.2 kg (4.201754 as printed), from the 342 penguins with a body mass.

    Why the wrong answer looks reasonable: the number 4.2 is correct. Only its unit is wrong, and
    the unit came from a name the code no longer matched.
- level: 8
  prompt: |
    A colleague writes:

    ```r
    library(dplyr)

    register <- tibble(
      height_cm = c(158, 172, 149),
      weight_kg = c(62, 85, 47)
    )
    ```

    ```output

    Attaching package: ‘dplyr’

    The following objects are masked from ‘package:stats’:

        filter, lag

    The following objects are masked from ‘package:base’:

        intersect, setdiff, setequal, union
    ```

    ```r error
    register |>
      mutate(bmi = weight_kg / height_m^2) |>
      mutate(height_m = height_cm / 100)
    ```

    ```output
    Error in `mutate()`:
    ℹ In argument: `bmi = weight_kg/height_m^2`.
    Caused by error:
    ! object 'height_m' not found
    ```

    Read the error. Say what broke and fix it.
  answer: |
    The first `mutate()` uses `height_m` before any line has made it. The pipe runs top to bottom,
    so when BMI is computed, the column `height_m` does not exist yet. Swap the order, or make both
    in one `mutate()`, height first:

    ```r
    register |>
      mutate(
        height_m = height_cm / 100,
        bmi = weight_kg / height_m^2
      )
    ```

    ```output
    # A tibble: 3 × 4
      height_cm weight_kg height_m   bmi
          <dbl>     <dbl>    <dbl> <dbl>
    1       158        62     1.58  24.8
    2       172        85     1.72  28.7
    3       149        47     1.49  21.2
    ```

    Why the wrong code looks reasonable: both lines are right. Only their order is wrong, and the
    order is the one thing a pipe never rearranges for you.
- level: 9
  prompt: |
    A made-up clinic audit says: "2 of our 5 patients had a BMI of 25.0 kg/m^2 or more." Here is the
    register.

    ```r
    library(dplyr)

    audit <- tibble(
      id = c(1, 2, 3, 4, 5),
      height_cm = c(160, 155, 170, 165, 150),
      weight_kg = c(64, 52, 75, 62, 54)
    )
    ```

    ```output

    Attaching package: ‘dplyr’

    The following objects are masked from ‘package:stats’:

        filter, lag

    The following objects are masked from ‘package:base’:

        intersect, setdiff, setequal, union
    ```

    Check the claim, and say what your answer does not establish.
  answer: |
    Compute BMI from height in metres. Then count the BMIs at 25 or more, first as stored, then
    rounded to one decimal, the precision of the cut-point.

    ```r
    audit |>
      mutate(
        height_m = height_cm / 100,
        bmi = weight_kg / height_m^2,
        bmi_1dp = round(bmi, 1),
        stored_25_plus = bmi >= 25,
        rounded_25_plus = bmi_1dp >= 25
      ) |>
      select(id, bmi_1dp, stored_25_plus, rounded_25_plus)
    ```

    ```output
    # A tibble: 5 × 4
         id bmi_1dp stored_25_plus rounded_25_plus
      <dbl>   <dbl> <lgl>          <lgl>
    1     1    25   FALSE          TRUE
    2     2    21.6 FALSE          FALSE
    3     3    26   TRUE           TRUE
    4     4    22.8 FALSE          FALSE
    5     5    24   FALSE          FALSE
    ```

    Patient 1's BMI is 25.0 on paper (64 ÷ 1.6^2 = 25), but as stored it falls a hair below 25.
    Compared as stored, 1 patient is at 25 or more. Rounded to one decimal, 2 are: patients 1 and 3.
    So the claim is true under the rounding rule and false without it. The audit should say which
    rule it used.

    What it does not establish: anything about the clinic's other patients, or about people outside
    the clinic. Five patients are five patients. And the BMI itself says nothing about any one
    patient's health without the rest of their assessment.
- level: 10
  prompt: |
    A made-up draft thesis says: "Mean body mass of the Gentoo penguins was 5.08 kg." The penguin
    file records body mass in grams. Turn the sentence into code, run it, and say what the result
    does not establish.
  answer: |
    Convert to kilograms in a new column, keep the Gentoo penguins, and take the mean, leaving out
    missing values.

    ```r
    library(readr)
    library(dplyr)

    penguins_raw <- read_csv(
      here::here("data-raw", "penguins_raw.csv"),
      show_col_types = FALSE
    )

    gentoo <- penguins_raw |>
      mutate(body_mass_kg = `Body Mass (g)` / 1000) |>
      filter(Species == "Gentoo penguin (Pygoscelis papua)")

    nrow(gentoo)
    sum(is.na(gentoo$body_mass_kg))
    mean(gentoo$body_mass_kg, na.rm = TRUE)
    ```

    ```output

    Attaching package: ‘dplyr’

    The following objects are masked from ‘package:stats’:

        filter, lag

    The following objects are masked from ‘package:base’:

        intersect, setdiff, setequal, union

    [1] 124
    [1] 1
    [1] 5.076016
    ```

    5.076016 kg, which rounds to 5.08 kg. The sentence matches the file. But `na.rm = TRUE` left one
    penguin out: the mean is of 123 of the 124 Gentoo penguins, and the sentence should say so.

    What it does not establish:

    - Anything about Gentoo penguins outside these three seasons of sampling.
    - That the difference from another species' mean is real or large. A mean alone carries no
      comparison and no measure of spread.
    - What the missing penguin weighed. Leaving it out is a choice, and the section on missing
      values says how to report it.
  refs:
  - horst_2020_palmerpenguins
retrieval_items:
- q: What does mutate() do to the number of rows?
  a: Nothing. It adds or replaces columns and keeps every row.
- q: In case_when(), which value does a row get if it passes more than one case?
  a: The value of the first case it passes. The cases are checked in order.
- q: What does case_when() give a row with a missing value when no .default is set?
  a: NA. A missing value makes every test NA, no case matches, and with no .default the result is NA.
- q: What does round(2.5) give in R, and why?
  a: 2. A 5 at the cut is rounded to the even digit.
- q: Why is a BMI computed from height in centimetres wrong by a factor of 10,000?
  a: The height is 100 times too large, and squaring it makes the bottom of the fraction 10,000 times
    too large, so the BMI is 10,000 times too small.
