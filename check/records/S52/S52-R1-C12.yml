- level: 3
  prompt: |
    Before you run it, say what this prints.

    ```r norun
    round(c(0.5, 1.5, 2.5))
    ```
  answer: |
    ```r
    round(c(0.5, 1.5, 2.5))
    ```

    ```output
    [1] 0 2 2
    ```

    0, 2 and 2. A 5 at the cut goes to the even digit: 0.5 down to 0, 1.5 up to 2, 2.5 down to 2.
    School rounding would give 1, 2 and 3. Both are rules; R uses the first.
