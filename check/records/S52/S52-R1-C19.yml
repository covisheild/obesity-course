simplified_explanation: |
  **stopifnot()** is the tool. Give each test a name that says the belief in words, and the error
  prints that name.

  Three checks cover most of what goes wrong.

  - **Range.** Every height lies between two limits you wrote down.
  - **Key.** Every row has its own ID. Count the different IDs with `n_distinct()` and compare with
    the number of rows.
  - **Row count.** Count the rows before a join or a filter and again after. Then compare.

  A check that fails is a question, not a verdict. Look at the rows it found. Go back to the paper
  register, the form or the person who measured. Then write the fix as a line of code, with the date
  and the reason in a comment. Never fix it in the raw file.
illustrations:
- body: |
    Start with an analysis that looks finished. Here is a made-up clinic register of six adults,
    typed from paper. Heights are in centimetres and weights in kilograms. Two values were typed
    wrong, and nothing in the code below knows it.

    ```r
    library(dplyr, warn.conflicts = FALSE)

    clinic <- tibble(
      id = c(101, 102, 103, 104, 105, 106),
      height_cm = c(152, 160, 1.6, 171, 158, 165),
      weight_kg = c(41, 64, 58, 80.2, 620, 58)
    )
    ```

    Compute each BMI from height in metres, as the section on making new columns did, and report the
    median:

    ```r
    clinic |>
      mutate(bmi = weight_kg / (height_cm / 100)^2) |>
      summarise(n = n(), median_bmi = median(bmi))
    ```

    ```output
    # A tibble: 1 × 2
          n median_bmi
      <int>      <dbl>
    1     6       26.2
    ```

    The code runs with no warning. A median BMI of 26.2 kg/m^2 in a clinic of six adults looks
    ordinary. You could put it in a report, and nobody reading the report would object.

    The median hides the damage. Patient 103's height was typed as 1.6, a height in metres, and
    patient 105's weight as 620 for 62. Their BMIs are absurd, but the median looks only at the
    middle of the ordered values, so the median still looks ordinary. It is wrong all the same: the
    two absurd values went to the top and pushed two ordinary ones into the middle. With six rows you
    might have spotted them by eye. With six thousand you would not.

    Now write down what you believed about the data, as code. Every height lies between 50 and 250
    cm. Every weight lies between 20 and 300 kg. These limits are a decision, not a fact about
    people. They are set wide on purpose, so that a value outside them is one you must look at
    before you use it. Write them where anyone reading the script can see them and argue with them,
    as Book 0 asked of every guess. `all()` turns many `TRUE` and `FALSE` values into one, and it is
    where `na.rm = TRUE` goes.

    ```r error
    stopifnot(
      "every height is between 50 and 250 cm" =
        all(clinic$height_cm >= 50 & clinic$height_cm <= 250),
      "every weight is between 20 and 300 kg" =
        all(clinic$weight_kg >= 20 & clinic$weight_kg <= 300)
    )
    ```

    ```output
    Error: every height is between 50 and 250 cm
    ```

    The script stops, and the message is the belief that failed. It stopped at the first failure,
    so the weight check never ran. To see every row that breaks either limit, filter for them:

    ```r
    clinic |>
      filter(
        height_cm < 50 | height_cm > 250 |
          weight_kg < 20 | weight_kg > 300
      )
    ```

    ```output
    # A tibble: 2 × 3
         id height_cm weight_kg
      <dbl>     <dbl>     <dbl>
    1   103       1.6        58
    2   105     158         620
    ```

    Two rows: patient 103 and patient 105. Now go back to the paper register; in this made-up story
    it reads 160 cm for patient 103 and 62 kg for patient 105. Correct both in code. Pick out each
    row by its ID, never by its position. Put the corrected values in new columns, so the typed values
    stay beside them. Say in a comment when you made the change and where the right value came from.

    ```r
    clinic_checked <- clinic |>
      mutate(
        # 2026-10-02: register page for id 103 reads 160 cm; it was typed
        # as 1.6, a height in metres. Corrected here, raw file not edited.
        height_cm_checked = if_else(id == 103, 160, height_cm),
        # 2026-10-02: register page for id 105 reads 62 kg, typed as 620.
        weight_kg_checked = if_else(id == 105, 62, weight_kg)
      )

    stopifnot(
      "every height is between 50 and 250 cm" =
        all(clinic_checked$height_cm_checked >= 50 &
          clinic_checked$height_cm_checked <= 250),
      "every weight is between 20 and 300 kg" =
        all(clinic_checked$weight_kg_checked >= 20 &
          clinic_checked$weight_kg_checked <= 300)
    )
    ```

    This time `stopifnot()` prints nothing. Silence is the answer you wanted: every test was `TRUE`.
    Now the median:

    ```r
    clinic_checked |>
      mutate(
        bmi = weight_kg_checked / (height_cm_checked / 100)^2
      ) |>
      summarise(n = n(), median_bmi = median(bmi))
    ```

    ```output
    # A tibble: 1 × 2
          n median_bmi
      <int>      <dbl>
    1     6       23.7
    ```

    The median moved from 26.2 to 23.7 kg/m^2. Both numbers looked reasonable. Only one was right,
    and only the check could tell them apart.
  analogy_breaks_when: |
    The six patients, the two slips and the paper register are made up. The code is the point, not
    the BMIs.

    The limits catch a slip that makes a value far too large or far too small: a height in metres, a
    weight with an extra zero. They never catch a slip that stays inside them. A height of 126 cm
    typed for 162 cm passes both checks, and so would a weight of 58 kg typed for 85 kg. Like Book 0's
    order-of-magnitude check, a range check finds the impossible, not the wrong.
- body: |
    Now run the same kind of checks on real data. The National Health and Nutrition Examination
    Survey (NHANES) of the United States, 2021–2023 cycle, gives its body measures in one file and its
    demographics in another, as the section on reshaping and joining used them. Each row of each file
    is one participant, with an ID in the column `SEQN`.

    ```r
    library(haven)
    library(dplyr, warn.conflicts = FALSE)

    bmx <- read_xpt(here::here("data-raw", "BMX_L.xpt"))
    demo <- read_xpt(here::here("data-raw", "DEMO_L.xpt"))
    ```

    First the key check. The join assumes that `SEQN` picks out one row in each file. Write that
    down:

    ```r
    stopifnot(
      "SEQN is unique in BMX_L" = n_distinct(bmx$SEQN) == nrow(bmx),
      "SEQN is unique in DEMO_L" = n_distinct(demo$SEQN) == nrow(demo)
    )
    ```

    Nothing printed, so both are true. Next the row-count check. Store the number of rows before the
    join, join, and compare:

    ```r
    n_before <- nrow(bmx)

    joined <- bmx |>
      left_join(demo, by = "SEQN")

    stopifnot("the join kept every row" = nrow(joined) == n_before)

    nrow(joined)
    ```

    ```output
    [1] 8860
    ```

    Still {{n:bmx_rows}} rows, as before the join. The section on reshaping and joining wrote the
    same promise into the join itself, with `relationship = "one-to-one"`. The row-count check does
    the same job after any step, not only a join. Now keep the adults, aged 20 or over:

    ```r
    adults <- joined |>
      filter(RIDAGEYR >= 20)

    nrow(adults)
    ```

    ```output
    [1] 6064
    ```

    {{n:nhanes_adults_rows}} adults. Now the range checks, with the same limits as before. `BMXHT` is
    standing height in centimetres and `BMXWT` is weight in kilograms.

    ```r error
    stopifnot(
      "adult heights are between 50 and 250 cm" =
        all(adults$BMXHT >= 50 & adults$BMXHT <= 250)
    )
    ```

    ```output
    Error: adult heights are between 50 and 250 cm
    ```

    The check fails. Before you hunt for a giant, count what made it fail:

    ```r
    sum(adults$BMXHT < 50 | adults$BMXHT > 250, na.rm = TRUE)
    sum(is.na(adults$BMXHT))
    ```

    ```output
    [1] 0
    [1] 67
    ```

    No height lies outside the limits. But 67 adults have no height recorded, and a missing value is
    not `TRUE`, so `stopifnot()` fails on it. That is the right default: the check has made you
    notice the missing values. Now decide what you mean. The range check is about the heights that
    were measured, so say so with `na.rm = TRUE` inside `all()`. The missing ones are counted and
    reported, as the section on missing values taught, not hidden.

    ```r
    stopifnot(
      "measured adult heights are between 50 and 250 cm" =
        all(adults$BMXHT >= 50 & adults$BMXHT <= 250, na.rm = TRUE),
      "measured adult weights are between 20 and 300 kg" =
        all(adults$BMXWT >= 20 & adults$BMXWT <= 300, na.rm = TRUE)
    )

    sum(is.na(adults$BMXWT))
    ```

    ```output
    [1] 81
    ```

    Both pass, and 81 adults have no weight. Last, keep the adults with both measures, and count:

    ```r
    adults_measured <- adults |>
      filter(!is.na(BMXHT), !is.na(BMXWT))

    nrow(adults_measured)
    ```

    ```output
    [1] 5970
    ```

    Put the row counts side by side. Each line of the script that could change the number of rows
    now has a number beside it.

    ```table
    | Step | Rows |
    | BMX_L as read | 8860 |
    | after the join | 8860 |
    | aged 20 or over | 6064 |
    | both measures recorded | 5970 |
    ```

    The last two rows differ by 94. That is the number of adults missing a height, a weight or both,
    and a report must say it.

    One more thing to notice. The survey's own codebook prints a "Range of Values" for height of 79.1
    to 200.7 cm. That is the smallest and largest height in the file, across all ages measured. It
    describes the file. A check with those numbers as its limits would pass on this file by
    construction, and so it could never catch an error in it.
  analogy_breaks_when: |
    These are counts of rows in a file. The survey's documentation says its sample weights should be
    used to analyse the body measures data, and nothing here uses them. So no count in this example
    says anything about adults in the United States. Survey weights are taught in the subject on
    India's data infrastructure and complex survey analysis.

    The public NHANES file has already been cleaned by the people who released it, so every range
    check on the recorded values passes. A register typed by hand in a clinic will rarely be so kind. The checks earn their place
    on the day they fail.
