retrieval_items:
- q: What is the difference between R and RStudio, and which do you install first?
  a: R is the program that carries out R instructions. RStudio is an application (an integrated development environment) that you work in, with a script editor and the console. Install R first, then RStudio.
- q: What does the console keep, and what does a script keep?
  a: The console runs each line once, prints the answer and keeps only a history of everything typed, wrong lines included. A script is a saved file that keeps the lines you chose, with comments, and runs again from the top.
- q: What are R's signs for times, divided by and to the power of?
  a: '`*` for times, `/` for divided by, `^` for to the power of.'
- q: What does R do with everything after a `#` on a line?
  a: It ignores it. The text is a comment, for people to read.
