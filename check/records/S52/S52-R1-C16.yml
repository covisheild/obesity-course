  skill_ref: S52-R1-K01
- type: critique
  prompt: |
    A colleague's thesis table gives "Mean haemoglobin 11.2 g/dL (n = 312)" for the women in her
    study. She ran `mean(hb, na.rm = TRUE)` in the console and read the answer off the screen. She
    typed it into the Word table, with `nrow()` of her data frame as the n. Say what can be wrong
    with that number and its n, and how her script should produce them instead.
  answer: |
    Two things can be wrong, and nobody can now tell whether they are.

    The n may not be the n behind the mean. The function `nrow()` counts every woman in the data
    frame.
    `na.rm = TRUE` left out any woman with no haemoglobin result. If 20 results were missing, the
    mean came from 292 women and the table says 312.

    The number has no trail. It was read off a screen and typed. If a value in the data is later
    corrected, or a typing slip turned 11.2 into 12.1, nothing connects the table to the code.

    Instead, the script should compute the summary with `summarise()`: `n()` for the rows,
    `sum(!is.na(hb))` for the results used, and the mean and median. It should write that table
    to `output/` with `write_csv()`. The thesis table is then copied from that file, which the
    script rewrites every time it runs. The section on running a whole script with one command
    takes the last step, a document in which the code writes the number itself, to its doorstep.
  skill_ref: S52-R1-K02
- type: teaching
  prompt: |
    A first-year resident has ten minutes and a whiteboard. She has just made a table of mean BMI
    by district from a screening register. She does not see why you want a count in every row.
    Teach her.
  answer: |
    Draw two rows on the board. District A: mean BMI 24.0 kg/m^2. District B: mean BMI 27.0 kg/m^2.
    Ask her which district has the higher BMI. She will say B.

    Now add a count to each row: A, 2,400 adults; B, 4 adults. Ask again. The difference is the
    same three units, but B's mean is four people. One person of high BMI who happened to come
    that day could have made it.

    Then add a second count: values used. Say B screened 40 adults but only 4 had weight and
    height recorded. Now the mean describes the 4 who were measured, and nobody knows whether they
    are like the other 36.

    Write the rule under the table. Every summary row carries the number of rows and the number
    of values used. In R that is `n()` and `sum(!is.na(x))`, inside the same `summarise()` as the
    mean. Then the counts can never drift away from the number they describe.
- type: retrieval
  prompt: |
    Without looking back, name three ways a table of summaries by group can be wrong, or
    misleading, without any error message.
  answer: |
    Any three of these:

    - The count printed is `n()`, the rows, while the mean used fewer values because
      `na.rm = TRUE` left the missing ones out.
    - A percentage worked out after `group_by()` on two columns is a share within each group, not
      of the total, because the result was still grouped.
    - A quartile differs from another tool's because the two use different rules.
    - A group of `NA`, such as penguins with no sex recorded, is dropped from the report without a
      word, though the summary printed it.
    - A number was copied off the screen and later typed wrongly, or not updated when the data
      changed.
quantitative: true
practice_note: |
  Twelve problems. summarise() itself is one move, but grouping has three silent traps (the n
  that counts rows not values, the leftover grouping that changes a percentage, and quartile rules
  that differ between tools), and writing the table by code is a fourth habit; each needs a
  diagnostic or applied problem of its own.
