- level: 7
  prompt: |
    A colleague runs this and writes in her notes: "Adelie and Gentoo body masses were not
    recorded; only Chinstrap has data."

    ```r
    library(readr)
    library(dplyr)

    penguins_raw <- read_csv(
      here::here("data-raw", "penguins_raw.csv"),
      show_col_types = FALSE
    )

    penguins_raw |>
      summarise(mean_g = mean(`Body Mass (g)`), .by = Species)
    ```

    ```output

    Attaching package: ‘dplyr’

    The following objects are masked from ‘package:stats’:

        filter, lag

    The following objects are masked from ‘package:base’:

        intersect, setdiff, setequal, union

    # A tibble: 3 × 2
      Species                                   mean_g
      <chr>                                      <dbl>
