    2 Gentoo penguin (Pygoscelis papua)            124         1  5076.
    3 Chinstrap penguin (Pygoscelis antarctica)     68         0  3733.
    ```

    Adelie: 1 missing of {{n:penguins_adelie}}. Gentoo: 1 missing of {{n:penguins_gentoo}}. Both have a mean.

    Why the wrong reading looks reasonable: `NA` means "not available", and the note took that to
    mean the whole column was not available. It meant one value was.
- level: 7
  prompt: |
    A colleague's table of Gentoo body mass reads "n = {{n:penguins_gentoo}}, mean 5076 g". Here is his code.

    ```r
    library(readr)
    library(dplyr)

    penguins_raw <- read_csv(
      here::here("data-raw", "penguins_raw.csv"),
      show_col_types = FALSE
    )

    penguins_raw |>
      filter(Species == "Gentoo penguin (Pygoscelis papua)") |>
      summarise(
        n = n(),
        mean_g = mean(`Body Mass (g)`, na.rm = TRUE)
      )
    ```

    ```output

    Attaching package: ‘dplyr’

    The following objects are masked from ‘package:stats’:

        filter, lag

    The following objects are masked from ‘package:base’:

        intersect, setdiff, setequal, union

    # A tibble: 1 × 2
          n mean_g
      <int>  <dbl>
    1   124  5076.
    ```

    The mean is right. Find what is wrong with the table.
  answer: |
    The n counts rows, not body masses. One Gentoo penguin has no body mass, so the mean was
    worked out from {{n:penguins_gentoo_mass_n}} values, not {{n:penguins_gentoo}}.

    ```r
    penguins_raw |>
      filter(Species == "Gentoo penguin (Pygoscelis papua)") |>
      summarise(
        n_rows = n(),
        n_mass = sum(!is.na(`Body Mass (g)`)),
        mean_g = mean(`Body Mass (g)`, na.rm = TRUE)
      )
    ```

    ```output
    # A tibble: 1 × 3
      n_rows n_mass mean_g
       <int>  <int>  <dbl>
    1    124    123  5076.
    ```

    The table should read "n = {{n:penguins_gentoo_mass_n}}" for the mean, and say that 1 of {{n:penguins_gentoo}} had no body mass.

    Why the wrong n looks reasonable: `n()` is the count every example shows beside a mean. With no
    missing values it is the right one. The error only appears in a group with a gap.
- level: 8
  prompt: |
    A colleague wants each species-and-sex group's share of all the penguins, and reports
    "Gentoo males are 49.2% of the penguins in the file."

    ```r
    library(readr)
    library(dplyr)

    penguins_raw <- read_csv(
      here::here("data-raw", "penguins_raw.csv"),
      show_col_types = FALSE
    )

    penguins_raw |>
      group_by(Species, Sex) |>
      summarise(n = n()) |>
      mutate(pct = 100 * n / sum(n)) |>
      filter(Sex == "MALE")
    ```

    ```output

    Attaching package: ‘dplyr’

    The following objects are masked from ‘package:stats’:

        filter, lag

    The following objects are masked from ‘package:base’:

        intersect, setdiff, setequal, union

    `summarise()` has grouped output by 'Species'. You can override using
    the `.groups` argument.
    # A tibble: 3 × 4
    # Groups:   Species [3]
      Species                                   Sex       n   pct
      <chr>                                     <chr> <int> <dbl>
    1 Adelie Penguin (Pygoscelis adeliae)       MALE     73  48.0
    2 Chinstrap penguin (Pygoscelis antarctica) MALE     34  50
    3 Gentoo penguin (Pygoscelis papua)         MALE     61  49.2
    ```

    Find what broke.
  answer: |
    After `summarise()`, the result is still grouped by `Species`: the message says so. So `sum(n)`
    adds up within each species. 61 Gentoo males are 49.2% of {{n:penguins_gentoo}} Gentoo penguins, not of all {{n:penguins_rows}}.

    Group for that step only, so the sum covers every row:

    ```r
    penguins_raw |>
      count(Species, Sex) |>
      mutate(pct = 100 * n / sum(n)) |>
      filter(Sex == "MALE")
    ```

    ```output
    # A tibble: 3 × 4
      Species                                   Sex       n   pct
      <chr>                                     <chr> <int> <dbl>
    1 Adelie Penguin (Pygoscelis adeliae)       MALE     73 21.2
    2 Chinstrap penguin (Pygoscelis antarctica) MALE     34  9.88
    3 Gentoo penguin (Pygoscelis papua)         MALE     61 17.7
    ```

    Gentoo males are 17.7% of the {{n:penguins_rows}} rows in the file. `count()` returns an ungrouped
    result, so `sum(n)` is {{n:penguins_rows}}.

    Why the wrong answer looks reasonable: 49.2% is a sensible share for males in one species, so
    nothing about the number looks off. Only the denominator changed, and the denominator is not
    printed.
- level: 8
  prompt: |
    A colleague runs this to get mean body mass by short species name:

    ```r
    library(readr)
    library(dplyr)

    penguins_raw <- read_csv(
      here::here("data-raw", "penguins_raw.csv"),
      show_col_types = FALSE
    )
    ```

    ```output

    Attaching package: ‘dplyr’

    The following objects are masked from ‘package:stats’:

        filter, lag

    The following objects are masked from ‘package:base’:

        intersect, setdiff, setequal, union
    ```

    ```r error
    penguins_raw |>
      summarise(
        mean_g = mean(`Body Mass (g)`, na.rm = TRUE),
        .by = species
      ) |>
      mutate(
        species = case_when(
          species == "Adelie Penguin (Pygoscelis adeliae)" ~ "Adelie",
          species == "Chinstrap penguin (Pygoscelis antarctica)" ~ "Chinstrap",
          species == "Gentoo penguin (Pygoscelis papua)" ~ "Gentoo"
        )
      )
    ```

    ```output
    Error in `summarise()`:
    ! Can't subset columns that don't exist.
    ✖ Column `species` doesn't exist.
    ```

    Read the error. Say what broke and fix it.
  answer: |
    The file's column is `Species`, with a capital S. R tells capitals from small letters, so
    `.by = species` names a column that does not exist yet. The short names have to be made before
    the summary groups by them:

    ```r
    penguins_raw |>
      mutate(
        species = case_when(
          Species == "Adelie Penguin (Pygoscelis adeliae)" ~ "Adelie",
          Species == "Chinstrap penguin (Pygoscelis antarctica)" ~ "Chinstrap",
          Species == "Gentoo penguin (Pygoscelis papua)" ~ "Gentoo"
        )
      ) |>
      summarise(
        mean_g = mean(`Body Mass (g)`, na.rm = TRUE),
        .by = species
      )
    ```

    ```output
    # A tibble: 3 × 2
      species   mean_g
      <chr>      <dbl>
    1 Adelie     3701.
    2 Gentoo     5076.
    3 Chinstrap  3733.
    ```

    Three rows, one per short name. A summary keeps only the grouping columns and the summaries,
    so make every column you will group by before `summarise()`, not after.

    Why the wrong code looks reasonable: the plan, "summarise, then rename", is fine in words.
    But after `summarise()` the long `Species` column would be the only one left to rename, and
    its name is not the one the code used.
- level: 9
  prompt: |
    A made-up draft thesis says: "Gentoo penguins (n = {{n:penguins_gentoo}}) were heavier than Adelie penguins
    (n = {{n:penguins_adelie}}), with mean body masses of 5076 g and 3701 g." Check every number in the sentence
    against the penguin file. Then say what the result does not establish.
  answer: |
    ```r
    library(readr)
    library(dplyr)

    penguins_raw <- read_csv(
      here::here("data-raw", "penguins_raw.csv"),
      show_col_types = FALSE
    )

    penguins_raw |>
      filter(Species != "Chinstrap penguin (Pygoscelis antarctica)") |>
      summarise(
        n_rows = n(),
        n_mass = sum(!is.na(`Body Mass (g)`)),
        mean_g = mean(`Body Mass (g)`, na.rm = TRUE),
        median_g = median(`Body Mass (g)`, na.rm = TRUE),
        .by = Species
      )
    ```

    ```output

    Attaching package: ‘dplyr’

    The following objects are masked from ‘package:stats’:

        filter, lag

    The following objects are masked from ‘package:base’:

        intersect, setdiff, setequal, union

    # A tibble: 2 × 5
      Species                             n_rows n_mass mean_g median_g
      <chr>                                <int>  <int>  <dbl>    <dbl>
    1 Adelie Penguin (Pygoscelis adeliae)    152    151  3701.     3700
    2 Gentoo penguin (Pygoscelis papua)      124    123  5076.     5000
    ```

    The means match, once rounded: 3701 g for Adelie and 5076 g for Gentoo. The counts do not
    describe the means. Each n is the number of rows; each mean used one value fewer, 151 and
    {{n:penguins_gentoo_mass_n}}. The sentence should give those, or say that one body mass was missing in each species.
    The medians, 3700 g and 5000 g, tell the same story as the means.

    What it does not establish:

    - That Gentoo penguins in general are heavier. These are the penguins in one study, on certain
      islands in certain seasons.
    - How large the difference is against the spread within each species, or whether it could be
      chance. That needs the standard deviations and a method from the statistics books.
    - Why they differ. Species is not the only thing that differs between the two groups: they
      were also sampled on different islands.
  refs:
  - horst_2020_palmerpenguins
- level: 10
  prompt: |
    In a made-up lab meeting, someone says: "Male penguins in this dataset average about 4.5 kg."
    Turn the sentence into code, run it, and say what the result does not establish.
  answer: |
    Body mass is in grams, so 4.5 kg is 4500 g. Summarise by sex, with counts:

    ```r
    library(readr)
    library(dplyr)

    penguins_raw <- read_csv(
      here::here("data-raw", "penguins_raw.csv"),
      show_col_types = FALSE
    )

    penguins_raw |>
      summarise(
        n_mass = sum(!is.na(`Body Mass (g)`)),
        mean_g = mean(`Body Mass (g)`, na.rm = TRUE),
        .by = Sex
      )

    penguins_raw |>
      filter(Sex == "MALE") |>
      summarise(
        n_mass = sum(!is.na(`Body Mass (g)`)),
        mean_g = mean(`Body Mass (g)`, na.rm = TRUE),
        .by = Species
      )
    ```

    ```output

    Attaching package: ‘dplyr’

    The following objects are masked from ‘package:stats’:

        filter, lag

    The following objects are masked from ‘package:base’:

        intersect, setdiff, setequal, union

    # A tibble: 3 × 3
      Sex    n_mass mean_g
      <chr>   <int>  <dbl>
    1 MALE      168  4546.
    2 FEMALE    165  3862.
    3 <NA>        9  4006.
    # A tibble: 3 × 3
      Species                                   n_mass mean_g
      <chr>                                      <int>  <dbl>
    1 Adelie Penguin (Pygoscelis adeliae)           73  4043.
    2 Gentoo penguin (Pygoscelis papua)             61  5485.
    3 Chinstrap penguin (Pygoscelis antarctica)     34  3939.
    ```

    The {{n:penguins_male}} males average 4546 g, about 4.5 kg, so the sentence matches the file. Now look inside
    it. Adelie males average 4043 g and Chinstrap males 3939 g; Gentoo males average 5485 g. No
    species has males that average about 4.5 kg. The pooled mean sits between a group of lighter
    birds and a group of heavier ones, and it describes almost no actual penguin.

    What it does not establish:

    - Anything about a typical male of any species. Grouping by sex alone mixed three species of
      quite different size.
    - Anything about the 11 penguins with no sex recorded, who are in neither group.
    - Anything about penguins outside this study.
