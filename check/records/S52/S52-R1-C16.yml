retrieval_items:
- q: How many rows does summarise() return with no grouping, and with grouping by one column?
  a: One row with no grouping. With grouping, one row for each group, that is, each distinct value
    of the grouping column (including NA, if it occurs).
- q: In summarise(), what does n() count, and how do you count the values a mean actually used?
  a: n() counts the rows in the group, whatever they hold. sum(!is.na(x)) counts the values of x
    that are not missing, which are the ones mean(x, na.rm = TRUE) used.
- q: What is the difference between group_by() then summarise(), and summarise() with .by?
  a: After group_by() on several columns, summarise() removes only the last, so the result is still
    grouped; ungroup() removes the rest. .by groups for that one step and returns an ungrouped
    result.
- q: Why can R and SPSS give different quartiles for the same data?
  a: There are several rules for placing a quartile between two values. R's quantile() uses type 7
    by default; its help page says SPSS uses type 6.
- q: Why should a summary table be written to output/ by code?
  a: So that no number is copied by hand, and the table is rewritten from the data every time the
    script runs.
