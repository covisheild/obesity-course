- level: 3
  prompt: |
    Use Book 0's method, the median of each half, on the four numbers 2, 4, 6 and 8. Work out the
    first quartile, the third quartile and the interquartile range. Then run `quantile()` and `IQR()` on the same four
    numbers in R. Say why the answers differ.
  answer: |
    Book 0: the lower half is 2 and 4, so the first quartile is halfway between them, 3.
    The upper half is 6 and 8, so the third quartile is 7. The interquartile range is 7 minus 3,
    which is 4.

    ```r
    quantile(c(2, 4, 6, 8))
    IQR(c(2, 4, 6, 8))
    ```

    ```output
      0%  25%  50%  75% 100%
     2.0  3.5  5.0  6.5  8.0
    [1] 3
    ```

    R gives 3.5 and 6.5, and an interquartile range of 3. R's default, type 7, places a quartile
    by a different rule from Book 0's. Neither is a mistake. On four values the rules are far
    apart; on hundreds they land close together.
