    Find what broke.
  answer: |
    Nothing is wrong with the data. `mean()` returns `NA` if even one value in the group is missing,
    unless told to leave missing values out. Adelie and Gentoo each have one missing body mass;
    Chinstrap has none. Count, then summarise:

    ```r
    penguins_raw |>
      summarise(
        n_rows = n(),
        n_missing = sum(is.na(`Body Mass (g)`)),
        mean_g = mean(`Body Mass (g)`, na.rm = TRUE),
        .by = Species
