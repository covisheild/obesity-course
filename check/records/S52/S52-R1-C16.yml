simplified_explanation: |
  Earlier sections chose the rows of a data frame and changed its columns, one row still standing
  for one observation. This one shrinks it. A summary turns many rows into one number: how many there are, their mean, their
  median, their spread. Book 0 taught each of these by hand. Here R does the arithmetic, and your
  job moves to choosing the summary and reading it.

  **summarise()**, met once in the section on missing values, gives one row. Ask it for the mean body mass of every penguin in the file and
  you get one row with one number.

  **group_by()** before it, or **.by** inside it, gives one row per group: one row per species,
  one row per district, one row per clinic. The shape of the answer tells you what you asked for.
  Three species give three rows. If you expected three rows and got eight, you grouped by
  something else as well.

  Put the count beside every summary. A mean of 3700 g from 151 penguins and a mean of 3700 g
  from 3 penguins are not the same evidence. The reader of your table cannot tell them apart
  unless you print the count. Be careful which count. `n()` counts rows. If some rows have no
  value, the mean used fewer than `n()` of them. Count the values the mean actually used with
  `sum(!is.na(x))`.

  Quartiles have more than one recipe. Book 0's recipe, R's default and the one SPSS uses can give
  three different answers on the same small set of numbers. None is wrong. Say which you used.

  When the table is done, write it to a file in `output/` with code. Never copy a number off the
  screen into a report. If the data change, rerun the script and the file changes with them.

  A summary describes the rows in your file. It is not, by itself, a figure for anyone outside it.
illustrations:
- body: |
    Start with the penguin file, and give the species short names as the section on making new
    columns did. Keep a copy of body mass under a name without spaces.

    ```r
    library(readr)
    library(dplyr)

    penguins_raw <- read_csv(
      here::here("data-raw", "penguins_raw.csv"),
      show_col_types = FALSE
    )

    penguins <- penguins_raw |>
      mutate(
        species = case_when(
          Species == "Adelie Penguin (Pygoscelis adeliae)" ~ "Adelie",
          Species == "Chinstrap penguin (Pygoscelis antarctica)" ~ "Chinstrap",
          Species == "Gentoo penguin (Pygoscelis papua)" ~ "Gentoo"
        ),
        body_mass_g = `Body Mass (g)`
      )
    ```

    ```output

    Attaching package: ‘dplyr’

    The following objects are masked from ‘package:stats’:

        filter, lag

    The following objects are masked from ‘package:base’:

        intersect, setdiff, setequal, union
    ```

    Ask for the mean body mass of all the penguins:

    ```r
    penguins |>
      summarise(mean_g = mean(body_mass_g))
    ```

    ```output
    # A tibble: 1 × 1
      mean_g
       <dbl>
    1     NA
    ```

    One row, as promised, and the answer is `NA`. Two penguins have no body mass, and one missing
    value makes the whole mean missing. That is R refusing to guess. Tell `mean()` to leave the
    missing values out, and ask for the count beside it:

    ```r
    penguins |>
      summarise(
        n_rows = n(),
        mean_g = mean(body_mass_g, na.rm = TRUE)
      )
    ```

    ```output
    # A tibble: 1 × 2
      n_rows mean_g
       <int>  <dbl>
    1    344  4202.
    ```

    Read the two numbers together. `n_rows` is {{n:penguins_rows}}, every row in the file. The mean was worked out
    from {{n:penguins_mass_n}} of them, because `na.rm = TRUE` dropped the two without a body mass. The count beside
    the mean is wrong by two, and nothing on the screen says so. Count the values the mean used,
    not the rows:

    ```r
    mass_by_species <- penguins |>
      summarise(
        n_rows = n(),
        n_mass = sum(!is.na(body_mass_g)),
        mean_g = mean(body_mass_g, na.rm = TRUE),
        sd_g = sd(body_mass_g, na.rm = TRUE),
        median_g = median(body_mass_g, na.rm = TRUE),
        iqr_g = IQR(body_mass_g, na.rm = TRUE),
        .by = species
      )

    mass_by_species
    ```

    ```output
    # A tibble: 3 × 7
      species   n_rows n_mass mean_g  sd_g median_g iqr_g
      <chr>      <int>  <int>  <dbl> <dbl>    <dbl> <dbl>
    1 Adelie       152    151  3701.  459.     3700  650
    2 Gentoo       124    123  5076.  504.     5000  800
    3 Chinstrap     68     68  3733.  384.     3700  462.
    ```

    `.by = species` asked for one row per species, and there are three rows. Each row has its own
    two counts. Adelie has {{n:penguins_adelie}} rows and 151 body masses; Gentoo has {{n:penguins_gentoo}} rows and {{n:penguins_gentoo_mass_n}}; Chinstrap has
    {{n:penguins_chinstrap}} of each. Those are the two missing values, one in each of two species. The tibble prints the
    means rounded to fit the screen.

    ```table
    | Species | Rows | Body masses used | Mean (g) | Median (g) |
    | Adelie | 152 | 151 | 3701 | 3700 |
    | Gentoo | 124 | 123 | 5076 | 5000 |
    | Chinstrap | 68 | 68 | 3733 | 3700 |
    ```

    Now put the table where a report can use it, without a hand touching a number. In your own
    project the `output/` folder already exists; the first line makes it if it does not, and does
    nothing if it does.

    ```r
    dir.create(here::here("output"), showWarnings = FALSE)

    write_csv(
      mass_by_species,
      here::here("output", "mass_by_species.csv")
    )

    readLines(here::here("output", "mass_by_species.csv"))
    ```

    ```output
    [1] "species,n_rows,n_mass,mean_g,sd_g,median_g,iqr_g"
    [2] "Adelie,152,151,3700.662251655629,458.5661259101348,3700,650"
    [3] "Gentoo,124,123,5076.016260162602,504.11623665709163,5000,800"
    [4] "Chinstrap,68,68,3733.0882352941176,384.3350813871914,3700,462.5"
    ```

    The file holds the full numbers, not the rounded ones on the screen. A report that quotes the
    Adelie mean takes it from this file. If a corrected body mass arrives next month, you rerun the
    script, the file changes, and the report's number can be checked against it.
  analogy_breaks_when: |
    The table describes the {{n:penguins_rows}} rows of this file: penguins measured on three islands in three
    seasons. It is not a figure for all penguins of these species, and the file's documentation
    makes no such claim.

    Leaving out missing values is a choice. Here two body masses out of {{n:penguins_rows}} are missing, and the
    choice barely matters. When a quarter of the values are missing, the mean of the rest may
    describe a different group of penguins, or patients, from the one you meant. The section on
    missing values says how to count and report them.
- body: |
    Here is a trap that catches people moving between Book 0 and R. Take nine made-up heights of
    children, in centimetres, already in order: 121, 125, 127, 128, 132, 133, 134, 138, 141.

    Work the quartiles by Book 0's method first. There are nine values, an odd count, so leave the
    middle one, 132, out of both halves. The lower half is 121, 125, 127, 128. Its median, the
    first quartile, is halfway between 125 and 127: 126. The upper half is 133, 134, 138, 141.
    Its median, the third quartile, is halfway between 134 and 138: 136. The interquartile range
    is 136 minus 126, which is 10.

    ```working
    first quartile = (125 + 127) ÷ 2 = 126
    third quartile = (134 + 138) ÷ 2 = 136
    interquartile range = 136 - 126 = 10
    ```

    Now ask R:

    ```r
    heights_cm <- c(121, 125, 127, 128, 132, 133, 134, 138, 141)

    quantile(heights_cm)
    IQR(heights_cm)
    ```

    ```output
      0%  25%  50%  75% 100%
     121  127  132  134  141
    [1] 7
    ```

    R says the first quartile is 127, the third is 134, and the interquartile range is 7. Your
    hand calculation said 126, 136 and 10. The median, 132, agrees.

    Neither of you made a mistake. There is more than one rule for where a quartile sits when it
    falls between two values. The help page for `quantile()` lists nine, and R uses type 7 unless
    told otherwise. The same page says SPSS uses type 6. Ask for type 6:

    ```r
    quantile(heights_cm, type = 6)
    ```

    ```output
      0%  25%  50%  75% 100%
     121  126  132  136  141
    ```

    Type 6 gives 126 and 136, the same as Book 0's method on these nine values. That agreement
    is a property of this set of numbers. It is not a rule that the two methods always agree.

    ```table
    | Method | First quartile (cm) | Third quartile (cm) | Interquartile range (cm) |
    | Book 0, median of each half | 126 | 136 | 10 |
    | R, type 7 (the default) | 127 | 134 | 7 |
    | R, type 6 (said to be SPSS's) | 126 | 136 | 10 |
    ```

    So when a colleague's SPSS table and your R output disagree on a quartile, check the rule
    before you check the data. And in your own methods section, name the software and the rule.
  analogy_breaks_when: |
    The nine heights are made up; they show the arithmetic and describe no children.

    With hundreds of values the rules land very close together, because neighbouring values in a
    big sorted list are close. The disagreement is largest with few values, which is exactly when
    a thesis table is most likely to be checked by hand.
- body: |
    Now group by two columns at once: species and sex. Continue in the same session.

    ```r
    penguins |>
      group_by(species, Sex) |>
      summarise(n = n())
    ```

    ```output
    `summarise()` has grouped output by 'species'. You can override using
    the `.groups` argument.
    # A tibble: 8 × 3
    # Groups:   species [3]
      species   Sex        n
      <chr>     <chr>  <int>
    1 Adelie    FEMALE    73
    2 Adelie    MALE      73
    3 Adelie    <NA>       6
    4 Chinstrap FEMALE    34
    5 Chinstrap MALE      34
    6 Gentoo    FEMALE    58
    7 Gentoo    MALE      61
    8 Gentoo    <NA>       5
    ```

    Eight rows, not six. Two species have penguins whose sex was not recorded, and `NA` became a
    group of its own: 6 Adelie and 5 Gentoo. A summary never hides a missing category. It prints
    it, and you decide what to say about it.

    Read the message too. `summarise()` removed only the last grouping column, `Sex`, so the
    result is still grouped by species. The line `# Groups: species [3]` says so. Here is what that
    does to the next step. Suppose you want each group's share of all the penguins:

    ```r
    penguins |>
      group_by(species, Sex) |>
      summarise(n = n()) |>
      mutate(pct = 100 * n / sum(n))
    ```

    ```output
    `summarise()` has grouped output by 'species'. You can override using
    the `.groups` argument.
    # A tibble: 8 × 4
    # Groups:   species [3]
      species   Sex        n   pct
      <chr>     <chr>  <int> <dbl>
    1 Adelie    FEMALE    73 48.0
    2 Adelie    MALE      73 48.0
    3 Adelie    <NA>       6  3.95
    4 Chinstrap FEMALE    34 50
    5 Chinstrap MALE      34 50
    6 Gentoo    FEMALE    58 46.8
    7 Gentoo    MALE      61 49.2
    8 Gentoo    <NA>       5  4.03
    ```

    The first row says 48.0% for Adelie females. But 73 is not 48% of {{n:penguins_rows}}. Because the result was
    still grouped by species, `sum(n)` added up within each species: 73 divided by {{n:penguins_adelie}}, not by
    {{n:penguins_rows}}. The code ran, gave tidy numbers, and answered a different question.

    Group for one step only with `.by`, and the result comes back ungrouped:

    ```r
    penguins |>
      summarise(n = n(), .by = c(species, Sex)) |>
      mutate(pct = 100 * n / sum(n))
    ```

    ```output
    # A tibble: 8 × 4
      species   Sex        n   pct
      <chr>     <chr>  <int> <dbl>
    1 Adelie    MALE      73 21.2
    2 Adelie    FEMALE    73 21.2
    3 Adelie    <NA>       6  1.74
    4 Gentoo    FEMALE    58 16.9
    5 Gentoo    MALE      61 17.7
    6 Gentoo    <NA>       5  1.45
    7 Chinstrap FEMALE    34  9.88
    8 Chinstrap MALE      34  9.88
    ```

    Now 73 Adelie females are 21.2% of all {{n:penguins_rows}}. The rows come in the order each group first
    appears in the file, where `group_by()` sorted them. If you do use `group_by()`, end the
    pipe with `ungroup()` before anything else touches the result.

    For counts alone there is a shorter way, met in the section on categories. `count(species,
    Sex)` gives the same eight rows and counts as the first pipe above, and an ungrouped result.
  analogy_breaks_when: |
    The percentages describe the rows of this file. Whether 21.2% of all penguins on these islands
    are female Adelies is a question about how the birds were chosen for study, which no summary
    can answer.

    The leftover grouping trap needs two grouping columns. With one column, `summarise()` removes
    it and the result comes back ungrouped, so the trap waits until the day you add a second.
must_know:
- point: |
    Print the count beside every summary, and print the right count. `n()` counts rows. With
    `na.rm = TRUE`, a mean uses only the rows that have a value, so count those with
    `sum(!is.na(x))`. A table that prints {{n:penguins_adelie}} beside a mean of 151 values is wrong by one, and the
    reader cannot see it.
  kind: trap
  bearing: methodological
- point: |
    The error is to think `na.rm = TRUE` fixes missing values. It only leaves them out, without a
    word. Report how many were left out, in every table.
  kind: misconception
  bearing: methodological
- point: |
    Check the shape of the result before reading a number. One row per group is what you asked
    for. If there are more rows than groups you expected, an extra grouping column, or an `NA`
    group, is in there.
  kind: move
  bearing: methodological
- point: |
    After `group_by()` on two columns, `summarise()` leaves the result grouped by the first. A
    percentage worked out next is a percentage within each group, not of the total. Use `.by`,
    or end with `ungroup()`.
  kind: trap
  bearing: methodological
- point: |
    Quartiles from R, SPSS and Book 0's hand method can differ on the same small set of numbers.
    When two tables disagree on a quartile, ask which rule each used before you suspect the data.
    Name your software and rule in your methods.
  kind: consequence
  bearing: methodological
  refs:
  - rdocs_s52r1_stats
- point: |
    Write every summary table to `output/` with code. A number copied off the screen into a
    thesis cannot be traced back. It also stays wrong when the data are corrected.
  kind: move
  bearing: methodological
  refs:
  - sandve_2013
- point: |
    When a trainee shows you a table of means, ask first for the count in each row and for how
    many values were missing. Then ask for the median beside the mean, as Book 0 taught.
  kind: move
  bearing: teaching
- point: |
    A summary describes the rows in your file. It is not an estimate for any population unless the
    rows were chosen to stand for one. For a survey, it also needs the survey's sample weights,
    which a later book teaches. No line of `summarise()` can supply either.
  kind: boundary
  bearing: methodological
exercises:
- type: calculation
  prompt: |
    Add to your penguin script a summary of flipper length by island. Give, for each island, the
