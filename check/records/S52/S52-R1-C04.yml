must_know:
- point: |
    The error is to believe a column that looks like numbers holds numbers. One text value, such
    as "71 kg" or "not weighed", turns the whole vector into text, and `mean()` then returns `NA`.
    Before you compute anything, print the vector and look for quotation marks, or ask
    `typeof()`.
  kind: misconception
  bearing: methodological
- point: |
    `x == NA` never finds a missing value. It returns `NA` for every element. Use `is.na(x)`,
    and refuse any count of missing values that was made with `==`.
  kind: trap
  bearing: methodological
- point: |
    When a sum or a mean comes back `NA`, R is telling you a value is missing. Do not make the
    `NA` go away by writing a 0 in its place. Zero is a weight of nothing, and it pulls the mean
    down. Find out how many values are missing first.
  kind: consequence
  bearing: methodological
- point: |
    "NA" typed inside quotation marks is the two letters N and A, not a missing value.
    `is.na("NA")` is `FALSE`, and the vector it sits in has become text.
  kind: trap
  bearing: methodological
- point: |
    R prints fewer digits than it stores, and stores most decimals only approximately. Never
    test two decimals with `==`. Report a number to the precision of the measurement behind it,
    whatever R prints.
  kind: move
  bearing: methodological
- point: |
    `is.na()` finds only R's own `NA`. Suppose a raw file writes a missing weight as -99 or 999.
    To R, that is a weight of -99 or 999, and it goes into every mean until you tell R what the
    code means. A later section shows how to declare such codes when you read the file.
  kind: boundary
  bearing: methodological
- point: |
    When a trainee's mean comes back as `NA`, do not fix it for them. Ask them to print the
    vector and point to the quotation marks or the `NA`. The habit of looking is the thing
    worth teaching.
  kind: move
  bearing: teaching
exercises:
- type: critique
  prompt: |
    A made-up thesis appendix shows this code and says "the mean haemoglobin of the five women
    could not be calculated because R gave an error".

    ```r
    hb_g_dl <- c(11.2, 12.5, "9.8*", 13.1, 10.4)
    mean(hb_g_dl)
    ```

    ```output
    [1] NA
    Warning message:
    In mean.default(hb_g_dl) : argument is not numeric or logical: returning NA
    ```

    Haemoglobin is measured in grams per decilitre (g/dL). Say what actually happened, what the
    asterisk probably was, and how the analysis should go on without editing anything by hand.
  answer: |
    Run it:

    ```r
    hb_g_dl <- c(11.2, 12.5, "9.8*", 13.1, 10.4)
    mean(hb_g_dl)
    ```

    ```output
    [1] NA
    Warning message:
    In mean.default(hb_g_dl) : argument is not numeric or logical: returning NA
    ```

    R did not give an error. It gave `NA` and a warning. The appendix misreports what happened,
    so start by printing the vector:

    ```r
    hb_g_dl
    ```

    ```output
    [1] "11.2" "12.5" "9.8*" "13.1" "10.4"
    ```

    Every value is in quotation marks. The entry "9.8*" is text, so the whole vector became
    text, and `mean()` cannot average text.

    The asterisk was probably a mark copied from the record, such as a note that the value was
    rechecked. Only the person with the record can say. The analysis should go on by writing the
    decision as code, with a comment giving the reason, so a reader can see it. For example, if the
    record shows 9.8 g/dL is the value:

    ```r
    # 9.8* in the register: asterisk marks a recheck; the value is 9.8 g/dL
    hb_g_dl <- c(11.2, 12.5, 9.8, 13.1, 10.4)
    mean(hb_g_dl)
    ```

    ```output
    [1] 11.4
    ```

    The mean of the five values is 11.4 g/dL. Suppose instead the asterisk meant the value was
    rejected. Then the line would put `NA` there, and the report would give the mean of four women.
  skill_ref: S52-R1-K02
- type: retrieval
  prompt: |
    Without looking back, name the three types of vector this section uses. Say which one wins
    when they are mixed in `c()`. Then give the line that finds the missing values in a vector `x`.
  answer: |
    Numeric (numbers), character (text) and logical (`TRUE` or `FALSE`). When they are mixed,
    everything becomes the highest type in the order logical, numeric, character, so one piece of
    text makes the whole vector text. The missing values are found with `is.na(x)`, never with
    `x == NA`.
quantitative: true
practice_note: |
  Eleven problems: the section has four moves (build and convert a vector, predict the type
  after mixing, see NA spread, find and drop NA with is.na and brackets), and each move needs a
  mechanical try before it is used on the penguin weights. Three diagnostics, because each of
  the three traps (text compared as text, "NA" in quotes, x == NA) runs without an error.
practice:
- level: 1
  prompt: |
    Make a vector called `height_cm` holding the heights 98, 102.5 and 110 cm. Then print the
    same heights in metres.
  answer: |
    ```r
    height_cm <- c(98, 102.5, 110)
    height_cm / 100
    ```

    ```output
    [1] 0.980 1.025 1.100
    ```

    Each height is divided by 100, one at a time.
- level: 2
  prompt: |
    Before running them, say what type of vector each line makes and what it prints. Then run
    them and check.

    ```r norun
    c(1, TRUE, "no")
    c(0, TRUE, FALSE)
    ```
  answer: |
    ```r
    c(1, TRUE, "no")
    c(0, TRUE, FALSE)
    ```

    ```output
    [1] "1"    "TRUE" "no"
    [1] 0 1 0
    ```

    The first holds text, so everything becomes text: the number 1 becomes "1" and `TRUE`
    becomes "TRUE". The second holds a number and two logical values. Numeric is higher than
    logical, so `TRUE` becomes 1 and `FALSE` becomes 0.

    ```r
    typeof(c(1, TRUE, "no"))
    typeof(c(0, TRUE, FALSE))
    ```

    ```output
    [1] "character"
    [1] "double"
    ```

    "double" is R's name for its usual kind of number.
- level: 3
  prompt: |
    Before running them, say what each line prints.

    ```r norun
    c(2, NA, 5) + 1
    c(2, NA, 5) > 3
    ```
  answer: |
    ```r
    c(2, NA, 5) + 1
    c(2, NA, 5) > 3
    ```

    ```output
    [1]  3 NA  6
    [1] FALSE    NA  TRUE
    ```

    Adding 1 works on each element. The missing value stays missing, because 1 more than an
    unknown number is still unknown. The comparison gives `FALSE`, `NA`, `TRUE`: R cannot say
    whether an unknown number is more than 3.
- level: 4
  prompt: |
    The column "Flipper Length (mm)" in `penguins_raw.csv` gives flipper lengths in millimetres.
    Its first ten values are 181, 186, 195, a missing value, 193, 190, 181, 195, 193 and 190. Make a vector of them with a
    name that carries the unit. Print them in centimetres, and say which penguins have a flipper
    longer than 190 mm.
  answer: |
    ```r
    flipper_mm <- c(181, 186, 195, NA, 193, 190, 181, 195, 193, 190)
    flipper_mm / 10
    flipper_mm > 190
    ```

    ```output
     [1] 18.1 18.6 19.5   NA 19.3 19.0 18.1 19.5 19.3 19.0
     [1] FALSE FALSE  TRUE    NA  TRUE FALSE FALSE  TRUE  TRUE FALSE
    ```

    There are 10 mm in a centimetre, so dividing by 10 gives centimetres: penguin 1's flipper is
    18.1 cm. Penguins 3, 5, 8 and 9 have flippers longer than 190 mm. Penguins 6 and 10 measure
    exactly 190 mm, which is not longer, so they get `FALSE`. Penguin 4 gets `NA`: its length is
    not in the file.
- level: 5
  prompt: |
    The first ten body masses in `penguins_raw.csv` are 3750, 3800, 3250, a missing value, 3450,
    3650, 3625, 4675, 3475 and 4250 g. Print the eighth penguin's body mass in kilograms. Then
    print the body masses of the first three penguins in grams.
  answer: |
    ```r
    body_mass_g <- c(3750, 3800, 3250, NA, 3450, 3650, 3625, 4675, 3475, 4250)
    body_mass_g[8] / 1000
    body_mass_g[1:3]
    ```

    ```output
    [1] 4.675
    [1] 3750 3800 3250
    ```

    The eighth penguin weighs 4.675 kg. Inside square brackets, `1:3` means positions 1, 2 and
    3, so the second line gives the first three body masses, in grams.
- level: 6
  prompt: |
    Using the same ten body masses, make a vector of only the known body masses, in kilograms,
    and count how many there are.
  answer: |
    ```r
    body_mass_g <- c(3750, 3800, 3250, NA, 3450, 3650, 3625, 4675, 3475, 4250)
    known_kg <- body_mass_g[!is.na(body_mass_g)] / 1000
    known_kg
    length(known_kg)
    ```

    ```output
    [1] 3.750 3.800 3.250 3.450 3.650 3.625 4.675 3.475 4.250
    [1] 9
    ```

    `is.na()` marks the missing value, `!` turns that round to mark the known ones, and the
    square brackets keep them. Nine of the ten body masses are known.
- level: 7
  prompt: |
    A colleague wants the tallest child's height from a made-up school register. Their code
    and its output are below. They report "the tallest child is 98 cm". Find what broke, and
    say why the answer looks reasonable.

    ```r
    height_cm <- c("98", "102", "110")
    max(height_cm)
    ```

    ```output
    [1] "98"
    ```
  answer: |
    The heights were typed in quotation marks, so they are text, not numbers. `max()` of text
    gives the value that comes last in alphabetical order. Text is compared one character at a
    time, and "9" comes after "1", so "98" comes after "102" and "110".

    ```r
    height_cm <- c("98", "102", "110")
    typeof(height_cm)
    height_cm <- c(98, 102, 110)
    max(height_cm)
    ```

    ```output
    [1] "character"
    [1] 110
    ```

    The tallest child is 110 cm. The wrong answer looks reasonable because 98 cm is a perfectly
    possible height, and nothing in the output says an error happened. The quotation marks
    around "98" in the output are the only clue.
- level: 7
  prompt: |
    A colleague checks a made-up list of six BMI values, in kg/m^2, for missing entries. Their
    code and output are below. They write "no BMI values are missing". Find what broke.

    ```r
    bmi <- c(22.4, 31.0, NA, 27.9, NA, 19.6)
    bmi == NA
    ```

    ```output
    [1] NA NA NA NA NA NA
    ```
  answer: |
    `bmi == NA` asks whether each value equals an unknown value. The answer is always unknown,
    so every element is `NA`. The colleague read "no `TRUE`" as "nothing missing". The test that
    can answer is `is.na()`:

    ```r
    bmi <- c(22.4, 31.0, NA, 27.9, NA, 19.6)
    is.na(bmi)
    bmi[!is.na(bmi)]
    ```

    ```output
    [1] FALSE FALSE  TRUE FALSE  TRUE FALSE
    [1] 22.4 31.0 27.9 19.6
    ```

    The third and fifth values are missing, so four of the six BMI values are known. The wrong
    check looks reasonable because it runs without an error and prints something for every
    value.
- level: 8
  prompt: |
    A colleague marks which of five made-up adults have a BMI of 25 kg/m^2 or more. One BMI was
    not recorded. Their code and output are below, and they report "four of the five adults
    have a BMI of 25 or more". Find what broke, and say why it looks reasonable.

    ```r
    bmi <- c(22.1, 27.4, "NA", 30.2, 25.8)
    bmi >= 25
    ```

    ```output
    [1] FALSE  TRUE  TRUE  TRUE  TRUE
    ```
  answer: |
    The missing BMI was typed as "NA" inside quotation marks. That is the text N, A, not R's
    missing value. One text value made the whole vector text, and `>=` then compared text in
    alphabetical order. "NA" starts with a letter, which comes after every digit, so R put it
    above "25".

    ```r
    bmi <- c(22.1, 27.4, "NA", 30.2, 25.8)
    typeof(bmi)
    bmi <- c(22.1, 27.4, NA, 30.2, 25.8)
    bmi >= 25
    ```

    ```output
    [1] "character"
    [1] FALSE  TRUE    NA  TRUE  TRUE
    ```

    Now the third adult gets `NA`. Three of the four adults with a recorded BMI have a BMI of 25
    or more, and one adult is unknown. The wrong answer looks reasonable because three of its
    five answers are right, and the wrong one says `TRUE` with no warning.
- level: 9
  prompt: |
    A made-up draft report says: "Body mass was recorded for all of the first ten penguins in
    the practice file." The first ten values of "Body Mass (g)" are as in problem 5. Check the
    sentence with code. Then say what your check does not tell you.
  answer: |
    ```r
    body_mass_g <- c(3750, 3800, 3250, NA, 3450, 3650, 3625, 4675, 3475, 4250)
    is.na(body_mass_g)
    length(body_mass_g[is.na(body_mass_g)])
    ```

    ```output
     [1] FALSE FALSE FALSE  TRUE FALSE FALSE FALSE FALSE FALSE FALSE
    [1] 1
    ```

    One of the ten is missing, the fourth, so the sentence is wrong. A corrected sentence: "Body
    mass was recorded for 9 of the first 10 penguins."

    What the check does not tell you:

    - Why the fourth body mass is missing. The file records only that it is not there.
    - Anything about the other 334 rows. Across the whole column, the file has 2 missing body
      masses.
    - Whether the nine recorded values are correct. A value can be present and wrong.
  refs:
  - horst_2020_palmerpenguins
- level: 10
  prompt: |
    In a made-up meeting, someone says: "Of the first ten penguins in the file, two weighed more
    than 4000 g." The first ten body masses are as in problem 5. Check the claim with code, and
    then say what the result does not establish.
  answer: |
    A first try picks the body masses above 4000 g:

    ```r
    body_mass_g <- c(3750, 3800, 3250, NA, 3450, 3650, 3625, 4675, 3475, 4250)
    body_mass_g[body_mass_g > 4000]
    ```

    ```output
    [1]   NA 4675 4250
    ```

    Three values come back, and one is `NA`. The comparison gave `NA` for penguin 4, and square
    brackets turn an `NA` in a logical vector into an `NA` in the result. So count only the known
    values that pass the test. The symbol `&` means "and": both conditions must be `TRUE`.

    ```r
    heavy_g <- body_mass_g[!is.na(body_mass_g) & body_mass_g > 4000]
    heavy_g
    length(heavy_g)
    ```

    ```output
    [1] 4675 4250
    [1] 2
    ```

    Two penguins, 8 and 10, weigh more than 4000 g. The claim holds for the nine whose body mass
    is known.

    What it does not establish:

    - That exactly two of the ten weighed more than 4000 g. Penguin 4's body mass is unknown,
      so the true count is two or three. "Two of the ten" hides that. "Two of the nine with a
      recorded body mass" does not.
    - Anything about penguins in the rest of the file, or penguins in general.
retrieval_items:
- q: What happens when you combine a number and a piece of text in one vector with c()?
  a: Every element becomes text (character), because a vector holds one type and character is
    the highest of logical, numeric and character. The numbers are printed in quotation marks.
- q: What does R give for 5 + NA, and why?
  a: NA. The result of an operation on an unknown value cannot be known, so it is not available.
- q: Which line finds the missing values in a vector x, x == NA or is.na(x)?
  a: is.na(x). x == NA returns NA for every element and finds nothing.
- q: Does R store a number with the digits it prints?
  a: No. It prints a rounded display and stores more digits, and most decimal fractions are
    stored as a close binary approximation.
