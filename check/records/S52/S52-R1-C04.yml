simplified_explanation: |
  The last section gave a name to one value at a time. Most data come as many values of the
  same kind: the weights of every child in a class, the dates of every clinic visit. In R, a set
  of values in a row, kept in order under one name, is a vector. You build one with `c()`, which
  stands for combine:

  ```r
  height_cm <- c(152, 160.5, 171)
  height_cm
  ```

  ```output
  [1] 152.0 160.5 171.0
  ```

  The `[1]` at the start of the printed line is not part of the data. It tells you that the
  line begins with the first element. In a long vector, each new line starts with the position of
  its first value.

  A vector holds one type of value. The three you need now are numbers (numeric), text
  (character) and `TRUE` or `FALSE` (logical). R shows you which one it holds. Text is printed
  inside quotation marks:

  ```r
  sex <- c("female", "male", "female")
  sex
  ```

  ```output
  [1] "female" "male"   "female"
  ```

  Arithmetic works on the whole vector at once, element by element. Divide the heights by 100
  and every height turns into metres:

  ```r
  height_cm / 100
  ```

  ```output
  [1] 1.520 1.605 1.710
  ```

  The 100 was used three times, once for each height. R repeats a single number as often as
  the longer vector needs. That is why one line converts a thousand heights as easily as three.

  A comparison asks the same question of every element and answers `TRUE` or `FALSE` for each:

  ```r
  height_cm > 155
  ```

  ```output
  [1] FALSE  TRUE  TRUE
  ```

  Square brackets pick elements out. A number inside them is a position. A logical vector
  inside them keeps the elements where it says `TRUE`:

  ```r
  height_cm[2]
  height_cm[height_cm > 155]
  ```

  ```output
  [1] 160.5
  [1] 160.5 171.0
  ```

  Two more things will trip you up if nobody tells you, and each has its own example below.
  First, if one value in a vector is text, the whole vector becomes text. Second, R writes `NA`
  where a value is missing, and `NA` spreads: almost anything you compute from it is also `NA`.
illustrations:
- body: |
    Start with a failure. A made-up clinic register lists four adults' weights. One entry was
    written as "71 kg", unit and all. You type the four entries as written:

    ```r
    weight_kg <- c(62.5, 70.1, "71 kg", 58)
    weight_kg
    ```

    ```output
    [1] "62.5"  "70.1"  "71 kg" "58"
    ```

    Look at the printout before anything else. Every value now sits in quotation marks, even
    the three that were plain numbers. One text value made R convert the whole vector to text.
    That conversion is called coercion. R did it without a warning, because combining a number
    with text is allowed.

    Ask R which type it holds:

    ```r
    typeof(weight_kg)
    ```

    ```output
    [1] "character"
    ```

    Now ask for the average weight:

    ```r
    mean(weight_kg)
    ```

    ```output
    [1] NA
    Warning message:
    In mean.default(weight_kg) :
      argument is not numeric or logical: returning NA
    ```

    You get `NA` and a warning, not a number. Try arithmetic instead, such as converting to
    grams:

    ```r error
    weight_kg * 1000
    ```

    ```output
    Error in weight_kg * 1000 : non-numeric argument to binary operator
    ```

    That one stops with an error. Read it literally: "non-numeric argument" means one of the
    things being multiplied is not a number. It is the vector of text.

    You can ask R to turn the text back into numbers with `as.numeric()`. Watch what it does
    with the entry it cannot read:

    ```r
    as.numeric(weight_kg)
    ```

    ```output
    [1] 62.5 70.1   NA 58.0
    Warning message:
    NAs introduced by coercion
    ```

    Three numbers come back, and "71 kg" becomes `NA`, with a warning that says so. The weight
    of 71 kg is now lost from the vector. R did not guess what "71 kg" meant, and it should
    not. The person who knows it means 71 has to say so in code, where the decision can be seen:

    ```r
    weight_kg <- c(62.5, 70.1, 71, 58)
    typeof(weight_kg)
    mean(weight_kg)
    ```

    ```output
    [1] "double"
    [1] 65.4
    ```

    The four weights now average 65.4 kg.

    Here the fix was easy, because you typed the values yourself. When the data arrive in a
    file, a column in which one cell says "71 kg" or "not weighed" arrives as text in exactly
    the same way. The section on reading a raw file shows how to catch that when you read it.
  analogy_breaks_when: |
    The register and its four weights are made up. Real registers carry many kinds of stray
    text, and each needs its own decision.

    Typing a corrected value is right here only because nothing was read from a file. When the
    values come from a raw file, the correction belongs in a line of code that reads the file and
    changes the value, so the file stays as it was. Later sections build that habit.
- body: |
    Now use real values. The book's practice file, `penguins_raw.csv`, has
    {{n:penguins_rows}} rows of penguin measurements. Its column "Body Mass (g)" gives each bird's weight in grams. Here are its
    first ten values, typed in order. The fourth bird has no weight in the file, which R reads
    as `NA`:

    ```r
    body_mass_g <- c(3750, 3800, 3250, NA, 3450, 3650, 3625, 4675, 3475, 4250)
    ```

    Reading the file itself comes in a later section. The same ten numbers come out.

    Convert to kilograms by dividing by 1000. Each value is divided, and the missing one stays
    missing:

    ```r
    body_mass_kg <- body_mass_g / 1000
    body_mass_kg
    ```

    ```output
     [1] 3.750 3.800 3.250    NA 3.450 3.650 3.625 4.675 3.475 4.250
    ```

    ```table
    | penguin | body mass (kg) |
    | 1 | 3.750 |
    | 2 | 3.800 |
    | 3 | 3.250 |
    | 5 | 3.450 |
    | 6 | 3.650 |
    | 7 | 3.625 |
    | 8 | 4.675 |
    | 9 | 3.475 |
    | 10 | 4.250 |
    ```

    The table copies the nine values R printed. Penguin 4 has no row, because R has no weight
    for it.

    Ask which birds weigh more than 4000 g:

    ```r
    body_mass_g > 4000
    ```

    ```output
     [1] FALSE FALSE FALSE    NA FALSE FALSE FALSE  TRUE FALSE  TRUE
    ```

    Penguins 8 and 10 do. Penguin 4 gets `NA`, not `FALSE`. R does not know its weight, so it
    does not know the answer. Add the ten weights and the same thing happens to the total:

    ```r
    sum(body_mass_g)
    ```

    ```output
    [1] NA
    ```

    One missing value made the whole sum unknown. That is the rule working as it should. A sum
    that quietly left penguin 4 out would look like the total of ten birds and be the total of
    nine.

    Now the trap. To find the missing value, the natural thing to type is "equals NA":

    ```r
    body_mass_g == NA
    ```

    ```output
     [1] NA NA NA NA NA NA NA NA NA NA
    ```

    Every answer is `NA`, so this finds nothing. Asking whether a value equals an unknown value
    can only give "unknown". The question R can answer is "is this value missing?", and
    `is.na()` asks it:

    ```r
    is.na(body_mass_g)
    ```

    ```output
     [1] FALSE FALSE FALSE  TRUE FALSE FALSE FALSE FALSE FALSE FALSE
    ```

    Only the fourth is `TRUE`. Put an exclamation mark, `!`, in front to turn each `TRUE` into
    `FALSE` and each `FALSE` into `TRUE`. Inside square brackets, that keeps the values that are
    not missing:

    ```r
    known_g <- body_mass_g[!is.na(body_mass_g)]
    known_g
    length(known_g)
    ```

    ```output
    [1] 3750 3800 3250 3450 3650 3625 4675 3475 4250
    [1] 9
    ```

    Nine weights are known. `length()` counts the elements of a vector.

    Last, a warning about what you see. R prints a number rounded for display. It stores more
    digits than it prints. Body mass index (BMI) is weight in kg divided by the square of height
    in metres, in kg/m^2. Work out one, for a made-up adult of 70.1 kg and 1.68 m:

    ```r
    bmi <- 70.1 / 1.68^2
    bmi
    bmi * 1000
    ```

    ```output
    [1] 24.83702
    [1] 24837.02
    ```

    The first print shows 24.83702. Multiplying by 1000 shows digits that were there all along
    and were not printed. Your Book 0 rule still holds: the digits on the display are not the
    precision of the measurement. A weight to one decimal place does not give a BMI to five.

    The stored value is not exact either. R keeps most decimal fractions as a close
    approximation in binary, so a test of exact equality between two decimals can fail:

    ```r
    0.1 + 0.2 == 0.3
    ```

    ```output
    [1] FALSE
    ```

    The two sides differ by a tiny amount, far smaller than anything you measure. So never test
    decimals for exact equality. Round them to the precision you care
    about first, which the next section shows how to do.
  analogy_breaks_when: |
    The ten weights are real values from the practice file, but they are the first ten rows
    only. Nothing here describes the other 334 penguins, or penguins in general.

    The BMI example uses one made-up adult. The digits it shows describe how R stores and
    prints a number, not how precise a weighing scale is.
