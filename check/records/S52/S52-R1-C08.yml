- level: 7
  prompt: |
    A resident tries to find the average body mass. Run her code. Find what broke and say why the
    code looked right to her.

    ```r
    library(readr)
    library(here)
    penguins_raw <- read_csv(here("data-raw", "penguins_raw.csv"), show_col_types = FALSE)
    ```

    ```output
    here() starts at ~/project
    ```

    ```r error
    mean(penguins_raw$Body Mass (g), na.rm = TRUE)
    ```

    ```output
    Error: <text>:1:24: unexpected symbol
    1: mean(penguins_raw$Body Mass
                               ^
    ```

  answer: |
    The last line broke. The column name `Body Mass (g)` has spaces and brackets, so R reads
    `penguins_raw$Body` and then meets the word `Mass`, which it cannot place. It stops before running
    anything on that line.

    It looked right because the name is typed exactly as it appears in the file. The repair is
    backticks round the whole name:

    ```r
    mean(penguins_raw$`Body Mass (g)`, na.rm = TRUE)
    ```

    ```output
    [1] 4201.754
    ```

    The mean is {{n:penguins_mass_mean}} grams.
- level: 8
  prompt: |
    A camp register is entered with blood pressure as text. The data are made up. A resident runs
    this code to find the average blood pressure and writes "BP data not available" in her report.
    Run it. Find what broke, and say why her conclusion looks reasonable.

    ```r
    camp <- tibble::tibble(
      child_id = c("K1", "K2", "K3", "K4"),
      bp = c("102/64", "108/70", "96/60", "110/72")
    )
    mean(camp$bp)
    ```

    ```output
    [1] NA
    Warning message:
    In mean.default(camp$bp) : argument is not numeric or logical: returning NA
    ```
  answer: |
    Nothing is missing. The `bp` column holds two numbers and a slash in each cell, so it is text,
    and `mean()` cannot average text. It warns, and returns `NA`. `NA` usually means "not
    available", so "data not available" reads as if R said so. The warning says something else:
    the argument is not numeric.

    The repair is in the layout, not in the analysis. Store systolic and diastolic pressure in two
    columns:

    ```r
    camp <- tibble::tibble(
      child_id = c("K1", "K2", "K3", "K4"),
      systolic_mmhg = c(102, 108, 96, 110),
      diastolic_mmhg = c(64, 70, 60, 72)
    )
    mean(camp$systolic_mmhg)
    mean(camp$diastolic_mmhg)
    ```

    ```output
    [1] 104
    [1] 66.5
    ```

    ```working
    102 + 108 + 96 + 110 = 416
    416 ÷ 4 = 104
    64 + 70 + 60 + 72 = 266
    266 ÷ 4 = 66.5
    ```

    When the raw file arrives with "102/64" in it, the split is done in code, and the raw file
    is left as it came.
- level: 9
  prompt: |
    A made-up thesis draft says: "Weight was recorded at three visits for each of the three
    children (Table 2)." Table 2 has columns `child`, `visit_1`, `visit_2` and `visit_3`. The
    weights are, in kilograms: child P1 18.2, 18.6, 19.1; P2 20.4, 20.9, 21.0; P3 17.5, 17.8, 18.4.
    Build the tidy table, check its number of rows against the sentence, and find the mean weight.
    Then say what your table does not establish.
  answer: |
    One row per child per visit:

    ```r
    library(tibble)
    weights <- tibble(
      child_id = c("P1", "P1", "P1", "P2", "P2", "P2", "P3", "P3", "P3"),
      visit = c(1, 2, 3, 1, 2, 3, 1, 2, 3),
      weight_kg = c(18.2, 18.6, 19.1, 20.4, 20.9, 21.0, 17.5, 17.8, 18.4)
    )
    nrow(weights)
    mean(weights$weight_kg)
    ```

    ```output
    [1] 9
    [1] 19.1
    ```

    Three children times three visits is nine observations, and the table has nine rows, so it
    matches the sentence.

    ```working
    3 × 3 = 9
    18.2 + 18.6 + 19.1 + 20.4 + 20.9 + 21.0 + 17.5 + 17.8 + 18.4 = 171.9
    171.9 ÷ 9 = 19.1
    ```

    What the table does not establish:

    - That the visits were at the same times for each child. The visit number is an order, not a
      date.
    - Anything about children in general. The three children are made up, and three real
      children would describe only themselves.
    - That the mean of nine weights means anything. It mixes three children at three times. The
      tidy shape makes it easy to compute; it does not make it a sensible summary.
- level: 10
  prompt: |
    In a meeting someone says: "The penguin file has data on {{n:penguins_rows}} penguins." Decide what to compute
    to test the claim, compute it, and say what your answer does not establish.
  answer: |
    The claim treats one row as one penguin. Test that by counting rows, then counting what might
    identify a bird.

    ```r
    library(readr)
    library(here)
    penguins_raw <- read_csv(here("data-raw", "penguins_raw.csv"), show_col_types = FALSE)
    nrow(penguins_raw)
    length(unique(penguins_raw$`Individual ID`))
    length(unique(paste(penguins_raw$Species, penguins_raw$Island, penguins_raw$`Individual ID`)))
    ```

    ```output
    here() starts at ~/project
    [1] 344
    [1] 190
    [1] 304
    ```

    `paste()` joins the three columns into one piece of text per row. The species, the island and
    the ID are written one after another. `unique()` then keeps each different combination once.

    There are {{n:penguins_rows}} rows, {{n:penguins_ids}} different IDs, and 304 different combinations of
    species, island and ID. So "{{n:penguins_rows}} penguins" is wrong if the same bird can appear on more than one
    expedition. "{{n:penguins_ids}} penguins" is wrong too, because one ID can name birds of two species.

    What the answer does not establish: the number of birds. Suppose species, island and ID
    together always name one bird, and a bird keeps its ID from one expedition to the next. Then
    there were 304 birds. Neither is stated in the file or on its help page. Say "{{n:penguins_rows}} nesting observations", which
    the file supports, and stop there.
