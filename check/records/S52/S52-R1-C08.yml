  - horst_2020_palmerpenguins
retrieval_items:
- q: State the three rules of tidy data as Wickham (2014) gives them.
  a: Each variable forms a column. Each observation forms a row. Each type of observational unit forms a table.
- q: What must be true of the columns of a data frame?
  a: Each column is a vector, all the values within one column share one type, and every column has the same number of values, so they line up into rows.
- q: Name three common untidy shapes.
  a: Values used as column names (weight at visit 1, 2, 3 in three columns); two variables in one column or cell (blood pressure as "104/66"); two kinds of unit in one table (child facts repeated on every visit row).
- q: What are the three meanings of "variable" in this book?
  a: A letter standing for a number (Book 0), the name of an object in R, and a column of a data frame holding everything measured about one attribute.
