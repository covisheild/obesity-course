- level: 7
  prompt: |
    A colleague makes a factor from a made-up register and reports: "2 of the 6 patients were
    female."

    ```r
    library(dplyr)

    register <- tibble(sex = c("female", "Female", "male", "female", "Female ", "male"))

    register |>
      mutate(sex = factor(sex, levels = c("female", "male"))) |>
      count(sex)
    ```

    ```output

    Attaching package: ‘dplyr’

    The following objects are masked from ‘package:stats’:

        filter, lag

    The following objects are masked from ‘package:base’:

        intersect, setdiff, setequal, union

    # A tibble: 3 × 2
      sex        n
      <fct>  <int>
    1 female     2
    2 male       2
    3 <NA>       2
    ```

    Find what broke, and why the report looks reasonable.
  answer: |
    Two "Female" values have a capital letter, and one also has a space at the end. Neither
    matches the level "female", so `factor()` turned both into `NA` without a warning. Two
    females became missing, and the colleague read only the female row.

    Clean the text first:

    ```r
    library(stringr)

    register |>
      mutate(sex = factor(str_to_lower(str_trim(sex)), levels = c("female", "male"))) |>
      count(sex)
    ```

    ```output
    # A tibble: 2 × 2
      sex        n
      <fct>  <int>
    1 female     4
    2 male       2
    ```

    4 of the 6 were female.

    Why the wrong report looks reasonable: the count printed a female row and a male row, the
    two categories that were expected. The `NA` row was below them, and nobody asked why a
    register with no gaps had two missing values.
- level: 8
  prompt: |
    A colleague shortens the species names in the penguin file:

    ```r
