    Adelie 152, Chinstrap 68, Gentoo 124.

    Why the wrong conclusion looks reasonable: the counts were right and only a label was long, so
    it looked like a cosmetic problem. It was a typing error that the warning had already named.
- level: 8
  prompt: |
    A made-up study's data dictionary says sex is coded 1 = male, 2 = female. A resident writes:

    ```r
    library(dplyr)
    library(forcats)

    study <- tibble(sex_code = c(2, 2, 1, 2, 1, 2, 2))

    study |>
      mutate(sex = fct_recode(as.character(sex_code), female = "1", male = "2")) |>
      count(sex)
    ```

    ```output

    Attaching package: ‘dplyr’

    The following objects are masked from ‘package:stats’:

        filter, lag

    The following objects are masked from ‘package:base’:

        intersect, setdiff, setequal, union

    # A tibble: 2 × 2
      sex        n
      <fct>  <int>
    1 female     2
    2 male       5
    ```

    Their results say "5 of the 7 participants were male". Find what broke.
  answer: |
    The labels are swapped. The dictionary says 1 is male, and the code says 1 is female. Every
    participant has the wrong label, and the code ran without a warning, because R has no way to
    know what the codes mean.

    ```r
    study |>
      mutate(sex = fct_recode(as.character(sex_code), male = "1", female = "2")) |>
      count(sex)
    ```

    ```output
    # A tibble: 2 × 2
      sex        n
      <fct>  <int>
    1 male       2
    2 female     5
    ```

    5 of the 7 were female and 2 were male.

    Why the wrong answer looks reasonable: the code is tidy and the counts add up. A swap of labels
    changes no total. Only a line-by-line check against the dictionary catches it, so copy the
    labels from the dictionary into a comment beside the line.
