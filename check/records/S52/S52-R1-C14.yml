      <chr>                                     <chr>  <int>
    1 Adelie Penguin (Pygoscelis adeliae)       FEMALE    73
    2 Adelie Penguin (Pygoscelis adeliae)       MALE      73
    3 Adelie Penguin (Pygoscelis adeliae)       <NA>       6
    4 Chinstrap penguin (Pygoscelis antarctica) FEMALE    34
