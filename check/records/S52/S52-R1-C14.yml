- level: 10
  prompt: |
    In a made-up meeting, someone says: "The penguin data show that Gentoo penguins live only on
    Biscoe." Turn the claim into a count, run it, and say what the result does and does not
    establish.
  answer: |
    ```r
    library(readr)
    library(dplyr)
    library(forcats)

    penguins_raw <- read_csv(
      here::here("data-raw", "penguins_raw.csv"),
      show_col_types = FALSE
    )

    penguins_raw |>
      mutate(island = factor(Island)) |>
      filter(Species == "Gentoo penguin (Pygoscelis papua)") |>
      count(island, .drop = FALSE)
    ```

    ```output

    Attaching package: ‘dplyr’

    The following objects are masked from ‘package:stats’:

        filter, lag

    The following objects are masked from ‘package:base’:

        intersect, setdiff, setequal, union

    # A tibble: 3 × 2
      island        n
      <fct>     <int>
    1 Biscoe      124
    2 Dream         0
    3 Torgersen     0
    ```

    All 124 Gentoo rows are from Biscoe, with 0 from Dream and 0 from Torgersen. Making the island
    a factor first, with `.drop = FALSE`, keeps the zeros in view.

    What it establishes: in this file, every Gentoo row was recorded on Biscoe.

    What it does not establish:

    - Where Gentoo penguins live. The file covers three islands near one research station, and
      only the nests the study chose to sample. A zero means none was recorded, not none exists.
    - Why. Whether the study went looking for Gentoo on Dream and Torgersen, the file does not say.
    - The claim in the meeting moved from "were recorded only on" to "live only on". That move is
      the error.
  refs:
  - horst_2020_palmerpenguins
retrieval_items:
- q: What is a factor, in one sentence?
  a: A category column that stores each value together with its levels, the list of allowed
    categories in a set order.
- q: What does fct_recode(x, female = "1") do?
  a: It renames the level "1" to "female". The new name goes on the left and the old one on the
    right; levels not mentioned are left as they are.
- q: Why should you never take the mean of a numeric category code?
  a: The numbers are labels, not amounts. Their mean depends on which numbers were chosen as codes
    and describes nobody.
- q: What does .drop = FALSE add to a count() of factors?
  a: The combinations of levels that never occur, each with a count of 0.
