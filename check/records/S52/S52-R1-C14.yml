    168 MALE and 165 FEMALE make 333 with sex recorded, and 11 more have none. The sentence
    matches the file. 168 of 333 is 50.5 per cent.

    What it does not establish:

    - That the colony is about half male. The rows are nesting observations of birds that were
      sampled, not a count of every penguin.
    - Anything about the 11 penguins with no recorded sex.
    - That each row is a different bird. The file's IDs repeat, as an earlier section showed.
