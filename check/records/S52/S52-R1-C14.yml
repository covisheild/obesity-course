simplified_explanation: |
  The last section counted what was missing. This one counts what is there, when what is there is
  a category: female or male, Biscoe or Dream, a thali or a sandwich.

  A category column has a short list of allowed values. Typed by hand, it rarely keeps to the
  list. "Male", "male " with a space at the end, and "M" are three different values to R. Each one
  becomes its own group in a count, and nobody meant three groups.

  **count()** shows you every value a column actually holds, and how many rows hold it. Run it on
  every category column before you do anything else with it. A misspelling shows up as an extra
  row.

  A **factor** is a category column that knows its list. You give the list, called the levels, and
  their order. The order then decides how a count or a table is laid out.

  Here is the trap. When you make a factor and a value is not on your list, R turns it into `NA`
  and says nothing. A misspelt "Female" quietly becomes missing. So clean the text first, with the
  tools from the last section but one, and count again after making the factor.

  Codes need the same care. A file may store sex as 1 and 2. The data dictionary says which is
  which, and **fct_recode()** writes that into the script: `female = "1"`. Never guess the codes
  from the data.

  Two counts at once, `count(species, island)`, is Book 0's two-way table, written as one row
  per pair.
illustrations:
- body: |
    Start with a column typed by hand. Here is a made-up register of six patients, with sex as the
    staff wrote it.

    ```r
    library(dplyr)
    library(stringr)
    library(forcats)

    register <- tibble(
      id = c(1, 2, 3, 4, 5, 6),
      sex = c("Male", "male ", "Female", "F", "female", "MALE")
    )
    ```

    ```output

    Attaching package: ‘dplyr’

    The following objects are masked from ‘package:stats’:

        filter, lag

    The following objects are masked from ‘package:base’:

        intersect, setdiff, setequal, union
    ```

    You want two categories, female and male. Make a factor with those two levels, and count it:

    ```r
    register |>
      mutate(sex_f = factor(sex, levels = c("female", "male"))) |>
      count(sex_f)
    ```

    ```output
    # A tibble: 2 × 2
      sex_f      n
      <fct>  <int>
    1 female     1
    2 <NA>       5
    ```

    One female, no male, and five missing. Not one value was missing in the register. `factor()`
    turned every value that did not match a level exactly into `NA`, and it gave no warning. A
    report built on this would say five patients' sex was "not recorded".

    Go back a step and count the text as it is:

    ```r
    register |>
      count(sex)
    ```

    ```output
    # A tibble: 6 × 2
      sex          n
      <chr>    <int>
    1 "F"          1
    2 "Female"     1
    3 "MALE"       1
    4 "Male"       1
    5 "female"     1
    6 "male "      1
    ```

    Six rows, six spellings, each held once. This is the count to run first, on every category
    column.

    Now clean it in steps, each into a new column. Trim the spaces and lower the case, as the
    section on making new columns did. Then rename the one code that is left, "f", with
    `fct_recode()`: the new name on the left, the old one on the right.

    ```r
    register <- register |>
      mutate(
        sex_clean = str_to_lower(str_trim(sex)),
        sex_f = fct_recode(sex_clean, female = "f"),
        sex_f = factor(sex_f, levels = c("female", "male"))
      )

    register |>
      count(sex_f)
    ```

    ```output
    # A tibble: 2 × 2
      sex_f      n
      <fct>  <int>
    1 female     3
    2 male       3
    ```

    Three female and three male, and no `NA`. The last line sets the order of the levels, so
    female comes first in every count and table, whatever order the data arrive in.
  analogy_breaks_when: |
    The six patients are made up. The spellings are the kind that hand entry produces; Broman and
    Woo's advice on data entry warns against exactly this mix of "male" and " male ".

    Lowering the case and trimming spaces catches only these slips. "Mle" or "fem" would survive
    both steps, and the final `factor()` would turn them into `NA`. The count after the factor is
    what catches them, so never skip it.
- body: |
    Now codes. Many forms store a category as a number. Here is a made-up thesis dataset of five
    students, where sex is stored as 1 or 2. The data dictionary for this made-up study says 1
    means female and 2 means male.

    ```r
    library(dplyr)
    library(forcats)

    students <- tibble(
      id = c(101, 102, 103, 104, 105),
      sex_code = c(1, 2, 2, 1, 2)
    )

    mean(students$sex_code)
    ```

    ```output
    [1] 1.6
    ```

    R gives a mean sex of 1.6. The arithmetic is right and the number means nothing: 1 and 2 are
    labels, not amounts. A numeric code invites exactly this kind of summary.

    Turn the code into a factor with the dictionary's labels. `fct_recode()` works on text, so turn
    the numbers into text first with `as.character()`. Keep the code column beside the new one.

    ```r
    students <- students |>
      mutate(
        sex = fct_recode(as.character(sex_code), female = "1", male = "2")
      )

    students

    students |>
      count(sex)
    ```

    ```output
    # A tibble: 5 × 3
         id sex_code sex
      <dbl>    <dbl> <fct>
    1   101        1 female
    2   102        2 male
    3   103        2 male
    4   104        1 female
    5   105        2 male
    # A tibble: 2 × 2
      sex        n
      <fct>  <int>
    1 female     2
    2 male       3
    ```

    Two female, three male. The column type now reads `<fct>`, a factor. Every label came from the dictionary, written once in the script, where anyone can
    check it against the dictionary.
  analogy_breaks_when: |
    The codes and their meanings are made up for this example. Another study may use 1 for male,
    or 0 and 1, or M and F. The labels in your script must come from your own data dictionary,
    never from this page or from habit.
- body: |
    Last, the penguin file. It has three category columns you will use often: species, island
    and sex. Count the islands first.

    ```r
    library(readr)
    library(dplyr)
    library(forcats)

    penguins_raw <- read_csv(
      here::here("data-raw", "penguins_raw.csv"),
      show_col_types = FALSE
    )

    penguins_raw |>
      count(Island)
    ```

    ```output
    # A tibble: 3 × 2
      Island        n
      <chr>     <int>
    1 Biscoe      168
    2 Dream       124
    3 Torgersen    52
    ```

    The column is text, so `count()` lists the islands alphabetically. R has read text as text
    since version 4.0.0. A factor is something you choose to make.

    Make the factors. Shorten the species names with `fct_recode()`, and order the islands by how
    many rows each has with `fct_infreq()`.

    ```r
    penguins <- penguins_raw |>
      mutate(
        species = fct_recode(
          Species,
          Adelie = "Adelie Penguin (Pygoscelis adeliae)",
          Chinstrap = "Chinstrap penguin (Pygoscelis antarctica)",
          Gentoo = "Gentoo penguin (Pygoscelis papua)"
        ),
        island = fct_infreq(Island)
      )

    levels(penguins$island)

    penguins |>
      count(island)
    ```

    ```output
    [1] "Biscoe"    "Dream"     "Torgersen"
    # A tibble: 3 × 2
      island        n
      <fct>     <int>
    1 Biscoe      168
    2 Dream       124
    3 Torgersen    52
    ```

    Biscoe comes first now, because it has the most rows. The counts are the same; only the order
    changed.

    ```table
    | Island | Rows |
    | Biscoe | 168 |
    | Dream | 124 |
    | Torgersen | 52 |
    ```

    Now two columns at once. `count(species, island)` gives one row for each pair that occurs.
    With `.drop = FALSE`, it also gives the pairs that never occur, with 0:

    ```r
    penguins |>
      count(species, island, .drop = FALSE)
    ```

    ```output
    # A tibble: 9 × 3
      species   island        n
      <fct>     <fct>     <int>
    1 Adelie    Biscoe       44
    2 Adelie    Dream        56
    3 Adelie    Torgersen    52
    4 Chinstrap Biscoe        0
    5 Chinstrap Dream        68
    6 Chinstrap Torgersen     0
    7 Gentoo    Biscoe      124
    8 Gentoo    Dream         0
    9 Gentoo    Torgersen     0
    ```

    Nine rows: three species times three islands. Laid out as Book 0's two-way table, with species
    down the side and islands across the top, the same counts read:

    ```table
    | Species | Biscoe | Dream | Torgersen |
    | Adelie | 44 | 56 | 52 |
    | Chinstrap | 0 | 68 | 0 |
    | Gentoo | 124 | 0 | 0 |
    ```

    The zeros carry information. In this file, Chinstrap penguins were recorded only on Dream, and
    Gentoo only on Biscoe. Without `.drop = FALSE`, those zeros would not appear at all, and you
    might not notice that they exist.
  analogy_breaks_when: |
    The counts are rows of the file, which are nesting observations on the islands sampled. A zero
    says no such row was recorded. It does not say that no Chinstrap penguin lives on Biscoe.

    `fct_infreq()` orders by the counts in this file. Another season's file could order the
    islands differently, which matters if a report compares tables across files. A fixed order
    from `fct_relevel()` or from the levels you list yourself does not move.
must_know:
- point: |
    Run `count()` on every category column before you use it. Each misspelling, stray space or
    capital letter shows up as an extra row, and that is the only place it shows up.
  kind: move
  bearing: methodological
- point: |
    The error is to think `factor()` warns about a value that is not one of its levels. It does
    not. The value becomes `NA`, silently. Count the factor after making it, and treat any new
    `NA` as a spelling you missed.
  kind: misconception
  bearing: methodological
- point: |
    Turn numeric codes into labelled categories with the labels from the data dictionary, written
    once in the script with `fct_recode()`. Refuse a summary that averages a code.
  kind: trap
  bearing: methodological
- point: |
    If you misspell an old level in `fct_recode()`, R warns "Unknown levels" and leaves that level
    unchanged. Read the warning; it means a category you meant to rename is still there.
  kind: trap
  bearing: methodological
- point: |
    Set the order of the levels on purpose, with the levels you list or with `fct_relevel()`. The
    order decides how every later count, table and plot is laid out.
  kind: move
  bearing: teaching
- point: |
    Use `.drop = FALSE` when you need the categories with no rows. A table that leaves out its
    zeros hides that a combination never occurred.
  kind: consequence
  bearing: methodological
- point: |
    A clean count shows how many rows hold each category. It cannot show that the category was
    recorded correctly in the first place. A patient entered as male when female stays male in
    every count.
  kind: boundary
  bearing: clinical
exercises:
- type: calculation
  prompt: |
    In your penguin script, make `sex` a factor with the levels "female" and "male", in that order,
    from the file's `Sex` column. Count it, and say how many penguins have no recorded sex.
  answer: |
    ```r
    library(readr)
    library(dplyr)
    library(stringr)

    penguins_raw <- read_csv(
      here::here("data-raw", "penguins_raw.csv"),
      show_col_types = FALSE
    )

    penguins <- penguins_raw |>
      mutate(sex = factor(str_to_lower(Sex), levels = c("female", "male")))

    penguins |>
      count(sex)
    ```

    ```output

    Attaching package: ‘dplyr’

    The following objects are masked from ‘package:stats’:

        filter, lag

    The following objects are masked from ‘package:base’:

        intersect, setdiff, setequal, union

    # A tibble: 3 × 2
      sex        n
      <fct>  <int>
    1 female   165
    2 male     168
    3 <NA>      11
    ```

    165 female, 168 male, and 11 with no recorded sex. The file writes FEMALE and MALE in
    capitals, so the values are lowered first. Without `str_to_lower()`, `factor()` would match
    nothing, and all 344 rows would become `NA`. The 11 `NA`s here were already missing in the
    file, as the section on missing values counted.
  skill_ref: S52-R1-K01
- type: retrieval
  prompt: |
    Without looking back, say what `factor()` does with a value that is not among the levels you
    gave it. Then name the line you run to catch that.
  answer: |
    It turns the value into `NA`, with no warning. Catch it by running `count()` on the new factor
    and looking for an `NA` row that was not there before.
- type: teaching
  prompt: |
    A first-year resident has ten minutes and a whiteboard. Their thesis data has a column
    `tobacco` coded 0, 1 and 2, and they have reported "mean tobacco use 0.8". Explain what is
    wrong, and show them how to fix it.
  answer: |
    Write the three codes on the board and ask what each means. They will have to look in the data
    dictionary, which is the point. The numbers are labels, and only the dictionary says what they
    stand for. Suppose it says 0 never, 1 former, 2 current.

    Ask what "0.8" means. It is not a kind of tobacco use. It is an average of labels, like
    averaging bed numbers. A different coding, 1 to 3 instead of 0 to 2, would give a different
    "mean" for the same people.

    Then write the fix. Turn the code into a factor with the dictionary's labels:
    `fct_recode(as.character(tobacco), never = "0", former = "1", current = "2")`. Keep the code
    column beside it. Report a count of each category with its share, not a mean.
quantitative: true
practice_note: |
  Eleven problems: factor(), fct_recode(), fct_relevel(), fct_infreq() and count() are each one move,
  and the traps are a silent NA from factor(), a misspelt old level in fct_recode(), codes recoded
  against the dictionary, and a two-way count read as a statement about the world.
practice:
- level: 1
  prompt: |
    Before you run it, say what this prints, and in what order the levels come.

    ```r norun
    factor(c("Dream", "Biscoe", "Dream", "Torgersen"))
    ```
  answer: |
    ```r
    factor(c("Dream", "Biscoe", "Dream", "Torgersen"))
    ```

    ```output
    [1] Dream     Biscoe    Dream     Torgersen
    Levels: Biscoe Dream Torgersen
    ```

    The four values print in their own order. The levels are Biscoe, Dream, Torgersen: with no
    levels given, `factor()` takes them from the data in alphabetical order.
- level: 2
  prompt: |
    Before you run it, say what the levels of the result are, in order.

    ```r norun
    library(forcats)

    fct_infreq(c("rice", "roti", "rice", "millet", "rice", "roti"))
    ```
  answer: |
    ```r
    library(forcats)

    fct_infreq(c("rice", "roti", "rice", "millet", "rice", "roti"))
    ```

    ```output
    [1] rice   roti   rice   millet rice   roti
    Levels: rice roti millet
    ```

    rice, roti, millet. Rice appears three times, roti twice and millet once, and `fct_infreq()`
    puts the most frequent first. The values themselves do not move.
- level: 3
  prompt: |
    A made-up column codes the meal eaten as 1 (breakfast), 2 (lunch) or 3 (dinner). Turn it into
    a factor with those labels.

    ```r
    meal_code <- c(2, 3, 3, 1, 2)
    ```
  answer: |
    ```r
    library(forcats)

    fct_recode(as.character(meal_code), breakfast = "1", lunch = "2", dinner = "3")
    ```

    ```output
    [1] lunch     dinner    dinner    breakfast lunch
    Levels: breakfast lunch dinner
    ```

    lunch, dinner, dinner, breakfast, lunch. `fct_recode()` takes text, so the numbers are turned
    into text first. Each new label sits on the left of its old code.
