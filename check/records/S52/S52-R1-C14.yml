    Their table has three rows, labelled "Adelie", "Chinstrap penguin (Pygoscelis antarctica)" and
    "Gentoo". They decide the file's Chinstrap name is "too long to fix" and leave it. Find what
    broke.
  answer: |
    The old name for Chinstrap was typed with a capital P, "Penguin". The file writes "penguin".
    The name did not match, so `fct_recode()` warned "Unknown levels" and left the level as it was.
    The warning said what happened.

    Copy the old names from a `count()` of the column, not from memory:

    ```r
    penguins_raw |>
      mutate(
        species = fct_recode(
          Species,
          Adelie = "Adelie Penguin (Pygoscelis adeliae)",
          Chinstrap = "Chinstrap penguin (Pygoscelis antarctica)",
          Gentoo = "Gentoo penguin (Pygoscelis papua)"
        )
      ) |>
      count(species)
    ```

