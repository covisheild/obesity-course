exercises:
- type: calculation
  prompt: |
    Add to your penguin script a histogram of flipper length. Use bins 10 mm wide starting at
    170 mm, each including its left edge. Give it an axis title with its unit, and a source line.
    Save it to `output/flipper_histogram.png` at 15 cm by 10 cm. Write the counts per bin to
    `output/flipper_histogram_counts.csv`. Say how many penguins the figure shows.
  answer: |
    ```r
    library(readr)
    library(dplyr, warn.conflicts = FALSE)
    library(ggplot2)

    penguins_raw <- read_csv(
      here::here("data-raw", "penguins_raw.csv"),
      show_col_types = FALSE
    )

    flipper_plot <- ggplot(penguins_raw, aes(x = `Flipper Length (mm)`)) +
      geom_histogram(binwidth = 10, boundary = 170, closed = "left") +
      labs(
        x = "Flipper length (mm)",
        y = "Penguins",
        caption = "Source: palmerpenguins raw data, as read from data-raw/"
