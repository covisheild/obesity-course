simplified_explanation: |
  A plot in ggplot2 is built from three parts.

  **The data**: a data frame, one row per observation, as every section since tidy data has
  used.

  **The mappings**: which column goes where. You write these inside `aes()`, short for aesthetics,
  the visual properties of a mark.

  **The geom**: what kind of mark. Points for a scatter plot, bars for a histogram or a count,
  boxes for a boxplot.

  You join the parts with `+`.

  Two traps come up early. Inside `aes()` means "let this vary with a column". Outside it means
  "make every mark this". Write `colour = "blue"` inside and ggplot2 treats "blue" as data. And a
  histogram's bars depend on bins you did not choose unless you choose them: set their width and
  where they start.

  Save it to `output/` with `ggsave()`, from the script, at a size you write down. Never export it
  with the mouse.
illustrations:
- body: |
    Start with a histogram of penguin body mass. Load the packages, read the file, and make the
    short columns used in the summaries section.

    ```r
    library(readr)
    library(dplyr, warn.conflicts = FALSE)
    library(ggplot2)

    penguins_raw <- read_csv(
      here::here("data-raw", "penguins_raw.csv"),
      show_col_types = FALSE
    )

    penguins <- penguins_raw |>
      mutate(
        species = case_when(
          Species == "Adelie Penguin (Pygoscelis adeliae)" ~ "Adelie",
          Species == "Chinstrap penguin (Pygoscelis antarctica)" ~ "Chinstrap",
          Species == "Gentoo penguin (Pygoscelis papua)" ~ "Gentoo"
        ),
        body_mass_g = `Body Mass (g)`,
        flipper_mm = `Flipper Length (mm)`
      )

    range(penguins$body_mass_g, na.rm = TRUE)
    ```

    ```output
    [1] 2700 6300
    ```

    Now the plot: the data, one mapping, one geom.

    ```r
    ggplot(penguins, aes(x = body_mass_g)) +
      geom_histogram()
    ```

    ```output
    `stat_bin()` using `bins = 30`. Pick better value with `binwidth`.
    Warning message:
    Removed 2 rows containing non-finite values (`stat_bin()`).
    ```

    A histogram appears, and R prints two lines. Read both. The first says ggplot2 used 30 bins
    because you did not choose any. Thirty is not a property of penguins. It is a default, and the
    help page calls it "not a good default". The second says 2 rows were removed: the two penguins
    with no body mass. The figure shows {{n:penguins_mass_n}} penguins, and nothing on it says so.

    Choose the bins. Body masses run from 2700 g to 6300 g, so bins 500 g wide, starting at 2500 g,
    cover them in eight bars. Say also which edge a bin includes. By default a penguin of exactly
    3000 g goes in the bin "2500 to 3000". `closed = "left"` makes each bin run from its left edge
    up to just under its right edge, so the same penguin counts in "3000 to under 3500"; the last
    bin also keeps its right edge.

    ```r
    ggplot(penguins, aes(x = body_mass_g)) +
      geom_histogram(binwidth = 500, boundary = 2500, closed = "left")
    ```

    ```output
    Warning message:
    Removed 2 rows containing non-finite values (`stat_bin()`).
    ```

    The warning about the 2 removed rows stays, and it should. Now count the same bins yourself,
    so the numbers behind the bars exist somewhere other than in a picture. Dividing by 500,
    rounding down with `floor()` and multiplying by 500 gives each penguin's bin start. `count()`
    can make the column it counts; the name goes on the left of `=`.

    ```r
    mass_bins <- penguins |>
      count(bin_start_g = floor(body_mass_g / 500) * 500)

    mass_bins

    dir.create(here::here("output"), showWarnings = FALSE)
    write_csv(mass_bins, here::here("output", "mass_histogram_counts.csv"))
    ```

    ```output
    # A tibble: 9 × 2
      bin_start_g     n
            <dbl> <int>
    1        2500     9
    2        3000    62
    3        3500    94
    4        4000    59
    5        4500    51
    6        5000    34
    7        5500    29
    8        6000     4
    9          NA     2
    ```

    ```table
    | Bin from (g) | Up to under (g) | Penguins |
    | 2500 | 3000 | 9 |
    | 3000 | 3500 | 62 |
    | 3500 | 4000 | 94 |
    | 4000 | 4500 | 59 |
    | 4500 | 5000 | 51 |
    | 5000 | 5500 | 34 |
    | 5500 | 6000 | 29 |
    | 6000 | 6500 | 4 |
    ```

    The eight counts add up to {{n:penguins_mass_n}}, and the `NA` row holds the other 2. These are the heights of the
    eight bars. Rule 7 of Sandve and colleagues' ten rules for reproducible research asks for
    exactly this: keep the counts behind a histogram, not only the picture.

    Choosing the bins in code matters for one more reason. The outputs in this book come from
    ggplot2 {{n:ggplot2_version}}. ggplot2 4.0.0 changed how it places bins by default, and its own
    notes say this "may affect plots that use default binning". A histogram left on defaults can
    change shape when a colleague runs your script on a newer version. One with its width and
    boundary written down cannot, unless that version has a bug: the notes for 4.0.1 list a fixed
    bug in which `boundary` was ignored.
  analogy_breaks_when: |
    The bars describe the {{n:penguins_mass_n}} penguins with a body mass in this file. They are not the shape of
    body mass in any wider population of penguins.

    Another bin width tells a different story. Bins of 100 g show more bumps, and some of them are
    chance; bins of 1000 g hide real ones. There is no correct width. Try two or three, pick one
    that shows what the data show, and write it in the code.
- body: |
    Now two variables, and the commonest early mistake. Continue in the same session. You want every
    point blue, and you write the colour inside `aes()`:

    ```r
    ggplot(penguins, aes(x = flipper_mm, y = body_mass_g, colour = "blue")) +
      geom_point()
    ```

    ```output
    Warning message:
    Removed 2 rows containing missing values (`geom_point()`).
    ```

    Look at the plot. The points are not blue. They are ggplot2's first default colour, a pinkish
    red, and a legend appears titled "colour" with one entry: "blue". Inside `aes()`, "blue" was
    treated as data, a column whose every value is the word "blue". ggplot2 gave that one value a
    colour of its own choosing and explained it in a legend.

    Mapping and setting are different acts. Map a colour to a column when you want it to vary with
    the data. Set it outside `aes()`, in the geom, when you want one colour for every point:

    ```r
    ggplot(penguins, aes(x = flipper_mm, y = body_mass_g, colour = species)) +
      geom_point()

    ggplot(penguins, aes(x = flipper_mm, y = body_mass_g)) +
      geom_point(colour = "blue")
    ```

    ```output
    Warning message:
    Removed 2 rows containing missing values (`geom_point()`).
    Warning message:
    Removed 2 rows containing missing values (`geom_point()`).
    ```

    The first gives each species its own colour and a legend that means something. The second
    makes every point blue and needs no legend.

    Colour is one way to show a third variable. Facets are another: one small panel per species,
    on the same axes, so the panels can be compared by eye. Finish the figure as Book 0 asked:
    axis titles that name the quantity and its unit, and a source line. Then save it from the
    script, at a size written in the code, into `output/`.

    ```r
    mass_flipper <- ggplot(penguins, aes(x = flipper_mm, y = body_mass_g)) +
      geom_point() +
      facet_wrap(~species) +
      labs(
        x = "Flipper length (mm)",
        y = "Body mass (g)",
        caption = "Source: palmerpenguins raw data (Gorman, Williams and Fraser), as read from data-raw/"
      )

    mass_flipper

    dir.create(here::here("output"), showWarnings = FALSE)
    ggsave(
      here::here("output", "mass_flipper.png"),
      plot = mass_flipper,
      width = 18,
      height = 10,
      units = "cm"
    )

    file.exists(here::here("output", "mass_flipper.png"))
    ```

    ```output
    Warning message:
    Removed 2 rows containing missing values (`geom_point()`).
    Warning message:
    Removed 2 rows containing missing values (`geom_point()`).
    [1] TRUE
    ```

    Three panels, one per species, each on the same scales. `~species` reads "by species". The
    figure is in `output/`, made by the same line every time the script runs. The `dir.create()`
    line matters for a reader on a newer version: from ggplot2 3.5.0, `ggsave()` makes a missing
    folder only when its new `create.dir` argument tells it to.
  analogy_breaks_when: |
    A scatter plot shows that heavier penguins in this file tend to have longer flippers. It does
    not show that one causes the other, and it says nothing about penguins outside the file.

    Facets compare panels well only when they share axes, which `facet_wrap()` does unless told
    otherwise. Free axes, one scale per panel, make every panel look equally spread out, and the
    eye then compares shapes that are drawn on different rulers.
- body: |
    Last, the two plots most used in a thesis to compare groups: the boxplot and the bar chart.
    Continue in the same session.

    ```r
    ggplot(penguins, aes(x = species, y = body_mass_g)) +
      geom_boxplot() +
      labs(x = "Species", y = "Body mass (g)")
    ```

    ```output
    Warning message:
    Removed 2 rows containing non-finite values (`stat_boxplot()`).
    ```

    Each box runs from the first quartile to the third, with a line at the median. Which quartiles?
    The ones `quantile()` gives, R's type 7 from the section on summaries; ggplot2's notes for
    the newer 4.0.3 name 7 as the default. Check them:

    ```r
    penguins |>
      summarise(
        q1_g = quantile(body_mass_g, probs = 0.25, na.rm = TRUE),
        median_g = median(body_mass_g, na.rm = TRUE),
        q3_g = quantile(body_mass_g, probs = 0.75, na.rm = TRUE),
        .by = species
      )
    ```

    ```output
    # A tibble: 3 × 4
      species    q1_g median_g  q3_g
      <chr>     <dbl>    <dbl> <dbl>
    1 Adelie    3350      3700  4000
    2 Gentoo    4700      5000  5500
    3 Chinstrap 3488.     3700  3950
    ```

    The Adelie box runs from 3350 g to 4000 g with its median at 3700 g. The Gentoo box runs from
    4700 g to 5500 g. A boxplot's side axis need not start at zero. Every box, whisker and point
    carries its value by position, read off the printed scale, as Book 0 said of a line chart.

    A bar chart is different. A bar's value is its length, so its value axis must start at zero.
    `geom_bar()` counts the rows in each category, as `count()` does:

    ```r
    ggplot(penguins, aes(x = species)) +
      geom_bar() +
      labs(x = "Species", y = "Rows in the file")
    ```

    The bars stand at {{n:penguins_adelie}}, {{n:penguins_chinstrap}} and {{n:penguins_gentoo}}. A bar chart of means, with the axis cut to start at 3000 g,
    would make the Gentoo bar look about three times the Adelie bar when its mean is about 1.4 times as
    large. Keep bar charts for counts and amounts that start at zero, and show distributions with
    boxes or histograms.
  analogy_breaks_when: |
    A box hides how many values it summarises: a box drawn from 5 values looks as solid as one drawn
    from 150. Print the n per group beside the figure, or in its caption.

    The 1.4 is rounded: 5076 divided by 3701 is about 1.37. It compares two means in this file and
    says nothing about how different a typical Gentoo and Adelie are.
must_know:
- point: |
    Write a colour or size inside `aes()` only when it should vary with a column. Inside, a fixed
    value such as "blue" is treated as data.
  kind: trap
  bearing: methodological
- point: |
    Read every message and warning ggplot2 prints. "Removed 2 rows" means your figure shows fewer
    observations than your data frame holds.
  kind: move
  bearing: methodological
- point: |
    The error is to think a histogram shows the shape of the data. It shows the data cut into bins
    someone chose.
  kind: misconception
  bearing: methodological
  refs:
  - sandve_2013
- point: |
    A bar chart's value axis starts at zero, because a bar's value is its length. A boxplot or a
    scatter plot need not, because position carries the value.
  kind: consequence
  bearing: public
- point: |
    Every axis title names the quantity and its unit, and every figure carries a source line.
  kind: move
  bearing: methodological
- point: |
