- type: critique
  prompt: |
    A colleague makes the figures for her thesis by running code in the console. Then she clicks
    Export in RStudio's plot pane and chooses "Save as image". She drags the size until it looks
    right. After a data correction, she has to remake eleven figures. Say what is wrong
    with this way of working and what she should do.
  answer: |
    Nothing connects each saved image to the code and data that made it. The console keeps no
    record of which lines made figure 7, and the size she dragged to is written nowhere. After a
    correction she must remember, for each of eleven figures, which code made it and at what size,
    and get all of them right by hand.

    Instead, put every figure in the analysis script. Make it with `ggplot()` and give it a name.
    Then save it with `ggsave()` into `output/`, with its file name, width, height and units in
    the code. After a correction she reruns the script once. All eleven figures are redrawn from
    the corrected data, at the same size. Keep the counts behind each figure in a file beside it,
    so a reader can check the numbers without measuring the picture.
  skill_ref: S52-R1-K02
- type: teaching
  prompt: |
    A journalist has three minutes. She has a bar chart from a press release. One district's bar for
    "adults screened" looks five times another's, and the axis starts at 9,000.
    Explain what she should ask for, without jargon.
  answer: |
    "A bar is read by its length, so the bars only tell the truth if they start at zero. This axis
    starts at 9,000, so the bottom of every bar has been cut off. A district with 10,000 adults
    screened and one with 9,200 would look like a tall bar and a stub, even though the numbers are
    close. Ask for the chart redrawn from zero, or simply ask for the numbers. If the press office
    made the chart in code, redrawing it is one line."
- type: retrieval
  prompt: |
    Without looking back, name the three parts of a ggplot2 plot, and two choices that change a
    histogram's bars without changing the data.
  answer: |
    The data, the aesthetic mappings made with `aes()`, and the geom.

    The bin width and where the bins start (`binwidth` and `boundary`). Which edge each bin
    includes (`closed`) changes the bars too, when values sit exactly on edges.
quantitative: true
practice_note: |
  Twelve problems. The grammar is one idea, but each geom brings its own silent choice (bins and
  their edges, which quartiles the box uses, where the value axis starts) and the commonest errors
  are mapping a fixed value and joining layers with the pipe, so the diagnostic band is large.
practice:
- level: 1
  prompt: |
    In this line, name the data, each aesthetic mapping, and the geom.

    ```r norun
    ggplot(clinic, aes(x = age_years, y = bmi)) + geom_point()
    ```
  answer: |
    The data are `clinic`. There are two mappings: `age_years` to position along x, and `bmi` to
    position along y. The geom is `geom_point()`, so each row becomes one point. The line draws a
    scatter plot of BMI against age.
- level: 2
  prompt: |
    In each line, say whether the colour is mapped or set, and what the points will look like.

    ```r norun
    ggplot(clinic, aes(x = age_years, y = bmi, colour = sex)) + geom_point()
    ggplot(clinic, aes(x = age_years, y = bmi)) + geom_point(colour = "darkgreen")
    ```
  answer: |
    In the first, colour is mapped to the column `sex`, inside `aes()`. Each value of `sex` gets its
    own colour, and a legend says which is which.

    In the second, colour is set, outside `aes()`. Every point is dark green, and there is no legend,
    because nothing varies.
- level: 3
  prompt: |
    Six made-up values: 1.2, 1.8, 2.1, 2.9, 3.0 and 3.4. A histogram uses `binwidth = 1` and
    `boundary = 1`, with ggplot2's default for which edge a bin includes. How many values go in the
    bins from 1 to 2, 2 to 3 and 3 to 4? Then answer again with `closed = "left"`.
  answer: |
    By default a bin includes its right edge. The first bin is "above 1, up to 2", and the others
    follow the same pattern. The first holds 1.2 and 1.8: 2 values. The second holds 2.1, 2.9 and
    3.0: 3 values. The third holds 3.4 alone: 1 value.

    With `closed = "left"` the bins are "1 up to under 2", "2 up to under 3" and "3 up to 4". The
    first holds 1.2 and 1.8: 2 values. The second holds 2.1 and 2.9: 2 values. The value 3.0
    moves to the third, with 3.4: 2 values.

    Only the value sitting exactly on an edge moved. In real data, measurements are often rounded
    to whole numbers, so many values sit on edges, and the choice changes the bars.
- level: 4
  prompt: |
    Read the penguin file.

    ```r
    library(readr)
    library(dplyr, warn.conflicts = FALSE)
    library(ggplot2)

    penguins_raw <- read_csv(
      here::here("data-raw", "penguins_raw.csv"),
      show_col_types = FALSE
    )
    ```

    Draw a boxplot of body mass by island, with axis titles. Then give the median and the quartiles
    the boxes are drawn from, with the number of body masses behind each box.
  answer: |
    ```r
    ggplot(penguins_raw, aes(x = Island, y = `Body Mass (g)`)) +
      geom_boxplot() +
      labs(x = "Island", y = "Body mass (g)")

    penguins_raw |>
      summarise(
        n_mass = sum(!is.na(`Body Mass (g)`)),
        q1_g = quantile(`Body Mass (g)`, probs = 0.25, na.rm = TRUE),
        median_g = median(`Body Mass (g)`, na.rm = TRUE),
        q3_g = quantile(`Body Mass (g)`, probs = 0.75, na.rm = TRUE),
        .by = Island
      )
    ```

    ```output
    Warning message:
    Removed 2 rows containing non-finite values (`stat_boxplot()`).
    # A tibble: 3 × 5
      Island    n_mass  q1_g median_g  q3_g
      <chr>      <int> <dbl>    <dbl> <dbl>
    1 Torgersen     51 3338.    3700  4000
    2 Biscoe       167 4200     4775  5325
    3 Dream        124 3400     3688. 3956.
    ```

    The warning says 2 rows were removed: two penguins with no body mass. Biscoe's box sits highest,
    with a median of 4775 g from 167 body masses. The boxes use the same quartiles as `quantile()`.
    Biscoe is the only island with Gentoo penguins, the heaviest species, so the island comparison
    is partly a species comparison.
- level: 5
  prompt: |
    Read the penguin file.

    ```r
    library(readr)
    library(ggplot2)

    penguins_raw <- read_csv(
      here::here("data-raw", "penguins_raw.csv"),
      show_col_types = FALSE
    )
    ```

    Draw a scatter plot of culmen depth against culmen length, one panel per species. The culmen is
