    Warning message:
    Removed 2 rows containing missing values (`geom_point()`).
    [1] TRUE
    ```

    The file exists. The plot was never shown on the screen, but `ggsave()` drew it to make the file.
    Its warning says 2 rows were removed: the penguins with no culmen measurements are not in the
    saved figure. Say so in the caption if the figure goes in a report.
- level: 6
  prompt: |
    Read the penguin file.

    ```r
    library(readr)
    library(dplyr, warn.conflicts = FALSE)
    library(ggplot2)

    penguins_raw <- read_csv(
      here::here("data-raw", "penguins_raw.csv"),
      show_col_types = FALSE
    )
    ```

    Draw a bar chart of the number of rows for each value of `Sex`, with axis titles. Give the
    heights of the bars, and say what the third bar is.
  answer: |
    ```r
    ggplot(penguins_raw, aes(x = Sex)) +
      geom_bar() +
      labs(x = "Sex as recorded", y = "Rows in the file")

    penguins_raw |>
      count(Sex)
    ```

    ```output
    # A tibble: 3 × 2
      Sex        n
      <chr>  <int>
    1 FEMALE   165
    2 MALE     168
    3 <NA>      11
    ```

    {{n:penguins_female}} female, {{n:penguins_male}} male, and {{n:penguins_sex_missing}} with no sex recorded. The `NA` rows get a bar of their own, just as
    `count()` gives them a row of their own. Keep it: the reader should see that
    11 penguins could not be put in either group. The bars start at zero, so their lengths compare
    fairly.
- level: 7
  prompt: |
    A colleague wants all points dark red, and writes:

    ```r norun
    ggplot(penguins_raw, aes(x = `Flipper Length (mm)`, y = `Body Mass (g)`, colour = "darkred")) +
      geom_point()
    ```

    The points come out pinkish red, and a legend says "darkred". She decides her version of R
    "cannot show dark red". Find what broke.
  answer: |
    The colour is inside `aes()`, so it is a mapping. ggplot2 treated "darkred" as a value in the
    data, a column holding that one word, and gave it the first colour of its own default set. The
    legend explains that value. R can draw dark red; it was never asked to.

    Move the colour out of `aes()`, into the geom, to set it:

    ```r norun
    ggplot(penguins_raw, aes(x = `Flipper Length (mm)`, y = `Body Mass (g)`)) +
      geom_point(colour = "darkred")
    ```

    Why the wrong conclusion looks reasonable: the code contains the word "darkred" and produced a
    colour close to it. So the gap looks like a limit of the software. The legend is the clue: a
    legend appears only for something mapped.
- level: 7
  prompt: |
    You and a colleague run the same script on the same penguin file. Your histogram of body mass,
    made with `geom_histogram()` and no other arguments, has a different shape from hers. You have
    ggplot2 {{n:ggplot2_version}}; she has 4.0.3. She concludes one of the two data files must be corrupt. Say what
    is more likely, and how to make the two figures agree.
  answer: |
    The data are more likely the same, and the bins different. ggplot2's notes for version 4.0.0
    say the default bin boundary changed, and that this "may affect plots that use default
    binning". With no `binwidth` or `boundary` given, each version placed its 30 bins its own way.

    Check the data first, cheaply: compare row counts and a checksum of the raw file, as the section
    on raw files taught. Then make the bins part of the code:

    ```r norun
    ggplot(penguins_raw, aes(x = `Body Mass (g)`)) +
      geom_histogram(binwidth = 500, boundary = 2500, closed = "left")
    ```

    With the width, the boundary and the edge rule written down, both versions draw the same bins.
    Why the wrong conclusion looks reasonable: the code and the file are the same, so a different
    picture seems to mean different data. The third ingredient, the package version, is invisible
    unless you print it.
  refs:
  - tidyverse_news_s52r1
- level: 8
  prompt: |
    A colleague used to the pipe writes:

    ```r
    library(readr)
    library(ggplot2)

    penguins_raw <- read_csv(
      here::here("data-raw", "penguins_raw.csv"),
      show_col_types = FALSE
    )
    ```

    ```r error
    ggplot(penguins_raw, aes(x = `Flipper Length (mm)`, y = `Body Mass (g)`)) |>
      geom_point()
    ```

    ```output
    Error in `geom_point()`:
    ! `mapping` must be created by `aes()`
    ℹ Did you use `%>%` or `|>` instead of `+`?
    ```

    Read the error. Say what broke and fix it.
  answer: |
    Layers are added to a plot with `+`, not passed along with `|>`. The pipe handed the whole plot
    to `geom_point()` as its first argument, where `geom_point()` expects a mapping. The error
    message even asks whether you used `|>` instead of `+`.

    ```r
    ggplot(penguins_raw, aes(x = `Flipper Length (mm)`, y = `Body Mass (g)`)) +
      geom_point()
    ```

    ```output
    Warning message:
    Removed 2 rows containing missing values (`geom_point()`).
    ```

    Now the plot draws, with the usual warning about 2 rows removed.

    Why the wrong code looks reasonable: in every section before this one, each step of the work was
    joined to the next with `|>`. ggplot2 is older than that habit and builds a plot by adding
    layers.
- level: 8
  prompt: |
    A made-up thesis figure caption says: "Figure 3. Body mass of all {{n:penguins_rows}} penguins, by species." The
    code was:

    ```r
    library(readr)
    library(ggplot2)

    penguins_raw <- read_csv(
      here::here("data-raw", "penguins_raw.csv"),
      show_col_types = FALSE
    )

    ggplot(penguins_raw, aes(x = Species, y = `Body Mass (g)`)) +
      geom_boxplot()
    ```

    ```output
    Warning message:
    Removed 2 rows containing non-finite values (`stat_boxplot()`).
    ```

    Find what is wrong with the caption, using only what R printed.
  answer: |
    R printed a warning: 2 rows were removed. The boxes are drawn from {{n:penguins_mass_n}} body masses, not {{n:penguins_rows}}. Two
    penguins have no body mass, and `geom_boxplot()` left them out. The caption should say {{n:penguins_mass_n}}, and
    the methods should say why 2 are missing.

    Count them to be sure:

    ```r
    sum(is.na(penguins_raw$`Body Mass (g)`))
    ```

    ```output
    [1] 2
    ```

    Why the wrong caption looks reasonable: {{n:penguins_rows}} is the number of rows in the file, which everyone
    remembers. A warning in the console is easy to scroll past, and it is the only place the
    difference is shown.
- level: 9
  prompt: |
    A made-up draft says: "As Figure 1 shows, most penguins weigh between 3.5 and 4 kg." Draw the
    histogram that would back the claim, and count the penguins in that range. Say whether the
    claim holds, and what the figure does not establish.
  answer: |
    Draw the histogram with bins 500 g wide starting at 2500 g, so one bar is exactly 3500 to under
    4000 g, and count:

    ```r
    library(readr)
    library(dplyr, warn.conflicts = FALSE)
    library(ggplot2)

    penguins_raw <- read_csv(
      here::here("data-raw", "penguins_raw.csv"),
      show_col_types = FALSE
    )

    ggplot(penguins_raw, aes(x = `Body Mass (g)`)) +
      geom_histogram(binwidth = 500, boundary = 2500, closed = "left")

    penguins_raw |>
      filter(!is.na(`Body Mass (g)`)) |>
      summarise(
        n_mass = n(),
        n_3500_to_4000 = sum(`Body Mass (g)` >= 3500 & `Body Mass (g)` < 4000),
        pct = 100 * n_3500_to_4000 / n_mass
      )
    ```

    ```output
    Warning message:
    Removed 2 rows containing non-finite values (`stat_bin()`).
    # A tibble: 1 × 3
      n_mass n_3500_to_4000   pct
       <int>          <int> <dbl>
    1    342             94  27.5
    ```

    94 of the {{n:penguins_mass_n}} penguins with a body mass, 27.5%, weigh from 3500 g to under 4000 g. That bar is
    the tallest, so 3.5 to 4 kg is the commonest band. But "most" means more than half, and this is
    about a quarter. The sentence should say "the commonest band was 3.5 to 4 kg, holding 94 of {{n:penguins_mass_n}}
    penguins (27.5%)".

    What the figure does not establish:

    - That the commonest band would be the same with other bins. With 250 g bins the tallest bar
      could move.
    - Anything about a typical penguin of any one species. The histogram mixes three species of
      different size.
    - Anything about penguins outside this study.
  refs:
  - horst_2020_palmerpenguins
- level: 10
  prompt: |
    A made-up district officer says: "Give me one figure comparing BMI in men and women from that
    American survey, for my slides." Make it from the joined NHANES files for adults aged 20 or
    over, save it to `output/`, and say what the figure does not establish.
  answer: |
    Join the files and keep the adults. Label the codes: the codebook says `RIAGENDR` 1 is male and
    2 is female. Draw boxes rather than bars, since BMI is a distribution and does not start at zero:

    ```r
    library(dplyr, warn.conflicts = FALSE)
    library(ggplot2)

    bmx <- haven::read_xpt(here::here("data-raw", "BMX_L.xpt"))
    demo <- haven::read_xpt(here::here("data-raw", "DEMO_L.xpt"))

    adults <- bmx |>
      left_join(demo, by = "SEQN", relationship = "one-to-one") |>
      filter(RIDAGEYR >= 20, !is.na(BMXBMI)) |>
      mutate(sex = if_else(RIAGENDR == 1, "Men", "Women"))

    count(adults, sex)

    bmi_plot <- ggplot(adults, aes(x = sex, y = BMXBMI)) +
      geom_boxplot() +
      labs(
        x = NULL,
        y = "BMI (kg/m^2)",
        caption = "NHANES 2021-2023, examined adults aged 20 or over; unweighted, not a US estimate"
      )

    dir.create(here::here("output"), showWarnings = FALSE)
    ggsave(
      here::here("output", "nhanes_bmi_by_sex.png"),
      plot = bmi_plot,
      width = 12,
      height = 10,
      units = "cm"
    )
    ```

    ```output
    # A tibble: 2 × 2
      sex       n
      <chr> <int>
    1 Men    2680
    2 Women  3290
    ```

    The figure has two boxes, from {{n:nhanes_men_bmi_n}} men and {{n:nhanes_women_bmi_n}} women with a BMI. The rows with no BMI were
    removed before plotting, on purpose, so the counts printed are the counts drawn. `NULL` leaves
    that axis without a title. The caption says what the boxes are, and what they are not.

    What it does not establish:

    - Anything about adults in the United States. The boxes are unweighted; the survey's
      documentation says its sample weights should be used.
    - Whether the difference between the boxes is more than chance, or large enough to matter.
    - Anything about adults in the officer's district. A figure from one country's survey is not a
      figure for another country's people.
    - A clean comparison of BMI. It includes women who were pregnant at the exam, whose weight does
      not measure the same thing.
  refs:
  - nchs_nhanes_2021_2023_bmx_demo
retrieval_items:
- q: What are the three parts every ggplot2 plot is built from?
  a: The data (a data frame), the aesthetic mappings made with aes() (which column goes to which
    visual property), and a geom (the kind of mark).
- q: What is the difference between writing colour = "blue" inside aes() and inside geom_point()?
  a: Inside aes() it is a mapping, so "blue" is treated as data and gets a default colour and a
    legend. Inside geom_point() it is a setting, and every point is blue.
- q: Why should a histogram's binwidth and boundary be written in the code?
  a: The default of 30 bins is arbitrary, the bars change with the bins, and newer versions of
    ggplot2 place default bins differently, so a figure on defaults may not redraw the same.
- q: Why must a bar chart's value axis start at zero, when a boxplot's need not?
  a: A bar's value is its length, which is only true from zero. A box or point carries its value by
    position, read off the scale.
- q: How should a figure leave R, and why?
  a: By ggsave() in the script, into output/, with width, height and units written in, so that it
    is redrawn from the data every time the script runs.
