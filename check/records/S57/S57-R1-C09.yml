simplified_explanation: |
  Many session plans open with a line like "Students will understand obesity." Nobody can check
  that. You cannot see understanding. You can see what a person does with it.

  Here is the test of a finished objective. Hand it to a colleague and ask them to write the
  question that checks it. If they cannot, the sentence is not finished.
illustrations:
- body: |
    Start with a list that fails. Chatterjee and Corral open their article with it. An
    anaesthesiologist is giving grand rounds, a teaching talk for a whole department. The topic is
    malignant hyperthermia (MH), an emergency that can arise during an operation under
    anaesthesia. You need to know nothing more about MH to follow this. He opens with these four
    objectives:

    1. Understand the pathophysiology of MH.
    2. Review the clinical presentation of MH.
    3. Discuss the treatment of MH.
    4. Become familiar with caffeine-halothane contracture testing for MH.

    Now run the first line through the six parts. Who? Not said. The action? "Understand". You
    cannot watch it, so you cannot write a question that checks it. The content is there: the
    pathophysiology, the way the disease works. The condition, the standard and the by-when are
    missing.

    Run the other three lines through. "Review" and "discuss" describe what the speaker will do
    at the front of the room. "Become familiar with" names a state of mind. Every line fails the
    same way. The slide tells the audience what the talk will cover. It does not tell them what
    they will be able to do afterwards.

    Now read the authors' rewrite of the third line. The stem, "Upon completion of the grand
    rounds presentation, participants will be able to", supplies who and by when.

    > Summarize, in order, the critical steps in the intraoperative management of an MH crisis
    > according to recommendations from the Malignant Hyperthermia Association of the United States.

    Find the parts. The action is "summarize". The content is the steps for managing a crisis
    during an operation. "According to recommendations from" the association names the list the
    answer is marked against. "In order" is part of the standard.

    Now write the check. Give each participant a blank sheet: "Write the steps for managing an MH
    crisis during an operation, in order." You can mark that. Notice one thing the rewrite still
    leaves open: how many steps must be right. Add it and the objective is finished.
  analogy_breaks_when: |
    The rewrite is the authors' own, for one talk to trained anaesthesiologists. It shows the
    form of an objective. It says nothing about what an Indian MBBS batch needs to be able to do;
    the level and the standard come from your learners' job, not from this example.
- body: |
    Now write one for a session of your own. You are teaching a batch of final-year MBBS
    (Bachelor of Medicine and Bachelor of Surgery) students on body mass index, BMI, which Book 0
    built (`B0-R0-C14`). Your first draft is the one most people write.

    > Students will understand BMI.

    Take the parts in turn.

    Who: "each student in this final-year batch". Say each, so the objective is about every
    learner, not the batch on average.

    The action: ask what the students will have to do with BMI in the job. In a clinic or a survey
    they will be handed a weight and a height and will have to say which category the person falls
    in. That is two actions, working out the number and placing it in a category. Pick the one
    the job ends on: classify. Working out the number becomes a step inside it.

    The content: an adult's BMI, from a measured weight in kilograms and a height in centimetres.

    The condition: given a printed table of BMI categories, without notes. Handing over the table
    matters. Book 0 showed that a cut-off is a decision some body made, not part of the
    arithmetic. The objective tests the classifying, not the memory of one body's cut-offs.

    The standard: correct for at least eight of ten adults.

    By when: at the end of the session, and again on a test one week later. `S57-R1-C01` showed
    why the second check is the one that counts: learning is what lasts.

    Put it together.

    > At the end of this session, each student in this final-year batch, given the weight in
    > kilograms and the height in centimetres of ten adults and a printed table of BMI categories,
    > will classify each adult's BMI into the table's category, without notes, correct for at least
    > eight of the ten, on the day and again on a test one week later.

    It is long. Chatterjee and Corral hear the same complaint from teachers. The length is where
    the check lives: a colleague can now write your test from this sentence alone.

    Last, find its level. Here the two sources disagree, and the disagreement teaches something.
    Chatterjee and Corral's verb table lists "classify" under analyse. Adams lists "classifying
    items in groups" as a sign of comprehension, the old name for understand. Neither verb list
    settles it. Look at the task instead. Reading a number against a printed table is carrying out
    a procedure in a given situation, which is the table's own description of apply. So the level
    is apply, whatever the verb.
  analogy_breaks_when: |
    Eight of ten is a standard chosen for this session, not a figure from any study. Set yours
    from what a wrong answer would cost. For a classification a student will use on patients next
    month, you might demand ten of ten.

    Placing the objective at apply works because the student classifies adults they have not seen
    before. If the ten adults on the test are the ten from the session, the same sentence is
    tested at remember.
  numbers:
  - value: "2001"
    unit: "year Bloom's taxonomy was revised"
    citekey: chatterjee_corral_2017_objectives
    quote: |-
      This taxonomy was revised in 2001
must_know:
- point: |
    "Understand" is the name of a Bloom level, and it is also a verb Chatterjee and Corral tell you
    never to use in an objective. The level is shown by actions you can see: explain, summarise,
    estimate. When you want understanding, write the action that would show it.
  kind: misconception
  bearing: teaching
  refs: [chatterjee_corral_2017_objectives]
- point: |
    A verb does not fix the level. "Describe" sits under both remember and understand in
    Chatterjee and Corral's table, and the two sources in this section put "classify" at different
    levels. Decide the level from the task. Ask whether the learner meets a case they have not
    seen before, or repeats something they were shown.
  kind: trap
  bearing: teaching
  refs: [chatterjee_corral_2017_objectives, adams_2015_bloom]
- point: |
    One action per objective. When a draft says "diagnose and manage", write two objectives.
  kind: move
  bearing: teaching
  refs: [chatterjee_corral_2017_objectives]
- point: |
    Before you settle on remember, ask what the learner will have to do with the material in the
    job. Write the objective at that level.
  kind: trap
  bearing: teaching
  refs: [adams_2015_bloom]
- point: |
    Bloom's levels sort thinking skills. So the list cannot grade weighing a child. For a skill
    like that, still write an action you can watch, such as "weigh" or "demonstrate". Then judge
    it by watching, not by the verb list.
  kind: boundary
  bearing: teaching
  refs: [adams_2015_bloom]
- point: |
    An objective states what you intend. Never report a well-written objective as an outcome.
  kind: boundary
  bearing: methodological
- point: |
    This book's build asks for one objective for one session. It is not a finding.
  kind: move
  bearing: teaching
exercises:
- type: critique
  prompt: |
    Here are three objectives of the kind you will find in teaching plans. For each one, name
    every part that is missing or broken. Then rewrite it as a finished objective.

    1. For a batch of MBBS students: "Students will know the causes of childhood obesity."
    2. For a session for accredited social health activists (ASHAs), village health workers:
       "ASHAs will appreciate the importance of weighing children
       every month."
    3. For a journal club of residents: "Residents will understand and critically appraise the
       trial."
  answer: |
    1. "Know" is a state of mind: you cannot watch it. Who is too loose ("students"); there is no
       condition, no standard and no by-when. A rewrite: "At the end of this session, each student,
       given a one-paragraph history of a child with obesity, will list the possible causes the
       history points to, without notes, naming at least three that the marking key accepts, on the
       day and on a test one week later." The level depends on the history: if the student meets a
       new history, it is above remember.
    2. "Appreciate" names an attitude, and nothing in the sentence can be watched. Ask what an ASHA
       who appreciated it would do: she would weigh the child and record the weight. A rewrite: "At
       the end of this session, each ASHA, given a child and the scale used at her centre, will
       weigh the child and record the weight in the register, completing every step on the
       programme's checklist, observed by the trainer." This is a hands skill, so Bloom's
       thinking-skill list does not grade it.
    3. Two actions, and one of them ("understand") cannot be watched. Drop it: appraising shows the
       understanding. A rewrite: "At the end of the journal club, each resident, given the trial's
       abstract and methods, will judge whether the comparison between its groups was fair, and
       write the one reason that matters most, which the convener marks against a key." "Judge" and
       "appraise" name evaluate, the fifth level.
- type: design
  prompt: |
    Choose the session you will teach for this book's build: a real group of learners and one
    topic. Write its single objective with all six parts. Then hand it to a colleague and ask them,
    without talking to you, to write one test question from it. Compare their question with what
    you meant. Revise the objective until the question they write is the one you would have
    written.
  answer: |
    There is no single right objective; judge yours against the six parts and the colleague test.

    - Who is named, and says "each".
    - The action is one verb you can watch or mark.
    - The content is stated.
    - The condition says what the learner is given and what they may not use.
    - The standard is a number or a list the answer is marked against.
    - By when includes a check days after the session, not only at its end.

    Suppose your colleague's question could be answered by repeating a sentence from your
    session, and you meant more than remember. Then your action or your condition is not yet doing
    its job. The usual fix is a condition that hands the learner a case they have not seen.
  skill_ref: S57-R1-K02
- type: teaching
  prompt: |
    A first-year resident is preparing her first teaching session. She asks why "understand" is
    forbidden in an objective, when it is the name of one of Bloom's levels. You have ten minutes
    and a whiteboard.
  answer: |
    Draw two columns. On the left, write the six revised levels, remember to create. On the right,
    beside "understand", write three actions: explain in your own words, summarise, estimate.

    Say that the level is the target and the verb is the evidence. "Understand" names what you hope
    is happening in the learner's head. You cannot see that, so you cannot mark it. What you can
    see is the learner explaining, summarising or estimating something. Those are the words that
    go in the objective.

    Then show that a verb is not a level. Take "describe". Ask her to describe the parts of an
    objective from memory: that is remember. Ask her to describe what is missing from a colleague's
    objective she has never seen: that is at least understand. Same verb, different task, different
    level.

    Close with the check she can use on her own: write the question that tests the objective. If
    she cannot, the objective is not finished.
retrieval_items:
- q: Name the six parts of a learning objective.
  a: Who; one action you can watch or mark; the content; the condition (given what, without what);
    the standard (how much or how well); by when.
- q: Why do "understand", "know" and "appreciate" not belong in an objective?
  a: They name states of mind, which cannot be watched or marked, so no one can write the test
    that checks them.
- q: How do you decide an objective's Bloom level when its verb appears under two levels?
  a: From the task. A case the learner has not seen before puts it above remember; repeating
    something shown in the session is remember, whatever the verb.
quantitative: false
