- body: |
    Now run the fair comparison and measure the difference. These numbers are made up too.

    Two weeks after the sessions, both groups of 75 sit the same new test. Here are the results.

    ```table
    group   mean score on the delayed test (%)   SD (percentage points)
    comparison   58   16
    new method   66   16
    ```

    First, the mean difference, the new method's group minus the comparison group.

    ```working
    66 minus 58 = 8
    ```

    The MD is 8 percentage points in favour of the new method. Its sign is positive, so the new
    method's group did better.

    Next, the size of that gap against the spread of the scores. Both groups have an SD of 16
    percentage points, so use 16.

    ```working
    8 divided by 16 = 0.5
    ```

    The SMD is 0.5. The new method's group scored half a standard deviation higher. To see what
    one SD is here, add it to the comparison group's mean.

    ```working
    58 plus 16 = 74
    ```

    One SD above the comparison mean is 74%. The new method's mean, 66%, sits halfway there.

    Keep the MD at 8 and change only the spread. Say both SDs had been 8 percentage points.

    ```working
    8 divided by 8 = 1
    ```

    Now the same 8 points is a whole standard deviation. The gap in marks has not changed. What
    changed is how unusual that gap is, compared with how much learners differ from one another.

    Now read a published SMD the same way. Open Freeman and colleagues, "Active learning increases
    student performance in science, engineering, and mathematics", *PNAS* 2014, at
    https://www.pnas.org/doi/10.1073/pnas.1319030111. The authors define active learning: it
    "engages students in the process of learning through activities and/or discussion in class,
    as opposed to passively listening to an expert."

    They combined the results of 158 comparisons between active learning and lecturing into one
    average. The scores were on exams, concept inventories and similar tests. (A concept inventory
    is a test mostly designed to find known misconceptions.) The overall SMD is 0.47. It was larger
    on concept inventories than on course exams. The authors put it in words:
    performance rose "by just under half a SD". Turn it back into marks for a batch whose scores
    have an SD of 16 percentage points.

    ```working
    0.47 times 16 = 7.52
    ```

    About 7.5 percentage points. That holds only for a test with that spread.

    Last, go to Freeman's Table 1. It splits the studies by how the students were put into
    groups. In 16 studies, a chance process decided, or every student had both methods in turn.
    Their SMD was 0.514. In other studies,
    students chose their own class section, and the SMDs ranged from 0.362 to 0.534. The authors
    report that the randomised studies gave results no different from the others.
  analogy_breaks_when: |
    The made-up batch gives both groups the same SD, so there is only one SD to divide by. Real
    groups rarely match exactly. A published SMD may divide by an SD pooled from both groups, or by
    the comparison group's SD alone (Glass's delta). Some papers name their version, such as
    Cohen's d. Each uses an exact formula this book does not work through. Your
    hand division gives the idea, not the published figure.

    Freeman's studies were in university science courses in their own time and place. The timing
    of the tests varied from study to study. So 0.47 is not a promise about a delayed test in your
    college.
  numbers:
  - value: '158'
    unit: independent comparisons with data on examination performance, Freeman's meta-analysis
    citekey: freeman_2014_active_learning
    as_of: '2026-09-25'
    quote: 158 independent comparisons with data on student examination performance
  - value: '0.47'
    unit: SMD, active learning against lecturing, examination and concept-inventory scores
    citekey: freeman_2014_active_learning
    as_of: '2026-09-25'
    quote: student performance on examinations and concept inventories increased by 0.47 SDs under
      active learning
  - value: '16'
    unit: studies in Freeman's Table 1 with randomised assignment or a crossover design
    citekey: freeman_2014_active_learning
    as_of: '2026-09-25'
    quote: Randomized assignment or crossover design | 16 | 0.514
  - value: '0.514'
    unit: SMD (Hedges's g), studies with randomised assignment or a crossover design
    citekey: freeman_2014_active_learning
    as_of: '2026-09-25'
    quote: Randomized assignment or crossover design | 16 | 0.514
  - value: '0.362'
    unit: SMD (Hedges's g), the lowest of the three self-sorted (quasirandom) rows of Table 1
    citekey: freeman_2014_active_learning
    as_of: '2026-09-25'
    quote: Quasirandom—no statistical difference on metrics of academic ability/preparedness | 51 |
      0.362
  - value: '0.534'
    unit: SMD (Hedges's g), the highest of the three self-sorted (quasirandom) rows of Table 1
    citekey: freeman_2014_active_learning
    as_of: '2026-09-25'
    quote: Quasirandom—no statistical difference in prescores on assessment used for effect size |
      51 | 0.534
must_know:
- point: |
    A batch's rise from a pre-test to a post-test is not evidence that your method works. Call
    it the change in this batch, and run a comparison before you claim more.
  kind: misconception
  bearing: teaching
- point: |
    To compare two ways of teaching, let chance decide who gets which. Then check the two groups'
    earlier marks, to see how evenly chance split them.
  kind: move
  bearing: methodological
  refs:
  - openstax_intro_stats_2e
- point: |
    Never quote an MD without saying which group was subtracted from which, and in what unit. A
    positive 6 and a negative 6 are opposite findings.
  kind: trap
  bearing: methodological
- point: |
    An SMD of 0.5 does not mean "50% better". To turn it into marks, multiply it by the SD of your
    own test's scores. That assumes the effect would carry over to your test and learners, which
    the SMD cannot tell you. Report the MD in marks first, then the SMD with the SD you divided by.
  kind: misconception
  bearing: teaching
- point: |
    Freeman and colleagues combined 158 comparisons of active learning against lecturing into one
    SMD of 0.47, just under half an SD. It was larger on concept inventories than on course exams.
    Use that as your yardstick when someone offers you a new
    method's "effect size". It came from volunteer teachers in university science courses.
  kind: number
  bearing: teaching
  refs:
  - freeman_2014_active_learning
- point: |
    The SMD shrinks when learners' scores are widely spread and grows when they are bunched, even if
    the gap in marks is the same.
  kind: boundary
  bearing: methodological
  refs:
  - cochrane_handbook_ch06_v6_5
- point: |
    Random allocation makes the groups alike on average, not identical. With a small batch, chance
    can still leave one group stronger: the spread of a group's mean shrinks only with the square
    root of its size (`B0-R0-C29`). How many learners a comparison needs is outside this book.
  kind: boundary
  bearing: methodological
- point: |
    When a committee is shown an "effect size" for a teaching method, ask three things. Compared
    with what? Who decided who got which? How long after the teaching was the test?
  kind: consequence
  bearing: policy
  refs:
  - deslauriers_2019_feeling_of_learning
exercises:
- type: design
  prompt: |
    An accredited social health activist (ASHA) is a village health worker. Your department has a
    question about training them. Does a session built on short written questions teach them to
    read a growth chart better than the usual talk? A growth chart is the printed curve on which a
    child's weight is plotted against age. Sixty ASHA workers from one block will attend.

    Plan the comparison. Say how you split them and what you keep the same. Say what you measure
    and when. Name the one number you will report first.
  answer: |
    Split. Write the 60 names on slips and draw 30 at random for the question-based session. The
    other 30 get the usual talk. That is the comparison group. Before teaching, record something
    that could affect the result, such as years of service. Check that the two groups come out
    roughly level on it.

    Kept the same. The content and the handout, the length of the session, the day of the week
    and the hall. Use the same trainer for both if possible. If you use two trainers, give each of
    them half of each group, so a trainer's skill does not travel with one method.

    Measured. One new set of growth-chart questions, the same for everyone, marked by someone who
    does not know which group each worker was in. Do not reuse the questions from the session.

    When. At a meeting two to four weeks later, not at the end of the session. A test at the end
    measures performance. The later test measures what lasted.

    Reported first. The mean difference, question-based group minus talk group, in percentage
    points, with each group's mean and SD beside it. Then the SMD, with the SD you divided by
    named.

    Thirty in each group is small. Say plainly that a gap of a few points could be chance, and do
    not report the SMD without the MD in marks.
- type: teaching
  prompt: |
    A journalist rings. A company says its training app has "an effect size of 0.8, the biggest in
    medical education". The company and its claim are made up for this exercise. You have three minutes and no jargon. Explain what that number means and
    what to ask the company.
  answer: |
    For a journalist: three minutes, one quotable sentence, and plain honesty about what is
    missing.

    An effect size like this is usually the gap between two groups' average marks, measured in
    units of how much individual students' marks vary. So 0.8 means the app's group scored, on
    average, most of one such unit higher than some other group. The number cannot tell you who
    that other group was.

    Ask the company four things. Compared with what: a good class, or no teaching at all? Who
    decided which students used the app: a lottery, or the students themselves? When were they
    tested: at the end of the session, or weeks later? And what was the gap in actual marks?

    The quotable line: "An effect size is only as good as the comparison behind it. Ask what the
    app was compared with, and whether anyone was tested weeks later."

    If they cannot answer, say the claim has not been shown. Do not say the app does not work.
quantitative: true
practice:
- level: 1
  prompt: |
    Group P has a mean of 72 and group Q a mean of 63. The SD of the scores is 18 in both groups.
    Find the MD, P minus Q, and the SMD.
  answer: |
    The MD is P's mean minus Q's mean.

    ```working
    72 minus 63 = 9
    ```

    The SMD is the MD divided by the SD.

    ```working
    9 divided by 18 = 0.5
    ```

    The MD is 9 and the SMD is 0.5.
- level: 2
  prompt: |
    A new method's group has a mean of 47. The comparison group has a mean of 53. The SD is 12 in
    both groups. Find the MD, new minus comparison, and the SMD. Say what the sign tells you.
  answer: |
    ```working
    47 minus 53 = -6
    -6 divided by 12 = -0.5
    ```

    The MD is -6 and the SMD is -0.5. The minus sign says the new method's group scored lower,
    by half a standard deviation.
- level: 3
  prompt: |
    A study reports an SMD of 0.25. The SD of the scores is 20. What is the MD?
  answer: |
    The SMD is the MD divided by the SD. So the MD is the SMD times the SD.

    ```working
    0.25 times 20 = 5
    ```

    The MD is 5. Check it by dividing back.

    ```working
    5 divided by 20 = 0.25
    ```
- level: 3
  prompt: |
    Two groups' means differ by 9, and the SMD is 0.6. What SD was used?
  answer: |
    The SMD is the MD divided by the SD. So the SD is the MD divided by the SMD.

    ```working
    9 divided by 0.6 = 15
    ```

    The SD was 15. Check it.

    ```working
    9 divided by 15 = 0.6
    ```
- level: 4
  prompt: |
    In Roediger and Karpicke's second experiment, the SSSS group read a passage in four study
    periods. The STTT group read it once and then took three recall tests. After 5 minutes, SSSS
    recalled 83% of the passage and STTT recalled 71%. After 1 week, STTT recalled 61% and SSSS
    recalled 40%. Find the MD, STTT minus SSSS, at each retention interval, with its unit. Say what
    the two signs tell you.
  answer: |
    Keep the subtraction the same way round both times: STTT minus SSSS.

    ```working
    71 minus 83 = -12
    61 minus 40 = 21
    ```

    At 5 minutes the MD is -12 percentage points. At 1 week it is +21 percentage points.

    The sign turns round. At 5 minutes the group that only read did better, by 12 points. A week
    later the group that was tested did better, by 21 points. Had you subtracted SSSS minus STTT at
    5 minutes and STTT minus SSSS at 1 week, both numbers would be positive. Then the reversal
    would disappear from your report.
  refs:
  - roediger_karpicke_2006_testing_effect
- level: 5
  prompt: |
    Deslauriers and colleagues allocated physics students to two groups at random. Before the
    experiment, the groups' averages on two earlier exams were as follows. Spring: group A 77.9%
    (SD 13.4 percentage points), group B 78.1% (SD 14.4). Fall: group A 70.5% (SD 13.0), group B
    72.02% (SD 13.9). For each semester, find the MD, B minus A, and the SMD, dividing by group A's
    SD. Say what the two SMDs tell you about the random allocation.
  answer: |
    Spring first.

    ```working
    78.1 minus 77.9 = 0.2
    0.2 divided by 13.4 = 0.0149
    ```

    An MD of 0.2 percentage points and an SMD of about 0.01.

    Now fall.

    ```working
    72.02 minus 70.5 = 1.52
    1.52 divided by 13.0 = 0.117
    ```

    An MD of 1.52 percentage points and an SMD of about 0.12.

    Before any teaching, the groups sat 0.01 and 0.12 SDs apart. Chance made them close, and in
    fall a little less close. The authors tested these gaps and called the groups
    "indistinguishable". Still, a later gap has to be judged against a starting gap of up to 0.12
    SD. It was not zero.
  refs:
  - deslauriers_2019_feeling_of_learning
- level: 6
  prompt: |
    Roediger and Karpicke report d, an SMD, for two of their comparisons. After 5 minutes, SSSS
    beat STTT by 12 percentage points, with d = 1.22. After 1 week, STTT beat SSSS by 21 percentage
    points, with d = 1.26. The paper does not give the SDs. Taking d as the MD divided by the SD,
    find the SD each d implies. Why is the second MD nearly twice the first, while d hardly moves?
  answer: |
    The SD is the MD divided by d.

    ```working
    12 divided by 1.22 = 9.84
    21 divided by 1.26 = 16.7
    ```

    At 5 minutes, the implied SD is about 9.8 percentage points. At 1 week, it is about 16.7.

    A week later the scores are far more spread out. Some students kept much of the passage and
    some kept little. The gap in marks grew from 12 to 21 points, but the spread grew almost as
    much. So the gap, measured in SDs, stayed near 1.2.

    These SDs are implied, not reported. The paper may have computed d another way, so treat them
    as rough.
  refs:
  - roediger_karpicke_2006_testing_effect
- level: 7
  prompt: |
    Here is a worked answer. The numbers are made up. Find the step that broke.

    ```working
    comparison group mean 58%, new method group mean 66%, SD 16 percentage points in each group
    MD = 66 minus 58 = 8 percentage points
    SMD = 8 divided by 58 = 0.14
    so the new method's group scored 0.14 SD higher
    ```
  answer: |
    The first two lines are right. The MD is 8 percentage points.

    The third line broke. It divides the MD by the comparison group's mean, 58. The SMD divides by
    the SD, 16.

    ```working
    8 divided by 16 = 0.5
    ```

    The SMD is 0.5, not 0.14.

    Why it looks reasonable: dividing a change by the value it started from is exactly how you
    work out a per cent change. Here it gives the gap as a share of the comparison mean, about
    14%. That is a real number, but it is not an SMD. The SMD asks how big the gap is against how
    much individual learners differ.
- level: 7
  prompt: |
    Here is a worked answer. The numbers are made up. Find the step that broke.

    ```working
    usual method group mean 64%, new method group mean 58%, SD 12 percentage points in each group
    MD = 64 minus 58 = 6 percentage points
    SMD = 6 divided by 12 = 0.5
    so the new method is half an SD better
    ```
  answer: |
    The arithmetic in lines 2 and 3 is right. The subtraction is the wrong way round for the
    claim in line 4.

    The MD in this book is the new method's group minus the comparison group.

    ```working
    58 minus 64 = -6
    -6 divided by 12 = -0.5
    ```

    The SMD is -0.5. The new method's group scored half an SD lower, not higher.

    Why it looks reasonable: taking the bigger number minus the smaller one is a habit, and it
    always gives a positive answer. A positive answer then reads as a win for whatever you were
    hoping for. Fix the order before you subtract, and write it beside the answer.
- level: 8
  prompt: |
    Here is a worked answer. The numbers are made up. Find the step that broke.

    ```working
    ASHA workers each plot ten children's weights on a growth chart; the score is the number of mistakes
    question-based group: mean 2.1 mistakes, SD 1.4; usual talk group: mean 3.5 mistakes, SD 1.4
    MD = 2.1 minus 3.5 = -1.4 mistakes
    SMD = -1.4 divided by 1.4 = -1
    the SMD is negative, so the question-based session did worse, by one SD
    ```
  answer: |
    Lines 1 to 4 are right. The MD is -1.4 mistakes and the SMD is -1.

    The last line broke. On this score, fewer is better. A negative MD means the question-based
    group made fewer mistakes: 1.4 fewer on average. That is one SD better, not worse.

    The Cochrane Handbook warns that some scales have higher scores for a better outcome and some
    have lower. Before you read a sign, find out which way the score runs. If you are putting
    several studies side by side, turn round the ones that run the other way, by multiplying by
    -1.

    ```working
    -1 times -1 = 1
    ```

    Reported on a "higher is better" footing, the SMD is +1 in favour of the question-based
    session.

    Why it looks reasonable: nearly every test you set scores right answers, so "negative means
    worse" becomes automatic. Counting mistakes turns that round, and nothing in the arithmetic
    warns you.
  refs:
  - cochrane_handbook_ch06_v6_5
- level: 9
  prompt: |
    A speaker at a medical-education meeting says: "Active learning raises exam scores by 6%.
    Freeman proved it." Freeman's own words are that a change of 0.47 SDs "would produce an
    increase of about 6% in average examination scores".

    Suppose your course's exam marks have a mean of 77.9% and an SD of 13.4 percentage points.
    Those are the figures for one group in Deslauriers's Table 1. Decide what to compute, compute
    it, and say what your answer does not establish.
  answer: |
    Turn 0.47 SD into marks for a test with this spread, by multiplying the SMD by the SD.

    ```working
    0.47 times 13.4 = 6.298
    ```

    About 6.3 percentage points. Now as a share of the mean score.

    ```working
    6.3 divided by 77.9 = 0.081
    ```

    About 8% of the mean.

    So "6%" could mean two different things. As percentage points, 6.3 is close to 6. As a per
    cent of the score, it would be about 8% here. The paper's text does not say which it means. It
    bases its 6% on three courses, analysed in its supplementary material.

    What this does not establish:

    - That your course would gain 6 points. The conversion assumes your SD, and your SD is not
      theirs.
    - That the gain lasts. The timing of the exams varied across Freeman's studies, and none of
      this is a delayed test of your own.
    - That every teacher would get it. The teachers in Freeman's studies were volunteers. The
      authors call it an open question whether the gain would hold if all teachers had to do it.
    - That "Freeman proved it" for your setting. The studies were undergraduate science courses,
      not an Indian medical college.
  refs:
  - freeman_2014_active_learning
  - deslauriers_2019_feeling_of_learning
- level: 10
  prompt: |
    A colleague writes this in the department's annual report. The words are made up for this
    problem.

    "My case-based sessions raised the batch's mean score from 52% on the pre-test to 68% on the
    post-test. The pre-test SD was 16 percentage points. So that is an effect size of 1.0, more
    than double Freeman's 0.47."

    Decide what to compute, compute it, and say what the claim does not establish.
  answer: |
    Check the arithmetic first. The change, post-test minus pre-test:

    ```working
    68 minus 52 = 16
    16 divided by 16 = 1
    ```

    The rise is 16 percentage points, and 16 divided by the pre-test SD is 1. The division is
    right.

    What it does not establish:

    - That the case-based sessions caused the rise. There is one group and no comparison group.
      Any teaching raises a post-test score. If the post-test repeated the pre-test's questions,
      practice on them raises it too.
    - That this is comparable with Freeman's 0.47. Freeman's figure is a gap between two groups
      taught differently, measured against the spread of scores. This 1.0 is one group's change
      over time. The two numbers answer different questions, so "more than double" compares
      nothing.
    - That anything lasted. If the post-test came at the end of the posting, it measures
      performance, not learning.

    What would establish it? Split the next batch by lot into case-based and usual sessions. Give
    both groups the same new test, two weeks or more later. Then report the MD in marks, with the
    SMD beside it.
  refs:
  - freeman_2014_active_learning
retrieval_items:
- q: What must two groups share, and what must differ, for a fair test of a teaching method?
  a: The same content, time, test and delay before the test, with learners allocated at random.
    Only the method differs.
- q: How do you get the SMD from two group means and an SD?
  a: Subtract one mean from the other to get the MD, stating which way round, then divide the MD
    by the SD.
- q: Why can the same MD in marks give two different SMDs?
  a: Because the SMD divides by the spread of the scores. A widely spread set of scores makes the
    same gap a smaller share of one SD.
- q: What can a single group's rise from pre-test to post-test not show?
  a: That the method caused it. With no comparison group, it cannot be separated from any
    teaching, practice on the test, or testing too soon.
