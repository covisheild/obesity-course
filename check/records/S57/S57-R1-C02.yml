simplified_explanation: |
  Here is the trap with judging your own teaching. You try a new method with a batch. Their marks
  go up. It feels like proof.

  But marks go up after almost any teaching. A rise tells you something happened. It cannot tell
  you that your method did it.

  So you need two groups, and they must differ in one way only: the method. Then you decide who
  goes in which group by chance, for example by drawing roll numbers from a box.

  Now compare the two groups' average marks.

  A gap of 8 marks can be large or small. It depends on how spread out the marks are.

  So divide the gap by the standard deviation.
illustrations:
- body: |
    Start with the attempt that fails. The numbers in it are made up.

    You teach a new way of running the nutrition sessions to a batch of 150 third-year MBBS
    students. Before the first session, they sit a 20-question test. At the end of the last
    session, they sit the same 20 questions again. The batch's mean score rises from 45% to 70%.

    ```working
    70 minus 45 = 25
    ```

    A rise of 25 percentage points. A colleague asks whether the new way works. Before you answer,
    list what else could have raised that score.

    - Any teaching at all. The old way would also have taught them something.
    - The same 20 questions twice. The students had practised this exact test.
    - The timing. The second test came at the end of a session, which measures performance, as the
      last section showed. It says nothing about next month.

    Each of these would raise the score with no help from your method. With one group, you cannot
    tell how much of the 25 points belongs to which. The rise is real. It is not evidence about
    the method.

    Now build the fair version. Put all 150 roll numbers in a box. Draw 75 of them. That group
    gets the new way. The other 75 get the usual way, the comparison group. Give both groups the
    same topic, the same number of minutes, and the same teacher if you can. Two weeks after the
    last session, give both groups one new test on the same objectives.

    Does drawing from a box really give you two similar groups? Open Deslauriers and colleagues,
    "Measuring actual learning versus feeling of learning", *Proceedings of the National Academy
    of Sciences* (PNAS) 2019, at
    https://pmc.ncbi.nlm.nih.gov/articles/PMC6765278/. Go to Table 1. It describes two groups of
    physics students who were allocated at random. Later, each group had one topic as a lecture
    and one in which students solved problems in small groups. Here you look only at how alike
    chance made the groups before that. Find the row for each group's average score on two earlier
    exams.

    ```table
    semester   group A mean (%)   group A SD   group B mean (%)   group B SD
    spring     77.9   13.4   78.1   14.4
    fall       70.5   13.0   72.02   13.9
    ```

    Work out each semester's gap, group B minus group A.

    ```working
    78.1 minus 77.9 = 0.2
    72.02 minus 70.5 = 1.52
    ```

    In spring the two groups sit 0.2 percentage points apart. In fall they sit 1.52 apart. Neither
    group was chosen for being stronger, and they came out nearly level. Nearly, not exactly: chance
    leaves small gaps, and a real study has to show they are small. That is what this table is for.
  analogy_breaks_when: |
    A box of roll numbers balances a large group better than a small one. With 20 learners, chance
    alone can leave one group clearly stronger. Check the groups' earlier marks, as Table 1 does,
    before you trust the split.

    The table shows balance on earlier exam marks only. It cannot show balance on things nobody
    measured.
