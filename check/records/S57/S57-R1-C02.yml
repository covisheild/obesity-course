definition:
  text: |
    A fair test of a teaching method compares two groups of learners who differ in one thing
    only: the method. Both groups learn the same content, in the same time, and sit the same test
    after the same delay. That delay is the retention interval, as the last section defined it.

    The learners are allocated to the two groups at random: a chance process decides who goes
    where, not the teacher or the learners. Anything else that affects the score is what the
    OpenStax statistics textbook calls a lurking variable. Random allocation spreads the lurking
    variables across the groups by chance.

    The mean difference, MD, is the mean score of one group minus the mean score of the other.
    Its sign says which group scored higher; whether higher is better depends on the scale. So
    you always state which group was subtracted from which, and which way the score runs.

    The standardised mean difference, SMD, is the MD expressed as a number of standard
    deviations (SD, `B0-R0-C28`). In words, the SMD is the MD divided by the SD, written

    ```working
    SMD = MD ÷ SD
    ```

    The choice of SD is part of the definition. The SMD the Cochrane Handbook uses, Hedges'
    adjusted g, divides by an SD pooled from both groups. Papers often report an SMD as an
    "effect size".

    One group tested before and after its teaching, with no comparison group, gives a change, not
    a difference between methods. Divided by an SD it gives a number that looks like an SMD. But
    it measures one group's change over time, so it cannot be set beside an SMD between two
    groups.
