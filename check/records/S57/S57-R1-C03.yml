- body: |
    A laboratory is not a lecture hall. So look at the classroom evidence, and at where it was
    gathered.

    Open Agarwal, Nunes and Blunt, "Retrieval practice consistently benefits student learning",
    *Educational Psychology Review* 2021, at https://pdf.poojaagarwal.com/Agarwal_etal_2021_EDPR.pdf.
    The authors kept only experiments where every student retrieved alone, without notes, in
    class time. Search for 5374.

    > Our review yielded 49 effect sizes and a total n = 5374, the majority of which (57%)
    > revealed medium or large benefits from retrieval practice.

    Each effect size is a Cohen's d, the same kind of number as the d values above. Search for
    0.80 and read the next two sentences.

    > Overall, 16 effect sizes indicated large benefits from retrieval practice (d > 0.80), 12
    > indicated medium benefits (0.50 < d < 0.80), and 18 were small or very small (d < 0.50).
    > Only three out of 49 effect sizes revealed a negative effect

    Check that the four groups account for every effect size, then turn the paper's 57% back into
    a fraction.

    ```working
    16 plus 12 plus 18 plus 3 = 49
    16 plus 12 plus 18 = 46
    16 plus 12 = 28
    28 divided by 49 = 0.571428571
    ```

    So 46 of the 49 favour retrieval practice, as the paper says elsewhere. The 18 small ones are
    small benefits, not losses.

    Now search for Pakistan. It is in Table 2, under Location.

    ```table
    | where the experiments were run | experiments |
    | United States, Denmark, Netherlands, Sweden | 47 |
    | Pakistan, Taiwan, Turkey | 3 |
    ```

    The paper calls the first four countries western, educated, industrialized, rich and
    democratic (WEIRD). Those seven countries are every country in the review. India is not one of them. Search once
    more, for medical schools.

    > and 10 experiments were conducted in medical schools

    Ten of 50 experiments were run on students like yours, and none of the 50 in your country.
    That is where your own measurement comes in (`S57-R1-C02`).

    Last, search for without feedback.

    > Studies without feedback resulted in mostly small or very small effects on learning.
  analogy_breaks_when: |
    The 49 effect sizes are not one experiment repeated 49 times. The designs, subjects and
    delays differ, and the authors chose not to average them. Read "28 of 49 above 0.50" as a
    count, not as the size of the effect you should expect.

    The classroom effects were smaller when the final test came at the end of a semester than
    when it came one to three days after the last quiz. A quiz this week does not by itself carry
    to an examination months away. The next section is about that.
