- body: |
    Now build the last ten minutes of your own session with the three conditions in it. Say the
    session taught a batch how to read the nutrition panel on a packet of biscuits.

    Ask them to put their notes and phones away. Each student, alone, writes down every step of
    reading the panel they can remember. No talking to a neighbour. Weinstein and colleagues
    describe exactly this move: "asking students to put their class materials away and try to
    write out everything they know about a topic".

    Tell them nobody will collect the sheets. Then show the steps on the board and let each
    student mark their own sheet.

    Each choice has a reason in the evidence. Alone: Agarwal's review excluded pairs, because in a
    pair one student may do the remembering while the other watches. Low-stakes: Weinstein
    reports a study where students quizzed under high pressure did worse on a later test than
    students quizzed under low pressure. The answer at the end: practice testing with feedback
    beats restudy more reliably than testing alone.

    Next week, open the class with three short questions on this week's panel before you teach
    anything new. Then you have a second retrieval, on a delay.

    The same design works outside a lecture hall. At a monthly meeting of accredited social
    health activist (ASHA) workers, each person answers aloud in turn, before the answer is given.
  analogy_breaks_when: |
    If almost nobody can answer, the attempt teaches little on its own. Weinstein's review says
    retrieval that is "extremely low" in success is unlikely to help, "particularly in the absence
    of feedback". Give the answer every time, and teach again what most of the room missed.

    Answering aloud in turn is not the same as each person writing alone. Later speakers hear the
    earlier answers. The classroom evidence above is for individual retrieval.
  numbers: []
must_know:
- point: |
    "A test is for finding out what they know; the teaching happens before it" is the error. The
    attempt to recall is itself a learning event.
  kind: misconception
  bearing: teaching
  refs:
  - roediger_karpicke_2006_testing_effect
- point: |
    Run retrieval so that every learner answers alone and without notes, the score counts for
    little or nothing, and the correct answer follows the attempt.
  kind: move
  bearing: teaching
- point: |
    Keep quizzes that are for learning low-stakes.
  kind: consequence
  bearing: teaching
  refs:
  - weinstein_2018_science_of_learning
- point: |
    In classrooms, 28 of 49 effect sizes were above 0.50 and 46 of 49 favoured retrieval
    practice (Agarwal and colleagues, 2021).
  kind: number
  bearing: methodological
  refs:
  - agarwal_2021_retrieval_practice
- point: |
    None of the 50 classroom experiments in that review was run in India. Measure it in your own
    batch, with a delayed test.
  kind: india_deviation
  bearing: policy
  refs:
  - agarwal_2021_retrieval_practice
- point: |
    Retrieval with no feedback and little success is where the method stops paying. Classroom
    studies without feedback showed mostly small or very small effects. When most of the room
    cannot answer, give the answer and reteach; do not count the silence as practice.
  kind: boundary
  bearing: teaching
  refs:
  - agarwal_2021_retrieval_practice
  - weinstein_2018_science_of_learning
- point: |
    If your final test repeats the quiz questions word for word, a gain may be memory of those
    questions. To find out whether they learned the idea, test it with new questions.
  kind: trap
  bearing: methodological
  refs:
  - agarwal_2021_retrieval_practice
exercises:
- type: design
  prompt: |
    Take one hour you will teach in the next month: a batch of MBBS students, a group of
    residents, or a meeting of ASHA workers. Plan its last ten minutes.

    Write down four things. What will each learner try to recall? How will you make sure each one answers alone? How
    will you keep the stakes low? When will they see the right answer? Then write down when they
    will recall it a second time, and on what day you will test whether it lasted.
  answer: |
    A good plan names four things, and each can be checked against the evidence in this section.

    What they retrieve: something specific from the hour, such as "the four steps of reading the
    panel", not "anything you remember".

    Alone: each learner writes, or answers in private. A chorus answer, or a pair answering
    together, lets some learners watch rather than retrieve. Agarwal's review kept only
    experiments where each student retrieved individually.

    Low stakes: the score is not recorded, or counts for almost nothing, and you say so before
    they start.

    Feedback: the correct answer comes after every attempt. Without it, the classroom effects
    were mostly small.

    The second retrieval sits on a later day, not straight after the first. The test of whether
    it lasted comes days after the session, not in its last five minutes. At five minutes,
    rereading can look better than recall.

    A plan that tests understanding uses at least some questions that are worded differently
    from the quiz.
  skill_ref: S57-R1-K01
- type: teaching
  prompt: |
    A journalist rings you for three minutes. She has read that "tests help students learn" and
    wants to know whether that is true, and whether it has been shown in India. Say what you
    would tell her, including one quotable sentence.
  answer: |
    Answer first. Yes: trying to remember something helps you keep it better than reading it
    again, and this has been tested many times.

    Give one concrete result. In one experiment, students who tried to recall a passage
    remembered 56% of it a week later; students who reread it remembered 42%.

    Give the classroom evidence with its limit. In a review of 50 classroom experiments, almost
    all favoured the recall practice. None was done in India.

    A quotable sentence: "A quiz does not only measure learning. Given without pressure, with the
    answers afterwards, it is one of the best-tested ways of causing it."

    Calibrate. The evidence is strong that it works; how big the gain is in an Indian classroom
    has not been measured in this body of work. Do not say "tests raise marks by" any figure.
  confidence_first: true
retrieval_items:
- q: How large was the benefit of trying to recall, a week later, in Roediger and Karpicke's first
    experiment?
  a: 56% of the tried-to-recall passage against 42% of the reread one, 14 percentage points,
    reported as d = 0.83, most of a standard deviation.
- q: What three conditions did the classroom evidence build into retrieval practice?
  a: Each learner retrieves alone and without notes; the stakes are low; the correct answer
    follows the attempt.
- q: How many of the 50 classroom experiments in Agarwal and colleagues' review were run in India?
  a: None. 47 were in the United States, Denmark, the Netherlands and Sweden, and 3 in Pakistan,
    Taiwan and Turkey.
