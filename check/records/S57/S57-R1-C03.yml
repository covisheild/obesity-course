simplified_explanation: |
  Most of us were taught that a test measures learning. It also causes it. Pulling something out
  of memory makes it easier to pull out again later. Reading it again does much less, even
  though it feels like more.

  The catch is timing. Straight after a session, what was reread looks better.

  Three things make the method work in a classroom. Every learner answers, alone, without notes.
  The score counts for little or nothing, so the test is practice and not judgement. And after
  they have tried, they see the right answer.

  The classroom evidence is large and mostly from the United States and Europe. Ten of the
  experiments were in medical schools. None was in India.
illustrations:
- body: |
    You met Roediger and Karpicke's first experiment in `S57-R1-C01`. There it showed that a
    check in the last five minutes can pick the wrong method. Here, ask a different question of
    the same result: how big is the benefit of trying to recall, in the unit `S57-R1-C02` gave
    you for comparing results?

    Open Roediger and Karpicke, "Test-enhanced learning: taking memory tests improves long-term
    retention", *Psychological Science* 2006, at https://doi.org/10.1111/j.1467-9280.2006.01693.x.
    Each student read two short passages. One they read again. For the other, they wrote down all
    they could remember, and nobody told them what they got wrong. Search the text for 81%.

    > restudying produced better recall than testing (81% vs. 75%)

    Beside it the paper prints d = 0.52. Read on to the 2-day and 1-week results.

    > the initially tested group recalled more than the additional-study group (68% vs. 54%)

    > The tested group recalled 56% of the material, whereas the restudy group recalled only 42%

    Beside these it prints d = 0.95 and d = 0.83. The d is a standardised mean difference: the
    gap between the two means, in standard deviations. The paper gives each d as a size, with no
    sign. Give it the sign of the direction, tried to recall minus read again, as `S57-R1-C02`
    taught you to do for a mean difference. The gap in percentage points (`B0-R0-C04`) goes
    beside it.

    ```working
    75 minus 81 = -6
    68 minus 54 = 14
    56 minus 42 = 14
    ```

    ```table
    | test taken after | read it again (%) | tried to recall it (%) | gap (points) | d, recall minus reread |
    | 5 minutes | 81 | 75 | -6 | -0.52 |
    | 2 days | 54 | 68 | 14 | 0.95 |
    | 1 week | 42 | 56 | 14 | 0.83 |
    ```

    Two things to see. First, the benefit of trying to recall is not small once there is a delay:
    close to one standard deviation at 2 days. Second, the same 14-point gap gives two different
    d values. A d divides the gap by a spread, and the spread was not the same at the two delays.
    That is why you quote the gap in points beside the d.
  analogy_breaks_when: |
    These were undergraduates at one university reading two short passages, one on the Sun and
    one on sea otters, tested by writing out what they recalled. Each student had one passage each way.
    The numbers give the direction and a rough size in that setting, not what your batch will
    score.

    The d values come from one small laboratory experiment. The classroom evidence, next, is the
    better guide to size.
