    citekey: frich_2015_physician_leadership
    as_of: '2026-09-25'
    derived: "45 studies minus the 4 with a comparison group"
    quote: |-
      Comparison group | 4 (9)
- body: |
    Picture your first year as an Assistant Professor of Community Medicine. By its end, three
    things are in your hands.

    The first is your mentees. The CBME Curriculum 2024 gives each mentor three first-year
    students during the Foundation Course. They stay with you until they finish internship, and
    three more are added each year. Stay five years in one college and the count is easy.

    ```working
    3 times 5 = 15
    ```

    Fifteen students have been yours.

    The second is a survey team. For one month you run four interns and two ASHA workers,
    weighing and measuring children in two villages.

    The third is the department's monthly journal club, which you started.

    Now ask each one the same question. What happens to it the day you leave?

    - The mentees carry what you taught them. If some of them teach it to their own juniors, it
      goes on spreading without you. That is a teaching lineage. It is measured in people, over
      years, and it grows only through teaching and time with each person.
    - The survey stops, or passes to whoever runs it next. That is a team you run. It exists for
      one job. It needs direction, roles and work handed out, and the next section gives you the
      words for those.
    - The journal club either stops, or keeps meeting because it has written rules, a rota of
      convenors and a named successor. Only in the second case is it an institution that
      outlives you. Building one means making yourself unnecessary to it, on purpose.

    Kotter, writing about companies, puts the last of these highest: "Institutionalizing a
    leadership-centered culture is the ultimate act of leadership." That is his judgement, not a
    finding. It does tell you which of the three is hardest to fake.
  analogy_breaks_when: |
    The survey team, the journal club and the five years are made up for this example; the
    mentor numbers are the curriculum's.

    The three are not always separate. A team you run well can turn into a lineage, and an
    institution needs a team to run it in any given year. The question "what happens when I
    leave?" sorts what you have built. It does not tell you how to build it.
  numbers:
  - value: "3"
    unit: "mentees given to each mentor in the Foundation Course, and added each year"
    citekey: nmc_cbme_2024
    as_of: '2026-09-25'
    quote: |-
      Each year when 3 new mentees are added from phase 1 to the mentor
  - value: "15"
    unit: "students mentored over five years (the five years are the example's)"
    citekey: nmc_cbme_2024
    as_of: '2026-09-25'
    derived: "3 new mentees a year times 5 years, the example's period"
    quote: |-
      Each year when 3 new mentees are added from phase 1 to the mentor
must_know:
- point: |
    Being the best at the work does not make you able to lead others in it. When you are chosen
    to run something because you know the most, expect to have to learn a second skill.
  kind: misconception
  bearing: policy
  refs: [stoller_2020_leadership, kotter_1990_what_leaders_do]
- point: |
    "Leadership training works" is thinly tested. Do not say they are shown to change
    practice.
  kind: number
  bearing: policy
  refs: [frich_2015_physician_leadership]
- point: |
    You lead before you have a title. Take the small chances now: run the journal club, lead
    the camp, own one change on the ward.
  kind: move
  bearing: teaching
  refs: [stoller_2020_leadership, frich_2015_physician_leadership, kotter_1990_what_leaders_do]
- point: |
    Ask of anything you run: what happens to it the day I leave? If the answer is "it stops",
    you have built a team, however long it has run. If you want it to last, write its rules and
    name a successor while you are still there.
  kind: consequence
  bearing: policy
- point: |
    Your first lineage is handed to you. From your first post as Assistant Professor you can be
    made a mentor. You get three first-year students a year, and they stay with you until they
    finish internship.
  kind: india_deviation
  bearing: teaching
  refs: [nmc_cbme_2024]
- point: |
    Join one professional body and one civil society organisation, and be useful to both.
  kind: move
  bearing: public
- point: |
    The claim that leading can be learned rests on argument and on programme reports, not on
    trials. Judge a course as you would judge a teaching session: ask what was measured, at what
    level, and against what comparison.
  kind: boundary
  bearing: methodological
exercises:
- type: retrieval
  prompt: |
    Name the three things a leader is asked to build, as this section defines them. Give the one
    question that tells them apart, and what the answer is for each.
  answer: |
    A teaching lineage, a team you run, and an institution that outlives you.

    The question is: what happens to it the day you leave? The lineage goes on in the people you
    taught, and in the people they teach. The team's work stops or passes to its next leader. The
    institution keeps working without you, because it has written rules, roles and a successor.
  confidence_first: true
- type: critique
  prompt: |
    The Dean says at a committee meeting: "Dr Rao is the best physician we have. She has
    published more on obesity than anyone in the state. Make her head of the new obesity clinic
    and it will run itself." Find the step in the argument that does not follow, and say what you
    would want to know before agreeing.
  answer: |
    The premises may all be true. Dr Rao may be the best physician and the most published. The
    step that fails is from "best at the work" to "able to lead the people who do the work".
    Knowing the work and leading others in it are different skills.

    "It will run itself" is a second slip. A new clinic is a change. Someone has to decide what
    it is for, and bring the nurses, dietitians and referring doctors round to it. Someone also
    has to draw up its rota and its budget.

    Before agreeing, ask what Dr Rao has led before: a unit, a project, a team of any size. Ask
    what she wants to do, since the job will take time from the work she is best at. And ask who
    will run the clinic day to day if she decides what it is for. None of this says she is
    the wrong choice. It says her record as a physician does not settle it.
- type: teaching
  prompt: |
    For a journalist, three minutes, no jargon. The journalist asks: "Can you teach doctors to be
    leaders, or are leaders born?" Give one quotable sentence, and be honest about how strong the
    evidence is.
  answer: |
    The quotable sentence: "Leading is a skill doctors can learn, but we have mostly asked the
    doctors whether it worked, and hardly ever checked."

    Then the detail. The best-known writers on leadership say it does not depend on charisma.
    Leadership courses for doctors are common: one review found 45 published studies of them by
    2013. Every one reported a benefit. But nearly all the benefit was what the
    doctors said about themselves, measured straight after the course. Only four studies compared
    trained doctors with untrained ones. Studies that found nothing were probably less likely to
    be published.

    So: probably learnable, taught often, and tested badly. The evidence is weak, not negative.
retrieval_items:
- q: What did most of the 45 studies in Frich and colleagues' review rest on, and how many had a comparison group?
  a: Learner satisfaction and self-assessed knowledge or behaviour. Four had a comparison group.
- q: What question tells a teaching lineage, a team and an institution apart?
  a: What happens to it the day you leave.
- q: What is a civil society organisation?
  a: A group formed by citizens, outside government and outside business, to work for a public cause.
