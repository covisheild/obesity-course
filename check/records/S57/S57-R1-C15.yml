definition:
  text: |
    To lead people is to get a group to move towards a change and to keep them at the work it
    takes.

    Skill at the work and skill at leading others in it are different competencies. Kotter (1990)
    argued that leadership has nothing to do with charisma or other exotic personality traits,
    and is not the province of a chosen few.

    Leadership is taught to physicians, and the teaching has been evaluated. Frich and
    colleagues' systematic review found 45 published studies of leadership development programmes
    for physicians, searched in one database up to November 2013. All 45 reported positive
    outcomes. Four had a comparison group.

    That such training changes what physicians do at work, or the results of the service they
    work in, has been tested in very few studies.

    A teaching lineage is the people you teach, and the people they go on to teach. A team you
    run is a set of people whose work on one job you direct, for as long as the job lasts. An
    institution that outlives you is a standing group, with written terms, roles and a named
    successor, that keeps working after you leave it.

    A professional body is an association whose members share one profession or discipline. A
    civil society organisation is a group formed by citizens, outside government and outside
    business, to work for a public cause.
