    citekey: frich_2015_physician_leadership
    as_of: '2026-09-25'
    quote: |-
      Pre/post | 23 (51)
  - value: "4"
    unit: "studies with a comparison group (Table 2)"
    citekey: frich_2015_physician_leadership
