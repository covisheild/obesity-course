simplified_explanation: |
  Here is the usual path. The resident who knows the most is made chief resident. Everyone
  assumes the skill carries over. Often it does not, because knowing the work and getting
  others to do it well are different skills.

  So is leading a gift you have or do not have? Those who write about it, such as Kotter, say
  no. It can be learned, like teaching.

  Many programmes teach leadership to doctors, and every published study of them reports
  success. Almost all of that success is what the doctors said about themselves, mostly
  measured straight after the course. Leadership is taught, and doctors say they learn from it.
  Whether it changes what they do is barely tested.

  You will be asked to build three different things. To tell them apart, ask one question: what
  happens to it the day you go?
illustrations:
- body: |
    Here is the trap. A senior colleague tells your department meeting: "Leadership can be
    taught. A review of 45 studies found that every leadership programme for doctors worked."

    Open the review, Frich and colleagues, "Leadership development programs for physicians: a
    systematic review", *Journal of General Internal Medicine* 2015, at
    https://pmc.ncbi.nlm.nih.gov/articles/PMC4395611/. Search the page for "Positive outcomes".

    > Positive outcomes were reported in all studies, although the majority of studies relied
    > on learner satisfaction scores and self-assessed knowledge or behavioral change.

    So your colleague is right that every study reported a positive outcome. The section on liking a
    session sorted these same outcomes by level, and most sat at the bottom two. Now ask a
    different question: what was each study compared with? Find Table 2 and read its rows
    under "Evaluation design".

    ```table
    how the study was designed               studies (of 45)
    measured after the programme only        22
    measured before and after                23
    had a comparison group                   4
    ```

    The first two rows cover every study once.

    ```working
    22 plus 23 = 45
    ```

    The four with a comparison group are among those 45, not extra to them. That leaves 41
    studies with nothing to compare against.

    ```working
    45 minus 4 = 41
    ```

    A study measured after the programme only cannot show a change. A study measured before and
    after shows a change, but not that the programme caused it: the section on testing a
    teaching method set out why. Only the four could compare trained physicians with untrained
    ones.

    Now search for "publication bias". The authors expect that studies finding no effect were
    less likely to be published. So "every study worked" is partly a fact about what gets
    printed.

    Here is what you can say instead. Leadership programmes for doctors are common. Doctors
    report learning from them. Whether the programmes change what doctors do at work has been
    tested in very few studies.
  analogy_breaks_when: |
    The counts describe published studies of leadership programmes for physicians, found in one
    database up to November 2013. A newer review may find more comparison-group studies. Before
    you quote these numbers after 2026, search for one.

    Weak evidence that training works is not evidence that it does not. The claim is untested
    more than it is refuted.
  numbers:
  - value: "45"
