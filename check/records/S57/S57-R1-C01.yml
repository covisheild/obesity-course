must_know:
- point: |
    A high score on a quiz at the end of your session is not evidence that the batch learned. It
    measures performance minutes after the teaching. In Roediger and Karpicke's second experiment,
    the group that did best at 5 minutes did worst a week later.
  kind: misconception
  bearing: teaching
  refs:
  - roediger_karpicke_2006_testing_effect
- point: |
    Do not read a learner's rating of how much they learned as a measure of learning. In
    Deslauriers's experiment, a chance process decided who was taught actively. Those students
    scored almost half a standard deviation higher on the end-of-class test. They rated their
    learning more than half a standard deviation lower.
  kind: misconception
  bearing: teaching
  refs:
  - deslauriers_2019_feeling_of_learning
- point: |
    Before you call a session a success, book a second short test on the same objective, a week or
    more later. Write the date down at the planning stage, not afterwards, or it will not happen.
  kind: move
  bearing: teaching
- point: |
    When you ask learners to work problems instead of watching you solve them, expect some to say
    they are learning less. Do not switch back to lecturing on the strength of that complaint.
    Tell them at the start that effort is part of how it works. Deslauriers's group did this in a
    20-minute talk. By the end of that semester, over 65% of students said their view of active
    learning had improved. That was a survey in one course with no comparison group.
  kind: trap
  bearing: teaching
  refs:
  - deslauriers_2019_feeling_of_learning
- point: |
    When a committee judges teachers by students' feedback ratings, say that the ratings measure
    feeling of learning. Deslauriers and colleagues warn that such evaluations could favour
    lecturing over methods that teach more. Ask for a delayed test result alongside the ratings.
  kind: consequence
  bearing: policy
  refs:
  - deslauriers_2019_feeling_of_learning
- point: |
    These results reach only as far as they were measured: the end of a class in Deslauriers,
    one week in Roediger and Karpicke. A skill your learners need in six months has not been
    tested by either. Test at the interval you actually care about, and do not treat a one-week
    result as proof of a six-month one.
  kind: boundary
  bearing: methodological
  refs:
  - roediger_karpicke_2006_testing_effect
  - deslauriers_2019_feeling_of_learning
- point: |
    A learner's own rating is weakest where you most need it, in a beginner. Deslauriers found
    that ratings tracked test scores more closely in students who already knew more physics. With
    a new batch, give a test before you trust a show of hands.
  kind: boundary
  bearing: teaching
  refs:
  - deslauriers_2019_feeling_of_learning
retrieval_items:
- q: What are the three things this book keeps apart, and which one is learning?
  a: Performance during or just after a session, the learner's feeling of learning, and what the
    learner can still do after a delay. Only the last is learning.
- q: In Roediger and Karpicke's second experiment, which group recalled most at 5 minutes, and
    which recalled most at 1 week?
  a: The group that read the passage four times (SSSS) recalled most at 5 minutes, 83%. The group
    that read it once and took three tests (STTT) recalled most at 1 week, 61%, against 40% for SSSS.
- q: What does an end-of-session feedback form measure?
  a: The learners' feeling of learning, not learning. It can point the opposite way from a later
    test.
