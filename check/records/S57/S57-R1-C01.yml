simplified_explanation: |
  A session can go well and teach much less than it seemed to.

  Reading something twice makes it feel familiar, and the familiar feels learned. A smooth lecture
  feels clear, and the clear feels learned. Work that makes learners struggle feels worse, even when
  it teaches more.

  So a quiz at the end of your session measures performance. A feedback form measures feeling.
  Neither measures learning. You find out about learning by testing again after a delay, a week
  or more, with new questions on the same objective.

  "They enjoyed it and they answered well at the end, so they learned it." Both premises can be
  true. The inference still does not carry, because the conclusion is about a later day that neither
  premise measured.
illustration:
  body: |
    You have just taught a batch of third-year MBBS students (the Bachelor of Medicine and Bachelor
    of Surgery course) how to classify body-mass index. At the end, you hand out a feedback form
    and a short quiz. The forms say the session was clear. Most students get the quiz right. You
    are about to write "objective achieved" in your teaching log.

    Before you write it, open Roediger and Karpicke, "Test-enhanced learning", *Psychological
    Science* 2006, at https://doi.org/10.1111/j.1467-9280.2006.01693.x. Go to Experiment 2.

    Students learned one short prose passage. Each student had four periods in a row, used in one
    of three ways. S stands for a study period: 5 minutes of reading. T stands for a test period:
    10 minutes of writing down everything they could remember, with no feedback.

    - SSSS: read it in all four periods, no test.
    - SSST: read it three times, then one test.
    - STTT: read it once, then three tests.

    Then everyone took one final recall test. Half took it 5 minutes later. The other half took it
    1 week later. Here are the percentages of the passage recalled on that final test.

    ```table
    group   after 5 minutes (%)   after 1 week (%)
    SSSS    83   40
    SSST    78   56
    STTT    71   61
    ```

    Read the first column. Reading four times wins.

    Now read the second column. The order has turned round.

    ```working
    61 minus 40 = 21
    ```

    The group that was ahead by 12 percentage points at 5 minutes is behind by 21 a week later.

    Now find Table 2. At the end of the first session, before any final test, each student filled
    in a short rating form. One question asked how well they would remember the passage in 1 week,
    on a 7-point scale. The SSSS group gave
    4.8. The STTT group gave 4.0. The group most sure it would remember was the group that remembered
    least a week later.

    Your quiz is the first column: performance, minutes after the teaching. Your feedback form is
    the rating in Table 2: a feeling. Neither is the second column. To fill in the second column
    for your own batch, set a short test on the same objective a week or more later.
  analogy_breaks_when: |
    The numbers come from undergraduates at one university. The numbers do not tell you what
    happens after a month. A test taken minutes after teaching, or a learner's own rating, can
    point the opposite way from a later test.
