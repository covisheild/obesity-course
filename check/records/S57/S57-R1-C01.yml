must_know:
- point: |
    A high score on a quiz at the end of your session is not evidence that the batch learned. It
    measures performance minutes after the teaching.
  kind: misconception
  bearing: teaching
  refs:
  - roediger_karpicke_2006_testing_effect
- point: |
    Do not read a learner's rating of how much they learned as a measure of learning. In
    Deslauriers's experiment, every student had one class taught actively and one taught by
    lecture, in an order decided by chance. In their active class they scored almost half a
    standard deviation (the spread of scores, `B0-R0-C28`) higher on the end-of-class test. They
    rated their learning more than half a standard deviation lower.
  kind: misconception
  bearing: teaching
  refs:
  - deslauriers_2019_feeling_of_learning
- point: |
    Before you call a session a success, book a second short test on the same objective, a week or
    more later.
  kind: move
  bearing: teaching
- point: |
    When you ask learners to work problems instead of watching you solve them, expect some to say
    they are learning less. Tell them at the start that effort is part of how it works. One course
    that did this saw most students say their view of the method improved, though nothing was
    compared.
  kind: trap
  bearing: teaching
  refs:
  - deslauriers_2019_feeling_of_learning
- point: |
    When a committee judges teachers by students' feedback ratings, say that the ratings measure
    feeling of learning.
  kind: consequence
  bearing: policy
  refs:
  - deslauriers_2019_feeling_of_learning
- point: |
    Test at the interval you actually care about, and do not treat a one-week result as proof
    of a six-month one.
  kind: boundary
  bearing: methodological
  refs:
  - roediger_karpicke_2006_testing_effect
  - deslauriers_2019_feeling_of_learning
- point: |
    A learner's own rating is weakest where you most need it, in a beginner. Deslauriers found
    that ratings tracked test scores more closely in students who already knew more physics. With
    a new batch, give a test before you trust a show of hands.
  kind: boundary
  bearing: teaching
  refs:
  - deslauriers_2019_feeling_of_learning
exercises:
- type: interpretation
  prompt: |
    Your teaching log for one session reads: "End-of-session quiz, mean 8 out of 10. Feedback
    form, mean 4.5 out of 5 for 'I understood the topic'. Objective achieved." Say what each
    number measures. Say what you would add before writing "objective achieved".
  answer: |
    The quiz mean measures performance: what the batch could do minutes after the teaching. The
    feedback mean measures feeling of learning: how much they think they learned. Neither
    measures learning.

    Both can point the wrong way. In Roediger and Karpicke's second experiment, the group that
    did best at 5 minutes, and was surest it would remember, recalled least a week later.

    Add a short test on the same objective, with new questions, a week or more later. Only its
    result can support "objective achieved".
retrieval_items:
- q: What are the three things this book keeps apart, and which one is learning?
  a: Performance during or just after a session, the learner's feeling of learning, and what the
    learner can still do after a delay. Only the last is learning.
- q: In Roediger and Karpicke's second experiment, which group recalled most at 5 minutes, and
    which recalled most at 1 week?
  a: The group that read the passage four times (SSSS) recalled most at 5 minutes, 83%. The group
    that read it once and took three tests (STTT) recalled most at 1 week, 61%, against 40% for SSSS.
- q: What does an end-of-session feedback form measure?
  a: The learners' feeling of learning, not learning. It can point the opposite way from a later
    test.
