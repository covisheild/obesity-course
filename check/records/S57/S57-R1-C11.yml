must_know:
- point: |
    "Any questions?" and a question to one student are not retrieval practice for the room. Ask
    a question every learner answers alone, in writing, so that you know every learner did the
    recalling.
  kind: misconception
  bearing: teaching
  refs: [agarwal_2021_retrieval_practice]
- point: |
    Write the plan as a table before the session: minutes, what you do, what every learner does.
    Then add up the minutes in which every learner answers from memory.
  kind: move
  bearing: teaching
- point: |
    A pre-test on material the learners never met measures where they start. It is not practice.
    Do not count it as part of the retrieval in your plan.
  kind: trap
  bearing: teaching
  refs: [weinstein_2018_science_of_learning]
- point: |
    For a hands-on objective, the retrieval is doing it. Each learner performs the step from
    memory while someone ticks a checklist of its steps. With one trainer, watch a few learners each session
    and say how many you watched.
  kind: move
  bearing: teaching
- point: |
    Questions spread through a session have not been shown to beat the same questions at its end. Spread them for other reasons: short
    teaching parts, attention, a turn for every learner. Do not tell colleagues the spreading itself is proven.
  kind: boundary
  bearing: methodological
  refs: [weinstein_2018_science_of_learning]
- point: |
    Give the in-session questions the same format as the tests. Change the case, not the kind of
    question.
  kind: move
  bearing: teaching
  refs: [agarwal_2021_retrieval_practice]
- point: |
    Book the delayed test before the session and write its date in the plan.
  kind: move
  bearing: teaching
- point: |
    A plan that meets every part here says what the learners did. Present your plan as a
    design, not as a result.
  kind: boundary
  bearing: methodological
exercises:
- type: critique
  prompt: |
    A senior resident runs a journal club for eight residents. Her plan: she presents the trial for
    30 minutes. Then she picks residents one at a time and asks each a question about it. Their
    answers are marked, and the marks count in their formal assessment. The session ends there.

    Name each place where this plan departs from a session built around retrieval. For each, say
    what you would change.
  answer: |
    One resident at a time answers. The other seven listen, so for most of the questioning most of
    the room is not recalling anything. Change: ask every resident the same question, each writing
    an answer alone before anyone speaks.

    Marks that count can make the questions feel high-stakes. `S57-R1-C03` showed one study where
    pressure during quizzing cut the later benefit. Change: keep these questions out of formal
    assessment, so that nobody is afraid to get them wrong.

    Nobody is told the right answer. Change: after the written answers, give the answer, or the
    key points of a good one, and let each resident check their own.

    Thirty minutes of presenting in one block. Change: break it into short parts, each followed
    by one written question.

    No objective, no pre-test, no closing free recall and no delayed test. Change: write one
    objective, such as judging whether the trial's comparison was fair. Test it before and after
    on two different abstracts, and book a third abstract for a week later.
- type: build
  prompt: |
    This book's build: deliver one teaching session built around retrieval, with a written
    objective. Choose a real group: a batch of MBBS students, residents, or a session for accredited social
    health activist (ASHA) workers. Before the session, prepare and date these.

    1. The objective, with all six parts.
    2. Two parallel forms of the test, and how the group splits between them.
    3. The session plan as a table: minutes, what you do, what every learner does.
    4. The questions for each teaching part, each with its answer.
    5. The date of the delayed test.

    Deliver the session. Afterwards, keep every learner's pre-test and post-test. Give the delayed
    test on its date. Write three lines on what departed from the plan.
  answer: |
    Check your pack before the session against this list.

    - The objective has who, one action you can watch or mark, the content, the condition, the
      standard and by when.
    - Every test item asks for that action on a case not used in the teaching. The two forms pair
      item by item. Half the group takes each form first, decided in advance.
    - The plan has the seven parts in order. Objective, pre-test, and short teaching parts, each
      with a written question and its answer. Then a question from earlier material, free recall,
      the post-test, and a booked delayed test.
    - Every in-session question is answered by every learner, alone, in writing, notes away, and
      then checked against the answer you show.
    - No mark from the in-session questions goes into internal or any other formal assessment.
    - You have added up the minutes in which every learner answers from memory, and written the
      total on the plan.

    After the session, the build is met when the session happened as planned and the three sets
    of scores are kept. Whether the learners gained is a separate question, answered from those
    scores.
  skill_ref: S57-R1-K01
- type: teaching
  prompt: |
    A district health officer asks whether the district's one-day refresher trainings for ASHA
    workers should switch from lectures to sessions built around retrieval. One page, answer first,
    no methods section.
  answer: |
    The answer first: try it in a few trainings first, and measure it. Do not switch everything
    on the evidence we have.

    Why it is worth trying. In the classroom studies Agarwal and colleagues reviewed, having
    every learner answer questions from memory, then showing the answer, taught more than the
    same time spent on lectures without quizzes.

    Why not switch everything at once. Those studies were in schools, colleges and medical
    schools. The review names no training for ASHA workers. The effect may hold for them. The
    review cannot tell you.

    What to do. Pick a few trainings. Keep the content, and cut the talking into short parts.
    After each part, ask every ASHA one question she answers on her own. Then give the answer. Test
    what she can do, not what she can recite, at the end and again a month later. Compare with
    trainings run the old way.

    What it costs. Trainer time to rewrite the sessions and one short test a month later. No new
    staff.
retrieval_items:
- q: List the seven parts of a session plan built around retrieval, in order.
  a: The objective; a pre-test on one of two parallel forms; short teaching parts, each followed by
    a written question every learner answers alone and then its answer; one question on earlier
    material; a closing free recall; a post-test on the other form; a delayed test booked in
    advance.
- q: Why is a pre-test on new material not counted as retrieval practice?
  a: The learners have nothing to bring back from memory. Retrieval with very low success is
    unlikely to strengthen memory, especially without feedback, so the pre-test only measures the
    starting point.
- q: What has not been shown about spreading questions through a session?
  a: That it beats asking the same questions at the end. In the study Weinstein and colleagues
    report, placement made no difference on a later test; the reasons to spread them are short
    teaching parts, attention and a turn for every learner.
