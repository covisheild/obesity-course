simplified_explanation: |
  Most sessions are built around the teacher talking. The learners listen, and at the end
  someone asks "any questions?". This section builds a session the other way round.

  The earlier sections gave you the pieces. This section puts them in order on one page, the
  session plan, with the minutes for each part.

  Then you count. How many of the 60 minutes did every learner spend answering from memory? In a
  lecture the answer is close to none. In this plan it is 30.
illustrations:
- body: |
    Start with a plan that fails. A colleague shares his plan for a one-hour session on body mass
    index (BMI) for a final-year MBBS batch of 30.

    - 45 minutes: slides on BMI, with examples.
    - 10 minutes: "Any questions?"
    - 5 minutes: a quiz. "Write the formula for BMI."

    Count the minutes in which every learner pulls something from memory. The slides: none. The
    questions: a few students ask, the teacher answers, and the rest listen. Nobody is made to
    recall anything. The quiz: 5 minutes, and it asks for a line from the slides. The last section
    showed that such an item tests memory of the session, not the objective.

    Now look for what is missing. There is no objective, so nothing to test against. The pre-test
    gets 0 minutes, so there is no starting point. There is no feedback: the quiz is collected
    and nobody sees the right answer. There is no delayed test, so the plan cannot show
    learning. `S57-R1-C01` said learning is what lasts, and it is what this plan never measures.

    This is a transmission session. The slides may be excellent. The design gives the learners
    almost nothing to do.
  analogy_breaks_when: |
    The colleague's plan is made up, though its shape is common. A lecture is not worthless: it
    can be the fastest way to lay out new material. What fails here is the hour's balance, 45
    minutes of telling and 5 of recall, and the missing checks.
- body: |
    Now rebuild it around the objective you wrote two sections back: each student classifies ten
    new adults' BMI, given a table, eight of ten right. The plan runs for 60 minutes. The batch is
    split in half for the two forms, as the last section showed.

    ```table
    | step | minutes | the teacher | every learner |
    | 1. objective | 2 | writes it on the board, reads it out | reads it |
    | 2. pre-test, form A or B | 10 | hands out the forms, half the batch each | classifies ten adults, alone, notes away |
    | 3. teaching part 1: working out BMI from kg and cm | 6 | explains, works one example | watches |
    | 4. question 1, then its answer | 4 | gives one new adult, waits, then shows the worked answer | writes the BMI, then checks it |
    | 5. teaching part 2: reading the table | 6 | explains, works one example | watches |
    | 6. question 2, then its answer | 4 | gives one new adult, then the answer | writes the category, then checks it |
    | 7. teaching part 3: adults near the edge of a category | 6 | explains, works one example | watches |
    | 8. question 3, then its answer | 4 | gives one new adult near an edge, then the answer | writes the category, then checks it |
    | 9. question from last week | 3 | asks one question on last week's topic, then the answer | writes an answer, then checks it |
    | 10. free recall | 5 | "Notes away. Write all you can about working out and reading BMI." Then shows the key points | writes, then checks against the key points on the board |
    | 11. post-test, the other form | 10 | hands each learner the form they did not take first | classifies ten adults, alone, notes away |
    ```

    The delayed test is booked now, for the first 10 minutes of next week's session. Write its
    date into the plan. Use a third parallel form if you can build one. If not, give each
    learner the form they took first. A week later they may still remember some of its items, so
    the delayed score may run slightly high. Say so when you report it.

    Walk through why each part is there.

    The objective goes first so every learner knows what they will be asked to do.

    The pre-test gives each learner a starting score. For students who met BMI in an earlier year,
    it is also a first attempt at recall. For anyone who never met it, it is only a measurement.
    Trying to recall something you never learned is unlikely to strengthen memory, especially
    when no answer follows.

    The teaching parts are short, 6 minutes each. That is this plan's choice, not a figure from a
    study. `S57-R1-C08` showed that working memory holds only a few new elements at once. A short
    part followed by a question stops the new elements piling up, and it gives every learner a
    turn. Weinstein and colleagues also report that frequent testing can cut mind-wandering.

    Each question gives a new adult, not one from the slides, and asks for what the tests ask for.
    Every learner writes an answer, alone, before anyone speaks. Then you show the worked answer
    and each learner checks their own. `S57-R1-C03` showed why all three conditions matter.

    The question from last week puts spacing, from `S57-R1-C04`, into the hour. Last week's
    material comes back after a gap of a week.

    The free recall is retrieval of the whole topic in the learners' own order. It is the task
    Roediger and Karpicke's students did in `S57-R1-C03`: write down as much as you can. Writing
    it out also shows each learner what they cannot yet explain. `S57-R1-C07` showed that this is
    where understanding gets tested.

    Now count where the hour goes. The pre-test is counted apart: it measures. The post-test
    counts as retrieval, because it asks for what was just taught.

    ```table
    what fills the time                                   minutes
    explaining                                            18
    every learner answers from memory                     30
    measuring (the pre-test)                              10
    the objective                                         2
    ```

    ```working
    6 plus 6 plus 6 = 18
    4 plus 4 plus 4 plus 3 plus 5 plus 10 = 30
    18 plus 30 plus 10 plus 2 = 60
    ```

    Against the colleague's plan, explaining falls from 45 minutes to 18. So you cover less. That
    is the trade: in the classroom studies Agarwal and colleagues reviewed, which you met in
    `S57-R1-C03`, retrieval practice beat the same time spent on other activities, lectures
    without quizzes among them. One session is a fair place to start. In 10 of their 50 classroom
    experiments, all the retrieval practice fell within a single session.
  analogy_breaks_when: |
    The minutes are this plan's own choices, sized for one objective and a batch of 30 who have
    calculators. A topic with more new elements needs more or longer teaching parts, and fewer
    items per test.

    Ten minutes for a ten-item test assumes the learners work fast. Time a colleague on one form
    before the session. If they need 15 minutes, cut the teaching, not the questions.
