- body: |
    Now see how the review rates the techniques side by side. In the same article, go to the
    Closing Remarks and find Table 4. Before you read a single letter, settle what a row is and
    what a column is (`B0-R0-C39`).

    A row is one technique. The Utility column is the overall rating. The next five columns ask
    whether the benefit holds for different learners, for different materials, and for different
    kinds of final test. The review calls the final test the criterion task. The last two ask
    whether the technique is easy to put into use, and whether it has been shown in real
    classrooms. Each cell holds a letter. Search for negative (N) rating to read the key.

    > A positive (P) rating indicates that available evidence demonstrates efficacy of a learning
    > technique with respect to a given variable or issue. A negative (N) rating indicates that a
    > technique is largely ineffective for a given variable.

    Q means it worked in some conditions or groups and not in others. I means there is not
    enough evidence to say. A cell with two letters, such as P-I, is positive on one part of that
    column and short of evidence on another. Here are three of the ten rows.

    ```table
    | technique | utility | learners | materials | criterion tasks | issues for implementation | educational contexts |
    | Highlighting | Low | Q | Q | N | P | N |
    | Rereading | Low | I | P | Q-I | P | I |
    | Practice testing | High | P-I | P | P | P | P |
    ```

    Read the Rereading row first. Materials has a P: a second reading helped across many kinds
    of text. Issues for implementation has a P: it is easy to do. Yet the rating is Low. Search
    the rereading section for largest strike.

    > The relative disadvantage of rereading to other techniques is the largest strike against
    > rereading

    So Low is a comparison. Rereading does something. The same minutes spent on practice testing
    do more. Now read the Highlighting row. It has an N under criterion tasks: across the kinds
    of final test studied, highlighting did not raise the score.

    Last, put both rows beside the Practice testing row, which holds no Q and no N. That is the
    swap. Take the minutes a learner would spend on a second reading or a highlighter. Spend them
    on a closed-book attempt at recall, then a check (`S57-R1-C03`).
  analogy_breaks_when: |
    A letter in this table is the reviewers' judgement of a body of studies, not a measurement.
    Two techniques with the same letters need not have effects of the same size. The table gives
    you no effect sizes at all.

    The ratings are from 2013. For rereading, all but two of the studies the review knew of were
    of undergraduates. Your own batch is not in any of them.
- body: |
    `S57-R1-C01` walked you through Roediger and Karpicke's second experiment. Look at it again
    with one group in mind: SSSS, the students who spent all four periods reading the passage. It
    is the purest case of rereading in this book.

    Open "Test-enhanced learning", *Psychological Science* 2006, at
    https://doi.org/10.1111/j.1467-9280.2006.01693.x. Search for 14.2. On average, each SSSS
    student read the passage through 14.2 times across the four periods. Now find Table 2. Before
    any final test, each student rated how well they would remember the passage in 1 week, from 1
    (not very well) to 7 (very well).

    ```table
    | group | read it through (mean times) | expected to remember (mean, 1 to 7) | recalled after 1 week (%) |
    | SSSS | 14.2 | 4.8 | 40 |
    | SSST | 10.3 | 4.2 | 56 |
    | STTT | 3.4 | 4.0 | 61 |
    ```

    Read down the last two columns together. The group that reread most was the surest it would
    remember. It remembered least. Why would reading more make a group surer? Pashler and
    colleagues give one reason.

    Open Pashler, McDaniel, Rohrer and Bjork, "Learning styles: concepts and evidence",
    *Psychological Science in the Public Interest* 2008, at
    https://doi.org/10.1111/j.1539-6053.2009.01038.x. Near the end, search for sense of
    familiarity.

    > As learners, we can also be fooled by subjective impressions, such as the ease or sense of
    > familiarity we gain on reading expository text

    Expository text is text that explains, like a textbook. That ease is what this section calls
    fluency. The ease is real. Pashler's point is that it can come from things that have nothing
    to do with understanding.
  analogy_breaks_when: |
    The SSSS group did not only reread more. It also took no test before the final one. So the
    comparison is rereading instead of recall practice, not rereading against doing nothing.

    The ratings are group means on a 7-point scale. They show which group felt surest, not that
    any one student's feeling was wrong. And on a test 5 minutes after the last period, the SSSS
    group recalled the most (`S57-R1-C01`).
