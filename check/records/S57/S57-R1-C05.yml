simplified_explanation: |
  Ask a batch how they revise, and you will probably hear two things. They read their notes again. They
  mark the important lines with a highlighter. Both feel like work, and both feel like they are
  working.

  A large review of the evidence rated both low. Not useless: a second reading does help, and
  highlighting sometimes helps a reader who already knows what matters. Low, because the same
  hour spent another way does more.

  Why do they feel so good? Read a page a second time and it goes down easily. The words look
  familiar. That ease is fluency, and it feels exactly like knowing. But it only tells you the
  page is familiar. It does not tell you that you could say it back with the book shut.

  The swap is the one `S57-R1-C03` taught. Read once. Then close the book, write down what you
  remember, and check it against the page. It feels harder, and it is the part that lasts.
illustrations:
- body: |
    A student in your MBBS batch shows you her textbook. The chapter on nutritional anaemia is
    yellow from top to bottom. She has been through it twice. What does the yellow tell you?

    Open Dunlosky, Rawson, Marsh, Nathan and Willingham, "Improving students' learning with
    effective learning techniques", *Psychological Science in the Public Interest* 2013, at
    https://doi.org/10.1177/1529100612453266. Go to section 4, Highlighting and underlining, and
    search for Fowler and Barker.

    Undergraduates read articles of about 8,000 words. One group only read them. A second group
    highlighted as much as they liked. A third read copies the second group had marked. Every
    group had 1 hour. A week later, each student had 10 minutes to look over their copy, then
    took a 54-question multiple-choice test. Search for did not outperform.

    > Overall, the highlighting groups did not outperform the control group on the final test,
    > a result that has unfortunately been echoed in much of the literature

    The control group is the group that only read. Read on. The students who highlighted did
    better on questions about lines they had marked. They paid for it with a small loss on
    questions about lines they had not marked. Highlighting moved what they remembered around
    the text. It did not add to the total.

    Now search for marking almost everything.

    > with some students marking almost nothing and others marking almost everything

    A marked line helps because it stands out from the rest of the page. When most of the page is
    marked, nothing stands out. So her yellow chapter tells you she spent time on it. It does not
    tell you what she can recall with the book shut.
  analogy_breaks_when: |
    Fowler and Barker's students were undergraduates reading magazine articles, tested with
    multiple-choice questions a week later. That is one experiment. The low rating rests on
    many.

    The review also reports exceptions. In one classroom study, statements the instructors had
    underlined in red were answered better on the exam. Highlighting may also help a reader who
    knows enough to pick out what matters. So "highlighting never helps" goes further than the
    evidence. "Highlighting as students usually do it adds little" does not.
