must_know:
- point: |
    "I read it three times and it all looks familiar now" describes fluency, not learning. A
    page read again reads more easily, and that ease can come from things unrelated to
    understanding. When a learner says this, ask them to shut the book and say it back.
  kind: misconception
  bearing: teaching
  refs:
  - pashler_2008_learning_styles
- point: |
    Replace the second reading with a test. Dunlosky and colleagues' own advice is practice
    testing in place of rereading. Teach your batch the order: read once, close the notes, write
    what you remember, then check it against the notes.
  kind: move
  bearing: teaching
  refs:
  - dunlosky_2013_learning_techniques
- point: |
    Do not tell learners that rereading does not work. A second reading does improve recall over
    one reading, and spaced rereading holds up at modest delays. It is rated low because practice
    testing does more with the same time. Say that instead.
  kind: misconception
  bearing: teaching
  refs:
  - dunlosky_2013_learning_techniques
- point: |
    A heavily highlighted book is a sign of time spent, not of learning. In most studies,
    highlighting as students do it added little to reading alone. Many students mark almost
    everything, and then no line stands out. Check what a learner can recall with the book shut.
  kind: trap
  bearing: teaching
  refs:
  - dunlosky_2013_learning_techniques
- point: |
    Expect rereading to be your learners' default. At one highly selective university, 84% of
    students listed it among their study methods. Over half, 55%, named it the one they used
    most (Karpicke and colleagues, reported by Dunlosky). Ask a batch how they revise before you
    teach them how.
  kind: number
  bearing: teaching
  refs:
  - dunlosky_2013_learning_techniques
- point: |
    These ratings come mostly from laboratory studies of undergraduates. No experiment has tested
    rereading's effect on learning in a real course, and your own batch was in none of them. A
    batch may seem to do well on rereading. Compare it with practice testing on a delayed test
    before anyone concludes anything (`S57-R1-C02`).
  kind: boundary
  bearing: methodological
  refs:
  - dunlosky_2013_learning_techniques
exercises:
- type: teaching
  prompt: |
    A journalist writing for a newspaper's education page gives you three minutes. Her question:
    "Is highlighting a waste of students' time?" Say what you would tell her, including one
    quotable sentence, and say how sure the evidence lets you be.
  answer: |
    Answer first. Mostly, yes, as students usually do it. A large 2013 review of the research
    rated highlighting low: in most studies it did little beyond reading the text.

    Give one concrete result. In one experiment, students who highlighted articles did no better
    on a test a week later than students who only read them. They did better on what they had
    marked, and slightly worse on what they had not.

    Give the fair exception, so the answer stays true. It may help a reader who already knows what
    matters in a text. Teachers underlining a few key lines has helped in a classroom study.

    Give the better use of the time: close the book, write down what you remember, check it.

    A quotable sentence: "Highlighting shows where a student has been on the page, not what they
    can recall with the book shut."

    Calibrate. The evidence is consistent that highlighting adds little. It comes mostly from
    laboratory studies, and few were run in real classrooms. Do not say highlighting
    harms learning: that rests on a single study the reviewers say needs repeating.
  confidence_first: true
retrieval_items:
- q: How did Dunlosky and colleagues (2013) rate rereading and highlighting, and what does that
    rating mean?
  a: Both low utility. Low is a comparison. A second reading does improve recall over one, but
    practice testing does more with the same time. Highlighting as usually done added little to
    reading alone.
- q: What is fluency, and why does rereading feel like learning?
  a: The ease with which a text reads or a fact comes to mind. A page read again reads more
    easily and looks familiar, and that ease can come from things unrelated to understanding.
- q: In Roediger and Karpicke's second experiment, how did the group that only reread compare
    with the group tested three times?
  a: It was surer it would remember (4.8 against 4.0 on a 1-to-7 scale) and recalled less a week
    later (40% against 61%).
