must_know:
- point: |
    A test of recall cannot show that learners reached an objective above remember. Before you
    use a test, ask of each item whether a learner could answer it by repeating something from
    your session. If yes, it is testing memory of the session.
  kind: trap
  bearing: teaching
  refs: [adams_2015_bloom]
- point: |
    Write the test straight after the objective, before you plan the teaching. Then choose
    activities that make learners do what the test will ask.
  kind: move
  bearing: teaching
  refs: [biggs_1996_constructive_alignment, chatterjee_corral_2017_objectives]
- point: |
    "Use the same test before and after, so the comparison is fair" is the error. A repeated item
    can be answered from memory of the first attempt. Use two parallel forms: partner items that
    ask for the same action on different cases.
  kind: misconception
  bearing: methodological
  refs: [agarwal_2021_retrieval_practice]
- point: |
    Give half the group each order of the two forms, with the halves the same size. A difference
    in difficulty then cancels in the group's mean gain. It does not cancel for one learner, so
    never judge one learner from one pair of forms.
  kind: move
  bearing: methodological
- point: |
    A short test moves in big steps. On five items, each item is 20 percentage points. One lucky
    guess or one slip moves a learner a whole step.
  kind: boundary
  bearing: methodological
- point: |
    India's MBBS course follows the Competency Based Medical Education (CBME) Curriculum 2024, from
    the National Medical Commission. Its tables give each skill a level: K (knows), KH (knows how),
    SH (shows how) or P (performs). A skill at SH cannot be tested on paper: the learner must show
    you. Read the level before you write the test.
  kind: india_deviation
  bearing: teaching
  refs: [nmc_cbme_2024]
- point: |
    The CBME Curriculum 2024 builds internal assessment from day-to-day tests, and quizzes can
    count. A student needs at least 50% of those marks to sit the university exam in that
    subject. So a quiz whose marks count there is not low-stakes. Keep your practice questions out
    of it.
  kind: india_deviation
  bearing: teaching
  refs: [nmc_cbme_2024]
- point: |
    A matched test shows what learners can do when they take it. It does not show that your
    teaching caused it. For that you need the comparison of `S57-R1-C02`. Do not report a
    well-matched post-test as proof that the method works.
  kind: boundary
  bearing: methodological
exercises:
- type: critique
  prompt: |
    A trainer writes this objective for a half-day session with accredited social health
    activists (ASHAs), village health workers:

    > At the end of this session, each ASHA, given a child and the scale used at her centre, will
    > weigh the child and record the weight in the register, completing every step on the
    > programme's checklist, observed by the trainer.

    Her test is a written quiz of ten multiple-choice questions on the steps of weighing a child.
    Say whether the test matches the objective. If not, describe a test that does, and say how you
    would make a second form of it for the end of the session.
  answer: |
    It does not match. The objective's action is to weigh a child and record the weight. The quiz
    asks the ASHAs to recognise the steps on paper. An ASHA could pick every right answer and still
    miss a step with a real child and a real scale. This is Chatterjee and Corral's intubation
    example in another setting: a written exam for a hands-on objective.

    A matched test: each ASHA weighs a child, with her own centre's scale, while the trainer
    watches. The trainer ticks each step of the programme's checklist and checks the register
    entry. The standard is every step done.

    In the terms of the Indian curriculum, this is a skill to be shown, not a thing to know. It
    needs watching, as a competency at SH would.

    A second form: a different child. Or change the scale set-up, for example a scale that must
    first be set to zero. Keep the same checklist. What must stay the
    same is the action and the steps marked.
- type: design
  prompt: |
    Take the objective you wrote for your build session. Write a pre-test of at least five items
    and a parallel post-test, each item with its partner. For each pair, say what makes the item
    hard and how the partner keeps it. Then write down how you will split your learners between
    the two orders of the forms.
  answer: |
    Judge your pair of forms with four checks.

    - Every item asks for the objective's action, under its condition. None can be answered by
      repeating a sentence from the session.
    - Each partner changes the case or the numbers and keeps whatever makes the item hard. For
      BMI that was where the adult sits in the table. For reading an abstract it might be the
      length of the abstract and where the key sentence sits.
    - The marking follows the standard: right or wrong per item, or a key written in advance.
    - Half the learners take form A first and half take form B first, the two halves the same
      size, chosen before the session. An alphabetical split is fine if you fix it in advance.

    If you have fewer than five items, each one is worth more than 20 points. Say in your notes
    that one item decides a lot.
  skill_ref: S57-R1-K02
- type: teaching
  prompt: |
    Most ASHAs scored well on the written quiz at the end of last year's training. A state health
    secretary asks why that is not evidence that they now weigh children correctly. One page,
    answer first, no methods section.
  answer: |
    The answer first: the quiz tested whether ASHAs can recognise the steps on paper. The training
    was meant to make them weigh children correctly. Those are different things, and the quiz
    measured only the first.

    A written quiz can be passed by memory of the training. Weighing a child needs hands, a scale
    and a real child. The only test of it is to watch an ASHA do it and check each step.

    What this costs. A trainer or supervisor watches each ASHA weigh one child, with a checklist,
    during a routine visit. That is minutes per ASHA, not a new programme.

    What to ask for next time. Each training plan should name what the trainee will be able to
    do, and should test exactly that, at the end and again weeks later.
retrieval_items:
- q: When does a test match a learning objective?
  a: When every item asks for the objective's action, on its content, under its condition, marked
    against its standard; and, above remember, gives a case the learner has not met.
- q: What makes two forms of a test parallel, and why use them for a pre-test and post-test?
  a: Each item has a partner asking for the same action on the same kind of case, at the same level
    and difficulty, with a different case or numbers. The post-test then cannot be answered from
    memory of the pre-test.
- q: How does giving half the group each order of two forms help, and what does it not fix?
  a: A difference in difficulty between the forms cancels in the group's mean gain, when the halves
    are the same size. It does not cancel for any one learner.
