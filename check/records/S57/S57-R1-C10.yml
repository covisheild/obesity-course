simplified_explanation: |
  A test can be well made and still test the wrong thing. Suppose your objective says students
  will classify a new adult's BMI. A test that asks them to write the BMI formula checks something
  else: whether they remember a line from your session.
illustrations:
- body: |
    Start with a test that fails. You wrote this objective for a final-year batch in the last
    section.

    > At the end of this session, each student in this final-year batch, given the weight in
    > kilograms and the height in centimetres of ten adults and a printed table of BMI categories,
    > will classify each adult's BMI into the table's category, without notes, correct for at least
    > eight of the ten, on the day and again on a test one week later.

    A colleague offers you his end-of-session test.

    1. Write the formula for BMI.
    2. What is the unit of BMI?
    3. Name the categories in the table we used today.
    4. True or false: BMI uses height in metres.
    5. List two limits of BMI.

    Hold each item against the objective. Item 1 asks for a line from the session. So do items 2,
    3 and 4. A student can score full marks and still be unable to classify one new adult. Item 5
    asks for something the objective never promised. None of the five asks for the action,
    classify. None gives a case the student has not seen. None hands over the table, which the
    condition promised.

    Now turn the objective into items. Its action and condition give you the item's shape: one
    adult, weight and height given, table given, notes put away.

    > Item 1. An adult weighs 58 kg and is 152 cm tall. Using the table, write this adult's BMI
    > category.

    Its standard, eight of ten, tells you there are ten such items, one adult each. It also tells
    you how to mark: each item right or wrong, and eight right meets the objective.

    Last, check the level. Would a student who had only memorised your slides get item 1 right?
    Only by working out the BMI and reading the table. That is carrying out a procedure on a new
    case, which is apply. The test now asks for what the objective promised, at the level it
    promised.
  analogy_breaks_when: |
    This objective has one action and a clear right answer, so its items are easy to write. An
    objective at evaluate, such as judging whether a trial's comparison was fair, needs a new case
    and a marking key written in advance. Otherwise two markers will disagree about the same
    answer.

    The five weak items are not useless. Items 1 to 4 test remember, and a quick check of them
    during the session can tell you who is lost. They are simply not a test of this objective.
- body: |
    Now build the second form. The post-test cannot repeat the pre-test. A student who met
    "58 kg, 152 cm" at the start may remember working it out, and a rise in score could then be
    memory of the item. `S57-R1-C03` found the same danger with repeated quiz questions.

    So give each item a partner. The partner changes the numbers and keeps what makes the item
    hard. Here that is where the BMI falls: an adult close to the edge of a category is harder to
    place than one far from it. So choose a partner whose weight and height differ but whose BMI
    is almost the same. BMI is the weight in kilograms divided by the height in metres times
    itself, as Book 0 built it (`B0-R0-C14`).

    ```working
    1.52 times 1.52 = 2.3104
    58 divided by 2.3104 = 25.10
    1.56 times 1.56 = 2.4336
    61 divided by 2.4336 = 25.07
    ```

    Form A, item 1: 58 kg, 152 cm. Form B, item 1: 61 kg, 156 cm. The two BMIs differ by less
    than 0.1 kg/m^2. Unless the table puts the edge of a category between 25.07 and 25.10, the two
    adults land in the same category. Do the same for all ten pairs.

    However carefully you pair them, one form may still turn out easier. That is a systematic
    error, the kind Book 0 described (`B0-R0-C30`): it pushes every score on that form the same
    way. Here is how it spoils a gain, and how to cancel it. The numbers are made up to show the
    arithmetic.

    Suppose your session raises every student's score by 30 percentage points. Suppose form B is
    10 points easier than form A. You have 30 students. Fifteen take form A before and form B
    after. The other fifteen take form B before and form A after.

    ```working
    A before, B after: 30 plus 10 = 40
    B before, A after: 30 minus 10 = 20
    mean gain of the whole group: (40 plus 20) divided by 2 = 30
    ```

    ```table
    order of the forms   students   gain (points)
    A before, B after    15         40
    B before, A after    15         20
    whole group          30         30
    ```

    Had all 30 taken A before and B after, every gain would read 40. You would report 40 points
    for a session that gave 30. Swapping the order for half the group makes the easier form help
    one half and hurt the other by the same 10 points. In the mean of the whole group, the two
    cancel.
  analogy_breaks_when: |
    The cancelling works for the mean of the whole group, and only when the two halves are the
    same size. It does nothing for any one student: in this example, every student's own gain is
    still 10 points wrong. Do not judge one student's progress from one pair of forms.

    Matching partners on BMI makes them equally hard for a table of BMI categories. For another
    objective, find what makes its items hard, and match on that.
