    unit: days, best gap tested for a 7-day retention interval (recall)
    citekey: cepeda_2008_spacing_ridgeline
    quote: For the RIs of 7, 35, 70, and 350 days, the optimal gaps (of those included in the
      study) were 1, 11, 21, and 21 days, respectively, for recall data
  - value: '11'
    unit: days, best gap tested for a 35-day retention interval (recall)
    citekey: cepeda_2008_spacing_ridgeline
    quote: For the RIs of 7, 35, 70, and 350 days, the optimal gaps (of those included in the
      study) were 1, 11, 21, and 21 days, respectively, for recall data
  - value: '21'
    unit: days, best gap tested for the 70-day and the 350-day retention intervals (recall)
    citekey: cepeda_2008_spacing_ridgeline
    quote: For the RIs of 7, 35, 70, and 350 days, the optimal gaps (of those included in the
      study) were 1, 11, 21, and 21 days, respectively, for recall data
  - value: '26'
    unit: gap-and-retention-interval conditions
    citekey: cepeda_2008_spacing_ridgeline
    quote: for a total of 26 different conditions
  - value: '23'
    unit: days, best gap on the fitted surface for a 350-day retention interval
    citekey: cepeda_2008_spacing_ridgeline
    quote: the optimal gap for RI = 350 equals 23 days, which is just 7% of the RI
  - value: '7'
    unit: '% of the retention interval, fitted best gap at 350 days'
    citekey: cepeda_2008_spacing_ridgeline
    quote: the optimal gap for RI = 350 equals 23 days, which is just 7% of the RI
  - value: '20'
    unit: '% of the test delay, best gap for a test a few weeks away (abstract, rounded)'
    citekey: cepeda_2008_spacing_ridgeline
    quote: The optimum gap val ue was about 20% of the test delay for delays of a few week s
  - value: '5'
    unit: '% of the test delay, best gap for a test a year away (abstract, rounded)'
    citekey: cepeda_2008_spacing_ridgeline
    quote: falling to ab out 5% when delay was one year
  - value: '6'
    unit: gaps tried at each of two retention intervals
    citekey: cepeda_2008_spacing_ridgeline
    quote: 6 gaps for each of 2 RIs, and 7 gaps for each of the other 2 RIs
  - value: '7'
    unit: gaps tried at each of the other two retention intervals
    citekey: cepeda_2008_spacing_ridgeline
    quote: 6 gaps for each of 2 RIs, and 7 gaps for each of the other 2 RIs
- body: |
    Now put it on a calendar. On Monday 5 October 2026 you teach a batch of MBBS students how to
    plot a child's weight on a growth chart. Their test is on Monday 16 November, 42 days later.
    There is room for one review in class. When should it go?

    The 42 days are the gap plus the retention interval. For a test a few weeks away, take the
    gap as about 20% to 30% of the retention interval. Work out both ends.

    At 20%, the gap is 0.2 times the retention interval. So the whole 42 days is 1 times the
    retention interval plus 0.2 times it, which is 1.2 times it. Divide to undo the
    multiplication (`B0-R0-C16`).

    ```working
    42 divided by 1.2 = 35
    0.2 times 35 = 7
    7 plus 35 = 42
    ```

    At 30%, the whole is 1.3 times the retention interval.

    ```working
    42 divided by 1.3 = 32.3
    0.3 times 32.3 = 9.69
    ```

    The review goes on day 7 to day 10 after teaching. Count forward from 5 October: day 7 is
    Monday 12 October, and day 10 is Thursday 15 October. If the timetable gives you a choice,
    take the later day, because too long is the cheaper mistake. Check it against the data: for
    a 35-day retention interval, the best gap tested was 11 days. Day 10 sits close to it.

    Make the review a retrieval (`S57-R1-C03`). Each student, alone, writes the steps of plotting
    the chart from memory, then you show the answer. Weinstein and colleagues note that spacing
    costs little if you "set aside a few minutes per class to review information from previous
    lessons".

    Do the same for yourself. You will teach the topic to residents without notes on Monday 30
    November. You study it on Monday 2 November: 28 days before.

    ```working
    28 divided by 1.2 = 23.3
    0.2 times 23.3 = 4.66
    28 divided by 1.3 = 21.5
    0.3 times 21.5 = 6.45
    ```

    Round 4.66 up to 5, since too long is the cheaper mistake. Review on day 5 or day 6:
    Saturday 7 or Sunday 8 November. Close the book, write out what you would teach, and only
    then open it to check.
  analogy_breaks_when: |
    The 20% to 30% is a rough figure for tests a few weeks away. It comes from one study of trivia
    facts with a single review. It gives you a window for a date, not a measured best day for
    your topic.

    For an examination months or years away, the share is smaller, and the data stop at 350
    days. That study did not compare one review with several. Add later reviews if you can,
    but no figure here says how far apart they should be.
  numbers:
  - value: '20'
    unit: '% of the test delay, lower end of the planning range'
    citekey: cepeda_2008_spacing_ridgeline
    quote: The optimum gap val ue was about 20% of the test delay for delays of a few week s
  - value: '30'
    unit: '% of the retention interval, upper end of the planning range'
    citekey: cepeda_2008_spacing_ridgeline
    quote: gaps that produced gap/RI ratios near 0.1, 0.2, and 0.3
    derived: The quote gives the ratio 0.3; 0.3 times 100 is 30%. The best tested gaps at 35 and
      70 days work out to 31% and 30% (illustration 1).
  - value: '11'
    unit: days, best gap tested for a 35-day retention interval (recall)
    citekey: cepeda_2008_spacing_ridgeline
    quote: For the RIs of 7, 35, 70, and 350 days, the optimal gaps (of those included in the
      study) were 1, 11, 21, and 21 days, respectively, for recall data
must_know:
- point: |
    "Three hours is three hours, however you spread them" is the error. With study time held
    equal, spaced practice leaves more behind on a delayed test.
  kind: misconception
  bearing: teaching
  refs:
  - cepeda_2008_spacing_ridgeline
- point: |
    Never judge a schedule by how the practice sessions go.
  kind: trap
  bearing: teaching
  refs:
  - dunlosky_2013_learning_techniques
- point: |
    Before you pick a review date, write down when the learning must be used: the test date, or
    the day you will teach it. Then set the gap from that.
  kind: move
  bearing: teaching
  refs:
  - cepeda_2008_spacing_ridgeline
- point: |
    The best gap grows as the test moves away, but its share falls: 23 days, 7%, for a test 350
    days away. A fixed share, such as "10 to 20% of the retention interval", overstates the gap
    for long intervals. Dunlosky and colleagues give that fixed share, and Cepeda's own data bend
    away from it.
  kind: trap
  bearing: methodological
  refs:
  - cepeda_2008_spacing_ridgeline
  - dunlosky_2013_learning_techniques
- point: |
    When you are unsure of the best gap, choose the longer one.
  kind: move
  bearing: teaching
  refs:
  - cepeda_2008_spacing_ridgeline
- point: |
    Test often and lightly, so that students space their own study. In one study, when tests
    came only every 3 weeks, students left their study until just before each test. With daily
    tests, their study was spread out.
  kind: consequence
  bearing: teaching
  refs:
  - dunlosky_2013_learning_techniques
- point: |
    These gaps were measured for trivia facts, one review and tests up to 350 days away. Past a
    year, treat any gap figure as a starting guess. Then check it with a delayed test of your own
    (`S57-R1-C02`).
  kind: boundary
  bearing: methodological
  refs:
  - dunlosky_2013_learning_techniques
  - cepeda_2008_spacing_ridgeline
quantitative: true
practice:
- level: 1
  prompt: |
    Write each ratio as a percentage, to the nearest whole number: 11 divided by 35, then 21
    divided by 350, then 23 divided by 350.
  answer: |
    Divide, then multiply by 100.

    ```working
    11 divided by 35 = 0.3142857143
    0.3142857143 times 100 = 31.42857143
    21 divided by 350 = 0.06
    0.06 times 100 = 6
    23 divided by 350 = 0.0657142857
    0.0657142857 times 100 = 6.57142857
    ```

    31%, 6% and 7%.
- level: 2
  prompt: |
    Find 20% of 45. Then find 5% of 360.
  answer: |
    Turn each percentage into a decimal by dividing by 100, then multiply.

    ```working
    20 divided by 100 = 0.2
    0.2 times 45 = 9
    5 divided by 100 = 0.05
    0.05 times 360 = 18
    ```

    9 and 18.
- level: 3
  prompt: |
    Split 36 into two parts. The smaller part must be 0.2 times the larger part. Find both parts.
  answer: |
    The whole is the larger part plus 0.2 times the larger part, which is 1.2 times the larger
    part. Divide the whole by 1.2 to get the larger part.

    ```working
    36 divided by 1.2 = 30
    0.2 times 30 = 6
    30 plus 6 = 36
    ```

    The parts are 30 and 6.
- level: 4
  prompt: |
    Cepeda and colleagues (2008) also gave a multiple-choice recognition test. For retention
    intervals of 7, 35, 70 and 350 days, the best gaps tested for recognition were 1, 7, 7 and 21
    days. Work out each best gap as a percentage of its retention interval, to the nearest whole
    number. Say which way the percentage moves as the retention interval grows. Then compare the
    gaps with the recall gaps of 1, 11, 21 and 21 days.
  answer: |
    Divide each gap by its retention interval, then multiply by 100.

    ```working
    1 divided by 7 = 0.1428571429
    7 divided by 35 = 0.2
    7 divided by 70 = 0.1
    21 divided by 350 = 0.06
    ```

    14%, 20%, 10% and 6%. The share does not fall at every step: it rises from 14% to 20%
    between 7 and 35 days, then falls to 10% and 6%. The gaps tested were coarse, so one step up
    is not a pattern.

    For recognition, the best gaps at 35 and 70 days were 7 days, against 11 and 21 days for
    recall. The best gap depended on the kind of test as well as on its date. A choice-of-answers
    test and a write-it-out test are different targets.
  refs:
  - cepeda_2008_spacing_ridgeline
- level: 5
  prompt: |
    You teach a batch of MBBS students a topic on 1 December 2026. Their test is 60 days later.
    Take the gap as 20% to 30% of the retention interval, as Cepeda and colleagues' figures for a
    test some weeks away suggest. Work out the test date, and the range of days after teaching on
    which the one review should fall, with its dates.
  answer: |
    The test date first. December has 31 days.

    ```working
    1 plus 60 = 61
    61 minus 31 = 30
    ```

    Day 60 is 30 January 2027.

    The 60 days are the gap plus the retention interval. At 20%, the whole is 1.2 times the
    retention interval.

    ```working
    60 divided by 1.2 = 50
    0.2 times 50 = 10
    ```

    At 30%, the whole is 1.3 times the retention interval.

    ```working
    60 divided by 1.3 = 46.15
    0.3 times 46.15 = 13.85
    ```

    The review goes on day 10 to day 14 after teaching.

    ```working
    1 plus 10 = 11
    1 plus 14 = 15
    ```

    From 11 December to 15 December 2026. If you must pick one day, pick the later one: a gap
    too long costs less than one too short.
  refs:
  - cepeda_2008_spacing_ridgeline
- level: 6
  prompt: |
    The timetable fixes your one review 9 days after you first teach a topic. You want the gap
    to be 20% to 30% of the retention interval. How many days after the review should the test
    fall, and how many days after the first teaching is that?
  answer: |
    This time the gap is known and the retention interval is not. The gap is the share times the
    retention interval, so the retention interval is the gap divided by the share.

    ```working
    9 divided by 0.3 = 30
    9 divided by 0.2 = 45
    ```

    A larger share gives a shorter retention interval. The test should fall 30 to 45 days after
    the review. Add the 9 days of the gap.

    ```working
    9 plus 30 = 39
    9 plus 45 = 54
    ```

    39 to 54 days after the first teaching. A test much sooner than that makes the 9-day gap too
    long for it. As Cepeda and colleagues found, that is the cheaper mistake, but it is still a
    mistake.
  refs:
  - cepeda_2008_spacing_ridgeline
- level: 7
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
    Cepeda and colleagues: the best gap gave a 64% increase in final recall over no gap
    suppose recall with no gap was 40%
    40 plus 64 = 104
    104% recall is impossible, so the 64% figure must be wrong
    ```

    The 40% is made up for the sake of the sum. The paper's recall scores for each condition are
    in a figure this book does not hold.
  answer: |
    The step that broke is the third. A 64% increase is a per cent change, not a gain of 64
    percentage points (`B0-R0-C04`). It means the new value is the old value plus 64% of the old
    value.

    ```working
    0.64 times 40 = 25.6
    40 plus 25.6 = 65.6
    ```

    65.6%, which is possible. The same figure can also be written as 1.64 times 40.

    ```working
    1.64 times 40 = 65.6
    ```

    Why the wrong answer looks reasonable. Both numbers carry a percent sign, and adding two
    percentages feels natural. But one is a share of the facts recalled and the other is a change
    relative to a starting value. They cannot be added.
  refs:
  - cepeda_2008_spacing_ridgeline
- level: 8
  prompt: |
    Here is a student's worked plan. Find the step that broke.

    ```working
    I start the topic on 20 October; the exam is 30 days later, on 19 November
    the gap should be 20% of the time
    20% of 30 days = 6 days
    so I revise 6 days before the exam, on 13 November
    ```
  answer: |
    The step that broke is the last. The gap is the time from first study to the review, not
    from the review to the exam. Revising 6 days before the exam makes the gap 24 days and the
    retention interval 6 days.

    ```working
    30 minus 6 = 24
    24 divided by 6 = 4
    ```

    The gap is 4 times the retention interval, 400% of it, where 20% to 30% was the aim. This is
    the revision week before the exam, with a single review. There is a smaller slip in the third
    line too: the 20% is a share of the retention interval, not of the whole 30 days.

    ```working
    30 divided by 1.2 = 25
    0.2 times 25 = 5
    30 divided by 1.3 = 23.08
    0.3 times 23.08 = 6.92
    ```

    Revise on day 5 to day 7, which is 25 to 27 October.

    Why the wrong answer looks reasonable. It uses the right percentage, and revising just before
    the exam is the habit most of us grew up with. The review feels productive because the exam is
    close. That is the good feeling this section warns against.
  refs:
  - cepeda_2008_spacing_ridgeline
- level: 9
  prompt: |
    A colleague plans reviews for a batch of MBBS students. "Dunlosky and colleagues say: space
    reviews at 10 to 20% of how long you need to remember. The final examination is 3 years away.
    So each topic gets its review 3.5 to 7 months after it is taught." Decide what to compute,
    compute it, and say what your answer does not establish.
  answer: |
    What to compute: 10% and 20% of 3 years, and then whether the data behind the 10 to 20% reach
    that far. Take a year as 365 days.

    ```working
    3 times 365 = 1095
    0.1 times 1095 = 109.5
    0.2 times 1095 = 219
    ```

    109.5 to 219 days. At about 30 days to a month, that is about 3.7 to 7.3 months, so the
    colleague's arithmetic is roughly right.

    ```working
    109.5 divided by 30 = 3.65
    219 divided by 30 = 7.3
    ```

    Dunlosky and colleagues do print this rule. They also carry it to 5 years: "to remember
    something for 5 years, the learning episodes should be spaced 6 to 12 months apart". The
    study behind it, Cepeda and colleagues 2008, stopped at 350 days. There its fitted best gap
    was 23 days, 7% of the retention interval. The authors say the share must fall as the
    retention interval grows.

    What this does not establish. It does not establish that 3.5 to 7 months is right for 3
    years. A fixed 10 to 20% is being carried far past the data, and the data show the share
    falling. It does not give a better number either: 6% of 3 years would be the same kind of
    guess. Cepeda and colleagues themselves say only that a review "of at least several months"
    seems likely to pay off when something must last several years. And one review of trivia
    facts is not a clinical subject revised for an examination.

    What to say to the colleague: keep the long gap, since too long costs less than too short.
    Earlier, shorter reviews are reasonable too, though no figure here measures them. And do not
    quote 10 to 20% as if it were measured for 3 years.
  refs:
  - dunlosky_2013_learning_techniques
  - cepeda_2008_spacing_ridgeline
- level: 10
  prompt: |
    A coaching advertisement says: "Research shows spacing your study raises what you remember
    by 64%. Our spaced timetable will raise your university examination marks by 64%." Decide
    what to compute, compute it, and say what your answer does not establish.
  answer: |
    What to compute: where 64% came from, and how much it varied inside the same study.

    The 64% is Cepeda and colleagues' figure for recall of trivia facts. It compares the best gap
    with a gap of zero, with study time the same. The paper also gives it for each retention
    interval: 10, 59, 111 and 77% for 7, 35, 70 and 350 days.

    ```working
    111 divided by 10 = 11.1
    ```

    Inside one study, the increase ran from 10% to 111%, an eleven-fold range, depending on when
    the test came. On the multiple-choice test the per cent increase was 26%, yet the
    paper's d there was larger, 1.5 against 1.1 (`S57-R1-C02`). A per cent change and a
    difference in standard deviations can rank the same results differently.

    What this does not establish. It does not establish any change in marks. 64% is a per cent
    change in recall, not in examination marks, and not percentage points. The comparison is
    against no gap at all, not against however the student studies now. So it is not what a
    student would gain from switching timetables. The material was trivia facts learned online,
    not a medical syllabus. And nothing here says this timetable spaces anything well.

    What to say: spacing is well supported, and worth using. The 64% is one study's best case
    against cramming in one sitting, and it says nothing about marks.
  refs:
  - cepeda_2008_spacing_ridgeline
exercises:
- type: design
  prompt: |
    Pick a topic you will teach in the next month, to MBBS students, residents or ASHA workers.
    Write down the date you teach it and the date it must be used: a test, a posting or a field
    visit. Then set the date of one in-class review, show the arithmetic, and say what the
    learners will do at the review. Finally, set your own review date if you will teach the topic
    from memory.
  answer: |
    A good plan names the two end dates first. Everything else is worked out from them.

    It splits the days between them into a gap and a retention interval. For an end date a few
    weeks away, the gap is about 20% to 30% of the retention interval. So the whole is 1.2 to 1.3
    times the retention interval. Dividing gives a window of days, not a single day, and the plan
    picks the later end when it can.

    At the review, each learner retrieves alone and without notes, and then sees the answer
    (`S57-R1-C03`). Rereading the notes together is not the review this evidence supports.

    Your own review follows the same arithmetic, counted back from the day you teach. The end date
    may be many months away. Then the plan says the share should be smaller, and that no figure
    here was measured for that distance.
  skill_ref: S57-R1-K01
- type: teaching
  prompt: |
    You have ten minutes and a whiteboard with a first-year resident. She asks: "Why not teach
    each topic once and do a full revision week before the exam? It works for me." Explain the
    mechanism and the evidence, and what you would change in her plan.
  answer: |
    Start from her experience, because it is real. Revision just before an exam does feel like it
    works, and on a test straight after, cramming can do as well or better.

    Then draw the two schedules on the board. One: topic, a long empty stretch, a revision week,
    the exam. Two: topic, a short review a week or two later, and the exam. Say what the evidence
    measured: with the same study time, the spread-out schedule leaves more behind on a delayed
    test. In one large study, recall after the best gap was 64% higher than after no gap.

    Explain why it feels wrong. A review soon after learning is easy, so it feels productive. A
    review after some forgetting is harder. Weinstein and colleagues call this a "desirable
    difficulty": harder now, better later. Say that why it works is still debated. The schedule
    with the most forgetting between sessions did best a month later.

    Then change the plan. Decide when each topic must be used. Put one review so that the gap
    before it is about 20% to 30% as long as the wait after it. Make it a closed-book attempt,
    with the answers checked after. Keep a revision week if she likes, as a second review, not
    the only one.
retrieval_items:
- q: What are the gap and the retention interval?
  a: The gap is the time between two study sessions of the same material. The retention interval
    is the time from the last study session to the test.
- q: In Cepeda and colleagues' study, how did the best gap change as the test moved further away?
  a: It grew, from 1 day for a 7-day retention interval to 21 days for 70 and 350 days, but its
    share of the retention interval fell, to about 7% at 350 days on the fitted surface.
- q: If you cannot tell which of two gaps is best, which do you choose, and why?
  a: The longer one. A gap longer than the best costs much less than a gap shorter than the best.
