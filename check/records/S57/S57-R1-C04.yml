simplified_explanation: |
  Take the same three hours of study. Spend them in one evening, or spread them over three weeks.
  The spread-out hours leave more behind a month later.

  It does not feel that way. Straight after a cramming session, you remember a lot, and on a test
  that day cramming can win.

  Say the test is a few weeks away. Then make the gap before the review about 20% to 30% as long as
  the wait from the review to the test. If you are unsure, err on the long side.

  Make the review a retrieval, not a reread (`S57-R1-C03`): close the book, write what you
  remember, then check.
illustrations:
- body: |
    Here is the plan most of us were taught by. Cover a topic in one week of the course. Revise it
    all in the week before the examination. Every revision session goes well, because you have
    only just seen the material. That good feeling is the trap.

    Open Dunlosky and colleagues, "Improving students' learning with effective learning
    techniques", *Psychological Science in the Public Interest* 2013, at
    https://doi.org/10.1177/1529100612453266, and go to section 9, Distributed practice. It
    describes an old experiment. Students learned Spanish words, then relearned them in six more
    sessions. The sessions were back to back, 1 day apart, or 30 days apart. With 30 days between
    sessions, students forgot the most in between, and they never caught up with the others
    during practice. Search for 30 days later.

    > the pattern reversed on the final test 30 days later, such that the best retention of the
    > translations was observed in the condition in which relearning sessions had been separated
    > by 30 days.

    The schedule that looked worst during practice was best a month later. Read on.

    > the condition with the most intersession forgetting yielded the greatest long-term
    > retention.

    So how far apart should the sessions be? Open Cepeda and colleagues, "Spacing effects in
    learning: a temporal ridgeline of optimal retention", *Psychological Science* 2008. The copy
    free to read is the authors' own manuscript, at https://files.eric.ed.gov/fulltext/ED505660.pdf.
    Its first line warns that it "may differ from the final published version".

    Each learner studied the facts, waited a gap, went through them once more, waited a retention
    interval, and took a final test. RI is the paper's short form for retention interval. Search
    for respectively.

    > For the RIs of 7, 35, 70, and 350 days, the optimal gaps (of those included in the study)
    > were 1, 11, 21, and 21 days, respectively, for recall data

    Divide each best gap by its retention interval. That is a ratio of two times in the same unit
    (`B0-R0-C05`), and 100 times it is a percentage (`B0-R0-C04`).

    ```working
    1 divided by 7 = 0.1428571429
    11 divided by 35 = 0.3142857143
    21 divided by 70 = 0.3
    21 divided by 350 = 0.06
    ```

    Multiplied by 100 and rounded: 14%, 31%, 30% and 6%.

    ```table
    | retention interval (days) | best gap tested (days) | gap as % of retention interval |
    | 7 | 1 | 14 |
    | 35 | 11 | 31 |
    | 70 | 21 | 30 |
    | 350 | 21 | 6 |
    ```

    Two things happen at once. The best gap grows as the test moves further away. But it grows
    more slowly than the retention interval, so its share shrinks. For a test a year away, the
    best gap tested was 6% of the retention interval, not 30%.

    The authors also fitted one smooth surface to all 26 conditions. Search for 23 days.

    > the optimal gap for RI = 350 equals 23 days, which is just 7% of the RI.

    Their abstract rounds it off: about 20% for a test a few weeks away, falling to about 5%, or
    0.05, for a test a year away. Last, search for too small a gap.

    > while there are costs to using a gap that is longer than the optimal value, these costs are
    > much smaller than the costs of using too small a gap value

    Too long is the cheaper mistake.
  analogy_breaks_when: |
    The best gaps in the table are the best of a few tried: six or seven gaps at each retention
    interval. The real best can sit anywhere between two tried gaps. That is why the share jumps
    from 14% to 31% and back down to 6%. Read the shares as rough, not exact.

    These were adults of many ages and countries, learning trivia facts online, with one review,
    tested up to 350 days later. For a test years away, for a skill, or for a large body of
    connected material, the numbers are a guess carried past the data.
