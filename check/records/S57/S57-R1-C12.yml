definition:
  text: |
    A learner's score on a test is written here as a percentage of the test's maximum, from 0 to
    100%. The pre-test score, pre, is taken before the teaching. The post-test score, post, is
    taken at the end of it.

    The raw gain is post minus pre, written post − pre, in percentage points.

    The mean gain of a group is the mean of its learners' raw gains. It equals the mean post-test
    score minus the mean pre-test score. Its spread is the standard deviation (SD) of the raw
    gains.

    The room to gain is 100 − pre: the most a learner, or a class, could have gained. The
    normalised gain, written g, is the raw gain divided by the room to gain.

    ```working
    g = (post − pre) ÷ (100 − pre)
    ```

    It is a fraction with no unit. It does not exist for a pre-test of 100%. Hake defines the
    class form from class-average scores. He writes it 〈g〉, with angle brackets round g, which
    here mean "the class average".

    The proportion reaching the standard is the number of learners whose score meets the standard
    the objective set, divided by the number tested.
  references:
