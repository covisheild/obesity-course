        carries the definition of the class-average normalised gain in words and the two headline
        averages. The full paper, which may discuss the gain of single students, was not
        obtained, and the record does not attribute anything beyond the abstract to Hake.
  - citekey: hake_1998_normalized_gain
    kind: textbook
    locator: "Abstract, the sentence introducing the average normalized gain"
    quote: |-
      a rough measure of the average effectiveness of a course in promoting conceptual understanding is taken to be the average normalized gain 〈g〉
    verified:
