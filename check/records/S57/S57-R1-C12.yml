      The latter is defined as the ratio of the actual average gain (%〈post〉−%〈pre〉) to the maximum possible average gain (100−%〈pre〉).
    verified:
      resolved_id: https://doi.org/10.1119/1.18809
      opened: true
      claim_located: true
      checked_on: '2026-09-25'
      note: |-
