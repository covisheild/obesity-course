      12% increase)"
    as_of: ''
must_know:
- point: |
    Saying more is not teaching more. Put the steps where they stay: on the board, a chart on the
    wall, a handout.
  kind: misconception
  bearing: teaching
- point: |
    For beginners, show a worked example before you set a problem. Then give a problem with part
    of the solution done, then a whole problem. Take the help away as they gain skill.
  kind: move
  bearing: teaching
- point: |
    What helps a first-year student can hold back a resident. For them, set problems.
  kind: trap
  bearing: teaching
- point: |
    Before you put the same content on a slide twice, as a diagram and as text that repeats it,
    ask what the second copy adds.
  kind: consequence
  bearing: teaching
- point: |
    Once the basics are held, make learners work: mix related problem types and have them produce
    answers rather than read them.
  kind: move
  bearing: teaching
- point: |
    Do not tell a colleague a session "overloaded" learners as though you measured it. Say what
    the learners could and could not do afterwards.
  kind: boundary
  bearing: methodological
exercises:
- type: critique
  prompt: |
    A colleague plans a one-hour session for 30 ASHA workers. The topic is reading a weighing
    scale and recording a child's weight. For the first 40 minutes the colleague talks through
    every step. Each slide shows a labelled picture of the scale. Beside it, a paragraph says the
    same thing in words.

    In the last 20 minutes each worker weighs a child alone and records the
    weight. Nobody has seen a weighing worked through first. Name what in the plan adds load that
    could be cut, and say what you would change.
  answer: |
    Three things add load the teacher could remove.

    Talk is gone within seconds. Each worker has to hold the steps in working memory until the
    practice at the end, up to 40 minutes later. Put the steps on a chart that stays on the wall.
    Break the talk into short pieces, and after each piece have the workers do that step.

    The slide gives the same information twice, as a labelled picture and as text that repeats
    it. Keep the picture and drop the repeating paragraph.

    The workers are beginners at this task, and the plan sends them straight to a whole problem.
    Show one weighing worked through in full, step by step. Then have each worker do one while
    you finish the last steps with them. Then each does one alone.

    Say what the critique does not show: whether the session as planned would fail. That is
    found by testing what the workers can do afterwards, not by counting load.
  skill_ref: S57-R1-S1
retrieval_items:
- q: What limits does working memory have, and when do they disappear?
  a: It holds only a limited number of new elements at a time, and only briefly. The limits
    effectively disappear for information that comes back from long-term memory.
- q: Which kind of cognitive load can the teacher change, and which only changes if the material
    or the learner changes?
  a: Extraneous load, from how material is presented and what learners are made to do, the
    teacher can change. Intrinsic load, from the material's complexity for this learner, changes
    only if the material or the learner's knowledge changes.
- q: What happens to the benefit of worked examples as learners gain expertise?
  a: It shrinks, then disappears, and can reverse. Fade worked examples out and replace them with
    problems.
