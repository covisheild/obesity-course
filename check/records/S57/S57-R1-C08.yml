simplified_explanation: |
  Your working memory is the part of your mind that holds what you are thinking about right now.
  It is small. It can juggle only a few new things at once, and it drops them within seconds.

  Your long-term memory is where learned things are kept, and it has no known limit. Anything
  already learned comes back from it as one piece. For you, "percentage" is one piece. A learner
  meeting it for the first time has several pieces to hold.

  Overload working memory and less is learned. Some of the load comes from the material itself,
  and you cannot remove it without changing what is taught. Some comes from how you teach it, and
  that part is yours to cut.

  For a beginner, a problem shown worked out, step by step, often teaches more than being made to
  solve it cold. As they learn, take the help away a step at a time.

  Once the basics are held, effort helps. The same effort that swamps a beginner is what moves a
  more advanced learner on.
illustrations:
- body: |
    Start with the usual way it goes wrong. You explain aloud, once, how to turn a score into a
    percentage, then set a batch of first-year MBBS students three problems. Your words were gone
    within seconds. Each student now has to hold what you said in working memory while also
    holding the numbers and trying the steps. That is load you added, and it is load you can take
    away.

    Instead, write a worked example on the board and leave it there. The numbers here are made
    up. 26 of 40 students answered question 3 correctly. What percentage is that?

    ```working
    26 ÷ 40 = 0.65
    0.65 × 100 = 65%
    ```

    Then give a partly worked problem, with the last step left for them. 18 of 24 students
    answered question 4 correctly.

    ```working
    18 ÷ 24 = 0.75
    0.75 × 100 = ?
    ```

    Then give a whole problem with nothing worked: 31 of 50 students answered question 5
    correctly. What percentage is that? They should reach 62%.

    You have faded the help: a full example, then one with a gap, then a bare problem. A
    percentage is the Book 0 skill of `B0-R0-C04`. For you it is a single step. For these students
    it may not be yet.

    Now take the same three problems to a batch of residents who have done this a hundred times.
    For them the worked example is text to read and ignore, and reading it costs time. Give them
    the bare problem from the start.
  analogy_breaks_when: |
    The numbers are made up, to show the order of the steps; they report no class. The review
    behind this section says that worked examples teach novices more than problems do, and that
    the benefit fades and can reverse with expertise. It does not say at what point a particular
    learner has crossed over. You find that by watching whether they can do the bare problem.
- body: |
    Now the other side. Once learners can do each kind of problem on its own, make them work.

    Mix the problem types. Suppose your batch can now find a percentage, a ratio and a mean when
    each is asked in a block of its own. Next session, shuffle them: a percentage, then a mean,
    then a ratio, then a percentage. This is interleaving. Open Weinstein and colleagues,
    "Teaching the science of learning", 2018, at https://pmc.ncbi.nlm.nih.gov/articles/PMC5780548/
    and search for shuffling.

    > Rohrer and Taylor (2007) found that shuffling math problems that involved calculating the
    > volume of different shapes resulted in better test performance 1 week later

    The reason the authors give is that mixing makes the student choose the method each time,
    which a block of one type never asks them to do.

    Effortful techniques also pay more to learners who already know more. Take the "why is this
    true?" questions of the last section (`S57-R1-C07`). Open Dunlosky and colleagues' review at
    https://doi.org/10.1177/1529100612453266 and search for Canadian provinces. Woloshyn and
    colleagues gave Canadian and German students facts about Canadian provinces and German
    states, so each student knew one set well and the other less. Students who answered "why"
    questions about the facts gained more over reading alone where they knew more.

    > in their high-knowledge domain (a 24% increase) than in their low-knowledge domain (a 12%
    > increase)

    ```table
    Facts about  Gain over reading only (%)
    what the student knew well  24
    what the student knew less  12
    ```

    The same "why" questions paid twice as much where the learner already knew more.

    ```working
    24 ÷ 12 = 2
    ```
  analogy_breaks_when: |
    Interleave problems that are related, like three calculations from the same unit. Mixing
    different subjects in one sitting has not been shown to help. The 24% and 12% come from one
    study of facts about places, and the review does not say whether they are percentage points
    or a share of the reading-only score; read them as "about twice as much", not as a size to
    expect. They show that "why" questions help less where knowledge is thin, not that they
    never help a beginner.
  numbers:
  - value: '1'
    unit: week
    citekey: weinstein_2018_science_of_learning
    quote: "resulted in better test performance 1 week later"
    as_of: ''
  - value: '24'
