simplified_explanation: |
  At the top sits a regulation, the Graduate Medical Education Regulations, 2023 (GMER 2023). It
  was notified in the Gazette, so it binds.

  Under it sits the detail, in a guideline — a document NMC's undergraduate board sent out by
  letter and put on its website. "Competency based" means the course is built from what a graduate
  must be able to do, not from a list of topics to cover.

  That guideline names the doctor the course is meant to produce: the Indian Medical Graduate, or
  IMG. It gives the IMG seven roles.

  Lectures to a large group may take at most a third of a subject's hours.

  A third paper decides what you need to hold as a teacher. It is the faculty regulations of 2025.
  They tie a course, the Basic Course in Medical Education, to the Associate Professor and
  Professor posts in most MD and MS subjects. Community Medicine is one of them.
illustrations:
- body: |
    You are asked to take the Foundation Course session on the roles of the Indian Medical
    Graduate for a new batch of first-year MBBS students. A senior hands you last year's slides.
    They show five roles.

    Open NMC's CBME Curriculum 2024 at
    https://nmc.org.in/storage/cms/rules-regulation-nmc/YTW423v3EsCFdtPv3I5qZkaNNhuXfub42UZITDRM.pdf.
    Search inside it for Goals for the Learner.

    The first hit is in the guidelines at the front, section 5. Read the list. It runs from a to
    g: clinician; leader and member of the health care team and system; communicator; lifelong
    learner; professional; critical thinker; researcher. That is seven.

    Search again. The second hit is further down the same document, in the curriculum volume's
    "How to use the Manual". Its Section 1 says it gives the roles "extracted from" the CBME
    Guidelines, 2024. Read its list. It stops at e, professional. That is five.

    So the slides were not made up. The five are exactly the roles the 2019 regulation named.
    Critical thinker and researcher came later, and one copy inside NMC's own document was never
    brought up to date.

    Now decide which to teach. The manual says it is copying the guidelines, so the guidelines are
    the thing to quote. Teach seven. Then show the batch the second list, and tell them why a copy
    can disagree with what it copies.
  analogy_breaks_when: |
    This settles what NMC's document of 12 September 2024 says. It does not tell you whether a
    later letter has changed the list. Before the session, open NMC's Rules and Regulations page,
    https://nmc.org.in/page/rules-regulations-rules-regulations-nmc, and look for anything under
    the undergraduate board dated after 12 September 2024.
