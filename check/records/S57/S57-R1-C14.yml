- body: |
    You will hear it said that every medical teacher must do the Basic Course in Medical
    Education. Check it against the instrument.

    Open the Medical Institutions (Qualifications of Faculty) Regulations, 2025 at
    https://nmc.org.in/storage/cms/rules-regulation-nmc/QZSDeGu7WXS9MMI0dL5ZR1EbS48kLaFbvMTpww2B.pdf.
    The first paragraph says they are made "in supersession of" the teachers' eligibility
    regulations of 2022. Supersession means the new instrument takes the old one's place. So
    anything you learnt from the 2022 regulations needs checking again.

    Go to the Schedule and find Table E, for faculty in MD and MS subjects. Read it one row at a
    time and write down what each row says about the course.

    The Professor row says the Professor "shall be required to undergo Basic Course in Medical
    Education provided their broad specialty subject is covered under undergraduate training".
    The Associate Professor row says the same. The Assistant Professor row does not name the
    course at all.

    Now apply the proviso to yourself. Is Community Medicine covered under undergraduate training?
    Search the CBME Curriculum 2024 for Community Medicine. It is one of the subjects of the Phase
    III Part 1 university examination. So yes. Under this table, the course reaches you at
    Associate Professor.

    Go back to the Professor row and read it again, slowly. The research course is worded "have
    completed". The teaching course is worded "shall be required to undergo". Those are different
    words. The table does not say whether you need the teaching course before the promotion or may
    take it after. Do not settle that from the wording. Ask for NMC's answer in writing: a
    published clarification, or an amendment.
  analogy_breaks_when: |
    This reads one table of one regulation, as notified on 30 June 2025. Dental faculty have their
    own table, which words the course differently. The table does not tell you what your own
    college or state requires on top of it. And an amendment or a published answer from NMC can
    change the reading.
must_know:
- point: |
    "The Indian Medical Graduate has five roles" is out of date. The CBME Curriculum 2024 lists
    seven: critical thinker and researcher were added to the 2019 five.
  kind: misconception
  bearing: teaching
  refs:
  - nmc_cbme_2024
  - mahajan_gupta_2024_gmer_cbme
- point: |
    When a department asks you to lecture, count its large-group hours first. A timetable over
    that third is out of line with the curriculum, however good the lectures are.
  kind: number
  bearing: teaching
  refs:
  - nmc_cbme_2024
- point: |
    Mentoring is in the curriculum, not an optional extra. Each mentor gets three students during
    the Foundation Course and keeps them until they finish internship. Mentors are drawn from
    Assistant Professor upwards, so expect to be one from your first post as Assistant
    Professor.
  kind: consequence
  bearing: teaching
  refs:
  - nmc_cbme_2024
- point: |
    The Basic Course in Medical Education is tied to posts, not to teaching as such. Its Assistant
    Professor row does not name it. Say that, not "every teacher must do it".
  kind: trap
  bearing: policy
  refs:
  - nmc_miqf_2025
- point: |
    Know which kind of paper you are quoting. A circular of 12 June 2023 that issued guidelines
    under GMER 2023 was withdrawn eleven days later; the regulations themselves were not. So a
    colleague waving "the 2023 guidelines" may be waving a withdrawn circular. Ask for its date.
  kind: trap
  bearing: policy
  refs:
  - nmc_gmer_2023
  - nmc_cbme_2024
  - mahajan_gupta_2024_gmer_cbme
- point: |
    Two papers in force can disagree. GMER 2023 bars a student from continuing after nine years
    from admission. The CBME Curriculum 2024 says a learner may not graduate later than ten years
    from joining, internship included. When a student's case turns on the limit, name both papers
    and their words.
  kind: india_deviation
  bearing: policy
  refs:
  - nmc_gmer_2023
  - nmc_cbme_2024
- point: |
    These instruments tell you what a college must provide and what a teacher must hold. They say
    nothing about whether any session works.
  kind: boundary
  bearing: teaching
exercises:
- type: retrieval
  prompt: |
    Name the seven roles of the Indian Medical Graduate in the CBME Curriculum 2024. Say which two
    were not among the five named in 2019.
  answer: |
    Clinician; leader and member of the health care team and system; communicator; lifelong
    learner; professional; critical thinker; researcher.

    Critical thinker and researcher are the two added after 2019. The first five are the 2019 list.
  confidence_first: true
- type: interpretation
  prompt: |
    A new Assistant Professor of Community Medicine is told by a colleague: "You cannot teach
    until you have done the Basic Course in Medical Education. It is in the 2022 regulations."
    Using only what this section gives, say what is wrong with each half of the sentence, and what
    you would check before saying anything more.
  answer: |
    The second half names the wrong paper. The 2022 rules on who may teach were replaced on 30 June
    2025. The new ones are the Medical Institutions (Qualifications of Faculty) Regulations, 2025.
    Quote those.

    The first half claims more than Table E says. Table E names the course for Professors and
    Associate Professors in MD and MS subjects taught to undergraduates. Its Assistant Professor
    row does not name it. Community Medicine is taught to undergraduates. So the course will
    apply when you become an Associate Professor.

    Before saying more, check three things. The parts of the 2025 rules not read here. Your
    college's and your state's own rules. Any later change or written answer from NMC. The table
    does not say "cannot teach until". Do not claim it does, and do not claim the opposite either.
- type: teaching
  prompt: |
    For a first-year resident, ten minutes with a whiteboard. Why does the CBME Curriculum 2024
    cap large group teaching at one third of a subject's hours, and what does the cap not
    guarantee?
  answer: |
    Start with what the cap does. It forces at least two thirds of a subject's hours into small
    groups, practicals, clinics, self-directed learning and similar work. Those are formats where
    every learner has to do something, not only listen.

    The curriculum states the rule, and the paragraph that sets it cites no study. A rule is not
    evidence about learning, so when the resident asks why, point to studies of how people learn,
    not to the rule.

    Then the limit. A small group can still be a lecture to twelve people. The cap counts hours by
    format, and says nothing about what happens in them. Whether learners can do the objective
    afterwards is shown only by testing it.
retrieval_items:
- q: Which instrument now requires the Basic Course in Medical Education, and for which posts?
  a: The Medical Institutions (Qualifications of Faculty) Regulations, 2025, Table E. It names the course for Professors and Associate Professors in MD and MS subjects covered under undergraduate training.
- q: Is the CBME Curriculum 2024 a regulation or a guideline?
  a: A guideline, sent by NMC letter of 12 September 2024 under the Graduate Medical Education Regulations, 2023, which are the Gazette-notified regulation.
- q: How long is the Foundation Course under the CBME Curriculum 2024, and how many hours?
  a: Two weeks at the start of Phase I, 80 teaching hours.
- q: What is the mentor-to-mentee ratio in the CBME Curriculum 2024?
  a: One mentor to three mentees, allotted during the Foundation Course.
