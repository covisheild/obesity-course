simplified_explanation: |
  At the end of a session you hand out a feedback form. The forms come back warm. It is
  tempting to write "the session went well" and stop there.

  Ask what the form measured. It measured whether the learners liked the session. That is one
  thing you can find out about teaching, and it is the easiest. There are three more. Did they
  learn what you set out to teach? Do they now do their work differently? Did anything change
  for the people they serve?

  These four questions are called Kirkpatrick's levels. Each needs its own measure. A form
  answers the first. A test answers the second. Watching people at work answers the third.
  Records of the service answer the fourth.

  The first answer does not stand in for the others. The first section of this book showed
  learners rating a lecture higher and learning less from it. So when someone says a session
  worked, ask which of the four they measured.

  Watch for one disguise. A form that asks "Did you learn a lot?" looks like a question about
  learning. It is still the learner's opinion. Only a test the learner sits tells you what they
  can do.
illustrations:
- body: |
    Here is the trap. You teach a two-hour session to a batch of ASHA (Accredited Social Health
    Activist) workers. The objective: each worker weighs a child and plots
    the weight on the child's growth chart correctly. At the end you hand out the block's usual
    feedback form. Nearly every form ticks "agree" or "strongly agree". Your report says the
    session was a success.

    Now sort the form. Take each item and ask what it measures.

    ```table
    item on the form                                           what it measures      level
    The session was useful.                                     liking the session    1
    The trainer was clear and well prepared.                    liking the trainer    1
    I learned a great deal from this session.                   own view of learning  2A
    I feel confident plotting a child's weight.                 own view of learning  2A
    I will use this in my work.                                 an intention          1
    ```

    Nothing on the form reaches Level 2B. The last item is not Level 3 either. It is a promise
    made in the room, before the worker is back at work, so it belongs with reaction.

    The third item is worth a second look. It is close to the question Deslauriers and
    colleagues used to measure students' feeling of learning: "I feel like I learned a great
    deal from this class." The first section showed that feeling moving the wrong way.

    Now add what each higher level would need.

    - Level 2B: at the end of the session, and again a week later, give each worker three
      children's weights to plot. Mark each plot right or wrong against a key. That is the
      test the section on measuring change scored.
    - Level 3B: a month later, a supervisor watches each worker at the Anganwadi centre
      weigh and plot one child, with a short checklist.
    - Level 4B: over months, the service's own records show whether children whose weight
      stops rising are found sooner. A single session is unlikely to move this alone, and you
      would need a comparison area to tell.

    The form was not wrong. It answered the question it asked. Your report asked a different one.
  analogy_breaks_when: |
    The form and the batch are made up for this example. The form's items are typical of end-of-
    session forms, not copied from any one.

    Sorting an item by level says what it measures, not whether it measures it well. A Level 2B
    test with items that do not match the objective is still a poor test.
- body: |
    Now read a real literature the same way. Frich and colleagues (2015) reviewed 45 published
    studies of leadership programmes for physicians. Their abstract says positive outcomes "were
    reported in all studies". Before you repeat that, ask what the positive outcomes were
    measured at.

    Their Results count how many studies reported an outcome at each level. One study can
    report several levels, so the counts add to more than 45.

    ```table
    level  what was measured                       studies reporting it (of 45)
    1      reaction                                 25
    2A     knowledge, self-assessed                 36
    2B     knowledge, tested                        7
    3A     behaviour at work, self-assessed         10
    3B     behaviour at work, observed              2
    4      system results, either kind              6
    ```

    Turn two of those counts into proportions of the 45 studies.

    ```working
    36 divided by 45 = 0.8
    7 divided by 45 is about 0.156
    ```

    Eight in ten studies reported what physicians said they had learned. About one in six
    tested it. Two observed any change in what physicians did at work.

    Now read the abstract's sentence to the end: "although the majority of studies relied on
    learner satisfaction scores and self-assessed knowledge or behavioral change." The positive
    outcomes rest mostly on Levels 1 and 2A. The authors say so themselves. Only six studies
    reached system results.

    One more thing to check before you quote it. The same review says most assessments
    "occurred immediately after the program". A test given the moment a course ends measures
    performance, not what lasted.
  analogy_breaks_when: |
    Frich's counts describe published studies of leadership programmes for physicians, found in
    one database up to November 2013. They say what that literature measured. They are not a
    count of how teaching in India, or any teaching session, is evaluated.

    The counts also say nothing about how good each study was at its level. A Level 4 result from
    one programme with no comparison group is still only a change, not an effect.
  numbers:
  - value: "45"
    unit: "studies in Frich and colleagues' review"
    citekey: frich_2015_physician_leadership
    as_of: '2026-09-25'
    quote: |-
      We identified 45 studies that met eligibility criteria, of which 35 reported on programs exclusively targeting physicians.
  - value: "25"
    unit: "studies reporting reaction scores (Level 1)"
    citekey: frich_2015_physician_leadership
    as_of: '2026-09-25'
    quote: |-
      A majority (n = 25) of the articles reported participants’ reaction scores (Level 1)
  - value: "36"
    unit: "studies reporting self-assessed knowledge (Level 2A)"
    citekey: frich_2015_physician_leadership
    as_of: '2026-09-25'
    quote: |-
      Self-assessed knowledge outcomes (Level 2A) were reported in 36 of the studies
  - value: "7"
    unit: "studies using objective tests of knowledge (Level 2B)"
    citekey: frich_2015_physician_leadership
    as_of: '2026-09-25'
    quote: |-
      objective tests of knowledge (Level 2B) were used alone or in addition to self-assessed measures in seven of the studies
  - value: "10"
    unit: "studies reporting self-assessed behaviour (Level 3A)"
    citekey: frich_2015_physician_leadership
    as_of: '2026-09-25'
    quote: |-
      Self-assessed learning outcomes for behavior/expertise (Level 3A) were reported in 10 studies.
  - value: "2"
    unit: "studies using objective measures of behaviour (Level 3B)"
    citekey: frich_2015_physician_leadership
    as_of: '2026-09-25'
    quote: |-
      Two studies reported using objective outcome measures for behavior/expertise (Level 3B)
  - value: "6"
    unit: "studies reporting system-level outcomes (Level 4A or 4B)"
    citekey: frich_2015_physician_leadership
    as_of: '2026-09-25'
    quote: |-
      Outcomes at the system (e.g., organizational) level (Level 4A and Level 4B) were reported in six articles.
must_know:
- point: |
    A warm set of feedback forms tells you the learners liked the session. It does not tell you
    they can do anything new. When you report a session, name the level you measured, and do not
    let a Level 1 result stand in for Level 2.
  kind: misconception
  bearing: teaching
- point: |
    An item that asks "Did you learn a lot?" or "Do you feel confident?" is still the learner's
    opinion, Level 2A. In Frich's review, 36 of 45 studies reported self-assessed knowledge and 7
    tested it. When you read "participants' knowledge improved", find out which of the two it was.
  kind: trap
  bearing: methodological
  refs: [frich_2015_physician_leadership]
- point: |
    This book's gate asks that your learners can do something they could not do before, and that
    you measured it. That is Level 2B: a test you score, on the objective's action. Give it a week
    or more after the session, and plan it before you teach. A feedback form cannot pass the gate.
  kind: move
  bearing: teaching
- point: |
    Reaction and learning can point opposite ways. In Deslauriers's randomised comparison,
    students rated passive lectures more highly and scored lower on the test. So never switch
    methods, or judge a colleague's teaching, on ratings alone. Ask for a test result at the
    same time.
  kind: consequence
  bearing: policy
  refs: [deslauriers_2019_feeling_of_learning]
- point: |
    "Every study reported positive outcomes" means little until you know the level. Frich found
    exactly that across 45 studies, resting mostly on satisfaction and self-assessment, with 6
    reaching system results. Ask any programme report which level its good news came from.
  kind: number
  bearing: policy
  refs: [frich_2015_physician_leadership]
- point: |
    The levels say what an evaluation measured, not what caused the result. A Level 3 or 4
    change after a course, in one group with nothing to compare it with, is still only a change.
    Before you credit the course, ask for the design as well as the level.
  kind: boundary
  bearing: methodological
- point: |
    Level 1 is not worthless. It tells you whether learners could hear, kept up, and would come
    back, and a session nobody attends teaches nothing. Use the form for those questions and a
    test for learning. Do not rewrite a session on the form alone.
  kind: boundary
  bearing: teaching
exercises:
- type: critique
  prompt: |
    A department's report on its teaching sessions for second-year MBBS students reads: "Feedback was
    collected from all students. The mean rating for 'I have learned a great deal' was high,
    showing the sessions achieved their learning objectives."

    Sort what was measured by level. Say what the conclusion needs that the report does not
    have, and what you would add next year.
  answer: |
    The item "I have learned a great deal" is the student's own view of their learning. That is
    Level 2A, self-assessed knowledge. The rest of the form, if like most, is Level 1.

    The conclusion is about the learning objectives: that students can now do what each objective
    says. That is Level 2B, and it needs a test that asks for each objective's action, scored
    against a key. Nothing in the report is that.

    The step that fails is the inference, not the premise. The ratings may be accurately high.
    They are still about how students felt. The first section of this book showed a rating and
    a test result pointing opposite ways.

    Next year, give each session a short test on its objective. Give it at the start, at the end
    and a week or more later, as the section on measuring change set out. Report the share
    reaching each objective's standard. Keep the form for what it measures.
- type: interpretation
  prompt: |
    Frich and colleagues' abstract says "four studies used a comparison group". Their Results
    section says "Only five studies" did, and their Table 2 gives "Comparison group" as 4, or 9%.
    You want to quote the review in your own write-up. What do you write, and why?
  answer: |
    Two of the three places say four: the abstract and Table 2. The Results sentence says five,
    but it cites only four study numbers after the word "studies" (34, 42, 45 and 57). The most
    likely reading is four, and "five" a slip.

    Check the arithmetic of the table too.

    ```working
    4 divided by 45 is about 0.089
    ```

    About 9%, which matches the table's "(9)". Five would have been about 11%.

    ```working
    5 divided by 45 is about 0.111
    ```

    Write "four of 45 studies (Frich and colleagues' abstract and Table 2)". If the exact
    number matters to your argument, add that the Results text says five. Do not silently pick
    one. Whichever it is, fewer than one study in ten had anything to compare against.
- type: design
  prompt: |
    Take the session you are planning for this book's build. Write one line for each of the four
    levels: what you would measure, how, and when. Mark which lines you will actually carry out
    and which you cannot, and say why.
  answer: |
    A worked plan, for a session teaching MBBS students in community medicine to work out a family's daily
    energy intake from a diet record:

    - Level 1: a short form at the end. Could they hear, was the pace right, what was least
      clear. Carried out.
    - Level 2B: the ten-item test on the objective, scored against a key. Given at the start, at
      the end, and a week later on a parallel form. Carried out. This is the one the gate needs.
    - Level 3: whether students use the method on their family-study visits. A tutor checks one
      diet calculation in each student's family-study record a month later against the same key.
      Carried out if the tutor agrees; otherwise listed as not done.
    - Level 4: whether the families' diets change. Not carried out. One session is unlikely to
      move it alone, the time is too long, and there is no comparison group.

    A good answer says in writing which levels it will not reach, so nobody later reads the
    Level 1 form as if it covered them.
  skill_ref: S57-R1-K01
- type: teaching
  prompt: |
    For a health secretary. A state programme reports that its refresher training for ASHA
    workers on child nutrition "was rated excellent by participants". The secretary asks whether
    the training worked and whether to fund it again. One page, answer first.
  answer: |
    The answer first: the report does not say whether the training worked. It says the workers
    liked it. Fund it again only with a plan to measure what they can do.

    Why. Training can be judged at four levels. Did people like it? Did they learn? Do they work
    differently? Did anything change for the children?

    A rating answers only the first. People
    can rate one kind of teaching above another and learn less from it. A randomised study of
    university physics students found exactly that.

    What to ask for, in order of cost.

    - A short practical test for each worker, at the start, the end and a month later, on the
      task the training teaches. Cheap, and it answers the second question.
    - A supervisor's checklist at a sample of routine visits. It answers the third.
    - The programme's own records on whether children's growth problems are found sooner, in
      districts that had the training against districts not yet reached. Slow, but it is the
      only answer to the fourth.

    Tie the next round of funding to the first of these at least.
retrieval_items:
- q: Name Kirkpatrick's four levels as Frich and colleagues set them out, and one measure for each.
  a: Reaction (a feedback form), knowledge (a test on the objective), behavioural change (an
    observation at work), system results (the service's own records).
- q: Why is the item "I learned a great deal from this session" not a measure of learning?
  a: It is the learner's own view, Level 2A in Frich's split. Only a test the learner sits,
    scored against a key, is Level 2B.
- q: Which level does this book's gate ask for?
  a: Level 2B, objectively measured learning of the objective, tested a week or more after the
    session.
