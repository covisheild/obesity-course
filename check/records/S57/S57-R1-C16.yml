simplified_explanation: |
  The last section said a team you run needs direction, roles and work handed out. This section
  gives you the words for those. With them you can say what is going wrong in a team before you
  try to fix it.

  Start with two jobs that people often run together. Managing is keeping a complicated thing
  running: making the plan and the budget, putting people into jobs, and checking the results
  against the plan. Leading is moving the thing somewhere new: deciding where it should go,
  bringing people round to it, and keeping them going when it gets hard. Kotter's short way of
  saying it: management copes with complexity, leadership copes with change. Most of the time
  one person has to do both.

  People follow a direction only if they believe the person giving it. Kotter calls that
  credibility. It rests on your record, and on whether what you do matches what you say.

  Next, two words for why people do what you ask. Authority comes with the post. The head of
  department (HOD) can set the teaching roster because the post allows it. Power is getting
  things done through people by any means, and authority is only one of them. The senior
  resident everyone trusts may have more power over the ward than the unit head.

  Delegating is handing someone a task and the right to do it, while you stay answerable for
  how it turns out. How closely you guide and check depends on this person and this task. The
  same intern may need close watching on one job and none on another.

  Role clarity means writing down, for each decision, who makes it, who does the work, and who
  is asked first. When a team argues over whose job something was, look for the missing line
  on that sheet first.

  Last, two kinds of disagreement. One is about the work: what to do, how, on what evidence.
  The other is about the person: blame, dislike, a remark about someone's character. They are
  named apart because they are handled apart. How to handle each is for the next book in this subject.
illustrations:
- body: |
    Here is a week in the life of a head of a Community Medicine department. The department has
    decided that every MBBS student's family-study visits will now include weighing each adult
    and measuring their waist. The eight things below are made up for this example. Before you
    read the right-hand columns, cover them and name each activity yourself.

    ```table
    | what the head of department did | Kotter's name | job |
    | Wrote one page on what the department should teach about weight in five years | setting a direction | leading |
    | Put the new visits into the term's timetable, and asked for scales in the budget | planning and budgeting | managing |
    | Gave each tutor a group of students and a village | organizing and staffing | managing |
    | Met the medical officer of the primary health centre the students visit | aligning people | leading |
    | Asked the Medicine department to take the students' referrals | aligning people | leading |
    | Asked the tutors how they would run the next round, and used their answer | motivating and inspiring | leading |
    | Checked each month how many families each group had measured | controlling and problem solving | managing |
    | Found why one group skipped the waist measurement, and changed the form | controlling and problem solving | managing |
    ```

    Notice three things.

    The same person did all eight. Leading and managing are two jobs, not two people.

    Two of the leading rows are about people the head of department has no authority over: the
    medical officer and another department. Kotter's point about aligning is exactly this.
    Anyone who can help or block the change is someone you must talk to.

    Now imagine the plan failed. The timetable was right, the scales arrived, and the groups
    were counted every month. But the medical officer was never met, and the families were not
    told why students were at their door. That is a well-managed change that nobody led. The
    names let you say so in one sentence, instead of "it just did not work".
  analogy_breaks_when: |
    Kotter's six names sort activities; they do not rank them. A department that only leads, and
    never checks results against its plan, fails as surely as one that only manages.

    Some activities sit on the line. Asking the tutors for their views is motivating if it gives
    them a real say, and only a courtesy if you have already decided. The label depends on what
    you do with the answer.
- body: |
    Now watch aligning at the scale Kotter wrote about. His article describes Bob Crandall, who
    ran engineering and manufacturing in Eastman Kodak's copier business in the mid-1980s, and
    who set out to change how it worked.

    Crandall met his own 12 direct reports every week. Once a month he and all of them met 80 to
    100 people from one part of the organisation, to discuss anything they wanted. He then set a
    goal: to get all of his 1,500 employees into at least one small meeting on a specific topic
    each year.

    Kotter counts every one of these as a way of aligning people. Notice how far they reach
    beyond the 12 who reported to Crandall: 80 to 100 people a month, and then all 1,500.
    Kotter's sentence for it: "Aligning invariably involves talking to many more individuals
    than organizing does."

    Scale it down to your own department. Organizing the family-study visits means talking to
    your tutors. Aligning them means talking to the students, the medical officer, the ASHA
    workers in the village, and the Medicine department too.
  analogy_breaks_when: |
    This is Kotter's account of one company's change, written to illustrate his argument. It
    reports what was done and what followed, with nothing to compare it with, so it does not show
    that the meetings caused the results. Its numbers belong to an organisation of 1,500 people
    in the 1980s. A department of fifteen does not need a monthly forum; the principle, not the format,
    is what carries over.
