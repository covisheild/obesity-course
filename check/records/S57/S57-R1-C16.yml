- body: |
    You run the department's monthly journal club. Write its role sheet before the first meeting,
    not after the first muddle.

    ```table
    | what                            | who decides            | who does it                   | who is asked first       |
    | choosing the paper              | the month's convenor   | the presenter proposes three  | the head of department   |
    | presenting it                   | the month's convenor   | the presenter                 | the convenor, a week out |
    | booking the room, telling staff | the month's convenor   | the department office         | nobody                   |
    ```

    Now delegate one task. The presenter for March is an intern who has never read a trial
    critically. The presenter for April is a senior resident who has run three journal clubs.
    The task is the same. The delegation is not. With the intern, you go through the paper
    together once and hear a practice run. With the senior resident, you agree the date and look
    at the slides the day before. Next month the intern may present a topic they know well, and
    need almost nothing from you.

    Then, at the April meeting, two things happen. Two residents argue over whether the trial's
    comparison group was fair. That is conflict about the work, and it is what a journal club is
    for. Later, one of them says the other "only picks papers to look clever". That is conflict
    about the person. It has left the paper behind. Name which one you are in before you decide
    what to do.
  analogy_breaks_when: |
    The journal club and its people are made up for this example.

    A role sheet makes the roles clear. It does not make them fair, and it does not make anyone
    keep to them. And a disagreement can start about the work and turn into one about the
    person halfway through a sentence. The names help you notice the turn; they do not stop it.
must_know:
- point: |
    "Leadership is the senior person's job and management is for administrators" is wrong on
    both counts. They are two sets of activities, and most people who run anything must do both.
    Kotter holds that strong leadership with weak management is no better than the reverse.
    When a change stalls, ask which half was missing.
  kind: misconception
  bearing: policy
  refs: [kotter_1990_what_leaders_do]
- point: |
    A detailed plan is not a direction. Kotter calls long-term planning used in place of
    direction one of the most frequent mistakes of overmanaged organisations. Before you write
    the timetable for a change, write in a few sentences where it is going and why.
  kind: trap
  bearing: policy
  refs: [kotter_1990_what_leaders_do]
- point: |
    Aligning means talking to everyone who can help or block the change, not only the people
    who report to you. For a teaching change in Community Medicine that includes other
    departments, the primary health centre and the students. List them before you start, and
    meet the ones you have no authority over first.
  kind: move
  bearing: policy
  refs: [kotter_1990_what_leaders_do]
- point: |
    When people do not do what you ask, find out whether you lack authority or lack power. An
    order from the post does not reach a department you do not head. Trust built over time can
    reach people no post does. The fix for each is different.
  kind: consequence
  bearing: policy
- point: |
    Delegate to the person and the task, not to the rank. The same instruction given to everyone
    is too much for some and too little for others. Before you hand over a task, ask how well
    this person has done this task before, and how much they want it.
  kind: move
  bearing: teaching
- point: |
    Write down who decides, who does and who is consulted before the work starts. When a team
    argues about whose job something was, check first whether anyone wrote it down.
  kind: move
  bearing: policy
- point: |
    Do not answer a disagreement about the work as if it were a personal attack, or the
    reverse. The two are handled differently, so name which one you are in first. Keep the
    argument about the work in the open, on the evidence.
  kind: trap
  bearing: teaching
- point: |
    These are words, not a diagnosis. Kotter's article is an argument built on company cases, not
    a measured study, and the working definitions here come from no study at all. Using the
    words does not show that a team will do better. How to diagnose a team, and what the
    evidence says about each of these, is for the next book in this subject.
  kind: boundary
  bearing: methodological
  refs: [kotter_1990_what_leaders_do]
exercises:
- type: retrieval
  prompt: |
    Write Kotter's three management activities and his three leadership activities, each
    management activity beside the leadership activity that matches it.
  answer: |
    Planning and budgeting, beside setting a direction.

    Organizing and staffing, beside aligning people.

    Controlling and problem solving, beside motivating and inspiring.

    Management copes with complexity; leadership copes with change.
  confidence_first: true
- type: interpretation
  prompt: |
    These five sentences come from the notes of a meeting after a school weight-screening camp run
    by a Community Medicine department. For each, name the word from this section that fits
    best, and say why.

    1. "The Principal put me in charge of the camp, so the Paediatrics department had to send two
       residents. They did not come."
    2. "Nobody knew who was meant to book the school hall."
    3. "Anita and Ravi disagreed about whether to screen with waist measurement or with body
       mass index."
    4. "Ravi said Anita always sides with whoever is senior."
    5. "We gave the new intern the same one-line instruction as the senior resident, and her
       forms were all incomplete."
  answer: |
    1. Authority against power. Being put in charge of the camp gave authority over the camp,
       not over another department. Getting Paediatrics to send residents needed their agreement,
       which is aligning, and power from outside the post.
    2. Role clarity. No one had been written down as the person who decides, or does, the
       booking.
    3. Conflict about the work: which measure to use, on what evidence. It is worth having.
    4. Conflict about the person: a remark about Anita's motives, not about the screening.
    5. Delegation not matched to the person. The task was the same, but the intern needed more
       direction and checking than the senior resident.
- type: design
  prompt: |
    Write the role sheet for the teaching session you are planning for this book's build. Cover
    at least four decisions or pieces of work: for example, the objective, the time slot, the
    tests, and the teaching itself. For each, name who decides, who does it, and who is asked
    first.
  answer: |
    One worked sheet, for a session for MBBS students in Community Medicine:

    - The objective: you decide, you write it, the batch's tutor is asked first.
    - The time slot: the head of department decides, the department office enters it in the
      timetable, you are asked first.
    - The pre-test, post-test and delayed test: you decide and you write them. A colleague who
      teaches the topic is asked first, to check that they match the objective.
    - The teaching: you decide and you do it. A colleague observes, if you want a second view.

    A good sheet has a name in every "decides" cell. Where two names appear there, the decision
    will stall; pick one.
- type: teaching
  prompt: |
    For a first-year resident, ten minutes with a whiteboard. "What is the difference between
    leading and managing, and why would a unit need both?"
  answer: |
    Draw two columns. Write "copes with complexity" over the left and "copes with change" over
    the right: Kotter's short version.

    Under the left, write planning and budgeting, organizing and staffing, controlling and
    problem solving. Under the right, beside each, write setting a direction, aligning people,
    motivating and inspiring.

    Then take a real change on your unit, for example starting a weight and waist check for every
    admitted adult. Ask the resident which column each step belongs in. Writing the form and the
    rota is the left. Getting the nurses and the other units to see why it matters is the right.

    Finish with Kotter's warning: strong leadership with weak management is no better than the
    reverse. A unit where the new check was explained well but nobody wrote the rota will not do
    it. Nor will one with a perfect rota that nobody believes in. Say that this is Kotter's
    argument, not a measured result.
retrieval_items:
- q: What, in Kotter's short form, does management cope with, and what does leadership cope with?
  a: Management copes with complexity; leadership copes with change.
- q: What is the difference between authority and power?
  a: Authority is the right to decide or direct that comes with a post. Power is the capacity to get things done through people from any source, of which authority is one.
- q: What three things does a role sheet state for each decision or piece of work?
  a: Who decides, who does the work, and who is consulted before it is done.
figure_note: "The section is paired vocabulary with no quantity in it; its one structure, Kotter's three pairs, is already the first illustration's table, and a picture would draw that table again."
