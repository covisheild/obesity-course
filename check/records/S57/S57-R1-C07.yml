must_know:
- point: |
    A learner who nods, or says "yes, understood", has told you how they feel, not what they can
    do. Ask them to explain the step in their own words, aloud or on paper. The gap shows at the
    step they cannot give.
  kind: misconception
  bearing: teaching
- point: |
    Knowing your subject well does not protect you from the illusion, and neither does knowing
    that you will be asked. Before you teach a topic, write your explanation out from memory, and
    read up on the places where you stall.
  kind: trap
  bearing: teaching
- point: |
    When you ask learners to explain, have them check the explanation against the text or against
    you. A fluent explanation that is wrong can hurt learning. Learners told to explain often
    retell the text instead, which is not explaining.
  kind: move
  bearing: teaching
- point: |
    Asking someone to list the steps of a procedure will not show you the illusion, because
    people judge their knowledge of steps about right. To find the gap, ask why each step is
    there or how the thing works.
  kind: boundary
  bearing: teaching
- point: |
    Do not claim that "why" questions or self-explanation produce lasting learning. Most studies
    of them tested learners within minutes, and few ran in real classrooms. If you use them, test
    your learners days later before you say they worked.
  kind: boundary
  bearing: methodological
- point: |
    Explaining costs time: 30% to 100% more in the studies that reported it. In one study a
    group that solved twice as many problems without explaining scored the same as a group that
    explained. Weigh fewer problems explained against more problems solved.
  kind: consequence
  bearing: teaching
  refs:
  - dunlosky_2013_learning_techniques
exercises:
- type: teaching
  prompt: |
    A first-year resident tells you: "I read the chapter on anthropometry twice last night. I
    understood all of it, so I can take the MBBS batch on Monday." You have ten minutes and a
    whiteboard. Explain why "I understood it" is not yet evidence. Then give them one thing to
    do tonight instead of a third reading.
  answer: |
    Start with the mechanism. Feeling that you understand is a rating you give yourself, and
    people rate their understanding of how things work higher than it is. When they then write out
    a full explanation and rate themselves again, the second rating is lower. Being warned that
    the explanation would be asked for made the drop smaller, not absent. Being well educated in
    the subject does not stop it either.

    Then the whiteboard. Do not ask for the steps of a measurement; people know steps about as
    well as they think. Ask why. Take the height measurement, step by step as the chapter gives
    it. For each step, ask why it is there and what happens to the reading if it is skipped. Let
    the resident talk, and mark where they stop or say "and then basically".

    Then the task for tonight. Close the book. Write out, from memory, the explanation they would
    give the batch, as a chain of steps with the reason for each. Mark every place they stall.
    Open the book only for those places. Writing it from memory is also retrieval practice, so
    the same hour checks the understanding and strengthens it.

    Close with the limit. A smooth explanation can still be wrong, so the check against the book
    is part of the task, not an extra.
retrieval_items:
- q: What is the illusion of explanatory depth, and how is it shown?
  a: People believe they understand how things work in more detail than they do. Rate your
    understanding, write out a step-by-step explanation, rate again. The second rating is lower.
- q: For which kinds of knowledge did the drop appear, and for which did it not?
  a: Large for devices and natural processes, small for facts such as capital cities, and absent
    for procedures and for the plots of films.
- q: What is the difference between self-explanation and elaborative interrogation?
  a: Self-explanation is explaining how new information relates to what you know, or the steps
    you take in solving a problem. Elaborative interrogation is working out why a stated fact is
    true.
- q: Why does the evidence for explaining as a study technique fall short of strong?
  a: Almost all the studies tested learners within minutes, few ran outside the laboratory, and
    explaining takes more time than the comparison.
