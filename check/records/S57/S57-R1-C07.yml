- body: |
    Now turn explaining into something your learners do. You are taking a batch of MBBS students
    through a textbook passage on human digestion.

    Dunlosky and colleagues describe a class study of exactly this, by Smith and colleagues in
    2010. Open their review at https://doi.org/10.1177/1529100612453266 and search for Why is
    this true. Undergraduates in an introductory biology course read a long passage on human
    digestion from their course textbook.

    > For half of the students, 21 elaborative interrogation prompts were interspersed throughout
    > the text (roughly one prompt per 150 words)

    Each prompt was a statement from the text followed by "Why is this true?" The other half read
    at their own pace without prompts. Everyone then answered 105 true-or-false questions, none
    of them the same as the prompts.

    ```table
    Group  Minutes spent reading  Questions correct
    "Why is this true?" prompts  32  76%
    Reading only  28  69%
    ```

    Work out what the prompts bought, and what they cost.

    ```working
    76% - 69% = 7 percentage points more correct
    32 - 28 = 4 minutes more reading
    ```

    To use it, pick the statements in your passage that carry the mechanism. After each one, write
    "Why is this true?" Your students answer in writing. Then they check the answer against the
    text, or with you, because an explanation that is wrong and left unchecked can hurt learning.
  analogy_breaks_when: |
    This is one class, one passage and a true-or-false test. The account does not say the test
    was taken days later, and almost all studies of this technique tested within minutes, so the
    7 points say nothing about what lasted. Prompts spread thinly, one every page or two, have
    shrunk the benefit or reversed it. Learners who know little about a subject may gain less
    from "why" questions.
