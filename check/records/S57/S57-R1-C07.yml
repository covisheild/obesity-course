simplified_explanation: |
  Ask yourself whether you understand how a ceiling fan works, and you will probably say yes.
  Now write down, step by step, what happens between pressing the switch and the blades turning.
  Then ask yourself the first question again. Your answer is likely to come down.

  That drop is the illusion of explanatory depth. You felt you understood. Trying to explain
  showed you where you do not. The first section of this book (`S57-R1-C01`) showed that a
  learner's feeling of learning can point the wrong way. The feeling of understanding is the
  same kind of rating, and it fails in the same way.

  It happens to the people you teach, and it happens to you. Knowing a subject well does not
  protect you. Being told that you will have to explain does not fully protect you either.

  The illusion lives in "how does it work" and "why". Ask people to list the steps of a
  procedure, like the steps for weighing a child, and they judge what they know about right.
  Ask them why each step is there, and you are asking how something works. That is where to
  look for the gap.

  So use explaining as a check. When a student nods, ask them to explain the step. Before you
  teach a topic, write out your explanation from memory. The places where you get stuck are what
  you read up before you face the class.

  Explaining also helps people learn, not only check. Asking "why is this true?" of a fact, or
  explaining each step of a worked problem, has helped learners in many studies. The evidence is
  moderate, not strong: most of those studies tested people minutes later, not weeks later.
illustrations:
- body: |
    Start with yourself. Pick something you use every day and believe you understand: how a
    pressure cooker cooks dal faster than an open pan. Give yourself a mark from 1 to 7 for how
    well you understand it. 1 means you have almost no idea and 7 means you could explain every
    part. That is the scale Rozenblit and Keil gave their students. Write the mark down.

    Now write out the explanation as a chain of steps, each one following from the one before.
    Book 0's section on premise and inference (`B0-R0-C42`) gave you the test: each step has to
    follow from the last. Wherever you find yourself writing "and then somehow", a step is
    missing.

    Mark yourself again, from 1 to 7. If the second mark is lower, you have just met the
    illusion.

    Open Rozenblit and Keil, "The misunderstood limits of folk science", *Cognitive Science*
    2002, at https://pmc.ncbi.nlm.nih.gov/articles/PMC3062901/. Search the page for genuine
    surprise.

    > many participants reported genuine surprise and new humility at how much less they knew
    > than they originally thought

    These were graduate students who had just tried to explain a zipper or a flush toilet. Now
    search for extreme warning.

    > Importantly, the drop was still significant—the illusion held even with the extreme
    > warning.

    Here the students had been told at the start that they would have to write explanations.
    The drop was smaller than without the warning, and it was still there. Now search for
    cookbook.

    > People appear to be quite accurate in assessing their own knowledge of “cookbook”
    > procedures in contrast to their knowledge of how things work.

    This tells you where to aim the check. Say you will teach a batch of MBBS students to
    measure a child's height next week. The steps in the manual are a procedure, and you
    probably know them about as well as you think. Now write, from memory, why each step is
    there, and what goes wrong in the reading if it is skipped. That is a question about how
    something works. Mark every place you stall. That list is your reading for the evening.
  analogy_breaks_when: |
    The paper plots its students' mean ratings and does not print them, so you cannot compare
    the size of your own drop with theirs. A lower second mark tells you that you overrated
    yourself. It does not tell you what the right explanation is. A smooth explanation can still
    be wrong, and only checking it against a good source shows that. The students explained
    devices. Nobody in these studies tested the reasons behind the steps of a clinical method,
    so treat the height example as a place to look, not a measured case.
