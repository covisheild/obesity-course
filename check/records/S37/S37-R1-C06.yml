must_know:
- point: |
    Production is not supply. Write the identity out before you argue about any one term in
    it.
  kind: misconception
  bearing: methodological
  refs:
  - econ_survey_tab_1_19
- point: |
    A rise in stocks is subtracted and a fall is added. The FAO's handbook says so in as many
    words, and India's table follows it. Getting the sign wrong moves the answer by twice the
    stock change.
  kind: trap
  bearing: methodological
  refs:
  - fao_fbs_handbook_2001
- point: |
    India's official per capita net availability of foodgrains for 2022-23 is 568.8 grams a
    person a day (Economic Survey 2025-26, Table 1.19). It is what was there to be eaten, not
    what was eaten.
  kind: number
  bearing: policy
  refs:
  - econ_survey_tab_1_19
- point: |
    India's edible oil imports were 56.25 per cent of its production plus imports in 2023-24,
    by the government's own figures: 15.66 million tonnes imported against 12.18 produced. When someone says India is
    self-sufficient in food, ask which food.
  kind: india_deviation
  bearing: policy
  refs:
  - pib_2200287
- point: |
    Import dependence and self-sufficiency are not two halves of 100 unless the country
    exports nothing. Work each out from its own formula.
  kind: trap
  bearing: methodological
  refs:
  - fao_fbs_handbook_2001
- point: |
    Run the identity on every row of a supply table before you use the row. If a row misses by
    more than a few units of its last digit, say so and do not build a trend on it.
  kind: move
  bearing: methodological
  refs:
  - econ_survey_tab_1_19
- point: |
    Availability stops at the household door. Do not use availability as intake, and do not
    use a national average for a state or a family.
  kind: boundary
  bearing: public
  refs:
  - fao_fbs_handbook_2001
  - econ_survey_tab_1_19
- point: |
    Import figures and import duties change on different dates. Put the date beside every
    trade figure you quote.
  kind: consequence
  bearing: policy
  refs:
  - s37_edible_oil_duty
exercises:
- type: interpretation
  prompt: |
    Here is the WHEAT row of Table 1.19 for 2022-23, in thousand tonnes.

    ```table
    Column  Thousand tonnes
    Gross production  110554
    Net production  97177
    Net imports  -4682
    Change in stocks  -10645
    Net availability  103142
    ```

    Population is 1392329 thousand.

    Say what each of the two negative numbers means in words. Check that the row closes. Say
    whether wheat availability in 2022-23 was helped or reduced by stocks, and by how much.
  answer: |
    Net imports of -4682 mean India exported 4,682 thousand tonnes more wheat than it imported.
    Change in stocks of -10645 means the stocks the table counts fell by 10,645 thousand tonnes.

    The identity: net production, plus net imports, minus the change in stocks.

    ```working
    97,177 minus 4,682 plus 10,645 = 1,03,140
    ```

    Against 1,03,142 printed: out by 2, which is rounding. The row closes.

    Stocks helped. They fell, so 10,645 thousand tonnes came out of store and were available.
    That is about a tenth of the year's net availability.

    ```working
    10,645 divided by 1,03,142 times 100 = 10.3 per cent
    ```

    Say it with its limit. This is the stock the table counts. Its note says stocks held by
    traders, producers and consumers are not taken into account.
  skill_ref: S37-R1-K01
- type: teaching
  prompt: |
    A journalist has three minutes and asks: "Is India self-sufficient in food?" Answer without
    jargon, give one quotable sentence, and say how sure you are.
  answer: |
    Answer first.

    > In cereals, yes: India grows more rice and wheat than it keeps. In pulses and cooking
    > oil, no: more than half the oil India used in 2023-24 was imported.

    Then the numbers, one each. For cereals in 2022-23, production was about 111 per cent of
    what the country kept. For edible oil in 2023-24, the government's own figure for import
    dependence is 56.25 per cent.

    Then the limit, plainly. "Self-sufficient" here means the country grew enough of that food
    to cover what was available. It does not mean every family had enough, and it does not say
    whether people ate too little or too much. Availability is not what people ate.

    Confidence. The direction for each food is solid, from official tables. The exact
    percentages depend on the year and the definition. One row of the cereal table for 2022-23
    does not add up, so I would not quote the cereal figure to the decimal.
quantitative: true
practice:
- level: 1
  prompt: |
    A country produces 800 units of a food in a year, imports 50 and exports 30. Its stocks rise
    by 20 over the year. What was the supply for use at home? Then give the answer if the
    stocks had fallen by 20 instead.
  answer: |
    Production plus imports minus exports, minus the rise in stocks.

    ```working
    800 plus 50 minus 30 minus 20 = 800
    ```

    Supply of 800. If the stocks had fallen by 20, that grain came out of store and is added.

    ```working
    800 plus 50 minus 30 plus 20 = 840
    ```

    Supply of 840. The same harvest gives two supplies 40 apart, twice the stock change.
- level: 2
  prompt: |
    A supply of 73,000 tonnes of a food in a year is shared among 20,00,000 people. Give the
    supply in kilograms a person a year and in grams a person a day.
  answer: |
    Turn the tonnes into kilograms, then share them out.

    ```working
    73,000 times 1,000 = 7,30,00,000
    7,30,00,000 divided by 20,00,000 = 36.5
    ```

    36.5 kilograms a person a year. Now into grams, then days.

    ```working
    36.5 times 1,000 = 36,500
    36,500 divided by 365 = 100
    ```

    100 grams a person a day.
- level: 2
  prompt: |
    A country produces 30 units of a food, imports 70 and exports nothing. Give its import
    dependency ratio and its self-sufficiency ratio, and add them.
  answer: |
    The denominator for both is production plus imports minus exports.

    ```working
    30 plus 70 minus 0 = 100
    70 divided by 100 times 100 = 70
    30 divided by 100 times 100 = 30
    70 plus 30 = 100
    ```

    Import dependence 70 per cent, self-sufficiency 30 per cent. With no exports they add to
    100.
- level: 3
  prompt: |
    A country produces 90 units, imports 30 and exports 20. Give both ratios and their sum,
    and say why the sum is not 100.
  answer: |
    ```working
    90 plus 30 minus 20 = 100
    30 divided by 100 times 100 = 30
    90 divided by 100 times 100 = 90
    30 plus 90 = 120
    ```

    Import dependence 30 per cent, self-sufficiency 90 per cent, sum 120.

    The two tops, imports and production, add to 120. The shared bottom has had the 20 of
    exports taken off, so it is 100. Some of what was produced left the country, yet it still
    counts on top of the self-sufficiency ratio. That is why the FAO says one is not the
    complement of the other.
- level: 3
  prompt: |
    The supply for use at home was 500. Production was 520, imports 10 and exports 40. What
    happened to stocks over the year, and by how much?
  answer: |
    Before stocks, the flows give this.

    ```working
    520 plus 10 minus 40 = 490
    ```

    Supply was 500, which is 10 more than the flows alone give. The extra 10 must have come out
    of store.

    ```working
    500 minus 490 = 10
    ```

    Stocks fell by 10. Check it forwards: 520 plus 10 minus 40 plus 10 = 500.
- level: 4
  prompt: |
    Table 1.19 of the Economic Survey 2025-26 gives, for foodgrains in 2022-23, net
    availability of 289063 thousand tonnes and a population of 1392329 thousand. Work out the
    per capita net availability in kilograms a year and grams a day, and keep the units.
  answer: |
    Thousand tonnes divided by thousand persons gives tonnes a person.

    ```working
    2,89,063 divided by 13,92,329 = 0.20761 tonnes
    0.20761 times 1,000 = 207.61
    207.61 times 1,000 divided by 365 = 568.8
    ```

    207.6 kilograms a person a year and 568.8 grams a person a day of foodgrains available in
    2022-23, as the table prints.
  refs:
  - econ_survey_tab_1_19
- level: 5
  prompt: |
    Go the other way. The same table gives 568.8 grams a person a day of foodgrains for
    2022-23, for 1392329 thousand people. What total net availability, in thousand tonnes,
    does that imply? Compare it with the printed 289063 and say why the two differ slightly.
  answer: |
    Grams a day to kilograms a year.

    ```working
    568.8 times 365 = 2,07,612
    2,07,612 divided by 1,000 = 207.612
    ```

    207.612 kilograms, which is 0.207612 tonnes a person a year. Times the population in
    thousands gives thousand tonnes.

    ```working
    0.207612 times 13,92,329 = 2,89,064.2
    ```

    About 2,89,064 thousand tonnes, against 2,89,063 printed. The difference of about 1 comes
    from 568.8 having been rounded to one decimal. Going back from a rounded figure never lands
    exactly.
  refs:
  - econ_survey_tab_1_19
- level: 5
  prompt: |
    The PIB backgrounder of December 2025 gives India's edible oil production for 2023-24 as
    12.18 million tonnes and imports as 15.66 million tonnes. Work out import dependence and
    self-sufficiency. Say which term of the FAO's formula you had to leave out. Then compare
    your answers with the release's own figures of 56.25 and 43.74 per cent.
  answer: |
    ```working
    12.18 plus 15.66 = 27.84
    15.66 divided by 27.84 times 100 = 56.25
    12.18 divided by 27.84 times 100 = 43.75
    ```

    Import dependence 56.25 per cent, self-sufficiency 43.75 per cent. Exports were left out,
    because the release gives no edible-oil export figure. The import figure matches the
    release. The release prints 43.74 for self-sufficiency, one hundredth lower than the two
    figures it gives. Report 43.75 with the working, or 43.74 as the release's figure, and say
    which.
  refs:
  - pib_2200287
- level: 6
  prompt: |
    The same backgrounder gives India's per capita domestic consumption of edible oils in
    2022-23. It was 10.58 kilograms a year in rural areas and 11.78 in urban areas. In 2004-05
    the two figures were 5.76 and 7.92. Give each 2022-23 figure in grams a day, and the rural rise as a
    percentage of the 2004-05 figure.
  answer: |
    Kilograms a year into grams a day.

    ```working
    10.58 times 1,000 divided by 365 = 28.99
    11.78 times 1,000 divided by 365 = 32.27
    ```

    About 29 grams a day rural and 32 grams a day urban.

    The rural rise, against the starting value.

    ```working
    10.58 minus 5.76 = 4.82
    4.82 divided by 5.76 times 100 = 83.68
    ```

    A rise of 83.68 per cent, the release's own figure. These are consumption figures, not the
    supply worked out in this section. The release does not say which survey they come from.
  refs:
  - pib_2200287
- level: 7
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
    pulses 2022-23: net production 22,801, net imports 1,733
    change in stocks 615
    supply = 22,801 plus 1,733 plus 615 = 25,149
    ```
  answer: |
    The third line added the change in stocks. The 615 is a rise: grain went into store, so it
    was not available and comes off.

    ```working
    22,801 plus 1,733 minus 615 = 23,919
    ```

    23,919 thousand tonnes, which is the table's printed figure.

    Why the wrong answer looks reasonable. The column is headed "Change in Stocks" with no
    sign word. Every other term in the line is added. The error is twice the stock change,
    1,230 thousand tonnes here, and it would have gone unnoticed without the printed total to
    check against. Say "a rise comes off" before you write the sign.
- level: 8
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
    cereals 2022-23: gross production 3,03,628, net imports -30,352
    import dependence = -30,352 divided by 2,73,276 times 100 = -11.1 per cent
    so India's cereal import dependence is negative
    ```
  answer: |
    The second line put net imports where imports belong. The import dependency ratio needs
    imports alone. Net imports are imports minus exports, and a negative figure only says
    exports were larger. A country can import a great deal of one cereal and export more of
    another; the net figure hides both.

    From this table the ratio cannot be worked out at all. What can be worked out is the
    self-sufficiency ratio, whose denominator needs only production plus net imports.

    ```working
    3,03,628 divided by 2,73,276 times 100 = 111.1 per cent
    ```

    Why the wrong answer looks reasonable: the denominator is right, and a negative number
    feels like it means "not dependent". But no share of a supply can be below zero. A negative
    percentage of a whole is a sign that a wrong quantity went on top.
- level: 8
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
    foodgrains 2022-23: net availability 2,89,063, population 13,92,329
    2,89,063 divided by 13,92,329 = 0.2076
    so each person had 0.2 kilograms of foodgrain a year
    ```
  answer: |
    The third line gave the wrong unit. Net availability is in thousand tonnes and population in
    thousand persons. The thousands cancel, so 0.2076 is in tonnes a person.

    ```working
    0.2076 times 1,000 = 207.6
    ```

    207.6 kilograms a person a year, a thousand times more than the working said.

    Why the wrong answer looks reasonable: the division is right, and 0.2 looks like a sensible
    small number. Two hundred grams of grain a year would be a few days of meals, which a size
    check catches at once. Write the unit on every line.
- level: 9
  prompt: |
    A speaker says:

    > The edible oil mission will make India 72 per cent self-sufficient by 2030-31. Problem
    > solved.

    The PIB backgrounder of December 2025 gives the mission's target. Domestic edible oil
    production is to reach 25.45 million tonnes by 2030-31, "meeting around 72% of our
    projected domestic requirement". Decide what to compute, compute it, and say what your answer does not
    establish.
  answer: |
    What to compute: the requirement the target assumes, and how it compares with the supply
    in 2023-24.

    ```working
    25.45 divided by 0.72 = 35.35
    ```

    About 35.35 million tonnes of projected requirement. In 2023-24, production plus imports
    was 27.84 million tonnes, with exports left out because the release gives none.

    ```working
    35.35 minus 27.84 = 7.51
    7.51 divided by 27.84 times 100 = 26.98
    ```

    The target assumes the requirement grows by about 27 per cent over 2023-24.

    What this does not establish. That 72 per cent will be reached: it is a target. That the
    remaining 28 per cent will stop being imported: by the target's own arithmetic it will
    not.

    ```working
    35.35 minus 25.45 = 9.9
    ```

    About 9.9 million tonnes a year would still have to come from abroad. And self-sufficiency is a trade measure. It says nothing about
    whether a rise in the oil people use is good for their health. That is a separate
    question, and this calculation cannot answer it.
  refs:
  - pib_2200287
- level: 10
  prompt: |
    A report says:

    > Per capita foodgrain availability rose from 514.6 grams a day in 2021-22 to 568.8 in
    > 2022-23. Indians ate 54 grams more grain a day.

    Using Table 1.19, decide what to compute, compute it, and say what your answer does not
    establish.
  answer: |
    What to compute: the rise, then what drove it, using the identity on the two FOODGRAINS
    rows.

    ```working
    568.8 minus 514.6 = 54.2
    ```

    A rise of 54.2 grams a day, as the report says. Now the stocks. Change in stocks was -6,090
    thousand tonnes in 2021-22 and -17,540 in 2022-23: grain came out of store both years, far
    more in the second. Turn each into grams a person a day.

    ```working
    6,090 divided by 13,79,750 times 1,000 times 1,000 divided by 365 = 12.09 grams
    17,540 divided by 13,92,329 times 1,000 times 1,000 divided by 365 = 34.51 grams
    ```

    Drawing down stocks gave about 12 grams a day in 2021-22 and about 35 in 2022-23.

    ```working
    34.51 minus 12.09 = 22.42
    ```

    About 22 grams of the 54-gram rise came from grain leaving store, not from a bigger
    harvest.

    Then run the identity. The 2022-23 row misses its own total by 4,572 thousand tonnes,
    about 9 grams a day, and the table does not say why. The 2021-22 row misses by 101 the
    other way, which is less than a quarter of a gram a day.

    What the answer does not establish. That anyone ate more: the table says the figures are
    not strictly representative of consumption, and this is availability before waste at
    home. That the rise will last: a stock drawdown cannot repeat forever. And about 9 grams of
    it rests on a row that does not add up. The honest sentence is this. "Availability rose by
    about 54 grams a day on the official figures. About 22 grams of that is grain drawn from
    stocks, and the 2022-23 figure needs checking."
  refs:
  - econ_survey_tab_1_19
retrieval_items:
- q: Say the supply identity in words.
  a: Production plus imports minus exports, minus the rise in stocks (or plus the fall), is
    the supply available for use within the country over the period.
- q: How does the FAO define the import dependency ratio, and why is it not 100 minus self-sufficiency?
  a: Imports divided by production plus imports minus exports, times 100. Self-sufficiency is
    production over the same total. The two add to 100 only when exports are zero.
- q: What was India's import dependence for edible oil in 2023-24, and what are cereals like?
  a: 56.25 per cent by the government's figures (imports 15.66 million tonnes, production 12.18).
    For cereals India was a net exporter, with self-sufficiency of about 111 per cent in 2022-23.
