simplified_explanation: |
  Where does the food a country eats in a year come from? Three places. What it grew, what it
  bought from abroad, and what it had put away in store.

  So start with what was grown. Add what came in from abroad. Take off what went out.

  Two percentages tell you how much a country leans on the rest of the world. If the country
  exports nothing, the two add to 100. If it exports, they do not.

  None of this says what anyone ate. It says what was there to be eaten.
illustrations:
- body: |
    Start with the shortcut, because it is the one people take. India grew 26,058 thousand
    tonnes of pulses in 2022-23. Divide by the population and call it what Indians had.

    Open the Economic Survey 2025-26 Statistical Appendix, Table 1.19, "Per Capita Net
    Availability of Foodgrains", at
    https://www.indiabudget.gov.in/economicsurvey/doc/stat/tab1.19.pdf. Find the block headed
    PULSES and the row for 2022-23. The population column is in thousand persons: 13,92,329
    thousand, which is 139.2 crore, that is about 1.39 billion people. Dividing thousand tonnes
    by thousand persons gives tonnes a person.

    ```working
    26,058 divided by 13,92,329 = 0.018715 tonnes
    0.018715 times 1,000 = 18.715
    18.715 times 1,000 divided by 365 = 51.27
    ```

    About 51 grams of pulses a person a day. The table says 47.1. The shortcut is 4 grams too
    high, and the table shows why. Now build the supply properly, from the same row.

    ```table
    Pulses, 2022-23  Thousand tonnes
    Net production  22801
    Net imports  1733
    Rise in stocks, taken off  -615
    Net availability  23919
    ```

    Table 1.19 prints the stock change as 615, a rise. It is written -615 here because a rise
    is taken off.

    Net production is the harvest less what was kept for seed, fed to animals or wasted before
    sale. Net imports are imports minus exports. The stocks rose by 615 thousand tonnes, so
    that much was stored rather than used, and it comes off. Say the identity in words:
    production plus imports minus exports minus the rise in stocks is what was available.

    ```working
    22,801 plus 1,733 minus 615 = 23,919
    ```

    It closes exactly. Now share it out.

    ```working
    23,919 divided by 13,92,329 = 0.01718 tonnes
    0.01718 times 1,000 = 17.18
    17.18 times 1,000 divided by 365 = 47.07
    ```

    About 17.2 kilograms a person a year and 47.1 grams a day, as the table prints. The
    shortcut counted seed, feed and waste as food, counted grain that went into store, and left
    out imports. In this year those errors did not cancel.

    Now read the note under the table before you quote the 47.1 anywhere. The figures "are not
    strictly representative of actual level of consumption". This is what was there to be
    eaten in the country as a whole. It is not what any household or person ate.
  analogy_breaks_when: |
    The identity always holds, because it is only bookkeeping. The figures in it do not always
    hold. The table's stock column does not count stocks held by traders, producers and
    consumers, by its own note. And a national average in grams a day says nothing about any
    state, household or person.
