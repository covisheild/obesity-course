- body: |
    The identity also tells you how much of a food came from abroad. Edible oil and cereals
    give opposite answers.

    Open the Press Information Bureau (PIB) backgrounder *National Mission on Edible Oils* (8
    December 2025) at https://www.pib.gov.in/PressReleasePage.aspx?PRID=2200287. Search for
    "12.18" and then for "15.66". India produced 12.18 million tonnes of edible oil in 2023-24
    and imported 15.66 million tonnes. The release gives no edible-oil export figure, so leave
    exports out and say you did. The FAO's import dependency ratio is imports divided by
    production plus imports minus exports, times 100.

    ```working
    12.18 plus 15.66 = 27.84
    15.66 divided by 27.84 times 100 = 56.25
    12.18 divided by 27.84 times 100 = 43.75
    ```

    Import dependence 56.25 per cent, the release's own figure, and self-sufficiency 43.75 per
    cent (the release prints 43.74). With exports taken as zero, the two add to 100.

    Now cereals, from Table 1.19 for 2022-23. Gross production was 3,03,628 thousand tonnes and
    net imports -30,352: net exports. The table gives only imports minus exports, so the IDR
    cannot be worked out: it needs imports alone. The SSR can, because its denominator,
    production plus imports minus exports, is production plus net imports.

    ```working
    3,03,628 minus 30,352 = 2,73,276
    3,03,628 divided by 2,73,276 times 100 = 111.1 per cent
    ```

    Self-sufficiency of about 111 per cent. India grew more cereal than it kept. For edible
    oil, less than half of what it kept was home-grown.

    One date to watch. The oil releases also give import duty rates, and those are out of date.
    On 24 September 2026 the PIB announced that the basic customs duty on crude sunflower oil
    had been cut to nil, and on crude soybean and crude palm oil to 5 per cent. Import figures
    and duty rates move on different clocks. Quote each with its own date.
  analogy_breaks_when: |
    The two ratios compare a country's own production with what it kept. They say nothing
    about whether what it kept was enough, or too much, for the people eating it. And an SSR
    above 100 for all cereals together can sit beside heavy dependence on imports of another
    food, as the oil figures show. The FAO adds that the ratios hold only if imports are
    mainly used at home and not re-exported.
