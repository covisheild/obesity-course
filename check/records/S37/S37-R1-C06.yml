definition:
  text: |
    Take one food and one stated period. A country's supply of that food for use within the country is its
    production, plus its imports, minus its exports, minus the rise in its stocks over the period (or plus the
    fall).

    India's official series of per capita net availability of foodgrains, published in the
    Economic Survey's Statistical Appendix Table 1.19, applies the same identity with two
    further subtractions. Net availability is gross production, less seed, feed and wastage,
    less exports, plus imports, less the change in stocks. Net availability divided by the
    population gives per capita net availability in kilograms a year. Divided again by 365 it
    gives grams a day. The table states that these figures are not strictly representative of
    actual consumption.

    The Food and Agriculture Organization of the United Nations (FAO) defines an import
    dependency ratio (IDR): imports divided by production plus imports minus exports, times
    100. Its self-sufficiency ratio (SSR) is gross production divided by the same total, times
    100. Neither ratio uses the change in stocks. The two add to 100 only when exports are zero. A net imports figure,
    imports minus exports, is enough for the SSR and not enough for the IDR.
