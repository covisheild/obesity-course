- body: |
    Now run the identity on a row that does not close. It is a real one.

    In the same table, find the block headed RICE and the row for 2022-23. Net production is
    125438 thousand tonnes. Net imports are -22347: a minus sign in this column means India
    exported more rice than it imported, by 22,347 thousand tonnes. Change in stocks is -7462:
    the stocks fell. Printed net availability is 115120.

    Take the rise in stocks off, as before. A fall is a negative rise, and taking off a negative
    number adds it.

    ```working
    1,25,438 minus 22,347 plus 7,462 = 1,10,553
    1,15,120 minus 1,10,553 = 4,567
    ```

    The row is 4,567 thousand tonnes short of its own printed total. Do the same with the rice
    rows for 2020-21 and 2021-22, and they close exactly. Do it with wheat for 2022-23 and it is
    out by 2, which is rounding. Of all the rows for single foods, one other fails: pulses in
    2021-22, by 102. Only rice in 2022-23 is out by thousands.

    The gap carries through. The CEREALS and FOODGRAINS totals for 2022-23 include rice, and
    each misses its own identity by 4,572. Turn that into grams a day, the same way as before.

    ```working
    4,572 divided by 13,92,329 times 1,000 times 1,000 divided by 365 = 9.00 grams
    ```

    About 9 grams a person a day of the headline foodgrain figure for 2022-23, 568.8 grams,
    that the table's own columns do not account for.

    The table does not say why. The stock figure may have been revised, a column may carry a
    different definition that year, or there may be a slip. You cannot tell which from here,
    and you should not guess. What you can do is say it plainly: "Table 1.19's 2022-23 rice row
    does not satisfy its own identity by 4,567 thousand tonnes, so I have not used the change
    between 2021-22 and 2022-23 without checking the Division's source." That sentence is what
    running the identity buys you.
  analogy_breaks_when: |
    The identity finds a row whose parts do not add up. It cannot find a row whose parts add up
    and are all wrong together. A matched pair of errors passes it, as Book 0, C9 warned about
    stocks.
