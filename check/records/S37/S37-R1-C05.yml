simplified_explanation: |
  Stand at a vegetable cart or a kirana shelf and look at what is there. Somebody decided what
  would be on it before you walked up.

  A farmer decided what to plant. A company may have signed for the crop before it was even
  sown. A trader decided which grade of onion went to which city. A state market committee set
  the fee on the first sale. A processor decided the recipe, the pack size and how much to
  spend on the brand. A shopkeeper decided what to stock, at what mark-up, and what to put at
  eye level.

  The place where all these decisions meet you is called the food environment. It has four
  parts that affect what you pick. What is there, and how near? What does it cost? How is it
  promoted? What quality is it?

  You still choose. But you choose from a shelf that others filled. So when you want to know
  why people eat what they eat, ask about the shelf as well as the person.
illustrations:
- body: |
    Start with a leaflet from a health camp. It says: "Eat more vegetables and pulses. Cut down
    on fried snacks." Hand it to a woman standing at a vegetable cart in a Delhi neighbourhood
    market. Then ask what, on the cart in front of her, the leaflet changed.

    Walk back along the onion on the cart. Open the Reserve Bank of India (RBI) working paper
    *Vegetables Inflation in India: A Study of Tomato, Onion and Potato* (Working Paper 08/2024)
    at https://www.rbi.org.in/Scripts/PublicationsView.aspx?id=22723 and search for "In the
    case of onion".

    What is there. Onions reach Delhi from Maharashtra, Madhya Pradesh, Rajasthan and Gujarat
    "during different times of the year". Which state's onion is on the cart this month was
    decided by where farmers planted, and by traders who bought at mandis there and paid to
    move it.

    What quality. The paper says onions reaching Delhi "are of ‘A’ grade quality and fetch the
    highest price". Sorting and grading happened at the farm and in the mandi. Somebody decided
    which grade came to this city.

    What it costs. Search for "commission agents". At the first mandi, the paper records "the
    mandi fees (1 per cent), commission charges (4 per cent)". Now search for
    "Agricultural Produce Marketing Committees". The paper says these state committees "fix
    mandi fees, official commission charges, and user charges". So part of the onion's price
    was set by a state body at the first sale. The paper's split of the Delhi onion rupee is
    this: farmers 36.2 per cent, traders 17.6 per cent, wholesalers 15.0 per cent, retailer
    31.3 per cent. Four sets of hands each set a part of the price.

    How it is promoted. Loose onions carry no brand. Now open the RBI pulses paper at
    https://www.rbi.org.in/Scripts/PublicationsView.aspx?id=22722 and search for "brand
    promotion". Processors of packed pulses "spend about Rs. 3–4 per kg for brand promotion
    activities". The packet on the kirana shelf behind the cart was promoted. The onion was not.

    Where. The paper says retailers buy at the secondary mandi and "sell it in the
    neighbourhood markets in urban areas". The cart is where it is because a retailer chose
    that street.

    Now go back to the leaflet. It is advice to the woman at the cart. It changed none of the
    decisions above: not what reached Delhi, not the grade, not the fee, not the mark-ups, not
    what was promoted, not where the cart stands. It may change which of the things on the
    cart she picks. That is all it can reach.
  analogy_breaks_when: |
    The onion's path is the one the RBI paper traced, to Delhi, from wholesale prices of the
    three years to 2021-22 and costs gathered in January 2023. A village haat, a supermarket or
    an app has a different set of deciders.

    Knowing who decided each element does not tell you how much each decision changes what
    people eat. The paper measured prices, not diets.
