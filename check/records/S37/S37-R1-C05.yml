- body: |
    The onion's deciders acted after harvest. For some foods the decision is taken before the
    seed goes in.

    Search the RBI tomato-onion-potato paper for "contract farming". Potato farmers who have
    contracts with companies making chips and snacks, and the paper names several, "sell it
    directly to the processors". The variety, the quantity and the buyer were settled when the
    contract was signed.

    Open the RBI fruits paper at https://www.rbi.org.in/Scripts/PublicationsView.aspx?id=22721
    and search for "PHCs". Pre-harvest contractors "enter into a contract with farmers prior to
    the harvest season to fix prices, purchase quantities in tonnage". The price was fixed
    before the fruit was picked.

    Open the RBI milk, poultry meat and eggs paper at
    https://www.rbi.org.in/Scripts/PublicationsView.aspx?id=22720 and search for "integrator
    model". Around 70 per cent of broiler farmers follow it, and the marketing of the birds "is
    taken care of by companies or private entities". Search the same paper for "NECC". The
    National Egg Coordination Council "declares daily region-specific farm gate prices for
    eggs". A national body announces the egg price farmers are paid.

    Now set it out as a table. Each element of the food environment, and the actors these
    papers show deciding it.

    ```table
    Element  Who decides it, in the chains the RBI papers trace
    What is there, and how near  Farmers, contracting processors, traders, retailers
    What it costs  APMCs on fees, NECC on egg prices, every hand's mark-up
    How it is promoted  Processors and their brands
    What quality  Farmers and traders who sort and grade
    ```

    One row is missing from every one of these papers: the state as a seller. The HLPE report
    lists, among the places where people get food, "schools, hospital and public canteens".
    There the state decides the whole plate. The state's own prices and rations come later in
    this book.
  analogy_breaks_when: |
    Contracts, integrators and NECC prices are described for the products and places the
    papers studied: potato in western Uttar Pradesh, mango around Malihabad in
    Uttar Pradesh, broilers and eggs in Maharashtra and Haryana. How far they reach across India is
    not measured in these texts.

    The table names deciders. It does not rank them, and it does not say which decision matters
    most for what people eat.
  numbers:
  - value: '70'
    unit: per cent of broiler farmers following the integrator model
    citekey: rbi_wp_2024_poultry
    quote: In poultry meat, around 70 per cent of farmers or farm owners follow integrator model
figure_note: "The section's content is a grid of four elements against their deciders, which the table carries; the wanted diagram (the chain feeding a food environment) is a flow picture the drawing tool does not make."
must_know:
- point: |
    "People eat what they choose" leaves out half of it. People choose among what is there,
    at the price it is, promoted as it is, in the place it is sold. Others decided each of
    those first. The HLPE's own wording is that consumer behaviour is "also shaped by the
    existing food environment". Say both halves when you explain a diet.
  kind: misconception
  bearing: public
  refs:
  - hlpe_2017
- point: |
    For any food on a plate, ask four questions in order. What was there, and how near? What
    did it cost? How was it promoted? What quality was it? Then name who decided each. A
    question you cannot answer is a gap in the evidence, not a gap in the person.
  kind: move
  bearing: policy
- point: |
    Advice reaches only the last decision: the pick from the shelf. It does not change what
    was stocked, what it cost, how it was sold or where. When a plan relies on advice alone,
    name the decisions it leaves alone. The World Cancer Research Fund keeps a list of ten
    policy areas called NOURISHING. It files advice and counselling in health care under
    behaviour change, apart from the food environment.
  kind: trap
  bearing: policy
  refs:
  - wcrf_nourishing
- point: |
    In clinic, treat a patient's account of what is sold near home, and at what price, as
    evidence about their food environment. Do not talk past it. It tells you which advice
    they can act on.
  kind: consequence
  bearing: clinical
- point: |
    In India a state body sets part of the price at the first sale. APMCs fix mandi fees and
    commission charges, and on the RBI's onion route to Delhi these were 1 and 4 per cent. The
    state is also a seller in its own right, through school, hospital and public canteens.
  kind: india_deviation
  bearing: policy
  refs:
  - rbi_wp_2024_08_tops
  - hlpe_2017
- point: |
    Some choices are made before planting. Processors contract potato farmers, pre-harvest
    contractors fix mango prices before harvest, and around 70 per cent of broiler farmers sell
    through integrator companies. A policy aimed at farmers' crop choices has to deal with
    whoever signed the contract.
  kind: consequence
  bearing: policy
  refs:
  - rbi_wp_2024_08_tops
  - rbi_wp_2024_fruits
  - rbi_wp_2024_poultry
- point: |
    This method names who decides. It does not measure how much any one decision changes what
    people eat. When someone claims a shelf rule or a price change will cut intake by a stated
    amount, ask for the study that measured it. Do not supply the number yourself.
  kind: boundary
  bearing: methodological
exercises:
- type: critique
  prompt: |
    A district obesity plan contains one line on food.

    > Obesity will be tackled through awareness camps that teach people to choose healthy
    > foods.

    Using the four elements of the food environment, find what the line assumes and say what
    it leaves out. Name one actor, other than the person, that the plan could have addressed
    for each element.
  answer: |
    The unstated premise is that the healthy food is already there, cheap enough, not drowned
    out by promotion and good enough to buy. On that premise, knowing is the only thing
    missing. Book 0,
    F4 would call this a premise that has to be true for the conclusion to follow. Nothing in
    the plan checks it.

    What the line leaves out, element by element.

    What is there, and how near: which foods the shops and carts in the district stock. The
    actors are the retailers, and upstream the traders who choose what to bring in.

    What it costs: the price at the shop. The actors include the state market committees that
    fix fees at the first sale, and every hand's mark-up. The state's own ration and meal prices
    come later in the book.

    How it is promoted: brand spending and shelf placement. The actors are processors and
    retailers.

    What quality: sorting, grading and freshness. The actors are the farmers and traders who
    grade, and the retailers who store.

    A camp acts at the last step, the person's pick. It may help. It cannot fill a shelf.
- type: teaching
  prompt: |
    A first-year resident has ten minutes and a whiteboard. They ask why the department keeps
    talking about the food environment when the patient is the one eating. Explain it with a
    drawing, and end on what the idea does not tell you.
  answer: |
    Draw a line across the board. On the left write the stages: farm, mandi, processor,
    wholesaler, retailer. On the right, a person. Where the line meets the person, draw a box
    and label it with the four elements: what is there, price, promotion, quality.

    Then walk one food along it. Take an onion in Delhi. The farmer chose the crop. A trader
    chose which grade came to Delhi. A state committee fixed the fee at the first mandi.

    Four sets of hands added their mark-ups. A retailer chose the street. Only then does the
    patient arrive and choose.

    The point for clinic: the patient's choices are real, and they are made inside that box.
    Ask what is sold near them and what it costs before you decide what advice they can use.

    End on the limit. The drawing shows who decides. It does not show how much any one
    decision changes what the patient eats. That needs studies, and the drawing is not one.
retrieval_items:
- q: What are the four key elements of the food environment in the HLPE report?
  a: Availability and physical access (proximity); economic access (affordability);
    promotion, advertising and information; food quality and safety.
- q: Name two actors, other than the consumer, who decide the price of an onion bought in Delhi.
  a: Any two of the state APMC that fixes the mandi fee and commission charges, the trader, the
    wholesaler and the retailer, each of whom adds a mark-up.
- q: What does a piece of dietary advice act on, and what does it leave untouched?
  a: It acts on the person's pick from what is on offer. It leaves untouched what is stocked,
    its price, how it is promoted and where it is sold.
