definition:
  text: |
    India's Household Consumption Expenditure Survey (HCES) is run by the Ministry of Statistics
    and Programme Implementation (MoSPI). Its headline figure is the monthly per capita consumption expenditure (MPCE): a household's
    spending in a month, divided by the number of people in it. The share of a food group in MPCE
    is the group's MPCE divided by total MPCE, times 100.

    In 2022-23, food took 46.38 per cent of MPCE in rural India and 39.17 per cent in urban
    India. Cereals and cereal substitutes took 10.75 per cent of rural MPCE in 2011-12 and 4.91
    per cent in 2022-23. The group "beverages, refreshments and processed food" rose from 7.90 to
    9.62 per cent rural and from 8.98 to 10.64 per cent urban over the same years.

    These are shares of rupees spent, at the prices of each survey year, as the respondents
    reported them. The headline shares leave out the value of food received free through
    welfare programmes. From 2022-23 the survey records that food separately and reports a
    second set of estimates that includes it.

    The National Sample Survey's Report 594, built on the same HCES rounds, converts the food each
    household recorded as consumed into energy with a conversion table. It gives an all-India average of 2,233 kilocalories a
    person a day in rural areas in 2011-12 and 2,212 in 2023-24.
