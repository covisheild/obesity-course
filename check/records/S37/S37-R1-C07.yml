- body: |
    Now work a share out yourself, then track it across one year.

    Stay with Statement 5 of the 2022-23 factsheet. In rural India the average person's household
    spent Rs 363 a month on beverages, refreshments and processed food, out of Rs 3,773 on
    everything. The share is the part divided by the whole, times 100. Written with symbols,
    divided by is ÷ and times is ×, so the rule is part ÷ whole × 100.

    ```working
    363 divided by 3,773 is about 0.0962
    0.0962 times 100 = 9.62
    ```

    That is the 9.62 per cent the table prints beside it. Check one row like this whenever you
    first open a table. It tells you which column is the whole.

    Read the footnote on that row before you name it: it "includes purchased cooked meals". So
    this group is not only packets and bottles. A thali eaten at a dhaba sits in it too.

    Now 2023-24. The Press Information Bureau's release of 30 January 2025 gives 9.84 per cent
    rural and 11.09 per cent urban. Set them beside 2022-23.

    ```table
    survey  cereals and cereal substitutes, rural (% of MPCE)  beverages, refreshments and processed food, rural (% of MPCE)
    2011-12  10.75  7.90
    2022-23  4.91  9.62
    2023-24  4.99  9.84
    ```

    ```working
    9.84 minus 9.62 = 0.22
    4.99 minus 4.91 = 0.08
    ```

    Beverages and processed food rose by 0.22 of a percentage point in rural India in one year.
    Cereals rose too, by 0.08 of a point. It was not a fall. Over eleven years the direction is
    clear. Over one year, the moves are small enough that you should not build a story on
    either.
  analogy_breaks_when: |
    The 2023-24 shares come from a press release that names only a few food groups. Only groups
    named the same way in both, such as these two, can be compared. Surveys before 2009-10 used a different reference period for
    some items, so a chain of shares back to 1999-00 mixes two methods.
