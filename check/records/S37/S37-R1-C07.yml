simplified_explanation: |
  One government survey, used two ways, tells you most of what is known about Indian food at
  the scale of the country. It weighs nobody's plate.

  The first use asks households what they spent. Divide what went on one kind of food by what went
  on everything, and you have that food's share of the budget.

  The survey's second use takes the quantities of food each household recorded. It turns those
  amounts into kilocalories with a table of how much energy each food holds. Between 2011-12 and
  2023-24 its average hardly moved: about 2,200 kilocalories a person a day in rural India.

  The budget changed shape a great deal. The energy total barely changed. A share of spending
  is a share of rupees. It is not kilograms and it is not kilocalories. Before you say what
  Indians eat, say which of these numbers you are reading.

  Rung 2 reads these changes against the nutrition transition. That is Popkin and colleagues'
  name for a shift in the world's diets towards processed food, edible oils and sweet drinks.
illustrations:
- body: |
    Start with a sentence you could easily write, and watch it fail.

    > Cereals' share of rural spending fell from 10.75 per cent to 4.91 per cent between 2011-12
    > and 2022-23. So rural households now eat less than half the cereal they did.

    Open the Ministry of Statistics and Programme Implementation's *Survey on Household
    Consumption Expenditure, Fact Sheet: 2022-23* at
    https://www.mospi.gov.in/sites/default/files/publication_reports/Factsheet_HCES_2022-23.pdf.
    Find Statement 3. The two shares are there, in the rural column.

    First, the size of the fall. A fall in a share can be said two ways, and Book 0's section on
    percentages (A4) taught both. In percentage points, subtract. As a per cent change, divide
    the fall by where it started.

    ```working
    10.75 minus 4.91 = 5.84
    5.84 divided by 10.75 = 0.543
    ```

    So the share fell by 5.84 percentage points, which is a fall of about 54 per cent of the old
    share. The sentence above is using the second number and treating it as a quantity eaten.

    Now turn each share back into rupees. A share of MPCE times the MPCE gives the rupees.
    Statement 2 gives average rural MPCE: Rs 1,430 in 2011-12. Statement 5 gives the rupees on
    cereals in 2022-23 directly: Rs 185 a person a month.

    ```working
    1,430 times 10.75 divided by 100 = 153.7
    185 minus 153.7 = 31.3
    ```

    Rural households spent about Rs 154 a person a month on cereals in 2011-12 and Rs 185 in
    2022-23. The rupees went up while the share came down. The share fell because everything
    else in the budget grew faster.

    Even the rise in rupees is not a rise in grain. The factsheet says its values are nominal,
    as the respondents reported them: rupees of each year's prices. And from 2022-23 the
    headline figures leave out grain received free through the public distribution system (the
    PDS). The survey counts it only in a second set of estimates.

    Last, the number that does speak to energy. Report 594 of the National Sample Survey puts
    rural intake at 2,233 kilocalories a person a day in 2011-12 and 2,212 in 2023-24. That is
    almost no change, while the cereal share halved. The report does not say, in the pages held
    here, whether its 2011-12 figure was worked out again with the 2025 conversion table, so
    treat 'almost no change' as approximate.

    So the honest sentence is this. Cereals' share of the rural budget fell from 10.75 to 4.91
    per cent. Over roughly the same years, estimated energy per person hardly moved.
  analogy_breaks_when: |
    The rupee figures hold for the all-India rural average in the years named, at each year's
    own prices. They say nothing about any one state, income group or household. The 2011-12
    rupees and the 2022-23 rupees cannot be set side by side as amounts of grain, because prices
    changed in between and the survey did not report quantities of cereal here.
