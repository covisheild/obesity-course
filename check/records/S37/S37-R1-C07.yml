must_know:
- point: |
    A falling share of spending is not a falling amount eaten. Cereals' share of rural MPCE
    halved between 2011-12 and 2022-23 while the rupees spent on them rose, in each year's
    prices.
  kind: misconception
  bearing: public
  refs:
  - hces_2022_23_factsheet
  - nss_594_2025
- point: |
    Say points or per cent, every time. Cereals fell 5.84 percentage points in the rural
    budget, which is a fall of about 54 per cent of the old share.
  kind: trap
  bearing: public
- point: |
    In 2023-24 beverages, refreshments and processed food was the largest food group in both
    rural and urban spending: 9.84 per cent of rural MPCE, followed by milk and milk products at
    8.44 (Press Information Bureau, 30 January 2025). It includes purchased cooked meals. Neither the factsheet nor
    the 2023-24 release splits the group further, so no share of it can be called snacks or
    sweet drinks.
