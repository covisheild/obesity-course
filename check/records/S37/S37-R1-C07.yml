exercises:
- type: interpretation
  prompt: |
    Here are two rows of Statement 5 of the HCES 2022-23 factsheet, rural and urban India.

    ```table
    item group  MPCE rural (Rs)  MPCE urban (Rs)  share rural (%)  share urban (%)
    milk & milk products  314  466  8.33  7.22
    vegetables  203  245  5.38  3.80
    ```

    Say what the table shows about milk and vegetables in town and village. Then say two things
    it does not show.
  answer: |
    It shows that urban households spent more rupees a person a month on both groups than rural
    ones. Milk took Rs 466 against Rs 314. Vegetables took Rs 245 against Rs 203. It also shows
    that both groups take a smaller share of the urban budget than of the rural one. Both are true
    at once, because the urban budget is much larger (Rs 6,459 against Rs 3,773).

    It does not show quantities. Prices differ between town and village, so more rupees need not
    mean more litres or kilograms.

    It does not show who ate the food. These are household purchases divided by household size.
    It also does not show free food received through welfare schemes, which the headline figures
    leave out.
- type: teaching
  prompt: |
    A journalist has three minutes. They want to write: "Indians now spend more on junk food than
    on cereals." Tell them what the survey supports, in words they can quote, and what it does
    not.
  answer: |
    Lead with what is true. "In 2023-24, rural households put about 10 per cent of their spending
    into drinks, snacks, processed food and bought meals. They put about 5 per cent into cereals.
    The government's own survey says so."

    Then the two corrections. The group is not junk food. It includes a meal bought at a dhaba or
    a canteen. And spending is not eating. Cereals are cheap, and free ration grain is left out of
    these figures. So a smaller rupee share of cereals does not mean less cereal on the plate.

    Give the calibrated sentence. "Indian household budgets have shifted sharply towards bought and
    processed food. Whether diets have shifted as much in energy terms is a separate question, and
    the survey's calorie estimates show total energy per person almost flat."
- type: critique
  prompt: |
    A draft report says this.

    > Food's share of rural spending fell from 52.90 per cent in 2011-12 to 46.38 per cent in
    > 2022-23. This shows that rural food security has worsened.

    Find the flaw.
  answer: |
    A falling food share usually comes with a rising total budget, not a shrinking plate. Work
    out the rupees. In 2011-12 rural MPCE was Rs 1,430, and 52.90 per cent of it is about Rs 756.
    In 2022-23 food took Rs 1,750. Rupees on food more than doubled, at each year's prices.

    So the fall in the share says the rest of the budget grew faster. It says nothing directly
    about food security. That needs measures of intake, of who goes short, and of prices. The
    report has drawn a conclusion about hunger from a ratio of rupees.
quantitative: true
practice:
- level: 1
  prompt: |
    A household spends 450 in a month, and 54 of it goes on one item. What share of the month's
    spending is that item, in per cent?
  answer: |
    Part divided by whole, times 100.

    ```working
    54 divided by 450 = 0.12
    0.12 times 100 = 12
    ```

    12 per cent.
- level: 2
  prompt: |
    A share was 12 per cent and is now 9 per cent. Give the change in percentage points, and the
    change as a per cent of the old share.
  answer: |
    Points: subtract.

    ```working
    12 minus 9 = 3
    ```

    A fall of 3 percentage points.

    Per cent: divide the fall by where it started.

    ```working
    3 divided by 12 = 0.25
    ```

    A fall of 25 per cent of the old share. Same change, two numbers.
- level: 3
  prompt: |
    A total is 2,000 and one item's share of it is 7.5 per cent. How much is the item?
  answer: |
    Go the other way: share times whole.

    ```working
    7.5 divided by 100 = 0.075
    0.075 times 2,000 = 150
    ```

    150.
- level: 4
  prompt: |
    In the HCES 2022-23 factsheet, rural households spent Rs 136 a person a month on edible oil,
    out of an MPCE of Rs 3,773. Work out edible oil's share of MPCE. The factsheet prints 3.59
    per cent. Say why your answer may differ in the second decimal place.
  answer: |
    ```working
    136 divided by 3,773 is about 0.03605
    0.03605 times 100 = 3.605
    ```

    About 3.60 per cent of rural MPCE, against the printed 3.59.

    The table prints rupees rounded to whole rupees. A rupee figure between 135.5 and 136.5 prints
    as 136. The share was worked out from the unrounded figure, so recomputing from rounded
    rupees can move the second decimal. A difference that small is rounding, not an error.
  refs:
  - hces_2022_23_factsheet
- level: 5
  prompt: |
    Take urban India in 2022-23. The factsheet gives Rs 687 a person a month on beverages,
    refreshments and processed food. It gives Rs 235 on cereals and cereal substitutes. MPCE was
    Rs 6,459. Work out each group's share of MPCE. Then say how many times the first is the second.
  answer: |
    ```working
    687 divided by 6,459 is about 0.1064
    235 divided by 6,459 is about 0.0364
    ```

    10.64 per cent and 3.64 per cent of urban MPCE, as the factsheet prints.

    The ratio needs no MPCE at all, because both shares share the same whole.

    ```working
    687 divided by 235 is about 2.92
    ```

    Urban households spent about 2.9 times as much on the first group as on cereals.
  refs:
  - hces_2022_23_factsheet
- level: 5
  prompt: |
    Food's share of rural MPCE was 52.90 per cent in 2011-12 and 46.38 per cent in 2022-23 (HCES
    2022-23 factsheet, Statement 3). Give the change in percentage points and as a per cent of the
    2011-12 share.
  answer: |
    ```working
    52.90 minus 46.38 = 6.52
    6.52 divided by 52.90 = 0.123
    ```

    A fall of 6.52 percentage points, which is about 12 per cent of the 2011-12 share.
  refs:
  - hces_2022_23_factsheet
- level: 6
  prompt: |
    Report 594 of the National Sample Survey gives urban per capita energy intake. It was 2,206
    kilocalories a day in 2011-12 and 2,240 in 2023-24. Give the change in kilocalories a day and
    as a per cent of the 2011-12 figure, with the units kept on each.
  answer: |
    ```working
    2,240 minus 2,206 = 34
    34 divided by 2,206 is about 0.0154
    ```

    A rise of 34 kilocalories a person a day, about 1.5 per cent of the 2011-12 figure.

    The report calls the change from 2009-10 to 2023-24 slight; this one is smaller still. Table 3.14 prints no margin of error
    beside its figures. Without one, you cannot tell a change this small from the survey's own
    wobble between samples.
  refs:
  - nss_594_2025
- level: 6
  prompt: |
    In rural India in 2011-12, MPCE was Rs 1,430 and cereals and cereal substitutes took 10.75
    per cent of it. In 2022-23 the factsheet gives Rs 185 on the same group. Work out the 2011-12
    rupees, then the change in rupees as a per cent of 2011-12. Then say what this does not tell
    you about cereal eaten.
  answer: |
    ```working
    1,430 times 10.75 divided by 100 = 153.7
    185 minus 153.7 = 31.3
    31.3 divided by 153.7 = 0.204
    ```

    About Rs 154 a person a month in 2011-12. Rupees on cereals rose by about Rs 31, about 20
    per cent, while the share fell.

    It does not tell you whether more or less cereal was eaten. The rupees are at each year's
    prices, so some or all of the rise could be prices. And from 2022-23 grain received free
    through the PDS is left out of the headline figures.
  refs:
  - hces_2022_23_factsheet
- level: 7
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
    cereals' share of rural MPCE: 10.75 per cent in 2011-12, 4.91 per cent in 2022-23
    10.75 minus 4.91 = 5.84
    so cereals' share fell by 5.84 per cent
    ```
  answer: |
    The subtraction is right. The unit on the last line is wrong. A difference between two
    percentages is in percentage points.

    ```working
    10.75 minus 4.91 = 5.84 percentage points
    5.84 divided by 10.75 = 0.543
    ```

    As a per cent of the old share, the fall is about 54 per cent.

    Why the wrong answer looks reasonable: both numbers are percentages, so "per cent" feels like
    the natural unit for their difference. Said aloud, "fell by 5.84 per cent" makes a halving
    sound like a small drift.
- level: 8
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
    urban MPCE 2022-23: food 39.17 per cent, beverages, refreshments and processed food 10.64 per cent
    so beverages, refreshments and processed food are 10.64 per cent of urban food spending
    ```
  answer: |
    The base is wrong. 10.64 per cent is a share of all spending, MPCE. As a share of food
    spending, divide by food's share instead.

    ```working
    10.64 divided by 39.17 = 0.272
    ```

    About 27 per cent of urban food spending. Check it from the rupees in Statement 5: Rs 687 out
    of Rs 2,530 on food.

    ```working
    687 divided by 2,530 is about 0.272
    ```

    Why it looks reasonable: the table's column is headed "% share", and the row sits inside the
    food block. It is easy to read the share as a share of the block it sits in. Always ask "per
    cent of what".
  refs:
  - hces_2022_23_factsheet
- level: 9
  prompt: |
    A press line reads: "Rural Indians now spend nearly twice as much on beverages and processed
    food as on cereals." Decide what to compute from the 2023-24 survey, compute it, and say what
    your answer does not establish.
  answer: |
    Compute the ratio of the two shares of rural MPCE for 2023-24: 9.84 per cent and 4.99 per
    cent.

    ```working
    9.84 divided by 4.99 = 1.97
    ```

    1.97 times. The sentence is right about spending.

    It does not establish that rural Indians eat twice as much of that group, by weight or by
    energy. Cereals are cheap per kilocalorie. Free ration grain is left out of these shares. The
    group includes meals bought ready-made. And it says nothing about any one household, since
    this is an average over all rural households.
  refs:
  - pib_2097601
- level: 10
  prompt: |
    In a meeting someone says: "Rural households spend a smaller share on food than in 2011-12,
    so they are eating less." Decide what to compute, compute it, and say what your answer does
    not establish.
  answer: |
    Two things to compute: rupees on food, and energy per person.

    Rupees first. Food's share was 52.90 per cent of Rs 1,430 in 2011-12. In 2022-23 the factsheet
    gives Rs 1,750 on food.

    ```working
    1,430 times 52.90 divided by 100 = 756.5
    1,750 divided by 756.5 = 2.31
    ```

    Rupees on food were about 2.3 times their 2011-12 level, at each year's prices.

    Energy next. Report 594 gives rural intake of 2,233 kilocalories a person a day in 2011-12 and
    2,212 in 2023-24.

    ```working
    2,233 minus 2,212 = 21
    ```

    About 21 kilocalories less, about 1 per cent. The report does not say, in the pages held
    here, whether its 2011-12 figure was worked out again with the 2025 conversion table, so
    treat this comparison as approximate. The report calls the longer trend a slight
    increase. Neither number supports "eating less" for the average rural person.

    What the answer does not establish: whether any group, such as the poorest households, eats
    less. Both are averages over everyone. It does not say whether diets are better or worse,
    only that the budget changed shape while energy stayed about level.
  refs:
  - hces_2022_23_factsheet
  - nss_594_2025
retrieval_items:
- q: What is MPCE, and how is a food group's share of it worked out?
  a: Monthly per capita consumption expenditure, a household's spending in a month divided by the
    people in it. The share is the group's MPCE divided by total MPCE, times 100.
- q: What was cereals' share of rural MPCE in 2011-12 and in 2022-23?
  a: 10.75 per cent and 4.91 per cent (HCES 2022-23 factsheet, Statement 3).
- q: Which food group took the largest share of MPCE in 2023-24, and what does it include?
  a: Beverages, refreshments and processed food, 9.84 per cent rural and 11.09 per cent urban. It
    includes purchased cooked meals.
- q: What did per capita energy intake do in rural India between 2011-12 and 2023-24?
  a: Hardly moved, 2,233 to 2,212 kilocalories a day (NSS Report 594, Table 3.14).
