simplified_explanation: |
  India is often described as having a hunger problem. It also has an overweight problem.

  A programme built against one burden can feed the other. A ration or a meal designed only to
  fill a calorie gap can add to overweight where overweight is rising.
illustrations:
- body: |
    Start with the sentence you will hear in a meeting, because the table in front of you refutes
    it.

    > India's nutrition problem is undernutrition. Obesity is a rich country's problem.

    Open the NFHS-5 India fact sheet at
    https://dhsprogram.com/pubs/pdf/OF43/India_National_Fact_Sheet.pdf and find the key indicators
    81 to 89. Each row gives four numbers: NFHS-5 urban, rural and total, then the NFHS-4 total
    from 2015-16. Read it as Book 0, F1 taught: what a row is, what each column reports, in what
    unit.

    ```table
    | Group | Measure | NFHS-4, 2015-16, per cent | NFHS-5, 2019-21, per cent |
    | children under 5 | stunted | 38.4 | 35.5 |
    | children under 5 | wasted | 21.0 | 19.3 |
    | children under 5 | underweight | 35.8 | 32.1 |
    | children under 5 | overweight | 2.1 | 3.4 |
    | women 15 to 49 | BMI below 18.5 | 22.9 | 18.7 |
    | women 15 to 49 | overweight or obese, BMI 25.0 or more | 20.6 | 24.0 |
    ```

    Both burdens are there, in one survey of one country. Now read the direction. Take each change
    in percentage points, the plain difference between two percentages (Book 0, A4).

    ```working
    35.5 minus 38.4 = -2.9
    18.7 minus 22.9 = -4.2
    24.0 minus 20.6 = 3.4
    3.4 minus 2.1 = 1.3
    ```

    Stunting fell by 2.9 points and thin women by 4.2. Overweight or obese women rose by 3.4 points
    and overweight children by 1.3. By NFHS-5 the two women's rows had crossed: more women were
    overweight or obese than thin. Split by place, 33.2 per cent of urban women were overweight or obese against
    19.7 per cent of rural women.

    Now the second trap. Add the two women's rows.

    ```working
    18.7 plus 24.0 = 42.7
    ```

    That is allowed. A woman cannot have a BMI both below 18.5 and at 25.0 or more, and both rows
    exclude the same pregnant women. So 42.7 per cent of women aged 15 to 49 sat outside the band
    from 18.5 to just under 25.

    Try the same with the children's rows for stunting and underweight: 35.5 plus 32.1. Stop. A
    short child is often also light for age, so the same child can sit in both rows. The sum counts
    her twice and means nothing. Add rows only when no one can be in both.
  analogy_breaks_when: |
    The figures are national averages for 2019-21. They show the two burdens in one population.
    They cannot show whether the thin woman and the overweight woman live in the same house, or
    whether one stunted child is also overweight. For that you need the survey's unit-level data,
    cross-tabulated, which a fact sheet does not give.

    The adult rows cover ages 15 to 49 only, and join overweight and obese in one figure. They are
    not an obesity rate for Indian adults.
