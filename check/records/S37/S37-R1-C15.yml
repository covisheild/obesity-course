must_know:
- point: |
    "India's problem is hunger; obesity is for rich countries" is wrong on India's own survey. Say both in
    the same breath, every time.
  kind: misconception
  bearing: public
  refs:
  - nfhs5_india_factsheet
- point: |
    Between NFHS-4 and NFHS-5 the share of women aged 15 to 49 who were overweight or obese rose from
    20.6 to 24.0 per cent. The burden is moving, not only sitting. So a programme designed for the
    burden as it was can be wrong for the burden as it is.
  kind: consequence
  bearing: policy
  refs:
  - nfhs5_india_factsheet
- point: |
    Add prevalence rows only when nobody can sit in both. A sum of overlapping rows counts the same
    child twice.
  kind: trap
  bearing: methodological
  refs:
  - nfhs5_india_factsheet
- point: |
    A national fact sheet shows the two burdens in one population. Do not claim a household-level
    double burden from it.
  kind: boundary
  bearing: methodological
- point: |
    Never quote 24.0 per cent as "the obesity rate among Indian women". It is overweight and obesity
    together, in women of reproductive age.
  kind: trap
  bearing: public
  refs:
  - nfhs5_india_factsheet
- point: |
    Someone proposes a change to a ration, a school meal or a take-home ration. Before you back it,
    ask the WHO's first question out loud: does it raise the risk of the other burden? A change that adds energy and
    nothing else, in a population where overweight is rising, fails that check.
  kind: move
  bearing: policy
  refs:
  - who_double_duty_2017
- point: |
    The anganwadi guidelines describe their predecessor as built for "calorie sufficiency,
    neglecting quality and diversity of diets". Quote the state's own sentence when you argue
    that the schemes need retrofitting.
  kind: india_deviation
  bearing: policy
  refs:
  - poshan2_guidelines_2022
- point: |
    "Single-duty" and "working against the other burden" are this book's words for sorting a change.
    Define them when you use them in a committee, or a hostile reader will ask whose terms they are.
  kind: boundary
  bearing: teaching
exercises:
- type: critique
  prompt: |
    Three proposals reach a State nutrition committee. Sort each as double-duty, single-duty, or
    working against the other burden, using the WHO's three levels and this book's two words. Say
    what evidence would change your answer. All three proposals are made up for the exercise.

    (a) Raise the energy of the take-home ration for children aged 6 months to 3 years by adding
    more sugar, keeping protein the same.

    (b) Replace part of the rice in the school meal with a pulse and add a vegetable, keeping the
    meal's energy the same.

    (c) Add one more kilogram of rice a month to every priority household's ration.
  answer: |
    (a) Working against the other burden, on its design. It closes an energy gap by adding energy
    alone. A packet taken home is shared, so older children and adults eat some of it too. A
    quarter of women aged 15 to 49 are overweight or obese nationally. The figure for the women in
    these households is not known, and nobody should assume it is lower.

    It also fails the WHO's first
    level, do no harm, as it stands. It also breaks the Poshan 2.0 guidelines' own rule that white
    sugar should not be used. Evidence that would change the answer: the extra energy reaching only
    wasted children, with growth measured.

    (b) A candidate for double duty, as a retrofit of an existing programme. Protein and diet
    variety rise with no rise in energy, which helps on the undernutrition side and adds nothing on
    the overweight side. Evidence that would change the answer: the swap costing so much that
    portions shrink, or the vegetable not reaching the plate.

    (c) Single-duty. It acts on one burden, energy supply, and neither aims at nor checks the other.
    Whether it works against the other burden depends on who eats the extra rice. In a household
    whose members are already overweight it could; in one short of food it would not. Evidence
    that would change the answer: who in the household eats it, and what it replaces.

    In every case the sorting is of the design. Only outcomes measured on both sides settle it.
  confidence_first: false
- type: teaching
  prompt: |
    A journalist has three minutes and asks: "Is India's problem hunger or obesity?" Give one
    quotable sentence and the confidence you have in it.
  answer: |
    Quotable: "Both, in one survey. More than a third of our young children are stunted. A quarter of women
    of child-bearing age are overweight or obese."

    Then the numbers, with their source. NFHS-5, 2019-21: 35.5 per cent of children under five
    stunted, 24.0 per cent of women aged 15 to 49 overweight or obese. Stunting fell and overweight
    rose since the round before.

    Confidence, said plainly. The figures are from a very large national survey and are solid for
    the country as a whole. What the survey's summary cannot tell you is whether the two burdens
    sit in the same homes. That needs a deeper analysis than a fact sheet.

    What not to say: that obesity has replaced hunger. Both are large, and the stunting figure is
    still the larger of the two.
retrieval_items:
- q: What is the double burden of malnutrition, and at what levels can it occur?
  a: The coexistence of undernutrition (wasting, stunting, micronutrient deficiency) with
    overweight, obesity or diet-related noncommunicable diseases; in one person, one household or
    one population (WHO, 2017).
- q: Name the WHO's three levels of double-duty action.
  a: Do no harm (check existing actions do not raise the risk of other forms); retrofit (change an
    existing action to act on both); de novo (design a new action for both).
- q: What NFHS-5 figures show the double burden in India, and what can they not show?
  a: 35.5 per cent of children under five stunted and 24.0 per cent of women 15-49 overweight or
    obese (2019-21). They are population figures; they cannot show both burdens in the same
    household or person.
