- body: |
    Now use the WHO's levels, and this book's two words, on programmes you have already met.

    Open the Mission Saksham Anganwadi and Poshan 2.0 Scheme Guidelines (Ministry of Women and
    Child Development, 2022) at
    https://wcd.gov.in/documents/uploaded/Mission%20Saksham%20Anganwadi%20and%20Poshan%202.0%20scheme%20guidelines.pdf
    and search for "calorie sufficiency". The sentence is about the anganwadi services of the
    Integrated Child Development Services (ICDS), the programme Poshan 2.0 replaced.

    > The Anganwadi Services under ICDS have focused on ensuring calorie sufficiency, neglecting
    > quality and diversity of diets

    The ICDS programme, in the state's own words, was
    built to close a calorie gap. That is a single-duty design: it aimed at one burden and set no
    check on the other.

    Now open the Press Information Bureau's backgrounder of 14 April 2026 on Mission Poshan 2.0,
    at https://www.pib.gov.in/PressReleasePage.aspx?PRID=2251769&reg=3&lang=1, and search for
    "calorie-specific".

    > The old norms were largely calorie-specific; however, the revised norms are more
    > comprehensive and balanced in terms of both quantity and quality of supplementary nutrition

    Further down, the 2025 Poshan Maah, a nutrition month run through anganwadi centres among
    others, lists "reduction in sugar and oil consumption to address obesity" among its themes.
    That is an existing programme against undernutrition being asked to carry an obesity aim as
    well. It has the shape of the WHO's second level, retrofit. The backgrounder reports no effect,
    so it shows the intention, not the result.

    The third word needs a change you can test. Here is one, made up for this illustration:
    a State proposes to raise the energy of a take-home ration by adding sugar and refined oil,
    leaving its protein where it was. It would close a calorie gap faster. Among the women and
    older children who share the packet, it would add energy with nothing else. Nationally a
    quarter of women aged 15 to 49 are already overweight or obese, and about one in five even
    among rural women. Those are national figures, not figures for the women in that State's
    anganwadi households, so treat them as a warning, not a measurement. Read it as working against the other burden until
    someone shows otherwise. The WHO's first level, do no harm, is the question that catches it.
  analogy_breaks_when: |
    The sorting reads what a programme or a change is designed to do. It does not show what it
    did. A retrofit on paper can fail on the plate, and a single-duty programme can happen to help
    the other burden. Only measured outcomes on both sides settle which it was.

    Single-duty and working against the other burden are this book's reading words, not an
    official classification. The WHO brief does not use them, and no other source quoted here
    does, so do not present them as anyone else's terms.
