simplified_explanation: |
  Take a kilogram of dal at a shop. Some of what you pay went to the farmer who grew it. The
  rest was added on the way. A fee at the market yard, a commission, a lorry, a mill, a
  packet, a wholesaler and the shopkeeper each added something.

  Every one of those hands bought the dal at one price and sold it at a higher one. The gap is
  its mark-up. The mark-up is not all profit. Out of it that hand paid for its own lorry, its
  own labour, its own losses. What is left after that is its margin.

  A mark-up is often given as a percentage, and here is the trap. Six rupees added to a price
  of 65 is about 9 per cent of 65. The same six rupees is about 8 per cent of the 71 the
  shopkeeper sells at. Both are true. So whenever you see a percentage, ask what it is a
  percentage of.

  The farmer's share of the consumer rupee is the farmer's price divided by the shop price.
  If it is 75 per cent, then of every Rs 100 you pay, Rs 75 went to the farmer. The farmer
  still has to pay for seed, labour and the trip to the market out of that Rs 75.
illustrations:
- body: |
    Two sections back, a fresh food went from a farm to a household through a chain of hands.
    Now put rupees on each hand.

    Open the Reserve Bank of India (RBI) working paper *Pulses Inflation in India: A Study of
    Gram, Tur and Moong* (Working Paper 07/2024) at
    https://www.rbi.org.in/Scripts/PublicationsView.aspx?id=22722 and search for "Value Chain
    of Pulses with Mark-ups". The authors asked processors in Indore and Latur and recorded
    what happened to a kilogram between the mandi and a shop in Delhi, in May 2023. The mandi
    is the regulated wholesale market where the farmer sells. The shop price is the one the
    Department of Consumer Affairs (DoCA) records.

    Before you read a number, ask the four questions from Book 0, F1. One row is one stage of
    the chain. The Rs columns give rupees per kilogram added at that stage. The share columns
    give those rupees as a share of the final retail price. The source is a field survey. Here
    are the gram and tur columns.

    ```table
    Stage  Gram, Rs per kg  Gram share, per cent  Tur, Rs per kg  Tur share, per cent
    Farmer  53  75  72  65
    Fees  2  3  2  2
    Handling  2  3  4  4
    To mill  1  1  1  1
    Losses  2  3  2  2
    Milling  1  1  5  5
    Packaging  1  1  3  3
    To city  1  1  3  3
    Wholesaler  2  3  3  3
    Retailer  6  8  16  14
    ```

    Fees are the mandi's market fee and the commission agent's commission. To mill and To
    city are the two lorry trips, mandi to mill and mill to the wholesaler in the city. Losses
    are the dirt and stones cleaned out. The final retail price is Rs 71 a kilogram for gram
    and Rs 111 for tur.

    First, check that the rows build the price. Add the gram column from top to bottom.

    ```working
    53 plus 2 plus 2 plus 1 plus 2 plus 1 plus 1 plus 1 plus 2 plus 6 = 71
    ```

    It closes. Now the farmer's share. Divide the farm-gate price by the retail price, which
    you can write as 53 ÷ 71, and multiply by 100, written × 100.

    ```working
    53 divided by 71 times 100 = 74.6 per cent
    72 divided by 111 times 100 = 64.9 per cent
    ```

    About 75 per cent for gram and 65 per cent for tur, as the table prints. Everything after
    the farmer added Rs 18 to a kilogram of gram and Rs 39 to a kilogram of tur.

    ```working
    71 minus 53 = 18
    111 minus 72 = 39
    ```

    Now the trap. Look at the retailer's row for gram: Rs 6, printed as 8 per cent. The
    retailer bought at the price before its own step and sold at 71.

    ```working
    71 minus 6 = 65
    6 divided by 71 times 100 = 8.5 per cent
    6 divided by 65 times 100 = 9.2 per cent
    ```

    The same six rupees are 8.5 per cent of the selling price and 9.2 per cent on the buying
    price. The table uses the first base, and rounds to 8. Tur shows the gap more plainly.

    ```working
    111 minus 16 = 95
    16 divided by 111 times 100 = 14.4 per cent
    16 divided by 95 times 100 = 16.8 per cent
    ```

    A shopkeeper who says "I add about 17 per cent" and a paper that says "the retailer takes
    14 per cent" can be describing the same Rs 16.

    One more check. The tur share column adds to 102, not 100. Each share was rounded to a
    whole number on its own, and the table's note says the shares "may not add up to 100
    because of rounding off". Nothing is missing.
  analogy_breaks_when: |
    Every figure here belongs to one route, one month and one set of processors: gram from
    Indore and tur from Latur to Delhi, in May 2023. The share on another route, in another
    month, or at another shop is not this one.

    The rows are rupees added, not rupees kept. The table does not split any row into cost and
    margin. It cannot tell you whether any hand earned too much.
