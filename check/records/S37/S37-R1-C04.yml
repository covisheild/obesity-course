- body: |
    Now a fresh vegetable, and a sentence that reads like a scandal.

    Open the RBI working paper *Vegetables Inflation in India: A Study of Tomato, Onion and
    Potato* (Working Paper 08/2024) at
    https://www.rbi.org.in/Scripts/PublicationsView.aspx?id=22723 and search for "Traders’
    mark-up". The paper traces tomato from growing areas to shops in Delhi. It measures the
    farm-gate price by a wholesale price, the nearest price it could observe. Read the
    sentence, then stop.

    > Traders’ mark-up of 21.3 per cent also includes transportation cost, mandi fees,
    > commission charges, and loading/unloading charges (i.e., mark-ups include costs plus
    > margin).

    Suppose you stopped at "21.3 per cent" and told a meeting that traders keep a fifth of the
    tomato rupee. Read the next sentence.

    > As per the calculations, traders earn an average of 5.3 per cent margin.

    The mark-up held the lorry, the fees and the loading. The margin is what was left. The
    paper does not say what the 5.3 is a percentage of, so do not subtract it from the 21.3.
    Take only what it plainly says: the margin is a small part of the mark-up.

    Read the farmer's line the same way.

    > tomato farmers on an average receive 33.5 per cent of the consumer’s price in Delhi
    > (Chart 18). This, however, includes overhead costs of labour and transportation over and
    > above his cost of cultivation.

    So Rs 33.50 of every Rs 100 reached the tomato farmer, and the farmer paid for labour and
    the trip to market out of it.

    Now put the vegetables beside the pulses, and beside milk, eggs and bananas from the RBI's
    companion papers on fruits (https://www.rbi.org.in/Scripts/PublicationsView.aspx?id=22721)
    and on milk, poultry meat and eggs (https://www.rbi.org.in/Scripts/PublicationsView.aspx?id=22720).

    ```table
    Food  Farmer's share, per cent  Route or group the paper measured
    Banana  30.8  Jalgaon to Delhi
    Tomato  33.5  Growing areas to Delhi
    Onion  36.2  Several states to Delhi
    Potato  36.7  Agra to Mumbai
    Tur  65  Latur to Delhi, May 2023
    Moong  70  Bhopal to Delhi, May 2023
    Milk  70  Dairy cooperatives in Gujarat and Maharashtra
    Gram  75  Indore to Delhi, May 2023
    Eggs  75.2  Three-year averages, major centres
    ```

    The perishable foods sit at about a third. The foods that keep sit near two-thirds or
    more. The pulses paper gives its own reason: pulses "are non-perishable with relatively
    longer shelf life". The tomato paper says the retailer takes the largest margin because
    it "bears the maximum risk of perishability and wastage".

    One row is missing on purpose. For poultry meat, the paper puts the share at 56 per cent,
    but for "farmers and aggregators taken together". A broiler farmer raising birds under
    contract for a company gets "about 5-6per cent of the consumer rupee" (the paper's
    spacing). Before you quote any farmer's share, find out who the paper counted as the
    farmer.
  analogy_breaks_when: |
    Each share is one route in one period, and the periods differ from food to food. The table
    is a comparison across papers that used different months, cities and ways of getting the
    farm-gate price. It shows a pattern, perishable against storable. It does not rank any
    two neighbouring foods reliably.

    A share cannot say whether anyone is paid too much. For that you need each hand's costs,
    which only some rows of some tables give.
