    citekey: rbi_wp_2024_poultry
    quote: for poultry meat, the share of farmers and aggregators taken together is 56 per cent
  - value: 5-6
    unit: per cent of the consumer rupee, broiler farmer under contract
    citekey: rbi_wp_2024_poultry
    quote: which is about 5-6per cent of the consumer rupee in case of contract farming
- body: |
    The arithmetic above divides one price by another for the same thing, a kilogram of
    tomato at the farm and a kilogram of tomato at the shop. Once the food is processed, the
    thing changes on the way, and the division stops being honest until you fix it.

    Open the fruits paper at https://www.rbi.org.in/Scripts/PublicationsView.aspx?id=22721 and
    search for "Mark-ups in the Value Chain of Mango Processing". Totapuri mangoes from
    Chittoor are made into pulp. The farmer gets Rs 14 to 16 for a kilogram of raw mango. The
    pulp sells at Rs 30 to 35, and the row says what that price is for: "Rs. /0.5 kg of pulp".
    The paper adjusts the pulp price "using the ratio 1:0.5" so that it can be set against a
    kilogram of fruit.

    With that adjustment, the farmer's share at the two ends of the ranges is this.

    ```working
    14 divided by 30 times 100 = 46.7 per cent
    16 divided by 35 times 100 = 45.7 per cent
    ```

    The paper prints 46 to 47 per cent. Now make the mistake on purpose. Take the pulp price
    per kilogram of pulp, which is twice the half-kilogram price, and divide as before.

    ```working
    30 times 2 = 60
    14 divided by 60 times 100 = 23.3 per cent
    ```

    Half the true share, because a kilogram of pulp is not what one kilogram of fruit became.

    A packet of biscuits is this problem several times over. Flour, sugar, oil and milk
    solids each arrive by their own chain, each changes form in the factory, and the pack
    price also pays for things no row of these tables holds. The pulses paper notes in passing
    that processors "spend about Rs. 3–4 per kg for brand promotion activities", outside the
    table's rows. Splitting a packaged food's price by ingredient and actor is the work of the
    next rung of this subject.
  analogy_breaks_when: |
    The ratio is the paper's own adjustment for Totapuri pulp at Chittoor, April 2021. Another
    fruit, variety or product has its own ratio, and a product made of several ingredients has
    one for each. Without them the farmer's share of a processed food cannot be worked out.
  numbers:
  - value: '14'
    unit: Rs per kg of raw Totapuri mango at the farm gate, low end, April 2021
    citekey: rbi_wp_2024_fruits
    quote: Farmer/Farmgate price of raw mango 14 – 16
    as_of: '2021-04'
  - value: '16'
    unit: Rs per kg of raw mango at the farm gate, high end
    citekey: rbi_wp_2024_fruits
    quote: Farmer/Farmgate price of raw mango 14 – 16
    as_of: '2021-04'
  - value: '30'
    unit: Rs per 0.5 kg of mango pulp at retail, low end
    citekey: rbi_wp_2024_fruits
    quote: Retail Price (Rs. /0.5 kg of pulp) 30 – 35
  - value: '35'
