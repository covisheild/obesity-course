definition:
  text: |
    The retail price of a unit of food is the price paid for it at the shop. The farm-gate
    price is the price the farmer received at the first sale. Retail price equals the
    farm-gate price plus the sum of everything added after it.

    An actor's mark-up on a unit is its selling price minus its buying price. The mark-up pays
    for that actor's own costs of handling the unit, such as transport, fees and losses, and
    what is left after those costs is the actor's margin.

    A mark-up or a margin can be written as a percentage only against a stated base. The same
    rupees give the larger percentage on the smaller base, which is always the buying price.
