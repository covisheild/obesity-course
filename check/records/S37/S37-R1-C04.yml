must_know:
- point: |
    "Farmers get a third, so middlemen pocket two-thirds" does not follow. In the RBI's tomato
    chain, traders' mark-up was 21.3 per cent and their margin 5.3 per cent (the paper does not
    say of what). The retailer's margin is the largest, and the paper does not give it.
  kind: misconception
  bearing: public
  refs:
  - rbi_wp_2024_08_tops
- point: |
    Ask what a percentage mark-up is a percentage of. Rs 16 on tur is 16.8 per cent on cost
    and 14.4 per cent of the shop price.
  kind: trap
  bearing: methodological
  refs:
  - rbi_wp_2024_07_pulses
- point: |
    The RBI's 2024 paper puts the Delhi tomato farmer's share at 33.5 per cent, on prices for
    the three years to 2021-22. Quote the food, the route and the period with the number.
  kind: number
  bearing: policy
  refs:
  - rbi_wp_2024_08_tops
  - rbi_wp_2024_07_pulses
- point: |
    The RBI papers tie the low farmer's share of vegetables to perishability. Suppose a
    proposal raises it by cutting out a step. It then has to say who carries the spoilage,
    the storage and the display that the step was paying for.
  kind: consequence
  bearing: policy
  refs:
  - rbi_wp_2024_07_pulses
  - rbi_wp_2024_08_tops
- point: |
    Check who the paper counted as the farmer. The RBI's poultry-meat figure of 56 per cent is
    for farmers and aggregators together.
  kind: trap
  bearing: methodological
  refs:
  - rbi_wp_2024_poultry
- point: |
    The farmer's share is measured on one route in one period. Do not use the share as the
    one in your district or this season.
  kind: boundary
  bearing: methodological
  refs:
  - rbi_wp_2024_08_tops
- point: |
    Before dividing a farm price by a shop price for a processed food, turn both into the same
    thing. Mango pulp sold by the half-kilogram is set against the kilogram of fruit it came
    from.
  kind: move
  bearing: methodological
  refs:
  - rbi_wp_2024_fruits
exercises:
- type: interpretation
  prompt: |
    Here is the moong column of the same RBI pulses table, in rupees per kilogram. From the
    farmer down it reads 77, 2, 3, 1, 2, 5, 2, 1, 2 and 15. The retail price was Rs 110 in Delhi, May
    2023. The rows are the same steps as for gram and tur.

    Name the hands a kilogram of moong passed through, in order. Give the farmer's share and
    the largest addition after the farmer. Then say one thing this column cannot tell you
    about any of those hands.
  answer: |
    The hands, in order:

    - the farmer, who sold at the mandi
    - the mandi, which took a market fee, and the commission agent, who took a commission
    - labourers and packers, paid by the processor
    - a transporter to the mill
    - the mill, which bore the losses to impurities, milled and packed
    - a transporter to the wholesaler
    - the wholesaler
    - the retailer

    The farmer's share.

    ```working
    77 divided by 110 times 100 = 70.0
    ```

    About 70 per cent, as the paper states. The largest addition after the farmer is the
    retailer's Rs 15.

    ```working
    15 divided by 110 times 100 = 13.6 per cent
    ```

    About 14 per cent of the shop price.

    What the column cannot tell you: how much of the retailer's Rs 15 was cost and how much
    was margin. The paper says retailers have higher mark-ups because they "deal with smaller
    volumes and incur storage (display) costs". So the Rs 15 includes costs, but the table does
    not say how much.
  skill_ref: S37-R1-K01
- type: teaching
  prompt: |
    A journalist has three minutes and asks why tomato farmers get so little of what people
    pay. Explain the farmer's share of the consumer rupee without jargon, give one quotable
    sentence, and say plainly what the figure does not show.
  answer: |
    Answer first.

    > In the RBI's 2024 study, a tomato farmer got about Rs 33 of every Rs 100 a Delhi shopper
    > paid. Part of the rest paid for moving, handling and spoilage.

    Then the explanation. Between the field and the shop, a tomato is sold several times. Each
    buyer pays for a lorry, a market fee, a commission, loading, and the tomatoes that spoil.
    Those costs go into the price. The farmer's share is what is left for the farmer.

    Say what the figure does not show. It does not say the traders keep two-thirds as profit.
    The same paper put traders' margin at 5.3 per cent against a mark-up of 21.3. It says the
    retailer's margin is the largest, without giving it. It is one route, to Delhi, in one
    period. And the farmer's Rs 33 is before the farmer's own costs of labour and transport.

    Calibrate. The pattern, fruit and vegetables at about a third and pulses much higher, is
    solid across the RBI's papers. The exact figure for any one town this month is not
    known.
quantitative: true
practice:
- level: 1
  prompt: |
    A seller buys a unit at 40 and sells it at 50. Give the mark-up in rupees, then as a
    percentage of the buying price, then as a percentage of the selling price.
  answer: |
    The mark-up is the selling price minus the buying price.

    ```working
    50 minus 40 = 10
    ```

    On the buying price.

    ```working
    10 divided by 40 times 100 = 25
    ```

    As a share of the selling price.

    ```working
    10 divided by 50 times 100 = 20
    ```

    Ten rupees, 25 per cent on cost, 20 per cent of the selling price. The percentage on the
    buying price is the larger, because 40 is the smaller base.
- level: 2
  prompt: |
    A farm-gate price is 18 and the retail price of the same unit is 60. Give the farmer's
    share as a percentage, and the amount added after the farm gate.
  answer: |
    Farmer's share is farm-gate price divided by retail price, times 100.

    ```working
    18 divided by 60 times 100 = 30
    ```

    Everything added after the farm gate is the difference.

    ```working
    60 minus 18 = 42
    ```

    A share of 30 per cent, and 42 added.
- level: 3
  prompt: |
    (a) The farmer's share is 40 per cent and the retail price is 75. What was the farm-gate
    price?

    (b) The farm-gate price is 24 and the farmer's share is 30 per cent. What is the retail
    price?
  answer: |
    (a) Forty per cent of the retail price reached the farmer.

    ```working
    40 divided by 100 times 75 = 30
    ```

    A farm-gate price of 30.

    (b) Now the retail price is the unknown. The farm-gate price is 30 per cent of it, so
    divide the farm-gate price by 30 and multiply by 100.

    ```working
    24 divided by 30 times 100 = 80
    ```

    Check it forwards: 24 divided by 80 times 100 = 30. A retail price of 80.
- level: 3
  prompt: |
    A unit leaves the farm at 20. Three later steps add 5, 3 and 12. Give the retail price,
    then each of the four amounts as a share of the retail price.
  answer: |
    Build the price first.

    ```working
    20 plus 5 plus 3 plus 12 = 40
    ```

    Then each amount as a share of 40.

    ```working
    20 divided by 40 times 100 = 50
    5 divided by 40 times 100 = 12.5
    3 divided by 40 times 100 = 7.5
    12 divided by 40 times 100 = 30
    ```

    The shares add to 100, as they must when nothing is rounded.

    ```working
    50 plus 12.5 plus 7.5 plus 30 = 100
    ```
- level: 4
  prompt: |
    In the RBI milk, poultry meat and eggs paper, the farm-gate price of eggs in the Delhi
    region was Rs 381 for 100 eggs in April 2021. The retail price was Rs 552 for 100 eggs. Give the farmer's
    share of the consumer rupee and the rupees added after the farm. Keep the unit on the
    second answer.
  answer: |
    The farmer's share.

    ```working
    381 divided by 552 times 100 = 69.0 per cent
    ```

    About 69 per cent, which is what the paper prints.

    What was added after the farm.

    ```working
    552 minus 381 = 171
    ```

    Rs 171 per 100 eggs, in the Delhi region, in April 2021.
  refs:
  - rbi_wp_2024_poultry
- level: 5
  prompt: |
    In the RBI pulses table, gram sold at retail in Delhi for Rs 71 a kilogram in May 2023.
    The retailer added Rs 6. Before the retailer, the wholesaler added Rs 2. Give the
    wholesaler's buying price, its mark-up as a percentage on that buying price, and its
    mark-up as a share of the retail price. Say which of the two the table prints.
  answer: |
    The wholesaler sold to the retailer, who then added Rs 6. So the wholesaler sold at the
    retail price less Rs 6, and bought at that less its own Rs 2.

    ```working
    71 minus 6 = 65
    65 minus 2 = 63
    ```

    Rs 63 per kilogram. Now the two percentages.

    ```working
    2 divided by 63 times 100 = 3.2 per cent
    2 divided by 71 times 100 = 2.8 per cent
    ```

    3.2 per cent on the buying price, 2.8 per cent of the retail price. The table prints 3,
    because every share column in it is against the final retail price.
  refs:
  - rbi_wp_2024_07_pulses
- level: 5
  prompt: |
    The RBI tomato paper puts the tomato farmer's share at 33.5 per cent of the consumer's
    price in Delhi. Take Rs 100 spent on tomatoes by a Delhi shopper. How many rupees reached
    the farmer? How many went to every later step together? Then say what the
    farmer paid out of their part.
  answer: |
    A share of 33.5 per cent means 33.5 rupees out of every 100, so the farmer's part is Rs
    33.50. Everything after the farmer got the rest.

    ```working
    100 minus 33.5 = 66.5
    ```

    Rs 66.50 to all later steps together.

    The paper says the farmer's share "includes overhead costs of labour and transportation
    over and above his cost of cultivation". So the Rs 33.50 has to pay for growing the crop,
    for labour, and for taking it to market.
  refs:
  - rbi_wp_2024_08_tops
- level: 6
  prompt: |
    In the RBI fruits paper, mango sold fresh in April 2021 fetched the farmer Rs 62 to 67 a
    kilogram. It sold at retail for Rs 149 to 155 a kilogram. The paper prints the farmer's
    share as 42 to 43 per cent. Check that figure. Then give the widest range of shares the
    two price ranges allow.
  answer: |
    Pair the low farm price with the low retail price, and the high with the high.

    ```working
    62 divided by 149 times 100 = 41.6 per cent
    67 divided by 155 times 100 = 43.2 per cent
    ```

    About 42 to 43 per cent, as the paper prints. Now cross the pairs.

    ```working
    62 divided by 155 times 100 = 40.0 per cent
    67 divided by 149 times 100 = 45.0 per cent
    ```

    The ranges allow anything from 40 to 45 per cent. The paper's 42 to 43 matches the paired
    division. The table does not say the two prices moved together.
  refs:
  - rbi_wp_2024_fruits
- level: 6
  prompt: |
    The RBI milk paper looks at a leading Maharashtra cooperative in December 2022. Its rupees
    per litre are these.

    ```table
    Part of the price  Rs per litre
    Payment to farmers  35
    Procurement cost  3
    Processing  2
    Packaging  1
    Transport  2
    Cooperative's mark-up  1
    Distributors' commission  1.5
    Retailer's mark-up  3.5
    Retail price  49
    ```

    Check that the parts build the price. Give the farmer's share. Give the retailer's
    mark-up on its buying price.
  answer: |
    Add the parts.

    ```working
    35 plus 3 plus 2 plus 1 plus 2 plus 1 plus 1.5 plus 3.5 = 49
    ```

    It closes at Rs 49 a litre. The farmer's share.

    ```working
    35 divided by 49 times 100 = 71.4 per cent
    ```

    About 71 per cent, which the paper prints as 71.

    The retailer bought at the retail price less its mark-up, then marked up on that.

    ```working
    49 minus 3.5 = 45.5
    3.5 divided by 45.5 times 100 = 7.7 per cent
    ```

    7.7 per cent on the retailer's buying price, per litre of milk from this one cooperative.
  refs:
  - rbi_wp_2024_poultry
- level: 7
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
    the gram retailer's mark-up is 8 per cent, from the RBI table
    so the retailer added 8 per cent to what it paid
    buying price = 71 divided by 1.08 = 65.74
    ```
  answer: |
    The second line broke. The table's 8 per cent is a share of the retail price, Rs 6 out of
    Rs 71. It is not a percentage added on the buying price. Dividing by 1.08 treats it as one.

    The buying price comes straight from the rupees.

    ```working
    71 minus 6 = 65
    6 divided by 65 times 100 = 9.2 per cent
    ```

    The retailer bought at Rs 65 and added 9.2 per cent on that.

    Why the wrong answer looks reasonable: 65.74 is close to 65. At small percentages the two
    bases give nearly the same answer, so the slip hides. Try the same move on tur. The
    retailer's share there is 14 per cent, and 111 divided by 1.14 gives about 97.4. The true
    buying price is 95. The larger the mark-up, the larger the error.
- level: 8
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
    farmers get 33.5 per cent of the tomato rupee
    farmers get 65 per cent of the tur rupee
    a household spends Rs 100 on each
    so farmers get 33.5 plus 65 = 98.5 per cent of its spending
    ```
  answer: |
    The last line added two percentages of two different wholes. Each Rs 100 is a separate
    whole. Add the rupees, then divide by all the rupees spent.

    ```working
    33.5 plus 65 = 98.5
    100 plus 100 = 200
    98.5 divided by 200 times 100 = 49.25
    ```

    Rs 98.50 of the Rs 200 reached farmers: about 49 per cent, not 98.5.

    Why the wrong answer looks reasonable: the rupee amount, Rs 98.50, is right, and the
    arithmetic in the line is right. Only the per cent sign is wrong. A percentage cannot be
    added to a percentage of a different whole. There is a second problem. The two shares are
    from two papers, two routes and two periods. Even the corrected 49 per cent describes no
    real household.
- level: 9
  prompt: |
    A speaker at a district meeting says:

    > Tomato farmers get only a third of what we pay. The middlemen pocket the other
    > two-thirds.

    Decide what to compute, compute it, and say what your answer does not establish.
  answer: |
    What to compute: the part of the consumer rupee that did not reach the farmer, from the
    RBI tomato paper's 33.5 per cent.

    ```working
    100 minus 33.5 = 66.5
    ```

    Rs 66.50 of every Rs 100 went to steps after the farmer. The first sentence holds for the
    route the paper studied.

    What it does not establish. It does not establish that Rs 66.50 was pocketed. Those rupees
    are mark-ups, and the paper says "mark-ups include costs plus margin": transport, mandi
    fees, commission, loading and the tomatoes that rot. For traders, a mark-up of 21.3 per
    cent held a margin of 5.3 per cent. The paper does not state the base of the 5.3, but read
    beside the 21.3 it is a small part of it. The paper says the retailer's margin is the
    largest, without giving it. The figure is also for Delhi, and not for this district. And
    the farmer's own Rs 33.50 is before the farmer's labour and transport.

    Say it in the meeting as: "Farmers get about a third. Part of the rest pays for moving,
    handling and spoilage. We would need each step's costs to say who earns too much."
  refs:
  - rbi_wp_2024_08_tops
- level: 10
  prompt: |
    A proposal reads:

    > Let tur farmers sell straight to consumers and the price of dal will fall by a third.

    Decide what to compute, compute it, and say what your answer does not establish.
  answer: |
    What to compute: how much of the tur retail price each group of steps adds, from the RBI
    table (Delhi, May 2023, Rs per kg). Start with the claim's own version, every step after
    the farmer removed.

    ```working
    111 minus 72 = 39
    39 divided by 111 times 100 = 35.1 per cent
    ```

    A fall of about 35 per cent, roughly the third the proposal claims. But that price is only
    reached if nobody mills, packs or moves the tur. The farmer sells whole tur at the mandi;
    dal has to be milled. Keep the processing, packaging, transport and losses. Remove the
    mandi's fee and commission, which a farmer selling straight skips, and the wholesaler's and
    the retailer's mark-ups.

    ```working
    2 plus 3 plus 16 = 21
    111 minus 21 = 90
    21 divided by 111 times 100 = 18.9 per cent
    ```

    About 19 per cent, a little more if part of the Rs 4 handling row was mandi work, which the
    table does not split. Even that assumes nobody is paid for the retailer's work of
    selling in small amounts and holding stock on display.

    What it does not establish. Whether the fall would reach the consumer rather than the new
    seller. Whether the farmer would get more, since someone must still carry the costs the
    removed steps paid. And whether any of it holds for another pulse, another city or
    another month. The table gives the size of the prize. It does not say anyone can collect
    it.
  refs:
  - rbi_wp_2024_07_pulses
retrieval_items:
- q: What is the difference between a mark-up and a margin?
  a: A mark-up is selling price minus buying price. It pays for the actor's own costs, such as
    transport, fees and losses, and what is left after them is the margin.
- q: What is the farmer's share of the consumer rupee, and why is it called gross?
  a: The farm-gate price divided by the retail price, times 100. It is gross because the
    farmer's own costs of growing and taking the crop to market come out of it.
- q: About what share did the RBI's 2024 papers find for tomato, onion and potato, and for gram?
  a: About a third for the three vegetables (33.5, 36.2 and 36.7 per cent), and about 75 per
    cent for gram. Each is one route in one period.
