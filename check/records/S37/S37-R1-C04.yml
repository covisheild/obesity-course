    citekey: rbi_wp_2024_fruits
    quote: Retail Price (Rs. /0.5 kg of pulp) 30 – 35
  - value: '0.5'
    unit: the ratio the paper applies to set pulp against fruit, 1:0.5
    citekey: rbi_wp_2024_fruits
