must_know:
- point: |
    "Indian food policy ignored nutrition" is the wrong charge. It was built against a grain
    shortage and keeps score in tonnes of grain. By that measure it has ended the shortage it was
    built for.
  kind: misconception
  bearing: policy
  refs:
  - dfpd_pds
  - econ_survey_tab_1_19
- point: |
    Before you ask an institution to do nutrition work, read what the state says it is for. A
    plan for it to buy vegetables or oils changes its job. Argue it as a change, not as a small
    fix.
  kind: consequence
  bearing: policy
  refs:
  - dfpd_pds
- point: |
    In 2022-23 India's net imports of cereals were minus 30,352 thousand tonnes, a net export of
    about 30 million tonnes (Economic Survey 2025-26, Table 1.19).
  kind: number
  bearing: public
  refs:
  - econ_survey_tab_1_19
- point: |
    The nutrition standards in Schedule II of the National Food Security Act are floors, "required
    to be met".
  kind: trap
  bearing: policy
  refs:
  - nfsa_2013
- point: |
    The PDS was never meant to be a whole diet. The Department calls it "supplemental in nature".
    Do not judge the ration as if it had to supply everything a family eats.
  kind: india_deviation
  bearing: policy
  refs:
  - dfpd_pds
- point: |
    The departmental histories give the state's own reasons, in its own words. Do not quote an
    annual report as proof of what happened in 1965.
  kind: boundary
  bearing: methodological
  refs:
  - dfpd_pds
- point: |
    Grams of foodgrain available a day per person is not grams eaten. Do not set it beside a
    requirement as if it were intake.
  kind: trap
  bearing: methodological
  refs:
  - econ_survey_tab_1_19
exercises:
- type: teaching
  prompt: |
    Write one page for a health secretary, answer first. The question is: "Why does the ration
    give rice and wheat, and nothing that would help with obesity?"
  answer: |
    Answer first. The ration gives rice and wheat because the system behind it was built to end a
    shortage of grain, and it did.

    The evidence is the state's own. The Food Corporation of India was set up in 1965 "as the
    country was facing major shortage of foodgrains, especially wheat". The Department still
    describes it as the main instrument for buying and distributing wheat, rice and coarse grains
    and for the buffer stock. The PDS began in the 1960s to manage grain scarcity.

    The system keeps score in tonnes of grain, and by that count the shortage is over. In 2022-23
    India exported about 30 million tonnes more cereal than it imported.

    The law sets calorie and protein floors for meals and no ceilings. So nothing in the
    machinery asks about excess. Changing the basket is possible. It means changing what the
    Corporation buys and what the Act's schedules count, and that is a decision, not a correction.
- type: critique
  prompt: |
    A draft article says: "The fact that India now exports cereals proves its people are well
    fed." Find the flaw, using only what this section has shown you.
  answer: |
    Net exports of cereals show that the country produces more cereal than it uses at home, in
    tonnes. They say nothing about who eats it.

    Availability is not intake. The Economic Survey's table says its per person figure is "not
    strictly representative of actual level of consumption". And cereals are one food. The same
    table shows pulses were still a net import.

    The claim measures a national store of grain and reads it as people's diets. It also treats
    energy from cereal as the whole of being well fed. That is exactly the measure this section
    says the system was built on.
- type: retrieval
  prompt: |
    The Department of Food and Public Distribution's Annual Report 2025-26 gives the Food
    Corporation of India three jobs. Name them, and the grains they apply to. Then give the year
    the Department's history gives for the Corporation's setting-up.
  answer: |
    Procurement, distribution, and maintaining the buffer stock. The grains are wheat, rice and
    coarse grains. The Department's history gives 1965, under an Act of 1964.
retrieval_items:
- q: What reason does the Department of Food and Public Distribution give for setting up the Food Corporation of India in 1965?
  a: The country was facing a major shortage of foodgrains, especially wheat.
- q: How does the Department of Food and Public Distribution describe the Food Corporation of India's job today?
  a: As the Government's main instrument for procurement and distribution of wheat, rice and
    coarse grains, and for maintaining the buffer stock of foodgrains (Annual Report 2025-26,
    3.64).
- q: What were India's net imports of cereals in 2022-23?
  a: Minus 30,352 thousand tonnes, a net export (Economic Survey 2025-26, Table 1.19).
- q: Are the nutritional standards in Schedule II of the NFSA floors or ceilings?
  a: Floors. They are standards "required to be met"; the Schedule sets no maximum.
