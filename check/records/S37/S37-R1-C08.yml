definition:
  text: |
    India's central food institutions were set up in answer to shortages of grain. The
    Department of Food and Public Distribution (DFPD) says so in its own account. The Food Corporation of
    India (FCI) was set up in 1965, under an Act of 1964, because the country faced a major
    shortage of foodgrains, especially wheat.

    The Department describes the FCI's job today in terms of grain. Its Annual Report 2025-26
    calls the FCI the main instrument of the Government of India for procurement and distribution
    of wheat, rice and coarse grains, and for maintaining the buffer stock of foodgrains.

    The national scoreboard is also a quantity. The Economic Survey 2025-26's Table 1.19 gives net
    imports of cereals for 2022-23 of minus 30,352 thousand tonnes: India exported more cereal than it
    imported.

    The nutrition standards that the National Food Security Act, 2013 attaches to its meals are
    floors. No instrument quoted here sets an upper limit on energy, sugar, fat or salt.
