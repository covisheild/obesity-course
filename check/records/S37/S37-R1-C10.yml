simplified_explanation: |
  The government changes food prices in three ways that you can work out with a calculator.

  First, it sets a minimum support price (MSP) for a crop. That is the price at which its agencies
  stand ready to buy. The Union government says each MSP is at least one and a half times the cost
  of growing the crop. That extra half is the margin. It is a percentage of the cost, not of the
  price, and that choice of base changes the number a great deal.

  Second, it sells grain to ration-card holders for less than the grain cost it. The gap between
  the two is the subsidy. The full cost of buying, storing and moving the grain is called the
  economic cost. Since 1 January 2023 the grain under the National Food Security Act (NFSA) has
  been free, so the subsidy is now the whole economic cost.

  Third, it charges a duty on imports, as a percentage of their value. The price at the port after
  duty is called the landed price. It is the price before duty, made bigger by the duty's share.

  Each rule is one line of arithmetic. The hard part is the base. Always ask: a percentage of what?
illustrations:
- body: |
    Start with the mistake, because it is the one a newspaper reader makes.

    Search for the Cabinet's release of 13 May 2026, "Cabinet approves Minimum Support Prices (MSP)
    for Kharif Crops for Marketing Season 2026-27", on the Press Information Bureau website, and
    open it. Kharif crops are the ones sown with the monsoon. Find the row for common paddy. It
    gives an MSP of Rs 2441 per quintal, a cost of Rs 1627 per quintal, and a margin over cost of
    50 per cent. A quintal is 100 kg.

    Work out the margin the way most people first do. Take the gap and divide it by the price.

    ```working
    2441 minus 1627 = 814
    814 divided by 2441 = 0.3334698894
    0.3334698894 times 100 = 33.34698894
    ```

    About 33 per cent. The release says 50. Your arithmetic is right, and your answer is wrong.

    Read the column head again. It says "Margin over cost". The base is the cost, not the price.

    ```working
    814 divided by 1627 = 0.500307314
    0.500307314 times 100 = 50.0307314
    ```

    Fifty per cent, as printed. The gap is the same Rs 814 in both sums. It is a third of the
    price and a half of the cost. Book 0, A4, taught you to ask of every percentage: per cent of
    what?

    Now check the rule the release names, "at least 1.5 times" the cost. In words: the price is
    the cost times one and a half.

    ```working
    1627 times 1.5 = 2440.5
    ```

    Round to the rupee and you have the Rs 2441 in the table. "One and a half times cost" and "50
    per cent over cost" are one statement, written two ways.
  analogy_breaks_when: |
    The cost in the release is one number for the whole country, a weighted average. It counts
    the value of the family's own labour at a rate someone set. A farmer whose own costs run above
    that average earns less than 50 per cent over them. A farmer who sells below the MSP, because
    no agency bought the crop, earns less again. The margin describes the announced price and the
    average cost, and nothing about any one farmer.
