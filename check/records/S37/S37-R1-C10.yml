- body: |
    The third wedge is at the port. Search for the release of 24 September 2026, "Government Cuts
    Import Duty on Major Edible Oils to Provide Relief to Consumers", on the Press Information
    Bureau website. It says the basic customs duty on crude sunflower oil went from 10 per cent to
    nil. On crude soybean oil and crude palm oil it went from 10 per cent to 5 per cent.

    The release gives no world price for the oil, so use a made-up one. Say a kilogram of crude
    palm oil costs Rs 100 at the port before duty. The rule, in words: the landed price is the
    price before duty, times one plus the duty written as a decimal. Ten per cent is 0.10.

    ```working
    100 times (1 plus 0.10) = 110
    100 times (1 plus 0.05) = 105
    110 minus 105 = 5
    5 divided by 110 = 0.0454545455
    ```

    Here is the trap. The duty was halved, from 10 to 5 per cent. The landed price did not halve.
    It fell by Rs 5 on Rs 110, which is about 4.5 per cent. The duty fell by 5 percentage points
    (Book 0, A4); the price fell by 4.5 per cent. Those are different numbers.

    For sunflower oil the duty went to nil.

    ```working
    100 times (1 plus 0) = 100
    110 minus 100 = 10
    10 divided by 110 = 0.0909090909
    ```

    About 9 per cent off the landed price, at this made-up world price.

    Each duty pushes the landed price up by its own share of the price before duty. Each cut pulls
    it down by the same share. Whether a shopper's bottle of oil gets cheaper is a separate
    question. The release itself asks industry "to ensure that the full benefit" is passed on,
    which tells you it does not happen by itself.
  analogy_breaks_when: |
    The Rs 100 is made up; only the duty rates are real. The rule holds for any price before duty,
    so the percentages hold too. But the duty here is the basic customs duty alone. A December 2025
    government backgrounder on edible oils uses a second term. It says the "effective customs duty"
    on crude oils was raised from 5.5 to 16.5 per cent, and it does not say which basic duty went
    with that. The September 2026 release gives no effective duty at all. So the landed price above
    leaves out whatever else is charged at the border, and nothing held says how much that is.
  numbers:
  - value: '10'
    unit: per cent, basic customs duty on crude sunflower, soybean and palm oil before 24 September 2026
    citekey: s37_edible_oil_duty
    quote: "the BCD on Crude Sunflower Oil has been reduced from 10% to Nil, while the BCD on Crude Soybean Oil and Crude Palm Oil has been reduced from 10% to 5%."
    as_of: '2026-09-24'
  - value: '5'
    unit: per cent, basic customs duty on crude soybean and palm oil from the release of 24 September 2026
    citekey: s37_edible_oil_duty
    quote: "the BCD on Crude Sunflower Oil has been reduced from 10% to Nil, while the BCD on Crude Soybean Oil and Crude Palm Oil has been reduced from 10% to 5%."
    as_of: '2026-09-24'
  - value: '16.5'
    unit: per cent, "effective customs duty" on crude edible oils, as the December 2025 backgrounder words it
    citekey: pib_2200287
    quote: "the government raised the effective customs duty on crude edible oils like palm, sunflower and soybean from 5.5% to 16.5%."
    as_of: '2025-12-08'
  - value: '10'
    unit: per cent, basic customs duty on crude sunflower, soybean and palm oil set in June 2025
    citekey: s37_edible_oil_duty
    quote: "Centre has reduced the Basic Customs Duty (BCD) on crude edible oils namely crude sunflower, soybean, and palm oils has been reduced from 20% to 10%"
    as_of: '2025-06-11'
must_know:
- point: |
    "MSP gives a 50 per cent margin" is true only over cost. The same gap is a third of the price.
    When anyone quotes an MSP margin at you, ask for the base, and quote the base yourself.
  kind: misconception
  bearing: public
  refs:
  - pib_2260617
- point: |
    The economic cost of rice for 2025-26 is Rs 4173.34 a quintal, the Food Ministry's budget
    estimate in its December 2025 bulletin. That is about Rs 41.73 a kg. With the issue price at
    zero since 1 January 2023, all of it is subsidy.
  kind: number
  bearing: policy
  refs:
  - s37_economic_cost_grain
- point: |
    With free grain, a higher MSP does not change what the ration-card holder pays. It raises the
    economic cost, and so the subsidy. Say this when someone argues that MSP makes ration grain
    dearer.
  kind: consequence
  bearing: policy
  refs:
  - s37_economic_cost_grain
- point: |
    A duty cut from 10 to 5 per cent is a fall of 5 percentage points in the duty. It is not a 50
    per cent fall in anything a shopper pays. Work out the landed price before and after, and
    quote the change in that.
  kind: trap
  bearing: public
  refs:
  - s37_edible_oil_duty
- point: |
    Government releases on edible oil use two terms, "basic customs duty" and "effective customs
    duty", and they are not the same charge. Before you compute a landed price from a duty figure,
    find which one it is, and say it.
  kind: india_deviation
  bearing: policy
  refs:
  - s37_edible_oil_duty
  - pib_2200287
- point: |
    A paddy MSP and a rice economic cost are prices of different goods. Paddy is milled before it
    becomes rice. Never subtract one from the other, however neat the answer looks.
  kind: trap
  bearing: methodological
- point: |
    These rules stop at the edge of the government's books: the border, the procurement centre,
    the ration shop. They cannot tell you the price in an ordinary shop. The margins along the
    chain, from the section on the price build-up, sit between the wedge and the plate. For that
    you need a measured retail price.
  kind: boundary
  bearing: methodological
- point: |
    An MSP margin is over an all-India average cost. It says nothing about one farmer's margin,
    or about a farmer who never sold to a procurement agency. Do not carry it to a district or a
    household without saying so.
  kind: boundary
  bearing: policy
  refs:
  - pib_2260617
exercises:
- type: critique
  prompt: |
    A draft policy note says this.

    > Raising the MSP for paddy pushes up the price that poor households pay for rice at the
    > ration shop.

    Say what is wrong with it today, and write the sentence you would put in its place.
  answer: |
    Since 1 January 2023, grain under the National Food Security Act has been free. The issue
    price is zero, so a household with a ration card pays nothing, whatever the MSP.

    What an MSP rise does move is the economic cost. The pooled cost of grain at MSP is most of it:
    Rs 3375.29 of Rs 4173.34 a quintal of rice in the 2025-26 budget estimate. With the issue price
    at zero, the whole of any rise in economic cost becomes subsidy.

    The replacement sentence:

    > A higher paddy MSP raises what rice costs the government, and so the food subsidy. While
    > ration grain stays free, ration-card holders pay nothing either way.

    The sentence you replace was once closer to true. When the issue price was Rs 300 a quintal it
    was fixed, so it did not follow the MSP either. It could be changed only by a new decision.
- type: teaching
  prompt: |
    A health secretary asks for one page, answer first. What does a kilogram of free ration rice
    cost the Union government? Where does that money go? Write it, with the cost.
  answer: |
    Answer first. A kilogram of rice issued free under the National Food Security Act costs the
    Union government about Rs 41.73. That is the economic cost of Rs 4173.34 a quintal for 2025-26,
    the budget estimate in the Food Ministry's December 2025 bulletin. The household pays nothing,
    so the subsidy is all of it.

    Where it goes. About Rs 33.75 a kg is the price paid for the grain, the pooled cost at the
    minimum support price (Rs 3375.29 a quintal). About Rs 7.98 a kg is buying, storing and moving
    it (Rs 798.05 a quintal).

    What follows for the secretary. The subsidy moves with the MSP, because the grain price is
    about four-fifths of the cost. Decisions on MSP are food-subsidy decisions too.

    What the page does not say. It gives the government's cost, not the value to the family, and
    a budget estimate, not an audited figure. Each paisa figure is rounded from rupees a quintal.
quantitative: true
practice:
- level: 1
  prompt: |
    A price is 150 and a cost is 100. What is the margin over cost, as a percentage of the cost?

    A second cost of 80 is to be raised to one and a half times itself. What is the new price, and
    what is its margin over cost?
  answer: |
    Margin over cost: the gap, divided by the cost, times 100.

    ```working
    150 minus 100 = 50
    50 divided by 100 = 0.5
    0.5 times 100 = 50
    ```

    Fifty per cent.

    One and a half times the cost:

    ```working
    80 times 1.5 = 120
    120 minus 80 = 40
    40 divided by 80 = 0.5
    ```

    A price of 120, and again 50 per cent over cost. One and a half times cost is always 50 per
    cent over cost, whatever the cost.
- level: 2
  prompt: |
    A good costs 60 a unit to supply. The buyer pays 15. Find the subsidy per unit, and the
    subsidy as a percentage of the full cost.

    Now the buyer pays nothing. Find the same two numbers.
  answer: |
    Subsidy is full cost minus what the buyer pays.

    ```working
    60 minus 15 = 45
    45 divided by 60 = 0.75
    0.75 times 100 = 75
    ```

    A subsidy of 45 a unit, 75 per cent of the cost.

    When the buyer pays nothing:

    ```working
    60 minus 0 = 60
    60 divided by 60 = 1
    1 times 100 = 100
    ```

    A subsidy of 60 a unit, 100 per cent of the cost. At a zero price the subsidy is the cost.
- level: 2
  prompt: |
    A good costs 200 before duty. Find its price after a duty of 12.5 per cent, and after a duty
    of nothing at all.
  answer: |
    Write the duty as a decimal: 12.5 per cent is 0.125. Then multiply by one plus it.

    ```working
    200 times (1 plus 0.125) = 225
    200 times (1 plus 0) = 200
    ```

    225, and 200. The duty added 25, which is 12.5 per cent of 200: the duty is charged on the
    price before duty, not on the landed price.
- level: 3
  prompt: |
    Go the other way twice.

    A landed price of 230 includes a duty of 15 per cent. What was the price before duty?

    A price of 3000 was set at one and a half times cost. What was the cost?
  answer: |
    Each price was made by multiplying, so undo it by dividing by the same number.

    ```working
    1 plus 0.15 = 1.15
    230 divided by 1.15 = 200
    ```

    The price before duty was 200. Check: 200 times 1.15 gives 230.

    ```working
    3000 divided by 1.5 = 2000
    ```

    The cost was 2000.

    The slip to avoid is taking 15 per cent of 230 and subtracting it. That gives 195.5, because
    15 per cent of 230 is bigger than 15 per cent of 200. The duty was charged on 200, so 200 is
    the base.
- level: 4
  prompt: |
    The Cabinet's release of 13 May 2026 covers kharif marketing season 2026-27. For moong it gives
    an MSP of Rs 8780 a quintal and a cost of Rs 5438 a quintal. Work out the margin over cost.
    Compare your answer with the margin the release prints.
  answer: |
    ```working
    8780 minus 5438 = 3342
    3342 divided by 5438 = 0.614564178
    0.614564178 times 100 = 61.4564178
    ```

    The gap is Rs 3342 a quintal. The margin over cost is about 61.5 per cent. The release prints
    61, rounded to a whole number. It names moong as the kharif crop with the highest margin.

    The unit matters on the first line only. Rupees a quintal divided by rupees a quintal has no
    unit, so the margin is a pure percentage.
  refs:
  - pib_2260617
- level: 5
  prompt: |
    Rabi crops are the ones sown after the monsoon, in winter. The Cabinet's release of 1 October
    2025 covers rabi marketing season 2026-27. For wheat it gives an MSP of Rs 2585 a quintal and a
    cost of Rs 1239 a quintal. Work out the margin over cost. Then work out the gap as a percentage
    of the MSP. Say which one the release prints.
  answer: |
    ```working
    2585 minus 1239 = 1346
    1346 divided by 1239 = 1.086359968
    1.086359968 times 100 = 108.6359968
    1346 divided by 2585 = 0.520696325
    0.520696325 times 100 = 52.0696325
    ```

    Over cost, about 109 per cent. As a share of the MSP, about 52 per cent.

    The release prints 109, in its "Margin over cost" column. Wheat's MSP is more than twice its
    stated cost. That is well above the rule's floor of one and a half times.

    A percentage over cost can run past 100. A share of the price cannot, because the gap is
    always smaller than the price.
  refs:
  - pib_rabi_msp
- level: 5
  prompt: |
    The Food Ministry's December 2025 bulletin gives the economic cost of wheat for 2025-26 as Rs
    2980.06 a quintal. That is a budget estimate. The issue price to households under the National
    Food Security Act is zero. A person in a priority household gets 5 kg of grain a month. If all
    5 kg were wheat, what would a month's grain cost the government for that person?
  answer: |
    First to rupees a kilogram. A quintal is 100 kg.

    ```working
    2980.06 divided by 100 = 29.8006
    29.8006 minus 0 = 29.8006
    ```

    The subsidy is about Rs 29.80 a kg, all of the economic cost.

    Then the month's 5 kg.

    ```working
    29.8006 times 5 = 149.003
    ```

    About Rs 149 a person a month, at the 2025-26 budget-estimate cost.

    The "if all 5 kg were wheat" matters. A State may issue rice, wheat or coarse grains, and rice
    costs more. Keep the grain named on the answer.
  refs:
  - s37_economic_cost_grain
  - nfsa_2013
- level: 6
  prompt: |
    The same bulletin has a second category, which it calls "tide over", for rice issued at Rs
    830 a quintal. The economic cost of rice for 2025-26, budget estimate, is Rs 4173.34 a
    quintal. Find the subsidy per quintal and per kilogram, and the subsidy as a percentage of the
    economic cost. Check your percentage against the bulletin's 80.1.
  answer: |
    ```working
    4173.34 minus 830 = 3343.34
    3343.34 divided by 100 = 33.4334
    3343.34 divided by 4173.34 = 0.8011
    0.8011 times 100 = 80.11
    ```

    Rs 3343.34 a quintal, about Rs 33.43 a kg, and about 80.1 per cent of the economic cost, as the
    bulletin prints.

    The same grain carries two subsidies, 100 per cent and 80.1 per cent, because it goes out at
    two issue prices. A subsidy figure means nothing until you know which issue price it was
    worked from.
  refs:
  - s37_economic_cost_grain
- level: 6
  prompt: |
    Suppose, as a made-up figure, that crude palm oil costs Rs 90 a kilogram at the port before
    duty. The basic customs duty on it fell from 10 per cent to 5 per cent on 24 September 2026.
    Work out the landed price before and after, the fall in rupees, and the fall as a percentage of
    the old landed price.
  answer: |
    ```working
    90 times (1 plus 0.10) = 99
    90 times (1 plus 0.05) = 94.5
    99 minus 94.5 = 4.5
    4.5 divided by 99 = 0.0455
    0.0455 times 100 = 4.55
    ```

    Rs 99 a kg before, Rs 94.50 after. A fall of Rs 4.50, about 4.5 per cent of the old landed
    price.

    Compare the illustration's made-up Rs 100: the fall was also about 4.5 per cent. The percentage
    does not depend on the world price, only on the two duty rates. That is 0.05 divided by 1.10.
    The rupee fall does depend on the world price. The duty rates are real; the Rs 90 is not.
  refs:
  - s37_edible_oil_duty
- level: 7
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
    bajra MSP, kharif 2026-27: Rs 2900 a quintal
    cost: Rs 1858 a quintal
    2900 minus 1858 = 1042
    1042 divided by 2900 = 0.359
    so the margin is 35.9 per cent, below the promised 50
    ```
  answer: |
    The fourth line divides by the MSP. The margin the rule promises is over cost, so the base is
    the cost.

    ```working
    1042 divided by 1858 = 0.560818084
    0.560818084 times 100 = 56.0818084
    ```

    About 56 per cent over cost, which is what the Cabinet's release of 13 May 2026 prints for
    bajra. It is above the 50, not below.

    Why the wrong answer looks reasonable. In shops and company accounts, "margin" is often a share
    of the selling price. So dividing by the price feels normal. The arithmetic on every line is
    right. Only the base is wrong, and the answer comes out small enough to fit a story about a
    broken promise.
  refs:
  - pib_2260617
- level: 8
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
    crude palm oil before duty: Rs 100 a kg (made up)
    landed at 10 per cent duty: 100 times 1.10 = 110
    the duty is halved, to 5 per cent
    so the landed price halves: 110 divided by 2 = 55
    ```
  answer: |
    The fourth line halves the whole landed price. Only the duty was halved. The Rs 100 before duty
    does not change at all.

    ```working
    100 times (1 plus 0.05) = 105
    110 minus 105 = 5
    ```

    The landed price falls from Rs 110 to Rs 105. The duty part halves, from Rs 10 to Rs 5. The
    price falls by about 4.5 per cent.

    Why it looks reasonable: the word "halved" is true of something in the problem, and the working
    applies it to the nearest number in sight. The check that catches it is to ask what the price
    would be at a duty of nothing. It would be Rs 100. No duty change can take the price below the
    price before duty.
- level: 9
  prompt: |
    A speaker at a meeting says this.

    > Paddy farmers now get a 50 per cent profit, guaranteed. The Cabinet has said so.

    Decide what to compute, compute it, and say what your answer does not establish.
  answer: |
    What to compute: the margin for common paddy from the Cabinet's release of 13 May 2026, on its
    own base.

    ```working
    2441 minus 1627 = 814
    814 divided by 1627 = 0.500307314
    ```

    About 50 per cent over the stated cost. The number is real.

    What it does not establish. It is over an all-India weighted average cost, so it is not any
    one farmer's margin. It is a margin over one list of costs, the one in the release's footnote.
    A cost that counted more would give a smaller margin. So "profit" is the speaker's word, not the
    release's.

    And it is a margin on the announced price. It reaches only a farmer who sells to a
    procurement agency at the MSP. The section on MSP and procurement showed that a farmer may sell
    to the agency or in the open market. A farmer who sells in the open market gets the market
    price. Say instead: the announced price is
    about 50 per cent above the government's average cost figure.
  refs:
  - pib_2260617
- level: 9
  prompt: |
    A government release of 29 November 2023 says this.

    > As an example, the economic cost of 35 kg rice for an Antyodaya family comes to Rs. 1371

    Antyodaya families are the poorest households, entitled to 35 kg a month. Recompute the figure
    from the economic cost of rice for 2025-26, budget estimate, Rs 4173.34 a quintal. Then say what
    your answer does not establish.
  answer: |
    ```working
    4173.34 divided by 100 = 41.7334
    41.7334 times 35 = 1460.669
    ```

    About Rs 1461 a month at the 2025-26 cost, against the release's Rs 1371. The two differ
    because the economic cost is set again every year. The release's figure is about Rs 39.17 a kg
    (1371 divided by 35), an earlier year's cost. Quote the year with any such figure.

    What it does not establish. It is what the rice costs the government, not what it is worth to
    the family. A family that would not have bought 35 kg of rice at the market price is not saved
    Rs 1461. And it says nothing about what the rice does to the family's diet.
  refs:
  - pib_1980689
  - s37_economic_cost_grain
- level: 10
  prompt: |
    A news line on 24 September 2026 reads:

    > With the duty on palm oil halved to 5 per cent, cooking oil will be 5 per cent cheaper in
    > shops.

    Decide what to compute, compute it, and say what your answer does not establish.
  answer: |
    What to compute: the change in the landed price of crude palm oil, for any price before duty.
    Call that price 1, because the percentage does not depend on it.

    ```working
    1 times (1 plus 0.10) = 1.1
    1 times (1 plus 0.05) = 1.05
    1.1 minus 1.05 = 0.05
    0.05 divided by 1.1 = 0.0455
    ```

    At the port, the price of crude palm oil falls by about 4.5 per cent. That is the most the duty
    cut does by itself, and it is not 5.

    What it does not establish. A bottle in a shop is not crude oil at a port. Refining, packing,
    transport and each seller's margin sit on top, and none of them fell. So even full pass-through
    moves the shop price by less than 4.5 per cent.

    Full pass-through is not given either. The release asks industry to pass the benefit on,
    which shows it is not automatic. Only measured shop prices after the cut can say what
    happened. And this is basic duty only; other border
    charges are not in the sum.
  refs:
  - s37_edible_oil_duty
practice_note: |
  Fourteen problems, because the section teaches three moves (margin over a base, subsidy as a
  gap, price times one plus a rate) and each needs its own mechanical and applied rung. Two moves
  have a named trap, the base of the margin and "halved duty, halved price", and each gets a
  diagnostic and a transfer problem.
retrieval_items:
- q: What is the base of the margin printed in an MSP release, and what is common paddy's for 2026-27?
  a: The cost of production, not the price. Common paddy's MSP of Rs 2441 is 50 per cent over its cost
    of Rs 1627 a quintal, which is a third of the price.
- q: How is the subsidy on ration grain worked out, and what has it been since 1 January 2023?
  a: Economic cost minus central issue price. The issue price for households under the Act is zero, so
    the subsidy is the whole economic cost, about Rs 41.73 a kg of rice in 2025-26.
- q: A duty on a crude oil falls from 10 to 5 per cent. By how much does the landed price fall?
  a: By 0.05 divided by 1.10, about 4.5 per cent, whatever the price before duty. Not by half, and
    not by 5 per cent.
