- body: |
    The second wedge sits between what grain costs the government and what a ration-card holder
    pays for it. The Union government buys the grain, mostly at the MSP, and issues it to the
    States. The States hand it to households through ration shops.

    Search for the Foodgrains Bulletin for December 2025 of the Department of Food and Public
    Distribution, and open it. Find the statement of economic cost, central issue price and
    subsidy. Here are its rows for rice under the National Food Security Act (NFSA), in rupees a
    quintal.

    ```table
    | year | economic cost | issue price | subsidy | subsidy as % of economic cost |
    | 2021-22 | 3562.49 | 300 | 3262.49 | 91.6 |
    | 2022-23 | 3722.35 | 300 | 3422.35 | 91.9 |
    | 2023-24 | 3883.83 | 0 | 3883.83 | 100.0 |
    | 2024-25, revised estimate | 4042.15 | 0 | 4042.15 | 100.0 |
    | 2025-26, budget estimate | 4173.34 | 0 | 4173.34 | 100.0 |
    ```

    Check one row yourself. Take 2022-23, when the issue price was Rs 300 a quintal, or Rs 3 a kg.

    ```working
    3722.35 minus 300 = 3422.35
    3422.35 divided by 3722.35 = 0.9194
    0.9194 times 100 = 91.94
    ```

    The bulletin prints 91.9. The household paid about 8 per cent of what the rice cost.

    Now take 2025-26. The bulletin's footnote says the issue price "has become zero" because the
    grain has been free to everyone under the Act since 1 January 2023.

    ```working
    4173.34 minus 0 = 4173.34
    4173.34 divided by 100 = 41.7334
    ```

    The subsidy is the whole cost: about Rs 41.73 for every kilogram of rice.

    One more step shows where MSP enters. The same bulletin splits that Rs 4173.34 a quintal. Rs
    3375.29 of it is the "pooled" cost, the weighted average price paid for the grain at MSP. The
    rest is the cost of buying, storing and moving it.

    ```working
    4173.34 minus 3375.29 = 798.05
    3375.29 divided by 4173.34 = 0.8088
    ```

    About 81 per cent of the economic cost is the price paid for the grain. So when an MSP rises,
    the economic cost rises. With the issue price at zero, all of that rise lands on the subsidy.
    None of it reaches the ration-card holder's price.
  analogy_breaks_when: |
    These are costs per quintal of rice, which is paddy after milling. Never subtract a paddy MSP
    from a rice economic cost: the two are prices of different goods, and the arithmetic would run
    without complaint. The 2025-26 figure is a budget estimate, made before the year's accounts were
    closed. And the subsidy is what the government spends, not what the rice is worth to the family
    that receives it.
