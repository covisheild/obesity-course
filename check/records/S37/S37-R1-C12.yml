simplified_explanation: |
  A pregnant woman gets a meal through her local anganwadi. So does a mother for six months after
  the birth. An anganwadi is a government child care centre. Every child from six months to six
  years gets a meal there too.

  PM POSHAN runs the school meal. Saksham Anganwadi and Poshan 2.0 runs the anganwadi food. Some
  groups get a hot cooked meal (HCM) at the centre. Others get a take-home ration (THR): a prepared
  food handed out to be eaten at home.

  The Act sets each meal's size in two numbers only: energy, in kilocalories, and protein, in grams.
  Each is an amount the meal must reach. Nothing in the Act sets an upper limit on energy, sugar,
  fat or salt.
illustrations:
- body: |
    Start with a dead end this book met while it was being written.

    Search for the Saksham Anganwadi and Poshan 2.0 Scheme Guidelines of 2022 on the website of the
    Ministry of Women and Child Development, and open them. Go to 3.2.1, Nutritional Norms.
    Children from 6 to 72 months get 500 kilocalories and 12 to 15 g of protein a day. That matches
    Schedule II of the Act. Now read the line under the table: "The Nutritional Norms are under
    revision and will be notified shortly."

    So search the Press Information Bureau website for its backgrounder of 14 April 2026, "Mission
    Poshan 2.0: Strengthening India's Nutrition Ecosystem". It says the norms in Schedule II "have
    been revised in January 2023". It says the old ones were "largely calorie-specific". It does not
    give the new numbers. Neither does anything else this book could obtain.

    Here is what you can say, and it is enough. Schedule II, as printed, sets 500 kilocalories for
    a young child at the anganwadi. The government says those norms were revised in January 2023,
    and the revised figures are not in the documents at hand. Quote the old figure with that
    sentence attached, or not at all.

    Now read the one table you do hold, Schedule II, for a different thing: the type of meal. Book
    0, F2, drew its energy column. Read the column beside it.

    ```table
    | who | what they get | where they eat it |
    | children, 6 months to 3 years | take-home ration | at home |
    | children, 3 to 6 years | morning snack and hot cooked meal | at the anganwadi |
    | children, 6 months to 6 years, malnourished | take-home ration | at home |
    | pregnant women and lactating mothers | take-home ration | at home |
    | lower and upper primary classes | hot cooked meal | at school |
    ```

    The 2022 guidelines add that a take-home ration "shall not be given in the form of raw ration
    (Wheat, Rice, Dal etc.)". So a take-home ration is a prepared food, a product the State makes or
    buys. The hot cooked meal is cooked on the day. Those are two different food chains, run by the
    same scheme.
  analogy_breaks_when: |
    The table is the rule as the Act and the 2022 guidelines set it. States may give a hot cooked
    meal in place of a take-home ration, which the guidelines allow, so a given State may differ.
    And a take-home ration is eaten at home. Who in the household eats it is not something any of
    these documents can tell you.
