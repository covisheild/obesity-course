- body: |
    Now the school meal. Search the Press Information Bureau website for release 1812421 of 1 April
    2022, titled "PM POSHAN". It is a minister's written reply in the Lok Sabha. It carries the
    scheme's norms per child per day.

    ```table
    | item | primary | upper primary |
    | energy (kcal) | 450 | 700 |
    | protein (g) | 12 | 20 |
    | food grains (g) | 100 | 150 |
    | pulses (g) | 20 | 30 |
    | vegetables (g) | 50 | 75 |
    | oil and fat (g) | 5 | 7.5 |
    | salt and condiments | as per need | as per need |
    ```

    The first two rows match Schedule II exactly. The rest is new. They are the food, by weight,
    that a school is to buy and cook to reach those two numbers.

    Read the table for what kind of rule each row is. Every number is an amount to provide. Grain
    is the heaviest item on the list. Salt has no number at all, only "as per need". No row sets a
    ceiling. Nothing caps the energy or limits the fat, and nothing mentions sugar.

    Compare the anganwadi guidelines of 2022. They say "Only jaggery should be used for sweetening;
    white sugar should not be used." So one scheme names a sweetener rule and the other names none.
  analogy_breaks_when: |
    This is the table as a 2022 reply in Parliament states it. The Ministry of Education's own
    guidelines of 2023 could not be obtained for this book, and they may add detail, such as menu
    rules, that this table leaves out. The scheme was approved for 2021-22 to 2025-26. Whether and on
    what terms it runs beyond that is not in the documents held.
