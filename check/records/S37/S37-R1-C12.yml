  - poshan2_guidelines_2022
exercises:
- type: retrieval
  prompt: |
    Take each person below. Name the section of the National Food Security Act that entitles them.
    Name the scheme that delivers it. Say whether they get a take-home ration or a hot cooked meal.

    1. A child of two.
    2. A child of four.
    3. A child in class VI of a government school.
    4. A woman five months pregnant.
  answer: |
    1. Section 5(1)(a). Saksham Anganwadi and Poshan 2.0, through the anganwadi. A take-home ration.
    2. Section 5(1)(a). The same scheme. A morning snack and a hot cooked meal at the anganwadi.
    3. Section 5(1)(b). PM POSHAN. A hot cooked meal at school, on the upper primary norm.
    4. Section 4(a). Saksham Anganwadi and Poshan 2.0. A take-home ration.

    If the two-year-old is malnourished, section 6 applies as well, and the Schedule II row is the
    800-kilocalorie take-home ration.
  skill_ref: S37-R1-K02
  confidence_first: true
- type: critique
  prompt: |
    A district officer says this in a review meeting.

    > Our school meals are legally required to supply 450 kilocalories. Several schools serve more,
    > so they are in breach of the Act.

    Say what is wrong, and what the officer would need before any school could be in breach.
  answer: |
    The Act does not work that way. Section 5(1)(b) gives the meal "so as to meet the nutritional
    standards specified in Schedule II". Schedule II gives 450 kilocalories for lower primary. That
    is a standard the meal must reach. It is not a limit it must stay under. A school serving more
    has met the standard, not broken it.

    There is also a slip in the class. Upper primary is 700, not 450.

    A school could breach a rule by serving too much only if some instrument set a ceiling. That
    could be an amended Schedule, a guideline or a State order. Ask to see it. If none exists,
    the officer's concern may be sound, but its remedy is a new norm. Nobody can enforce an old one.
- type: teaching
  prompt: |
    Explain to a first-year resident, in ten minutes with a whiteboard, where the food a
    four-year-old eats at an anganwadi comes from in law. Draw the chain from Parliament to the
    plate.
  answer: |
    Draw four boxes, top to bottom.

    Box 1, Parliament: the National Food Security Act, 2013. Section 5(1)(a) gives every child from
    six months to six years a free meal at the anganwadi. Schedule II sets its size. A child of three
    to six gets a morning snack and a hot cooked meal worth 500 kilocalories and 12 to 15 g of
    protein. Mark that figure "old norm, revised January 2023, new figures not held".

    Box 2, the Union ministry: the Saksham Anganwadi and Poshan 2.0 guidelines of 2022, issued
    under sections 4, 5, 6 and 7. They say who gets a take-home ration and who a hot cooked meal.
    They also set at least 300 days a year of food.

    Box 3, the State: it runs the scheme and pays its share of the food. That share is half in a
    State with a legislature, outside the north-eastern and Himalayan States. The guidelines leave
    the food items to the State, so the State sets the menu.

    Box 4, the anganwadi centre: it cooks and serves.

    The mechanism the resident should take away: the law fixes a floor of energy and protein. The
    ministry fixes who gets which kind of food. The State fixes what is actually on the plate. To
    change the plate, go to Box 3 or Box 2, not Box 4.
retrieval_items:
- q: Which sections of the National Food Security Act give meals, and to whom?
  a: Section 4(a), pregnant women and lactating mothers; section 5(1)(a), children from six months to six
    years; section 5(1)(b), children up to class VIII or aged six to fourteen, at school; section 6,
    malnourished children.
- q: What does PM POSHAN set per child per day for primary and upper primary?
  a: 450 and 700 kilocalories, 12 and 20 g of protein, from 100 and 150 g of food grains, 20 and 30 g of
    pulses, 50 and 75 g of vegetables, and 5 and 7.5 g of oil and fat (PIB, 1 April 2022).
- q: Who gets a take-home ration under Saksham Anganwadi and Poshan 2.0?
  a: Pregnant women and lactating mothers, children from 6 to 36 months, severely malnourished children,
    and adolescent girls where the scheme covers them. Children from three to six get a hot cooked meal
    and a morning snack instead.
