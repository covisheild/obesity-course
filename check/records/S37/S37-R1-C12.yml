- point: |
    Centre and States share the anganwadi food bill. The 2022 guidelines set the Centre's share of
    supplementary nutrition at 50 per cent in States with a legislature. It is 90 per cent in the
    north-eastern and Himalayan States, and all of it in Union territories without a legislature.
    No document held gives PM POSHAN's split. Do not guess it.
  kind: number
  bearing: policy
  refs:
