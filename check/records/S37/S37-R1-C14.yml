simplified_explanation: |
  The earlier sections showed what each scheme promises one person: a ration, a school meal, an
  anganwadi meal or packet. This one steps back and asks how big the whole thing is.

  It is very big. The ration reaches about 81 crore people, that is about 810 million.

  That makes the state one of the largest buyers, cooks and grocers in the country. It writes the
  rules for what an anganwadi may cook, down to whether it may use white sugar.

  So a decision about a scheme's menu is a decision about the country's diet.
illustrations:
- body: |
    Start with the sentence you will hear, because it is wrong in two ways at once.

    > The ration reaches 81.35 crore people, school meals 11.80 crore children and anganwadis
    > 8.95 crore beneficiaries. So the state feeds over 100 crore people.

    Each number is real. The first is from the Cabinet's decision of 29 November 2023. The second
    is from a PIB release of 1 April 2022. The third is from a PIB backgrounder of 14 April 2026,
    as on March 2026. That is the first fault: three years, added as if they were one.

    The second fault is worse. The three counts are not of different people. A child in a
    priority household is counted in the ration. The same child may also be counted at school, or
    at the anganwadi. Adding the counts counts that child two or three times. The sum is not a
    number of people at all.

    So measure the scale a way that does add up: in grain, from one table, for one year. Open the
    Department of Food and Public Distribution's Annual Report 2025-26 at
    https://dfpd.gov.in/WriteReadData/AnnualRecordUploadDocuments/43bf089b-73cc-4329-aeb6-c883d2f2ea55_Food%20AR%202025-26%20English.pdf
    and search for "Annual allocation of food grains for 2025-26". Read it the way Book 0, F1
    taught: what one row is, what the column reports, in what unit. The figures are in lakh metric
    tonnes. A tonne is 1,000 kg, so one lakh tonnes is 10 crore kg, or 100 million kg.

    ```table
    | Scheme | Allocated 2025-26, lakh tonnes |
    | Antyodaya Anna Yojana (AAY) | 99.39 |
    | Priority households (PHH) | 428.63 |
    | TPDS tide over | 26.09 |
    | PM POSHAN | 22.31 |
    | Wheat Based Nutrition Programme (anganwadi) | 23.05 |
    | Welfare institutions and hostels | 5.83 |
    | Scheme for Adolescent Girls | 0.58 |
    ```

    These rows can be added, because they are all grain, all allocated, all in 2025-26. The table's
    own grand total, with a small festival and calamity allocation, is 607.40 lakh tonnes, about 61
    million tonnes. The paragraph above the table says 595.05. When a report's text and its table
    disagree, quote the table and say that you did.

    Now check the scale against the people. Take the ration rows, AAY and PHH, and the report's
    own count of "around 80 Crore beneficiaries" under the Act, from the same report.

    ```working
    99.39 plus 428.63 = 528.02
    ```

    That is 528.02 lakh tonnes, or 52,802 million kg. Divide by 800 million people.

    ```working
    52,802 divided by 800 is about 66
    66 divided by 12 = 5.5
    ```

    About 66 kg a person a year, or 5.5 kg a month. The Act promises 5 kg a person a month to a
    priority household. The allocation comes out a little higher, which fits: an Antyodaya
    household gets 35 kg whatever its size. The two numbers from different parts of one report
    agree to within about a tenth. That is the kind of check that tells you the scale is real.
  analogy_breaks_when: |
    An allocation is grain set aside for a scheme, not grain that reached anyone. For PM POSHAN in
    2025-26 the same report gives 22.31 lakh tonnes allocated and 15.68 lifted by December 2025,
    with a quarter of the year still to run. Grain lifted is still not grain eaten.

    The 80 crore is a rounded count of ration-card beneficiaries, and the 5.5 kg a month is an
    average over households of every size. It says nothing about any one household.
