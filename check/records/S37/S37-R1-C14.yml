definition:
  text: |
    The Indian state does not only regulate food. Through three channels it also buys, stores,
    cooks and hands out food, to a large share of the population.

    The first is the public distribution system (PDS) under the National Food Security Act, 2013 (NFSA). On 29 November 2023 the Union
    Cabinet decided to give free foodgrains to about 81.35 crore (813.5 million) beneficiaries under the Pradhan Mantri Garib Kalyan Anna
    Yojana (PMGKAY) for five years from 1 January 2024.

    The second is PM POSHAN (Pradhan Mantri Poshan Shakti Nirman), the school meal scheme earlier called the mid-day meal. The DFPD
    allocated it 22.31 lakh tonnes of foodgrains for 2025-26.

    The third is supplementary nutrition at anganwadi centres, under Mission Saksham Anganwadi and Poshan 2.0. As on March 2026 the
    mission's tracking system followed nearly 14,03,170 (about 1.4 million) anganwadi centres and about 8,95,29,425 (about 89.5 million)
    eligible beneficiaries.

    In each channel the state decides which foods go in: which grain, which recipe, what may and may not be added. Each such decision
    changes what very many people eat. So what the state buys and serves is nutrition policy, whether or not it is called that. Hostels,
    public hospitals and government canteens are the same lever. The DFPD allocates grain to welfare institutions and hostels, 5.83 lakh
    tonnes for 2025-26.
