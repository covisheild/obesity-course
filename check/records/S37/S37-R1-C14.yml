- body: |
    Now watch the state decide a menu.

    Open the Mission Saksham Anganwadi and Poshan 2.0 Scheme Guidelines (Ministry of Women and
    Child Development, 2022) at
    https://wcd.gov.in/documents/uploaded/Mission%20Saksham%20Anganwadi%20and%20Poshan%202.0%20scheme%20guidelines.pdf
    and search for "jaggery".

    > Only jaggery should be used for sweetening; white sugar should not be used.

    A few lines on, search for "Millets".

    > Millets should be mandatorily supplied at least once a week

    Two sentences in a scheme guideline. They apply to the food cooked or packed for every
    registered beneficiary of anganwadi supplementary nutrition in the country. No shopper chose
    them and no shop stocked them. A ministry wrote them.

    Now read what the same guidelines say about the programme before them, the anganwadi services
    of the Integrated Child Development Services (ICDS). Search for "calorie sufficiency".

    > The Anganwadi Services under ICDS have focused on ensuring calorie sufficiency, neglecting
    > quality and diversity of diets

    That is the state's own account of its own design: built to fill a calorie gap. It matches
    what the last section's arithmetic showed about the ration, which is mostly cereal energy.

    The same thing happens in the other channels. The DFPD's table allocates nutri-cereals in the
    ration "in lieu of wheat/rice", so the state chooses the grain. PM POSHAN encourages States to
    buy locally grown millets and vegetables for school meals. In each case a buying rule is a
    diet rule. When you read a scheme guideline, read it as a menu.
  analogy_breaks_when: |
    A rule in a guideline is not a rule on the plate. Whether a centre in fact uses jaggery, or
    serves millets every week, depends on the State that runs it. Poshan 2.0 is carried out
    through the State governments, and PM POSHAN's day-to-day running lies with the States and
    Union Territories. The guideline tells you what was decided, not what was done.
  numbers: []
must_know:
- point: |
    "The state regulates food; people choose what to eat" misses most of Indian food policy. A
    change to what a scheme hands out changes what millions eat.
  kind: misconception
  bearing: policy
  refs:
  - pib_1980689
- point: |
    Never add the beneficiaries of the ration, the school meal and the anganwadi to get "people
    the state feeds". The same child can sit in all three counts, and the counts come from
    different years.
  kind: trap
  bearing: methodological
- point: |
    For 2025-26 the Union government allocated 607.40 lakh tonnes of foodgrains, about 61 million
    tonnes, by its Food Department's own table. The report's text says 595.05. When text and table
    disagree, quote the table and say which figure you used.
  kind: number
  bearing: policy
  refs:
  - dfpd_pds
- point: |
    As on March 2026 the anganwadi programme tracked about 14 lakh centres and 8.95 crore eligible
    beneficiaries. A single line in its guidelines, such as "white sugar should not be used",
    reaches all of them.
  kind: consequence
  bearing: policy
  refs:
  - pib_2251769
  - poshan2_guidelines_2022
- point: |
    The anganwadi guidelines say in their own words that the earlier programme focused on "calorie
    sufficiency, neglecting quality and diversity of diets". Quote the state's own sentence when you
    argue that its food schemes were built for hunger.
  kind: india_deviation
  bearing: policy
  refs:
  - poshan2_guidelines_2022
- point: |
    Allocated is not lifted, and lifted is not eaten. So grain figures tell you what the state
    moved, never what anyone ate.
  kind: boundary
  bearing: methodological
  refs:
  - dfpd_pds
- point: |
    A guideline is not a plate. The Union writes the norms and the States run the kitchens. Before
    you claim a scheme serves millets or avoids sugar, ask for evidence of what was served, not
    what was written.
  kind: boundary
  bearing: policy
  refs:
  - pib_2082323
  - poshan2_guidelines_2022
exercises:
- type: retrieval
  prompt: |
    Name the three channels through which the Indian state hands out food. For each, name the
    ministry or department that runs it at the Union level, and give one scale figure with its
    date and its source.
  answer: |
    - The public distribution system under the National Food Security Act, 2013. The Department
      of Food and Public Distribution allocates the grain. States hand it out through fair price
      shops. The Cabinet decided on 29 November 2023 to give about 81.35 crore beneficiaries free
      foodgrains for five years from 1 January 2024. Or: 554.11 lakh tonnes allocated under
      TPDS for 2025-26, from the Department's Annual Report 2025-26.
    - PM POSHAN school meals, run by the Ministry of Education. The day-to-day running rests on
      the States and Union Territories. A PIB release of 1 April 2022 counts 11.80 crore children
      of classes I to VIII in 11.20 lakh schools. Or: 22.31 lakh tonnes of grain allocated for
      2025-26.
    - Supplementary nutrition at anganwadi centres, under Mission Saksham Anganwadi and Poshan
      2.0. The Ministry of Women and Child Development runs it through the States. A PIB
      backgrounder of 14 April 2026 counts about 14,03,170 centres and 8,95,29,425 eligible
      beneficiaries, as on March 2026.

    Each figure keeps its own date. None of them is added to another.
  skill_ref: S37-R1-K02
- type: critique
  prompt: |
    A draft op-ed says this.

    > India's food schemes are welfare, not nutrition policy. They just hand out grain. What
    > people eat is decided by what they buy.

    Say what is wrong with it, using two things the state itself has written down.
  answer: |
    The flaw is the idea that handing out food is neutral about diet. Whatever the state hands out
    is part of what people eat, and the state chooses it.

    Two things it has written down show that.

    - The anganwadi guidelines of 2022 set the menu's rules. "Only jaggery should be used for
      sweetening; white sugar should not be used." Millets go in at least once a week. Those rules
      apply to every registered beneficiary's food.
    - The Food Department's 2025-26 allocation table gives nutri-cereals "in lieu of wheat/rice" in
      the ration. The state picks the grain in the ration of about 80 crore people.

    And the anganwadi guidelines describe the earlier programme as focused on "calorie sufficiency,
    neglecting quality and diversity of diets". That is the state calling its own design a diet
    decision.

    A fairer sentence: India's food schemes are nutrition policy by design, and they were designed
    for hunger.
  skill_ref: S37-R1-K02
retrieval_items:
- q: Why can the beneficiary counts of the PDS, PM POSHAN and anganwadi supplementary nutrition not
    be added?
  a: The same person can be counted in more than one (a child in a ration household who also
    eats a school meal), and the counts come from different dates (2023, 2022, 2026).
- q: How much foodgrain did the Union allocate for 2025-26, and what caution goes with the figure?
  a: 607.40 lakh tonnes by the Food Department's own table (the report's text says 595.05); an
    allocation is grain set aside, not grain lifted or eaten.
- q: Give one line from a scheme guideline that shows the state deciding a menu.
  a: 'The Poshan 2.0 guidelines, 3.4: "Only jaggery should be used for sweetening; white sugar
    should not be used." Or: millets at least once a week.'
