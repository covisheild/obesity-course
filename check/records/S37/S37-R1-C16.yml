simplified_explanation: |
  The earlier sections of this book took the state's food tools one at a time. Here they sit on one
  page, so you can see which stage of the food system each one touches.

  First, a word. Book 0 used *instrument* for a legal text: a statute, a rule, a regulation or a
  notification (`B0-R0-C43`). People who write about policy use the word more loosely, for any
  tool a government uses — a price, a purchase, a duty, a meal. This book calls those *policy
  tools*. It keeps *instrument* for the legal text a tool stands on. That matters, because a tool
  with no statute behind it can end when its scheme period ends.

  Walk the chain from the field. At the farm, the government announces a support price for 22
  crops and buys some of them at that price (`S37-R1-C09`). Missions pay for seed and planting of
  oilseeds, oil palm and millets.

  In storage, the Food Corporation of India buys, holds and moves grain. In 2025 the Government
  also limited how much wheat traders could hold. At the border, a duty makes imported oil
  dearer or cheaper. At the factory and the shop, the food safety regulator sets standards and
  decides what a label must say.

  At the plate, the state itself hands out rations, school meals and anganwadi food (`S37-R1-C11`, `S37-R1-C12`). And
  across all of it sits tax.

  For each tool, ask four things. Where in the chain does it act? Who runs it? What does it stand
  on, a statute or a scheme with an end date? What does its own text say it is for?

  Ask the last question and a pattern shows. The tools on the farm, in storage and at the border
  say they are for supply, prices and farmers' incomes. The tools at the plate say they are for
  nutrition, and where they name a problem it is hunger or undernutrition. That fits the history in
  `S37-R1-C08`. Obesity turns up in these texts only as a theme of two awareness campaigns in 2025.
illustrations:
- body: |
    Here is the trap with a food policy number. It is true on the day it is written, and then it
    changes, and the old text stays online looking just as official.

    Suppose a colleague asks you what India's import duty on palm oil is. Search the Press
    Information Bureau for the Cabinet's release of 3 October 2024 approving the National Mission
    on Edible Oils – Oilseeds (https://www.pib.gov.in/PressReleasePage.aspx?PRID=2061646). Read
    its last paragraph.

    > Besides,  20% import duty on edible oils has been imposed to protect domestic producers
    > from cheap imports and encourage local cultivation.

    Write down 20% and you are wrong twice. Find the Bureau's release of 11 June 2025, "Centre
    reduces Basic Custom duty (BCD) on major imported Crude edible Oils from 20% to 10%". The basic
    customs duty on crude sunflower, soybean and palm oils fell from 20% to 10%. Then open the
    release of 24 September 2026 (https://www.pib.gov.in/PressReleasePage.aspx?PRID=2314297).

    > Accordingly, the BCD on Crude Sunflower Oil has been reduced from 10% to Nil, while the BCD
    > on Crude Soybean Oil and Crude Palm Oil has been reduced from 10% to 5%.

    Nil means 0%. Set the three texts side by side.

    ```table
    | Basic customs duty, as stated | Crude palm and soybean oil (%) | Crude sunflower oil (%) |
    | stated 3 Oct 2024 | 20 | 20 |
    | announced 11 Jun 2025 | 10 | 10 |
    | announced 24 Sep 2026 | 5 | 0 |
    ```

    Now a second trap. The Bureau's backgrounder of 8 December 2025 on the edible oil missions
    says the government "raised the effective customs duty on crude edible oils like palm,
    sunflower and soybean from 5.5% to 16.5%". That is not the basic duty. The text calls it
    effective, and it is a different number. The release of 24 September 2026 gives the basic duty
    only. So when you repeat a duty, say which duty it is, and the date of the text you took it
    from.

    Now look at what else acts on the same oil. Three tools, three bodies, three texts.

    ```table
    | Tool | Stage | Run by | What its text says |
    | National Mission on Edible Oils – Oilseeds | production | Department of Agriculture and Farmers Welfare | "reducing import dependency", "boosting farmers' incomes" |
    | Basic customs duty cut, 24 Sep 2026 | trade across the border | Government of India | "moderating domestic edible oil prices" |
    | Labelling regulations, ingredient list | processing and retail | FSSAI | the label must "Give name of the specific edible oil" |
    ```

    The mission wants more oilseed grown in India. The duty cut wants cheaper oil in the shop. The
    mission also runs a campaign on "recommended dietary guidelines for edible oils". The label rule
    only makes the oil visible. Each tool is run by a different body through its own text. If you
    want to change how much oil reaches Indian plates, first find out which body owns the lever
    you are pulling.
  analogy_breaks_when: |
    The duty rates hold from the release of 24 September 2026 until the next customs duty change.
    The release gives the basic duty on crude oils only. It does not give the refined-oil rates, the
    notification number, the date the change took effect, or any effective duty. The 20% row is the rate a Cabinet release stated on 3 October 2024; the date the 20%
    began is not in these texts.
