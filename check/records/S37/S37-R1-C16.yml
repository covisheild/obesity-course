- body: |
    Now sort the whole map by one question: what does each tool's own text say it is for?

    Take each tool in turn. Find the sentence in which its text states its purpose. Copy the
    words, not your memory of them. Then ask whether the sentence names nutrition and, if it
    does, which problem it names.

    ```table
    | Tool | Its own words | Nutrition named? |
    | Minimum support price, kharif 2026-27 | "to ensure remunerative prices to the growers for their produce" | no |
    | Procurement and the buffer stock | "remunerative prices", "affordable prices", "food security and price stability" | no |
    | Wheat stock limits, 2025 | "to prevent hoarding and unscrupulous speculation" | no |
    | Edible oil duty cut, 2026 | "moderating domestic edible oil prices, providing relief to consumers" | no |
    | Millets sub-mission | "To boost the production of millets" | only in the name of its parent, the National Food Security and Nutrition Mission |
    | Oilseeds mission | "reducing import dependency"; one campaign on "recommended dietary guidelines for edible oils" | one part of it |
    | Food Safety and Standards Act | "safe and wholesome food"; labels with "claims on health, nutrition" | safety first, nutrition on the label |
    | National Food Security Act | "food and nutritional security" | yes |
    | PM POSHAN | "hunger and education by improving the nutritional status" | yes: hunger |
    | Poshan 2.0 | "to reduce wasting and under-weight prevalence besides stunting and anemia" | yes: undernutrition |
    ```

    Read down the right-hand column. The production, price, storage and trade tools state no
    nutrition aim, beyond one mission's name and one campaign. The provision tools state one. Where they name a problem,
    it is the hunger and undernutrition this book's history section described (`S37-R1-C08`).

    Now search the Poshan 2.0 backgrounder of 14 April 2026
    (https://www.pib.gov.in/PressReleasePage.aspx?PRID=2251769&reg=3&lang=1) for the word obesity.
    It appears twice. The Poshan Pakhwada of April 2025 had a theme of "healthy lifestyle promotion
    to address childhood obesity". The Poshan Maah of September 2025 had "reduction in sugar and
    oil consumption to address obesity". Both are awareness campaigns. They speak to what people
    choose, not to what the scheme serves.
  analogy_breaks_when: |
    A stated aim is what a text says a tool is for. It is not what the tool does. A support price
    with no nutrition word in it still changes which crops are grown and what they cost
    (`S37-R1-C10` works the arithmetic). And the sort is only as good as the texts held: a scheme
    document not among this book's sources may state an aim these releases do not.
must_know:
- point: |
    "India has no nutrition policy in agriculture" and "India's food policy is nutrition policy"
    are both wrong as stated. Read each tool's own purpose. The price, storage and trade tools
    state aims about supply, prices and farm incomes. The provision tools state nutrition aims,
    and where they name a problem it is hunger or undernutrition, not obesity.
  kind: misconception
  bearing: policy
  refs:
  - pib_2260617
  - pib_1847548
- point: |
    For any food policy tool, write four things before you argue about it. The stage it acts at.
    The body that runs it. What it stands on: a statute, or a scheme approved for a period. And its
    stated aim, copied from its own text with the date.
  kind: move
  bearing: policy
- point: |
    Never repeat a duty, a price or a limit without its date. A Cabinet release of 3 October 2024
    put the duty on edible oils at 20%. The basic customs duty on crude palm oil was 10% from June
    2025, and 5% from the release of 24 September 2026. All three texts are still online.
  kind: number
  bearing: public
  refs:
  - pib_2061646
  - s37_edible_oil_duty
- point: |
    "Import duty" can mean the basic customs duty, or what a text calls the effective duty.
    They are different numbers for the same oil. Say which one you mean, and check which one your
    source gives.
  kind: trap
  bearing: public
  refs:
  - s37_edible_oil_duty
  - pib_2200287
- point: |
    The same food is touched by tools that pull different ways, run by different bodies. The
    oilseeds mission wants more oil grown at home. The 2026 duty cut wants cheaper
    oil in the shop. Before you propose a change, name which body owns the tool you want changed.
  kind: consequence
  bearing: policy
  refs:
  - pib_2061646
  - s37_edible_oil_duty
- point: |
    Check what each tool stands on before relying on it. The food safety law and the food security
    Act are statutes. PM POSHAN and Poshan 2.0 were approved
    as schemes for 2021-22 to 2025-26. Whether and how they continue after March 2026 is not in
    this book's sources, so look for the continuation before you cite either as current.
  kind: india_deviation
  bearing: policy
  refs:
  - pib_2082323
  - pib_1847548
- point: |
    Do not name the Act behind a stock limit from memory. The 2025 wheat stock limits were imposed
    by the Government of India, and the release announcing them names no Act. Find the order
    itself and read what it says it is made under, or say that you have not seen it.
  kind: trap
  bearing: methodological
  refs:
  - s37_economic_cost_grain
- point: |
    The map tells you where a tool acts, who runs it and what it says it is for. It does not tell
    you what the tool does to what people eat. A price tool with no nutrition aim can still change
    what people eat. That is a separate question, and it needs evidence.
  kind: boundary
  bearing: policy
exercises:
- type: retrieval
  prompt: |
    Without looking back, name one food policy tool at each of these stages: production, storage,
    trade across the border, processing and retail, provision, tax. For each, name the body that
    runs it.
  answer: |
    Production: the support price. The Union Government announces it each season, on the advice
    of the Commission for Agricultural Costs and Prices. Or a crop mission, such as the oilseeds
    mission, run by the Department of Agriculture and Farmers Welfare with the States.

    Storage: the central pool of grain. The Food Corporation of India buys, stores and moves it.
    Or a limit on how much grain traders may hold, set by the Government of India, as for wheat in
    2025.

    Trade across the border: the import duty on crude edible oils, set by the Government of India.

    Processing and retail: food standards and labels. The food safety regulator, FSSAI, sets them.

    Provision: rations through ration shops, run by the Department of Food and Public Distribution
    with the States. Or school
    meals, run by the Ministry of Education. Or anganwadi food, run by the Ministry of Women and
    Child Development.

    Tax: goods and services tax rates. The GST Council recommends them, under Article 279A of the
    Constitution.
  skill_ref: S37-R1-K02
  confidence_first: true
- type: interpretation
  prompt: |
    A newspaper line reads: "Government acts on oil prices, cuts duty to protect health." Using the
    release of 24 September 2026, say what the release does and does not support in that line.
  answer: |
    The release supports "government cuts duty". It reduced the basic customs duty on crude
    sunflower oil to Nil and on crude soybean and crude palm oil to 5%, from 10%.

    It supports "acts on oil prices". Its stated aim is "moderating domestic edible oil prices,
    providing relief to consumers". It also asks industry to revise its prices to distributors and
    its maximum retail prices.

    It does not support "to protect health". The release names consumers, inflation and domestic
    refiners. It says nothing about health or nutrition. Another government text, the Poshan Maah
    theme of 2025, asked for a "reduction in sugar and oil consumption". The two were written for
    different ends. The line has put an aim into the release that its text does not state.
  skill_ref: S37-R1-K02
- type: teaching
  prompt: |
    A health secretary has one page and asks: "Which of our food policies were built with
    nutrition in mind?" Write the answer, answer first.
  answer: |
    Answer: the ones that hand out food. Rations under the National Food Security Act state a
    nutrition aim in their own text. So do school meals under PM POSHAN and anganwadi food under
    Poshan 2.0. Where they name a problem, it is hunger or undernutrition: for anganwadi food,
    wasting, underweight, stunting and anaemia.

    The tools that shape the rest of the food supply state other aims. The support price is for
    "remunerative prices to the growers". Procurement and the buffer stock are for fair prices to
    farmers, affordable grain and stable prices. The edible oil duty cut is for lower prices. The oilseeds mission is for less
    dependence on imports, with one awareness campaign on dietary guidelines for oil.

    Obesity appears only as a theme of two Poshan 2.0 awareness campaigns in 2025. No tool on the
    map states an aim about it.

    What this does not tell you: what any of these tools does to diets. A support price with no
    nutrition aim may still shape what people eat. That needs evidence, not a reading of stated
    aims.
  skill_ref: S37-R1-K02
retrieval_items:
- q: What does section 16(1) of the Food Safety and Standards Act make the Food Authority's duty?
  a: To regulate and monitor the manufacture, processing, distribution, sale and import of food so
    as to ensure safe and wholesome food.
- q: Which Act links the ration shop to the Essential Commodities Act, and how?
  a: The National Food Security Act. Its section 2(4) defines a fair price shop as one licensed to
    distribute essential commodities by an order under section 3 of the Essential Commodities
    Act.
- q: What was the basic customs duty on crude palm oil after the release of 24 September 2026, and
    what was it before?
  a: 5%, down from 10%. Crude sunflower oil went to Nil from 10%.
- q: Which body recommends goods and services tax rates, and under which article?
  a: The GST Council, under Article 279A of the Constitution.
