simplified_explanation: |
  A ration is written as a weight of food. What you usually want to know is how much energy and protein that is, for one person, on one day.

  One trap sits in the tables. They give energy in kilojoules, not kilocalories.

  The answer is the energy in the food handed over. It is not what anybody ate.
illustrations:
- body: |
    Start with the mistake, because the table sets it for you.

    A person in a priority household is entitled to five kilograms of grain a month, under
    section 3(1) of the National Food Security Act, 2013. The Act says foodgrains: rice, wheat or
    coarse grains. Take the grain as raw milled rice. That is a choice, and you will see what it
    costs below.

    Open the Indian Food Composition Tables 2017 at https://www.nin.res.in/ebooks/IFCT2017.pdf
    and go to Table 1. Find row A015, Rice, raw, milled.

    > A015 Rice, raw, milled (Oryza sativa ) 6 9.93±0.75 7.94±0.58 0.56±0.08 0.52±0.05
    > 2.81±0.42 1.99±0.39 0.82±0.22 78.24±1.07 1491±15

    The last number is the energy in 100 g of rice: 1491. The second after the name is the
    protein: 7.94 g. Take 1491 as kilocalories and work out a day.

    ```working
    5,000 times 1,491 divided by 100 = 74,550
    74,550 divided by 30 = 2,485
    ```

    That says 2,485 kilocalories a day from the ration alone. A sedentary man's requirement,
    set by ICMR-NIN in 2020 for a reference man of 65 kg, is 2,110. So the ration would feed a
    grown man completely, with some left over. Something has gone wrong, and it is not the
    arithmetic.

    Go back to the head of the table and read the unit over the last column. It says KJ. The
    table prints energy in kilojoules and nothing else.

    Do it again properly. The tables give their own factor in section 3.6: 1 kcal = 4.18 kJ.
    Use that one, since it is the one the table's own numbers were made with.

    ```working
    5,000 times 1,491 divided by 100 = 74,550
    74,550 divided by 30 = 2,485
    2,485 divided by 4.18 = 594.5
    ```

    About 595 kilocalories a day. The first line is kilojoules for the month. The second takes
    a month to be 30 days, which is a choice you must say out loud. The third turns the day's
    kilojoules into kilocalories.

    Now the protein, the same way.

    ```working
    5,000 times 7.94 divided by 100 = 397
    397 divided by 30 is about 13.2
    ```

    About 13 grams of protein a day.

    Set the energy against a requirement. ICMR-NIN's 2020 figure for a sedentary reference woman
    of 55 kg is 1,660 kilocalories a day. Divide.

    ```working
    594.5 divided by 1,660 = 0.358
    594.5 divided by 2,110 = 0.282
    ```

    About 36 per cent of the reference woman's day, and 28 per cent of the reference man's.

    Last, the factor. With Book 0's 4.184 instead, the energy is 2,485 divided by 4.184, which is
    593.9 kilocalories. The two answers part in the fourth digit. Neither is wrong. Mixing them in
    one sum is.
  analogy_breaks_when: |
    The 594.5 kilocalories holds for raw milled rice at the tables' average, for a month taken
    as 30 days, for the person the grain is issued to. Parboiled milled rice (row A014) is 1471
    kJ per 100 g, and a 31-day month gives less per day. The table's 1491 carries a spread of 15
    across its six regions, so the answer has three trustworthy digits, not four.

    The shares hold only against ICMR-NIN's reference woman and man. A priority household's
    entitlement covers every member, children included, and the section gives no child's
    requirement. And the Department of Food and Public Distribution says in its own annual
    report that the public distribution system (PDS) is supplemental, not meant to meet a
    household's whole requirement.
