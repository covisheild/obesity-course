- body: |
    Now a meal. The same move runs on each food, and then the foods are added.

    PM POSHAN sets food norms for each child per day. A Press Information Bureau (PIB) release of
    1 April 2022 gives them
    for a primary school child: 100 g of foodgrains, 20 g of pulses, 50 g of vegetables and 5 g
    of oil and fat. The release does not say whether these are raw weights; this sum takes them
    as raw, the grain as issued. The energy and protein norms in the same table are 450
    kilocalories and 12 g, the same as Schedule II of the Act. The release does not say which
    classes are primary; the Schedule calls them lower and upper primary classes.

    Take the grain as raw milled rice again, and the pulse as tur dal, which the tables call red
    gram dal (row B021): 21.70 g protein and 1384 kJ per 100 g. The tables' Table 4 gives fat 37
    kJ a gram. Count the oil as if it were all fat. That can only overstate its energy, never
    understate it. Leave the vegetables out: the tables' vegetable rows are not used here, so
    the total you get is short by whatever the 50 g of vegetables holds.

    ```table
    | Food | Grams per child per day | kJ per 100 g | Protein, g per 100 g | kJ in the meal | Protein in the meal, g |
    | raw milled rice | 100 | 1491 | 7.94 | 1491 | 7.94 |
    | tur dal | 20 | 1384 | 21.70 | 276.8 | 4.34 |
    | oil, counted as fat | 5 | 3700 | 0 | 185 | 0 |
    | vegetables | 50 | not counted | not counted | | |
    | total, without vegetables | | | | 1952.8 | 12.28 |
    ```

    The oil's 3700 is the fat factor of 37 kJ a gram written per 100 g. Each line of the last two
    columns is grams times the content, divided by 100.

    ```working
    100 times 1,491 divided by 100 = 1,491
    20 times 1,384 divided by 100 = 276.8
    5 times 37 = 185
    1,491 plus 276.8 plus 185 = 1,952.8
    1,952.8 divided by 4.18 = 467.2
    ```

    ```working
    100 times 7.94 divided by 100 = 7.94
    20 times 21.70 divided by 100 = 4.34
    7.94 plus 4.34 = 12.28
    ```

    About 467 kilocalories and 12.3 g of protein, against a norm of 450 and 12. In kilojoules the
    energy norm is 450 times 4.18, which is 1,881. On paper the meal meets both norms before the
    vegetables are counted.

    Now ask where the energy comes from. Divide the rice's share by the whole.

    ```working
    1,491 divided by 1,952.8 = 0.764
    7.94 divided by 12.28 = 0.647
    ```

    About three quarters of the meal's energy, and about two thirds of its protein, is the
    cereal. The norms fix how much energy and protein a meal holds. They say nothing about where
    it comes from.
  analogy_breaks_when: |
    The totals hold for raw milled rice, tur dal and oil at the tables' averages, with the
    vegetables left out. Another grain or pulse gives other totals: problems 5 and 6 below swap
    the grain. The meal on paper is not the meal on the plate, which depends on the recipe, the
    cooking and whether the child eats it.
