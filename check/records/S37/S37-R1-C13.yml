definition:
  text: |
    A food entitlement is stated as a mass of food, over a period, for a unit of people. An
    Antyodaya household is entitled to thirty-five kilograms a month for the whole household. What
    an entitlement provides is the energy and protein in that food, per person per day.

    Getting from one to the other is a chain of unit conversions. First put the entitlement into
    grams per person per day. Divide a monthly amount by the number of days you take the month to
    have. Divide a household amount by the number of people in the household. Then multiply the
    grams by the food's energy and protein per 100 grams, and divide by 100. For a meal of several
    foods, work out each one and add them.

    The contents per 100 grams come from a food composition table. India's is the Indian Food
    Composition Tables 2017 (IFCT) of the Indian Council of Medical Research's National Institute
    of Nutrition (ICMR-NIN). IFCT prints energy in kilojoules only. The figures are
    physiologically available energy, worked out by the Atwater system. IFCT converts them to
    kilocalories with 1 kcal = 4.18 kJ. This factor and Book 0's 4.184 differ by less than 0.1 per cent
    (4.184 divided by 4.18 is 1.00096). The gap never changes a verdict against a norm.

    ICMR-NIN's 2020 adult requirement is 1660 kcal a day for a woman of 55 kg doing sedentary work
    (a physical activity ratio of 1.40). For a man of 65 kg it is 2110 kcal. The 55 and 65 kg are
    the body weights the table assumes. This section calls these two the reference woman and man.

    The arithmetic gives the energy in the food handed over. It does not give the energy any
    person eats.
