- body: |
    A take-home ration (THR) runs the other way. It is not raw grain: the Poshan 2.0 guidelines of
    2022 say, at 3.6, that THR "shall not be given in the form of raw ration". So there is no row in
    the tables to look up. What you have is the norm, and the sum goes from the norm to the
    packet.

    Schedule II of the Act sets a THR for a child of 6 months to 3 years at 500 kilocalories and 12
    to 15 g of protein a day. The guidelines, at 3.3, say supplementary nutrition is served on at
    least 300 days a year, on average 25 days a month. At 3.7 they say THR is handed out twice a
    month.

    ```working
    500 times 25 = 12,500
    12,500 divided by 2 = 6,250
    6,250 times 4.18 = 26,125
    ```

    A month's THR for one child should carry 12,500 kilocalories. Each of the two hand-outs should
    carry 6,250 kilocalories, which is 26,125 kilojoules. To check a packet, read the
    manufacturer's energy per 100 g and ask how many grams make 6,250 kilocalories. The guidelines
    ask each State to publish the calorie and protein content of every THR product on its website,
    which is where you find it.

    One warning about the norm itself. The 2022 guidelines print this table with a note that the
    norms are "under revision". The anganwadi supplementary-nutrition norms in Schedule II
    (take-home ration and hot cooked meal) were revised in January 2023, a PIB backgrounder of 14
    April 2026 says; the revised figures are not held. Nothing held says the school-meal rows were
    revised. The 500 here is the older norm.
  analogy_breaks_when: |
    The arithmetic assumes 25 days a month and two equal hand-outs, and it uses the pre-2023 norm.
    It gives what the packet should carry, not what the child eats. A packet taken home may be
    shared with whoever else is at home, and nothing in this sum can see that.
  numbers:
  - value: '500'
    unit: kcal a day, THR, children 6 months to 3 years, NFSA Schedule II (pre-2023 norm)
    citekey: nfsa_2013
    quote: 1. Children (6 months to 3 years) Take Home Ration 500 12-15
  - value: '25'
    unit: days a month on average, supplementary nutrition, Poshan 2.0 guidelines 3.3
    citekey: poshan2_guidelines_2022
    quote: served for a minimum of 300 days in a calendar year, i.e., on an average 25 days in a month
  - value: '300'
    unit: days a year at least, supplementary nutrition
    citekey: poshan2_guidelines_2022
    quote: served for a minimum of 300 days in a calendar year
must_know:
- point: |
    The Indian Food Composition Tables give energy in kilojoules only. Read the unit over the
    column before you read the number under it.
  kind: trap
  bearing: methodological
  refs:
  - ifct_2017
- point: |
    The priority-household entitlement is five kilograms of grain a month. As raw milled rice, it
    holds about 595 kilocalories and 13 g of protein a day for the person it is issued to. That uses the 2017
    tables' average across six regions and a 30-day month. Quote it with both.
  kind: number
  bearing: policy
  refs:
  - nfsa_2013
  - ifct_2017
- point: |
    The Indian tables use 4.18, not Book 0's 4.184. Say which one you used, and never use both in
    one calculation, or a difference in the fourth digit will look like a finding.
  kind: move
  bearing: methodological
  refs:
  - ifct_2017
- point: |
    An Antyodaya entitlement is 35 kg for the whole household. What it gives one person depends on
    how many people share it, which the Act does not fix. Never quote a per-person figure for it
    without the household size you assumed.
  kind: trap
  bearing: policy
  refs:
  - nfsa_2013
- point: |
    "The ration supplies a third of a person's energy" compares the ration with a reference 55 kg
    sedentary woman. So say whose requirement you divided by, or do not give the share.
  kind: boundary
  bearing: methodological
  refs:
  - icmr_nin_2020_brief
- point: |
    The Department of Food and Public Distribution itself calls the ration supplemental. So never
    present a ration's energy as a person's intake.
  kind: boundary
  bearing: policy
  refs:
  - dfpd_pds
- point: |
    A primary school meal built to the PM POSHAN food norms meets the 450 kcal and 12 g norms on
    paper. About three quarters of its energy is cereal. The norms fix the amounts. They do not
    fix where the energy comes from.
  kind: consequence
  bearing: policy
  refs:
  - s37_pib_1812421
  - ifct_2017
- point: |
    The anganwadi supplementary-nutrition norms in Schedule II (take-home ration and hot cooked
    meal) were revised in January 2023, a PIB backgrounder of 14 April 2026 says; the revised
    figures are not held. Nothing held says the school-meal rows were revised. Any THR sum built on 500 or 600 kilocalories uses
    the older norm, and must say so.
  kind: trap
  bearing: policy
  refs:
  - pib_2251769
  - poshan2_guidelines_2022
exercises:
- type: teaching
  prompt: |
    A health secretary has one page and asks you what the free PDS ration gives a person in a
    priority household, in energy and protein. Answer first. Then say what the figure does not
    tell her, in a way she can repeat in a meeting.
  answer: |
    Answer first. Five kilograms of raw milled rice a month holds about 595 kilocalories and 13
    grams of protein a day. That is roughly a third of what ICMR-NIN sets for a sedentary 55 kg
    woman. It is a little over a quarter of the figure for a sedentary 65 kg man. Wheat gives a little less
    energy and more protein: about 537 kilocalories and 18 grams a day.

    What it does not tell her, as three short lines she can repeat.

    - It is the food handed over, not the food eaten. Who at home eats it, and what it replaces,
      are not in the sum.
    - The share is against a reference adult. Children and heavy workers need different amounts.
    - The Department's own annual report calls the ration supplemental: it was never meant to
      meet the whole requirement.

    All of what the ration gives is cereal energy, because the Act's foodgrains are cereals.
  confidence_first: false
quantitative: true
practice_note: |
  Twelve problems. The technique has several moves that compose: scale a per-100 g value, turn a
  month into a day, turn a household into a person, add a meal's parts, convert kJ to kcal with a
  stated factor, and divide by a norm. Each move gets a problem and the direction is reversed twice.
practice:
- level: 1
  prompt: |
    A food holds 1,400 kJ in every 100 g. How many kilojoules are in 250 g of it? And in 35 g?
  answer: |
    Multiply the grams by the content per 100 g, then divide by 100.

    ```working
    250 times 1,400 divided by 100 = 3,500
    35 times 1,400 divided by 100 = 490
    ```

    3,500 kJ and 490 kJ.
- level: 2
  prompt: |
    Using 1 kcal = 4.18 kJ, turn 2,090 kJ into kilocalories. Then turn 450 kcal into kilojoules.
  answer: |
    Kilojoules to kilocalories divides, because a kilocalorie is the bigger unit.

    ```working
    2,090 divided by 4.18 = 500
    ```

    Kilocalories to kilojoules multiplies.

    ```working
    450 times 4.18 = 1,881
    ```

    500 kcal and 1,881 kJ.
- level: 3
  prompt: |
    A household receives 7 kg of grain a month. Taking a month as 30 days, how many grams is that a
    day? If four people share it equally, how many grams a day is that for each?
  answer: |
    Put the kilograms into grams, then divide by the days.

    ```working
    7 times 1,000 = 7,000
    7,000 divided by 30 is about 233.3
    ```

    Now divide by the people.

    ```working
    233.3 divided by 4 = 58.3
    ```

    About 233 g a day for the household, and about 58 g a day for each person.
- level: 4
  prompt: |
    A priority household member takes the 5 kg a month entitlement as whole wheat. The Indian Food
    Composition Tables 2017 give whole wheat 1347 kJ and 10.59 g of protein per 100 g. Taking a
    month as 30 days, how much energy, in kilocalories, and how much protein does the entitlement
    hold a day? Use the tables' own factor.
  answer: |
    Energy for the month, then the day, then kilocalories.

    ```working
    5,000 times 1,347 divided by 100 = 67,350
    67,350 divided by 30 = 2,245
    2,245 divided by 4.18 = 537.1
    ```

    Protein the same way.

    ```working
    5,000 times 10.59 divided by 100 = 529.5
    529.5 divided by 30 = 17.65
    ```

    About 537 kcal and 17.7 g of protein a day. Against rice's 594.5 kcal and 13.2 g, wheat gives a
    little less energy and a good deal more protein.
  refs:
  - nfsa_2013
  - ifct_2017
- level: 5
  prompt: |
    The PM POSHAN food norms give an upper primary child 150 g of foodgrains a day. They add 30 g of
    pulses, 75 g of vegetables and 7.5 g of oil and fat. The nutrition norms are 700 kcal and 20 g
    of protein.

    Build the meal from three foods and leave the vegetables out. Raw milled rice has 1491 kJ and
    7.94 g protein per 100 g. Tur dal has 1384 kJ and 21.70 g per 100 g. Count the oil as fat, at
    37 kJ a gram. Does the meal meet each norm?
  answer: |
    Energy, food by food.

    ```working
    150 times 1,491 divided by 100 = 2,236.5
    30 times 1,384 divided by 100 = 415.2
    7.5 times 37 = 277.5
    2,236.5 plus 415.2 plus 277.5 = 2,929.2
    2,929.2 divided by 4.18 = 700.8
    ```

    Protein, with the oil counted as none.

    ```working
    150 times 7.94 divided by 100 = 11.91
    30 times 21.70 divided by 100 = 6.51
    11.91 plus 6.51 = 18.42
    ```

    About 701 kcal, which meets the 700 kcal norm. About 18.4 g of protein, which is 1.6 g short of
    the 20 g norm. The vegetables would add a little of both, and this sum cannot say how much.
  refs:
  - s37_pib_1812421
  - ifct_2017
- level: 5
  prompt: |
    Build the same upper primary meal again, with whole wheat in place of the rice. Whole wheat has
    1347 kJ and 10.59 g of protein per 100 g. Keep the rest: 30 g of tur dal, 7.5 g of oil counted
    as fat, no vegetables. What happens to the energy and the protein?
  answer: |
    Only the grain line changes.

    ```working
    150 times 1,347 divided by 100 = 2,020.5
    2,020.5 plus 415.2 plus 277.5 = 2,713.2
    2,713.2 divided by 4.18 = 649.1
    ```

    ```working
    150 times 10.59 divided by 100 = 15.885
    15.885 plus 6.51 = 22.395
    ```

    About 649 kcal and 22.4 g of protein. The wheat meal falls about 51 kcal short of the energy norm
    and clears the protein norm. The rice meal did the opposite. Which grain is served decides which
    norm the meal meets, with the same grams on the plate.
  refs:
  - s37_pib_1812421
  - ifct_2017
- level: 6
  prompt: |
    Schedule II of the National Food Security Act, 2013 sets a take-home ration for pregnant women
    and new mothers. It is 600 kcal a day. The Poshan 2.0 guidelines say the food is served on 25
    days a month, on average. The ration is handed out twice a month. How many kilocalories should
    each hand-out carry? How many kilojoules is that, with the Indian tables' factor? Say which
    version of the norm you used.
  answer: |
    A month's worth, then half of it.

    ```working
    600 times 25 = 15,000
    15,000 divided by 2 = 7,500
    7,500 times 4.18 = 31,350
    ```

    Each hand-out should carry 7,500 kcal, or 31,350 kJ.

    The 600 is the Schedule II figure as the Act prints it. The anganwadi norms were revised in
    January 2023; the revised figures are not held, so this is the older norm.
  refs:
  - nfsa_2013
  - poshan2_guidelines_2022
  - pib_2251769
- level: 6
  prompt: |
    An Antyodaya household takes its 35 kg a month entitlement as raw milled rice (1491 kJ per 100
    g). Work out the energy per person per day, in kilocalories, for a household of seven and for a
    household of three. The two household sizes are made up for the problem. Take a month as 30
    days.
  answer: |
    Grams per person per day first, for seven people.

    ```working
    35,000 divided by 7 = 5,000
    5,000 divided by 30 is about 166.7
    166.7 times 1,491 divided by 100 = 2,485.5
    2,485.5 divided by 4.18 = 594.6
    ```

    Now for three.

    ```working
    35,000 divided by 3 is about 11,666.7
    11,666.7 divided by 30 = 388.9
    388.9 times 1,491 divided by 100 = 5,798.5
    5,798.5 divided by 4.18 = 1,387.2
    ```

    About 595 kcal a person a day for seven, the same as a priority household member gets, and about
    1,387 kcal for three. The same entitlement gives more than twice as much to each person in the
    smaller household. A per-person figure for Antyodaya means nothing without the household size.
  refs:
  - nfsa_2013
  - ifct_2017
- level: 7
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
    entitlement: 5 kg of raw milled rice a month
    rice: 1,491 kJ per 100 g
    5 times 1,491 = 7,455 kJ a month
    7,455 divided by 30 = 248.5 kJ a day
    248.5 divided by 4.18 = 59.4 kcal a day
    ```

    "So the ration gives under 60 kcal a day, which is next to nothing."
  answer: |
    The third line multiplies kilograms by a content given per 100 grams. Five kilograms is 5,000
    grams, which is 50 lots of 100 g, not 5.

    ```working
    5,000 times 1,491 divided by 100 = 74,550
    74,550 divided by 30 = 2,485
    2,485 divided by 4.18 = 594.5
    ```

    About 595 kcal a day, ten times the worked answer.

    Why it looks reasonable: every unit named in the working is a real one and the conversion to
    kilocalories is right. The slip is in the one line where the mass unit changed silently from
    grams to kilograms. A factor of ten hides well in a small number. Write the grams on every line.
  refs:
  - nfsa_2013
  - ifct_2017
- level: 8
  prompt: |
    Here is a worked answer. Find the step that broke.

    ```working
    Antyodaya entitlement: 35 kg of raw milled rice a month
    35,000 divided by 30 = 1,166.7 g a day
    1,166.7 times 1,491 divided by 100 = 17,395.5 kJ a day
    17,395.5 divided by 4.18 = 4,161.6 kcal a day
    ```

    "So each Antyodaya beneficiary gets about 4,160 kcal a day, nearly twice a sedentary man's
    requirement of 2,110. The ration is too generous."
  answer: |
    The arithmetic is right on every line. What broke is the unit of people. The 35 kg is for the
    whole household, under the first proviso to section 3(1). The 4,161.6 kcal is the household's
    day, not one person's.

    To get to a person you need the household's size, and the Act does not give it. For a household
    of seven, divide by seven.

    ```working
    4,161.6 divided by 7 = 594.5
    ```

    About 595 kcal each, the same as a priority household member.

    Why it looks reasonable: the working is careful, the units are named, and the comparison with
    2,110 is a real figure. The error sits in the sentence after the working, where "a day" quietly
    became "each beneficiary a day". Then the comparison makes a household look like one man.
  refs:
  - nfsa_2013
  - ifct_2017
  - icmr_nin_2020_brief
- level: 9
  prompt: |
    A briefing note says this.

    > The free PDS ration meets more than a third of every beneficiary's daily energy needs.

    Decide what to compute, compute it, and say what your answer does not establish.
  answer: |
    What to compute: the ration's energy per person per day, then its share of a stated
    requirement. Take the 5 kg priority entitlement as raw milled rice and a 30-day month.

    ```working
    5,000 times 1,491 divided by 100 = 74,550
    74,550 divided by 30 = 2,485
    2,485 divided by 4.18 = 594.5
    594.5 divided by 1,660 = 0.358
    594.5 divided by 2,110 = 0.282
    ```

    About 36 per cent of a sedentary 55 kg reference woman's requirement, and 28 per cent of a
    sedentary 65 kg reference man's. So "more than a third" holds for one reference person and
    fails for another. With whole wheat it is 537.1 divided by 1,660, which is 32 per cent, and
    fails for both.

    What this does not establish. "Every beneficiary" is wrong on its face: the requirement differs
    by age, sex, size and work, and an Antyodaya member's share depends on household size. The sum
    is the energy handed over, not eaten. It cannot see sharing within the household, cooking
    losses or what the ration replaces. And "needs" is a reference figure, which ICMR-NIN itself
    says must be adjusted for a group's actual weight and activity.
  refs:
  - nfsa_2013
  - ifct_2017
  - icmr_nin_2020_brief
- level: 10
  prompt: |
    In a meeting somebody says this.

    > If the PDS gave bajra instead of rice, poor households would get fewer calories, and that
    > would help with obesity.

    Bajra is 1456 kJ and 10.96 g of protein per 100 g in the Indian Food Composition Tables 2017.
    Decide what to compute, compute it, and say what your answer does not establish.
  answer: |
    What to compute: the energy and protein of the 5 kg entitlement as bajra, set beside rice, per
    person per day on a 30-day month.

    ```working
    5,000 times 1,456 divided by 100 = 72,800
    72,800 divided by 4.18 = 17,416.3
    17,416.3 divided by 30 = 580.5
    5,000 times 10.96 divided by 100 = 548
    548 divided by 30 is about 18.3
    ```

    About 580 kcal and 18.3 g of protein a day, against rice's 594.5 kcal and 13.2 g. The energy
    falls by 14 kcal a day, about 2 per cent. The protein rises by about 5 g.

    ```working
    594.5 minus 580.5 = 14
    14 divided by 594.5 = 0.024
    ```

    So the first half of the claim is true and tiny. By this arithmetic, swapping the grain changes
    what the ration holds far more than how much energy it holds.

    What this does not establish. Nothing here says anything about obesity. The sum is the food
    handed over, not eaten. It cannot see whether a household eats the bajra, or sells it, or buys
    rice to replace it. A 14 kcal gap on paper is well inside what cooking and household sharing
    can move. And the tables' averages carry their own spread: 18 kJ per 100 g for bajra, across
    its regions.
  refs:
  - nfsa_2013
  - ifct_2017
retrieval_items:
- q: What two moves turn a food entitlement into energy per person per day?
  a: Put the entitlement into grams per person per day, dividing by the days in the month and by
    the people in the household where it is a household amount. Then multiply by the food's energy
    per 100 g from a composition table and divide by 100.
- q: In what unit do the Indian Food Composition Tables 2017 print energy, and with what factor do
    they convert it?
  a: Kilojoules only, per 100 g of edible portion. They convert with 1 kcal = 4.18 kJ, not 4.184.
- q: About how much energy and protein a day does 5 kg of raw milled rice a month hold, and what
    does that figure not tell you?
  a: About 595 kcal and 13 g of protein a day, on a 30-day month. It is the food handed over, not
    what anyone eats; it cannot see sharing, cooking losses or what the ration replaces.
