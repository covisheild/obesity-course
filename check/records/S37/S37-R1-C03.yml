simplified_explanation: |
  Turn over a packet of biscuits. The list of ingredients on the back is a map of farms.

  Wheat flour came from wheat fields. Sugar came from a sugar crop and a sugar mill. Milk solids
  came from dairy animals. Then the packets travelled another chain to your shop.

  The ingredients go in order of weight when the food was made, heaviest first. So the first
  ingredient weighs more than any other single one.

  The label also leaves a great deal out.
illustrations:
- body: |
    Here is the trap with the address on a food packet. It looks like the place the food comes
    from. It is not.

    Pick up any packet of biscuits and find the words "Manufactured by" or "Marketed by". Read
    the address under them.

    Now open the Food Safety and Standards (Labelling and Display) Regulations, 2020, in FSSAI's
    compendium at
    https://www.fssai.gov.in/upload/uploadfiles/files/Comp_Labelling%20Display_Version%20VIII_09_09_2025.pdf
    and search inside it for "brand owner".

    > The name and complete address of the brand owner, whether or not, he himself is the
    > manufacturer, marketer, packer or bottler, as the case may be, shall be declared on the
    > label.

    So the address is the brand owner's. If your packet says "Marketed by", the company named
    there may never have baked a biscuit. Read on to regulation 5(7)(b). When the maker is someone
    else, the label must show the maker's licence number, not its name. That number is your only
    lead to the factory.

    And nothing on the label leads past the factory. The address is not the mill that ground the
    flour, and not the farm that grew the wheat. The label tells you who answers for the packet.
    It does not tell you where the food came from.
  analogy_breaks_when: |
    Some packets are made by the brand owner itself, and then the address is the maker's. Food
    imported into India must also name its country of origin and its importer. The trap is
    assuming the address is the source without checking which of these cases you hold.
- body: |
    Now read the list of ingredients as a map. The list below is made up, not copied from any
    real brand. It is written the way regulation 5(2) requires: "Ingredients: Wheat flour (Atta),
    Sugar, Edible vegetable oil (Palm oil), Invert sugar syrup, Milk solids, Choco chips, Iodised
    salt."

    Two kinds of name on it need a word. "Sugar" is a class title — one name the regulation allows
    for a whole group of ingredients. "Choco chips" is a compound ingredient — one that is itself
    made of two or more ingredients.

    Take the ingredients one at a time. For each, write the crop behind it and the chain it came
    up. The table is a sketch: the right-hand column is what you would still have to find out.

    ```table
    | On the list | What the regulation lets it say | Where it starts | The chain before the factory | What the label does not tell you |
    | Wheat flour (Atta) | the ingredient's own name | wheat | farm, trader, flour mill | which state, which mill |
    | Sugar | "Sugar" may stand for sucrose | a sugar crop | farm, sugar mill | which crop, which mill |
    | Edible vegetable oil (Palm oil) | the specific oil must be named | oil palm | plantation, oil mill, refinery | which country |
    | Invert sugar syrup | the ingredient's own name | a sugar crop | farm, sugar mill, syrup maker | which mill |
    | Milk solids | "Milk solids" may stand for any milk product | milk | dairy farm, dairy plant | which dairy, which animal |
    | Choco chips | a compound ingredient, named as such | several | several | its own ingredients, if under 5 per cent |
    | Iodised salt | the ingredient's own name | salt | wherever the salt is made | where |
    ```

    Now test what the order can tell you. Wheat flour comes first, so it weighed more than the
    sugar at manufacture. But sugar appears twice, as "Sugar" and as "Invert sugar syrup". The
    rule ranks each named ingredient on its own. Added together, the two sweeteners might outweigh
    the flour, or might not. The list cannot say.

    Last, look at "Choco chips". If they make up less than 5 per cent of the biscuit, the
    regulation does not require their own ingredients to be listed, apart from additives. Their
    sugar, fat and cocoa each came up a chain too. On this label, those chains are out of sight.
  analogy_breaks_when: |
    The order is fixed at manufacture, by weight or by volume. It ranks ingredients and gives no
    amounts, unless the label emphasises an ingredient and so owes its percentage.
    A single-ingredient food, such as a packet of plain atta, needs no list at all. And a map drawn from
    the list stops at the factory door: which farms, mills and countries sit behind each line is
    for other sources to answer.
  numbers:
  - value: '5'
    unit: per cent of the food, the size below which a compound ingredient's own ingredients need not be declared
    citekey: fssai_labelling_2020
    quote: Provided that where a compound ingredient constitutes less than 5 per cent. of the food
figure_note: The picture this section needs is several farm chains converging on one factory, a flow diagram the drawing tool cannot draw; the table carries it meanwhile.
must_know:
- point: |
    "The first ingredient is most of the product" is wrong. The first is only heavier than each
    other single ingredient.
  kind: misconception
  bearing: methodological
  refs:
  - fssai_labelling_2020
- point: |
    Add up an ingredient that appears under more than one name before you say where it ranks.
    Sugar and invert sugar syrup are listed as two lines, each in its own place. Together they
    may outrank the first ingredient.
  kind: trap
  bearing: clinical
  refs:
  - fssai_labelling_2020
- point: |
    The address on a packet is the brand owner's, who may only market it. If the maker is
    someone else, the label shows the maker's licence number, not its name.
  kind: trap
  bearing: public
  refs:
  - fssai_labelling_2020
- point: |
    A compound ingredient under 5 per cent of the food need not list its own ingredients, apart
    from additives. When you trace a product's chains, mark such an ingredient as a known gap,
    not as one chain.
  kind: number
  bearing: methodological
  refs:
  - fssai_labelling_2020
- point: |
    The label asks for a country of origin only on food imported into India. Do not read silence
    on the label as evidence that an ingredient is Indian.
  kind: india_deviation
  bearing: policy
  refs:
  - fssai_labelling_2020
- point: |
    For any packaged food, read the first four or five ingredients as a list of farm chains.
  kind: move
  bearing: teaching
- point: |
    The list is one pack's ranking at manufacture, under one set of rules. It cannot tell you who
    supplied an ingredient, what it cost, or who kept how much of the price.
  kind: boundary
  bearing: policy
  refs:
  - fssai_labelling_2020
exercises:
- type: interpretation
  prompt: |
    A made-up packet of namkeen lists: "Ingredients: Gram pulse flour (Besan), Edible vegetable
    oil (Palmolein), Peanuts, Iodised salt, Spices and condiments." Name the chain behind each
    ingredient. Which ingredient hides more than one chain behind a single name, and which rule
    lets it?
  answer: |
    Besan starts with a pulse crop, gram, and goes through a farm, a trader and a mill. Palmolein
    starts with the oil palm and goes through a plantation, an oil mill and a refinery; the label
    does not say in which country. Peanuts start with the groundnut crop. Iodised salt starts
    wherever the salt is made.

    "Spices and condiments" hides several chains. The class-title table in regulation 5(2)(d)
    lets all spices, herbs and condiments, and their extracts, be declared under one class title.
    So chilli, turmeric or cumin, each with its own farms, may sit behind those three words. The
    edible oil, by contrast, had to be named, which is why you know it is palmolein.
  skill_ref: S37-R1-K01
- type: critique
  prompt: |
    The front of a made-up packet says "Made with real milk" beside a picture of a glass of milk.
    The list shows "Milk solids" as the eighth ingredient, with no percentage. A friend says:
    "Eighth means there's hardly any milk in it." What can you say, and what should you look for?
  answer: |
    Eighth means milk solids weighed less than each of seven other ingredients at manufacture.
    It does not say how little. Seven heavier ingredients could leave milk solids as a large
    share or a tiny one.

    The front of the pack emphasises milk in words and a picture. Regulation 5(2)(g) requires the
    percentage of an ingredient emphasised that way, subject to listed exemptions. So look for a
    percentage beside milk solids. If none is there, the list is not answering the question your
    friend is asking. Whether the label complies is a question for FSSAI, not something the order
    can settle.
- type: teaching
  prompt: |
    A health secretary asks why a packet of biscuits should concern anyone beyond the food
    regulator. Write the answer you would give, answer first, in no more than a page.
  answer: |
    Because a packet of biscuits is several farm chains meeting in one factory.

    The label regulation fixes only how the packet declares its ingredients. What goes into it,
    at what price, was decided further back. Wheat, sugar, edible oil and milk each came through
    farmers, traders and mills before the factory bought them. A change in any one of those
    chains reaches the biscuit through the factory's buying.

    So a question about what is in the packet is also a question about farms, mills and trade.
    The label is where you start reading, not where the answer is.
retrieval_items:
- q: In what order must a packaged food's ingredients be listed in India, and under which
    regulation?
  a: In descending order of their composition by weight or volume at the time of manufacture,
    under regulation 5(2)(b) of the FSS (Labelling and Display) Regulations, 2020.
- q: Whose address must a food label carry?
  a: The brand owner's, whether or not the brand owner is the manufacturer. If the manufacturer is
    different, its licence number must also be shown.
- q: When may a compound ingredient's own ingredients be left off the list?
  a: When the compound ingredient is less than 5 per cent of the food; food additives that serve a
    technological function must still be declared.
