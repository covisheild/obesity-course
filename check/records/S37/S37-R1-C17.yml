must_know:
- point: |
    Much of what reaches a plate was decided upstream, by a recipe, a price, a shelf or a ration. A
    campaign changes nothing on offer.
  kind: misconception
  bearing: policy
  refs:
  - hlpe_2017
- point: |
    For any proposal, write three answers: the stage, whose decision it changes, and what it
    changes about the food on offer.
  kind: move
  bearing: policy
- point: |
    "It acts at consumption" is true of every campaign and says nothing. Always name the actor.
  kind: trap
  bearing: teaching
- point: |
    Where a component is housed is not where it acts. The oilseeds mission is a production
    programme, and its campaign on "recommended dietary guidelines for edible oils" still acts on
    the person.
    Locate each component, not the programme's name.
  kind: trap
  bearing: policy
  refs:
  - pib_2200287
- point: |
    One topic can sit in two places. Poshan 2.0's 2025 campaign on less sugar acts on the person.
    The same scheme's guideline that "white sugar should not be used" acts on the recipe.
  kind: consequence
  bearing: policy
  refs:
  - pib_2251769
  - poshan2_guidelines_2022
- point: |
    In clinic, counselling is the tool you hold, and it acts on the person. Ask what the child
    is served before you advise the parent on what to cut.
  kind: consequence
  bearing: clinical
- point: |
    Locating a proposal tells you where it acts and through whom. It does not tell you whether it
    works, or in which direction.
  kind: boundary
  bearing: methodological
exercises:
- type: interpretation
  prompt: |
    Locate each proposal. Give the stage and whose decision it changes. Say what it changes about
    the food on offer, and whether it acts upstream or on the person.

    (a) A rule that school canteens may not sell sugared drinks.

    (b) A warning printed on the front of food packs that are high in salt.

    (c) A television campaign telling parents to give children fewer fried snacks.

    (d) A tax on sugared drinks.
  answer: |
    (a) Stage: retail, in a school canteen. Decision changed: the canteen operator's, about
    what to stock. Moves: availability. Upstream. NOURISHING files this under area O, standards in
    public institutions.

    (b) Stage: processing, where the pack is made. Decision changed: the manufacturer's, about what
    the pack must show, and so possibly about the recipe too. Moves: promotion, advertising and
    information, at the point of sale. Upstream. The label is on the offer itself, so it changes what every buyer sees, not
    what one person has been told. NOURISHING files it under its first area N, "Nutrition label
    standards and regulations on the use of claims and implied claims on food".

    (c) Stage: consumption. Decision changed: the parent's. Moves: information only, nothing on
    offer. On the person.
    Area I, "Inform people about food and nutrition through public awareness".

    (d) Stage: retail, where the price is paid. Decision changed: the seller's price, and so the
    buyer's cost. Moves: price. Upstream. Area U, "Use economic tools". Who ends up paying it,
    seller or buyer, is rung 2's question.

    None of these answers says any of the four works. They say only where each one acts.
- type: critique
  prompt: |
    A district plan reads: "Our obesity work has three parts: a Poshan Maah rally, the anganwadi
    rule on jaggery, and school nutrition gardens (PM POSHAN promotes school nutrition gardens). All
    three act on consumers." Find the flaw.
  answer: |
    The last sentence is wrong for two of the three.

    The rally acts on the person. It changes what people know, and nothing on offer.

    The jaggery rule changes the recipe of the anganwadi food. That decision is taken before the
    child eats, by whoever makes the food under the scheme. It acts upstream, on quality.

    The school nutrition gardens grow food at the school. What they change depends on whether the produce goes into the meal. If it does, they act on availability
    on the plate, upstream. If they are only a teaching garden, they act on the person.

    The plan has treated three different mechanisms as one. Split them before costing or
    judging them.
- type: teaching
  prompt: |
    A journalist has three minutes and asks: "Isn't obesity about personal choice?" Answer using
    the idea of locating an intervention, in plain words, with one quotable sentence.
  answer: |
    People choose, but they choose from what is already there. Before anyone reaches for a packet,
    somebody decided what to grow and what to put in the recipe. Somebody decided what it would
    cost and what to put on the shelf. In India the state itself decides what goes into school meals and anganwadi food.

    Quotable: "A person chooses the last step of a long chain, and most of the chain was chosen for
    them."

    Calibrate it: this is a claim about where decisions are taken. It is not proof that changing
    them upstream will change weight. That needs evidence, which this section does not review.
retrieval_items:
- q: What three things do you state to locate an intervention?
  a: The stage of the food system it acts at, the actor whose decision it changes, and the
    element of the food environment it moves.
- q: When does a proposal act on the person rather than upstream?
  a: When the only decision it changes is the eater's own, made from an offer left as it was. It
    changes nothing on offer; at most it adds information.
- q: Where does HLPE's 2017 report say food systems allow points for intervention?
  a: Across the supply chain, within food environments, and related to consumer behaviour.
figure_note: "The method is three questions and a sort, and its natural picture is a chain of stages with each proposal pinned to one, a flow diagram the drawing tool does not draw; the two tables carry the sort, and a bar chart of them would be a table drawn as a picture."
