simplified_explanation: |
  Most proposals about food and weight that you will hear speak to the person holding the plate.
  Eat less oil. Cut sugar. Choose millets. But what is on the plate was decided earlier, by people
  who grew, processed, priced, stocked and served it. The person chooses from what is already
  there.

  So for any proposal, ask three questions. Where in the chain does it act? Whose decision does it
  change? And what does it change about the food on offer?

  The second question does most of the work. If the only decision the proposal changes is the
  eater's, it acts on the person. The food on offer stays as it was. If it changes a decision taken
  before the eater chooses, such as a recipe, a price or a ration, it acts upstream.

  Neither kind is good or bad by being where it is.
illustrations:
- body: |
    Start with a real case where the obvious answer is right and still useless.

    Open the Press Information Bureau's backgrounder "Mission Poshan 2.0 Strengthening India's
    Nutrition Ecosystem", 14 April 2026
    (https://www.pib.gov.in/PressReleasePage.aspx?PRID=2251769&reg=3&lang=1). Search for
    Poshan Maah. The 2025 campaign's themes include "reduction in sugar and oil consumption to
    address obesity".

    Ask the first question: which stage? Consumption. That is true, and you could stop there. But
    it hides the thing that matters. Ask the second question: whose decision does it change? Only
    the eater's, or a parent's choosing for a child. Ask the third: what does it change about the
    food on offer? Nothing. The shop, the price and the recipe stay as they were. So the campaign
    acts on the person.

    Now open the scheme guidelines of the same programme, *Mission Saksham Anganwadi and Poshan
    2.0: Scheme Guidelines* (2022)
    (https://wcd.gov.in/documents/uploaded/Mission%20Saksham%20Anganwadi%20and%20Poshan%202.0%20scheme%20guidelines.pdf).
    Search for jaggery. Section 3.4 says:

    > Only jaggery should be used for sweetening; white sugar should not be used.

    Ask the same three questions. The stage is preparation: the recipe of the take-home ration and
    the hot cooked meal. The decision it changes is the one taken by whoever makes that food under
    the scheme. What it changes about the offer is its quality, in the sense of what the food
    contains. The child receives whatever the recipe holds. This rule acts upstream.

    ```table
    | Proposal | Stage | Whose decision | What it moves | Where it acts |
    | Poshan Maah 2025 theme, less sugar and oil | consumption | the eater's | information only, nothing on offer | on the person |
    | Poshan 2.0 guidelines, jaggery not white sugar | preparation | the scheme's cook or ration maker | quality | upstream |
    ```

    Same ministry, same topic, opposite places. Locate the mechanism, not the topic.
  analogy_breaks_when: |
    The method places a proposal; it does not grade it. Jaggery is still a sweetener, and this
    section says nothing about whether swapping it for white sugar changes what a child takes in.
    The guideline line is from the 2022 guidelines as held; the scheme's later revisions are not
    among this book's sources.
- body: |
    Now work five more real proposals, each from a text this book holds. For each, write the three
    answers before you read the row.

    ```table
    | Proposal, in its text's words | Stage | Whose decision | What it moves | Where it acts |
    | Edible oil duty cut, 24 Sep 2026: "moderating domestic edible oil prices" | distribution (the importer's landed cost), then retail (the maximum retail price) | importers' landed cost; then, by advisory, industry's maximum retail price | price | upstream, at two stages |
    | School meals (Pradhan Mantri Poshan Shakti Nirman, PM POSHAN): States to "procure locally grown food items like millets, vegetables" | distribution (the State's purchase), then preparation | the State or school as buyer and cook | availability on the plate | upstream |
    | Millet incentive: products "must contain at least 15% millet by weight or volume" | processing | the processor's recipe and range | availability and quality | upstream |
    | Oilseeds mission: "public awareness of recommended dietary guidelines for edible oils" | consumption | the eater's | information only, nothing on offer | on the person |
    | World Cancer Research Fund's NOURISHING list, area N: "Nutrition advice and counselling in healthcare settings" | consumption | the patient's | information only, nothing on offer | on the person |
    ```

    Three things show up.

    The duty cut acts twice. It lowers the importer's landed cost at the border. Then the release
    asks industry to revise its prices to distributors and its maximum retail price. Locate each
    step.

    The oilseeds campaign sits inside a production mission, yet it acts on the person. Where a
    component is housed is not where it acts.

    The millet incentive acts upstream, on what a factory makes. Its eligibility rule names a
    millet share, and nothing about sugar, fat or salt. Locating it tells you it changes what is on
    the shelf. It does not tell you whether that shelf is healthier.

    Keep the counselling row in mind. It is the one tool you hold in a clinic. On this map it is
    also the last point in the chain.
  analogy_breaks_when: |
    Each row places a proposal by what its own text says it does. A text can describe a measure
    that is not carried out as written. And a price moved upstream reaches the plate only if the
    change is passed along the chain; the duty release asks industry to pass it on, which shows it
    is not automatic.
