definition:
  text: |
    To locate an intervention is to state, for any proposal to change what people eat, three
    things. The stage of the food system at which it acts (`S37-R1-C01`). The actor whose decision
    it changes. And the element of the food environment it moves: availability, price,
    "promotion, advertising and information", or quality, the four elements named by the High Level
    Panel of Experts on Food Security and Nutrition (HLPE) (`S37-R1-C05`).

    A proposal acts upstream when the decision it changes is taken before the person chooses: a
    farmer's crop, a processor's recipe or pack, a retailer's shelf, a price, a ration basket, a
    scheme's menu. A proposal acts on the person when the only decision it changes is the eater's
    own, made from an offer left as it was: advice, counselling, an awareness campaign. It changes
    nothing on offer: the food, its price and where it is sold stay as they were; at most it adds
    information. One proposal can act at more than one stage, and
    each is located separately.
