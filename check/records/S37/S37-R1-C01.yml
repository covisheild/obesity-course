simplified_explanation: |
  A food system is everything that happens to food, and everyone who does it, from the field to
  the bin.

  Start with the plate in front of you and walk backwards. Someone cooked it. Before that, someone
  bought the food from a shop or a cart. Before that, it was moved by truck. Perhaps it was stored
  in a warehouse, or milled and packed in a factory. Before all of that, a farmer grew it. And
  after the meal, what is left over goes somewhere too.

  This book gives those steps eight names: production, storage, processing, distribution, retail,
  preparation, consumption and waste. Each step is done by somebody, such as a farmer, a trader,
  a mill owner, a shopkeeper or the person who cooks. Call each of them an actor — anyone whose
  decision moves the food on. Each step takes things in, such as seed, fuel or grain. Each sends
  things out, such as grain, flour or a cooked meal.

  "Food system" is not everyday English. It is a phrase an expert panel defined. That panel is the
  HLPE, which reports to an international committee on food security, and it adopted its
  definition in 2014. The eight stages are this book's way of reading that definition.

  As with any system (Book 0, E3), you choose where to draw the line round it. A family's kitchen, a district and the whole of India are all food systems.
  Each one answers a different question.
illustrations:
- body: |
    Here is the trap with the phrase "food supply chain". It sounds like the whole story. It is
    not.

    Open HLPE's 2017 report Nutrition and food systems at
    https://www.fao.org/fileadmin/user_upload/hlpe/hlpe_documents/HLPE_Reports/HLPE-Report-12_EN.pdf
    and search inside it for "The food supply chain consists of". You land in section 1.2.1.

    > The food supply chain consists of the activities and actors that take food from production
    > to consumption and to the disposal of its waste

    Read the next sentence, which lists the chain's steps: production; storage and distribution;
    processing and packaging; retail and markets. Count them. There are four, and the last one is
    the shop. Nothing in that list cooks the food, eats it or throws it away. A reader who stops
    here thinks the food system ends at the shop counter.

    Now search for "A food system gathers". This is the definition, in the report's summary.

    > A food system gathers all the elements (environment, people, inputs, processes,
    > infrastructures, institutions, etc.) and activities that relate to the production,
    > processing, distribution, preparation and consumption of food, and the outputs of these
    > activities

    Preparation and consumption are inside the system. The chain's own sentence has already put
    the disposal of waste inside it too. So the supply chain is one part of the food system, and
    the system is bigger.

    Put the two sentences together and you get this book's eight stages. The chain gives
    production, storage, processing, distribution and retail. The definition adds preparation and
    consumption. The chain's first sentence adds waste.
  analogy_breaks_when: |
    The eight stages are this book's reading of two HLPE sentences, not a list HLPE prints. HLPE's
    own summary lists the chain's activities differently again: production, storage,
    distribution, processing, packaging, retailing and marketing. Quote HLPE's words when you
    quote HLPE, and call the eight stages this book's.
- body: |
    Now draw a food system yourself. Take one roti made at home from packaged atta, and write the
    eight stages down the page. At each stage, write who acts, what goes in and what comes out.

    The table below is a sketch of one likely route. Nothing in it has been checked against a
    source. Every line is a question you would need to answer before you could say it is true of
    your atta.

    ```table
    | Stage | What happens | Actor | Goes in | Comes out |
    | Production | wheat is grown and harvested | farmer | seed, water, fertiliser, labour | grain |
    | Storage | grain is held until it is sold or milled | farmer, trader or warehouse | grain | grain, some of it spoiled |
    | Processing | grain is milled and packed | flour mill | grain, power, packets | packets of atta |
    | Distribution | packets are moved to shops | distributor, transporter | packets, fuel | packets at the shop |
    | Retail | a packet is sold | shopkeeper | packets, money | a packet in your kitchen |
    | Preparation | dough is kneaded and cooked | whoever cooks | atta, water, fuel | rotis |
    | Consumption | the rotis are eaten | the household | rotis | a meal eaten |
    | Waste | what is left is thrown out | the household | scraps | scraps in the bin |
    ```

    Now draw a boundary round your kitchen. Only three stages sit inside it: preparation,
    consumption and waste. Atta crosses the line inward, and so does fuel. Scraps cross it
    outward. Everything else happened outside.

    Draw a second boundary round the whole of India. All eight stages are now inside. What
    crosses the line is different: food bought from other countries comes in, and food sold to
    them goes out. The two drawings are both correct. They answer different questions, exactly as
    Book 0, E3 said two boundaries round one situation would.
  analogy_breaks_when: |
    Real routes do not always run in this order or pass every stage. A farming family that eats
    its own wheat skips retail. A street vendor who cooks and sells does preparation and retail
    at once. Some grain is stored after milling as well as before. The eight stages are names for
    kinds of activity, not a fixed sequence every food must follow.
figure_note: The picture this section needs is a flow of eight stages with two boundaries drawn round them, a diagram the drawing tool cannot draw; the table carries it meanwhile.
must_know:
- point: |
    "Food system" is often heard as "farming". It is not. Farming is one stage of eight. By HLPE's
    definition the system also holds storing, processing, moving, selling, cooking, eating and
    throwing away, and the people and institutions at each. When someone says a problem "comes
    from the food system", ask which stage they mean.
  kind: misconception
  bearing: policy
  refs:
  - hlpe_2017
- point: |
    Do not use "supply chain" and "food system" as if they were one thing. HLPE's supply chain
    steps stop at retail and markets. Cooking and eating sit in the food system as consumer
    behaviour. A claim about the supply chain says nothing about the kitchen.
  kind: trap
  bearing: methodological
  refs:
  - hlpe_2017
- point: |
    For any food, write the eight stages down the page. At each, name the actor, what goes in and
    what comes out. A stage you cannot fill is a question to check, not a blank to skip. Teach a
    trainee to do this before they argue about any single stage.
  kind: move
  bearing: teaching
- point: |
    Before you accept a figure about "the food system", ask what line was drawn round it. A
    kitchen, a state or the country? Household waste in or out? Food bought from abroad in or
    out? Two honest figures can differ only because their boundaries differ.
  kind: consequence
  bearing: methodological
- point: |
    "Food system" is a definition an expert panel adopted in 2014, not a fact of nature. HLPE says
    its own picture of the system was adapted from earlier ones. Quote it as HLPE's definition,
    with the year, and expect other bodies to draw the system differently.
  kind: dispute
  bearing: policy
  refs:
  - hlpe_2017
- point: |
    The stage list tells you where things happen and who does them. It does not tell you how much
    food passes each stage, how much is lost there, or which actor has the most power. It weighs
    nothing. For any of those you need a number from a source, stage by stage.
  kind: boundary
  bearing: methodological
exercises:
- type: interpretation
  prompt: |
    Take a packet of milk that you or your family buy. Write the eight stages for it. For each
    stage, name one actor, one thing that goes in and one thing that comes out. Then mark each
    line "checked" or "guessed".
  answer: |
    One possible sketch, every line of it guessed until checked:

    Production: a dairy farmer; feed, water and labour go in; raw milk comes out. Storage: someone
    who chills and holds the milk; raw milk goes in; chilled milk comes out. Processing: a dairy
    plant; chilled milk goes in; treated milk in packets comes out.

    Distribution: a transporter;
    packets go in; packets at a shop or a doorstep come out. Retail: a shop or a delivery person;
    packets and your money go in; a packet in your home comes out. Preparation: whoever boils it
    or makes tea; milk and fuel go in; tea or boiled milk comes out. Consumption: the household
    drinks it.

    Waste: the empty packet and any spilt or spoiled milk go to the bin or the drain.

    The honest result is that almost every line is marked "guessed". That is the point of the
    exercise. You can name the stages from memory. Naming the real actors takes a source, and
    most of us have never checked one for the milk we drink every day.
  skill_ref: S37-R1-K01
- type: critique
  prompt: |
    A speaker at a meeting says: "Obesity is a food system problem, so the answer is to help
    farmers grow healthier food." What has the speaker done with the phrase "food system"?
  answer: |
    The speaker has shrunk the food system to one stage, production. By HLPE's definition the
    system also holds storage, processing, distribution, retail, preparation, consumption and
    waste, and the actors at each.

    So "a food system problem" does not point to farmers any more than to mills, shops or
    kitchens. The fair question back is: at which stage, and whose decision, do you think the
    problem arises? The claim may still be right about farming. It has not been argued yet.
- type: teaching
  prompt: |
    A first-year resident asks why this book says "food system" rather than "diet". You have ten
    minutes and a whiteboard. What do you draw, and what do you say?
  answer: |
    Draw a line of eight boxes: production, storage, processing, distribution, retail,
    preparation, consumption, waste. Put a small figure beside each box for the actor: farmer,
    trader, mill, transporter, shopkeeper, cook, eater, bin.

    Then say it. A diet is what happens in the seventh box. Everything in the first six was
    decided by other people before the patient chose anything. The word "system" is there because
    the boxes feed each other. The mill's output is the shop's input. The shop's shelf is the
    cook's starting point.

    Finish with the boundary. Draw a circle round the last three boxes and call it the kitchen.
    Draw a bigger one round all eight and call it India. Ask the resident which circle a clinic
    advice leaflet works inside. It works inside the small one.
retrieval_items:
- q: Name the eight stages this book uses for a food system.
  a: Production, storage, processing, distribution, retail, preparation, consumption and waste.
- q: Whose definition of a food system does this book use, and when was it adopted?
  a: The High Level Panel of Experts on Food Security and Nutrition (HLPE), which adopted it in
    2014 and used it again in its 2017 report Nutrition and food systems.
- q: Is the food supply chain the same thing as the food system?
  a: No. In HLPE's report the supply chain is one part of the system; its steps run from
    production to retail and markets. Preparation and consumption sit in the system as consumer
    behaviour.
