definition:
  text: |
    A supply-chain sketch of a packaged food is a written map of one product. It lists the main
    ingredients in the order the label gives them. It traces each ingredient to the crop or animal
    it comes from, and to the policy tools that act on that crop (`S37-R1-C16`). It names the firm
    the label names, and the channel through which the product reached the buyer. And it marks
    every link with one of three marks: checked in a named source, seen on the pack or in the
    shop, or unknown.

    Under the Food Safety and Standards (Labelling and Display) Regulations, 2020, the ingredients
    are listed in descending order of their weight or volume at the time of manufacture. The class
    "edible vegetable oil" must be named as the specific oil. The label names the brand owner, who
    may or may not be the maker. It declares a country of origin for a food imported into India. It
    does not say where the ingredients of an Indian-made food were grown, who supplied them, or
    what any of them cost.
