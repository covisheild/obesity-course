simplified_explanation: |
  This is the book's build. You take one packaged food you eat often. You write down where it came
  from, as far as you can find out, and where you cannot.

  Start with the label. Its ingredient list is in order of weight, heaviest first (`S37-R1-C03`).
  So the first few names are the heaviest in the packet. Those are the ones to trace.

  For each one, ask what it is made from. Maida is wheat. Sugar is sugarcane. Palm oil is oil palm. Then ask which of the state's tools act on that
  crop.

  Mark every link. Checked, if you found it in a source you can name. Seen, if it is on the pack or in the shop. Unknown, if neither. Leave the
  unknowns in.
illustration:
  body: |
    Here is the trap, and a first sketch falls into it. The label lists palm oil, so you write
    "palm oil, imported from abroad". It looks like knowledge. It is a guess.

    Open the Food Safety and Standards (Labelling and Display) Regulations, 2020
    (https://www.fssai.gov.in/upload/uploadfiles/files/Comp_Labelling%20Display_Version%20VIII_09_09_2025.pdf).
    Search for "Country of Origin". The clause is headed "Country of Origin for Imported Foods".

    > The country of origin of the food shall be declared on the label of food imported into India.

    If your biscuits were made in India, the label owes you no origin for the oil inside them.

    Now build the sketch properly. Take a packet of plain biscuits from a kirana, a small
    neighbourhood shop. Suppose its list begins as below. This list is made up for the exercise, so
    read your own packet beside it.

    > Refined wheat flour (maida), sugar, palm oil, dextrose, milk solids, iodised salt, raising
    > agents.

    Take the first four ingredients, and milk solids and salt as well. For each, find its crop and
    the tools that act on it. A quintal is 100 kg.

    ```table
    | Ingredient | From | Tools acting on it, as of September 2026 | Mark |
    | Refined wheat flour | wheat | Support price for wheat, Rs 2,585 per quintal, rabi marketing season 2026-27 (PIB backgrounder, 10 October 2025); bought into the central pool by the Food Corporation of India (FCI) | tools on wheat checked; whether they touched this flour's wheat, and how, unknown |
    | Sugar | sugarcane | Fair and remunerative price of sugarcane, Rs 365 per quintal at a "basic recovery rate of 10.25%" (the release does not define recovery), sugar season 2026-27 (October to September), approved by the Cabinet Committee on Economic Affairs | tool checked; the mill unknown |
    | Palm oil | oil palm | Basic customs duty on crude palm oil 5%, from the release of 24 Sep 2026; oil palm mission | crude palm oil duty checked; the refined-oil rate is not in the release; whether either applies to this oil unknown |
    | Dextrose | glucose, from a crop the label does not name (`S37-R1-C03`) | none traced | crop unknown |
    | Milk solids | milk | none on this book's map | unknown |
    | Iodised salt | salt | none on this book's map | unknown |
    | The packet itself | the factory | Labelling regulations, 2020; goods and services tax (GST), rate not held | labelling seen on the pack; GST unknown |
    ```

    Now the firm and the channel. Find the line on the pack beginning "Manufactured by" or "Marketed by". The regulation requires the brand owner's name and address, "whether or not, he himself is the manufacturer". So
    "Marketed by" tells you who owns the brand. Mark the brand owner as seen. If the maker differs, the pack must also carry the maker's FSSAI licence number (regulation 5(7)(b)); mark it seen. This book does not look the number up.

    The channel you know: you bought it at a kirana. Mark that seen. Who brought it to the kirana,
    and from which depot, the pack does not say. Mark it unknown.

    Count your marks. In this sketch the tools on wheat, sugarcane and oil palm are checked. The brand and the shop are seen. Almost everything between the farm and the factory is unknown. That is the right result.
  analogy_breaks_when: |
    The figures in the table are the ones in force or announced on 24 September 2026. The ingredient
    list is invented, so its order holds only for this made-up packet.
