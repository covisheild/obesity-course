must_know:
- point: |
    "The label tells you where the food came from" is wrong for an Indian-made product. Where
    an Indian-made packet's wheat, sugar or oil was grown is not on it.
  kind: misconception
  bearing: public
  refs:
  - fssai_labelling_2020
- point: |
    Mark every link of a sketch as checked, seen or unknown, and name the source for every
    "checked". Leave the unknowns visible.
  kind: move
  bearing: methodological
- point: |
    Do not apply a national figure to one product. The 56.25% import dependence is for all edible
    oils in India in 2023-24.
  kind: trap
  bearing: methodological
  refs:
  - pib_2200287
- point: |
    The name on the pack is the brand owner, who may not be the maker. Do not name that
    company as the factory unless the pack says "Manufactured by".
  kind: trap
  bearing: public
  refs:
  - fssai_labelling_2020
- point: |
    One packet of biscuits holds the decisions of several bodies. When someone proposes changing
    that product, your sketch shows which body owns each lever.
  kind: consequence
  bearing: policy
- point: |
    A sketch with no prices cannot say who earns what along the chain.
  kind: boundary
  bearing: methodological
exercises:
- type: build
  prompt: |
    Write a supply-chain sketch of one packaged food you or your patients eat often. Buy it, or
    take it from a shelf at home. On no more than two pages:

    1. Copy the name of the food and its ingredient list exactly as printed.

    2. Take the first four ingredients. For each, name the crop or animal it comes from. Then name
    every policy tool from this book that acts on that crop, with its current figure and date.

    3. Name the brand owner and, if the pack says so, the maker, with the exact words the pack uses.

    4. Name the shop or platform you bought it from. Say what you know of how it got there.

    5. Mark every link checked (name the source), seen, or unknown.

    6. Write one line on what you would need to know to estimate the farmer's share of its price.
  answer: |
    There is no single right sketch. Judge yours against six things.

    The ingredient list is copied exactly, in its printed order, not tidied or reordered.

    Each of the four ingredients is traced to a crop or animal. A class name such as "milk solids"
    or "sugar" is traced as far as the label allows, and no further.

    Each policy tool carries its figure and the date of the text that states it. A support price
    without its season, or a duty without its release date, has failed this test.

    The brand owner is named from the "Marketed by" or "Manufactured by" line, and is not called
    the maker unless the pack says so.

    Every link is marked, and every "checked" names its source. A sketch with no "unknown" marks is
    almost certainly wrong: the label does not tell you where an Indian-made product's ingredients
    were grown.

    The last line names prices you do not have. What did the maker pay for each ingredient? What
    did the distributor and the shop pay for the packet? Those are what rung 2 estimates.
  skill_ref: S37-R1-K01
- type: critique
  prompt: |
    A trainee's sketch of an Indian-made namkeen reads: "Palm oil: imported, from the label. Wheat:
    grown in Punjab, bought by FCI. Brand: made by the company named after 'Marketed by'." Find
    each error.
  answer: |
    "Palm oil: imported, from the label." The label of an Indian-made food does not declare where
    its oil came from; the country-of-origin clause covers foods imported into India. The claim
    did not come from the label. Mark it unknown.

    "Wheat: grown in Punjab, bought by FCI." Neither fact is on the pack. That the Food Corporation
    of India buys wheat at the support price is a fact about the tool, and can be checked. That
    this packet's wheat went through it is not known. Mark the tool checked and the route unknown.

    "Made by the company named after 'Marketed by'." The regulation requires the brand owner's
    name whether or not that owner is the maker. "Marketed by" names the brand owner. The maker is
    unknown unless the pack says "Manufactured by".
  skill_ref: S37-R1-K01
- type: interpretation
  prompt: |
    A label reads, in part: "Ingredients: Refined wheat flour (maida), sugar, edible vegetable oil,
    milk solids." Which part of this list does the labelling regulation not allow as written, and
    what would a correct label say instead?
  answer: |
    "Edible vegetable oil". The regulation has a table of class titles. For this class it says the
    label must "Give name of the specific edible oil", such as mustard oil or groundnut oil. So the
    label should name the oil, for example "palm oil".

    "Sugar" is allowed: the table lets sucrose be listed as "Sugar". "Milk solids" is allowed: all
    milk products may be listed under that title, with the source optional. Both names are classes,
    so your sketch can trace them only as far as sugarcane and milk.
retrieval_items:
- q: In what order does the labelling regulation require ingredients to be listed?
  a: In descending order of their composition by weight or volume at the time of manufacture.
- q: For which foods must the label declare a country of origin?
  a: Foods imported into India.
- q: What are the three marks on every link of a supply-chain sketch?
  a: Checked, in a named source; seen, on the pack or in the shop; unknown.
figure_note: "The sketch is a chain of links from crop to shelf with a mark on each, a flow diagram the drawing tool does not draw; its figures are prices of different crops on different bases, so a bar chart of them would compare nothing."
