simplified_explanation: |
  Before each season the Union Government announces a minimum support price, or MSP, for 22
  crops. It does this in two rounds, one for the kharif crops and one for the rabi crops. Those
  are the names the releases use for India's two main crop seasons.

  A body of experts, the Commission for Agricultural Costs and Prices (CACP), recommends the
  price. A committee of the Cabinet fixes it.

  Here is the trap. An MSP is a price at which the government will buy. It is not a price every
  farmer gets.

  The grain that is bought goes into the central pool, the government's own stock. So what the
  state buys decides what it can hand out.

  Sugarcane is different. It has a fair and remunerative price (FRP), fixed the same way, which
  sugar mills must pay for the cane they buy.
illustrations:
- body: |
    Start with a sentence that sounds right and is not.

    > The MSP for moong is Rs 8,780 a quintal, so moong farmers get Rs 8,780.

    A quintal is 100 kilograms. Open the Press Information Bureau release of 13 May 2026,
    "Cabinet approves Minimum Support Prices (MSP) for Kharif Crops for Marketing Season 2026-27",
    at https://www.pib.gov.in/PressReleasePage.aspx?PRID=2260617. Find the moong row. The MSP is
    there: Rs 8,780 per quintal for kharif marketing season 2026-27. The table does not say who
    will pay it.

    Now open the Press Information Bureau backgrounder of 10 October 2025, "Minimum Support
    Prices: From Safety Net to Self-Sufficiency", at
    https://www.pib.gov.in/PressNoteDetails.aspx?ModuleId=3&NoteId=155448&reg=48&lang=2. Search
    for "Procurement is triggered". Pulses are bought under the Price Support Scheme "when the
    market price of these crops falls below MSP". The same paragraph names the buyers. They are
    the National Agricultural Cooperative Marketing Federation of India (NAFED) and the National
    Co-operative Consumers' Federation of India (NCCF).

    So a moong farmer gets the MSP only by selling to one of those agencies, at a time when they
    are buying. The market price may sit below the MSP, above it, or near it. The announced price
    is a promise with conditions, not a price paid on every sack.

    Now the clean case. Search the Department of Food and Public Distribution's Year End Review
    2025 (https://www.pib.gov.in/PressReleasePage.aspx?PRID=2210211) for "specified centres".
    Wheat and paddy that meet the specifications and are offered at specified centres "are
    bought by the public procurement agencies" at MSP. That is an open door at a fixed price.
    The review gives the size: 832.17 lakh tonnes of paddy in kharif marketing season 2024-25.
    A lakh is 1,00,000, so that is about 83.2 million tonnes. Wheat was 300.35 lakh tonnes in rabi
    marketing season 2025-26, about 30 million tonnes.

    Last, see where the buying lands. The kharif release of 13 May 2026 gives procurement from
    2014-15 to 2025-26: 8,418 lakh tonnes of paddy, and 8,746 lakh tonnes for all 14 kharif crops
    together. Work out paddy's share.

    ```working
    8,418 divided by 8,746 is about 0.962
    8,746 minus 8,418 = 328
    ```

    Paddy was about 96 per cent of all kharif crops bought in those years, by weight. The other
    13 crops together came to 328 lakh tonnes. MSP is announced for 14 kharif crops. The buying
    is overwhelmingly one.
  analogy_breaks_when: |
    The share is by weight, over twelve marketing seasons together, for the kharif crops only.
    The figures are for paddy, not milled rice, and cotton is in the total. So the share is not a
    share of food. It does not say which states the grain came from or how many farmers sold at MSP. The
    releases held here do not give those.
