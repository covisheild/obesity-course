- body: |
    The 1.5 times rule is a floor, and crops sit at very different heights above it. Check two.

    The kharif release gives common paddy for 2026-27 a cost of Rs 1,627 per quintal and an MSP of
    Rs 2,441. The rabi release of 1 October 2025 gives wheat for 2026-27 a cost of Rs 1,239 and an
    MSP of Rs 2,585. Multiply each cost by 1.5 to find the lowest MSP the rule allows.

    ```working
    1,627 times 1.5 = 2,440.5
    1,239 times 1.5 = 1,858.5
    ```

    Paddy's MSP of Rs 2,441 sits on the floor, rounded to the rupee. Wheat's Rs 2,585 sits well
    above it.

    ```working
    2,585 minus 1,858.5 = 726.5
    ```

    Rs 726.50 a quintal above the floor. So "MSP follows the 1.5 times rule" is true of both, and
    tells you almost nothing about either. Ask for the crop and the season.

    One more check before you use these costs. The release defines cost as paid-out costs plus
    the imputed value of family labour. That is the CACP's all-India average. It is not the cost on
    any one farm.
  analogy_breaks_when: |
    The costs and prices are for the named seasons only: kharif 2026-27 and rabi 2026-27. The
    next CCEA decision replaces them. The rule compares MSP with an all-India average cost, so a
    farm with higher costs can be below 1.5 times its own cost at the same MSP.
  numbers:
  - value: '1627'
    unit: Rs per quintal, cost of production, common paddy, kharif marketing season 2026-27
    citekey: pib_2260617
    quote: "2441 1627 50 2369 1310 72 1131 (86%)"
  - value: '2441'
    unit: Rs per quintal, MSP, common paddy, kharif marketing season 2026-27
    citekey: pib_2260617
    quote: "2441 1627 50 2369 1310 72 1131 (86%)"
  - value: '1239'
    unit: Rs per quintal, cost of production, wheat, rabi marketing season 2026-27
    citekey: pib_rabi_msp
    quote: "Wheat 2585 1239 109 2425 160"
  - value: '2585'
    unit: Rs per quintal, MSP, wheat, rabi marketing season 2026-27
    citekey: pib_rabi_msp
    quote: "Wheat 2585 1239 109 2425 160"
must_know:
- point: |
    An MSP is the price at which government agencies will buy, not the price every grower is paid.
    When someone quotes an MSP as a farmer's income, ask how much of the crop was bought at it.
  kind: misconception
  bearing: public
  refs:
  - s37_economic_cost_grain
  - s37_pib_msp_backgrounder
- point: |
    From 2014-15 to 2025-26, 8,746 lakh tonnes were bought across the 14 kharif crops. Paddy was
    8,418 of them, about 96 per cent by weight (CCEA release, 13 May 2026). MSP is announced for many
    crops. Procurement is concentrated in one.
  kind: number
  bearing: policy
  refs:
  - pib_2260617
- point: |
    Say who fixed a price and for which season. A figure without its season is out of date the day
    the next decision comes.
  kind: trap
  bearing: policy
  refs:
  - s37_pib_msp_backgrounder
  - pib_2260617
- point: |
    What the state buys at MSP is what it can put in a ration. A proposal to change the ration
    basket is also a proposal about procurement.
  kind: consequence
  bearing: policy
  refs:
  - nfsa_2013
- point: |
    Sugarcane has no MSP. Its price is the fair and remunerative price, and sugar mills pay it. Do not put sugarcane in a
    list of crops the government buys.
  kind: india_deviation
  bearing: policy
  refs:
  - pib_sugarcane_frp
- point: |
    "At least 1.5 times cost" is a floor. Paddy sits on it and wheat sits well above it.
  kind: move
  bearing: policy
  refs:
  - pib_2260617
  - pib_rabi_msp
- point: |
    The cost in the MSP releases is the CACP's all-India weighted average, including imputed family
    labour. Do not call the margin over it a farmer's profit. It says nothing about one farm, one
    state, or what the crop fetched.
  kind: trap
  bearing: public
  refs:
  - pib_2260617
- point: |
    The releases give national totals only. They cannot tell you which states the grain came from,
    how many growers sold at MSP, or what the rest were paid. Do not infer them from the MSP.
  kind: boundary
  bearing: methodological
exercises:
- type: retrieval
  prompt: |
    Name the body that recommends MSPs, the body that fixes them, and the statute that defines
    MSP and the central pool. Give the section numbers.
  answer: |
    The Commission for Agricultural Costs and Prices (CACP) recommends. The Cabinet Committee on
    Economic Affairs (CCEA) approves. The National Food Security Act, 2013 defines MSP in section
    2(10) and the central pool in section 2(2).
  skill_ref: S37-R1-K02
  confidence_first: true
- type: interpretation
  prompt: |
    Here is part of the rabi table from the Press Information Bureau release of 1 October 2025,
    Rs per quintal, rabi marketing season 2026-27.

    ```table
    crop  MSP  cost of production  margin over cost (%)
    Wheat  2585  1239  109
    Gram  5875  3699  59
    Safflower  6540  4360  50
    ```

    Say what the table shows and what it does not.
  answer: |
    It shows the price at which government agencies stand ready to buy each crop this season. It
    shows the CACP's all-India average cost of growing it. It shows how far above that cost the
    price was set. All three meet the 1.5 times floor. Safflower sits right on it and wheat sits
    far above it.

    It does not show how much of each crop will be bought at that price. Wheat is bought at
    specified centres. Gram, a pulse, is bought only when its market price falls below MSP. It
    does not show what farmers actually received, or the cost on any one farm.
- type: teaching
  prompt: |
    A journalist has three minutes and asks: "The government raised MSP for 14 crops. Does that
    mean farmers of all 14 get more?" Answer in plain words, with one quotable sentence.
  answer: |
    Quotable: "An MSP is the price at which the government promises to buy. For most crops it
    buys little, so the promise reaches few farmers."

    Then the detail. For wheat and paddy, agencies buy at MSP at buying centres, and they buy a
    great deal. Paddy was about 96 per cent of everything bought across the kharif crops from
    2014-15 to 2025-26. For pulses and oilseeds, the government steps in only when the market
    price falls below MSP.

    Calibrate. Whether a higher MSP lifts what traders pay for crops the government hardly buys
    is a separate question. The releases do not answer it, so do not claim it either way.
  skill_ref: S37-R1-K02
- type: critique
  prompt: |
    A policy note says: "Since sugarcane is covered by MSP, the government buys sugarcane from
    farmers at a guaranteed price." Find the errors.
  answer: |
    Sugarcane has no MSP. It has a fair and remunerative price, Rs 365 a quintal for sugar season
    2026-27 at a basic recovery rate of 10.25 per cent.

    The government does not buy the cane. Sugar mills do, and the FRP is what they must pay.

    So the note has the wrong instrument and the wrong buyer. The fix names both: "The Union
    Government fixes a fair and remunerative price for sugarcane, on CACP's recommendation, which
    sugar mills pay."
retrieval_items:
- q: How does the National Food Security Act define the minimum support price?
  a: The assured price announced by the Central Government at which foodgrains are procured from
    farmers by the Central and State Governments and their agencies, for the central pool (s.
    2(10)).
- q: What is the stated rule for setting MSP, and since when?
  a: At least 1.5 times the all-India weighted average cost of production, since 2018-19, following
    the Union Budget 2018-19.
- q: When are pulses and oilseeds procured at MSP?
  a: Under the Price Support Scheme of PM-AASHA, when their market price falls below MSP.
- q: What share of kharif procurement from 2014-15 to 2025-26 was paddy?
  a: About 96 per cent by weight, 8,418 of 8,746 lakh tonnes.
