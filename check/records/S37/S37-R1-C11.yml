simplified_explanation: |
  Since 2013, a set quantity of grain each month has been a legal right for most Indians. The
  law is the National Food Security Act (NFSA).

  There are two kinds of eligible household. The poorest are Antyodaya households. They get 35 kg
  of grain a month for the whole household. The rest are priority households. They get 5 kg a
  month for each person in the household. The grain is rice, wheat or coarse grains such as
  millets, and nothing else.

  The Union government decides how many people each State may cover. Up to three rural people in
  four, and up to one urban person in two. The State then decides which households those are, and
  gives them ration cards.

  The grain comes from a fair price shop, a licensed ration shop. The Union government buys,
  stores and moves the grain to its depots. The State takes it from there to the shop.

  The Act set a price of at most Rs 3 a kg for rice. Since January 2023 the grain has been free.
  That came from a Union government decision, not from a change in the Act.
illustrations:
- body: |
    Start with the figure everyone quotes, 5 kg a person, because it is half the rule.

    Search for the National Food Security Act, 2013 on the India Code website and open it. Read
    section 3(1). A person in a priority household gets "five kilograms of foodgrains per person
    per month". Keep reading into the proviso. An Antyodaya household gets "thirty-five kilograms
    of foodgrains per household per month". One is per person, the other per household. Book 0, A5,
    warned that Indian entitlements change their denominator without warning. Here is one.

    Work out both for households of different sizes, in kilograms a month.

    ```table
    | people in the household | priority household | Antyodaya household |
    | 1 | 5 | 35 |
    | 2 | 10 | 35 |
    | 4 | 20 | 35 |
    | 6 | 30 | 35 |
    | 7 | 35 | 35 |
    | 8 | 40 | 35 |
    | 10 | 50 | 35 |
    ```

    The two are equal where 5 kg times the number of people reaches 35 kg.

    ```working
    35 divided by 5 = 7
    ```

    At seven people the two rules give the same grain. Above seven, a priority household gets
    more than an Antyodaya one, though Antyodaya households are the poorest. Per person, a
    ten-person Antyodaya household gets:

    ```working
    35 divided by 10 = 3.5
    ```

    That is 3.5 kg each, against 5 kg each in a priority household of any size. Never quote "5 kg
    a person" for the Act as a whole. Say which kind of household you mean.
  analogy_breaks_when: |
    The table shows what the Act entitles, not what arrives. A State may issue rice, wheat or
    coarse grains in any mix. A shop may run short, and section 8 then entitles the household to a
    food security allowance instead. And a household's size on its ration card may differ from the
    number of people who eat there.
  numbers:
  - value: '5'
    unit: kg of foodgrains per person per month, priority household (NFSA 2013, section 3(1))
    citekey: nfsa_2013
    quote: "shall be entitled to receive five kilograms of foodgrains per person per month"
  - value: '35'
    unit: kg of foodgrains per household per month, Antyodaya household (NFSA 2013, section 3(1), proviso)
    citekey: nfsa_2013
    quote: "be entitled to thirty-five kilograms of foodgrains per household per month"
- body: |
    Now the price. Here the trap is the word "free".

    In the same Act, open Schedule I. It sets the price "not exceeding rupees 3 per kg for rice,
    rupees 2 per kg for wheat and rupee 1 per kg for coarse grains". That held for three years from
    the Act's start. After that, the Schedule lets the Central Government fix any price up to the
    minimum support price. Nothing in the Act says zero.

    Next, search the Press Information Bureau website for release 1980689 of 29 November 2023,
    "Free Foodgrains for 81.35 crore beneficiaries for five years: Cabinet Decision". The Cabinet
    decided to give free grain to about 81.35 crore people, that is 813.5 million, for five years
    from 1 January 2024. The Food Ministry's year-end review of 2025 adds that free grain began a
    year earlier, on 1 January 2023, under the Pradhan Mantri Garib Kalyan Anna Yojana.

    Now put the two instruments side by side, as Book 0, F5, taught.

    ```table
    | what | rests on | who can change it |
    | 5 kg a person, 35 kg an Antyodaya household | the Act, section 3 | Parliament |
    | a price of at most Rs 3, 2 and 1 a kg, then at most the MSP | the Act, Schedule I | the Central Government, within the Schedule |
    | a price of zero, for five years from 1 January 2024 | a Cabinet decision | the Cabinet |
    ```

    Five years from 1 January 2024 runs to the end of 2028. The quantity is a right in law. The zero
    price is a decision with an end date. Before that date, look for the decision that replaces it.
  analogy_breaks_when: |
    The table says who can change each line, not who will. A zero price that has run for years is
    hard to withdraw, whatever its legal footing. What the table does fix is where to look when it
    changes: a Cabinet decision, not an amendment in the Gazette.
  numbers:
  - value: '81.35'
    unit: crore persons to receive free grain under the Pradhan Mantri Garib Kalyan Anna Yojana (Cabinet decision, 29 November 2023)
    citekey: pib_1980689
    quote: "the Central government will provide free food grains to about 81.35 crore beneficiaries"
    as_of: '2023-11-29'
  - value: '2024'
    unit: year from which the five-year free-grain period runs (from 1 January 2024)
    citekey: pib_1980689
    quote: "for a period of five years with effect from 1st January, 2024."
    as_of: '2023-11-29'
  - value: '2023'
    unit: year free grain began (from 1 January 2023)
    citekey: s37_economic_cost_grain
    quote: "for a period of one year beginning from 1st January 2023"
  - value: '3'
    unit: Rs per kg, the Schedule I ceiling for rice for three years from the Act's commencement
    citekey: nfsa_2013
    quote: "not exceeding rupees 3 per kg for rice, rupees 2 per kg for wheat and rupee 1 per kg for coarse grains"
must_know:
- point: |
    "Five kilograms a person" is the priority-household rule only. An Antyodaya household gets 35
    kg in all, so above seven people it gets less per head. Say which household you mean whenever
    you quote the entitlement.
  kind: misconception
  bearing: policy
  refs:
  - nfsa_2013
- point: |
    About 81.35 crore people, that is 813.5 million, are to get free grain for five years from 1
    January 2024. That was the Cabinet decision of 29 November 2023.
  kind: number
  bearing: public
  refs:
  - pib_1980689
- point: |
    The quantity is a legal right. The zero price is not. The Act caps the price; the Cabinet made
    it zero, to the end of 2028. Asked whether free rations are a right, say both halves.
  kind: india_deviation
  bearing: policy
  refs:
  - nfsa_2013
  - pib_1980689
- point: |
    The Act's grain is cereal only: rice, wheat or coarse grains. Pulses, oil and vegetables are
    not in section 3 at all. Anything more that a ration shop hands out comes from some other
    scheme. Find that scheme before you describe it as part of the Act.
  kind: trap
  bearing: policy
  refs:
  - nfsa_2013
- point: |
    The Food Ministry itself calls the public distribution system "supplemental". It does not aim
    to meet a household's whole need. Never work out a household's diet from its ration alone.
  kind: boundary
  bearing: methodological
  refs:
  - dfpd_pds
- point: |
    Seventy-five per cent rural and fifty per cent urban are national ceilings, "up to". They are
    not the share covered in any one State. The Centre fixes each State's share under section 9,
    and the State picks the households. A complaint about who was left out goes to the State.
  kind: trap
  bearing: policy
  refs:
  - nfsa_2013
- point: |
    If the grain does not come, section 8 entitles the household to a food security allowance
    from the State. When a patient says the ration shop gave nothing, that is the provision to
    point to.
  kind: consequence
  bearing: clinical
  refs:
  - nfsa_2013
exercises:
- type: retrieval
  prompt: |
    Without looking back, write down five things.

    1. The Act and the section that make grain a right.
    2. The two kinds of eligible household, and what each gets.
    3. What counts as grain.
    4. Who picks the households.
    5. What makes the grain free today.
  answer: |
    The National Food Security Act, 2013, section 3(1).

    A priority household gets 5 kg of grain a month for each person. An Antyodaya household gets
    35 kg a month for the household.

    Grain means rice, wheat or coarse grains, or a mix of them (section 2(5)).

    The Central Government fixes how many people each State covers (section 9). The State picks
    the households (section 10).

    The price of zero rests on the Union government's decision under the Pradhan Mantri Garib
    Kalyan Anna Yojana. Free grain began on 1 January 2023. The Cabinet extended it on 29 November
    2023 for five years from 1 January 2024. The Act itself only caps the price.
  skill_ref: S37-R1-K02
  confidence_first: true
- type: interpretation
  prompt: |
    A State announces: "From next month, every ration card will also get 1 kg of pulses free." A
    colleague writes that the National Food Security Act has been widened to cover pulses. List
    what you would check before agreeing, and say what you expect to find.
  answer: |
    First, the Act's words. Section 3 entitles households to foodgrains. Section 2(5) defines
    foodgrains as rice, wheat or coarse grains. Pulses are not among them. A State cannot widen a
    Central Act by announcing it.

    Second, the instrument behind the pulses. Look for the State's own scheme or order, and the
    budget line that pays for it. That is almost certainly where it sits.

    Third, whether Parliament has amended the Act. That is the only way to widen it, and it would
    leave a trace in the Gazette and on India Code.

    What you expect: a State scheme using the ration shop as its counter. That is worth knowing,
    because a scheme can stop when its budget line stops. The Act's grain cannot, without
    Parliament.
  skill_ref: S37-R1-K02
- type: teaching
  prompt: |
    A journalist has three minutes. The question: "Is free ration grain now a legal right in
    India?" Answer without jargon. Give one quotable sentence, and say how sure you are.
  answer: |
    The quotable sentence:

    > The grain is a legal right. The fact that it is free is a Cabinet decision, which runs to the
    > end of 2028.

    Then the detail, if they want it. The 2013 food security law gives 5 kg a person a month to
    most households, or 35 kg to the poorest households. It lets the government charge up to Rs 3 a
    kg for rice. Since January 2023 the government has charged nothing, and in November 2023 it
    extended that for five years.

    How sure: certain on what the law says and on what the decision says, because both are
    published. Not sure at all on what happens after 2028. That needs a new decision nobody has yet
    made.
retrieval_items:
- q: What does section 3(1) of the National Food Security Act give a priority household and an Antyodaya household?
  a: Five kilograms of foodgrains per person per month for a priority household; thirty-five kilograms
    per household per month for an Antyodaya household.
- q: What does the Act count as foodgrains?
  a: Rice, wheat or coarse grains, or any mix of them (section 2(5)). Nothing else.
- q: What makes ration grain free, and until when?
  a: A Union Cabinet decision under the Pradhan Mantri Garib Kalyan Anna Yojana, free since 1 January 2023
    and extended for five years from 1 January 2024, to the end of 2028. The Act only caps the price.
