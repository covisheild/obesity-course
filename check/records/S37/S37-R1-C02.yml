- body: |
    Here is the trap with loss figures: read the unit before the number.

    Open the Press Information Bureau release of 1 August 2025 on the NABCONS study at
    https://www.pib.gov.in/PressReleasePage.aspx?PRID=2151371&reg=3&lang=2 and scroll to
    Annexure-II, Table-1. Its column is headed "Quantity lost (Million MT)", that is, million
    tonnes. Read down it. Cereals, 12.49. Vegetables, 11.97. Then the last row: Eggs, 7363.00.

    Stop there. Scroll up to Annexure-I in the same release. The country's whole production of
    fruits, vegetables, plantation crops and spices in 2022-23 was 337033 thousand tonnes, about
    337 million tonnes. A loss of 7,363 million tonnes of eggs would be more than twenty times
    that. The row cannot be in tonnes. The release does not say what unit it is in, so do not use
    it at all.

    Now go to Table-2. It gives two numbers for each crop, headed "Total loss in farm operations"
    and "Total loss in market level", both as per cent. Copy five rows.

    ```table
    | Crop | Farm operations (per cent) | Market level (per cent) |
    | Paddy | 4.16 | 0.61 |
    | Wheat | 3.61 | 0.56 |
    | Tomato | 8.37 | 3.25 |
    | Onion | 5.31 | 1.96 |
    | Potato | 5.1 | 0.86 |
    ```

    Two things stand out. In every row the farm figure is bigger than the market figure. And the
    soft vegetables, tomato and onion, lose more at both stages than the grains. Notice what the
    table does not give you: a total for each crop. It also never says per cent of what. So when
    you quote tomato, quote both numbers.

    Every row here is food loss, because it all happens before the shop. Food waste is counted
    elsewhere. Open UNEP's Food Waste Index Report 2024 at
    https://wedocs.unep.org/handle/20.500.11822/45230 and find India in Annex 3. The row reads 55
    kg per person per year of household food waste, 78,192,338 tonnes a year, "Medium
    confidence". Now find Table 13. India has "7 medium confidence datapoints" for households and
    "No identified data" for food service or retail. Those seven are city studies, from 20 to 88
    kg per person a year. UNEP scaled them up to the whole country's population.
  analogy_breaks_when: |
    The loss percentages are the ministry's summary of one study, for 2020-22, of 54 crops and
    commodities. The release does not say whether the farm and market percentages share a base,
    so adding them gives only a rough total. The waste figure is modelled from seven cities.
    UNEP's own definition of "medium confidence" says such an estimate "may be applicable only to
    a subnational population, such as a particular city". It also counts inedible parts such as
    peels and bones, which most people would not call wasted food.
