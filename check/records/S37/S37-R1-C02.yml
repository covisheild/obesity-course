must_know:
- point: |
    Loss and waste are not two words for one thing. In UNEP's definitions, food loss happens up
    to the shop and food waste at the shop, in food service and at home. They are measured by
    different agencies with different methods. When someone gives you one number for "food lost
    and wasted in India", ask which of the two it is.
  kind: misconception
  bearing: policy
  refs:
  - unep_fwi_2024
- point: |
    Tomato loses 8.37 per cent in farm operations and 3.25 per cent at market level. That is the
    NABCONS study for 2020-22, as the ministry reported it in 2025. The release gives no total.
    Quote both figures, with the study and its years, and never add them as if that were the
    study's own total.
  kind: number
  bearing: methodological
  refs:
  - pib_2151371
- point: |
    India's household food waste of 55 kg per person a year is UNEP's "medium confidence"
    estimate. It is built from seven city studies scaled to the national population. When a
    journalist quotes it as a national measurement, correct them. Say it is modelled, and that it
    counts peels and bones.
  kind: number
  bearing: public
  refs:
  - unep_fwi_2024
- point: |
    Read a table's unit before any number in it. The eggs row of the ministry's loss table sits
    under "million tonnes" and cannot be tonnes. If a figure is absurd under its column heading,
    drop it and say why. Do not guess the unit the table left out.
  kind: trap
  bearing: methodological
  refs:
  - pib_2151371
- point: |
    Much fresh produce in India passes through state-regulated mandis. A trader may pay mandi fee
    and commission at a primary mandi and again at a city mandi. When you describe a chain, count
    the hands and the charges at each. They are where the price the farmer got turns into the
    price you paid.
  kind: india_deviation
  bearing: policy
  refs:
  - rbi_wp_2024_08_tops
- point: |
    To say where a fresh food came from, list the actors in order and the place each hands it on.
    Mark each one as checked in a source or guessed. A sketch with the guesses marked is honest; a
    smooth story of farmer, mandi, shop is not.
  kind: move
  bearing: teaching
- point: |
    A traced chain holds for the crop, route, city and years it was traced. The onion route here
    is Nashik to Delhi, from field visits in January 2023. Before you apply it to another
    vegetable, another state or another season, find a source for that one.
  kind: boundary
  bearing: methodological
  refs:
  - rbi_wp_2024_08_tops
exercises:
- type: interpretation
  prompt: |
    Here are two rows of the ministry's summary of the NABCONS loss study, reference years
    2020-22. Paddy loses 4.16 per cent in farm operations and 0.61 per cent at market level.
    Tomato loses 8.37 and 3.25. Say two things the rows show and two things they do not.
  answer: |
    They show that tomato lost more than paddy at both stages. It lost about twice as much on the
    farm and about five times as much at market. They also show that for both crops more was lost in
    farm operations than at market level.

    They do not show a total loss for either crop. The release gives none, and it does not say
    whether the two percentages share a base. They do not show why tomato loses more. A reader
    may guess at softness and spoiling, but the table does not say so. And they say nothing about
    household waste, which this table does not measure at all.
  skill_ref: S37-R1-K01
- type: teaching
  prompt: |
    A journalist rings you. Their draft line reads: "Indian households throw away 78 million
    tonnes of food every year." You have three minutes. What do you tell them?
  answer: |
    The figure is real. It is UNEP's Food Waste Index Report 2024: 78,192,338 tonnes a year, or 55
    kg per person, for household food waste in India.

    But it is an estimate, not a count. UNEP built it from seven city studies and scaled them to
    the whole population, and UNEP itself rates it "medium confidence". It also includes inedible
    parts such as peels and bones.

    Offer them a line they can quote. "A UN estimate from a few city studies puts it at 55 kg
    per person a year, peelings included." That keeps the number and tells the reader how
    firm it is.
- type: design
  prompt: |
    Pick one fresh food you or your household bought this week. Write down every hand it passed
    through from the farm to your kitchen. Mark each one "checked" or "guessed". For each guessed
    step, name the kind of source that could check it.
  answer: |
    A sketch for tomatoes bought from a cart might read:

    Farmer, guessed; the district could be checked from state production data. A mandi, guessed;
    the vendor may name the mandi if asked. A commission agent and a trader, guessed; a study of
    the route, such as the Reserve Bank's paper, describes them for some cities. The cart vendor,
    checked, because you saw them. Your kitchen, checked.

    Most lines will be guessed. The skill is not to know the chain. It is to say which parts you
    know, which you assume, and where you would look.
  skill_ref: S37-R1-K01
retrieval_items:
- q: In UNEP's definitions, where does food loss end and food waste begin?
  a: Food loss runs up to, and excluding, the retail level. Food waste is at retail, food service
    and household level, and includes inedible parts.
- q: What is UNEP's estimate of India's household food waste, and how firm is it?
  a: 55 kg per person per year (78,192,338 tonnes a year), rated "medium confidence", built from
    seven city studies scaled to the national population.
- q: Name the hands an onion passes through from Nashik to a Delhi household in the Reserve Bank
    paper.
  a: Farmer; trader and commission agent at the primary APMC mandi; transport; trader or
    wholesaler at a secondary mandi such as Azadpur; retailer in a neighbourhood market; the
    household.
