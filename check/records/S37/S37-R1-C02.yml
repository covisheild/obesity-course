simplified_explanation: |
  An onion bought in Delhi has usually passed through several pairs of hands.

  The farmer grows it and takes it to a mandi — a regulated wholesale market run under state
  law. There it is auctioned. A trader buys it, helped by a commission agent — a middleman paid a
  percentage for arranging the sale. At this sale a Reserve Bank paper records a mandi fee of 1
  per cent and a commission of 4 per cent. It does not say what they are percentages of. Then the onions travel by truck to a big city mandi, and change hands again. A shopkeeper
  or vendor buys them there and sells them in your neighbourhood. Potatoes often sit for months in
  a cold store on the way.

  Some food never reaches you. Food loss is what goes before the shop: spoiled in the field,
  dropped in sorting, rotted in a store. Food waste is what goes at the shop, in a restaurant or at
  home, and it counts peels and bones too.

  India has numbers for both, and neither is exact. A United Nations agency estimates that in
  2022 each Indian household member threw away about 55 kg of food.
illustrations:
- body: |
    Follow one onion to Delhi. Open the Reserve Bank of India's working paper on tomato, onion and
    potato at https://www.rbi.org.in/Scripts/PublicationsView.aspx?id=22723 and search inside it
    for "In the case of onion".

    > In the case of onion, farmers mostly sell their produce in the APMC where prices are
    > determined in an open auction system. [...] Once the auction is successful, it is bought by
    > a trader with the help of commission agents, who pay the mandi fees (1 per cent), commission
    > charges (4 per cent) and loading/unloading charges (₹ 9.02 per quintal).

    A quintal is 100 kg. Now read on to the end of the paragraph, and write down each hand the
    onion passes through. Your list should look like this.

    ```table
    | Step | Who acts | What the paper says happens there |
    | Farm | farmer | grows the onion; pays labour and transport to the mandi |
    | Primary mandi | trader, commission agent, mandi | open auction; mandi fee 1 per cent, commission 4 per cent, loading Rs 9.02 per quintal |
    | On the way | trader | packaging; weight lost, around 10 or 5 per cent depending on the season the onion was grown in |
    | Transport | primary trader or city wholesaler | about Rs 240 per quintal to a secondary mandi such as Azadpur in Delhi |
    | Secondary mandi | wholesaler | mandi fees and commission also paid, by the seller |
    | Retail | retailer | sells in neighbourhood markets in the city |
    | Kitchen | your household | buys, peels, cooks and eats; the peel goes to the bin |
    ```

    In the stages of `S37-R1-C01`, this onion passes production, distribution, retail,
    preparation, consumption and waste. The paper describes no processing or storage on this route.

    Look at the third row. The onion loses weight on the way before anyone has sold it to you.
    Some of that may be food loss. The paper counts it only as a cost the trader carries.

    Now search the same paper for "Cold storages are the most important selling point". Potato
    takes a different route. Farmers in western Uttar Pradesh store it between March and November,
    at an average cost of Rs 250 to 260 per quintal. An open auction is held at the cold store, with
    the storage owner as go-between for farmer and trader. Some farmers skip the mandi altogether: those with contracts sell
    straight to processing companies. One crop can reach you by more than one route.
  analogy_breaks_when: |
    This is one crop, on one route, to one city. The onion costs come from field visits in the
    Nashik region in January 2023, and the paper chose Delhi as the consuming city. Mandi fees
    and commission rates are set state by state, so another state's mandi charges other rates.
    The paper also names farmers selling tomato to organised retailers and potato under contract
    to processors, routes with fewer hands. Do not read the onion route as the route of every
    fresh food in India.
