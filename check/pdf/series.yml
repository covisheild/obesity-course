# Series-wide settings for every book's PDF. One file, so a change of email, website or wording
# reaches all 196 books on their next build. Per-book text (title, why, version, date, blurb) lives
# in books/<ID>/book.yml. Read by check/pdf/make_pdf.py.

series_title: Obesity Expertise
series_subtitle: A first-principles curriculum in 196 books
author: Dr. Harsh Maheshwari
author_role: MD Community Medicine Resident, AIIMS Raipur
email: contact@drharshmaheshwari.com
website: drharshmaheshwari.com
# Harsh, 28 Sep 2026: the ORCID iD goes in every future book and every new version of an earlier one.
orcid: 0000-0001-8848-1918
# The About-the-author page. Harsh, 28 Sep 2026: no publication count (it changes); the ICMR
# selection of the MD thesis may be stated; two life goals. Photo: check/pdf/author.jpg (page)
# and check/pdf/author-circle.png (back cover).
author_bio: |
  Harsh Maheshwari completed his MBBS at King George's Medical University (KGMU), Lucknow, and is
  a resident in MD Community Medicine at the All India Institute of Medical Sciences (AIIMS), Raipur.
  His MD thesis, on chrononutrition and obesity, was selected by the Indian Council of Medical
  Research (ICMR) for funding in 2026.

  He learns best from first principles: rebuilding an idea from what came before it until the
  formula feels like the only reasonable answer. This series grew out of that habit.

  His long-term aims are to reduce obesity in India and to help make India healthy.
copyright_year: 2026
page_size: A4

# Shown on the copyright page of every book. The licence is not optional: the books quote and
# adapt OpenStax textbooks, which are CC BY-NC-SA 4.0, and ShareAlike requires the same licence.
licence: |
  This book is shared free, for anyone to read, under the Creative Commons
  Attribution-NonCommercial-ShareAlike 4.0 International licence (CC BY-NC-SA 4.0). You may copy,
  share and adapt it for non-commercial purposes, if you credit the author and share what you make
  under the same licence.
third_party: |
  It quotes and adapts material from OpenStax textbooks (Rice University), which are licensed
  CC BY-NC-SA 4.0; that is why this book carries the same licence. It also quotes short passages
  from laws, reports and other works, each credited where it is used; those passages remain under
  their owners' terms. Fonts: Source Serif 4, Inter and JetBrains Mono, SIL Open Font License 1.1.
disclaimer: |
  This book is for learning. It is not medical, legal or financial advice, and it does not replace
  a qualified professional who knows your situation.
how_made: |
  Written for the author's own study, then shared. Drafted and checked with AI assistance (Claude,
  by Anthropic) under the author's direction. Every factual claim was checked against a source the
  checker had open, every quotation against its source text, and every worked answer recomputed.
  Mistakes can remain; the feedback page says how to report one.

# Printed under "If you are new to this" in every book, after the book's own `prerequisites`
# (book.yml). Lesson from the statistics book (28 Sep 2026): say what is assumed, what can be
# skimmed on a first reading, and where the symbols are explained.
new_reader: |
  On a first reading, read each section's definition, plain-terms explanation, illustration and
  must-know points, and do the exercises. Worked derivations can be skimmed and revisited once
  the idea feels familiar. Keep a calculator beside you: every worked answer can be followed with
  pen, paper and a calculator. Anything beyond the stated prerequisites is explained where it first
  appears, or marked as beyond this book. The **Symbols used in this book** page lists every sign
  and Greek letter with how to read it and where it is first used.

# The parts of "How to read this book" that are the same in every book. A book's own
# how_to_read (in book.yml) is printed first.
how_to_read: |
  Every section has the same shape. **Definition** states the idea exactly. **In plain terms** says
  it again in everyday words. **Illustration** works through one real case, usually with a source
  you can open yourself. **Where this picture breaks** says where the illustration stops being
  true. **Must-know points** are what should change what you do. Then come **exercises** and, in
  most sections, a graded **practice set**.

  Do the exercises before you look anything up. The worked answers are in the appendix at the
  back, under the same numbers. The references for each Part follow that Part. The glossary
  lists every term of art in the plain words it was first given. The last pages list all 196
  books in the series and show where this one sits.
feedback: |
  If something is wrong, unclear, or could be better, please write to **{email}**. Put the book
  number, the version and the section in the subject line (for example: *Book {number}, v{version},
  section C5*). Say what the text says, what you think it should say, and, if you can, the source.

  Corrections are made in new versions. The version number and the date of the last update are on
  the copyright page of every book, and the newest version of every book is at **{website}**.

